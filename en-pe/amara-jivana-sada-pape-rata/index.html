ranslation\":[\"My life is always engrossed in sin. There is not a trace of piety within it. I have caused others so much anxiety and trouble.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"nija sukha lāgi’    pāpe nāhi ḍari\",\"    dayā-hīna svārtha-para\",\"para-sukhe duḥkhī    sadā mithya-bhāṣī\",\"    para-duḥkha sukha-kara\"],\"translation\":[\"I am never afraid to engage in sinful activities for the sake of my own happiness. I am merciless and selfish. I am a perpetual liar. I am saddened by the happiness of others and pleased by the sadness of others.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"aśeṣa kāmanā    hṛdi mājhe mora\",\"    krodhī, dambha-parāyaṇa\",\"mada-matta sadā    viṣaye mohita\",\"    hiṁsā-garva vibhūṣana\"],\"translation\":[\"There are unlimited sinful desires within the core of my heart. I am angry and arrogant, always maddened with vanity, infatuated with mundanity, and ornamented with malice and pride.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"nidrālasya hata    sukārye virata\",\"    akārye udyogī āmi\",\"pratiṣṭhā lāgiyā    śāṭhya-ācharaṇa\",\"    lobha-hata sadā kāmī\"],\"translation\":[\"I am subdued by laziness and sleep, averse to performing good deeds, and eager to perform sinful deeds. I engage in deceitful behaviour in pursuit of prestige. I am ruined by greed and constantly covetous.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"e hena durjana    sajjana-varjita\",\"    aparādhi nirantara\",\"śubha-kārya-śūnya    sadānartha-manāḥ\",\"    nānā duḥkhe jara jara\"],\"translation\":[\"Such a sinner as I is shunned by devotees, and is a constant offender. I am devoid of virtuous motives, always intent upon evil, and racked by various miseries.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"vārdhakye ekhana    upāya-vihīna\",\"    tā’te dīna akiñchana\",\"bhakati-vinoda    prabhura charaṇe\",\"    kare duḥkha nivedana\"],\"translation\":[\"Now aged, I am devoid of any means of deliverance and thus destitute and distressed. Bhakti Vinod submits this remorseful confession at the Lord’s feet.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Bhudev Prabhu\",\"ru\":\"Бхудев Прабху\",\"ua\":\"Бгудев Прабгу\"},\"embed_url\":\"https://soundcloud.com/jayasri-sound/05-amara-jivana\"},{\"title\":{\"en\":\"Srila B.N. Acharya Maharaj\",\"ru\":\"Шрила Б.Н. Ачарья Махарадж\",\"ua\":\"Шріла Б.Н. Ачарʼя Махарадж\"},\"embed_url\":\"https://soundcloud.com/kostya-netrebenko/017-amarajivana-1\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"19:[\"$\",\"$L22\",null,{\"audio\":\"$18:props:song:resources:audio\",\"caption\":\"Listen audio:\",\"language\":\"en\"}]\n1a:[\"$\",\"$L23\",null,{\"navMap\":{\"105\":{\"prev\":{\"path\":\"/en-pe/jaya-jaya-radha-krishna-jugala-milan/\",\"title\":\"Śrī Vraja-dhāma-mahimāmṛta\"},\"next\":{\"path\":\"/en-pe/hari-hari-biphole-janama-goyainu/\",\"title\":\"Iṣṭa-deve Vijñapti\"}}}}]\n24:Tf1d,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"description\":\"A digital Vaishnava songbook with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPage\",\"@id\":\"https://dev.kirtan.site/en-pe/amara-jivana-sada-pape-rata/\",\"url\":\"https://dev.kirtan.site/en-pe/amara-jivana-sada-pape-rata/\",\"name\":\"Āmāra jīvana. by Śrīla Bhakti Vinod Ṭhākur\",\"inLanguage\":\"en\",\"description\":\"Āmāra jīvana — a Vaiṣṇava song by Śrīla Bhakti Vinod Ṭhākur with lyrics, English translation and word-by-word meaning. From Pocket Kirtan Guide.\",\"
