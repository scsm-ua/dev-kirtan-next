e sound of the saṅkīrtan arose and filled the sky, destroying inauspiciousness in all directions.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"chatur-dike śrī hari-maṅgala saṅkīrtana\",\"madhye nāche jagannātha miśrera nandana\"],\"translation\":[\"Mahāprabhu Viśvambhar, the son of Jagannāth Miśra, danced, surrounded by the auspicious Hari-nām-saṅkīrtan on all sides.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"sabāra aṅgete śobhe śrī chandana-mālā\",\"ānande nāchaye sabe ha-iye vibholā\"],\"translation\":[\"Everyone was decorated with sandalwood paste and flower garlands, and danced, overwhelmed with joy.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"nijānande nāche mahāprabhu viśvambhara\",\"charaṇera tāli śuni ati manohara\"],\"translation\":[\"Mahāprabhu Viśvambhar danced in the ecstasy of Himself. Hearing the rhythm of His feet was heart capturing.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"bhāvāveśe mālā nāhi rahaye galāya\",\"chhiṇḍiyā paḍaye giyā bhakatera gāya\"],\"translation\":[\"While He was rapt in ecstasy, His flower garland could not remain around His neck. It tore and fell as the devotees sang.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"yā̐ra nāmānande śiva vasana nā jāne\",\"yā̐ra rase nāche śiva se nāche āpane\"],\"translation\":[\"In the ecstasy of whose Name Śiva forgets His clothing, in the ecstasy of whom Śiva always dances, that Supreme Lord now dances personally.\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"yā̐ra nāme vālmīki ha-ila tapodhana\",\"yā̐ra nāme ajāmila pāila mochana\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"yā̐ra nāme śravane saṁsāra-bandha ghuche\",\"hena prabhu avatari kali-yuge nāche\"],\"translation\":[\"By whose Name Vālmīki became a powerful sage, by whose Name Ajāmil attained liberation, by hearing whose Name the bondage of material existence is destroyed, that very Lord descends in the Age of Kali and dances.\"],\"isLong\":false},{\"number\":\"12\",\"text\":[\"yā̐ra nāma la-i śuka nārada beḍāya\",\"sahasra-vadana-prabhu yāra guṇa gāya\"],\"isLong\":false},{\"number\":\"13\",\"text\":[\"sarva-mahā-prāyaśchita ye prabhura nāma\",\"se prabhu nāchaye dekhe yata bhāgyavān\"],\"translation\":[\"He whose Name Śukadev and Nārad take as they wander about, whose glories the thousand-mouthed Anantadev sings, whose Name is the supreme form of atonement, that Lord now dances and glances upon the fortunate souls.\"],\"isLong\":false},{\"number\":\"14\",\"text\":[\"śrī kṛṣṇa-chaitanya nityānanda-chā̐da\",\"jāna vṛndāvana dāsa tachhu pada-yuge gāna\"],\"translation\":[\"Embracing Śrī Kṛṣṇa Chaitanya and Nityānandachā̐d as his life and soul, Vṛndāvan Dās sings the glories of Their lotus feet.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.N. Acharya Maharaj\",\"ru\":\"Шрила Б.Н. Ачарья Махарадж\",\"ua\":\"Шріла Б.Н. Ачарʼя Махарадж\"},\"embed_url\":\"https://soundcloud.com/kostya-netrebenko/082-sriharivasare-9\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"40:[\"$\",\"$L49\",null,{\"audio\":\"$3f:props:song:resources:audio\",\"caption\":\"Listen audio:\",\"language\":\"en\"}]\n41:[\"$\",\"$L4a\",null,{\"navMap\":{\"158\":{\"prev\":{\"path\":\"/en-pe/pralaya-payodhi-jale-dhritavan-asi-vedam/\",\"title\":\"Śrī Daśāvatār Stotram\"},\"next\":{\"path\":\"/en-pe/shiuddha-bhakata-charana-renu/\",\"title\":\"Śuddha-bhakata\"}}}}]\n4b:T626,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"CollectionPage\",\"@id\":\"https://dev.kirtan.site/en-pe/shri-hari-vasare-hari-kirtana-vidhana\",\"url\":\"https://dev.kirtan.site/en-pe/shri-hari-vasare-hari-kirtana-vidhana\",\"name\":\"Śrī Harivāsar Gīti. by Śrīla Vṛndāvan Dās Ṭhākur\",\"inLanguage\":\"en\",\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"}},{\"@type\":\"MusicComposition\",\"@id\":\"https://
