":[\"Abandoning everything, I have come to Your feet, O Lord! I am Your eternal servant, and You are my maintainer and protector, O Lord of the universe!\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"tomāra sakala    āmi mātra dāsa\",\"    āmāra tāribe tumi\",\"tomāra charaṇa    karinu varaṇa\",\"    āmāra nahi ta’ āmi\"],\"translation\":[\"Everything is Yours. I am only a servant. Certainly You will deliver me. I have embraced Your feet and no longer belong to myself.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"bhakati-vinoda    kā̐diya śaraṇa\",\"    la’yechhe tomāra pāya\",\"kṣami’ aparādha    nāme ruchi diyā\",\"    pālana karahe tāya\"],\"translation\":[\"Weeping, Bhakti Vinod takes shelter at Your feet. Forgiving his offences and giving him a taste for the Name, kindly maintain him.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-goptritve\"},{\"title\":{\"en\":\"Sudarshan Prabhu\",\"ru\":\"Сударшан Прабху\",\"ua\":\"Сударшан Прабгу\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/sudarshan-prabhu-goptrtve\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1d:[\"$\",\"$L26\",null,{\"audio\":\"$1c:props:song:resources:audio\",\"caption\":\"Listen audio:\",\"language\":\"en\"}]\n1e:[\"$\",\"$L27\",null,{\"navMap\":{\"108\":{\"prev\":{\"path\":\"/en-pe/hari-hari-biphole-janama-goyainu/\",\"title\":\"Iṣṭa-deve Vijñapti\"},\"next\":{\"path\":\"/en-pe/sarvasva-tomara-charane-sanpiya/\",\"title\":\"Sarvasva tomāra\"}}}}]\n28:T1011,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"nam
