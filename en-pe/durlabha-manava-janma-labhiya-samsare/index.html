elf to it, my days pass by in vain.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"e deha patana ha’le ki rabe āmāra?\",\"keha sukha nāhi dibe putra paribāra\"],\"translation\":[\"When this body drops dead, what will remain ‘mine’? Upon death neither my sons nor my family will give me any satisfaction.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"gardabhera mata āmi kari pariśrama\",\"kāra lāgi’ eta kari, nā ghuchila bhrama\"],\"translation\":[\"I toil laboriously like an ass. For whom am I doing this? Still my illusion has not been dispelled.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"dina yāya michhā kāje, niśā nidrā-vaśe\",\"nāhi bhāvi maraṇa nikaṭe āchhe vase\"],\"translation\":[\"My days pass in meaningless labour, and my nights pass in sleep. I never consider that death is sitting nearby.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"bhāla manda khāi, heri, pari, chintā-hīna\",\"nāhi bhāvi, e deha chhāḍiba kona dina\"],\"translation\":[\"I eat luxuriously, look around, and dress carelessly, never considering that one day I will leave this body.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"deha-geha-kalatrādi-chintā avirata\",\"jāgichhe hṛdaye mora buddhi kari hata\"],\"translation\":[\"Constant thoughts of my body, home, wife, and so on, arise in my heart and spoil my intelligence.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"hāya, hāya! nāhi bhāvi—anitya e saba\",\"jīvana vigate kothā rahibe vaibhava?\"],\"translation\":[\"Alas! Alas! I never considered that all of these things are temporary. When my soul departs, where will all these opulences remain?\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"śmaśāne śarīra mama paḍiyā rahibe\",\"vihaṅga-pataṅga tāya vihāra karibe\"],\"translation\":[\"My body will be laid to rest at the crematorium. There birds and insects will enjoy it.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"kukkura sṛgāla saba ānandita ha’ye\",\"mahotsava karibe āmāra deha la’ye\"],\"translation\":[\"Dogs and jackals will happily have a festival with my body.\"],\"isLong\":false},{\"number\":\"12\",\"text\":[\"ye dehera ei gati, tāra anugata\",\"saṁsāra-vaibhava āra bandhu-jana yata\"],\"translation\":[\"This is the fate of my body, its effects, material wealth, and all of my companions.\"],\"isLong\":false},{\"number\":\"13\",\"text\":[\"ataeva māyā-moha chhāḍi buddhimāna\",\"nitya-tattva kṛṣṇa-bhakti karuna sandhāna\"],\"translation\":[\"So, intelligent souls! Abandon Māyā’s illusion and search for the eternal truth: devotion to Kṛṣṇa.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/kostya-netrebenko/16-durlabha-manava-janma-9\"},{\"title\":{\"en\":\"Caracas temple\",\"ru\":\"Храм г.Каракас\",\"ua\":\"Храм м.Каракас\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/shchsm-karakas-durlava-manava\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1e:[\"$\",\"$L27\",null,{\"audio\":\"$1d:props:song:resources:audio\",\"caption\":\"Listen audio:\",\"language\":\"en\"}]\n1f:[\"$\",\"$L28\",null,{\"navMap\":{\"119\":{\"prev\":{\"path\":\"/en-pe/kobe-gaura-vane-suradhuni-tate/\",\"title\":\"Siddhi-Lālasā\"},\"next\":{\"path\":\"/en-pe/e-ghora-samsare-podiya-manava/\",\"title\":\"E ghora saṁsāre\"}}}}]\n29:T10a3,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"description\":\"A digital Vaishnava songbook with lyrics, transl
