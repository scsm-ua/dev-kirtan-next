9,\"first_line\":\"ṭhākura vaiṣṇava-gaṇa\",\"author\":\"Śrīla Narottam Dās Ṭhākur\"},\"title\":[\"Ṭhākura-vaiṣṇava-gaṇa\"],\"author\":[\"by Śrīla Narottam Dās Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"ṭhākura vaiṣṇava-gaṇa    kari ei nivedana\",\"    mo baḍa adhama durāchāra\",\"dāruṇa-saṁsāra-nidhi    tāhe ḍubāila vidhi\",\"    keśe dhari’ more kara pāra\"],\"translation\":[\"O worshippable Vaiṣṇavas, I offer you this prayer. I am very fallen and misbehaved. Destiny has immersed me in the fearsome ocean of material existence. Please grab me by the hair and pull me to the shore.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"vidhi baḍa balavān    nā śune dharama-jñāna\",\"    sadāi karama-pāśe bāndhe\",\"nā dekhi tāraṇa leśa    yata dekhi saba kleśa\",\"    anātha kātare te̐i kānde\"],\"translation\":[\"Destiny is very powerful. It does not listen to my knowledge of religion and always binds me with the ropes of karma. I do not see even a trace of hope. All I see is hardship. Thus helpless and distressed, I cry.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"kāma, krodha, lobha, moha, mada, abhimāna saha\",\"    āpana āpana sthāne ṭāne\",\"aichāna āmāra mana    phire yena andha jana\",\"    supatha vipatha nāhi jāne\"],\"translation\":[\"Lust, anger, greed, illusion, pride, and ego all pull me in their own directions. Thus my mind wanders like a blind man who does not know the right way from the wrong way.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"nā la-inu sat mata    asate majila chita\",\"    tuyā pāye nā karinu āśa\",\"narottama dāse kaya    dekhi’ śuni’ lage bhaya\",\"    tarāiyā laha nija pāśa\"],\"translation\":[\"I have never accepted the proper conception. My mind has been immersed in illusion, and I have never aspired for your feet. Narottām Dās says, “Seeing and hearing about my situation, I am stricken with fear. Please rescue me and keep me by your side.”\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.K. Ashram Maharaj\",\"ru\":\"Шрила Б.К. Ашрам Махарадж\",\"ua\":\"Шріла Б.К. Ашрам Махарадж\"},\"embed_url\":\"https://soundcloud.com/scsmathcolombia/10-thakura-vaisnava-gana\"},{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-thakura-vaisnava\"},{\"title\":{\"en\":\"Bhakti Lalita Devi\",\"ru\":\"Бхакти Лалита Деви\",\"ua\":\"Бгакті Лаліта Деві\"},\"embed_url\":\"https://soundcloud.com/bhakti-lalita-devi/bhakti-lalita-devi-thakura-vaishnava-gana\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1f:[\"$\",\"$L28\",null,{\"audio\":\"$1e:props:song:resources:audio\",\"caption\":\"Listen audio:\",\"language\":\"en\"}]\n20:[\"$\",\"$L29\",null,{\"navMap\":{\"59\":{\"prev\":{\"path\":\"/en-pe/vaishnava-thakura-dayara-sagara/\",\"title\":\"Śrī Vaiṣṇava-mahimā-gīti\"},\"next\":{\"path\":\"/en-pe/ki-rupe-paibo-seva-mui-durachara/\",\"title\":\"Ki-rūpe pāiba sevā\"}}}}]\n2a:T1290,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"description\":\"A digital Vaishnava songbook with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPage\",\"@id\":\"https://dev.kirtan.site/en-pe/thakura-vaishnava-gana-kori-ei-nivedana/\",\"url\":\"https://dev.kirtan.site/en-pe/thakura-vaishnava-gana-kori-ei-nivedana/\",\"name\":\"Ṭhākura-vaiṣṇava-gaṇa. by Śrīla Narottam Dās Ṭhākur\",\"inLanguage\":\"en\",\"description\":\"Ṭhākura-vaiṣṇava-gaṇa — a Vaiṣṇava song by Śrīl
