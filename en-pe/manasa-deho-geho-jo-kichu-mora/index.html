":{\"page\":94,\"first_line\":\"mānasa, deha, geha\",\"author\":\"Śrīla Bhakti Vinod Ṭhākur\"},\"title\":[\"Mānasa Deha Geha\"],\"author\":[\"by Śrīla Bhakti Vinod Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"mānasa, deha, geha, yo kichhu mora\",\"arpilu̐ tuyā pade nanda-kiśora!\"],\"translation\":[\"I have offered my mind, my body, my household, and whatever else may be mine at Your feet, O Nanda Kiśor!\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"sampade vipade jīvane-maraṇe\",\"dāy mama gelā tuyā o-pada varaṇe\"],\"translation\":[\"In good times and in bad, in life and in death, all my responsibility has gone away by embracing Your feet.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"mārabi rākhabi—yo ichhā tohārā\",\"nitya-dāsa prati tuyā adhikārā\"],\"translation\":[\"Kill me or protect me as You wish. You have full authority over Your eternal servant.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"janmāobi maye ichhā yadi tora\",\"bhakta-gṛhe jani janma ha-u mora\"],\"translation\":[\"If You desire that I take birth again, let me do so in the home of Your devotee.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"kīṭa-janma ha-u yathā tuyā dāsa\",\"bahir-mukha brahma-janme nāhi āśa\"],\"translation\":[\"Let me be born again even as a worm, so long as I can remain Your servant. I have no desire to be born even as Brahmā if I will be averse to You.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"bhukti-mukti-spṛhā vihīna ye bhakta\",\"labha-ite tā̐ka saṅga anurakta\"],\"translation\":[\"I long to attain the association of devotees who are completely free from all desire for selfish enjoyment and liberation.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"janaka, jananī, dayita, tanaya\",\"prabhu, guru, pati—tuhu̐ sarva-maya\"],\"translation\":[\"Father, mother, lover, son, Lord, Guru, and husband—You are everything to me.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"bhakati-vinoda kahe, śuna kāna!\",\"rādhā-nātha! tuhu̐ hāmāra parāṇa\"],\"translation\":[\"Bhakti Vinod says, “Please listen, O Kān! O Rādhānāth! You are my life and soul.”\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-manasa-deho\",\"personSlug\":\"srila-b-s-govinda-dev-goswami-maharaj\"},{\"title\":\"Kamal Krishna Prabhu\",\"embed_url\":\"https://soundcloud.com/jayasri-sound/11-manasa-deha-geha\",\"personSlug\":\"kamal-krishna-prabhu\"},{\"title\":\"Manasa Krishna Prabhu\",\"embed_url\":\"https://soundcloud.com/huron/manasa-deho-geho\",\"personSlug\":\"manasa-krishna-prabhu\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false},\"telegraphUrl\":\"https://telegra.ph/Mānasa-Deha-Geha-02-22\"},\"head\":{\"canonical\":\"/en-pe/manasa-deho-geho-jo-kichu-mora/\",\"description\":\"Mānasa Deha Geha — a Vaiṣṇava song by Śrīla Bhakti Vinod Ṭhākur with lyrics, English translation and word-by-word meaning. From Pocket Kirtan Guide.\",\"title\":\"Mānasa Deha Geha. by Śrīla Bhakti Vinod Ṭhākur | Kirtan Site\"},\"kind\":\"song\",\"route\":{\"kind\":\"item\",\"bookId\":\"en-pe\",\"slug\":\"manasa-deho-geho-jo-kichu-mora\"}}}]}]]}]\n"])</script></body></html>
