jay!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eĀkar Maṭh Rāj Śrī Chaitanya Maṭh kī jay!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eTadīya Śākhā Maṭh kī jay!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eŚrī Chaitanya Sāraswat Maṭh kī jay!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eViśva-vyāpī Tadīya Śākhā Maṭh kī jay!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eAnanta-koṭī Vaiṣṇava-vṛnda kī jay!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eSamaveta Vaiṣṇava-vṛnda kī jay!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eHari-nām-saṅkīrtan kī jay!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eNitāi Gaura Premānande! Haribol!\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eĀrati\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-jaya-jaya-gurudever-arati-ujjvala\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Guru Ārati \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīpād B. A. Paramahaṁsa Mahārāj\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya jaya gurudever ārati ujjvala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egovardhana-pāda-pīṭhe bhuvana-maṅgala\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to the effulgent ārati of Śrīla Gurudev taking place at the foot of Govardhan for the benefit of the world!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī bhakti sundara deva prabhu śiromaṇi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egosvāmī govinda jaya ānandera khani\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to the mine of joy, Śrī Bhakti Sundar Govinda DevGoswāmī, who is the crown-jewel of Gurus!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eājānu lambita bhuja divya kalevara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eananta pratibhā bharā divya guṇadhara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYour divine form’s arms extend to your knees. You possess infinite genius and divine qualities.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaura-kṛṣṇe jāni tava abhinna svarūpa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaṁsāra tarite ebe śuddha-bhakta-rūpa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI know that you are nondifferent from Śrī Gaura Kṛṣṇa and have now assumed the form of a pure devotee to deliver the world.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erūpānuga-dhārā tumi kara ālokita\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprabhākara sama prabhā bhuvana-vidita\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYou illuminate Śrī Rūpa’s line. Like the sun, your effulgence is known throughout the world.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśuddha bhakti prachārite tomā sama nāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eakalaṅka indu yena dayāla nitāi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThere is no one like you to preach pure devotion. You are a spotless moon like merciful Nityānanda.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eullasita viśva-vāsī labhe prema-dhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eānande nāchiyā gāhe tava guṇa-gaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAttaining the wealth of divine love (by your grace), joyful souls all over the world sing your glories, dancing in ecstasy.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esthāpilā āśrama bahu jagata mājhāre\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epāramahaṁsa-dharma-jñāna śikṣāra prachāre\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYou established many ashrams all over the world to teach paramahaṁsa-dharma (the way of the true Vaiṣṇavas).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echintyāchintya veda-jñāne tumi adhikārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esakala saṁśaya chhettvā susiddhānta-dhārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYou are a master of both conceivable and inconceivable Vedic knowledge. You cut away all doubts and represent the true teachings.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra mahimā gāhe goloka maṇḍale\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enitya-siddha parikare tava līlā-sthale\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYour eternally liberated associates sing your glories in Goloka, the realm of your Pastimes.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epatita pāvana tumi dayāra samīra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esarva-kārye sunipuṇa satya-sugambhīra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYou are the saviour of the fallen and a breeze of mercy. You are truthful, deep, and expert in all types of service.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eapūrva lekhanī dhārā pragāḍha pāṇḍitya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esadā hāsya miṣṭa-bhāṣī suśīla kavitva\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYour writings are wonderful, and your learning is profound. You always smile and speak sweet words. Your poetry is perfect.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esādhu-saṅge sadānandī sarala vinayī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esabhā-madhye vaktā śreṣṭha sarvatra vijayī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYou are always joyful in the sādhus’ association. You are simple and humble. In assemblies, you are the best speaker. Everywhere you are victorious.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"14\"\u003e\n\u003ch5\u003e14\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egauḍīya gagane tumi āchārya-bhāskara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enirantara sevā-priya miṣṭa kaṇṭhasvara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIn the sky of the Gauḍīya Vaiṣṇavas, you are the sun-like Āchārya. You are always fond of service, and your voice is sweet.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"15\"\u003e\n\u003ch5\u003e15\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra karuṇā māge trikāla vilāse\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egāndharvikā-giridhārī sevā-mātra āśe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThroughout the play of the past, present, and future, this servant prays for your mercy, desiring only to serve Śrī Śrī Gāndharvikā-Giridhārī.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"16\"\u003e\n\u003ch5\u003e16\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛpā kara ohe prabhu śrī-gaura-prakāśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eārati karaye sadā e adhama dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBe merciful, O lord, manifestation of Śrī Gaurāṅga! This fallen servant always worships you.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-guru-maharaja-jati-rajeshvara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Guru Ārati Stuti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya ‘guru-mahārāja’ yati-rājeśvara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-bhakti-rakṣaka deva-gosvāmī śrīdhara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to Śrīla Guru Mahārāj, Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī, the leading general of the tridaṇḍi-sannyāsīs!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epatita-pāvana-līlā vistāri’ bhuvane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enistārilā dīna-hīna āpāmara jane\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYou revealed your Pastimes in this world as the saviour of the fallen and delivered the sinful and unfortunate souls.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra karuṇā-ghana murati heriyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epreme bhāgyavāna jīva paḍe murachiyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBeholding your intensely merciful form, the fortunate souls faint with divine love.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esudīrgha supībya deha divya-bhāvāśraya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edivya-jñāna-dīpta-netra divya-jyotirmaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYour lofty, delightful form is an abode of divine emotion and filled with divine lustre. Your eyes are illumined with divine knowledge.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esuvarṇa-sūraja-kānti aruṇa-vasana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etilaka, tulasī-mālā, chandana-bhūṣaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYour form is adorned with tilak, tulasī beads, sandalwood paste, saffron cloth, and golden radiance like that of the sun.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eapūrva śrī-aṅga-śobhā kare jhalamala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eaudārya-unnata-bhāva mādhurya-ujjvala\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe extraordinary beauty of your divine form shines with the exalted joy of benevolence, the brightness of divine sweetness.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eachintya pratibhā, snigdha, gambhīra, udāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaḍa-jñāna-giri-vajra divya-dīkṣādhāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYou are endowed with inconceivable genius, affection, gravity, and magnanimity. You are a thunderbolt atop the mountain of mundane knowledge, and the conduit for divine revelation.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaura-saṅkīrtana-rāsa-rasera āśraya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e“dayāla nitāi” nāme nitya premamaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYou are the abode of the joy of Śrī Gaurāṅga’s saṅkīrtan dance, and you are always filled with divine love as you call “Dayāl Nitāi”.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esāṅgopāṅge gaura-dhāme nitya-parakāśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egupta-govardhane divya-līlāra-vilāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe play of your divine Pastimes at Hidden Govardhan Hill in Śrī Gaurāṅga’s abode are manifest eternally.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egauḍīya-āchārya-goṣṭhī-gaurava-bhājana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egauḍīya-siddhānta-maṇi kaṇṭha-vibhūṣaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYou are revered by the assembly of Gauḍīya Āchāryas. Your neck is adorned with the jewel of Gauḍīya-siddhānta.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaura-sarasvatī-sphūrta siddhāntera khani\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāviṣkṛta gāyatrīra artha-chintāmaṇi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYou are the mine of the siddhānta revealed by Śrī Gaurāṅga and Śrīla Saraswatī Ṭhākur. You discovered the divine meaning of the gāyatrī mantra.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eeka-tattva varṇanete nitya-nava-bhāva\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esusaṅgati, sāmañjasya, e saba prabhāva\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYour ever-new joy as you describe the Absolute, your adjustments, your harmonies—such greatness …\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra satīrtha-varga sabe eka-mate\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erūpa-sarasvatī-dhārā dekhena tomāte\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eUnanimously all of your godbrothers see within you the revelation of Śrī Rūpa and Śrīla Saraswatī Ṭhākur.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"14\"\u003e\n\u003ch5\u003e14\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etulasī-mālikā-haste śrī-nāma-grahaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edekhi’ sakalera haya ‘prabhu’ uddīpana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSeeing you chant the Holy Name with tulasī beads in hand, everyone remembers Prabhupād Śrīla Saraswatī Ṭhākur.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"15\"\u003e\n\u003ch5\u003e15\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekoṭī-chandra-suśītala o pada bharasā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egāndharvā-govinda-līlāmṛta-lābha-āśā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe shelter of your feet, which are cooling like millions of moons, is our hope to attain the nectar of Śrī Śrī RādhāGovinda’s Pastimes\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"16\"\u003e\n\u003ch5\u003e16\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eavichintya-bhedābheda-siddhānta-prakāśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esānande ārati stuti kare dīna-dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO manifestation of the principle of inconceivable difference and nondifference (union in separation)! This humble servant chants your glories and worships you with joy.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-kali-kukkura-kadana-jadi-chao-he\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eMaṅgal Ārati \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kali-kukkura-kadana yadi chāo he\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekali-yuga-pāvana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kali-bhaya-nāśana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-śachī-nandana gāo he\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIf you want to tame the dog Kali, then chant ‘Śrī Śachī Nandan!’ He is the saviour and destroyer of fear in Kali-yuga.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egadādhara-mādana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nitāi-era prāṇa-dhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;advaitera prapūjita gorā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enimāi viśvambhara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrīnivāsa-īśvara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhakta-samūha chita-chorā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe is Gadādhar’s joy, and Nitāi’s life and wealth. He is worshipped by Advaita Āchārya. He is known as Nimāi, and is the maintainer of the universe. He is Śrīvās Ṭhākur’s Lord, and He steals the devotees’ hearts.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enadīyā-śaśadhara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;māyāpura-īśvara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāma-pravartana-śūra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egṛhī-jana-śikṣaka\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nyāsi-kula-nāyaka\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mādhava rādhā-bhāva-pūra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe is the moon of Nadia, the Lord of Māyāpur, and the inaugurator of Hari-nām-saṅkīrtan. He is the teacher of the householders and the leader of the sannyāsīs. He is Mādhava replete with Rādhā’s heart.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esārvabhauma-śodhana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gajapati-tāraṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rāmānanda-poṣaṇa vīra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erūpānanda-vardhana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sanātana-pālana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;haridāsa-modana dhīra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe is the purifier of Sārvabhauma Bhaṭṭāchārya and the deliverer of Mahārāj Pratāparudra. He is the maintainer of Rāmānanda Rāy and the hero of all. He is the guardian of Śrīla Sanātan Goswāmī and the joy of Śrīla Rūpa Goswāmī. He is the delight of Hari Dās Ṭhākur and is perfectly sober.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evraja-rasa-bhāvana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;duṣṭa-mata-śātana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kapaṭī-vighātana-kāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśuddha bhakta-pālana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śuṣka-jñāna-tāḍana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chhala-bhakti-dūṣaṇa rāma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe is absorbed in Vraja’s rasas. He is the dispeller of misconception, lust, and deceit. He is the maintainer of the pure devotees and the dispeller of dry knowledge. He is the eradicator of pseudo-devotion and the reservoir of all pleasure.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jashomati-nandana-vraja-vara-nagara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Nām-kīrtan \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyaśomatī-nandana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vraja-vara-nāgara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gokula-rañjana kāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egopī-parāṇa-dhana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;madana-manohara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kāliya-damana vidhāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Kṛṣṇa, who is known as Kān, is Yaśodā’s darling son, Vraja’s paramour, Gokula’s delight, the gopīs’ life and wealth, the enchanter of Cupid, and the conqueror of Kālīya.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;amala hari-nāma amiya-vilāsā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evipina-purandara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;navīna nāgara-vara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vaṁśī-vadana suvāsā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHis Names and nectarean Pastimes are all transcendental. He is the king of Vraja’s forests and the best of young paramours. He beautifully plays the flute.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evraja-jana-pālana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;asura-kula-nāśana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nanda-godhana-rākhoyālā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egovinda mādhava\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;navanīta-taṣkara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sundara nanda-gopālā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe is the guardian of Vraja’s residents, the destroyer of the demons, and the keeper of Nanda’s cows. He is known as ‘Govinda’—He who nourishes the cows, senses, Vedas, and world—and ‘Mādhava’—Śrī Rādhā’s consort. He is Nanda’s beautiful cowherd boy and a butter thief.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyamunā-taṭa-chara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopī-vasana-hara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rāsa-rasika kṛpāmaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-rādhā-vallabha\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vṛndāvana-naṭa-vara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhakativinod-āśraya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe is a spy on the Yamunā’s banks and the stealer of the gopīs’ garments. He is the relisher of the rāsa-līlā and the embodiment of mercy. He is Śrī Rādhā’s beloved, Vṛndāvan’s great dancer, and Bhakti Vinod’s shelter.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-shiachinandana-sura-muni-vandana\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śachīnandana-vandanā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya śachī-nandana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sura-muni-vandana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhava-bhaya-khaṇḍana jaya he\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaya hari-kīrtana-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nartanāvartana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kali-mala-kartana jaya he\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to Śrī Śachī Nandan, who is worshipped by the demigods and sages! All glory to He who destroys all fear of material existence! All glory to the inaugurator of dancing and chanting the Lord’s Names! All glory to He who removes the contamination of Kali!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enayana-purandara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;viśvarūpa snehadhara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;viśvambhara viśvera kalyāṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaya lakṣmī-viṣṇu-priyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;viśvambhara priya hiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jaya priya kiṅkara īśāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Śachī Nandan is the delight of everyone’s eyes and affectionate to His brother Viśvarūp. He is the maintainer of the world and the embodiment of its good fortune. All glory to Lakṣmī Priyā and Viṣṇu Priyā, who are dear to Viśvambhar’s heart! All glory to His dear servant Īśān!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī sītā advaita rāya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mālinī śrīvāsa jaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jaya chandraśekhara āchārya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaya nityānanda rāya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gadādhara jaya jaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jaya haridāsa nāmāchārya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to Sītā Ṭhākurāṇī and Advaita Āchārya! All glory to Mālinī Devī and Śrīvās Ṭhākur! All glory to Chandraśekhar Āchārya! All glory to Nityānanda Rāy! All glory to Gadādhar Paṇḍit! All glory to the Nāmāchārya, Hari Dās Ṭhākur!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emurāri mukunda jaya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;premanidhi mahāśaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jaya yata prabhu pāriṣada\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evandi sabākāra pāya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;adhamere kṛpā haya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhakti sapārṣada-prabhupāda\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to Murāri Gupta, Mukunda Datta, and Puṇḍarīk Vidyānidhi! All glory to all the associates of Śrī Śachī Nandan! I offer my obeisance at their feet. By their mercy upon this fallen soul, I serve Śrīla Prabhupād and his associates.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-bhaja-bhakata-vatsala-shri-gaurahari\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Bhoga Ārati Gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhaja bhakata-vatsala śrī-gaurahari\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-gaurahari sohi goṣṭha-vihārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enanda-yaśomatī-chita-hārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eServe Śrī Gaurahari, who is most affectionate to His devotees. He is the rambler in the fields (of Vraja), the stealer of Nanda and Yaśodā’s hearts.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e“belā ha’lo, dāmodara, āisa ekhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhoga-mandire vasi’ karaha bhojana”\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“It’s time! Damodar! Come now! Sit down in the dining hall and eat.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enandera nirdeśe vaise giri-vara-dhārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebaladeva-saha sakhā vaise sāri sāri\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAt Nanda’s request, Kṛṣṇa, Baladev, and Their friends sit down in lines.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśuktā-śākādi bhāji nālitā kuṣmāṇḍa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eḍāli ḍālnā dugdha-tumbī dadhi mochā-ghaṇṭa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚuktā, śāk, fried vegetables, jute-leaf salad, pumpkin, baskets of fruit, dāl patties, gourd cooked in milk, yoghurt, banana flower …\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emudga-baḍā māṣa-baḍā roṭikā ghṛtānna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśaṣkulī piṣṭaka kṣīr puli pāyasānna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMoong dāl patties, urad dāl patties, chapātīs, rice with ghee, rice and sesame gruel, rice-flour cakes, condensed milk, pancakes, rice pudding …\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekarpūra amṛta-kelī rambhā kṣīra-sāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eamṛta rasālā, amla dvādaśa prakāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHot milk flavoured with camphor, plantains, butter, twelve kinds of sweet, juicy, and sour preparations …\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eluchi chini sarapurī lāḍḍu rasāvalī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhojana karena kṛṣṇa ha’ye kutūhalī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSweet purīs, purīs filled with cream, sweet balls, dāl patties boiled with sugared rice—Kṛṣṇa eagerly eats all these preparations.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erādhikāra pakka anna vividha vyañjana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eparama ānande kṛṣṇa karena bhojana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWith great joy Kṛṣṇa eats various vegetable preparations cooked by Rādhikā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echhale-bale lāḍḍu khāy śrī-madhumaṅgala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebagala bājāy āra deya haribolo\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBy hook or by crook, Madhumaṅgal eats the sweet balls. He slaps his armpits and calls out, ‘Haribol!’\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erādhikādi gaṇe heri’ nayanera koṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etṛpta ha’ye khāya kṛṣṇa yaśodā-bhavane\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGlancing at Rādhikā and Her friends out of the corners of His eyes, Kṛṣṇa happily eats in Yaśodā’s home.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhojanānte piye kṛṣṇa suvāsita vāri\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esabe mukha prakṣālaya ha’ye sāri sāri\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAfter eating, Kṛṣṇa drinks scented water. Then all of the boys line up and wash their mouths.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehasta-mukha prakṣāliyā yata sakhā-gaṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eānande viśrāma kare baladeva-sane\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAfter washing their hands and mouths, Kṛṣṇa’s friends happily take rest with Baladev.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejambula rasāla āne tāmbula-maśālā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etāhā kheye kṛṣṇachandra sukhe nidrā gelā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eJambula and Rasāla bring spiced pān. Kṛṣṇa chews it and then happily goes to sleep.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"14\"\u003e\n\u003ch5\u003e14\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eviśālākṣa śikhi-puchchha chāmara ḍhulāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eapūrva śayāya kṛṣṇa sukhe nidrā yāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eViśālākṣa fans Kṛṣṇa with a peacock fan, and Kṛṣṇa happily sleeps on a comfortable bed.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"15\"\u003e\n\u003ch5\u003e15\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyaśomatī-ājñā peye dhaniṣṭhā ānīta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-kṛṣṇa-prasāda rādhā bhuñje haye prīta\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBeing requested by Yaśodā, Dhaniṣṭhā brings Śrī Kṛṣṇa’s remnants to Rādhā, who eats them joyfully.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"16\"\u003e\n\u003ch5\u003e16\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003elalitādi sakhī-gaṇa avaśeṣa pāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emane mane sukhe rādhā-kṛṣṇa-guṇa gāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLalitā Devī and her friends then receive Rādhā’s remnants and joyfully sing the glories of Rādhā-Kṛṣṇa within their hearts.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"17\"\u003e\n\u003ch5\u003e17\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari-līlā eka-mātra yāhāra pramoda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhogārati gāy ṭhākur bhakativinoda\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eṬhākur Bhakti Vinod, whose sole joy is the Lord’s Pastimes, sings this bhog ārati.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(bhaja govinda govinda gopāla)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(giridhārī gopīnātha nanda-dulāla)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(bhaja govinda govinda gopāla)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(nanda-dulāla jaya jaya śachī-dulāla)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(śachī-dulāla jaya jaya gaura gopāla)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eServe Govinda, serve Gopāl. Serve Giridhārī, Gopīnāth, Nanda Dulāl. Serve Govinda, serve Gopāl. All glory to Nanda’s son! All glory to Śachī’s son! All glory to golden Gopāl!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-jaya-gaurachander-arotiko-shobha\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Gaura Ārati \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(kibā) jaya jaya gorāchā̐der āratika śobhā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejāhnavī-taṭa-vane jaga-mana lobhā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(jaga-janer mana lobhā)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gaurāṅger ārati śobhā jaga-janer mana lobhā)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(nitāi gaura haribol)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to the beautiful ārati to Śrī Gorāchā̐d in a grove on the banks of the Ganges, which attracts the hearts of all souls throughout the world!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(kibā) dakṣiṇe nitāichā̐da bāme gadādhara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enikaṭe advaita śrīnivāsa chhatra-dhara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOn Gorāchā̐d’s right is Nitāichā̐d, and on His left is Gadādhar. Advaita is nearby, and Śrīvās holds an umbrella.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(kibā) basiyāchhe gorāchā̐da ratna-siṁhāsane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(ratna-simhāsana alo karere\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;basiyāchhen gorāchā̐d ratna-siṁhāsane)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eārati karena brahmā ādi-deva gaṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gaurāṅger ārati kare)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(brahmā ādi-deva gaṇe gaurāṅger ārati kare)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gaurāṅgera bhakta sane gaurāṅger ārati kare)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(nitāi gaura haribol)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGorāchā̐d has sat on a jewelled throne. Brahmā and the other demigods worship Him (in the company of His devotees).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(kibā) narahari-ādi kari chāmara ḍhulāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esañjaya-mukunda-vāsu-ghoṣa-ādi gāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gaura guṇa gāna kare)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(sañjaya mukunda vāsu-ghoṣa gaura guṇa gāna kare)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(nitāi gaura haribol)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNarahari and others fan the Lord with chāmaras. Sañjay, Mukunda, Vāsudev Ghoṣ, and others sing.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(kibā) śaṅkha bāje ghaṇṭā bāje bāje karatāla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emadhura mṛdaṅga bāje parama rasāla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(madhur madhur madhur bāje)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gaurāṅger ārati kāle madhur madhur madhur bāje)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(śaṅkha bāje ghaṇṭā bāje madhur madhur madhur bāje)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(madhura mṛdanga bāje madhur madhur madhur bāje)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(nitāi gaura haribol)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eConches, bells, kartāls, and mṛdaṅgas resound sweetly. The kīrtan is most relishable.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(kibā) bahu-koṭi chandra jini vadana ujjvala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egala-deśe vana-mālā kare jhalamala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(jhalmal jhalmal jhalmal kare)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gaura gale vana phuler mālā jhalmal jhalmal jhalmal kare)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(nitāi gaura haribol)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe radiance of the Lord’s face surpasses that of millions of moons. The garland of forest flowers around His neck shines.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(kibā) śiva-śuka-nārada preme gada-gada\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakati-vinoda dekhe gorāra sampada\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚiva, Śukadev, and Nārad stammer in the ecstasy of love. In this way Bhakti Vinod beholds Gorāchā̐d’s glory.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(ei bār āmāy dayā kara)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(ṭhākura śrī bhakti-vinoda ei bār āmāy dayā kara)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(ṭhākura śrī sarasvatī ei bār āmāy dayā kara)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(patit-pāvan śrī gurudev ei bār āmāy dayā kara)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(sapārṣada gaurahari ei bār āmāy dayā kara)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(nitāi gaura haribol)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThis time please give me your grace. O Śrīla Bhakti Vinod Ṭhākur, O Śrīla Saraswatī Ṭhākur, O Gurudev, saviour of the fallen, O Gaurahari, along with your associates, this time please give me your grace.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jayare-jayare-jaya-gaura-sarasvati\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Sāraswat Ārati \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejayare jayare jaya gaura-sarasvatī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakativinodānvaya karuṇā murati\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to the voice of Śrī Gaurāṅga, the embodiment of Śrīla Bhakti Vinod Ṭhākur’s mercy, Śrīla Bhakti Siddhānta Saraswatī Ṭhākur!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprakāśile gaura-sevā bhūvana maṅgala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakati-siddhānta śuddha prajñāna ujjvala\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe manifested Śrī Gaurāṅga’s service for the upliftment of the world. His teaching of devotion is pure, brilliant, and enlightening.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erādhā-śyāma eka-tanu dakṣe gorā rāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebāme rādha madhye svayaṁ śyāma-gopa jaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to the combined form of Śrī Śrī Rādhā-Śyām, Śrī Gaura Rāy, on the right, Śrī Rādhā on the left, and the dark cowherd boy Himself in the middle!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evraja-rasa nava-bhāve navadvīpe rāje\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eudāre madhura rāga abhinava sāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVraja’s rasa manifests in a new way in Nabadwīp: madhurarasa dresses newly in benevolence.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emādhurya kaivalya rāga vrajera niryāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprāpti parākāṣṭhā tāhe gaurāṅga vilāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSweet divine love, Vraja’s essence, reaches its climax in Śrī Gaurāṅga’s Pastimes.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erādhā bhāva-kānti aṅgikari’ bhāla mate\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edakṣiṇe āsana rasa garimā dekhāte\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Gaurāṅga earnestly embraces Śrī Rādhā’s heart and halo, and takes His place on the right to show His rasa’s glory.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erādhā-rasa-traya-svāda rahasya prayāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enirakhi praphulla rādhā mukhe manda hāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSeeing Kṛṣṇa’s secret endeavour to taste Her threefold rasa, Rādhā is fulfilled and smiles gently.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emadhye rahi’ vaṁśī-rave ghoṣe vaṁśī-dhara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhāra sampade āmi gaurāṅga-sundara!\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eRemaining in the middle, the flute player declares with the song of His flute, “With Rādhā’s wealth, I am Gaurāṅgasundar!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emad abhīṣṭha rūpa rādhāra hṛdaya mandire\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaurāṅga bhajile suṣṭhu sphūrti pāya tāre\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“If you serve Gaurāṅga, My form which is cherished in the temple of Rādhā’s heart will be fully revealed to you.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enadīyā prakāśe mahāprabhu gaura-nidhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epatita-pāvana deve milāila vidhi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGaurāṅga Mahāprabhu appeared in Nadia, and Providence combined the saviour of the fallen (the Kali-yuga-avatār) within Him.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ee-rūpa ārati brahmā śambhu agochara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaura-bhakta kṛpā-pātra mātra siddhi sāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThis type of ārati is unknown to Brahmā and Śiva. Only a recipient of Śrī Gaurāṅga’s devotees’ mercy reaches such perfection.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī svarūpa, rāmānanda, rūpa, sanātana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī raghu, jīvādi kṛpāya dekhe bhakta-jana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDevotees see this ārati by the mercy of Śrī Svarūp Dāmodar, Śrī Rāmananda Rāy, Śrī Rūpa, Śrī Sanātan, Śrī Raghunāth, Śrī Jīva, and their associates.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya guru-gaura-rādhā-govinda-sundara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaya dāo bhakta vṛnda nitya nirantara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to Śrī Guru, Gaurāṅga, and Rādhā-Govindasundar! O devotees, glorify them always and forever!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eParikramā\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-gurudeva-kripa-bindu-diya-kara-ei-dase\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eGurudeva \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egurudeva!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛpā-bindu diyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kara’ ei dāse\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tṛṇāpekṣā ati dīna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esakala-sahane\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bala diyā kara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nija-māne spṛhā-hīna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gurudev! Give this servant a drop of your mercy, and make me more humble than a blade of grass. Give me the strength to tolerate everything, and make me free from any desire for personal honour.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esakale sammāna\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;karite śakati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;deha nātha! yathā yatha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etabe ta’ gāiba\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hari-nāma sukhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;aparādha habe hata\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO master! Give me the ability to befittingly honour everyone. Then I will sing the Lord’s Name happily, and all my offences will be eradicated.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekabe hena kṛpā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;labhiyā e jana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛtārtha ha-ibe, nātha!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśakti-buddhi-hīna\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āmi ati dīna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kara more ātma-sātha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen will this soul attain such mercy and become fulfilled? O master! I am devoid of ability and intelligence, and greatly distressed. Please accept me.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyogyatā-vichāre\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kichhu nāhi pāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra karuṇā-sāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekaruṇā nā ha-ile\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kā̐diyā kā̐diyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prāṇa nā rākhiba āra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen I examine myself for qualifications, I find none. Your mercy is everything. If you are not merciful to me, then, crying, I will no longer maintain my life.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-udilo-aruna-puraba-bhage\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eAruṇodoya-kīrtan \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003ePart 1\u003c/h3\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eudila aruṇa pūrava-bhāge\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edvija-maṇi gorā amani jāge\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakata-samūha la-iyā sāthe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gorā) gelā nagara-vrāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe sun arises in the east, and the jewel of the brāhmaṇs, Śrī Gorāchā̐d, awakes. Taking His devotees with Him, He goes out about the town.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘tāthai tāthai’ bājala khola\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eghana ghana tāhe jhā̐jera rola\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epreme ḍhala ḍhala sonāra aṅga\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gorār) charaṇe nūpura bāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe mṛdaṅgas resound ‘tāthai tāthai’ to the beat of the cymbals as Gaurasundar’s golden form sways with ecstatic love and His footbells jingle.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emukunda mādhava yādava hari\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebalena bala re vadana bhari’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emichhe nida-vaśe gela re rāti\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;divasa śarīra sāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe calls out, “Chant aloud Mukunda, Mādhava, Yādava, Hari! Uselessly you pass the night asleep and the day decorating your body.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eemana durlabha mānava-deha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epāiyā ki kara bhāvanā keha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eebe nā bhajile yaśodā-suta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;charame paḍibe lāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Having attained this rare human body, what are you thinking? If you do not serve Kṛṣṇa now, lastly you will fall into shame.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eudita tapana ha-ile asta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edina gela bali’ ha-ibe vyasta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etabe kena ebe alasa ha-i’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā bhaja hṛdaya-rāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“When the shining sun sets, you become busy, considering that the day has passed. So why are you being lazy now? Why don’t you serve the Lord of your heart?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejīvana anitya jānaha sāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etāhe nānā-vidha vipada-bhāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāmāśraya kari’ yatane tumi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;thākaha āpana kāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Understand the essence: life is temporary and filled with all sorts of adversity. Carefully taking shelter of the Name, engage in your work.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛṣṇa-nāma-sudhā kariyā pāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejuḍāo bhakati-vinoda-prāṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma vinā kichhu nāhika āra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chaudda-bhuvana-mājhe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDrink the nectar of Kṛṣṇa’s Name and soothe Bhakti Vinod’s soul. There is nothing to be had but the Name in all the fourteen worlds.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejīvera kalyāṇa-sādhana-kāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejagate āsi’ e madhura nāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eavidyā-timira-tapana-rūpe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hṛd-gagane virāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDesiring to bless all souls, the Lord’s sweet Name comes to this world and arises like the Sun within the sky of the heart to dispel the darkness of ignorance.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jiv-jago-jiv-jago-gaurachanda-bole\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eAruṇodoya-kīrtan \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003ePart 2\u003c/h3\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejīva jāga, jīva jāga, gorāchā̐da bale\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekata nidrā yāo māyā-piśāchīra kole\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Gorāchā̐d calls, “O souls, awake! O souls, awake! How long will you sleep in the clutches of the witch Māyā?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(ār kata kāl ghumāibe?)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(māyā-piśāchīra kole ār kata kāl ghumāibe?)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(uṭha jīva, kṛṣṇa bhaja ār kata kāl ghumāibe?)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e\"How much longer will you sleep? How much longer will you sleep in the lap of the witch Māyā? Arise soul! Serve Kṛṣṇa! How much longer will you sleep?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhajiba baliyā ese saṁsāra-bhitare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhuliyā rahile tumi avidyāra bhare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“You came into this world saying, ‘O Lord, I will serve You’, but, having forgotten this promise, you have remained in ignorance.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(bhuliyā rahile)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(avidyāra mohe paḍe tumi bhuliyā rahile)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“You forgot and remained. You fell into illusion’s bewilderment, forgot (your promise), and remained there.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāre la-ite āmi ha-inu avatāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāmi vinā bandhu āra ke āchhe tomāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“I have descended to save you. Other than Me, who is your friend?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(eman bandhu ār ke āchhe?)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(māyā-ha-ite uddhārite eman bandhu ār ke āchhe?)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Who else is such a friend? Who else is there to rescue you from Māyā?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eenechhi auṣadhi māyā nāśibāra lāgi’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehari-nāma mahā-mantra lao tumi māgi’\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“I have brought the medicine to dispel Māyā. Pray for this Hari-nām mahāmantra and take it.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(māgiyā lao re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(sudhā-mākhā ei hari-nām māgiyā lao re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Pray and take it. Pray for the Holy Name, which is dripping with nectar, and take it.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakativinoda prabhura-charaṇe paḍiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esei hari-nāma-mantra la-ila māgiyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBhakti Vinod falls at the Lord’s feet, prays for the Hari-nām mahāmantra, and takes it.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-kobe-shri-chaitanya-more-koribena-daya\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eDainya Prārthanā Gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekabe śrī chaitanya more karibena dayā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekabe āmi pāiba vaiṣṇava-pada-chhāyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen will Śrī Chaitanya be merciful to me? When will I reach the shade of the Vaiṣṇavas’ feet?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekabe āmi chhāḍiba e viṣayābhimāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekabe viṣṇu-jane āmi kariba sammāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen will I give up this mundane ego? When will I honour the Lord’s devotees?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egala-vastra kṛtāñjali vaiṣṇava-nikaṭe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edante tṛṇa kari’ dā̐ḍāiba niṣkapaṭe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWith a cloth around my neck, joined palms, and straw between my teeth, I will sincerely submit myself at the Vaiṣṇava’s feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekā̐diyā kā̐diyā jānāiba duḥkha-grāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaṁsāra-anala haite māgiba viśrāma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWeeping, I will convey my sorrows to the Vaiṣṇava and pray for shelter from the fire of material existence.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśuniyā āmāra duḥkha vaiṣṇava ṭhākura\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāmā’ lāgi’ kṛṣṇe āvedibena prachura\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHearing of my sorrow, the worshippable Vaiṣṇava will thoroughly pray to Kṛṣṇa on my behalf.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evaiṣṇavera āvedane kṛṣṇa dayāmaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ee hena pāmara prati habena sadaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSatisfied by the Vaiṣṇava’s prayer, Kṛṣṇa will be merciful to this sinner.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evinodera nivedana vaiṣṇava-charaṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛpā kari’ saṅge laha ei akiñchane\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBhakti Vinod prays at the feet of the Vaiṣṇavas: “Mercifully take this lowly soul with you.”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-namo-namah-tulasi-maharani\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī Tulasī-parikramā-gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Chandraśekhar Āchārya\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enamo namaḥ tulasī mahārāṇī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evṛnde mahārāṇī namo namaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Tulasī Mahārāṇī, O Vṛndā Devī, I offer my obeisance unto you again and again.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enamo re namo re mā̐iyā namo nārāyaṇī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Nārāyaṇī, I offer my obeisance unto you again and again.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyā̐ko daraśe paraśe agha-nāśa hoi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emahimā veda-purāṇe vākhāni\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBy seeing or touching you, all sins are destroyed. Your glories are sung in the Vedas and Purāṇas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyā̐ko patra mañjarī komala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-pati-charaṇa-kamale lepaṭāni\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYour leaves and soft mañjarīs are twined around the lotus feet of Lakṣmī’s Lord.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edhanya tulasī pūraṇa tapa kiye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-śālagrāma-mahā-pāṭarāṇī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO fortunate Tulasī, by your performance of austerity you have become Śrī Śālagrām’s worshippable consort.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edhūpa, dīpa, naivedya, ārati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ephulanā kiye varakhā varakhāni\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYou shower mercy upon one who offers you incense, lamps, foods, worship, and flowers.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echhāppānna bhoga, chhatriśa vyañjana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evinā tulasī prabhu eka nāhi māni\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe Lord does not accept even one of fifty-six grain offerings or thirty-six vegetable offerings without tulasī leaves.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśiva śuka nārada ā-ura brahmādika\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eḍhu̐ḍata phirata mahā-muni jñānī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚiva, Śukadev, Nārad, Brahmā, the other demigods, and the great learned sages all circumambulate you.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echandraśekhara māiyā, terā yaśa gāoye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakati dāna dījiye mahārāṇī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Tulasī Mahārāṇī, Chandraśekhar sings your glories. Give him the gift of devotion.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eVandanā\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-vande-ham-shri-guroh-shri-yuta-pada-kamalam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eVandanā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evande ’haṁ śrī-guroḥ śrī-yuta-pada-kamalaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-gurūn vaiṣṇavāṁś cha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-rūpaṁ sāgrajātaṁ saha-gaṇa raghunāth-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ānvitaṁ taṁ sa-jīvam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esādvaitaṁ sāvadhūtaṁ parijana-sahitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛṣṇa-chaitanya-devaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-rādhā-kṛṣṇa-pādān saha-gaṇa-lalitā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-viśākhānvitāṁś cha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI offer my obeisance unto the lotus feet of my Guru, the predecessor Gurus, the Lord’s devotees, Śrī Rūpa, Śrī Sanātan, Śrī Raghunāth, Śrī Jīva, Śrī Rūpa’s followers, Śrī Kṛṣṇa Chaitanyadev, Śrī Nityānanda Prabhu, Śrī Advaita Prabhu, Śrī Chaitanyadev’s associates, Śrī Śrī Rādhā-Kṛṣṇa, Śrī Lalitā Devī, Śrī Viśākhā Devī, and all of Their associates.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eoṁ ajñāna-timirāndhasya jñānāñjana-śalākayā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echakṣur unmilitaṁ yena tasmai śrī-gurave namaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI offer my obeisance unto Śrī Gurudev, who has opened my eyes, which were blinded by the darkness of ignorance, with the salve of divine knowledge.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epūjya śrī-guru-varga-vandita mahābhāvānvitāyāḥ sadā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epaurvā parya paramparā prachalita prājya pramūrttā kṛteḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakter nirmala-nirjharasya nibhṛtaṁ saṁrakṣakaṁ sādaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande śrī-gurudevam ānata-śirā āchārya-varyaṁ nijam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI bow my head in eternal obeisance to my Gurudev, the best of Āchāryas, Śrīla Bhakti Nirmal Āchārya Mahārāj. He is the ever vigilant, stalwart guardian of the current of pure devotion whose highest form flows from our most worshippable Śrī Rūpānuga Guru-varga in their exclusive dedication to Mahābhāva, Śrīmatī Rādhārāṇī.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egurvvābhīṣṭa-supūrakaṁ guru-gaṇair āśīṣa-saṁbhūṣitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echintyāchintya-samasta-veda-nipuṇaṁ śrī-rūpa-panthānugam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egovindābhidham ujjvalaṁ vara-tanuṁ bhakty anvitaṁ-s
