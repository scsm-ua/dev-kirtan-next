sp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(aparādhera vichāra to nāi he)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(takhan) kṛṣṇa-nāme ruchi habe, ghuchibe bandhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(anurāg to habe he)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThen my offences will go away and I will attain the wealth of divine love. (In the Names of Nitāi and Chaitanya, there is no consideration of offences.) Then I will develop taste for Kṛṣṇa’s Name and my bondage will be destroyed. (Then I will have loving attachment.)\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(takhan) anāyāse saphal habe jīvera jīvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(naile jīvan to michhe he)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(kṛṣṇa-rati vinā jīver jīvan to michhe he)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(śeṣe) vṛndāvane rādhā-śyāmer pābe daraśana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gaura-kṛpā hale he)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThen easily the life of the soul will be successful. (Without attachment to Kṛṣṇa, a soul’s life is simply false.) Then, at the end of life, a soul will see Śrī Śrī Rādhā-Śyām in Vṛndāvan (if Śrī Gaura bestows His mercy).\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eGaurāṅga\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-gaurangera-duti-pada-jar-dhana-sampada\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eSāvaraṇa-Śrī-Gaura-mahimā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaurāṅgera duṭi pada\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;yāra dhana sampada\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;se jāne bhakati-rasa-sāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaurāṅgera madhura-līlā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;yāra karṇe praveśilā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hṛdaya nirmala bhela tāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOne whose wealth is Śrī Gaurāṅga’s feet knows the essence of devotion’s rasa. The heart of one who hears Śrī Gaurāṅga’s sweet Pastimes becomes pure.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eye gaurāṅgera nāma laya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāra haya premodaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāre muñi yāi balihāri\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaurāṅga-guṇete jhure\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nitya-līlā tāre sphure\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;se jana bhakati-adhikārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOne who chants Śrī Gaurāṅga’s Name develops divine love. To him, I say, “Bravo!” The eternal Pastimes are revealed to one who cries over Śrī Gaurāṅga’s qualities. Such a soul is qualified for devotion.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaurāṅgera saṅgi-gaṇe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nitya-siddha kari māne\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;se yāya vrajendra-suta-pāśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-gauḍa-maṇḍala-bhūmi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;yebā jāne chintāmaṇi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāra haya vraja-bhūme vāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOne who considers Śrī Gaurāṅga’s associates to be eternally liberated reaches Kṛṣṇa. One who knows the holy land of Gauḍa to be made of wish-fulfilling (spiritual) gemstone resides in the land of Vraja.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaura-prema-rasārṇave\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;se taraṅge yebā ḍube\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;se rādhā-mādhava-antaraṅga\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egṛhe vā vanete thāke\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘hā gaurāṅga’ bale ḍāke\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;narottama māge tāra saṅga\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOne who swims in the waves of the nectarean ocean of divine love for Śrī Gaura is an intimate associate of Śrī Śrī Rādhā-Mādhava. Whether he lives in a house or in the forest, Narottam Dās begs for the association of one who calls, ‘O Gaurāṅga!’\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-emona-durmati-samsara-bhitore\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eDainyātmikā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(prabhu he!)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eemana durmati\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;saṁsāra bhitare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;paḍiyā āchhinu āmi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava nija-jana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kona mahājane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pāṭhāiyā dile tumi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Lord! I am very wicked-minded and have fallen into this material world, but You have sent a great soul, Your associate (to rescue me).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edayā kari more\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;patita dekhiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kahila āmāre giyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eohe dīna-jana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śuna bhāla kathā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ullasita ha’be hiyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSeeing me so fallen and being merciful, he came to me and said, “O humble soul, listen to this wonderful message and your heart will rejoice.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāre tārite\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-kṛṣṇa-chaitanya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;navadvīpe avatāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomā hena kata\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dīna-hīna jane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;karilena bhava-pāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Śrī Kṛṣṇa Chaitanya has appeared in Nabadwīp to deliver you. He has brought many humble souls just like you to the shore of the ocean of material existence.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evedera pratijñā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rākhibāra tare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rukma-varṇa vipra-suta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emahāprabhu nāme\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nadīyā mātāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(mahāprabhu nāme\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jagata mātāya)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;saṅge bhāi avadhūta\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“To fulfil the prophecies of the Vedas, He has appeared with a golden complexion as a brāhmaṇ’s son bearing the name ‘Mahāprabhu’ and driven all of Nadia (all the world) mad with divine love in the company of His brother Nityānanda.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enanda suta yini\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chaitanya gosāñī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nija-nāma kari’ dāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etārila jagat\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tumi-o yāiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;laha nija paritrāṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Śrī Chaitanya, who is Kṛṣṇa Himself, has distributed His own Name and delivered the world. Go also and accept your deliverance.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ese kathā śuniyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āsiyāchhi, nātha!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra charaṇa-tale\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakati-vinoda\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kā̐diyā kā̐diyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āpana-kāhinī bale\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Lord, hearing this message, Bhakti Vinod has come to the soles of Your feet. Crying, he tells his story.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gay-gora-madhur-svare\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Nāma \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egāya gorā madhur svare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGaurasundar sings in a sweet voice:\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e“hare kṛṣṇa hare kṛṣṇa kṛṣṇa kṛṣṇa hare hare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehare rāma hare rāma rāma rāma hare hare”\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egṛhe thāka, vane thāka\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esadā ‘hari’ bale’ ḍāka\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esukhe duḥkhe bhulo nāka\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evadane hari-nām kara re\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eStay at home, or stay in a forest, regardless, always call out ‘Hari!’ In happiness and in sadness, don’t forget: chant the Lord’s Name aloud.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emāyā-jāle baddha ha’ye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāchha michhe kāja la’ye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eekhan-o chetana peye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhā-mādhav-nām bala re\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBound in Māyā’s net, you work in vain. Now, while you are still conscious, chant ‘Rādhā-Mādhava’.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejīvana ha-ila śeṣa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enā bhajile hṛṣīkeśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhaktivinod-upadeśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eek-bār nām-rase māta re\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYour life is ending, but you have not served Hṛṣīkeś. Bhakti Vinod advises: once relish His Name’s nectar.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vimala-hemajin-tanu-anupama-re\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eVimala hema jini \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Vṛndāvan Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evimala hema jini\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tanu anupama re!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāhe śobhe nānā phula-dāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekadamba keśara jini\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ekaṭī pulaka re!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāra mājhe bindu bindu ghāma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHis unparalleled form surpasses the purest gold! He is decorated with a garland of assorted flowers. His erect hairs surpass kadamba filaments! He is covered with beads of sweat.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejini mada-matta hāti\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gamana manthara ati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhāvāveśe ḍhuli ḍhuli yāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003earuṇa-vasana chhavi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jini prabhātera ravi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gorā-aṅge laharī khelāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHis slow movements surpass those of an intoxicated elephant. Rapt in ecstasy, He sways to and fro. The splendour of His saffron garments surpasses the morning sun. Waves play across His golden form.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echalite nā pāre gorā-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chā̐d go̐sāñi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;balite nā pāre ādha-bola\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhāvete āveśa haiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hari hari bolāiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āchaṇḍāle dhari’ deya kola\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLord Gorāchā̐d cannot move! He cannot speak! He simply stammers. Rapt in ecstasy, He induces outcastes to chant ‘Hari! Hari!’ and He embraces them.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ee sukha-sampada-kāle\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gorā nā bhajinu hele\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hena pade nā karinu āśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-kṛṣṇa-chaitanya-chandraṭhākura śrī-nityānanda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;guṇa gāya vṛndāvana dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAt this joyful, fortunate time, neglectfully I did not serve Gorāchā̐d or aspire for His feet. Vṛndāvan Dās sings the glories of Śrī Kṛṣṇa Chaitanyachandra and Ṭhākur Śrī Nityānanda.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-emona-gauranga-bine-nahi-ara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eEmana Gaurāṅga vine nāhi āra \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Premānanda Dās\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;emana gaurāṅga vine nāhi āra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehena avatāra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;habe ki hayechhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hena prema parachāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThere is no one like Gaurāṅga! Has there ever been and will there ever be an Avatār who distributes divine love like Him?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(hay ni ār habār nay re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOh! There has never been and never will be!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eduramati ati\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;patita pāṣaṇḍī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prāṇe nā mārila kāre\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehari-nāma diye\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hṛdaya śodhila\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;yāchi giyā ghare ghare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe did not kill the fallen, wicked-hearted sinners; He gave them the Lord’s Name and purified their hearts. He went from house to house and begged them (to accept divine love).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(ke nibi ke nibi bale)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(yeche yeche yeche beḍāy)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Who will take? Who will take? He goes out asking, asking, and asking.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhava-viriñchira\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vāñchhita ye prema\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jagate phelila ḍhāli\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(bhava viriñchira yā vāñchhā kare)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekāṅgale pāiye\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;khāila nāchiye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bājāiye karatāli\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe freely distributed throughout the world divine love that is desired by even Brahmā and Śiva. The poor received and relished it, dancing and clapping their hands.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(karatāli bājāiye)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(gaurahari hari bale\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;karatāli bājāiye)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eClapping their hands! Chanting, “Gaurahari Hari!” and clapping their hands!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehāsiye kā̐diye\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;preme gaḍāgaḍi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pulake vyāpila aṅga\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echaṇḍāle brāhmaṇe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kare kolākuli\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kabe vā chhila e raṅga\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eFilled with divine love, they laughed, cried, and rolled about. Their body hair stood on end. The brāhmaṇs and the outcastes embraced. When were there ever such Pastimes?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(chaṇḍāle brāhmaṇe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kare kolākuli\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;e raṅga kabe vā chhila)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe brāhmaṇs and the outcastes embraced. When were there ever such Pastimes?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eḍākiye hā̐kiye\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;khola-karatāle\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gāiye dhāiye phire\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edekhiyā śamana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tarāsa pāiye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kapāṭa hānila dvāre\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHowling and calling out, they sang and ran about with mṛdaṅgas and kartāls. Seeing this, Yamarāj became afraid and closed his doors and shutters.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(bhaja bhaja gaurahari yā̐ra nāme śamaṇa palāy)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eServe! Serve Gaurahari! Yamarāj flees from His Name.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ee tina bhuvana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ānande bharila\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;uṭhila maṅgala-sora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe three worlds filled with joy, and an auspicious tumult arose.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(ānander ār sīmā nāi re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(gauraharir āgamane\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ānander ār sīmā nāi re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(nirānanda dūre gela\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ānander ār sīmā nāi re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(gauraharir āgamane\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;premānander udaya hala)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(premānander udaya hala\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sabāi mile haribola)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThere is no limit to our joy! By Gaurahari’s arrival, there is no limit to our joy! All unhappiness has gone away, and there is no limit to our joy! By Gaurahari’s arrival, the joy of divine love has arisen, and everyone together chants “Hari!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekahe premānanda\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;emana gaurāṅge\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rati nā janmila mora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePremānanda says, “I never developed attachment to Lord Gaurāṅga.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(āmār rati-mati hala nā ye)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(eman dayāl prabhu avatāre, āmār rati-mati hala nā re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(eman dayāl prabhu esechhila, āmār rati-mati hala nā re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(gaurahari hari bala)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI never developed attachment. I never developed attachment to this most merciful Lord. This most merciful Lord has come, but I have never developed attachment to Him. Oh! Chant, “Gaurahari!”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-ke-jabi-ke-jabi-bhai-bhava-sindhu-para\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eKe yābi ke yābi \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Lochan Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eke yābi ke yābi bhāi bhava-sindhu pāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhanya kali-yuge re chaitanya-avatāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWho will cross, O brother, who will cross the ocean of material existence? Oh! The fortune of this Age of Kali is the appearance of Śrī Chaitanya.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eāmāra gaurāṅger ghāṭe ujānakheyā vaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekaḍipāti nāhi lāge amani pāra haya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAt my Lord Gaurāṅga’s ghāṭ the upstream ferry runs without requesting any fare. Everyone crosses freely.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari-nāmera tarīkhāni śrī-guru-kāṇḍārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaṅkīrtana-keroyāla du’bāhu pasāri\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe Lord’s Names are the ferryboat, Śrī Guru is the captain, and the outstretched arms in the saṅkīrtan are the oars.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esarva-jīva uddhāra haila premera vātāse\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elochana paḍiyā raila karamera doṣe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll souls have thus been delivered by the winds of divine love. Only Lochan Dās has fallen and remained behind, as a result of his sins.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-avatara-sara-gora-avatara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eAvatāra Sāra \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Lochan Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eavatāra sāra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gorā avatāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kena nā bhajili tā̐re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekari’ nīre vāsa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gela nā piyāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āpana karama phere\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Gaura Avatār is the best of all Avatārs. Why don’t you serve Him? O mind, you resided beside water, but did not quench your thirst. You returned to your selfishness.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekaṇṭakera taru\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadāi sevili (mana)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;amṛta pā’bāra āśe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-kalpataru\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī gaurāṅga āmāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāhāre bhavili viṣe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO mind, desiring to drink nectar, you constantly chewed thorned wood (and mistook the blood in your mouth for nectar). My Lord Gaurāṅga is a wish-fulfilling tree of divine love, but you considered Him to be poison.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esaurabhera āśe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;palāśa ś.kili (mana)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāsāte paśila kīṭa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘ikṣu-daṇḍa’ bhāvi’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kāṭha chuṣili (mana)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kemane pāibi miṭha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO mind, seeking a fragrance, you smelled the odourless palāśa flower, and insects entered your nose. O mind, considering it sugarcane, you sucked dry wood. How will you taste sweetness in this way?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘hāra’ baliyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;galāya parili (mana)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śamana kiṅkara sāpa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘śītala’ baliyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āguna pohāli (mana)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pāili vajara-tāpa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO mind, considering it a necklace, you wore death’s attendant serpent around your neck. O mind, considering it to be cooling, you embraced fire and received a scorching burn.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esaṁsāra bhajili\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-gaurāṅga bhulili\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā śunili sādhura kathā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eiha-parakāla\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dukāla khoyāli (mana)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;khāili āpana māthā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYou served your family (mundane ends), forgot Śrī Gaurāṅga, and never listened to the sādhus’ words. O mind, you wasted both this life and your next life. You depraved yourself.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gaura-pahu-na-bhajiya-mainu\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eGaurā Pahu̐ \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaurā pahu̐ nā bhajiyā mainu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema ratana-dhana helāya hārāinu\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNot serving Lord Gaurāṅga, I have died. Negligently I have lost the treasured jewel of divine love.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eadhane yatana kari dhana teyāginu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāpana karama-doṣe āpani ḍubinu\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI have endeavoured for worthless things and rejected real wealth. I have drowned myself in my own sins.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esat-saṅga chhāḍi’ kainu asate vilāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ete-kāraṇe lāgila ye karma-bandha-phā̐sa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI have avoided the sādhus’ association and enjoyed with wicked people. Thus I have become bound in the noose of my karma.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eviṣaya-viṣama-viṣa satata khāinu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaura-kīrtana rase magana nā hainu\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI have constantly drunk the terrible poison of mundanity and never become immersed in the nectar of Śrī Gaurāṅga’s kīrtan.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekena vā āchhaye prāṇa ki sukha lāgiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enarottama dāsa kena nā gela mariyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhy am I alive? For the sake of what happiness? Why has Narottam Dās not already died?\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jadi-gaura-na-hoto-tobe-ki-hoito\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eYadi Gaura nā ho’to \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Vāsudev Ghoṣ\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyadi, gaura nā ha’ta\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tabe ki ha-ita\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kemane dharitām de\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhāra mahimā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prema-rasa-sīmā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jagate jānāta ke?\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIf Śrī Gaura had not come, what would have happened? How would we have maintained our lives? Who would have revealed to the world Śrī Rādhā’s glory and the extremes of Her ecstatic divine love?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(rādhār mahimā ke jānata)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(gaura yadi nā āsita rādhār mahimā ke jānata)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWho would have known Śrī Rādhā’s glory? If Śrī Gaura would not have come, who would have known Śrī Rādhā’s glory?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emadhura vṛndā-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vipina mādhurī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;praveśa chāturī sāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaraja-yuvatī\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhāvera bhakati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śakati ha-ita kāra?\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWho would have the great expertise needed to enter into the sweetness of sweet Vṛndāvan? Who would have any qualification for the Vraja-gopīs’ ecstatic devotion?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egāo punaḥ punaḥ\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gaurāṅgera guṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sarala kariyā mana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ee bhava-sāgare\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;emana dayāla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā dekhiye eka-jana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSing Gaurāṅga’s glories again and again, keeping your heart simple. In the ocean of this material world, no one has ever seen anyone so merciful.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(āmi) gaurāṅga baliyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā genu galiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kemane dharinu de\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evāsura-hiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pāṣāṇa diyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(vidhi) kemane gaḍiyāchhe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI chant ‘Gaurāṅga’, but have not melted (with love). How have I maintained this body? How has Providence made Vāsu a stone rather than a heart?\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eKṛṣṇa\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-gopinath-mama-nivedana-shiuno\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eNivedana \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003ePart 1\u003c/h3\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, mama nivedana śuna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eviṣayī durjana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadā kāma-rata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kichhu nāhi mora guṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, hear my prayer. I am a wicked, constantly covetous materialist. I do not have any good qualities.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, āmāra bharasā tumi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomāra charaṇe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;la-inu śaraṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra kiṅkara āmi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, You are my hope. I have taken shelter at Your feet. I am Your servant.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, kemane śodhibe more\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enā jāni bhakati\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;karme jaḍa-mati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;paḍechhi saṁsāra ghore\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, how will You purify me? I do not understand devotion and my materialistic mind is absorbed in karma. I have fallen into this dark world.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, sakali tomāra māyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāhi mama bala\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jñāna sunirmala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;svādhīna nahe e kāyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, everything is Your illusion. I have no strength or transcendental knowledge, and this body of mine is not independent (of material nature’s control).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, niyata charaṇe sthāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emāge e pāmara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kā̐diyā kā̐diyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;karahe karuṇā dāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, weeping and weeping, this sinner begs for an eternal place at Your feet. Please give him Your mercy.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, tumi ta sakali pāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edurjane tārite\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra śakati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ke āchhe pāpīra āra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, You can do anything. You have the power to deliver sinners, and who is a greater sinner than myself?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, tumi kṛpā-pārābāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejīvera kāraṇe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āsiyā prapañche\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;līlā kaile suvistāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, You are an ocean of mercy. You came into this world and performed Your Pastimes for the sake of the fallen souls.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, āmi ki doṣera doṣī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003easura sakala\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pāila charaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vinoda thākila vasi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, am I the greatest sinner of all? All the demons reached Your feet, and only this Bhakti Vinod remained sitting here.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gopinath-ghuchao-samsara-jvala\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eNivedana \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003ePart 2\u003c/h3\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, ghuchāo saṁsāra-jvālā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eavidyā-yātanā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āra nāhi sahe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;janama-maraṇa-mālā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, remove the suffering of saṁsāra. I can no longer tolerate the pain of ignorance or the cycle of birth and death.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, āmi ta’ kāmera dāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eviṣaya-vāsanā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jāgichhe hṛdaye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;phā̐dichhe karama phā̐sa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, I am a servant of lust. Worldly desires have awakened in my heart, and the noose of karma has tightened around my neck.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, kabe vā jāgiba āmi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekāma-rūpa ari\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dūre teyāgiba\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hṛdaye sphuribe tumi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, when will I wake up? When will I abandon my enemy—lust? When will You appear in my heart?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, āmi ta’ tomāra jana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomāre chhāḍiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;saṁsāra bhajinu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhuliyā āpana-dhana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, I am Yours, but I have abandoned You and engaged in worldly life, forgetting my actual wealth.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, tumi ta’ sakali jāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāpanāra jane\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;daṇḍiyā ekhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-charaṇe deha sthāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, You know everything. Having now punished Your servant, give him a place at Your holy feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, ei ki vichāra tava\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evimukha dekhiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chhāḍa nija-jane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā kara karuṇā-lava\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, is this Your judgement? Seeing me averse to You, You abandon Your servant and do not grant him even a trace of mercy?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, āmi ta’ mūrakha ati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekise bhāla haya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kabhu nā bujhinu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāi hena mama gati\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, I am very foolish. I have never understood what is good for me. Therefore my condition is such.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, tumi ta’ paṇḍita-vara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emūḍhera maṅgala\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadā anveṣibe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;e dāse nā bhāva para\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, You are the wisest person. Always try to uplift this fool and do not consider this servant an outsider.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gopinath-amara-upaya-nai\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eNivedana \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003ePart 3\u003c/h3\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, āmāra upāya nāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etumi kṛpā kari\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āmāre la-ile\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;saṁsāre uddhāra pāi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, I have no way out. Only if You mercifully take me will I be delivered from this world.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, paḍechhi māyāra phere\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhana, dārā, suta\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ghirechhe āmāre\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kāmete rekhechhe jere\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, I have fallen into Māyā’s perils. Wealth, wife, and children have surrounded me, and lust has ruined me.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, mana ye pāgala mora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enā māne śāsana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadā achetana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;viṣaye rayechhe bhora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, my mind is crazy and does not submit to discipline. It is always senseless and has remained engrossed in mundanity.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, hāra ye menechhi āmi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eaneka yatana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ha-ila viphala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ekhana bharasā tumi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, I have accepted defeat. All of my endeavours were useless. Now You are my hope.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, kemane ha-ibe gati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprabala indriya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vaśī-bhūta mana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā chhāḍe viṣaya-rati\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, how shall I progress? My mind is controlled by my powerful senses and does not abandon its attachment to mundanity.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, hṛdaye vasiyā mora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emanake śamiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;laha nija-pāne\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ghuchibe vipada ghora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, sit down in my heart, subdue my mind, and bring me towards You. Dispel all danger and darkness.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, anātha dekhiyā more\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etumi hṛṣīkeśa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hṛṣīka damiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāra’ he saṁsṛti-ghore\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, You are the Lord of the senses. Seeing me so helpless subdue my senses and deliver me from this dark world.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, galāya legechhe phā̐sa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛpā-asi dhari’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bandhana chhediyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vinode karaha dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gopīnāth, a noose has been tied around my neck. Taking up the sword of Your mercy, cut away this bondage and make Bhakti Vinod Your humble servant.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(he govinda! gopīnātha!)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(ei bār āmāy dayā kara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;he govinda! gopīnātha!)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(bahu janme aparādhī\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;he govinda! gopīnātha!)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(lakṣa lakṣa janam gela\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;he govinda! gopīnātha!)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(śrī charaṇe śaraṇ nilām\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;he govinda! gopīnātha!)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(śrī charaṇe sevā diyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;he govinda! gopīnātha!)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Govinda! O Gopīnāth! This time be merciful. I have been an offender for many births. Million of births have passed. Give me the shade of Your feet. I have surrendered at Your feet. Give me the service of Your feet. O Govinda! O Gopīnāth!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hari-he-dayala-mora-jaya-radha-natha\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eDainya O Prapatti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari he dayāla mora jaya rādhā-nātha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebāra bāra ei-bāra laha nija sātha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO merciful Lord! All glory to You, Rādhā’s Lord! Again and again I pray to You. This time take me as Your own.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebahu yoni bhrami’ nātha! la-inu śaraṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enija-guṇe kṛpā kara adhama tāraṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Lord! After wandering through many wombs, I have taken shelter of You. Be merciful and deliver this fallen soul by Your divine power.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejagata-kāraṇa tumi jagata-jīvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomā chhāḍā kāro na’hi he rādhā-ramaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYou are the world’s cause and life. Without You, no one has anything, O Lover of Rādhā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhuvana-maṅgala tumi bhuvanera pati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etumi upekṣile nātha! ki ha-ibe gati\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYou are the world’s auspiciousness and master. O Lord! If You neglect me, what will be my fate?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhāviyā dekhinu ei jagata mājhāre\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomā vinā keha nāhi e dāse uddhāre\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI have understood that in this world there is no one but You to deliver this servant.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-manasa-deho-geho-jo-kichu-mora\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eMānasa Deha Geha \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emānasa, deha, geha, yo kichhu mora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003earpilu̐ tuyā pade nanda-kiśora!\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI have offered my mind, my body, my household, and whatever else may be mine at Your feet, O Nanda Kiśor!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esampade vipade jīvane-maraṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edāy mama gelā tuyā o-pada varaṇe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIn good times and in bad, in life and in death, all my responsibility has gone away by embracing Your feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emārabi rākhabi—yo ichhā tohārā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enitya-dāsa prati tuyā adhikārā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKill me or protect me as You wish. You have full authority over Your eternal servant.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejanmāobi maye ichhā yadi tora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakta-gṛhe jani janma ha-u mora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIf You desire that I take birth again, let me do so in the home of Your devotee.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekīṭa-janma ha-u yathā tuyā dāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebahir-mukha brahma-janme nāhi āśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLet me be born again even as a worm, so long as I can remain Your servant. I have no desire to be born even as Brahmā if I will be averse to You.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhukti-mukti-spṛhā vihīna ye bhakta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elabha-ite tā̐ka saṅga anurakta\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI long to attain the association of devotees who are completely free from all desire for selfish enjoyment and liberation.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejanaka, jananī, dayita, tanaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprabhu, guru, pati—tuhu̐ sarva-maya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eFather, mother, lover, son, Lord, Guru, and husband—You are everything to me.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakati-vinoda kahe, śuna kāna!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhā-nātha! tuhu̐ hāmāra parāṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBhakti Vinod says, “Please listen, O Kān! O Rādhānāth! You are my life and soul.”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-bhajahu-re-mana-shri-nanda-nandana\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eBhajahu̐ Re Mana \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Govinda Dās Kavirāj\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhajahu̐ re mana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-nanda-nandana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;abhaya-charaṇāravinda re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edurlabha mānava\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;janama sat-saṅge\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;taraha e bhava-sindhu re\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO mind, serve the son of Nanda’s lotus feet, which make one fearless. Having attained this rare human birth, cross over the ocean of material existence by associating with sādhus.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśīta ātapa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vāta variṣaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;e dina yāminī jāgi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eviphale sevinu\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛpaṇa durajana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chapala sukha-lava lāgi’ re\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDay and night I remain awake, suffering from the heat and the cold, the wind and the rain. For a moment of flickering happiness I have uselessly served wicked and miserly men.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ee dhana, yauvana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;putra, parijana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ithe ki āchhe paratīti re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekamala-dala-jala\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jīvana ṭalamala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(ei āchhe ei nāi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jīvana ṭalamala)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhajahu̐ hari-pada niti re\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhat is there in having wealth, youth, sons, and family? Life is tottering like water on a lotus petal (it is here, and then it is gone). O mind, serve the Lord’s feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśravaṇa, kīrtana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;smaraṇa, vandana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pāda-sevana, dāsya re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epūjana, sakhī-jana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ātma-nivedana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;govinda-dāsa-abhilāṣa re\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGovinda Dās desires to engage in the nine practices of devotion: hearing about, glorifying, remembering, praying to, attending to, serving, worshipping, befriending, and surrendering to the Lord.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-radha-madhava-kunja-bihari\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eJaya Rādhā-Mādhava \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(jaya) rādhā-mādhava\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(jaya) kuñja-vihārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(jaya) gopī-jana-vallabha\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(jaya) giri-vara-dhārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(jaya) yaśodā-nandana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(jaya) vraja-jana-rañjana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(jaya) yāmuna-tīra-vana-chārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to Śrī Rādhā’s Mādhava, who sports in the groves of Vraja! All glory to the gopīs’ beloved, the lifter of Govardhan Hill! All glory to Yaśodā’s darling son, the delight of Vraja’s residents! All glory to He who plays in the forests along the banks of the Yamunā!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-yashoda-nandana-krishna-gopala-govinda\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eJaya Yaśodā-Nandana Kṛṣṇa \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(jaya) yaśodā-nandana kṛṣṇa gopāla govinda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(jaya) madana-mohana hari ananta mukunda\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to Yaśodā’s darling son, Kṛṣṇa, who protects and pleases the cows! All glory to the enchanter of Cupid, the infinite Lord, who takes away all inauspiciousness and grants liberation!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(jaya) achyuta mādhava rāma vṛndāvana-chandra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(jaya) muralī-vadana śyāma gopī-janānanda\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to the infallible Lord, the moon of Vṛndāvan, who pleases Śrī Rādhā! All glory to the dark Flute Player, the ecstasy of the gopīs!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-mayura-mukuta-pitambara-dhari\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eMayūra mukuṭa \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emayūra-mukuṭa-pītāmbara-dhārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emuralī-dhara govardhana-dhārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to the flute player, the lifter of Govardhan Hill, He who wears a peacock feather crown and yellow garments!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-rādhā-mādhava kuñja-vihārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emuralī-dhara govardhana-dhārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to the flute player, the pifter of Govardhan Hill, Rādhā’s beloved Mādhava, He who enjoys in the forest groves!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(jaya) yaśodā-nandana kṛṣṇa murāri\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emuralī-dhara govardhana-dhārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to the flute player, the lifter of Govardhan Hill, Kṛṣṇa, Murāri, Yaśodā’s darling son!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(jaya) gopī-jana-vallabha vaṁśī-vihārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emuralī-dhara govardhana-dhārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to the flute player, the lifter of Govardhan Hill, the gopīs’ beloved, He who plays the vaṁśī flute!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-he-deva-bhavantam-vande\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eHe deva bhavantaṁ vande \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Rūpa Goswāmī Prabhu\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehe deva bhavantaṁ vande\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eman-mānasa-madhukaram arpaya nija-pada-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epaṅkaja-makarande\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Lord, I offer my obeisance unto You. Please place the bee of my heart in the honey of Your lotus feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyadapi samādhiṣu vidhir api paśyati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ena tava nakhā gramarīchim\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eidam ichāmi niśamya tavāchyuta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etad api kṛpādbhuta vīchim\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Achyuta! Although even Brahmā, in samādhi, cannot see the lustre of the tips of Your toenails, I have heard of the waves of Your wonderful mercy and I desire to see it.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhaktir udañchati yad api mādhava\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ena tvayi mama tila-mātrī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eparameśvaratā tad api tavādhika-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edurghaṭa-ghaṭana-vidhātrī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Mādhava! Although I don’t have even a sesame seed of devotion to You, Your supreme power is the creator of even more improbable miracles.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eayam avilolatayādya sanātana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekalitādbhuta-rasa-bhāram\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enivasatu nityam ihāmṛta-nindini\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evindan madhurima-sāram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO eternal Lord, may the bee of my heart steadily reside eternally at Your lotus feet, where there is an abundance of the most wonderful honey—which surpasses the nectar of immortality—and thus attain the ultimate sweetness.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-janama-saphala-tara-krishna-darashiana-jara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eRūpa-Kīrtan \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejanama saphala tā’ra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛṣṇa-daraśana yā’ra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhāgye ha-iyāchhe eka-bāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evikaśiyā hṛn-nayana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kari’ kṛṣṇa daraśana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chhāḍe jīva chitera vikāra\u003
