ur, established the religion of the age, Kṛṣṇa-saṅkīrtan, and is the chief minister of the universal assembly of leading Vaiṣṇavas. His lotus feet are worshipped by millions of virtuous souls and fulfil the desires of those who dispel souls’ fears. Eternally I offer my obeisance to my master’s worshippable feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhajanorjjita-sajjana-saṅgha-patiṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epatitādhika-kāruṇikaika-gatim\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egati-vañchita-vañchakāchintya-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe is the leader of the great souls who are endowed with devotion and the sole, greatly merciful shelter for the fallen. His inconceivable feet are the shelter of even the deceitful by deceiving them. Eternally I offer my obeisance to my master’s lotus feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eatikomala-kāñchana-dīrgha-tanuṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etanu-nindita-hema-mṛṇāla-madam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emadanārvuda-vandita-chandra-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHis long, supple, golden form crushes the pride of golden lotus stems. His moon-like feet are worshipped by millions of Cupids. Eternally I offer my obeisance to them.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enija-sevaka-tāraka-rañji-vidhuṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evidhutāhita-huṅkṛta-siṁha-varam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaraṇāgata-bāliśa-śanda-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe is the moon that delights his star-like servants. His great, lion-like roar scares away the inimical. His feet bestow auspiciousness upon the simple who accept them. Eternally I offer my obeisance to my master’s feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evipulīkṛta-vaibhava-gaura-bhuvaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhuvaneṣu vikīrtita-gaura-dayam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edayanīya-gaṇārpita-gaura-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe reveals the divine glory of Śrī Gaura Dhām, propounds Śrī Gaura’s celebrated grace throughout the world, and installs Śrī Gaura within the hearts of the recipients of his grace. Eternally I offer my obeisance to my master’s feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echira-gaura-janāśraya-viśva-guruṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eguru-gaura-kiśoraka-dāsya-param\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eparamādṛta-bhaktivinoda-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe is the eternal shelter of the souls surrendered unto Śrī Gaura and the Guru of the world. He is dedicated to the service of his Guru, Śrīla Gaura Kiśor, and completely devoted to Śrīla Bhakti Vinod. Eternally I offer my obeisance to my master’s feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eraghu-rūpa-sanātana-kīrtti-dharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edharaṇī-tala-kīrttita-jīva-kavim\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekavirāja-narottama-sakhya-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe expounds the glory of Śrī Rūpa, Śrī Sanātan, and Śrī Raghunāth. In this world he is glorified as being nondifferent from Śrī Jīva and a counterpart of Śrīla Kṛṣṇadās Kavirāj and Śrīla Narottam Ṭhākur. Eternally I offer my obeisance to my master’s feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛpayā hari-kīrtana-mūrti-dharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edharaṇī-bhara-hāraka-gaura-janam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejanakādhika-vatsala-snigdha-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe is the embodiment of Hari-kīrtan. He mercifully relieves Mother Earth of the burden upon her. He is an associate of Śrī Gaura, and more kind and affectionate than a father. Eternally I offer my obeisance to my master’s feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśaraṇāgata-kiṅkara-kalpa-taruṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etaru-dhik-kṛta dhīra vadānya varam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaradendra-gaṇārchita-divya-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe is a wish-fulfilling tree for the surrendered servants. His benevolence and tolerance shame even a tree’s. The demigods and sages worship his divine feet. Eternally I offer my obeisance to my master’s feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eparahaṁsa-varaṁ paramārtha-patiṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epatitodharaṇe kṛta-veśa-yatim\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyati-rāja-gaṇaiḥ parisevya-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe is the best of the paramahaṁsas and the guardian of the supreme wealth (Kṛṣṇa-prema). He accepted the robes of a sannyāsī to deliver the fallen. His feet are served by the best of the sannyāsīs. Eternally I offer my obeisance to my master’s feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evṛṣabhānu-sutā-dayitānucharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echaraṇāśrita-reṇu-dharas tam aham\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emahad-adbhuta-pāvana-śakti-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe is Śrīmatī Rādhārāṇī’s beloved servant. I hold on my head the dust of his tremendous, wondrously purifying feet and eternally offer my obeisance to them.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eŚrī Śrī Prema-dhāma-deva Stotram\u003c/h1\u003e\n\u003csection class=\"song\" i lass=\"verse\"\u003e\u003cstrong\u003esaśraddhaḥ sapta-daśakaṁ prema-dhāmeti-nāmakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003estavaṁ ko ’pi paṭhan gauraṁ rādhā-śyāma-mayaṁ vrajet\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"72\"\u003e\n\u003ch5\u003e72\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epañchame śata-gaurābde śrī-siddhānta-sarasvatī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrīdharaḥ ko ’pi tach chhiṣyas tridaṇḍī nauti sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eHoly Days\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-krishna-hoite-chatur-mukha\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Guru-paramparā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eVerses 1-9 composed by Śrīla Saraswati Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛṣṇa haite chatur-mukha\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hana kṛṣṇa-sevonmukha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;brahmā haite nāradera mati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enārada haite vyāsa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;madhva kahe vyāsa dāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pūrṇaprajña padmanābha gati\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBy Kṛṣṇa’s association, Brahmā became devoted to Kṛṣṇa’s service. By Brahmā’s association, Nārad Muni became devoted. After Nārad came Kṛṣṇa Dvaipāyan Vedavyās. Pūrṇaprajña Madhva Āchārya declared he was Vyāsa’s servant. He was Padmanābha Tīrtha’s Guru.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enṛhari mādhava-vaṁśe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;akṣobhya paramahaṁse\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śiṣya bali’ aṅgīkāra kare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eakṣobhyera śiṣya jaya-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tīrtha nāme parichaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tā̐ra dāsye jñānasindhu tare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNṛhari Tīrtha and Mādhava Tīrtha were also disciples in Madhva Āchārya’s line. Mādhava Tīrtha accepted the paramahaṁsa Akṣobhya Tīrtha as his disciple. Akṣobhya Tīrtha’s disciple was Jaya Tīrtha. Jaya Tīrtha’s servant was Jñānasindhu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etā̐hā haite dayānidhi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tā̐ra dāsa vidyānidhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rājendra ha-ila tā̐hā haite\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etā̐hāra kiṅkara jaya-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dharma nāme parichaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;paramparā jāna bhāla mate\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAfter Jñānasindhu came Dayānidhi. Dayānidhi’s servant was Vidyānidhi. After Vidyānidhi came Rājendra. Rājendra’s servant was Jaya Dharma. Know the paramparā properly in this way.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejayadharma-dāsye khyāti\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī puruṣottama-yati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tā̐’ha’te brahmaṇya-tīrtha sūri\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evyāsatīrtha tā̐ra dāsa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;lakṣmīpati vyāsa-dāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tā̐hā haite mādhavendra purī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eJaya Dharma’s renowned servant was Śrī Puruṣottam Tīrtha. After Śrī Puruṣottam Tīrtha came the learned Brahmaṇya Tīrtha. Brahmaṇya Tīrtha’s servant was Vyāsa Tīrtha. Vyās Tīrtha’s servant was Lakṣmīpati. After Lakṣmīpati came Mādhavendra Purī.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emādhavendra purī-vara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śiṣya-vara śrī-īśvara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nityānanda, śrī-advaita vibhu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eīśvara-purīke dhanya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;karilena śrī-chaitanya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jagad-guru gaura mahāprabhu\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe best disciples of the great Mādhavendra Purī were Īśvar Purī, Lord Nityānanda, and Lord Śrī Advaita. Jagad-guru Śrī Chaitanya Mahāprabhu blessed Īśvar Purī (by accepting Īśvar Purī as His Guru.)\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emahāprabhu śrī-chaitanya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rādhā-kṛṣṇa nahe anya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rūpānuga janera jīvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eviśvambhara priyaṅkara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī svarūpa-dāmodara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī gosvāmī rūpa-sanātana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Chaitanya Mahāprabhu is nondifferent from Śrī Śrī Rādhā-Kṛṣṇa and is the very life of Śrī Rūpa’s followers. Śrīla Svarūp Dāmodar Goswāmī, Śrīla Rūpa Goswāmī Prabhu, and Śrīla Sanātan Goswāmī Prabhu are most dear to Viśvambhar.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erūpa-priya mahājana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jīva-raghunātha hana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tā̐ra priya kavi kṛṣṇadāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-dāsa-priya-vara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;narottama sevāpara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;yā̐ra pada viśvanātha-āśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Rūpa’s dear followers are the great souls Śrī Jīva and Śrī Raghunāth. Their dear follower is Śrīla Kṛṣṇadās Kavirāj. His dearmost follower is Śrī Narottam, who is ever engaged in divine service. His feet are the aspiration of Śrī Viśvanāth Chakravartī Ṭhākur.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eviśvanātha-bhakta-sātha\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;baladeva jagannātha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tā̐ra priya śrī-bhakti-vinoda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emahā-bhāgavata-vara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-gaura-kiśora-vara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hari-bhajanete yā̐ra moda\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe foremost devotees of Śrīla Viśvanāth Chakravartī Ṭhākur are Śrīla Baladev Vidyābhūṣaṇ and Śrīla Jagannāth Dās Bābājī. Their dear follower is Śrīla Bhakti Vinod Ṭhākur. His associate is the best of the topmost devotees, Śrīla Gaura Kiśor Dās Bābājī, whose sole joy is Śrī Hari’s service.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etadanuga-mahājana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-kṛṣṇa-kīrtana-dhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;yebā dila puri jaga kāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī vārṣabhānavī-varā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadā sevya sevāparā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tā̐hāra dayita-dāsa nāma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe follower of Śrīla Gaura Kiśor Dās Bābājī, the great soul Dayita Dās (Śrīla Saraswatī Ṭhākur), whose wealth is Śrī Kṛṣṇa-kīrtan, fulfilled the desires of the whole world. He is the dearmost of Śrī Vārṣabhānavī and is always engaged in Her service.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etad abhinna deha-divya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;svarūpa-rūpa-raghu-jivya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadā sevya yā̐ra pādapadma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esusiddhānta mūrti-dhara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī śrīdhara guru-vara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rupānuga-sādhu-śreya-sadma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Dayita Dās’ nondifferent divine form, the living manifestation of Śrīla Svarūp Dāmodar, Śrī Rūpa, and Śrī Raghunāth, whose lotus feet are to be served eternally, is the best of Gurus, Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj. He is the embodiment of perfect siddhānta and the ultimate refuge for the sādhus who follow Śrī Rūpa.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etā̐ra priya mano ’bhīṣṭa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sthāpane sadā sacheṣṭa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhakti sundara śrī govinda nāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etā̐ra priya manonīta\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āchāra-prachāre rata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī bhakti-nirmalāchārya nāma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHis dear disciple, who constantly endeavours to fulfil his desires, is Śrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj. Śrīla Govinda Mahārāj’s dear successor, who is devoted to practising and preaching his teachings, is Śrīla Bhakti Nirmal Āchārya Mahārāj.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eei paramparā dhana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sabe gaura-nija-jana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tā̐dera uchchhiṣṭe mora kāma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll the Gurus in this succession are associates of Śrī Gaurāṅga. I pray for their remnants.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-je-anilo-prema-dhana-karuna-prachura\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eViraha-gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eye ānila prema-dhana karuṇā prachura\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehena prabhu kothā gelā āchārya ṭhākura\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhere has Advaita Āchārya, the Lord who mercifully brought the wealth of divine love to this world, gone?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekā̐hā mora svarūpa rūpa kā̐hā sanātana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekā̐hā dāsa raghunātha patita-pāvana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhere are my Svarūp, Rūpa, and Sanātan? Where is my Raghunāth Dās? Where are the saviours of the fallen souls?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekā̐hā mora bhaṭṭa-yuga kā̐hā kavirāja\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eeka-kāle kothā gelā gorā naṭa-rāja\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhere are my Raghunāth Bhaṭṭa and Gopāl Bhaṭṭa? Where is my Kṛṣṇadās Kavirāj? Where has the great dancer Śrī Gaurāṅga suddenly gone?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epāṣāṇe kuṭiba māthā anale paśiba\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaurāṅga guṇera nidhi kothā gele pāba\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI will break my head on a rock, I will enter into fire—where shall I go to reach the reservoir of all qualities, Śrī Gaurāṅga?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ese saba saṅgīra saṅge ye kaila vilāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ese saṅga nā pāñā kānde narottama dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNot finding the association of Śrī Gaurāṅga, who performed His Pastimes with all these associates, Narottam Dās weeps.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-pralaya-payodhi-jale-dhritavan-asi-vedam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Daśāvatār Stotram \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Jayadev Goswāmī\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epralaya-payodhi-jale dhṛtavān asi vedaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evihita-vahitra-charitram akhedam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-mīna-śarīra jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Hari! O Keśava! O Lord of the universe! You have assumed the form of a fish! All glory to You! Easily You acted like a boat and upheld the Vedas above the waters of the cosmic devastation.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṣitir iha vipulatare tiṣṭhati tava pṛṣṭhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edharaṇi-dharaṇa-kina-chakra-gariṣṭhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-kūrma-śarīra jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Hari! O Keśava! O Lord of the universe! You have assumed the form of a tortoise! All glory to You! You upheld Mount Mandara upon Your giant back and thereafter became beautified by the circular scar it left.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evasati daśana-śikhare dharaṇī tava lagnā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśaśini kalaṅka-kaleva nimagnā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-śūkara-rūpa jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Hari! O Keśava! O Lord of the universe! You have assumed the form of a boar! All glory to You! The earth sits fixed atop the tip of Your tusk like a dark spot upon the moon.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etava kara-kamala-vare nakham adbhuta-śṛṅgaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edalita-hiraṇyakaśipu-tanu-bhṛṅgam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-narahari-rūpa jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Hari! O Keśava! O Lord of the universe! You have assumed a half-man, half-lion form! All glory to You! You ripped apart the bee-like body of Hiraṇyakaśipu with the amazingly sharp nails of Your beautiful lotus hands.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echhalayasi vikramaṇe balim adbhuta-vāmana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epada-nakha-nīra-janita-jana-pāvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-vāmana-rūpa jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Hari! O Keśava! O Lord of the universe! You have assumed the form of a dwarf! All glory to You! In the form of an amazing dwarf You deceived Bali Mahārāj with Your giant steps and delivered all souls with the water flowing from Your toenails.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṣatriya-rudhira-maye jagad-apagata-pāpaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esnapayasi payasi śamita-bhava-tāpam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-bhṛgupati-rūpa jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Hari! O Keśava! O Lord of the universe! You have assumed the form of a protector of the sages, Paraśurām! All glory to You! You bathed the world with the blood of the kṣatriyas and absolved all the world’s sins and sorrows.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evitarasi dikṣu raṇe dik-pati-kamanīyaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edaśa-mukha-mauli-baliṁ ramaṇīyam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-rāma-śarīra jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Hari! O Keśava! O Lord of the universe! You have assumed the form of Rāmachandra! All glory to You! During the battle at Laṅka You distributed to all the directions the most pleasing, crowning offering of the ten heads of Rāvaṇ, which were desired by the guardians of the directions.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evahasi vapuṣi viśade vasanaṁ jaladābhaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehala-hati-bhīti-milita jamunābham\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-haladhara-rūpa jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Hari! O Keśava! O Lord of the universe! You have assumed the form of Balarām! All glory to You! On Your white body You wear garments the colour of clouds and the River Yamunā when she is frightened by the striking of Your plough.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enindasi yajña-vidher ahaha śruti-jātaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esadaya-hṛdaya darśita-paśu-ghātam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-buddha-śarīra jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Hari! O Keśava! O Lord of the universe! You have assumed the form of Buddha! All glory to You! Your heart filled with compassion, You decry the scriptural injunctions for animal sacrifice.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emlechchha nivaha-nidhane kalayasi karavālaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhūmaketum iva kim api karālam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-kalki-śarīra jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Hari! O Keśava! O Lord of the universe! You have assumed the form of Kalki! All glory to You! To destroy the wicked You brandish Your stunning, frightening, comet-like sword.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-jayadeva-kaver idam uditam udāraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśṛṇu sukha-daṁ śubha-daṁ bhava-sāram\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-daśa-vidha-rūpa jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Hari! O Keśava! O Lord of the universe! You have assumed ten different forms! All glory to You! O readers, listen to this grand, pleasing, auspicious, extraordinary composition by the poet Śrī Jayadev.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evedān udharate jaganti vahate bhū-golam udbibhrate\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edaityaṁ dārayate baliṁ chhalayate kṣatra-kṣayaṁ kurvate\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epaulastyaṁ jayate halaṁ kalayate kāruṇyam ātanvate\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emlechchhān mūrchchhayate daśākṛti-kṛte kṛṣṇāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tubhyaṁ namaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI offer my obeisance unto Śrī Kṛṣṇa, who assumes ten forms and rescues the Vedas, upholds Mandara Mountain, uplifts the earth, rips apart demons, deceives Bali Mahārāj, kills the kṣatriyas, conquers Rāvaṇ, carries a plough, shows compassion, and annihilates the wicked.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-hari-vasare-hari-kirtana-vidhana\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Harivāsar Gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Vṛndāvan Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī hari-vāsare hari-kīrtana-vidhāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enṛtya ārambhilā prabhu jagatera prāṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOn the holy day of Śrī Hari (Ekādaśī), Śrīman Mahāprabhu, the life and soul of the universe, began dancing.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epuṇyavanta śrīvāsa-aṅgane śubhārambha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003euṭhila kīrtana-dhvani gopāla govinda\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWith the auspicious beginning of the kīrtan in the courtyard of the fortunate Śrīvās, the sound of the chanting, ‘Gopāl!’ ‘Govinda!’ arose.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emṛdaṅga mandirā bāje śaṅkha karatāla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaṅkīrtana saṅge saba ha-ila miśāla\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe sounds of the mṛdaṅgas, cymbals, conchshells, and clapping hands all combined together in the saṅkīrtan.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebrahmāṇḍe uṭhila dhvani pūriyā ākāśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echaudikera amaṅgala yāya saba nāśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe sound of the saṅkīrtan arose and filled the sky, destroying inauspiciousness in all directions.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echatur-dike śrī hari-maṅgala saṅkīrtana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emadhye nāche jagannātha miśrera nandana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMahāprabhu Viśvambhar, the son of Jagannāth Miśra, danced, surrounded by the auspicious Hari-nām-saṅkīrtan on all sides.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esabāra aṅgete śobhe śrī chandana-mālā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eānande nāchaye sabe ha-iye vibholā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEveryone was decorated with sandalwood paste and flower garlands, and danced, overwhelmed with joy.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enijānande nāche mahāprabhu viśvambhara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echaraṇera tāli śuni ati manohara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMahāprabhu Viśvambhar danced in the ecstasy of Himself. Hearing the rhythm of His feet was heart capturing.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhāvāveśe mālā nāhi rahaye galāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echhiṇḍiyā paḍaye giyā bhakatera gāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhile He was rapt in ecstasy, His flower garland could not remain around His neck. It tore and fell as the devotees sang.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyā̐ra nāmānande śiva vasana nā jāne\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyā̐ra rase nāche śiva se nāche āpane\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIn the ecstasy of whose Name Śiva forgets His clothing, in the ecstasy of whom Śiva always dances, that Supreme Lord now dances personally.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyā̐ra nāme vālmīki ha-ila tapodhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyā̐ra nāme ajāmila pāila mochana\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyā̐ra nāme śravane saṁsāra-bandha ghuche\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehena prabhu avatari kali-yuge nāche\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBy whose Name Vālmīki became a powerful sage, by whose Name Ajāmil attained liberation, by hearing whose Name the bondage of material existence is destroyed, that very Lord descends in the Age of Kali and dances.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyā̐ra nāma la-i śuka nārada beḍāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esahasra-vadana-prabhu yāra guṇa gāya\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esarva-mahā-prāyaśchita ye prabhura nāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ese prabhu nāchaye dekhe yata bhāgyavān\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe whose Name Śukadev and Nārad take as they wander about, whose glories the thousand-mouthed Anantadev sings, whose Name is the supreme form of atonement, that Lord now dances and glances upon the fortunate souls.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"14\"\u003e\n\u003ch5\u003e14\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī kṛṣṇa-chaitanya nityānanda-chā̐da\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejāna vṛndāvana dāsa tachhu pada-yuge gāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEmbracing Śrī Kṛṣṇa Chaitanya and Nityānandachā̐d as his life and soul, Vṛndāvan Dās sings the glories of Their lotus feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shiuddha-bhakata-charana-renu\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚuddha-bhakata \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśuddha-bhakata-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;charaṇa-reṇu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhajana-anukūla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakata-sevā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;parama-siddhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prema-latikāra mūla\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe dust of pure devotees’ feet is favourable to devotion. Serving the devotees is the supreme fulfilment and the root of the creeper of divine love.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emādhava-tithi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhakti-jananī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;yatane pālana kari\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-vasati\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vasati bali’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;parama ādare vari\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI carefully observe the holy days related to Mādhava. They are the mother of devotion. With great adoration, I embrace the abode of Kṛṣṇa as my own.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaura āmāra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ye-saba sthāne\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;karala bhramaṇa raṅge\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ese-saba sthāna\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;heriba āmi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;praṇayi-bhakata-saṅge\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIn the company of loving devotees, I behold all the places my Gaurasundar visited during His Pastimes.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emṛdaṅga-vādya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śunite mana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;avasara sadā yāche\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaura-vihita\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kīrtana śuni’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ānande hṛdaya nāche\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMy heart always begs for the opportunity to hear the sound of the mṛdaṅga. Hearing the kīrtan prescribed by Śrī Gaurasundar, my heart dances with joy.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyugala-mūrti\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dekhiyā mora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;parama-ānanda haya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprasāda-sevā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;karite haya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sakala prapañcha jaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBeholding the Deity forms of the Divine Couple, I feel the greatest joy. By honouring prasād, I overcome the entire material illusion.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eye-dina gṛhe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhajana dekhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gṛhete goloka bhāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echaraṇa-sīdhu\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dekhiyā gaṅgā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sukha nā sīmā pāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOn days when I see devotional service taking place in my home, I feel that Goloka has manifested there. Seeing the Ganges, the nectar from the Lord’s feet, my happiness has no limit.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etulasī dekhi’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;juḍāya prāṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mādhava-toṣaṇī jāni’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaura-priya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śāka-sevane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jīvana sārthaka māni\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSeeing Tulasī Devī soothes my soul, for I know she pleases Mādhava. Honouring śāk, Śrī Gaurasundar’s favourite, I consider my life successful.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakativinoda\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛṣṇa-bhajane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;anukūla pāya yāhā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprati-divase\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;parama-sukhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;svīkāra karaye tāhā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhatever Bhakti Vinod obtains that is favourable to Kṛṣṇa’s service, he accepts every day with the greatest joy.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-radhe-jaya-jaya-madhava-dayite\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eAfter parikramā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Rūpa Goswāmī Prabhu\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enagara bhramiyā āmāra gaura ela ghare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaura ela ghare āmāra nitāi ela ghare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhūlā jhāri’ śachīmātā gaura kole kare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eānandete bhakta-gaṇe hari hari bale\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAfter touring the town, my Gaurāṅga came home! My Gaurāṅga and my Nitāi came home! After dusting Him off, Śachī Mātā embraces Gaurāṅga! The devotees joyfully sing “Hari! Hari!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erādhe jaya jaya mādhava-dayite\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egokula-taruṇī-maṇḍala-mahite\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Rādhā! O Beloved of Mādhava! O heroine of the girls of Gokula! All glory to You! All glory to You!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edāmodara-rati-vardhana-veśe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehari-niṣkuṭa-vṛndā-vipineśe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO She who dresses to increase Dāmodar’s attachment! O Queen of Hari’s pleasure groves in Vṛndāvan!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evṛṣabhānūdadhi-nava-śaśi-lekhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elalitā-sakhi guṇa-ramita-viśākhe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO new moon who has arisen from the ocean of King Vṛṣabhānu! O friend of Lalitā! O charmer of Viśākhā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekaruṇāṁ kuru mayi karuṇā-bharite\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esanaka-sanātana-varṇita-charite\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBe merciful to me, O You who are filled with mercy! O She whose glory is sung by Sanaka and Sanātan!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hari-haraye-namah-krishna-yadavaya-namah\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eNām-saṅkīrtan \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari haraye namaḥ kṛṣṇa yādavāya namaḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyādavāya mādhavāya keśavāya namaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Lord, Kṛṣṇa, Yādava, Hari, Mādhava, Keśava, again and again I offer my obeisance to You.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egopāla govinda rāma śrī madhusūdana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egiridhārī gopīnātha madana-mohana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to Gopāl, Govinda, Rām, Śrī Madhusūdan, Giridhārī, Gopīnāth, Madan Mohan!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-chaitanya nityānanda śrī advaitachandra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egadādhara śrīvāsādi gaura-bhakta-vṛnda\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to Śrī Chaitanya, Nityānanda, Advaitachandra, Gadādhar, Śrivās, and all the Lord’s devotees!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya rūpa sanātana bhaṭṭa raghunātha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-jīva gopāla-bhaṭṭa dāsa raghunātha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to Śrī Rūpa, Sanātan, Raghunāth Bhaṭṭa, Śrī Jīva, Gopāl Bhaṭṭa, and Raghunāth Dās!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eei chhaya gosāñi kari charaṇa vandana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyāhā haite vighna-nāśa abhīṣṭa-pūraṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI offer my obeisance to these six goswāmīs. By doing so, all obstacles are destroyed and all desires are fulfilled.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eei chhaya gosāñi yā̐ra mu̐i tā̐ra dāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etā̐-sabāra pada-reṇu mora pañcha-grāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI am a servant of these six goswāmīs. Their foot dust is my\u003cbr\u003e\nfive forms of sustenance.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etā̐dera charaṇa sevi bhakta sane vāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaname janame mora ei abhilāṣa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTo live with the devotees who serve their feet is my desire, birth after birth.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eei chhaya gosāñi yabe vraje kailā vāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhā-kṛṣṇa-nitya-līlā karilā prakāśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen these six goswāmīs lived in Vraja, they revealed Rādhā-Kṛṣṇa’s eternal Pastimes.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eānande bala hari bhaja vṛndāvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-guru-vaiṣṇava-pade majāiyā mana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eJoyfully chant, ‘Hari!’, and worship Vṛndāvan, meditating on the feet of Śrī Guru and the Vaiṣṇavas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-guru-vaiṣṇava-pāda-padma kari āśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(hari) nāma-saṅkīrtana kahe narottama dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAspiring for the lotus feet of Śrī Guru and the Vaiṣṇavas, Narottam Dās chants the Holy Name.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"first-lines\" id=\"first-lines\"\u003e\n\u003ch1\u003eIndex\u003c/h1\u003e\n\u003ch2 class=\"first-line-group\"\u003eA\u003c/h2\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-akrodha-paramananda\"\u003eakrodha paramānanda\u003cspan class=\"page-num\"\u003e — 67\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-avatara-sara-gora-avatara\"\u003eavatāra sāra\u003cspan class=\"page-num\"\u003e — 81\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch2 class=\"first-line-group\"\u003eĀ\u003c/h2\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-amara-jivana-sada-pape-rata\"\u003eāmāra jīvana\u003cspan class=\"page-num\"\u003e — 105\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-atma-nivedana-tuya-pade-kori\"\u003eātma-nivedana\u003cspan class=\"page-num\"\u003e — 111\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch2 class=\"first-line-group\"\u003eB\u003c/h2\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-bhaja-bhakata-vatsala-shri-gaurahari\"\u003ebhaja bhakata-vatsala\u003cspan class=\"page-num\"\u003e — 19\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-bhajahu-re-mana-shri-nanda-nandana\"\u003ebhajahu̐ re mana\u003cspan class=\"page-num\"\u003e — 96\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-bhaja-re-bhaja-re-amar-mana-ati-manda\"\u003ebhaja re bhaja re āmār\u003cspan class=\"page-num\"\u003e — 49\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch2 class=\"first-line-group\"\u003eC\u003c/h2\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-cheto-darpana-marjanam\"\u003echeto-darpaṇa-mārjanaṁ\u003cspan class=\"page-num\"\u003e — 128\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch2 class=\"first-line-group\"\u003eD\u003c/h2\u003e\n\u003cp class=\"first-line\"
