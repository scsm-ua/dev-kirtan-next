undaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande viśva-guruñ cha divya-bhagavat-premṇo hi bīja-pradam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI offer my obeisance unto he who perfectly fulfils his Gurudev’s most cherished desires; who is fully adorned with the blessings of his Gurudev’s associates; who is expert in all aspects of Vedic knowledge, both conceivable and inconceivable; who is the pre-eminent follower of Śrīla Rūpa Goswāmī Prabhu’s line; who is known as ‘Govinda’— Śrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj; whose beautiful, effulgent, exalted form is infused with pure devotion; who is the Guru of the entire universe; and who is the giver of the seed of divine love for the Supreme Lord.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edevaṁ divya-tanuṁ suchanda-vadanaṁ bālārka-chelāñchitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esāndrānanda-puraṁ sad-eka-varaṇaṁ vairāgya-vidyāmbudhim\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-siddhānta-nidhiṁ subhakti-lasitaṁ sārasvatānām varaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande taṁ śubhadaṁ mad-eka-śaraṇaṁ nyāsīśvaraṁ śrīdharam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI offer my obeisance unto my lord, Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj, whose speech is most pleasing; whose divine form is adorned with garments the colour of the newly-risen sun; who is an abode of intense, ecstatic devotion; who is the sādhus’ sole choice; who is an ocean of renunciation and knowledge; who is a treasure-house of perfect conclusions; who is resplendent with pure devotion; who is the best of Śrīla Saraswatī Ṭhākur’s followers; who is the giver of all good; who is the leading general of the tridaṇḍi-sannyāsīs; and who is my sole shelter.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-siddhānta-sarasvatīti vidito gauḍīya-gurv-anvaye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhāto bhānuriva prabhāta-gagane yo gaura-saṅkīrtanaiḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emāyāvāda-timiṅgilodara-gatān uddhṛtya jīvanimān\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-prema-sudhābdhi-gāhana-sukhaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prādāt prabhuṁ taṁ bhaje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI serve my lord, who is known as Śrīla Bhakti Siddhānta Saraswatī Ṭhākur. Within the Gauḍīya sampradāya’s lineage of Gurus, he shines like the sun in the morning sky. Through the saṅkīrtan of Śrīman Mahāprabhu he rescues the souls engulfed within the belly of the timiṅgila of illusionism and bestows upon them the ecstasy of swimming in the nectarean ocean of divine love for Kṛṣṇa.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enamo gaurakiśorāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhaktāvadhūta mūrtaye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaurāṅghri padma-bhṛṅgāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhā-bhāva-niṣeviṇe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI offer my obeisance unto the divine form of the devoteeavadhūt Śrīla Gaura Kiśor Dās Bābājī Mahārāj, who is a honey-bee at Śrī Gaurasundar’s lotus feet and a servant of Śrīmatī Rādhārāṇī imbued with deep loving attachment.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evande bhaktivinodaṁ śrī-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaura-śakti-svarūpakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakti-śāstrajña-samrājaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhā-rasa-sudhā-nidhim\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI offer my obeisance unto Śrīla Bhakti Vinod Ṭhākur, the embodiment of Śrī Gaurasundar’s potency. He is the king of all knowers of the scriptures of pure devotion and an ocean of the nectar of devotion to Śrīmatī Rādhārāṇī.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaura-vrajāśritāśeṣair\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaiṣṇavair vandya-vigraham\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejagannātha-prabhuṁ vande\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epremābdhiṁ vṛddha-vaiṣṇavam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI offer my obeisance unto my lord, the ocean of divine love, Śrīla Jagannāth Dās Bābājī Mahārāj. He is the senior-most devotee, and worshipped by all who have taken shelter in Śrī Nabadwīp Dhām and Śrī Vraja Dhām.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evāñchhā-kalpatarubhyaś cha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛpā-sindhubhya eva cha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epatitānāṁ pāvanebhyo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaiṣṇavebhyo namo namaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAgain and again I offer my obeisance unto the Supreme Lord’s devotees, who are saviours of the fallen, oceans of mercy, and wish-fulfilling trees.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epañcha-tattvātmakaṁ kṛṣṇaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakta-rūpa-svarūpakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhaktāvatāraṁ bhaktākhyaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enamāmi bhakta-śaktikam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI offer my obeisance unto the five-fold manifestation of Śrī Kṛṣṇa known as the Pañcha-Tattva: His form as a devotee (Śrī Kṛṣṇa Chaitanya), His expanded form as a devotee (Śrī Nityānanda Prabhu), His Avatār as a devotee (Śrī Advaita Prabhu), His pure devotees (led by Śrīvās Ṭhākur), and His devotional energies (led by Śrī Gadādhar Paṇḍit).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enamo mahā-vadānyāya kṛṣṇa-prema-pradāya te\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇāya kṛṣṇa-chaitanya-nāmne gaura-tviṣe namaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAgain and again I offer my obeisance unto You, Śrī Kṛṣṇa Chaitanya, the supremely merciful, golden form of Śrī Kṛṣṇa, the giver of Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejayatāṁ suratau paṅgor mama manda-mater gatī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emat-sarvasva-padāmbhojau rādhā-madana-mohanau\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to the merciful Śrī Śrī Rādhā–Madan Mohan! Though I am lame and wicked, They are my sole shelter, and Their lotus feet are everything to me.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edīvyad-vṛndāraṇya-kalpa-drumādhaḥ-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrīmad-ratnāgāra-siṁhāsana-sthau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī gāndharvā-śrīla-govinda-devau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epreṣṭhālībhiḥ sevyamānau smarāmi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI meditate upon Śrī Rādhā and Śrī Govinda being worshipped by Their dear girlfriends as They sit upon a throne within a beautiful jeweled temple beneath the wish-fulfilling trees of the divine abode of Vṛndāvan.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrīmān rāsa-rasārambhī vaṁśī-vaṭa-taṭa-sthitaḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekarṣan veṇu-svanair gopīr gopīnāthaḥ śriye ’stu naḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMay Gopīnāth, the beautiful originator of the rāsa-līlā, who stands on the riverbank at Vaṁśī Vaṭ and attracts the gopīs with His flute-song, bestow auspiciousness upon us.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evṛndāyai tulasī-devyai priyāyai keśavasya cha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-bhakti-prade devi satyavatyai namo namaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAgain and again I offer my obeisance unto Vṛndā Devī, who is known as Tulasī Devī and Satyavatī, who is most dear to Kṛṣṇa, and who bestows devotion to Kṛṣṇa upon us.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eatha natvā mantra-gurūn gurūn bhāgavatārthadān\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evyāsān jagad-gurūn natvā tato jayam udīrayet\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHaving offered obeisance to one’s initiating Guru, to the Gurus who have taught one the meaning of the Bhāgavat, and to all the authors of Vedic literature, who are the Gurus of the entire world, proclaim “Jay!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejayaḥ sa-parikara śrī-śrī-guru-gaurāṅga-gāndharvā-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;govindasundar-pādapadmānāṁ jayastu!\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to the lotus feet of Śrī Guru, Śrī Gaurasundar, Śrī Śrī Gāndharvā-Govindasundar, and all of Their associates!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-kṛṣṇa-chaitanya prabhu nityānanda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-advaita gadādhara śrīvāsādi gaura-bhakta-vṛnda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehare kṛṣṇa hare kṛṣṇa kṛṣṇa kṛṣṇa hare hare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehare rāma hare rāma rāma rāma hare hare\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eMorning\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-samsara-davanala-lidha-loka\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śrī Gurvāṣṭakam \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Viśvanāth Chakravartī Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esaṁsāra-dāvānala-līḍha-loka\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etrāṇāya kāruṇya-ghanāghanatvam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprāptasya kalyāṇa-guṇārṇavasya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇāravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI offer my obeisance unto the lotus feet of Śrī Guru, the ocean of goodness who assumes the form of a cloud of mercy to deliver the souls burning in the blazing fire of material existence.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emahāprabhoḥ kīrtana-nṛtya-gīta-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evāditra-mādyan-manaso rasena\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eromāñcha-kampāśru-taraṅga-bhājo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇāravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI offer my obeisance unto the lotus feet Śrī Guru, who sheds waves of tears, trembles, and experiences horripilation through his devotion to Śrīman Mahāprabhu and becomes maddened at heart by chanting, dancing, singing, and playing instruments.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-vigrahārādhana-nitya-nānā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśṛṅgāra-tan-mandira-mārjanādau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyuktasya bhaktāṁś cha niyuñjato ’pi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇāravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI offer my obeisance unto the lotus feet of Śrī Guru, who daily engages himself and other devotees in dressing the Deity with various ornaments, cleaning the Deity’s temple, and performing other devotional practices.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echatur-vidha-śrī-bhagavat-prasāda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esvādv-anna-tṛptān hari-bhakta-saṅghān\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛtvaiva tṛptiṁ bhajataḥ sadaiva\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇāravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI offer my obeisance unto the lotus feet of Śrī Guru, who is always satisfied by satisfying the Lord’s devotees with the four types of tasteful Bhagavat-prasād.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-rādhikā-mādhavayor apāra-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emādhurya-līlā-guṇa-rūpa-nāmnām\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprati-kṣaṇāsvādana-lolupasya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇāravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI offer my obeisance unto the lotus feet of Śrī Guru, who is always eager to relish the unlimitedly sweet Names, Forms, Qualities, and Pastimes of Śrī Śrī Rādhikā-Mādhava.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enikuñja-yūno rati-keli-siddhyair\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyā yālibhir yuktir apekṣaṇīyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etatrāti-dākṣyād ati-vallabhasya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇāravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI offer my obeisance unto the lotus feet of Śrī Guru, who is very expert in the arts performed by the sakhīs to fulfil the Forest Couple’s Love Play, and is thus very dear to Them.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esākṣād-dharitvena samasta-śāstrair\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003euktas tathā bhāvyata eva sadbhiḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekintu prabhor yaḥ priya eva tasya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇāravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI offer my obeisance unto the lotus feet of Śrī Guru, who is said by all the scriptures to be the Lord Himself, and considered to be so by the sādhus, yet is the Lord’s beloved devotee.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyasya prasādād bhagavat-prasādo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyasyāprasādān na gatiḥ kuto ’pi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhyāyaṁ stuvaṁs tasya yaśas tri-sandhyaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇaravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI offer my obeisance unto the lotus feet of Śrī Guru, praising and meditating upon his glory at the three junctions of the day. By his grace, one gains the Lord’s grace. Without his grace, one has no shelter anywhere.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrīmad guroraṣṭakam etad uchchair\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebrāhme muhūrte paṭhati prayātnāt\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyas tena vṛndāvana-nātha-sākṣāt\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esevaiva labhyā januṣo ’nta eva\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOne who very carefully recites aloud this Śrī Gurvaṣṭakam during the brāhma-muhūrta (the ninety-six minute period before sunrise) attains direct service to the Lord of Vṛndāvan at the end of life.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-krishna-chaitanya-prabhu-jive-daya-kori\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eAuspicious Invocation to Śaraṇāgati \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-kṛṣṇa-chaitanya prabhu jīve dayā kari’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esvapārṣada svīya dhāma saha avatari\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBeing merciful to the souls, Śrī Kṛṣṇa Chaitanya Mahāprabhu descends with His associates and abode.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eatyanta durlabha prema karibāre dāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśikhāya śaraṇāgati bhakatera prāṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTo distribute the most rare form of divine love, He teaches surrender, which is the life of the devotees.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edainya, ātma-nivedana, goptṛtve varaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘avaśya rakṣibe kṛṣṇa’—viśvāsa pālana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHumility, self-submission, embracing the Lord’s guardianship, maintaining the faith that ‘Kṛṣṇa will certainly protect me’ …\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakti-anukūla mātra kāryera svīkāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakti-pratikūla bhāva—varjanāṅgīkāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEngaging only in activities that are favourable to devotion, rejecting everything unfavourable to devotion …\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eṣaḍ-aṅga śaraṇāgati ha-ibe yā̐hāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etā̐hāra prārthanā śune śrī-nanda-kumāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Kṛṣṇa hears the prayers of one who surrenders in this six-fold way.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erūpa-sanātana-pade dante tṛṇa kari’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakativinoda paḍe dui pada dhari’\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBhakti Vinod places a straw between his teeth and falls before Śrīla Rūpa Goswāmī Prabhu and Śrīla Sanātan Goswāmī Prabhu, clasping their feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekā̐diyā kā̐diyā bale, āmi ta’ adhama\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśikhāye śaraṇāgati karahe uttama\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCrying and crying, he prays, “I am so lowly! Please elevate me by teaching me surrender.”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-bhaja-re-bhaja-re-amar-mana-ati-manda\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eBhajan-gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhaja re bhaja re āmār mana ati manda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(bhajan vinā gati nāi re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(ohe āmār mūḍha-mana bhajan vinā gati nāi re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(bhaja) vraja-vane rādhā-kṛṣṇa-charaṇāravinda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(jñāna-karma parihari’ re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(śuddha rāga-patha dhari’ jñāna-karma parihari’ re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eServe! Serve! My mind is so foolish. There is no way other than service! O my foolish mind! There is no way other than service. Serve Rādhā-Kṛṣṇa’s lotus feet in Vṛndāvan. Abandon worldly knowledge and action! Follow the path of divine love and abandon worldly knowledge and action!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(bhaja) gaura-gadādharādvaita-guru-nityānanda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gaura-kṛṣṇe abhed jene)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(guru kṛṣṇa-priya jene gaura-kṛṣṇe abhed jene re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrīnivāsa, haridāsa, murāri, mukunda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gaura-preme smara smara re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(śrīnivāsa, haridāse, gaura-preme smara smara re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eServe Gaurāṅga, Gadādhar, Advaita, Nityānanda, and Śrī Guru. Know that Gaurāṅga and Kṛṣṇa are nondifferent, and that Śrī Guru is Kṛṣṇa’s dear devotee. Remember Śrīvās Ṭhākur, Hari Dās Ṭhākur, Murāri Gupta, and Mukunda Datta. With love for Gaurāṅga, always remember them. With love for Gaurāṅga, remember Śrīvās Ṭhākur and Hari Dās Ṭhākur.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erūpa-sanātana-jīva-raghunātha-dvandva\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(yadi bhajan karbe re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(rūpa-sanātane smara yadi bhajan karbe re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erāghava-gopāla-bhaṭṭa-svarūpa-rāmānanda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(kṛṣṇa prema yadi chāo re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(svarūpa-rāmānande smara kṛṣṇa-prema yadi chāo re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eRemember Rūpa Goswāmī, Sanātan Goswāmī, Jīva Goswāmī, Raghunāth Bhaṭṭa Goswāmī, and Raghunāth Dās Goswāmī. If you want to serve, then remember Śrī Rūpa and Śrī Sanātan. Remember Rāghava Paṇḍit, Gopāl Bhaṭṭa Goswāmī, Svarūp Dāmodar, and Rāmānanda Rāy. If you want Kṛṣṇa-prema, then remember Svarūp Dāmodar and Rāmānanda Rāy.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egoṣṭhī-saha karṇapura sena-śivānanda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(ajasra smara smara re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(goṣṭhī-saha sena śivānande ajasra smara re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erūpānuga sādhu-jana bhajana-ānanda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(vraje vās yadi chāo re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(rūpānuga sādhu-jane smara vraje vās yadi chāo re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eRemember Kavi Karṇapur, Śivānanda Sen, and their family. Always remember them! Always remember Śivānanda Sen and his family. Remember the sādhus who follow Śrī Rūpa and the joy they feel in their service. If you want to reside in Vraja, then remember the sādhus who follow Śrī Rūpa.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vibhavari-shiesha-aloka-praveshia\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eVibhāvarī Śeṣa \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evibhāvarī śeṣa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āloka praveśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nidrā chhāḍi’ uṭha jīva\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebala hari hari\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mukunda murāri\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rāma kṛṣṇa hayagrīva\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO souls! The night has ended and the light has come. Awake and arise! Chant ‘Hari! Hari!’ The Supreme Lord Kṛṣṇa is the bestower of liberation, the demon Mura’s enemy, and Śrī Rādhā’s lover. He appears as Hayagrīva, the horse-headed Avatār.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enṛsiṁha vāmana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-madhusūdana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vrajendra-nandana śyāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epūtanā-ghātana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kaiṭabha-śātana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jaya dāśarathi-rāma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to Kṛṣṇa! He appears as Nṛsiṁhadev, the half-man, half-lion Avatār, the dwarf Avatār, Vāman, and the son of Daśarath, Rāmachandra. He is the destroyer of the demons Madhu, Pūtanā, and Kaiṭabha. He is the King of Vraja’s son and blackish in complexion.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyaśodā dulāla\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;govinda gopāla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vṛndāvana purandara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egopī-priya-jana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rādhikā-ramaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhuvana-sundara-vara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe is Mother Yaśodā’s darling son, and the protector and delight of the cows. He is the Lord of Vṛndāvan, the gopīs’ beloved, Rādhikā’s lover, and the most beautiful person in all the worlds.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erāvāṇāntakara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mākhana-taskara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopī-jana-vastra-hārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evrajera rākhāla\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopa-vṛnda-pāla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chita-hārī vaṁśī-dhārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAs Rāmachandra, He is the destroyer of Rāvaṇ. Krṣṇa is a butter-thief and the stealer of the gopīs’ clothes. He is a cowherd boy in Vraja, and the protector of the other cowherd boys. He is a flute player who steals the hearts of all.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyogīndra-vandana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-nanda-nandana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vraja-jana-bhaya-hārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enavīna nīrada\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rūpa manohara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mohana-vaṁśī-vihārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNanda Mahārāj’s son, Kṛṣṇa, is worshiped by the greatest yogīs. He is the remover of all fear from the people of Vraja. He is an enchanting flute player whose heart-capturing form is the colour of a fresh rain cloud.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyaśodā-nandana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kaṁsa-nisūdana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nikuñja-rāsa-vilāsī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekadamba-kānana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rāsa-parāyaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vṛndā-vipina-nivāsī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYaśodā’s son Kṛṣṇa is the killer of Kaṁsa and the enjoyer of the Rāsa Dance in the forest. He resides in Vṛndāvan and performs the rāsa dance beneath the kadamba trees.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eānanda-vardhana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prema-niketana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;phula-śara-yojaka kāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egopāṅgaṇā-gaṇa-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chita-vinodana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;samasta-guṇa-gaṇa-dhāma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe is ever-increasing joy personified and the ultimate reservoir of divine love. He is a divine Cupid, who captures His beloveds with flower arrows. He is the pleasure of the gopīs’ hearts and the abode of all wonderful qualities.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyāmuna-jīvana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;keli-parāyaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mānasa-chandra-chakora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma-sudhā-rasa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gāo kṛṣṇa-yaśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rākha vachana mana mora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe plays in the River Yamunā’s waters and is the moon above the chakora bird of the heart. O mind, remember my words: always chant Kṛṣṇa’s glories and nectarean Names.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eEvening\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-shri-guru-charana-padma-kevala-bhakati\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Guru-vaiṣṇava Māhātmya-gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī guru charaṇa-padma\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kevala bhakati-sadma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vando̐ muñi sāvadhāna mate\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyā̐hāra prasāde bhāi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;e bhava tariyā yāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛṣṇa-prāpti haya yā̐hā haite\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI carefully offer my obeisance to Śrī Guru’s lotus feet, which are the sole abode of devotion. O brother! By his mercy we cross over this world and reach Kṛṣṇa.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eguru-mukha-padma-vākya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chitete kariyā aikya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āra nā kariha mane āśā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī guru-charaṇe rati\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ei se uttama-gati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ye prasāde pūre sarva āśā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMake the teachings from Śrī Guru’s lotus mouth one with your heart, and do not desire anything else within your heart. Attachment to Śrī Guru’s feet is the best path. By his mercy all desires are fulfilled.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echakṣu-dāna dilā yei\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;janme janme prabhu sei\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;divya-jñāna hṛde prakāśita\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-bhakti yā̐hā haite\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;avidyā vināśa yāte\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vede gāya yā̐hāra charita\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHe who gave me the gift of eyes is my lord, birth after birth. He manifested divine knowledge in my heart. He gives prema-bhakti and destroys ignorance. The Vedas sing of his character.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-guru karuṇā-sindhu\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;adhama janāra bandhu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;lokanātha lokera jīvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehā hā prabhu kara dayā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;deha more pada-chhāyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;e adhama la-ila śaraṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Guru is an ocean of mercy and the friend of the fallen. He is the lord and life of all people. O master! Be merciful. Give me the shade of your feet. This fallen soul has taken shelter of you.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(āmi) (śaraṇ nilām)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(abhaya-śrī-pāda-padme\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śaraṇ nilām)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(āmāy) (dayā kara he)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(patit-pāvan śrī gurudev\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dayā kara he)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(adhama patita jene\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dayā kara he)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(jay gurudev)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI have taken shelter. I have taken shelter at your lotus feet, where there is no fear. Please be merciful to me. O Śrī Gurudev, saviour of the fallen, please be merciful to me. Understanding that I am lowly and fallen, be merciful to me. All glory to you, Śrī Gurudev!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-krishna-chaitanya-prabhu-daya-kara-more\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eSāvaraṇa-Śrī-Gaura-pāda-padme Prārthanā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī kṛṣṇa chaitanya prabhu dayā kara more\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomā vinā ke dayālu jagata mājhāre\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Śrī Kṛṣṇa Chaitanya Mahāprabhu! Be merciful to me. Other than You, who is merciful in this world?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epatita-pāvana-hetu tava avatāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emo sama patita prabhu nā pāibe āra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYou descended to save the fallen souls. O Lord, You will not find another soul as fallen as I.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehā hā prabhu nityānanda premānanda sukhī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛpāvalokana kara āmi baḍa duḥkhī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Nityānanda! You are overjoyed with divine love. Give me Your merciful glance. I am very sad.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edayā kara sītā-pati advaita gosāñi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava kṛpā-bale pāi chaitanya-nitāi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Advaita Gosāi, Lord of Sītā Ṭhākurāṇī! Be merciful to me. By Your mercy, I will reach Śrī Chaitanya and Nitāi.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaura-premamaya-tanu paṇḍit gadādhara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrīnivāsa haridāsa dayāra sāgara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Gadādhar Paṇḍit, embodiment of love for Śrī Gaura! O oceans of mercy, Śrīvās Paṇḍit and Hari Dās Ṭhākur!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehā hā svarūpa sanātana rūpa raghunātha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhaṭṭa-yuga śrī jīva hā prabhu lokanātha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Svarūp Dāmodar, Sanātan, Rūpa, Raghunāth Dās, Raghunāth Bhaṭṭa, Gopāl Bhaṭṭa, and Śrī Jīva! O Lokanāth Prabhu!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edayā kara śrī-āchārya prabhu śrīnivāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erāmachandra-saṅga māge narottama dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Śrīnivās Āchārya Prabhu! Be merciful! Narottam Dās prays for the association of Rāmachandra Kavirāj.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(dayā kara prabhupāda śrī-gaura-prakāśa)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(tava jana kṛpā māge ei adhama dāsa)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Śrīla Prabhupād, manifestation of Śrī Gaura! Be merciful. This fallen servant prays for the mercy of your associates.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eVaiṣṇava\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-vaishnava-thakura-dayara-sagara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Vaiṣṇava-mahimā-gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(ohe) vaiṣṇava ṭhākura\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dayāra sāgara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;e dāse karuṇā kari\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ediyā pada-chāyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śodha he āmāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra charaṇa dhari\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO worshippable Vaiṣṇava, ocean of grace, be merciful to this servant. Give me the shade of your feet and purify me. I clasp your feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echhaya vega dami’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chhaya doṣa śodhi’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chhaya guṇa deha’ dāse\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echhaya sat-saṅga\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;deha’ he āmāre\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;basechhi saṅgera āśe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSubjugate the six urges, rectify the six defects, and bestow the six good qualities upon this servant. Grant me the six kinds of good association. I have sat at your feet, desiring that association.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eekākī āmāra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāhi pāya bala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hari-nāma-saṅkīrtane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etumi kṛpā kari\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śraddhā-bindu diyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;deha’ kṛṣṇa-nāma-dhane\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAlone I do not have the ability to properly chant the Lord’s Name. Mercifully give me a drop of faith and bestow upon me the wealth of Kṛṣṇa’s Name.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛṣṇa se tomāra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛṣṇa dite pāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra śakati āchhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāmi ta’ kāṅgāla\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘kṛṣṇa kṛṣṇa’ bali\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dhāi tava pāchhe pāchhe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKṛṣṇa is yours. You can give Kṛṣṇa. You have that power. I am very poor. Calling, ‘Kṛṣṇa!’ ‘Kṛṣṇa!’, I run after you.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(āmi) (dhāi tava pāchhe pāchhe)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(kṛṣṇa dhana pābar āśe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dhāi tava pāchhe pāchhe)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(tumi dile kṛṣṇa dite pāra)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(kṛṣṇa tomār hṛdayer dhan\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tumi dileo dite pāra)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(kṛṣṇa debār śakti-dhara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tumi dileo dite pāra)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI run after you. I run after you in hope of attaining the wealth of Kṛṣṇa. If you desire to give Kṛṣṇa, you can give Him. If you desire to give, you can give. Kṛṣṇa is the wealth of your heart. You have the power to give Kṛṣṇa. If only you desire to give Kṛṣṇa, you can give Him.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-thakura-vaishnava-gana-kori-ei-nivedana\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eṬhākura-vaiṣṇava-gaṇa \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eṭhākura vaiṣṇava-gaṇa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kari ei nivedana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mo baḍa adhama durāchāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edāruṇa-saṁsāra-nidhi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāhe ḍubāila vidhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;keśe dhari’ more kara pāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO worshippable Vaiṣṇavas, I offer you this prayer. I am very fallen and misbehaved. Destiny has immersed me in the fearsome ocean of material existence. Please grab me by the hair and pull me to the shore.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evidhi baḍa balavān\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā śune dharama-jñāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadāi karama-pāśe bāndhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enā dekhi tāraṇa leśa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;yata dekhi saba kleśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;anātha kātare te̐i kānde\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDestiny is very powerful. It does not listen to my knowledge of religion and always binds me with the ropes of karma. I do not see even a trace of hope. All I see is hardship. Thus helpless and distressed, I cry.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekāma, krodha, lobha, moha, mada, abhimāna saha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āpana āpana sthāne ṭāne\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eaichāna āmāra mana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;phire yena andha jana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;supatha vipatha nāhi jāne\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLust, anger, greed, illusion, pride, and ego all pull me in their own directions. Thus my mind wanders like a blind man who does not know the right way from the wrong way.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enā la-inu sat mata\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;asate majila chita\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tuyā pāye nā karinu āśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enarottama dāse kaya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dekhi’ śuni’ lage bhaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tarāiyā laha nija pāśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI have never accepted the proper conception. My mind has been immersed in illusion, and I have never aspired for your feet. Narottām Dās says, “Seeing and hearing about my situation, I am stricken with fear. Please rescue me and keep me by your side.”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-ki-rupe-paibo-seva-mui-durachara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eKi-rūpe pāiba sevā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eki-rūpe pāiba sevā muñi durāchāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-guru-vaiṣṇave rati nā haila āmāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHow will I attain service? I am a sinner and have no attachment to Śrī Guru or the Vaiṣṇavas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eaśeṣa māyāte mana magana ha-ila\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaiṣṇavete leśa-mātra rati nā janmila\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMy mind has become immersed in neverending illusion. I do not have even a trace of attachment to the Vaiṣṇavas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eviṣaye bhuliyā andha ha-inu divā-niśi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egale phā̐sa dite phere māyā se piśāchī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eImmersed in the mundane day and night, I have forgotten you and become blind. The witch Māyā has come to place a noose around my neck.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emāyāre kariyā jaya chhāḍāna nā yāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esādhu-kṛpā vinā āra nāhika upāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIt is impossible to overcome and leave behind Māyā without the sādhus’ mercy. There is no other way.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eadoṣa-daraśi-prabhu patita-uddhāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eei-bāra narottame karaha nistāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO master who overlooks my faults! O saviour of the fallen! This time deliver Narottam Dās.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-thakura-vaishnava-pada-avanira\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eṬhākura-vaiṣṇava-pada \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eṭhākura-vaiṣṇava-pada\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;avanīra susampada\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śuna bhāi! hañā eka mana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāśraya la-iyā bhaje\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāre kṛṣṇa nāhi tyaje\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āra saba mare akāraṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe worshippable Vaiṣṇavas’ feet are the greatest treasure in the world. O brother, listen attentively: take shelter of the Vaiṣṇavas and serve. Kṛṣṇa does not reject one who does so. All others die in vain.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evaiṣṇava-charaṇa-jala\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prema-bhakti dite bala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āra keha nahe balavanta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaiṣṇava-charaṇa-renu\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mastake bhūṣaṇa vinu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āra nāhi bhūṣaṇera anta\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe Vaiṣṇavas’ foot-water has the power to give one premabhakti. Nothing else has such power. I wear no ornament on my head other than the Vaiṣṇavas’ footdust.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etīrtha-jala-pavitra-guṇe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;likhiyāchhe purāṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;se saba bhaktira pravañchana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaiṣṇavera pādadoka\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sama nahe ei saba\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;yāte haya vāñchhita pūraṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe purifying power of water at places of pilgrimage has been described in the Purāṇas. Such statements are a devotional trick. Water from pilgrimage sites is never equal to the Vaiṣṇavas’ foot-water, which fulfils all of one’s desires.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evaiṣṇava-saṅgete mana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ānandita anukṣaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadā haya kṛṣṇa-parasaṅga\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edīna narottama kā̐nde\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hiyā dhairya nāhi bāndhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mora daśā kena ha-ila bhaṅga\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMy mind is always joyful in the company of the Vaiṣṇavas, where discussion of Kṛṣṇa is always happening. Humble Narottam cries, “My heart has no patience. Why has my condition changed? (Why have I lost the Vaiṣṇavas’ association?)”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-ei-vara-karuna-kara-vaishnava-gosani\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eVaiṣṇava Vijñāpti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eei-bāra karuṇā kara vaiṣṇava gosāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epatita-pāvana tomā vine keha nāi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO worshippable Vaiṣṇava, be merciful to me this time. O saviour of the fallen, without you there is no one.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekāhāra nikaṭe gele pāpa dūre yāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eemana dayāla prabhu kebā kothā pāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIf one comes to you, one’s sins go away. Where can such a merciful master be found?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaṅgāra-paraśa ha-ile paśchāte pāvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edarśane pavitra kara—ei tomāra guṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIf the Ganges touches someone, he is later purified, but you purify souls simply by seeing them—such is your power.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari-sthāne aparādhe tāre hari-nāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomā-sthāne aparādhe nāhika eḍāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIf one offends the Lord, the Lord’s Name delivers him, but if one offends you, one has no salvation.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra hṛdaye sadā govinda-viśrāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egovinda kahena—mama vaiṣṇava parāṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGovinda always resides in your heart, and He says, “My devotees are My heart.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprati janme kari āśā charaṇera dhūli\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enarottame kara dayā āpnāra bali’\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIn every birth I aspire for the dust of your feet. Be merciful to Narottam, considering him your own.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eNitāi\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-nitai-pada-kamala-koti-chandra-sushitala\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eManaḥ-Śikṣā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enitāi-pada-kamala\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;koṭī-chandra-suśītala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ye chhāyāya jagata juḍāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehena nitāi vine bhāi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rādhā-kṛṣṇa pāite nāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dṛḍha kari’ dhara nitāira pāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCooling like ten million moons, Nitāi’s lotus feet soothe the world with their shade. O brother! Without Nitāi, you cannot reach Rādhā-Kṛṣṇa. Firmly grasp Nitāi’s feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ese sambandha nāhi yāra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vṛthā janma gela tāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sei paśu baḍa durāchāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enitāi nā balila mukhe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;majila saṁsāra-sukhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vidyā-kule ki karibe tāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe life of one who had no connection with Nitāi passed in vain. Such an animal is very wicked. What will learning (aristocratic birth) do for one who was immersed in worldly pleasures and never called aloud, ‘Nitāi’?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eahaṅkāre matta haiñā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nitāi-pada pāsariyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;asatyere satya kari’ māni\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enitāiyer karuṇā habe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vraje rādhā-kṛṣṇa pābe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dhara nitāiyer charaṇ du’khāni\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMaddened with pride, forgetting Nitāi’s feet, I accept untruth as truth. When Nitāi bestows His mercy you will reach Rādhā-Kṛṣṇa in Vraja. Grasp Nitāi’s feet!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enitāiyer charaṇa satya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tā̐hāra sevaka nitya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nitāi-pada sadā kara āśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enarottama baḍa duḥkhī\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nitāi more kara sukhī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rākha rāṅgā-charaṇera pāśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNitāi’s feet are truth, and His servants are eternal. Always aspire for Nitāi’s feet. Narottam is very sad: “O Nitāi! Make me happy. Keep me beside your reddish feet.”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-nitai-gunamani-amara-nitai-gunamani\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eNitāi guṇamaṇi āmāra \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Lochan Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enitāi guṇamaṇi āmāra nitāi guṇamaṇi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāniyā premera vanyā bhāsāla avanī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNitāi, the jewel of all good qualities, my Nitāi, the jewel of all good qualities, brought a flood of divine love and inundated the earth.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprema-vanyā laye nitāi āila gauḍa-deśe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eḍubila bhakata-gaṇa dīna-hīna bhāse\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNitāi brought a flood of divine love to the land of Gauḍa. The devotees immersed themselves in it, but the unfortunate floated on its surface.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edīna-hīna patita pāmara nāhi bāchhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebrahmāra durlabha prema sabākāre yāche\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe sinful, unfortunate, and fallen did not desire this divine love, which is difficult for even Brahmā to attain, yet Nitāi begged them to accept it.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eābaddha karuṇā-sindhu kāṭiyā muhāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eghare ghare bule prema-amiyāra vāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNitāi cut a canal into the sealed ocean of mercy and a flood of nectarean divine love spread to every home.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003elochan bale hena nitāi yebā nā bhajila\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejāniyā śuniyā sei ātma-ghātī haila\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLochan Dās says, “Anyone who did not serve Nitāi knowingly committed suicide.”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-akrodha-paramananda\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eAkrodha paramānanda \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Lochan Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eakrodha paramānanda nityānanda rāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eabhimāna-śūnya nitāi nagare beḍāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe anger-less, prideless, supremely joyful Nityānanda Rāy wanders throughout the towns.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eadhama patita jīver dvāre dvāre giyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehari-nāma mahāmantra dena bilāiyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGoing from door to door to the homes of the lowly and fallen souls, He distributes the Hare Kṛṣṇa mahāmantra.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyāre dekhe tāre kahe dante tṛṇa dhari’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāmāre kiniyā laha bhaja gaurahari\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWith straw between His teeth, He says to whoever He sees, “Purchase Me: simply serve Gaurahari.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eeta bali’ nityānanda bhūme gaḍi yāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esonāra parvata yena dhūlāte loṭāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSaying this, Nityānanda rolls on the ground like a golden mountain rolling in the dust.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehena avatāre yāra rati nā janmila\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elochan bale sei pāpī ela āra gela\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLochan Dās says of one who has not developed attachment to this Avatār, “Such a sinner simply came and went.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(yāoyā āsā sār ha-ila)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(nitāi-charaṇ nā bhajila\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;yāoyā āsā sār ha-ila)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“They simply came and went. Those who did not serve Nitāi’s feet simply came and went (took birth and died uselessly).”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-parama-karuna-pahu-dui-jana\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śrī Gaura-Nityānander Dayā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Lochan Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eparama karuṇa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pah. dui jana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nitāi gaurachandra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaba avatāra-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sāra śiromaṇi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kevala ānanda-kanda\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNitāi and Gaurachandra are the two most merciful Lords. They are the best, the crest-jewels, of all Avatārs and the only source of joy.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(kevala-i ānanda-kanda)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(nityānanda gaurachandra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kevala-i ānanda-kanda)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThey are the only source of joy. Nityānanda and Gaurachandra are the only source of joy.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhaja bhaja bhāi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chaitanya nitāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sudṛḍha viśvāsa kari’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eviṣaya chhāḍiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;se rase majiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mukhe bala hari hari\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO brothers! Serve! Serve Śrī Śrī Chaitanya-Nitāi with firm faith! Leave aside worldly affairs, merge into this rasa, and chant aloud, ‘Hari! Hari!’\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(mukhe bala gaurahari)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(viṣay-kathā parihari’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mukhe bala gaurahari)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(grāmya-kathā parihari’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mukhe bala gaurahari)\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"translation\"\u003eChant aloud, ‘Gaurahari’! Give up mundane talk and chant aloud ‘Gaurahari’! Give up village talk and chant aloud ‘Gaurahari’!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edekha ore bhāi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tribhuvane nāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;emana dayāla dātā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO brother! Look! There are no benefactors in the three worlds as merciful as Them.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(eman dayāl ke vā āchhe)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(nitāira gaurer mata\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;eman dayāl ke vā āchhe)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(mar kheyeo nām prema yāche\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;eman dayāl ke vā āchhe)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWho else is so merciful? Who is as merciful as Nitāi and Gaura? They endure even being beaten, and yet They ask Their aggressors to accept the Holy Name and divine love. Who else is so merciful?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epaśu pākhī jhure\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pāṣāṇa vidare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śuni yā̐ra guṇa-gāthā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHearing of Their glory, birds and animals cry and stones melt.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esaṁsāre majiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rahili paḍiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;se pade nahila āśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāpana karama\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhuñyāya śamana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kahaye lochana dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Fallen and immersed in saṁsāra, I never aspired for Their feet. Now Yamarāj subjects me to my karma.” So says Lochan Dās.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-dayal-nitai-chaitanya-bole-nach-re\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eDayāl Nitāi Chaitanya \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘dayāl nitāi chaitanya’ ba’le nāch re āmār mana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāch re āmār mana, nāch re āmār mana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO my mind, dance! O my mind, dance! O my mind, dance, chanting, “Dayāl Nitāi Chaitanya!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(eman dayāl ta’ nāi he mār kheye prema dey)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOh! No one is so merciful! Nitāi endures being beaten yet gives His aggressors divine love.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(ore) aparādha dūre yābe, pābe prema-dhan\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nb
