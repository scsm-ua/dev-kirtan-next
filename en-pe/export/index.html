c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe birth of one who, by good fortune, has once seen Kṛṣṇa is successful. Developing the heart’s eyes and seeing Kṛṣṇa, such a soul abandons all delusions.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vṛndāvana-keli chatur vanamālī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etribhaṅga-bhaṅgimā-rūpa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vaṁśī-dhārī aparūpa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rasamaya nidhi, guṇa-śālī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKṛṣṇa is expert at play in Vṛndāvan. He wears a forest garland, poses bent in three places, and plays the flute perfectly. He is a reservoir of rasa and possesses all qualities.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evarṇa nava jaladhara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śire śikhi-pichchha-vara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;alakā tilaka śobhā pāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eparidhāne pīta-vāsa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vadane madhura hāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hena rūpa jagat mātāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHis complexion is the colour of a fresh rain cloud. His forehead is adorned with tilak, curling locks, and a fine peacock feather. He wears yellow garments and a sweet smile on His face. His form enchants the world.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eindra-nīla jini\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛṣṇa-rūpa-khāni\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;heriyā kadamba-mūle\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emana uchāṭana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā chale charaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;saṁsāra gelāma bhule\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBeholding Kṛṣṇa’s form, which surpasses the beauty of a sapphire, beneath a kadamba, my heart was overwhelmed. My feet could not move. I forgot the world.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(sakhī he) sudhāmaya se rūpa mādhurī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edekhile nayana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;haya achetana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jhare premamaya vāri\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO friend! When I saw the beauty of Kṛṣṇa’s nectarean form, I fainted and shed tears of divine love.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekibā chūḍā śire\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kibā vaṁśī kare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kibā se tribhaṅga ṭhāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echaraṇa-kamale\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;amiyā uchhale\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāhāte nūpura dāma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhat a crown on His head! What a flute in His hand! What a threefold pose! Nectar surged from His lotus feet, which were adorned with tinkling anklets.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esadā āśā kari\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhṛṅga-rūpa dhari\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;charaṇa-kamale sthāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eanāyāse pāi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛṣṇa-guṇa gāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āra nā bhajiba āna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI eternally desire to take the form of a bee, easily attain a place at Kṛṣṇa’s lotus feet, and sing His glories. I will never serve anyone else.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-jaya-radha-krishna-jugala-milan\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Vraja-dhāma-mahimāmṛta \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Kṛṣṇadās Kavirāj Goswāmī\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya rādhe, jaya kṛṣṇa, jaya vṛndāvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-govinda, gopīnātha, madana-mohana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to Rādhā, Kṛṣṇa, and Vṛndāvan! All glory to Śrī Govinda, Gopīnāth, and Madan Mohan!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśyāma-kuṇḍa, rādhā-kuṇḍa, giri-govardhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekālindī yamunā jaya, jaya mahāvana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to Śyām Kuṇḍa, Rādhā Kuṇḍa, Govardhan Hill, the River Yamunā, and Mahāvan!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekeśī-ghāṭa, vaṁśī-vaṭa, dvādaśa-kānana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyā̐hā saba līlā kaila śrī-nanda-nandana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to Keśī Ghāṭ, Vaṁśī Vaṭ, and Vraja’s twelve forests! Nanda’s son performed His Pastimes in all of these places.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-nanda-yaśodā jaya, jaya gopa-gaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrīdāmādi jaya, jaya dhenu-vatsa-gaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to Śrī Nanda and Yaśodā! All glory to Śrīdām and all the cowherd boys! All glory to Vraja’s cows and calves!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya vṛṣabhānu, jaya kīrtidā sundarī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaya paurṇamāsī, jaya ābhīra-nāgarī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to Vṛṣabhānu and beautiful Kīrtidā! All glory to Paurṇamāsī! All glory to Vraja’s cowherd girls!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya jaya gopeśvara vṛndāvana-mājha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaya jaya kṛṣṇa-sakhā baṭu dvija-rāja\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to Gopeśvar Śiva in Vṛndāvan! All glory to Kṛṣṇa’s funny brāhmaṇ friend, Madhumaṅgal!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya rāma-ghāṭa, jaya rohiṇī-nandana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaya jaya vṛndāvana-vāsī yata jana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to Rām Ghāṭ! All glory to Rohiṇī’s son Balarām! All glory to all of Vṛndāvan’s residents!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya dvija-patnī, jaya nāga-kanyā-gaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhaktite yā̐hārā pāila govinda-charaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to the brāhmaṇ’s wives and Kālīya’s wives! Through their devotion, they attained Govinda’s feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-rāsa-maṇḍala jaya, jaya rādhā-śyāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaya jaya rāsa-līlā sarva-manorama\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to the site of the rāsa dance! All glory to Rādhā and Śyām! All glory to the rāsa dance, which captures the hearts of all!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya jayojjvala-rasa sarva-rasa-sāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eparakīyā-bhāve yāhā vrajete prachāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll glory to madhura-rasa, the best of all rasas, which is manifest in Vraja as paramour love!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-jāhnavā-pāda-padma kariyā smaraṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edīna kṛṣṇa-dāsa kahe nāma-saṅkīrtana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eRemembering the lotus feet of Śrī Jāhnavā Devī, the humble Kṛṣṇa Dās chants the Holy Name.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003ePrayers\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-amara-jivana-sada-pape-rata\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eĀmāra jīvana \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eāmāra jīvana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadā pāpe rata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāhika puṇyera leśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eparere udvega\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;diyāchhi ye kata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;diyāchhi jīvere kleśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMy life is always engrossed in sin. There is not a trace of piety within it. I have caused others so much anxiety and trouble.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enija sukha lāgi’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pāpe nāhi ḍari\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dayā-hīna svārtha-para\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epara-sukhe duḥkhī\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadā mithya-bhāṣī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;para-duḥkha sukha-kara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI am never afraid to engage in sinful activities for the sake of my own happiness. I am merciless and selfish. I am a perpetual liar. I am saddened by the happiness of others and pleased by the sadness of others.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eaśeṣa kāmanā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hṛdi mājhe mora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;krodhī, dambha-parāyaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emada-matta sadā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;viṣaye mohita\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hiṁsā-garva vibhūṣana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThere are unlimited sinful desires within the core of my heart. I am angry and arrogant, always maddened with vanity, infatuated with mundanity, and ornamented with malice and pride.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enidrālasya hata\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sukārye virata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;akārye udyogī āmi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epratiṣṭhā lāgiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śāṭhya-ācharaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;lobha-hata sadā kāmī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI am subdued by laziness and sleep, averse to performing good deeds, and eager to perform sinful deeds. I engage in deceitful behaviour in pursuit of prestige. I am ruined by greed and constantly covetous.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ee hena durjana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sajjana-varjita\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;aparādhi nirantara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśubha-kārya-śūnya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadānartha-manāḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nānā duḥkhe jara jara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSuch a sinner as I is shunned by devotees, and is a constant offender. I am devoid of virtuous motives, always intent upon evil, and racked by various miseries.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evārdhakye ekhana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;upāya-vihīna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tā’te dīna akiñchana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakati-vinoda\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prabhura charaṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kare duḥkha nivedana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNow aged, I am devoid of any means of deliverance and thus destitute and distressed. Bhakti Vinod submits this remorseful confession at the Lord’s feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hari-hari-biphole-janama-goyainu\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eIṣṭa-deve Vijñapti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari hari!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;viphale janama goṅāinu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emanuṣya-janama pāiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rādhā-kṛṣṇa nā bhajiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jāniyā śuniyā viṣa khāinu\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Lord! My life has passed uselessly. I attained a human birth, but I did not serve Rādhā and Kṛṣṇa. Knowingly I drank poison.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egolokera prema-dhana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hari-nāma-saṅkīrtana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rati nā janmila kena tāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaṁsāra-viṣānale\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;divā-niśi hiyā jvale\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;juḍāite nā kainu upāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhy didn’t I develop attachment to Hari-nām-saṅkīrtan, to Goloka’s divine love and wealth? My heart burns day and night in the poisonous fire of saṁsāra, yet I have not sought any way to relieve it.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evrajendra-nandana yei\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śachī-suta haila sei\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;balarāma ha-ila nitāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edīna-hīna yata chhila\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hari-nāme uddhārila\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāra śākṣī jagāi mādhāi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVrajendra Nandan became Śachī Suta and Balarām became Nitāi. They delivered all the fallen souls with the Holy Name. Jagāi and Mādhāi are evidence of this.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehā hā prabhu nanda-suta\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vṛṣabhānu-sutā-yuta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;karuṇā karaha ei-bāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enarottama-dāsa kaya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā ṭheliha rāṅgā pāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomā vine ke āchhe āmāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Rādhā! O Lord Kṛṣṇa! Be merciful to me this time. Narottam Dās says, “Please don’t push me away from Your reddish feet. Without You, who do I have?”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-ki-jani-ki-bale-tomara-dhamete\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eGoptṛtve Varaṇa \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eki jāni ki bale\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra dhāmete\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ha-inu śaraṇāgata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etumi dayāmaya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;patita-pāvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;patita-tāraṇe rata\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI do not know by what force I have taken shelter within Your abode. Surely it is by Your mercy alone, for You are ever seeking the purification and deliverance of the fallen souls.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebharasā āmāra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ei mātra nātha!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tumi ta’ karuṇā-maya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava dayā pātra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāhi mora sama\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;avaśya ghuchāre bhaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Lord! You are merciful. This is my sole hope. There is no one who needs Your mercy more than I. Certainly You will dispel all my fear.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eāmāre tārite\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kāhāra śakati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;avanī-bhitare nāhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edayāla ṭhākura!\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ghoṣaṇā tomāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;adhama pāmare trāhi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThere is no one on earth who has the power to deliver me. O merciful Lord! It is Your declaration that You deliver the lowest, most sinful persons.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esakala chhāḍiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āsiyāchhi āmi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra charaṇe nātha!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāmi nitya-dāsa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tumi pālayitā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tumi goptā, jagannātha!\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAbandoning everything, I have come to Your feet, O Lord! I am Your eternal servant, and You are my maintainer and protector, O Lord of the universe!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra sakala\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āmi mātra dāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āmāra tāribe tumi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomāra charaṇa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;karinu varaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āmāra nahi ta’ āmi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEverything is Yours. I am only a servant. Certainly You will deliver me. I have embraced Your feet and no longer belong to myself.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakati-vinoda\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kā̐diya śaraṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;la’yechhe tomāra pāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṣami’ aparādha\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāme ruchi diyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pālana karahe tāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWeeping, Bhakti Vinod takes shelter at Your feet. Forgiving his offences and giving him a taste for the Name, kindly maintain him.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-sarvasva-tomara-charane-sanpiya\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eSarvasva tomāra \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esarvasva tomāra,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;charaṇe sa̐piyā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;paḍechhi tomāra ghare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etumi ta’ ṭhākura,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra kukkura,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;baliyā jānaha more\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI have offered everything at Your feet and taken shelter in Your home. You are my Master. Consider me Your dog.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebā̐dhiyā nikaṭe,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āmāre pālibe,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rahiba tomāra dvāre\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epratīpa-janere,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āsite nā diba,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rākhiba gaḍera pāre\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYou will tie me up nearby and maintain me. I will remain at Your doorstep. I will not allow any inimical persons to enter; I will keep them on the far side of Your moat.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etava nija-jana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prasāda seviyā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;uchchhiṣṭa rākhibe yāhā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāmāra bhojana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;parama-ānande,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prati-dina habe tāhā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhatever remnants Your devotees leave behind after honouring Your prasād I will eat every day with great joy.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebasiyā śuiyā,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra charaṇa,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chintiba satata āmi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāchite nāchite,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nikaṭe yāiba,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;yakhana ḍākibe tumi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhile sitting up or lying down, I will always think of Your feet. I will come to You whenever You call me, dancing all the way.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enijera poṣana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kabhu nā bhāviba,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rahiba bhāvera bhare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakati-vinoda,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāre pālaka,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;baliyā varaṇa kare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI will never think about my own maintenance; I will always remain within the shelter of loving attachment to You. Bhakti Vinod embraces You as his maintainer.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-atma-nivedana-tuya-pade-kori\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eĀtma-nivedana \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eātma-nivedana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tuyā pade kari\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ha-inu parama sukhī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eduḥkha dūre gela\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chintā nā rahila\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chaudike ānanda dekhi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSurrendering myself at Your feet, I have become completely happy. All my distress has gone away, I have no more anxiety, and I see joy in all directions.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eaśoka-abhaya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;amṛta-ādhāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra charaṇa-dvaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etāhāte ekhana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;viśrāma labhiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chhāḍinu bhavera bhaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eYour feet are the abode of sorrowlessness, fearlessness, and nectar. Receiving shelter beneath them, I have abandoned all fear of material existence.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra saṁsāre\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kariba sevana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nahiba phalera bhāgī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava sukha yāhe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kariba yatana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ha’ye pade anurāgī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI will serve in Your home and will not become an enjoyer of the results. Lovingly attached to Your feet, I will carefully do whatever pleases You.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra sevāya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;duḥkha haya yata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;seo ta’ parama sukha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esevā-sukha-duḥkha\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;parama sampada\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāśaye avidyā-duḥkha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll the distress I encounter in Your service is also my great happiness. Both the distress and the happiness that come from serving You are my great fortune. They both destroy the distress of ignorance.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epūrva itihāsa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhulinu sakala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sevā-sukha pe’ye mane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāmi ta’ tomāra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tumi ta’ āmāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ki kāja apara dhane\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eFeeling the happiness of Your service in my heart, I have completely forgotten all past history. I am Yours, and You are mine. What need is there for any other wealth?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakati-vinoda\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ānande ḍubiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra sevāra tare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaba cheṣṭā kare\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tava ichhā-mata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;thākiyā tomāra ghare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDiving in the joy of Your service, Bhakti Vinod resides within Your home and performs all his endeavours in accordance with Your will.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gauranga-bolite-hobe-pulaka-shorira\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003e‘Gaurāṅga’ bolite habe \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘gaurāṅga’ balite habe pulaka śarīra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘hari hari’ balite nayane va’be nīra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen will the hairs on my body stand on end as I chant “Gaurāṅga!”? When will tears pour from my eyes as I chant, “Hari! Hari!”?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eāra kabe nitāichā̐da karuṇā karibe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaṁsāra-vāsanā more kabe tuchchha ha’be\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen will Nītāichā̐d be merciful to me? When will my worldly desires become insignificant?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eviṣaya chhāḍiyā kabe śuddha ha’be mana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekabe hāma heraba śrī-vṛndāvana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen will my mind give up all worldliness and become pure? When will I behold Śrī Vṛndāvan?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erūpa-raghunātha-pade ha-ibe ākuti\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekabe hāma bujhaba se yugala-pīriti\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen will I long for Śrī Rūpa and Śrī Raghunāth’s feet? When will I understand the Divine Couple’s love?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erūpa-raghunātha-pade rahu mora āśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprārthanā karaye sadā narottama dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“May my aspiration be at the feet of Śrī Rūpa and Śrī pkobe-hobe-bolo-se-dina-amarRaghunāth.” Narottam Dās always prays in this way.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-kobe-hobe-bolo-se-dina-amar\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eKabe ha’be bala \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kabe ha’be bala se-dina āmāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(āmār) aparādha ghuchi’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śuddha nāme ruchi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛpā-bale ha’be hṛdaye sañchāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePlease tell me, when will that day be mine when my offences will be dispelled and taste for the pure Name will be infused within my heart by divine grace?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etṛṇādhika hīna\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kabe nije māni\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sahiṣṇutā-guṇa hṛdayete āni’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esakale mānada\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āpani amānī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;haye āsvādiba nāma-rasa-sāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen will I feel myself to be lower than a blade of grass, bring the quality of tolerance within my heart, become eager to honour everyone, and, devoid of desire for honour from anyone, relish the essence of the Name’s rasa?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edhana jana āra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kavitā, sundarī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;baliba nā chāhi deha-sukha-karī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejanme-janme dāo\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ohe gaurahari!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ahaitukī-bhakti charaṇe tomāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen will I declare that I do not desire wealth, followers, erudition, beautiful women, or any other bodily pleasures? O Gaurahari! Birth after birth, please give me unconditional devotion to Your feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(kabe) karite śrī-kṛṣṇa-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāma uchāraṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pulakita deha gadgada vachana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaivarṇya-vepathu\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;habe saṅghaṭana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nirantara netre va’be aśru-dhāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen will my hair stand on end, my voice falter, my complexion turn pale, my body tremble, and tears pour incessantly from my eyes while I call aloud Śrī Kṛṣṇa’s Name?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekabe navadvīpe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;suradhunī-taṭe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘gaura-nityānanda’ bali’ niṣkapaṭe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāchiyā gāiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;beḍāiba chhuṭe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vātulera prāya chhāḍiyā vichāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen, in the land of Nabadwīp, on the banks of the Ganges, will I run about, guilelessly calling, “O Gaura! O Nityānanda!”, dancing and singing like a madman, giving up all considerations?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekabe nityānanda\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;more kari’ dayā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chhāḍāibe mora viṣayera māyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ediyā more nija-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;charaṇera chhāyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāmera hāṭete dibe adhikāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen will Nityānanda be merciful to me and cause me to abandon my attachment to mundanity? When will He give me the shade of His feet and grant me a place in the marketplace of the Name?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekiniba, luṭiba\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hari-nāma-rasa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāma-rase māti’ ha-iba vivaśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erasera rasika-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;charaṇa paraśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kariyā majiba rase anibāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen will I buy and festively scatter the Name’s rasa? When will I become intoxicated and overwhelmed with that rasa? When will I touch the feet of a relisher of that rasa and become immersed in that rasa perpetually?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekabe jīve dayā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ha-ibe udaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nija-sukha bhuli’ sudīna-hṛdaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakati-vinoda\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kariyā vinaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-ājñā-ṭahala karibe prachāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen will compassion for all souls arise within me? When will Bhakti Vinod forget his own happiness and travel about respectfully preaching Śrī Gaurasundar’s teachings with a most humble heart?\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-kobe-gaura-vane-suradhuni-tate\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eSiddhi-Lālasā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekabe gaura-vane\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;suradhunī-taṭe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘hā rādhe hā kṛṣṇa’ ba’le\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekā̐diyā beḍāba\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;deha-sukha chhāḍi’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nānā latā-taru-tale\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen will I abandon all bodily pleasures and wander along the banks of the Ganges beneath the trees and creepers in Śrī Gaurasundar’s forests, crying and calling out, “O Rādhā! O Kṛṣṇa!”?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśva-pacha-gṛhete\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;māgiyā khāiba\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;piba sarasvatī-jala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epuline puline\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gaḍāgaḍi diba\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kari’ kṛṣṇa-kolāhala\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen will I eat by begging food from the houses of dogeating outcasts and drink the water of the river Saraswatī? When will I roll about on the banks of the Ganges and uproariously call out, “Kṛṣṇa!”?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edhāma-vāsī jane\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;praṇati kariyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;māgiba kṛpāra leśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaiṣṇava-charaṇa-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;reṇu gāya mākhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dhari’ avadhūta-veśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen will I bow down before the residents of Śrī Gaurasundar’s abode and beg for a particle of their mercy? When will I wear the garb of an avadhūt and smear my body with the dust of the devotees’ feet?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egauḍa-vraja-vane\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bheda nā heriba\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ha-iba varaja-vāsī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhāmera svarūpa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sphuribe nayane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ha-iba rādhāra dāsī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen will I see no difference between the residents of Gauḍa and the residents of Vraja, and become a resident of Vraja? When will the true nature of the Lord’s abode manifest before my eyes? When will I become Śrī Rādhā’s maidservant?\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eAdvice\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-durlabha-manava-janma-labhiya-samsare\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eDurlabha mānava-janma \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edurlabha mānava-janma labhiyā saṁsāre\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa nā bhajinu duḥkha kahiba kāhāre?\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI attained a human birth, which is most rare in this world, but did not serve Kṛṣṇa. To whom shall I express my sorrow?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘saṁsāra’ ‘saṁsāra’ kari’ michhe gela kāla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elābha nā ha-ila kichhu, ghaṭila jañjāla\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLiving life after life in this mundane world, my time has passed in vain. I have not gained anything. I have only suffered.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekisera saṁsāra ei chhāyābāji prāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eihāte mamatā kari vṛthā dina yāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhat sort of world is this? It is like a shadow play. Attaching myself to it, my days pass by in vain.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ee deha patana ha’le ki rabe āmāra?\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeha sukha nāhi dibe putra paribāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen this body drops dead, what will remain ‘mine’? Upon death neither my sons nor my family will give me any satisfaction.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egardabhera mata āmi kari pariśrama\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekāra lāgi’ eta kari, nā ghuchila bhrama\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI toil laboriously like an ass. For whom am I doing this? Still my illusion has not been dispelled.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edina yāya michhā kāje, niśā nidrā-vaśe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāhi bhāvi maraṇa nikaṭe āchhe vase\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMy days pass in meaningless labour, and my nights pass in sleep. I never consider that death is sitting nearby.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhāla manda khāi, heri, pari, chintā-hīna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāhi bhāvi, e deha chhāḍiba kona dina\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eI eat luxuriously, look around, and dress carelessly, never considering that one day I will leave this body.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edeha-geha-kalatrādi-chintā avirata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejāgichhe hṛdaye mora buddhi kari hata\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eConstant thoughts of my body, home, wife, and so on, arise in my heart and spoil my intelligence.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehāya, hāya! nāhi bhāvi—anitya e saba\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejīvana vigate kothā rahibe vaibhava?\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAlas! Alas! I never considered that all of these things are temporary. When my soul departs, where will all these opulences remain?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśmaśāne śarīra mama paḍiyā rahibe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evihaṅga-pataṅga tāya vihāra karibe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMy body will be laid to rest at the crematorium. There birds and insects will enjoy it.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekukkura sṛgāla saba ānandita ha’ye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emahotsava karibe āmāra deha la’ye\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDogs and jackals will happily have a festival with my body.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eye dehera ei gati, tāra anugata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaṁsāra-vaibhava āra bandhu-jana yata\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThis is the fate of my body, its effects, material wealth, and all of my companions.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eataeva māyā-moha chhāḍi buddhimāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enitya-tattva kṛṣṇa-bhakti karuna sandhāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSo, intelligent souls! Abandon Māyā’s illusion and search for the eternal truth: devotion to Kṛṣṇa.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-e-ghora-samsare-podiya-manava\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eE ghora saṁsāre \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ee ghora-saṁsāre\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;paḍiyā mānava\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā pāya duḥkhera śeṣa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esādhu-saṅga kari’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hari bhaje yadi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tabe anta haya kleśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eA person who has fallen into this terrible world never ceases to suffer. If one associates with sādhus and serves Hari, however, one’s suffering comes to an end.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eviṣaya anale\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jvalichhe hṛdaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;anale bāḍaye anala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eaparādha chhāḍi’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;laya kṛṣṇa-nāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;anale paḍaye jala\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eA fallen soul burns in the ever-increasing fire of mundanity. Avoiding offences, chant Kṛṣṇa’s Name. This pours water on the fire.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enitāi chaitanya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;charaṇa-kamale\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āśraya la-ila yei\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekāli dāsa bale\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jīvane maraṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āmāra āśraya sei\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKāli Dās says, “Anyone who has taken shelter of Nitāi and Chaitanya’s lotus feet is my shelter, in life and in death.”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-haribolo-haribolo-haribolo-bhai-re\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eSri Nama Kirtan Song 3 \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eharibolo haribolo haribolo bhāi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehari-nāma aniyāchhe gauraṅga-nitāi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(modera duḥkha dekhe re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Brothers! Chant “Hari”! Chant “Hari”! Chant “Hari”! Gaurāṅga and Nitāi have brought the Lord’s Name. (Oh! They see our suffering.)\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari-nāma vinā jīvera anya dhana nāi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehari-nāme śuddha ha’la jagāi-mādhāi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(baḍa pāpī chhila re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe soul has no wealth other than the Lord’s Name. Oh! Jagāi and Mādhāi were purified by the Lord’s Name (Oh! They were great sinners).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emichhe māyā-baddha ha’ye jīvana kāṭāi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(āmi āmāra bale re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāśā-vaśe ghure’ ghure’ āra kothā yāi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(āśāra śeṣa nāi re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBound by Māyā (claiming ‘I’ and ‘mine’), I pass my life in vain. Oh! Controlled by mundane desires, wandering and wandering, where shall I go next? (Oh! Mundane desires never end).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari bale deo bhāi āśāra mukhe chhāi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(nirāśa ta’ sukha re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhoga-mokṣa-vāñchhā chhāḍi’ hari-nāma gāi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(śuddha-sattva ha’ye re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO brothers! Chant “Hari!” and throw ashes in the face of material desire. (Oh! Being desireless is happiness). Abandoning desire for mundane enjoyment and liberation, I chant the Lord’s Name (being spiritually pure).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enā cheye-o nāmera guṇe o saba phala pāi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(tuchchha phaler prayāsa chheḍe re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evinoda bale yāi la’ye nāmera bālāi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(nāmera bālāi chheḍe re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEven without desiring them, I obtain all ends (dharma, artha, kāma, and mokṣa) by the Name’s power. (Oh! Abandon all endeavours for insignificant ends). Bhakti Vinod says, “I proceed, removing the obstacles to the Lord’s Name. (Oh! Avoid the obstacles to the Lord’s Name.)”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hari-nama-mahamantra-sarva-mantra-sara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eDaśa-vidha Nāmāparādha \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari-nāma mahāmantra sarva-mantra-sāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyā̐dera karuṇā-bale jagate prachāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esei nāma-parāyaṇa sādhu, mahājana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etā̐hādera nindā nā kariha kadāchana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe Hari-nām mahāmantra is the best of all mantras and is distributed throughout the world by the mercy of the sādhus devoted to the Name. Never criticise such great souls.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evrajendra-nandana kṛṣṇa sarveśvareśvara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emaheśvara ādi tā̐ra sevana-tatpara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma chintāmaṇi kṛṣṇa-chaitanya-svarūpa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebheda-jñāna nā karibe līlā-guṇa-rūpa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVrajendra Nandan Kṛṣṇa is the Lord of all Lords. Śiva and all other gods are dedicated to His service. The Name is a wish-fulfilling jewel and a spiritual form of Kṛṣṇa Himself. Do not consider Kṛṣṇa’s Name to be distinct from His Form, Qualities, or Pastimes.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e“guru kṛṣṇa-rūpa hana śāstrera pramāṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eguru-rūpe kṛṣṇa kṛpā kare bhāgyavāne”\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ese gurute martya-buddhi avajñādi tyaji\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eiṣṭa-lābha kara, nirantara nāma bhaji\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“The scriptures confirm that Guru is a form of Kṛṣṇa (SB: 11.17.27). In the form of Guru, Kṛṣṇa bestows His mercy upon the fortunate.” Give up the conception that Guru is a mortal, and all other types of disrespect, and attain your cherished goal: serving the Name eternally.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśruti, śruti-mātā-saha sātvata purāṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-nāma-charaṇa-padma kare nīrājana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esei śruti-śāstra yebā karaye nindana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ese aparadhīra saṅga karibe varjana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe Vedas, their mother, Gāyatrī, and \u003ci\u003eŚrīmad Bhāgavatam\u003c/i\u003e worship the Holy Name’s lotus feet. Reject the association of any offender who criticises these scriptures.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enāmera mahimā sarva-śāstrete vākhāne\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eatistuti, hena kabhu nā bhāviha mane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eagastya, ananta, brahmā, śivādi satata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eye nāma-mahimā-gāthā saṅkīrtana-rata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ese nāma-mahimā-sindhu ke pāibe pāra?\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eatistuti bale yei—sei durāchāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe Name’s glories are proclaimed in all the scriptures. Never consider such glorification to be exaggerated praise. Agastya, Ananta, Brahmā, Śiva, and so on are always devoted to chanting the Name’s glories. Who can cross the ocean of those glories? Anyone who considers them exaggerated praise is wicked.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛṣṇa-nāmāvali nitya golokera dhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekalpita, prākṛta, bhāve—aparādhi-jana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKṛṣṇa’s Names are the eternal wealth of Goloka. Anyone who considers Them imaginary or mundane is an offender.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enāme sarva-pāpa-kṣaya sarva-śāstre kaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esārā-dina pāpa kari sei bharasāya—\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eemata durbuddhi yāra sei aparādhī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emāyā-pravañchita, duḥkha bhuñje niravadhi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAll the scriptures declare that the Name destroys all sin. The wicked who sin all day long in expectation of this are offenders. They are deluded by māyā and suffer perpetually.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eatulya śrī-kṛṣṇa-nāma pūrṇa-rasa-nidhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etā̐ra sama nā bhāviha śubha-karma ādi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Kṛṣṇa’s incomparable Name is a brimming reservoir of rasa. Chanting the Name should never be considered equal to pious worldly action (such as adhering to vows, practising renunciation, performing austerities, making sacrificial offerings, and so on).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enāme śraddhā-hina-jana—vidhātā vāñchita\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etāre nāma dāne aparādha suniśchita\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThose who have no faith in the Name have been deceived by Providence. To give the Name to them is certainly an offence.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśuniyāo kṛṣṇa-nāma-māhātmya apāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eye prīti-rahita, sei narādhama chhāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eahaṁtā mamatā yāra antare bāhire\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśuddha kṛṣṇa-nāma tāra kabhu nāhi sphure\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThose who remain devoid of love for Kṛṣṇa’s Name even after hearing His boundless glories are deplorable, fallen souls. The pure Name of Kṛṣṇa never reveals Himself to those who are internally and externally ridden with egotism and possessiveness.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eei daśa aparādha kariyā varjjana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eye sujana kare harināma saṅkīrtana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eapūrva śrī-kṛṣṇa-prema labhya tāre haya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma-prabhu tāra hṛde nitya vilasaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGreat souls who avoid these ten offences and engage in Hari-nām-saṅkīrtan attain unprecedented Śrī Kṛṣṇa-prema. The Name Himself plays within their hearts eternally.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-prabhu-kohe-kohilan-ei-mahamantra\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eHare Kṛṣṇa mahāmantra \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Vṛndāvan Dās Ṭhākur\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehare kṛṣṇa hare kṛṣṇa kṛṣṇa kṛṣṇa hare hare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehare rāma hare rāma rāma rāma hare hare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprabhu kahe—kahilāṅ ei mahāmantra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eihā japa’ giyā sabe kariyā nirbandha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eihā haite sarva-siddhi ha-ibe sabāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esarva-kṣaṇa bala’ ithe vidhi nāhi āra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eki śayane ki bhojane, ki vā jāgaraṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eahar-niśa chinta kṛṣṇa, balaha vadane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāma-prati sneha yadi thāke sabākāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa vinā keha kichhu nā balibe āra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e\u003ci\u003e(Śrī Chaitanya-bhāgavata: Madhya-khaṇḍa, 23.76–8, 28.27–8)\u003c/i\u003e\u003cbr\u003e\nŚrīman Mahāprabhu declared, “I have told you all this mahāmantra. Chant it earnestly. By doing so, you will attain all perfection. Chant always. There are no rules in that regard. Whether you are resting, eating, or awake—day and night think of Kṛṣṇa and chant His Name aloud. If you have any affection for Me, do not speak of anything other than Kṛṣṇa.”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-cheto-darpana-marjanam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrī Chaitanya Mahāprabhu\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echeto-darpaṇa-mārjanaṁ bhava-mahā-dāvāgni-nirvāpaṇaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśreyaḥ-kairava-chandrikā-vitaraṇaṁ vidyā-vadhū-jīvanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eānandāmbudhi-vardhanaṁ prati-padaṁ pūrṇāmṛtāsvādanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esarvātma-snapanaṁ paraṁ vijayate śrī-kṛṣṇa-saṅkīrtanam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Kṛṣṇa-saṅkīrtan cleanses the mirror of consciousness, extinguishes the raging forest fire of material existence, shines moonlight on the evening lotus of good fortune, is the life of divine knowledge, expands the ocean of ecstasy, is the taste of full nectar at every moment, and soothes the entire self. May Śrī Kṛṣṇa-saṅkīrtan be supremely victorious!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enāmnām akāri bahudhā nija-sarva-śaktis\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etatrārpitā niyamitaḥ smaraṇe na kālaḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eetādṛśī tava kṛpā bhagavan mamāpi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edurdaivam īdṛśam ihājani nānurāgaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Lord, You have manifested Your numerous Names, placed all of Your power within Them, and made no rules regarding the time for remembering Them. Such is Your great mercy. My misfortune, however, is that I have no attachment to Your Names.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etṛṇād api sunīchena taror iva sahiṣṇunā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eamāninā mānadena kīrtanīyaḥ sadā hariḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThe Lord’s Name is to be chanted always, with more humility than a blade of grass, tolerance like that of a tree, respect for everyone, and without desire for respect from anyone.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ena dhanaṁ na janaṁ na sundarīṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekavitāṁ vā jagad-īśa kāmaye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emama janmani janmanīśvare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhavatād bhaktir ahaitukī tvayi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Lord of the universe, I do not desire wealth, followers, beautiful women, or erudition (dharma, artha, kāma, or mokṣa). Birth after birth, I desire only unconditional devotion to You.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eayi nanda-tanuja kiṅkaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epatitaṁ māṁ viṣame bhavāmbudhau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛpayā tava pāda-paṅkaja-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esthita-dhūlī-sadṛśaṁ vichintaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Kṛṣṇa, Your servant has fallen into the terrible ocean of this world. Mercifully consider me a speck of dust at Your lotus feet.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enayanaṁ galad-aśru-dhārayā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evadanaṁ gadgada-ruddhayā girā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epulakair nichitaṁ vapuḥ kadā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava nāma-grahaṇe bhaviṣyati\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eWhen will tears stream from my eyes, my voice falter, and the hair on my body stand on end as I call Your Name?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyugāyitaṁ nimeṣeṇa chakṣuṣā prāvṛṣāyitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśūnyāyitaṁ jagat sarvaṁ govinda-viraheṇa me\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Govinda, in separation from You, a moment feels like an age, tears pour from my eyes, and the world is void.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eāśliṣya vā pāda-ratāṁ pinaṣṭu mām\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eadarśanān marma-hatāṁ karotu vā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyathā tathā vā vidadhātu lampaṭo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emat-prāṇa-nāthas tu sa eva nāparaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThat debauchee may tightly embrace this maidservant, or He may leave me and break my heart. He may do as He likes, but He alone is the Lord of my heart.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eSongs by Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-sujanarvuda-radhita-pada-yugam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śrī Prabhupāda-padma Stavakaḥ \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eby Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esujanārvuda-rādhita-pāda-yugaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyuga-dharma-dhurandhara-pātra-varam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaradābhaya-dāyaka-pūjya-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMy master, Prabhupād Śrīla Bhakti Siddhānta Saraswatī Ṭhāk
