nāhi āra\",\"author\":\"Śrīla Premānanda Dās\"},\"title\":[\"Emana Gaurāṅga vine nāhi āra\"],\"author\":[\"by Śrīla Premānanda Dās\"],\"verses\":[{\"number\":\"1\",\"text\":[\"    emana gaurāṅga vine nāhi āra\",\"hena avatāra    habe ki hayechhe\",\"    hena prema parachāra\"],\"translation\":[\"There is no one like Gaurāṅga! Has there ever been and will there ever be an Avatār who distributes divine love like Him?\"],\"isLong\":false},{\"text\":[\"(hay ni ār habār nay re)\"],\"translation\":[\"Oh! There has never been and never will be!\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"duramati ati    patita pāṣaṇḍī\",\"    prāṇe nā mārila kāre\",\"hari-nāma diye    hṛdaya śodhila\",\"    yāchi giyā ghare ghare\"],\"translation\":[\"He did not kill the fallen, wicked-hearted sinners; He gave them the Lord’s Name and purified their hearts. He went from house to house and begged them (to accept divine love).\"],\"isLong\":false},{\"text\":[\"(ke nibi ke nibi bale)\",\"(yeche yeche yeche beḍāy)\"],\"translation\":[\"“Who will take? Who will take? He goes out asking, asking, and asking.”\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"bhava-viriñchira    vāñchhita ye prema\",\"    jagate phelila ḍhāli\",\"    (bhava viriñchira yā vāñchhā kare)\",\"kāṅgale pāiye    khāila nāchiye\",\"    bājāiye karatāli\"],\"translation\":[\"He freely distributed throughout the world divine love that is desired by even Brahmā and Śiva. The poor received and relished it, dancing and clapping their hands.\"],\"isLong\":false},{\"text\":[\"(karatāli bājāiye)\",\"(gaurahari hari bale    karatāli bājāiye)\"],\"translation\":[\"Clapping their hands! Chanting, “Gaurahari Hari!” and clapping their hands!\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"hāsiye kā̐diye    preme gaḍāgaḍi\",\"    pulake vyāpila aṅga\",\"chaṇḍāle brāhmaṇe    kare kolākuli\",\"    kabe vā chhila e raṅga\"],\"translation\":[\"Filled with divine love, they laughed, cried, and rolled about. Their body hair stood on end. The brāhmaṇs and the outcastes embraced. When were there ever such Pastimes?\"],\"isLong\":false},{\"text\":[\"(chaṇḍāle brāhmaṇe    kare kolākuli\",\"    e raṅga kabe vā chhila)\"],\"translation\":[\"The brāhmaṇs and the outcastes embraced. When were there ever such Pastimes?\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"ḍākiye hā̐kiye    khola-karatāle\",\"    gāiye dhāiye phire\",\"dekhiyā śamana    tarāsa pāiye\",\"    kapāṭa hānila dvāre\"],\"translation\":[\"Howling and calling out, they sang and ran about with mṛdaṅgas and kartāls. Seeing this, Yamarāj became afraid and closed his doors and shutters.\"],\"isLong\":false},{\"text\":[\"(bhaja bhaja gaurahari yā̐ra nāme śamaṇa palāy)\"],\"translation\":[\"Serve! Serve Gaurahari! Yamarāj flees from His Name.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"e tina bhuvana    ānande bharila\",\"    uṭhila maṅgala-sora\"],\"translation\":[\"The three worlds filled with joy, and an auspicious tumult arose.\"],\"isLong\":false},{\"text\":[\"(ānander ār sīmā nāi re)\",\"(gauraharir āgamane    ānander ār sīmā nāi re)\",\"(nirānanda dūre gela    ānander ār sīmā nāi re)\",\"(gauraharir āgamane    premānander udaya hala)\",\"(premānander udaya hala    sabāi mile haribola)\"],\"translation\":[\"There is no limit to our joy! By Gaurahari’s arrival, there is no limit to our joy! All unhappiness has gone away, and there is no limit to our joy! By Gaurahari’s arrival, the joy of divine love has arisen, and everyone together chants “Hari!”\"],\"isLong\":false},{\"text\":[\"kahe premānanda    emana gaurāṅge\",\"    rati nā janmila mora\"],\"translation\":[\"Premānanda says, “I never developed attachment to Lord Gaurāṅga.”\"],\"isLong\":false},{\"text\":[\"(āmār rati-mati hala nā ye)\",\"(eman dayāl prabhu avatāre, āmār rati-mati hala nā re)\",\"(eman dayāl prabhu esechhila, āmār rati-mati hala nā re)\",\"(gaurahari hari bala)\"],\"translation\":[\"I never developed attachment. I never developed attachment to this most merciful Lord. This most merciful Lord has come, but I have never developed attachment to Him. Oh! Chant, “Gaurahari!”\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1a:[\"$\",\"$L22\",null,{\"navMap\":{\"77\":{\"prev\":{\"path\":\"/en-pe/vimala-hemajin-tanu-anupama-re/\",\"title\":\"Vimala hema jini\"},\"next\":{\"path\":\"/en-pe/ke-jabi-ke-jabi-bhai-bhava-sindhu-para/\",\"title\":\"Ke yābi ke yābi\"}}}}]\n23:Tcbe,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"description\":\"A digital Vaishnava songbook with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPage\",\"@id\":\"https://dev.kirtan.site/en-pe/emona-gauranga-bine-nahi-ara/\",\"url\":\"https://dev.kirtan.site/en-pe/emona-gauranga-bine-nahi-ara/\",\"name\":\"Emana Gaurāṅga vine nāhi āra. by Śrīla Premānanda Dās\",\"inLanguage\":\"en\",\"description\":\"Emana Gaurāṅga vine nāhi āra — a Vaiṣṇava song by Śrīla Premānanda Dās with lyrics, English translation and word-by-word meaning. From Pocket Kirtan Guide.\",\"breadcrumb\":{\"@id\":\"https://dev.kirtan.site/en-pe/emona-gauranga-bine-nahi-ara/#breadcrumb\"},\"mainEntity\":{\"@id\":\"https://dev.kirtan.site/en-pe/emona-gauranga-bine-nahi-ara/#composition\"},\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"}},{\"@type\":\"BreadcrumbList\",\"@id\":\"https://dev.kirtan.site/en-pe/emona-gauranga-bine-nahi-ara/#breadcrumb\",\"itemListElement\":[{\"@type\":\"ListItem\",\"position\":1,\"name\":\"Pocket Kirtan Guide\",\"it
