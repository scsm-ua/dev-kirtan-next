"trans\":\"em separação\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"yathā tathā\",\"trans\":\"Qualquer coisa\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"vā\",\"trans\":\"aquele debochado\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"vidadhātu lampaṭo\",\"trans\":\"pode fazer\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"mat\",\"trans\":\"Ainda assim\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"prāṇa\",\"trans\":\"Ele\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"nāthas\",\"trans\":\"sozinho, [e]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"tu sa\",\"trans\":\"ninguém mais, [é]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"eva\",\"trans\":\"o Senhor\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nāparaḥ\",\"trans\":\"do meu\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"subtitle\":[\"Gīti\"],\"isLong\":false},{\"number\":\"1\",\"text\":[\"(bandhu-gaṇa) śunaha vachana mora\",\"bhāvete vibhora thākiye yakhana\",\"dekhā deya chitta-chora\"],\"word_by_word\":[\"**(bandhu-gaṇa)**–Ó amigos! **śunaha**–Escutem **mora**–minhas **vachana**–palavras. **thākiye**–Eu fico **vibhora**–cheia **bhāvete**–de êxtase **yakhana**–quando **chora**–o ladrão **chitta**–do [meu] coração **dekhā deya**–aparece [diante de mim].\"],\"translation\":[\"Ó amigos! Escutem minhas palavras. Eu fico cheia de êxtase quando o ladrão do meu coração aparece diante de mim.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"(bandhu-gaṇa\",\"trans\":\"Ó amigos!\",\"sep\":\") \",\"error\":\"multi\"},{\"text\":\"śunaha\",\"trans\":\"Escutem\",\"sep\":\" \"},{\"text\":\"vachana\",\"trans\":\"minhas\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"mora\",\"trans\":\"palavras\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"bhāvete\",\"trans\":\"Eu fico\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"vibhora\",\"trans\":\"cheia\",\"sep\":\" \"},{\"text\":\"thākiye\",\"trans\":\"de êxtase\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"yakhana\",\"trans\":\"quando\",\"sep\":\"\"}],[{\"text\":\"dekhā\",\"trans\":\"o ladrão\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"deya\",\"trans\":\"do [meu] coração\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"chitta-chora\",\"trans\":\"aparece [diante de mim]\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"2\",\"text\":[\"vichakṣaṇa kari’ dekhite chāhile\",\"haya ā̐khi-agochara\",\"punaḥ nāhi dekhi’ kā̐daye parāṇa\",\"duḥkhera nā thāke ora\"],\"word_by_word\":[\"[Mas] **chāhile**–quando eu olho **vichakṣaṇa kari’**–e foco **dekhite**–para vê-Lo, **agochara haya**–Ele desaparece **ā̐khi**–dos [meus] olhos. **punaḥ**–Novamente, **nāhi**–não **dekhi’**–vendo [Ele], [meu] **parāṇa**–coração **kā̐daye**–chora, [e] **ora**–um fim **duḥkhera**–para [minha] tristeza **thāke nā**–não existe.\"],\"translation\":[\"Mas quando eu fixo os olhos para vê-Lo mais claramente, Ele desaparece. Novamente, não O vendo, meu coração chora, e minha tristeza é sem fim.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"vichakṣaṇa\",\"trans\":\"quando eu olho\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kari’ dekhite\",\"trans\":\"e foco\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"chāhile\",\"trans\":\"para vê-Lo\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"haya ā̐khi\",\"trans\":\"Ele desaparece\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"agochara\",\"trans\":\"dos [meus] olhos\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"punaḥ\",\"trans\":\"Novamente\",\"sep\":\" \"},{\"text\":\"nāhi\",\"trans\":\"não\",\"sep\":\" \"},{\"text\":\"dekhi\",\"trans\":\"vendo [Ele], [meu]\",\"sep\":\"’ \"},{\"text\":\"kā̐daye\",\"trans\":\"coração\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"parāṇa\",\"trans\":\"chora, [e]\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"duḥkhera\",\"trans\":\"um fim\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nā\",\"trans\":\"para [minha] tristeza\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"thāke ora\",\"trans\":\"não existe\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"3\",\"text\":[\"jagatera bandhu sei kabhu more laya sātha\",\"yathā tathā rākhu more āmāra se prāṇanātha\"],\"word_by_word\":[\"**kabhu**–Às vezes **sei**–Ele, **bandhu**–o amigo **jagatera**–do mundo **laya**–leva **more**–me **sātha**–com [Ele]. **yathā tathā**–Seja como for **rākhu**–Ele pode tratar **more**–me. **se**–Ele [é] **nātha**–o Senhor **āmāra**–do meu **prāṇa**–coração.\"],\"translation\":[\"Às vezes, Ele, o amigo do mundo, me leva consigo. Não importa como ele me trate, Ele é o Senhor do meu coração.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"jagatera\",\"trans\":\"Às vezes\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bandhu\",\"trans\":\"Ele\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sei\",\"trans\":\"o amigo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kabhu\",\"trans\":\"do mundo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"more\",\"trans\":\"leva\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"laya\",\"trans\":\"me\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sātha\",\"trans\":\"com [Ele]\",\"sep\":\"\"}],[{\"text\":\"yathā tathā\",\"trans\":\"Seja como for\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"rākhu\",\"trans\":\"Ele pode tratar\",\"sep\":\" \"},{\"text\":\"more\",\"trans\":\"me\",\"sep\":\" \"},{\"text\":\"āmāra\",\"trans\":\"Ele [é]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"se\",\"trans\":\"o Senhor\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"prāṇanātha\",\"trans\":\"do meu\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"4\",\"text\":[\"darśana-ānanda-dāne sukha deya mora prāṇe\",\"bale more praṇaya-vachana\",\"punaḥ adarśana diyā dagdha kare mora hiyā\",\"prāṇe more māre prāṇa-dhana\"],\"word_by_word\":[\"**dāne**–Por [me] dar **ānanda**–o êxtase **darśana**–do encontro [com Ele e] **bale**–por dizer **vachana**–palavras **praṇaya**–amorosas **more**–a mim, [Ele] **sukha** **deya**–deleita **mora**–meu **prāṇe**–coração. **punaḥ**–Novamente **adarśana diyā**–ao abandonar [me], **dagdha kare**–Ele queima **mora**–meu **hiyā**–coração. **māre**–Ele mata **more**–meu **prāṇe**–coração. [Ainda assim, Ele é] **dhana**–a riqueza **prāṇa**–do [meu] coração.\"],\"translation\":[\"Ao me dar a alegria de encontrá-Lo e ao dizer palavras amorosas a mim, Ele deleita meu coração. Novamente, ao me abandonar, Ele queima e parte meu coração. Ainda assim, Ele é meu amado.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"darśana\",\"trans\":\"Por [me] dar\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"ānanda\",\"trans\":\"o êxtase\",\"sep\":\"-\"},{\"text\":\"dāne\",\"trans\":\"do encontro [com Ele e]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sukha\",\"trans\":\"por dizer\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"deya\",\"trans\":\"palavras\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"mora\",\"trans\":\"amorosas\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"prāṇe\",\"trans\":\"a mim, [Ele]\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"bale\",\"trans\":\"deleita\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"more\",\"trans\":\"meu\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"praṇaya\",\"trans\":\"coração\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"vachana\",\"trans\":\"Novamente\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"punaḥ adarśana\",\"trans\":\"ao abandonar [me]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"diyā dagdha\",\"trans\":\"Ele queima\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kare\",\"trans\":\"meu\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"mora\",\"trans\":\"coração\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hiyā\",\"trans\":\"Ele mata\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"prāṇe\",\"trans\":\"meu\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"more\",\"trans\":\"coração. [Ainda assim, Ele é]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"māre\",\"trans\":\"a riqueza\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"prāṇa\",\"trans\":\"do [meu] coração\",\"sep\":\"-\"},{\"text\":\"dhana\",\"trans\":\"-\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"5\",\"text\":[\"yāhe tāra sukha haya, sei sukha mama\",\"nija sukhe duḥkhe mora sarvadāi sama\"],\"word_by_word\":[\"**sei yāhe**–O que importa [é que] **tāra haya**–Ele esteja **sukha**–feliz. [Isso é] **mama**–minha **sukha**–felicidade. [Minha] **nija**–própria **sukhe**–felicidade [ou] **duḥkhe**–tristeza [são] **sarvadāi**–sempre **sama**–o mesmo **mora**–para mim.\"],\"translation\":[\"Desde que Ele esteja feliz, isso é minha felicidade. Minha própria felicidade ou tristeza são sempre a mesma coisa para mim.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"yāhe tāra\",\"trans\":\"O que importa [é que]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sukha haya\",\"trans\":\"Ele esteja\",\"sep\":\", \",\"error\":\"mismatch\"},{\"text\":\"sei\",\"trans\":\"feliz. [Isso é]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sukha\",\"trans\":\"minha\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"mama\",\"trans\":\"felicidade. [Minha]\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"nija\",\"trans\":\"própria\",\"sep\":\" \"},{\"text\":\"sukhe\",\"trans\":\"felicidade [ou]\",\"sep\":\" \"},{\"text\":\"duḥkhe\",\"trans\":\"tristeza [são]\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"sempre\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sarvadāi\",\"trans\":\"o mesmo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sama\",\"trans\":\"para mim\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"6\",\"text\":[\"bhakati-vinoda saṁyoge viyoge\",\"tāhe jāne prāṇeśvara\",\"tāra sukhe suk
