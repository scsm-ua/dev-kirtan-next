 gelā\",\"trans\":\"responsabilidade, ansiedade [se]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"tuyā\",\"trans\":\"foi\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"o\",\"trans\":\"ao abraçar\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"pada\",\"trans\":\"aqueles\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"varaṇe\",\"trans\":\"Seus\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"3\",\"text\":[\"mārabi rākhabi—yo ichhā tohārā\",\"nitya-dāsa prati tuyā adhikāra\"],\"word_by_word\":[\"**mārabi (māribe)**–Você pode [me] matar **rākhabi**–Você pode [me] proteger [o] **yo (ye)**–que [for] **tohārā**–Seu **ichchha**–desejo. **tuyā**–Sua **adhikāra**–autoridade [é total] **prati**–por meio [deste] **dāse**–Seu servo **nitya**–eterno.\"],\"translation\":[\"Mate-me ou me proteja como Você desejar. Você tem total autoridade sobre o Seu servo eterno.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"mārabi rākhabi—yo\",\"trans\":\"Você pode [me] matar\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"ichhā\",\"trans\":\"Você pode [me] proteger [o]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"tohārā\",\"trans\":\"que [for]\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"nitya\",\"trans\":\"Seu\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"dāsa\",\"trans\":\"desejo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"prati\",\"trans\":\"Sua\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"tuyā\",\"trans\":\"autoridade [é total]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"adhikāra\",\"trans\":\"por meio [deste]\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"4\",\"text\":[\"janmāobi maye ichhā yadi tora\",\"bhakta-gṛhe jani janma ha-u mora\"],\"word_by_word\":[\"**yadi**–Se [for] **tora**–Seu **ichchhā**–desejo **janmāobi**–Você pode causar o nascimento **moye**–meu **jani (yena)**–para que **mora**–meu **janma**–nascimento **ha-u (ha-uka)**–possa ser **gṛhe**–na cas
