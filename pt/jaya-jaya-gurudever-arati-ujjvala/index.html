bhākara sama prabhā bhuvana-vidita\"],\"translation\":[\"Você ilumina a linha de Śrī Rūpa. Como o sol, sua refulgência é conhecida por todo o mundo.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"śuddha bhakti prachārite tomā sama nāi\",\"akalaṅka indu yena dayāla nitāi\"],\"translation\":[\"Não há ninguém como você para pregar devoção pura. Você é uma lua sem mácula tal como o misericordioso Nityānanda.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"ullasita viśva-vāsī labhe prema-dhana\",\"ānande nāchiyā gāhe tava guṇa-gaṇa\"],\"translation\":[\"Atingindo a riqueza do amor divino (pela sua graça), almas alegres cantam suas glórias por todo o mundo, dançando em êxtase.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"sthāpilā āśrama bahu jagata mājhāre\",\"pāramahaṁsa-dharma-jñāna śikṣāra prachāre\"],\"translation\":[\"Você estabeleceu muitos ashrams por todo o mundo para ensinar o paramahaṁsa-dharma (a maneira dos Vaiṣṇavas verdadeiros).\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"chintyāchintya veda-jñāne tumi adhikārī\",\"sakala saṁśaya chhettvā susiddhānta-dhārī\"],\"translation\":[\"Você é o mestre tanto do conhecimento Védico concebível quanto do inconcebível. Você lança fora todas as dúvidas e representa os ensinamentos da verdade.\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"tomāra mahimā gāhe goloka maṇḍale\",\"nitya-siddha parikare tava līlā-sthale\"],\"translation\":[\"Seus associados, eternamente liberados, cantam suas glórias em Goloka, o reino de seus Passatempos.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"patita pāvana tumi dayāra samīra\",\"sarva-kārye sunipuṇa satya-sugambhīra\"],\"translation\":[\"Você é o salvador dos caídos e uma brisa de misericórdia. Você é verdadeiro, profundo, e *expertise* em todos os tipos de serviço.\"],\"isLong\":false},{\"number\":\"12\",\"text\":[\"apūrva lekhanī dhārā pragāḍha pāṇḍitya\",\"sadā hāsya miṣṭa-bhāṣī suśīla kavitva\"],\"translation\":[\"Seus escritos são incomparavelmente maravilhosos e seu conhecimento é profundo. Você sempre sorri e diz palavras doces. Sua poesia é perfeita.\"],\"isLong\":false},{\"number\":\"13\",\"text\":[\"sādhu-saṅge sadānandī sarala vinayī\",\"sabhā-madhye vaktā śreṣṭha sarvatra vijayī\"],\"translation\":[\"Você está sempre alegre na associaçao dos sādhus. Você é simples e humilde. Nas assembleias, você é o melhor orador.\"],\"isLong\":false},{\"number\":\"14\",\"text\":[\"gauḍīya gagane tumi āchārya-bhāskara\",\"nirantara sevā-priya miṣṭa kaṇṭhasvara\"],\"translation\":[\"No céu dos Gauḍīya Vaiṣṇavas, você é o Āchārya solar. Você sempre gosta de serviço, e sua voz é doce.\"],\"isLong\":false},{\"number\":\"15\",\"text\":[\"tomāra karuṇā māge trikāla vilāse\",\"gāndharvikā-giridhārī sevā-mātra āśe\"],\"translation\":[\"No passado, presente, e futuro este servo ora por sua misericórdia, desejando apenas servir Śrī Śrī Gāndharvikā-Giridhārī.\"],\"isLong\":false},{\"number\":\"16\",\"text\":[\"kṛpā kara ohe prabhu śrī-gaura-prakāśa\",\"ārati karaye sadā e adhama dāsa\"],\"translation\":[\"Seja misericordioso, Ó senhor, manifestação de Śrī Gaurāṅga! Este servo caído sempre te adora.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.K. Ashram Maharaj\",\"ru\":\"Шрила Б.К. Ашрам Махарадж\",\"ua\":\"Шріла Б.К. Ашрам Махарадж\"},\"embed_url\":\"https://soundcloud.com/scsmathcolombia/3-sri-guru-arati\"},{\"title\":{\"en\":\"Srila B.N. Acharya Maharaj\",\"ru\":\"Шрила Б.Н. Ачарья Махарадж\",\"ua\":\"Шріла Б.Н. Ачарʼя Махарадж\"},\"embed_url\":\"https://soundcloud.com/kostya-netrebenko/003-jayajayagurudeveraratiujjvala-5\"},{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-jaya-jaya\"},{\"title\":{\"en\":\"Caracas temple\",\"ru\":\"Храм г.Каракас\",\"ua\":\"Храм м.Каракас\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/shchsm-karakas-dzhaya-dzhaya\"}]},\"hasWbw\":false,\"
