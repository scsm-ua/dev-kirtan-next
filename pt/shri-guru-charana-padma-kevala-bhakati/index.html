"page\":61,\"first_line\":\"śrī guru charaṇa-padma\"},\"title\":[\"Śrī Guru-vaiṣṇava Māhātmya-gīti\"],\"author\":[\"Śrīla Narottam Dās Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"śrī guru charaṇa-padma    kevala bhakati-sadma\",\"    vando̐ muñi sāvadhāna mate\",\"yā̐hāra prasāde bhāi    e bhava tariyā yāi\",\"    kṛṣṇa-prāpti haya yā̐hā haite\"],\"translation\":[\"Ofereço cuidadosamente minha reverência aos pés de lótus de Śrī Guru, que são a única morada da devoção. Ó irmão! Pela misericórdia dele, nós atravessamos este mundo e alcançamos Kṛṣṇa.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"guru-mukha-padma-vākya    chitete kariyā aikya\",\"    āra nā kariha mane āśā\",\"śrī guru-charaṇe rati    ei se uttama-gati\",\"    ye prasāde pūre sarva āśā\"],\"translation\":[\"Faça os ensinamentos da boca de lótus de Śrī Guru unos com seu coração, e não deseje nada mais internamente. O apego aos pés de Śrī Guru é o melhor caminho. Por sua misericórdia todos os desejos são realizados.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"chakṣu-dāna dilā yei    janme janme prabhu sei\",\"    divya-jñāna hṛde prakāśita\",\"prema-bhakti yā̐hā haite    avidyā vināśa yāte\",\"    vede gāya yā̐hāra charita\"],\"translation\":[\"Aquele que me deu o dom da visão é meu senhor, nascimento após nascimento. Ele manifestou o conhecimento divino em meu coração. Ele dá prema-bhakti e destrói a ignorância. Os Vedas cantam sobre seu caráter.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"śrī-guru karuṇā-sindhu    adhama janāra bandhu\",\"    lokanātha lokera jīvana\",\"hā hā prabhu kara dayā    deha more pada-chhāyā\",\"    e adhama la-ila śaraṇa\"],\"translation\":[\"Śrī Guru é um oceano de misericórdia e o amigo dos caídos. Ele é o senhor e a vida de todas as pessoas. Ó mestre! Seja misericordioso. Me dê a sombra de seus pés. Esta alma caída tomou abrigo em você.\"],\"isLong\":false},{\"text\":[\"(āmi) (śaraṇ nilām)\",\"(abhaya-śrī-pāda-padme    śaraṇ nilām)\",\"(āmāy) (dayā kara he)\",\"(patit-pāvan śrī gurudev    dayā kara he)\",\"(adhama patita jene    dayā kara he)\",\"(jay gurudev)\"],\"translation\":[\"Eu me abriguei. Tomei abrigo em seus pés de lótus, onde não há medo. Por favor, tenha misericórdia de mim. Ó Śrī Gurudev, purificador dos caídos, por favor, tenha misericórdia de mim. Compreendendo que sou humilde e caído, tenha misericórdia de mim. Toda glória a você, Śrī Gurudev!\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/kostya-netrebenko/10-sri-guru-charana-padma-11\"},{\"title\":{\"en\":\"Srila B.N. Acharya Maharaj\",\"ru\":\"Шрила Б.Н. Ачарья Махарадж\",\"ua\":\"Шріла Б.Н. Ачарʼя Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/acharya-maharaj-sri-guru\"},{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-sri-guru-charana\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"20:[\"$\",\"$L29\",null,{\"audio\":\"$1f:props:song:resources:audio\",\"caption\":\"Ouvir áudio:\",\"language\":\"pt\"}]\n21:[\"$\",\"$L2a\",null,{\"navMap\":{\"61\":{\"prev\":{\"path\":\"/pt/vibhavari-shiesha-aloka-praveshia/\",\"title\":\"Vibhāvarī Śeṣa\"},\"next\":{\"path\":\"/pt/shri-krishna-chaitanya-prabhu-daya-kara-more/\",\"title\":\"Sāvaraṇa-Śrī-Gaura-pāda-padme Prārthanā\"}}}}]\n2b:T123e,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"u
