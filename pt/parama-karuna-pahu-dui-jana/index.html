:[\"Cantem alto: “Gaurahari”! Abandonem as conversas mundanas e cantem alto: “Gaurahari”! Abandonem as conversas vulgares e cantem alto:”Gaurahari”!\"],\"isLong\":false},{\"text\":[\"dekha ore bhāi    tribhuvane nāi\",\"    emana dayāla dātā\"],\"translation\":[\"Ó irmão! Olhe! Não há benfeitores tão misericordiosos como Eles nos três mundos.\"],\"isLong\":false},{\"text\":[\"(eman dayāl ke vā āchhe)\",\"(nitāira gaurer mata eman dayāl ke vā āchhe)\",\"(mar kheyeo nām prema yāche eman dayāl ke vā āchhe)\"],\"translation\":[\"Quem mais é tão misericordioso? Quem é tão misericordioso quanto Nitāi e Gaura? Eles toleram serem espancados, e ainda assim Eles pedem aos agressores que aceitem o Santo Nome e o amor divino. Quem mais é tão misericordioso?\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"paśu pākhī jhure    pāṣāṇa vidare\",\"    śuni yā̐ra guṇa-gāthā\"],\"translation\":[\"Escutando sobre a glória Deles, pássaros e animais choram, e pedras derretem.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"saṁsāre majiyā    rahili paḍiyā\",\"    se pade nahila āśa\",\"āpana karama    bhuñyāya śamana\",\"    kahaye lochana dāsa\"],\"translation\":[\"“Caído e imerso no saṁsāra, eu nunca aspirei aos Seus pés. Agora Yamarāj me sujeita ao meu karma.” Assim diz Lochan Dās.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-parama-koruna\"},{\"title\":{\"en\":\"Srila B.N. Acharya Maharaj\",\"ru\":\"Шрила Б.Н. Ачарья Махарадж\",\"ua\":\"Шріла Б.Н. Ачарʼя Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/acharya-maharaj-paramakaruna\"},{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-parama-koruna\"}]},\"hasWbw\":fa
