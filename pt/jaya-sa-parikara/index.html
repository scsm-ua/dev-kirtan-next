an, Bhaṭṭa Raghunāth, Śrī Jīva, Gopāl\",\"\",\"Bhaṭṭa, Dās Raghunāth, Ṣaḍ Goswāmī Prabhu kī jay!\",\"\",\"Śrī Rūpānuga Guru-varga kī jay!\",\"\",\"Namāchārya Śrīla Hari Dās Ṭhākur kī jay!\",\"\",\"Śrīla Svarūp Dāmodar, Śrīla Rāy Rāmānandādi Śrī Gaura-śakti-varga kī jay!\",\"\",\"Premse Kaho Śrī Kṛṣṇa Chaitanya Prabhu Nityānanda Śrī Advaita Gadadhar Śrīvāsādi Gaura-bhakta-vṛnda kī jay!\",\"\",\"Sapārṣad Śrī Nityānanda Prabhu kī jay!\",\"\",\"Sapārṣad Śrīman Mahāprabhu kī jay!\",\"\",\"Śrī Nabadwip Dham kī jay!\",\"\",\"Śrī Gaṅgā Yamunā kī jay!\",\"\",\"Śrī Vṛndāvan Dham kī jay!\",\"\",\"Śrī Śrī Rādhā-Kṛṣṇa Gopa Gopī Śyām Kuṇḍa Rādhā Kuṇḍa Go Girirāj Govardhan kī jay!\",\"\",\"Bhakti Devī Vṛndā Devī Tulasī Devī kī jay!\",\"\",\"Śrī Puruṣottam Dhām kī jay!\",\"\",\"Baladev Subhadrā Jagannāth Jīu kī jay!\",\"\",\"Grantharāj Śrīmad Bhāgavatam Śrī Chaitanya-charitāmṛta kī jay!\",\"\",\"Ākar Maṭh Rāj Śrī Chaitanya Maṭh kī jay!\",\"\",\"Tadīya Śākhā Maṭh kī jay!\",\"\",\"Śrī Chaitanya Sāraswat Maṭh kī jay!\",\"\",\"Śrī Chaitanya Śrīdhar Govinda Sevā Ashram kī jay!\",\"\",\"Viśva-vyāpī Tadīya Śākhā Maṭh kī jay!\",\"\",\"Ananta-koṭī Vaiṣṇava-vṛnda kī jay!\",\"\",\"Samaveta Vaiṣṇava-vṛnda kī jay!\",\"\",\"Hari-nām-saṅkīrtan kī jay!\",\"\",\"Nitāi Gaura Premānande! Haribol!\"],\"isLong\":true}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/kostya-netrebenko/00-jaya-dhvani-14\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":false,\"hasLongVerses\":true,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1f:[\"$\",\"$L28\",null,{\"audio\":\"$1e:props:song:resources:audio\",\"caption\":\"Ouvir áudio:\",\"language\":\"pt\"}]\n20:[\"$\",\"$L29\",null,{\"navMap\":{\"7\":{\"prev\":\"$undefined\",\"next\":{\"path\":\"/pt/jaya-jaya-gurudever-arati-ujjvala/\",\"title
