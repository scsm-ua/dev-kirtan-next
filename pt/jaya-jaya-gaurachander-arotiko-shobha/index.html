tros semideuses o adoram (na companhia de Seus devotos).\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"(kibā) narahari-ādi kari chāmara ḍhulāya\",\"sañjaya-mukunda-vāsu-ghoṣa-ādi gāya\",\"    (gaura guṇa gāna kare)\",\"    (sañjaya mukunda vāsu-ghoṣa gaura guṇa gāna kare)\",\"    (nitāi gaura haribol)\"],\"translation\":[\"Narahari e outros abanam o Senhor com chāmaras. Sañjay, Mukunda, Vāsudev Ghoṣ e outros cantam.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"(kibā) śaṅkha bāje ghaṇṭā bāje bāje karatāla\",\"madhura mṛdaṅga bāje parama rasāla\",\"    (madhur madhur madhur bāje)\",\"    (gaurāṅger ārati kāle madhur madhur madhur bāje)\",\"    (śaṅkha bāje ghaṇṭā bāje madhur madhur madhur bāje)\",\"    (madhura mṛdaṅga bāje madhur madhur madhur bāje)\",\"    (nitāi gaura haribol)\"],\"translation\":[\"Conchas, sinos, kartāls e mṛdaṅgas ressoam docemente. O kīrtan é muito agradável.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"(kibā) bahu-koṭi chandra jini vadana ujjvala\",\"gala-deśe vana-mālā kare jhalamala\",\"    (jhalmal jhalmal jhalmal kare)\",\"    (gaura gale vana phuler mālā jhalmal jhalmal jhalmal kare)\",\"    (nitāi gaura haribol)\"],\"translation\":[\"O resplendor da face do Senhor supera o de milhões de luas. A guirlanda de flores silvestres reluz em volta de Seu pescoço.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"(kibā) śiva-śuka-nārada preme gada-gada\",\"bhakati-vinoda dekhe gorāra sampada\"],\"translation\":[\"Śiva, Śukadev, e Nārad gaguejam no êxtase do amor. É assim que Bhakti Vinod contempla a glória de Gorāchā̐d.\"],\"isLong\":false},{\"text\":[\"(ei bār āmāy dayā kara)\",\"(ṭhākura śrī bhakti-vinoda ei bār āmāy dayā kara)\",\"(ṭhākura śrī sarasvatī ei bār āmāy dayā kara)\",\"(patit-pāvan śrī gurudev ei bār āmāy dayā kara)\",\"(sapārṣada gaurahari ei bār āmāy dayā kara)\",\"(nitāi gaura haribol)\"],\"translation\":[\"Desta vez, por favor, me dê sua graça. Ó Śrila Bhakti Vinod Ṭhākur, ó Śrīla Saraswatī Ṭhākur, ó Gurudev, salvador dos caídos, ó Gaurahari, juntamente com seus associados, desta vez por favor me dê sua graça.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-kiba-jaya-jaya\"},{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-kiba-jaya-jaya\"},{\"title\":{\"en\":\"Sudarshan Prabhu\",\"ru\":\"Сударшан Прабху\",\"ua\":\"Сударшан Прабгу\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/sudarshan-prabhu-sri-gaura\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"37:[\"$\",\"$L40\",null,{\"audio\":\"$36:props:song:resources:audio\",\"caption\":\"Ouvir áudio:\",\"language\":\"pt\"}]\n38:[\"$\",\"$L41\",null,{\"navMap\":{\"28\":{\"prev\":{\"path\":\"/pt/bhaja-bhakata-vatsala-shri-gaurahari/\",\"title\":\"Śrī Bhoga Ārati Gīti\"},\"next\":{\"path\":\"/pt/jayare-jayare-jaya-gaura-sarasvati/\",\"title\":\"Śrī Sāraswat Ārati\"}}}}]\n42:T989,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"CollectionPage\",\"@id\":\"https://dev.kirtan.site/pt/jaya-jaya-gaurachander-arotiko-shobha/\",\"url\":\"https://dev.kirtan.site/pt/jaya-jaya-gaurachander-arotiko-shobha/\",\"name\":\"Śrī Gaura Ārati. Śrīla Bhakti Vinod Ṭhākur\",\"inLanguage\":\"pt\",\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"}},{\"@type\":\"MusicComposition\",\"@id\":\"https://dev.kirtan.site/pt/jaya-jaya-gaurachander-arotiko-shobha/#composition\",\"alternateName\":[\"(kibā) jaya jaya gorāchā̐der\"],\"name\":\"Śrī Gaura Ārati. Śrīla Bhakti Vinod Ṭhākur\",\"url\":\"https://dev.kirtan.site/pt/jay
