trong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mukhe bala hari hari\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ irmãos! Sirvam! Sirvam Śrī Śrī Chaitanya–Nitāi com firme fé! Deixem de lado os assuntos mundanos, mergulhem nesse rasa, e cantem alto: “Hari! Hari!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(mukhe bala gaurahari)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(viṣay-kathā parihari’ mukhe bala gaurahari)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(grāmya-kathā parihari’ mukhe bala gaurahari)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCantem alto: “Gaurahari”! Abandonem as conversas mundanas e cantem alto: “Gaurahari”! Abandonem as conversas vulgares e cantem alto:”Gaurahari”!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edekha ore bhāi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tribhuvane nāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;emana dayāla dātā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ irmão! Olhe! Não há benfeitores tão misericordiosos como Eles nos três mundos.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(eman dayāl ke vā āchhe)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(nitāira gaurer mata eman dayāl ke vā āchhe)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(mar kheyeo nām prema yāche eman dayāl ke vā āchhe)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuem mais é tão misericordioso? Quem é tão misericordioso quanto Nitāi e Gaura? Eles toleram serem espancados, e ainda assim Eles pedem aos agressores que aceitem o Santo Nome e o amor divino. Quem mais é tão misericordioso?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epaśu pākhī jhure\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pāṣāṇa vidare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śuni yā̐ra guṇa-gāthā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEscutando sobre a glória Deles, pássaros e animais choram, e pedras derretem.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esaṁsāre majiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rahili paḍiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;se pade nahila āśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāpana karama\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhuñyāya śamana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kahaye lochana dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Caído e imerso no saṁsāra, eu nunca aspirei aos Seus pés. Agora Yamarāj me sujeita ao meu karma.” Assim diz Lochan Dās.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-dayal-nitai-chaitanya-bole-nach-re\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eDayāl Nitāi Chaitanya \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘dayāl nitāi chaitanya’ ba’le nāch re āmār mana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāch re āmār mana, nāch re āmār mana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ minha mente, dance e cante: “Dayāl Nitāi Chaitanya!” Dance, ó minha mente! Dance, ó minha mente!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(eman dayāl ta’ nāi he\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mār kheye prema dey)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOh! Ninguém é tão misericordioso! Nitāi tolera ser agredido. E ainda dá amor divino aos seus agressores.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(ore) aparādha dūre yābe, pābe prema-dhan\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(aparādhera vichāra to nāi he)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(takhan) kṛṣṇa-nāme ruchi habe, ghuchibe bandhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(anurāg to habe he)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEntão minhas ofensas irão embora e irei atingir a riqueza do amor divino. (Nos Nomes de Nitāi e Chaitanya, não há consideração de ofensas.) Vou desenvolver o gosto pelo Nome de Kṛṣṇa e meu cativeiro será destruído. (E aí vou obter o apego amoroso).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(takhan) anāyāse saphal habe jīvera jīvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(naile jīvan to michhe he)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(kṛṣṇa-rati vinā jīver jīvan to michhe he)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(śeṣe) vṛndāvane rādhā-śyāmer pābe daraśana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gaura-kṛpā hale he)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEntão facilmente a vida da alma será bem-sucedida. (Sem apego a Kṛṣṇa, a vida da alma é simplesmente falsa.) Então, no fim da vida, a alma verá Śrī Śrī Rādhā-Śyām em Vrndavan (se Śrī Gaura conceder Sua misericórdia).\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eGaurāṅga\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-gaurangera-duti-pada-jar-dhana-sampada\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eSāvaraṇa-Śrī-Gaura-mahimā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaurāṅgera duṭi pada\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;yāra dhana sampada\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;se jāne bhakati-rasa-sāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaurāṅgera madhura-līlā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;yāra karṇe praveśilā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hṛdaya nirmala bhela tāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAquele cuja fortuna são os pés de Śrī Gaurāṅga conhece a essência do rasa da devoção. O coração daquele que escuta os doces Passatempos de Śrī Gaurāṅga se torna puro.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eye gaurāṅgera nāma laya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāra haya premodaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāre muñi yāi balihāri\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaurāṅga-guṇete jhure\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nitya-līlā tāre sphure\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;se jana bhakati-adhikārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAquele que canta os nomes de Śrī Gaurāṅga desenvolve amor divino. A ele eu digo: “Bravo!” Os eternos Passatempos são revelados àquele que chora sobre as qualidades de Śrī Gaurāṅga. Tal alma é qualificada para devoção.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaurāṅgera saṅgi-gaṇe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nitya-siddha kari māne\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;se yāya vrajendra-suta-pāśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-gauḍa-maṇḍala-bhūmi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;yebā jāne chintāmaṇi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāra haya vraja-bhūme vāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAquele que considera que os associados de Śrī Gaurāṅga são eternamente liberados atinge Kṛṣṇa. Aquele que sabe que a terra sagrada de Gauḍa é feita da pedra preciosa que satisfaz os desejos (espirituais), reside na terra de Vraja.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaura-prema-rasārṇave\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;se taraṅge yebā ḍube\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;se rādhā-mādhava-antaraṅga\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egṛhe vā vanete thāke\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘hā gaurāṅga’ bale ḍāke\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;narottama māge tāra saṅga\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAquele que nada nas ondas do oceano nectáreo do amor divino por Śrī Gaura é um associado íntimo de Śrī Śrī Rādhā–Mādhava. Se ele vive em uma casa ou na floresta, Narottam Dās implora pela associação daquele que chama: “Gaurāṅga!”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-emona-durmati-samsara-bhitore\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eDainyātmikā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(prabhu he!)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eemana durmati\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;saṁsāra bhitare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;paḍiyā āchhinu āmi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava nija-jana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kona mahājane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pāṭhāiyā dile tumi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eemana\u003c/i\u003e–Tal [pessoa] \u003ci class=\"wbw__term\"\u003edurmati\u003c/i\u003e–cruel, \u003ci class=\"wbw__term\"\u003eāmi\u003c/i\u003e–eu, \u003ci class=\"wbw__term\"\u003epaḍiyā āchhinu\u003c/i\u003e–caí \u003ci class=\"wbw__term\"\u003ebhitare\u003c/i\u003e–dentro \u003ci class=\"wbw__term\"\u003esaṁsāra\u003c/i\u003e–[do] mundo material, [mas] \u003ci class=\"wbw__term\"\u003etumi\u003c/i\u003e–Você \u003ci class=\"wbw__term\"\u003epāṭhāiyā dile\u003c/i\u003e–mandou \u003ci class=\"wbw__term\"\u003ekona\u003c/i\u003e–alguma \u003ci class=\"wbw__term\"\u003emahājane\u003c/i\u003e–grande alma, [um dos] \u003ci class=\"wbw__term\"\u003etava\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003enija-jana\u003c/i\u003e–associados (para me resgatar).\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Senhor! Eu sou tão cruel e caí neste mundo material, mas Você enviou uma grande alma, Seu associado (para me resgatar).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edayā kari more\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;patita dekhiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kahila āmāre giyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eohe dīna-jana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śuna bhāla kathā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ullasita ha’be hiyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003edayā kari’\u003c/i\u003e–Sendo misericordioso \u003ci class=\"wbw__term\"\u003emore\u003c/i\u003e–comigo, [me] \u003ci class=\"wbw__term\"\u003edekhiyā\u003c/i\u003e–vendo \u003ci class=\"wbw__term\"\u003epatita\u003c/i\u003e–caído \u003ci class=\"wbw__term\"\u003egiyā\u003c/i\u003e–indo [a] \u003ci class=\"wbw__term\"\u003eāmāre\u003c/i\u003e–mim [ele] \u003ci class=\"wbw__term\"\u003ekahila\u003c/i\u003e–disse: \u003ci class=\"wbw__term\"\u003eohe\u003c/i\u003e–oh! \u003ci class=\"wbw__term\"\u003edīna\u003c/i\u003e–humilde \u003ci class=\"wbw__term\"\u003ejana\u003c/i\u003e–pessoa \u003ci class=\"wbw__term\"\u003eśuna\u003c/i\u003e–por favor escute [a] \u003ci class=\"wbw__term\"\u003ebhāla\u003c/i\u003e–boa \u003ci class=\"wbw__term\"\u003ekathā\u003c/i\u003e–notícia [e seu] \u003ci class=\"wbw__term\"\u003ehiyā\u003c/i\u003e–coração \u003ci class=\"wbw__term\"\u003ehabe\u003c/i\u003e–ficará \u003ci class=\"wbw__term\"\u003eullasita\u003c/i\u003e–muito feliz.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVendo-me tão caído e sendo misericordioso, ele veio a mim e disse: “Ó humilde alma, escute esta mensagem maravilhosa e seu coração irá se alegrar.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāre tārite\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-kṛṣṇa-chaitanya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;navadvīpe avatāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomā hena kata\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dīna-hīna jane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;karilena bhava-pāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eśrī-kṛṣṇa-chaitanya\u003c/i\u003e–Śrī Kṛṣṇa Chaitanya \u003ci class=\"wbw__term\"\u003eavatāra\u003c/i\u003e–apareceu \u003ci class=\"wbw__term\"\u003enavadvīpe\u003c/i\u003e–em Nabadwīp \u003ci class=\"wbw__term\"\u003etārite\u003c/i\u003e–para libertar \u003ci class=\"wbw__term\"\u003etomāre\u003c/i\u003e–você. \u003ci class=\"wbw__term\"\u003epāra karilena\u003c/i\u003e–Ele resgatou \u003ci class=\"wbw__term\"\u003ekata\u003c/i\u003e–muitas \u003ci class=\"wbw__term\"\u003edīna-hīna\u003c/i\u003e–pobres e humildes \u003ci class=\"wbw__term\"\u003ejane\u003c/i\u003e–almas \u003ci class=\"wbw__term\"\u003ehena\u003c/i\u003e–como \u003ci class=\"wbw__term\"\u003etomā\u003c/i\u003e–você \u003ci class=\"wbw__term\"\u003ebhava\u003c/i\u003e–do oceano da existência material.\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Śrī Kṛṣṇa Chaitanya apareceu em Nabadwip para te libertar. Ele atravessou muitas almas tão humildes quanto você pelo oceano da existência material.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evedera pratijñā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rākhibāra tare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rukma-varṇa vipra-suta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emahāprabhu nāme\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nadīyā mātāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(mahāprabhu name\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jagata mātāya)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;saṅge bhāi avadhūta\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003etare\u003c/i\u003e–Por causa \u003ci class=\"wbw__term\"\u003erākhibāra\u003c/i\u003e–da realização [das] \u003ci class=\"wbw__term\"\u003epratijñā\u003c/i\u003e–profecias, [dos] \u003ci class=\"wbw__term\"\u003evedera\u003c/i\u003e–Vedas [Ele apareceu com] \u003ci class=\"wbw__term\"\u003evarṇa\u003c/i\u003e–uma pele \u003ci class=\"wbw__term\"\u003erukma\u003c/i\u003e–dourada [como] \u003ci class=\"wbw__term\"\u003esuta\u003c/i\u003e–filho \u003ci class=\"wbw__term\"\u003evipra\u003c/i\u003e–de um brāhmaṇ \u003ci class=\"wbw__term\"\u003enāme\u003c/i\u003e–com o nome \u003ci class=\"wbw__term\"\u003emahāprabhu\u003c/i\u003e–‘Mahāprabhu’ [e levou] \u003ci class=\"wbw__term\"\u003enadīyā\u003c/i\u003e–Nadia \u003ci class=\"wbw__term\"\u003emātāya\u003c/i\u003e–enlouquecida \u003ci class=\"wbw__term\"\u003esaṅge\u003c/i\u003e–na companhia [de Seu] \u003ci class=\"wbw__term\"\u003ebhāi\u003c/i\u003e–irmão \u003ci class=\"wbw__term\"\u003eavadhūta\u003c/i\u003e–Nityānanda.\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Para cumprir as profecias dos Vedas, Ele apareceu com a pele dourada, como o filho de um brāhmaṇ, com o nome ‘Mahāprabhu’ e deixou toda Nadia (todo o universo) enlouquecida com amor divino na companhia de Seu irmão Nityānanda.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enanda suta yini\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chaitanya gosāñī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nija-nāma kari’ dāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etārila jagat\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tumi-o yāiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;laha nija paritrāṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[O] \u003ci class=\"wbw__term\"\u003egosāñī\u003c/i\u003e–Senhor \u003ci class=\"wbw__term\"\u003echaitanya\u003c/i\u003e–Chaitanya, y \u003ci class=\"wbw__term\"\u003eini\u003c/i\u003e–que [é] \u003ci class=\"wbw__term\"\u003esuta\u003c/i\u003e–o filho \u003ci class=\"wbw__term\"\u003enanda\u003c/i\u003e–de Nanda, \u003ci class=\"wbw__term\"\u003edāna kari’\u003c/i\u003e–distribuiu [Seu] \u003ci class=\"wbw__term\"\u003enija\u003c/i\u003e–próprio \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–Nome [e] \u003ci class=\"wbw__term\"\u003etārila\u003c/i\u003e–libertou \u003ci class=\"wbw__term\"\u003ejagat\u003c/i\u003e–o mundo. \u003ci class=\"wbw__term\"\u003etumi-o\u003c/i\u003e–Você \u003ci class=\"wbw__term\"\u003eyāiyā\u003c/i\u003e–deveria ir [e] \u003ci class=\"wbw__term\"\u003elaha\u003c/i\u003e–aceitar [sua] \u003ci class=\"wbw__term\"\u003enija\u003c/i\u003e–própria \u003ci class=\"wbw__term\"\u003eparitrāṇa\u003c/i\u003e–libertação.\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Śrī Chaitanya, que é Kṛṣṇa Ele mesmo, tem distribuído Seu próprio Nome e libertado o mundo. Vá também e aceite sua libertação.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ese kathā śuniyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āsiyāchhi, nātha!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra charaṇa-tale\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakati-vinoda\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kā̐diyā kā̐diyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āpana-kāhinī bale\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003enātha!\u003c/i\u003e–Ó Senhor, \u003ci class=\"wbw__term\"\u003eśuniyā\u003c/i\u003e–escutando \u003ci class=\"wbw__term\"\u003ese\u003c/i\u003e–essa \u003ci class=\"wbw__term\"\u003ekathā\u003c/i\u003e–mensagem \u003ci class=\"wbw__term\"\u003ebhakati-vinoda\u003c/i\u003e–Bhakti Vinod \u003ci class=\"wbw__term\"\u003eāsiyāchhi\u003c/i\u003e–veio \u003ci class=\"wbw__term\"\u003etale\u003c/i\u003e–às solas [de] \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003echaraṇa\u003c/i\u003e–pés. \u003ci class=\"wbw__term\"\u003ekā̐diyā\u003c/i\u003e–Chorando [e] \u003ci class=\"wbw__term\"\u003ekā̐diyā\u003c/i\u003e–chorando \u003ci class=\"wbw__term\"\u003ebale\u003c/i\u003e–ele conta [sua] \u003ci class=\"wbw__term\"\u003eāpana\u003c/i\u003e–própria \u003ci class=\"wbw__term\"\u003ekāhinī\u003c/i\u003e–estória.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Senhor, escutando essa mensagem, Bhakti Vinod tem vindo às solas dos Seus pés. Chorando, ele narra sua estória.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gay-gora-madhur-svare\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Nāma \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egāya gorā madhur svare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e“hare kṛṣṇa hare kṛṣṇa kṛṣṇa kṛṣṇa hare hare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehare rāma hare rāma rāma rāma hare hare”\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGaurasundar canta com uma voz doce: “hare kṛṣṇa hare kṛṣṇa kṛṣṇa kṛṣṇa hare hare hare rāma hare rāma rāma rāma hare hare”.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egṛhe thāka, vane thāka\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esadā ‘hari’ bale’ ḍāka\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esukhe duḥkhe bhulo nāka\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evadane hari-nām kara re\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEsteja em casa, ou esteja em uma floresta, independentemente, sempre chame alto: “Hari!” Na alegria ou na tristeza, não se esqueça: cante o Nome do Senhor em voz alta.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emāyā-jāle baddha ha’ye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāchha michhe kāja la’ye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eekhan-o chetana peye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhā-mādhav-nām bala re\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePreso na rede de Māyā, você trabalha em vão. Agora, enquanto você ainda está consciente, cante: “Rādhā–Mādhava”.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejīvana ha-ila śeṣa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enā bhajile hṛṣīkeśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhaktivinod-upadeśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eek-bār nām-rase māta re\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSua vida está terminando, mas você ainda não serviu Hṛṣīkeś. Bhakti Vinod aconselha: uma vez, saboreie o néctar do Santo Nome.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vimala-hemajin-tanu-anupama-re\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eVimala hema jini \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Vṛndāvan Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evimala hema jini\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tanu anupama re!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāhe śobhe nānā phula-dāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekadamba keśara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jini ekaṭī pulaka re!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāra mājhe bindu bindu ghāma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSua forma incomparável supera o ouro puro! Ele é decorado com uma guirlanda de flores variadas. Seus pelos eretos superam os filamentos da kadamba! Ele é coberto de gotas de suor.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejini mada-matta hāti\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gamana manthara ati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhāvāveśe ḍhuli ḍhuli yāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003earuṇa-vasana chhavi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jini prabhātera ravi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gorā-aṅge laharī khelāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSeus movimentos lentos superam os de um elefante embriagado. Arrebatado em êxtase, Ele cambaleia. O esplendor de suas vestes cor de açafrão supera o sol da manhã. Ondas vibrantes atravessam sua forma dourada.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echalite nā pāre gorā-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chā̐d go̐sāñi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;balite nā pāre ādha-bola\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhāvete āveśa haiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hari hari bolāiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āchaṇḍāle dhari’ deya kola\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Senhor Gorāchā̐d não pode se mover! Ele não pode falar! Ele simplesmente gagueja. Arrebatado em êxtase, ele induz os párias a cantar: “Hari! Hari!” E Ele os abraça.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ee sukha-sampada-kāle\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gorā nā bhajinu hele\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hena pade nā karinu āśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-kṛṣṇa-chaitanya-chandraṭhākura śrī-nityānanda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;guṇa gāya vṛndāvana dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNesse momento alegre, feliz, negligentemente eu não servi Gorāchā̐d nem aspirei aos Seus pés. Vṛndāvan Dās canta as glórias de Śrī Kṛṣṇa Chaitanyachandra e Ṭhākur Śrī Nityānanda.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-emona-gauranga-bine-nahi-ara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eEmona Gaurāṅga bine nāhi āra \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Premānanda Dās\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;emana gaurāṅga vine nāhi āra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehena avatāra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;habe ki hayechhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hena prema parachāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNão há ninguém como Gaurāṅga! Já houve e algum dia haverá um Avatār que distribui amor divino como Ele?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(hay ni ār habār nay re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOh! Nunca houve e nunca haverá!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eduramati ati\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;patita pāṣaṇḍī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prāṇe nā mārila kāre\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehari-nāma diye\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hṛdaya śodhila\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;yāchi giyā ghare ghare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle não aniquilou os caídos, pecadores ímpios de coração; Ele deu a eles o Nome do Senhor e purificou seus corações. Ele foi de casa em casa e implorou a eles (para aceitar o amor divino).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(ke nibi ke nibi bale)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(yeche yeche yeche beḍāy)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Quem irá pegar? Quem irá pegar? Ele sai perguntando, perguntando, e perguntando.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhava-viriñchira\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vāñchhita ye prema\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jagate phelila ḍhāli\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(bhava viriñchira yā vāñchhā kare)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekāṅgale pāiye\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;khāila nāchiye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bājāiye karatāli\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle distribuiu livremente por todo o mundo o amor divino que é desejado até mesmo por Brahmā e Śiva. Os pobres receberam e saborearam, dançando e batendo palmas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(karatāli bājāiye)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(gaurahari hari bale\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;karatāli bājāiye)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBatendo palmas! Cantando: “Gaurahari Hari!” e batendo palmas!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehāsiye kā̐diye\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;preme gaḍāgaḍi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pulake vyāpila aṅga\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echaṇḍāle brāhmaṇe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kare kolākuli\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kabe vā chhila e raṅga\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCheios de amor divino, eles riram, choraram, e rolaram no chão. Os pelos de seus corpos se arrepiaram. Os brāhmaṇs e os párias se abraçaram. Quando houve alguma vez tais Passatempos?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(chaṇḍāle brāhmaṇe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kare kolākuli\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;e raṅga kabe vā chhila)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOs brāhmaṇs e os párias se abraçaram. Quando houve alguma vez tais Passatempos?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eḍākiye hā̐kiye\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;khola-karatāle\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gāiye dhāiye phire\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edekhiyā śamana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tarāsa pāiye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kapāṭa hānila dvāre\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eUivando e gritando, eles cantaram e correram com mṛdaṅgas e kartāls. Vendo isso, Yamarāj ficou com medo e fechou suas portas e janelas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(bhaja bhaja gaurahari yā̐ra nāme śamaṇa palāy)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSirva! Sirva Gaurahari! Yamarāj foge de Seu Nome.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ee tina bhuvana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ānande bharila\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;uṭhila maṅgala-sora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOs três mundos se encheram de alegria, e um tumulto auspicioso surgiu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(ānander ār sīmā nāi re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(gauraharir āgamane\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ānander ār sīmā nāi re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(nirānanda dūre gela\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ānander ār sīmā nāi re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(gauraharir āgamane\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;premānander udaya hala)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(premānander udaya hala\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sabāi mile haribola)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNão há limite para a nossa alegria! Com a chegada de Gaurahari, não há limite para a nossa alegria! Toda infelicidade desapareceu, e não há limite para a nossa alegria! Com a chegada de Gaurahari, a alegria do amor divino surgiu, e todos juntos cantam: “Hari!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekahe premānanda\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;emana gaurāṅge\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rati nā janmila mora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePremānanda diz: “Eu nunca desenvolvi apego pelo Senhor Gaurāṅga.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(āmār rati-mati hala nā ye)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(eman dayāl prabhu avatāre, āmār rati-mati hala nā re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(eman dayāl prabhu esechhila, āmār rati-mati hala nā re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(gaurahari hari bala)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu nunca desenvolvi apego. Eu nunca desenvolvi apego a este mais misericordioso Senhor. Este mais misericordioso Senhor veio, mas eu nunca desenvolvi apego a Ele. Oh! Cante: “Gaurahari!”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-ke-jabi-ke-jabi-bhai-bhava-sindhu-para\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eKe yābi ke yābi \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Lochan Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eke yābi ke yābi bhāi bhava-sindhu pāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhanya kali-yuge re chaitanya-avatāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuem irá cruzar, ó irmão, quem irá cruzar o oceano da existência material? Oh! A fortuna desta Era de Kali é o aparecimento de Śrī Chaitanya.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eāmāra gaurāṅger ghāṭe ujānakheyā vaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekaḍipāti nāhi lāge amani pāra haya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNo ghāṭ do meu Senhor Gaurāṅga a balsa sobe a montante sem solicitar qualquer tarifa. Todos atravessam livremente.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari-nāmera tarīkhāni śrī-guru-kāṇḍārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaṅkīrtana-keroyāla du’bāhu pasāri\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOs Nomes do Senhor são o barco de travessia, Śrī Guru é o capitão, e os braços extendidos no saṅkīrtan são os remos.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esarva-jīva uddhāra haila premera vātāse\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elochana paḍiyā raila karamera doṣe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTodas as almas foram então liberadas pelos ventos do amor divino. Apenas Lochan Dās caiu e ficou para trás, em decorrência de seus pecados.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-avatara-sara-gora-avatara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eAvatāra Sāra \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Lochan Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eavatāra sāra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gora avatāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kena nā bhajili tā̐re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekari’ nīre vāsa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gela nā piyāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āpana karama phere\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Gaura Avatār é o melhor dos Avatāres. Por que você não O serve? Ó mente, você residiu ao lado da água, mas continuou sedenta. Você se envolveu em seu egoísmo.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekaṇṭakera taru\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadāi sevili (mana)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;amṛta pā’bāra āśe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-kalpataru\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī gaurāṅga āmāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāhāre bhavili viṣe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ mente, desejando beber néctar, você constantemente mastigou galhos com espinhos (e confundiu o sangue em sua boca com néctar). Meu Senhor Gaurāṅga é uma árvore realizadora dos desejos de amor divino, mas você o considerou veneno.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esaurabhera āśe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;palāśa śu̐kili (mana)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāsāte paśila kīṭa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘ikṣu-daṇḍa’ bhāvi’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kāṭha chuṣili (mana)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kemane pāibi miṭha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ mente, buscando uma fragrância, você cheirou a inodora flor palāśa e insetos entraram em seu nariz. Ó mente, considerando ser cana de açúcar, você chupou madeira seca. Como você irá saborear a doçura desse jeito?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘hāra’ baliyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;galāya parili (mana)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śamana kiṅkara sāpa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘śītala’ baliyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āguna pohāli (mana)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pāili vajara-tāpa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ mente, considerando-a um colar, você usou a serpente serva da morte em torno do seu pescoço. Ó mente, considerando-o refrescante, você abraçou o fogo e recebeu uma queimadura abrasante.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esaṁsāra bhajili\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-gaurāṅga bhulili\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā śunili sādhura kathā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eiha-parakāla\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dukāla khoyāli (mana)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;khāili āpana māthā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVocê serviu sua família (fins mundanos), esqueceu Śrī Gaurāṅga, e nunca escutou as palavras dos sādhus. Ó mente, você perdeu tanto esta quanto sua próxima vida. Você se depravou.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gaura-pahu-na-bhajiya-mainu\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eGaurā Pahu̐ \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaurā pahu̐ nā bhajiyā mainu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema ratana-dhana helāya hārāinu\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNão servindo o Senhor Gaurāṅga, eu morri. Negligentemente eu perdi a joia preciosa do amor divino.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eadhane yatana kari dhana teyāginu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāpana karama-doṣe āpani ḍubinu\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu me esforcei por coisas inúteis e rejeitei a real riqueza. Eu me afoguei em meus próprios pecados.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esat-saṅga chhāḍi’ kainu asate vilāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ete-kāraṇe lāgila ye karma-bandha-phā̐sa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu evitei a associação dos sādhus e desfrutei com pessoas perversas. Então fiquei preso no nó do meu karma.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eviṣaya-viṣama-viṣa satata khāinu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaura-kīrtana rase magana nā hainu\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu bebi constantemente o terrível veneno da mundanidade e nunca mergulhei no néctar do kīrtan de Śrī Gaurāṅga.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekena vā āchhaye prāṇa ki sukha lāgiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enarottama dāsa kena nā gela mariyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePor que estou vivo? Em prol de qual felicidade? Por que Narottam ainda não morreu?\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jadi-gaura-na-hoto-tobe-ki-hoito\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eYadi, gaura nā ha’ta \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Vāsudev Ghoṣ\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyadi, gaura nā ha’ta\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tabe ki ha-ita\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kemane dharitām de\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhāra mahimā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prema-rasa-sīmā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jagate jānāta ke?\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSe Śrī Gaura não tivesse vindo, o que teria acontecido? Como manteríamos nossas vidas? Quem revelaria ao mundo a glória de Śrī Rādhā e os extremos de Seu extático amor divino?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(rādhār mahimā ke jānāta)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(gaura yadi nā āsita rādhār mahimā ke jānatā)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuem conheceria a glória de Śrī Rādhā? Se Śrī Gaura não tivesse vindo, quem conheceria a glória de Śrī Rādhā?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emadhura vṛndā-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vipina mādhurī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;praveśa chāturī sāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaraja-yuvatī\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhāvera bhakati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śakati ha-ita kāra?\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuem teria a formidável especialidade, necessária para se entrar na doçura da doce Vṛndāvan? Quem teria qualquer qualificação para a devoção extática das Vraja-gopīs?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egāo punaḥ punaḥ\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gaurāṅgera guṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sarala kariyā mana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ee bhava-sāgare\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;emana dayāla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā dekhiye eka-jana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCante as glórias de Gaurāṅga de novo e de novo, mantendo seu coração simples. No oceano deste mundo material, ninguém nunca viu alguém tão misericordioso.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(āmi) gaurāṅga baliyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā genu galiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kemane dharinu de\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evāsura-hiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pāṣāṇa diyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(vidhi) kemane gaḍiyāchhe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu canto: “Gaurāṅga”, mas não me derreti (de amor). Como tenho mantido este corpo? Como a Providência fez a Vāsu uma pedra em vez de um coração?\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eKṛṣṇa\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-gopinath-mama-nivedana-shiuno\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eNivedana \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eParte 1\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, mama nivedana śuna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eviṣayī durjana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadā kāma-rata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kichhu nāhi mora guṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth \u003ci class=\"wbw__term\"\u003eśuna\u003c/i\u003e–por favor escute \u003ci class=\"wbw__term\"\u003emama\u003c/i\u003e–minha \u003ci class=\"wbw__term\"\u003enivedana\u003c/i\u003e–oração. [Eu sou um] \u003ci class=\"wbw__term\"\u003eviṣayī\u003c/i\u003e–materialista. [eu sou] \u003ci class=\"wbw__term\"\u003edurjana\u003c/i\u003e–perverso [e] \u003ci class=\"wbw__term\"\u003esadā\u003c/i\u003e–constantemente \u003ci class=\"wbw__term\"\u003ekāma-rata\u003c/i\u003e–cobiçoso \u003ci class=\"wbw__term\"\u003emora nāhi\u003c/i\u003e–eu não tenho \u003ci class=\"wbw__term\"\u003ekichhu\u003c/i\u003e–nenhuma \u003ci class=\"wbw__term\"\u003eguṇa\u003c/i\u003e–boa qualidade.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, por favor ouça minha oração. Eu sou um materialista. Sou perverso, e constantemente ambicioso. Eu não tenho quaisquer boas qualidades.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, āmāra bharasā tumi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomāra charaṇe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;la-inu śaraṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra kiṅkara āmi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth, \u003ci class=\"wbw__term\"\u003etumi\u003c/i\u003e–Você [é] \u003ci class=\"wbw__term\"\u003eāmāra\u003c/i\u003e–minha \u003ci class=\"wbw__term\"\u003ebharasā\u003c/i\u003e–esperança. \u003ci class=\"wbw__term\"\u003ela-inu\u003c/i\u003e–eu tomei \u003ci class=\"wbw__term\"\u003eśaraṇa\u003c/i\u003e–abrigo [aos] \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003echaraṇe\u003c/i\u003e–pés, [e] \u003ci class=\"wbw__term\"\u003eāmi\u003c/i\u003e–eu [sou] \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Seu \u003ci class=\"wbw__term\"\u003ekiṅkara\u003c/i\u003e–servo.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, Você é minha esperança. Tomei abrigo em Seus pés e sou Teu servo.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, kemane śodhibe more\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enā jāni bhakati\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;karme jaḍa-mati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;paḍechhi saṁsāra ghore\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth, \u003ci class=\"wbw__term\"\u003ekemane\u003c/i\u003e–como \u003ci class=\"wbw__term\"\u003eśodhibe\u003c/i\u003e–Voce irá purificar \u003ci class=\"wbw__term\"\u003emore\u003c/i\u003e–a mim? \u003ci class=\"wbw__term\"\u003ejāni nā\u003c/i\u003e–eu não entendo [a] \u003ci class=\"wbw__term\"\u003ebhakati\u003c/i\u003e–devoção. [Minha] \u003ci class=\"wbw__term\"\u003emati\u003c/i\u003e–mente \u003ci class=\"wbw__term\"\u003ejaḍa\u003c/i\u003e–mundana [é absorvida em] \u003ci class=\"wbw__term\"\u003ekarme\u003c/i\u003e–atividades materiais, [e] \u003ci class=\"wbw__term\"\u003epaḍechhi\u003c/i\u003e–eu caí \u003ci class=\"wbw__term\"\u003eghore\u003c/i\u003e–no escuro \u003ci class=\"wbw__term\"\u003esaṁsāra\u003c/i\u003e–mundo material.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, como Você vai me purificar? Eu não compreendo a devoção. Minha mente mundana está absorvida em atividade material, e eu caí neste escuro mundo material.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, sakali tomāra māyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāhi mama bala\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jñāna sunirmala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;svādhīna nahe e kāyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth, \u003ci class=\"wbw__term\"\u003esakali\u003c/i\u003e–tudo [é] \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Sua \u003ci class=\"wbw__term\"\u003emāyā\u003c/i\u003e–ilusão. \u003ci class=\"wbw__term\"\u003emama nāhi\u003c/i\u003e–Eu não tenho \u003ci class=\"wbw__term\"\u003ebala\u003c/i\u003e–força [e nem] \u003ci class=\"wbw__term\"\u003ejñāna\u003c/i\u003e–conhecimento \u003ci class=\"wbw__term\"\u003esunirmala\u003c/i\u003e–puro, [e] \u003ci class=\"wbw__term\"\u003ee\u003c/i\u003e–este \u003ci class=\"wbw__term\"\u003ekāyā\u003c/i\u003e–corpo \u003ci class=\"wbw__term\"\u003enahe\u003c/i\u003e–não [é] \u003ci class=\"wbw__term\"\u003esvādhīna\u003c/i\u003e–independente (do controle da natureza material).\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, tudo é Sua ilusão. Eu não tenho forças nem conhecimento puro, e este corpo não é independente (do controle da natureza material).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, niyata charaṇe sthāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emāge e pāmara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kā̐diyā kā̐diyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;karahe karuṇā dāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth, \u003ci class=\"wbw__term\"\u003ekā̐diyā\u003c/i\u003e–chorando [e] \u003ci class=\"wbw__term\"\u003ekā̐diyā\u003c/i\u003e–chorando \u003ci class=\"wbw__term\"\u003ee\u003c/i\u003e–este \u003ci class=\"wbw__term\"\u003epāmara\u003c/i\u003e–pecador \u003ci class=\"wbw__term\"\u003emāge\u003c/i\u003e–implora [por um] \u003ci class=\"wbw__term\"\u003esthāna\u003c/i\u003e–lugar \u003ci class=\"wbw__term\"\u003eniyata\u003c/i\u003e–permanente \u003ci class=\"wbw__term\"\u003echaraṇe\u003c/i\u003e–aos [Seus] pés \u003ci class=\"wbw__term\"\u003edāna karahe\u003c/i\u003e–Por favor dê [a ele Sua] \u003ci class=\"wbw__term\"\u003ekaruṇā\u003c/i\u003e–misericórdia.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, chorando e chorando, este pecador implora por um lugar eterno aos Seus pés. Por favor, dê-lhe sua misericórdia.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, tumi ta sakali pāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edurjane tārite\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra śakati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ke āchhe pāpīra āra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth, \u003ci class=\"wbw__term\"\u003etumi\u003c/i\u003e–Você \u003ci class=\"wbw__term\"\u003eta\u003c/i\u003e–certamente \u003ci class=\"wbw__term\"\u003epāra\u003c/i\u003e–pode fazer \u003ci class=\"wbw__term\"\u003esakali\u003c/i\u003e–tudo. \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Você tem \u003ci class=\"wbw__term\"\u003eśakati\u003c/i\u003e–o poder \u003ci class=\"wbw__term\"\u003etārite\u003c/i\u003e–de liberar \u003ci class=\"wbw__term\"\u003edurjane\u003c/i\u003e–os perversos, [e] \u003ci class=\"wbw__term\"\u003eke\u003c/i\u003e–quem \u003ci class=\"wbw__term\"\u003eāchhe\u003c/i\u003e–é \u003ci class=\"wbw__term\"\u003eāra\u003c/i\u003e–mais \u003ci class=\"wbw__term\"\u003epāpīra\u003c/i\u003e–pecador [do que eu]?\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, Você pode fazer qualquer coisa. Você tem o poder de libertar os cruéis, e quem é um pecador maior do que eu?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, tumi kṛpā-pārābāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejīvera kāraṇe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āsiyā prapañche\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;līlā kaile suvistāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth \u003ci class=\"wbw__term\"\u003etumi\u003c/i\u003e–Você [é] \u003ci class=\"wbw__term\"\u003epārābāra\u003c/i\u003e–um oceano \u003ci class=\"wbw__term\"\u003ekṛpā\u003c/i\u003e–de misericórdia. \u003ci class=\"wbw__term\"\u003eāsiyā\u003c/i\u003e–Você veio \u003ci class=\"wbw__term\"\u003eprapañche\u003c/i\u003e–para [este] mundo [e] \u003ci class=\"wbw__term\"\u003esuvistāra\u003c/i\u003e\u003ci class=\"wbw__term\"\u003ekaile\u003c/i\u003e–manifestou [Seus] \u003ci class=\"wbw__term\"\u003elīlā\u003c/i\u003e–Passatempos \u003ci class=\"wbw__term\"\u003ekāraṇe\u003c/i\u003e–em prol \u003ci class=\"wbw__term\"\u003ejīvera\u003c/i\u003e–das almas [caídas].\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, Você é um oceano de misericórdia. Você veio a este mundo e realizou Seus Passatempos em prol das almas caídas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, āmi ki doṣera doṣī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003easura sakala\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pāila charaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vinoda thākila vasi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth, \u003ci class=\"wbw__term\"\u003eāmi ki\u003c/i\u003e–eu sou \u003ci class=\"wbw__term\"\u003edoṣī\u003c/i\u003e–o pecador \u003ci class=\"wbw__term\"\u003edoṣera\u003c/i\u003e–de [todos] os pecadores? \u003ci class=\"wbw__term\"\u003esakala\u003c/i\u003e–Todos \u003ci class=\"wbw__term\"\u003easura\u003c/i\u003e–os demônios \u003ci class=\"wbw__term\"\u003epāila\u003c/i\u003e–obtiveram [Seus] \u003ci class=\"wbw__term\"\u003echaraṇa\u003c/i\u003e–pés, [mas] \u003ci class=\"wbw__term\"\u003evinoda\u003c/i\u003e–Bhakti Vinod \u003ci class=\"wbw__term\"\u003ethākila\u003c/i\u003e–tem permanecido \u003ci class=\"wbw__term\"\u003evasi’\u003c/i\u003e–sentado [aqui].\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, serei eu o maior pecador de todos? Todos os demônios alcançaram os Seus Pés, mas Bhakti Vinod permaneceu sentado aqui.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gopinath-ghuchao-samsara-jvala\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eNivedana \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eParte 2\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, ghuchāo saṁsāra-jvālā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eavidyā-yātanā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āra nāhi sahe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;janama-maraṇa-mālā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth, \u003ci class=\"wbw__term\"\u003eghuchāo\u003c/i\u003e–por favor alivie \u003ci class=\"wbw__term\"\u003ejvālā\u003c/i\u003e–a dor ardente \u003ci class=\"wbw__term\"\u003esaṁsāra\u003c/i\u003e–do mundo material. \u003ci class=\"wbw__term\"\u003esahe nāhi\u003c/i\u003e–Eu não posso tolerar \u003ci class=\"wbw__term\"\u003eyātanā\u003c/i\u003e–a dor \u003ci class=\"wbw__term\"\u003eavidyā\u003c/i\u003e–da ignorância [ou] \u003ci class=\"wbw__term\"\u003emālā\u003c/i\u003e–o ciclo \u003ci class=\"wbw__term\"\u003ejanama\u003c/i\u003e–de nascimento [e] \u003ci class=\"wbw__term\"\u003emaraṇa\u003c/i\u003e–morte [não] \u003ci class=\"wbw__term\"\u003eāra\u003c/i\u003e–mais.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, por favor alivie a dor abrasante do saṁsāra. Eu não posso mais tolerar a dor da ignorância ou o ciclo de nascimento e morte.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, āmi ta’ kāmera dāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eviṣaya-vāsanā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jāgichhe hṛdaye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;phā̐dichhe karama phā̐sa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth, \u003ci class=\"wbw__term\"\u003eāmi\u003c/i\u003e–Eu [sou] \u003ci class=\"wbw__term\"\u003eta\u003c/i\u003e–certamente \u003ci class=\"wbw__term\"\u003edāsa\u003c/i\u003e–um servo \u003ci class=\"wbw__term\"\u003ekāmera\u003c/i\u003e–da luxúria. \u003ci class=\"wbw__term\"\u003evāsanā\u003c/i\u003e–Desejos \u003ci class=\"wbw__term\"\u003eviṣaya\u003c/i\u003e–mundanos \u003ci class=\"wbw__term\"\u003ejāgichhe\u003c/i\u003e–surgiram [em meu] \u003ci class=\"wbw__term\"\u003ehṛdaye\u003c/i\u003e–coração [e] \u003ci class=\"wbw__term\"\u003ephā̐dichhe\u003c/i\u003e–puseram a trabalhar \u003ci class=\"wbw__term\"\u003ephā̐sa\u003c/i\u003e–o nó \u003ci class=\"wbw__term\"\u003ekarama\u003c/i\u003e–das consequências das ações prévias [em volta do meu pescoço].\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, eu sou um servo da luxúria. Desejos mundanos surgiram em meu coração, e apertaram o nó do karma em volta do meu pescoço.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, kabe vā jāgiba āmi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekāma-rūpa ari\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dūre teyāgiba\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hṛdaye sphuribe tumi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth, \u003ci class=\"wbw__term\"\u003ekabe vā\u003c/i\u003e–quando \u003ci class=\"wbw__term\"\u003eāmi\u003c/i\u003e–eu [irei] \u003ci class=\"wbw__term\"\u003ejāgiba\u003c/i\u003e–acordar? [Quando irei] \u003ci class=\"wbw__term\"\u003eteyāgiba\u003c/i\u003e–jogar \u003ci class=\"wbw__term\"\u003edūre\u003c/i\u003e–fora [meu] \u003ci class=\"wbw__term\"\u003eari\u003c/i\u003e–inimigo [na] \u003ci class=\"wbw__term\"\u003erūpa\u003c/i\u003e–forma \u003ci class=\"wbw__term\"\u003ekāma\u003c/i\u003e–da luxúria? [Quando] \u003ci class=\"wbw__term\"\u003etumi\u003c/i\u003e–Você \u003ci class=\"wbw__term\"\u003esphuribe\u003c/i\u003e–aparecerá \u003ci class=\"wbw__term\"\u003ehṛdaye\u003c/i\u003e–em [meu] coração?\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, quando vou acordar? Quando vou jogar fora minha inimiga luxúria? Quando você aparecerá em meu coração?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, āmi ta’ tomāra jana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomāre chhāḍiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;saṁsāra bhajinu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhuliyā āpana-dhana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth, \u003ci class=\"wbw__term\"\u003eāmi\u003c/i\u003e–eu \u003ci class=\"wbw__term\"\u003eta\u003c/i\u003e–certamente [sou] \u003ci class=\"wbw__term\"\u003ejana\u003c/i\u003e–uma pessoa [de] \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Sua [propriedade, mas] \u003ci class=\"wbw__term\"\u003echhāḍiyā\u003c/i\u003e–eu deixei \u003ci class=\"wbw__term\"\u003etomāre\u003c/i\u003e–Você [e me] \u003ci class=\"wbw__term\"\u003ebhajinu\u003c/i\u003e–engajei \u003ci class=\"wbw__term\"\u003esaṁsāra\u003c/i\u003e–no mundo material, \u003ci class=\"wbw__term\"\u003ebhuliyā\u003c/i\u003e–esquecendo [minha] \u003ci class=\"wbw__term\"\u003eāpana\u003c/i\u003e–própria \u003ci class=\"wbw__term\"\u003edhana\u003c/i\u003e–riqueza.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, eu sou Sua propriedade, mas eu O deixei e me engajei na vida mundana, me esquecendo de minha própria riqueza.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, tumi ta’ sakali jāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāpanāra jane\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;daṇḍiyā ekhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-charaṇe deha sthāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth, \u003ci class=\"wbw__term\"\u003etumi\u003c/i\u003e–Você \u003ci class=\"wbw__term\"\u003eta\u003c/i\u003e–certamente \u003ci class=\"wbw__term\"\u003ejāna\u003c/i\u003e–sabe \u003ci class=\"wbw__term\"\u003esakali\u003c/i\u003e–tudo. \u003ci class=\"wbw__term\"\u003eekhana\u003c/i\u003e–Agora \u003ci class=\"wbw__term\"\u003edaṇḍiyā\u003c/i\u003e–tendo punido [esta] \u003ci class=\"wbw__term\"\u003ejane\u003c/i\u003e–alma \u003ci class=\"wbw__term\"\u003eāpanāra\u003c/i\u003e–de [Sua] propriedade \u003ci class=\"wbw__term\"\u003edeha\u003c/i\u003e–por favor dê [a ele] \u003ci class=\"wbw__term\"\u003esthāna\u003c/i\u003e–um lugar \u003ci class=\"wbw__term\"\u003eśrī-charaṇe\u003c/i\u003e–aos [Seus] santos pés.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, Você sabe tudo. Agora, tendo punido Seu servo, por favor dê-lhe um lugar aos Seus sagrados pés.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, ei ki vichāra tava\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evimukha dekhiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chhāḍa nija-jane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā kara karuṇā-lava\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth, \u003ci class=\"wbw__term\"\u003eei\u003c/i\u003e–este [é] \u003ci class=\"wbw__term\"\u003etava\u003c/i\u003e–Seu \u003ci class=\"wbw__term\"\u003eki vichāra\u003c/i\u003e–julgamento? \u003ci class=\"wbw__term\"\u003edekhiyā\u003c/i\u003e–Vendo [me] \u003ci class=\"wbw__term\"\u003evimukha\u003c/i\u003e–averso [a Você,] \u003ci class=\"wbw__term\"\u003echhāḍa\u003c/i\u003e–Você rejeita [uma Sua] \u003ci class=\"wbw__term\"\u003enija\u003c/i\u003e–própria \u003ci class=\"wbw__term\"\u003ejane\u003c/i\u003e–pessoa [e] \u003ci class=\"wbw__term\"\u003ekara nā\u003c/i\u003e–não [me] dá [nem] \u003ci class=\"wbw__term\"\u003elava\u003c/i\u003e–uma fração \u003ci class=\"wbw__term\"\u003ekaruṇā\u003c/i\u003e–da [Sua] misericórdia?\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, este é o Seu julgamento? Vendo-me averso a Você, Você rejeitou Seu servo, e não me dá nem um traço da Sua misericórdia?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, āmi ta’ mūrakha ati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekise bhāla haya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kabhu nā bujhinu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāi hena mama gati\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth, \u003ci class=\"wbw__term\"\u003eāmi\u003c/i\u003e–eu \u003ci class=\"wbw__term\"\u003eta\u003c/i\u003e–certamente [sou] \u003ci class=\"wbw__term\"\u003eati\u003c/i\u003e–muito \u003ci class=\"wbw__term\"\u003emūrakha\u003c/i\u003e–tolo. [Eu] \u003ci class=\"wbw__term\"\u003ekabhu nā\u003c/i\u003e–nunca \u003ci class=\"wbw__term\"\u003ebujhinu\u003c/i\u003e–compreendi \u003ci class=\"wbw__term\"\u003ekise\u003c/i\u003e–o que \u003ci class=\"wbw__term\"\u003ehaya\u003c/i\u003e–é \u003ci class=\"wbw__term\"\u003ebhāla\u003c/i\u003e–bom [para mim]. \u003ci class=\"wbw__term\"\u003etāi\u003c/i\u003e–Portanto \u003ci class=\"wbw__term\"\u003ehena\u003c/i\u003e–tal [é] \u003ci class=\"wbw__term\"\u003emama\u003c/i\u003e–minha \u003ci class=\"wbw__term\"\u003egati\u003c/i\u003e–condição.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, sou muito tolo. Nunca compreendi o que é bom para mim. E esta é minha condição.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, tumi ta’ paṇḍita-vara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emūḍhera maṅgala\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadā anveṣibe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;e dāse nā bhāva para\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth, \u003ci class=\"wbw__term\"\u003etumi\u003c/i\u003e–Você \u003ci class=\"wbw__term\"\u003eta\u003c/i\u003e–certamente [é] \u003ci class=\"wbw__term\"\u003evara\u003c/i\u003e–o maior \u003ci class=\"wbw__term\"\u003epaṇḍita\u003c/i\u003e–entre os sábios. [Por favor] \u003ci class=\"wbw__term\"\u003esadā\u003c/i\u003e–sempre \u003ci class=\"wbw__term\"\u003eanveṣibe\u003c/i\u003e–busque \u003ci class=\"wbw__term\"\u003emaṅgala\u003c/i\u003e–o bem \u003ci class=\"wbw__term\"\u003emūḍhera\u003c/i\u003e–para [este] tolo. [Por favor] \u003ci class=\"wbw__term\"\u003ebhāva nā\u003c/i\u003e–não considere \u003ci class=\"wbw__term\"\u003ee\u003c/i\u003e–este \u003ci class=\"wbw__term\"\u003edāse\u003c/i\u003e–servo \u003ci class=\"wbw__term\"\u003epara\u003c/i\u003e–separado.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, Você é o mais sábio. Por favor, sempre procure o bem para este tolo por favor, não considere este servo um pária.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gopinath-amara-upaya-nai\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eNivedana \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eParte 3\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, āmāra upāya nāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etumi kṛpā kari\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āmāre la-ile\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;saṁsāre uddhāra pāi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth \u003ci class=\"wbw__term\"\u003eāmāra nāi\u003c/i\u003e–eu não tenho \u003ci class=\"wbw__term\"\u003eupāya\u003c/i\u003e–saída. [Apenas se] \u003ci class=\"wbw__term\"\u003etumi\u003c/i\u003e–Você \u003ci class=\"wbw__term\"\u003ekṛpā kari’\u003c/i\u003e–misericordiosamente \u003ci class=\"wbw__term\"\u003eāmāre\u003c/i\u003e–me \u003ci class=\"wbw__term\"\u003ela-ile\u003c/i\u003e–resgatar \u003ci class=\"wbw__term\"\u003epāi\u003c/i\u003e–irei obter \u003ci class=\"wbw__term\"\u003euddhāra\u003c/i\u003e–liberação \u003ci class=\"wbw__term\"\u003esaṁsāre\u003c/i\u003e–do mundo material.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, eu não tenho saída. Apenas se Você misericordiosamente me resgatar, eu serei liberto do saṁsāra.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, paḍechhi māyāra phere\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhana, dārā, suta\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ghirechhe āmāre\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kāmete rekhechhe jere\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth \u003ci class=\"wbw__term\"\u003epaḍechhi\u003c/i\u003e–eu caí \u003ci class=\"wbw__term\"\u003ephere\u003c/i\u003e–nos perigos \u003ci class=\"wbw__term\"\u003emāyāra\u003c/i\u003e–da ilusão. \u003ci class=\"wbw__term\"\u003edhana\u003c/i\u003e–Riqueza d \u003ci class=\"wbw__term\"\u003eārā\u003c/i\u003e–esposa, [e] \u003ci class=\"wbw__term\"\u003esuta\u003c/i\u003e–filhos \u003ci class=\"wbw__term\"\u003eāmāre\u003c/i\u003e–me \u003ci class=\"wbw__term\"\u003eghirechhe\u003c/i\u003e–cercaram [e a] \u003ci class=\"wbw__term\"\u003ekāmete\u003c/i\u003e–luxúria \u003ci class=\"wbw__term\"\u003ejere rekhechhe\u003c/i\u003e–[me] dominou.\u003c/p\u003e\n\u003cp class=\"translat
