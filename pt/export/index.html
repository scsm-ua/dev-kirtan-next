rm\"\u003eprasāda\u003c/i\u003e–os remanentes de oferenda de comida a Você (misericórdia ítens misericordiosamente concedidos) \u003ci class=\"wbw__term\"\u003euchchhiṣṭa\u003c/i\u003e–remanentes [que seus devotos] \u003ci class=\"wbw__term\"\u003erākhibe\u003c/i\u003e–irão deixar para trás \u003ci class=\"wbw__term\"\u003eāmāra bhojana\u003c/i\u003e–eu vou comer \u003ci class=\"wbw__term\"\u003eparama ānande\u003c/i\u003e–com grande alegria \u003ci class=\"wbw__term\"\u003eprati\u003c/i\u003e–todo \u003ci class=\"wbw__term\"\u003edina\u003c/i\u003e–dia \u003ci class=\"wbw__term\"\u003ehabe\u003c/i\u003e–será \u003ci class=\"wbw__term\"\u003etāhā\u003c/i\u003e–isso.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuaisquer restos que seus devotos deixem para trás depois de honrar Sua prasād eu vou comer todos os dias com grande alegria.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebasiyā śuiyā,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra charaṇa,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chintiba satata āmi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāchite nāchite,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nikaṭe yāiba,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;yakhana ḍākibe tumi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ebasiyā\u003c/i\u003e–Sentado [ou] \u003ci class=\"wbw__term\"\u003eśuiyā\u003c/i\u003e–deitado \u003ci class=\"wbw__term\"\u003eāmi\u003c/i\u003e–eu \u003ci class=\"wbw__term\"\u003esatata\u003c/i\u003e–sempre \u003ci class=\"wbw__term\"\u003echintiba\u003c/i\u003e–pensarei [em] \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003echaraṇa\u003c/i\u003e–pés. \u003ci class=\"wbw__term\"\u003eyāiba\u003c/i\u003e–Eu irei \u003ci class=\"wbw__term\"\u003enikaṭe\u003c/i\u003e–para perto [de] \u003ci class=\"wbw__term\"\u003etumi\u003c/i\u003e–Você \u003ci class=\"wbw__term\"\u003eyakhana\u003c/i\u003e–quando [me] \u003ci class=\"wbw__term\"\u003eḍākibe\u003c/i\u003e–chamar \u003ci class=\"wbw__term\"\u003enāchite\u003c/i\u003e–dançando \u003ci class=\"wbw__term\"\u003enāchite\u003c/i\u003e–e dançando.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSentado ou deitado, eu sempre pensarei em Seus Pés. Eu irei até Ti sempre que Me chamares, dançando por todo o caminho.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enijera poṣana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kabhu nā bhāviba,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rahiba bhāvera bhare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakati-vinoda,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāre pālaka,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;baliyā varaṇa kare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekabhu nā bhāviba\u003c/i\u003e–Nunca vou pensar [em] \u003ci class=\"wbw__term\"\u003enijera\u003c/i\u003e–minha própria \u003ci class=\"wbw__term\"\u003epoṣaṇa\u003c/i\u003e–manutenção, nutrição \u003ci class=\"wbw__term\"\u003erahiba\u003c/i\u003e–eu irei ficar \u003ci class=\"wbw__term\"\u003ebhare\u003c/i\u003e–no abrigo \u003ci class=\"wbw__term\"\u003ebhāvera\u003c/i\u003e–do apego amoroso. \u003ci class=\"wbw__term\"\u003ebhakati-vinoda\u003c/i\u003e–Bhakti Vinod \u003ci class=\"wbw__term\"\u003ekare varaṇa\u003c/i\u003e–escolhe \u003ci class=\"wbw__term\"\u003etomāre\u003c/i\u003e–Você \u003ci class=\"wbw__term\"\u003ebaliyā\u003c/i\u003e–considerando [seu] \u003ci class=\"wbw__term\"\u003epālaka\u003c/i\u003e–protetor.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu nunca vou pensar em minha própria manutenção eu vou sempre permanecer dentro do abrigo do apego amoroso a Ti. Bhakti Vinod O abraça como seu mantenedor.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-atma-nivedana-tuya-pade-kori\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eĀtma-nivedana \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eātma-nivedana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tuyā pade kari\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ha-inu parama sukhī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eduḥkha dūre gela\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chintā nā rahila\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chaudike ānanda dekhi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eātma-nivedana kari’\u003c/i\u003e–Me entregando [aos] \u003ci class=\"wbw__term\"\u003etuyā\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003epade\u003c/i\u003e–pés \u003ci class=\"wbw__term\"\u003eha-inu\u003c/i\u003e–eu me tornei \u003ci class=\"wbw__term\"\u003eparama\u003c/i\u003e–supremamente \u003ci class=\"wbw__term\"\u003esukhī\u003c/i\u003e–feliz. [Todo meu] \u003ci class=\"wbw__term\"\u003eduḥkha\u003c/i\u003e–pesar \u003ci class=\"wbw__term\"\u003egela\u003c/i\u003e–foi [para] \u003ci class=\"wbw__term\"\u003edūre\u003c/i\u003e–longe, \u003ci class=\"wbw__term\"\u003enā\u003c/i\u003e–não \u003ci class=\"wbw__term\"\u003erahila\u003c/i\u003e–ficou \u003ci class=\"wbw__term\"\u003echintā\u003c/i\u003e–pensamento, ansiedade. \u003ci class=\"wbw__term\"\u003edekhi\u003c/i\u003e–Eu vejo \u003ci class=\"wbw__term\"\u003eānanda\u003c/i\u003e–êxtase \u003ci class=\"wbw__term\"\u003echaudike\u003c/i\u003e–nas quatro direções.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEntregando-me a Seus pés, eu fiquei completamente feliz. Toda minha angústia se foi, não tenho mais ansiedade, e vejo alegria em todas as direções.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eaśoka-abhaya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;amṛta-ādhāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra charaṇa-dvaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etāhāte ekhana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;viśrāma labhiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chhāḍinu bhavera bhaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003edvaya\u003c/i\u003e–dois \u003ci class=\"wbw__term\"\u003echaraṇa\u003c/i\u003e–pés [são] \u003ci class=\"wbw__term\"\u003eādhāra\u003c/i\u003e–reservatórios \u003ci class=\"wbw__term\"\u003eaśoka\u003c/i\u003e–de não lamentação \u003ci class=\"wbw__term\"\u003eabhaya\u003c/i\u003e–de destemor \u003ci class=\"wbw__term\"\u003eamṛta\u003c/i\u003e–de imortalidade. \u003ci class=\"wbw__term\"\u003etāhāte\u003c/i\u003e–Neles \u003ci class=\"wbw__term\"\u003eekhana\u003c/i\u003e–agora \u003ci class=\"wbw__term\"\u003elabhiyā\u003c/i\u003e–obtendo \u003ci class=\"wbw__term\"\u003eviśrāma\u003c/i\u003e–descanso \u003ci class=\"wbw__term\"\u003echhāḍinu\u003c/i\u003e–eu abandonei [todo] \u003ci class=\"wbw__term\"\u003ebhaya\u003c/i\u003e–medo \u003ci class=\"wbw__term\"\u003ebhavera\u003c/i\u003e–da existência material, nascimento e morte cíclica.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSeus pés são a morada da alegria, do destemor, e do néctar. Recebendo abrigo debaixo deles, eu abandonei todo o medo da existência material.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra saṁsāre\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kariba sevana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nahiba phalera bhāgī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava sukha yāhe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kariba yatana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ha’ye pade anurāgī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekariba sevana\u003c/i\u003e–Eu servirei [em] \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Sua \u003ci class=\"wbw__term\"\u003esaṁsāre\u003c/i\u003e–casa [e] \u003ci class=\"wbw__term\"\u003enahiba\u003c/i\u003e–não me tornarei \u003ci class=\"wbw__term\"\u003ebhāgī\u003c/i\u003e–sócio \u003ci class=\"wbw__term\"\u003ephalera\u003c/i\u003e–dos frutos. \u003ci class=\"wbw__term\"\u003eha’ye\u003c/i\u003e–Sendo \u003ci class=\"wbw__term\"\u003eanurāgī\u003c/i\u003e–amorosamente apegado \u003ci class=\"wbw__term\"\u003epade\u003c/i\u003e–aos Seus pés [tudo] \u003ci class=\"wbw__term\"\u003ekariba\u003c/i\u003e–eu farei [com] \u003ci class=\"wbw__term\"\u003eyatana\u003c/i\u003e–esforço cuidadoso \u003ci class=\"wbw__term\"\u003eyāhe\u003c/i\u003e–pela \u003ci class=\"wbw__term\"\u003etava\u003c/i\u003e–Sua \u003ci class=\"wbw__term\"\u003esukha\u003c/i\u003e–felicidade.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu servirei em Sua casa e não me tornarei um desfrutador dos resultados. Amorosamente apegado aos Seus pés, eu farei com cuidado tudo o que lhe agrada.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra sevāya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;duḥkha haya yata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;seo ta’ parama sukha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esevā-sukha-duḥkha\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;parama sampada\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāśaye avidyā-duḥkha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eyata\u003c/i\u003e–Toda \u003ci class=\"wbw__term\"\u003eduḥkha\u003c/i\u003e–dificuldade [que] \u003ci class=\"wbw__term\"\u003ehaya\u003c/i\u003e–acontece [em] \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Seu \u003ci class=\"wbw__term\"\u003esevāya\u003c/i\u003e–serviço \u003ci class=\"wbw__term\"\u003ese\u003c/i\u003e–que \u003ci class=\"wbw__term\"\u003eo\u003c/i\u003e–também \u003ci class=\"wbw__term\"\u003eta’\u003c/i\u003e–certamente [é minha] \u003ci class=\"wbw__term\"\u003eparama\u003c/i\u003e–suprema \u003ci class=\"wbw__term\"\u003esukha\u003c/i\u003e–felicidade. [A] \u003ci class=\"wbw__term\"\u003esukha\u003c/i\u003e–felicidade [e a] \u003ci class=\"wbw__term\"\u003eduḥkha\u003c/i\u003e–angústia [de Seu] \u003ci class=\"wbw__term\"\u003esevā\u003c/i\u003e–serviço [são minha] \u003ci class=\"wbw__term\"\u003eparama\u003c/i\u003e–suprema \u003ci class=\"wbw__term\"\u003esampada\u003c/i\u003e–fortuna [ambos] \u003ci class=\"wbw__term\"\u003enāśaye\u003c/i\u003e–destroem [a] \u003ci class=\"wbw__term\"\u003eduḥkha\u003c/i\u003e–tristeza \u003ci class=\"wbw__term\"\u003eavidyā\u003c/i\u003e–da ignorância.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTanto a aflição quanto a felicidade que vêm de Seu serviço são minha grande fortuna. Ambos destroem a angústia da ignorância.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epūrva itihāsa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhulinu sakala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sevā-sukha pe’ye mane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāmi ta’ tomāra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tumi ta’ āmāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ki kāja apara dhane\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003epeye\u003c/i\u003e–Obtendo [a] \u003ci class=\"wbw__term\"\u003esukha\u003c/i\u003e–felicidade [de seu] \u003ci class=\"wbw__term\"\u003esevā\u003c/i\u003e–serviço \u003ci class=\"wbw__term\"\u003emane\u003c/i\u003e–no coração \u003ci class=\"wbw__term\"\u003ebhulinu\u003c/i\u003e–eu esqueci \u003ci class=\"wbw__term\"\u003esakala\u003c/i\u003e–toda \u003ci class=\"wbw__term\"\u003eitihāsa\u003c/i\u003e–história \u003ci class=\"wbw__term\"\u003epūrva\u003c/i\u003e–prévia. \u003ci class=\"wbw__term\"\u003eāmi\u003c/i\u003e–Eu \u003ci class=\"wbw__term\"\u003eta’\u003c/i\u003e–certamente [sou] \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Seu, \u003ci class=\"wbw__term\"\u003etumi\u003c/i\u003e–Você \u003ci class=\"wbw__term\"\u003eta’\u003c/i\u003e–certamente [é] \u003ci class=\"wbw__term\"\u003eāmāra\u003c/i\u003e–meu. \u003ci class=\"wbw__term\"\u003eki\u003c/i\u003e–Que \u003ci class=\"wbw__term\"\u003ekāja\u003c/i\u003e–necessidade [há para] \u003ci class=\"wbw__term\"\u003eapara\u003c/i\u003e–qualquer outra \u003ci class=\"wbw__term\"\u003edhane\u003c/i\u003e–riqueza?\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSentindo a felicidade de Seu serviço em meu coração, esqueci completamente toda a história do passado. Eu sou Seu e Você é meu. Que necessidade há para qualquer outra riqueza?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakati-vinoda\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ānande ḍubiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra sevāra tare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaba cheṣṭā kare\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tava ichhā-mata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;thākiyā tomāra ghare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eḍubiyā\u003c/i\u003e–Submergindo \u003ci class=\"wbw__term\"\u003eānande\u003c/i\u003e–no êxtase \u003ci class=\"wbw__term\"\u003etare\u003c/i\u003e–por conta de \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Seu \u003ci class=\"wbw__term\"\u003esevāra\u003c/i\u003e–serviço \u003ci class=\"wbw__term\"\u003ebhakati-vinoda\u003c/i\u003e–Bhakti Vinod \u003ci class=\"wbw__term\"\u003ethākiyā\u003c/i\u003e–reside [em] \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Sua \u003ci class=\"wbw__term\"\u003eghare\u003c/i\u003e–casa [e] \u003ci class=\"wbw__term\"\u003ekare\u003c/i\u003e–faz \u003ci class=\"wbw__term\"\u003esaba\u003c/i\u003e–todos [os] \u003ci class=\"wbw__term\"\u003echeṣṭā\u003c/i\u003e–esforços \u003ci class=\"wbw__term\"\u003emata\u003c/i\u003e–de acordo ao \u003ci class=\"wbw__term\"\u003etava\u003c/i\u003e–Seu \u003ci class=\"wbw__term\"\u003eichchhā\u003c/i\u003e–desejo.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMergulhando na alegria de Seu serviço, Bhakti Vinod reside em sua casa e executa todos os esforços de acordo com a Sua vontade.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gauranga-bolite-hobe-pulaka-shorira\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003e‘Gaurāṅga’ bolite habe \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘gaurāṅga’ balite habe pulaka śarīra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘hari hari’ balite nayane va’be nīra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando os pelos do meu corpo ficarão em pé quando eu cantar: “Gaurāṅga!”? Quando lágrimas se derramarão dos meus olhos quando eu cantar: “Hari! Hari!”?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eāra kabe nitāichā̐da karuṇā karibe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaṁsāra-vāsanā more kabe tuchchha ha’be\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando Nitāichā̐d será misericordioso comigo? Quando meus desejos mundanos se tornarão insignificantes?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eviṣaya chhāḍiyā kabe śuddha ha’be mana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekabe hāma heraba śrī-vṛndāvana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando minha mente desistirá de toda a mundanidade e se tornará pura? Quando vou contemplar Śrī Vṛndāvan?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erūpa-raghunātha-pade ha-ibe ākuti\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekabe hāma bujhaba se yugala-pīriti\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando vou desejar os pés de Śrī Rūpa e de Śrī Raghunāth? Quando vou entender o amor do Casal Divino?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erūpa-raghunātha-pade rahu mora āśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprārthanā karaye sadā narottama dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Que a minha aspiração esteja aos pés de Śrī Rūpa e de Śrī Raghunāth.” Narottam Dās sempre ora dessa maneira.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-kobe-hobe-bolo-se-dina-amar\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eKabe ha’be bala \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kabe ha’be bala se-dina āmāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(āmār) aparādha ghuchi’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śuddha nāme ruchi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛpā-bale ha’be hṛdaye sañchāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ebala\u003c/i\u003e–Por favor diga \u003ci class=\"wbw__term\"\u003ekabe\u003c/i\u003e–quando \u003ci class=\"wbw__term\"\u003eha’be\u003c/i\u003e–será \u003ci class=\"wbw__term\"\u003eāmāra\u003c/i\u003e–meu [o] \u003ci class=\"wbw__term\"\u003edina\u003c/i\u003e–dia \u003ci class=\"wbw__term\"\u003ese\u003c/i\u003e–que [as] \u003ci class=\"wbw__term\"\u003eaparādha\u003c/i\u003e–ofensas [serão] \u003ci class=\"wbw__term\"\u003eghuchi’\u003c/i\u003e–dissipadas [e o] \u003ci class=\"wbw__term\"\u003eruchi\u003c/i\u003e\u003ci class=\"wbw__term\"\u003e(anurāga)\u003c/i\u003e–gosto (apego amoroso profundo) \u003ci class=\"wbw__term\"\u003enāme\u003c/i\u003e–pelo Nome \u003ci class=\"wbw__term\"\u003eśuddha\u003c/i\u003e–puro \u003ci class=\"wbw__term\"\u003eha’be\u003c/i\u003e–será \u003ci class=\"wbw__term\"\u003ehṛdaye\u003c/i\u003e–em meu coração \u003ci class=\"wbw__term\"\u003esañchara\u003c/i\u003e–infundido \u003ci class=\"wbw__term\"\u003ebale\u003c/i\u003e–pelo poder \u003ci class=\"wbw__term\"\u003ekṛpā (nāma vā guru kṛpā)\u003c/i\u003e–da misericórdia (da misericórdia do Nome, ou, da misericórdia de Śrī Guru)?\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePor favor, diga-me, quando aquele dia será meu em que minhas ofensas serão dissipadas e o gosto pelo Nome puro será infundido em meu coração pela graça divina?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etṛṇādhika hīna\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kabe nije māni\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sahiṣṇutā-guṇa hṛdayete āni’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esakale mānada\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āpani amānī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;haye āsvādiba nāma-rasa-sāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekabe\u003c/i\u003e–Quando \u003ci class=\"wbw__term\"\u003enije\u003c/i\u003e–no sentido de me \u003ci class=\"wbw__term\"\u003emāni\u003c/i\u003e–considerar \u003ci class=\"wbw__term\"\u003eadhika hīna\u003c/i\u003e–mais baixo [que] \u003ci class=\"wbw__term\"\u003etṛṇa\u003c/i\u003e–uma folha de grama, \u003ci class=\"wbw__term\"\u003eāni’\u003c/i\u003e–trazendo \u003ci class=\"wbw__term\"\u003eguṇa\u003c/i\u003e–a qualidade \u003ci class=\"wbw__term\"\u003esahiṣṇutā\u003c/i\u003e–da tolerância \u003ci class=\"wbw__term\"\u003ehṛdayete\u003c/i\u003e–para o coração, \u003ci class=\"wbw__term\"\u003esakale\u003c/i\u003e–a todos [o] \u003ci class=\"wbw__term\"\u003emānada\u003c/i\u003e–desejo de oferecer honra, \u003ci class=\"wbw__term\"\u003eamānī\u003c/i\u003e–sem desejo por honra \u003ci class=\"wbw__term\"\u003eāpani\u003c/i\u003e–a mim mesmo, \u003ci class=\"wbw__term\"\u003eha’ye\u003c/i\u003e–sendo [que] \u003ci class=\"wbw__term\"\u003eāsvādiba\u003c/i\u003e–eu irei saborear \u003ci class=\"wbw__term\"\u003esāra\u003c/i\u003e–a essência \u003ci class=\"wbw__term\"\u003erasa\u003c/i\u003e–do néctar extático \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–do Nome?\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando vou me sentir como menor do que uma folha de grama, trazer a qualidade da tolerância para dentro do meu coração, me tornar ansioso por honrar a todos, e desprovido do desejo de ser honrado por alguém, saborear a essência do rasa do Nome?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edhana jana āra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kavitā, sundarī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;baliba nā chāhi deha-sukha-karī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejanme-janme dāo\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ohe gaurahari!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ahaitukī-bhakti charaṇe tomāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Quando] \u003ci class=\"wbw__term\"\u003ebaliba\u003c/i\u003e–eu direi [que] \u003ci class=\"wbw__term\"\u003enā chāhi\u003c/i\u003e–não desejo \u003ci class=\"wbw__term\"\u003edhana\u003c/i\u003e–riqueza, \u003ci class=\"wbw__term\"\u003ejana\u003c/i\u003e–seguidores, (família) \u003ci class=\"wbw__term\"\u003eāra\u003c/i\u003e–e \u003ci class=\"wbw__term\"\u003ekavitā\u003c/i\u003e–erudição, \u003ci class=\"wbw__term\"\u003esundarī\u003c/i\u003e–belas mulheres \u003ci class=\"wbw__term\"\u003esukha-karī\u003c/i\u003e–e outros prazeres \u003ci class=\"wbw__term\"\u003edeha\u003c/i\u003e–corporais? \u003ci class=\"wbw__term\"\u003eohe\u003c/i\u003e–Ó \u003ci class=\"wbw__term\"\u003egaurahari!\u003c/i\u003e–Gaurahari! \u003ci class=\"wbw__term\"\u003ejanme\u003c/i\u003e–Nascimento \u003ci class=\"wbw__term\"\u003ejanme\u003c/i\u003e–após nascimento \u003ci class=\"wbw__term\"\u003edāo\u003c/i\u003e–por favor [me] dê \u003ci class=\"wbw__term\"\u003ebhakti\u003c/i\u003e–devoção \u003ci class=\"wbw__term\"\u003eahaitukī\u003c/i\u003e–sem causa [aos] \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003echaraṇe\u003c/i\u003e–pés.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando vou proclamar que não desejo riqueza, seguidores, erudição, mulheres bonitas, ou quaisquer outros prazeres corporais? Ó Gaurahari! Nascimento após nascimento, por favor me dê devoção incondicional aos Seus pés.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(kabe) karite śrī-kṛṣṇa-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāma uchāraṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pulakita deha gadgada vachana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaivarṇya-vepathu\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;habe saṅghaṭana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nirantara netre va’be aśru-dhāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekabe\u003c/i\u003e–Quando [meu] \u003ci class=\"wbw__term\"\u003edeha\u003c/i\u003e–corpo [se] \u003ci class=\"wbw__term\"\u003epulakita\u003c/i\u003e–arrepiará, \u003ci class=\"wbw__term\"\u003evachana\u003c/i\u003e–emissões \u003ci class=\"wbw__term\"\u003egadgada\u003c/i\u003e–engasgadas, \u003ci class=\"wbw__term\"\u003evaivarṇya\u003c/i\u003e–tornando \u003ci class=\"wbw__term\"\u003evepathu\u003c/i\u003e–tremendo, \u003ci class=\"wbw__term\"\u003eha’be\u003c/i\u003e–será [a] \u003ci class=\"wbw__term\"\u003esaṁghaṭana\u003c/i\u003e–ocorrência [de] \u003ci class=\"wbw__term\"\u003edhāra\u003c/i\u003e–correntes \u003ci class=\"wbw__term\"\u003eaśru\u003c/i\u003e–de lágrimas [que] \u003ci class=\"wbw__term\"\u003eva’be\u003c/i\u003e–fluirão \u003ci class=\"wbw__term\"\u003enirantara\u003c/i\u003e–incessantemente \u003ci class=\"wbw__term\"\u003enetre\u003c/i\u003e–dos olhos \u003ci class=\"wbw__term\"\u003ekarite\u003c/i\u003e–fazendo \u003ci class=\"wbw__term\"\u003euchchāraṇa\u003c/i\u003e–expressão em voz alta \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–do Nome \u003ci class=\"wbw__term\"\u003eśrī-kṛṣṇa\u003c/i\u003e–de Śrī Kṛṣṇa?\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando meus cabelos ficarão em pé, minha voz oscilará, minha pele empalidecerá, meu corpo tremerá e lágrimas se derramarão incessantemente dos meus olhos ao chamar em voz alta o Nome de Śrī Kṛṣṇa?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekabe navadvīpe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;suradhunī-taṭe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘gaura-nityānanda’ bali’ niṣkapaṭe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāchiyā gāiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;beḍāiba chhuṭe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vātulera prāya chhāḍiyā vichāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekabe\u003c/i\u003e–Quando \u003ci class=\"wbw__term\"\u003enavadvīpe\u003c/i\u003e–em Nabadwip \u003ci class=\"wbw__term\"\u003etaṭe\u003c/i\u003e–às margens \u003ci class=\"wbw__term\"\u003esuradhunī\u003c/i\u003e–do Ganges \u003ci class=\"wbw__term\"\u003ebeḍāiba\u003c/i\u003e–Eu irei vaguear \u003ci class=\"wbw__term\"\u003echhuṭe\u003c/i\u003e–correndo, \u003ci class=\"wbw__term\"\u003ebali’\u003c/i\u003e–dizendo \u003ci class=\"wbw__term\"\u003eniṣkapaṭe\u003c/i\u003e–sinceramente \u003ci class=\"wbw__term\"\u003egaura-nityānanda\u003c/i\u003e–Gaura–Nityānanda! \u003ci class=\"wbw__term\"\u003enāchiyā\u003c/i\u003e–dançando \u003ci class=\"wbw__term\"\u003egāiyā\u003c/i\u003e–cantando \u003ci class=\"wbw__term\"\u003evātulera\u003c/i\u003e–como um louco \u003ci class=\"wbw__term\"\u003eprāya\u003c/i\u003e–quase \u003ci class=\"wbw__term\"\u003echhāḍiyā\u003c/i\u003e–abandonando [todas as] \u003ci class=\"wbw__term\"\u003evichāra\u003c/i\u003e–ponderações?\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando, na terra de Nabadwip, às margens do Ganges vou correr, chamando sinceramente: “Ó Gaura! Ó Nityānanda!”, dançando e cantando como um louco, abandonando todas as considerações?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekabe nityānanda\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;more kari’ dayā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chhāḍāibe mora viṣayera māyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ediyā more nija-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;charaṇera chhāyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāmera hāṭete dibe adhikāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekabe\u003c/i\u003e–Quando \u003ci class=\"wbw__term\"\u003enityānanda\u003c/i\u003e–Śrī Nityānanda Prabhu \u003ci class=\"wbw__term\"\u003ekari’ dayā\u003c/i\u003e–terá misericórdia \u003ci class=\"wbw__term\"\u003emore\u003c/i\u003e–de mim [e] \u003ci class=\"wbw__term\"\u003echhāḍāibe\u003c/i\u003e–irá causar o abandono [do] \u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–meu \u003ci class=\"wbw__term\"\u003emāyā\u003c/i\u003e–apego \u003ci class=\"wbw__term\"\u003eviṣayera\u003c/i\u003e–[à] mundanidade? [Quando Ele] \u003ci class=\"wbw__term\"\u003ediyā\u003c/i\u003e–dando \u003ci class=\"wbw__term\"\u003emore\u003c/i\u003e–a mim \u003ci class=\"wbw__term\"\u003enija\u003c/i\u003e–[a] Própria \u003ci class=\"wbw__term\"\u003echhāyā\u003c/i\u003e–sombra \u003ci class=\"wbw__term\"\u003echaraṇera\u003c/i\u003e–de Seus Pés [me] \u003ci class=\"wbw__term\"\u003edibe\u003c/i\u003e–dará \u003ci class=\"wbw__term\"\u003eadhikāra\u003c/i\u003e–qualificação \u003ci class=\"wbw__term\"\u003ehāṭete\u003c/i\u003e–no mercado \u003ci class=\"wbw__term\"\u003enāmera\u003c/i\u003e–do Nome?\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando Nityānanda terá misericórdia de mim e me fará abandonar o meu apego à mundanidade? Quando ele me dará a sombra de Seus pés e me concederá um lugar no mercado do Nome?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekiniba, luṭiba\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hari-nāma-rasa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāma-rase māti’ ha-iba vivaśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erasera rasika-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;charaṇa paraśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kariyā majiba rase anibāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Quando] \u003ci class=\"wbw__term\"\u003ekiniba\u003c/i\u003e–vou comprar \u003ci class=\"wbw__term\"\u003eluṭiba\u003c/i\u003e–[e] com alegria espalhar \u003ci class=\"wbw__term\"\u003erasa\u003c/i\u003e–o néctar \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–do Nome \u003ci class=\"wbw__term\"\u003ehari\u003c/i\u003e–de Śrī Hari? [Quando] \u003ci class=\"wbw__term\"\u003emāti’\u003c/i\u003e–vou ficar intoxicado \u003ci class=\"wbw__term\"\u003erase\u003c/i\u003e–com o néctar \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–do Nome, [e] \u003ci class=\"wbw__term\"\u003eha-iba\u003c/i\u003e–vou me tornar \u003ci class=\"wbw__term\"\u003evivaśa (ātma-vismṛta)\u003c/i\u003e–dominado (autoesquecido)? [Quando vou] \u003ci class=\"wbw__term\"\u003eparaśa\u003c/i\u003e–tocar [os] \u003ci class=\"wbw__term\"\u003echaraṇa\u003c/i\u003e–pés \u003ci class=\"wbw__term\"\u003erasika (nāma rasa-dātā śrī gurudeva)\u003c/i\u003e–de um desfrutador, do maior devoto (de Śrī Gurudev, o distribuidor do rasa do Nome) \u003ci class=\"wbw__term\"\u003erasera\u003c/i\u003e–do néctar [e] \u003ci class=\"wbw__term\"\u003ekariyā majiba\u003c/i\u003e–me tornarei submerso \u003ci class=\"wbw__term\"\u003erase\u003c/i\u003e–no néctar \u003ci class=\"wbw__term\"\u003eanibāra\u003c/i\u003e–incessantemente?\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando vou comprar e com alegria espalhar o rasa do Nome? Quando vou me tornar intoxicado e dominado pelo rasa? Quando vou tocar os pés de um desfrutador desse rasa e me tornar imerso nesse rasa perpetuamente?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekabe jīve dayā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ha-ibe udaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nija-sukha bhuli’ sudīna-hṛdaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakati-vinoda\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kariyā vinaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-ājñā-ṭahala karibe parachāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekabe\u003c/i\u003e–Quando [a] \u003ci class=\"wbw__term\"\u003edayā\u003c/i\u003e–misericórdia \u003ci class=\"wbw__term\"\u003ejīve\u003c/i\u003e–pelas almas \u003ci class=\"wbw__term\"\u003eha-ibe udaya\u003c/i\u003e–surgirá? [Quando] \u003ci class=\"wbw__term\"\u003ebhakati-vinoda\u003c/i\u003e–Bhakti Vinod [irá] \u003ci class=\"wbw__term\"\u003ebhuli’\u003c/i\u003e–esquecer [sua] \u003ci class=\"wbw__term\"\u003enija\u003c/i\u003e–própria \u003ci class=\"wbw__term\"\u003esukha\u003c/i\u003e–felicidade [e com o] \u003ci class=\"wbw__term\"\u003esudīna\u003c/i\u003e–mais humilde \u003ci class=\"wbw__term\"\u003ehṛdaya\u003c/i\u003e–coração \u003ci class=\"wbw__term\"\u003eśrī-ājñā-ṭahala\u003c/i\u003e–por ordem divina viajar \u003ci class=\"wbw__term\"\u003ekariyā vinaya\u003c/i\u003e–[e.com] humildade \u003ci class=\"wbw__term\"\u003ekaribe parachāra\u003c/i\u003e–irá pregar ?\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando a compaixão por todas as almas surgirá dentro de mim? Quando Bhakti Vinod irá esquecer a sua própria felicidade e viajar respeitosamente pregando os ensinamentos de Śrī Gaurasundar com o mais humilde coração?\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-kobe-gaura-vane-suradhuni-tate\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eSiddhi-Lālasā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekabe gaura-vane\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;suradhunī-taṭe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘hā rādhe hā kṛṣṇa’ ba’le\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekā̐diyā beḍāba\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;deha-sukha chhāḍi’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nānā latā-taru-tale\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekabe\u003c/i\u003e–Quando [vou] \u003ci class=\"wbw__term\"\u003echhāḍi’\u003c/i\u003e–abandonar [os] \u003ci class=\"wbw__term\"\u003esukha\u003c/i\u003e–prazeres \u003ci class=\"wbw__term\"\u003edeha\u003c/i\u003e–do corpo \u003ci class=\"wbw__term\"\u003ebeḍāba\u003c/i\u003e–[e] vaguear \u003ci class=\"wbw__term\"\u003etaṭe\u003c/i\u003e–às margens \u003ci class=\"wbw__term\"\u003esuradhunī\u003c/i\u003e–do Ganges \u003ci class=\"wbw__term\"\u003etale\u003c/i\u003e–sob \u003ci class=\"wbw__term\"\u003enānā\u003c/i\u003e–várias \u003ci class=\"wbw__term\"\u003etaru\u003c/i\u003e–árvores [e] \u003ci class=\"wbw__term\"\u003elatā\u003c/i\u003e–trepadeiras \u003ci class=\"wbw__term\"\u003evane (vihāra-kṣetre)\u003c/i\u003e–na floresta (de Śrī Nabadwīp Dhām) \u003ci class=\"wbw__term\"\u003egaura (śrī gaurasundarer)\u003c/i\u003e–de Śrī Gaurasundar \u003ci class=\"wbw__term\"\u003ekā̐diyā\u003c/i\u003e–chorando [e] \u003ci class=\"wbw__term\"\u003ebale\u003c/i\u003e–dizendo \u003ci class=\"wbw__term\"\u003ehā\u003c/i\u003e–ó! \u003ci class=\"wbw__term\"\u003erādhe\u003c/i\u003e–Śrīmatī Rādhārāṇī \u003ci class=\"wbw__term\"\u003ehā\u003c/i\u003e–ó! \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–Kṛṣṇa?\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando vou abandonar todos os prazeres corporais e vaguear ao longo das margens do Ganges sob as árvores e trepadeiras nas florestas de Śrī Gaurasundar, chorando e gritando: “Ó Rādhā! Ó Kṛṣṇa!”?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśva-pacha-gṛhete\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;māgiyā khāiba\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;piba sarasvatī-jala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epuline puline\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gaḍāgaḍi diba\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kari’ kṛṣṇa-kolāhala\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Quando] \u003ci class=\"wbw__term\"\u003ekhāiba\u003c/i\u003e–vou comer \u003ci class=\"wbw__term\"\u003emāgiyā\u003c/i\u003e–mendigando \u003ci class=\"wbw__term\"\u003egṛhete\u003c/i\u003e–nas casas \u003ci class=\"wbw__term\"\u003eśvapacha (kukura māṁsa-bhojī chaṇḍāla)\u003c/i\u003e–de pessoas de baixa classe que comem carne de cachorro \u003ci class=\"wbw__term\"\u003epiba\u003c/i\u003e–[e] beber \u003ci class=\"wbw__term\"\u003ejala\u003c/i\u003e–a água \u003ci class=\"wbw__term\"\u003esaraswatī\u003c/i\u003e–do rio Sarasvatī? \u003ci class=\"wbw__term\"\u003epuline\u003c/i\u003e–Nas margens \u003ci class=\"wbw__term\"\u003epuline\u003c/i\u003e–ao longo das margens [do Ganges] \u003ci class=\"wbw__term\"\u003egaḍā-gaḍi\u003c/i\u003e–rolando no chão \u003ci class=\"wbw__term\"\u003ediba kari’\u003c/i\u003e–vou dar \u003ci class=\"wbw__term\"\u003ekolāhala\u003c/i\u003e–um alarido: \u003ci class=\"wbw__term\"\u003eKṛṣṇa\u003c/i\u003e–Kṛṣṇa!\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando eu vou comer mendigando comida nas casas dos párias comedores de cachorro e beber a água do rio Saraswatī? Quando vou estar de novo às margens do Ganges, e às gargalhadas chamar:“Kṛṣṇa!”?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edhāma-vāsī jane\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;praṇati kariyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;māgiba kṛpāra leśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaiṣṇava-charaṇa-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;reṇu gāya mākhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dhari’ avadhūta-veśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Quando vou] \u003ci class=\"wbw__term\"\u003ekariyā praṇati\u003c/i\u003e–prestar reverência \u003ci class=\"wbw__term\"\u003ejane\u003c/i\u003e–às pessoas \u003ci class=\"wbw__term\"\u003evāsī\u003c/i\u003e–residentes \u003ci class=\"wbw__term\"\u003edhāma\u003c/i\u003e–da morada sagrada \u003ci class=\"wbw__term\"\u003emāgiba\u003c/i\u003e–[e] implorar \u003ci class=\"wbw__term\"\u003eleśa (kaṇā)\u003c/i\u003e–por um traço (uma partícula) \u003ci class=\"wbw__term\"\u003ekṛpāra\u003c/i\u003e–da misericórdia \u003ci class=\"wbw__term\"\u003edhari’\u003c/i\u003e–vestindo \u003ci class=\"wbw__term\"\u003eveśa\u003c/i\u003e–o traje \u003ci class=\"wbw__term\"\u003eavadhūta\u003c/i\u003e–de um mendicante itinerante transcendental ao varṇāśram-dharma, cujo comportamento extático, puramente devocional e incompreensível (e desprezado) para pessoas mundanas (e devotos neófitos) \u003ci class=\"wbw__term\"\u003emākhi’\u003c/i\u003e–espalhando \u003ci class=\"wbw__term\"\u003egāya\u003c/i\u003e–no corpo \u003ci class=\"wbw__term\"\u003ereṇu\u003c/i\u003e–a poeira \u003ci class=\"wbw__term\"\u003echaraṇa\u003c/i\u003e–dos pés \u003ci class=\"wbw__term\"\u003evaiṣṇava\u003c/i\u003e–dos devotos?\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando vou me curvar diante dos residentes da morada de Śrī Gaurasundar e mendigar por uma partícula de sua misericórdia? Quando vou usar a veste de um avadhūt e espalhar sobre meu corpo a poeira dos pés dos devotos?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egauḍa-vraja-vane\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bheda nā heriba\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ha-iba varaja-vāsī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhāmera svarūpa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sphuribe nayane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ha-iba rādhāra dāsī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Quando] \u003ci class=\"wbw__term\"\u003enā heriba\u003c/i\u003e–não verei \u003ci class=\"wbw__term\"\u003ebheda\u003c/i\u003e–diferença [entre] \u003ci class=\"wbw__term\"\u003ejane (parikara, bhagavat pārṣada)\u003c/i\u003e–as pessoas (séquito, associados do Senhor) \u003ci class=\"wbw__term\"\u003egauḍa (śrī-gauḍa-maṇḍala)\u003c/i\u003e–do distrito de Gauḍa [e as pessoas] \u003ci class=\"wbw__term\"\u003evraja (śrī vraja-maṇḍala)\u003c/i\u003e–do distrito de Vraja \u003ci class=\"wbw__term\"\u003eha-iba\u003c/i\u003e–[e] me tornarei \u003ci class=\"wbw__term\"\u003evāsī\u003c/i\u003e–um residente \u003ci class=\"wbw__term\"\u003evaraja (vraja)\u003c/i\u003e–de Vraja? [Quando] \u003ci class=\"wbw__term\"\u003esvarūpa (chidānanda svarūpa)\u003c/i\u003e–a natureza verdadeira (natureza espiritual extática) \u003ci class=\"wbw__term\"\u003edhāmera\u003c/i\u003e–da morada (de Vraja) \u003ci class=\"wbw__term\"\u003esphuribe\u003c/i\u003e–se manifestará \u003ci class=\"wbw__term\"\u003enayane\u003c/i\u003e–ante os meus olhos? [Quando] \u003ci class=\"wbw__term\"\u003eha-iba (lābha kariba)\u003c/i\u003e–eu me tornarei (Eu obterei) \u003ci class=\"wbw__term\"\u003edāsī (kaiṅkarya)\u003c/i\u003e–uma serva (servidão) \u003ci class=\"wbw__term\"\u003erādhāra\u003c/i\u003e–de Śrīmatī Rādhārāṇi?\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando eu não verei nenhuma diferença entre os residentes de Gauḍa e os residentes de Vraja, e me tornarei um residente de Vraja? Quando a verdadeira natureza da morada do Senhor se manifestará diante dos meus olhos? Quando vou me tornar uma serva de Śrī Rādhā?\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eConselho\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-durlabha-manava-janma-labhiya-samsare\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eDurlabha mānava-janma \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edurlabha mānava-janma labhiyā saṁsāre\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa nā bhajinu duḥkha kahiba kāhāre?\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu alcancei um nascimento humano, que é muito raro neste mundo, mas não servi Kṛṣṇa. A quem devo expressar meu sofrimento?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘saṁsāra’ ‘saṁsāra’ kari’ michhe gela kāla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elābha nā ha-ila kichhu, ghaṭila jañjāla\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVivendo vida após vida neste mundo material, o meu tempo se foi em vão. Eu não ganhei nada. Eu só tenho sofrido.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekisera saṁsāra ei chhāyābāji prāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eihāte mamatā kari vṛthā dina yāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQue tipo de mundo é este? É como um teatro de sombras. Me apegando a ele, meus dias se passam em vão.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ee deha patana ha’le ki rabe āmāra?\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeha sukha nāhi dibe putra paribāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando este corpo cair morto, o que continuará a ser ‘meu’? Após a morte nem meus filhos nem minha família vão me dar nenhuma satisfação.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egardabhera mata āmi kari pariśrama\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekāra lāgi’ eta kari, nā ghuchila bhrama\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu trabalho arduamente como um burro. Para quem eu estou fazendo isso? Ainda assim minha ilusão não se dissipou.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edina yāya michhā kāje, niśā nidrā-vaśe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāhi bhāvi maraṇa nikaṭe āchhe vase\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMeus dias se passam em esforços inúteis, e minhas noites se passam em sono. Eu nunca considero que a morte está sentada por perto.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhāla manda khāi, heri, pari, chintā-hīna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāhi bhāvi, e deha chhāḍiba kona dina\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu como, observo a paisagem, e me visto num espírito de desfrute, sem nenhuma preocupação de que um dia vou deixar este corpo.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edeha-geha-kalatrādi-chintā avirata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejāgichhe hṛdaye mora buddhi kari hata\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePensamentos constantes sobre meu corpo, casa, esposa, e assim por diante, surgem no meu coração e estragam a minha inteligência.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehāya, hāya! nāhi bhāvi—anitya e saba\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejīvana vigate kothā rahibe vaibhava?\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAi de mim! Ai de mim! Eu nunca considerei que todas essas coisas são temporárias. Quando minha alma partir, para onde vão todas estas opulências?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśmaśāne śarīra mama paḍiyā rahibe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evihaṅga-pataṅga tāya vihāra karibe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMeu corpo será colocado para descansar no crematório. Lá, aves e insetos vão desfrutar dele.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekukkura sṛgāla saba ānandita ha’ye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emahotsava karibe āmāra deha la’ye\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCães e chacais alegremente farão um festival com o meu corpo.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eye dehera ei gati, tāra anugata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaṁsāra-vaibhava āra bandhu-jana yata\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEste é o destino do meu corpo, seus efeitos, sua riqueza material, e de todos os meus companheiros.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eataeva māyā-moha chhāḍi buddhimāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enitya-tattva kṛṣṇa-bhakti karuna sandhāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePortanto, almas inteligentes! Abandonem a ilusão de Māyā e busquem pela verdade eterna: devoção a Kṛṣṇa.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-e-ghora-samsare-podiya-manava\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eE ghora saṁsāre \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ee ghora-saṁsāre\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;paḍiyā mānava\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā pāya duḥkhera śeṣa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esādhu-saṅga kari’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hari bhaje yadi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tabe anta haya kleśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eUma pessoa que tenha caído neste mundo terrível nunca deixa de sofrer. Se ela se associa com sādhus e serve Hari, no entanto, seu sofrimento chega ao fim.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eviṣaya anale\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jvalichhe hṛdaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;anale bāḍaye anala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eaparādha chhāḍi’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;laya kṛṣṇa-nāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;anale paḍaye jala\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eUma alma caída queima no fogo cada vez maior da mundanidade. Evitando ofensas, cante o nome de Kṛṣṇa. Isso derrama água sobre o fogo.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enitāi chaitanya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;charaṇa-kamale\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āśraya la-ila yei\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekāli dāsa bale\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jīvane maraṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āmāra āśraya sei\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKāli Dās diz: “Qualquer um que tenha se abrigado nos pés de lótus de Nitāi e de Chaitanya é meu abrigo, na vida e na morte.”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-haribolo-haribolo-haribolo-bhai-re\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Nāma Kīrtan 3 \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eharibolo haribolo haribolo bhāi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehari-nāma aniyāchhe gaurāṅga-nitāi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(modera duḥkha dekhe re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ irmãos! Cantem: “Hari”! Cantem: “Hari”! Cantem: “Hari”! Gaurāṅga e Nitāi trouxeram o Nome do Senhor. (Oh! Eles veem o nosso sofrimento.)\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari-nāma vinā jīvera anya dhana nāi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehari-nāme śuddha ha’la jagāi-mādhāi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(baḍa pāpī chhila re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eA alma não possui outra riqueza senão o nome do Senhor. Oh! Jagāi e Mādhāi foram purificados pelo Nome do Senhor (Oh! Eles eram grandes pecadores).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emichhe māyā-baddha ha’ye jīvana kaṭāi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(āmi āmāra bale re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāśā-vaśe ghure’ ghure’ āra kothā yāi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(āśāra śeṣa nāi re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePreso por Māyā (reivindicando ‘eu’ e ‘meu’), eu passo minha vida em vão. Oh! Controlado por desejos mundanos, vagando e errando, aonde irei então? (Oh! Os desejos mundanos nunca acabam).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari bale deo bhāi āśāra mukhe chhāi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(nirāśa ta’ sukha re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhoga-mokṣa-vāñchhā chhāḍi’ hari-nāma gāi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(śuddha-sattva ha’ye re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ irmãos! Cantem: “Hari!” e lancem cinzas no rosto do desejo material. (Oh! Viver sem desejos é felicidade). Abandonando o desejo por prazer mundano e liberação, eu canto o Nome do Senhor (sendo espiritualmente puro).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enā cheye-o nāmera guṇe o saba phala pāi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(tuchchha phaler prayāsa chheḍe re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evinoda bale yāi la’ye nāmera bālāi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(nāmera bālāi chheḍe re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMesmo sem desejá-los, eu obtenho todos os fins (dharma, artha, kāma e mokṣa) com o poder do Nome. (Oh! Abandone todos os esforços por fins insignificantes). Bhakti Vinod diz: “Eu prossigo removendo os obstáculos ao Nome do Senhor. (Oh! Evite os obstáculos ao Nome do Senhor.)”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hari-nama-mahamantra-sarva-mantra-sara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eDaśa-vidha Nāmāparādha \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari-nāma mahāmantra sarva-mantra-sāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyā̐dera karuṇā-bale jagate prachāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esei nāma-parāyaṇa sādhu, mahājana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etā̐hādera nindā nā kariha kadāchana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003esei\u003c/i\u003e–Aqueles \u003ci class=\"wbw__term\"\u003esādhu\u003c/i\u003e–sādhus \u003ci class=\"wbw__term\"\u003eparāyaṇa\u003c/i\u003e–devotados \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–ao Nome, \u003ci class=\"wbw__term\"\u003ekaruṇā-bale\u003c/i\u003e–pela misericórdia \u003ci class=\"wbw__term\"\u003eyā̐dera\u003c/i\u003e–de quem \u003ci class=\"wbw__term\"\u003emahāmantra\u003c/i\u003e–o grande mantra \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–dos Nomes \u003ci class=\"wbw__term\"\u003ehari\u003c/i\u003e–do Senhor, \u003ci class=\"wbw__term\"\u003esāra\u003c/i\u003e–o melhor \u003ci class=\"wbw__term\"\u003esarva\u003c/i\u003e–de todos [os] \u003ci class=\"wbw__term\"\u003emantra\u003c/i\u003e–mantras, [é] \u003ci class=\"wbw__term\"\u003eprachāra\u003c/i\u003e–distribuído \u003ci class=\"wbw__term\"\u003ejagate\u003c/i\u003e–pelo mundo [são] \u003ci class=\"wbw__term\"\u003emahājana\u003c/i\u003e–grandes almas. \u003ci class=\"wbw__term\"\u003ekadāchana na\u003c/i\u003e–Nunca \u003ci class=\"wbw__term\"\u003ekariha\u003c/i\u003e–[se] engaje em \u003ci class=\"wbw__term\"\u003etā̐hāderanindā\u003c/i\u003e–criticá-los.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO mahāmantra Hari-nām é o melhor de todos os mantras e é distribuído em todo o mundo pela misericórdia dos sādhus dedicados ao Nome. Nunca critique tão grandes almas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evrajendra-nandana kṛṣṇa sarveśvareśvara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emaheśvara ādi tā̐ra sevana-tatpara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma chintāmaṇi kṛṣṇa-chaitanya-svarūpa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebheda-jñāna nā karibe līlā-guṇa-rūpa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003enandana\u003c/i\u003e–O filho \u003ci class=\"wbw__term\"\u003eindra\u003c/i\u003e–do Rei \u003ci class=\"wbw__term\"\u003evraja\u003c/i\u003e–de Vraja, \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–Kṛṣṇa, [é] \u003ci class=\"wbw__term\"\u003eiśvara\u003c/i\u003e–o Senhor \u003ci class=\"wbw__term\"\u003esarva\u003c/i\u003e–de todos [os] \u003ci class=\"wbw__term\"\u003eiśvara\u003c/i\u003e–Senhores. \u003ci class=\"wbw__term\"\u003emaha-iśvara\u003c/i\u003e–O grande senhor (Śiva) [e] \u003ci class=\"wbw__term\"\u003eadi\u003c/i\u003e–os outros [deuses são] \u003ci class=\"wbw__term\"\u003etatpara\u003c/i\u003e–dedicados [a] \u003ci class=\"wbw__term\"\u003etā̐ra\u003c/i\u003e–Seu \u003ci class=\"wbw__term\"\u003esevana\u003c/i\u003e–serviço. \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–O Nome [é] \u003ci class=\"wbw__term\"\u003echintā-maṇi\u003c/i\u003e–uma joia realizadora dos desejos [e uma] \u003ci class=\"wbw__term\"\u003esvarūpa\u003c/i\u003e–forma \u003ci class=\"wbw__term\"\u003echaitanya\u003c/i\u003e–espiritual \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–de Kṛṣṇa. \u003ci class=\"wbw__term\"\u003ejñāna na karibe\u003c/i\u003e–Não considere [o Nome] \u003ci class=\"wbw__term\"\u003ebheda\u003c/i\u003e–distinto [de Sua] \u003ci class=\"wbw__term\"\u003erūpa\u003c/i\u003e–Forma, \u003ci class=\"wbw__term\"\u003eguṇa\u003c/i\u003e–Qualidades, [e] \u003ci class=\"wbw__term\"\u003elīlā\u003c/i\u003e–Passatempos.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVrajendra Nandan Kṛṣṇa é o Senhor de todos os Senhores. Śiva e todos os outros deuses são dedicados ao Seu serviço. O Nome é uma joia realizadora dos desejos e uma forma espiritual do próprio Kṛṣṇa. Não considere o Nome de Kṛṣṇa como distinto de sua Forma, Qualidades ou Passatempos.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e“guru kṛṣṇa-rūpa hana śāstrera pramāṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eguru-rūpe kṛṣṇa kṛpā kare bhāgyavāne”\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ese gurute martya-buddhi avajñādi tyaji\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eiṣṭa-lābha kara, nirantara nāma bhaji\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003epramāṇe\u003c/i\u003e–De acordo com a evidência \u003ci class=\"wbw__term\"\u003eśāstrera\u003c/i\u003e–das escrituras, [o] \u003ci class=\"wbw__term\"\u003eguru\u003c/i\u003e–Guru \u003ci class=\"wbw__term\"\u003ehana\u003c/i\u003e–é \u003ci class=\"wbw__term\"\u003erūpa\u003c/i\u003e–uma forma \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–de Kṛṣṇa. \u003ci class=\"wbw__term\"\u003erūpe\u003c/i\u003e–Na forma \u003ci class=\"wbw__term\"\u003eguru\u003c/i\u003e–de Guru, \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–Kṛṣṇa \u003ci class=\"wbw__term\"\u003ekṛpā kare\u003c/i\u003e–concede misericórdia \u003ci class=\"wbw__term\"\u003ebhāgyavāne\u003c/i\u003e–ao afortunado. \u003ci class=\"wbw__term\"\u003etyaji’\u003c/i\u003e–Abandonando \u003ci class=\"wbw__term\"\u003ebuddhi\u003c/i\u003e–a mentalidade \u003ci class=\"wbw__term\"\u003ese gurute\u003c/i\u003e–de que o Guru [é] \u003ci class=\"wbw__term\"\u003emartya\u003c/i\u003e–mortal [e todos os outros tipos de] \u003ci class=\"wbw__term\"\u003eavajña\u003c/i\u003e–desrespeito (desobediência, inveja) \u003ci class=\"wbw__term\"\u003eādi\u003c/i\u003e–e assim por diante, \u003ci class=\"wbw__term\"\u003elābha kara\u003c/i\u003e–atinja [sua] \u003ci class=\"wbw__term\"\u003eiṣṭa\u003c/i\u003e–meta: \u003ci class=\"wbw__term\"\u003ebhaji’\u003c/i\u003e–servir \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–o Nome \u003ci class=\"wbw__term\"\u003enirantara\u003c/i\u003e–eternamente.\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“As escrituras confirmam que o Guru é uma forma de Kṛṣṇa (\u003ci\u003eSB: 11.17.27\u003c/i\u003e). Na forma do Guru, Kṛṣṇa concede Sua misericórdia ao afortunado.” Abandone a concepção de que o Guru é um mortal, e todos os outros tipos de desrespeito, e alcance sua estimada meta: servir o Nome eternamente.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśruti, śruti-mātā-saha sātvata pūraṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-nāma-charaṇa-padma kare nīrājana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esei śruti-śāstra yebā karaye nindana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ese aparadhīra saṅga karibe varjana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eśruti\u003c/i\u003e–Os Vedas, \u003ci class=\"wbw__term\"\u003esaha\u003c/i\u003e–com \u003ci class=\"wbw__term\"\u003emātā\u003c/i\u003e–a mãe \u003ci class=\"wbw__term\"\u003eśruti\u003c/i\u003e–dos Vedas (gāyatrī), [e] \u003ci class=\"wbw__term\"\u003esātvata pūraṇa\u003c/i\u003e–o \u003ci\u003eŚrīmad Bhāgavatam\u003c/i\u003e \u003ci class=\"wbw__term\"\u003enīrājana kare\u003c/i\u003e–adoram \u003ci class=\"wbw__term\"\u003echaraṇa\u003c/i\u003e–os pés \u003ci class=\"wbw__term\"\u003epadma\u003c/i\u003e–de lótus \u003ci class=\"wbw__term\"\u003eśrī-nāma\u003c/i\u003e–do Nome divino. \u003ci class=\"wbw__term\"\u003evarjana karibe\u003c/i\u003e–Evite \u003ci class=\"wbw__term\"\u003esaṅga\u003c/i\u003e–a associação \u003ci class=\"wbw__term\"\u003ese aparadhīra\u003c/i\u003e–com um ofensor \u003ci class=\"wbw__term\"\u003eyebā\u003c/i\u003e–que \u003ci class=\"wbw__term\"\u003enindana karaye\u003c/i\u003e–critique \u003ci class=\"wbw__term\"\u003esei\u003c/i\u003e–os \u003ci class=\"wbw__term\"\u003eśruti\u003c/i\u003e–Vedas [e outras] \u003ci class=\"wbw__term\"\u003eśāstra\u003c/i\u003e–escrituras.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOs Vedas, sua mãe, o Gāyatrī, e o \u003ci\u003eŚrīmad Bhāgavatam\u003c/i\u003e adoram os pés de lótus do Santo Nome. Rejeite a associação de qual-quer ofensor que critique essas escrituras.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enāmera mahimā sarva-śāstrete vākhāne\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eatistuti, hena kabhu nā bhāviha mane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eagastya, ananta, brahmā, śivādi satata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eye nāma-mahimā-gāthā saṅkīrtana-rata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ese nāma-mahimā-sindhu ke pāibe pāra?\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eatistuti bale yei—sei durāchāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003emahimā\u003c/i\u003e–As glórias \u003ci class=\"wbw__term\"\u003enāmera\u003c/i\u003e–do Nome [são] \u003ci class=\"wbw__term\"\u003evākhāne\u003c/i\u003e–proclamadas [em] \u003ci class=\"wbw__term\"\u003esarva\u003c/i\u003e–todas \u003ci class=\"wbw__term\"\u003eśāstrete\u003c/i\u003e–as escrituras. \u003ci class=\"wbw__term\"\u003emane\u003c/i\u003e–Em [sua] mente, \u003ci class=\"wbw__term\"\u003ebhāviha nā\u003c/i\u003e–não pense \u003ci class=\"wbw__term\"\u003ekabhu\u003c/i\u003e–em nenhum momento \u003ci class=\"wbw__term\"\u003ehena\u003c/i\u003e–que [elas são] \u003ci class=\"wbw__term\"\u003eatistuti\u003c/i\u003e–elogios exagerados. \u003ci class=\"wbw__term\"\u003eagastya\u003c/i\u003e–Agastya, \u003ci class=\"wbw__term\"\u003eananta\u003c/i\u003e–Ananta, \u003ci class=\"wbw__term\"\u003ebrahmā\u003c/i\u003e–Brahmā, \u003ci class=\"wbw__term\"\u003eśiva\u003c/i\u003e–Śiva, \u003ci class=\"wbw__term\"\u003eādi\u003c/i\u003e–e outros deuses [são] \u003ci class=\"wbw__term\"\u003esatata\u003c/i\u003e–sempre \u003ci class=\"wbw__term\"\u003erata\u003c/i\u003e–engajados em \u003ci class=\"wbw__term\"\u003esaṅkīrtana\u003c/i\u003e–cantar \u003ci class=\"wbw__term\"\u003egāthā\u003c/i\u003e–narrações \u003ci class=\"wbw__term\"\u003emahimā\u003c/i\u003e–das glórias \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–do Nome. [Então,] \u003ci class=\"wbw__term\"\u003eke\u003c/i\u003e–quem \u003ci class=\"wbw__term\"\u003epāibe\u003c/i\u003e–será apto \u003ci class=\"wbw__term\"\u003epāra\u003c/i\u003e–a atravessar \u003ci class=\"wbw__term\"\u003esindhu\u003c/i\u003e–o oceano \u003ci class=\"wbw__term\"\u003ese ye\u003c/i\u003e–destas \u003ci class=\"wbw__term\"\u003emahimā\u003c/i\u003e–glórias \u003ci class=\"wbw__term\"\u003ese nāma\u003c/i\u003e–do Nome? \u003ci class=\"wbw__term\"\u003esei\u003c/i\u003e–Aquele \u003ci class=\"wbw__term\"\u003eyei\u003c/i\u003e–que \u003ci class=\"wbw__term\"\u003ebale\u003c/i\u003e–considera \u003ci class=\"wbw__term\"\u003eatistuti\u003c/i\u003e–[os] elogios [como sendo] exageros [é] \u003ci class=\"wbw__term\"\u003edurāchāra\u003c/i\u003e–mesquinho.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAs glórias do Nome são proclamadas em todas as escrituras. Nunca considere tais glorificações como elogios exagerados. Agastya, Ananta, Brahmā, Śiva, e assim por diante são sempre dedicados a cantar as glórias do Nome. Quem pode atravessar o oceano dessas glórias? Qualquer pessoa que as considere um exagero é má.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛṣṇa-nāmāvali nitya golokera dhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekalpita, prākṛta, bhāve—aparādhi-jana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekṛṣṇa-nāmāvali\u003c/i\u003e–Os Nomes de Kṛṣṇa [são] \u003ci class=\"wbw__term\"\u003enitya\u003c/i\u003e–a eterna \u003ci class=\"wbw__term\"\u003edhana\u003c/i\u003e–riqueza \u003ci class=\"wbw__term\"\u003egolokera\u003c/i\u003e–de Goloka. \u003ci class=\"wbw__term\"\u003ebhāve\u003c/i\u003e–Aquele que pensa [que Eles são] \u003ci class=\"wbw__term\"\u003ekalpita\u003c/i\u003e–imaginários [ou] \u003ci class=\"wbw__term\"\u003eprākṛta\u003c/i\u003e–mundanos [é] \u003ci class=\"wbw__term\"\u003eaparādhi-jana\u003c/i\u003e–um ofensor.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOs Nomes de Kṛṣṇa são a eterna riqueza de Goloka. Qualquer um que os considere imaginários ou mundanos é um ofensor.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enāme sarva-pāpa-kṣaya sarva-śāstre kaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esārā-dina pāpa kari sei bharasāya—\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eemata durbuddhi yāra sei aparādhī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emāyā-pravañchita, duḥkha bhuñje niravadhi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003esarva\u003c/i\u003e–Todas \u003ci class=\"wbw__term\"\u003eśāstre\u003c/i\u003e–as escrituras \u003ci class=\"wbw__term\"\u003ekaya\u003c/i\u003e–dizem [que] \u003ci class=\"wbw__term\"\u003esarva\u003c/i\u003e–todo \u003ci class=\"wbw__term\"\u003epāpa\u003c/i\u003e–pecado [é] \u003ci class=\"wbw__term\"\u003ekṣaya\u003c/i\u003e–destruído \u003ci class=\"wbw__term\"\u003enāme\u003c/i\u003e–pelo Nome. \u003ci class=\"wbw__term\"\u003esei\u003c/i\u003e–Aquele \u003ci class=\"wbw__term\"\u003eyāra\u003c/i\u003e–que \u003ci class=\"wbw__term\"\u003epāpa\u003c/i\u003e\u003ci class=\"wbw__term\"\u003ekari’\u003c/i\u003e–peca \u003ci class=\"wbw__term\"\u003esārā\u003c/i\u003e–todo \u003ci class=\"wbw__term\"\u003edina\u003c/i\u003e–[o] dia [com] \u003ci class=\"wbw__term\"\u003esei\u003c/i\u003e–esta \u003ci class=\"wbw__term\"\u003ebharasāya\u003c/i\u003e–expectativa, [que tem] \u003ci class=\"wbw__term\"\u003eemata\u003c/i\u003e–tal \u003ci class=\"wbw__term\"\u003edurbuddhi\u003c/i\u003e–mentalidade, [é] \u003ci class=\"wbw__term\"\u003eaparādhī\u003c/i\u003e–um ofensor, [é] \u003ci class=\"wbw__term\"\u003epravañchita\u003c/i\u003e–iludido \u003ci class=\"wbw__term\"\u003emāyā\u003c/i\u003e–por māyā, [e] \u003ci class=\"wbw__term\"\u003ebhuñje\u003c/i\u003e–está sujeito \u003ci class=\"wbw__term\"\u003eduḥkha\u003c/i\u003e–[ao] sofrimento \u003ci class=\"wbw__term\"\u003eniravadhi\u003c/i\u003e–perpétuo.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTodas as escrituras declaram que o Nome destrói todos os pecados. Os ímpios que pecam durante todo o dia com essa expectativa são criminosos. Eles são iludidos por māyā e sofrem perpetuamente.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eatulya śrī-kṛṣṇa-nāma pūrṇa-rasa-nidhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etā̐ra sama nā bhāviha śubha-karma ādi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eatulya\u003c/i\u003e–O incomparável \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–Nome \u003ci class=\"wbw__term\"\u003eśrī-kṛṣṇa\u003c/i\u003e–[de] Śrī Kṛṣṇa [é um] \u003ci class=\"wbw__term\"\u003enidhi\u003c/i\u003e–reservatório \u003ci class=\"wbw__term\"\u003epūrṇa\u003c/i\u003e–cheio \u003ci class=\"wbw__term\"\u003erasa\u003c/i\u003e–de néctar. \u003ci class=\"wbw__term\"\u003ebhāviha nā\u003c/i\u003e–Nunca considere [as] \u003ci class=\"wbw__term\"\u003ekarma\u003c/i\u003e–atividades \u003ci class=\"wbw__term\"\u003eśubha\u003c/i\u003e–auspiciosas \u003ci class=\"wbw__term\"\u003eādi\u003c/i\u003e–tais como votos, renúncia, austeridades, oferendas sacrificiais \u003ci class=\"wbw__term\"\u003esama\u003c/i\u003e–iguais \u003ci class=\"wbw__term\"\u003etā̐ra\u003c/i\u003e–a Ele.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO incomparável Nome de Kṛṣṇa é um reservatório repleto de rasa. O cantar do Nome nunca deve ser equiparado a uma ação mundana piedosa (tal como aderir a votos, praticar renúncia, executar austeridades, fazer oferendas sacrificiais, e assim por diante).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enāme śraddhā-hina-jana—vidhātā vāñchita\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etāre nāma dāne aparādha suniśchita\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ejana\u003c/i\u003e–Pessoas \u003ci class=\"wbw__term\"\u003ehina\u003c/i\u003e–destituídas \u003ci class=\"wbw__term\"\u003eśraddhā\u003c/i\u003e–de fé \u003ci class=\"wbw__term\"\u003enāme\u003c/i\u003e–no Nome [são] \u003ci class=\"wbw__term\"\u003evāñchita\u003c/i\u003e–enganadas \u003ci class=\"wbw__term\"\u003evidhātā\u003c/i\u003e–pela Providência. \u003ci class=\"wbw__term\"\u003edāne\u003c/i\u003e–Dar \u003ci class=\"wbw__term\"\u003etāre\u003c/i\u003e–a elas \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–o Nome [é] \u003ci class=\"wbw__term\"\u003esuniśchita\u003c/i\u003e–certamente \u003ci class=\"wbw__term\"\u003eaparādha\u003c/i\u003e–uma ofensa.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAqueles que não têm fé no Nome têm sido enganados pela Providência. Dar o Nome a eles certamente é uma ofensa.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśuniyāo kṛṣṇa-nāma-māhātmya apāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eye prīti-rahita, sei narādhama chhāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eahaṁtā mamatā yāra antare bāhire\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśuddha kṛṣṇa-nāma tāra kabhu nāhi sphure\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003esei\u003c/i\u003e–Aqueles \u003ci class=\"wbw__term\"\u003eye\u003c/i\u003e–que [são] \u003ci class=\"wbw__term\"\u003erahita\u003c/i\u003e–destituídos \u003ci class=\"wbw__term\"\u003eprīti\u003c/i\u003e–de amor \u003ci class=\"wbw__term\"\u003eśuniyāo\u003c/i\u003e–mesmo após escutar \u003ci class=\"wbw__term\"\u003eapāra\u003c/i\u003e–as ilimitadas \u003ci class=\"wbw__term\"\u003emāhātmya\u003c/i\u003e–glórias \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–do Nome [de] \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–Kṛṣṇa [são] \u003ci class=\"wbw__term\"\u003enara\u003c/i\u003e–almas \u003ci class=\"wbw__term\"\u003echhāra\u003c/i\u003e–deploráveis, \u003ci class=\"wbw__term\"\u003eadhama\u003c/i\u003e–caídas. \u003ci class=\"wbw__term\"\u003eśuddha\u003c/i\u003e–O puro \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–Nome \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–de Kṛṣṇa \u003ci class=\"wbw__term\"\u003ekabhu nahi\u003c/i\u003e–nunca \u003ci class=\"wbw__term\"\u003esphure\u003c/i\u003e–[Se] revela \u003ci class=\"wbw__term\"\u003etāra\u003c/i\u003e–a alguém \u003ci class=\"wbw__term\"\u003eyāra\u003c/i\u003e–que \u003ci class=\"wbw__term\"\u003eantare\u003c/i\u003e–internamente [e] \u003ci class=\"wbw__term\"\u003ebāhire\u003c/i\u003e–externamente [tenha] \u003ci class=\"wbw__term\"\u003eahaṁtā\u003c/i\u003e–egoísmo [e] \u003ci class=\"wbw__term\"\u003emamatā\u003c/i\u003e–possessividade.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAqueles que permanecem desprovidos de amor pelo Nome de Kṛṣṇa, mesmo depois de ouvir Suas glórias ilimitadas, são deploráveis almas caídas. O puro Nome de Kṛṣṇa nunca Se revela àqueles que estão interna e externamente cobertos de egoísmo e possessividade.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eei daśa aparādha kariyā varjana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eye sujana kare harināma saṅkīrtana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eapūrva śrī-kṛṣṇa-prema labhya tāre haya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma-prabhu tāra hṛde nitya vilasaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[O] \u003ci class=\"wbw__term\"\u003eapūrva\u003c/i\u003e–extraordinário \u003ci class=\"wbw__term\"\u003eprema\u003c/i\u003e–amor divino \u003ci class=\"wbw__term\"\u003eśrī-kṛṣṇa\u003c/i\u003e–por Śrī Kṛṣṇa \u003ci class=\"wbw__term\"\u003ehaya\u003c/i\u003e–é \u003ci class=\"wbw__term\"\u003elabhya\u003c/i\u003e–atingido \u003ci class=\"wbw__term\"\u003etāre\u003c/i\u003e–pelas \u003ci class=\"wbw__term\"\u003esujana\u003c/i\u003e–grandes almas \u003ci class=\"wbw__term\"\u003eye\u003c/i\u003e–que \u003ci class=\"wbw__term\"\u003esaṅkīrtana kare\u003c/i\u003e–cantam \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–[O] Nome \u003ci class=\"wbw__ter
