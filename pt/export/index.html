3c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNão encontrando a associação de Śrī Gaurāṅga, que realizou Seus Passatempos com todos esses associados, Narottam Dās chora.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-pralaya-payodhi-jale-dhritavan-asi-vedam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Daśāvatār Stotram \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Jayadev Goswāmī\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epralaya-payodhi-jale dhṛtavān asi vedaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evihita-vahitra-charitram akhedam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-mīna-śarīra jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Hari! Ó Keśava! Ó Senhor do universo! Você assumiu a forma de um peixe! Toda glória a Ti! Facilmente você agiu como um barco e sustentou os Vedas acima das águas da devastação cósmica.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṣitir iha vipulatare tiṣṭhati tava pṛṣṭhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edharaṇi-dharaṇa-kina-chakra-gariṣṭhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-kūrma-śarīra jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Hari! Ó Keśava! Ó Senhor do universo! Você assumiu a forma de uma tartaruga! Toda glória a Ti! Você sustentou o Monte Mandara em cima de suas gigantescas costas e depois ficou embelezado pela cicatriz circular que ali se formou.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evasati daśana-śikhare dharaṇī tava lagnā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśaśini kalaṅka-kaleva nimagnā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-śūkara-rūpa jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Hari! Ó Keśava! Ó Senhor do universo! Você assumiu a forma de um javali! Toda glória a Ti! A Terra se senta fixa na ponta da Sua presa como uma mancha escura sobre a lua.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etava kara-kamala-vare nakham adbhuta-śṛṅgaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edalita-hiraṇyakaśipu-tanu-bhṛṅgam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-narahari-rūpa jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Hari! Ó Keśava! Ó Senhor do universo! Você assumiu uma forma de meio homem, meio leão! Toda glória a Ti! Com Suas espantosamente afiadas unhas de Suas lindas mãos de lótus, Você rasgou o corpo de Hiraṇyakaśipu como se ele fosse uma abelha.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echhalayasi vikramaṇe balim adbhuta-vāmana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epada-nakha-nīra-janita-jana-pāvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-vāmana-rūpa jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Hari! Ó Keśava! Ó Senhor do universo! Você assumiu a forma de um anão! Toda glória a Ti! Na forma de um incrível anão Você enganou Bali Mahārāj com seus passos gigantescos e liberou todas as almas com a água que saiu das unhas de Seus pés.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṣatriya-rudhira-maye jagad-apagata-pāpaṁ snapayasi payasi śamita-bhava-tāpam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-bhṛgupati-rūpa jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Hari! Ó Keśava! Ó Senhor do universo! Você assumiu a forma de protetor dos sábios, Paraśurām! Toda glória a Ti! Você banhou o mundo com o sangue dos kṣatriyas e absolveu todos os pecados e tristezas do mundo.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evitarasi dikṣu raṇe dik-pati-kamanīyaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edaśa-mukha-mauli-baliṁ ramaṇīyam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-rāma-śarīra jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Hari! Ó Keśava! Ó Senhor do universo! Você assumiu a forma de Rāmachandra! Toda glória a Ti! Durante a batalha em Laṅka Você distribuiu a todas as direções a oferenda mais agradável e coroada: as dez cabeças de Rāvaṇ, que eram desejadas pelos guardiões das direções.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evahasi vapuṣi viśade vasanaṁ jaladābhaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehala-hati-bhīti-milita jamunābham\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-haladhara-rūpa jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Hari! Ó Keśava! Ó Senhor do universo! Você assumiu a forma de Balarām! Toda glória a Ti! Em Seu corpo branco Você usa roupas que têm as cores das nuvens e do Rio Yamunā quando este é amedrontado pelo golpe de Seu arado.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enindasi yajña-vidher ahaha śruti-jātaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esadaya-hṛdaya darśita-paśu-ghātam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-buddha-śarīra jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Hari! Ó Keśava! Ó Senhor do universo! Você assumiu a forma de Buddha! Toda glória a Ti! Com Seu coração cheio de compaixão, Você censura as injunções escriturais que sancionam o sacrifício animal.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emlechchha nivaha-nidhane kalayasi karavālaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhūmaketum iva kim api karālam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-kalki-śarīra jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Hari! Ó Keśava! Ó Senhor do universo! Você assumiu a forma de Kalki! Toda glória a Ti! Para destruir os ímpios Você brada sua impressionantemente, assustadora espada em forma de cometa.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-jayadeva-kaver idam uditam udāraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśṛṇu sukha-daṁ śubha-daṁ bhava-sāram\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśava dhṛta-daśa-vidha-rūpa jaya jagadīśa hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Hari! Ó Keśava! Ó Senhor do universo! Você assumiu dez formas diferentes! Toda glória a Ti! Ó leitores, ouçam esta grande, agradável, auspiciosa e extraordinária composição do poeta Śrī Jayadev.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evedān udharate jaganti vahate bhū-golam udbibhrate\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edaityaṁ dārayate baliṁ chhalayate kṣatra-kṣayaṁ kurvate\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epaulastyaṁ jayate halaṁ kalayate kāruṇyam ātanvate\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emlechchhān mūrchchhayate daśākṛti-kṛte kṛṣṇāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tubhyaṁ namaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOfereço minha reverência a Śrī Kṛṣṇa, que assume dez formas e resgata os Vedas, sustenta a Montanha Mandara, levanta a Terra, parte demônios ao meio, engana Bali Mahārāj, mata os kṣatriyas, conquista Rāvaṇ, carrega um arado, mostra compaixão e aniquila os ímpios.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-hari-vasare-hari-kirtana-vidhana\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Harivāsar Gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Vṛndāvan Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī hari-vāsare hari-kīrtana-vidhāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enṛtya ārambhilā prabhu jagatera prāṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNo dia sagrado de Śrī Hari (Ekādaśī), Śrīman Mahāprabhu, a vida e a alma do universo, começou a dançar.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epuṇyavanta śrīvāsa-aṅgane śubhārambha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003euṭhila kīrtana-dhvani gopāla govinda\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCom o início auspicioso do kīrtan no pátio do afortunado Śrīvās, o som do cântico ‘Gopāl!’ ‘Govinda!’ foi aumentando.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emṛdaṅga mandirā bāje śaṅkha karatāla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaṅkīrtana saṅge saba ha-ila miśāla\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOs sons das mṛdaṅgas, dos címbalos, conchas e palmas, todos se combinaram no saṅkīrtan.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebrahmāṇḍe uṭhila dhvani pūriyā ākāśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echaudikera amaṅgala yāya saba nāśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO som do saṅkīrtan surgiu e encheu o céu, destruindo a inauspiciosidade em todas as direções.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echatur-dike śrī hari-maṅgala saṅkīrtana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emadhye nāche jagannātha miśrera nandana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMahāprabhu Viśvambhar, o filho de Jagannāth Miśra, dançou, cercado pelo auspicioso Hari-nām-saṅkīrtan.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esabāra aṅgete śobhe śrī chandana-mālā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eānande nāchaye sabe ha-iye vibholā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTodos estavam decorados com pasta de sândalo e guirlandas, e dançaram, cheios de alegria.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enijānande nāche mahāprabhu viśvambhara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echaraṇera tāli śuni ati manohara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMahāprabhu Viśvambhar dançou no êxtase de Si mesmo. Ouvir o ritmo de Seus pés capturou os corações.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhāvāveśe mālā nāhi rahaye galāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echhiṇḍiyā paḍaye giyā bhakatera gāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEnquanto Ele estava tomado de êxtase, Sua guirlanda não pôde permanecer em Seu pescoço. Enquanto os devotos cantavam, ela se rompeu e caiu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyā̐ra nāmānande śiva vasana nā jāne\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyā̐ra rase nāche śiva se nāche āpane\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNo êxtase de Seu Nome, Śiva esquece suas roupas; em Seu êxtase, Śiva sempre dança. E esse Senhor Supremo, agora dança pessoalmente.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10-11\"\u003e\n\u003ch5\u003e10-11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyā̐ra nāme vālmīki ha-ila tapodhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyā̐ra nāme ajāmila pāila mochana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyā̐ra nāme śravane saṁsāra-bandha ghuche\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehena prabhu avatari kali-yuge nāche\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePor meio deste Nome, Vālmīki se tornou um sábio poderoso, por meio deste Nome, Ajāmil atingiu a liberação. Ao ouvir tal Nome, a escravidão da existência material é destruída. Esse mesmo Senhor descende na Era de Kali, e dança.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12-13\"\u003e\n\u003ch5\u003e12-13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyā̐ra nāma la-i śuka nārada beḍāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esahasra-vadana-prabhu yāra guṇa gāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esarva-mahā-prāyaśchita ye prabhura nāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ese prabhu nāchaye dekhe yata bhāgyavān\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAquele cujo Nome Śukadev e Nārad tomam enquanto viajam, cujas glórias o Anantadev de mil bocas canta, cujo Nome é a forma suprema de expiação, esse Senhor agora dança e lança Seu olhar às almas afortunadas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"14\"\u003e\n\u003ch5\u003e14\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī kṛṣṇa-chaitanya nityānanda-chā̐da jāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evṛndāvana dāsa tachhu pada-yuge gāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAbraçando Śrī Kṛṣṇa Chaitanya e Nityānandachā̐d como sua vida e alma, Vṛndāvan Dās canta as glórias de Seus pés de lótus.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shiuddha-bhakata-charana-renu\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚuddha-bhakata \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśuddha-bhakata-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;charaṇa-reṇu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhajana-anukūla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakata-sevā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;parama-siddhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prema-latikāra mūla\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ereṇu\u003c/i\u003e–A poeira \u003ci class=\"wbw__term\"\u003echaraṇa\u003c/i\u003e–dos pés \u003ci class=\"wbw__term\"\u003ebhakata\u003c/i\u003e–dos devotos \u003ci class=\"wbw__term\"\u003eśuddha\u003c/i\u003e–puros \u003ci class=\"wbw__term\"\u003eanukūla\u003c/i\u003e–[é] favorável \u003ci class=\"wbw__term\"\u003ebhajana\u003c/i\u003e–[à] devoção. \u003ci class=\"wbw__term\"\u003esevā\u003c/i\u003e–Serviço \u003ci class=\"wbw__term\"\u003ebhakata\u003c/i\u003e–aos devotos [é] \u003ci class=\"wbw__term\"\u003eparama\u003c/i\u003e–[a] suprema \u003ci class=\"wbw__term\"\u003esiddhi\u003c/i\u003e–realização, \u003ci class=\"wbw__term\"\u003emūla\u003c/i\u003e–[e] a raiz \u003ci class=\"wbw__term\"\u003elatikāra\u003c/i\u003e–da trepadeira \u003ci class=\"wbw__term\"\u003eprema\u003c/i\u003e–[do] amor divino.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eA poeira dos pés dos devotos puros é favorável à devoção. Servir os devotos é a suprema realização, e a raiz da trepadeira do amor divino.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emādhava-tithi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhakti-jananī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;yatane pālana kari\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-vasati\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vasati bali’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;parama ādare vari\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003epālana kari\u003c/i\u003e–[Eu] observo \u003ci class=\"wbw__term\"\u003eyatane\u003c/i\u003e–com cuidado \u003ci class=\"wbw__term\"\u003emādhava-tithi\u003c/i\u003e–[os] dias sagrados que são especialmente relacionados a Hari, tais como Śrī Harivāsar (Ekādaśī), o dia do aparecimento de Kṛṣṇa, e assim por diante. \u003ci class=\"wbw__term\"\u003ejananī\u003c/i\u003e–[Eles são] a mãe \u003ci class=\"wbw__term\"\u003ebhakti\u003c/i\u003e–da devoção. \u003ci class=\"wbw__term\"\u003eparama\u003c/i\u003e–[Com] grande \u003ci class=\"wbw__term\"\u003eādare\u003c/i\u003e–adoração \u003ci class=\"wbw__term\"\u003ebari (varaṇa kari)\u003c/i\u003e–eu escolho, aceito [a] \u003ci class=\"wbw__term\"\u003evasati (śrī dhāma)\u003c/i\u003e–morada sagrada \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–de Kṛṣṇa \u003ci class=\"wbw__term\"\u003ebali’\u003c/i\u003e–considerando [a] \u003ci class=\"wbw__term\"\u003evasati\u003c/i\u003e–meu lugar de residência.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu observo cuidadosamente os dias sagrados relacionados a Mādhava. Eles são a mãe da devoção. Com grande adoração, abraço a morada de Kṛṣṇa como minha.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaura āmāra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ye-saba sthāne\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;karala bhramaṇa raṅge\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ese-saba sthāna\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;heriba āmi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;praṇayi-bhakata-saṅge\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003esaṅge\u003c/i\u003e–Na companhia \u003ci class=\"wbw__term\"\u003ebhakata\u003c/i\u003e–dos devotos \u003ci class=\"wbw__term\"\u003epraṇayi\u003c/i\u003e–amorosos \u003ci class=\"wbw__term\"\u003eāmi\u003c/i\u003e–eu \u003ci class=\"wbw__term\"\u003eheriba\u003c/i\u003e–irei ver \u003ci class=\"wbw__term\"\u003esaba\u003c/i\u003e–todos \u003ci class=\"wbw__term\"\u003ese\u003c/i\u003e–aqueles \u003ci class=\"wbw__term\"\u003esthāna\u003c/i\u003e–lugares. \u003ci class=\"wbw__term\"\u003esaba\u003c/i\u003e–Todos \u003ci class=\"wbw__term\"\u003esthāne\u003c/i\u003e–os lugares \u003ci class=\"wbw__term\"\u003eye\u003c/i\u003e–que \u003ci class=\"wbw__term\"\u003eāmāra\u003c/i\u003e–meu \u003ci class=\"wbw__term\"\u003egaura\u003c/i\u003e–Gaurasundar \u003ci class=\"wbw__term\"\u003ekarala bhramaṇa\u003c/i\u003e–visitou [durante Seus] \u003ci class=\"wbw__term\"\u003eraṅge (līlāya)\u003c/i\u003e–Passatempos.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNa companhia de devotos amorosos, vejo todos os lugares que meu Gaurasundar visitou durante Seus Passatempos.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emṛdaṅga-vādya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śunite mana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;avasara sadā yāche\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaura-vihita\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kīrtana śuni’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ānande hṛdaya nāche\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003emana\u003c/i\u003e–[Meu] coração \u003ci class=\"wbw__term\"\u003esadā\u003c/i\u003e–sempre \u003ci class=\"wbw__term\"\u003eyāche\u003c/i\u003e–implora \u003ci class=\"wbw__term\"\u003eavasara (suyoga)\u003c/i\u003e–[pela] oportunidade \u003ci class=\"wbw__term\"\u003eśunite\u003c/i\u003e–[de] escutar \u003ci class=\"wbw__term\"\u003evādya\u003c/i\u003e–[o] som \u003ci class=\"wbw__term\"\u003emṛdaṅga\u003c/i\u003e–do tambor de barro. \u003ci class=\"wbw__term\"\u003eśuni’\u003c/i\u003e–Escutando \u003ci class=\"wbw__term\"\u003ekīrtana\u003c/i\u003e–a glorificação musical \u003ci class=\"wbw__term\"\u003evihita (anumata)\u003c/i\u003e–prescrita \u003ci class=\"wbw__term\"\u003egaura\u003c/i\u003e–por Śrī Gaurasundar \u003ci class=\"wbw__term\"\u003ehṛdaya\u003c/i\u003e–[meu] coração \u003ci class=\"wbw__term\"\u003enāche\u003c/i\u003e–dança \u003ci class=\"wbw__term\"\u003eānande\u003c/i\u003e–[de] alegria.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMeu coração sempre implora pela oportunidade de ouvir o som da mṛdaṅga. Ouvir o kīrtan prescrito por Śrī Gaurasundar, faz meu coração dançar de alegria.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyugala-mūrti\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dekhiyā mora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;parama-ānanda haya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprasāda-sevā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;karite haya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sakala prapañcha jaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003edekhiyā\u003c/i\u003e–Vendo [a] \u003ci class=\"wbw__term\"\u003emūrti\u003c/i\u003e–forma de Deidade \u003ci class=\"wbw__term\"\u003eyugala\u003c/i\u003e–do Casal Divino \u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–minha \u003ci class=\"wbw__term\"\u003eparama\u003c/i\u003e–grande \u003ci class=\"wbw__term\"\u003eānanda\u003c/i\u003e–alegria \u003ci class=\"wbw__term\"\u003ehaya\u003c/i\u003e–acontece. \u003ci class=\"wbw__term\"\u003esevā\u003c/i\u003e–[O] serviço \u003ci class=\"wbw__term\"\u003eprasāda\u003c/i\u003e–dos remanentes de oferendas de comidas \u003ci class=\"wbw__term\"\u003ekarite haya\u003c/i\u003e–[quando] acontece \u003ci class=\"wbw__term\"\u003esakala\u003c/i\u003e–tudo \u003ci class=\"wbw__term\"\u003eprapañcha\u003c/i\u003e–material \u003ci class=\"wbw__term\"\u003ejaya\u003c/i\u003e–conquista.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eContemplando a forma de Deidade do Casal Divino, sinto a maior alegria. Ao honrar prasād, eu supero toda a ilusão material.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eye-dina gṛhe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhajana dekhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gṛhete goloka bhāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echaraṇa-sīdhu\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dekhiyā gaṅgā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sukha nā sīmā pāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003edina\u003c/i\u003e–[Nos] dias \u003ci class=\"wbw__term\"\u003eye\u003c/i\u003e–[em] que \u003ci class=\"wbw__term\"\u003edekhi\u003c/i\u003e–eu vejo \u003ci class=\"wbw__term\"\u003ebhajana\u003c/i\u003e–o serviço devocional \u003ci class=\"wbw__term\"\u003egṛhe\u003c/i\u003e–em casa \u003ci class=\"wbw__term\"\u003ebhāya\u003c/i\u003e–experimento \u003ci class=\"wbw__term\"\u003egoloka\u003c/i\u003e–a morada espiritual de Kṛṣṇa \u003ci class=\"wbw__term\"\u003egṛhete\u003c/i\u003e–dentro de casa. \u003ci class=\"wbw__term\"\u003edekhiyā\u003c/i\u003e–Vendo \u003ci class=\"wbw__term\"\u003egaṅgā\u003c/i\u003e–o Rio Ganges, \u003ci class=\"wbw__term\"\u003echaraṇa-sīdhu (śrī-charaṇāmṛta)\u003c/i\u003e–o néctar dos pés do Senhor, [minha] \u003ci class=\"wbw__term\"\u003esukha\u003c/i\u003e–felicidade \u003ci class=\"wbw__term\"\u003enā\u003c/i\u003e–não \u003ci class=\"wbw__term\"\u003epāya\u003c/i\u003e–tem \u003ci class=\"wbw__term\"\u003esīmā\u003c/i\u003e–limite.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNos dias em que vejo o serviço devocional acontecendo em minha casa, eu sinto que Goloka se manifestou lá. Vendo o Ganges, o néctar dos pés do Senhor, minha felicidade não tem limites.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etulasī dekhi’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;juḍāya prāṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mādhava-toṣaṇī jāni’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaura-priya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śāka-sevane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jīvana sārthaka māni\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003edekhi’\u003c/i\u003e–Vendo \u003ci class=\"wbw__term\"\u003etulasī\u003c/i\u003e–a planta mais querida de Kṛṣṇa \u003ci class=\"wbw__term\"\u003ejuḍāya\u003c/i\u003e–alivia \u003ci class=\"wbw__term\"\u003eprāṇa\u003c/i\u003e–meu coração \u003ci class=\"wbw__term\"\u003ejāni’\u003c/i\u003e–sabendo [que ela é] \u003ci class=\"wbw__term\"\u003emādhava-toṣaṇī (Gaura-kṛṣṇa-priyā)\u003c/i\u003e–agradável a Mādhava (agradável a Śrī Gaura Kṛṣṇa). \u003ci class=\"wbw__term\"\u003esevane\u003c/i\u003e–Ao servir \u003ci class=\"wbw__term\"\u003eśāka\u003c/i\u003e–preparações de folhas verdes \u003ci class=\"wbw__term\"\u003epriya\u003c/i\u003e–a querida, favorita \u003ci class=\"wbw__term\"\u003egaura\u003c/i\u003e–de Śrī Gaurasundar, \u003ci class=\"wbw__term\"\u003emāni\u003c/i\u003e–eu considero \u003ci class=\"wbw__term\"\u003ejīvana\u003c/i\u003e–minha vida \u003ci class=\"wbw__term\"\u003esārthaka\u003c/i\u003e\u003ci class=\"wbw__term\"\u003e(saphala)\u003c/i\u003e–bem-sucedida.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVer Tulasī Devī acalma minha alma, pois sei que ela agrada Mādhava. Ao honrar śāk, o prato favorito de Śrī Gaurasundar, eu considero minha vida bem-sucedida.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakativinoda\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛṣṇa-bhajane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;anukūla pāya yāhā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprati-divase\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;parama-sukhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;svīkāra karaye tāhā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eyāhā\u003c/i\u003e–O que seja [que] \u003ci class=\"wbw__term\"\u003ebhakati-vinoda\u003c/i\u003e–Bhakti Vinod \u003ci class=\"wbw__term\"\u003epāya\u003c/i\u003e–obtém \u003ci class=\"wbw__term\"\u003eanukūla\u003c/i\u003e–de favorável \u003ci class=\"wbw__term\"\u003ebhajane\u003c/i\u003e–ao serviço \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–a Kṛṣṇa \u003ci class=\"wbw__term\"\u003esvīkāra\u003c/i\u003e–[Ele] aceita \u003ci class=\"wbw__term\"\u003ekaraye\u003c/i\u003e–fazer \u003ci class=\"wbw__term\"\u003etāhā\u003c/i\u003e–isso \u003ci class=\"wbw__term\"\u003eprati\u003c/i\u003e–todos \u003ci class=\"wbw__term\"\u003edivase\u003c/i\u003e–[os] dias [com] \u003ci class=\"wbw__term\"\u003eparama\u003c/i\u003e–grande \u003ci class=\"wbw__term\"\u003esukhe\u003c/i\u003e–felicidade.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO que quer que Bhakti Vinod obtenha de favorável ao serviço de Kṛṣṇa, ele aceita todos os dias com a maior alegria.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-nagara-bhramiya-amara-gaura-elo-ghore\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eDepois de parikramā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enagara bhramiyā āmāra gaura ela ghare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaura ela ghare āmāra nitāi ela ghare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhūlā jhāri’ śachīmātā gaura kole kare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eānandete bhakta-gaṇe hari hari bale\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDepois de andar pela cidade, meu Gaurāṅga veio para casa! Meu Gaurāṅga e meu Nitāi vieram para casa! Após limpá-Lo da poeira, Śachī Mātā abraça Gaurāṅga! Com alegria os devotos cantam: “Hari! Hari!”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-radhe-jaya-jaya-madhava-dayite\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Rādhikā-stava \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Rūpa Goswāmī Prabhu\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erādhe jaya jaya mādhava-dayite\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egokula-taruṇī-maṇḍala-mahite\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Rādhā! Ó amada de Mādhava! Ó heroína das garotas de Gokula! Toda glória a Ti! Toda glória a Ti!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edāmodara-rati-vardhana-veśe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehari-niṣkuṭa-vṛndā-vipineśe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Ela que se veste para aumentar o apego de Dāmodar! Ó Rainha dos bosques de prazer de Hari em Vṛndāvan!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evṛṣabhānūdadhi-nava-śaśi-lekhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elalitā-sakhi guṇa-ramita-viśākhe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ lua nova que surgiu do oceano do Rei Vṛṣabhānu! Ó amiga de Lalitā! Ó encantadora de Viśākhā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekaruṇāṁ kuru mayi karuṇā-bharite\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esanaka-sanātana-varṇita-charite\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSede misericordiosa comigo, ó Tu que és cheia de misericórdia! Ela cuja glória é cantada por Sanaka e Sanātan!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-namamishvaram-sachchidananda-rupam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śrī Dāmodarāṣtakam \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eSatyavrata Muni\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enamāmīśvaraṁ sachchidānanda-rūpaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elasat-kuṇḍalaṁ gokule bhrājamānam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyaśodā-bhiyolūkhalād dhāvamānaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eparāmṛṣṭam atyantato drutya gopyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003enamāmi\u003c/i\u003e–Eu ofereço minha reverência \u003ci class=\"wbw__term\"\u003eīśvaraṁ\u003c/i\u003e–ao Senhor Supremo, \u003ci class=\"wbw__term\"\u003erūpaṁ\u003c/i\u003e–a personificação \u003ci class=\"wbw__term\"\u003esat\u003c/i\u003e–do eterno \u003ci class=\"wbw__term\"\u003eānanda\u003c/i\u003e–êxtase \u003ci class=\"wbw__term\"\u003echit\u003c/i\u003e–espiritual [cujos] \u003ci class=\"wbw__term\"\u003ekuṇḍalaṁ\u003c/i\u003e–brincos \u003ci class=\"wbw__term\"\u003elasat\u003c/i\u003e–balançam [quando] \u003ci class=\"wbw__term\"\u003ebhrājamānam\u003c/i\u003e–Ele brilha \u003ci class=\"wbw__term\"\u003egokule\u003c/i\u003e–em Gokula. \u003ci class=\"wbw__term\"\u003ebhiyā\u003c/i\u003e–Com medo \u003ci class=\"wbw__term\"\u003eyaśodā\u003c/i\u003e–de Yaśodā [Ele] \u003ci class=\"wbw__term\"\u003edhāvamānaṁ\u003c/i\u003e–corre \u003ci class=\"wbw__term\"\u003eulūkhalāt\u003c/i\u003e–do pilão de madeira [mas é] \u003ci class=\"wbw__term\"\u003eāmṛṣṭam\u003c/i\u003e–pego \u003ci class=\"wbw__term\"\u003eparā\u003c/i\u003e–por trás \u003ci class=\"wbw__term\"\u003egopyā\u003c/i\u003e–pela vaqueira [que] \u003ci class=\"wbw__term\"\u003edrutya\u003c/i\u003e–correu \u003ci class=\"wbw__term\"\u003eatyantataḥ\u003c/i\u003e–mais rápido [que Ele]\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu ofereço minha reverência ao Senhor Supremo, a personificação do eterno êxtase espiritual. Seus brincos balançam conforme Ele brilha em Gokula. Com medo de Mãe Yaśodā, Ele corre do pilão de madeira, mas é pego por trás por ela, que correu mais rápido que Ele.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erudantaṁ muhur netra-yugmaṁ mṛjantaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekarāmbhoja-yugmena sātaṅka-netram\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emuhuḥ śvāsa-kampa-trirekhāṅka-kaṇṭha-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esthita-graiva-dāmodaraṁ bhakti-baddham\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Quem] \u003ci class=\"wbw__term\"\u003erudantaṁ\u003c/i\u003e–chora [e] \u003ci class=\"wbw__term\"\u003emuhuḥ\u003c/i\u003e–repetidamente \u003ci class=\"wbw__term\"\u003emṛjantaṁ\u003c/i\u003e–esfrega [Seus] \u003ci class=\"wbw__term\"\u003enetra-yugmaṁ\u003c/i\u003e–olhos [com Suas] \u003ci class=\"wbw__term\"\u003eyugmena\u003c/i\u003e–mãos \u003ci class=\"wbw__term\"\u003eambhoja\u003c/i\u003e–de lótus [cujos] \u003ci class=\"wbw__term\"\u003ekara netram\u003c/i\u003e–olhos [estão] \u003ci class=\"wbw__term\"\u003esa ātaṅka\u003c/i\u003e–amedrontados, [Ele] \u003ci class=\"wbw__term\"\u003eśvāsa\u003c/i\u003e–suspira \u003ci class=\"wbw__term\"\u003emuhuḥ\u003c/i\u003e–repetidamente [e] \u003ci class=\"wbw__term\"\u003egraiva\u003c/i\u003e–o colar \u003ci class=\"wbw__term\"\u003esthita\u003c/i\u003e–situado \u003ci class=\"wbw__term\"\u003ekaṇṭha\u003c/i\u003e–em [Seu] pescoço [que é] \u003ci class=\"wbw__term\"\u003eaṅka\u003c/i\u003e–marcado \u003ci class=\"wbw__term\"\u003etri\u003c/i\u003e–por três \u003ci class=\"wbw__term\"\u003erekhā\u003c/i\u003e–linhas \u003ci class=\"wbw__term\"\u003ekampa\u003c/i\u003e–treme [e quem, com] \u003ci class=\"wbw__term\"\u003edāma\u003c/i\u003e–a corda [em volta de Sua] \u003ci class=\"wbw__term\"\u003eudaraṁ\u003c/i\u003e–cintura, [é] \u003ci class=\"wbw__term\"\u003ebaddham\u003c/i\u003e–atado \u003ci class=\"wbw__term\"\u003ebhakti\u003c/i\u003e–pela devoção.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle chora e repetidamente esfrega Seus olhos com Suas mãos de lótus. Seus olhos estão cheios de medo. Ele suspira e o colar em volta de Seu pescoço, que é marcado por três linhas, balança. Com uma corda em volta de Sua cintura, Ele é atado pela devoção.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eitīdṛk sva-līlābhir ānanda-kuṇḍe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esva-ghoṣaṁ nimajjantam ākhyāpayantaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etadīyeṣita-jñeṣu bhaktair jitatvaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epunaḥ prematas taṁ śatāvṛtti vande\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eīdṛk\u003c/i\u003e–Em tais \u003ci class=\"wbw__term\"\u003esva-līlābhiḥ\u003c/i\u003e–Passatempos Seus \u003ci class=\"wbw__term\"\u003eiti\u003c/i\u003e–como este \u003ci class=\"wbw__term\"\u003enimajjantam\u003c/i\u003e–Ele submerge \u003ci class=\"wbw__term\"\u003esva-ghoṣaṁ\u003c/i\u003e–Seus amigos \u003ci class=\"wbw__term\"\u003ekuṇḍe\u003c/i\u003e–em um poço \u003ci class=\"wbw__term\"\u003eānanda\u003c/i\u003e–de êxtase [e] \u003ci class=\"wbw__term\"\u003eākhyāpayantaṁ\u003c/i\u003e–proclama \u003ci class=\"wbw__term\"\u003ejñeṣu\u003c/i\u003e–para aquele que sabem [apenas] \u003ci class=\"wbw__term\"\u003etadīya\u003c/i\u003e–de Sua \u003ci class=\"wbw__term\"\u003eīṣita\u003c/i\u003e–majestade [que Ele é] \u003ci class=\"wbw__term\"\u003eitatvaṁ\u003c/i\u003e–conquistado \u003ci class=\"wbw__term\"\u003ebhaktaiḥ\u003c/i\u003e–pela devoção. \u003ci class=\"wbw__term\"\u003epremataḥ\u003c/i\u003e–Por amor, \u003ci class=\"wbw__term\"\u003evande\u003c/i\u003e–Eu ofereço minha reverência \u003ci class=\"wbw__term\"\u003etaṁ\u003c/i\u003e–a Ele \u003ci class=\"wbw__term\"\u003eśata\u003c/i\u003e–centenas [e] \u003ci class=\"wbw__term\"\u003epunaḥ\u003c/i\u003e–centenas \u003ci class=\"wbw__term\"\u003eāvṛtti\u003c/i\u003e–de vezes.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNestes Passatempos, Ele submerge Seus companheiros em um poço de êxtase e proclama para aqueles que conhecem apenas a Sua Majestade que Ele é conquistado por devoção. Por amor, eu ofereço a minha reverência a Ele centenas e centenas de vezes.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evaraṁ deva mokṣaṁ na mokṣāvadhiṁ vā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ena chānyaṁ vṛṇe ’haṁ vareśād apīha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eidan te vapur nātha gopāla-bālaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esadā me manasy āvirāstāṁ kim anyaiḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003edeva\u003c/i\u003e–Ó Senhor! \u003ci class=\"wbw__term\"\u003eahaṁ\u003c/i\u003e–Eu \u003ci class=\"wbw__term\"\u003ena\u003c/i\u003e–não \u003ci class=\"wbw__term\"\u003evṛṇe\u003c/i\u003e–desejo \u003ci class=\"wbw__term\"\u003evaraṁ\u003c/i\u003e–a benção \u003ci class=\"wbw__term\"\u003emokṣaṁ\u003c/i\u003e–da liberação \u003ci class=\"wbw__term\"\u003ena\u003c/i\u003e–nem \u003ci class=\"wbw__term\"\u003eavadhiṁ\u003c/i\u003e–a forma mais alta \u003ci class=\"wbw__term\"\u003emokṣa\u003c/i\u003e–de liberação \u003ci class=\"wbw__term\"\u003evānem cha anyaṁ\u003c/i\u003e–qualquer outra [benção de Você] \u003ci class=\"wbw__term\"\u003eiha\u003c/i\u003e–aqui (em Vṛndāvan) \u003ci class=\"wbw__term\"\u003eapi\u003c/i\u003e–apesar [de Você ser] \u003ci class=\"wbw__term\"\u003eīśāt\u003c/i\u003e–o controlador \u003ci class=\"wbw__term\"\u003evara\u003c/i\u003e–de [todas] as bênçãos \u003ci class=\"wbw__term\"\u003enātha\u003c/i\u003e–Ó Senhor! [que] \u003ci class=\"wbw__term\"\u003eidam\u003c/i\u003e–esta \u003ci class=\"wbw__term\"\u003ete\u003c/i\u003e–Sua \u003ci class=\"wbw__term\"\u003evapuḥ\u003c/i\u003e–forma [de] \u003ci class=\"wbw__term\"\u003ebālaṁ\u003c/i\u003e–menino \u003ci class=\"wbw__term\"\u003egopāla\u003c/i\u003e–vaqueiro \u003ci class=\"wbw__term\"\u003esadā\u003c/i\u003e–sempre \u003ci class=\"wbw__term\"\u003eāvirāstāṁ\u003c/i\u003e–se manifeste [em] \u003ci class=\"wbw__term\"\u003eme\u003c/i\u003e–meu \u003ci class=\"wbw__term\"\u003emanasi\u003c/i\u003e–coração. \u003ci class=\"wbw__term\"\u003ekim\u003c/i\u003e–Que \u003ci class=\"wbw__term\"\u003eanyaiḥ\u003c/i\u003e–[outra coisa] mais?\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Senhor! Eu não desejo nem a dádiva da liberação, ou a mais alta forma de liberação (residência em Vaikuṇṭha), nem qual-quer outra coisa de Você aqui, embora Você seja o outorgador de todas as dádivas. Ó Senhor! Que Sua forma de vaqueirinho sempre se manifeste em meu coração. Qual outra necessidade pode haver?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eidan te mukhāmbhojam avyakta-nīlair\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evṛtaṁ kuntalaiḥ snigdha-raktaiś cha gopyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emuhuś chumbitaṁ bimba-raktādharaṁ me\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emanasy āvirāstām alaṁ lakṣa-lābhaiḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Que Seus] \u003ci class=\"wbw__term\"\u003eadharaṁ\u003c/i\u003e–lábios \u003ci class=\"wbw__term\"\u003erakta\u003c/i\u003e–vermelhos \u003ci class=\"wbw__term\"\u003ebimba\u003c/i\u003e–fruta bimba [e] \u003ci class=\"wbw__term\"\u003eidam\u003c/i\u003e–este \u003ci class=\"wbw__term\"\u003emukha\u003c/i\u003e–rosto [de] \u003ci class=\"wbw__term\"\u003eambhojam\u003c/i\u003e–lótus \u003ci class=\"wbw__term\"\u003ete\u003c/i\u003e–Seu, [que é] \u003ci class=\"wbw__term\"\u003evṛtaṁ\u003c/i\u003e–moldado \u003ci class=\"wbw__term\"\u003ekuntalaiḥ\u003c/i\u003e–pelo cabelo [que é] \u003ci class=\"wbw__term\"\u003esnigdha\u003c/i\u003e–brilhante, \u003ci class=\"wbw__term\"\u003enīlaiḥ\u003c/i\u003e–azul \u003ci class=\"wbw__term\"\u003eavyakta\u003c/i\u003e–escuro [e] \u003ci class=\"wbw__term\"\u003eraktaiḥ\u003c/i\u003e–avermelhado, \u003ci class=\"wbw__term\"\u003echa\u003c/i\u003e–e [que é] \u003ci class=\"wbw__term\"\u003emuhuḥ\u003c/i\u003e–repetidamente \u003ci class=\"wbw__term\"\u003echumbitaṁ\u003c/i\u003e–beijado \u003ci class=\"wbw__term\"\u003egopyā\u003c/i\u003e–pela vaqueira \u003ci class=\"wbw__term\"\u003eāvirāstām\u003c/i\u003e–se manifeste [em] \u003ci class=\"wbw__term\"\u003eme\u003c/i\u003e–meu \u003ci class=\"wbw__term\"\u003emanasi\u003c/i\u003e–coração. \u003ci class=\"wbw__term\"\u003elakṣa\u003c/i\u003e–Centenas de milhares \u003ci class=\"wbw__term\"\u003elābhaiḥ\u003c/i\u003e–de [outras] dádivas \u003ci class=\"wbw__term\"\u003ealaṁ\u003c/i\u003e–desnecessárias.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQue os Seus brilhantes lábios vermelhos e Seu rosto de lótus, que é repetidamente beijado por Mãe Yaśodā e moldado por Seus cachos brilhantes, azul-escuros, e avermelhados, se manifeste dentro do meu coração. Milhares de outras dádivas são sem sentido para mim.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enamo deva dāmodarānanta viṣṇo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprasīda prabho duḥkha-jālābdhi-magnaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛpā-dṛṣṭi-vṛṣṭyātidīnaṁ batānu-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egṛhāṇeśa mām ajñam edhy akṣi-dṛśyaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Minha] \u003ci class=\"wbw__term\"\u003enamaḥ\u003c/i\u003e–reverência [a Você,] \u003ci class=\"wbw__term\"\u003eananta\u003c/i\u003e–Ó infinito \u003ci class=\"wbw__term\"\u003eviṣṇo\u003c/i\u003e–todo-penetrante \u003ci class=\"wbw__term\"\u003edeva\u003c/i\u003e–Senhor, [cuja] \u003ci class=\"wbw__term\"\u003eudara\u003c/i\u003e–barriga [é amarrada] \u003ci class=\"wbw__term\"\u003edāma\u003c/i\u003e–por uma corda. \u003ci class=\"wbw__term\"\u003eprasīda\u003c/i\u003e–Seja satisfeito \u003ci class=\"wbw__term\"\u003eprabho\u003c/i\u003e–Ó Mestre! [Eu estou] \u003ci class=\"wbw__term\"\u003emagnaṁ\u003c/i\u003e–submerso \u003ci class=\"wbw__term\"\u003eabdhi\u003c/i\u003e–no oceano \u003ci class=\"wbw__term\"\u003ejāla\u003c/i\u003e–da ilusória \u003ci class=\"wbw__term\"\u003eduḥkha\u003c/i\u003e–tristeza. \u003ci class=\"wbw__term\"\u003ebata\u003c/i\u003e–Oh! \u003ci class=\"wbw__term\"\u003eanugṛhāṇa\u003c/i\u003e–Por favor agracie \u003ci class=\"wbw__term\"\u003emām\u003c/i\u003e–me, [que sou] \u003ci class=\"wbw__term\"\u003eatidīnaṁ\u003c/i\u003e–muito pobre [e] \u003ci class=\"wbw__term\"\u003eajñam\u003c/i\u003e–ignorante, \u003ci class=\"wbw__term\"\u003evṛṣṭyā\u003c/i\u003e–com a chuva \u003ci class=\"wbw__term\"\u003ekṛpā\u003c/i\u003e–de [Seu] misericordioso \u003ci class=\"wbw__term\"\u003edṛṣṭi\u003c/i\u003e–olhar. \u003ci class=\"wbw__term\"\u003eīśa\u003c/i\u003e–Ó Senhor \u003ci class=\"wbw__term\"\u003eedhi\u003c/i\u003e–por favor se torne \u003ci class=\"wbw__term\"\u003edṛśyaḥ\u003c/i\u003e–visível \u003ci class=\"wbw__term\"\u003eakṣi\u003c/i\u003e–aos [meus] olhos.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMinha reverência a ti, ó infinito, todo-penetrante Senhor cuja barriga está amarrada com uma corda! Seja satisfeito, Ó Mestre! Estou mergulhado em um oceano de tristeza. Oh! Por favor me agracie, uma alma tão pobre e ignorante, com a chuva de Seu olhar misericordioso. Ó Senhor, por favor, apareça diante dos meus olhos.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekuverātmajau baddha-mūrtyaiva yadvat\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etvayā mochitau bhakti-bhājau kṛtau cha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etathā prema-bhaktiṁ svakāṁ me prayachchha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ena mokṣe graho me ’sti dāmodareha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eyadvat\u003c/i\u003e–Como \u003ci class=\"wbw__term\"\u003eātmajau\u003c/i\u003e–os filhos \u003ci class=\"wbw__term\"\u003ekuvera\u003c/i\u003e–de Kuvera [foram] \u003ci class=\"wbw__term\"\u003emochitau\u003c/i\u003e–liberados \u003ci class=\"wbw__term\"\u003echa\u003c/i\u003e–e \u003ci class=\"wbw__term\"\u003ekṛtau\u003c/i\u003e–feitos \u003ci class=\"wbw__term\"\u003ebhājau\u003c/i\u003e–recipientes \u003ci class=\"wbw__term\"\u003ebhakti\u003c/i\u003e–de devoção \u003ci class=\"wbw__term\"\u003etvayā\u003c/i\u003e–por Você \u003ci class=\"wbw__term\"\u003eeva\u003c/i\u003e–mesmo enquanto [Sua] \u003ci class=\"wbw__term\"\u003emūrtyā\u003c/i\u003e–forma [estava] \u003ci class=\"wbw__term\"\u003ebaddha\u003c/i\u003e–atada, \u003ci class=\"wbw__term\"\u003etathā\u003c/i\u003e–então \u003ci class=\"wbw__term\"\u003eprayachchha\u003c/i\u003e–por favor dê \u003ci class=\"wbw__term\"\u003eme\u003c/i\u003e–me \u003ci class=\"wbw__term\"\u003esvakāṁ\u003c/i\u003e–Sua \u003ci class=\"wbw__term\"\u003eprema\u003c/i\u003e–amorosa \u003ci class=\"wbw__term\"\u003ebhaktiṁ\u003c/i\u003e–devoção. \u003ci class=\"wbw__term\"\u003eiha\u003c/i\u003e–A respeito disso, \u003ci class=\"wbw__term\"\u003ena\u003c/i\u003e–não \u003ci class=\"wbw__term\"\u003easti me\u003c/i\u003e–tenho \u003ci class=\"wbw__term\"\u003egrahaḥ\u003c/i\u003e–interesse \u003ci class=\"wbw__term\"\u003emokṣe\u003c/i\u003e–na liberação. \u003ci class=\"wbw__term\"\u003edāmodara\u003c/i\u003e–Ó Senhor cuja barriga está amarrada por uma corda!\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVocê liberou e deu devoção aos dois filhos de Kuvera mesmo com seu corpo preso (por Mae Yaśodā), então por favor me dê devoção amorosa a Você. Aqui, não tenho interesse em liberação, Ó Senhor cuja barriga está amarrada com uma corda!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enamas te ’stu dāmne sphurad-dīpti-dhāmne\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etvadīyodarāyātha viśvasya dhāmne\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enamo rādhikāyai tvadīya-priyāyai\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enamo ’nanta-līlāya devāya tubhyam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Deixe minha] \u003ci class=\"wbw__term\"\u003enamaḥ\u003c/i\u003e–reverência \u003ci class=\"wbw__term\"\u003ete\u003c/i\u003e–a Você \u003ci class=\"wbw__term\"\u003eastu\u003c/i\u003e–ser, \u003ci class=\"wbw__term\"\u003edāmne\u003c/i\u003e–à corda [que é] \u003ci class=\"wbw__term\"\u003esphurat\u003c/i\u003e–uma esplendorosa \u003ci class=\"wbw__term\"\u003edīpti\u003c/i\u003e–brilhante \u003ci class=\"wbw__term\"\u003edhāmne\u003c/i\u003e–morada, [e] \u003ci class=\"wbw__term\"\u003eatha\u003c/i\u003e–então [à] \u003ci class=\"wbw__term\"\u003etvadīya\u003c/i\u003e–Sua \u003ci class=\"wbw__term\"\u003eudarāya\u003c/i\u003e–barriga, \u003ci class=\"wbw__term\"\u003edhāmne\u003c/i\u003e–o abrigo \u003ci class=\"wbw__term\"\u003eviśvasya\u003c/i\u003e–do universo. [Minha] \u003ci class=\"wbw__term\"\u003enamaḥ\u003c/i\u003e–reverência \u003ci class=\"wbw__term\"\u003erādhikāyai\u003c/i\u003e–a Rādhikā, \u003ci class=\"wbw__term\"\u003etvadīya\u003c/i\u003e–Sua \u003ci class=\"wbw__term\"\u003epriyāyai\u003c/i\u003e–amada, [e minha] \u003ci class=\"wbw__term\"\u003enamaḥ\u003c/i\u003e–reverência \u003ci class=\"wbw__term\"\u003etubhyam\u003c/i\u003e–A Você \u003ci class=\"wbw__term\"\u003edevāya\u003c/i\u003e–ao Senhor \u003ci class=\"wbw__term\"\u003elīlāya\u003c/i\u003e–cujos Passatempos [são] \u003ci class=\"wbw__term\"\u003eananta\u003c/i\u003e–infinitos.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDeixe-me oferecer minha reverência à brilhante e esplendorosa corda (na qual Você está preso) e depois à sua barriga, que é o abrigo do universo. Deixe-me oferecer minha reverência a Rādhikā, Sua amada, e deixe-me oferecer minha reverência a Ti, ó Senhor, cujos Passatempos são infinitos.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hari-haraye-namah-krishna-yadavaya-namah\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eNām-saṅkīrtan \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari haraye namaḥ kṛṣṇa yādavāya namaḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyādavāya mādhavāya keśavāya namaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Senhor, Kṛṣṇa, Yādava, Hari, Mādhava, Keśava, repetidamente ofereço minha reverência a Ti.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egopāla govinda rāma śrī madhusūdana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egiridhārī gopīnātha madana-mohana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória a Gopāl, Govinda, Rām, Śrī Madhusūdan, Giridhārī, Gopīnāth, Madan Mohan!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-chaitanya nityānanda śrī advaitachandra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egadādhara śrīvāsādi gaura-bhakta-vṛnda\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória a Śrī Chaitanya, Nityānanda, Advaitachandra, Gadādhar, Śrivās e todos os devotos do Senhor!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya rūpa sanātana bhaṭṭa raghunātha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-jīva gopāla-bhaṭṭa dāsa raghunātha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória a Śrī Rūpa, Sanātan, Raghunāth Bhaṭṭa, Śrī Jīva, Gopāl Bhaṭṭa e Raghunāth Dās!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eei chhaya gosāñi kari charaṇa vandana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyāhā haite vighna-nāśa abhīṣṭa-pūraṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOfereço minha reverência a esses seis goswāmīs. Ao fazê-lo, todos os obstáculos são destruídos e todos os desejos são realizados.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eei chhaya gosāñi yā̐ra mu̐i tā̐ra dāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etā̐-sabāra pada-reṇu mora pañcha-grāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu sou um servo desses seis goswāmīs. A poeira de seus pés são minhas cinco formas de alimento.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etā̐dera charaṇa sevi bhakta sane vāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaname janame mora ei abhilāṣa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eViver com os devotos que servem os pés deles é o meu desejo, nascimento após nascimento.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eei chhaya gosāñi yabe vraje kailā vāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhā-kṛṣṇa-nitya-līlā karilā prakāśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando esses seis goswāmīs viveram em Vraja, eles revelaram os Passatempos eternos de Rādhā–Kṛṣṇa.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eānande bala hari bhaja vṛndāvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-guru-vaiṣṇava-pade majāiyā mana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCante alegremente: ‘Hari!’, e adore Vṛndāvan, meditando nos pés de Śrī Guru e dos Vaiṣṇavas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-guru-vaiṣṇava-pāda-padma kari āśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(hari) nāma-saṅkīrtana kahe narottama dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAspirando aos pés de lótus de Śrī Guru e dos Vaiṣṇavas, Narottam Dās canta o Santo Nome.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eAntes de se honrar prasādam\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-mahaprasade-govinde-nama-brahmani\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eMahāprasāda \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emahāprasāde govinde nāma-brahmaṇi vaiṣṇave\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esvalpa-puṇya-vatāṁ rājan viśvāso naiva yāyate\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Ó rei, aquele cuja fortuna é escassa nunca desenvolve fé em mahāprasād, em Govinda, no Santo Nome, ou nos Vaiṣṇavas.”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-bhai-re-shorira-avidya-jal-jodendriya-tahe-kal\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Prasāda-sevāya Gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhāi re!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśarīra avidyā-jāla\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jaḍendriya tāhe kāla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jīve phele viṣaya-sāgare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etā’ra madhye jihvā ati\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;lobhamaya sudurmati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tā’ke jetā kaṭhina saṁsāre\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“O corpo é uma rede de ilusões, e os sentidos materiais são nossos inimigos; eles jogam a alma no oceano da mundanidade. Entre os sentidos, a língua é a mais voraz e perversa. É muito difícil conquistar a língua neste mundo.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛṣṇa baḍa dayāmaya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;karibāre jihvā jaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sva-prasād-anna dila bhāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esei annāmṛta pāo\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rādhā-kṛṣṇa-guṇa gāo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;preme ḍāka chaitanya-nitāi\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"translation\"\u003e“Ó irmãos! Kṛṣṇa é muito misericordioso: para conquistar a língua Ele nos deu Seus remanescentes! Aceite este alimento nectáreo, cante as glórias de Rādhā–Kṛṣṇa, e com amor chame: ‘Chaitanya! Nitāi!’”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(preme bhare ḍāka re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(dayāl nitāi chaitanya bale preme bhare ḍāka re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(nitāi gaura haribol!)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Chame com amor! Chame com amor: ‘Dayāl Nitāi Chaitanya! Nitāi! Gaura! Hari!’”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"first-lines\" id=\"first-lines\"\u003e\n\u003ch1\u003eÍndice\u003c/h1\u003e\n\u003ch2 class=\"first-line-group\"\u003eA\u003c/h2\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-akrodha-paramananda\"\u003eakrodha paramānanda\u003cspan class=\"page-num\"\u003e — 73\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-anadi-karama-phole\"\u003eanādi karama-phale\u003cspan class=\"page-num\"\u003e — 144\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-aparadha-phole-mama\"\u003eaparādha-phale mama\u003cspan class=\"page-num\"\u003e — 146\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-avatara-sara-gora-avatara\"\u003eavatāra sāra\u003cspan class=\"page-num\"\u003e — 85\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch2 class=\"first-line-group\"\u003eĀ\u003c/h2\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-amara-jivana-sada-pape-rata\"\u003eāmāra jīvana\u003cspan class=\"page-num\"\u003e — 108\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-atma-nivedana-tuya-pade-kori\"\u003eātma-nivedana\u003cspan class=\"page-num\"\u003e — 115\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch2 class=\"first-line-group\"\u003eB\u003c/h2\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-bondhu-gon-shiunoho-vachana-mora\"\u003e(bandhu-gaṇa) śunaha vachana\u003cspan class=\"page-num\"\u003e — 153\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-bhai-re-shorira-avidya-jal-jodendriya-tahe-kal\"\u003ebhāi re! śarīra avidyā-jāla jaḍendriya tāhe kāla\u003cspan class=\"page-num\"\u003e — 230\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-bhaja-bhakata-vatsala-shri-gaurahari\"\u003ebhaja bhakata-vatsala\u003cspan class=\"page-num\"\u003e — 25\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-bhajahu-re-mana-shri-nanda-nandana\"\u003ebhajahu̐ re mana\u003cspan class=\"page-num\"\u003e — 100\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-bhaja-re-bhaja-re-amar-mana-ati-manda\"\u003ebhaja re bhaja re āmār\u003cspan class=\"page-num\"\u003e — 57\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch2 class=\"first-line-group\"\u003eD\u003c/h2\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-dayal-nitai-chaitanya-bole-nach-re\"\u003e‘dayāl nitāi chaitanya’ ba’le\u003cspan class=\"page-num\"\u003e — 75\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-devam-divya-tanum-suchanda-vadanam-balarka-chelanchitam\"\u003edevaṁ divya-tanuṁ suchanda-vadanaṁ bālārka-chelāñchitaṁ\u003cspan class=\"page-num\"\u003e — 43\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-deva-siddha-mukta-yukta-bhakta-vrinda\"\u003edeva-siddha-mukta-yukta-bhakta-vṛnda-vanditaṁ\u003cspan class=\"page-num\"\u003e — 163\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-dhvasta-sarvvabhauma-vada-navya-tarka-shiankaram\"\u003edhvasta-sārvabhauma-vāda-navya-tarka-śāṅkaraṁ\u003cspan class=\"page-num\"\u003e — 174\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-divyad-vrindaranya-kalpa-drumadhah\"\u003edīvyad-vṛndāraṇya-kalpa-drumādhaḥ\u003cspan class=\"page-num\"\u003e — 47\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-durlabha-manava-janma-labhiya-samsare\"\u003edurlabha mānava-janma\u003cspan cl
