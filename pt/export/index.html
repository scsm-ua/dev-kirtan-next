ra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nija-māne spṛhā-hīna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egurudeva!\u003c/i\u003e–Ó mestre espiritual! \u003ci class=\"wbw__term\"\u003ediyā\u003c/i\u003e–dê [a] \u003ci class=\"wbw__term\"\u003eei\u003c/i\u003e–este \u003ci class=\"wbw__term\"\u003edāse\u003c/i\u003e–servo \u003ci class=\"wbw__term\"\u003ebindu\u003c/i\u003e–uma gota \u003ci class=\"wbw__term\"\u003ekṛpā\u003c/i\u003e–de misericórdia [e] \u003ci class=\"wbw__term\"\u003ekara’\u003c/i\u003e–por favor [me] faça \u003ci class=\"wbw__term\"\u003eati\u003c/i\u003e–muito \u003ci class=\"wbw__term\"\u003eapekṣā\u003c/i\u003e–mais \u003ci class=\"wbw__term\"\u003edīna\u003c/i\u003e–humilde [que uma] \u003ci class=\"wbw__term\"\u003etṛṇa\u003c/i\u003e–folha de grama. \u003ci class=\"wbw__term\"\u003ediyā\u003c/i\u003e–[Me] dê [a] \u003ci class=\"wbw__term\"\u003ebala\u003c/i\u003e–força \u003ci class=\"wbw__term\"\u003esahane\u003c/i\u003e–para tolerar \u003ci class=\"wbw__term\"\u003esakala\u003c/i\u003e–tudo [e] \u003ci class=\"wbw__term\"\u003ekara’\u003c/i\u003e–por favor [me] faça \u003ci class=\"wbw__term\"\u003ehīna\u003c/i\u003e–desprovido [de qualquer] \u003ci class=\"wbw__term\"\u003espṛhā\u003c/i\u003e–desejo \u003ci class=\"wbw__term\"\u003emāne\u003c/i\u003e–por honra \u003ci class=\"wbw__term\"\u003enija\u003c/i\u003e–própria.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gurudev! Dê a este servo uma gota de sua misericórdia, e me faça mais humilde que uma folha de grama. Me dê a força para tolerar tudo, e me liberte de qualquer desejo por honra pessoal.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esakale sammāna\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;karite śakati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;deha nātha! yathā yatha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etabe ta’ gāiba\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hari-nāma sukhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;aparādha habe hata\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003enātha!\u003c/i\u003e–Ó mestre! \u003ci class=\"wbw__term\"\u003edeha’\u003c/i\u003e–por favor [me] dê \u003ci class=\"wbw__term\"\u003eśakati\u003c/i\u003e–a força \u003ci class=\"wbw__term\"\u003ekarite sammāna\u003c/i\u003e–honrar \u003ci class=\"wbw__term\"\u003esakale\u003c/i\u003e–a todos \u003ci class=\"wbw__term\"\u003eyathāyatha\u003c/i\u003e–apropriadamente \u003ci class=\"wbw__term\"\u003etabe\u003c/i\u003e–então \u003ci class=\"wbw__term\"\u003eta’\u003c/i\u003e–certamente \u003ci class=\"wbw__term\"\u003egāiba\u003c/i\u003e–eu cantarei \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–o Nome \u003ci class=\"wbw__term\"\u003ehari\u003c/i\u003e–do Senhor \u003ci class=\"wbw__term\"\u003esukhe\u003c/i\u003e–com felicidade [e todas as minhas] \u003ci class=\"wbw__term\"\u003eaparādha\u003c/i\u003e–ofensas \u003ci class=\"wbw__term\"\u003eha’be\u003c/i\u003e–serão \u003ci class=\"wbw__term\"\u003ehata\u003c/i\u003e–destruídas.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ mestre! Me dê a habilidade de honrar apropriadamente a todos. Então feliz eu cantarei o Nome do Senhor, e todas as minhas ofensas serão erradicadas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekabe hena kṛpā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;labhiyā e jana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛtārtha ha-ibe, nātha!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśakti-buddhi-hīna\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āmi ati dīna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kara more ātma-sātha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekabe\u003c/i\u003e–Quando? \u003ci class=\"wbw__term\"\u003ee\u003c/i\u003e–esta \u003ci class=\"wbw__term\"\u003ejana\u003c/i\u003e–pessoa \u003ci class=\"wbw__term\"\u003elabhiyā\u003c/i\u003e–alcançará \u003ci class=\"wbw__term\"\u003ehena\u003c/i\u003e–tal \u003ci class=\"wbw__term\"\u003ekṛpā\u003c/i\u003e–misericórdia [e] \u003ci class=\"wbw__term\"\u003eha-ibe\u003c/i\u003e–será \u003ci class=\"wbw__term\"\u003ekṛtārtha\u003c/i\u003e–realizada? \u003ci class=\"wbw__term\"\u003enātha!\u003c/i\u003e–Ó mestre! [estou] \u003ci class=\"wbw__term\"\u003ehīna\u003c/i\u003e–desprovido [de] \u003ci class=\"wbw__term\"\u003eśakti\u003c/i\u003e–força [e] \u003ci class=\"wbw__term\"\u003ebuddhi\u003c/i\u003e–inteligência \u003ci class=\"wbw__term\"\u003eāmi\u003c/i\u003e–eu [estou] \u003ci class=\"wbw__term\"\u003eati\u003c/i\u003e–muito \u003ci class=\"wbw__term\"\u003edīna\u003c/i\u003e–angustiado \u003ci class=\"wbw__term\"\u003ekara’\u003c/i\u003e–por favor permita \u003ci class=\"wbw__term\"\u003emore\u003c/i\u003e–a mim \u003ci class=\"wbw__term\"\u003eātma\u003c/i\u003e–estar [em Sua] \u003ci class=\"wbw__term\"\u003esātha\u003c/i\u003e–companhia.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando esta alma alcançará tal misericórdia e ficará realizada? Ó mestre! Estou desprovido de capacidade e inteligência, e muito aflito. Me aceite por favor.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyogyatā-vichāre\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kichhu nāhi pāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra karuṇā-sāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekaruṇā nā ha-ile\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kā̐diyā kā̐diyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prāṇa nā rākhiba āra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003evichāre\u003c/i\u003e–[Quando] considero [minhas] \u003ci class=\"wbw__term\"\u003eyogyatā\u003c/i\u003e–aptidões \u003ci class=\"wbw__term\"\u003ekichhu\u003c/i\u003e–qualquer coisa \u003ci class=\"wbw__term\"\u003enāhi\u003c/i\u003e–não \u003ci class=\"wbw__term\"\u003epāi\u003c/i\u003e–obtenho. \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Sua \u003ci class=\"wbw__term\"\u003ekaruṇā\u003c/i\u003e–misericórdia [é] \u003ci class=\"wbw__term\"\u003esāra\u003c/i\u003e–a essência \u003ci class=\"wbw__term\"\u003ehaile\u003c/i\u003e–se você for \u003ci class=\"wbw__term\"\u003enā\u003c/i\u003e–não \u003ci class=\"wbw__term\"\u003ekaruṇā\u003c/i\u003e–misericordioso \u003ci class=\"wbw__term\"\u003ekā̐diyā\u003c/i\u003e–chorando \u003ci class=\"wbw__term\"\u003ekā̐diyā\u003c/i\u003e–e chorando \u003ci class=\"wbw__term\"\u003eāra\u003c/i\u003e–não mais \u003ci class=\"wbw__term\"\u003erākhiba\u003c/i\u003e–vou manter [minha] \u003ci class=\"wbw__term\"\u003eprāṇa\u003c/i\u003e–vida.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando busco qualificações em mim, não encontro nenhuma. Sua misericórdia é tudo. Se você não for misericordioso comigo, então, chorando, não vou mais manter minha vida.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-udilo-aruna-puraba-bhage\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eAruṇodoya-kīrtan \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eParte 1\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eudila aruṇa pūrava-bhāge\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edvija-maṇi gorā amani jāge\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakata-samūha la-iyā sāthe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gorā) gelā nagara-vrāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO sol nasce no oriente, e a joia dos brāhmaṇs, Śrī Gorāchā̐d, desperta. Levando Seus devotos com Ele, Ele vai pelas ruas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘tāthai tāthai’ bājala khola\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eghana ghana tāhe jhā̐jera rola\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epreme ḍhala ḍhala sonāra aṅga\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gorār) charaṇe nūpura bāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAs mṛdaṅgas ressoam ‘tāthai tāthai’ no ritmo dos címbalos, a forma dourada de Gaurasundar dança em amor extático, e suas tornozeleiras tilintam.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emukunda mādhava yādava hari\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebalena bala re vadana bhari’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emichhe nida-vaśe gela re rāti\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;divasa śarīra sāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle clama: “Cantem em voz alta Mukunda, Mādhava, Yādava, Hari! Inutilmente vocês passam a noite dormindo e o dia decorando seus corpos.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eemana durlabha mānava-deha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epāiyā ki kara bhāvanā keha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eebe nā bhajile yaśodā-suta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;charame paḍibe lāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Tendo atingido este raro corpo humano, o que vocês estão pensando? Se vocês não servirem Kṛṣṇa agora, por fim, vocês cairão em vergonha.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eudita tapana ha-ile asta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edina gela bali’ ha-ibe vyasta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etabe kena ebe alasa ha-i’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā bhaja hṛdaya-rāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Quando o sol brilhante se põe, vocês se tornam ocupados, considerando que o dia terminou. Então por que vocês estão com preguiça agora? Por que vocês não servem o Senhor de seus corações?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejīvana anitya jānaha sāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etāhe nānā-vidha vipada-bhāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāmāśraya kari’ yatane tumi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;thākaha āpana kāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Entendam a essência: a vida é temporária e cheia de todos os tipos de adversidades. Cuidadosamente tomando o abrigo no Nome, se engajem em seus afazeres.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛṣṇa-nāma-sudhā kariyā pāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejuḍāo bhakati-vinoda-prāṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma vinā kichhu nāhika āra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chaudda-bhuvana-mājhe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBeba o néctar do Nome de Kṛṣṇa e acalme a alma de Bhakti Vinod. Não há nada a se ter em todos os catorze universos a não ser o Nome.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejīvera kalyāṇa-sādhana-kāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejagate āsi’ e madhura nāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eavidyā-timira-tapana-rūpe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hṛd-gagane virāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDesejando abençoar todas as almas, o doce Nome do Senhor vem a este mundo e surge como o Sol dentro do céu do coração para dissipar a escuridão da ignorância.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jiv-jago-jiv-jago-gaurachanda-bole\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eAruṇodoya-kīrtan \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eParte 2\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejīva jāga, jīva jāga, gorāchā̐da bale\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekata nidrā yāo māyā-piśāchīra kole\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Gorāchā̐d chama: “Ó almas, acordem! Ó almas, acordem! Por quanto tempo vocês vão dormir nas garras da bruxa Māyā?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(ār kata kāl ghumāibe?)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(māyā-piśāchīra kole ār kata kāl ghumāibe?)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(uṭha jīva, kṛṣṇa bhaja ār kata kāl ghumāibe?)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Por quanto tempo mais vocês vão dormir? Por quanto tempo mais vocês vão dormir no colo da bruxa Māyā? Levante-se alma! Sirva Kṛṣṇa! Por quanto tempo mais você vai dormir?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhajiba baliyā ese saṁsāra-bhitare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhuliyā rahile tumi avidyāra bhare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Você veio a este mundo dizendo: ‘Oh Senhor, eu Te servirei‘, mas tendo esquecido essa promessa, você permaneceu na ignorância.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(bhuliyā rahile)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(avidyāra mohe paḍe tumi bhuliyā rahile)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Você esqueceu e permaneceu. Você caiu na confusão da ilusão, esqueceu (sua promessa), e permaneceu lá.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāre la-ite āmi ha-inu avatāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāmi vinā bandhu āra ke āchhe tomāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Eu descendi para te salvar. Além de mim, quem é seu amigo?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(eman bandhu ār ke āchhe?)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(māyā-ha-ite uddhārite eman bandhu ār ke āchhe?)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuem mais é tão amigo? Quem mais está lá para te salvar de Māyā?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eenechhi auṣadhi māyā nāśibāra lāgi’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehari-nāma mahā-mantra lao tumi māgi’\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Eu trouxe o remédio para dissipar Māyā. Ore por este Hari-nām mahāmantra e aceite-o.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(māgiyā lao re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(sudhā-mākhā ei hari-nām māgiyā lao re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Ore e aceite-o. Ore pelo Santo Nome, que está gotejando com néctar, e aceite-o.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakativinoda prabhura-charaṇe paḍiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esei hari-nāma-mantra la-ila māgiyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBhakti Vinod cai aos pés do Senhor, ora pelo Hari-nām mahāmantra, e o toma.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-kobe-shri-chaitanya-more-koribena-daya\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eDainya Prārthanā Gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekabe śrī chaitanya more karibena dayā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekabe āmi pāiba vaiṣṇava-pada-chhāyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando Śrī Chaitanya será misericordioso comigo? Quando vou alcançar a sombra dos pés dos Vaiṣṇavas?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekabe āmi chhāḍiba e viṣayābhimāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekabe viṣṇu-jane āmi kariba sammāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando desistirei deste ego mundano? Quando vou honrar os devotos do Senhor?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egala-vastra kṛtāñjali vaiṣṇava-nikaṭe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edante tṛṇa kari’ dā̐ḍāiba niṣkapaṭe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCom um pano ao redor do pescoço, palmas unidas, e uma palha entre os dentes, sinceramente vou me submeter aos pés do Vaiṣṇava.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekā̐diyā kā̐diyā jānāiba duḥkha-grāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaṁsāra-anala haite māgiba viśrāma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eChorando, confessarei minhas tristezas ao Vaiṣṇava e orarei por abrigo contra o fogo da existência material.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśuniyā āmāra duḥkha vaiṣṇava ṭhākura\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāmā’ lāgi’ kṛṣṇe āvedibena prachura\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOuvindo meu sofrimento, o adorável Vaiṣṇava irá orar a Kṛṣṇa em meu nome.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evaiṣṇavera āvedane kṛṣṇa dayāmaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ee hena pāmara prati habena sadaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSatisfeito com a oração do Vaiṣṇava, Kṛṣṇa será misericordioso com este pecador.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evinodera nivedana vaiṣṇava-charaṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛpā kari’ saṅge laha ei akiñchane\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBhakti Vinod ora aos pés do Vaiṣṇava: “Misericordiosamente leve esta alma caída com você.”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-namo-namah-tulasi-maharani\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Tulasī-parikramā-gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Chandraśekhar Āchārya\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enamo namaḥ tulasī mahārāṇī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evṛnde mahārāṇī namo namaḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enamo re namo re mā̐iyā namo nārāyaṇī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Tulasī Mahārāṇī, Ó Vṛndā Devī, eu ofereço minha reverência a você repetidamente. Ó Nārāyaṇī, eu ofereço minha reverência a você repetidamente.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyā̐ko daraśe paraśe agha-nāśa hoi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emahimā veda-purāṇe vākhāni\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAo ver ou tocar você, todos os pecados são destruídos. Suas glórias são cantadas nos Vedas e nos Purāṇas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyā̐ko patra mañjarī komala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-pati-charaṇa-kamale lepaṭāni\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSuas folhas e mañjarīs macias estão entrelaçadas ao redor dos pés de lótus do Senhor de Lakṣmī.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edhanya tulasī puraṇa tapa kiye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-śālagrāma-mahā-pāṭarāṇī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ afortunada Tulasī, por meio de suas austeridades você se tornou a adorável consorte de Śrī Śālagrām.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edhūpa, dīpa, naivedya, ārati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ephulanā kiye varakhā varakhāni\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVocê derrama misericórdia sobre quem lhe oferece incenso, lâmpadas, alimentos, adoração e flores.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echhāppānna bhoga, chhatriśa vyañjana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evinā tulasī prabhu eka nāhi māni\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Senhor não aceita nem uma das cinquenta e seis oferendas de grãos, ou das trinta e seis oferendas de vegetais que não contenham folhas de tulasī.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśiva śuka nārada ā-ura brahmādika\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eḍhu̐ḍata phirata mahā-muni jñānī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚiva, Śukadev, Nārad, Brahmā, os outros semideuses e os grandes sábios eruditos, todos a circundam.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echandraśekhara māiyā, terā yaśa gāoye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakati dāna dījiye mahārāṇī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Tulasī Mahārāṇī, Chandraśekhar canta suas glórias. Dê-lhe o dom da devoção.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eVandanā\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-vande-ham-shri-guroh-shri-yuta-pada-kamalam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eVandanā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evande ’haṁ śrī-guroḥ śrī-yuta-pada-kamalaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-gurūn vaiṣṇavāṁś cha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-rūpaṁ sāgrajātaṁ saha-gaṇa raghunāth-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ānvitaṁ taṁ sa-jīvam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esādvaitaṁ sāvadhūtaṁ parijana-sahitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛṣṇa-chaitanya-devaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-rādhā-kṛṣṇa-pādān saha-gaṇa-lalitā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-viśākhānvitāṁś cha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eaham\u003c/i\u003e–Eu \u003ci class=\"wbw__term\"\u003evande\u003c/i\u003e–ofereço [minha] reverência [aos] \u003ci class=\"wbw__term\"\u003eśrī-yuta\u003c/i\u003e–sagrados \u003ci class=\"wbw__term\"\u003epada\u003c/i\u003e–pés [de] \u003ci class=\"wbw__term\"\u003ekamalam\u003c/i\u003e–lótus [de] \u003ci class=\"wbw__term\"\u003eśrī-guroḥ\u003c/i\u003e–do mestre divino (meu Mantra-dīkṣā-guru ou Bhajana-śikṣā-guru), \u003ci class=\"wbw__term\"\u003eśrī-gurūn\u003c/i\u003e–aos mestres divinos (Gurus na sucessão: Śrī Madhva Āchārya, Śrī Mādhavendra Purī, e assim por diante), \u003ci class=\"wbw__term\"\u003echa\u003c/i\u003e–e \u003ci class=\"wbw__term\"\u003evaiṣṇavān\u003c/i\u003e–aos Vaiṣṇavas (os devotos que apareceram durante as quatro eras), \u003ci class=\"wbw__term\"\u003etam śrī-rūpam\u003c/i\u003e–a ele, Śrīla Rūpa Goswāmī Prabhu \u003ci class=\"wbw__term\"\u003esa\u003c/i\u003e–com [seu] \u003ci class=\"wbw__term\"\u003eagra-jātam\u003c/i\u003e–irmão mais velho (Śrīla Sanātan Goswāmī Prabhu) \u003ci class=\"wbw__term\"\u003eanvitam\u003c/i\u003e–acompanhado de \u003ci class=\"wbw__term\"\u003eraghunātha\u003c/i\u003e–Śrīla Raghunāth Dās Goswāmī \u003ci class=\"wbw__term\"\u003esaha\u003c/i\u003e–com [seus] \u003ci class=\"wbw__term\"\u003egaṇa\u003c/i\u003e–associados [e] \u003ci class=\"wbw__term\"\u003esa\u003c/i\u003e–com \u003ci class=\"wbw__term\"\u003ejīvam\u003c/i\u003e–Śrīla Jīva Goswāmī Prabhu \u003ci class=\"wbw__term\"\u003ekṛṣṇa-chaitanya-devam\u003c/i\u003e–ao Senhor Śrī Kṛṣṇa Chaitanya \u003ci class=\"wbw__term\"\u003esahitam\u003c/i\u003e–assistido por [Seus] \u003ci class=\"wbw__term\"\u003eparijana\u003c/i\u003e–associados \u003ci class=\"wbw__term\"\u003esa\u003c/i\u003e–junto com \u003ci class=\"wbw__term\"\u003eadvaitam\u003c/i\u003e–Śrī Advaita Āchārya [e] \u003ci class=\"wbw__term\"\u003esa\u003c/i\u003e–com \u003ci class=\"wbw__term\"\u003eavadhūtam\u003c/i\u003e–o Avadhūt (Śrī Nityānanda Prabhu), \u003ci class=\"wbw__term\"\u003echa\u003c/i\u003e–e \u003ci class=\"wbw__term\"\u003epādān\u003c/i\u003e–aos pés \u003ci class=\"wbw__term\"\u003eśrī-rādhā-kṛṣṇa\u003c/i\u003e–de Śrī Śrī Rādhā-Kṛṣṇa \u003ci class=\"wbw__term\"\u003eanvitān\u003c/i\u003e–acompanhados de \u003ci class=\"wbw__term\"\u003elalitā\u003c/i\u003e–Śrī Lalitā Devī, \u003ci class=\"wbw__term\"\u003eśrī-viśākhā\u003c/i\u003e–Śrī Viśākhā Devī, \u003ci class=\"wbw__term\"\u003esaha\u003c/i\u003e–junto com [Suas] \u003ci class=\"wbw__term\"\u003egaṇa\u003c/i\u003e–associadas (as sakhīs e mañjarīs).\u003c/p\u003e\n\u003cp class=\"translation\"\u003e\u003ci\u003e(Śrī Chaitanya-charitāmṛta: Antya-līlā, 2.1)\u003c/i\u003e\u003cbr\u003e\nEu ofereço minha reverência aos pés de lótus de Śrī Guru, aos Gurus predecessores, aos Vaiṣṇavas, Śrī Rūpa, Śrī Sanātan, Śrī Raghunāth, Śrī Jīva, seus seguidores, Śrī Advaita Prabhu, Śrī Nityānanda Prabhu, Śrī Kṛṣṇa Chaitanyadev e Seus associados, Śrī Śrī Rādhā-Kṛṣṇa, Śrī Lalitā Devī, Śrī Viśākhā Devī, e todas as Suas associadas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eoṁ ajñāna-timirāndhasya jñānāñjana-śalākayā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echakṣur unmilitaṁ yena tasmai śrī-gurave namaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eoṁ\u003c/i\u003e–[uma invocação de oração] \u003ci class=\"wbw__term\"\u003enamaḥ\u003c/i\u003e–Eu ofereço [minha] reverência \u003ci class=\"wbw__term\"\u003etasmai\u003c/i\u003e–a ele \u003ci class=\"wbw__term\"\u003eśrī-gurave\u003c/i\u003e–ao mestre divino \u003ci class=\"wbw__term\"\u003eyena\u003c/i\u003e–por quem [meus] \u003ci class=\"wbw__term\"\u003echakṣuḥ\u003c/i\u003e–olhos \u003ci class=\"wbw__term\"\u003eandhasya\u003c/i\u003e–cegos \u003ci class=\"wbw__term\"\u003etimira\u003c/i\u003e–pela catarata \u003ci class=\"wbw__term\"\u003eajñāna\u003c/i\u003e–da ignorância [têm sido] \u003ci class=\"wbw__term\"\u003eunmilitam\u003c/i\u003e–abertos \u003ci class=\"wbw__term\"\u003eśalākayā\u003c/i\u003e–com o bastão [usado para aplicar] \u003ci class=\"wbw__term\"\u003eañjana\u003c/i\u003e–o colírio \u003ci class=\"wbw__term\"\u003ejñāna\u003c/i\u003e–do conhecimento [divino].\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOfereço minha reverência a Śrī Guru que tem aberto meus olhos que estavam cegos pela escuridão da ignorância, com o colírio do conhecimento divino.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gurvabhishta-supurakam-guru-ganair\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egurv-ābhīṣṭa-supūrakaṁ guru-gaṇair āśīṣa-saṁbhūṣitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echintyāchintya-samasta-veda-nipuṇaṁ śrī-rūpa-panthānugam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egovindābhidham ujjvalaṁ vara-tanuṁ bhakty anvitaṁ-sundaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande viśva-guruñ cha divya-bhagavat-premṇo hi bīja-pradam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003evande\u003c/i\u003e–Eu ofereço [minha] reverência [a ele que] \u003ci class=\"wbw__term\"\u003esupūrakam\u003c/i\u003e–satisfaz [os] \u003ci class=\"wbw__term\"\u003eābhīṣṭa\u003c/i\u003e–estimados desejos [de seu] \u003ci class=\"wbw__term\"\u003eguru\u003c/i\u003e–Guru [e que é] \u003ci class=\"wbw__term\"\u003esaṁbhūṣitam\u003c/i\u003e–plenamente adornado \u003ci class=\"wbw__term\"\u003eāśīṣa\u003c/i\u003e–com as bençãos \u003ci class=\"wbw__term\"\u003egaṇaiḥ\u003c/i\u003e–dos associados [de seu] \u003ci class=\"wbw__term\"\u003eguru\u003c/i\u003e–Guru. [Ele é] \u003ci class=\"wbw__term\"\u003enipuṇam\u003c/i\u003e–o ‘expert’ \u003ci class=\"wbw__term\"\u003esamasta\u003c/i\u003e–em todos [os aspectos] \u003ci class=\"wbw__term\"\u003eveda\u003c/i\u003e–dos Vedas, [tanto] \u003ci class=\"wbw__term\"\u003echintya\u003c/i\u003e–concebíveis [quanto] \u003ci class=\"wbw__term\"\u003eachintya\u003c/i\u003e–inconcebíveis [e é] \u003ci class=\"wbw__term\"\u003eanugam\u003c/i\u003e–o [preeminente] seguidor \u003ci class=\"wbw__term\"\u003epanthā\u003c/i\u003e–[do] caminho \u003ci class=\"wbw__term\"\u003eśrī-rūpa\u003c/i\u003e–de Śrī Rūpa. \u003ci class=\"wbw__term\"\u003eabhidham\u003c/i\u003e–De nome \u003ci class=\"wbw__term\"\u003egovinda\u003c/i\u003e–‘Govinda’ (Śrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj) [cuja] \u003ci class=\"wbw__term\"\u003esundaram\u003c/i\u003e–bela \u003ci class=\"wbw__term\"\u003eujjvalam\u003c/i\u003e–refulgente, [e] \u003ci class=\"wbw__term\"\u003evara\u003c/i\u003e–exaltada \u003ci class=\"wbw__term\"\u003etanuṁ\u003c/i\u003e–forma [é] \u003ci class=\"wbw__term\"\u003eanvitam\u003c/i\u003e–infundida \u003ci class=\"wbw__term\"\u003ebhakti\u003c/i\u003e–de devoção. [Ele é] \u003ci class=\"wbw__term\"\u003egurum\u003c/i\u003e–o mestre espiritual \u003ci class=\"wbw__term\"\u003eviśva\u003c/i\u003e–do universo \u003ci class=\"wbw__term\"\u003echa\u003c/i\u003e–e \u003ci class=\"wbw__term\"\u003ehi\u003c/i\u003e–certamente \u003ci class=\"wbw__term\"\u003epradam\u003c/i\u003e–o doador \u003ci class=\"wbw__term\"\u003ebīja\u003c/i\u003e–da semente \u003ci class=\"wbw__term\"\u003epremṇaḥ\u003c/i\u003e–do amor \u003ci class=\"wbw__term\"\u003edivya\u003c/i\u003e–divino \u003ci class=\"wbw__term\"\u003ebhagavat\u003c/i\u003e–ao Senhor Supremo.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOfereço minha reverência a ele que satisfaz perfeitamente os desejos mais estimados de seu Guru e que é plenamente adornado com as bênçãos dos associados de seu Guru. Ele é perito em todos os aspectos do conhecimento Védico, tanto concebíveis quanto inconcebíveis, e é o preeminente seguidor da linha de Śrīla Rūpa Goswāmī Prabhu. Ele é conhecido como ‘Govinda’(Śrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj) e sua bela, refulgente, e exaltada forma é infundida de devoção. Ele é o Guru do universo inteiro, e o doador da semente do amor divino ao Senhor Supremo.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-devam-divya-tanum-suchanda-vadanam-balarka-chelanchitam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edevaṁ divya-tanuṁ suchanda-vadanaṁ bālārka-chelāñchitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esāndrānanda-puraṁ sad-eka-varaṇaṁ vairāgya-vidyāmbudhim\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-siddhānta-nidhiṁ subhakti-lasitaṁ sārasvatānām varaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande taṁ śubhadaṁ mad-eka-śaraṇaṁ nyāsīśvaraṁ śrīdharam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003evande\u003c/i\u003e–Eu ofereço minha reverência \u003ci class=\"wbw__term\"\u003etam\u003c/i\u003e–a ele [meu] \u003ci class=\"wbw__term\"\u003edevam\u003c/i\u003e–senhor \u003ci class=\"wbw__term\"\u003eśrīdharam\u003c/i\u003e–Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj, [cuja] \u003ci class=\"wbw__term\"\u003etanum\u003c/i\u003e–forma \u003ci class=\"wbw__term\"\u003edivya\u003c/i\u003e–divina [é] \u003ci class=\"wbw__term\"\u003eañchitam\u003c/i\u003e–adornada \u003ci class=\"wbw__term\"\u003echela\u003c/i\u003e–com vestimentas [da cor] \u003ci class=\"wbw__term\"\u003ebālārka\u003c/i\u003e–do sol nascente [e cujo] \u003ci class=\"wbw__term\"\u003evadanam\u003c/i\u003e–discurso [é] \u003ci class=\"wbw__term\"\u003esuchanda\u003c/i\u003e–o mais prazeroso [ele é] \u003ci class=\"wbw__term\"\u003eambudhim\u003c/i\u003e–um oceano \u003ci class=\"wbw__term\"\u003evairāgya\u003c/i\u003e–de renúncia [e] \u003ci class=\"wbw__term\"\u003evidyā\u003c/i\u003e–conhecimento [e] \u003ci class=\"wbw__term\"\u003epuram\u003c/i\u003e–uma morada \u003ci class=\"wbw__term\"\u003eānanda\u003c/i\u003e–de êxtase \u003ci class=\"wbw__term\"\u003esāndra\u003c/i\u003e–divino \u003ci class=\"wbw__term\"\u003elasitam\u003c/i\u003e–resplendente \u003ci class=\"wbw__term\"\u003esubhakti\u003c/i\u003e–com devoção pura [ele é] \u003ci class=\"wbw__term\"\u003enidhim\u003c/i\u003e–um reservatório \u003ci class=\"wbw__term\"\u003eśrī-siddhānta\u003c/i\u003e–de conclusões perfeitas \u003ci class=\"wbw__term\"\u003eīśvaram\u003c/i\u003e–o líder \u003ci class=\"wbw__term\"\u003enyāsī\u003c/i\u003e–dos tridaṇḍi sannyāsīs, [e] \u003ci class=\"wbw__term\"\u003evaram\u003c/i\u003e–o melhor \u003ci class=\"wbw__term\"\u003esārasvatānām\u003c/i\u003e–dos seguidores de Śrīla Saraswatī Ṭhākur [ele é] \u003ci class=\"wbw__term\"\u003eeka\u003c/i\u003e–a única \u003ci class=\"wbw__term\"\u003evaranam\u003c/i\u003e–escolha \u003ci class=\"wbw__term\"\u003esad\u003c/i\u003e–dos sādhus \u003ci class=\"wbw__term\"\u003eśubhadam\u003c/i\u003e–o doador de [toda] bondade, [e] \u003ci class=\"wbw__term\"\u003emad\u003c/i\u003e–meu \u003ci class=\"wbw__term\"\u003eeka\u003c/i\u003e–único \u003ci class=\"wbw__term\"\u003eśaraṇam\u003c/i\u003e–abrigo.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOfereço minha reverência a meu senhor, Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj. Sua forma divina é adornada de roupas da cor do sol nascente e seu discurso é o mais agradável. Ele é um oceano de renúncia e conhecimento e é uma morada de êxtase divino resplendente de devoção pura. Ele é um reservatório de conclusões perfeitas, o líder dos tri-daṇḍi sannyāsīs, e o melhor dos seguidores de Śrīla Saraswatī Ṭhākur. Ele é a única escolha dos sadhūs, o doador de toda bondade, e meu único abrigo.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-siddhanta-sarasvatiti-vidito\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eBhagavān Śrīla Bhakti Siddhānta Saraswatī Ṭhākur \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-siddhānta-sarasvatīti vidito gauḍīya-gurv-anvaye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhāto bhānuriva prabhāta-gagane yo gaura-saṅkīrtanaiḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emāyāvāda-timiṅgilodara-gatān uddhṛtya jīvanimān\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-prema-sudhābdhi-gāhana-sukhaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prādāt prabhuṁ taṁ bhaje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ebhaje\u003c/i\u003e–Eu sirvo \u003ci class=\"wbw__term\"\u003etam\u003c/i\u003e–ele, [meu] \u003ci class=\"wbw__term\"\u003eprabhum\u003c/i\u003e–mestre, \u003ci class=\"wbw__term\"\u003eviditaḥ\u003c/i\u003e–conhecido \u003ci class=\"wbw__term\"\u003eiti\u003c/i\u003e–como \u003ci class=\"wbw__term\"\u003eśrī-siddhānta-sarasvatī\u003c/i\u003e–Śrī Siddhānta Saraswatī [quem] \u003ci class=\"wbw__term\"\u003eanvaye\u003c/i\u003e–dentro da linhagem \u003ci class=\"wbw__term\"\u003eguru\u003c/i\u003e–de mestres \u003ci class=\"wbw__term\"\u003egauḍīya\u003c/i\u003e–da Gauḍīya \u003ci class=\"wbw__term\"\u003ebhātaḥ\u003c/i\u003e–brilha \u003ci class=\"wbw__term\"\u003eiva\u003c/i\u003e–como \u003ci class=\"wbw__term\"\u003ebhānuḥ\u003c/i\u003e–o sol [no] \u003ci class=\"wbw__term\"\u003egagane\u003c/i\u003e–céu [da] \u003ci class=\"wbw__term\"\u003eprabhāta\u003c/i\u003e–manhã [e] \u003ci class=\"wbw__term\"\u003eyaḥ\u003c/i\u003e–quem \u003ci class=\"wbw__term\"\u003esaṅkīrtanaiḥ\u003c/i\u003e–com o saṅkīrtan \u003ci class=\"wbw__term\"\u003egaura\u003c/i\u003e–de Gaura \u003ci class=\"wbw__term\"\u003euddhṛtya\u003c/i\u003e–resgata \u003ci class=\"wbw__term\"\u003ejīvanimān\u003c/i\u003e–as almas \u003ci class=\"wbw__term\"\u003egatān\u003c/i\u003e–situadas \u003ci class=\"wbw__term\"\u003eudara\u003c/i\u003e–na barriga \u003ci class=\"wbw__term\"\u003etimiṅgila\u003c/i\u003e–da extraordinária criatura marinha (lit. ‘que engole baleias’) \u003ci class=\"wbw__term\"\u003emāyāvāda\u003c/i\u003e–do ilusionismo [e] \u003ci class=\"wbw__term\"\u003eprādāt\u003c/i\u003e–concede [a elas] \u003ci class=\"wbw__term\"\u003esukham\u003c/i\u003e–a alegria \u003ci class=\"wbw__term\"\u003egāhana\u003c/i\u003e–de nadar \u003ci class=\"wbw__term\"\u003eabdhi\u003c/i\u003e–no oceano \u003ci class=\"wbw__term\"\u003esudhā\u003c/i\u003e–do néctar [do] \u003ci class=\"wbw__term\"\u003eprema\u003c/i\u003e–amor divino \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–por Kṛṣṇa.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu sirvo meu mestre que é conhecido como Śrīla Bhakti Siddhānta Saraswatī Ṭhākur. Dentro da linhagem de Gurus da Gauḍīya sampradāya, ele brilha como o sol no céu da manhã. Através do saṅkīrtan de Gaura ele resgata as almas engolidas dentro da barriga do timiṅgila do māyāvād e concede a elas o êxtase de nadar no oceano de néctar do amor divino a Kṛṣṇa.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-namo-gaurakishoraya-bhaktavadhuta-murtaye\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrīla Gaura Kiśora Dās Bābājī Mahārāj \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enamo gaurakiśorāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhaktāvadhūta mūrtaye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaurāṅghri padma-bhṛṅgāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhā-bhāva-niṣeviṇe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003enamaḥ\u003c/i\u003e–eu ofereço [minha] reverência \u003ci class=\"wbw__term\"\u003egaura-kiśorāya\u003c/i\u003e–a Gaura Kiśor \u003ci class=\"wbw__term\"\u003emūrtaye\u003c/i\u003e–à epítome \u003ci class=\"wbw__term\"\u003ebhakta\u003c/i\u003e–de um devoto \u003ci class=\"wbw__term\"\u003eavadhūta\u003c/i\u003e–renunciante, [que é] \u003ci class=\"wbw__term\"\u003ebhṛṅgāya\u003c/i\u003e–uma abelha \u003ci class=\"wbw__term\"\u003eaṅghri\u003c/i\u003e–aos pés \u003ci class=\"wbw__term\"\u003epadma\u003c/i\u003e–de lótus \u003ci class=\"wbw__term\"\u003egaura\u003c/i\u003e–de Gaura [e] \u003ci class=\"wbw__term\"\u003eniṣeviṇe\u003c/i\u003e–sempre engajado em serviço \u003ci class=\"wbw__term\"\u003ebhāva\u003c/i\u003e–por amor \u003ci class=\"wbw__term\"\u003erādhā\u003c/i\u003e–a Śrīmatī Rādhārāṇī.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOfereço minha reverência a Śrīla Gaura Kiśor Dās Bābājī Mahārāj, a epítome de um devoto renunciante, que é uma abelha aos pés de lótus de Gaura e sempre engajado em serviço amoroso a Śrīmatī Rādhārāṇī.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vande-bhaktivinodam-shri-gaura-shiakti-svarupakam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrīla Bhakti Vinod Ṭhākur \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evande bhaktivinodaṁ śrī-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaura-śakti-svarūpakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakti-śāstrajña-samrājaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhā-rasa-sudhā-nidhim\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003evande\u003c/i\u003e–eu ofereço [minha] reverência \u003ci class=\"wbw__term\"\u003ebhakti-vinodam\u003c/i\u003e–a Śrīla Bhakti Vinod Ṭhākur \u003ci class=\"wbw__term\"\u003esvarūpakam\u003c/i\u003e–a personificação \u003ci class=\"wbw__term\"\u003eśakti\u003c/i\u003e–da energia \u003ci class=\"wbw__term\"\u003eśrī-gaura\u003c/i\u003e–de Śrī Gaura. [Ele é o] \u003ci class=\"wbw__term\"\u003esamrājam\u003c/i\u003e–rei soberano \u003ci class=\"wbw__term\"\u003eśāstrajña\u003c/i\u003e–entre os conhecedores das escrituras \u003ci class=\"wbw__term\"\u003ebhakti\u003c/i\u003e–sobre devoção, [e um] \u003ci class=\"wbw__term\"\u003enidhim\u003c/i\u003e–reservatório \u003ci class=\"wbw__term\"\u003esudhā\u003c/i\u003e–de néctar \u003ci class=\"wbw__term\"\u003erasa\u003c/i\u003e–de amor \u003ci class=\"wbw__term\"\u003erādhā\u003c/i\u003e–a Śrīmatī Rādhārāṇī.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOfereço minha reverência a Śrīla Bhakti Vinod Ṭhākur, a personificação da energia de Śrī Gaura. Ele é o rei soberano entre todos os conhecedores das escrituras sobre bhakti e um reservatório de néctar de amor a Śrīmatī Rādhārāṇī.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gaura-vrajashritashieshair-vaishnavair-vandya-vigraham\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrīla Jagannāth Dās Bābājī Mahārāj \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaura-vrajāśritāśeṣair\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaiṣṇavair vandya-vigraham\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejagannātha-prabhuṁ vande\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epremābdhiṁ vṛddha-vaiṣṇavam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003evande\u003c/i\u003e–Eu ofereço [minha] reverência \u003ci class=\"wbw__term\"\u003evigraham\u003c/i\u003e–à forma \u003ci class=\"wbw__term\"\u003evandya\u003c/i\u003e–adorada \u003ci class=\"wbw__term\"\u003eaśeṣaiḥ\u003c/i\u003e–por todos \u003ci class=\"wbw__term\"\u003evaiṣṇavaiḥ\u003c/i\u003e–os Vaiṣṇavas \u003ci class=\"wbw__term\"\u003eāśrita\u003c/i\u003e–abrigados \u003ci class=\"wbw__term\"\u003egauḍa\u003c/i\u003e–em Gauḍa \u003ci class=\"wbw__term\"\u003evraja\u003c/i\u003e–e Vraja, [o] \u003ci class=\"wbw__term\"\u003evaiṣṇavam\u003c/i\u003e–Vaiṣṇava \u003ci class=\"wbw__term\"\u003evṛddha\u003c/i\u003e–primogênito [e] \u003ci class=\"wbw__term\"\u003eabdhim\u003c/i\u003e–oceano \u003ci class=\"wbw__term\"\u003eprema\u003c/i\u003e–de amor divino \u003ci class=\"wbw__term\"\u003ejagannātha-prabhum\u003c/i\u003e–Śrīla Jagannāth Dās Bābājī Mahārāj.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOfereço minha reverência à forma adorada por todos os Vaiṣṇavas que tomaram abrigo em Gauḍa e Vraja, o Vaiṣṇava primogênito, e oceano de amor divino, Śrīla Jagannāth Dās Bābājī Mahārāj.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vancha-kalpatarubhyas-cha\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003evāñchhā-kalpa-tarubhyaś cha \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evāñchhā-kalpa-tarubhyaś cha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛpā-sindhubhya eva cha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epatitānāṁ pāvanebhyo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaiṣṇavebhyo namo namaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003enamaḥ\u003c/i\u003e–Eu ofereço [minha] reverência [e] \u003ci class=\"wbw__term\"\u003enamaḥ\u003c/i\u003e–ofereço [minha] reverência [novamente] \u003ci class=\"wbw__term\"\u003evaiṣṇavebhyaḥ\u003c/i\u003e–aos devotos de Viṣṇu, [que são] \u003ci class=\"wbw__term\"\u003epāvanebhyaḥ\u003c/i\u003e–purificadores \u003ci class=\"wbw__term\"\u003epatitānām\u003c/i\u003e–dos caídos \u003ci class=\"wbw__term\"\u003eeva cha\u003c/i\u003e–sem dúvida \u003ci class=\"wbw__term\"\u003esindhubhyaḥ\u003c/i\u003e–oceanos \u003ci class=\"wbw__term\"\u003ekṛpā\u003c/i\u003e–de misericórdia \u003ci class=\"wbw__term\"\u003echa\u003c/i\u003e–e \u003ci class=\"wbw__term\"\u003evāñchhā-kalpa-tarubhyaḥ\u003c/i\u003e–árvores realizadoras dos desejos.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eRepetidamente ofereço minha reverência aos Vaiṣṇavas, que são purificadores dos caídos, oceanos de misericórdia, e árvo-res realizadoras dos desejos.\u003cbr\u003e\n\u003ci\u003e(Śrīla Rūpa Goswāmī Prabhu)\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epañcha-tattvātmakaṁ kṛṣṇaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakta-rūpa-svarūpakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhaktāvatāraṁ bhaktākhyaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enamāmi bhakta-śaktikam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003enamāmi\u003c/i\u003e–Ofereço [minha] reverência \u003ci class=\"wbw__term\"\u003ekṛṣṇam\u003c/i\u003e–a Kṛṣṇa \u003ci class=\"wbw__term\"\u003eātmakam\u003c/i\u003e–feito \u003ci class=\"wbw__term\"\u003epañcha\u003c/i\u003e–de cinco \u003ci class=\"wbw__term\"\u003etattva\u003c/i\u003e–aspectos: \u003ci class=\"wbw__term\"\u003erūpa\u003c/i\u003e–a forma \u003ci class=\"wbw__term\"\u003ebhakta\u003c/i\u003e–de um devoto, \u003ci class=\"wbw__term\"\u003esvarūpakam\u003c/i\u003e–uma expansão, \u003ci class=\"wbw__term\"\u003ebhakta\u003c/i\u003e–um devoto \u003ci class=\"wbw__term\"\u003eavatāram\u003c/i\u003e–avatār, \u003ci class=\"wbw__term\"\u003eākhyam\u003c/i\u003e–ao que é conhecido como \u003ci class=\"wbw__term\"\u003ebhakta\u003c/i\u003e–um devoto [e à], \u003ci class=\"wbw__term\"\u003eśaktikam\u003c/i\u003e–energia [do] \u003ci class=\"wbw__term\"\u003ebhakta\u003c/i\u003e–devoto.\u003c/p\u003e\n\u003cp class=\"translation\"\u003e\u003ci\u003e(Śrī Chaitanya-charitāmṛta: Ādi-līlā, 1.14)\u003c/i\u003e\u003cbr\u003e\nOfereço minha reverência à manifestação de Śrī Kṛṣṇa em cinco aspectos: na forma de um devoto, depois em sua forma expandida, ao devoto-avatār, ao devoto, e ao devoto-śakti.\u003cbr\u003e\n\u003ci\u003e(Śrīla Kṛṣṇadās Kavirāj Goswāmī)\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enamo mahā-vadānyāya kṛṣṇa-prema-pradāya te\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇāya kṛṣṇa-chaitanya-nāmne gaura-tviṣe namaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003enamaḥ\u003c/i\u003e–Eu ofereço [minha] reverência [e] \u003ci class=\"wbw__term\"\u003enamaḥ\u003c/i\u003e–ofereço [minha] reverência [de novo] \u003ci class=\"wbw__term\"\u003ete\u003c/i\u003e–a Você, \u003ci class=\"wbw__term\"\u003emahāvadānyāya\u003c/i\u003e–o supremamente misericordioso \u003ci class=\"wbw__term\"\u003epradāya\u003c/i\u003e–doador \u003ci class=\"wbw__term\"\u003eprema\u003c/i\u003e–de amor divino \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–a Kṛṣṇa, \u003ci class=\"wbw__term\"\u003ekṛṣṇāya\u003c/i\u003e–Kṛṣṇa [Ele mesmo] [em] \u003ci class=\"wbw__term\"\u003etviṣe\u003c/i\u003e–brilho \u003ci class=\"wbw__term\"\u003egaura\u003c/i\u003e–dourado \u003ci class=\"wbw__term\"\u003enāmne\u003c/i\u003e–conhecido pelo nome \u003ci class=\"wbw__term\"\u003ekṛṣṇa-chaitanya\u003c/i\u003e–‘Kṛṣṇa Chaitanya’.\u003c/p\u003e\n\u003cp class=\"translation\"\u003e\u003ci\u003e(Śrī Chaitanya-charitāmṛta: Madhya-līlā, 19.53)\u003c/i\u003e\u003cbr\u003e\nRepetidamente ofereço minha reverência a Você, o supremamente misericordioso doador de Kṛṣṇa-prema, Kṛṣṇa Ele mesmo em brilho dourado conhecido como Śrī Kṛṣṇa Chaitanya.\u003cbr\u003e\n\u003ci\u003e(Śrīla Rūpa Goswāmī Prabhu)\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jayatam-suratau-pangor\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī-Śrī-Guru-Gaurāṅga-Rādhā-Madana-Mohanjīu \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejayatāṁ suratau paṅgor mama manda-mater gatī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emat-sarvasva-padāmbhojau rādhā-madana-mohanau\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ejayatām\u003c/i\u003e–Glória \u003ci class=\"wbw__term\"\u003esuratau\u003c/i\u003e–aos misericordiosos \u003ci class=\"wbw__term\"\u003erādhā\u003c/i\u003e–Rādhā [e] \u003ci class=\"wbw__term\"\u003emohanau\u003c/i\u003e–o encantador \u003ci class=\"wbw__term\"\u003emadana\u003c/i\u003e–do Cupido. [Eles são] \u003ci class=\"wbw__term\"\u003egatī\u003c/i\u003e–o abrigo \u003ci class=\"wbw__term\"\u003epaṅgoḥ\u003c/i\u003e–deste corpo aleijado [e de] \u003ci class=\"wbw__term\"\u003emama\u003c/i\u003e–minha \u003ci class=\"wbw__term\"\u003emanda\u003c/i\u003e–perversa \u003ci class=\"wbw__term\"\u003emateḥ\u003c/i\u003e–mente. [Seus] \u003ci class=\"wbw__term\"\u003epada\u003c/i\u003e–pés [de] \u003ci class=\"wbw__term\"\u003eambhojau\u003c/i\u003e–lótus [são] \u003ci class=\"wbw__term\"\u003esarvasva\u003c/i\u003e–tudo [para] \u003ci class=\"wbw__term\"\u003emat\u003c/i\u003e–mim.\u003c/p\u003e\n\u003cp class=\"translation\"\u003e\u003ci\u003e(Śrī Chaitanya-charitāmṛta: Ādi-līlā, 1.15)\u003c/i\u003e\u003cbr\u003e\nGlória aos misericordiosos Śrī Śrī Rādhā–Madan Mohan! Eles são o abrigo deste corpo aleijado e de minha mente perversa. Seus pés de lótus são tudo para mim.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-divyad-vrindaranya-kalpa-drumadhah\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī-Śrī-Guru-Gaurāṅga-Gāndharvā-Govindasundarjīu \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edīvyad-vṛndāraṇya-kalpa-drumādhaḥ-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrīmad-ratnāgāra-siṁhāsana-sthau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī gāndharvā-śrīla-govinda-devau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epreṣṭhālībhiḥ sevyamānau smarāmi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003esmarāmi\u003c/i\u003e–Eu medito \u003ci class=\"wbw__term\"\u003eśrī-gāndharvā\u003c/i\u003e–em Śrī Gāndharvā [e] \u003ci class=\"wbw__term\"\u003eśrīla-govinda-devau\u003c/i\u003e–Śrī Govindadev [como Eles são] \u003ci class=\"wbw__term\"\u003esevyamānau\u003c/i\u003e–adorados [por Suas] \u003ci class=\"wbw__term\"\u003epreṣṭha\u003c/i\u003e–queridas \u003ci class=\"wbw__term\"\u003eālībhiḥ\u003c/i\u003e–amigas [e] \u003ci class=\"wbw__term\"\u003esthau\u003c/i\u003e–situados \u003ci class=\"wbw__term\"\u003esiṁha-āsana\u003c/i\u003e–em um ’assento de leão’ [em] \u003ci class=\"wbw__term\"\u003eśrīmat\u003c/i\u003e–uma bela \u003ci class=\"wbw__term\"\u003eāgāra\u003c/i\u003e–morada \u003ci class=\"wbw__term\"\u003eratna\u003c/i\u003e–de joias [embaixo] \u003ci class=\"wbw__term\"\u003ekalpa-drumādhaḥ\u003c/i\u003e–das árvores realizadoras dos desejos \u003ci class=\"wbw__term\"\u003edīvyad\u003c/i\u003e–da divina \u003ci class=\"wbw__term\"\u003eāraṇya\u003c/i\u003e–floresta \u003ci class=\"wbw__term\"\u003evṛndā\u003c/i\u003e–Vṛndā.\u003c/p\u003e\n\u003cp class=\"translation\"\u003e\u003ci\u003e(Śrī Chaitanya-charitāmṛta: Ādi-līlā, 1.16)\u003c/i\u003e\u003cbr\u003e\nEu medito em Śrī Śrī Gāndharvā–Govindadev sendo adorados por Suas queridas amigas sentados em um trono dentro de uma bela morada adornada de joias, sob as árvores realizadoras dos desejos da floresta Vṛndā.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shriman-rasa-rasarambhi\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī-Śrī-Guru-Gaurāṅga-Rādhā-Gopīnāthjīu \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrīmān rāsa-rasārambhī vaṁśī-vaṭa-taṭa-sthitaḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekarṣan veṇu-svanair gopīr gopīnāthaḥ śriye ’stu naḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Que] \u003ci class=\"wbw__term\"\u003egopīnāthaḥ\u003c/i\u003e–o Senhor das gopīs, \u003ci class=\"wbw__term\"\u003eśrīmān\u003c/i\u003e–o belo \u003ci class=\"wbw__term\"\u003eārambhī\u003c/i\u003e–instigador \u003ci class=\"wbw__term\"\u003erasa\u003c/i\u003e–do sabor \u003ci class=\"wbw__term\"\u003erāsa\u003c/i\u003e–da Dança Rāsa [que] \u003ci class=\"wbw__term\"\u003esthitaḥ\u003c/i\u003e–está \u003ci class=\"wbw__term\"\u003etaṭa\u003c/i\u003e–às margens do rio \u003ci class=\"wbw__term\"\u003evaṁśī-vaṭa\u003c/i\u003e–embaixo da ‘árvore flauta’ (a sagrada figueira onde Ele toca Sua flauta) [e] \u003ci class=\"wbw__term\"\u003ekarṣan\u003c/i\u003e–atrai \u003ci class=\"wbw__term\"\u003egopīḥ\u003c/i\u003e–as gopīs \u003ci class=\"wbw__term\"\u003esvanaiḥ\u003c/i\u003e–com o som \u003ci class=\"wbw__term\"\u003eveṇu\u003c/i\u003e–de [Sua] flauta, \u003ci class=\"wbw__term\"\u003eastu\u003c/i\u003e–conceda \u003ci class=\"wbw__term\"\u003eśriye\u003c/i\u003e–boa fortuna \u003ci class=\"wbw__term\"\u003enaḥ\u003c/i\u003e–a nós.\u003c/p\u003e\n\u003cp class=\"translation\"\u003e\u003ci\u003e(Śrī Chaitanya-charitāmṛta: Ādi-līlā, 1.17)\u003c/i\u003e\u003cbr\u003e\nQue Gopīnāth, o belo instigador da Dança Rāsa, que está às margens do rio em Vaṁśī Vaṭ e que atrai as gopīs com o som de Sua flauta, conceda boa fortuna a nós.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vrindayai-tulasi-devyai\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003evṛndāyai tulasī-devyai \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evṛndāyai tulasī-devyai priyāyai keśavasya cha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-bhakti-prade devi satyavatyai namo namaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003edevi\u003c/i\u003e–Ó Deusa! \u003ci class=\"wbw__term\"\u003eprade\u003c/i\u003e–Ó Você que é a outorgadora \u003ci class=\"wbw__term\"\u003ebhakti\u003c/i\u003e–de devoção \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–a Kṛṣṇa! \u003ci class=\"wbw__term\"\u003enamaḥ\u003c/i\u003e–Eu ofereço [minha] reverência [e] \u003ci class=\"wbw__term\"\u003enamaḥ\u003c/i\u003e–Eu ofereço [minha] reverência [repetidamente a você] \u003ci class=\"wbw__term\"\u003evṛndāyai\u003c/i\u003e–Vṛndā Devī, \u003ci class=\"wbw__term\"\u003epriyāyai\u003c/i\u003e–a amada \u003ci class=\"wbw__term\"\u003ekeśavasya\u003c/i\u003e–de Keśava \u003ci class=\"wbw__term\"\u003edevyai\u003c/i\u003e–a deusa [que é conhecida como] \u003ci class=\"wbw__term\"\u003etulasī\u003c/i\u003e–’ela que é incomparável’ \u003ci class=\"wbw__term\"\u003echa\u003c/i\u003e–e \u003ci class=\"wbw__term\"\u003esatyavatyai\u003c/i\u003e–‘ela que é verdadeira’.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Devī, Ó você que concede Kṛṣṇa-bhakti! Eu ofereço minha reverência repetidamente a você, Vṛndā Devī, a amada de Kṛṣṇa, que é conhecida como Tulasī Devī e Satyavatī.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-namah-om-vishnupadaya-krishna\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003ePraṇām Mantra to Śrīla A.C Bhaktivedānta Swāmī Mahārāj Prabhupād \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enamaḥ om viṣṇupādāya kṛṣṇa-preṣṭhāya bhū-tale\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esvāmī-śrī-bhakti-vedānta-prabhupādāya te namaḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egurv-ājñāṁ śirasī dhṛtvā śaktyāveśa-svarūpine\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehare kṛṣṇeti mantreṇa pāśchātya-prāchya-tāriṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eviśvāchārya-pravaryāya divya-kāruṇya-mūrtaye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-bhāgavata-mādhurya-gītā-jñāna-pradāyine\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaura-śrī-rūpa-siddhānta-sarasvatī-niṣevine\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhā-kṛṣṇa-padāmbhoja-bhṛṅgāya gurave namaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003enamaḥ\u003c/i\u003e–Eu ofereço minha reverência ao \u003ci class=\"wbw__term\"\u003eom\u003c/i\u003e–reverenciado \u003ci class=\"wbw__term\"\u003eviṣṇupādāya\u003c/i\u003e–representante de Viṣṇu \u003ci class=\"wbw__term\"\u003epreṣṭhāya\u003c/i\u003e–o mais querido \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–de Kṛṣṇa \u003ci class=\"wbw__term\"\u003etale\u003c/i\u003e–na superfície \u003ci class=\"wbw__term\"\u003ebhū\u003c/i\u003e–da Terra, \u003ci class=\"wbw__term\"\u003esvāmī-śrī-bhakti-vedānta-prabhupādāya\u003c/i\u003e–Śrīla Bhaktivedānta Swāmī Prabhupād. \u003ci class=\"wbw__term\"\u003enamaḥ\u003c/i\u003e–Eu ofereço minha reverência \u003ci class=\"wbw__term\"\u003ete\u003c/i\u003e–a ele, [que,] \u003ci class=\"wbw__term\"\u003edhṛtvā\u003c/i\u003e–segurando \u003ci class=\"wbw__term\"\u003eājñām\u003c/i\u003e–a ordem \u003ci class=\"wbw__term\"\u003eguru\u003c/i\u003e–de [seu] Guru (Śrīla Bhakti Siddhānta Saraswatī Ṭhākur) \u003ci class=\"wbw__term\"\u003eśirasī\u003c/i\u003e–em [sua] cabeça, [se tornou] \u003ci class=\"wbw__term\"\u003esvarūpine\u003c/i\u003e–a manifestação \u003ci class=\"wbw__term\"\u003eāveśa\u003c/i\u003e–infundida \u003ci class=\"wbw__term\"\u003eśaktyā\u003c/i\u003e–com energia [divina, que com o] \u003ci class=\"wbw__term\"\u003emantreṇa\u003c/i\u003e–mahāmantra \u003ci class=\"wbw__term\"\u003ehare kṛṣṇa iti\u003c/i\u003e–Hare Kṛṣṇa [é] \u003ci class=\"wbw__term\"\u003etāriṇe\u003c/i\u003e–o libertador \u003ci class=\"wbw__term\"\u003epāśchātya\u003c/i\u003e–do Ocidente [e] \u003ci class=\"wbw__term\"\u003eprāchya\u003c/i\u003e–[do] Oriente, [que é] \u003ci class=\"wbw__term\"\u003epravaryāya\u003c/i\u003e–o preeminente \u003ci class=\"wbw__term\"\u003eāchārya\u003c/i\u003e–Āchārya [do] \u003ci class=\"wbw__term\"\u003eviśva\u003c/i\u003e–mundo [que é] \u003ci class=\"wbw__term\"\u003emūrtaye\u003c/i\u003e–a personificação [da] \u003ci class=\"wbw__term\"\u003ekāruṇya\u003c/i\u003e–graça \u003ci class=\"wbw__term\"\u003edivya\u003c/i\u003e–divina [que é] \u003ci class=\"wbw__term\"\u003epradāyine\u003c/i\u003e–o doador [da] \u003ci class=\"wbw__term\"\u003emādhurya\u003c/i\u003e–doçura [do] \u003ci class=\"wbw__term\"\u003eśrī-bhāgavata\u003c/i\u003e–\u003ci\u003eŚrīmad Bhāgavatam,\u003c/i\u003e [da] \u003ci class=\"wbw__term\"\u003ejñāna\u003c/i\u003e–sabedoria \u003ci class=\"wbw__term\"\u003egītā\u003c/i\u003e–do \u003ci\u003eŚrīmad Bhagavad-gītā\u003c/i\u003e [que é] \u003ci class=\"wbw__term\"\u003eniṣevine\u003c/i\u003e–sempre engajado no serviço \u003ci class=\"wbw__term\"\u003egaura\u003c/i\u003e–a Śrī Gaura \u003ci class=\"wbw__term\"\u003eśrī-rūpa\u003c/i\u003e–Śrī Rūpa [e] \u003ci class=\"wbw__term\"\u003esiddhānta-sarasvatī\u003c/i\u003e–Śrīla Bhakti Siddhānta Saraswatī Ṭhākur [e que é] \u003ci class=\"wbw__term\"\u003ebhṛṅgāya\u003c/i\u003e–uma abelha [aos] \u003ci class=\"wbw__term\"\u003epada\u003c/i\u003e–pés [de] \u003ci class=\"wbw__term\"\u003eambhoja\u003c/i\u003e–lótus \u003ci class=\"wbw__term\"\u003erādhā-kṛṣṇa\u003c/i\u003e–de Rādhā-Kṛṣṇa \u003ci class=\"wbw__term\"\u003enamaḥ\u003c/i\u003e–Eu ofereço minha reverência \u003ci class=\"wbw__term\"\u003egurave\u003c/i\u003e–ao [meu] Guru.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu ofereço minha reverência ao meu Guru, o mais querido de Kṛṣṇa nesta Terra, Om Viṣṇupād Śrīla A.C. Bhaktivedānta Swāmī Prabhupād. Levando a ordem de seu Guru em sua cabeça, ele se tornou um śaktyāveś-avatār (de Nityānanda Prabhu) e com o Hare Kṛṣṇa mahāmantra ele libertou o Oriente e o Ocidente. Ele é o Āchārya preeminente do mundo e a personificação da graça divina. Ele é o doador da doçura do \u003ci\u003eŚrīmad Bhāgavatam\u003c/i\u003e e da sabedoria do \u003ci\u003eŚrīmad Bhagavad-gītā\u003c/i\u003e. Ele é sempre engajado no serviço a Śrī Gaura, Śrī Rūpa, e Śrīla Bhakti Siddhānta Saraswatī Ṭhākur, e ele é uma abelha aos pés de lótus de Śrī Śrī Rādhā–Kṛṣṇa.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eatha natvā mantra-gurūn gurūn bhāgavatārthadān\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evyāsān jagad-gurūn natvā tato jayam udīrayet\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eatha\u003c/i\u003e–Portanto \u003ci class=\"wbw__term\"\u003enatvā\u003c/i\u003e–tendo oferecido reverência \u003ci class=\"wbw__term\"\u003emantra-gurūn\u003c/i\u003e–aos mestres divinos que outorgam mantras [e] \u003ci class=\"wbw__term\"\u003egurūn\u003c/i\u003e–aos mestres divino [que] \u003ci class=\"wbw__term\"\u003edān\u003c/i\u003e–ensinam \u003ci class=\"wbw__term\"\u003eartha\u003c/i\u003e–o significado \u003ci class=\"wbw__term\"\u003ebhāgavata\u003c/i\u003e–do \u003ci\u003eŚrīmad Bhāgavatam\u003c/i\u003e [e] \u003ci class=\"wbw__term\"\u003enatvā\u003c/i\u003e–tendo oferecido reverência \u003ci class=\"wbw__term\"\u003evyāsān\u003c/i\u003e–aos expositores (das escrituras reveladas) [que são] \u003ci class=\"wbw__term\"\u003egurūn\u003c/i\u003e–os mestres \u003ci class=\"wbw__term\"\u003ejagat\u003c/i\u003e–de todo o universo \u003ci class=\"wbw__term\"\u003etataḥ\u003c/i\u003e–o orador \u003ci class=\"wbw__term\"\u003eudīrayet\u003c/i\u003e–deveria dizer \u003ci class=\"wbw__term\"\u003ejayam\u003c/i\u003e–’Jay!’ [Glória!].\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEntão, tendo oferecido reverência aos Gurus que outorgam mantras e aos Gurus que ensinam o significado do \u003ci\u003eŚrīmad Bhāgavatam\u003c/i\u003e, e tendo oferecido reverência aos Vyāsas, que são os Gurus de todo o universo, deveria-se dizer: “Jay!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejayaḥ sa-parikara śrī-śrī-guru-gaurāṅga-gāndharvā-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;govindasundar-pādapadmānāṁ jayastu!\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ejayaḥ\u003c/i\u003e–Glória \u003ci class=\"wbw__term\"\u003epāda\u003c/i\u003e–aos pés \u003ci class=\"wbw__term\"\u003epadmānāṁ\u003c/i\u003e–de lótus \u003ci class=\"wbw__term\"\u003eśrī-guru\u003c/i\u003e–dos mestres divinos, \u003ci class=\"wbw__term\"\u003eśrī-gaurāṅga\u003c/i\u003e–Śrī Gaurāṅga, [e] \u003ci class=\"wbw__term\"\u003egāndharvā-govindasundara\u003c/i\u003e–Śrī Śrī Gāndharvā–Govindasundar, \u003ci class=\"wbw__term\"\u003esa\u003c/i\u003e–juntamente com [todos os Seus] \u003ci class=\"wbw__term\"\u003eparikara\u003c/i\u003e–associados! \u003ci class=\"wbw__term\"\u003ejayastu!\u003c/i\u003e–Que eles sejam vitoriosos!\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória aos pés de lótus de Śrī Guru, Śrī Gaurasundar, Śrī Śrī Gāndharvā–Govindasundar, e todos os Seus associados!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jayah-sa-parikara-shri-shri-guru-gaurangasundar\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī Guru, Śrī Gaurasundar, Śrī Śrī Rādhā–Madan Gopāl \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejayaḥ sa-parikara śrī-śrī-guru-gaurāṅgasundar-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rādhā-madan-gopāl-pādapadmānāṁ jayastu!\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ejayaḥ\u003c/i\u003e–Glória \u003ci class=\"wbw__term\"\u003epāda\u003c/i\u003e–aos pés \u003ci class=\"wbw__term\"\u003epadmānāṁ\u003c/i\u003e–de lótus \u003ci class=\"wbw__term\"\u003eśrī-guru\u003c/i\u003e–dos mestres divinos, \u003ci class=\"wbw__term\"\u003eśrī-gaurāṅgasundar\u003c/i\u003e–Śrī Gaurāṅgasundar, [e] \u003ci class=\"wbw__term\"\u003erādhā-madan-gopāl\u003c/i\u003e–Śrī Śrī Rādhā–Madan Gopāl, \u003ci class=\"wbw__term\"\u003esa\u003c/i\u003e–juntamente com [todos os Seus] \u003ci class=\"wbw__term\"\u003eparikara\u003c/i\u003e–associados! \u003ci class=\"wbw__term\"\u003ejayastu!\u003c/i\u003e–Que eles sejam vitoriosos!\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória aos pés de lótus de Śrī Guru, Śrī Gaurasundar, Śrī Śrī Rādhā–Madan Gopāl, e todos os Seus associados!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-krishna-chaitanya-prabhu-nityananda\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003ePañcha-tattva mantra \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-kṛṣṇa-chaitanya prabhu nityānanda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-advaita gadādhara śrīvāsādi gaura-bhakta-vṛnda\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hare-krishna-hare-krishna-krishna-krishna-hare-hare\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eHare Krishna mahāmantra \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehare kṛṣṇa hare kṛṣṇa kṛṣṇa kṛṣṇa hare hare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehare rāma hare rāma rāma rāma hare hare\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eManhã\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-samsara-davanala-lidha-loka\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śrī Gurvāṣṭakam \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Viśvanāth Chakravartī Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esaṁsāra-dāvānala-līḍha-loka\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etrāṇāya kāruṇya-ghanāghanatvam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprāptasya kalyāṇa-guṇārṇavasya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇāravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003evande\u003c/i\u003e–Eu ofereço [minha] reverência \u003ci class=\"wbw__term\"\u003eśrī\u003c/i\u003e–aos sagrados \u003ci class=\"wbw__term\"\u003echaraṇa\u003c/i\u003e–pés [de] \u003ci class=\"wbw__term\"\u003earavindam\u003c/i\u003e–lótus \u003ci class=\"wbw__term\"\u003eguroḥ\u003c/i\u003e–do mestre divino, \u003ci class=\"wbw__term\"\u003earṇavasya\u003c/i\u003e–o oceano \u003ci class=\"wbw__term\"\u003ekalyāṇa\u003c/i\u003e–de auspiciosas \u003ci class=\"wbw__term\"\u003eguṇa\u003c/i\u003e–qualidades [que] \u003ci class=\"wbw__term\"\u003eprāptasya\u003c/i\u003e–toma \u003ci class=\"wbw__term\"\u003eghanāghanatvam\u003c/i\u003e–a forma de uma nuvem densa \u003ci class=\"wbw__term\"\u003ekāruṇya\u003c/i\u003e–de compaixão \u003ci class=\"wbw__term\"\u003etrāṇāya\u003c/i\u003e–para liberar [as] \u003ci class=\"wbw__term\"\u003eloka\u003c/i\u003e–almas \u003ci class=\"wbw__term\"\u003elīḍha\u003c/i\u003e–engolidas \u003ci class=\"wbw__term\"\u003edāva\u003c/i\u003e–pela floresta [do] \u003ci class=\"wbw__term\"\u003eanala\u003c/i\u003e–fogo \u003ci class=\"wbw__term\"\u003esaṁsāra\u003c/i\u003e–da existência material.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOfereço minha reverência aos pés de lótus de Śrī Guru, o oceano de qualidades auspiciosas que assume a forma de uma densa nuvem de misericórdia para liberar as almas engolidas pelo fogo da floresta da existência material.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emahāprabhoḥ kīrtana-nṛtya-gīta-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evāditra-mādyan-manaso rasena\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eromāñcha-kampāśru-taraṅga-bhājo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇāravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003evande\u003c/i\u003e–Eu ofereço [minha] reverência \u003ci class=\"wbw__term\"\u003eśrī\u003c/i\u003e–aos sagrados \u003ci class=\"wbw__term\"\u003echaraṇa\u003c/i\u003e–pés \u003ci class=\"wbw__term\"\u003earavindam\u003c/i\u003e–de lótus \u003ci class=\"wbw__term\"\u003eguroḥ\u003c/i\u003e–do mestre divino, [que se torna] \u003ci class=\"wbw__term\"\u003emādyat\u003c/i\u003e–extático \u003ci class=\"wbw__term\"\u003emanasaḥ\u003c/i\u003e–no coração \u003ci class=\"wbw__term\"\u003ekīrtana\u003c/i\u003e–ao cantar, \u003ci class=\"wbw__term\"\u003enṛtya\u003c/i\u003e–dançar, \u003ci class=\"wbw__term\"\u003egīta\u003c/i\u003e–cantar, [e tocar] \u003ci class=\"wbw__term\"\u003evāditra\u003c/i\u003e–instrumentos musicais \u003ci class=\"wbw__term\"\u003emahāprabhoḥ\u003c/i\u003e–para Mahāprabhu [e] \u003ci class=\"wbw__term\"\u003erasena\u003c/i\u003e–com o [sabor] do rasa \u003ci class=\"wbw__term\"\u003ebhājaḥ\u003c/i\u003e–experimenta \u003ci class=\"wbw__term\"\u003etaraṅga\u003c/i\u003e–ondas \u003ci class=\"wbw__term\"\u003eromāñcha\u003c/i\u003e–de arrepios, \u003ci class=\"wbw__term\"\u003ekampa\u003c/i\u003e–tremor, [e] \u003ci class=\"wbw__term\"\u003eaśru\u003c/i\u003e–lágrimas.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOfereço minha reverência aos pés de lótus de Śrī Guru, que se torna extático ao entoar, dançar, cantar e tocar instrumentos para Śrīman Mahāprabhu, e que com o sabor do rasa experimenta ondas de arrepios, tremor e lágrimas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-vigrahārādhana-nitya-nānā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśṛṅgāra-tan-mandira-mārjanādau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyuktasya bhaktāṁś cha niyuñjato ’pi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇāravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003evande\u003c/i\u003e–Eu ofereço [minha] reverência \u003ci class=\"wbw__term\"\u003eśrī\u003c/i\u003e–aos sagrados \u003ci class=\"wbw__term\"\u003echaraṇa\u003c/i\u003e–pés [de] \u003ci class=\"wbw__term\"\u003earavindam\u003c/i\u003e–lótus \u003ci class=\"wbw__term\"\u003eguroḥ\u003c/i\u003e–do mestre divino, [que] \u003ci class=\"wbw__term\"\u003eyuktasya\u003c/i\u003e–[se] engaja \u003ci class=\"wbw__term\"\u003echa\u003c/i\u003e–e \u003ci class=\"wbw__term\"\u003eapi\u003c/i\u003e–também \u003ci class=\"wbw__term\"\u003eniyuñjataḥ\u003c/i\u003e–engaja [os] \u003ci class=\"wbw__term\"\u003ebhaktān\u003c/i\u003e–devotos [em] \u003ci class=\"wbw__t
