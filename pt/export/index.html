erm\"\u003eārādhana\u003c/i\u003e–adoração \u003ci class=\"wbw__term\"\u003enitya\u003c/i\u003e–diária \u003ci class=\"wbw__term\"\u003eśrī-vigraha\u003c/i\u003e–da Deidade, [oferecendo] \u003ci class=\"wbw__term\"\u003enānā\u003c/i\u003e–vários [tipos de] \u003ci class=\"wbw__term\"\u003eśṛṅgāra\u003c/i\u003e–roupas elegantes [à Deidade], \u003ci class=\"wbw__term\"\u003emārjana\u003c/i\u003e–limpando \u003ci class=\"wbw__term\"\u003emandira\u003c/i\u003e–o Templo \u003ci class=\"wbw__term\"\u003etat\u003c/i\u003e–da Deidade [e] \u003ci class=\"wbw__term\"\u003eādau\u003c/i\u003e–assim por diante.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOfereço minha reverência aos pés de lótus de Śrī Guru, que se engaja e engaja os devotos em adorações diárias da Deidade, vestindo a Deidade com vários tipos de roupas elegantes, limpando o Templo da Deidade, e realizando outros serviços devocionais.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echatur-vidha-śrī-bhagavat-prasāda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esvādv-anna-tṛptān hari-bhakta-saṅghān\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛtvaiva tṛptiṁ bhajataḥ sadaiva\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇāravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003evande\u003c/i\u003e–Eu ofereço [minha] reverência \u003ci class=\"wbw__term\"\u003eśrī\u003c/i\u003e–aos sagrados \u003ci class=\"wbw__term\"\u003echaraṇa\u003c/i\u003e–pés [de] \u003ci class=\"wbw__term\"\u003earavindam\u003c/i\u003e–lótus \u003ci class=\"wbw__term\"\u003eguroḥ\u003c/i\u003e–do mestre divino, [que] \u003ci class=\"wbw__term\"\u003esadā eva\u003c/i\u003e–sempre [são] \u003ci class=\"wbw__term\"\u003ebhajataḥ\u003c/i\u003e–um recipiente \u003ci class=\"wbw__term\"\u003etṛptim\u003c/i\u003e–de satisfação \u003ci class=\"wbw__term\"\u003eeva\u003c/i\u003e–apenas \u003ci class=\"wbw__term\"\u003ekṛtvā\u003c/i\u003e–ao fazer \u003ci class=\"wbw__term\"\u003esaṅghān\u003c/i\u003e–a assembléia \u003ci class=\"wbw__term\"\u003ebhakta\u003c/i\u003e–dos devotos \u003ci class=\"wbw__term\"\u003ehari\u003c/i\u003e–do Senhor \u003ci class=\"wbw__term\"\u003etṛptān\u003c/i\u003e–satisfeita \u003ci class=\"wbw__term\"\u003esvādu\u003c/i\u003e–com saborosa \u003ci class=\"wbw__term\"\u003eanna\u003c/i\u003e–comida [na forma dos] \u003ci class=\"wbw__term\"\u003echatur\u003c/i\u003e–quatro \u003ci class=\"wbw__term\"\u003evidha\u003c/i\u003e–tipos [de] \u003ci class=\"wbw__term\"\u003eprasāda\u003c/i\u003e–prasādam \u003ci class=\"wbw__term\"\u003eśrī-bhagavat\u003c/i\u003e–do Senhor.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOfereço minha reverência aos pés de lótus de Śrī Guru, que é sempre satisfeito ao satisfazer os devotos do Senhor com saborosa comida na forma dos quatro tipos de prasādam do Senhor.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-rādhikā-mādhavayor apāra-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emādhurya-līlā-guṇa-rūpa-nāmnām\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprati-kṣaṇāsvādana-lolupasya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇāravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003evande\u003c/i\u003e–Eu ofereço [minha] reverência \u003ci class=\"wbw__term\"\u003eśrī\u003c/i\u003e–aos sagrados \u003ci class=\"wbw__term\"\u003echaraṇa\u003c/i\u003e–pés [de] \u003ci class=\"wbw__term\"\u003earavindam\u003c/i\u003e–lótus \u003ci class=\"wbw__term\"\u003eguroḥ\u003c/i\u003e–do mestre divino, [que é] \u003ci class=\"wbw__term\"\u003elolupasya\u003c/i\u003e–ávido [a] \u003ci class=\"wbw__term\"\u003eprati\u003c/i\u003e–cada \u003ci class=\"wbw__term\"\u003ekṣaṇa\u003c/i\u003e–momento \u003ci class=\"wbw__term\"\u003eāsvādana\u003c/i\u003e–para saborear \u003ci class=\"wbw__term\"\u003eapāra\u003c/i\u003e–os ilimitados \u003ci class=\"wbw__term\"\u003emādhurya\u003c/i\u003e–doces \u003ci class=\"wbw__term\"\u003enāmnām\u003c/i\u003e–Nomes, \u003ci class=\"wbw__term\"\u003erūpa\u003c/i\u003e–Formas, \u003ci class=\"wbw__term\"\u003eguṇa\u003c/i\u003e–Qualidades, [e] \u003ci class=\"wbw__term\"\u003elīlā\u003c/i\u003e–Passatempos [de] \u003ci class=\"wbw__term\"\u003eśrī-rādhikā\u003c/i\u003e–Śrī Rādhikā [e] \u003ci class=\"wbw__term\"\u003emādhavayoḥ\u003c/i\u003e–Mādhava.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOfereço minha reverência aos pés de lótus de Śrī Guru, que está sempre ávido para saborear os ilimitados doces Nomes, Formas, Qualidades e Passatempos de Śrī Śrī Rādhikā–Mādhava.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enikuñja-yūno rati-keli-siddhyair\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyā yālibhir yuktir apekṣaṇīyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etatrāti-dākṣyād ati-vallabhasya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇāravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003evande\u003c/i\u003e–Eu ofereço [minha] reverência \u003ci class=\"wbw__term\"\u003eśrī\u003c/i\u003e–aos sagrados \u003ci class=\"wbw__term\"\u003echaraṇa\u003c/i\u003e–pés [de] \u003ci class=\"wbw__term\"\u003earavindam\u003c/i\u003e–lótus \u003ci class=\"wbw__term\"\u003eguroḥ\u003c/i\u003e–do mestre divino, [que é] \u003ci class=\"wbw__term\"\u003eati\u003c/i\u003e–muito \u003ci class=\"wbw__term\"\u003edākṣyāt\u003c/i\u003e–\u003ci\u003eexpertise\u003c/i\u003e \u003ci class=\"wbw__term\"\u003etatra\u003c/i\u003e–na \u003ci class=\"wbw__term\"\u003eyuktiḥ\u003c/i\u003e–arte \u003ci class=\"wbw__term\"\u003eyā yā\u003c/i\u003e–particular \u003ci class=\"wbw__term\"\u003eapekṣaṇīyā\u003c/i\u003e–requerida \u003ci class=\"wbw__term\"\u003eālibhiḥ\u003c/i\u003e–pelas amigas [para] \u003ci class=\"wbw__term\"\u003esiddhyaiḥ\u003c/i\u003e–provocar [a] \u003ci class=\"wbw__term\"\u003ekeli\u003c/i\u003e–Brincadeira [de] \u003ci class=\"wbw__term\"\u003erati\u003c/i\u003e–Amor [do] \u003ci class=\"wbw__term\"\u003eyūnaḥ\u003c/i\u003e–Casal [na] \u003ci class=\"wbw__term\"\u003enikuñja\u003c/i\u003e–Floresta, [e é portanto] \u003ci class=\"wbw__term\"\u003eati\u003c/i\u003e–muito \u003ci class=\"wbw__term\"\u003evallabhasya\u003c/i\u003e–querido [Delas].\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOfereço minha reverência aos pés de lótus de Śrī Guru, que é muito especialista na arte particular requerida pelas gopīs para dar início à Brincadeira Amorosa do Casal na Floresta, e é portanto, muito querido Delas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esākṣād-dharitvena samasta-śāstrair\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003euktas tathā bhāvyata eva sadbhiḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekintu prabhor yaḥ priya eva tasya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇāravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003evande\u003c/i\u003e–Eu ofereço [minha] reverência \u003ci class=\"wbw__term\"\u003eśrī\u003c/i\u003e–aos sagrados \u003ci class=\"wbw__term\"\u003echaraṇa\u003c/i\u003e–pés [de] \u003ci class=\"wbw__term\"\u003earavindam\u003c/i\u003e–lótus \u003ci class=\"wbw__term\"\u003eguroḥ\u003c/i\u003e–do mestre divino, \u003ci class=\"wbw__term\"\u003etasya\u003c/i\u003e–ele \u003ci class=\"wbw__term\"\u003eyaḥ\u003c/i\u003e–que [é] \u003ci class=\"wbw__term\"\u003euktaḥ\u003c/i\u003e–dito [por] \u003ci class=\"wbw__term\"\u003esamasta\u003c/i\u003e–todas \u003ci class=\"wbw__term\"\u003eśāstraiḥ\u003c/i\u003e–as escrituras [como estando] \u003ci class=\"wbw__term\"\u003eharitvena\u003c/i\u003e–na posição do Senhor \u003ci class=\"wbw__term\"\u003esākṣāt\u003c/i\u003e–Ele mesmo [e] \u003ci class=\"wbw__term\"\u003etathā\u003c/i\u003e–então \u003ci class=\"wbw__term\"\u003ebhāvyataḥ\u003c/i\u003e–considerado \u003ci class=\"wbw__term\"\u003eeva\u003c/i\u003e–também \u003ci class=\"wbw__term\"\u003esadbhiḥ\u003c/i\u003e–pelos sādhus \u003ci class=\"wbw__term\"\u003ekintu\u003c/i\u003e–ainda [é] \u003ci class=\"wbw__term\"\u003eeva\u003c/i\u003e–na verdade \u003ci class=\"wbw__term\"\u003epriyaḥ\u003c/i\u003e–alguém querido \u003ci class=\"wbw__term\"\u003eprabhoḥ\u003c/i\u003e–do Senhor.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOfereço minha reverência aos pés de lótus de Śrī Guru. Ele é dito por todas as escrituras como sendo o Senhor Ele mesmo, portanto, considerado assim pelos sādhus. E além disso, ele é de fato, alguém querido do Senhor.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyasya prasādād bhagavat-prasādo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyasyāprasādān na gatiḥ kuto ’pi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhyāyaṁ stuvaṁs tasya yaśas tri-sandhyaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇāravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003evande\u003c/i\u003e–Eu ofereço [minha] reverência \u003ci class=\"wbw__term\"\u003eśrī\u003c/i\u003e–aos sagrados \u003ci class=\"wbw__term\"\u003echaraṇa\u003c/i\u003e–pés [de] \u003ci class=\"wbw__term\"\u003earavindam\u003c/i\u003e–lótus \u003ci class=\"wbw__term\"\u003eguroḥ\u003c/i\u003e–do mestre divino \u003ci class=\"wbw__term\"\u003edhyāyan\u003c/i\u003e–meditando nele [e] \u003ci class=\"wbw__term\"\u003estuvan\u003c/i\u003e–louvando [a] \u003ci class=\"wbw__term\"\u003eyaśaḥ\u003c/i\u003e–glória \u003ci class=\"wbw__term\"\u003etasya\u003c/i\u003e–dele \u003ci class=\"wbw__term\"\u003etri-sandhyam\u003c/i\u003e–nas três junções [do dia, por] \u003ci class=\"wbw__term\"\u003eyasya\u003c/i\u003e–cuja \u003ci class=\"wbw__term\"\u003eprasādāt\u003c/i\u003e–graça [alguém ganha] \u003ci class=\"wbw__term\"\u003eprasādaḥ\u003c/i\u003e–a graça \u003ci class=\"wbw__term\"\u003ebhagavat\u003c/i\u003e–do Senhor, [e] \u003ci class=\"wbw__term\"\u003eaprasādāt\u003c/i\u003e–sem a graça \u003ci class=\"wbw__term\"\u003eyasya\u003c/i\u003e–de quem \u003ci class=\"wbw__term\"\u003ena\u003c/i\u003e–não [se tem] \u003ci class=\"wbw__term\"\u003egatiḥ\u003c/i\u003e–abrigo \u003ci class=\"wbw__term\"\u003ekutaḥ api\u003c/i\u003e–em lugar nenhum.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOfereço minha reverência aos pés de lótus de Śrī Guru, meditando nele, e louvando sua glória nas três junções do dia. Pela graça dele, ganhamos a graça do Senhor. Sem a graça dele, ninguém tem abrigo em lugar algum.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrīmad guroraṣṭakam etad uchchair\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebrāhme muhūrte paṭhati prayātnāt\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyas tena vṛndāvana-nātha-sākṣāt\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esevaiva labhyā januṣo ’nta eva\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003esevā\u003c/i\u003e–Serviço \u003ci class=\"wbw__term\"\u003esākṣāt\u003c/i\u003e–direto \u003ci class=\"wbw__term\"\u003enātha\u003c/i\u003e–ao Senhor \u003ci class=\"wbw__term\"\u003evṛndāvana\u003c/i\u003e–de Vṛndāvan [é] \u003ci class=\"wbw__term\"\u003eeva\u003c/i\u003e–certamente \u003ci class=\"wbw__term\"\u003elabhyā\u003c/i\u003e–conseguido \u003ci class=\"wbw__term\"\u003eanta\u003c/i\u003e–no final \u003ci class=\"wbw__term\"\u003ejanuṣaḥ\u003c/i\u003e–da vida \u003ci class=\"wbw__term\"\u003etena\u003c/i\u003e–por aquele \u003ci class=\"wbw__term\"\u003eyaḥ\u003c/i\u003e–que \u003ci class=\"wbw__term\"\u003eprayātnāt\u003c/i\u003e–muito cuidadosamente \u003ci class=\"wbw__term\"\u003epaṭhati\u003c/i\u003e–recita \u003ci class=\"wbw__term\"\u003euchchaiḥ\u003c/i\u003e–em voz alta \u003ci class=\"wbw__term\"\u003eetat\u003c/i\u003e–este \u003ci class=\"wbw__term\"\u003eśrīmat guror aṣṭakam\u003c/i\u003e–Śrī Gurvaṣṭakam \u003ci class=\"wbw__term\"\u003emuhūrte\u003c/i\u003e–durante o período de quarenta e oito minutos \u003ci class=\"wbw__term\"\u003ebrāhme\u003c/i\u003e–chamado ‘Brāhma’ (a porção de um quinzeavos da noite que começa na madrugada).\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAquele que muito cuidadosamente recita em voz alta este Śrī Gurvaṣṭakam durante o brāhma-muhūrta atinge o serviço direto ao Senhor de Vṛndāvan no final da vida.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-krishna-chaitanya-prabhu-jive-daya-kori\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eInvocação Auspiciosa a Śaraṇāgati \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-kṛṣṇa-chaitanya prabhu jīve dayā kari’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esvapārṣada svīya dhāma saha avatari\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003edayā kari’\u003c/i\u003e–Sendo misericordioso [com as] \u003ci class=\"wbw__term\"\u003ejīve\u003c/i\u003e–almas condicionadas \u003ci class=\"wbw__term\"\u003eśrī-kṛṣṇa-chaitanya\u003c/i\u003e–Śrī Gaurasundar [o] \u003ci class=\"wbw__term\"\u003eprabhu\u003c/i\u003e–Senhor \u003ci class=\"wbw__term\"\u003eavatari’\u003c/i\u003e–descendeu \u003ci class=\"wbw__term\"\u003esaha\u003c/i\u003e–acompanhado [de] \u003ci class=\"wbw__term\"\u003esva-pārṣada\u003c/i\u003e–Seus próprios associados [e de] \u003ci class=\"wbw__term\"\u003esvīya\u003c/i\u003e–Sua própria \u003ci class=\"wbw__term\"\u003edhāma\u003c/i\u003e–morada.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSendo misericordioso com as almas, Śrī Kṛṣṇa Chaitanya Mahāprabhu descende acompanhado de Seus associados e de Sua morada.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eatyanta durlabha prema karibāre dāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśikhāya śaraṇāgati bhakatera prāṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekaribāre\u003c/i\u003e–Para poder fazer [a] \u003ci class=\"wbw__term\"\u003edāna\u003c/i\u003e–distribuição [do] \u003ci class=\"wbw__term\"\u003eprema\u003c/i\u003e–amor divino \u003ci class=\"wbw__term\"\u003eatyanta\u003c/i\u003e–extremamente \u003ci class=\"wbw__term\"\u003edurlabha\u003c/i\u003e–raro, precioso, difícil de obter [Ele] \u003ci class=\"wbw__term\"\u003eśikhāya\u003c/i\u003e–ensina \u003ci class=\"wbw__term\"\u003eśaraṇāgati\u003c/i\u003e–rendição [que é] \u003ci class=\"wbw__term\"\u003eprāṇa\u003c/i\u003e–a vida \u003ci class=\"wbw__term\"\u003ebhakatera\u003c/i\u003e–dos devotos.\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePara distribuir a forma mais rara de amor divino, Ele ensina rendição, que é a vida dos devotos.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edainya, ātma-nivedana, goptṛtve varaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘avaśya rakṣibe kṛṣṇa’—viśvāsa pālana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003edainya\u003c/i\u003e–Humildade \u003ci class=\"wbw__term\"\u003eātma\u003c/i\u003e–auto \u003ci class=\"wbw__term\"\u003enivedana\u003c/i\u003e–submissão \u003ci class=\"wbw__term\"\u003evaraṇa\u003c/i\u003e–aceitação \u003ci class=\"wbw__term\"\u003egoptṛtve\u003c/i\u003e–da proteção [do Senhor] \u003ci class=\"wbw__term\"\u003epālana\u003c/i\u003e–manutenção [da] \u003ci class=\"wbw__term\"\u003eviśvāsa\u003c/i\u003e–fé [de que] \u003ci class=\"wbw__term\"\u003eavaśya\u003c/i\u003e–certamente \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–a Suprema Personalidade de Deus \u003ci class=\"wbw__term\"\u003erakṣibe\u003c/i\u003e–irá [me] proteger.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHumildade, autossubmissão, abraçar a proteção do Senhor, manter a fé de que ‘Kṛṣṇa certamente me protegerá’...\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakti-anukūla mātra kāryera svīkāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakti-pratikūla bhāva—varjanāṅgīkāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003esvīkāra\u003c/i\u003e–Aceitação \u003ci class=\"wbw__term\"\u003emātra\u003c/i\u003e–apenas \u003ci class=\"wbw__term\"\u003ekāryera\u003c/i\u003e–de ações \u003ci class=\"wbw__term\"\u003eanukūla\u003c/i\u003e–favoráveis \u003ci class=\"wbw__term\"\u003ebhakti\u003c/i\u003e–à devoção \u003ci class=\"wbw__term\"\u003eaṅgikāra\u003c/i\u003e–aceitação [da] \u003ci class=\"wbw__term\"\u003evarjana\u003c/i\u003e–rejeição [à] \u003ci class=\"wbw__term\"\u003ebhāva\u003c/i\u003e–natureza, disposição \u003ci class=\"wbw__term\"\u003epratikūla\u003c/i\u003e–desfavorável \u003ci class=\"wbw__term\"\u003ebhakti\u003c/i\u003e–à devoção.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEngajar-se apenas em atividades que são favoráveis à devoção, rejeitando tudo o que é desfavorável à devoção ...\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eṣaḍ-aṅga śaraṇāgati ha-ibe yā̐hāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eta̐hāra prārthanā śune śrī-nanda-kumāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eśrī-nanda-kumāra\u003c/i\u003e–Kṛṣṇa, o filho de Nanda Mahārāj \u003ci class=\"wbw__term\"\u003eśune\u003c/i\u003e–escuta \u003ci class=\"wbw__term\"\u003etā̐hāra\u003c/i\u003e–suas \u003ci class=\"wbw__term\"\u003eprārthanā\u003c/i\u003e–orações \u003ci class=\"wbw__term\"\u003eyā̐hāra\u003c/i\u003e–de quem \u003ci class=\"wbw__term\"\u003eha-ibe\u003c/i\u003e–será [a] \u003ci class=\"wbw__term\"\u003eśaraṇāgati\u003c/i\u003e\u003ci class=\"wbw__term\"\u003e(prapatti)\u003c/i\u003e–rendição [destas] \u003ci class=\"wbw__term\"\u003eṣaḍ\u003c/i\u003e–seis \u003ci class=\"wbw__term\"\u003eaṅga (prakāra aṅgera dvārā)\u003c/i\u003e–maneiras (por meio delas).\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Kṛṣṇa ouve as orações de quem se rende destas seis maneiras.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erūpa-sanātana-pade dante tṛṇa kari’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakativinoda paḍe dui pada dhari’\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ebhakati-vinoda\u003c/i\u003e–Bhakti Vinod \u003ci class=\"wbw__term\"\u003ekari’\u003c/i\u003e–colocando \u003ci class=\"wbw__term\"\u003etṛṇa\u003c/i\u003e–uma palha \u003ci class=\"wbw__term\"\u003edante\u003c/i\u003e–entre [os] dentes \u003ci class=\"wbw__term\"\u003epaḍe\u003c/i\u003e–cai \u003ci class=\"wbw__term\"\u003epade\u003c/i\u003e–aos pés de \u003ci class=\"wbw__term\"\u003eduhu̐\u003c/i\u003e–ambos \u003ci class=\"wbw__term\"\u003erūpa\u003c/i\u003e–Śrīla Rūpa Goswāmī Prabhu \u003ci class=\"wbw__term\"\u003esanātana\u003c/i\u003e–Śrīla Sanātan Goswāmī Prabhu \u003ci class=\"wbw__term\"\u003edhari’\u003c/i\u003e–agarrando [seus] \u003ci class=\"wbw__term\"\u003epada\u003c/i\u003e–pés.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBhakti Vinod coloca uma palha entre os dentes e cai diante de Śrīla Rūpa Goswāmī Prabhu e de Śrīla Sanātan Goswāmī Prabhu, agarrando seus pés.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekā̐diyā kā̐diyā bale, āmi ta’ adhama\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśikhāye śaraṇāgati karahe uttama\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekā̐diyā\u003c/i\u003e–Chorando \u003ci class=\"wbw__term\"\u003ekā̐diyā\u003c/i\u003e–e chorando [ele] \u003ci class=\"wbw__term\"\u003ebale\u003c/i\u003e–diz \u003ci class=\"wbw__term\"\u003eāmi\u003c/i\u003e–eu \u003ci class=\"wbw__term\"\u003eta’\u003c/i\u003e–certamente [sou] \u003ci class=\"wbw__term\"\u003eadhama\u003c/i\u003e–caído, mais baixo! \u003ci class=\"wbw__term\"\u003ekarahe\u003c/i\u003e–Por favor [me] faça \u003ci class=\"wbw__term\"\u003euttama\u003c/i\u003e–elevado, além da escuridão da ilusão \u003ci class=\"wbw__term\"\u003eśikhāye\u003c/i\u003e–ao [me] ensinar \u003ci class=\"wbw__term\"\u003eśaraṇāgati\u003c/i\u003e–rendição.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eChorando e chorando, ele ora: “Eu sou tão baixo! Por favor, me eleve me ensinando sobre a rendição.”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-bhaja-re-bhaja-re-amar-mana-ati-manda\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eBhajan-gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhaja re bhaja re āmār mana ati manda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(bhajan vinā gati nāi re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(ohe āmār mūḍha-mana bhajan vinā gati nāi re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(bhaja) vraja-vane rādhā-kṛṣṇa-charaṇāravinda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(jñāna-karma parihari’ re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(śuddha rāga-patha dhari’ jñāna-karma parihari’ re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSirva! Sirva! Minha mente é tão tola. Não há outra maneira a não ser serviço! Ó minha mente tola! Não há outra maneira a não ser serviço. Sirva os pés de lótus de Rādhā–Kṛṣṇa em Vṛndāvan. Abandone o conhecimento e a ação mundanos! Siga o caminho do amor divino e abandone o conhecimento e a ação mundanos!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(bhaja) gaura-gadādharādvaita-guru-nityānanda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gaura-kṛṣṇe abhed jene)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(guru kṛṣṇa-priya jene gaura-kṛṣṇe abhed jene re) śrīnivāsa, haridāsa, murāri, mukunda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gaura-preme smara smara re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(śrīnivāsa, haridāse, gaura-preme smara smara re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSirva Gaurāṅga, Gadādhar, Advaita, Nityānanda e Śrī Guru. Saiba que Gaurāṅga e Kṛṣṇa são não diferentes, e que Śrī Guru é o devoto querido de Kṛṣṇa. Lembre-se de Śrīvās Ṭhākur, Hari Dās Ṭhākur, Murāri Gupta e Mukunda Datta. Com amor por Gaurāṅga, lembre-se sempre deles. Com amor por Gaurāṅga, lembre-se de Śrīvās Ṭhākur e de Hari Dās Ṭhākur.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erūpa-sanātana-jīva-raghunātha-dvandva\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(yadi bhajan karbe re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(rūpa-sanātane smara yadi bhajan karbe re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erāghava-gopāla-bhaṭṭa-svarūpa-rāmānanda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(kṛṣṇa prema yadi chāo re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(svarūpa-rāmānande smara kṛṣṇa-prema yadi chāo re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLembre-se de Rūpa Goswāmī, Sanātan Goswāmī, Jīva Goswāmī, Raghunāth Bhaṭṭa Goswāmī e Raghunāth Dās Goswāmī. Se você quiser servir, então lembre-se de Śrī Rūpa e de Śrī Sanātan. Lembre-se de Rāghava Paṇḍit, Gopāl Bhaṭṭa Goswāmī, Svarūp Dāmodar e Rāmānanda Rāy. Se você quer Kṛṣṇa-prema, então lembre-se de Svarūp Dāmodar e de Rāmānanda Rāy.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egoṣṭhī-saha karṇapura sena-śivānanda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(ajasra smara smara re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egoṣṭhī-saha sena śivānande ajasra smara re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erūpānuga sādhu-jana bhajana-ānanda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(vraje vās yadi chāo re)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(rūpānuga sādhu-jane smara vraje vās yadi chāo re)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSe lembre de Kavi Karṇapur, Śivānanda Sen, e suas famílias. Se lembre sempre deles! Se lembre sempre de Śivānanda Sen e sua família. Se lembre dos sādhus que seguem Śrī Rūpa e da alegria que sentem em seu serviço. Se você deseja residir em Vraja, então lembre-se dos sādhus que seguem Śrī Rūpa.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vibhavari-shiesha-aloka-praveshia\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eVibhāvarī Śeṣa \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evibhāvarī śeṣa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āloka praveśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nidrā chhāḍi’ uṭha jīva\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebala hari hari\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mukunda murāri\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rāma kṛṣṇa hayagrīva\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ almas! A noite terminou e a luz chegou. Acordem e se levantem! Cantem: “Hari! Hari!” O Supremo Senhor Kṛṣṇa é o outorgador da liberação, o inimigo de Mura, e o amante de Śrī Rādhā. Ele aparece como Hayagrīva, o Avatār com cabeça de cavalo.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enṛsiṁha vāmana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-madhusūdana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vrajendra-nandana śyāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epūtanā-ghātana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kaiṭabha-śātana jaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dāśarathi-rāma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória a Kṛṣṇa! Ele aparece como Nṛsiṁhadev, o Avatār meio-homem meio-leão, o Avatār anão, Vāman, e o filho de Daśarath, Rāmachandra. Ele é o destruidor dos demônios Madhu, Pūtanā e Kaiṭabha. Ele é o filho do Rei de Vraja e sua cor é negra.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyaśodā dulāla\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;govinda gopāla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vṛndāvana purandara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egopī-priya-jana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rādhikā-ramaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhuvana-sundara-vara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle é o filho querido de mãe Yaśodā, e o protetor e deleite das vacas. Ele é o Senhor de Vṛndāvan, o amado das gopīs, o amante de Rādhikā, e a pessoa mais bela de todos os universos.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erāvāṇāntakara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emākhana-taskara gopī-jana-vastra-hārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evrajera rākhāla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egopa-vṛnda-pāla chita-hārī vaṁśī-dhārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eComo Rāmachandra, Ele é o destruidor de Rāvaṇ. Kṛṣṇa é um ladrão de manteiga e o ladrão das roupas das gopīs. Ele é um vaqueirinho em Vraja, e o protetor dos outros vaqueirinhos. Ele é um flautista que rouba os corações de todos.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyogīndra-vandana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-nanda-nandana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vraja-jana-bhaya-hārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāvina nīrada\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rūpa manohara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mohana-vaṁśī-vihārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO filho de Nanda Mahārāj, Kṛṣṇa, é adorado pelos maiores yogīs. Ele é o removedor de todo o medo dos habitantes de Vraja. Ele é um encantador flautista cuja forma adorável é da cor de uma nuvem de chuva fresca.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyaśodā-nandana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kaṁsa-nisūdana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nikuñja-rāsa-vilāsī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekadamba-kānana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rāsa-parāyaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vṛndā-vipina-nivāsī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO filho de Yaśodā, Kṛṣṇa, é o assassino de Kaṁsa e o desfrutador da Dança Rāsa na floresta. Ele reside em Vṛndāvan e realiza a Dança Rāsa sob as árvores kadamba.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eānanda-vardhana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prema-niketana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;phula-śara-yojaka kāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egopāṅgaṇā-gaṇa-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chita-vinodana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;samasta-guṇa gaṇa-dhāma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle é a sempre crescente alegria personificada e o reservatório final do amor divino. Ele é um Cupido divino, que captura Suas amadas com flechas de flores. Ele é o prazer dos corações das gopīs e a morada de todas as qualidades maravilhosas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyāmuna-jīvana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;keli-parāyaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mānasa-chandra-chakora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma-sudhā-rasa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gāo kṛṣṇa-yaśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rākha vachana mana mora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle brinca nas águas do rio Yamunā e é a lua sobre o pássaro chakora do coração. Ó mente, lembre-se de minhas palavras: “Sempre cante as glórias e os nectáreos Nomes de Kṛṣṇa”.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eTarde\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-shri-guru-charana-padma-kevala-bhakati\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Guru-vaiṣṇava Māhātmya-gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī guru charaṇa-padma\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kevala bhakati-sadma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vando̐ muñi sāvadhāna mate\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyā̐hāra prasāde bhāi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;e bhava tariyā yāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛṣṇa-prāpti haya yā̐hā haite\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOfereço cuidadosamente minha reverência aos pés de lótus de Śrī Guru, que são a única morada da devoção. Ó irmão! Pela misericórdia dele, nós atravessamos este mundo e alcançamos Kṛṣṇa.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eguru-mukha-padma-vākya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chitete kariyā aikya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āra nā kariha mane āśā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī guru-charaṇe rati\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ei se uttama-gati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ye prasāde pūre sarva āśā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eFaça os ensinamentos da boca de lótus de Śrī Guru unos com seu coração, e não deseje nada mais internamente. O apego aos pés de Śrī Guru é o melhor caminho. Por sua misericórdia todos os desejos são realizados.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echakṣu-dāna dilā yei\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;janme janme prabhu sei\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;divya-jñāna hṛde prakāśita\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-bhakti yā̐hā haite\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;avidyā vināśa yāte\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vede gāya yā̐hāra charita\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAquele que me deu o dom da visão é meu senhor, nascimento após nascimento. Ele manifestou o conhecimento divino em meu coração. Ele dá prema-bhakti e destrói a ignorância. Os Vedas cantam sobre seu caráter.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-guru karuṇā-sindhu\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;adhama janāra bandhu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;lokanātha lokera jīvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehā hā prabhu kara dayā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;deha more pada-chhāyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;e adhama la-ila śaraṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Guru é um oceano de misericórdia e o amigo dos caídos. Ele é o senhor e a vida de todas as pessoas. Ó mestre! Seja misericordioso. Me dê a sombra de seus pés. Esta alma caída tomou abrigo em você.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(āmi) (śaraṇ nilām)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(abhaya-śrī-pāda-padme\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śaraṇ nilām)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(āmāy) (dayā kara he)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(patit-pāvan śrī gurudev\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dayā kara he)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(adhama patita jene\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dayā kara he)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(jay gurudev)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu me abriguei. Tomei abrigo em seus pés de lótus, onde não há medo. Por favor, tenha misericórdia de mim. Ó Śrī Gurudev, purificador dos caídos, por favor, tenha misericórdia de mim. Compreendendo que sou humilde e caído, tenha misericórdia de mim. Toda glória a você, Śrī Gurudev!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-krishna-chaitanya-prabhu-daya-kara-more\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eSāvaraṇa-Śrī-Gaura-pāda-padme Prārthanā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī kṛṣṇa chaitanya prabhu dayā kara more\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomā vinā ke dayālu jagata mājhāre\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Śrī Kṛṣṇa Chaitanya Mahāprabhu! Seja misericordioso comigo. A não ser Você, quem é misericordioso neste mundo?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epatita-pāvana-hetu tava avatāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emo sama patita prabhu nā pāibe āra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVocê descendeu para salvar as almas caídas. Ó Senhor, Você não vai encontrar outra alma tão caída quanto eu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehā hā prabhu nityānanda premānanda sukhī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛpāvalokana kara āmi baḍa duḥkhī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Nityānanda! Você é radiante de amor divino. Me dê Seu olhar misericordioso. Eu estou muito triste.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edayā kara sītā-pati advaita gosāñi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava kṛpā-bale pāi chaitanya-nitāi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Advaita Gosāi, Senhor de Sītā Ṭhākurāṇī! Seja misericordioso comigo. Pela Sua misericórdia alcançarei Śrī Chaitanya e Nitāi.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaura-premamaya-tanu paṇḍit gadādhara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrīnivāsa haridāsa dayāra sāgara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gadādhar Paṇḍit, personificação do amor por Śrī Gaura! Ó oceanos de misericórdia, Śrīvās Paṇḍit e Hari Dās Ṭhākur!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehā hā svarūpa sanātana rūpa raghunātha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhaṭṭa-yuga śrī jīva hā prabhu lokanātha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Svarūp Dāmodar, Sanātan, Rūpa, Raghunāth Dās, Raghunāth Bhaṭṭa, Gopāl Bhaṭṭa e Śrī Jīva! Ó Lokanāth Prabhu!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edayā kara śrī-āchārya prabhu śrīnivāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erāmachandra-saṅga māge narottama dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Śrīnivās Āchārya Prabhu! Seja misericordioso! Narottam Dās ora pela associação de Rāmachandra Kavirāj.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(dayā kara prabhupāda śrī-gaura-prakāśa)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(tava jana kṛpā māge ei adhama dāsa)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Śrīla Prabhupād, manifestação de Śrī Gaura! Seja misericordioso. Este servo caído ora pela misericórdia de seus associados.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eVaiṣṇava\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-vaishnava-thakura-dayara-sagara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Vaiṣṇava-mahimā-gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(ohe) vaiṣṇava ṭhākura\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dayāra sāgara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;e dāse karuṇā kari\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ediyā pada-chāyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śodha he āmāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra charaṇa dhari\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eohe!\u003c/i\u003e–Ó \u003ci class=\"wbw__term\"\u003eṭhākura\u003c/i\u003e–adorável, mais elevado \u003ci class=\"wbw__term\"\u003evaiṣṇava\u003c/i\u003e–devoto \u003ci class=\"wbw__term\"\u003esāgara\u003c/i\u003e–oceano \u003ci class=\"wbw__term\"\u003edayāra\u003c/i\u003e–de misericórdia \u003ci class=\"wbw__term\"\u003ekari’ karuṇā\u003c/i\u003e–tendo misericórdia \u003ci class=\"wbw__term\"\u003ee\u003c/i\u003e–[de] este \u003ci class=\"wbw__term\"\u003edāse\u003c/i\u003e–servo. \u003ci class=\"wbw__term\"\u003ediyā\u003c/i\u003e–Dando \u003ci class=\"wbw__term\"\u003echhāyā\u003c/i\u003e–a sombra \u003ci class=\"wbw__term\"\u003epada\u003c/i\u003e–de seus pés \u003ci class=\"wbw__term\"\u003eśodha\u003c/i\u003e–purifique \u003ci class=\"wbw__term\"\u003ehe\u003c/i\u003e–ó! \u003ci class=\"wbw__term\"\u003eāmāya\u003c/i\u003e–a mim. \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003echaraṇa\u003c/i\u003e–pés \u003ci class=\"wbw__term\"\u003edhari\u003c/i\u003e–eu agarro.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ adorável Vaiṣṇava, oceano de graça, tenha misericórdia deste servo. Dê-me a sombra de teus pés e purifica-me. Eu agarro seus pés.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echhaya vega dami’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chhaya doṣa śodhi’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chhaya guṇa deha’ dāse\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echhaya sat-saṅga\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;deha’ he āmāre\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;basechhi saṅgera āśe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003edami’\u003c/i\u003e–Subjugando \u003ci class=\"wbw__term\"\u003echhaya\u003c/i\u003e–as seis \u003ci class=\"wbw__term\"\u003evega\u003c/i\u003e–urgências \u003ci class=\"wbw__term\"\u003eśodhi’\u003c/i\u003e–purificando \u003ci class=\"wbw__term\"\u003echhaya\u003c/i\u003e–os seis \u003ci class=\"wbw__term\"\u003edoṣa\u003c/i\u003e–defeitos \u003ci class=\"wbw__term\"\u003echhaya\u003c/i\u003e–as seis \u003ci class=\"wbw__term\"\u003eguṇa\u003c/i\u003e–qualidades \u003ci class=\"wbw__term\"\u003edeha’\u003c/i\u003e–por favor dê \u003ci class=\"wbw__term\"\u003edāse\u003c/i\u003e–a este servo. \u003ci class=\"wbw__term\"\u003echhaya\u003c/i\u003e–As seis \u003ci class=\"wbw__term\"\u003esaṅga\u003c/i\u003e–formas de associação \u003ci class=\"wbw__term\"\u003esat\u003c/i\u003e–com devotos \u003ci class=\"wbw__term\"\u003edeha’\u003c/i\u003e–por favor dê \u003ci class=\"wbw__term\"\u003ehe\u003c/i\u003e–ó \u003ci class=\"wbw__term\"\u003eāmāre\u003c/i\u003e–a mim \u003ci class=\"wbw__term\"\u003ebasechhi\u003c/i\u003e–eu me sentei [aos seus pés] \u003ci class=\"wbw__term\"\u003eāśe\u003c/i\u003e–com o desejo \u003ci class=\"wbw__term\"\u003esaṅgera\u003c/i\u003e–[desta] associação.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSubjugue as seis urgências, corrija os seis defeitos e conceda as seis boas qualidades sobre este servo. Conceda-me os seis tipos de boa associação. Eu me sentei aos seus pés, desejando esta associação.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eekākī āmāra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāhi pāya bala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hari-nāma-saṅkīrtane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etumi kṛpā kari\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śraddhā-bindu diyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;deha’ kṛṣṇa-nāma-dhane\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eekākī\u003c/i\u003e–Sozinho \u003ci class=\"wbw__term\"\u003eāmāra\u003c/i\u003e–eu \u003ci class=\"wbw__term\"\u003enāhi\u003c/i\u003e–não \u003ci class=\"wbw__term\"\u003epāya\u003c/i\u003e–obtenho \u003ci class=\"wbw__term\"\u003ebala\u003c/i\u003e–habilidade \u003ci class=\"wbw__term\"\u003esaṅkīrtane\u003c/i\u003e–para engajar em completa glorificação e canto \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–do Nome \u003ci class=\"wbw__term\"\u003ehari\u003c/i\u003e–do Senhor. \u003ci class=\"wbw__term\"\u003etumi\u003c/i\u003e–Você \u003ci class=\"wbw__term\"\u003ekṛpā kari’\u003c/i\u003e–sendo misericordioso \u003ci class=\"wbw__term\"\u003ediyā\u003c/i\u003e–dando \u003ci class=\"wbw__term\"\u003ebindu\u003c/i\u003e–uma gota \u003ci class=\"wbw__term\"\u003eśraddhā\u003c/i\u003e–de fé \u003ci class=\"wbw__term\"\u003edeha’\u003c/i\u003e–por favor dê \u003ci class=\"wbw__term\"\u003edhane\u003c/i\u003e–[a] riqueza \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–do Nome k \u003ci class=\"wbw__term\"\u003eṛṣṇa\u003c/i\u003e–de Kṛṣṇa.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSozinho eu não tenho capacidade de cantar corretamente o Nome do Senhor. Misericordiosamente me dê uma gota de fé e me conceda a riqueza do Nome de Kṛṣṇa.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛṣṇa se tomāra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛṣṇa dite pāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra śakati āchhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāmi ta’ kāṅgāla\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘kṛṣṇa kṛṣṇa’ bali\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dhāi tava pāchhe pāchhe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–o Senhor \u003ci class=\"wbw__term\"\u003ese\u003c/i\u003e–Ele [é] \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–seu. [Você é] \u003ci class=\"wbw__term\"\u003epāra\u003c/i\u003e–capaz [de] \u003ci class=\"wbw__term\"\u003edite\u003c/i\u003e–dar \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–Kṛṣṇa Ele mesmo \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–[este] seu \u003ci class=\"wbw__term\"\u003eśakati\u003c/i\u003e–poder \u003ci class=\"wbw__term\"\u003eāchhe\u003c/i\u003e–está presente \u003ci class=\"wbw__term\"\u003eāmi\u003c/i\u003e–eu \u003ci class=\"wbw__term\"\u003eta’\u003c/i\u003e–certamente [sou] \u003ci class=\"wbw__term\"\u003ekāṅgāla\u003c/i\u003e–pobre. \u003ci class=\"wbw__term\"\u003ebali’\u003c/i\u003e–Dizendo \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–o Nome de ‘Kṛṣṇa’ \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–o Nome de ‘Kṛṣṇa’ \u003ci class=\"wbw__term\"\u003edhāi\u003c/i\u003e–eu corro \u003ci class=\"wbw__term\"\u003epāchhe\u003c/i\u003e–atrás de \u003ci class=\"wbw__term\"\u003epāchhe\u003c/i\u003e–atrás de \u003ci class=\"wbw__term\"\u003etava\u003c/i\u003e–você.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKṛṣṇa é seu. Você pode dar Kṛṣṇa. Você tem esse poder. Eu sou muito pobre. Chamando: “Kṛṣṇa! Kṛṣṇa!”, eu corro atrás de você.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(āmi) (dhāi tava pāchhe pāchhe)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(kṛṣṇa dhana pābar āśe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dhāi tava pāchhe pāchhe)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(tumi dile kṛṣṇa dite pāra)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(kṛṣṇa tomār hṛdayer dhan\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tumi dileo dite pāra)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(kṛṣṇa debār śakti-dhara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tumi dileo dite pāra)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu corro atrás de você. Corro atrás de você na esperança de alcançar a riqueza de Kṛṣṇa. Se você deseja dar Kṛṣṇa, você pode dá-lo. Se você desejar, você pode. Kṛṣṇa é a riqueza de seu coração. Você tem o poder de dar Kṛṣṇa. Se você desejar dar Kṛṣṇa, você pode dá-lo.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-thakura-vaishnava-gana-kori-ei-nivedana\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eṬhākura-vaiṣṇava-gaṇa \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eṭhākura vaiṣṇava-gaṇa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kari ei nivedana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mo baḍa adhama durāchāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edāruṇa-saṁsāra-nidhi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāhe ḍubāila vidhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;keśe dhari’ more kara pāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ adoráveis Vaiṣṇavas, eu ofereço-lhes esta oração. Eu sou muito caído e mal comportado. O destino me mergulhou no temível oceano da existência material. Por favor, agarre-me pelo cabelo e me puxe para a margem.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evidhi baḍa balavān\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā śune dharama-jñāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadāi karama-pāśe bāndhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enā dekhi tāraṇa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;leśa yata dekhi saba kleśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;anātha kātare te̐i kānde\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO destino é muito poderoso. Ele não escuta o conhecimento que tenho da religião, e sempre me prende com as cordas do karma. Não vejo nem um traço de esperança. Tudo o que vejo é dificuldade. Portanto desamparado e angustiado, eu choro.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekāma, krodha, lobha, moha, mada, abhimāna saha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āpana āpana sthāne ṭāne\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eaichāna āmāra mana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;phire yena andha jana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;supatha vipatha nāhi jāne\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLuxúria, raiva, cobiça, ilusão, orgulho e ego me puxam em suas próprias direções. Assim minha mente vagueia como um homem cego que não sabe a diferença entre o caminho correto e o caminho errado.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enā la-inu sat mata\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;asate majila chita\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tuyā pāye nā karinu āśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enarottama dāse kaya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dekhi’ śuni’ lage bhaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tarāiyā laha nija pāśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu nunca aceitei a concepção apropriada. Minha mente tem estado imersa na ilusão, e eu nunca aspirei aos seus pés. Narottam Dās diz: “Vendo e ouvindo sobre minha situação, estou paralisado de medo. Por favor me resgate e me mantenha ao seu lado.”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-ki-rupe-paibo-seva-mui-durachara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eKi-rūpe pāiba sevā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eki-rūpe pāiba sevā muñi durāchāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-guru-vaiṣṇave rati nā haila āmāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eComo irei obter serviço? Sou um pecador e não tenho apego a Śrī Guru ou aos Vaiṣṇavas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eaśeṣa māyāte mana magana ha-ila\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaiṣṇavete leśa-mātra rati nā janmila\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMinha mente tem estado imersa em uma ilusão sem fim. Eu não tenho nenhum traço de apego aos Vaiṣṇavas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eviṣaye bhuliyā andha ha-inu divā-niśi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egale phā̐sa dite phere māyā se piśāchī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eImerso no mundano dia e noite, eu me esqueci de você e fiquei cego. A bruxa Māyā veio para colocar um nó em volta do meu pescoço.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emāyāre kariyā jaya chhāḍāna nā yāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esādhu-kṛpā vinā āra nāhika upāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÉ impossível superar e deixar Māyā para trás sem a misericórdia dos sādhus. Não há outra maneira.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eadoṣa-daraśi-prabhu patita-uddhāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eei-bāra narottame karaha nistāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ mestre que não considera minhas faltas! Ó salvador dos caídos! Desta vez liberte Narottam Dās.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-thakura-vaishnava-pada-avanira\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eṬhākura-vaiṣṇava-pada \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eṭhākura-vaiṣṇava-pada\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;avanīra susampada\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śuna bhāi! hañā eka mana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāśraya la-iyā bhaje\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāre kṛṣṇa nāhi tyaje\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āra saba mare akāraṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOs adoráveis pés dos Vaiṣṇavas são o maior tesouro no mundo. Ó irmão, ouça com atenção: tome abrigo dos Vaiṣṇavas e sirva. Kṛṣṇa não rejeita aquele que assim o faz. Todos os outros morrem em vão.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evaiṣṇava-charaṇa-jala\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prema-bhakti dite bala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āra keha nahe balavanta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaiṣṇava-charaṇa-renu\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mastake bhūṣaṇa vinu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āra nāhi bhūṣaṇera anta\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eA água dos pés dos Vaiṣṇavas tem o poder de dar a alguém prema-bhakti. Nada mais tem esse poder. Eu não uso nenhum ornamento em minha cabeça que não seja a poeira dos pés dos Vaiṣṇavas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etīrtha-jala-pavitra-guṇe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;likhiyāchhe purāṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;se saba bhaktira pravañchana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaiṣṇavera pādadoka\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sama nahe ei saba\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;yāte haya vañchhita pūraṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO poder purificante da água dos lugares de peregrinação tem sido descrito nos Purāṇas. Tais declarações são uma artimanha devocional. A água dos lugares de peregrinação nunca é igual à água dos pés dos Vaiṣṇavas, que realizam todos os desejos.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evaiṣṇava-saṅgete mana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ānandita anukṣaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadā haya kṛṣṇa-parasaṅga\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edina narottama kā̐nde\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hiyā dhairya nāhi bāndhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mora daśā kena ha-ila bhaṅga\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMinha mente está sempre alegre na companhia dos Vaiṣṇavas, onde conversas sobre Kṛṣṇa estão sempre acontecendo. O humilde Narottam chora: “Meu coração está impaciente. Por que minha condição mudou? (Por que eu perdi a associação dos Vaiṣṇavas?)”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-ei-vara-karuna-kara-vaishnava-gosani\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eVaiṣṇava Vijñāpti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eei-bāra karuṇā kara vaiṣṇava gosāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epatita-pāvana tomā vine keha nāi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ adorável Vaiṣṇava, seja misericordioso comigo desta vez. Ó purificador dos caídos, sem você não há ninguém.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekāhāra nikaṭe gele pāpa dūre yāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eemana dayāla prabhu kebā kothā pāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSe alguém chega até você, seus pecados vão embora. Onde tal mestre misericordioso pode ser encontrado?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaṅgāra-paraśa ha-ile paśchāte pāvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edarśane pavitra kara—ei tomāra guṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSe o Ganges toca alguém, essa pessoa é posteriormente purificada, mas você purifica as almas simplesmente ao olhar para elas—tal é o seu poder.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari-sthāne aparādhe tāre hari-nāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomā-sthāne aparādhe nāhika eḍāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSe alguém ofende o Senhor, o Nome do Senhor o liberta, mas se alguém ofende você, ele não tem salvação.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra hṛdaye sadā govinda-viśrāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egovinda kahena—mama vaiṣṇava parāṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGovinda sempre reside em seu coração, e Ele diz: “Meus devotos são o Meu coração.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprati janme kari āśā charaṇera dhūli\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enarottame kara dayā āpnāra bali’\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eA cada nascimento eu aspiro ao pó dos seus pés. Sede misericordioso com Narottam, considerando-o seu.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eNitāi\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-nitai-pada-kamala-koti-chandra-sushitala\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eManaḥ-Śikṣā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enitāi-pada-kamala\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;koṭī-chandra-suśītala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ye chhāyāya jagata juḍāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehena nitāi vine bhāi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rādhā-kṛṣṇa pāite nāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dṛḍha kari’ dhara nitāira pāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eRefrescantes como dez milhões de luas, os pés de lótus de Nitāi gentilmente acalmam o mundo com sua sombra. Ó irmão! Sem Nitāi, você não pode alcançar Rādhā–Kṛṣṇa.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ese sambandha nāhi yāra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vṛthā janma gela tāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sei paśu baḍa durāchāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enitāi nā balila mukhe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;majila saṁsāra-sukhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vidyā-kule ki karibe tāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eA vida de alguém que não teve conexão com Nitāi passou em vão. Tal animal é muito vil. O que o conhecimento (nascimento aristocrático) poderá fazer por alguém que esteve imerso em prazeres mundanos e nunca chamou em voz alta: “Nitāi”?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eahaṅkāre matta haiñā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nitāi-pada pāsariyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;asatyere satya kari’ māni\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enitāiyer karuṇā habe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vraje rādhā-kṛṣṇa pābe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dhara nitāiyer charaṇ du’khāni\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEnlouquecido de orgulho, esquecendo os pés de Nitāi, eu aceito a inverdade como verdade. Quando Nitāi conceder Sua misericórdia você irá alcançar Rādhā–Kṛṣṇa em Vraja. Agarre os pés de Nitāi!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enitāiyer charaṇa satya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tā̐hāra sevaka nitya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nitāi-pada sadā kara āśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enarottama baḍa duḥkhī\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nitāi more kara sukhī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rākha rāṅgā-charaṇera pāśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOs pés de Nitāi são verdade, e Seus servos são eternos. Sempre aspire pelos pés de Nitāi. Narottam está muito triste: “Ó Nitāi! Me faça feliz. Mantenha-me junto aos seus pés avermelhados.”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-nitai-gunamani-amara-nitai-gunamani\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eNitāi guṇamaṇi āmāra \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Lochan Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enitāi guṇamaṇi āmāra nitāi guṇamaṇi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāniyā premera vanyā bhāsāla avanī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNitāi, a joia de todas as boas qualidades, meu Nitāi, a joia de todas as boas qualidades, trouxe uma inundação de amor divino e imergiu a Terra.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprema-vanyā laye nitāi āila gauḍa-deśe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eḍubila bhakata-gaṇa dīna-hīna bhāse\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNitāi trouxe uma inundação de amor divino para a terra de Gauḍa. Os devotos mergulharam nela, mas os desafortunados boiaram em sua superfície.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edīna-hīna patita pāmara nahi bāchhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebrahmāra durlabha prema sabākāre yāche\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOs pecadores, os desafortunados, e os caídos não desejaram esse amor divino, que é difícil ser obtido até por Brahmā. Mesmo assim Nitāi os implorou a aceitar.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eābaddha karuṇā-sindhu kāṭiyā muhāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eghare ghare bule prema-amiyāra vāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNitāi abriu um canal no mar fechado da misericórdia e uma correnteza de amor divino nectáreo se espalhou por todas as casas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003elochan bale hena nitāi yebā na bhajila\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejāniyā śuniyā sei atma-ghātī haila\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLochan Dās diz: “Qualquer um que não serviu Nitāi reconhecidamente cometeu suicídio.”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-akrodha-paramananda\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eAkrodha paramānanda \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Lochan Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eakrodha paramānanda nityānanda rāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eabhimāna-śūnya nitāi nagare beḍāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO sem ira, sem orgulho, supremamente feliz Nityānanda Rāy vagueia por todas as cidades.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eadhama patita jīver dvāre dvāre giyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehari-nāma mahāmantra dena bilāiyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIndo de porta em porta às casas das almas baixas e caídas, Ele distribui o mahāmantra Hare Kṛṣṇa.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyāre dekhe tāre kahe dante tṛṇa dhari’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāmāre kiniyā laha bhaja gaurahari\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCom uma palha entre Seus dentes, Ele diz a quem quer que Ele veja: “Compre-me: simplesmente sirva Gaurahari.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eeta bali’ nityānanda bhūme gaḍi yāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esonāra parvata yena dhūlāte loṭāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDizendo isso, Nityānanda rola no chão como uma montanha dourada rolando na poeira.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehena avatāre yāra rati nā janmila\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elochan bale sei pāpī ela āra gela\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLochan Dās diz daquele que não desenvolveu apego a esse Avatār: “Tal pecador simplesmente veio e se foi.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(yāoyā āsā sār ha-ila)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(nitāi-charaṇ nā bhajila yāoyā āsā sār ha-ila)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Eles simplesmente vieram e se foram. Aqueles que não serviram os pés de Nitāi simplesmente vieram e se foram (nasceram e morreram inutilmente).”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-parama-karuna-pahu-dui-jana\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śrī Gaura-Nityānander Dayā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Lochan Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eparama karuṇa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pahu̐ dui jana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nitāi gaurachandra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaba avatāra-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sāra śiromaṇi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kevala ānanda-kanda\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNitāi e Gaurachandra são os Senhores mais misericordiosos. Eles são os melhores, a joia da coroa de todos os Avatāres e a única fonte de alegria.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(kevala-i ānanda-kanda)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(nityānanda gaurachandra kevala-i ānanda-kanda)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEles são a única fonte de alegria. Nityānanda e Gaurachandra são a única fonte de alegria.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhaja bhaja bhāi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chaitanya nitāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sudṛḍha viśvāsa kari’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eviṣaya chhāḍiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;se rase majiyā\u003c/s
