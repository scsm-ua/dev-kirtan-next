tātma-kiṅkaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Chaitanya revelou a Rāmānanda Rāy, cuja fortuna situa-se além deste mundo, a natureza dos Passatempos sempre renovados que realizou em Nabadwīp. O Senhor Chaitanya também manifestou Sua forma de menino vaqueiro, Śyāmasundar, investida do humor e brilho de Śrī Rādhā, expressa em dedicação pura. Quando Rāmānanda Rāy vislumbrou a beleza inigualável da figura do Senhor, ele desmaiou diante de Seus suaves pés de lótus. Em seguida, Śrī Gaurāṅgadev restaurou a consciência de Seu servo eterno. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"27\"\u003e\n\u003ch5\u003e27\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enaṣṭa-kuṣṭha-kūrma-vipra-rūpa-bhakti-toṣaṇaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erāma-dāsa-vipra-moha-mukta-bhakta-poṣaṇam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekāla-kṛṣṇa-dāsa-mukta-bhaṭṭathāri-piñjaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Senhor Gaurasundar abraçou o devoto brāhmaṇ chamado Vāsudev. Afligido pela lepra, ele estava em Kūrmakṣetra, próximo a Jagannāth Purī. Pela graça do Senhor, o brāhmaṇ foi curado, obtendo um belo corpo e satisfação mental. Mais tarde, o Senhor Gaurāṅga liberou o brāhmaṇ do sul da Índia conhecido como Rāmdās da concepção equivocada de que a castidade de Sītā Devī havia sido manchada pelo toque de um demônio. O Senhor citou o \u003ci\u003eKūrma-purāṇa\u003c/i\u003e para provar que a Verdade Absoluta que existe na plataforma espiritual situa-se além da percepção material. Desse modo, o Senhor nutriu Seu devoto com instruções pertinentes à devoção pura. O Senhor Supremo também liberou Kālā Kṛṣṇa Dās da influência ilusória dos falsos renunciantes da província de Mālābar que faziam parte da comunidade de nômades corruptos chamados Bhaṭṭathāri. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a forma divina de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"28\"\u003e\n\u003ch5\u003e28\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eraṅganātha-bhaṭṭa-bhakti-tuṣṭa-bhaṅgi-bhāṣaṇaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elakṣmya-gamya-kṛṣṇa-rāsa-gopikaika-poṣaṇam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elakṣmya-bhīṣṭa-kṛṣṇa-śīrṣa-sādhya-sādhanākaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Senhor certa vez visitou Raṅgakṣetra no sul da Índia às margens do rio Kāverī, que é o local de adoração mais importante para os devotos Vaiṣṇavas de Śrī Śrī Lakṣmī-Nārāyaṇ. Quando o Senhor visitou o pai de Śrī Gopāl Bhaṭṭa, Śrī Veṅkaṭa Bhaṭṭa, Ele ficou muito satisfeito com a atitude de serviço de sua família. De modo astuto, o Senhor sorriu e instruiu-os que até mesmo Śrī Lakṣmī Devī, depois de prolongadas penitências, não pôde entrar nos Passatempos rāsa-līlā do Senhor Kṛṣṇa. Somente as meninas vaqueiras podem de fato incitar tais Passatempos. Portanto, o vaqueirinho Kṛṣṇa, que é a forma original do Senhor Nārāyaṇ e que atrai o coração de Lakṣmī Devī, é a Verdade Suprema e o objeto fundamental de todas as práticas devocionais. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"29\"\u003e\n\u003ch5\u003e29\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebrahma-saṁhitākhya-kṛṣṇa-bhakti-śāstra-dāyakaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-karṇa-sīdhu-nāma-kṛṣṇa-kāvya-gāyakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-pratāparudra-rāja-śīrṣa-sevya-mandiraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eViajando pelo sul da Índia, o Senhor Gaurasundar descobriu a famosa obra literária \u003ci\u003eŚrī Brahmā-saṁhitā\u003c/i\u003e, que é rica em conclusões devocionais, e a presenteou a Seus devotos. Dominado pelos profundos êxtases da dedicação pura, o Senhor também cantou docemente os versos encantadores do \u003ci\u003eŚrī Kṛṣṇa-karṇāmṛta\u003c/i\u003e, onde o grandioso poeta do sul da Índia, Śrī Bilvamaṅgal Ṭhākur glorifica os maravilhosos Passatempos de Vraja. E o grande Rei Pratāparudra, que tinha total dedicação sob seu comando, conseguiu que os suaves pés de lótus do Senhor Chaitanya fossem postos sobre sua cabeça. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"30\"\u003e\n\u003ch5\u003e30\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-rathāgra-bhakta-gīta-divya-nartanādbhutaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyātri-pātra-mitra-rudrarāja-hṛch-chamatkṛtam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eguṇḍichāgamādi-tattva-rūpa-kāvya-sañcharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCercado de inúmeros devotos, o Senhor Gaurasundar exibiu Sua figura divina, maravilhosa e dançante diante da carruagem do Rātha Yātrā, durante o canto congregacional dos Santos Nomes do Senhor. A personalidade do Senhor encantou totalmente os corações de Mahārāj Pratāparudra, dos peregrinos reunidos e de outros queridos amigos do Rei. O Senhor também revelou o significado interno do Passatempo do Senhor Jagannāth dirigindo a carruagem para o templo de Guṇḍichā, ao mencionar o verso de Śrīla Rūpa Goswāmī:\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epriyaḥ so ’yam kṛṣṇaḥ ha-chari kuru-kṣetra-militas\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etathāhaṁ sā rādhā tad idam ubhayoḥ saṅgama sukham\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etathāpy antaḥ-khelan-madhura-muralī-pañchama-juṣe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emano me kālindī-pulina-vipināya spṛhayati\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Ó Meu querido amigo, agora estou por fim junto de Meu mais amado Kṛṣṇa em Kurukṣetra. Eu sou a mesma Rādhārāṇī, e Ele é o mesmo Kṛṣṇa. Estamos desfrutando de Nosso encontro, mas Eu ainda desejo retornar às margens do Kālindī, onde eu podia ouvir a doce melodia de Sua flauta soando a quinta nota sob as árvores da floresta de Vṛndāvan.”\u003cbr\u003e\nEu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-prema-mugdha-rudra-raja-shiaurya-virya-vikramam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"31\"\u003e\n\u003ch2\u003eŚrī Śrī Prema-dhāma-deva Stotram \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eTerça-feira\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003ch5\u003e31\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprema-mugdha-rudra-rāja-śaurya-vīrya-vikramaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprārthitāṅghri-varjitānya-sarva-dharma-saṅgamam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eluṇṭhita-pratāpa-śīrṣa-pāda-dhūli-dhūsaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando o norte da Índia estava sob o reinado mulçumano, esse grandioso Rei Pratāparudra, imperador do estado independente de Orissa, ficou completamente atônito e dominado pela magnanimidade, ousadia e atividades do Senhor Chaitanya exibidas em amor puro pelo Supremo. O grande Rei Pratāparudra rejeitou todos os seus laços anteriores com a religiosidade tradicional e sua corajosa e majestosa natureza, e se atirou diante dos pés de lótus de Śrī Chaitanyadev em total rendição. O misericordioso Senhor então banhou a cabeça do imperador rendido com a poeira sagrada de Seus suaves pés de lótus. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"32\"\u003e\n\u003ch5\u003e32\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edākṣiṇātya-suprasiddha-paṇḍitaugha-pūjitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśreṣṭha-rāja-rājapātra-śīrṣa-bhakti-bhūṣitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edeśa-mātṛ-śeṣa-darśanārthi-gauḍa-gocharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Senhor Supremo foi adorado pela famosa classe de eruditos do sul da Índia. Os maiores príncipes e seus ministros viram o Senhor com profunda fé e o trataram como a joia principal merecedora de seu respeito. Conforme os princípios corretos estabelecidos na autêntica sucessão discipular, o Senhor veio à Bengal Ocidental para ver o sagrado Ganges. Ele também veio ver Seu local de nascimento e Sua mãe Śachī Devī, como se fosse a última vez. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"33\"\u003e\n\u003ch5\u003e33\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaura-garvi-sarva-gauḍa-gauravārtha-sajjitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśāstra-śastra-dakṣa-duṣṭa-nāstikādi-lajjitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emuhyamāna-mātṛkādi-deha-jīva-sañcharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDurante Suas viagens, a fama do Senhor Gaurāṅgadev inundou toda Bengal. Portanto, quando Ele retornou a Nabadwīp cinco anos depois de ter aceito sannyās, toda Bengal, que estava orgulhosa do Senhor Gaurāṅga, ficou entusiasmada de poder glorificar Sua personalidade extraordinária. Até mesmo a orgulhosa classe de eruditos ateus sentiu-se desconfortável em sua natureza vil quando observou como as pessoas comuns de todas as classes sociais tinham tamanha fervorosa fé no Senhor. Quando mãe Śachī e os outros membros da família que estavam como que sem vida devido à separação tiveram outro vislumbre de Śrī Chaitanyadev, sua substância vital rejuvenesceu. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"34\"\u003e\n\u003ch5\u003e34\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enyāsa-pañcha-varṣa-pūrṇa-janma-bhūmi-darśanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekoṭi-koṭi-loka-lubdha-mugdha-dṛṣṭi-karṣaṇam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekoṭi-kaṇṭha-kṛṣṇa-nāma-ghoṣa-bheditāmbaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAo retornar ao seu local de nascimento depois de cinco longos anos de sannyāsī, o Senhor Supremo foi recebido igualmente por milhões de jovens e velhos. Os olhos de todos estavam ávi-dos para ver o Senhor, que atraía o mais profundo de seus corações. A presença extática do Senhor entusiasmou as multidões a continuamente ressoarem os Santos Nomes do Senhor Hari, e elas criaram um som tumultuoso que reverberou em todas as direções, além dos limites do céu. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"35\"\u003e\n\u003ch5\u003e35\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eārta-bhakta-śoka-śānti-tāpi-pāpi-pāvanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elakṣa-koṭi-loka-saṅga-kṛṣṇa-dhāma-dhāvanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erāma-keli-sāgrajāta-rūpa-karṣaṇādaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Gaurāṅgadev aliviou a ansiedade que os devotos sentiam devido à Sua longa separação e perdoou muitas almas pecadoras, ofensivas e movidas pela ansiedade tais como Gopāl Chāpāl e outras. O Senhor então começou a correr rumo a Vṛndāvan pelas margens do Ganges. Um oceano de pessoas o seguiu até a capital de Bengal, que naquela época era conhecida como Rāmakeli. Em Rāmakeli, o Senhor Gaurāṅga foi atraído por Seus dois associados eternos que atuavam como ministros no governo mulçumano. O Senhor mostrou profundo afeto por Śrīla Rūpa Goswāmī e seu irmão mais velho, Śrīla Sanātan Goswāmī. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a forma divina de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"36\"\u003e\n\u003ch5\u003e36\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evyāghra-vāraṇaina-vanya-jantu-kṛṣṇa-gāyakaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-nṛtya-bhāva-matta-jhāḍakhaṇḍa-nāyakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edurga-vanya-mārga-bhaṭṭa-mātra-saṅga-saukaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDeixando Rāmakeli, o Senhor continuou através de Bengal rumo a Jagannāth Purī. Depois de deixar Purī Dhām, o Senhor Chaitanya passou pela floresta de Jhāḍakhaṇḍa em Seu caminho a Vṛndāvan, onde inspirou os tigres, veados, elefantes e outros animais da selva a se juntarem ao canto congregacional dos Santos Nomes do Senhor Kṛṣṇa. Intoxicados pelos doces Nomes do Senhor, os animais com júbilo dançaram com Ele, que estava loucamente absorto nos êxtases devocionais mais profundos. O Senhor Supremo experimentou realizações profundas em Sua adoração solitária na medida em que se aprofundava pelos caminhos impenetráveis da selva de Jhāḍakhaṇḍa acompanhado por Balabhadra Bhaṭṭāchārya. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"37\"\u003e\n\u003ch5\u003e37\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egāṅga-yāmunādi-bindu-mādhavādi-mānanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emāthurārtta-chita-yāmunāgra-bhāga-dhāvanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esmārita-vrajāti-tīvra-vipralambha-kātaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Senhor Gaurasundar mostrou grande respeito às Deidades ao longo das margens do Ganges em Kāśī e em Bindu Mādhava na confluência do Ganges com o Yamunā em Prayāg. Seguindo a corrente do Yamunā, o Senhor começou a correr rápido em suas margens, ansioso atrás de um vislumbre do local sagrado conhecido como Mathurā. Quando os pensamentos divinos dos Passatempos de Vṛndāvan dominaram Sua memória e causaram sentimentos intoleráveis de separação, o Senhor Gaurasundar caiu inconsciente. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"38\"\u003e\n\u003ch5\u003e38\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emādhavendra-vipralambha-māthureṣṭa-mānanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-dṛṣṭakāma-pūrva-kuñja-kānanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egokulādi-goṣṭha-gopa-gopikā-priyaṅkaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Senhor Chaitanya afirmou que o sentimento de profunda separação que Mādhavendra Purī fora capaz de saborear, representado neste belo verso que foi primeiramente recitado por Śrīmatī Rādhārāṇī, é o ponto mais alto e o objeto desejável da adoração pura:\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eayi dīna-dayārdra nātha he\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emathurā-nātha kadāvalokyase\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehṛdayaṁ tvad-aloka-kātaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edayita bhrāmyati kiṁ karomy aham\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Ó meu Senhor! Ó mais gracioso mestre! Ó mestre de Mathurā! Quando Eu O verei novamente? Por não ver Você, Meu agitado coração se tornou instável. Ó mais amado, o que farei agora?” Depois que o Senhor entrou em Vraja—o cenário onde são realizados os Passatempos de amor puro—Ele foi vencido pela satisfação completa de Seu coração. O Senhor ficou encantado de ver os belos jardins e bosques da floresta que serviram como Seu parque de brincadeiras em Seus Passatempos espirituais em uma era anterior. Quando visitou as doze florestas de Vṛndāvan, o Senhor exibiu diferentes atitudes com os meninos e meninas vaqueiras. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificação de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"39\"\u003e\n\u003ch5\u003e39\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprema-guñjanāli-puñja-puṣpa-puñja-rañjitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egīta-nṛtya-dakṣa-pakṣi-vṛkṣa-lakṣa-vanditam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ego-vṛṣādi-nāda-dīpta-pūrva-moda-meduraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAo passear pelos bosques da floresta de Vṛndāvan, o Senhor foi recebido com alegria por enxames de abelhas que zumbiam muito ocupadas em discutir a respeito do amor puro, pairando suspensas sobre as flores desabrochadas. Milhões de árvores forrando os bosques da floresta, harmoniosamente ofereceram seus respeitos ao Senhor Gaurasundar em uníssono, com vários pássaros peritos em cantar e dançar em total deleite. A mente do Senhor transbordou de sentimentos amorosos quando Ele se lembrou de como as vacas, os bezerros e os bois da morada sagrada de Vṛndāvan afetuosamente chamavam por Ele em Seus Passatempos anteriores, desse modo exaltando Suas emoções de amor puro. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"40\"\u003e\n\u003ch5\u003e40\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprema-buddha-ruddha-buddhi-matta-nṛtya-kīrtanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eplāvitāśru-kāñchanāṅga-vāsa-chāturaṅganam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-kṛṣṇa-rāva-bhāva-hāsya-lāsya-bhāsvaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDesesperadamente tomado de uma inundação de amor puro, o Senhor Gaurasundar dançou e cantou enlouquecido os Santos Nomes de Kṛṣṇa. Uma corrente profusa de lágrimas fluiu de Seus olhos, passando sobre o brilho radiante de Sua enorme forma dourada, atravessando Suas vestes brilhantes como o sol, e depois se espalhando sobre o chão nas quatro direções. Os Passatempos alegres do Senhor foram extaticamente intensificados por tais gestos quando Ele pronunciou errado e em alto som o Santo Nome de Kṛṣṇa em um estado delirante, ou quando Ele soltou um rugido sorridente devido a estar extaticamente absorvido em profunda emoção. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificação de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-prema-mugdha-nritya-kirtanakularitantikam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"41\"\u003e\n\u003ch2\u003eŚrī Śrī Prema-dhāma-deva Stotram \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eQuarta-feira\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003ch5\u003e41\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprema-mugdha-nṛtya-kīrtanākulāriṭāntikaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esnāna-dhanya-vāri-dhānya-bhūmi-kuṇḍa-deśakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-kuṇḍa-rādhikākhya-śāstra-vandanādaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSobrecarregado pelos confusos ditames do amor puro por Deus, o Senhor Gaurasundar, dançando em êxtase, ansiosamente aproximou-se do Rādhā Kuṇḍa, o local sagrado que estava imanifesto naquela ocasião. O Senhor rapidamente banhou-Se nesse campo de arroz inundado, santificou a água, e revelou que se tratava do Śrī Rādhā Kuṇḍa. Em profunda humildade, o Senhor começou a cuidadosamente recitar versos das escrituras retratando o Śrī Rādhā Kuṇḍa como sendo a personificação divina do amor puro.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyathā rādhā priyā viṣṇos, tasyāḥ kuṇḍaṁ priyaṁ tathā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esarva gopīṣu saivaikā, viṣṇor-atyanta vallabhā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Do mesmo modo que Śrī Rādhā é muito querida do Senhor Kṛṣṇa, Seu lago divino, Śrī Rādhā Kuṇḍa, é muito querido do Senhor. Entre todas as donzelas vaqueiras, Ela é a associada mais querida do Senhor Kṛṣṇa.” Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificação de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"42\"\u003e\n\u003ch5\u003e42\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etintiḍī-talastha-yāmunormmi-bhāvanāplutaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enirjanaika-rādhikātma-bhāva-vaibhavāvṛtam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśyāma-rādhikāpta-gaura-tattva-bhittikākaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando Ele andou pelos vários locais em Vṛndāvan onde o Senhor Kṛṣṇa realizou Seus Passatempos, Ele visitou aquela famosa árvore de tamarindo que existia desde a Era de Dvāpar. Sentado sob a árvore de tamarindo, Suas lembranças dos Passatempos confidenciais de diversões aquáticas com as donzelas vaqueiras se despertaram quando Ele viu os gestos dançantes das ondas do Yamunā. Todo o ser do Senhor foi tomado ao saborear a doçura de Śrī Rādhā nas profundidades de Seu coração. Identificado com essa mesmíssima doçura e emoção que tomou todo Seu ser, Sua existência foi arrebatada. Este local é indicado como sendo o local de origem de Gaura-tattva, pois foi aqui que o Senhor Śyāmasundar ficou imensamente absorto no humor divino de Śrīmatī Rādhārāṇī. Śrī Chaitanya Mahāprabhu é a Própria origem de tudo e reside eternamente neste local. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"43\"\u003e\n\u003ch5\u003e43\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśārikā-śukokti-kautukāḍhya-lāsya-lāpitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhikā-vyatīta-kāmadeva-kāma-mohitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-vaśya-kṛṣṇa-bhāva-bhakta-hṛch-chamatkaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Senhor Gaurāṅga mencionou uma espirituosa conversa entre um casal de papagaios. Nessa conversa o Senhor Kṛṣṇa, o Cupido transcendental, é descrito como estando iludido por Seus profundos sentimentos de separação de Śrī Rādhā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erādhā-saṅge yadā bhāti, tadā ‘madana-mohanaḥ’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eayathā viśva-moho ’pi, svayaṁ ‘madana-mohitaḥ’\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO papagaio fêmea disse: “Quando o Senhor Kṛṣṇa está com Rādhārāṇī, Ele é o encantador do Cupido. P or outro lado, quando Ele está sozinho, ainda que Ele encante todo o universo, Ele Se sente encantado pelos sentimentos amorosos Dela”. Com este Passatempo, o Senhor Gaurāṅga encantou o coração dos devotos mostrando que a doçura e o encanto do Senhor Kṛṣṇa repousam em última análise no fato de que Ele pode ser subjugado pelo amor puro. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"44\"\u003e\n\u003ch5\u003e44\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-prayāga-dhāma-rūpa-rāga-bhakti-sañcharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-sanātanādi-kāśi-bhakti-śikṣaṇādaram\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaiṣṇavānurodha-bheda-nirvviśeṣa-pañjaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eFoi no local sagrado de Prayāg, no balneário conhecido como Daśāśvamedha Ghāṭ, que o Senhor Gaurāṅga ensinou a Śrīla Rūpa Goswāmī que o objetivo último de nossas práticas devocionais é saborear os doces humores encontrados em Śrī Vṛndāvan, e o Senhor o instruiu a distribuir amplamente essa doçura.\u003cbr\u003e\nMais tarde, em Kāśī, o Senhor descreveu elaboradamente a Śrīla Sanātan Goswāmī muitos tópicos sobre a dedicação pura, tais como o conhecimento sobre o entendimento apropriado do meio ambiente, os meios de aplicar esse conhecimento, e a meta última, que é obter amor puro pelo Supremo. Também, a pedido especial de um brāhmaṇ do Mahārāṣṭra, de Tapan Miśra e de outros devotos, o Senhor destruiu a concepção ignorante dos renunciantes māyāvādīs de Vārāṇasī. O Senhor Gaurāṅgadev se reuniu pessoalmente com os impersonalistas em uma assembleia pública, e mostrou que o humor deles de autoadoração baseava-se em última análise na inveja e na mesquinhez. Desse modo, o Senhor estabeleceu que a verdadeira independência é exibida por aqueles que adoram a Suprema Personalidade de Deus. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"45\"\u003e\n\u003ch5\u003e45\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enyāsi-lakṣa-nāyaka-prakāśānanda-tārakaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enyāsi-rāśi-kāśi-vāsi-kṛṣṇa-nāma-pārakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evyāsa-nāradādi-datta-vedadhī-dhurandharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEm Seu caminho de Vṛndāvan a Jagannāth Purī, o Senhor se encontrou com Śrīla Rūpa Goswāmī em Prayāg e ali o instruiu. Em seguida, o Senhor Gaurāṅga chegou a Vārāṇasī onde Se encontrou com Prakāśānanda Saraswatī, o líder de milhões de renunciantes impersonalisatas seguidores de Śrī Śaṅkar Āchārya. Por Sua personalidade pura e afetuosa, o Senhor Gaurāṅga resgatou Prakāśānanda Saraswatī do poço profundo da teoria da transformação de Śaṅkar Āchārya e intoxicou os sannyāsis e residente de Kāśī ocupando-os na glorificação aos Santos Nomes do Senhor Kṛṣṇa. Śrī Gaurāṅgadev foi o \u003ci\u003eexpert\u003c/i\u003e transcendental que concedeu a eles a passagem sobre o oceano material como um navio que carrega o néctar de todas as conclusões escriturais entregues na linha discipular que descendeu do sábio Nārad para Śrīla Vyāsadev. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"46\"\u003e\n\u003ch5\u003e46\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebrahma-sūtra-bhāṣya-kṛṣṇa-nāradopadeśakaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśloka-turya-bhāṣaṇānta-kṛṣṇa-samprakāśakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśabda-vartanānta-hetu-nāma-jīva-nistaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando o Senhor Chaitanyadev estava em Kāśī diante de uma grande assembleia de impersonalistas renunciados, Ele mostrou que o \u003ci\u003eŚrīmad Bhāgavatam\u003c/i\u003e, como é ensinado na genuína sucessão discipular do Senhor Kṛṣṇa a Nārad e entregue por este a Śrīla Vyāsadev, é o verdadeiro comentário das conclusões dos \u003ci\u003eVedānta-sūtras\u003c/i\u003e. Śrī Gaurāṅga também explicou os quatro versos fundamentais do \u003ci\u003eŚrīmad Bhāgavatam\u003c/i\u003e e revelou que o Senhor Kṛṣṇa é a realidade última além de toda dualidade e o princípio original de todo o arranjo universal. Através do aforismo Védico \u003ci\u003e‘anāvṛttiḥ śabdāt anāvṛttiḥ śabdāt’\u003c/i\u003e, o Senhor Chaitanya estabeleceu que os Santos Nomes do Senhor Kṛṣṇa são o som consciente em sua expressão mais elevada que concede o benefício máximo ao libertar a alma de seu estado de existência condicionada. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"47\"\u003e\n\u003ch5\u003e47\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eātma-rāma-vāchanādi-nirvviśeṣa-khaṇḍanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrauta-vākya-sārthakaika-chidvilāsa-maṇḍanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edivya-kṛṣṇa-vigrahādi-gauṇa-buddhi-dhikkaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAo explicar o famoso verso ātmarāma do \u003ci\u003eŚrīmad Bhāgavatam\u003c/i\u003e sessenta e uma vezes, o Senhor Gaurāṅga estraçalhou a doutrina impersonalista propagada por Śaṅkar Āchārya. O Senhor também recitou muitas referências dos Upaniṣads, tais como \u003ci\u003eapāṇi-pādo javano grahītā paśyaty achakṣuḥ sa śṛnoty akarṇaḥ\u003c/i\u003e, revelando a doce e encantadora natureza dos Passatempos espirituais da Verdade Absoluta. O Senhor Chaitanya censurou totalmente a odiosa concepção dos impersonalistas de que a Forma transcendental do Senhor Kṛṣṇa, o Nome, as Qualidades, os Passatempos e a manifestação de Deidade são simplesmente uma transformação imaginária da energia ilusória de Māyā. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"48\"\u003e\n\u003ch5\u003e48\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebrahma-pāramātmya-lakṣaṇādvayaika-vāchanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-vraja-svasiddha-nanda-līla-nanda-nandanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-rasa-svarūpa-rāsa-līla-gopa-sundaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando o Senhor Gaurāṅga Se referiu ao verso \u003ci\u003e“paramātmeti bhagavān iti śabdyate”\u003c/i\u003e do \u003ci\u003eŚrīmad Bhāgavatam\u003c/i\u003e, Ele harmoniosamente acomodou a concepção do aspecto não diferenciado da realidade, o Brahma, que é a meta última dos impersonalistas, com a concepção do aspecto localizado da realidade, Paramātma, que é a meta dos perfeccionistas místicos. O Senhor ajustou essas duas verdades mostrando que elas estavam incluídas dentro—e ultrapassadas pela—da concepção final da Verdade Absoluta não dual, Bhagavān, que é o princípio primordial da realidade. Ao revelar esta verdade axiomática em conexão com a natureza alegre e confidencial dos Passatempos espirituais do Senhor Supremo, o Senhor Gaurāṅga mostrou a natureza divina de Vraja, que existe acima dos planetas Vaikuṇṭha.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evaikuṇṭhāj janito varā madhu-purī tatrāpi rāsotsavād\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evṛndāraṇyam udāra-pāṇi-ramaṇāt tatrāpi govardhanaḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhā-kuṇḍam ihāpi gokula-pateḥ premāmṛtāplāvanāt\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekuryād asya virājato giri-taṭe sevāṁ vivekī na kaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Acima do plano espiritual de Vaikuṇṭha encontra-se Mathurā, onde Śrī Kṛṣṇa primeiro aparece. Superior a Mathurā está a floresta de Vṛndāvan onde Kṛṣṇa desfruta a Dança Rāsa. Melhor ainda é a Colina de Govardhan, que foi o local de Passatempos amorosos ainda mais confidenciais. Mas superior a todos eles é o Rādhā Kuṇḍa, que está localizado aos pés da Colina de Govardhan, e detém a posição suprema, pois está inundado com o néctar do tipo mais elevado de amor divino. Quem—familiarizado com a ciência da devoção—não aspirará pelo serviço divino a Śrīmatī Rādhārāṇī no Rādhā Kuṇḍa?” Inicialmente o Senhor Gaurāṅga revelou a natureza do serviço amoroso puro oferecido ao filho de Nanda Mahārāj no relacionamento paternal. Mas ao considerar os doces humores do fluxo da dedicação, o Senhor Gaurāṅga descreveu o aspecto último da personalidade do Senhor Supremo como sendo Śrī Gopī-jana-vallabha, cuja figura divina é o reservatório ilimitado de todos os humores primários e secundários saboreados em devoção pura. Śrī Gaurāṅga também sugeriu que os alegres e encantadores Passatempos do rāsa-līlā formam uma realidade todo-consciente que é a própria potência pessoal de Śrīmatī Rādhārāṇī. Tais Passatempos transcendentais são encontrados dentro do superexcelente e inconcebível mundo espiritual, e formam a mais elevada concepção de existência espiritual, auspiciosidade e beleza. O Senhor Gaurāṅga sugeriu que este é o objetivo supremo a ser alcançado pelas entidades vivas. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"49\"\u003e\n\u003ch5\u003e49\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erādhikā-vinoda-mātra-tattva-lakṣaṇānvayaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esādhu-saṅga-kṛṣṇa-nāma-sādhanaika-niśchayam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-sevanaika-mātra-sādhya-kṛṣṇa-tatparaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDesse modo, o Senhor Gaurāṅgadev ensinou que todas as conclusões escriturais, perfeitamente transmitidas pelos vários preceptores espirituais através do som, culminam na personificação de Śrī Rādhā Vinod, a base todo-abrangente do conhecimento apropriado do meio ambiente. O cantar dos Santos Nomes do Senhor Kṛṣṇa na associação dos devotos puros é o meio pelo qual a pessoa pode alcançar o Senhor Kṛṣṇa, e a meta última é o serviço em amor puro ao Senhor Kṛṣṇa, que é tão querido das vaqueiras de Vṛndāvan. O Senhor Gaurāṅgadev ensinou estas conclusões escriturais na assembleia dos eruditos. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"50\"\u003e\n\u003ch5\u003e50\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eātma-rāma-vāchanaika-ṣaṣṭikārtha-darśitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erudra-saṁkhya-śabda-jāta-yad-yad-artha-sambhṛtam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esarva-sarva-yukta-tat-tad-artha-bhūridākaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Senhor Gaurasundar explicou este famoso verso do \u003ci\u003eŚrīmad Bhāgavatam\u003c/i\u003e sessenta e uma vezes a Śrīla Sanātan Goswāmī, e mais tarde a Prakāśānanda Saraswatī:\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eātmārāmaś cha munayo nirgranthā apy urukrame\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekurvanty ahaitukīṁ bhaktim itthaṁ-bhūta guṇo hariḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Mesmo as almas liberadas plenamente satisfeitas no ser são irresistivelmente atraídas pelas superexcelentes qualidades de Kṛṣṇa e se rendem a Ele com devoção pura.” O Senhor recombinou cada uma das onze palavras encontradas nesse verso e estabeleceu que cada uma é um enorme reservatório de riqueza ilimitada dando suporte à conclusão da devoção pura. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-sanatananu-rupa-jiva-sampradayakam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"51\"\u003e\n\u003ch2\u003eŚrī Śrī Prema-dhāma-deva Stotram \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eQuinta-feira\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003ch5\u003e51\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī sanātanānurūpa-jīva-sampradāyakaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elupta-tīrtha-śuddha-bhakti-śāstra-suprachārakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enīla-śaila-nātha-pīṭha-naija-kārya-saukaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Senhor Gaurasundar revelou a Sua linha discipular ao inspirar Śrīla Sanātan Goswāmī, seu irmão mais jovem Śrīla Rūpa Goswāmī e Śrīla Jīva Goswāmī. O Senhor pediu que eles descobrissem os locais perdidos de peregrinação e compusessem literatura devocional pura que descrevesse a aplicação das práticas espirituais e da devoção espontânea. O Senhor Gaurāṅga também revelou amorosamente Sua personalidade adorável aos servos de Śrī Jagannāthdev em Nīlāchal (Śrī Purī Dhām). Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"52\"\u003e\n\u003ch5\u003e52\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etyāga-bāhya-bhoga-buddhi-tīvra-daṇḍa-nindanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erāya-śuddha-kṛṣṇa-kāma-sevanābhi-nandanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erāya-rāga-sevanokta-bhāgya-koṭi-duṣkaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Senhor Gaurasundar condenou fortemente aqueles que aceitavam as vestes de renunciantes, e mesmo assim, como macacos, na verdade abrigavam desejos por prazeres sensuais. Por outro lado, Ele ofereceu honras ao grande devoto Rāmānanda Rāy, por seus esforços devocionais de ensinar intimamente uma forma de dança dramática a algumas meninas, para o prazer do Senhor Jagannāth. Ao considerar que o serviço de Rāmānanda estava na plataforma da devoção espontânea, o Senhor proclamou que tal nível de serviço era uma grande fortuna, alcançável somente após milhões de nascimentos. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"53\"\u003e\n\u003ch5\u003e53\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-prayāga-bhaṭṭa-vallabhaika-niṣṭha-sevanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enīla-śaila-bhaṭṭa-datta-rāga-mārga-rādhanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī gadādharārpitādhikāra-mantra-mādhuraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Vallabha Bhaṭṭa, o famoso preceptor espiritual da sucessão discipular śuddhādvaita de Viṣṇu Swāmī, vivia no vilarejo de Āḍhāila, na sagrada Prayāg, e pessoalmente serviu o Senhor Gaurāṅgadev com devoção resoluta em sua residência. Mais tarde, em Jagannāth Purī, o Senhor Gaurāṅga permitiu a Vallabha Bhaṭṭa entrar e saborear a doçura experimentada no apego paternal ao bebê Kṛṣṇa. O Senhor também fez com que ele aprendesse de Śrī Gadādhar Paṇḍīt os mantras apropriados à adoração. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"54\"\u003e\n\u003ch5\u003e54\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-svarūpa-rāya-saṅga-gāmbhirāntya-līlanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edvādaśābda-vahni-garbha-vipralambha-śīlanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhikādhirūḍha-bhāva-kānti-kṛṣṇa-kuñjaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMergulhando fundo na realidade de Sua própria beleza e doçura, o Senhor Govinda roubou o humor de Rādhārāṇī e revestindo-se de Sua brilhante refulgência apareceu como Śrī Chaitanya Mahāprabhu. Nos últimos doze anos de Seus Passatempos manifestos, Ele ficou profundamente absorto em união e separação e compartilhou os sentimentos mais profundos de Seu coração com Seus devotos mais confidenciais, tais como Svarūp Dāmodar e Rāmānanda Rāya. Na agonia da separação de Kṛṣṇa, erupções vulcânicas de êxtase fluíram de Seu coração, e Seus ensinamentos, conhecidos com \u003ci\u003eŚikṣāṣṭakam\u003c/i\u003e, apareceram de seus lábios como um fluxo de lava dourada. Eu caio aos pés de Śrī Chaitanya Mahāprabhu, o vulcão dourado do amor divino.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"55\"\u003e\n\u003ch5\u003e55\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-svarūpa-kaṇṭha-lagna-māthura-pralāpakaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhikānu-vedanārtta-tīvra-vipralambhakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esvapnavat-samādhi-dṛṣṭa-divya-varṇanāturaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Gaurāṅgadev, abraçado ao pescoço de Śrīla Svarūp Dāmodar, começou a recitar com muita tristeza as orações que Śrīmatī Rādhārāṇī havia dito, na agonia da separação, quando o Senhor Kṛṣṇa deixou Vṛndāvan rumo a Mathurā. O Senhor saboreava continuamente o humor de Śrīmatī Rādhārāṇī, que sentia uma agonia jamais vista devido ao fogo ardente de Sua trágica separação do Senhor Kṛṣṇa. Com o coração pesado, o Senhor descrevia o que estava percebendo diretamente em Seu transe divino. Para as pessoas comuns, essas realizações são apenas como sonhos. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"56\"\u003e\n\u003ch5\u003e56\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esātvikādi-bhāva-chihna-deha-divya-sauṣṭhavaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekūrma-dharma-bhinna-sandhi-gātra-puṣpa-pelavam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehrasva-dīrgha-padma-gandha-rakta-pīta-pāṇḍuraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOs oito sintomas que retratam os sentimentos de dedicação pura decoravam e radiantemente intensificavam a beleza dos membros do corpo do Senhor. Às vezes, Ele ficava como uma tartaruga que tinha removido Seus membros para dentro da carapaça, e outras vezes Seu corpo ficava alongado com o deslocamento de suas juntas. Outras vezes, a figura do Senhor Gaurasundar era suave e aromática como uma flor de lótus. Em outras ocasiões, o corpo do Senhor ficava vermelho, amarelo, ou brilhante com uma cor branca de jasmim. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"57\"\u003e\n\u003ch5\u003e57\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etīvra-vipralambha-mugdha-mandirāgra-dhāvitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekūrma-rūpa-divya-gandha-lubdha-dhenu-veṣṭitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evarṇitāli-kūla-kṛṣṇa-keli-śaila-kandaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDominado pela tristeza e conquistado por sentimentos trágicos de separação, o Senhor Chaitanya correu veloz para o portão do leão, no grande templo do Senhor Jagannāth. Momentos mais tarde, o Senhor caiu no chão. Sentindo profunda separação, Ele manifestou a forma de Kūrmadev, a encarnação tartaruga, e uma doce e extraordinária fragrância começou a emanar do corpo inconsciente do Senhor. Isso atraiu as vacas telāṅgī que viviam no templo do Senhor Jagannāth , que cercaram o Senhor. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"58\"\u003e\n\u003ch5\u003e58\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eindu-sindhu-nṛtya-dīpta-kṛṣṇa-keli-mohitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eūrmi-śīrṣa-supta-deha-vāta-raṅga-vāhitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyāmunāli-kṛṣṇa-keli-magna-saukhya-sāgaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCerta vez, em uma noite iluminada pela lua, o Senhor Gaurāṅgadev saboreava os doces humores dos Passatempos do Senhor Kṛṣṇa e passeava pela praia com Seus associados. Repentinamente, o Senhor viu o reflexo da lua dançando nas ondas do mar. Inesperadamente, Ele foi dominado pelas lembranças dos Passatempos do Senhor Kṛṣṇa no rio Yamunā e caiu inconsciente. Em seguida, o corpo do Senhor Gaurāṅga, não visto pelos devotos, ficou tão leve quanto um pedaço de lenha, e em transe divino foi graciosamente levado sobre as ondas pelo deus do vento. Ao realizar os Passatempos e diversões aquáticas do Senhor Kṛṣṇa no Rio Kālindī com suas mais queridas amigas vaqueiras, o Senhor mergulhou fundo no oceano do êxtase divino. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"59\"\u003e\n\u003ch5\u003e59\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erātri-śeṣa-saumya-veśa-śāyitārdra-saikataṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhinna-sandhi-dīrgha-deha-pelavāti-daivatam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrānta-bhakta-chakratīrtha-hṛṣṭa-dṛṣṭi-gocharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDepois de procurar pelo Senhor a noite toda, os devotos exaustos finalmente O encontraram próximo a Chakratīrtha. Sua forma estava alongada e deitada sobre a areia molhada. Os olhos dos devotos ficaram inundados de alegria ao contemplarem a figura serena e delicada de seu Senhor. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"60\"\u003e\n\u003ch5\u003e60\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eārta-bhakta-kaṇṭha-kṛṣṇa-nāma-karṇa-hṛdgataṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elagna-sandhi-suṣṭhu-deha-sarva-pūrva-sammatam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eardha-bāhya-bhāva-kṛṣṇa-keli-varṇanāturaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando os devotos ansiosos começaram a cantar alto os Santos Nomes de Kṛṣṇa, essa vibração divina penetrou os ouvidos do Senhor e tocou as profundezas de Seu coração. Imediatamente, as articulações deslocadas do Senhor se reuniram, e Ele exibiu a bela figura que os olhos de Seus devotos estavam acostumados a contemplar. Em um estado de semiconsciência, o Senhor começou a descrever com profundos sentimentos de separação o que Ele vira enquanto estava absorto em transe divino. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-yamunambu-krishna-radhikali-keli-mandalam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"61\"\u003e\n\u003ch2\u003eŚrī Śrī Prema-dhāma-deva Stotram \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eSexta-feira\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003ch5\u003e61\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyāmunāmbu-kṛṣṇa-rādhikāli-keli-maṇḍalaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evyakta-gupta-dṛpta-tṛpta-bhaṅgi-mādanākulam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egūḍha-divya-marma-moda-mūrchchhanā-chamatkaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Rādhā–Govinda realizam vários Passatempos aquáticos encantadores nas águas sagradas do Yamunā em Vṛndāvan, com Suas amigas mais queridas, as donzelas vaqueirinhas. Esses Passatempos divinos algumas vezes são revelados, outras vezes permanecem ocultos, outras vezes se opõem uns aos outros, e outras vezes se harmonizam. Desse modo, os Passatempos do Senhor são expressos com diferentes gestos que manifestam diversos tipos de anseios espirituais. O som melodioso deste tesouro confidencial espiritual que estarrece o universo todo foi distribuído por Śrī Chaitanya Mahāprabhu. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"62\"\u003e\n\u003ch5\u003e62\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eāsya-gharṣaṇādi-chāṭakādri-sindhu-līlanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakta-marma-bhedi-tīvra-duḥkha-saukhya-khelanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eatyachintya-divya-vaibhavāśritaika-śaṅkaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAo contemplar a Colina Chāṭaka, o Senhor foi dominado por sentimentos intoleráveis de separação, o que provocou diferentes Passatempos no humor de adoração profunda, quando o Senhor começou a esfregar a Sua bela face no chão. Ao recordar os Passatempos aquáticos do Senhor Kṛṣṇa, Ele pulava no oceano e exibia os sintomas divinos de quem está intoxicado de amor puro. Ao realizar esses Passatempos, o Senhor inundou os corações dos devotos com ondas do grande oceano de amor por Kṛṣṇa. Essas ondas desesperadas carregavam tanto a ansiedade quanto a alegria transcendental até às margens dos corações dos devotos. Tal auspiciosidade inconcebível foi concedida somente aos associados mais rendidos do Senhor. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"63\"\u003e\n\u003ch5\u003e63\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrotra-netra-gatyatīta-bodha-rodhitādbhutaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-labhya-bhāva-siddha-chetanā-chamatkṛtam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebrahma-śambhu-veda-tantra-mṛgya-satya-sundaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Chaitanya Mahāprabhu não está apenas além da experiência mundana da visão e da audição, mas Ele também detém todos os esforços intelectuais de conhecê-Lo. Estando situado em amor puro ao Supremo, Ele permanece um mistério e surpreende até mesmo àquelas entidades vivas que estão fixas na autorrealização. Os Vedas revelados pelo Senhor Brahmā e as literaturas tântricas do Senhor Śiva simplesmente estão buscando por Śrī Gaurasundar, a realidade o belo. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"64\"\u003e\n\u003ch5\u003e64\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evipra-śūdra-vijña-mūrkha-yāvanādi-nāmadaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evitta-vikramochcha-nīcha-sajjanaika-sampadam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003estrī-pumādi-nirvvivāda-sārvavādikoddharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAo distribuir livremente o Santo Nome de Kṛṣṇa, Śrī Gaurāṅgadev purificou a classe dos eruditos intelectuais, a classe operária, os iletrados, e mesmo as classes mais baixas da sociedade. O Senhor foi a personificação da maior riqueza para todas as almas sinceras e gentis, ricas e pobres, aristocráticas e de nascimento inferior. Portanto, o Senhor Chaitanya é respeitado e igualmente honrado por homens e mulheres como o salvador de todos, tanto no mundo material quanto no espiritual. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"65\"\u003e\n\u003ch5\u003e65\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esindhu-śūnya-veda-chandra-śāka-kumbha-pūrṇimā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esāndhya-chāndrakoparāga-jāta-gaura-chandramā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esnāna-dāna-kṛṣṇa-nāma-saṅga-tat-parātparaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eComo uma lua dourada, Śrī Gaurachandra apareceu no ano de 1407 Śakābda (1486 D.C.), durante o começo de um eclipse lunar ao anoitecer da lua cheia do mês de março. Quando a Verdade Absoluta Śrī Gaurāṅgadev encarnou no belo pátio de Śachīdevī, todos os residentes de Māyāpur banhavam-se no sagrado Ganges, cantando em congregação os Santos Nomes de Hari, e fazendo suas oferendas de vários tipos de joias ao Senhor. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"66\"\u003e\n\u003ch5\u003e66\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eātma-siddha-sāvalīla-pūrṇa-saukhya-lakṣaṇaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esvānubhāva-matta-nṛtya-kīrtanātma-vaṇṭanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eadvayaika-lakṣya-pūrṇa-tattva-tat-parātparaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eA concepção mais elevada da Verdade Absoluta deve ser também a forma mais elevada de ānanda, êxtase. O dançar de Mahāprabhu indica que Ele é repleto de êxtase, e Seu kīrtan é a distribuição deste rasa. Então, se cientificamente formos buscar quem é Mahāprabhu, só podemos descobrir que Ele é a Realidade Última. Ele está enlouquecido saboreando seu próprio néctar interno, e Seu dançar é o resultado de Seu êxtase transcendental. E Ele está cantando, distribuindo isso aos outros. Portanto, estudando muito de perto a característica de Śrī Chaitanya Mahāprabhu, só podemos concluir que Ele é a Suprema Verdade Absoluta em sua expressão mais completa e dinâmica. Eu ofereço minha reverência à morada de amor divino, Śrī Gaurasundar, a personificação do êxtase total, auto-manifesto e dinâmico. Extático pela experiência de Si mesmo, Ele dança, canta, e Se distribui. Repleto destas características sem paralelos, Ele é a Suprema Verdade Absoluta.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"67\"\u003e\n\u003ch5\u003e67\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-purīśvarānukampi-labdha-dīkṣa-daivataṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśavākhya-bhāratī-sakāśa-keśa-rakṣitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emādhavānudhī-kiśora-kṛṣṇa-sevanādaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Īśvar Purī tornou-se muito afortunado quando o Senhor Gaurāṅga exibiu Sua misericórdia sem causa aceitando iniciação dele. Śrī Keśava Bhāratī foi do mesmo modo favorecido, pois em sua presença o Senhor Gaurāṅga raspou Seus belos cabelos cacheados e aceitou dele as vestes de renunciante. E o Senhor Chaitanya ofereceu atenção fixa a Śrī Mādhavendra Purī, declarando que seu apego em servir a forma kiśor do Senhor Kṛṣṇa em amor conjugal era a expressão mais elevada de dedicação. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"68\"\u003e\n\u003ch5\u003e68\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esindhu-bindu-veda-chandra-śāka-phālgunoditaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enyāsa-soma-netra-veda-chandra-śāka-bodhitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evāṇa-vāṇa-veda-chandra-śāka-lochanāntaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOfereço meus respeitos a Śrī Chaitanyadev, quem ascendeu como uma Lua dourada em Śrī Māyāpur em 1407 Śakābda, revelou o Passatempo de aceitar as vestes da ordem de vida renunciada, sannyās, em 1431 Śakābda afim de bendizer todo o universo material, e desapareceu da visão ordinária das pessoas deste mundo em 1455 Śakābda. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"69\"\u003e\n\u003ch5\u003e69\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-svarūpa-rāya-saṅga-harṣa-śeṣa-ghoṣaṇaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśikṣaṇāṣṭakākhya-kṛṣṇa-kīrtanaika-poṣaṇam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-nāma-mātra-viśva-jīvanaika-sambharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumigaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCom grande alegria, Śrī Gaurasundar ensinou Seus mais queridos associados, Śrīla Svarūp Dāmodar e Śrīla Rāmānanda Rāy, que o processo do canto congregacional dos Santos Nomes de Kṛṣṇa concede a mais alta bênção às entidades vivas nesta era de Kali:\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eharṣe prabhu kahena, “śuna svarūpa-rāma-rāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma saṅkīrtana kalau, parama upāya”\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEm Sua famosa composição, \u003ci\u003eŚikṣāṣṭakam\u003c/i\u003e também, o Senhor Gaurāṅga colocou o cantar dos Nomes do Senhor Kṛṣṇa no nível mais elevado de importância. O Senhor Supremo ensinou ainda que cantar os Nomes do Senhor Kṛṣṇa com amor puro por Deus nutre perfeitamente, e satisfaz plenamente todas as entidades vivas no universo. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"70\"\u003e\n\u003ch5\u003e70\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprema hema-deva dehi-dāsareṣa manyatāṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṣamyatāṁ mahāparādha-rāśireṣa-gaṇyatām\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erūpa-kiṅkareṣu rāmānanda-dāsa-sambharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ meu Senhor Dourado (\u003ci\u003esuvarṇa-varṇo hemāṅgo\u003c/i\u003e)! Ó oceano de prema! Bondosamente conceda-me a riqueza de Seu amor divino! Por favor, dê uma pequenina atenção a esta alma caída e perdoe suas ofensas ilimitadas. Existem tantos servos de Śrī Rūpa que são tão queridos Seus. Minha única aspiração é que o Senhor me inclua entre estes servos. Ó Gaurasundar, Você é o único protetor e a personificação da boa fortuna para mim, Rāmānanda Dās. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"71\"\u003e\n\u003ch5\u003e71\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esaśraddhaḥ sapta-daśakaṁ prema-dhāmeti-nāmakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003estavaṁ ko ’pi paṭhan gauraṁ rādhā-śyāma-mayaṁ vrajet\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuem recitar com fé esta composição de setenta versos conhecida como “\u003ci\u003ePrema-dhāma-deva Stotram\u003c/i\u003e” terá a oportunidade de servir ao belo Senhor Dourado, Gaurāṅgasundar, que é o próprio Śyāmasundar revestido do coração e da aura (bhāva e kānti) de Śrīmatī Rādhārāṇī.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"72\"\u003e\n\u003ch5\u003e72\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epañchame śata-gaurābde śrī-siddhānta-sarasvatī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrīdharaḥ ko ’pi tach chhiṣyas tridaṇḍī-nauti-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEstas orações foram compostas no quinto século após o aparecimento de Śrī Chaitanya Mahāprabhu por um certo sannyāsi discípulo de Śrīla Saraswatī Ṭhākur conhecido como Śrīdhar.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eDias Sagrados\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-krishna-hoite-chatur-mukha\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Guru-paramparā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eVersículos 1-9 compuestos por Śrīla Sarasvatī Ṭhākur\u003c/h3\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛṣṇa haite chatur-mukha hana kṛṣṇa-sevonmukha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;brahmā haite nāradera mati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enārada haite vyāsa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;madhva kahe vyāsa dāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pūrṇaprajña padmanābha gati\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDa associação com Kṛṣṇa, Brahmā se tornou devotado ao serviço de Kṛṣṇa. Pela associação com Brahmā, Nārad Muni se tornou devotado. Após Nārad veio Kṛṣṇa Dvaipāyan Vedavyās. Pūrṇaprajña Madhva Āchārya declarou que era servo de Vyās. Ele era Guru de Padmanābha Tīrtha.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enṛhari mādhava-vaṁśe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;akṣobhya paramahaṁse\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śiṣya bali’ aṅgīkāra kare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eakṣobhyera śiṣya jaya-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tīrtha nāme parichaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tā̐ra dāsye jñānasindhu tare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNṛhari Tīrtha e Mādhava Tīrtha também foram discípulos na linha de Madhva Āchārya. Mādhava Tīrtha aceitou o para-mahaṁsa Akṣobhya Tīrtha como seu discípulo. O discípulo de Akṣobhya Tīrtha foi Jaya Tīrtha. O servo de Jaya Tīrtha foi Jñānasindhu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etā̐hā haite dayānidhi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tā̐ra dāsa vidyānidhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rājendra ha-ila tā̐hā haite\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etā̐hāra kiṅkara jaya-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dharma nāme parichaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;paramparā jāna bhāla mate\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDepois de Jñānasindhu veio Dayānidhi. O servo de Dayānidhi foi Vidyānidhi. Depois de Vidyānidhi veio Rājendra. O servo de Rājendra foi Jaya Dharma. Conheça o paramparā adequadamente desta forma.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejayadharma-dāsye khyāti\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī puruṣottama-yati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tā̐’ha’te brahmaṇya-tīrtha sūri\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evyāsatīrtha tā̐ra dāsa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;lakṣmīpati vyāsa-dāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tā̐hā haite mādhavendra purī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO renomado servo de Jaya Dharma foi Śrī Puruṣottam Tīrtha. Depois de Śrī Puruṣottam Tīrtha veio o erudito Brahmaṇya Tīrtha. O servo de Brahmaṇya Tīrtha foi Vyāsa Tīrtha. O servo de Vyās Tīrtha foi Lakṣmīpati. Depois de Lakṣmīpati veio Mādhavendra Puri.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emādhavendra purī-vara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śiṣya-vara śrī-īśvara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nityānanda, śrī-advaita vibhu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eīśvara-purīke dhanya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;karilena śrī-chaitanya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jagad-guru gaura mahāprabhu\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOs melhores discípulos do grande Mādhavendra Puri foram Īśvar Purī, o Senhor Nityānanda e o Senhor Śrī Advaita. O Jagad-guru Śrī Chaitanya Mahāprabhu abençoou Īśvar Purī (aceitando Īśvar Purī como Seu Guru.)\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emahāprabhu śrī-chaitanya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rādhā-kṛṣṇa nahe anya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rūpānuga janera jīvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eviśvambhara priyaṅkara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī svarūpa-dāmodara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī gosvāmī rūpa-sanātana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Chaitanya Mahāprabhu de fato, é não diferente de Śrī Śrī Rādhā–Kṛṣṇa e é a própria vida dos seguidores de Śrī Rūpa. Śrīla Svarūp Dāmodar Gosvāmī, Śrīla Rūpa Gosvāmī Prabhu, e Śrīla Sanātan Gosvāmī Prabhu são os mais queridos de Viśvambhar.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erūpa-priya mahājana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jīva-raghunātha hana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tā̐ra priya kavi kṛṣṇadāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-dāsa-priya-vara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;narottama sevāpara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;yā̐ra pada viśvanātha-āśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOs queridos seguidores de Śrī Rūpa são as grandes almas Śrī Jīva e Śrī Raghunāth. O querido seguidor deles é Śrīla Kṛṣṇadās Kavirāj. Seu seguidor mais querido é Śrī Narottam, que está sempre engajado no serviço divino. Seus pés são a aspiração de Śrī Viśvanāth Chakravartī Ṭhākur.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eviśvanātha-bhakta-sātha\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;baladeva jagannātha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tā̐ra priya śrī-bhakti-vinoda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emahā-bhāgavata-vara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-gaura-kiśora-vara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hari-bhajanete yā̐ra moda\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOs devotos mais importantes de Śrīla Viśvanāth Chakravartī Ṭhākur são Śrīla Baladev Vidyābhūṣaṇ e Śrīla Jagannath Dās Bābājī. Seu querido seguidor é Śrīla Bhakti Vinod Ṭhākur. Seu associado é o melhor dos devotos de nível superior, Śrīla Gaura Kiśor Dās Bābājī, cuja única alegria é o serviço de Śrī Hari.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etadanuga-mahājana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-kṛṣṇa-kīrtana-dhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;yebā dila puri jaga kāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī vārṣabhānavī-varā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadā sevya sevāparā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tā̐hāra dayita-dāsa nāma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO seguidor de Śrīla Gaura Kiśor Dās Bābājī, a grande alma Dayita Dās (Śrīla Saraswati Ṭhākur), cuja riqueza é o Śrī Kṛṣṇa-kīrtan, realizou os desejos de todo o mundo. Ele é o mais querido de Śrī Vārṣabhānavī e está sempre ocupado a serviço Dela.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etad abhinna deha-divya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;svarūpa-rūpa-raghu-jivya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadā sevya yā̐ra pādapadma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esusiddhānta mūrti-dhara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī śrīdhara guru-vara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rupānuga-sādhu-śreya-sadma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eA forma divina não diferente de Śrī Dayita Dās, a manifestação viva de Śrīla Svarūp Dāmodar, Śrī Rūpa e Śrī Raghunāth, cujos pés de lótus devem ser servidos eternamente, é o melhor dos Gurus, Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj. Ele é a personificação do perfeito siddhanta e o refúgio final dos sādhus que seguem Śrī Rūpa.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etā̐ra priya mano ’bhīṣṭa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sthāpane sadā sacheṣṭa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhakti sundara śrī govinda nāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etā̐ra priya manonīta\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āchāra-prachāre rata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī bhakti-nirmalāchārya nāma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSeu querido discípulo, que constantemente se esforça para realizar seus desejos, é Śrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj. O querido sucessor de Śrīla Govinda Mahārāj, que é dedicado a praticar e pregar seus ensinamentos, é Śrīla Bhakti Nirmal Āchārya Mahārāj.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eei paramparā dhana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sabe gaura-nija-jana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tā̐dera uchchhiṣṭe mora kāma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTodos os Gurus nesta sucessão são associados de Śrī Gaurāṅga. Eu oro por seus remanentes.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-je-anilo-prema-dhana-karuna-prachura\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eViraha-gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eye ānila prema-dhana karuṇā prachura\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehena prabhu kothā gelā āchārya ṭhākura\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePara onde foi Advaita Āchārya, o Senhor que misericordiosamente trouxe a riqueza do amor divino para este mundo?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekā̐hā mora rūpa kā̐hā sanātana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekā̐hā dāsa raghunātha patita-pāvana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOnde estão meus Svarūp, Rūpa e Sanātan? Onde está o meu Raghunāth Dās? Onde estão os salvadores das almas caídas?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekā̐hā mora bhaṭṭa-yuga kā̐hā kavirāja\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eeka-kāle kothā gelā gorā naṭa-rāja\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOnde estão meus Raghunāth Bhaṭṭa e Gopāl Bhaṭṭa? Onde está meu Kṛṣṇadās Kavirāj? Para onde de repente o grande dançarino Śrī Gaurāṅga foi?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epāṣāṇe kuṭiba māthā anale paśiba\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaurāṅga guṇera nidhi kothā gele pāba\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu vou quebrar minha cabeça em uma pedra, vou entrar no fogo—onde devo ir para alcançar o reservatório de todas as qualidades, Śrī Gaurāṅga?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ese saba saṅgīra saṅge ye kaila vilāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ese saṅga nā pāñā kānde narottama dāsa\u00
