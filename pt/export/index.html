y!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eAnanta-koṭī Vaiṣṇava-vṛnda kī jay!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eSamaveta Vaiṣṇava-vṛnda kī jay!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eHari-nām-saṅkīrtan kī jay!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eNitāi Gaura Premānande! Haribol!\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eĀrati\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-jaya-jaya-gurudever-arati-ujjvala\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Guru Ārati \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīpād B. A. Paramahaṁsa Mahārāj\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya jaya gurudever ārati ujjvala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egovardhana-pāda-pīṭhe bhuvana-maṅgala\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória ao radiante ārati de Śrīla Gurudev que acontece aos pés de Govardhan para benefício de todo o universo!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī bhakti sundara deva prabhu śiromaṇi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egosvāmī govinda jaya ānandera khani\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória à fonte de alegria, Śrī Bhakti Sundar Govinda Dev-Goswāmī, que é a joia da coroa dos Gurus!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eājānu lambita bhuja divya kalevara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eananta pratibhā bharā divya guṇadhara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eA forma divina de seus braços se estende aos seus joelhos. Você possui genialidade infinita e qualidades divinas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaura-kṛṣṇe jāni tava abhinna svarūpa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaṁsāra tarite ebe śuddha-bhakta-rūpa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu sei que você é não diferente de Śrī Gaura Kṛṣṇa e agora assumiu a forma de um devoto puro para libertar o mundo.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erūpānuga-dhārā tumi kara ālokita\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprabhākara sama prabhā bhuvana-vidita\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVocê ilumina a linha de Śrī Rūpa. Como o sol, sua refulgência é conhecida por todo o mundo.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśuddha bhakti prachārite tomā sama nāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eakalaṅka indu yena dayāla nitāi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNão há ninguém como você para pregar devoção pura. Você é uma lua sem mácula tal como o misericordioso Nityānanda.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eullasita viśva-vāsī labhe prema-dhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eānande nāchiyā gāhe tava guṇa-gaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAtingindo a riqueza do amor divino (pela sua graça), almas alegres cantam suas glórias por todo o mundo, dançando em êxtase.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esthāpilā āśrama bahu jagata mājhāre\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epāramahaṁsa-dharma-jñāna śikṣāra prachāre\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVocê estabeleceu muitos ashrams por todo o mundo para ensinar o paramahaṁsa-dharma (a maneira dos Vaiṣṇavas verdadeiros).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echintyāchintya veda-jñāne tumi adhikārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esakala saṁśaya chhettvā susiddhānta-dhārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVocê é o mestre tanto do conhecimento Védico concebível quanto do inconcebível. Você lança fora todas as dúvidas e representa os ensinamentos da verdade.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra mahimā gāhe goloka maṇḍale\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enitya-siddha parikare tava līlā-sthale\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSeus associados, eternamente liberados, cantam suas glórias em Goloka, o reino de seus Passatempos.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epatita pāvana tumi dayāra samīra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esarva-kārye sunipuṇa satya-sugambhīra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVocê é o salvador dos caídos e uma brisa de misericórdia. Você é verdadeiro, profundo, e \u003ci\u003eexpertise\u003c/i\u003e em todos os tipos de serviço.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eapūrva lekhanī dhārā pragāḍha pāṇḍitya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esadā hāsya miṣṭa-bhāṣī suśīla kavitva\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSeus escritos são incomparavelmente maravilhosos e seu conhecimento é profundo. Você sempre sorri e diz palavras doces. Sua poesia é perfeita.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esādhu-saṅge sadānandī sarala vinayī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esabhā-madhye vaktā śreṣṭha sarvatra vijayī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVocê está sempre alegre na associaçao dos sādhus. Você é simples e humilde. Nas assembleias, você é o melhor orador.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"14\"\u003e\n\u003ch5\u003e14\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egauḍīya gagane tumi āchārya-bhāskara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enirantara sevā-priya miṣṭa kaṇṭhasvara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNo céu dos Gauḍīya Vaiṣṇavas, você é o Āchārya solar. Você sempre gosta de serviço, e sua voz é doce.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"15\"\u003e\n\u003ch5\u003e15\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra karuṇā māge trikāla vilāse\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egāndharvikā-giridhārī sevā-mātra āśe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNo passado, presente, e futuro este servo ora por sua misericórdia, desejando apenas servir Śrī Śrī Gāndharvikā-Giridhārī.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"16\"\u003e\n\u003ch5\u003e16\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛpā kara ohe prabhu śrī-gaura-prakāśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eārati karaye sadā e adhama dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSeja misericordioso, Ó senhor, manifestação de Śrī Gaurāṅga! Este servo caído sempre te adora.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-guru-maharaja-jati-rajeshvara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Guru Ārati Stuti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya ‘guru-mahārāja’ yati-rājeśvara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-bhakti-rakṣaka deva-gosvāmī śrīdhara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória a Śrīla Guru Mahārāj, Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī, o líder dos tridaṇḍi-sannyāsīs!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epatita-pāvana-līlā vistāri’ bhuvane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enistārilā dīna-hīna āpāmara jane\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVocê revelou seus Passatempos neste mundo como o salvador dos caídos e liberou os mais baixos, os mais caídos, e as almas desventuradas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra karuṇā-ghana murati heriyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epreme bhāgyavāna jīva paḍe murachiyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eContemplando sua forma intensamente misericordiosa, as almas afortunadas desmaiam de amor divino.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esudīrgha supībya deha divya-bhāvāśraya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edivya-jñāna-dīpta-netra divya-jyotirmaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSua forma altiva e encantadora é uma morada de emoção divina, cheia de brilho divino. Seus olhos são iluminados com conhecimento divino.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esuvarṇa-sūraja-kānti aruṇa-vasana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etilaka, tulasī-mālā, chandana-bhūṣaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSua forma é adornada com tilak, contas de tulasī, pasta de sândalo, roupas açafrão, e um brilho dourado como o do sol.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eapūrva śrī-aṅga-śobhā kare jhalamala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eaudārya-unnata-bhāva mādhurya-ujjvala\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eA extraordinária beleza de sua forma divina brilha com a alegria exaltada da benevolência, o esplendor da doçura divina.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eachintya pratibhā, snigdha, gambhīra, udāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaḍa-jñāna-giri-vajra divya-dīkṣādhāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVocê é dotado de inconcebíveis gênio, afeição, gravidade, e magnanimidade. Você é um raio sobre a montanha do conhecimento mundano, e o canal da revelação divina.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaura-saṅkīrtana-rāsa-rasera āśraya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e“dayāla nitāi” nāme nitya premamaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVocê é a morada da alegria da dança do saṅkīrtan de Śrī Gaurāṅga, e você está sempre cheio de amor divino quando diz: “Dayāl Nitāi”.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esāṅgopāṅge gaura-dhāme nitya-parakāśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egupta-govardhane divya-līlāra-vilāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSeus Passatempos divinos, que acontecem com os seus associados, na Oculta Colina de Govardhan na morada de Śrī Gaurāṅga, são manifestos eternamente.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egauḍīya-āchārya-goṣṭhī-gaurava-bhājana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egauḍīya-siddhānta-maṇi kaṇṭha-vibhūṣaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVocê é reverenciado pela assembleia dos Gauḍīya Āchāryas. Seu pescoço é adornado com a joia do Gauḍiya-siddhānta.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaura-sarasvatī-sphūrta siddhāntera khani\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāviṣkṛta gāyatrīra artha-chintāmaṇi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVocê é a mina do siddhānta revelado por Śrī Gaurāṅga e por Śrīla Saraswatī Ṭhākur. Você revelou o significado divino do mantra gāyatrī.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eeka-tattva varṇanete nitya-nava-bhāva\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esusaṅgati, sāmañjasya, e saba prabhāva\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSua sempre nova alegria quando você descreve o Absoluto, seus ajustes, suas harmonias—tamanha grandeza ...\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra satīrtha-varga sabe eka-mate\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erūpa-sarasvatī-dhārā dekhena tomāte\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePor unanimidade seus irmãos espirituais vêm dentro de você a revelação de Śrī Rūpa e de Śrīla Saraswatī Ṭhākur.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"14\"\u003e\n\u003ch5\u003e14\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etulasī-mālikā-haste śrī-nāma-grahaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edekhi’ sakalera haya ‘prabhu’ uddīpana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVendo você cantar os Santos Nomes com as contas de tulasī em suas mãos, todos se lembram de Prabhupād Śrīla Saraswatī Ṭhākur.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"15\"\u003e\n\u003ch5\u003e15\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekoṭī-chandra-suśītala o pada bharasā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egāndharvā-govinda-līlāmṛta-lābha-āśā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO abrigo dos seus pés, que são refrescantes como milhões de luas, é nossa esperança de atingir o néctar dos Passatempos de Śrī Śrī Rādhā–Govinda.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"16\"\u003e\n\u003ch5\u003e16\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eavichintya-bhedābheda-siddhānta-prakāśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esānande ārati stuti kare dīna-dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ manifestação do princípio da inconcebível diferença e não diferença (união na separação)! Este servo humilde canta suas glórias e o adora com alegria.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-jaya-girirajer-arati-vishiala\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Govinda Kuṇḍa Govardhan Ārati \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya jaya girirājer ārati viśāla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-gaura-maṇḍala-mājhe bhuvana-maṅgala\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ejaya\u003c/i\u003e–Glória! \u003ci class=\"wbw__term\"\u003ejaya\u003c/i\u003e–Glória \u003ci class=\"wbw__term\"\u003eviśāla\u003c/i\u003e–ao grande \u003ci class=\"wbw__term\"\u003eāratika\u003c/i\u003e–ārati \u003ci class=\"wbw__term\"\u003egirirājer\u003c/i\u003e–de Śrī Girirāj! \u003ci class=\"wbw__term\"\u003emājhe\u003c/i\u003e–No coração \u003ci class=\"wbw__term\"\u003emaṇḍala\u003c/i\u003e–da terra \u003ci class=\"wbw__term\"\u003eśrī-gaura\u003c/i\u003e–de Śrī Gaura, [você é] \u003ci class=\"wbw__term\"\u003emaṅgala\u003c/i\u003e–a boa fortuna \u003ci class=\"wbw__term\"\u003ebhuvana\u003c/i\u003e–do mundo!\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGlória! Glória ao grande ārati de Śrī Girirāj! No coração da terra de Śrī Gaura, você Girirāj é a boa fortuna do mundo!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekoladvīpe śobhe gupta-govardhana-rūpa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evyakta hailā śrī-govinda-kuṇḍe aparūpa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Sua] \u003ci class=\"wbw__term\"\u003erūpa\u003c/i\u003e–forma [como] \u003ci class=\"wbw__term\"\u003egovardhana\u003c/i\u003e–Govardhan \u003ci class=\"wbw__term\"\u003egupta\u003c/i\u003e–Oculta \u003ci class=\"wbw__term\"\u003evyakta hailā\u003c/i\u003e–se manifestou \u003ci class=\"wbw__term\"\u003ekoladvīpe\u003c/i\u003e–em Koladwīp [com] \u003ci class=\"wbw__term\"\u003eaparūpa\u003c/i\u003e–incomparável \u003ci class=\"wbw__term\"\u003eśobhe\u003c/i\u003e–beleza \u003ci class=\"wbw__term\"\u003eśrī-govinda-kuṇḍe\u003c/i\u003e–[ao lado do] Śrī Govinda Kuṇḍa.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSua forma como Govardhan Oculta se manifestou em Koladwīp com incomparável beleza ao lado do Śrī Govinda Kuṇḍa.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emālatī-mādhavī-kuñja kandare kandare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enigūḍha nikuñja-līlā hari manohare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003elīlā\u003c/i\u003e–A brincadeira [nos] \u003ci class=\"wbw__term\"\u003enikuñja\u003c/i\u003e–caramanchões \u003ci class=\"wbw__term\"\u003enigūḍha\u003c/i\u003e–ocultos \u003ci class=\"wbw__term\"\u003ekandare kandare\u003c/i\u003e–entre as cavernas [e] \u003ci class=\"wbw__term\"\u003ekuñja\u003c/i\u003e–arbustos [de] \u003ci class=\"wbw__term\"\u003emālatī\u003c/i\u003e–mālatī [e] [trepadeiras de] \u003ci class=\"wbw__term\"\u003emādhavī\u003c/i\u003e–mādhavī \u003ci class=\"wbw__term\"\u003emanohare\u003c/i\u003e–cativa o coração \u003ci class=\"wbw__term\"\u003ehari\u003c/i\u003e–do Senhor.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eA brincadeira nos caramanchões ocultos entre suas cavernas, arbustos de mālatī e trepadeiras de mādhavī cativa o coração do Senhor.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eapūrva kuṇḍera śobhā yena sudhā-bhāṇḍa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esurendra-surabhi-sevā-saubhāgya-mārtaṇḍa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eapūrva\u003c/i\u003e–A incomparável \u003ci class=\"wbw__term\"\u003eśobhā\u003c/i\u003e–beleza \u003ci class=\"wbw__term\"\u003ekuṇḍera\u003c/i\u003e–do lago [é] \u003ci class=\"wbw__term\"\u003eyena\u003c/i\u003e–como \u003ci class=\"wbw__term\"\u003ebhāṇḍa\u003c/i\u003e–uma piscina \u003ci class=\"wbw__term\"\u003esudhā\u003c/i\u003e–de mel [e é] \u003ci class=\"wbw__term\"\u003emārtaṇḍa\u003c/i\u003e–o sol [acima do] \u003ci class=\"wbw__term\"\u003esevā\u003c/i\u003e–serviço [e da] \u003ci class=\"wbw__term\"\u003esaubhāgya\u003c/i\u003e–boa fortuna \u003ci class=\"wbw__term\"\u003eindra\u003c/i\u003e–do rei \u003ci class=\"wbw__term\"\u003esura\u003c/i\u003e–dos deuses [e de] \u003ci class=\"wbw__term\"\u003esurabhi\u003c/i\u003e–Surabhi.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eA beleza incomparável do Śrī Govinda Kuṇḍa se assemelha a uma piscina de mel, e é o sol acima do serviço e da boa fortuna do Senhor Indra e de Surabhi.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-bhakti-rakṣaka deva-gosvāmī śrīdhara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprakāśilā tava sevā dīpta manohara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eśrī-bhakti-rakṣaka śrīdhara deva-gosvāmī\u003c/i\u003e–Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj \u003ci class=\"wbw__term\"\u003eprakāśilā\u003c/i\u003e–estabeleceu \u003ci class=\"wbw__term\"\u003etava\u003c/i\u003e–seu \u003ci class=\"wbw__term\"\u003edīpta\u003c/i\u003e–brilhante \u003ci class=\"wbw__term\"\u003emanohara\u003c/i\u003e–cativante, atraente \u003ci class=\"wbw__term\"\u003esevā\u003c/i\u003e–serviço.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj estabeleceu seu brilhante, cativante serviço.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-chaitanya-sārasvata-maṭha suśobhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyathā nitya-sevā kare sārasvata-gaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eśrī-chaitanya-sārasvata-maṭha\u003c/i\u003e–[O] Śrī Chaitanya Sāraswat Maṭh \u003ci class=\"wbw__term\"\u003eyathā\u003c/i\u003e–onde \u003ci class=\"wbw__term\"\u003esārasvata-gaṇa\u003c/i\u003e–os seguidores de Śrīla Saraswatī Ṭhākur \u003ci class=\"wbw__term\"\u003ekare\u003c/i\u003e–executam [seus] \u003ci class=\"wbw__term\"\u003esevā\u003c/i\u003e–serviços \u003ci class=\"wbw__term\"\u003enitya\u003c/i\u003e–diários [é] \u003ci class=\"wbw__term\"\u003esuśobhana\u003c/i\u003e–extremamente belo.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Śrī Chaitanya Sāraswat Maṭh, onde os seguidores de Śrīla Saraswatī Ṭhākur executam seus serviços diários, é extremamente belo.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egosvāmī śrī-raghunātha-dāsere smariyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enirantara sevā kare antarmanā haiyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003esmariyā\u003c/i\u003e–[Se] lembrando \u003ci class=\"wbw__term\"\u003eśrī-raghunātha-dāsere gosvāmī\u003c/i\u003e–[de] Śrīla Raghunāth Dās Goswāmī, [os seguidores de Śrīla Saraswatī Ṭhākur] \u003ci class=\"wbw__term\"\u003enirantara\u003c/i\u003e–continuamente \u003ci class=\"wbw__term\"\u003ekare\u003c/i\u003e–executam [seus] \u003ci class=\"wbw__term\"\u003esevā\u003c/i\u003e–serviços \u003ci class=\"wbw__term\"\u003eantarmanā haiyā\u003c/i\u003e–em meditação.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSe lembrando de Śrī Raghunāth Dās Goswāmī, os seguidores de Śrīla Saraswatī Ṭhākur continuamente executam seus serviços meditativamente.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya gupta-govardhana divya-rasālaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erūpa-raghunāthānuga-bhaktera āśraya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ejaya\u003c/i\u003e–Glória \u003ci class=\"wbw__term\"\u003egupta\u003c/i\u003e–à Oculta \u003ci class=\"wbw__term\"\u003egovardhana\u003c/i\u003e–Govardhan \u003ci class=\"wbw__term\"\u003eālaya\u003c/i\u003e–a morada [do] \u003ci class=\"wbw__term\"\u003erasa\u003c/i\u003e–amor \u003ci class=\"wbw__term\"\u003edivya\u003c/i\u003e–divino, \u003ci class=\"wbw__term\"\u003eāśraya\u003c/i\u003e–o abrigo \u003ci class=\"wbw__term\"\u003ebhaktera\u003c/i\u003e–dos devotos \u003ci class=\"wbw__term\"\u003eanuga\u003c/i\u003e–seguidores [de] \u003ci class=\"wbw__term\"\u003erūpa\u003c/i\u003e–Śrī Rūpa [e] \u003ci class=\"wbw__term\"\u003eraghunāth\u003c/i\u003e–Śrī Raghunāth!\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGlória à oculta Govardhan, a morada do amor divino, o abrigo dos devotos que seguem Śrī Rūpa e Śrī Raghunāth!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekuliyā-prakāśa tava achintya-mahimā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edivā niśi bhakta-vṛnda kare parikramā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003etava\u003c/i\u003e–Sua \u003ci class=\"wbw__term\"\u003eprakāśa\u003c/i\u003e–manifestação \u003ci class=\"wbw__term\"\u003ekuliyā\u003c/i\u003e–em Kuliyā [é] \u003ci class=\"wbw__term\"\u003eachintya\u003c/i\u003e–inconcebivelmente \u003ci class=\"wbw__term\"\u003emahimā\u003c/i\u003e–gloriosa. \u003ci class=\"wbw__term\"\u003edivā\u003c/i\u003e–Dia [e] \u003ci class=\"wbw__term\"\u003eniśi\u003c/i\u003e–noite \u003ci class=\"wbw__term\"\u003ebhakta-vṛnda\u003c/i\u003e–os devotos \u003ci class=\"wbw__term\"\u003eparikramā kare\u003c/i\u003e–circundam [você].\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSua manifestação em Kulyā é inconcebivelmente gloriosa. Dia e noite, os devotos a circundam.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esevya o sevaka-rūpe nitya parakāśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esānande ārati dekhe e adhama dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Você é] \u003ci class=\"wbw__term\"\u003enitya\u003c/i\u003e–eternamente \u003ci class=\"wbw__term\"\u003eparakāśa\u003c/i\u003e–manifesta [como] \u003ci class=\"wbw__term\"\u003esevya\u003c/i\u003e–o Senhor (Ele que é para ser servido) \u003ci class=\"wbw__term\"\u003eo\u003c/i\u003e–e \u003ci class=\"wbw__term\"\u003erūpe\u003c/i\u003e–como \u003ci class=\"wbw__term\"\u003esevaka\u003c/i\u003e–servo, [e] \u003ci class=\"wbw__term\"\u003esānande\u003c/i\u003e–com alegria \u003ci class=\"wbw__term\"\u003ee\u003c/i\u003e–este \u003ci class=\"wbw__term\"\u003edāsa\u003c/i\u003e–servo \u003ci class=\"wbw__term\"\u003eadhama\u003c/i\u003e–caído \u003ci class=\"wbw__term\"\u003edekhe\u003c/i\u003e–observa [seu] \u003ci class=\"wbw__term\"\u003eārati\u003c/i\u003e–ārati.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVocê é eternamente manifesta como Senhor e servo, e com alegria este servo caído observa seu ārati.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-jaya-girirajer-arotiko-shobha\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śrī Girirāj Govardhan Ārati \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya jaya girirājer āratika-śobhā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-vraja-maṇḍala-mājhe jaga-mana-lobhā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ejaya\u003c/i\u003e–Glória! \u003ci class=\"wbw__term\"\u003ejaya\u003c/i\u003e–Glória \u003ci class=\"wbw__term\"\u003eśobhā\u003c/i\u003e–à beleza \u003ci class=\"wbw__term\"\u003eāratika\u003c/i\u003e–do ārati \u003ci class=\"wbw__term\"\u003egirirājer\u003c/i\u003e–de Śrī Girirāj! \u003ci class=\"wbw__term\"\u003emājhe\u003c/i\u003e–No coração \u003ci class=\"wbw__term\"\u003eśrī\u003c/i\u003e–da divina \u003ci class=\"wbw__term\"\u003emaṇḍala\u003c/i\u003e–terra \u003ci class=\"wbw__term\"\u003evraja\u003c/i\u003e–de Vraja, [você Girirāj] \u003ci class=\"wbw__term\"\u003elobhā\u003c/i\u003e–cativa \u003ci class=\"wbw__term\"\u003emana\u003c/i\u003e–a mente \u003ci class=\"wbw__term\"\u003ejaga\u003c/i\u003e–do mundo!\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGlória! Glória ao belo ārati de Śrī Girirāj! No coração da divina terra de Vraja, você Girirāj cativa a mente do mundo!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epramoda-madana-līlā śrī-rādhā-ramaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyathā nitya-līlā kare laye sakhī-gaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eramaṇa\u003c/i\u003e–[O] amado \u003ci class=\"wbw__term\"\u003eśrī-rādhā\u003c/i\u003e–[de] Śrī Rādhā \u003ci class=\"wbw__term\"\u003ekare\u003c/i\u003e–[se] engaja \u003ci class=\"wbw__term\"\u003elaye\u003c/i\u003e–com \u003ci class=\"wbw__term\"\u003esakhī-gaṇa\u003c/i\u003e–as amigas de Śrī Rādhā [em] \u003ci class=\"wbw__term\"\u003elīlā\u003c/i\u003e–brincadeiras \u003ci class=\"wbw__term\"\u003enitya\u003c/i\u003e–diárias \u003ci class=\"wbw__term\"\u003epramoda\u003c/i\u003e–de alegria [e] \u003ci class=\"wbw__term\"\u003emadana\u003c/i\u003e–aventuras amorosas \u003ci class=\"wbw__term\"\u003eyathā\u003c/i\u003e–neste lugar [sobre você].\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Amado de Śrī Rādhā se envolve com as sakhīs nas brincadeiras diárias de alegria e aventuras amorosas—sobre você.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emālatī-mādhavī-kuñja kandare kandare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enigūḍha nikuñja-līlā hari manohare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003elīlā\u003c/i\u003e–A brincadeira [nos] n \u003ci class=\"wbw__term\"\u003eikuñja\u003c/i\u003e–corredores \u003ci class=\"wbw__term\"\u003enigūḍha\u003c/i\u003e–ocultos \u003ci class=\"wbw__term\"\u003ekandare kandare\u003c/i\u003e–entre as cavernas [e] \u003ci class=\"wbw__term\"\u003ekuñja\u003c/i\u003e–arbustos \u003ci class=\"wbw__term\"\u003emālatī\u003c/i\u003e–de mālatī [e] [trepadeiras de] \u003ci class=\"wbw__term\"\u003emādhavī\u003c/i\u003e–mādhavī \u003ci class=\"wbw__term\"\u003emanohare\u003c/i\u003e–cativa o coração \u003ci class=\"wbw__term\"\u003ehari\u003c/i\u003e–do Senhor.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eA brincadeira nos caramanchões ocultos entre suas cavernas, arbustos de mālatī e trepadeiras de mādhavī cativa o coração do Senhor.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4-5\"\u003e\n\u003ch5\u003e4-5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśyāma-kuṇḍa rādhā-kuṇḍa kusuma-sarovara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emānasa-gaṅgā dāna-ghāṭī yāra abhyantara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-govinda-kuṇḍa līlā-sthalī nāhi sīmā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edivā niśi bhakta-vṛnda kare parikramā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eśyāma-kuṇḍa\u003c/i\u003e–Śyāma Kuṇḍa \u003ci class=\"wbw__term\"\u003erādhā-kuṇḍa\u003c/i\u003e–Rādhā Kuṇḍa \u003ci class=\"wbw__term\"\u003ekusuma-sarovara\u003c/i\u003e–Kusum Sarovar \u003ci class=\"wbw__term\"\u003emānasa-gaṅgā\u003c/i\u003e–Mānasa Gaṅgā \u003ci class=\"wbw__term\"\u003edāna-ghāṭī\u003c/i\u003e–Dāna Ghāṭī \u003ci class=\"wbw__term\"\u003eśrī-govinda-kuṇḍa\u003c/i\u003e–Śrī Govinda Kuṇḍa \u003ci class=\"wbw__term\"\u003enāhi\u003c/i\u003e–não há \u003ci class=\"wbw__term\"\u003esīmā\u003c/i\u003e–fim \u003ci class=\"wbw__term\"\u003esthalī\u003c/i\u003e–dos lugares [onde o Senhor] \u003ci class=\"wbw__term\"\u003elīlā\u003c/i\u003e–brinca \u003ci class=\"wbw__term\"\u003eabhyantara\u003c/i\u003e–dentro \u003ci class=\"wbw__term\"\u003eyāra\u003c/i\u003e–deles, [e] \u003ci class=\"wbw__term\"\u003edivā\u003c/i\u003e–dia [e] \u003ci class=\"wbw__term\"\u003eniśi\u003c/i\u003e–noite \u003ci class=\"wbw__term\"\u003ebhakta-vṛnda\u003c/i\u003e–os devotos \u003ci class=\"wbw__term\"\u003eparikramā kare\u003c/i\u003e–circundam [você].\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚyāma Kuṇḍa, Rādhā Kuṇḍa, Kusum Sarovar, Mānasa Gaṅgā, Dāna Ghāṭī, Śrī Govinda Kuṇḍa—há infinitos lugares onde o Senhor brinca sobre você, e dia e noite, os devotos a circundam.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘śrīdhar-svāmī-sevāśrama’ parama śobhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyathā nitya-sevā kare sārasvata-gaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003e‘śrīdhar-svāmī-sevāśrama’\u003c/i\u003e–[O] Śrīla Śrīdhar Swāmī Sevā Ashram \u003ci class=\"wbw__term\"\u003eyathā\u003c/i\u003e–onde \u003ci class=\"wbw__term\"\u003esārasvata-gaṇa\u003c/i\u003e–os seguidores de Śrīla Saraswatī Ṭhākur \u003ci class=\"wbw__term\"\u003ekare\u003c/i\u003e–executam [seus] \u003ci class=\"wbw__term\"\u003esevā\u003c/i\u003e–serviços \u003ci class=\"wbw__term\"\u003enitya\u003c/i\u003e–diários [é] \u003ci class=\"wbw__term\"\u003eparama\u003c/i\u003e–excessivamente \u003ci class=\"wbw__term\"\u003eśobhana\u003c/i\u003e–belo.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Śrīla Śrīdhar Swāmī Sevā Ashram, onde os seguidores de Śrīla Saraswatī Ṭhākur executam seus serviços diários, é extremamente belo.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eabhinna śrī-kṛṣṇa-jñāne bhajibāra tare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emahāprabhu samarpilā raghunātha-kare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003emahāprabhu\u003c/i\u003e–Śrīman Mahāprabhu \u003ci class=\"wbw__term\"\u003esamarpilā\u003c/i\u003e–colocou [você] \u003ci class=\"wbw__term\"\u003ekare\u003c/i\u003e–nas mãos \u003ci class=\"wbw__term\"\u003eraghunātha\u003c/i\u003e–de Śrī Raghunāth \u003ci class=\"wbw__term\"\u003etare\u003c/i\u003e–para [ele] \u003ci class=\"wbw__term\"\u003ebhajibāra\u003c/i\u003e–[o] adorar \u003ci class=\"wbw__term\"\u003ejñāne\u003c/i\u003e–com a compreensão [de que você é] \u003ci class=\"wbw__term\"\u003eabhinna\u003c/i\u003e–não diferente \u003ci class=\"wbw__term\"\u003eśrī-kṛṣṇa\u003c/i\u003e–de Śrī Kṛṣṇa.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrīman Mahāprabhu colocou você nas mãos de Śrī Raghunāth para que ele a adorasse com o entendimento de que você é não diferente de Śrī Kṛṣṇa.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egosvāmī śrī-raghunātha-dāsere smariyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enirantara sevā kare antarmanā haiyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Se] \u003ci class=\"wbw__term\"\u003esmariyā\u003c/i\u003e–lembrando [de] \u003ci class=\"wbw__term\"\u003eśrī-raghunātha-dāsere gosvāmī\u003c/i\u003e–Śrīla Raghunāth Dās Goswāmī, [os seguidores de Śrīla Saraswatī Ṭhākur] \u003ci class=\"wbw__term\"\u003enirantara\u003c/i\u003e–continuamente \u003ci class=\"wbw__term\"\u003ekare\u003c/i\u003e–executam [seus] \u003ci class=\"wbw__term\"\u003esevā\u003c/i\u003e–serviços \u003ci class=\"wbw__term\"\u003eantarmanā haiyā\u003c/i\u003e–meditativamente.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSe lembrando de Śrī Raghunāth Dās Goswāmī, os seguidores de Śrīla Saraswatī Ṭhākur continuamente executam seus serviços meditativamente.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya giri-govardhana divya-rasālaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erūpa-sanātana-jīva-raghunāthāśraya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ejaya\u003c/i\u003e–Glória \u003ci class=\"wbw__term\"\u003egiri\u003c/i\u003e–[a você] colina [de] \u003ci class=\"wbw__term\"\u003egovardhana\u003c/i\u003e–Govardhan, \u003ci class=\"wbw__term\"\u003eālaya\u003c/i\u003e–a morada \u003ci class=\"wbw__term\"\u003erasa\u003c/i\u003e–[do] amor \u003ci class=\"wbw__term\"\u003edivya\u003c/i\u003e–divino \u003ci class=\"wbw__term\"\u003eāśraya\u003c/i\u003e–o abrigo [de] \u003ci class=\"wbw__term\"\u003erūpa\u003c/i\u003e–Śrī Rūpa, \u003ci class=\"wbw__term\"\u003esanātana\u003c/i\u003e–Śrī Sanātan \u003ci class=\"wbw__term\"\u003ejīva\u003c/i\u003e–Śrī Jīva [e] \u003ci class=\"wbw__term\"\u003eraghunāth\u003c/i\u003e–Śrī Raghunāth!\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGlória a você, Colina de Govardhan, a morada do amor divino, o abrigo de Śrī Rūpa, Śrī Sanātan, Śrī Jīva, e Śrī Raghunāth!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esurendra-munīndra-śiva-śuka-mahajana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edekhena ārati-śobhā durlabha-darśana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eindra\u003c/i\u003e–O rei \u003ci class=\"wbw__term\"\u003esura\u003c/i\u003e–dos deuses \u003ci class=\"wbw__term\"\u003eindra\u003c/i\u003e–o rei \u003ci class=\"wbw__term\"\u003emuni\u003c/i\u003e–dos sábios, \u003ci class=\"wbw__term\"\u003eśiva\u003c/i\u003e–Senhor Śiva \u003ci class=\"wbw__term\"\u003eśuka\u003c/i\u003e–Śukadev Goswāmī, [e outras] \u003ci class=\"wbw__term\"\u003emahajana\u003c/i\u003e–grandes almas \u003ci class=\"wbw__term\"\u003edekhena\u003c/i\u003e–contemplam \u003ci class=\"wbw__term\"\u003eśobhā\u003c/i\u003e–a beleza \u003ci class=\"wbw__term\"\u003eārati\u003c/i\u003e–de [seu] ārati \u003ci class=\"wbw__term\"\u003edarśana\u003c/i\u003e–a visão [mais] \u003ci class=\"wbw__term\"\u003edurlabha\u003c/i\u003e–rara [de se] obter.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Senhor Indra, Nārad Muni, O Senhor Śiva, Śukadev Goswāmī, e outras grandes almas contemplam a beleza de seu ārati, a visão mais rara de se alcançar.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esevya o sevaka-rūpe nitya parakāśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esānande ārati dekhe e adhama dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Você é] \u003ci class=\"wbw__term\"\u003enitya\u003c/i\u003e–eternamente \u003ci class=\"wbw__term\"\u003eparakāśa\u003c/i\u003e–manifesta [como] \u003ci class=\"wbw__term\"\u003esevya\u003c/i\u003e–o Senhor (Ele que é para ser servido) \u003ci class=\"wbw__term\"\u003eo\u003c/i\u003e–e \u003ci class=\"wbw__term\"\u003erūpe\u003c/i\u003e–como \u003ci class=\"wbw__term\"\u003esevaka\u003c/i\u003e–servo, [e] \u003ci class=\"wbw__term\"\u003esānande\u003c/i\u003e–com alegria \u003ci class=\"wbw__term\"\u003ee\u003c/i\u003e–este \u003ci class=\"wbw__term\"\u003edāsa\u003c/i\u003e–servo \u003ci class=\"wbw__term\"\u003eadhama\u003c/i\u003e–caído \u003ci class=\"wbw__term\"\u003edekhe\u003c/i\u003e–observa [seu] \u003ci class=\"wbw__term\"\u003eārati\u003c/i\u003e–ārati.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVocê é eternamente manifesta como Senhor e servo, e com alegria este servo caído observa seu ārati.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eMaṅgal Ārati\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-kali-kukkura-kadana-jadi-chao-he\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003ePrabhāti Gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kali-kukkura-kadana yadi chāo he\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekali-yuga-pāvana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kali-bhaya-nāśana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-śachī-nandana gāo he\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSe você quiser domar o cão Kali, então cante ‘Śrī Śachī Nandan!’ Ele é o purificador e o destruidor do medo na Kali-yuga.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egadādhara-mādana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nitāi-era prāṇa-dhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;advaitera prapūjita gorā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enimāi viśvambhara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrīnivāsa-īśvara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhakta-samūha chita-chorā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle é a alegria de Gadadhar e a vida e riqueza de Nitāi. Ele é adorado por Advaita Āchārya. Ele é conhecido como Nimāi, e é o mantenedor do universo. Ele é o Senhor de Śrīvās Ṭhākur, e Ele rouba os corações dos devotos.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enadīyā śaśadhara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;māyāpura-īśvara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāma-pravartana-śūra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egṛhī-jana-śikṣaka\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nyāsi-kula-nāyaka\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mādhava rādhā-bhāva-pūra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle é a lua de Nadia, o Senhor de Māyāpur, e o inaugurador do Hari-nām-saṅkīrtan. Ele é o mestre dos chefes de família e o líder dos sannyāsīs. Ele é Mādhava repleto do coração de Rādhā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esārvabhauma-śodhana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gajapati-tāraṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rāmānanda-poṣaṇa vīra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erūpānanda-vardhana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sanātana-pālana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;haridāsa-modana dhīra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle é o purificador de Sārvabhauma Bhaṭṭāchārya e o libertador de Mahārāj Pratāparudra. Ele é o mantenedor de Rāmānanda Rāy e o herói de todos. Ele é o guardião de Śrīla Sanātan Goswāmī e a alegria de Śrīla Rūpa Goswāmī. Ele é o deleite de Haridās Ṭhākur e é perfeitamente sóbrio.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evraja-rasa-bhāvana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;duṣṭa-mata-śātana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kapaṭī-vighātana-kāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśuddha bhakta-pālana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śuṣka-jñāna-tāḍana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chhala-bhakti-dūṣaṇa rāma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle é absorto nos rasas de Vraja. Ele é o dissipador do equívoco, da luxúria e do engano. Ele é o mantenedor dos devotos puros e o dissipador do conhecimento seco. Ele é o erradicador da pseudo devoção e o reservatório de todo o prazer.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jashomati-nandana-vraja-vara-nagara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Nām-kīrtan \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyaśomatī-nandana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vraja-vara-nāgara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gokula-rañjana kāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egopī-parāṇa-dhana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;madana-manohara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kāliya-damana vidhāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Kṛṣṇa, que é conhecido como Kān, é o filho querido de Yaśodā, o amante de Vraja, o deleite de Gokula, a vida e a riqueza das gopīs, o encantador do Cupido e o conquistador de Kālīya.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;amala hari-nāma amiya-vilāsā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evipina-purandara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;navīna nāgara-vara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vaṁśī-vadana suvāsā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSeus Nomes e Passatempos nectáreos são todos transcendentais. Ele é o rei das florestas de Vraja e o melhor dos jovens amantes. Ele toca a flauta lindamente.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evraja-jana-pālana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;asura-kula-nāśana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nanda-godhana-rākhoyālā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egovinda mādhava\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;navanīta-taṣkara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sundara nanda-gopālā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle é o guardião dos moradores de Vraja, o destruidor dos demônios e o guardião das vacas de Nanda. Ele é conhecido como ‘Govinda’—Ele que nutre as vacas, os sentidos, os Vedas e o universo—e ‘Mādhava’—o consorte de Śrī Rādhā. Ele é o belo menino vaqueiro de Nanda e um ladrão de manteiga.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyamunā-taṭa-chara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopī-vasana-hara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rāsa-rasika kṛpāmaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-rādhā-vallabha\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vṛndāvana-naṭa-vara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhakativinod-āśraya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle é um espião nas margens do Yamunā e o ladrão das roupas das gopīs. Ele é o desfrutador do rāsa-līlā e a personificação da misericórdia. Ele é o amado de Śrī Rādhā, o grande dançarino de Vṛndāvan e o abrigo de Bhakti Vinod.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-shiachinandana-sura-muni-vandana\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śachīnandana-vandanā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya śachī-nandana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sura-muni-vandana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhava-bhaya-khaṇḍana jaya he\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaya hari-kīrtana-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nartanāvartana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kali-mala-kartana jaya he\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTodas as glórias a Śrī Śachī Nandan, que é adorado pelos semideuses e sábios! Todas as glórias a Ele que destrói todo o temor da existência material! Todas as glórias ao inaugurador do dançar e do cantar dos Nomes do Senhor! Todas as glórias a Ele que remove a contaminação de Kali!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enayana-purandara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;viśvarūpa snehadhara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;viśvambhara viśvera kalyāṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaya lakṣmī-viṣṇu-priyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;viśvambhara priya hiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jaya priya kiṅkara īśāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Śachī Nandan é o deleite aos olhos de todos e é afetuoso com Seu irmão Viśvarūp. Ele é o mantenedor e a personificação da boa fortuna do universo. Toda glória a Lakṣmī Priyā e Viṣṇu Priyā, que são queridas do coração de Viśvambhar! Toda glória a seu querido servo Īśān!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī sītā advaita rāya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mālinī śrīvāsa jaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jaya chandraśekhara āchārya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaya nityānanda rāya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gadādhara jaya jaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jaya haridāsa nāmāchārya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória a Sītā Ṭhākurāṇī e Advaita Āchārya! Toda glória a Mālinī Devī e Śrīvās Ṭhākur! Toda glória a Chandraśekhar Āchārya! Toda glória a Nityānanda Rāy! Toda glória a Gadadhar Paṇit! Toda glória ao Nāmāchārya, Hari Dās Ṭhākur!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emurāri mukunda jaya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;premanidhi mahāśaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jaya yata prabhu pāriṣada\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evandi sabākāra pāya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;adhamere kṛpā haya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhakti sapārṣada-prabhupāda\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória a Murāri Gupta, Mukunda Datta, e Puṇḍarīk Vidyānidhi! Toda glória a todos os associados de Śrī Śachī Nandan! Ofereço minha reverência a seus pés. Por sua misericórdia sobre esta alma caída, sirvo a Śrīla Prabhupād e seus associados.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-bhaja-bhakata-vatsala-shri-gaurahari\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Bhoga Ārati Gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhaja bhakata-vatsala śrī-gaurahari\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-gaurahari sohi goṣṭha-vihārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enanda-yaśomatī-chita-hārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSirva Śrī Gaurahari, que é muito afetuoso com Seus devotos. Ele é o peregrino nos campos (de Vraja), o ladrão dos corações de Nanda e Yaśodā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e“belā ha’lo, dāmodara, āisa ekhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhoga-mandire vasi’ karaha bhojana”\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Está na hora! Dāmodar! Venha agora! Sente-se na sala de refeição e coma.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enandera nirdeśe vaise giri-vara-dhārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebaladeva-saha sakhā vaise sāri sāri\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eA pedido de Nanda, Kṛṣṇa, Baladev e Seus amigos sentam-se em filas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśuktā-śākādi bhāji nālitā kuṣmāṇḍa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eḍāli ḍālnā dugdha-tumbī dadhi mochā-ghaṇṭa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚuktā, śāk, vegetais fritos, salada de folha de juta, abóbora, cestas de frutas, bolinhos de dāl, abóbora cozida no leite, iogurte, flor de banana ...\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emudga-baḍā māṣa-baḍā roṭikā ghṛtānna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśaṣkulī piṣṭaka kṣīr puli pāyasānna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eRisoles de moong dāl, risoles de urad dāl, chapātīs, arroz com ghee, leite de arroz e de gergelim, bolos de farinha de arroz, leite condensado, panquecas, pudim de arroz...\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekarpūra amṛta-kelī rambhā kṣīra-sāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eamṛta rasālā, amla dvādaśa prakāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLeite quente aromatizado com cânfora, banana, manteiga, doze tipos de preparações doces, suculentas e azedas ...\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eluchi chini sarapurī lāḍḍu rasāvalī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhojana karena kṛṣṇa ha’ye kutūhalī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePurīs doces, purīs recheados com creme, docinhos redondos, pasteizinhos de dāl cozidos em arroz doce—Kṛṣṇa come com avidez todas estas preparações.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erādhikāra pakka anna vividha vyañjana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eparama ānande kṛṣṇa karena bhojana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCom grande alegria Kṛṣṇa come várias preparações de vegetais feitas por Rādhikā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echhale-bale lāḍḍu khāy śrī-madhumaṅgala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebagala bājāy āra deya haribolo\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDe um jeito ou de outro, Madhumaṅgal come os doces. Ele bate as axilas e grita: “Haribol!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erādhikādi gaṇe heri’ nayanera koṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etṛpta ha’ye khāya kṛṣṇa yaśodā-bhavane\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVendo Rādhikā e Suas amigas com o canto de Seus olhos, com grande satisfação, Kṛṣṇa come na casa de Yaśodā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhojanānte piye kṛṣṇa suvāsita vāri\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esabe mukha prakṣālaya ha’ye sāri sāri\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDepois de comer, Kṛṣṇa bebe água perfumada. Então, todos os meninos se enfileiram e lavam suas bocas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehasta-mukha prakṣāliyā yata sakhā-gaṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eānande viśrāma kare baladeva-sane\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDepois de lavar suas mãos e bocas, felizes, os amigos de Kṛṣṇa descansam com Baladev.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejambula rasāla āne tāmbula-maśālā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etāhā kheye kṛṣṇachandra sukhe nidrā gelā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eJambula e Rasāla trazem pān temperado. Depois de mastigar esse pān, Kṛṣṇa então dorme feliz.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"14\"\u003e\n\u003ch5\u003e14\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eviśālākṣa śikhi-puchchha chāmara ḍhulāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eapūrva śayāya kṛṣṇa sukhe nidrā yāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eViśālākṣa abana Kṛṣṇa com um abano de pavão, e Kṛṣṇa, feliz, dorme em uma cama confortável.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"15\"\u003e\n\u003ch5\u003e15\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyaśomatī-ājñā peye dhaniṣṭhā ānīta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-kṛṣṇa-prasāda rādhā bhuñje haye prīta\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSendo solicitada por Yaśodā, Dhaniṣṭhā traz os remanentes de Śrī Kṛṣṇa para Rādhā, que os come com prazer.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"16\"\u003e\n\u003ch5\u003e16\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003elalitādi sakhī-gaṇa avaśeṣa pāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emane mane sukhe rādhā-kṛṣṇa-guṇa gāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLalitā Devī e suas amigas recebem os remanentes de Rādhā e com grande alegria cantam as glórias de Rādhā-Kṛṣṇa dentro de seus corações.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"17\"\u003e\n\u003ch5\u003e17\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari-līlā eka-mātra yāhāra pramoda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhogārati gāy ṭhākur bhakativinoda\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eṬhākur Bhakti Vinod, cuja única alegria são os Passatempos do Senhor, canta este bhog ārati.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(bhaja govinda govinda gopāla)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(giridhārī gopīnātha nanda-dulāla)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(bhaja govinda govinda gopāla)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(nanda-dulāla jaya jaya śachī-dulāla)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(śachī-dulāla jaya jaya gaura gopāla)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSirva Govinda, sirva Gopāl. Sirva Giridhārī, Gopīnāth, Nanda Dulāl. Sirva Govinda, sirva Gopāl. Toda glória ao filho de Nanda! Toda glória ao filho de Śachī! Toda glória ao dourado Gopāl!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-jaya-gaurachander-arotiko-shobha\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Gaura Ārati \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(kibā) jaya jaya gorāchā̐der āratika śobhā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejāhnavī-taṭa-vane jaga-mana lobhā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(jaga-janer mana lobhā)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gaurāṅger ārati śobhā jaga-janer mana lobhā)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(nitāi gaura haribol)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória ao belo ārati a Śrī Gorāchā̐d que acontece em um bosque às margens do Ganges, atraindo os corações de todas as almas por todo o mundo!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(kibā) dakṣiṇe nitāichā̐̐da bāme gadādhara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enikaṭe advaita śrīnivāsa chhatra-dhara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÀ direita de Gorāchā̐d está Nitāichā̐d, e à sua esquerda está Gadādhar. Advaita está perto, e Śrīvās segura uma sombrinha.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(kibā) basiyāchhe gorāchā̐da ratna-siṁhāsane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(ratna-simhāsana alo karere)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(basiyāchhen gorāchā̐d ratna-siṁhāsane)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eārati karena brahmā ādi-deva gaṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gaurāṅger ārati kare)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(brahmā ādi-deva gaṇe gaurāṅger ārati kare)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gaurāṅgera bhakta sane gaurāṅger ārati kare)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(nitāi gaura haribol)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGorāchā̐d se sentou em um trono de joias. Brahmā e os outros semideuses o adoram (na companhia de Seus devotos).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(kibā) narahari-ādi kari chāmara ḍhulāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esañjaya-mukunda-vāsu-ghoṣa-ādi gāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gaura guṇa gāna kare)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(sañjaya mukunda vāsu-ghoṣa gaura guṇa gāna kare)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(nitāi gaura haribol)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNarahari e outros abanam o Senhor com chāmaras. Sañjay, Mukunda, Vāsudev Ghoṣ e outros cantam.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(kibā) śaṅkha bāje ghaṇṭā bāje bāje karatāla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emadhura mṛdaṅga bāje parama rasāla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(madhur madhur madhur bāje)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gaurāṅger ārati kāle madhur madhur madhur bāje)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(śaṅkha bāje ghaṇṭā bāje madhur madhur madhur bāje)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(madhura mṛdaṅga bāje madhur madhur madhur bāje)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(nitāi gaura haribol)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eConchas, sinos, kartāls e mṛdaṅgas ressoam docemente. O kīrtan é muito agradável.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(kibā) bahu-koṭi chandra jini vadana ujjvala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egala-deśe vana-mālā kare jhalamala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(jhalmal jhalmal jhalmal kare)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gaura gale vana phuler mālā jhalmal jhalmal jhalmal kare)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(nitāi gaura haribol)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO resplendor da face do Senhor supera o de milhões de luas. A guirlanda de flores silvestres reluz em volta de Seu pescoço.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(kibā) śiva-śuka-nārada preme gada-gada\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakati-vinoda dekhe gorāra sampada\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚiva, Śukadev, e Nārad gaguejam no êxtase do amor. É assim que Bhakti Vinod contempla a glória de Gorāchā̐d.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(ei bār āmāy dayā kara)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(ṭhākura śrī bhakti-vinoda ei bār āmāy dayā kara)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(ṭhākura śrī sarasvatī ei bār āmāy dayā kara)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(patit-pāvan śrī gurudev ei bār āmāy dayā kara)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(sapārṣada gaurahari ei bār āmāy dayā kara)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(nitāi gaura haribol)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDesta vez, por favor, me dê sua graça. Ó Śrila Bhakti Vinod Ṭhākur, ó Śrīla Saraswatī Ṭhākur, ó Gurudev, salvador dos caídos, ó Gaurahari, juntamente com seus associados, desta vez por favor me dê sua graça.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jayare-jayare-jaya-gaura-sarasvati\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Sāraswat Ārati \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejayare jayare jaya gaura-sarasvatī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakativinodānvaya karuṇā murati\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória à voz de Śrī Gaurāṅga, a personificação da misericórdia de Śrīla Bhakti Vinod Ṭhākur: Śrīla Bhakti Siddhanta Saraswatī Ṭhākur!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprakāśile gaura-sevā bhūvana maṅgala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakati-siddhānta śuddha prajñāna ujjvala\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle manifestou o serviço a Śrī Gaurāṅga para a elevação do mundo. Seu ensinamento sobre devoção é puro, brilhante e esclarecedor.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erādhā-śyāma eka-tanu dakṣe gorā rāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebāme rādhā madhye svayaṁ śyāma-gopa jaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória à forma combinada de Śrī Śrī Rādhā–Śyām, Śrī Gaura Rāy, à direita, Śrī Rādhā à esquerda, e o negro menino vaqueiro Ele mesmo no meio!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evraja-rasa nava-bhāve navadvīpe rāje\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eudāre madhura rāga abhinava sāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO rasa de Vraja se manifesta de uma nova maneira em Nabadwip: madhura-rasa se veste modernamente de benevolência.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emādhurya kaivalya rāga vrajera niryāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprāpti parākāṣṭhā tāhe gaurāṅga vilāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO doce amor divino, a essência de Vraja, atinge seu clímax nos Passatempos de Śrī Gaurāṅga.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erādhā bhāva-kānti aṅgikari’ bhāla mate\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edakṣiṇe āsana rasa garimā dekhāte\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Gaurāṅga abraça fervorosamente o coração e a aura de Śrī Rādhā, e toma Seu lugar à direita para mostrar a glória de Seu rasa.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erādhā-rasa-traya-svāda rahasya prayāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enirakhi praphulla rādhā mukhe manda hāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVendo o esforço secreto de Kṛṣṇa para provar Seu tríplice rasa, Rādhā está plena e sorri suavemente.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emadhye rahi’ vaṁśī-rave ghoṣe vaṁśī-dhara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhāra sampade āmi gaurāṅga-sundara!\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePermanecendo no meio, o flautista declara, através do som de Sua flauta: “Com a riqueza de Rādhā, sou Gaurāṅgasundar! ”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emad abhīṣṭha rūpa rādhāra hṛdaya mandire\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaurāṅga bhajile suṣṭhu sphūrti pāya tāre\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Se você serve Gaurāṅga, Minha forma que é adorada no templo do coração de Rādhā será plenamente revelada a você. ”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enadīyā prakāśe mahāprabhu gaura-nidhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epatita-pāvana deve milāila vidhi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGaurāṅga Mahāprabhu apareceu em Nadia, e a Providência combinou o salvador dos caídos (o Kali-yuga-avatār) Nele.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ee-rūpa ārati brahmā śambhu agochara gaura-bhakta kṛpā-pātra mātra siddhi sāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTal ārati é desconhecido de Brahmā e Śiva. Somente um recipiente da misericórdia dos devotos de Śrī Gaurāṅga alcança tal perfeição.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī svarūpa, rāmānanda, rūpa, sanātana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī raghu, jīvādi kṛpāya dekhe bhakta-jana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOs devotos veem esse ārati pela misericórdia de Śrī Svarūp Dāmodar, Śrī Rāmānanda Rāy, Śrī Rūpa, Śrī Sanātan, Śrī Raghunāth, Śrī Jīva, e seus associados.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya guru-gaura-rādhā-govinda-sundara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaya dāo bhakta vṛnda nitya nirantara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória a Śrī Guru, Gaurāṅga, e Rādhā–Govindasundar! Ó devotos, cantem suas glórias sempre e por toda a eternidade!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eParikramā\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-gurudeva-kripa-bindu-diya-kara-ei-dase\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eGurudeva \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egurudeva!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛpā-bindu diyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kara’ ei dāse\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tṛṇāpekṣā ati dīna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esakala sahane\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bala diyā ka
