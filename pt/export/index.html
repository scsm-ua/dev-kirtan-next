/i\u003e–tolerar [a] \u003ci class=\"wbw__term\"\u003eviraha\u003c/i\u003e–separação \u003ci class=\"wbw__term\"\u003eśrī-kṛṣṇa\u003c/i\u003e–de Śrī Kṛṣṇa \u003ci class=\"wbw__term\"\u003eāra\u003c/i\u003e–mais. [Estou pronto] \u003ci class=\"wbw__term\"\u003echhāḍite\u003c/i\u003e–para abandonar [minha] \u003ci class=\"wbw__term\"\u003eparāṇa\u003c/i\u003e–vida [dentro de] \u003ci class=\"wbw__term\"\u003eāra\u003c/i\u003e–outros \u003ci class=\"wbw__term\"\u003edui\u003c/i\u003e–dois [a] \u003ci class=\"wbw__term\"\u003echāri\u003c/i\u003e–quatro \u003ci class=\"wbw__term\"\u003edina\u003c/i\u003e–dias.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNão consigo mais tolerar a separação de Kṛṣṇa. Vou abandonar minha vida em poucos dias.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gaite-govinda-nam-upajilo-bhava-gram\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eCanção 7b\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egāite govinda-nāma upajila bhāva-grāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edekhilāma yamunāra kūle\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evṛṣabhānu-sutā-saṅge śyāma naṭavara raṅge\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evā̐śarī bājāya nīpa-mūle\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egāite\u003c/i\u003e–Enquanto eu cantava \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–o Nome de \u003ci class=\"wbw__term\"\u003egovinda\u003c/i\u003e–Govinda, \u003ci class=\"wbw__term\"\u003egrāma\u003c/i\u003e–diversos \u003ci class=\"wbw__term\"\u003ebhāva\u003c/i\u003e–êxtases \u003ci class=\"wbw__term\"\u003eupajila\u003c/i\u003e–surgiram. \u003ci class=\"wbw__term\"\u003edekhilāma\u003c/i\u003e–Eu vi \u003ci class=\"wbw__term\"\u003eśyāma\u003c/i\u003e–Kṛṣṇa, \u003ci class=\"wbw__term\"\u003evara\u003c/i\u003e–o melhor \u003ci class=\"wbw__term\"\u003enaṭa\u003c/i\u003e–dos dançarinos, \u003ci class=\"wbw__term\"\u003eraṅge\u003c/i\u003e–jubilosamente \u003ci class=\"wbw__term\"\u003ebājāya\u003c/i\u003e–tocando \u003ci class=\"wbw__term\"\u003evā̐śarī\u003c/i\u003e–a flauta \u003ci class=\"wbw__term\"\u003esaṅge\u003c/i\u003e–com \u003ci class=\"wbw__term\"\u003esutā\u003c/i\u003e–a filha \u003ci class=\"wbw__term\"\u003evṛṣabhānu\u003c/i\u003e–de Vṛṣabhānu \u003ci class=\"wbw__term\"\u003ekūle\u003c/i\u003e–nas margens \u003ci class=\"wbw__term\"\u003eyamunāra\u003c/i\u003e–do Yamunā \u003ci class=\"wbw__term\"\u003emūle\u003c/i\u003e–embaixo \u003ci class=\"wbw__term\"\u003enīpa\u003c/i\u003e–de uma árvore kadamba.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEntão, enquanto eu cantava o Nome de Govinda, muitos êxta-ses surgiram. Eu vi Śyām, o melhor dos dançarinos, tocando flauta com a filha de Vṛṣabhanu às margens do Yamunā sob uma árvore kadamba.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edekhiyā yugala-dhana asthira ha-ila mana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejñāna-hārā ha-ilu̐ takhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekata-kṣane nāhi jāni jñāna-lābha ha-ila\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emāni āra nāhi bhela daraśana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003edekhiyā\u003c/i\u003e–Vendo \u003ci class=\"wbw__term\"\u003edhana\u003c/i\u003e–a riqueza \u003ci class=\"wbw__term\"\u003eyugala\u003c/i\u003e–do Casal, [meu] \u003ci class=\"wbw__term\"\u003emana\u003c/i\u003e–coração \u003ci class=\"wbw__term\"\u003eha-ila\u003c/i\u003e–se tornou \u003ci class=\"wbw__term\"\u003easthira\u003c/i\u003e–instável, [e] \u003ci class=\"wbw__term\"\u003etakhana\u003c/i\u003e–então \u003ci class=\"wbw__term\"\u003ehārā ha-ilu̐\u003c/i\u003e–eu perdi [a] \u003ci class=\"wbw__term\"\u003ejñāna\u003c/i\u003e–consciência. [Depois] \u003ci class=\"wbw__term\"\u003ekata\u003c/i\u003e–quanto \u003ci class=\"wbw__term\"\u003ekṣane\u003c/i\u003e–tempo \u003ci class=\"wbw__term\"\u003ejāni nāhi\u003c/i\u003e–eu não sei, \u003ci class=\"wbw__term\"\u003elābha ha-ila\u003c/i\u003e–eu reganhei \u003ci class=\"wbw__term\"\u003ejñāna\u003c/i\u003e–consciência [e] \u003ci class=\"wbw__term\"\u003emāni\u003c/i\u003e–descobri [que] \u003ci class=\"wbw__term\"\u003ebhela nāhi\u003c/i\u003e–não havia \u003ci class=\"wbw__term\"\u003eāra\u003c/i\u003e–mais \u003ci class=\"wbw__term\"\u003edaraśana\u003c/i\u003e–visão [do Casal].\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVendo o Casal Divino, meu coração se desestabilizou, e então eu perdi a consciência. Depois de muito tempo, eu a retomei, e vi que Eles tinham ido embora.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-sakhi-go-kemote-dhoribo-paran\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eCanção 7c\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(sakhi go) kemate dhariba parāṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enimeṣa ha-ila yugera samāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ego\u003c/i\u003e–Ó \u003ci class=\"wbw__term\"\u003esakhi\u003c/i\u003e–amiga \u003ci class=\"wbw__term\"\u003ekemate\u003c/i\u003e–como \u003ci class=\"wbw__term\"\u003edhariba\u003c/i\u003e–posso continuar [minha] \u003ci class=\"wbw__term\"\u003eparāṇa\u003c/i\u003e–vida? \u003ci class=\"wbw__term\"\u003enimeṣa\u003c/i\u003e–Um momento \u003ci class=\"wbw__term\"\u003eha-ila\u003c/i\u003e–se tornou \u003ci class=\"wbw__term\"\u003esamāna\u003c/i\u003e–como \u003ci class=\"wbw__term\"\u003eyugera\u003c/i\u003e–uma era.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ amiga! Como posso dar continuidade à minha vida? Um momento parece uma era.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrāvaṇera dhārā ā̐khi variṣaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśūnya bhela dharā-tala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egovinda-virahe prāṇa nāhi rahe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekemane vā̐chiba bala\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Meus] \u003ci class=\"wbw__term\"\u003eā̐khi\u003c/i\u003e–olhos \u003ci class=\"wbw__term\"\u003evariṣaya\u003c/i\u003e–derramaram lágrimas [como] \u003ci class=\"wbw__term\"\u003edhārā\u003c/i\u003e–as chuvas \u003ci class=\"wbw__term\"\u003eśrāvaṇera\u003c/i\u003e–de Śrāvaṇ [julho–agosto (o auge das monções), e] \u003ci class=\"wbw__term\"\u003etala\u003c/i\u003e–a superfície \u003ci class=\"wbw__term\"\u003edharā\u003c/i\u003e–da Terra \u003ci class=\"wbw__term\"\u003ebhela\u003c/i\u003e–ficou \u003ci class=\"wbw__term\"\u003eśūnya\u003c/i\u003e–vazia. \u003ci class=\"wbw__term\"\u003evirahe\u003c/i\u003e–Em separação \u003ci class=\"wbw__term\"\u003egovinda\u003c/i\u003e–de Govinda, [minha] \u003ci class=\"wbw__term\"\u003eprāṇa\u003c/i\u003e–vida \u003ci class=\"wbw__term\"\u003enāhi\u003c/i\u003e–não pode \u003ci class=\"wbw__term\"\u003erahe\u003c/i\u003e–seguir. \u003ci class=\"wbw__term\"\u003ebala\u003c/i\u003e–Diga [me,] \u003ci class=\"wbw__term\"\u003ekemane\u003c/i\u003e–como \u003ci class=\"wbw__term\"\u003evā̐chiba\u003c/i\u003e–vou viver?\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDos meus olhos caíram lágrimas tal como as chuvas de Śrāvaṇ, e a superfície da Terra se tornou vazia. Em separação de Govinda, minha vida não pode prosseguir. Diga-me, como devo viver?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakati-vinoda asthira ha-iyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epunaḥ nāmāśraya kari’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eḍāke rādhānātha diyā daraśana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprāṇa rākha, nahe mari\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eha-iyā\u003c/i\u003e–Estando \u003ci class=\"wbw__term\"\u003easthira\u003c/i\u003e–instável \u003ci class=\"wbw__term\"\u003ebhakati-vinoda\u003c/i\u003e–Bhakti Vinod \u003ci class=\"wbw__term\"\u003epunaḥ\u003c/i\u003e–de novo \u003ci class=\"wbw__term\"\u003eāśraya kari’\u003c/i\u003e–toma abrigo \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–no Nome [e] \u003ci class=\"wbw__term\"\u003eḍāke\u003c/i\u003e–chama \u003ci class=\"wbw__term\"\u003enātha\u003c/i\u003e–“Ó Senhor \u003ci class=\"wbw__term\"\u003erādhā\u003c/i\u003e–de Rādhā \u003ci class=\"wbw__term\"\u003edaraśana diyā\u003c/i\u003e–apareça [para mim e] \u003ci class=\"wbw__term\"\u003erākha\u003c/i\u003e–salve [minha] \u003ci class=\"wbw__term\"\u003eprāṇa\u003c/i\u003e–vida. \u003ci class=\"wbw__term\"\u003enahe\u003c/i\u003e–Senão \u003ci class=\"wbw__term\"\u003emari\u003c/i\u003e–vou morrer!”\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHesitante, de novo Bhakti Vinod toma abrigo no Nome e chama em voz alta: “Ó Senhor de Rādhā! Apareça para mim e salve minha vida. De outra maneira, vou morrer!”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-bondhu-gon-shiunoho-vachana-mora\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eCanção 8a\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eāśliṣya vā pāda-ratāṁ pinaṣṭu mām\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eadarśanān marma-hatāṁ karotu vā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyathā tathā vā vidadhātu lampaṭo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emat-prāṇa-nāthas tu sa eva nāparaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eāśliṣya vā\u003c/i\u003e–Ele pode abraçar \u003ci class=\"wbw__term\"\u003epāda-ratāṁ\u003c/i\u003e–esta serva aos pés [Dele] [e] \u003ci class=\"wbw__term\"\u003epinaṣṭu\u003c/i\u003e–esmagar \u003ci class=\"wbw__term\"\u003emām\u003c/i\u003e–me, \u003ci class=\"wbw__term\"\u003evā\u003c/i\u003e–ou \u003ci class=\"wbw__term\"\u003ekarotu\u003c/i\u003e–Ele pode \u003ci class=\"wbw__term\"\u003ehatāṁ\u003c/i\u003e–quebrar [meu] \u003ci class=\"wbw__term\"\u003emarma\u003c/i\u003e–coração \u003ci class=\"wbw__term\"\u003eadarśanāt\u003c/i\u003e–em separação. \u003ci class=\"wbw__term\"\u003eyathā tathā\u003c/i\u003e–Qualquer coisa \u003ci class=\"wbw__term\"\u003elampaṭaḥ\u003c/i\u003e–aquele debochado \u003ci class=\"wbw__term\"\u003evidadhātu vā\u003c/i\u003e–pode fazer. \u003ci class=\"wbw__term\"\u003etu\u003c/i\u003e–Ainda assim \u003ci class=\"wbw__term\"\u003esaḥ\u003c/i\u003e–Ele \u003ci class=\"wbw__term\"\u003eeva\u003c/i\u003e–sozinho, [e] \u003ci class=\"wbw__term\"\u003ena aparaḥ\u003c/i\u003e–ninguém mais, [é] \u003ci class=\"wbw__term\"\u003enāthaḥ\u003c/i\u003e–o Senhor \u003ci class=\"wbw__term\"\u003emat\u003c/i\u003e–do meu \u003ci class=\"wbw__term\"\u003eprāṇa\u003c/i\u003e–coração.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle pode abraçar esta serva, Ele pode pisar em cima de mim, ou Ele pode ir embora e partir meu coração. O que quer que este debochado faça, Ele apenas, e ninguém mais, é o Senhor do meu coração.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse-subtitle\"\u003eGīti\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(bandhu-gaṇa) śunaha vachana mora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhāvete vibhora thākiye yakhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edekhā deya chitta-chora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003e(bandhu-gaṇa)\u003c/i\u003e–Ó amigos! \u003ci class=\"wbw__term\"\u003eśunaha\u003c/i\u003e–Escutem \u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–minhas \u003ci class=\"wbw__term\"\u003evachana\u003c/i\u003e–palavras. \u003ci class=\"wbw__term\"\u003ethākiye\u003c/i\u003e–Eu fico \u003ci class=\"wbw__term\"\u003evibhora\u003c/i\u003e–cheia \u003ci class=\"wbw__term\"\u003ebhāvete\u003c/i\u003e–de êxtase \u003ci class=\"wbw__term\"\u003eyakhana\u003c/i\u003e–quando \u003ci class=\"wbw__term\"\u003echora\u003c/i\u003e–o ladrão \u003ci class=\"wbw__term\"\u003echitta\u003c/i\u003e–do [meu] coração \u003ci class=\"wbw__term\"\u003edekhā deya\u003c/i\u003e–aparece [diante de mim].\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ amigos! Escutem minhas palavras. Eu fico cheia de êxtase quando o ladrão do meu coração aparece diante de mim.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evichakṣaṇa kari’ dekhite chāhile\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehaya ā̐khi-agochara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epunaḥ nāhi dekhi’ kā̐daye parāṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eduḥkhera nā thāke ora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Mas] \u003ci class=\"wbw__term\"\u003echāhile\u003c/i\u003e–quando eu olho \u003ci class=\"wbw__term\"\u003evichakṣaṇa kari’\u003c/i\u003e–e foco \u003ci class=\"wbw__term\"\u003edekhite\u003c/i\u003e–para vê-Lo, \u003ci class=\"wbw__term\"\u003eagochara haya\u003c/i\u003e–Ele desaparece \u003ci class=\"wbw__term\"\u003eā̐khi\u003c/i\u003e–dos [meus] olhos. \u003ci class=\"wbw__term\"\u003epunaḥ\u003c/i\u003e–Novamente, \u003ci class=\"wbw__term\"\u003enāhi\u003c/i\u003e–não \u003ci class=\"wbw__term\"\u003edekhi’\u003c/i\u003e–vendo [Ele], [meu] \u003ci class=\"wbw__term\"\u003eparāṇa\u003c/i\u003e–coração \u003ci class=\"wbw__term\"\u003ekā̐daye\u003c/i\u003e–chora, [e] \u003ci class=\"wbw__term\"\u003eora\u003c/i\u003e–um fim \u003ci class=\"wbw__term\"\u003eduḥkhera\u003c/i\u003e–para [minha] tristeza \u003ci class=\"wbw__term\"\u003ethāke nā\u003c/i\u003e–não existe.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMas quando eu fixo os olhos para vê-Lo mais claramente, Ele desaparece. Novamente, não O vendo, meu coração chora, e minha tristeza é sem fim.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejagatera bandhu sei kabhu more laya sātha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyathā tathā rākhu more āmāra se prāṇanātha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekabhu\u003c/i\u003e–Às vezes \u003ci class=\"wbw__term\"\u003esei\u003c/i\u003e–Ele, \u003ci class=\"wbw__term\"\u003ebandhu\u003c/i\u003e–o amigo \u003ci class=\"wbw__term\"\u003ejagatera\u003c/i\u003e–do mundo \u003ci class=\"wbw__term\"\u003elaya\u003c/i\u003e–leva \u003ci class=\"wbw__term\"\u003emore\u003c/i\u003e–me \u003ci class=\"wbw__term\"\u003esātha\u003c/i\u003e–com [Ele]. \u003ci class=\"wbw__term\"\u003eyathā tathā\u003c/i\u003e–Seja como for \u003ci class=\"wbw__term\"\u003erākhu\u003c/i\u003e–Ele pode tratar \u003ci class=\"wbw__term\"\u003emore\u003c/i\u003e–me. \u003ci class=\"wbw__term\"\u003ese\u003c/i\u003e–Ele [é] \u003ci class=\"wbw__term\"\u003enātha\u003c/i\u003e–o Senhor \u003ci class=\"wbw__term\"\u003eāmāra\u003c/i\u003e–do meu \u003ci class=\"wbw__term\"\u003eprāṇa\u003c/i\u003e–coração.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÀs vezes, Ele, o amigo do mundo, me leva consigo. Não importa como ele me trate, Ele é o Senhor do meu coração.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edarśana-ānanda-dāne sukha deya mora prāṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebale more praṇaya-vachana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epunaḥ adarśana diyā dagdha kare mora hiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprāṇe more māre prāṇa-dhana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003edāne\u003c/i\u003e–Por [me] dar \u003ci class=\"wbw__term\"\u003eānanda\u003c/i\u003e–o êxtase \u003ci class=\"wbw__term\"\u003edarśana\u003c/i\u003e–do encontro [com Ele e] \u003ci class=\"wbw__term\"\u003ebale\u003c/i\u003e–por dizer \u003ci class=\"wbw__term\"\u003evachana\u003c/i\u003e–palavras \u003ci class=\"wbw__term\"\u003epraṇaya\u003c/i\u003e–amorosas \u003ci class=\"wbw__term\"\u003emore\u003c/i\u003e–a mim, [Ele] \u003ci class=\"wbw__term\"\u003esukha\u003c/i\u003e\u003ci class=\"wbw__term\"\u003edeya\u003c/i\u003e–deleita \u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–meu \u003ci class=\"wbw__term\"\u003eprāṇe\u003c/i\u003e–coração. \u003ci class=\"wbw__term\"\u003epunaḥ\u003c/i\u003e–Novamente \u003ci class=\"wbw__term\"\u003eadarśana diyā\u003c/i\u003e–ao abandonar [me], \u003ci class=\"wbw__term\"\u003edagdha kare\u003c/i\u003e–Ele queima \u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–meu \u003ci class=\"wbw__term\"\u003ehiyā\u003c/i\u003e–coração. \u003ci class=\"wbw__term\"\u003emāre\u003c/i\u003e–Ele mata \u003ci class=\"wbw__term\"\u003emore\u003c/i\u003e–meu \u003ci class=\"wbw__term\"\u003eprāṇe\u003c/i\u003e–coração. [Ainda assim, Ele é] \u003ci class=\"wbw__term\"\u003edhana\u003c/i\u003e–a riqueza \u003ci class=\"wbw__term\"\u003eprāṇa\u003c/i\u003e–do [meu] coração.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAo me dar a alegria de encontrá-Lo e ao dizer palavras amorosas a mim, Ele deleita meu coração. Novamente, ao me abandonar, Ele queima e parte meu coração. Ainda assim, Ele é meu amado.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyāhe tāra sukha haya, sei sukha mama\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enija sukhe duḥkhe mora sarvadāi sama\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003esei yāhe\u003c/i\u003e–O que importa [é que] \u003ci class=\"wbw__term\"\u003etāra haya\u003c/i\u003e–Ele esteja \u003ci class=\"wbw__term\"\u003esukha\u003c/i\u003e–feliz. [Isso é] \u003ci class=\"wbw__term\"\u003emama\u003c/i\u003e–minha \u003ci class=\"wbw__term\"\u003esukha\u003c/i\u003e–felicidade. [Minha] \u003ci class=\"wbw__term\"\u003enija\u003c/i\u003e–própria \u003ci class=\"wbw__term\"\u003esukhe\u003c/i\u003e–felicidade [ou] \u003ci class=\"wbw__term\"\u003eduḥkhe\u003c/i\u003e–tristeza [são] \u003ci class=\"wbw__term\"\u003esarvadāi\u003c/i\u003e–sempre \u003ci class=\"wbw__term\"\u003esama\u003c/i\u003e–o mesmo \u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–para mim.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDesde que Ele esteja feliz, isso é minha felicidade. Minha própria felicidade ou tristeza são sempre a mesma coisa para mim.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakati-vinoda saṁyoge viyoge\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etāhe jāne prāṇeśvara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etāra sukhe sukhī sei prāṇanātha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ese kabhu nā haya para\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ebhakati-vinoda\u003c/i\u003e–Bhakti Vinod, \u003ci class=\"wbw__term\"\u003esaṁyoge\u003c/i\u003e–na união [e] \u003ci class=\"wbw__term\"\u003eviyoge\u003c/i\u003e–na separação \u003ci class=\"wbw__term\"\u003ejāne\u003c/i\u003e–sabe [que] \u003ci class=\"wbw__term\"\u003etāhe\u003c/i\u003e–Ele [é] \u003ci class=\"wbw__term\"\u003eīśvara\u003c/i\u003e–o Senhor \u003ci class=\"wbw__term\"\u003eprāṇa\u003c/i\u003e–de [seu] coração. [Eu sou] \u003ci class=\"wbw__term\"\u003esukhī\u003c/i\u003e–feliz [por causa de] \u003ci class=\"wbw__term\"\u003etāra\u003c/i\u003e–Sua \u003ci class=\"wbw__term\"\u003esukhe\u003c/i\u003e–felicidade. \u003ci class=\"wbw__term\"\u003esei\u003c/i\u003e–Ele [é] \u003ci class=\"wbw__term\"\u003enātha\u003c/i\u003e–o Senhor \u003ci class=\"wbw__term\"\u003eprāṇa\u003c/i\u003e–do [meu] coração. \u003ci class=\"wbw__term\"\u003ese kabhu nā\u003c/i\u003e–Nunca \u003ci class=\"wbw__term\"\u003ehaya\u003c/i\u003e–será \u003ci class=\"wbw__term\"\u003epara\u003c/i\u003e–outra pessoa.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBhakti Vinod, na união e na separação, sabe que Ele é o Senhor de seu coração. Estou feliz se Ele está feliz. Ele é o Senhor do meu coração, e ninguém mais jamais o será.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-yoga-pithopari-sthita-ashta-sakhi-subeshtita\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eCanção 8b\u003c/h3\u003e\n\u003ch3\u003e(Esta parte geralmente não se canta em voz alta)\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyoga-pīṭhopari-sthita aṣṭa-sakhī-suveṣṭita\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evṛndāraṇye kadamba-kānane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhā-saha vaṁśī-dhārī viśva-jana-chitta-hārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprāṇa mora tā̐hāra charaṇe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003esthita\u003c/i\u003e–Situado \u003ci class=\"wbw__term\"\u003eupari\u003c/i\u003e–no \u003ci class=\"wbw__term\"\u003eyoga-pīṭha\u003c/i\u003e–Yoga Pīṭh \u003ci class=\"wbw__term\"\u003earaṇye\u003c/i\u003e–na floresta \u003ci class=\"wbw__term\"\u003evṛndā\u003c/i\u003e–de Vṛndā [e] \u003ci class=\"wbw__term\"\u003esuveṣṭita\u003c/i\u003e–cercado \u003ci class=\"wbw__term\"\u003eaṣṭa-sakhī\u003c/i\u003e–pelas oito sakhīs \u003ci class=\"wbw__term\"\u003ekānane\u003c/i\u003e–em um arbusto \u003ci class=\"wbw__term\"\u003ekadamba\u003c/i\u003e–de árvores kadamba, \u003ci class=\"wbw__term\"\u003esaha\u003c/i\u003e–com \u003ci class=\"wbw__term\"\u003erādhā\u003c/i\u003e–Rādhā [está] \u003ci class=\"wbw__term\"\u003edhārī\u003c/i\u003e–aquele que toca \u003ci class=\"wbw__term\"\u003evaṁśī\u003c/i\u003e–a flauta, \u003ci class=\"wbw__term\"\u003ehārī\u003c/i\u003e–o ladrão \u003ci class=\"wbw__term\"\u003echitta\u003c/i\u003e–do coração \u003ci class=\"wbw__term\"\u003ejana\u003c/i\u003e–das almas \u003ci class=\"wbw__term\"\u003eviśva\u003c/i\u003e–de todo o universo. \u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–Meu \u003ci class=\"wbw__term\"\u003eprāṇa\u003c/i\u003e–coração [está aos] \u003ci class=\"wbw__term\"\u003etā̐hāra\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003echaraṇe\u003c/i\u003e–pés.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSituado no Yoga Pīṭh em Vṛndāvan, com as oito sakhīs em volta Dele, em um arbusto de árvores kadamba, com Rādhā está o flautista, o ladrão do coração de todas as almas do mundo. Meu coração está aos pés Dele.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esakhī-ājñāmata kari do̐hāra sevana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epālya-dāsī sadā bhāvi do̐hāra charaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003emata\u003c/i\u003e–De acordo \u003ci class=\"wbw__term\"\u003eājñā\u003c/i\u003e–às ordens \u003ci class=\"wbw__term\"\u003esakhī\u003c/i\u003e–das sakhīs, \u003ci class=\"wbw__term\"\u003ekari do̐hāra sevana\u003c/i\u003e–eu Os sirvo, [Rādhā e Kṛṣṇa]. \u003ci class=\"wbw__term\"\u003epālya-dāsī\u003c/i\u003e–Como uma serva mantida [eu] \u003ci class=\"wbw__term\"\u003esadā\u003c/i\u003e–sempre \u003ci class=\"wbw__term\"\u003ebhāvi\u003c/i\u003e–penso [nos] \u003ci class=\"wbw__term\"\u003echaraṇa\u003c/i\u003e–pés \u003ci class=\"wbw__term\"\u003edo̐hāra\u003c/i\u003e–Deles.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDe acordo com as ordens das sakhīs, sirvo Rādhā e Kṛṣṇa. Como criada mantida, eu sempre penso em Seus pés.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekabhu kṛpā kari’ mama hasta dhari’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emadhura-vachana bale\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etāmbula la-iyā khāya dui jane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emālā laya kutūhale\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekabhu\u003c/i\u003e–Às vezes \u003ci class=\"wbw__term\"\u003ekṛpā kari’\u003c/i\u003e–Eles misericordiosamente \u003ci class=\"wbw__term\"\u003edhari’\u003c/i\u003e–seguram \u003ci class=\"wbw__term\"\u003emama\u003c/i\u003e–minhas \u003ci class=\"wbw__term\"\u003ehasta\u003c/i\u003e–mãos [e] \u003ci class=\"wbw__term\"\u003ebale\u003c/i\u003e–falam \u003ci class=\"wbw__term\"\u003emadhura\u003c/i\u003e–doces \u003ci class=\"wbw__term\"\u003evachana\u003c/i\u003e–palavras [a mim]. \u003ci class=\"wbw__term\"\u003edui hane\u003c/i\u003e–Eles \u003ci class=\"wbw__term\"\u003ela-iyā\u003c/i\u003e–aceitam \u003ci class=\"wbw__term\"\u003etāmbula\u003c/i\u003e–pān, \u003ci class=\"wbw__term\"\u003ekhāya\u003c/i\u003e–mastigam [no], [e] \u003ci class=\"wbw__term\"\u003ekutūhale\u003c/i\u003e–avidamente \u003ci class=\"wbw__term\"\u003elaya\u003c/i\u003e–aceitam \u003ci class=\"wbw__term\"\u003emālā\u003c/i\u003e–guirlandas.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÀs vezes, Eles misericordiosamente seguram minhas mãos e me dizem palavras doces. Eles aceitam pān de mim, o mastigam, e avidamente vestem guirlandas que eu preparei.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eadarśana haya kakhana ki chhale\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enā dekhiyā do̐he hiyā mora jvale\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekakhana\u003c/i\u003e–Às vezes \u003ci class=\"wbw__term\"\u003eadarśana haya\u003c/i\u003e–Eles desaparecem [por] \u003ci class=\"wbw__term\"\u003eki\u003c/i\u003e–algum \u003ci class=\"wbw__term\"\u003echhale\u003c/i\u003e–estratagema. \u003ci class=\"wbw__term\"\u003enā\u003c/i\u003e–Não \u003ci class=\"wbw__term\"\u003edekhiyā\u003c/i\u003e–vendo \u003ci class=\"wbw__term\"\u003edo̐he\u003c/i\u003e–Eles \u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–meu \u003ci class=\"wbw__term\"\u003ehiyā\u003c/i\u003e–coração \u003ci class=\"wbw__term\"\u003ejvale\u003c/i\u003e–queima.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÀs vezes, eles desaparecem por algum estratagema. Não os vendo, meu coração queima.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyekhāne sekhāne thākuka du’ jane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāmi ta charaṇa-dāsī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emilane ānanda virahe yātanā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esakala samāna vāsi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eyekhāne sekhāne\u003c/i\u003e–Onde quer que \u003ci class=\"wbw__term\"\u003edu’jane\u003c/i\u003e–Eles \u003ci class=\"wbw__term\"\u003ethākuka\u003c/i\u003e–estejam, \u003ci class=\"wbw__term\"\u003eāmi\u003c/i\u003e–eu [sou] \u003ci class=\"wbw__term\"\u003eta\u003c/i\u003e–certamente \u003ci class=\"wbw__term\"\u003edāsī\u003c/i\u003e–uma serva \u003ci class=\"wbw__term\"\u003echaraṇa\u003c/i\u003e–aos [Seus] pés. \u003ci class=\"wbw__term\"\u003eānanda\u003c/i\u003e–O êxtase \u003ci class=\"wbw__term\"\u003emilane\u003c/i\u003e–da união, \u003ci class=\"wbw__term\"\u003eyātanā\u003c/i\u003e–a dor \u003ci class=\"wbw__term\"\u003evirahe\u003c/i\u003e–da separação, \u003ci class=\"wbw__term\"\u003evāsi\u003c/i\u003e–eu sinto \u003ci class=\"wbw__term\"\u003esakala\u003c/i\u003e–tudo [como sendo] \u003ci class=\"wbw__term\"\u003esamāna\u003c/i\u003e–o mesmo.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOnde quer que Eles estejam, sou uma serva a Seus pés. Na alegria da união, na dor da separação—eu permaneço a mesma em todas as circunstâncias.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erādhā-kṛṣṇa prāṇa mora jīvane maraṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emore rākhi’ māri’ sukhe thākuka du’jane\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003erādhā\u003c/i\u003e–Rādhā [e] \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–Kṛṣṇa [são] \u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–meu \u003ci class=\"wbw__term\"\u003eprāṇa\u003c/i\u003e–coração \u003ci class=\"wbw__term\"\u003ejīvane\u003c/i\u003e–na vida [e] \u003ci class=\"wbw__term\"\u003emaraṇe\u003c/i\u003e–na morte. \u003ci class=\"wbw__term\"\u003erākhi’\u003c/i\u003e–Eles podem manter \u003ci class=\"wbw__term\"\u003emore\u003c/i\u003e–me [ou] \u003ci class=\"wbw__term\"\u003emāri’\u003c/i\u003e–matar [me, mas deixe] \u003ci class=\"wbw__term\"\u003edu’jane\u003c/i\u003e–Eles \u003ci class=\"wbw__term\"\u003ethākuka\u003c/i\u003e–serem \u003ci class=\"wbw__term\"\u003esukhe\u003c/i\u003e–felizes.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eRādhā e Kṛṣṇa são o meu coração, na vida e na morte. Eles podem me manter ou me matar, mas deixe-Os serem felizes.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakati-vinoda āna nāhi jāne\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epaḍi’ nija sakhī-pāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhikāra gaṇe thākiyā satata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyugala-charaṇa chāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ebhakati-vinoda\u003c/i\u003e–Bhakti Vinod \u003ci class=\"wbw__term\"\u003ejāne nāhi\u003c/i\u003e–não conhece \u003ci class=\"wbw__term\"\u003eāna\u003c/i\u003e–ninguém mais. \u003ci class=\"wbw__term\"\u003epaḍi’\u003c/i\u003e–Se curvando \u003ci class=\"wbw__term\"\u003epāya\u003c/i\u003e–aos pés \u003ci class=\"wbw__term\"\u003enija\u003c/i\u003e–de sua \u003ci class=\"wbw__term\"\u003esakhī\u003c/i\u003e–sakhī \u003ci class=\"wbw__term\"\u003ethākiyā\u003c/i\u003e–ele fica \u003ci class=\"wbw__term\"\u003esatata\u003c/i\u003e–sempre \u003ci class=\"wbw__term\"\u003egaṇe\u003c/i\u003e–no grupo \u003ci class=\"wbw__term\"\u003erādhikāra\u003c/i\u003e–de Śrī Rādhikā [e] \u003ci class=\"wbw__term\"\u003echāya\u003c/i\u003e–deseja \u003ci class=\"wbw__term\"\u003echaraṇa\u003c/i\u003e–os pés \u003ci class=\"wbw__term\"\u003eyugala\u003c/i\u003e–do Casal.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBhakti Vinod não conhece mais ninguém. Inclinando-se aos pés da sakhī que ele segue, ele permanece sempre no grupo de Śrī Rādhikā e deseja os pés do Casal Divino.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003ePrabhupād\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-sujanarvuda-radhita-pada-yugam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śrī Prabhupāda-padma Stavakaḥ \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esujanārvuda-rādhita-pāda-yugaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyuga-dharma-dhurandhara-pātra-varam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaradābhaya-dāyaka-pūjya-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO meu mestre, Prabhupād Śrīla Bhakti Siddhanta Saraswatī Ṭhākur, estabeleceu a religião da era, o Kṛṣṇa-saṅkīrtan, e é o ministro-chefe da assembleia universal dos líderes Vaiṣṇavas. Seus pés de lótus são adorados por milhões de almas virtuosas e cumprem os desejos daqueles que dissipam os receios das almas. Eternamente eu ofereço minha reverência aos adoráveis pés do meu mestre.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhajanorjita-sajana-saṅgha-patiṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epatitādhika-kāruṇikaika-gatim\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egati-vañchita-vañchakāchintya-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle é o líder das grandes almas que são dotadas de devoção e o único, grandiosamente misericordioso abrigo dos caídos. Seus inconcebíveis pés são o abrigo até mesmo dos enganadores, enganando-os. Eternamente eu ofereço minha reverência aos pés de lótus do meu mestre.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eatikomala-kāñchana-dīrgha-tanuṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etanu-nindita-hema-mṛṇāla-madam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emadanārvuda-vandita-chandra-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSua longa, flexível, e dourada forma esmaga o orgulho dos caules dourados das lótus. Seus pés que são como luas, são adorados por milhões de cupidos. Eternamente eu ofereço minha reverência a eles.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enija-sevaka-tāraka-rañji-vidhuṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evidhutāhita-huṅkṛta-siṁha-varam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaraṇāgata-bāliśa-śanda-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle é a lua que encanta seus servos, que são como estrelas. Seu grande rugido, que é como o de um leão, afugenta o inimigo. Seus pés concedem auspiciosidade sobre os simples que os aceitam. Eternamente eu ofereço minha reverência aos pés do meu mestre.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evipulīkṛta-vaibhava-gaura-bhuvaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhuvaneṣu vikīrtita-gaura-dayam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edayanīya-gaṇārpita-gaura-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle revela a glória divina de Śrī Gaura Dhām, propõe a celebrada graça de Śrī Gaura em todo o mundo, e instala Śrī Gaura dentro dos corações dos destinatários de sua graça. Eternamente eu ofereço minha reverência aos pés do meu mestre.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echira-gaura-janāśraya-viśva-guruṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eguru-gaura-kiśoraka-dāsya-param\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eparamādṛta-bhaktivinoda-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle é o refúgio eterno das almas rendidas a Śrī Gaura e ao Guru do universo. Ele é dedicado ao serviço de seu Guru, Śrīla Gaura Kiśor, e completamente dedicado a Śrīla Bhakti Vinod. Eternamente eu ofereço a minha reverência aos pés do meu mestre.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eraghu-rūpa-sanātana-kīrtti-dharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edharaṇī-tala-kīrttita-jīva-kavim\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekavirāja-narottama-sakhya-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle mostra a glória de Śrī Rūpa, Śrī Sanātan e Śrī Raghunāth. Neste mundo ele é glorificado como sendo não diferente de Śrī Jīva e o complemento direto de Śrīla Kṛṣṇadās Kavirāj e Śrīla Narottam Ṭhākur. Eternamente eu ofereço minha reverência aos pés do meu mestre.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛpayā hari-kīrtana-mūrti-dharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edharaṇī-bhara-hāraka-gaura-janam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejanakādhika-vatsala-snigdha-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle é a personificação do Hari-kīrtan. Ele misericordiosamente alivia a Mãe Terra do peso em cima dela. Ele é um associado de Śrī Gaura, e mais amável e afetuoso do que um pai. Eternamente eu ofereço minha reverência aos pés do meu mestre.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśaraṇāgata-kiṅkara-kalpa-taruṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etaru-dhik-kṛta dhīra vadānya varam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaradendra-gaṇārchita-divya-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle é uma árvore dos desejos para os servos rendidos. Sua benevolência e tolerância envergonham até a benevolência e tolerância de uma árvore. Os semideuses e sábios adoram seus divinos pés. Eternamente eu ofereço minha reverência aos pés do meu mestre.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eparahaṁsa-varaṁ paramārtha-patiṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epatitodharaṇe kṛta-veśa-yatim\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyati-rāja-gaṇaiḥ parisevya-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle é o melhor dos paramahaṁsas e o guardião da riqueza suprema (Kṛṣṇa-prema). Ele aceitou as vestes de um sannyāsī para libertar os caídos. Seus pés são servidos pelos melhores dos sannyāsīs. Eternamente eu ofereço minha reverência aos pés do meu mestre.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evṛṣabhānu-sutā-dayitānucharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echaraṇāśrita-reṇu-dharas tam aham\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emahad-adbhuta-pāvana-śakti-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEle é o amado servo de Śrīmatī Rādhārāṇī. Eu seguro em minha cabeça a poeira de seus tremendos, maravilhosamente purificantes pés, e eternamente ofereço minha reverência a eles.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eŚrī Śrī Prema-dhāma-deva Stotram\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-deva-siddha-mukta-yukta-bhakta-vrinda\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śrī Prema-dhāma-deva Stotram \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eSábado\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edeva-siddha-mukta-yukta-bhakta-vṛnda-vanditaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epāpa-tāpa-dāva-dāha-dagdha duḥkha-khaṇḍitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-nāma-sīdhu-dhāma-dhanya-dāna-sāgaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOs deuses do universo, os seres aperfeiçoados, os salvacionistas, os yogis místicos e os servos exaltados da Verdade Absoluta, Śrī Kṛṣṇa, constantemente cantam as glórias de Śrī Gaurasundar.\u003cbr\u003e\nEm relação aos Passatempos do Senhor Chaitanya, Śrīla Rūpa Goswāmī mencionou o seguinte verso em seu \u003ci\u003eŚrī Chaitanyāṣṭakaḥ\u003c/i\u003e:\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esadopāsyaḥ śrīmān dhṛta-manuja-kāyaiḥ praṇayitāṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evahadbhir gīr-vāṇair giriśa-parameṣṭhi-prabhṛtibhiḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Os deuses, liderados pelo Senhor Śiva e pelo Senhor Brahmā, aceitaram a aparência de homens comuns nos Passatempos de Śrī Chaitanyadev a fim de adorá-Lo eternamente com afeto sincero.” Śrī Chaitanyadev é a personificação daquele vasto oceano de néctar que se encontra no Santo Nome do Senhor Kṛṣṇa e que nada mais é do que o próprio Nome puro de Śrī Gaurāṅga. Śrī Chaitanyadev é comparado a esse grandioso oceano de leite que, depois de ter sido batido, produziu néctar. O néctar que Mahāprabhu distribui são os Santos Nomes do Senhor Kṛṣṇa, que extinguem todas as misérias da existência material, tais como as ansiedades que brotam das atividades pecaminosas realizadas em oposição direta ao Senhor, e os sofrimentos triplos que alimentam o grandioso fogo da floresta que queima aqueles que estão buscando pelo prazer dos sentidos, pela salvação e pelas perfeições do yoga místico. Ofereço minha reverência a esse belo Senhor Dourado, Gaurasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esvarṇa-koṭi-darpaṇābha-deha-varṇa-gauravaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epadma-pārijāta-gandha-vanditāṅga-saurabham\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekoṭi-kāma-murchchhitāṅghri-rūpa-rāsa-raṅgaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eA aura encantadora da figura divina de Śrī Gaurasundar lembra o reflexo de milhões de espelhos dourados. E mais ainda, a doce fragrância personificada das flores de lótus terrenas e celestiais oferece suas orações humildemente diante do perfume aromático que permeia o ar provindo da bela forma de Śrī Chaitanya Mahāprabhu. Milhões e milhões de cupidos caem inconscientes aos pés da elegante figura de Śrī Chaitanyadev. Eles ficam severamente chocados, uma vez que a percepção da fama deles, que nasce do belo esplendor que eles têm, é diminuída. Ao realizar Seus alegres Passatempos de dançar, a forma divina de Śrī Gaurāṅgasundar balança brincalhona de um lado para o outro. As pulsações fluentes dos membros do Senhor movem-se no ritmo dos vários humores encantadores dos sentimentos devocionais, bhāva, que dominam Sua graciosa figura. Ofereço minha reverência a esse belo Senhor Dourado, Gaurasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprema-nāma-dāna-janya-pañcha-tattvakātmakaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esāṅga-divya-pārṣadāstra-vaibhavāvatārakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśyāma-gaura-nāma-gāna-nṛtya-matta-nāgaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAo manifestar Seus cinco aspectos divinos, o Pañcha Tattva, Śrī Gaurāṅgadev foi capaz de distribuir amplamente os doces Nomes do Senhor Kṛṣṇa, que são o meio que permite alcançar a realização última na vida humana: o amor puro pela Verdade Absoluta, Śrī Kṛṣṇa, a quinta meta (a ‘quinta meta’ se refere àquilo que se obtém além da religiosidade, do desenvolvimento econômico, do prazer dos sentidos e da liberação). O Senhor encarnou pessoalmente no planeta Terra com Suas expansões tais como Nityānanda Prabhu e Advaita Āchārya, Seu associado íntimo tal como Gadādhar Paṇḍit, e Seus outros associados gerais tal como Śrīvās Ṭhākur. Quando o Senhor aparece, Ele vem armado com o Santo Nome de Kṛṣṇa. Ao dançar no mais profundo êxtase do amor puro, o Senhor Gaurāṅgadev—mesmo sendo o próprio Śyāmasundar—canta Seus próprios Nomes como um cidadão comum do distrito de Nadia. Ofereço minha reverência a esse belo Senhor Dourado, Gaurasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśānti-puryadhīśa-kaly-adharma-duḥkha-duḥsahaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejīva-duḥkha-hāna-bhakta-saukhyadāna-vigraham\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekaly-aghaugha-nāśa-kṛṣṇa-nāma-sīdhu-sañcharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAo aparecer em Sua forma de Deidade, Śrī Gaurāṅgadev removeu a condição miserável das entidades vivas e aumentou o prazer devocional de Seus devotos. O Senhor encarnou, pois foi incapaz de tolerar a condição angustiada de Śrī Advaita Āchārya, o mestre do encantador vilarejo de Śāntipur. Śrī Advaita Āchārya lamentava a respeito desta era ter sido dominada pela influência horrível das práticas irre - ligiosas. Assim, a fim de suspender as atividades imorais da Kali-yuga, o Senhor distribuiu profusamente o doce néctar dos Santos Nomes do Senhor Kṛṣṇa. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edvīpa-navya-gāṅga-baṅga-janma-karma-darśitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrīnivāsa-vāsa-dhanya-nāma-rāsa-harṣitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-haripriyeśa-pūjyadhī-śachī-purandaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Gaurāṅgadev apareceu em Bengal Ocidental no local sagrado conhecido como Nabadwīp, às margens do Rio Ganges. Ao revelar Seus Passatempos domésticos na morada sagrada de Nabadwīp, Śrī Gaura abençoou o belo pátio em volta da residência de Śrīvās Paṇḍit, e satisfez Seus associados mais queridos ao manifestar Seus Passatempos noturnos do canto congregacional nos humores mais profundos da dedicação pura. Śrī Gaurasundar era a força vital de Lakṣmī Devī e Viṣṇu Priyā. Sua inteligência era expressa em profunda adoração parental por Sua mãe e Seu pai, Śachī Devī e Jagannāth Miśra. Ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-śachī-dulāla-bālya-bāla-saṅga-chañchalaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eākumāra-sarva-śāstra-dakṣa-tarka-maṅgalam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echāttra-saṅga-raṅga-digjigīṣu-darpa-saṁharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Gaurāṅgadev, o filho de Śachī Devī, sempre realizava Passatempos infantis travessos na associação dos meninos mais traquinas. (Nimāi era como o bebê Kṛṣṇa, o filho de mãe Yaśodā.) Os Passatempos de Nimāi, ainda que travessos, eram não apenas agradáveis para Ele, mas também trouxeram felicidade para os corações de Seus devotos. Em seus anos de adolescência, o Senhor adquiriu maestria inigualável sobre as conclusões das escrituras antigas. Comandando uma lógica insuperável, o Senhor Viśvambhar estabeleceu com grande habilidade a doutrina auspiciosa de śuddha-bhakti, a dedicação pura à Doce Verdade Absoluta, o Senhor Kṛṣṇa, assim derrotando a doutrina da lógica seca estudada pelos lógicos orgulhosos e hábeis que eram quase todos eruditos ateus. Mais tarde, no decorrer de Seus Passatempos adolescentes, o Senhor conquistou o orgulho do mais famoso erudito sânscrito de todos os tempos, o Digvijayī Paṇḍit, acompanhado de Seus estudantes de gramática, nas margens do Rio Ganges. Ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evarjya-pātra-sārameya-sarpa-saṅga-khelanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eskandha-vāhi-chaura-tīrtha-vipra-chitra-līlanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-nāma-mātra-bālya-kopa-śānti-saukaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAinda em Seus Passatempos infantis, Nimāi sentou-se em meio aos potes de barro descartados que haviam sido utilizados para cozinhar preparações para o Senhor Viṣṇu. Ele também brincava com animais sujos, como filhotes de cachorros, e, em certa ocasião, deitou-Se sobre uma cobra, tratando-a como se fosse Ananta Śeṣa. Certa vez, Nimāi foi sequestrado por dois ladrões que planejavam roubar as jóias que decoravam Seu corpo encantador. Pondo Nimāi sobre seus ombros, eles instigaram o menino a vir com eles e assim fugiram rapidamente levando-O com eles. Contudo, devido à potência Yogamāyā do Senhor, eles repentinamente perceberam que tinham chegado de volta à casa de Nimāi. Mais tarde, um famoso mendigo brāhmaṇ visitou a residência de Jagannāth Miśra. Quando o brāhmaṇ começou a oferecer alguns pratos que havia cozinhado para o Senhor Gopāl, Nimāi estragou a oferenda comendo os alimentos, enquanto o mendigo os oferecia em meditação. Depois de fazer a mesma coisa com o brāhmaṇ por três vezes, o Senhor revelou-lhe a Sua forma de oito braços. Sempre que o pequeno Nimāi chorava zangado, Ele somente podia ser pacificado com o canto dos Santos Nomes do Senhor Kṛṣṇa. Ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esnāna-gāṅga-vāri-bāla-saṅga-raṅga-khelanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebālikādi-pārihāsya-bhaṅgi-bālya-līlanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekūṭa-tarka-chhātra-śikṣakādi-vāda-tatparaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEm Seus Passatempos infantis, Nimāi se divertia muito nas águas do Rio Ganges com seus colegas de escola. Às vezes, Nimāi, com vários gestos e dando risada, também provocava as meninas que vinham nadar no Ganges. Entretanto, esse mesmo menino costumava apresentar argumentos e contraargumentos geniais diante de seus colegas de classe e professores. Ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī nimāi-paṇḍiteti-nāma-deśa-vanditaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enavya-tarka-dakṣa-lakṣa-dambhi-dambha-khaṇḍitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esthāpitārtha-khaṇḍa-khaṇḍa-khaṇḍitārtha-sambharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDurante Seus Passatempos adolescentes, o Senhor ficou famoso e respeitado em todos os lugares como o grande erudito Nimāi Paṇḍit. O Senhor desmontava o falso orgulho de milhões de lógicos eruditos arrogantes. Deixando-os sem fala e voltando às suas conclusões iniciais, o Senhor então reprovava Sua própria opinião e justificava a lógica inicial deles. Ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificação de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśloka-gāṅga-vandanārtha-digjigīṣu-bhāṣitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evyatyalaṅkṛtādi-doṣa-tarkitārtha-dūṣitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhvasta-yukti-ruddha-buddhi-datta-dhīmadādaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eApós ter conquistado intelectualmente as dez direções, o grandioso erudito em sânscrito Keśava Kāśmīrī chegou diante de Śrī Chaitanya Mahāprabhu à beira do Rio Ganges. A pedido do Senhor, ele compôs de improviso e recitou muitas maravilhosas orações de glorificação ao sagrado Ganges. Śrī Gaurāṅgadev deixou o erudito atônito quando Ele foi capaz de lembrar de todas, apontando vários erros de retórica nas composições. Keśava Kāśmīrī habilidosamente apresentou muitos argumentos em seu favor, mas foi por fim derrotado. Finalmente, quando a inteligência de Keśava Kāśmīrī foi exposta e ele ficou totalmente perplexo, o Senhor Gaurāṅga com muita compaixão ofereceu-lhe o respeito apropriado a um grande erudito, impedindo que Seus estudantes, presentes ali, rissem do paṇḍit. Ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificação de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-sutra-vritti-tippanishta-sukshma-vachanadbhutam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch2\u003eŚrī Śrī Prema-dhāma-deva Stotram \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eDomingo\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esūtra-vṛtti-ṭippanīṣṭa-sūkṣma-vāchanādbhutaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhātu-mātra-kṛṣṇa-śakti-sarva-viśva-sambhṛtam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eruddha-buddhi-paṇḍitaugha-nānya-yukti-nirdharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eExplicando de modo elaborado os aforismos ensinados na gramática sânscrita e na ciência da lógica, Śrī Gaurasundar revelava seus significados aparentes e sutis. O belo estilo do Senhor de derivar o significado interno dos sūtras deixou completamente estarrecidos todos os círculos eruditos. O Senhor demonstrou que as sete mil raízes verbais sonoras contidas na gramática sânscrita alcançam seu zênite em termos de sua expressão ao serem realizadas como potências existentes dentro da concepção Kṛṣṇa da realidade. Sentados, em profunda perplexidade, os eruditos acadêmicos com seus intelectos poderosos ficaram paralisados com a explicação intrigante do Senhor Gaurāṅga. Ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificação de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛṣṇa-dṛṣṭi-pāta-hetu-śabdakārtha-yojanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esphoṭa-vāda-śṛṅkhalaika-bhitti-kṛṣṇa-vīkṣaṇam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esthūla-sūkṣma-mūla-lakṣya-kṛṣṇa-saukhya-sambharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Gaurasundar provou que a doce vontade do Senhor Supremo e Seu olhar benevolente são a causa fundamental que outorga o significado de todo som. O elemento fundamental que decide pelo arranjo ordenado e pela harmonia compartilhada entre o som e o seu significado é a sanção do Senhor, e não os esforços mundanos de gramáticos proeminentes como os liderados pelo sábio Pāṇini, que tentam atribuir significados aos sons das palavras. O propósito de tudo o que existe, animado ou inanimado existe em última análise para satisfazer ao Senhor Supremo, intensificando Seus Passatempos encantadores. Ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificação de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprema-raṅga-pāṭha-bhaṅga-chhātra-kāku-kātaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echhātra-saṅga-hasta-tāla-kīrtanādya-sañcharam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-nāma-sīdhu-sindhu-magna-dik-charācharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDepois de retornar de Gaya, o Senhor começou a ensinar sânscrito a Seus estudantes novamente. Entretanto, quando o Senhor ficou tomado pelas emoções que nascem do amor puro, Ele acabou não sendo mais capaz de continuar a ensiná-los. Os alunos pessoais de Nimāi, sem poder mais estudar com o Senhor, condenaram seu próprio infortúnio. Lamentando-se, eles humildemente exaltaram o gênio sem igual dos ensinamentos do Senhor.\u003cbr\u003e\nAinda que o Senhor estivesse triste, pois ele nutria sentimentos de simpatia por Seus alunos, Ele agiu como o eterno bem-querente ao inaugurar a feliz glorificação ao Senhor Kṛṣṇa, cantando: “\u003ci\u003eHaraye namaḥ kṛṣṇa\u003c/i\u003e” enquanto eles batiam palmas em uníssono. No despertar do canto congregacional, as entidades vivas móveis e imóveis em todas as dez direções ficaram imersas nas ondas daquele grandioso oceano dos doces humores. Ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificação de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"14\"\u003e\n\u003ch5\u003e14\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eārya-dharma-pāla-labdha-dīkṣa-kṛṣṇa-kīrtanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elakṣa-lakṣa-bhakta-gīta-vādya-divya-nartanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edharma-karma-nāśa-dasyu-duṣṭa-duṣkṛtoddharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŚrī Gaurasundar respeitava os princípios Védicos e inaugurou o canto congregacional dos Santos Nomes do Senhor depois de se abrigar plenamente em Seu mestre espiritual. O Senhor costumava cantar continuamente e distribuir os Santos Nomes do Senhor Kṛṣṇa, dançando de forma muito jubilosa na associação de milhares de devotos. Desse modo, Ele libertou grandes demônios como Jagāi e Mādhāi, e outros grupos demoníacos que destroem os princípios religiosos e as regras que governam as ordens sociais e espirituais da sociedade. Ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificação de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"15\"\u003e\n\u003ch5\u003e15\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emlecha-rāja-nāma-bādha-bhakta-bhīti-bhañjanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elakṣa-lakṣa-dīpa-naiśa-koṭi-kaṇṭha-kīrtanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-mṛdaṅga-tāla-vādya-nṛtya-kāji-nistaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCerta vez, um grande magistrado muçulmano chamado Chāṅd Kāzī proibiu os devotos de realizar o canto congregacional dos Santos Nomes do Senhor. Em retaliação, o Senhor Chaitanyadev livrou os devotos do medo, liderando-os em uma procissão noturna ornamentada de milhares de tochas e lamparinas flamejantes. Milhões de pessoas se juntaram instantaneamente à onda de êxtase criada pela dança do Senhor Gaurasundar sobre a doce melodia dos instrumentos musicais, como tambores mṛdaṅga e címbalos, que ressoavam em todas as direções. Quando o poderoso muçulmano testemunhou isso, seu falso ego de cobiça foi purificado, e o Senhor o abraçou como a Seu próprio parente. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificação de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"16\"\u003e\n\u003ch5\u003e16\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003elakṣa-lochanāśru-varṣa-harṣa-keśa-kartanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekoṭi-kaṇṭha-kṛṣṇa-kīrtanāḍhya-daṇḍa-dhāraṇam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enyāsi-veśa-sarva-deśa-hā-hutāśa-kātaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEnquanto chuvas de lágrimas caíam dos olhos de milhões de expectadores, Ele se deliciava em ter Seus cabelos raspados (para o bem das pessoas). O cantar do Nome, por milhões de vozes, embelezou Seus Passatempos de aceitar a daṇḍa. O país inteiro lamentou de tristeza ao ver Suas vestes de sannyās. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificação de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"17\"\u003e\n\u003ch5\u003e17\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-yatīsa-bhakta-veśa-rāḍhadeśa-chāraṇaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-chaitanyākhya-kṛṣṇa-nāma-jīva-tāraṇam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhāva-vibhramātma-matta-dhāvamāna-bhū-dharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSendo um jovem sannyāsi, vestido como um devoto, Ele purificou a terra de Rādhā com seus passos. Portando seu novo nome Śrī Kṛṣṇa Chaitanya, Ele liberou todas as almas ao distribuir o Nome de Kṛṣṇa. Em loucura divina—imerso no rasa de servir e distribuir-se a Si mesmo—Ele parecia uma montanha dourada ao correr para todos os lados. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"18\"\u003e\n\u003ch5\u003e18\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-gadādharādi-nityānanda-saṅga-vardhanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eadvayākhya-bhakta-mukhya-vāñchitārtha-sādhanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṣetra-vāsa-sābhilāṣa-mātṛ-toṣa-tatparaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eConcedendo maior prosperidade a todos, a associação de Śrī Chaitanya tornou mais grandiosas ainda as grandes personalidades de Śrī Gadādhar Paṇḍit, Senhor Nityānanda e outras. Quando o Senhor Chaitanya encarnou no planeta Terra, Ele satisfez os desejos do principal devoto Mahābhāgavat Śrī Advaita Āchārya. E também o Senhor Supremo concordou em residir em Jagannāth Purī apenas para satisfazer Sua mãe Śachī Devī. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"19\"\u003e\n\u003ch5\u003e19\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enyāsi-rāja-nīla-śaila-vāsa-sārvabhaumapaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edākṣiṇātya-tīrtha-jāta-bhakta-kalpa-pādapam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erāma-megha-rāga-bhakti-vṛṣṭi-śakti-sañcharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAo chegar no lugar sagrado de peregrinação, Śrī Nīlāchal, o valoroso rei da ordem de vida renunciada, Śrī Chaitanyadev, salvou o mais poderoso erudito reconhecido em toda a extensão da Índia. Śrī Vāsudev Sārvabhauma, o mais dinâmico intelectual de todos os tempos da vasta doutrina vedāntica e da escola de lógica, foi resgatado pelo Senhor do poço impessoal da teoria da transformação, vivartavād, de Śaṅkar Āchārya.\u003cbr\u003e\nMais tarde, o Senhor viajou ao Sul da Índia, onde Se encontrou com os seguidores de várias doutrinas filosóficas. Por onde passava, as aspirações dos devotos encontravam sua mais elevada satisfação, já que o Senhor era como uma árvore dos desejos. Às margens do Rio Godāvarī, o Senhor Se encontrou com Śrī Rāmānanda Rāy, que era como uma nuvem de pura dedicação, e o instruiu a derramar sobre os outros as doces gotas da chuva do rasa que existe na terra da devoção espontânea, Vraja. Śrī Rāmānanda Rāy também respondeu às perguntas que o misericordioso Senhor apresentou juntamente com a essência de toda instrução. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"20\"\u003e\n\u003ch5\u003e20\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprema-dhāma-divya-dīrgha-deha-deva-nanditaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehema-kañja-puñja-nindi-kānti-chandra-vanditam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma-gāna-nṛtya-navya-divya-bhāva-mandiraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eA alta e divina figura de Śrī Gaurāṅgadev intensifica o júbilo dos deuses universais, pois Ele é a personificação encantadora do amor puro. A aura radiante que emana de Sua bela forma insulta milhões de lótus douradas, e ganha respeito para essa refulgente personalidade Chandradev. Śrī Gaurāṅga é o plano de fundo de todos os Passatempos espirituais, conforme exibido nos humores sempre renovados e dinâmicos de bhāva-sattvico e como é visto em sua dança jubilosa ao cantar em congregação os Santos Nomes do Senhor Kṛṣṇa. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-dhvasta-sarvvabhauma-vada-navya-tarka-shiankaram\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"21\"\u003e\n\u003ch2\u003eŚrī Śrī Prema-dhāma-deva Stotram \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eSegunda-feira\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\u003c/h4\u003e\n\u003ch5\u003e21\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edhvasta-sārvabhauma-vāda-navya-tarka-śāṅkaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhvasta-tad-vivarta-vāda-dānavīya-ḍambharam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edarśitārtha-sarva-śāstra-kṛṣṇa-bhakti-mandiraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO magnífico intelectual Sārvabhauma tentou ao máximo estabelecer a doutrina impersonalista de Śaṅkar Āchārya, que se opõe diretamente à conclusão da dedicação pura. Sārvabhauma utilizou-se dos meios mais traiçoeiros na arte do malabarismo de palavras. Ele tentou perverter o sentido das palavras, ele improdutivamente tentou desconsertar os argumentos ou afirmativas do Senhor sem tentar provar o lado oposto, e tentou encontrar os pontos fracos nos argumentos do Senhor. Entretanto, Śrī Chaitanya, cuja figura encantadora estava recoberta pelas vestes frescas de um radiante renunciante, apresentou argumentos consistentes citando a literatura Védica, respondendo e destruindo com facilidade as interpretações ateístas do erudito. O Senhor proclamou em voz alta que a doutrina de Śaṅkar Āchārya conhecida como vivartavād é praticada por seus seguidores no método ascendente de compreensão de quem está interessado em sua própria autoadoração externa. Tal adoração é o produto de um intelecto demoníaco e apoiado pela persistência ateísta. Toda a importância oferecida ao aspecto imanifesto da natureza material foi refutada quando o Senhor Gaurasundar estabeleceu que a variedade espiritual que se encontra na personalidade do Senhor Supremo é a realidade mais elevada ensinada na literatura védica. Isso foi visto na explicação que o Senhor deu dos Upaniṣads, onde se afirma que:\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eapāṇi-pādo javano grahīta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epaśyaty achakṣuḥ sa śṛṇoty akarṇaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“O Senhor não tem mãos nem pernas, contudo Ele caminha e toca. O Senhor não tem olhos nem ouvidos, contudo Ele vê e ouve.”\u003cbr\u003e\nO Senhor Gaurasundar também explicou o verso ‘ātmarāma’, que se encontra na mais grandiosa de todas as literaturas famosas, o \u003ci\u003eŚrīmad Bhāgavatam\u003c/i\u003e. Ele mostrou com clareza que os Vedas, os Purāṇas, o Vedānta e todas as demais escrituras existentes são como um templo magnífico onde ressoam eternamente os maravilhosos Passatempos do Senhor Supremo e suportam a conclusão de que tudo neste mundo é um reflexo da variedade eterna encontrada na esfera espiritual. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificação de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"22\"\u003e\n\u003ch5\u003e22\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛṣṇa-kṛṣṇa-kṛṣṇa-kṛṣṇa-kṛṣṇa-nāma-kīrtanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erāma-rāma-gāna-ramya-divya chhanda-nartanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyatra-tatra-kṛṣṇa-nāma-dāna-loka-nistaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMais tarde, o Senhor Supremo viajou aos locais sagrados de peregrinação no sul da Índia com a brilhante intenção de libertar as almas caídas. Aparecendo como um belo jovem renunciante, Ele distribuiu os doces Nomes do Senhor, cantando: “Kṛṣṇa Kṛṣṇa Kṛṣṇa Kṛṣṇa Kṛṣṇa Kṛṣṇa Kṛṣṇa he”, andando por diferentes caminhos, Ele entrou em templos e visitou residências durante a sagrada peregrinação. Infundido de um inconcebível tipo de inspiração divina, o Senhor cantou livremente: “Rāma Rāma” e dançou com júbilo exprimindo os gestos mais encantadores. Independente do tempo ou da qualificação pessoal, Ele liberou todos os espectadores juntos, e os inspirou a cantar os Santos Nomes de Kṛṣṇa. Eu ofereço minha reverência a Gaurasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"23\"\u003e\n\u003ch5\u003e23\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egodavarya-vāma-tīra-rāmānanda-saṁvadaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejñāna-karma-mukta-marma-rāga-bhakti-sampadam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epārakīya-kānta-kṛṣṇa-bhāva-sevanākaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eA famosa conversa do Senhor Gaurasundar com Rāmānanda Rāy às margens do Rio Godāvarī, transcrita no \u003ci\u003eŚrī Chaitanya-charitāmṛta\u003c/i\u003e é conhecida como Rāmānanda-saṁvād. Nessa discussão, a forma mais elevada de dedicação é o amor puro por Deus em um coração livre de aspirações fruitivas e de cálculos escriturais. Também, o Senhor Kṛṣṇa, que apareceu como o filho de Nanda Mahārāj, foi definido como o único recipiente da doçura que é saboreada nos humores de parakīya-rasa. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"24\"\u003e\n\u003ch5\u003e24\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edāsya-sakhya-vātsya-kānta-sevanottarottaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśreṣṭha-pārakīya-radhikāṅghri-bhakti-sundaram\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-vraja-svasiddha-divya-kāma-kṛṣṇa-tatparaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Senhor Chaitanya mostrou que há vários relacionamentos que existem em conexão com o Senhor Kṛṣṇa. Esses relacionamentos começam com servidão, e progridem para amizade e amor paternal, estendendo-se até o relacionamento conjugal. Mas a epítome do encanto e da beleza é reservada ao filho de Nanda Mahārāj nos bosques da floresta de Vṛndāvan. Trata-se do serviço a Śrīmatī Rādhārāṇī em amor conjugal conhecido como pārakīya. Śrī Gaurāṅgadev personificou esse tipo de aspiração divina. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṅgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"25\"\u003e\n\u003ch5\u003e25\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśānta-mukta-bhṛtya-tṛpta-mitra-matta-darśitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esnigdha-mugdha-śiṣṭa-miṣṭa-suṣṭha-kuṇṭha-harṣitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etantra-mukta-vāmya-rāga-sarva-sevanottaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Senhor Gaurāṅgadev explicou que um devoto na adoração passiva desfruta a felicidade de estar livre de todas as misérias materiais, e um devoto em servidão desfruta do prazer do contentamento. Um devoto em amizade fica dominado com a felicidade que surge do afeto íntimo, e um devoto no humor de parentesco está livre de todo traço de cálculo, experimentando o afeto profundo em alegria extática. O Senhor Chaitanya revelou mais ainda, que o devoto em amor conjugal conhecido como svakīya saboreia parcialmente a doçura desse humor, devido a uma gota de etiqueta escritural. Entretanto, quando o humor conjugal ultrapassa as restrições escriturais, então a espontaneidade e a liberdade, somadas ao humor de vāmya, a mais elevada expressão de prazer divino no serviço ao Senhor, são outorgadas. Śrī Gaurāṅgadev deu permissão a esses ideais elevados. Eu ofereço minha reverência a esse belo Senhor Dourado, Gaurāṇgasundar, a personificaçao de Kṛṣṇa-prema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"26\"\u003e\n\u003ch5\u003e26\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eātma-navya-tattva-divya-rāya-bhāgya-darśitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśyāma-gopa-rādhikāpta-kokta-gupta-cheṣṭitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emūrchchhitāṅghri-rāmarāya-bodhi
