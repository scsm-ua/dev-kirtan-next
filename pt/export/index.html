ion\"\u003eÓ Gopīnāth, eu caí nos perigos da ilusão. Riqueza, esposa, e crianças me cercaram, e a luxúria me dominou.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, mana ye pāgala mora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enā māne śāsana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadā achetana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;viṣaye rayechhe bhora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth \u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–minha \u003ci class=\"wbw__term\"\u003emana\u003c/i\u003e–mente \u003ci class=\"wbw__term\"\u003eye\u003c/i\u003e–que [é] \u003ci class=\"wbw__term\"\u003epāgala\u003c/i\u003e–louca [e] \u003ci class=\"wbw__term\"\u003emāne nā\u003c/i\u003e–não segue [nenhuma] \u003ci class=\"wbw__term\"\u003eśāsana\u003c/i\u003e–disciplina [ela está] \u003ci class=\"wbw__term\"\u003esadā\u003c/i\u003e–sempre \u003ci class=\"wbw__term\"\u003eachetana\u003c/i\u003e–fora dos sentidos [e] r \u003ci class=\"wbw__term\"\u003eayechhe\u003c/i\u003e–está \u003ci class=\"wbw__term\"\u003ebhora\u003c/i\u003e–absorvida \u003ci class=\"wbw__term\"\u003eviṣaye\u003c/i\u003e–no mundano.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, minha mente é louca e não se submete a nenhuma disciplina. Ela está sempre fora dos sentidos e absorta em mundanidade.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, hāra ye menechhi āmi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eaneka yatana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ha-ila viphala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ekhana bharasā tumi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth, \u003ci class=\"wbw__term\"\u003eāmi\u003c/i\u003e–eu \u003ci class=\"wbw__term\"\u003emenechhi\u003c/i\u003e–aceitei \u003ci class=\"wbw__term\"\u003ehāra\u003c/i\u003e–a derrota. \u003ci class=\"wbw__term\"\u003eye\u003c/i\u003e–Assim [meus] \u003ci class=\"wbw__term\"\u003eaneka\u003c/i\u003e–numerosos \u003ci class=\"wbw__term\"\u003eyatana\u003c/i\u003e–esforços \u003ci class=\"wbw__term\"\u003eha-ila\u003c/i\u003e–têm sido \u003ci class=\"wbw__term\"\u003eviphala\u003c/i\u003e–inúteis. \u003ci class=\"wbw__term\"\u003eekhana\u003c/i\u003e–Agora \u003ci class=\"wbw__term\"\u003etumi\u003c/i\u003e–Você [é minha] \u003ci class=\"wbw__term\"\u003ebharasā\u003c/i\u003e–esperança.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, eu aceitei a derrota. Todos os meus esforços têm sido inúteis. Agora, Você é minha esperança.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, kemane ha-ibe gati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprabala indriya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vaśī-bhūta mana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā chhāḍe viṣaya-rati\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth, \u003ci class=\"wbw__term\"\u003ekemane\u003c/i\u003e–como \u003ci class=\"wbw__term\"\u003eha-ibe\u003c/i\u003e–haverá \u003ci class=\"wbw__term\"\u003egati\u003c/i\u003e–progresso? [Minha] \u003ci class=\"wbw__term\"\u003emana\u003c/i\u003e–mente \u003ci class=\"wbw__term\"\u003evaśī-bhūta\u003c/i\u003e–controlada [pelos] \u003ci class=\"wbw__term\"\u003eprabala\u003c/i\u003e–poderosos \u003ci class=\"wbw__term\"\u003eindriya\u003c/i\u003e–sentidos \u003ci class=\"wbw__term\"\u003echhāḍe nā\u003c/i\u003e–não abandona [seu] \u003ci class=\"wbw__term\"\u003erati\u003c/i\u003e–apego \u003ci class=\"wbw__term\"\u003eviṣaya\u003c/i\u003e–ao mundano.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, como vou progredir? Minha mente, controlada pelos poderosos sentidos, não desiste de seu apego ao mundano.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, hṛdaye vasiyā mora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emanake śamiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;laha nija-pāne\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ghuchibe vipada ghora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth, [por favor] \u003ci class=\"wbw__term\"\u003evasiyā\u003c/i\u003e–sente-se [em] \u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–meu \u003ci class=\"wbw__term\"\u003ehṛdaye\u003c/i\u003e–coração, \u003ci class=\"wbw__term\"\u003eśamiyā\u003c/i\u003e–subjugue [minha] \u003ci class=\"wbw__term\"\u003emanake\u003c/i\u003e–mente [e] \u003ci class=\"wbw__term\"\u003elaha\u003c/i\u003e–leve-me \u003ci class=\"wbw__term\"\u003enija\u003c/i\u003e–em Sua \u003ci class=\"wbw__term\"\u003epāne\u003c/i\u003e–direção. \u003ci class=\"wbw__term\"\u003eghuchibe\u003c/i\u003e–Você precisa dissipar [todo] \u003ci class=\"wbw__term\"\u003evipada\u003c/i\u003e–perigo [e] \u003ci class=\"wbw__term\"\u003eghora\u003c/i\u003e–escuridão.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, por favor, sente-se em meu coração, subjugue minha mente, e me leve para Ti. Dissipe todo o perigo e escuridão.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, anātha dekhiyā more\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etumi hṛṣīkeśa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hṛṣīka damiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāra’ he saṁsṛti-ghore\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth, \u003ci class=\"wbw__term\"\u003etumi\u003c/i\u003e–Você [é] \u003ci class=\"wbw__term\"\u003ehṛṣīka-īśa\u003c/i\u003e–o Senhor dos sentidos. \u003ci class=\"wbw__term\"\u003edekhiyā\u003c/i\u003e–Vendo \u003ci class=\"wbw__term\"\u003emore\u003c/i\u003e–me \u003ci class=\"wbw__term\"\u003eanātha\u003c/i\u003e–desamparado \u003ci class=\"wbw__term\"\u003edamiyā\u003c/i\u003e–subjugue [meus] \u003ci class=\"wbw__term\"\u003ehṛṣīka\u003c/i\u003e–sentidos [e] \u003ci class=\"wbw__term\"\u003ehe\u003c/i\u003e–oh! \u003ci class=\"wbw__term\"\u003etāra’\u003c/i\u003e–liberte [me] \u003ci class=\"wbw__term\"\u003eghore\u003c/i\u003e–da escuridão \u003ci class=\"wbw__term\"\u003esaṁsṛti\u003c/i\u003e–do mundo material.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, Você é o Senhor dos sentidos. Vendo me desamparado, subjugue meus sentidos e me liberte da escuridão do saṁsāra.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāth, galāya legechhe phā̐sa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛpā-asi dhari’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bandhana chhediyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vinode karaha dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egopīnāth\u003c/i\u003e–Ó Gopīnāth, \u003ci class=\"wbw__term\"\u003ephā̐sa\u003c/i\u003e–um nó \u003ci class=\"wbw__term\"\u003elegechhe\u003c/i\u003e–foi colocado \u003ci class=\"wbw__term\"\u003egalāya\u003c/i\u003e–em volta [do meu] pescoço \u003ci class=\"wbw__term\"\u003edhari’\u003c/i\u003e–tomando \u003ci class=\"wbw__term\"\u003easi\u003c/i\u003e–a espada \u003ci class=\"wbw__term\"\u003ekṛpā\u003c/i\u003e–de [Sua] misericórdia [por favor] \u003ci class=\"wbw__term\"\u003echhediyā\u003c/i\u003e–corte [minha] \u003ci class=\"wbw__term\"\u003ebandhana\u003c/i\u003e–escravidão [e] \u003ci class=\"wbw__term\"\u003ekaraha\u003c/i\u003e–faça \u003ci class=\"wbw__term\"\u003evinode\u003c/i\u003e–Bhakti Vinod [seu] \u003ci class=\"wbw__term\"\u003edāsa\u003c/i\u003e–servo.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Gopīnāth, um nó foi colocado em meu pescoço. Tomando a espada de Sua misericórdia, por favor corte minha escravidão e faça Bhakti Vinod Seu servo.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(he govinda! gopīnātha!)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(ei bār āmāy dayā kara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;he govinda! gopīnātha!)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(bahu janme aparādhī\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;he govinda! gopīnātha!)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(lakṣa lakṣa janam gela\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;he govinda! gopīnātha!)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(śrī charaṇe śaraṇ nilām\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;he govinda! gopīnātha!)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(śrī charaṇe sevā diyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;he govinda! gopīnātha!)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Govinda! Ó Gopīnāth! Neste momento seja misericordioso. Tenho sido um ofensor por muitos nascimentos. Milhões de nascimentos se passaram. Me dê a sombra de Seus pés. Eu me rendi aos Seus pés. Me dê o serviço de Seus pés. Ó Govinda! Ó Gopīnāth!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hari-he-dayala-mora-jaya-radha-natha\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eDainya O Prapatti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari he dayāla mora jaya rādhā-nātha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebāra bāra ei-bāra laha nija sātha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ misericordioso Senhor! Toda glória a Você, o Senhor de Rādhā! De novo e de novo eu oro a Você. Neste momento considere-me Seu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebahu yoni bhrami’ nātha! la-inu śaraṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enija-guṇe kṛpā kara adhama tāraṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Senhor! Depois de vagar por tantos ventres, eu tomei o Seu abrigo. Seja misericordioso e liberte esta alma caída através de Seu poder divino.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejagata-kāraṇa tumi jagata-jīvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etoma chhāḍā kāro na’hi he rādhā-ramaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVocê é a causa e a vida do mundo. Sem Você, ninguém tem nada, Ó amante de Rādhā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhuvana-maṅgala tumi bhuvanera pati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etumi upekṣile nātha! ki ha-ibe gati\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVocê é a auspiciosidade e o mestre do universo. Ó Senhor! Se Você me negligenciar, qual será meu destino?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhāviyā dekhinu ei jagata mājhāre\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomā vinā keha nāhi e dāse uddhāre\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu compreendi que neste mundo não há ninguém a não ser Você para libertar este servo.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-manasa-deho-geho-jo-kichu-mora\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eMānasa Deho Geho \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emānasa, deha, geha, yo kichhu mora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003earpilu̐ tuyā pade nanda-kiśora!\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003earpilu̐ (arpaṇa karilāma)\u003c/i\u003e–Eu ofereci \u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–minha \u003ci class=\"wbw__term\"\u003emānasa (mana)\u003c/i\u003e–mente, [meu] \u003ci class=\"wbw__term\"\u003edeha\u003c/i\u003e–corpo, [minha] \u003ci class=\"wbw__term\"\u003egeha (gṛha)\u003c/i\u003e–casa, \u003ci class=\"wbw__term\"\u003ekichhu\u003c/i\u003e–qualquer coisa [mais] \u003ci class=\"wbw__term\"\u003eyo\u003c/i\u003e–que [seja minha] [aos] \u003ci class=\"wbw__term\"\u003etuyā (tomāra)\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003epade\u003c/i\u003e–pés [ó] \u003ci class=\"wbw__term\"\u003ekiśora\u003c/i\u003e–filho adolescente \u003ci class=\"wbw__term\"\u003enanda\u003c/i\u003e–de Nanda Mahārāj.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMente, corpo, casa e tudo o mais que seja meu, eu ofereci a Seus pés, ó filho de Nanda!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esampade vipade jīvane-maraṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edāy mama gelā tuyā o-pada varaṇe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003esampade\u003c/i\u003e–Na felicidade, boa fortuna, afluência, saúde \u003ci class=\"wbw__term\"\u003evipade\u003c/i\u003e–na tristeza, perigo, pobreza, doença, má fortuna \u003ci class=\"wbw__term\"\u003ejīvane\u003c/i\u003e–na vida \u003ci class=\"wbw__term\"\u003emaraṇe\u003c/i\u003e–na morte [toda] \u003ci class=\"wbw__term\"\u003emama\u003c/i\u003e–minha \u003ci class=\"wbw__term\"\u003edāya (dāyitva)\u003c/i\u003e–responsabilidade, ansiedade [se] \u003ci class=\"wbw__term\"\u003egelā\u003c/i\u003e–foi \u003ci class=\"wbw__term\"\u003evaraṇe\u003c/i\u003e–ao abraçar \u003ci class=\"wbw__term\"\u003eo\u003c/i\u003e–aqueles \u003ci class=\"wbw__term\"\u003etuyā\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003epada\u003c/i\u003e–pés.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNa boa e na má fortuna, na vida e na morte, toda as minhas obrigações se foram ao abraçar Seus pés.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emārabi rākhabi—yo ichhā tohārā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enitya-dāsa prati tuyā adhikāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003emārabi (māribe)\u003c/i\u003e–Você pode [me] matar \u003ci class=\"wbw__term\"\u003erākhabi\u003c/i\u003e–Você pode [me] proteger [o] \u003ci class=\"wbw__term\"\u003eyo (ye)\u003c/i\u003e–que [for] \u003ci class=\"wbw__term\"\u003etohārā\u003c/i\u003e–Seu \u003ci class=\"wbw__term\"\u003eichchha\u003c/i\u003e–desejo. \u003ci class=\"wbw__term\"\u003etuyā\u003c/i\u003e–Sua \u003ci class=\"wbw__term\"\u003eadhikāra\u003c/i\u003e–autoridade [é total] \u003ci class=\"wbw__term\"\u003eprati\u003c/i\u003e–por meio [deste] \u003ci class=\"wbw__term\"\u003edāse\u003c/i\u003e–Seu servo \u003ci class=\"wbw__term\"\u003enitya\u003c/i\u003e–eterno.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMate-me ou me proteja como Você desejar. Você tem total autoridade sobre o Seu servo eterno.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejanmāobi maye ichhā yadi tora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakta-gṛhe jani janma ha-u mora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eyadi\u003c/i\u003e–Se [for] \u003ci class=\"wbw__term\"\u003etora\u003c/i\u003e–Seu \u003ci class=\"wbw__term\"\u003eichchhā\u003c/i\u003e–desejo \u003ci class=\"wbw__term\"\u003ejanmāobi\u003c/i\u003e–Você pode causar o nascimento \u003ci class=\"wbw__term\"\u003emoye\u003c/i\u003e–meu \u003ci class=\"wbw__term\"\u003ejani (yena)\u003c/i\u003e–para que \u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–meu \u003ci class=\"wbw__term\"\u003ejanma\u003c/i\u003e–nascimento \u003ci class=\"wbw__term\"\u003eha-u (ha-uka)\u003c/i\u003e–possa ser \u003ci class=\"wbw__term\"\u003egṛhe\u003c/i\u003e–na casa \u003ci class=\"wbw__term\"\u003ebhakta\u003c/i\u003e–[de um] devoto.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSe você deseja que eu nasça de novo, que seja na casa do Seu devoto.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekīṭa-janma ha-u yathā tuyā dāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebahir-mukha brahma-janme nāhi āśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ejanma\u003c/i\u003e–[Que meu] nascimento \u003ci class=\"wbw__term\"\u003eha-u\u003c/i\u003e–possa ser [como o de um] \u003ci class=\"wbw__term\"\u003ekīṭa\u003c/i\u003e–verme, inseto \u003ci class=\"wbw__term\"\u003eyathā\u003c/i\u003e–contanto [eu permaneça] \u003ci class=\"wbw__term\"\u003etuyā\u003c/i\u003e–Seu \u003ci class=\"wbw__term\"\u003edāsa\u003c/i\u003e–servo. \u003ci class=\"wbw__term\"\u003enāhi\u003c/i\u003e–Não \u003ci class=\"wbw__term\"\u003eāśa\u003c/i\u003e–desejo \u003ci class=\"wbw__term\"\u003ebrahma\u003c/i\u003e–como Brahmā, o criador universal \u003ci class=\"wbw__term\"\u003ejanme\u003c/i\u003e–tal nascimento [se eu for] \u003ci class=\"wbw__term\"\u003ebahir mukha\u003c/i\u003e–avesso [a Ti].\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDeixe-me nascer de novo mesmo que seja como um verme, desde que eu possa permanecer Seu servo. Eu não tenho nenhum desejo de nascer mesmo como Brahmā se eu for avesso a Ti.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhukti-mukti-spṛhā vihīna ye bhakta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elabha-ite tā̐ka saṅga anurakta\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Desejo] \u003ci class=\"wbw__term\"\u003elabha-ite (lābha karite)\u003c/i\u003e–alcançar [a] \u003ci class=\"wbw__term\"\u003esaṅga\u003c/i\u003e–associação \u003ci class=\"wbw__term\"\u003etā̐’ka (tā̐dera)\u003c/i\u003e–deles [que têm] \u003ci class=\"wbw__term\"\u003eanurakta (anurāga)\u003c/i\u003e–apego amoroso. \u003ci class=\"wbw__term\"\u003ebhakta\u003c/i\u003e–Devotos \u003ci class=\"wbw__term\"\u003eye\u003c/i\u003e–os quais [são] \u003ci class=\"wbw__term\"\u003evihīna\u003c/i\u003e–desprovidos [de] \u003ci class=\"wbw__term\"\u003espṛhā\u003c/i\u003e–desejo [por] \u003ci class=\"wbw__term\"\u003ebhukti\u003c/i\u003e–desfrute mundano, exploração [e] \u003ci class=\"wbw__term\"\u003emukti\u003c/i\u003e–liberação, renúncia.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDesejo alcançar a associação de devotos que estão completamente livres de todo o desejo de desfrute egoísta e de liberação.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejanaka, jananī, dayita, tanaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprabhu, guru, pati—tuhu̐ sarva-maya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ejanaka\u003c/i\u003e–Pai, \u003ci class=\"wbw__term\"\u003ejananī\u003c/i\u003e–mãe, \u003ci class=\"wbw__term\"\u003edayita (priya)\u003c/i\u003e–amado, \u003ci class=\"wbw__term\"\u003etanaya\u003c/i\u003e–filho, \u003ci class=\"wbw__term\"\u003eprabhu\u003c/i\u003e–Senhor, \u003ci class=\"wbw__term\"\u003eguru\u003c/i\u003e–mestre espiritual, [e] \u003ci class=\"wbw__term\"\u003epati\u003c/i\u003e–marido. \u003ci class=\"wbw__term\"\u003etuhu̐\u003c/i\u003e–Você \u003ci class=\"wbw__term\"\u003emaya\u003c/i\u003e–consiste de \u003ci class=\"wbw__term\"\u003esarva\u003c/i\u003e–tudo [isso para mim].\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePai, mãe, amante, filho, Senhor, Guru e marido—Você é tudo isso para mim.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakati-vinoda kahe, śuna kāna!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhā-nātha! tuhu̐ hāmāra parāṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ebhakati-vinoda\u003c/i\u003e–Bhakti Vinod \u003ci class=\"wbw__term\"\u003ekahe\u003c/i\u003e–diz: \u003ci class=\"wbw__term\"\u003eśuna\u003c/i\u003e–por favor escute \u003ci class=\"wbw__term\"\u003ekāna!(kānāi!)\u003c/i\u003e–Ó Kṛṣṇa! \u003ci class=\"wbw__term\"\u003erādhānātha!\u003c/i\u003e–Ó Senhor de Rādhā! \u003ci class=\"wbw__term\"\u003etuhu̐\u003c/i\u003e–Você [é] \u003ci class=\"wbw__term\"\u003ehāmāra\u003c/i\u003e–minha \u003ci class=\"wbw__term\"\u003eparāṇa\u003c/i\u003e–vida, alma (o único foco de meu apego amoroso).\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBhakti Vinod diz: “Por favor, ouça, Ó Kān! Ó Rādhānāth! Você é a minha vida e alma.”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-bhajahu-re-mana-shri-nanda-nandana\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eBhajahu̐ Re Mana \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Govinda Dās Kavirāj\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhajahu̐ re mana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-nanda-nandana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;abhaya-charaṇāravinda re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edurlabha mānava\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;janama sat-saṅge\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;taraha e bhava-sindhu re\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ mente, sirva o filho dos pés de lótus de Nanda, que nos faz destemidos. Tendo atingido esse raro nascimento humano, atravesse o oceano da existência material associando-se com sādhus.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśīta ātapa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vāta variṣaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;e dina yāminī jāgi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eviphale sevinu\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛpaṇa durajana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chapala sukha-lava lāgi’ re\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDia e noite permaneço acordado, sofrendo com o calor e o frio, o vento e a chuva. Em troca de breves momentos de felicidade eu tenho inutilmente servido homens maus e miseráveis.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ee dhana, yauvana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;putra, parijana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ithe ki āchhe paratīti re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekamala-dala-jala\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jīvana ṭalamala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(ei āchhe ei nāi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jīvana ṭalamala)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhajahu̐ hari-pada niti re\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO que há em se ter riqueza, juventude, filhos e família? A vida está escorrendo como a água em uma pétala de lótus (agora aqui, daqui a pouco se foi). Ó mente, sirva os pés do Senhor.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśravaṇa, kīrtana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;smaraṇa, vandana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pāda-sevana, dāsya re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epūjana, sakhī-jana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ātma-nivedana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;govinda-dāsa-abhilāṣa re\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGovinda Dās deseja engajar-se nas nove práticas de devoção: ouvir, glorificar, lembrar, orar, atender, servir, adorar, servir como amigo, e entregar-se ao Senhor.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-radha-madhava-kunja-bihari\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eJaya Rādhā-Mādhava \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(jaya) rādhā-mādhava\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(jaya) kuñja-vihārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(jaya) gopī-jana-vallabha\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(jaya) giri-vara-dhārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(jaya) yaśodā-nandana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(jaya) vraja-jana-rañjana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(jaya) yāmuna-tīra-vana-chārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória a Mādhava de Śrī Rādhā, que se diverte nos bosques de Vraja! Toda glória ao amado das gopīs, aquele que ergueu a Colina de Govardhan! Toda glória ao filho querido de Yaśodā, o prazer dos moradores de Vraja! Toda glória a Ele, que brinca nas florestas ao longo das margens do Yamunā!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-yashoda-nandana-krishna-gopala-govinda\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eJaya Yaśodā-Nandana Kṛṣṇa \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(jaya) yaśodā-nandana kṛṣṇa gopāla govinda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(jaya) madana-mohana hari ananta mukunda\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória ao querido filho de Yaśodā, Kṛṣṇa, que protege e satisfaz as vacas! Toda glória ao encantador do Cupido, o Senhor infinito, que tira toda a inauspiciosidade e concede a liberação!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(jaya) achyuta mādhava rāma vṛndāvana-chandra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(jaya) muralī-vadana śyāma gopī-janānanda\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória ao Senhor infalível, a lua de Vṛndāvan, que satisfaz Śrī Rādhā! Toda glória ao negro Flautista, o êxtase das gopīs!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-mayura-mukuta-pitambara-dhari\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eMayūra Mukuṭa \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emayūra-mukuṭa-pītāmbara-dhārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emuralī-dhara govardhana-dhārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória ao flautista, o levantador da Colina de Govardhan, Ele que usa uma coroa de pena de pavão e roupas amarelas!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-rādhā-mādhava kuñja-vihārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emuralī-dhara govardhana-dhārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória ao flautista, o levantador da Colina de Govardhan, o amado Mādhava de Rādhā, Ele que desfruta nos bosques da floresta!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(jaya) yaśodā-nandana kṛṣṇa murāri\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emuralī-dhara govardhana-dhārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória ao flautista, o levantador da Colina de Govardhan, Kṛṣṇa, Murāri, o filho querido de Yaśodā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(jaya) gopī-jana-vallabha vaṁśī-vihārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emuralī-dhara govardhana-dhārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória ao flautista, o levantador da Colina de Govardhan, o amado das gopīs, Ele que toca a flauta vaṁśī!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-he-deva-bhavantam-vande\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eHe deva bhavantaṁ vande \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Rūpa Goswāmī Prabhu\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehe deva bhavantaṁ vande\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eman-mānasa-madhukaram arpaya nija-pada-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epaṅkaja-makarande\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Senhor, eu ofereço minha reverência a Você. Por favor, coloque a abelha do meu coração no mel de Seus pés de lótus.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyadapi samādhiṣu vidhir api paśyati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ena tava nakhā gramarīchim\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eidam ichāmi niśamya tavāchyuta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etad api kṛpādbhuta vīchim\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Achyuta! Mesmo Brahmā, em samādhi, não pode ver o brilho das pontas das unhas de Seus pés, mas eu ouvi falar das ondas da Sua maravilhosa misericórdia, e eu desejo vê-las.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhaktir udañchati yad api mādhava\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ena tvayi mama tila-mātrī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eparameśvaratā tad api tavādhika-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edurghaṭa-ghaṭana-vidhātrī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Mādhava! Embora eu não tenha sequer uma semente de gergelim de devoção a Você, seu poder supremo é o criador dos mais improváveis milagres.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eayam avilolatayādya sanātana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekalitādbhuta-rasa-bhāram\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enivasatu nityam ihāmṛta-nindini\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evindan madhurima-sāram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Senhor eterno, que a abelha do meu coração viva estável e eternamente em Seus pés de lótus, onde há abundância do mais maravilhoso mel—que ultrapassa o néctar da imortalidade—e assim atinja a doçura final.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-janama-saphala-tara-krishna-darashiana-jara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eRūpa-Kīrtan \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejanama saphala tā’ra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛṣṇa-daraśana yā’ra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhāgye ha-iyāchhe eka-bāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evikaśiyā hṛn-nayana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kari’ kṛṣṇa daraśana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chhāḍe jīva chitera vikāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO nascimento daquele que pela boa fortuna, uma vez tenha visto Kṛṣṇa, é bem-sucedido. Ao desenvolver os olhos do coração e ver Kṛṣṇa, tal alma abandona todas as ilusões.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vṛndāvana-keli chatur vanamālī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etribhaṅga-bhaṅgimā-rūpa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vaṁśī-dhārī aparūpa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rasamaya nidhi, guṇa-śālī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKṛṣṇa é expert nas brincadeiras de Vṛndāvan. Ele veste uma guirlanda de flores silvestres, posa flexionado em três partes, e toca flauta perfeitamente. Ele é um reservatório de rasa e possui todas as qualidades.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evarṇa nava jaladhara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śire śikhi-pichchha-vara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;alakā tilaka śobhā pāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eparidhāne pīta-vāsa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vadane madhura hāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hena rūpa jagat mātāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSua tez é da cor de uma nuvem de chuva fresca. Sua testa é adornada com tilak, cabelos cacheados, e uma linda pena de pavão. Ele veste roupas amarelas e tem um doce sorriso em Seu rosto. Sua forma encanta o mundo.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eindra-nīla jini\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛṣṇa-rūpa-khāni\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;heriyā kadamba-mūle\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emana uchāṭana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā chale charaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;saṁsāra gelāma bhule\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eContemplando a forma de Kṛṣṇa, que supera a beleza de uma safira, embaixo de uma kadamba, meu coração se desnorteou. Meus pés não puderam se mover. Eu esqueci o mundo.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(sakhī he) sudhāmaya se rūpa mādhurī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edekhile nayana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;haya achetana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jhare premamaya vāri\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ amigo! Quando vi a beleza da forma nectárea de Kṛṣṇa, desmaiei e derramei lágrimas de amor divino.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekibā chūḍā śire\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kibā vaṁśī kare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kibā se tribhaṅga ṭhāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echaraṇa-kamale\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;amiyā uchhale\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāhāte nūpura dāma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQue coroa em sua cabeça! Que flauta em Sua mão! Que postura trina! Néctar surgiu de Seus pés de lótus que estavam adornados com tornozeleiras tilintantes.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esadā āśā kari\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhṛṅga-rūpa dhari\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;charaṇa-kamale sthāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eanāyāse pāi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛṣṇa-guṇa gāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āra nā bhajiba āna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEternamente, eu desejo tomar a forma de uma abelha, facilmente alcançar um lugar aos pés de lótus de Kṛṣṇa e cantar Suas glórias. Eu nunca vou servir nenhuma outra pessoa.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-jaya-radha-krishna-jugala-milan\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Vraja-dhāma-mahimāmṛta \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Kṛṣṇadās Kavirāj Goswāmī\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya rādhe, jaya kṛṣṇa, jaya vṛndāvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-govinda, gopīnātha, madana-mohana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória a Rādhā, Kṛṣṇa, e Vṛndāvan! Toda glória a Śrī Govinda, Gopīnāth, e Madan Mohan!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśyāma-kuṇḍa, rādhā-kuṇḍa, giri-govardhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekālindī yamunā jaya, jaya mahāvana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória ao Śyām Kuṇḍa, Rādhā Kuṇḍa, à Colina de Govardhan, ao Rio Yamunā, e a Mahāvan!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekeśī-ghāṭa, vaṁśī-vaṭa, dvādaśa-kānana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyā̐hā saba līlā kaila śrī-nanda-nandana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória ao Keśī Ghāṭ, ao Vaṁśī Vaṭ, e às doze florestas de Vraja! O filho de Nanda realizou Seus Passatempos em todos esses lugares.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-nanda-yaśodā jaya, jaya gopa-gaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrīdāmādi jaya, jaya dhenu-vatsa-gaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória a Śrī Nanda e Yaśodā! Toda glória a Śrīdām e a todos os vaqueirinhos! Toda glória às vacas e bezerros de Vraja!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya vṛṣabhānu, jaya kīrtidā sundarī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaya paurṇamāsī, jaya ābhīra-nāgarī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória a Vṛṣabhānu e à bela Kīrtidā! Toda glória a Paurṇamāsī! Toda glória às vaqueirinhas de Vraja!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya jaya gopeśvara vṛndāvana-mājha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaya jaya kṛṣṇa-sakhā baṭu dvija-rāja\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória a Gopeśvar Śiva em Vṛndāvan! Toda glória ao engraçado amigo brāhmaṇ de Kṛṣṇa, Madhumaṅgal!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya rāma-ghāṭa, jaya rohiṇī-nandana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaya jaya vṛndāvana-vāsī yata jana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória ao Rām Ghāṭ! Toda glória ao filho de Rohiṇī, Balarām! Toda glória a todos os residentes de Vṛndāvan!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya dvija-patnī, jaya nāga-kanyā-gaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhaktite yā̐hārā pāila govinda-charaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória às esposas dos brāhmaṇs e às esposas de Kālīya! Através de sua devoção, elas alcançaram os pés de Govinda.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-rāsa-maṇḍala jaya, jaya rādhā-śyāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaya jaya rāsa-līlā sarva-manorama\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória ao local da Dança Rāsa! Toda glória a Rādhā e Śyām! Toda a glória à Dança Rāsa, que captura os corações de todos!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya jayojjvala-rasa sarva-rasa-sāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eparakīyā-bhāve yāhā vrajete prachāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda glória ao madhura-rasa, o melhor de todos os rasas, que se manifesta em Vraja como o amor de amante!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-jāhnavā-pāda-padma kariyā smaraṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edīna kṛṣṇa-dāsa kahe nāma-saṅkīrtana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSe lembrando dos pés de lótus de Śrī Jāhnavā Devī, o humilde Kṛṣṇa Dās canta o Santo Nome.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eOrações\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-amara-jivana-sada-pape-rata\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eĀmāra jīvana \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eāmāra jīvana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadā pāpe rata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāhika puṇyera leśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eparere udvega\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;diyāchhi ye kata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;diyāchhi jīvere kleśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eāmāra\u003c/i\u003e–Minha \u003ci class=\"wbw__term\"\u003ejīvana\u003c/i\u003e–vida \u003ci class=\"wbw__term\"\u003esadā\u003c/i\u003e–[é] sempre \u003ci class=\"wbw__term\"\u003erata\u003c/i\u003e–engajada \u003ci class=\"wbw__term\"\u003epāpe\u003c/i\u003e–em pecado. \u003ci class=\"wbw__term\"\u003enāhika\u003c/i\u003e–Não há \u003ci class=\"wbw__term\"\u003eleśa\u003c/i\u003e–um traço \u003ci class=\"wbw__term\"\u003epuṇyera\u003c/i\u003e–de piedade [nela]. \u003ci class=\"wbw__term\"\u003eye\u003c/i\u003e–[Com] a qual \u003ci class=\"wbw__term\"\u003ediyāchhi\u003c/i\u003e–eu tenho causado \u003ci class=\"wbw__term\"\u003ekata\u003c/i\u003e–tanta \u003ci class=\"wbw__term\"\u003eudvega\u003c/i\u003e–agitação \u003ci class=\"wbw__term\"\u003eparere\u003c/i\u003e–aos outros \u003ci class=\"wbw__term\"\u003ediyāchhi\u003c/i\u003e–eu tenho dado \u003ci class=\"wbw__term\"\u003ekleśa\u003c/i\u003e–aflições \u003ci class=\"wbw__term\"\u003ejīvere\u003c/i\u003e–a outras almas.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMinha vida é sempre envolvida em pecado. Não há nem um traço de piedade nela. Eu tenho causado aos outros tanta ansiedade e problema.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enija sukha lāgi’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pāpe nāhi ḍari\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dayā-hīna svārtha-para\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epara-sukhe duḥkhī\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadā mithya-bhāṣī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;para-duḥkha sukha-kara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003elāgi’\u003c/i\u003e–Em prol [de] \u003ci class=\"wbw__term\"\u003enija\u003c/i\u003e–minha própria \u003ci class=\"wbw__term\"\u003esukha\u003c/i\u003e–felicidade \u003ci class=\"wbw__term\"\u003enāhi\u003c/i\u003e–não \u003ci class=\"wbw__term\"\u003eḍari\u003c/i\u003e–temo [me envolver] \u003ci class=\"wbw__term\"\u003epāpe\u003c/i\u003e–em pecado. [Eu sou] \u003ci class=\"wbw__term\"\u003ehīna\u003c/i\u003e–desprovido de \u003ci class=\"wbw__term\"\u003edayā\u003c/i\u003e–misericórdia \u003ci class=\"wbw__term\"\u003epara\u003c/i\u003e–com a intenção de \u003ci class=\"wbw__term\"\u003esvārtha\u003c/i\u003e–autointeresse. \u003ci class=\"wbw__term\"\u003ebhāṣī\u003c/i\u003e–Falando \u003ci class=\"wbw__term\"\u003esadā\u003c/i\u003e–sempre \u003ci class=\"wbw__term\"\u003emithyā\u003c/i\u003e–mentiras [fico] \u003ci class=\"wbw__term\"\u003eduḥkhī\u003c/i\u003e–entristecido \u003ci class=\"wbw__term\"\u003esukhe\u003c/i\u003e–pela felicidade \u003ci class=\"wbw__term\"\u003epara\u003c/i\u003e–dos outros [e a] \u003ci class=\"wbw__term\"\u003eduḥkha\u003c/i\u003e–tristeza \u003ci class=\"wbw__term\"\u003epara\u003c/i\u003e–dos outros \u003ci class=\"wbw__term\"\u003ekara\u003c/i\u003e–produz \u003ci class=\"wbw__term\"\u003esukha\u003c/i\u003e–felicidade [em mim].\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEm prol de minha própria felicidade, nunca tenho medo de me envolver em atividades pecaminosas. Eu sou impiedoso e egoísta. Eu sou um perpétuo mentiroso. Me entristeço diante da felicidade dos outros e fico satisfeito com a tristeza dos outros.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eaśeṣa kāmanā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hṛdi mājhe mora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;krodhī, dambha-parāyaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emada-matta sadā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;viṣaye mohita\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hiṁsā-garva vibhūṣana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Há] \u003ci class=\"wbw__term\"\u003eaśeṣa\u003c/i\u003e–ilimitados \u003ci class=\"wbw__term\"\u003ekāmanā\u003c/i\u003e–desejos pecaminosos \u003ci class=\"wbw__term\"\u003emājhe\u003c/i\u003e–no interior [do] \u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–meu \u003ci class=\"wbw__term\"\u003ehṛdi\u003c/i\u003e–coração. [Sou] \u003ci class=\"wbw__term\"\u003ekrodhī\u003c/i\u003e–irado [e] \u003ci class=\"wbw__term\"\u003eparāyaṇa\u003c/i\u003e–cheio de \u003ci class=\"wbw__term\"\u003edambha\u003c/i\u003e–arrogância, \u003ci class=\"wbw__term\"\u003esadā\u003c/i\u003e–sempre \u003ci class=\"wbw__term\"\u003ematta\u003c/i\u003e–intoxicado [pela] \u003ci class=\"wbw__term\"\u003emada\u003c/i\u003e–vaidade, \u003ci class=\"wbw__term\"\u003emohita\u003c/i\u003e–apaixonado \u003ci class=\"wbw__term\"\u003eviṣaye\u003c/i\u003e–pela mundanidade, [e] \u003ci class=\"wbw__term\"\u003evibhūṣaṇa\u003c/i\u003e–ornamentado [de] \u003ci class=\"wbw__term\"\u003ehiṁsā\u003c/i\u003e–malícia, inveja, violência [e] \u003ci class=\"wbw__term\"\u003egarva\u003c/i\u003e–orgulho, egoísmo.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHá ilimitados desejos pecaminosos dentro do meu coração. Sou irado e arrogante, sempre enlouquecido pela vaidade, apaixonado pela mundanidade e ornamentado de malícia e orgulho.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enidrālasya hata\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sukārye virata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;akārye udyogī āmi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epratiṣṭhā lāgiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śāṭhya-ācharaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;lobha-hata sadā kāmī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Sou] \u003ci class=\"wbw__term\"\u003ehata\u003c/i\u003e–subjugado \u003ci class=\"wbw__term\"\u003enidrā\u003c/i\u003e–pelo sono [e pela] \u003ci class=\"wbw__term\"\u003ealasya\u003c/i\u003e–preguiça, \u003ci class=\"wbw__term\"\u003eāmi\u003c/i\u003e–eu [sou] \u003ci class=\"wbw__term\"\u003evirata\u003c/i\u003e–avesso \u003ci class=\"wbw__term\"\u003esukārye\u003c/i\u003e–a boas ações [e] \u003ci class=\"wbw__term\"\u003eudyogī\u003c/i\u003e–ansioso [por] \u003ci class=\"wbw__term\"\u003eakārye\u003c/i\u003e–atos pecaminosos. [Me envolvo em] \u003ci class=\"wbw__term\"\u003eācharaṇa\u003c/i\u003e–comportamento \u003ci class=\"wbw__term\"\u003eśāṭhya (vañchanā)\u003c/i\u003e–enganoso [quando em busca] \u003ci class=\"wbw__term\"\u003elāgiyā\u003c/i\u003e–de \u003ci class=\"wbw__term\"\u003epratiṣṭhā (sammāna)\u003c/i\u003e–fama (exaltação). [Estou] \u003ci class=\"wbw__term\"\u003ehata\u003c/i\u003e–atacado, destruído, conquistado \u003ci class=\"wbw__term\"\u003elobha\u003c/i\u003e–pela ganância [e] \u003ci class=\"wbw__term\"\u003esadā\u003c/i\u003e–sempre \u003ci class=\"wbw__term\"\u003ekāmī\u003c/i\u003e–cobiçoso.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSou subjugado pela preguiça e pelo sono, avesso a executar boas ações, e ansioso por executar atos pecaminosos. Eu me envolvo em comportamento enganoso quando em busca de prestígio. Estou arruinado pela ganância e constantemente cobiçoso.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ee hena durjana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sajjana-varjita\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;aparādhi nirantara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśubha-kārya-śūnya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadānartha-manāḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nānā duḥkhe jara jara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ee\u003c/i\u003e–Esta \u003ci class=\"wbw__term\"\u003edurjana\u003c/i\u003e–má pessoa \u003ci class=\"wbw__term\"\u003ehena\u003c/i\u003e–tal como [eu, é] v \u003ci class=\"wbw__term\"\u003earjita\u003c/i\u003e–rejeitada \u003ci class=\"wbw__term\"\u003esajjana\u003c/i\u003e–pelos devotos [e] \u003ci class=\"wbw__term\"\u003enirantara\u003c/i\u003e–incessantemente [considerada] \u003ci class=\"wbw__term\"\u003eaparādhī\u003c/i\u003e–um ofensor. [Sou] \u003ci class=\"wbw__term\"\u003eśūnya\u003c/i\u003e–desprovido de \u003ci class=\"wbw__term\"\u003ekārya\u003c/i\u003e–motivo \u003ci class=\"wbw__term\"\u003eśubha\u003c/i\u003e–virtuosos \u003ci class=\"wbw__term\"\u003esadā\u003c/i\u003e–sempre \u003ci class=\"wbw__term\"\u003emanā\u003c/i\u003e–disposto, inclinado [ao] \u003ci class=\"wbw__term\"\u003eanartha\u003c/i\u003e–mal [e sou] \u003ci class=\"wbw__term\"\u003ejara\u003c/i\u003e–desgastado \u003ci class=\"wbw__term\"\u003ejara\u003c/i\u003e–e despedaçado [por] \u003ci class=\"wbw__term\"\u003enānā\u003c/i\u003e–várias \u003ci class=\"wbw__term\"\u003eduḥkhe\u003c/i\u003e–misérias.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTal pecador como eu é evitado pelos devotos, e é um constante ofensor. Estou destituído de motivos virtuosos, sempre intenciono o mal, e sou atormentado por várias misérias.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evārdhakye ekhana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;upāya-vihīna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tā’te dīna akiñchana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakati-vinoda\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prabhura charaṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kare duḥkha nivedana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eekhana\u003c/i\u003e–Agora \u003ci class=\"wbw__term\"\u003evārdhakye\u003c/i\u003e–na velhice [estou] \u003ci class=\"wbw__term\"\u003evihīna\u003c/i\u003e–desprovido (de qualquer outro) \u003ci class=\"wbw__term\"\u003eupāya\u003c/i\u003e–meio [de liberação, e] \u003ci class=\"wbw__term\"\u003etā’te\u003c/i\u003e–assim [estou] \u003ci class=\"wbw__term\"\u003edīna\u003c/i\u003e–angustiado [e] \u003ci class=\"wbw__term\"\u003eakiñchana (saṅgati-śūnya)\u003c/i\u003e–pobre (sem meios). \u003ci class=\"wbw__term\"\u003ebhakati-vinoda\u003c/i\u003e–Bhakti Vinod \u003ci class=\"wbw__term\"\u003ekare\u003c/i\u003e–faz [esta] \u003ci class=\"wbw__term\"\u003enivedana\u003c/i\u003e–submissão [de] \u003ci class=\"wbw__term\"\u003eduḥkha\u003c/i\u003e–tristeza \u003ci class=\"wbw__term\"\u003echaraṇe\u003c/i\u003e–aos pés \u003ci class=\"wbw__term\"\u003eprabhura\u003c/i\u003e–do Senhor.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAgora envelhecido, estou desprovido de qualquer meio de liberação e assim estou destituído e angustiado. Bhakti Vinod submete essa confissão de arrependimento aos pés do Senhor.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hari-hari-biphole-janama-goyainu\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eIṣṭa-deve Vijñapti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Narottam Dās Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari hari!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;viphale janama goṅāinu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emanuṣya-janama pāiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rādhā-kṛṣṇa nā bhajiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jāniyā śuniyā viṣa khāinu\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Senhor! Minha vida passou inutilmente. Eu alcancei um nascimento humano, mas não servi Rādhā e Kṛṣṇa. Com conhecimento de causa, eu bebi veneno.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egolokera prema-dhana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hari-nāma-saṅkīrtana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rati nā janmila kena tāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaṁsāra-viṣānale\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;divā-niśi hiyā jvale\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;juḍāite nā kainu upāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePor que eu não desenvolvi apego ao Hari-nām-saṅkīrtan, nem pelo amor e riqueza divinos de Goloka? Meu coração queima dia e noite no fogo venenoso do saṁsāra, e mesmo assim não tenho procurado qualquer maneira de aliviá-lo.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evrajendra-nandana yei\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śachī-suta haila sei\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;balarāma ha-ila nitāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edīna-hīna yata chhila\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hari-nāme uddhārila\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāra śākṣī jagāi mādhāi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVrajendra Nandan se tornou Śachī Suta e Balarām se tornou Nitāi. Eles liberaram todas as almas caídas com o Santo Nome. Jagāi e Mādhāi são a evidência disso.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehā hā prabhu nanda-suta\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vṛṣabhānu-sutā-yuta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;karuṇā karaha ei-bāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enarottama-dāsa kaya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā ṭheliha rāṅgā pāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomā vine ke āchhe āmāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Rādhā! Ó Senhor Kṛṣṇa! Sejam misericordiosos comigo desta vez. Narottam Dās diz: “Por favor, não me afastem de Seu Pés avermelhados. Sem Vocês, a quem eu tenho?”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-ki-jani-ki-bale-tomara-dhamete\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eGoptṛtve Varaṇa \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eki jāni ki bale\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra dhāmete\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ha-inu śaraṇāgata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etumi dayāmaya\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;patita-pāvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;patita-tāraṇe rata\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eki jāni\u003c/i\u003e–Quem sabe, [por] \u003ci class=\"wbw__term\"\u003eki bale\u003c/i\u003e–qual força \u003ci class=\"wbw__term\"\u003eha-inu\u003c/i\u003e–eu me tornei \u003ci class=\"wbw__term\"\u003eśaraṇāgata\u003c/i\u003e–rendido [em] \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Sua \u003ci class=\"wbw__term\"\u003edhāmete\u003c/i\u003e–morada? \u003ci class=\"wbw__term\"\u003etumi\u003c/i\u003e–Você [é] \u003ci class=\"wbw__term\"\u003emaya\u003c/i\u003e–cheio de \u003ci class=\"wbw__term\"\u003edayā\u003c/i\u003e–misericórdia, [o] \u003ci class=\"wbw__term\"\u003epāvana\u003c/i\u003e–purificador [dos] \u003ci class=\"wbw__term\"\u003epatita\u003c/i\u003e–caídos [e é] \u003ci class=\"wbw__term\"\u003erata\u003c/i\u003e–sempre engajado \u003ci class=\"wbw__term\"\u003etāraṇe\u003c/i\u003e–em liberar \u003ci class=\"wbw__term\"\u003epatita\u003c/i\u003e–os caídos.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu não sei por qual força eu me refugiei em Sua morada. Certamente é somente pela Sua misericórdia, porque Você está sempre buscando a purificação e a liberação das almas caídas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebharasā āmāra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ei mātra nātha!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tumi ta’ karuṇā-maya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava dayā pātra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāhi mora sama\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;avaśya ghuchāre bhaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003enātha!\u003c/i\u003e–Ó Senhor! \u003ci class=\"wbw__term\"\u003etumi\u003c/i\u003e–Você [é] \u003ci class=\"wbw__term\"\u003eta’\u003c/i\u003e–certamente \u003ci class=\"wbw__term\"\u003emaya\u003c/i\u003e–cheio de \u003ci class=\"wbw__term\"\u003ekaruṇā\u003c/i\u003e–misericórdia. \u003ci class=\"wbw__term\"\u003eei\u003c/i\u003e–Esta [é] \u003ci class=\"wbw__term\"\u003eāmāra\u003c/i\u003e–minha \u003ci class=\"wbw__term\"\u003emātra\u003c/i\u003e–única \u003ci class=\"wbw__term\"\u003ebharasā\u003c/i\u003e–esperança \u003ci class=\"wbw__term\"\u003enāhi\u003c/i\u003e–Não há \u003ci class=\"wbw__term\"\u003epātra\u003c/i\u003e–recipiente [para] t \u003ci class=\"wbw__term\"\u003eava\u003c/i\u003e–Sua \u003ci class=\"wbw__term\"\u003edayā\u003c/i\u003e–misericórdia \u003ci class=\"wbw__term\"\u003esama\u003c/i\u003e–igual [a] \u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–mim. [Você] \u003ci class=\"wbw__term\"\u003eavaśya\u003c/i\u003e–certamente \u003ci class=\"wbw__term\"\u003eghuchābe\u003c/i\u003e–irá dissipar [todo o meu] \u003ci class=\"wbw__term\"\u003ebhaya\u003c/i\u003e–medo.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Senhor! Você é misericordioso. Esta é minha única esperança. Não há ninguém que necessite da Tua misericórdia mais do que eu. Certamente Você dispersará todo o meu medo.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eāmāre tārite\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kāhāra śakati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;avanī-bhitare nāhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edayāla ṭhākura!\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ghoṣaṇā tomāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;adhama pāmare trāhi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003enāhi\u003c/i\u003e–Não há \u003ci class=\"wbw__term\"\u003ebhitare\u003c/i\u003e–sobre [a] \u003ci class=\"wbw__term\"\u003eavanī\u003c/i\u003e–Terra [para] \u003ci class=\"wbw__term\"\u003eāmāre\u003c/i\u003e–me \u003ci class=\"wbw__term\"\u003etārite\u003c/i\u003e–liberar \u003ci class=\"wbw__term\"\u003ekāhāro\u003c/i\u003e–alguém [que tenha o Seu] \u003ci class=\"wbw__term\"\u003eśakati\u003c/i\u003e–poder. [Ó] \u003ci class=\"wbw__term\"\u003edayāla\u003c/i\u003e–misericordioso \u003ci class=\"wbw__term\"\u003eṭhākura\u003c/i\u003e–Senhor! \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Sua \u003ci class=\"wbw__term\"\u003eghoṣaṇā\u003c/i\u003e–declaração [é que] \u003ci class=\"wbw__term\"\u003etrāhi (trāṇa kara)\u003c/i\u003e–Você libera [os] \u003ci class=\"wbw__term\"\u003eadhama\u003c/i\u003e–baixos [e] \u003ci class=\"wbw__term\"\u003epāmare\u003c/i\u003e–pecadores.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNão há ninguém na Terra que tenha o poder de me livrar. Ó misericordioso Senhor! É Sua declaração que Você salva os mais baixos, as pessoas mais pecaminosas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esakala chhāḍiyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āsiyāchhi āmi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra charaṇe nātha!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāmi nitya-dāsa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tumi pālayitā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tumi goptā, jagannātha!\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003echhāḍiyā\u003c/i\u003e–Abandonando \u003ci class=\"wbw__term\"\u003esakala\u003c/i\u003e–tudo \u003ci class=\"wbw__term\"\u003eāmi\u003c/i\u003e–eu \u003ci class=\"wbw__term\"\u003easiyāchhi\u003c/i\u003e–vim [aos] \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003echaraṇe\u003c/i\u003e–pés, \u003ci class=\"wbw__term\"\u003enātha!\u003c/i\u003e–Ó Senhor! \u003ci class=\"wbw__term\"\u003eāmi\u003c/i\u003e–Eu [sou Seu] \u003ci class=\"wbw__term\"\u003enitya\u003c/i\u003e–eterno \u003ci class=\"wbw__term\"\u003edāsa\u003c/i\u003e–servo \u003ci class=\"wbw__term\"\u003etumi\u003c/i\u003e–Você [é meu] \u003ci class=\"wbw__term\"\u003epālayitā\u003c/i\u003e–mantenedor, \u003ci class=\"wbw__term\"\u003etumi\u003c/i\u003e–Você [é meu] \u003ci class=\"wbw__term\"\u003egoptā\u003c/i\u003e–protetor \u003ci class=\"wbw__term\"\u003ejagannātha!\u003c/i\u003e–Ó Senhor do universo!\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAbandonando tudo, eu vim a Seus pés, ó Senhor! Eu sou o Seu eterno servo, e Você é o meu mantenedor e protetor, ó Senhor do universo!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra sakala\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āmi mātra dāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āmāra tāribe tumi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomāra charaṇa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;karinu varaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āmāra nahi ta’ āmi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003esakala\u003c/i\u003e–Tudo [é] \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Seu. \u003ci class=\"wbw__term\"\u003eāmi\u003c/i\u003e–Eu [sou] \u003ci class=\"wbw__term\"\u003emātra\u003c/i\u003e–apenas \u003ci class=\"wbw__term\"\u003edāsa\u003c/i\u003e–um servo. \u003ci class=\"wbw__term\"\u003etumi\u003c/i\u003e–Você \u003ci class=\"wbw__term\"\u003etāribe\u003c/i\u003e–irá liberar \u003ci class=\"wbw__term\"\u003eāmāre\u003c/i\u003e–me. \u003ci class=\"wbw__term\"\u003ekarinu varaṇa\u003c/i\u003e–abracei (aceitei como meu suporte) \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003echaraṇa\u003c/i\u003e–pés. \u003ci class=\"wbw__term\"\u003eāmi\u003c/i\u003e–Eu \u003ci class=\"wbw__term\"\u003enāhi\u003c/i\u003e–não [sou] \u003ci class=\"wbw__term\"\u003eāmāra\u003c/i\u003e–meu \u003ci class=\"wbw__term\"\u003eta’\u003c/i\u003e–certamente.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTudo é Seu. Eu sou apenas um servo. Certamente Você vai me liberar. Abracei Seus pés e não pertenço mais a mim mesmo.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakati-vinoda\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kā̐diya śaraṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;la’yechhe tomāra pāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṣami’ aparādha\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāme ruchi diyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pālana karahe tāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekā̐diyā\u003c/i\u003e–Chorando \u003ci class=\"wbw__term\"\u003ebhakati-vinoda\u003c/i\u003e–Bhakti Vinod \u003ci class=\"wbw__term\"\u003ela’yechhe\u003c/i\u003e–tomou \u003ci class=\"wbw__term\"\u003eśaraṇa\u003c/i\u003e–abrigo [aos] \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003epāya\u003c/i\u003e–pés. \u003ci class=\"wbw__term\"\u003ekṣami’\u003c/i\u003e–Perdoando [suas] \u003ci class=\"wbw__term\"\u003eaparādha\u003c/i\u003e–ofensas [e] \u003ci class=\"wbw__term\"\u003ediyā\u003c/i\u003e–dando [a ele] \u003ci class=\"wbw__term\"\u003eruchi (anurāga)\u003c/i\u003e–gosto (apego amoroso profundo) \u003ci class=\"wbw__term\"\u003enāme\u003c/i\u003e–[pelo] Seu Nome \u003ci class=\"wbw__term\"\u003epālana karahe\u003c/i\u003e–por favor mantenha \u003ci class=\"wbw__term\"\u003etāya\u003c/i\u003e–o.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eChorando, Bhakti Vinod se abrigou aos Seus pés. Perdoando suas ofensas e dando-lhe um gosto pelo Nome, gentilmente mantenha-no.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-sarvasva-tomara-charane-sanpiya\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eSarvasva Tomāra \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esarvasva tomāra,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;charaṇe sa̐piyā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;paḍechhi tomāra ghare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etumi ta’ ṭhākura,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra kukkura,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;baliyā jānaha more\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003esa̐piyā\u003c/i\u003e–Oferecendo \u003ci class=\"wbw__term\"\u003esarvasva\u003c/i\u003e–tudo [aos] \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003echaraṇe\u003c/i\u003e–pés \u003ci class=\"wbw__term\"\u003epaḍechhi\u003c/i\u003e–eu caí [em] \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Sua \u003ci class=\"wbw__term\"\u003eghare\u003c/i\u003e–casa. \u003ci class=\"wbw__term\"\u003etumi\u003c/i\u003e–Você \u003ci class=\"wbw__term\"\u003eta’\u003c/i\u003e–certamente [é meu] \u003ci class=\"wbw__term\"\u003eṭhākura\u003c/i\u003e–mestre [eu sou] \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Seu \u003ci class=\"wbw__term\"\u003ekukkura\u003c/i\u003e–cão \u003ci class=\"wbw__term\"\u003ejānaha\u003c/i\u003e–por favor saiba \u003ci class=\"wbw__term\"\u003ebaliyā\u003c/i\u003e–considerando \u003ci class=\"wbw__term\"\u003emore\u003c/i\u003e–me [assim].\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu ofereci tudo a Seus pés e me abriguei em Sua casa. Você é meu mestre. Considere-me Seu cão.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebā̐dhiyā nikaṭe,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āmāre pālibe,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rahiba tomāra dvāre\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epratīpa-janere,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āsite nā diba,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rākhiba gaḍera pāre\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Me] \u003ci class=\"wbw__term\"\u003ebā̐ndhiyā\u003c/i\u003e–amarrando \u003ci class=\"wbw__term\"\u003enikaṭe\u003c/i\u003e–próximo [a Você] \u003ci class=\"wbw__term\"\u003eāmāre pālibe\u003c/i\u003e–a mim [Você] irá manter. \u003ci class=\"wbw__term\"\u003erahiba\u003c/i\u003e–Irei guardar \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Sua \u003ci class=\"wbw__term\"\u003edvāre\u003c/i\u003e–porta. \u003ci class=\"wbw__term\"\u003enā diba\u003c/i\u003e–Não vou permitir \u003ci class=\"wbw__term\"\u003ejanere\u003c/i\u003e–pessoas que são \u003ci class=\"wbw__term\"\u003epratīpa (pratikūla, guru vaiṣṇava-dveṣī)\u003c/i\u003e–adversas (desfavoráveis, inimigas do mestre spiritual e dos devotos) \u003ci class=\"wbw__term\"\u003eāsite\u003c/i\u003e–virem. \u003ci class=\"wbw__term\"\u003erākhiba\u003c/i\u003e–Eu vou manter [mantê-los] \u003ci class=\"wbw__term\"\u003epāre\u003c/i\u003e–do outro lado \u003ci class=\"wbw__term\"\u003egaḍera (durgā, parikhā)\u003c/i\u003e–do fosso (vala intransponível).\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVocê vai me prender por perto e me manter. Vou ficar em Sua porta. Não permitirei que entrem pessoas inimigas eu os manterei do outro lado do Seu fosso.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etava nija-jana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prasāda seviyā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;uchchhiṣṭa rākhibe yāhā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāmāra bhojana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;parama-ānande,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prati-dina habe tāhā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eyāhā\u003c/i\u003e–Qualquer coisa [que] \u003ci class=\"wbw__term\"\u003etava\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003enija\u003c/i\u003e–próprios \u003ci class=\"wbw__term\"\u003ejana\u003c/i\u003e–[devotos] pessoas \u003ci class=\"wbw__term\"\u003eseviyā\u003c/i\u003e–servindo [honrarem] \u003ci class=\"wbw__te
