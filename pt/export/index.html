m\"\u003ehari\u003c/i\u003e–do Senhor \u003ci class=\"wbw__term\"\u003evarjana kariyā\u003c/i\u003e–tendo abandonado \u003ci class=\"wbw__term\"\u003eei\u003c/i\u003e–estas \u003ci class=\"wbw__term\"\u003edaśa\u003c/i\u003e–dez \u003ci class=\"wbw__term\"\u003eaparādha\u003c/i\u003e–ofensas. \u003ci class=\"wbw__term\"\u003enāma-prabhu\u003c/i\u003e–O Nome Ele mesmo \u003ci class=\"wbw__term\"\u003evilasaya\u003c/i\u003e–ressoa [dentro] \u003ci class=\"wbw__term\"\u003ehṛde\u003c/i\u003e–[dos] corações \u003ci class=\"wbw__term\"\u003etāra\u003c/i\u003e–deles \u003ci class=\"wbw__term\"\u003enitya\u003c/i\u003e–eternamente.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAs grandes almas que evitam essas dez ofensas e se engajam no Hari-nām-saṅkīrtan atingem o sem precedentes Śrī Kṛṣṇa-prema. O Nome Ele mesmo ressoará dentro de seus corações eternamente.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-prabhu-kohe-kohilan-ei-mahamantra\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eHare Kṛṣṇa mahāmantra \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŚrīla Vṛndāvan Dās Ṭhākur\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehare kṛṣṇa hare kṛṣṇa kṛṣṇa kṛṣṇa hare hare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehare rāma hare rāma rāma rāma hare hare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprabhu kahe—kahilāṅ ei mahāmantra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eihā japa’ giyā sabe kariyā nirbandha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eihā haite sarva-siddhi ha-ibe sabāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esarva-kṣaṇa bala’ ithe vidhi nāhi āra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eki śayane ki bhojane, ki vā jāgaraṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eahar-niśa chinta kṛṣṇa, balaha vadane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāma-prati sneha yadi thāke sabākāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa vinā keha kichhu nā balibe āra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e\u003ci\u003e(Śrī Chaitanya-bhāgavata: Madhya-khaṇḍa, 23.76-8, 28.27-8)\u003c/i\u003e\u003cbr\u003e\nŚrīman Mahāprabhu declarou: “Eu dei a todos vocês este mahāmantra. Cantem-no resolutamente. Ao fazer isso, vocês atingirão toda a perfeição. Cantem-no sempre. Não existem regras a esse respeito. Se você está descansando, comendo, ou acordado—dia e noite pense em Kṛṣṇa e cante Seu Nome em voz alta. Se você tem alguma afeição por mim, não fale de outra coisa senão de Kṛṣṇa.”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eŚrī Śikṣāṣṭakam\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-pita-varana-kali-pavana-gora\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eCanção 1\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echeto-darpaṇa-mārjanaṁ bhava-mahā-dāvāgni-nirvāpaṇaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśreyaḥ-kairava-chandrikā-vitaraṇaṁ vidyā-vadhū-jīvanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eānandāmbudhi-vardhanaṁ prati-padaṁ pūrṇāmṛtāsvādanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esarvātma-snapanaṁ paraṁ vijayate śrī-kṛṣṇa-saṅkīrtanam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003emārjanaṁ\u003c/i\u003e–O limpador \u003ci class=\"wbw__term\"\u003edarpaṇa\u003c/i\u003e–do espelho \u003ci class=\"wbw__term\"\u003echetaḥ\u003c/i\u003e–da consciência \u003ci class=\"wbw__term\"\u003enirvāpaṇaṁ\u003c/i\u003e–o extintor \u003ci class=\"wbw__term\"\u003emahā\u003c/i\u003e–do grande \u003ci class=\"wbw__term\"\u003eagni\u003c/i\u003e–fogo [da] \u003ci class=\"wbw__term\"\u003edāva\u003c/i\u003e–floresta \u003ci class=\"wbw__term\"\u003ebhava\u003c/i\u003e–da existência material \u003ci class=\"wbw__term\"\u003evitaraṇaṁ\u003c/i\u003e–que faz brilhar \u003ci class=\"wbw__term\"\u003echandrikā\u003c/i\u003e–o luar \u003ci class=\"wbw__term\"\u003ekairava\u003c/i\u003e–sobre a lótus noturna \u003ci class=\"wbw__term\"\u003eśreyaḥ\u003c/i\u003e–da boa fortuna \u003ci class=\"wbw__term\"\u003ejīvanam\u003c/i\u003e–a vida \u003ci class=\"wbw__term\"\u003evadhū\u003c/i\u003e–da esposa \u003ci class=\"wbw__term\"\u003evidyā\u003c/i\u003e–do conhecimento \u003ci class=\"wbw__term\"\u003evardhanaṁ\u003c/i\u003e–o expansor \u003ci class=\"wbw__term\"\u003eambudhi\u003c/i\u003e–do oceano \u003ci class=\"wbw__term\"\u003eānanda\u003c/i\u003e–de êxtase \u003ci class=\"wbw__term\"\u003eāsvādanaṁ\u003c/i\u003e–o gosto \u003ci class=\"wbw__term\"\u003epūrṇa\u003c/i\u003e–completo \u003ci class=\"wbw__term\"\u003eamṛta\u003c/i\u003e–néctar \u003ci class=\"wbw__term\"\u003eprati\u003c/i\u003e–a cada \u003ci class=\"wbw__term\"\u003epadaṁ\u003c/i\u003e–momento [e] \u003ci class=\"wbw__term\"\u003esnapanaṁ\u003c/i\u003e–o alívio \u003ci class=\"wbw__term\"\u003esarva\u003c/i\u003e–de todo \u003ci class=\"wbw__term\"\u003eātma\u003c/i\u003e–eu. [Que o] \u003ci class=\"wbw__term\"\u003esaṅkīrtanam\u003c/i\u003e–cantar [do Nome] \u003ci class=\"wbw__term\"\u003eśrī-kṛṣṇa\u003c/i\u003e–de Śrī Kṛṣṇa [possa ser] \u003ci class=\"wbw__term\"\u003eparaṁ\u003c/i\u003e–supremamente \u003ci class=\"wbw__term\"\u003evijayate\u003c/i\u003e–vitorioso!\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO Śrī Kṛṣṇa-saṅkīrtan limpa o espelho da consciência, extingue o feroz incêndio florestal da [que é a] existência material, faz brilhar o luar na lótus noturna da [nossa] boa fortuna, é a vida do conhecimento divino, expande o oceano de êxtase, é o sabor de todo o néctar a cada momento, e acalma a totalidade do ser. Que o Śrī Kṛṣṇa-saṅkīrtan seja supremamente vitorioso!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse-subtitle\"\u003eGīti\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epīta-varaṇa kali-pāvana gorā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egāoya-i aichhana bhāva-vibhorā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003evaraṇa\u003c/i\u003e–De cor \u003ci class=\"wbw__term\"\u003epīta\u003c/i\u003e–dourada \u003ci class=\"wbw__term\"\u003egorā\u003c/i\u003e–Gorā \u003ci class=\"wbw__term\"\u003epāvana\u003c/i\u003e–o salvador \u003ci class=\"wbw__term\"\u003ekali\u003c/i\u003e–da Era de Kali \u003ci class=\"wbw__term\"\u003egāoya-i\u003c/i\u003e–canta \u003ci class=\"wbw__term\"\u003eaichhana\u003c/i\u003e–assim \u003ci class=\"wbw__term\"\u003evibhorā\u003c/i\u003e–cheio \u003ci class=\"wbw__term\"\u003ebhāva\u003c/i\u003e–de amor.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO dourado Gorā, o Salvador da Era de Kali, canta assim, cheio de amor.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echitta-darpaṇa-parimārjanakārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-kīrtana jaya chitta-bihārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ejaya\u003c/i\u003e–Toda a glória \u003ci class=\"wbw__term\"\u003ekīrtana\u003c/i\u003e–ao cantar \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–do Nome de Kṛṣṇa, [que é] \u003ci class=\"wbw__term\"\u003eparimārjanakārī\u003c/i\u003e–o purificador \u003ci class=\"wbw__term\"\u003edarpaṇa\u003c/i\u003e–do espelho \u003ci class=\"wbw__term\"\u003echitta\u003c/i\u003e–da consciência [e] \u003ci class=\"wbw__term\"\u003ebihārī\u003c/i\u003e–o deleite \u003ci class=\"wbw__term\"\u003echitta\u003c/i\u003e–da alma!\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda a glória ao Kṛṣṇa-kīrtan, que limpa o espelho da consciência e deleita a alma!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehelā-bhava-dāva-nirvāpaṇa-vṛtti\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-kīrtana jaya klesa-nivṛtti\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ejaya\u003c/i\u003e–Toda a glória \u003ci class=\"wbw__term\"\u003ekīrtana\u003c/i\u003e–ao cantar \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–do Nome de Kṛṣṇa, [que] \u003ci class=\"wbw__term\"\u003enirvāpaṇa-vṛtti\u003c/i\u003e–extingue \u003ci class=\"wbw__term\"\u003edāva\u003c/i\u003e–o fogo \u003ci class=\"wbw__term\"\u003ehelā\u003c/i\u003e–da miserável \u003ci class=\"wbw__term\"\u003ebhava\u003c/i\u003e–existência material [e é] \u003ci class=\"wbw__term\"\u003enivṛtti\u003c/i\u003e–finalizador [de todo] \u003ci class=\"wbw__term\"\u003ekleśa\u003c/i\u003e–sofrimento!\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda a glória ao Kṛṣṇa-kīrtan, que extingue o fogo da existência material e extermina todo sofrimento!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśreyaḥ-kumuda-vidhu-jyotsnā-prakāśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-kīrtana jaya bhakti-vilāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ejaya\u003c/i\u003e–Toda a glória \u003ci class=\"wbw__term\"\u003ekīrtana\u003c/i\u003e–ao cantar \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–do Nome de Kṛṣṇa \u003ci class=\"wbw__term\"\u003evilāsa\u003c/i\u003e–o júbilo \u003ci class=\"wbw__term\"\u003ebhakti\u003c/i\u003e–da devoção, [que é] \u003ci class=\"wbw__term\"\u003eprakāśa\u003c/i\u003e–a manifestação \u003ci class=\"wbw__term\"\u003evidhu-jyotsnā\u003c/i\u003e–do luar [sobre] \u003ci class=\"wbw__term\"\u003ekumuda\u003c/i\u003e–a lótus noturna \u003ci class=\"wbw__term\"\u003eśreyaḥ\u003c/i\u003e–da boa fortuna!\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda a glória ao Kṛṣṇa-kīrtan, o prazer da devoção, que faz brilhar o luar na lótus noturna da [nossa] boa fortuna.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eviśuddha-vidyā-vadhū-jīvana-rūpa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-kīrtana jaya siddha-svarūpa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ejaya\u003c/i\u003e–Toda a glória \u003ci class=\"wbw__term\"\u003ekīrtana\u003c/i\u003e–ao cantar \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–do Nome de Kṛṣṇa \u003ci class=\"wbw__term\"\u003esiddha\u003c/i\u003e–a realização \u003ci class=\"wbw__term\"\u003esvarūpa\u003c/i\u003e–do ser, [que toma] \u003ci class=\"wbw__term\"\u003erūpa\u003c/i\u003e–forma \u003ci class=\"wbw__term\"\u003ejīvana\u003c/i\u003e–como a vida \u003ci class=\"wbw__term\"\u003evadhū\u003c/i\u003e–das esposas [que têm] \u003ci class=\"wbw__term\"\u003eviśuddha\u003c/i\u003e–puro \u003ci class=\"wbw__term\"\u003evidyā\u003c/i\u003e–conhecimento!\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda a glória ao Kṛṣṇa-kīrtan, a satisfação do ser, a vida das almas puramente iluminadas com o amor de amante pelo Senhor!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eānanda-payonidhi-vardhana-kīrti\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-kīrtana jaya plāvana-mūrti\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ejaya\u003c/i\u003e–Toda a glória \u003ci class=\"wbw__term\"\u003ekīrtana\u003c/i\u003e–ao cantar \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–do Nome de Kṛṣṇa, \u003ci class=\"wbw__term\"\u003ekīrti\u003c/i\u003e–reconhecido \u003ci class=\"wbw__term\"\u003evardhana\u003c/i\u003e–por expandir \u003ci class=\"wbw__term\"\u003epayonidhi\u003c/i\u003e–o oceano de leite \u003ci class=\"wbw__term\"\u003eānanda\u003c/i\u003e–do êxtase [e assumir] \u003ci class=\"wbw__term\"\u003emūrti\u003c/i\u003e–a forma \u003ci class=\"wbw__term\"\u003eplāvana\u003c/i\u003e–de uma inundação!\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda a glória ao Kṛṣṇa-kīrtan, que é reconhecido por expandir o oceano de leite do êxtase e fazê-lo transbordar!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epade pade pīyūṣa-svāda-pradātā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-kīrtana jaya prema-vidhātā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ejaya\u003c/i\u003e–Toda glória \u003ci class=\"wbw__term\"\u003ekīrtana\u003c/i\u003e–ao cantar \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–do Nome de Kṛṣṇa, [que é] \u003ci class=\"wbw__term\"\u003epradātā\u003c/i\u003e–um doador \u003ci class=\"wbw__term\"\u003esvāda\u003c/i\u003e–do gosto \u003ci class=\"wbw__term\"\u003epīyūṣa\u003c/i\u003e–do néctar \u003ci class=\"wbw__term\"\u003epade pade\u003c/i\u003e–a cada momento [e é] \u003ci class=\"wbw__term\"\u003evidhātā\u003c/i\u003e–um doador \u003ci class=\"wbw__term\"\u003eprema\u003c/i\u003e–de amor divino!\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda a glória ao Kṛṣṇa-kīrtan, que dá à alma o sabor do néctar a cada momento e outorga amor divino!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakati-vinoda svātma-snapana-vidhāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-kīrtana jaya prema-nidāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ejaya\u003c/i\u003e–Toda glória \u003ci class=\"wbw__term\"\u003ekīrtana\u003c/i\u003e–ao cantar \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–do Nome de Kṛṣṇa, [que é] \u003ci class=\"wbw__term\"\u003evidhāna\u003c/i\u003e–o estabelecimento \u003ci class=\"wbw__term\"\u003esnapana\u003c/i\u003e–de um banho \u003ci class=\"wbw__term\"\u003esva-ātma\u003c/i\u003e–para a alma \u003ci class=\"wbw__term\"\u003ebhakati-vinoda\u003c/i\u003e–de Bhakti Vinod [e é o] \u003ci class=\"wbw__term\"\u003enidāna\u003c/i\u003e–reservatório \u003ci class=\"wbw__term\"\u003eprema\u003c/i\u003e–de amor divino!\u003c/p\u003e\n\u003cp class=\"translation\"\u003eToda a glória ao Kṛṣṇa-kīrtan, que acalma a alma de Bhakti Vinod e é um reservatório de amor divino!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-tuhu-daya-sagara-tarayite-prani\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eCanção 2\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enāmnām akāri bahudhā nija-sarva-śaktis\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etatrārpitā niyamitaḥ smaraṇe na kālaḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eetādṛśī tava kṛpā bhagavan mamāpi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edurdaivam īdṛśam ihājani nānurāgaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ebhagavan\u003c/i\u003e–Ó Senhor \u003ci class=\"wbw__term\"\u003eakāri\u003c/i\u003e–Você manifestou [Seus] \u003ci class=\"wbw__term\"\u003ebahudhā\u003c/i\u003e–vários \u003ci class=\"wbw__term\"\u003enāmnām\u003c/i\u003e–Nomes \u003ci class=\"wbw__term\"\u003earpitā\u003c/i\u003e–colocou \u003ci class=\"wbw__term\"\u003esarva\u003c/i\u003e–todo \u003ci class=\"wbw__term\"\u003enija\u003c/i\u003e–do [Seu] próprio \u003ci class=\"wbw__term\"\u003eśaktiḥ\u003c/i\u003e–poder \u003ci class=\"wbw__term\"\u003etatra\u003c/i\u003e–Neles, [e] \u003ci class=\"wbw__term\"\u003ena\u003c/i\u003e–não \u003ci class=\"wbw__term\"\u003eniyamitaḥ\u003c/i\u003e–prescreveu \u003ci class=\"wbw__term\"\u003ekālaḥ\u003c/i\u003e–o momento \u003ci class=\"wbw__term\"\u003esmaraṇe\u003c/i\u003e–para lembrar [Deles]. \u003ci class=\"wbw__term\"\u003eetādṛśī\u003c/i\u003e–Tal [é] \u003ci class=\"wbw__term\"\u003etava\u003c/i\u003e–Sua \u003ci class=\"wbw__term\"\u003ekṛpā\u003c/i\u003e–misericórdia. \u003ci class=\"wbw__term\"\u003emama\u003c/i\u003e–Minha \u003ci class=\"wbw__term\"\u003edurdaivam\u003c/i\u003e–desventura [é] \u003ci class=\"wbw__term\"\u003eīdṛśam\u003c/i\u003e–tal \u003ci class=\"wbw__term\"\u003eapi\u003c/i\u003e–contudo, [que meu] \u003ci class=\"wbw__term\"\u003eanurāgaḥ\u003c/i\u003e–apego \u003ci class=\"wbw__term\"\u003eiha\u003c/i\u003e–a Eles \u003ci class=\"wbw__term\"\u003eajani na\u003c/i\u003e–não se desenvolveu.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Senhor, Você manifestou Seus inúmeros Nomes, colocou todo o Seu poder dentro Deles e não fez quaisquer regras relativas ao momento de se lembrar Deles. Tal é Sua grande misericórdia. Meu infortúnio, porém, é que eu não tenho nenhum apego aos Seus Nomes.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse-subtitle\"\u003eGīti\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etuhu̐ dayā-sāgara tārayite prāṇī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma aneka tuyā śikhāoli āni’\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003etuh̐u\u003c/i\u003e–Você [é] \u003ci class=\"wbw__term\"\u003esāgara\u003c/i\u003e–um oceano \u003ci class=\"wbw__term\"\u003edaya\u003c/i\u003e–de misericórdia. \u003ci class=\"wbw__term\"\u003etārayite\u003c/i\u003e–Para liberar \u003ci class=\"wbw__term\"\u003eprāṇī\u003c/i\u003e–as almas \u003ci class=\"wbw__term\"\u003eāni’\u003c/i\u003e–Você trouxe \u003ci class=\"wbw__term\"\u003etuyā\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003eaneka\u003c/i\u003e–inúmeros \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–Nomes [e] \u003ci class=\"wbw__term\"\u003eśikhāoli\u003c/i\u003e–[os] ensinou.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVocê é um oceano de misericórdia. Para salvar as almas, Você trouxe Seus muitos Nomes a este mundo e ensinou todos a cantá-los.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esakala śakati dei’ nāme tohārā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egrahaṇe rākhali nāhi kāla-vichārā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003edei’\u003c/i\u003e–Você colocou \u003ci class=\"wbw__term\"\u003esakala\u003c/i\u003e–todo [Seu] \u003ci class=\"wbw__term\"\u003eśakati\u003c/i\u003e–poder [em] \u003ci class=\"wbw__term\"\u003etohārā\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003enāme\u003c/i\u003e–Nomes, [e] \u003ci class=\"wbw__term\"\u003erākhali nāhi\u003c/i\u003e–Você não fez \u003ci class=\"wbw__term\"\u003evichārā\u003c/i\u003e–nenhuma regra \u003ci class=\"wbw__term\"\u003ekāla\u003c/i\u003e–quanto ao tempo \u003ci class=\"wbw__term\"\u003egrahaṇe\u003c/i\u003e–para cantar.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVocê colocou todo o Seu poder em Seus Nomes, e Você também não fez quaisquer regras sobre quando cantá-Los.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-nāma-chintāmaṇi tohāri samānā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eviśve bilāoli karuṇā-nidānā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Seus] \u003ci class=\"wbw__term\"\u003eśrī-nāma\u003c/i\u003e–Santos Nomes [são] \u003ci class=\"wbw__term\"\u003echintāmaṇi\u003c/i\u003e–joias que satisfazem desejos \u003ci class=\"wbw__term\"\u003esamānā\u003c/i\u003e–iguais \u003ci class=\"wbw__term\"\u003etohāri\u003c/i\u003e–a Você, [e] \u003ci class=\"wbw__term\"\u003ebilāoli\u003c/i\u003e–Você [os] distribuiu \u003ci class=\"wbw__term\"\u003eviśve\u003c/i\u003e–por todo o mundo, \u003ci class=\"wbw__term\"\u003ekaruṇā-nidānā\u003c/i\u003e–Ó oceano de misericórdia!\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSeus Nomes são joias que realizam desejos equivalentes a Você, e Você os distribuiu por todo o mundo, Ó oceano de misericórdia!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etuyā dayā aichhana parama udārā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eatiśaya manda nātha! bhāga hāmārā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eaichhana\u003c/i\u003e–Tal [é] \u003ci class=\"wbw__term\"\u003etuyā\u003c/i\u003e–Sua \u003ci class=\"wbw__term\"\u003edoyā\u003c/i\u003e–misericórdia, \u003ci class=\"wbw__term\"\u003eparama\u003c/i\u003e–extremamente \u003ci class=\"wbw__term\"\u003eudārā\u003c/i\u003e–liberal. \u003ci class=\"wbw__term\"\u003ehāmārā\u003c/i\u003e–Minha \u003ci class=\"wbw__term\"\u003ebhāga\u003c/i\u003e–fortuna, [contudo,] \u003ci class=\"wbw__term\"\u003enātha!\u003c/i\u003e–Ó Senhor, [é] \u003ci class=\"wbw__term\"\u003eatiśaya\u003c/i\u003e–extremamente \u003ci class=\"wbw__term\"\u003emanda\u003c/i\u003e–ruim.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTal é Sua misericórdia, extremamente liberal. Eu, porém, Senhor, sou extremamente desafortunado.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enāhi janamala nāme anurāga mora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakti-vinoda-chitta duḥkhe vibhora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–Meu \u003ci class=\"wbw__term\"\u003eanurāga\u003c/i\u003e–apego \u003ci class=\"wbw__term\"\u003enāme\u003c/i\u003e–aos [Seus] Nomes \u003ci class=\"wbw__term\"\u003ejanamala nāhi\u003c/i\u003e–não se desenvolveu. \u003ci class=\"wbw__term\"\u003echitta\u003c/i\u003e–O coração \u003ci class=\"wbw__term\"\u003ebhakti-vinoda\u003c/i\u003e–de Bhakti Vinod [está] \u003ci class=\"wbw__term\"\u003evibhora\u003c/i\u003e–cheio \u003ci class=\"wbw__term\"\u003eduḥkhe\u003c/i\u003e–de tristeza.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu não tenho nenhum apego aos Seus Nomes. O coração de Bhakti Vinod está cheio de tristeza.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-krishna-kirtane-jodi-manasa-tohara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eCanção 3\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etṛṇād api sunīchena taror iva sahiṣṇunā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eamāninā mānadena kīrtanīyaḥ sadā hariḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ehariḥ\u003c/i\u003e–O Nome de Hari \u003ci class=\"wbw__term\"\u003ekīrtanīyaḥ\u003c/i\u003e–deveria ser cantado \u003ci class=\"wbw__term\"\u003esadā\u003c/i\u003e–sempre [por quem é] \u003ci class=\"wbw__term\"\u003eapi\u003c/i\u003e–mais \u003ci class=\"wbw__term\"\u003esunīchena\u003c/i\u003e–humilde que \u003ci class=\"wbw__term\"\u003etṛṇāt\u003c/i\u003e–uma folha de grama, \u003ci class=\"wbw__term\"\u003esahiṣṇunā\u003c/i\u003e–quem é tolerante \u003ci class=\"wbw__term\"\u003eiva\u003c/i\u003e–como \u003ci class=\"wbw__term\"\u003etaroḥ\u003c/i\u003e–uma árvore, \u003ci class=\"wbw__term\"\u003eamāninā\u003c/i\u003e–quem é sem orgulho, [e] \u003ci class=\"wbw__term\"\u003emānadena\u003c/i\u003e–quem é respeitoso.\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“O Nome do Senhor deveria ser cantado sempre por aquele que é mais humilde que uma folha de grama, tão tolerante quanto uma árvore, respeitoso com os outros e livre de desejo por respeito.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse-subtitle\"\u003eGīti\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-kṛṣṇa-kīrtane yadi mānasa tohāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eparama yatane ta̐hi labha adhikāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eyadi\u003c/i\u003e–Se \u003ci class=\"wbw__term\"\u003etohāra [āchchhe]\u003c/i\u003e–você tem \u003ci class=\"wbw__term\"\u003emānasa\u003c/i\u003e–uma mente \u003ci class=\"wbw__term\"\u003ekīrtane\u003c/i\u003e–para cantar \u003ci class=\"wbw__term\"\u003eśrī-kṛṣṇa\u003c/i\u003e–o Nome de Śrī Kṛṣṇa, [então com] \u003ci class=\"wbw__term\"\u003eparama\u003c/i\u003e–grande \u003ci class=\"wbw__term\"\u003eyatane\u003c/i\u003e–cuidado \u003ci class=\"wbw__term\"\u003elabha\u003c/i\u003e–obtenha \u003ci class=\"wbw__term\"\u003eadhikāra\u003c/i\u003e–a qualificação \u003ci class=\"wbw__term\"\u003eta̐hi\u003c/i\u003e–para isso.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSe você aspira a cantar o Nome de Kṛṣṇa, então, com muito cuidado, torne-se qualificado para fazer isso.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etṛṇādhika hīna, dīna, akiñchana, chhāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāpane mānabi sadā chhāḍi’ ahaṅkāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003echhāḍi’\u003c/i\u003e–Abandone [seu] \u003ci class=\"wbw__term\"\u003eahaṅkāra\u003c/i\u003e–falso ego, [e] \u003ci class=\"wbw__term\"\u003esadā\u003c/i\u003e–sempre \u003ci class=\"wbw__term\"\u003emānabi\u003c/i\u003e–considere \u003ci class=\"wbw__term\"\u003eāpane\u003c/i\u003e–se [a si] \u003ci class=\"wbw__term\"\u003ehīna\u003c/i\u003e–mais baixo \u003ci class=\"wbw__term\"\u003eadhika\u003c/i\u003e–do que [uma folha de] \u003ci class=\"wbw__term\"\u003etṛṇa\u003c/i\u003e–grama, \u003ci class=\"wbw__term\"\u003edīna\u003c/i\u003e–pobre, \u003ci class=\"wbw__term\"\u003eakiñchana\u003c/i\u003e–necessitado, [e] \u003ci class=\"wbw__term\"\u003echhāra\u003c/i\u003e–mesquinho.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAbandone seu falso ego, e sempre se considere mais baixo que uma folha de grama, pobre, necessitado, e mesquinho.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evṛkṣa-sama kṣamā-guṇa karabi sādhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epratihiṁsā tyaji’ anye karabi pālana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003esādhana karabi\u003c/i\u003e–Pratique \u003ci class=\"wbw__term\"\u003eguṇa\u003c/i\u003e–a qualidade \u003ci class=\"wbw__term\"\u003ekṣamā\u003c/i\u003e–da tolerância \u003ci class=\"wbw__term\"\u003esama\u003c/i\u003e–como \u003ci class=\"wbw__term\"\u003evṛkṣa\u003c/i\u003e–uma árvore. \u003ci class=\"wbw__term\"\u003etyaji’\u003c/i\u003e–Abandone [a] \u003ci class=\"wbw__term\"\u003epratihiṁsā\u003c/i\u003e–vingança, [e] \u003ci class=\"wbw__term\"\u003epālana karabi\u003c/i\u003e–nutra [os] \u003ci class=\"wbw__term\"\u003eanye\u003c/i\u003e–outros.\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePratique a tolerância como uma árvore. Abandone a retaliação e nutra os outros.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejīvana-nirvāhe āne udvega nā dibe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epara-upakāre nija-sukha pāsaribe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003edibe nā\u003c/i\u003e–Não cause \u003ci class=\"wbw__term\"\u003eudvega\u003c/i\u003e–ansiedade \u003ci class=\"wbw__term\"\u003eāne\u003c/i\u003e–aos outros \u003ci class=\"wbw__term\"\u003ejīvana-nirvāhe\u003c/i\u003e–para a manutenção da [sua] vida, [e] \u003ci class=\"wbw__term\"\u003epāsaribe\u003c/i\u003e–esqueça [sua] \u003ci class=\"wbw__term\"\u003enija\u003c/i\u003e–própria \u003ci class=\"wbw__term\"\u003esukha\u003c/i\u003e–felicidade \u003ci class=\"wbw__term\"\u003eupakāre\u003c/i\u003e–no decurso de ajudar [os] \u003ci class=\"wbw__term\"\u003epara\u003c/i\u003e–outros.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNão perturbe os outros em troca de sua manutenção, e esqueça a sua própria felicidade ao ajudar os outros.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eha-ileo sarva-guṇe guṇī mahāśaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epratiṣṭhāśā chhāḍi’ kara amānī hṛdaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eha-ileo\u003c/i\u003e–Mesmo que você seja \u003ci class=\"wbw__term\"\u003emahāśaya\u003c/i\u003e–honrável [e] \u003ci class=\"wbw__term\"\u003eguṇī\u003c/i\u003e–qualificado [com] \u003ci class=\"wbw__term\"\u003esarva\u003c/i\u003e–todas [as] \u003ci class=\"wbw__term\"\u003eguṇe\u003c/i\u003e–qualidades, \u003ci class=\"wbw__term\"\u003echhāḍi’\u003c/i\u003e–abandone [o] \u003ci class=\"wbw__term\"\u003eāśā\u003c/i\u003e–desejo \u003ci class=\"wbw__term\"\u003epratiṣṭhā\u003c/i\u003e–por prestígio [e] \u003ci class=\"wbw__term\"\u003ekara\u003c/i\u003e–faça [seu] \u003ci class=\"wbw__term\"\u003ehṛdaya\u003c/i\u003e–coração \u003ci class=\"wbw__term\"\u003eamānī\u003c/i\u003e–sem orgulho.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMesmo que você seja honrável e qualificado com todas as qualidades, abandone o desejo por prestígio e torne seu coração sem orgulho.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛṣṇa-adhiṣṭhāna sarva-jīve jāni’ sadā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekarabi sammāna sabe ādare sarvadā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ejāni’\u003c/i\u003e–Sabendo [que] \u003ci class=\"wbw__term\"\u003esarva\u003c/i\u003e–toda \u003ci class=\"wbw__term\"\u003ejīve\u003c/i\u003e–alma [é] \u003ci class=\"wbw__term\"\u003esadā\u003c/i\u003e–eternamente \u003ci class=\"wbw__term\"\u003eadhiṣṭhāna\u003c/i\u003e–uma morada \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–de Kṛṣṇa, \u003ci class=\"wbw__term\"\u003esarvadā\u003c/i\u003e–sempre \u003ci class=\"wbw__term\"\u003eādare\u003c/i\u003e–respeitosamente \u003ci class=\"wbw__term\"\u003esammāna karabi\u003c/i\u003e–honre \u003ci class=\"wbw__term\"\u003esabe\u003c/i\u003e–a todos.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSabendo que Kṛṣṇa reside eternamente dentro de cada alma, respeitosamente honre sempre a todos.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edainya, dayā, anye māna, pratiṣṭhā-varjana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echāri guṇe guṇī hai’ karaha kīrtana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003edainya\u003c/i\u003e–Humildade \u003ci class=\"wbw__term\"\u003edayā\u003c/i\u003e–compaixão \u003ci class=\"wbw__term\"\u003emāna\u003c/i\u003e–honra [aos] \u003ci class=\"wbw__term\"\u003eanye\u003c/i\u003e–outros, [e] \u003ci class=\"wbw__term\"\u003evarjana\u003c/i\u003e–abandonando \u003ci class=\"wbw__term\"\u003epratiṣṭhā\u003c/i\u003e–prestígio. \u003ci class=\"wbw__term\"\u003ehai’\u003c/i\u003e–Se torne \u003ci class=\"wbw__term\"\u003eguṇī\u003c/i\u003e–qualificado [com essas] \u003ci class=\"wbw__term\"\u003echāri\u003c/i\u003e–quatro \u003ci class=\"wbw__term\"\u003eguṇe\u003c/i\u003e–qualidades [e] \u003ci class=\"wbw__term\"\u003ekīrtana karaha\u003c/i\u003e–cante.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHumildade, gentileza (cuidado com os outros), oferecer honra aos outros (apreciar a qualidade do serviço dos outros) e ser desinteressado por posição, prestígio—se torne qualificado com estas quatro qualidades e cante o Nome.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakati-vinoda kā̐di’ bale prabhu-pāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e“heno adhikāra kabe dibe he amāya”\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekā̐di’\u003c/i\u003e–Chorando \u003ci class=\"wbw__term\"\u003epāya\u003c/i\u003e–aos pés \u003ci class=\"wbw__term\"\u003eprabhu\u003c/i\u003e–do Senhor \u003ci class=\"wbw__term\"\u003ebhakati-vinoda\u003c/i\u003e–Bhakti Vinod \u003ci class=\"wbw__term\"\u003ebale\u003c/i\u003e–diz \u003ci class=\"wbw__term\"\u003e“he\u003c/i\u003e–“Oh \u003ci class=\"wbw__term\"\u003ekabe\u003c/i\u003e–quando \u003ci class=\"wbw__term\"\u003edibe\u003c/i\u003e–Você dará \u003ci class=\"wbw__term\"\u003eamāya\u003c/i\u003e–a mim \u003ci class=\"wbw__term\"\u003ehena\u003c/i\u003e–essas \u003ci class=\"wbw__term\"\u003eadhikāra”\u003c/i\u003e–qualificações?”\u003c/p\u003e\n\u003cp class=\"translation\"\u003eChorando aos pés do Senhor, Bhakti Vinod diz: “Oh, quando Você me dará essas qualificações?”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-prabhu-tava-pada-juge-mora-nivedana\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eCanção 4\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ena dhanaṁ na janaṁ na sundarīṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekavitāṁ vā jagad-īśa kāmaye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emama janmani janmanīśvare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhavatād bhaktir ahaitukī tvayi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eīśa\u003c/i\u003e–Ó Senhor \u003ci class=\"wbw__term\"\u003ejagad\u003c/i\u003e–do universo \u003ci class=\"wbw__term\"\u003ekāmaye\u003c/i\u003e–eu desejo \u003ci class=\"wbw__term\"\u003ena\u003c/i\u003e–nem \u003ci class=\"wbw__term\"\u003edhanaṁ\u003c/i\u003e–riqueza \u003ci class=\"wbw__term\"\u003ena\u003c/i\u003e–nem \u003ci class=\"wbw__term\"\u003ejanaṁ\u003c/i\u003e–seguidores \u003ci class=\"wbw__term\"\u003ena\u003c/i\u003e–nem \u003ci class=\"wbw__term\"\u003esundarīṁ\u003c/i\u003e–belas mulheres \u003ci class=\"wbw__term\"\u003evā\u003c/i\u003e–nem \u003ci class=\"wbw__term\"\u003ekavitāṁ\u003c/i\u003e–erudição. \u003ci class=\"wbw__term\"\u003ejanmani\u003c/i\u003e–Nascimento \u003ci class=\"wbw__term\"\u003ejanmani\u003c/i\u003e–após nascimento \u003ci class=\"wbw__term\"\u003eīśvare\u003c/i\u003e–Ó Senhor \u003ci class=\"wbw__term\"\u003emama bhavatāt\u003c/i\u003e–deixe-me ter \u003ci class=\"wbw__term\"\u003ebhaktiḥ\u003c/i\u003e–devoção \u003ci class=\"wbw__term\"\u003eahaitukī\u003c/i\u003e–incondicional \u003ci class=\"wbw__term\"\u003etvayi\u003c/i\u003e–a Você.\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Ó Senhor do universo! Eu não desejo riqueza, seguidores, mulheres bonitas, ou erudição. Nascimento após nascimento, eu desejo apenas devoção incondicional a Você.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse-subtitle\"\u003eGīti\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprabhu tava pada-yuge mora nivedana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāhi māgi deha-sukha, vidyā, dhana, jana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eprabhu\u003c/i\u003e–Ó Senhor! [Este é] \u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–meu \u003ci class=\"wbw__term\"\u003enivedana\u003c/i\u003e–apelo [aos] \u003ci class=\"wbw__term\"\u003etava\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003epada-yuge\u003c/i\u003e–pés \u003ci class=\"wbw__term\"\u003emāgi nāhi\u003c/i\u003e–Eu não oro [por] \u003ci class=\"wbw__term\"\u003esukha\u003c/i\u003e–prazeres \u003ci class=\"wbw__term\"\u003edeha\u003c/i\u003e–corporais, \u003ci class=\"wbw__term\"\u003evidyā\u003c/i\u003e–conhecimento, \u003ci class=\"wbw__term\"\u003edhana\u003c/i\u003e–riqueza, [ou] \u003ci class=\"wbw__term\"\u003ejana\u003c/i\u003e–seguidores.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Senhor! Este é meu apelo aos Seus pés: não oro por prazer corporal, conhecimento, riqueza, ou seguidores.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enāhi māgi svarga āra mokṣa nāhi māgi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enā kari prārthanā kona vibhūtira lāgi’\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003emāgi nāhi\u003c/i\u003e–Eu não oro \u003ci class=\"wbw__term\"\u003esvarga\u003c/i\u003e–pelo céu \u003ci class=\"wbw__term\"\u003eāra\u003c/i\u003e–e \u003ci class=\"wbw__term\"\u003emāgi nāhi\u003c/i\u003e–eu não oro \u003ci class=\"wbw__term\"\u003emokṣa\u003c/i\u003e–por liberação \u003ci class=\"wbw__term\"\u003ekari nā\u003c/i\u003e–eu não \u003ci class=\"wbw__term\"\u003eprārthanā\u003c/i\u003e–oro \u003ci class=\"wbw__term\"\u003elāgi’\u003c/i\u003e–por \u003ci class=\"wbw__term\"\u003ekona\u003c/i\u003e–nenhum \u003ci class=\"wbw__term\"\u003evibhūtira\u003c/i\u003e–poder sobrenatural.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu não oro pelo céu, eu não oro por liberação, e não oro por poderes sobrenaturais.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enija-karma-guṇa-doṣe ye ye janma pāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejanme janme yena tava nāma guṇa gāi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003epāi\u003c/i\u003e–Recebendo \u003ci class=\"wbw__term\"\u003eye\u003c/i\u003e–qualquer tipo \u003ci class=\"wbw__term\"\u003ejanma\u003c/i\u003e–de nascimento \u003ci class=\"wbw__term\"\u003edoṣe\u003c/i\u003e–em decorrência das faltas \u003ci class=\"wbw__term\"\u003eguṇa\u003c/i\u003e–e qualidades \u003ci class=\"wbw__term\"\u003enija\u003c/i\u003e–de [minhas] próprias \u003ci class=\"wbw__term\"\u003ekarma\u003c/i\u003e–ações, \u003ci class=\"wbw__term\"\u003ejanme\u003c/i\u003e–nascimento \u003ci class=\"wbw__term\"\u003ejanme\u003c/i\u003e–após nascimento \u003ci class=\"wbw__term\"\u003eyena\u003c/i\u003e–que \u003ci class=\"wbw__term\"\u003egāi\u003c/i\u003e–eu cante \u003ci class=\"wbw__term\"\u003etava\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–Nomes [e] \u003ci class=\"wbw__term\"\u003eguṇa\u003c/i\u003e–glórias.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eRecebendo qualquer tipo de nascimento como resultado dos meus atos piedosos e dos meus pecados, nascimento após nascimento, deixe-me cantar seu Nome e glórias.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eei mātra āśā mama tomāra charaṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eahaitukī-bhakti hṛde jāge anukṣaṇe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003emama\u003c/i\u003e–Meu \u003ci class=\"wbw__term\"\u003emātra\u003c/i\u003e–único \u003ci class=\"wbw__term\"\u003eāśā\u003c/i\u003e–desejo [é que] \u003ci class=\"wbw__term\"\u003eei\u003c/i\u003e–aquela \u003ci class=\"wbw__term\"\u003ebhakti\u003c/i\u003e–devoção \u003ci class=\"wbw__term\"\u003eahaitukī\u003c/i\u003e–incondicional [aos] \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003echaraṇe\u003c/i\u003e–pés \u003ci class=\"wbw__term\"\u003eanukṣaṇe\u003c/i\u003e–sempre \u003ci class=\"wbw__term\"\u003ejāge\u003c/i\u003e–surja \u003ci class=\"wbw__term\"\u003ehṛde\u003c/i\u003e–em [meu] coração.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMeu único desejo é que a devoção incondicional aos Seus pés surja em meu coração constantemente.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eviṣaye ye prīti ebe āchhaye āmāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esei mata prīti hauk charaṇe tomāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eye\u003c/i\u003e–O \u003ci class=\"wbw__term\"\u003eprīti\u003c/i\u003e–amor [que] \u003ci class=\"wbw__term\"\u003eāmāra āchhaye\u003c/i\u003e–eu tenho \u003ci class=\"wbw__term\"\u003eviṣaye\u003c/i\u003e–pelas coisas materiais \u003ci class=\"wbw__term\"\u003esebe\u003c/i\u003e–agora \u003ci class=\"wbw__term\"\u003ehauk\u003c/i\u003e–deixe-me ter \u003ci class=\"wbw__term\"\u003esei\u003c/i\u003e–aquele \u003ci class=\"wbw__term\"\u003emata\u003c/i\u003e–tipo \u003ci class=\"wbw__term\"\u003eprīti\u003c/i\u003e–de amor [pelos] \u003ci class=\"wbw__term\"\u003etomāra\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003echaraṇe\u003c/i\u003e–pés.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDeixe-me ter amor pelos Seus pés assim como eu atualmente amo as coisas materiais.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evipade sampade tāhā thākuk samabhāve\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edine dine vṛddhi hauk nāmera prabhāve\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003evipade\u003c/i\u003e–No infortúnio [e] \u003ci class=\"wbw__term\"\u003esampade\u003c/i\u003e–na boa fortuna, [deixe] \u003ci class=\"wbw__term\"\u003etāhā\u003c/i\u003e–que [este amor] \u003ci class=\"wbw__term\"\u003ethākuk\u003c/i\u003e–permaneça \u003ci class=\"wbw__term\"\u003esamabhāve\u003c/i\u003e–o mesmo, [e] \u003ci class=\"wbw__term\"\u003edine\u003c/i\u003e–dia \u003ci class=\"wbw__term\"\u003edine\u003c/i\u003e–após dia \u003ci class=\"wbw__term\"\u003ehauk\u003c/i\u003e–deixe-o \u003ci class=\"wbw__term\"\u003evṛddhi\u003c/i\u003e–crescer \u003ci class=\"wbw__term\"\u003eprabhāve\u003c/i\u003e–pela influência \u003ci class=\"wbw__term\"\u003enāmera\u003c/i\u003e–de [Seu] Nome.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNo infortúnio e na boa fortuna, deixe que este amor permaneça o mesmo, e dia após dia, deixe-o crescer pela influência de Seu Nome.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epaśu pakṣī haye thāki’ svarge vā niraye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava bhakti rahu bhakti-vinoda-hṛdaye\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ehaye\u003c/i\u003e–Sendo \u003ci class=\"wbw__term\"\u003epakṣī\u003c/i\u003e–um pássaro [ou] \u003ci class=\"wbw__term\"\u003epaśu\u003c/i\u003e–uma besta [e] \u003ci class=\"wbw__term\"\u003ethāki’\u003c/i\u003e–vivendo \u003ci class=\"wbw__term\"\u003esvarge\u003c/i\u003e–no céu \u003ci class=\"wbw__term\"\u003evā\u003c/i\u003e–ou \u003ci class=\"wbw__term\"\u003eniraye\u003c/i\u003e–no inferno, [deixe que a] \u003ci class=\"wbw__term\"\u003ebhakti\u003c/i\u003e–devoção \u003ci class=\"wbw__term\"\u003etava\u003c/i\u003e–a Você \u003ci class=\"wbw__term\"\u003erahu\u003c/i\u003e–permaneça \u003ci class=\"wbw__term\"\u003ehṛdaye\u003c/i\u003e–no coração \u003ci class=\"wbw__term\"\u003ebhakti-vinoda\u003c/i\u003e–de Bhakti Vinod.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSendo um pássaro ou uma besta, no céu ou no inferno, deixe a devoção a Você permanecer no coração de Bhakti Vinod.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-anadi-karama-phole\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eCanção 5\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eayi nanda-tanuja kiṅkaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epatitaṁ māṁ viṣame bhavāmbudhau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛpayā tava pāda-paṅkaja\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esthita-dhūlī-sadṛśaṁ vichintaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eayi\u003c/i\u003e–Ó \u003ci class=\"wbw__term\"\u003etanuja\u003c/i\u003e–Filho \u003ci class=\"wbw__term\"\u003enanda\u003c/i\u003e–de Nanda \u003ci class=\"wbw__term\"\u003ekṛpayā\u003c/i\u003e–misericordiosamente \u003ci class=\"wbw__term\"\u003evichintaya\u003c/i\u003e–considere \u003ci class=\"wbw__term\"\u003emāṁ\u003c/i\u003e–me [Seu] \u003ci class=\"wbw__term\"\u003ekiṅkaraṁ\u003c/i\u003e–servo \u003ci class=\"wbw__term\"\u003epatitaṁ\u003c/i\u003e–que caiu \u003ci class=\"wbw__term\"\u003eviṣame\u003c/i\u003e–no terrível \u003ci class=\"wbw__term\"\u003eambudhau\u003c/i\u003e–oceano \u003ci class=\"wbw__term\"\u003ebhava\u003c/i\u003e–da existência material \u003ci class=\"wbw__term\"\u003esadṛśaṁ\u003c/i\u003e–como \u003ci class=\"wbw__term\"\u003edhūlī\u003c/i\u003e–uma partícula de poeira \u003ci class=\"wbw__term\"\u003esthita\u003c/i\u003e–situada [aos] \u003ci class=\"wbw__term\"\u003etava\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003epāda\u003c/i\u003e–pés [de] \u003ci class=\"wbw__term\"\u003epaṅkaja\u003c/i\u003e–lótus.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ Filho de Nanda, misericordiosamente considere este Seu servo que caiu no terrível oceano da existência material como sendo uma partícula de poeira aos Seus pés de lótus.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse-subtitle\"\u003eGīti\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eanādi karama-phale paḍi’ bhavārṇava-jale\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etaribāre nā dekhi upāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ee-viṣaya-halāhale divā-niśi hiyā jvale\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emana kabhu sukha nāhi pāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ephale\u003c/i\u003e–Em decorrência \u003ci class=\"wbw__term\"\u003ekarama\u003c/i\u003e–de [meus] atos [que são] \u003ci class=\"wbw__term\"\u003eanādi\u003c/i\u003e–sem origem \u003ci class=\"wbw__term\"\u003epaḍi’\u003c/i\u003e–eu caí \u003ci class=\"wbw__term\"\u003ejale\u003c/i\u003e–nas águas \u003ci class=\"wbw__term\"\u003earṇava\u003c/i\u003e–do oceano \u003ci class=\"wbw__term\"\u003ebhava\u003c/i\u003e–da existência material [e] \u003ci class=\"wbw__term\"\u003edekhi nā\u003c/i\u003e–eu não vejo [nenhum] \u003ci class=\"wbw__term\"\u003eupāya\u003c/i\u003e–meio \u003ci class=\"wbw__term\"\u003etaribāre\u003c/i\u003e–de liberação. \u003ci class=\"wbw__term\"\u003edivā\u003c/i\u003e–Dia [e] \u003ci class=\"wbw__term\"\u003eniśi\u003c/i\u003e–noite, [meu] \u003ci class=\"wbw__term\"\u003ehiyā\u003c/i\u003e–coração \u003ci class=\"wbw__term\"\u003ejvale\u003c/i\u003e–queima \u003ci class=\"wbw__term\"\u003ehalāhale\u003c/i\u003e–no veneno viciante \u003ci class=\"wbw__term\"\u003eviṣaya\u003c/i\u003e–deste mundo, [e minha] \u003ci class=\"wbw__term\"\u003emana\u003c/i\u003e–mente \u003ci class=\"wbw__term\"\u003ekabhu nāhi\u003c/i\u003e–nunca \u003ci class=\"wbw__term\"\u003epāya\u003c/i\u003e–encontra [qualquer] \u003ci class=\"wbw__term\"\u003esukha\u003c/i\u003e–satisfação.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEm decorrência de minhas ações anteriores ao contato com o tempo e espaço, eu caí no oceano da existência material, e não vejo nenhum meio de me libertar. Dia e noite meu coração arde no veneno viciante deste mundo, e minha mente nunca encontra qualquer satisfação.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eāśā-pāśa śata śata kleśa deya avirata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epravṛtti-ūrmira tāhe khelā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekāma-krodha-ādi chhaya bāṭapāḍe deya bhaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eavasāna haila āsi’ belā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003epāśa\u003c/i\u003e–As algemas \u003ci class=\"wbw__term\"\u003eśata\u003c/i\u003e–de centenas [e] \u003ci class=\"wbw__term\"\u003eśata\u003c/i\u003e–centenas \u003ci class=\"wbw__term\"\u003eāśā\u003c/i\u003e–de desejos \u003ci class=\"wbw__term\"\u003eavirata\u003c/i\u003e–constantemente \u003ci class=\"wbw__term\"\u003ekleśa deya\u003c/i\u003e–perturbam [me, e] \u003ci class=\"wbw__term\"\u003etāhe\u003c/i\u003e–no meio disso [há] \u003ci class=\"wbw__term\"\u003ekhelā\u003c/i\u003e–movimento \u003ci class=\"wbw__term\"\u003eūrmira\u003c/i\u003e–nas ondas \u003ci class=\"wbw__term\"\u003epravṛtti\u003c/i\u003e–da tendência a desfrutar. \u003ci class=\"wbw__term\"\u003echhaya\u003c/i\u003e–Os seis \u003ci class=\"wbw__term\"\u003ebāṭapāḍe\u003c/i\u003e–bandidos \u003ci class=\"wbw__term\"\u003ekāma\u003c/i\u003e–luxúria \u003ci class=\"wbw__term\"\u003ekrodha\u003c/i\u003e–ódio \u003ci class=\"wbw__term\"\u003eādi\u003c/i\u003e–e assim por diante \u003ci class=\"wbw__term\"\u003ebhaya deya\u003c/i\u003e–atormentam [me, e] \u003ci class=\"wbw__term\"\u003ebelā\u003c/i\u003e–o momento \u003ci class=\"wbw__term\"\u003eavasāna\u003c/i\u003e–de [minha] morte \u003ci class=\"wbw__term\"\u003eāsi’ haila\u003c/i\u003e–chegou.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOs grilhões de centenas e centenas de desejos constantemente me perturbam, e as ondas da tendência a desfrutar vivem me afetando. Os seis bandidos: luxúria, ódio, cobiça, orgulho, ilusão, e inveja me atormentam, e a hora da minha morte chegou.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejñāna-karma ṭhaga dui more pratāriyā lai’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eavaśeṣe phele sindhu-jale\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ee hena samaye bandhu tumi kṛṣṇa kṛpā-sindhu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛpā kari’ tola more bale\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003edui\u003c/i\u003e–Os dois \u003ci class=\"wbw__term\"\u003eṭhaga\u003c/i\u003e–criminosos \u003ci class=\"wbw__term\"\u003ejñāna\u003c/i\u003e–renúncia [e] \u003ci class=\"wbw__term\"\u003ekarma\u003c/i\u003e–exploração \u003ci class=\"wbw__term\"\u003epratāriyā lai’\u003c/i\u003e–têm enganado \u003ci class=\"wbw__term\"\u003emore\u003c/i\u003e–a mim [e] \u003ci class=\"wbw__term\"\u003eavaśeṣe\u003c/i\u003e–finalmente \u003ci class=\"wbw__term\"\u003ephele\u003c/i\u003e–atirado [me] \u003ci class=\"wbw__term\"\u003ejale\u003c/i\u003e–nas águas \u003ci class=\"wbw__term\"\u003esindhu\u003c/i\u003e–do oceano [da existência material] \u003ci class=\"wbw__term\"\u003ehena\u003c/i\u003e–[em] tal \u003ci class=\"wbw__term\"\u003esamaye\u003c/i\u003e–momento \u003ci class=\"wbw__term\"\u003ee\u003c/i\u003e–como este \u003ci class=\"wbw__term\"\u003etumi\u003c/i\u003e–Você \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–Kṛṣṇa \u003ci class=\"wbw__term\"\u003ekṛpā-sindhu\u003c/i\u003e–o oceano de misericórdia, [é meu único] \u003ci class=\"wbw__term\"\u003ebandhu\u003c/i\u003e–amigo. \u003ci class=\"wbw__term\"\u003ekṛpā kari’\u003c/i\u003e–Misericordiosamente \u003ci class=\"wbw__term\"\u003etola\u003c/i\u003e–puxe \u003ci class=\"wbw__term\"\u003emore\u003c/i\u003e–me [para fora] \u003ci class=\"wbw__term\"\u003ebale\u003c/i\u003e–à força.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eOs criminosos: renúncia e exploração, têm me enganado e finalmente me jogaram no oceano da existência material. Em um momento como este, Você, Kṛṣṇa, o oceano de misericórdia, é meu único amigo. Misericordiosamente me resgate à força.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epatita kiṅkare dhari’ pāda-padma-dhūli kari’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edeha bhakti-vinode āśraya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāmi tava nitya dāsa bhuliyā māyāra pāśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebaddha haye āchhi dayāmaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003edhari’\u003c/i\u003e–Tome [Seu] \u003ci class=\"wbw__term\"\u003ekiṅkare\u003c/i\u003e–servo \u003ci class=\"wbw__term\"\u003epatita\u003c/i\u003e–caído [e] \u003ci class=\"wbw__term\"\u003ekari’\u003c/i\u003e–faça [dele] \u003ci class=\"wbw__term\"\u003edhūli\u003c/i\u003e–uma partícula de poeira [aos Seus] \u003ci class=\"wbw__term\"\u003epāda\u003c/i\u003e–pés [de] \u003ci class=\"wbw__term\"\u003epadma\u003c/i\u003e–lótus \u003ci class=\"wbw__term\"\u003edeha\u003c/i\u003e–dê \u003ci class=\"wbw__term\"\u003ebhakti-vinode\u003c/i\u003e–Bhakti Vinod \u003ci class=\"wbw__term\"\u003eāśraya\u003c/i\u003e–abrigo \u003ci class=\"wbw__term\"\u003ebhuliyā\u003c/i\u003e–Esquecendo [que] \u003ci class=\"wbw__term\"\u003eāmi\u003c/i\u003e–eu [sou] \u003ci class=\"wbw__term\"\u003etava\u003c/i\u003e–Seu \u003ci class=\"wbw__term\"\u003enitya\u003c/i\u003e–eterno \u003ci class=\"wbw__term\"\u003edāsa\u003c/i\u003e–servo \u003ci class=\"wbw__term\"\u003ehaye āchhi\u003c/i\u003e–eu estou \u003ci class=\"wbw__term\"\u003ebaddha\u003c/i\u003e–preso \u003ci class=\"wbw__term\"\u003epāśa\u003c/i\u003e–pelas algemas \u003ci class=\"wbw__term\"\u003emāyāra\u003c/i\u003e–da deusa da ilusão \u003ci class=\"wbw__term\"\u003edayāmaya\u003c/i\u003e–Ó misericordioso Senhor!\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTome este Seu servo caído e torne-o uma partícula de poeira aos Seus pés de lótus; dê abrigo a Bhakti Vinod. Tendo esquecido que eu sou Teu servo eterno, estou preso pelos grilhões de Māyā, ó Senhor misericordioso!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-aparadha-phole-mama\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eCanção 6\u003c/h3\u003e\n\u003ch4\u003eŚrīla Bhakti Vinod Ṭhākur\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enayanaṁ galad-aśru-dhārayā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evadanaṁ gadgada-ruddhayā girā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epulakair nichitaṁ vapuḥ kadā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava nāma-grahaṇe bhaviṣyati\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekadā\u003c/i\u003e–Quando [irão meus] \u003ci class=\"wbw__term\"\u003enayanaṁ\u003c/i\u003e–olhos \u003ci class=\"wbw__term\"\u003ebhaviṣyati\u003c/i\u003e–serem [preenchidos] \u003ci class=\"wbw__term\"\u003edhārayā\u003c/i\u003e–com correntes \u003ci class=\"wbw__term\"\u003egalat\u003c/i\u003e–de fluentes \u003ci class=\"wbw__term\"\u003eaśru\u003c/i\u003e–lágrimas, [quando irá minha] \u003ci class=\"wbw__term\"\u003evadanaṁ\u003c/i\u003e–boca [ser] \u003ci class=\"wbw__term\"\u003eruddhayā\u003c/i\u003e–bloqueada por \u003ci class=\"wbw__term\"\u003egadgada\u003c/i\u003e–gaguejantes \u003ci class=\"wbw__term\"\u003egirā\u003c/i\u003e–palavras, [e quando irá meu] \u003ci class=\"wbw__term\"\u003evapuḥ\u003c/i\u003e–corpo [ser] \u003ci class=\"wbw__term\"\u003enichitaṁ\u003c/i\u003e–coberto \u003ci class=\"wbw__term\"\u003epulakair\u003c/i\u003e–com pelos eretos \u003ci class=\"wbw__term\"\u003egrahaṇe\u003c/i\u003e–enquanto canto \u003ci class=\"wbw__term\"\u003etava\u003c/i\u003e–Seus \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–Nomes?\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando lágrimas cairão dos meus olhos, minha voz vacilará e os pelos do meu corpo ficarão em pé ao chamar Seu Nome?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse-subtitle\"\u003eGīti\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eaparādha-phale mama chitta bhela vajra-sama\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etuyā nāme nā labhe vikāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehatāśa ha-iya hari tava nāma uchcha kari\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebaḍa duḥkhe ḍāki bāra bāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ephale\u003c/i\u003e–Como resultado [de] \u003ci class=\"wbw__term\"\u003emama\u003c/i\u003e–minhas \u003ci class=\"wbw__term\"\u003eaparādha\u003c/i\u003e–ofensas, [meu] \u003ci class=\"wbw__term\"\u003echitta\u003c/i\u003e–coração \u003ci class=\"wbw__term\"\u003ebhela\u003c/i\u003e–ficou \u003ci class=\"wbw__term\"\u003esama\u003c/i\u003e–como \u003ci class=\"wbw__term\"\u003evajra\u003c/i\u003e–um trovão, \u003ci class=\"wbw__term\"\u003elabhe nā\u003c/i\u003e–ele não encontra [nenhum] \u003ci class=\"wbw__term\"\u003evikāra\u003c/i\u003e–êxtase [em] \u003ci class=\"wbw__term\"\u003etuyā\u003c/i\u003e–Seu \u003ci class=\"wbw__term\"\u003enāme\u003c/i\u003e–Nome. \u003ci class=\"wbw__term\"\u003ehatāśa ha-iya\u003c/i\u003e–No desespero \u003ci class=\"wbw__term\"\u003ehari\u003c/i\u003e–Ó Senhor \u003ci class=\"wbw__term\"\u003euchcha kari\u003c/i\u003e–eu canto \u003ci class=\"wbw__term\"\u003etava\u003c/i\u003e–Seu \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–Nome. [Com] \u003ci class=\"wbw__term\"\u003ebaḍa\u003c/i\u003e–grande \u003ci class=\"wbw__term\"\u003eduḥkhe\u003c/i\u003e–tristeza \u003ci class=\"wbw__term\"\u003eḍāki\u003c/i\u003e–eu chamo [Seu Nome] \u003ci class=\"wbw__term\"\u003ebāra\u003c/i\u003e–de novo [e] \u003ci class=\"wbw__term\"\u003ebāra\u003c/i\u003e–de novo.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eComo resultado de minhas ofensas, meu coração se endureceu como um trovão, e não experimenta o êxtase quando canto Seu Nome. Desesperado, Oh Senhor, canto Seu Nome. Com grande tristeza, Eu chamo Seu Nome de novo e de novo.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edīna-dayāmaya karuṇā-nidāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhāva-bindu dei rākhaha parāṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003enidāna\u003c/i\u003e–Ó oceano \u003ci class=\"wbw__term\"\u003ekaruṇā\u003c/i\u003e–de misericórdia \u003ci class=\"wbw__term\"\u003edayāmaya\u003c/i\u003e–compassivo \u003ci class=\"wbw__term\"\u003edīna\u003c/i\u003e–com os pobres, \u003ci class=\"wbw__term\"\u003edei\u003c/i\u003e–dê [me] \u003ci class=\"wbw__term\"\u003ebindu\u003c/i\u003e–uma gota \u003ci class=\"wbw__term\"\u003ebhāva\u003c/i\u003e–de amor. \u003ci class=\"wbw__term\"\u003erākhaha\u003c/i\u003e–Salve [minha] \u003ci class=\"wbw__term\"\u003eparāṇa\u003c/i\u003e–vida.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ oceano de misericórdia, compassivo com os pobres, me dê uma gota de amor. Salve minha vida.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekabe tuyā nāma-uchchāraṇe mora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enayane jharaba dara dara lora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekabe\u003c/i\u003e–Quando [irão] \u003ci class=\"wbw__term\"\u003edara dara\u003c/i\u003e–fluxos \u003ci class=\"wbw__term\"\u003elora\u003c/i\u003e–de lágrimas \u003ci class=\"wbw__term\"\u003ejharaba\u003c/i\u003e–derramar [dos] \u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–meus \u003ci class=\"wbw__term\"\u003enayane\u003c/i\u003e–olhos \u003ci class=\"wbw__term\"\u003euchchāraṇe\u003c/i\u003e–quando eu cantar \u003ci class=\"wbw__term\"\u003etuyā\u003c/i\u003e–Seu \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–Nome?\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando rios de lágrimas cairão dos meus olhos quando eu cantar Seu Nome?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egadagada-svara kaṇṭhe upajaba\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emukhe bola ādha ādha bāhirāba\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Quando] \u003ci class=\"wbw__term\"\u003egada-gada-svara\u003c/i\u003e–[uma] voz gaguejante [irá] \u003ci class=\"wbw__term\"\u003eupajaba\u003c/i\u003e–surgir [em minha] \u003ci class=\"wbw__term\"\u003ekaṇṭhe\u003c/i\u003e–garganta? [Quando] \u003ci class=\"wbw__term\"\u003ebola ādha ādha\u003c/i\u003e–[uma] fala balbuciante [irá] \u003ci class=\"wbw__term\"\u003ebāhirāba\u003c/i\u003e–sair \u003ci class=\"wbw__term\"\u003emukhe\u003c/i\u003e–da [minha] boca?\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando minha voz balbuciará? Quando palavras sairão de minha boca?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epulake bharaba śarīra hāmāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esveda-kampa-stambha habe bāra bāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Quando] \u003ci class=\"wbw__term\"\u003ehāmāra\u003c/i\u003e–meu \u003ci class=\"wbw__term\"\u003eśarīra\u003c/i\u003e–corpo \u003ci class=\"wbw__term\"\u003ebharaba\u003c/i\u003e–se cobrirá \u003ci class=\"wbw__term\"\u003epulake\u003c/i\u003e–com os pelos arrepiados? [Quando] \u003ci class=\"wbw__term\"\u003esveda\u003c/i\u003e–suor, \u003ci class=\"wbw__term\"\u003ekampa\u003c/i\u003e–tremor, [e] \u003ci class=\"wbw__term\"\u003estambha\u003c/i\u003e–estupor \u003ci class=\"wbw__term\"\u003ehabe\u003c/i\u003e–ocorrerão \u003ci class=\"wbw__term\"\u003ebāra\u003c/i\u003e–de novo [e] \u003ci class=\"wbw__term\"\u003ebāra\u003c/i\u003e–de novo?\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando meu corpo se arrepiará? Quando vou perspirar, tremer e ficar aturdido de novo e de novo?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evivarṇa-śarīre hārāobu̐ jñāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma-samāśraye dharabu parāṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e[Quando] \u003ci class=\"wbw__term\"\u003ehārāobu̐\u003c/i\u003e–eu vou perder \u003ci class=\"wbw__term\"\u003ejñāna\u003c/i\u003e–a consciência [em um] \u003ci class=\"wbw__term\"\u003evivarṇa\u003c/i\u003e–pálido \u003ci class=\"wbw__term\"\u003eśarīre\u003c/i\u003e–corpo? [Quando meu] \u003ci class=\"wbw__term\"\u003eparāṇa\u003c/i\u003e–coração \u003ci class=\"wbw__term\"\u003edharabu\u003c/i\u003e–tomará \u003ci class=\"wbw__term\"\u003esamāśraye\u003c/i\u003e–abrigo total \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–em [Seu] Nome?\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando eu vou perder a consciência e desmaiar? Quando meu coração irá tomar abrigo pleno em Seu Nome?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emilaba hāmāra kiye aichhe dina\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eroye bhakati-vinoda mati hīna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekiye\u003c/i\u003e–Quando \u003ci class=\"wbw__term\"\u003ehāmāra\u003c/i\u003e–eu [irei] \u003ci class=\"wbw__term\"\u003emilaba\u003c/i\u003e–encontrar \u003ci class=\"wbw__term\"\u003eaichhe\u003c/i\u003e–tal \u003ci class=\"wbw__term\"\u003edina\u003c/i\u003e–dia? \u003ci class=\"wbw__term\"\u003ebhakati-vinoda\u003c/i\u003e–Bhakti Vinod \u003ci class=\"wbw__term\"\u003eroye\u003c/i\u003e–está \u003ci class=\"wbw__term\"\u003ehīna\u003c/i\u003e–desprovido \u003ci class=\"wbw__term\"\u003emati\u003c/i\u003e–de devoção.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eQuando este dia chegará? Bhakti Vinod não tem devoção.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gaite-gaite-nama-ki-doshia-hoilo\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eCanção 7a\u003c/h3\u003e\n\u003ch4\u003eŚrī Chaitanya Mahāprabhu\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyugāyitaṁ nimeṣeṇa chakṣuṣā prāvṛṣāyitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśūnyāyitaṁ jagat sarvaṁ govinda-viraheṇa me\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eviraheṇa\u003c/i\u003e–Em separação \u003ci class=\"wbw__term\"\u003egovinda\u003c/i\u003e–de Govinda \u003ci class=\"wbw__term\"\u003enimeṣeṇa\u003c/i\u003e–um momento \u003ci class=\"wbw__term\"\u003eyugāyitam\u003c/i\u003e–parece uma era, \u003ci class=\"wbw__term\"\u003eme\u003c/i\u003e–meus \u003ci class=\"wbw__term\"\u003echakṣuṣā\u003c/i\u003e–olhos \u003ci class=\"wbw__term\"\u003eprāvṛṣāyitam\u003c/i\u003e–parecem derramar chuva, [e] \u003ci class=\"wbw__term\"\u003esarvam\u003c/i\u003e–todo \u003ci class=\"wbw__term\"\u003ejagat\u003c/i\u003e–mundo \u003ci class=\"wbw__term\"\u003eśūnyāyitam\u003c/i\u003e–parece vazio.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEm separação de Govinda, um momento é sentido como uma era, parece que chove de meus olhos, e sinto que todo o mundo está vazio.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse-subtitle\"\u003eGīti\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egāite gāite nāma ki daśā ha-ila\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e“kṛṣṇa-nitya-dāsa mui” hṛdaye sphurila\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003egāite\u003c/i\u003e–Cantando [e] \u003ci class=\"wbw__term\"\u003egāite\u003c/i\u003e–cantando [Seu] \u003ci class=\"wbw__term\"\u003enāma\u003c/i\u003e–Nome \u003ci class=\"wbw__term\"\u003eki\u003c/i\u003e–qual \u003ci class=\"wbw__term\"\u003edaśā\u003c/i\u003e–condição \u003ci class=\"wbw__term\"\u003eha-ila\u003c/i\u003e–apareceu? [A realização] \u003ci class=\"wbw__term\"\u003e“mui\u003c/i\u003e–“Eu [sou um] \u003ci class=\"wbw__term\"\u003enitya\u003c/i\u003e–eterno \u003ci class=\"wbw__term\"\u003edāsa\u003c/i\u003e–servo \u003ci class=\"wbw__term\"\u003ekṛṣṇa”\u003c/i\u003e–de Kṛṣṇa” \u003ci class=\"wbw__term\"\u003esphurila\u003c/i\u003e–surgiu \u003ci class=\"wbw__term\"\u003ehṛdaye\u003c/i\u003e–em [meu] coração.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eO que me aconteceu enquanto cantava Seu Nome? No meu coração se revelou: “Eu sou um eterno servo de Kṛṣṇa.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejānilāma māyā-pāśe e jaḍa jagate\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egovinda-virahe duḥkha pāi nānā-mate\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ejānilāma\u003c/i\u003e–Eu realizei [que] \u003ci class=\"wbw__term\"\u003ee\u003c/i\u003e–neste \u003ci class=\"wbw__term\"\u003ejagate\u003c/i\u003e–mundo \u003ci class=\"wbw__term\"\u003ejaḍa\u003c/i\u003e–material [e] \u003ci class=\"wbw__term\"\u003epāśe\u003c/i\u003e–[nos] grilhões \u003ci class=\"wbw__term\"\u003emāyā\u003c/i\u003e–da deusa da ilusão \u003ci class=\"wbw__term\"\u003eduḥkha pāi\u003c/i\u003e–sofro [de] \u003ci class=\"wbw__term\"\u003enānā\u003c/i\u003e–várias \u003ci class=\"wbw__term\"\u003emate\u003c/i\u003e–maneiras \u003ci class=\"wbw__term\"\u003evirahe\u003c/i\u003e–em separação \u003ci class=\"wbw__term\"\u003egovinda\u003c/i\u003e–de Govinda.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu descobri que no mundo material e nos grilhões de Māyā sofro de várias maneiras a separação de Govinda.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eāra ye saṁsāra mora nāhi lāge bhāla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekā̐hā yāi’ kṛṣṇa heri e chintā viśāla\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eye\u003c/i\u003e–Este \u003ci class=\"wbw__term\"\u003esaṁsāra\u003c/i\u003e–mundo \u003ci class=\"wbw__term\"\u003enāhi\u003c/i\u003e–não \u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–me \u003ci class=\"wbw__term\"\u003elāge\u003c/i\u003e–atinge \u003ci class=\"wbw__term\"\u003ebhāla\u003c/i\u003e–muito \u003ci class=\"wbw__term\"\u003eāra\u003c/i\u003e–mais. \u003ci class=\"wbw__term\"\u003ekā̐hā\u003c/i\u003e–Onde \u003ci class=\"wbw__term\"\u003eyāi’\u003c/i\u003e–posso ir [e] \u003ci class=\"wbw__term\"\u003eheri\u003c/i\u003e–ver \u003ci class=\"wbw__term\"\u003ekṛṣṇa\u003c/i\u003e–Kṛṣṇa? \u003ci class=\"wbw__term\"\u003ee\u003c/i\u003e–Isso [se tornou minha] \u003ci class=\"wbw__term\"\u003eviśāla\u003c/i\u003e–grande \u003ci class=\"wbw__term\"\u003echintā\u003c/i\u003e–preocupação.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEu não gosto mais deste mundo. Onde posso ir para ver Kṛṣṇa? Esta se tornou minha maior preocupação.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekā̐dite kā̐dite mora ā̐khi variṣaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evarṣā-dhārā hena chakṣe ha-ila udaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003ekā̐dite\u003c/i\u003e–Chorando [e] \u003ci class=\"wbw__term\"\u003ekā̐dite\u003c/i\u003e–chorando \u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–meus \u003ci class=\"wbw__term\"\u003eā̐khi\u003c/i\u003e–olhos \u003ci class=\"wbw__term\"\u003evariṣaya\u003c/i\u003e–derramaram lágrimas. \u003ci class=\"wbw__term\"\u003ehena\u003c/i\u003e–Tais \u003ci class=\"wbw__term\"\u003edhārā\u003c/i\u003e–torrentes \u003ci class=\"wbw__term\"\u003evarṣā\u003c/i\u003e–de chuva \u003ci class=\"wbw__term\"\u003eudaya\u003c/i\u003e\u003ci class=\"wbw__term\"\u003eha-ila\u003c/i\u003e–surgiram \u003ci class=\"wbw__term\"\u003echakṣe\u003c/i\u003e–dos [meus] olhos.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEnquanto eu chorava, meus olhos derramaram lágrimas. Torrentes de chuva caem dos meus olhos.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enimeṣa ha-ila mora śata yuga-sama\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egovinda-viraha āra sahite akṣama\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003enimeṣa\u003c/i\u003e–Um momento \u003ci class=\"wbw__term\"\u003eha-ila\u003c/i\u003e–se tornou \u003ci class=\"wbw__term\"\u003esama\u003c/i\u003e–como \u003ci class=\"wbw__term\"\u003eśata\u003c/i\u003e–centenas [de] \u003ci class=\"wbw__term\"\u003eyuga\u003c/i\u003e–eras \u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–para mim. \u003ci class=\"wbw__term\"\u003eakṣama\u003c/i\u003e–Não posso \u003ci class=\"wbw__term\"\u003esahite\u003c/i\u003e–tolerar [a] \u003ci class=\"wbw__term\"\u003eviraha\u003c/i\u003e–separação \u003ci class=\"wbw__term\"\u003egovinda\u003c/i\u003e–de Govinda \u003ci class=\"wbw__term\"\u003eāra\u003c/i\u003e–mais.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eUm momento parece centenas de eras. Não consigo mais tolerar a separação de Govinda.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśūnya dharā-tala chaudike dekhiye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eparāṇa udāsa haya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eki kari ki kari sthira nāhi haya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejīvana nāhika raya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003edekhiye\u003c/i\u003e–Vendo \u003ci class=\"wbw__term\"\u003etala\u003c/i\u003e–a superfície \u003ci class=\"wbw__term\"\u003edharā\u003c/i\u003e–da Terra \u003ci class=\"wbw__term\"\u003echaudike\u003c/i\u003e–nas quatro direções \u003ci class=\"wbw__term\"\u003eśūnya\u003c/i\u003e–vazia, [meu] \u003ci class=\"wbw__term\"\u003eparāṇa\u003c/i\u003e–coração \u003ci class=\"wbw__term\"\u003ehaya\u003c/i\u003e–está \u003ci class=\"wbw__term\"\u003eudāsa\u003c/i\u003e–apático. \u003ci class=\"wbw__term\"\u003eki\u003c/i\u003e–O que \u003ci class=\"wbw__term\"\u003ekari\u003c/i\u003e–eu deveria fazer? \u003ci class=\"wbw__term\"\u003eki\u003c/i\u003e–o que \u003ci class=\"wbw__term\"\u003ekari\u003c/i\u003e–eu deveria fazer? [Meu coração] \u003ci class=\"wbw__term\"\u003enāhi\u003c/i\u003e–não pode \u003ci class=\"wbw__term\"\u003ehaya\u003c/i\u003e–se tornar \u003ci class=\"wbw__term\"\u003esthira\u003c/i\u003e–estável, [e minha] \u003ci class=\"wbw__term\"\u003ejīvana\u003c/i\u003e–vida \u003ci class=\"wbw__term\"\u003enāhika\u003c/i\u003e–não pode \u003ci class=\"wbw__term\"\u003eraya\u003c/i\u003e–continuar.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVendo a superfície da Terra vazia em todas as direções, meu coração está apático. O que eu deveria fazer? O que eu deveria fazer? Em meu coração não há segurança, e não posso seguir com minha vida.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evraja-vāsi-gaṇa mora prāṇa rākha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edekhāo śrī-rādhā-nāthe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakati-vinoda-minati māniyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elaohe tāhāre sāthe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003evāsi-gaṇa\u003c/i\u003e–Ó residentes \u003ci class=\"wbw__term\"\u003evraja\u003c/i\u003e–de Vraja! \u003ci class=\"wbw__term\"\u003erākha\u003c/i\u003e–Salvem \u003ci class=\"wbw__term\"\u003emora\u003c/i\u003e–minha \u003ci class=\"wbw__term\"\u003eprāṇa\u003c/i\u003e–vida [e] \u003ci class=\"wbw__term\"\u003edekhāo\u003c/i\u003e–mostrem [me] [O] \u003ci class=\"wbw__term\"\u003enāthe\u003c/i\u003e–Senhor \u003ci class=\"wbw__term\"\u003eśrī-rādhā\u003c/i\u003e–[de] Śrī Rādhā. \u003ci class=\"wbw__term\"\u003emāniyā\u003c/i\u003e–Aceitem \u003ci class=\"wbw__term\"\u003eminati\u003c/i\u003e–esta oração \u003ci class=\"wbw__term\"\u003ebhakati-vinoda\u003c/i\u003e–de Bhakti Vinod [e] \u003ci class=\"wbw__term\"\u003elaohe\u003c/i\u003e–levem \u003ci class=\"wbw__term\"\u003etāhāre\u003c/i\u003e–ele \u003ci class=\"wbw__term\"\u003esāthe\u003c/i\u003e–com [Vocês].\u003c/p\u003e\n\u003cp class=\"translation\"\u003eÓ residentes de Vraja! Salvem minha vida e mostrem-me o Senhor de Śrī Rādhā. Aceitem esta oração de Bhakti Vinod e levem-no com vocês.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-kṛṣṇa-viraha āra sahite nā pāri\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eparāṇa chhāḍite āra dina dui chāri\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003epāri nā\u003c/i\u003e–Eu não posso \u003ci class=\"wbw__term\"\u003esahite\u003c
