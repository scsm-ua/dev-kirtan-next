 Senhor\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"akāri\",\"trans\":\"Você manifestou [Seus]\",\"sep\":\" \"},{\"text\":\"bahudhā\",\"trans\":\"vários\",\"sep\":\" \"},{\"text\":\"nija\",\"trans\":\"Nomes\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"sarva\",\"trans\":\"colocou\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"śaktis\",\"trans\":\"todo\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"tatrārpitā\",\"trans\":\"do [Seu] próprio\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"niyamitaḥ\",\"trans\":\"poder\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"smaraṇe\",\"trans\":\"Neles, [e]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"na\",\"trans\":\"não\",\"sep\":\" \"},{\"text\":\"kālaḥ\",\"trans\":\"prescreveu\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"etādṛśī\",\"trans\":\"o momento\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"tava\",\"trans\":\"para lembrar [Deles]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kṛpā\",\"trans\":\"Tal [é]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bhagavan\",\"trans\":\"Sua\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"mamāpi\",\"trans\":\"misericórdia\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"durdaivam\",\"trans\":\"Minha\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"īdṛśam\",\"trans\":\"desventura [é]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"ihājani\",\"trans\":\"tal\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nānurāgaḥ\",\"trans\":\"contudo, [que meu]\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"subtitle\":[\"Gīti\"],\"isLong\":false,\"translation\":\"$undefined\"},{\"number\":\"1\",\"text\":[\"tuhu̐ dayā-sāgara tārayite prāṇī\",\"nāma aneka tuyā śikhāoli āni’\"],\"word_by_word\":[\"**tuh̐u**–Você [é] **sāgara**–um oceano **daya**–de misericórdia. **tārayite**–Para liberar **prāṇī**–as almas **āni’**–Você trouxe **tuyā**–Seus **aneka**–inúmeros **nāma**–Nomes [e] **śikhāoli**–[os] ensinou.\"],\"translation\":[\"Você é um oceano de misericórdia. Para salvar as almas, Você trouxe Seus muitos Nomes a este mundo e ensinou todos a cantá-los.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"tuhu̐\",\"trans\":\"Você [é]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"dayā\",\"trans\":\"um oceano\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"sāgara\",\"trans\":\"de misericórdia\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"tārayite\",\"trans\":\"Para liberar\",\"sep\":\" \"},{\"text\":\"prāṇī\",\"trans\":\"as almas\",\"sep\":\"\"}],[{\"text\":\"nāma\",\"trans\":\"Você trouxe\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"aneka\",\"trans\":\"Seus\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"tuyā\",\"trans\":\"inúmeros\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"śikhāoli\",\"trans\":\"Nomes [e]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"āni\",\"trans\":\"[os] ensinou\",\"sep\":\"’\",\"error\":\"mismatch\"}]]},{\"number\":\"2\",\"text\":[\"sakala śakati dei’ nāme tohārā\",\"grahaṇe rākhali nāhi kāla-vichārā\"],\"word_by_word\":[\"**dei’**–Você colocou **sakala**–todo [Seu] **śakati**–poder [em] **tohārā**–Seus **nāme**–Nomes, [e] **rākhali nāhi**–Você não fez **vichārā**–nenhuma regra **kāla**–quanto ao tempo **grahaṇe**–para cantar.\"],\"translation\":[\"Você colocou todo o Seu poder em Seus Nomes, e Você também não fez quaisquer regras sobre quando cantá-Los.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"sakala\",\"trans\":\"Você colocou\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"śakati\",\"trans\":\"todo [Seu]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"dei\",\"trans\":\"poder [em]\",\"sep\":\"’ \",\"error\":\"mismatch\"},{\"text\":\"nāme\",\"trans\":\"Seus\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"tohārā\",\"trans\":\"Nomes, [e]\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"grahaṇe rākhali\",\"trans\":\"Você não fez\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nāhi\",\"trans\":\"nenhuma regra\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kāla\",\"trans\":\"quanto ao tempo\",\"sep\":\"-\"},{\"text\":\"vichārā\",\"trans\":\"para cantar\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"3\",\"text\":[\"śrī-nāma-chintāmaṇi tohāri samānā\",\"viśve bilāoli karuṇā-nidānā\"],\"word_by_word\":[\"[Seus] **śrī-nāma**–Santos Nomes [são] **chintāmaṇi**–joias que satisfazem desejos **samānā**–iguais **tohāri**–a Você, [e] **bilāoli**–Você [os] distribuiu **viśve**–por todo o mundo, **karuṇā-nidānā**–Ó oceano de misericórdia!\"],\"translation\":[\"Seus Nomes são joias que realizam desejos equivalentes a Você, e Você os distribuiu por todo o mundo, Ó oceano de misericórdia!\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"śrī-nāma\",\"trans\":\"Santos Nomes [são]\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"chintāmaṇi\",\"trans\":\"joias que satisfazem desejos\",\"sep\":\" \"},{\"text\":\"tohāri\",\"trans\":\"iguais\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"samānā\",\"trans\":\"a Você, [e]\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"viśve\",\"trans\":\"Você [os] distribuiu\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bilāoli\",\"trans\":\"por todo o mundo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"karuṇā-nidānā\",\"trans\":\"Ó oceano de misericórdia!\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"4\",\"text\":[\"tuyā dayā aichhana parama udārā\",\"atiśaya manda nātha! bhāga hāmārā\"],\"word_by_word\":[\"**aichhana**–Tal [é] **tuyā**–Sua **doyā**–misericórdia, **parama**–extremamente **udārā**–liberal. **hāmārā**–Minha **bhāga**–fortuna, [contudo,] **nātha!**–Ó Senhor, [é] **atiśaya**–extremamente **manda**–ruim.\"],\"translation\":[\"Tal é Sua misericórdia, extremamente liberal. Eu, porém, Senhor, sou extremamente desafortunado.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"tuyā\",\"trans\":\"Tal [é]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"dayā\",\"trans\":\"Sua\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"aichhana\",\"trans\":\"misericórdia\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"parama\",\"trans\":\"extremamente\",\"sep\":\" \"},{\"text\":\"udārā\",\"trans\":\"liberal\",\"sep\":\"\"}],[{\"text\":\"atiśaya\",\"trans\":\"Minha\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"manda\",\"trans\":\"fortuna, [contudo,]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nātha\",\"trans\":\"Ó Senhor, [é]\",\"sep\":\"! \"},{\"text\":\"bhāga\",\"trans\":\"extremamente\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hāmārā\",\"trans\":\"ruim\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"5\",\"text\":[\"nāhi janamala nāme anurāga mora\",\"bhakti-vinoda-chitta duḥkhe vibhora\"],\"word_by_word\":[\"**mora**–Meu **anurāga**–apego **nāme**–aos [Seus] Nomes **janamala nāhi**–não se desenvolveu. **chitta**–O coração **bhakti-vinoda**–de Bhakti Vinod [está] **vibhora**–cheio **duḥkhe**–de tristeza.\"],\"translation\":[\"Eu não tenho nenhum apego aos Seus Nomes. O coração de Bhakti Vinod está cheio de tristeza.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"nāhi\",\"trans\":\"Meu\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"janamala\",\"trans\":\"apego\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nāme\",\"trans\":\"aos [Seus] Nomes\",\"sep\":\" \"},{\"text\":\"anurāga mora\",\"trans\":\"não se desenvolveu\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"bhakti\",\"trans\":\"O coração\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"vinoda-chitta\",\"trans\":\"de Bhakti Vinod [está]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"duḥkhe\",\"trans\":\"cheio\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"vibhora\",\"trans\":\"de tristeza\",\"sep\":\"\",\"error\":\"mismatch\"}]]}],\"resources\":{\
