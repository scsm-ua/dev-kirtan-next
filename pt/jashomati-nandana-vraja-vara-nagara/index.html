 navanīta-taṣkara\",\"    sundara nanda-gopālā\"],\"translation\":[\"Ele é o guardião dos moradores de Vraja, o destruidor dos demônios e o guardião das vacas de Nanda. Ele é conhecido como ‘Govinda’—Ele que nutre as vacas, os sentidos, os Vedas e o universo—e ‘Mādhava’—o consorte de Śrī Rādhā. Ele é o belo menino vaqueiro de Nanda e um ladrão de manteiga.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"yamunā-taṭa-chara    gopī-vasana-hara\",\"    rāsa-rasika kṛpāmaya\",\"śrī-rādhā-vallabha    vṛndāvana-naṭa-vara\",\"    bhakativinod-āśraya\"],\"translation\":[\"Ele é um espião nas margens do Yamunā e o ladrão das roupas das gopīs. Ele é o desfrutador do rāsa-līlā e a personificação da misericórdia. Ele é o amado de Śrī Rādhā, o grande dançarino de Vṛndāvan e o abrigo de Bhakti Vinod.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-yasomati\"},{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-yasomati-1\"},{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-yasomati-2\"},{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-jasomati\"},{\"title\":{\"en\":\"Srila B.S. Goswami Maharaj\",\"ru\":\"Шрила Б.С. Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcl
