o haribolo bhāi re\"},\"title\":[\"Śrī Nāma Kīrtan 3\"],\"author\":[\"Śrīla Bhakti Vinod Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"haribolo haribolo haribolo bhāi re\",\"hari-nāma aniyāchhe gaurāṅga-nitāi re\",\"    (modera duḥkha dekhe re)\"],\"translation\":[\"Ó irmãos! Cantem: “Hari”! Cantem: “Hari”! Cantem: “Hari”! Gaurāṅga e Nitāi trouxeram o Nome do Senhor. (Oh! Eles veem o nosso sofrimento.)\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"hari-nāma vinā jīvera anya dhana nāi re\",\"hari-nāme śuddha ha’la jagāi-mādhāi re\",\"    (baḍa pāpī chhila re)\"],\"translation\":[\"A alma não possui outra riqueza senão o nome do Senhor. Oh! Jagāi e Mādhāi foram purificados pelo Nome do Senhor (Oh! Eles eram grandes pecadores).\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"michhe māyā-baddha ha’ye jīvana kaṭāi re\",\"(āmi āmāra bale re)\",\"āśā-vaśe ghure’ ghure’ āra kothā yāi re\",\"    (āśāra śeṣa nāi re)\"],\"translation\":[\"Preso por Māyā (reivindicando ‘eu’ e ‘meu’), eu passo minha vida em vão. Oh! Controlado por desejos mundanos, vagando e errando, aonde irei então? (Oh! Os desejos mundanos nunca acabam).\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"hari bale deo bhāi āśāra mukhe chhāi re\",\"(nirāśa ta’ sukha re)\",\"bhoga-mokṣa-vāñchhā chhāḍi’ hari-nāma gāi re\",\"    (śuddha-sattva ha’ye re)\"],\"translation\":[\"Ó irmãos! Cantem: “Hari!” e lancem cinzas no rosto do desejo material. (Oh! Viver sem desejos é felicidade). Abandonando o desejo por prazer mundano e liberação, eu canto o Nome do Senhor (sendo espiritualmente puro).\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"nā cheye-o nāmera guṇe o saba phala pāi re\",\"(tuchchha phaler prayāsa chheḍe re)\",\"vinoda bale yāi la’ye nāmera bālāi re\",\"    (nāmera bālāi chheḍe re)\"],\"translation\":[\"Mesmo sem desejá-los, eu obtenho todos os fins (dharma, artha, kāma e mokṣa) com o poder do Nome. (Oh! Abandone todos os esforços por fins insignificantes). Bhakti Vinod diz: “Eu prossigo removendo os obstáculos ao Nome do Senhor. (Oh! Evite os obstáculos ao Nome do Senhor.)”\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"17:[\"$\",\"$L1e\",null,{\"navMap\":{\"128\":{\"prev\":{\"path\":\"/pt/e-ghora-samsare-podiya-manava/\",\"title\":\"E ghora saṁsāre\"},\"next\":{\"path\":\"/pt/hari-nama-mahamantra-sarva-mantra-sara/\",\"title\":\"Daśa-vidha Nāmāparādha\"}}}}]\n1f:Taf2,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"description\":\"A digital Vaishnava songbook with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPage\",\"@id\":\"https://dev.kirtan.site/pt/haribolo-haribolo-haribolo-bhai-re/\",\"url\":\"https://dev.kirtan.site/pt/haribolo-haribolo-haribolo-bhai-re/\",\"name\":\"Śrī Nāma Kīrtan 3. Śrīla Bhakti Vinod Ṭhākur\",\"inLanguage\":\"pt\",\"description\":\"Śrī Nāma Kīrtan 3 — uma canção vaiṣṇava de Śrīla Bhakti Vinod Ṭhākur com letra, tradução em português e significado palavra por palavra. Do livro «Livro de Kirtan».\",\"breadcrumb\":{\"@id\":\"https://dev.kirtan.site/pt/haribolo-haribolo-haribolo-bhai-re/#breadcrumb\"},\"mainEntity\":{\"@id\":\"https://dev.kirtan.site/pt/haribolo-haribolo-haribolo-bhai-re/#composition\"},\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"}},{\"@type\":\"BreadcrumbList\",\"@id\":\"https://dev.kirtan.site/pt/haribolo-haribolo-haribolo-bhai-re/#breadcrumb\",\"itemListElement\":[{\"@type\":\"ListItem\",\"position\":1,\"name\":\"Livro de Kirtan\",\"item\":\"https://dev.kir
