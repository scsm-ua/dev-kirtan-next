dhar Dev-Goswāmī Mahārāj, [cuja] **tanum**–forma **divya**–divina [é] **añchitam**–adornada **chela**–com vestimentas [da cor] **bālārka**–do sol nascente [e cujo] **vadanam**–discurso [é] **suchanda**–o mais prazeroso [ele é] **ambudhim**–um oceano **vairāgya**–de renúncia [e] **vidyā**–conhecimento [e] **puram**–uma morada **ānanda**–de êxtase **sāndra**–divino **lasitam**–resplendente **subhakti**–com devoção pura [ele é] **nidhim**–um reservatório **śrī-siddhānta**–de conclusões perfeitas **īśvaram**–o líder **nyāsī**–dos tridaṇḍi sannyāsīs, [e] **varam**–o melhor **sārasvatānām**–dos seguidores de Śrīla Saraswatī Ṭhākur [ele é] **eka**–a única **varanam**–escolha **sad**–dos sādhus **śubhadam**–o doador de [toda] bondade, [e] **mad**–meu **eka**–único **śaraṇam**–abrigo.\"],\"translation\":[\"Ofereço minha reverência a meu senhor, Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj. Sua forma divina é adornada de roupas da cor do sol nascente e seu discurso é o mais agradável. Ele é um oceano de renúncia e conhecimento e é uma morada de êxtase divino resplendente de devoção pura. Ele é um reservatório de conclusões perfeitas, o líder dos tri-daṇḍi sannyāsīs, e o melhor dos seguidores de Śrīla Saraswatī Ṭhākur. Ele é a única escolha dos sadhūs, o doador de toda bondade, e meu único abrigo.\"],\"isLong\":true,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"devaṁ\",\"trans\":\"Eu ofereço minha reverência\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"divya\",\"trans\":\"a ele [meu]\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"tanuṁ\",\"trans\":\"senhor\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"suchanda\",\"trans\":\"Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj, [cuja]\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"vadanaṁ\",\"trans\":\"forma\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bālārka\",\"trans\":\"divina [é]\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"chelāñchitaṁ\",\"trans\":\"adornada\",
