hhe\",\"    hena prema parachāra\"],\"translation\":[\"Não há ninguém como Gaurāṅga! Já houve e algum dia haverá um Avatār que distribui amor divino como Ele?\"],\"isLong\":false},{\"text\":[\"(hay ni ār habār nay re)\"],\"translation\":[\"Oh! Nunca houve e nunca haverá!\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"duramati ati    patita pāṣaṇḍī\",\"    prāṇe nā mārila kāre\",\"hari-nāma diye    hṛdaya śodhila\",\"    yāchi giyā ghare ghare\"],\"translation\":[\"Ele não aniquilou os caídos, pecadores ímpios de coração; Ele deu a eles o Nome do Senhor e purificou seus corações. Ele foi de casa em casa e implorou a eles (para aceitar o amor divino).\"],\"isLong\":false},{\"text\":[\"(ke nibi ke nibi bale)\",\"(yeche yeche yeche beḍāy)\"],\"translation\":[\"“Quem irá pegar? Quem irá pegar? Ele sai perguntando, perguntando, e perguntando.”\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"bhava-viriñchira    vāñchhita ye prema\",\"    jagate phelila ḍhāli\",\"    (bhava viriñchira yā vāñchhā kare)\",\"kāṅgale pāiye    khāila nāchiye\",\"    bājāiye karatāli\"],\"translation\":[\"Ele distribuiu livremente por todo o mundo o amor divino que é desejado até mesmo por Brahmā e Śiva. Os pobres receberam e saborearam, dançando e batendo palmas.\"],\"isLong\":false},{\"text\":[\"(karatāli bājāiye)\",\"(gaurahari hari bale    karatāli bājāiye)\"],\"translation\":[\"Batendo palmas! Cantando: “Gaurahari Hari!” e batendo palmas!\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"hāsiye kā̐diye    preme gaḍāgaḍi\",\"    pulake vyāpila aṅga\",\"chaṇḍāle brāhmaṇe    kare kolākuli\",\"    kabe vā chhila e raṅga\"],\"translation\":[\"Cheios de amor divino, eles riram, choraram, e rolaram no chão. Os pelos de seus corpos se arrepiaram. Os brāhmaṇs e os párias se abraçaram. Quando houve alguma vez tais Passatempos?\"],\"isLong\":false},{\"text\":[\"(chaṇḍāle brāhmaṇe    kare kolākuli\",\"    e raṅga kabe vā chhila)\"],\"translation\":[\"Os brāhmaṇs e os párias se abraçaram. Quando houve alguma vez tais Passatempos?\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"ḍākiye hā̐kiye    khola-karatāle\",\"    gāiye dhāiye phire\",\"dekhiyā śamana    tarāsa pāiye\",\"    kapāṭa hānila dvāre\"],\"translation\":[\"Uivando e gritando, eles cantaram e correram com mṛdaṅgas e kartāls. Vendo isso, Yamarāj ficou com medo e fechou suas portas e janelas.\"],\"isLong\":false},{\"text\":[\"(bhaja bhaja gaurahari yā̐ra nāme śamaṇa palāy)\"],\"translation\":[\"Sirva! Sirva Gaurahari! Yamarāj foge de Seu Nome.\"],\"isLong\":false},{\"text\":[\"e tina bhuvana    ānande bharila\",\"    uṭhila maṅgala-sora\"],\"translation\":[\"Os três mundos se encheram de alegria, e um tumulto auspicioso surgiu.\"],\"isLong\":false},{\"text\":[\"(ānander ār sīmā nāi re)\",\"(gauraharir āgamane    ānander ār sīmā nāi re)\",\"(nirānanda dūre gela    ānander ār sīmā nāi re)\",\"(gauraharir āgamane    premānander udaya hala)\",\"(premānander udaya hala    sabāi mile haribola)\"],\"translation\":[\"Não há limite para a nossa alegria! Com a chegada de Gaurahari, não há limite para a nossa alegria! Toda infelicidade desapareceu, e não há limite para a nossa alegria! Com a chegada de Gaurahari, a alegria do amor divino surgiu, e todos juntos cantam: “Hari!”\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"kahe premānanda    emana gaurāṅge\",\"    rati nā janmila mora\"],\"translation\":[\"Premānanda diz: “Eu nunca desenvolvi apego pelo Senhor Gaurāṅga.”\"],\"isLong\":false},{\"text\":[\"(āmār rati-mati hala nā ye)\",\"(eman dayāl prabhu avatāre, āmār rati-mati hala nā re)\",\"(eman dayāl prabhu esechhila, āmār rati-mati hala nā re)\",\"(gaurahari hari bala)\"],\"translation\":[\"Eu nunca desenvolvi apego. Eu nunca desenvolvi apego a este mais misericordioso Senhor. Este mais misericordioso Senhor veio, mas eu nunca desenvolvi apego a Ele. Oh! Cante: “Gaurahari!”\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1a:[\"$\",\"$L22\",null,{\"navMap\":{\"82\":{\"prev\":{\"path\":\"/pt/vimala-hemajin-tanu-anupama-re/\",\"title\":\"Vimala hema jini\"},\"next\":{\"path\":\"/pt/ke-jabi-ke-jabi-bhai-bhava-sindhu-para/\",\"title\":\"Ke yābi ke yābi\"}}}}]\n23:Tc46,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"description\":\"A digital Vaishnava songbook with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPage\",\"@id\":\"https://dev.kirtan.site/pt/emona-gauranga-bine-nahi-ara/\",\"url\":\"https://dev.kirtan.site/pt/emona-gauranga-bine-nahi-ara/\",\"name\":\"Emona Gaurāṅga bine nāhi āra. Śrīla Premānanda Dās\",\"inLanguage\":\"pt\",\"description\":\"Emona Gaurāṅga bine nāhi āra — uma canção vaiṣṇava de Śrīla Premānanda Dās com letra, tradução em português e significado palavra por palavra. Do livro «Livro de Kirtan».\",\"breadcrumb\":{\"@id\":\"https://dev.kirtan.site/pt/emona-gauranga-bine-nahi-ara/#breadcrumb\"},\"mainEntity\":{\"@id\":\"https://dev.kirtan.site/pt/emona-gauranga-bine-nahi-ara/#composition\"},\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"}},{\"@type\":\"BreadcrumbList\",\"@id\":\"https://dev.kirtan.site/pt/emona-gauranga-bine-nahi-ara/#breadcrumb\",\"itemListElement\":[{\"@type\":\"ListItem\",\"position\":1,\"name\":\"Livro de Kirtan\",\"item\":\"https://dev.kirtan.site/pt/\"},{\"@type\":\"ListItem\",\"position\":2,\"name\":\"Conteúdo\",\"item\":\"https://dev.kirtan.site/pt/contents/\"},{\"@type\":\"ListItem\",\"position\":3,\"name\":\"Emona Gaurāṅga bine nāhi āra\"}]},{\"@type\":\"MusicComposit
