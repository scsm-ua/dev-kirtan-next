translation\":[\"Sirva! Sirva! Minha mente é tão tola. Não há outra maneira a não ser serviço! Ó minha mente tola! Não há outra maneira a não ser serviço. Sirva os pés de lótus de Rādhā–Kṛṣṇa em Vṛndāvan. Abandone o conhecimento e a ação mundanos! Siga o caminho do amor divino e abandone o conhecimento e a ação mundanos!\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"(bhaja) gaura-gadādharādvaita-guru-nityānanda\",\"    (gaura-kṛṣṇe abhed jene)\",\"    (guru kṛṣṇa-priya jene gaura-kṛṣṇe abhed jene re) śrīnivāsa, haridāsa, murāri, mukunda\",\"    (gaura-preme smara smara re)\",\"    (śrīnivāsa, haridāse, gaura-preme smara smara re)\"],\"translation\":[\"Sirva Gaurāṅga, Gadādhar, Advaita, Nityānanda e Śrī Guru. Saiba que Gaurāṅga e Kṛṣṇa são não diferentes, e que Śrī Guru é o devoto querido de Kṛṣṇa. Lembre-se de Śrīvās Ṭhākur, Hari Dās Ṭhākur, Murāri Gupta e Mukunda Datta. Com amor por Gaurāṅga, lembre-se sempre deles. Com amor por Gaurāṅga, lembre-se de Śrīvās Ṭhākur e de Hari Dās Ṭhākur.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"rūpa-sanātana-jīva-raghunātha-dvandva\",\"    (yadi bhajan karbe re)\",\"    (rūpa-sanātane smara yadi bhajan karbe re)\",\"rāghava-gopāla-bhaṭṭa-svarūpa-rāmānanda\",\"    (kṛṣṇa prema yadi chāo re)\",\"    (svarūpa-rāmānande smara kṛṣṇa-prema yadi chāo re)\"],\"translation\":[\"Lembre-se de Rūpa Goswāmī, Sanātan Goswāmī, Jīva Goswāmī, Raghunāth Bhaṭṭa Goswāmī e Raghunāth Dās Goswāmī. Se você quiser servir, então lembre-se de Śrī Rūpa e de Śrī Sanātan. Lembre-se de Rāghava Paṇḍit, Gopāl Bhaṭṭa Goswāmī, Svarūp Dāmodar e Rāmānanda Rāy. Se você quer Kṛṣṇa-prema, então lembre-se de Svarūp Dāmodar e de Rāmānanda Rāy.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"goṣṭhī-saha karṇapura sena-śivānanda\",\"    (ajasra smara smara re)\",\"goṣṭhī-saha sena śivānande ajasra smara re)\",\"rūpānuga sādhu-jana bhajana-ānanda\",\"    (vraje vās yadi chāo re)\",\"(rūpānuga sādhu-jane smara vraje vās yadi chāo re)\"],\"translation\":[\"Se lembre de Kavi Karṇapur, Śivānanda Sen, e suas famílias. Se lembre sempre deles! Se lembre sempre de Śivānanda Sen e sua família. Se lembre dos sādhus que seguem Śrī Rūpa e da alegria que sentem em seu serviço. Se você deseja residir em Vraja, então lembre-se dos sādhus que seguem Śrī Rūpa.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-bhajare\"},{\"title\":{\"en\":\"Caracas temple\",\"ru\":\"Храм г.Каракас\",\"ua\":\"Храм м.Каракас\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/shchsm-karakas-bxadzha-re-amar\"},{\"title\":{\"en\":\"Srila B.B. Avadhut Maharaj\",\"ru\":\"Шрила Б.Б. Авадхут Махарадж\",\"ua\":\"Шріла Б.Б. Авадгут Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/avadxut-maxaradzh-bxadzha-re\"},{\"title\":{\"en\":\"Bhakti Lalita Devi\",\"ru\":\"Бхакти Лалита Деви\",\"ua\":\"Бгакті Лаліта Деві\"},\"embed_url\":\"https://soundcloud.com/bhakti-lalita-devi/bhakti-lalita-devi-bhajan-giti-bhaja-re-bhaja-re-amar\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1a:[\"$\",\"$L23\",null,{\"audio\":\"$19:props:song:resources:audio\",\"caption\":\"Ouvir áudio:\",\"language\":\"pt\"}]\n1b:[\"$\",\"$L24\",null,{\"navMap\":{\"57\":{\"prev\":{\"path\":\"/pt/shri-krishna-chaitanya-prabhu-jive-daya-kori/\",\"title\":\"Invocação Auspiciosa a Śaraṇāgati\"},\"next\":{\"path\":\"/pt/vibhavari-shiesha-aloka-praveshia/\",\"title\":\"Vibhāvarī Śeṣa\"}}}}]\n25:T1241,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\"
