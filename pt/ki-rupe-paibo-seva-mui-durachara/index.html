,\"text\":[\"ki-rūpe pāiba sevā muñi durāchāra\",\"śrī-guru-vaiṣṇave rati nā haila āmāra\"],\"translation\":[\"Como irei obter serviço? Sou um pecador e não tenho apego a Śrī Guru ou aos Vaiṣṇavas.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"aśeṣa māyāte mana magana ha-ila\",\"vaiṣṇavete leśa-mātra rati nā janmila\"],\"translation\":[\"Minha mente tem estado imersa em uma ilusão sem fim. Eu não tenho nenhum traço de apego aos Vaiṣṇavas.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"viṣaye bhuliyā andha ha-inu divā-niśi\",\"gale phā̐sa dite phere māyā se piśāchī\"],\"translation\":[\"Imerso no mundano dia e noite, eu me esqueci de você e fiquei cego. A bruxa Māyā veio para colocar um nó em volta do meu pescoço.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"māyāre kariyā jaya chhāḍāna nā yāya\",\"sādhu-kṛpā vinā āra nāhika upāya\"],\"translation\":[\"É impossível superar e deixar Māyā para trás sem a misericórdia dos sādhus. Não há outra maneira.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"adoṣa-daraśi-prabhu patita-uddhāra\",\"ei-bāra narottame karaha nistāra\"],\"translation\":[\"Ó mestre que não considera minhas faltas! Ó salvador dos caídos! Desta vez liberte Narottam Dās.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.N. Acharya Maharaj\",\"ru\":\"Шрила Б.Н. Ачарья Махарадж\",\"ua\":\"Шріла Б.Н. Ачарʼя Махарадж\"},\"embed_url\":\"https://soundcloud.com/kostya-netrebenko/015-kirupepaibaseva-7\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1f:[\"$\",\"$L28\",null,{\"audio\":\"$1e:props:song:resources:audio\",\"caption\":\"Ouvir áudio:\",\"language\":\"pt\"}]\n20:[\"$\",\"$L29\",null,{\"navMap\":{\"67\":{\"prev\":{\"path\":\"/pt/thakura-vaishnava-gana-kori-ei-nivedana/\",\"title\":\"Ṭhākura-vaiṣṇava-gaṇa\"},\"next\":{\"path\":\"/pt/thakura-vaishnava-pada-avanira/\",\"title\":\"Ṭhākura-vaiṣṇa
