uosas e cumprem os desejos daqueles que dissipam os receios das almas. Eternamente eu ofereço minha reverência aos adoráveis pés do meu mestre.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"bhajanorjita-sajana-saṅgha-patiṁ\",\"patitādhika-kāruṇikaika-gatim\",\"gati-vañchita-vañchakāchintya-padaṁ\",\"praṇamāmi sadā prabhupāda-padam\"],\"translation\":[\"Ele é o líder das grandes almas que são dotadas de devoção e o único, grandiosamente misericordioso abrigo dos caídos. Seus inconcebíveis pés são o abrigo até mesmo dos enganadores, enganando-os. Eternamente eu ofereço minha reverência aos pés de lótus do meu mestre.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"atikomala-kāñchana-dīrgha-tanuṁ\",\"tanu-nindita-hema-mṛṇāla-madam\",\"madanārvuda-vandita-chandra-padaṁ\",\"praṇamāmi sadā prabhupāda-padam\"],\"translation\":[\"Sua longa, flexível, e dourada forma esmaga o orgulho dos caules dourados das lótus. Seus pés que são como luas, são adorados por milhões de cupidos. Eternamente eu ofereço minha reverência a eles.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"nija-sevaka-tāraka-rañji-vidhuṁ\",\"vidhutāhita-huṅkṛta-siṁha-varam\",\"varaṇāgata-bāliśa-śanda-padaṁ\",\"praṇamāmi sadā prabhupāda-padam\"],\"translation\":[\"Ele é a lua que encanta seus servos, que são como estrelas. Seu grande rugido, que é como o de um leão, afugenta o inimigo. Seus pés concedem auspiciosidade sobre os simples que os aceitam. Eternamente eu ofereço minha reverência aos pés do meu mestre.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"vipulīkṛta-vaibhava-gaura-bhuvaṁ\",\"bhuvaneṣu vikīrtita-gaura-dayam\",\"dayanīya-gaṇārpita-gaura-padaṁ\",\"praṇamāmi sadā prabhupāda-padam\"],\"translation\":[\"Ele revela a glória divina de Śrī Gaura Dhām, propõe a celebrada graça de Śrī Gaura em todo o mundo, e instala Śrī Gaura dentro dos corações dos destinatários de sua graça. Eternamente eu ofereço minha reverência aos pés do meu mestre.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"chira-gaura-janāśraya-viśva-guruṁ\",\"guru-gaura-kiśoraka-dāsya-param\",\"paramādṛta-bhaktivinoda-padaṁ\",\"praṇamāmi sadā prabhupāda-padam\"],\"translation\":[\"Ele é o refúgio eterno das almas rendidas a Śrī Gaura e ao Guru do universo. Ele é dedicado ao serviço de seu Guru, Śrīla Gaura Kiśor, e completamente dedicado a Śrīla Bhakti Vinod. Eternamente eu ofereço a minha reverência aos pés do meu mestre.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"raghu-rūpa-sanātana-kīrtti-dharaṁ\",\"dharaṇī-tala-kīrttita-jīva-kavim\",\"kavirāja-narottama-sakhya-padaṁ\",\"praṇamāmi sadā prabhupāda-padam\"],\"translation\":[\"Ele mostra a glória de Śrī Rūpa, Śrī Sanātan e Śrī Raghunāth. Neste mundo ele é glorificado como sendo não diferente de Śrī Jīva e o complemento direto de Śrīla Kṛṣṇadās Kavirāj e Śrīla Narottam Ṭhākur. Eternamente eu ofereço minha reverência aos pés do meu mestre.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"kṛpayā hari-kīrtana-mūrti-dharaṁ\",\"dharaṇī-bhara-hāraka-gaura-janam\",\"janakādhika-vatsala-snigdha-padaṁ\",\"praṇamāmi sadā prabhupāda-padam\"],\"translation\":[\"Ele é a personificação do Hari-kīrtan. Ele misericordiosamente alivia a Mãe Terra do peso em cima dela. Ele é um associado de Śrī Gaura, e mais amável e afetuoso do que um pai. Eternamente eu ofereço minha reverência aos pés do meu mestre.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"śaraṇāgata-kiṅkara-kalpa-taruṁ\",\"taru-dhik-kṛta dhīra vadānya varam\",\"varadendra-gaṇārchita-divya-padaṁ\",\"praṇamāmi sadā prabhupāda-padam\"],\"translation\":[\"Ele é uma árvore dos desejos para os servos rendidos. Sua benevolência e tolerância envergonham até a benevolência e tolerância de uma árvore. Os semideuses e sábios adoram seus divinos pés. Eternamente eu ofereço minha reverência aos pés do meu mestre.\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"parahaṁsa-varaṁ paramārtha-patiṁ\",\"patitodharaṇe kṛta-veśa-yatim\",\"yati-rāja-gaṇaiḥ parisevya-padaṁ\",\"praṇamāmi sadā prabhupāda-padam\"],\"translation\":[\"Ele é o melhor dos paramahaṁsas e o guardião da riqueza suprema (Kṛṣṇa-prema). Ele aceitou as vestes de um sannyāsī para libertar os caídos. Seus pés são servidos pelos melhores dos sannyāsīs. Eternamente eu ofereço minha reverência aos pés do meu mestre.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"vṛṣabhānu-sutā-dayitānucharaṁ\",\"charaṇāśrita-reṇu-dharas tam aham\",\"mahad-adbhuta-pāvana-śakti-padaṁ\",\"praṇamāmi sadā prabhupāda-padam\"],\"translation\":[\"Ele é o amado servo de Śrīmatī Rādhārāṇī. Eu seguro em minha cabeça a poeira de seus tremendos, maravilhosamente purificantes pés, e eternamente ofereço minha reverência a eles.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-sri-sri\"},{\"title\":{\"en\":\"Srila B.B. Avadhut Maharaj\",\"ru\":\"Шрила Б.Б. Авадхут Махарадж\",\"ua\":\"Шріла Б.Б. Авадгут Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/avadxut-maxaradzh-prabxupada\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"22:[\"$\",\"$L2b\",null,{\"audio\":\"$21:props:song:resources:audio\",\"caption\":\"Ouvir áudio:\",\"language\":\"pt\"}]\n23:[\"$\",\"$L2c\",null,{\"navMap\":{\"159\":{\"prev\":{\"path\":\"/pt/yoga-pithopari-sthita-ashta-sakhi-subeshtita/\",\"title\":\"8b. yoga-pīṭhopari-sthita\"},\"next\":{\"path\":\"/pt/deva-siddha-mukta-yukta-bhakta-vrinda/\",\"title\":\"1-10. Sábado\"}}}}]\n2d:T10ab,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@ty
