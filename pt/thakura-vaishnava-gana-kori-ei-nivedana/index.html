dhama durāchāra\",\"dāruṇa-saṁsāra-nidhi    tāhe ḍubāila vidhi\",\"    keśe dhari’ more kara pāra\"],\"translation\":[\"Ó adoráveis Vaiṣṇavas, eu ofereço-lhes esta oração. Eu sou muito caído e mal comportado. O destino me mergulhou no temível oceano da existência material. Por favor, agarre-me pelo cabelo e me puxe para a margem.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"vidhi baḍa balavān    nā śune dharama-jñāna\",\"    sadāi karama-pāśe bāndhe\",\"nā dekhi tāraṇa    leśa yata dekhi saba kleśa\",\"    anātha kātare te̐i kānde\"],\"translation\":[\"O destino é muito poderoso. Ele não escuta o conhecimento que tenho da religião, e sempre me prende com as cordas do karma. Não vejo nem um traço de esperança. Tudo o que vejo é dificuldade. Portanto desamparado e angustiado, eu choro.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"kāma, krodha, lobha, moha, mada, abhimāna saha\",\"    āpana āpana sthāne ṭāne\",\"aichāna āmāra mana    phire yena andha jana\",\"    supatha vipatha nāhi jāne\"],\"translation\":[\"Luxúria, raiva, cobiça, ilusão, orgulho e ego me puxam em suas próprias direções. Assim minha mente vagueia como um homem cego que não sabe a diferença entre o caminho correto e o caminho errado.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"nā la-inu sat mata    asate majila chita\",\"    tuyā pāye nā karinu āśa\",\"narottama dāse kaya    dekhi’ śuni’ lage bhaya\",\"    tarāiyā laha nija pāśa\"],\"translation\":[\"Eu nunca aceitei a concepção apropriada. Minha mente tem estado imersa na ilusão, e eu nunca aspirei aos seus pés. Narottam Dās diz: “Vendo e ouvindo sobre minha situação, estou paralisado de medo. Por favor me resgate e me mantenha ao seu lado.”\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":\"Nabadwip temple\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-thakura-vaisnava\",\"personSlug\":\"nabadwip-temple\"},{\"title\":\"Srila B.K. Ashram Maharaj\",\"embed_url\":\"https://soundcloud.com/scsmathcolombia/10-thakura-vaisnava-gana\",\"personSlug\":\"srila-b-k-ashram-maharaj\"},{\"title\":\"Manasa Krishna Prabhu\",\"embed_url\":\"https://soundcloud.com/huron/thakura-vaisnava-gana\",\"personSlug\":\"manasa-krishna-prabhu\"},{\"title\":\"Bhakti Lalita Devi\",\"embed_url\":\"https://soundcloud.com/bhakti-lalita-devi/bhakti-lalita-devi-thakura-vaishnava-gana\",\"personSlug\":\"bhakti-lalita-devi\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false},\"telegraphUrl\":\"https://telegra.ph/Ṭhākura-vaiṣṇava-gaṇa-08-30\"},\"head\":{\"canonical\":\"/pt/thakura-vaishnava-gana-kori-ei-nivedana/\",\"description\":\"Ṭhākura-vaiṣṇava-gaṇa — uma canção vaiṣṇava de Śrīla Narottam Dās Ṭhākur com letra, tradução em português e significado palavra por palavra. Do livro «Livro de Kirtan».\",\"title\":\"Ṭhākura-vaiṣṇava-gaṇa. Śrīla Narottam Dās Ṭhākur | Kirtan Site\"},\"kind\":\"song\",\"route\":{\"kind\":\"item\",\"bookId\":\"pt\",\"slug\":\"thakura-vaishnava-gana-kori-ei-nivedana\"}}}]}]]}]\n"])</script></body></html>
