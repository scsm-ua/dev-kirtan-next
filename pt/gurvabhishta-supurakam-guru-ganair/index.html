Śrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj\"],\"author\":[\"Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\"],\"verses\":[{\"text\":[\"gurv-ābhīṣṭa-supūrakaṁ guru-gaṇair āśīṣa-saṁbhūṣitaṁ\",\"chintyāchintya-samasta-veda-nipuṇaṁ śrī-rūpa-panthānugam\",\"govindābhidham ujjvalaṁ vara-tanuṁ bhakty anvitaṁ-sundaraṁ\",\"vande viśva-guruñ cha divya-bhagavat-premṇo hi bīja-pradam\"],\"word_by_word\":[\"**vande**–Eu ofereço [minha] reverência [a ele que] **supūrakam**–satisfaz [os] **ābhīṣṭa**–estimados desejos [de seu] **guru**–Guru [e que é] **saṁbhūṣitam**–plenamente adornado **āśīṣa**–com as bençãos **gaṇaiḥ**–dos associados [de seu] **guru**–Guru. [Ele é] **nipuṇam**–o ‘expert’ **samasta**–em todos [os aspectos] **veda**–dos Vedas, [tanto] **chintya**–concebíveis [quanto] **achintya**–inconcebíveis [e é] **anugam**–o [preeminente] seguidor **panthā**–[do] caminho **śrī-rūpa**–de Śrī Rūpa. **abhidham**–De nome **govinda**–‘Govinda’ (Śrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj) [cuja] **sundaram**–bela **ujjvalam**–refulgente, [e] **vara**–exaltada **tanuṁ**–forma [é] **anvitam**–infundida **bhakti**–de devoção. [Ele é] **gurum**–o mestre espiritual **viśva**–do universo **cha**–e **hi**–certamente **pradam**–o doador **bīja**–da semente **premṇaḥ**–do amor **divya**–divino **bhagavat**–ao Senhor Supremo.\"],\"translation\":[\"Ofereço minha reverência a ele que satisfaz perfeitamente os desejos mais estimados de seu Guru e que é plenamente adornado com as bênçãos dos associados de seu Guru. Ele é perito em todos os aspectos do conhecimento Védico, tanto concebíveis quanto inconcebíveis, e é o preeminente seguidor da linha de Śrīla Rūpa Goswāmī Prabhu. Ele é conhecido como ‘Govinda’(Śrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj) e sua bela, refulgente, e exaltada forma é infundida de devoção. Ele é o Guru do universo inteiro, e o doador da semente do amor divino ao Senhor Supremo.\"],\"isLong\":true,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{
