dana    nitāi-era prāṇa-dhana\",\"    advaitera prapūjita gorā\",\"nimāi viśvambhara    śrīnivāsa-īśvara\",\"    bhakta-samūha chita-chorā\"],\"translation\":[\"Ele é a alegria de Gadadhar e a vida e riqueza de Nitāi. Ele é adorado por Advaita Āchārya. Ele é conhecido como Nimāi, e é o mantenedor do universo. Ele é o Senhor de Śrīvās Ṭhākur, e Ele rouba os corações dos devotos.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"nadīyā śaśadhara    māyāpura-īśvara\",\"    nāma-pravartana-śūra\",\"gṛhī-jana-śikṣaka    nyāsi-kula-nāyaka\",\"    mādhava rādhā-bhāva-pūra\"],\"translation\":[\"Ele é a lua de Nadia, o Senhor de Māyāpur, e o inaugurador do Hari-nām-saṅkīrtan. Ele é o mestre dos chefes de família e o líder dos sannyāsīs. Ele é Mādhava repleto do coração de Rādhā.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"sārvabhauma-śodhana    gajapati-tāraṇa\",\"    rāmānanda-poṣaṇa vīra\",\"rūpānanda-vardhana    sanātana-pālana\",\"    haridāsa-modana dhīra\"],\"translation\":[\"Ele é o purificador de Sārvabhauma Bhaṭṭāchārya e o libertador de Mahārāj Pratāparudra. Ele é o mantenedor de Rāmānanda Rāy e o herói de todos. Ele é o guardião de Śrīla Sanātan Goswāmī e a alegria de Śrīla Rūpa Goswāmī. Ele é o deleite de Haridās Ṭhākur e é perfeitamente sóbrio.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"vraja-rasa-bhāvana    duṣṭa-mata-śātana\",\"    kapaṭī-vighātana-kāma\",\"śuddha bhakta-pālana    śuṣka-jñāna-tāḍana\",\"    chhala-bhakti-dūṣaṇa rāma\"],\"translation\":[\"Ele é absorto nos rasas de Vraja. Ele é o dissipador do equívoco, da luxúria e do engano. Ele é o mantenedor dos devotos puros e o dissipador do conhecimento seco. Ele é o erradicador da pseudo devoção e o reservatório de todo o prazer.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.K. Ashram Maharaj\",\"ru\":\"Шрила Б.К. Ашрам Махарадж\",\"ua\":\"Шріла Б.К. Ашрам Махарадж\"},\"embed_url\":\"https://soundcloud.com/scsmathcolombia/5-prabhati-giti\"},{\"title\":{\"en\":\"Srila B.B. Avadhut Maharaj\",\"ru\":\"Шрила Б.Б. Авадхут Махарадж\",\"ua\":\"Шріла Б.Б. Авадгут Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/avadxut-maxaradzh-utrennee-6\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"35:[\"$\",\"$L3e\",null,{\"audio\":\"$34:props:song:resources:audio\",\"caption\":\"Ouvir áudio:\",\"language\":\"pt\"}]\n36:[\"$\",\"$L3f\",null,{\"navMap\":{\"21\":{\"prev\":{\"path\":\"/pt/jaya-jaya-girirajer-arotiko-shobha/\",\"title\":\"Śrī Śrī Girirāj Govardhan Ārati\"},\"next\":{\"path\":\"/pt/jashomati-nandana-vraja-vara-nagara/\",\"title\":\"Śrī Nām-kīrtan\"}}}}]\n40:T761,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"CollectionPage\",\"@id\":\"https://dev.kirtan.site/pt/kali-kukkura-kadana-jadi-chao-he\",\"url\":\"https://dev.kirtan.site/pt/kali-kukkura-kadana-jadi-chao-he\",\"name\":\"Prabhāti Gīti. Śrīla Bhakti Vinod Ṭhākur\",\"inLanguage\":\"pt\",\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"}},{\"@type\":\"MusicComposition\",\"@id\":\"https://dev.kirtan.site/pt/kali-kukkura-kadana-jadi-chao-he#composition\",\"alternateName\":[\"kali-kukkura-kadana yadi chāo he\"],\"name\":\"Prabhāti Gīti. Śrīla Bhakti Vinod Ṭhākur\",\"url\":\"https://dev.kirtan.site/pt/kali-kukkura-kadana-jadi-chao-he\",\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"},\"about\":[{\"@type\":\"Thing\",\"name\":\"Bhakti Yoga\"},{\"@type\":\"Thing\",\"name\":\"Gaudiya Vaishnavism\"}],\"genre\":[\"Devotional\",\"Bhajan\",\"Kirtan\"],\"mainEntityOfPage\":{\"@id\":\"https://dev.kirtan.site/pt/kali-kukkura-kadana-jadi-chao-he\"},\"audio\":[{\"@type\":\"MusicRecording\",\"name\":\"Prabhāti Gīti. Śrīla Bhakti Vinod Ṭhākur\",\"url\":\"https://soundcloud.com/scsmathcolombia/5-prabhati-giti\",\"byArtist\":{\"@type\":\"Person\",\"name\":{\"en\":\"Srila B.K. As
