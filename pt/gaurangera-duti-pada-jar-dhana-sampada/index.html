okId\":\"pt\",\"label\":\"Mostrar tradução\",\"song\":{\"meta\":{\"page\":77,\"first_line\":\"gaurāṅgera duṭi pada\"},\"title\":[\"Sāvaraṇa-Śrī-Gaura-mahimā\"],\"author\":[\"Śrīla Narottam Dās Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"gaurāṅgera duṭi pada    yāra dhana sampada\",\"    se jāne bhakati-rasa-sāra\",\"gaurāṅgera madhura-līlā    yāra karṇe praveśilā\",\"    hṛdaya nirmala bhela tāra\"],\"translation\":[\"Aquele cuja fortuna são os pés de Śrī Gaurāṅga conhece a essência do rasa da devoção. O coração daquele que escuta os doces Passatempos de Śrī Gaurāṅga se torna puro.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"ye gaurāṅgera nāma laya    tāra haya premodaya\",\"    tāre muñi yāi balihāri\",\"gaurāṅga-guṇete jhure    nitya-līlā tāre sphure\",\"    se jana bhakati-adhikārī\"],\"translation\":[\"Aquele que canta os nomes de Śrī Gaurāṅga desenvolve amor divino. A ele eu digo: “Bravo!” Os eternos Passatempos são revelados àquele que chora sobre as qualidades de Śrī Gaurāṅga. Tal alma é qualificada para devoção.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"gaurāṅgera saṅgi-gaṇe    nitya-siddha kari māne\",\"    se yāya vrajendra-suta-pāśa\",\"śrī-gauḍa-maṇḍala-bhūmi    yebā jāne chintāmaṇi\",\"    tāra haya vraja-bhūme vāsa\"],\"translation\":[\"Aquele que considera que os associados de Śrī Gaurāṅga são eternamente liberados atinge Kṛṣṇa. Aquele que sabe que a terra sagrada de Gauḍa é feita da pedra preciosa que satisfaz os desejos (espirituais), reside na terra de Vraja.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"gaura-prema-rasārṇave    se taraṅge yebā ḍube\",\"    se rādhā-mādhava-antaraṅga\",\"gṛhe vā vanete thāke    ‘hā gaurāṅga’ bale ḍāke\",\"    narottama māge tāra saṅga\"],\"translation\":[\"Aquele que nada nas ondas do oceano nectáreo do amor divino por Śrī Gaura é um associado íntimo de Śrī Śrī Rādhā–Mādhava. Se ele vive em uma casa ou na floresta, Narottam Dās implora pela associação daquele que chama: “Gaurāṅga!”\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/kostya-netrebenko/25-gaurangera-duti-pada-3\"},{\"title\":{\"en\":\"Caracas temple\",\"ru\":\"Храм г.Каракас\",\"ua\":\"Храм м.Каракас\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/shchsm-karakas-gaurangera-duti\"},{\"title\":{\"en\":\"Bhakti Lalita Devi\",\"ru\":\"Бхакти Лалита Деви\",\"ua\":\"Бгакті Лаліта Деві\"},\"embed_url\":\"https://soundcloud.com/bhakti-lalita-devi/bhakti-lalita-devi-savarana-sri-gaura-mahima-gaurangera-duti-pada\"},{\"title\":{\"en\":\"Srila B.N. Acharya Maharaj\",\"ru\":\"Шрила Б.Н. Ачарья Махарадж\",\"ua\":\"Шріла Б.Н. Ачарʼя Махарадж\"},\"embed_url\":\"https://soundcloud.com/acharyamaharaj/5-savarana-sri-gaura-mahima\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"$L25\",null,{\"audio\":\"$1b:props:song:resources:audio\",\"caption\":\"Ouvir áudio:\",\"language\":\"pt\"}]\n1d:[\"$\",\"$L26\",null,{\"navMap\":{\"77\":{\"prev\":{\"path\":\"/pt/dayal-nitai-chaitanya-bole-nach-re/\",\"title\":\"Dayāl Nitāi Chaitanya\"},\"next\":{\"path\":\"/pt/emona-durmati-samsara-bhitore/\",\"title\":\"Dainyātmikā\"}}}}]\n27:T133a,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"description\":\"A digital Vaishnava songbook with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPa
