xt\":\"diyā\",\"trans\":\"para tolerar\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kara\",\"trans\":\"tudo [e]\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"nija\",\"trans\":\"por favor [me] faça\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"māne\",\"trans\":\"desprovido [de qualquer]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"spṛhā\",\"trans\":\"desejo\",\"sep\":\"-\"},{\"text\":\"hīna\",\"trans\":\"por honra\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"2\",\"text\":[\"sakale sammāna    karite śakati\",\"    deha nātha! yathā yatha\",\"tabe ta’ gāiba    hari-nāma sukhe\",\"    aparādha habe hata\"],\"word_by_word\":[\"**nātha!**–Ó mestre! **deha’**–por favor [me] dê **śakati**–a força **karite sammāna**–honrar **sakale**–a todos **yathāyatha**–apropriadamente **tabe**–então **ta’**–certamente **gāiba**–eu cantarei **nāma**–o Nome **hari**–do Senhor **sukhe**–com felicidade [e todas as minhas] **aparādha**–ofensas **ha’be**–serão **hata**–destruídas.\"],\"translation\":[\"Ó mestre! Me dê a habilidade de honrar apropriadamente a todos. Então feliz eu cantarei o Nome do Senhor, e todas as minhas ofensas serão erradicadas.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"sakale\",\"trans\":\"Ó mestre!\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sammāna\",\"trans\":\"por favor [me] dê\",\"sep\":\"    \",\"error\":\"mismatch\"},{\"text\":\"karite\",\"trans\":\"a força\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"śakati\",\"trans\":\"honrar\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"deha\",\"trans\":\"a todos\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nātha\",\"trans\":\"apropriadamente\",\"sep\":\"! \",\"error\":\"mismatch\"},{\"text\":\"yathā\",\"trans\":\"então\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"yatha\",\"trans\":\"certamente\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"tabe\",\"trans\":\"eu cantarei\",\"sep\":\" \",\"error\":\
