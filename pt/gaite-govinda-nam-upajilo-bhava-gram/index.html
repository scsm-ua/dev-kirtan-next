ma\",\"dekhilāma yamunāra kūle\",\"vṛṣabhānu-sutā-saṅge śyāma naṭavara raṅge\",\"vā̐śarī bājāya nīpa-mūle\"],\"word_by_word\":[\"**gāite**–Enquanto eu cantava **nāma**–o Nome de **govinda**–Govinda, **grāma**–diversos **bhāva**–êxtases **upajila**–surgiram. **dekhilāma**–Eu vi **śyāma**–Kṛṣṇa, **vara**–o melhor **naṭa**–dos dançarinos, **raṅge**–jubilosamente **bājāya**–tocando **vā̐śarī**–a flauta **saṅge**–com **sutā**–a filha **vṛṣabhānu**–de Vṛṣabhānu **kūle**–nas margens **yamunāra**–do Yamunā **mūle**–embaixo **nīpa**–de uma árvore kadamba.\"],\"translation\":[\"Então, enquanto eu cantava o Nome de Govinda, muitos êxta-ses surgiram. Eu vi Śyām, o melhor dos dançarinos, tocando flauta com a filha de Vṛṣabhanu às margens do Yamunā sob uma árvore kadamba.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gāite\",\"trans\":\"Enquanto eu cantava\",\"sep\":\" \"},{\"text\":\"govinda\",\"trans\":\"o Nome de\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"nāma\",\"trans\":\"Govinda\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"upajila\",\"trans\":\"diversos\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bhāva\",\"trans\":\"êxtases\",\"sep\":\"-\"},{\"text\":\"grāma\",\"trans\":\"surgiram\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"dekhilāma\",\"trans\":\"Eu vi\",\"sep\":\" \"},{\"text\":\"yamunāra\",\"trans\":\"Kṛṣṇa\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kūle\",\"trans\":\"o melhor\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"vṛṣabhānu\",\"trans\":\"dos dançarinos\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"sutā\",\"trans\":\"jubilosamente\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"saṅge\",\"trans\":\"tocando\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"śyāma\",\"trans\":\"a flauta\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"naṭavara\",\"trans\":\"com\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"raṅge\",\"trans\":\"a filha\",\"sep\":\"\",\"er
