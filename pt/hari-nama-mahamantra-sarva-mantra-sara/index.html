\"meta\":{\"page\":129,\"first_line\":\"hari-nāma mahāmantra sarva-mantra-sāra\"},\"title\":[\"Daśa-vidha Nāmāparādha\"],\"author\":[\"Śrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj\"],\"verses\":[{\"number\":\"1\",\"text\":[\"hari-nāma mahāmantra sarva-mantra-sāra\",\"yā̐dera karuṇā-bale jagate prachāra\",\"sei nāma-parāyaṇa sādhu, mahājana\",\"tā̐hādera nindā nā kariha kadāchana\"],\"word_by_word\":[\"**sei**–Aqueles **sādhu**–sādhus **parāyaṇa**–devotados **nāma**–ao Nome, **karuṇā-bale**–pela misericórdia **yā̐dera**–de quem **mahāmantra**–o grande mantra **nāma**–dos Nomes **hari**–do Senhor, **sāra**–o melhor **sarva**–de todos [os] **mantra**–mantras, [é] **prachāra**–distribuído **jagate**–pelo mundo [são] **mahājana**–grandes almas. **kadāchana na**–Nunca **kariha**–[se] engaje em **tā̐hāderanindā**–criticá-los.\"],\"translation\":[\"O mahāmantra Hari-nām é o melhor de todos os mantras e é distribuído em todo o mundo pela misericórdia dos sādhus dedicados ao Nome. Nunca critique tão grandes almas.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"hari\",\"trans\":\"Aqueles\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"nāma\",\"trans\":\"sādhus\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"mahāmantra\",\"trans\":\"devotados\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sarva\",\"trans\":\"ao Nome\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"mantra-sāra\",\"trans\":\"pela misericórdia\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"yā̐dera\",\"trans\":\"de quem\",\"sep\":\" \"},{\"text\":\"karuṇā\",\"trans\":\"o grande mantra\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"bale\",\"trans\":\"dos Nomes\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"jagate\",\"trans\":\"do Senhor\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"prachāra\",\"trans\":\"o melhor\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"sei\",\"trans\":\"de todos [os]\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nāma\",\"trans\":\"mantras, [é]\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"parāyaṇa\",\"trans\":\"distribuído\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sādhu\",\"trans\":\"pelo mundo [são]\",\"sep\":\", \",\"error\":\"mismatch\"},{\"text\":\"mahājana\",\"trans\":\"grandes almas\",\"sep\":\"\"}],[{\"text\":\"tā̐hādera nindā\",\"trans\":\"Nunca\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nā\",\"trans\":\"[se] engaje em\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kariha\",\"trans\":\"criticá-los\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kadāchana\",\"trans\":\"-\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"2\",\"text\":[\"vrajendra-nandana kṛṣṇa sarveśvareśvara\",\"maheśvara ādi tā̐ra sevana-tatpara\",\"nāma chintāmaṇi kṛṣṇa-chaitanya-svarūpa\",\"bheda-jñāna nā karibe līlā-guṇa-rūpa\"],\"word_by_word\":[\"**nandana**–O filho **indra**–do Rei **vraja**–de Vraja, **kṛṣṇa**–Kṛṣṇa, [é] **iśvara**–o Senhor **sarva**–de todos [os] **iśvara**–Senhores. **maha-iśvara**–O grande senhor (Śiva) [e] **adi**–os outros [deuses são] **tatpara**–dedicados [a] **tā̐ra**–Seu **sevana**–serviço. **nāma**–O Nome [é] **chintā-maṇi**–uma joia realizadora dos desejos [e uma] **svarūpa**–forma **chaitanya**–espiritual **kṛṣṇa**–de Kṛṣṇa. **jñāna na karibe**–Não considere [o Nome] **bheda**–distinto [de Sua] **rūpa**–Forma, **guṇa**–Qualidades, [e] **līlā**–Passatempos.\"],\"translation\":[\"Vrajendra Nandan Kṛṣṇa é o Senhor de todos os Senhores. Śiva e todos os outros deuses são dedicados ao Seu serviço. O Nome é uma joia realizadora dos desejos e uma forma espiritual do próprio Kṛṣṇa. Não considere o Nome de Kṛṣṇa como distinto de sua Forma, Qualidades ou Passatempos.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"vrajendra\",\"trans\":\"O filho\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"nandana\",\"trans\":\"do Rei\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kṛṣṇa\",\"trans\":\"de Vraja\",
