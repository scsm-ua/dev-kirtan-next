não servem o Senhor de seus corações?\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"jīvana anitya jānaha sāra\",\"tāhe nānā-vidha vipada-bhāra\",\"nāmāśraya kari’ yatane tumi\",\"    thākaha āpana kāje\"],\"translation\":[\"“Entendam a essência: a vida é temporária e cheia de todos os tipos de adversidades. Cuidadosamente tomando o abrigo no Nome, se engajem em seus afazeres.”\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"kṛṣṇa-nāma-sudhā kariyā pāna\",\"juḍāo bhakati-vinoda-prāṇa\",\"nāma vinā kichhu nāhika āra\",\"    chaudda-bhuvana-mājhe\"],\"translation\":[\"Beba o néctar do Nome de Kṛṣṇa e acalme a alma de Bhakti Vinod. Não há nada a se ter em todos os catorze universos a não ser o Nome.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"jīvera kalyāṇa-sādhana-kāma\",\"jagate āsi’ e madhura nāma\",\"avidyā-timira-tapana-rūpe\",\"    hṛd-gagane virāje\"],\"translation\":[\"Desejando abençoar todas as almas, o doce Nome do Senhor vem a este mundo e surge como o Sol dentro do céu do coração para dissipar a escuridão da ignorância.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-udilo-aruna-jiv\"},{\"title\":{\"en\":\"Srila B.B. Avadhut Maharaj\",\"ru\":\"Шрила Б.Б. Авадхут Махарадж\",\"ua\":\"Шріла Б.Б. Авадгут Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/avadxut-maxaradzh-utrennee-1\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"38:[\"$\",\"$L41\",null,{\"audio\":\"$37:props:song:resources:audio\",\"caption\":\"Ouvir áudio:\",\"language\":\"pt\"}]\n39:[\"$\",\"$L42\",null,{\"navMap\":{\"34\":{\"prev\":{\"path\":\"/pt/gurudeva-kripa-bindu-diya-kara-ei-dase/\",\"title\":\"Gurudeva\"},\"next\":{\"path\":\"/pt/jiv-jago-jiv-jago-gaurachanda-bole/\",\"
