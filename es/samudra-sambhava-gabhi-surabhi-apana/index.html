āya\",\"chidānanda-deho labhi kṛṣṇa-loke jāya\",\"śrī kṛṣṇa-mānase jebā kore hethā snāna\",\"gupta-govardhane rādhā-kṛṣṇa-sevā pānam\"],\"translation\":[\"1) Surabhī, la vaca divina que apareció al batir el océano de leche, amorosamente bañó con su propia leche a Vrajendra Nandan, Kṛṣṇa.\",\"2) El estanque que se llenó con esa leche, el Śrī Govinda Kuṇḍa, adorna hermosamente a Govardhan con su belleza exquisita.\",\"3) El agua transcendental de este Kuṇḍa puede disipar hasta los más grandes pecados. Las miserias triples—*ādhyātmika, ādhidaivika, ādhibhautika*—y todo temor a este mundo material son destruidos por bañarse en esta agua o por beberla.\",\"4) A veces, por una gran fortuna, alguien que consigue probar el agua (como esa misma leche) del Govinda Kuṇḍa obtiene una forma transcendental, y va a Kṛṣṇaloka.\",\"5) Quienquiera que se bañe en el Śrī Govinda Kuṇḍa, deseando servir a Kṛṣṇa, alcanza el servicio divino a Śrī Śrī Rādhā-Kṛṣṇa en Gupta Govardhan (la colina de Govardhan, oculta).\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"2f:[\"$\",\"$L37\",null,{\"navMap\":{\"400/2\":{\"prev\":{\"path\":\"/es/devadidevam-ahibhushanam-indukashiam/\",\"title\":\"Gaṅgadhar Sadāśiva Praṇām-Mantram\"},\"next\":{\"path\":\"/es/jaya-jaya-girirajer-arati-vishiala/\",\"title\":\"Śrī Govinda Kuṇḍa Gupta-Govardhan Ārati\"}}}}]\n30:[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"CollectionPage\\\",\\\"@id\\\":\\\"https://dev.kirtan.site/es/samudra-sambhava-gabhi-surabhi-apana\\\",\\\"url\\\":\\\"https://dev.kirtan.site/es/samudra-sambhava-gabhi-surabhi-apana\\\",\\\"name\\\":\\\"Śrī Govinda Kuṇḍa Māhātmya. Śrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj\\\",\\\"inLanguage\\\":\\\"es\\\",\\\"isPartOf\\\":{\\\"@id
