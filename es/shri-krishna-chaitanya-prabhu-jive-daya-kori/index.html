** — a la devoción; **anukūla** — favorable; **mātra** — solo; **kāryera** — de acciones; **svīkāra** — aceptación; **bhakti** — a la devoción; **pratikūla** — desfavorable; **bhāva** — naturaleza, disposición; **varjana** — rechazar; **aṅgīkāra** — aceptación.\"],\"translation\":[\"La aceptación de todas esas actividades que son favorables a la devoción y el rechazo de lo que es adverso a la devoción.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"bhakti\",\"trans\":\"a la devoción\",\"sep\":\"-\"},{\"text\":\"anukūla\",\"trans\":\"favorable\",\"sep\":\" \"},{\"text\":\"mātra\",\"trans\":\"solo\",\"sep\":\" \"},{\"text\":\"kāryera\",\"trans\":\"de acciones\",\"sep\":\" \"},{\"text\":\"svīkāra\",\"trans\":\"aceptación\",\"sep\":\"\"}],[{\"text\":\"bhakti\",\"trans\":\"a la devoción\",\"sep\":\"-\"},{\"text\":\"pratikūla\",\"trans\":\"desfavorable\",\"sep\":\" \"},{\"text\":\"bhāva—varjanāṅgīkāra\",\"trans\":\"naturaleza, disposición\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"5\",\"text\":[\"ṣaḍ-aṅga śaraṇāgati ha-ibe yā̐hāra\",\"tā̐hāra prārthanā śune śrī-nanda-kumāra\"],\"word_by_word\":[\"**ṣaḍ** — seis; **aṅga** — (*prakāra aṅgera dvārā*) — aspectos (por medio de estos); **śaraṇāgati** — (*prapatti*) — rendición; **ha-ibe** — será; **yāh̐āra** — aquellos; **tāh̐āra** — suyos; **prārthanā** — oraciones; **śune** — escucha; **śrī-nanda-kumāra** — Kṛṣṇa, el hijo de Nanda Mahārāj.\"],\"translation\":[\"Para aquellos que se rinden de estas seis maneras, sus oraciones serán escuchadas por el divino hijo de Nanda.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"ṣaḍ\",\"trans\":\"seis\",\"sep\":\"-\"},{\"text\":\"aṅga\",\"trans\":\"(*prakāra aṅgera dvārā*) — aspectos (por medio de estos)\",\"sep\":\" \"},{\"text\":\"śaraṇāgati\",\"trans\":\"(*prapatti*) — rendición\",\"sep\":\" \"},{\"text\":\"ha-ibe\",\"trans\":\"será\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"y
