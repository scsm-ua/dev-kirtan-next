smo modo en que el loto nocturno florece con los refrescantes rayos de la luna, el corazón empieza a florecer con el néctar del Nombre. Y el alma por fin despierta a su verdadero tesoro interno—una vida de amor con Kṛṣṇa. Al saborear una y otra vez el néctar, el alma se zambulle y emerge a la superficie en el océano siempre creciente del júbilo extático. Todas las fases del ser que podamos concebir se satisfacen y purifican plenamente, y son finalmente conquistadas por la toda auspiciosa influencia del Santo Nombre de Kṛṣṇa.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"cheto-darpaṇa\",\"trans\":\"el espejo del corazón\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"mārjanaṁ\",\"trans\":\"limpieza\",\"sep\":\" \"},{\"text\":\"bhava\",\"trans\":\"de la existencia material\",\"sep\":\"-\"},{\"text\":\"mahādāvāgni-nirvāpaṇaṁ\",\"trans\":\"el gran incendio forestal\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"śreyaḥ\",\"trans\":\"extinción\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"kairava\",\"trans\":\"buena fortuna\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"chandrikā\",\"trans\":\"el loto blanco\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"vitaraṇaṁ\",\"trans\":\"los rayos de la luna\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"vidyā\",\"trans\":\"esparciendo\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"vadhū-jīvanam\",\"trans\":\"la esposa de toda educación\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"ānandāmbudhi\",\"trans\":\"la vida\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"vardhanaṁ prati\",\"trans\":\"el océano de bienaventuranza\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"padaṁ\",\"trans\":\"aumentando\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"pūrṇāmṛtāsvādanaṁ\",\"trans\":\"en cada paso\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"sarvātma-snapanaṁ\",\"trans\":\"el néctar pleno\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"paraṁ\",\"trans\":\"dando un sabor delicioso\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"vijayate śrī\",\"trans\":\"a todas las almas\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"kṛṣṇa\",\"trans\":\"bañando\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"saṅkīrtanam\",\"trans\":\"trascendental\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"2\",\"text\":[\"nāmnām akāri bahudhā nija-sarva-śaktis\",\"tatrārpitā niyamitaḥ smaraṇe na kālaḥ\",\"etādṛśī tava kṛpā bhagavan mamāpi\",\"durdaivam īdṛśam ihājani nānurāgaḥ\"],\"word_by_word\":[\"**nāmnām** — de los Santos Nombres del Señor; **akāri** — manifestado; **bahudhā** — diversas clases; **nija-sarva-śaktiḥ** — todos los tipos de potencia personal; **tatra** — en eso; **arpita** — otorgado; **niyamitaḥ** — restricción; **smaraṇe** — al recordar; **na** — no; **kālaḥ** — consideración del tiempo; **etādṛśī** — mucha; **tava kṛpā** — Tu misericordia; **bhagavan** — ¡oh, Señor!; **mama** — mi; **api** — aunque; **durdaivam** — desgracia; **īdṛśam** — tal; **iha** — en este (Santo Nombre); **ajani** — nació; **na-anurāgaḥ** — sin apego.\"],\"translation\":[\"¡Oh, mi Señor! Tu Santo Nombre les confiere lo auspicioso a todos. Y Tú tienes ilimitados nombres, tales como Kṛṣṇa y Govinda, mediante los cuales te revelas. En Tus incontables Santos Nombres, bondadosamente has conferido toda Tu potencia trascendental. Y para cantar esos Nombres no existen reglas estrictas concernientes al tiempo o al lugar. Por Tu misericordia sin causa, has descendido en la forma de sonido divino, sin embargo, mi gran infortunio es que no tengo amor por Tu Santo Nombre.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"nāmnām\",\"trans\":\"de los Santos Nombres del Señor\",\"sep\":\" \"},{\"text\":\"akāri\",\"trans\":\"manifestado\",\"sep\":\" \"},{\"text\":\"bahudhā\",\"trans\":\"diversas clases\",\"sep\":\" \"},{\"text\":\"nija-sarva-śaktis\",\"trans\":\"todos los tipos de potencia personal\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"tatrārpitā\",\"trans\":\"en eso\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"niyamitaḥ\",\"trans\":\"otorgado\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"smaraṇe\",\"trans\":\"restricción\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"na\",\"trans\":\"al recordar\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kālaḥ\",\"trans\":\"no\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"etādṛśī\",\"trans\":\"consideración del tiempo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"tava\",\"trans\":\"mucha\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kṛpā bhagavan\",\"trans\":\"Tu misericordia\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"mamāpi\",\"trans\":\"¡oh, Señor!\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"durdaivam\",\"trans\":\"mi\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"īdṛśam\",\"trans\":\"aunque\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"ihājani\",\"trans\":\"desgracia\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nānurāgaḥ\",\"trans\":\"tal\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"3\",\"text\":[\"tṛṇād api sunīchena taror api sahiṣṇunā\",\"amāninā mānadena kīrtanīyaḥ sadā hariḥ\"],\"word_by_word\":[\"**tṛṇād api** — más que la hierba pisoteada; **su-nīchena** — sintiéndose mucho más bajo; **taror** — que un árbol; **api** — más que; **sahiṣṇunā** — siendo tolerante; **amāninā** — al no aceptar respeto; **mānadena** — respetando a todos los demás; **kīrtanīyaḥ** — debe cantarse; **sadā** — siempre; **hariḥ** — el Santo Nombre de Hari.\"],\"translation\":[\"Aquel que es más humilde que una brizna de hierba, más tolerante que un árbol, que le ofrece el debido honor a los demás sin desearlo para sí mismo, está capacitado para cantar siempre el Santo Nombre de Kṛṣṇa.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"tṛṇād api\",\"trans\":\"más que la hierba pisoteada\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"sunīchena taror\",\"trans\":\"sintiéndose mucho más bajo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"api\",\"trans\":\"que un árbol\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sahiṣṇunā\",\"trans\":\"más que\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"amāninā\",\"trans\":\"siendo tolerante\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"mānadena\",\"trans\":\"al no aceptar respeto\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kīrtanīyaḥ\",\"trans\":\"respetando a todos los demás\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sadā\",\"trans\":\"debe cantarse\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hariḥ\",\"trans\":\"siempre\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"4\",\"text\":[\"na dhanaṁ na janaṁ na sundarīṁ\",\"kavitāṁ vā jagad-īśa kāmaye\",\"mama janmani-janmanīśvare\",\"bhavatād bhaktir ahaitukī tvayi\"],\"word_by_word\":[\"**na dhanaṁ** — no riqueza; **na janaṁ** — no seguidores; **na sundarīṁ** — no mujeres hermosas; **kavitāṁ** — actividades fruitivas descritas en lenguaje florido; **va** — o; **jagat-īśa** — ¡oh, Señor del universo!; **kāmaye** — deseo; **mama** — mi; **janmani janmani** — nacimiento tras nacimiento; **īśvare** — a la Suprema Personalidad de Dios; **bhavatāt** — que haya; **bhaktiḥ** — servicio devocional; **ahaitukī** — sin motivación; **tvayi** — a Ti.\"],\"translation\":[\"¡Oh, Señor! No tengo deseo de acumular riquezas, seguidores, mujeres bellas o salvación. Lo único que imploro es el servicio devocional inmotivado a Ti, nacimiento tras nacimiento.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"na dhanaṁ\",\"trans\":\"no riqueza\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"na janaṁ\",\"trans\":\"no seguidores\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"na sundarīṁ\",\"trans\":\"no mujeres hermosas\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"kavitāṁ\",\"trans\":\"actividades fruitivas descritas en lenguaje florido\",\"sep\":\" \"},{\"text\":\"vā\",\"trans\":\"o\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"jagad-īśa\",\"trans\":\"¡oh, Señor del universo!\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kāmaye\",\"trans\":\"deseo\",\"sep\":\"\"}],[{\"text\":\"mama\",\"trans\":\"mi\",\"sep\":\" \"},{\"text\":\"janmani-janmanīśvare\",\"trans\":\"nacimiento tras nacimiento\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"bhavatād\",\"trans\":\"a la Suprema Personalidad de Dios\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bhaktir\",\"trans\":\"que haya\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"ahaitukī\",\"trans\":\"servicio devocional\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"tvayi\",\"trans\":\"sin motivación\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"5\",\"text\":[\"ayi nanda-tanuja kiṅkaraṁ\",\"patitaṁ māṁ viṣame bhavāmbudhau\",\"kṛpayā tava pāda-paṅkaja-\",\"sthita-dhūlī-sadṛśaṁ vichintaya\"],\"word_by_word\":[\"**ayi nanda-tanuja** — ¡oh, hijo de Nanda Mahārāj!; **kiṅkaraṁ** — Tu sirviente; **patitaṁ** — caído; **mām** — yo; **viṣame** — horrible; **bhava-ambudhau** — en el océano de la nesciencia; **kṛpayā** — por misericordia sin causa; **tava** — tus; **pāda-paṅkaja** — pies de loto; **sthita** — situado en; **dhūlī** — el polvo; **sadṛśaṁ** — igual que; **vichintaya** — por favor considera.\"],\"translation\":[\"¡Oh, hijo de Mahārāj Nanda! Soy Tu siervo eterno. Sin embargo, debido a mi propio *karma*, he caído en este horrible océano de nacimiento y muerte. Por favor, acepta a esta alma caída y considérame una partícula de polvo a Tus sagrados pies de loto.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"ayi nanda-tanuja\",\"trans\":\"¡oh, hijo de Nanda Mahārāj!\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"kiṅkaraṁ\",\"trans\":\"Tu sirviente\",\"sep\":\"\"}],[{\"text\":\"patitaṁ\",\"trans\":\"caído\",\"sep\":\" \"},{\"text\":\"māṁ\",\"trans\":\"yo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"viṣame\",\"trans\":\"horrible\",\"sep\":\" \"},{\"text\":\"bhavāmbudhau\",\"trans\":\"en el océano de la nesciencia\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"kṛpayā\",\"trans\":\"por misericordia sin causa\",\"sep\":\" \"},{\"text\":\"tava\",\"trans\":\"tus\",\"sep\":\" \"},{\"text\":\"pāda-paṅkaja\",\"trans\":\"pies de loto\",\"sep\":\"-\",\"error\":\"multi\"}],[{\"text\":\"sthita\",\"trans\":\"situado en\",\"sep\":\"-\"},{\"text\":\"dhūlī\",\"trans\":\"el polvo\",\"sep\":\"-\"},{\"text\":\"sadṛśaṁ\",\"trans\":\"igual que\",\"sep\":\" \"},{\"text\":\"vichintaya\",\"trans\":\"por favor considera\",\"sep\":\"\"}]]},{\"number\":\"6\",\"text\":[\"nayanaṁ galad-aśru-dhārayā\",\"vadanaṁ gadgada-ruddhayā girā\",\"pulakair nichitaṁ vapuḥ kadā\",\"tava nāma-grahaṇe bhaviṣyati\"],\"word_by_word\":[\"**nayanaṁ** — mis ojos; **galad-aśru-dhārayā** — por ríos de lágrimas que caen; **vadanaṁ** — mi boca; **gadgada** — vacilante; **ruddhayā** — siendo ahogado; **girā** — mis palabras; **pulakaiḥ** — por vellos que se erizan; **nichitaṁ** — cubierto; **vapuḥ** — mi cuerpo; **kadā** — ¿cuándo?; **tava** — tu; **nāma-grahaṇe** — al cantar el Santo Nombre; **bhaviṣyati** — será.\"],\"translation\":[\"¡Oh, Señor! ¿Cuándo las lágrimas fluirán de mis ojos como olas y mi voz temblará de éxtasis? ¿Cuándo los vellos de mi cuerpo se erizarán mientras canto Tu Santo Nombre?\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"nayanaṁ\",\"trans\":\"mis ojos\",\"sep\":\" \"},{\"text\":\"galad-aśru-dhārayā\",\"trans\":\"por ríos de lágrimas que caen\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"vadanaṁ\",\"trans\":\"mi boca\",\"sep\":\" \"},{\"text\":\"gadgada\",\"trans\":\"vacilante\",\"sep\":\"-\"},{\"text\":\"ruddhayā\",\"trans\":\"siendo ahogado\",\"sep\":\" \"},{\"text\":\"girā\",\"trans\":\"mis palabras\",\"sep\":\"\"}],[{\"text\":\"pulakair\",\"trans\":\"por vellos que se erizan\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nichitaṁ\",\"trans\":\"cubierto\",\"sep\":\" \"},{\"text\":\"vapuḥ\",\"trans\":\"mi cuerpo\",\"sep\":\" \"},{\"text\":\"kadā\",\"trans\":\"¿cuándo?\",\"sep\":\"\"}],[{\"text\":\"tava\",\"trans\":\"tu\",\"sep\":\" \"},{\"text\":\"nāma-grahaṇe\",\"trans\":\"al cantar el Santo Nombre\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"bhaviṣyati\",\"trans\":\"será\",\"sep\":\"\"}]]},{\"number\":\"7\",\"text\":[\"yugāyitaṁ nimeṣeṇa chakṣuṣā prāvṛṣāyitam\",\"śūnyāyitaṁ jagat sarvaṁ govinda-viraheṇa me\"],\"word_by_word\":[\"**yugāyitaṁ** — hace como un gran milenio; **nimeṣeṇa** — por un momento; **chakṣuṣā** — de mis ojos; **prāvṛṣāyitam** — hace que las lágrimas caigan como torrentes de lluvia; **śūnyāyitaṁ** — vuelve vacío; **jagat sarvaṁ** — el mundo entero; **govinda viraheṇa** — por la separación de Govinda; **me** — mío.\"],\"translation\":[\"¡Oh, Govinda! Sin Ti, el mundo está vacío. Las lágrimas inundan mis ojos como lluvia y un instante parece una eternidad.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"yugāyitaṁ\",\"trans\":\"hace como un gran milenio\",\"sep\":\" \"},{\"text\":\"nimeṣeṇa\",\"trans\":\"por un momento\",\"sep\":\" \"},{\"text\":\"chakṣuṣā\",\"trans\":\"de mis ojos\",\"sep\":\" \"},{\"text\":\"prāvṛṣāyitam\",\"trans\":\"hace que las lágrimas caigan como torrentes de lluvia\",\"sep\":\"\"}],[{\"text\":\"śūnyāyitaṁ\",\"trans\":\"vuelve vacío\",\"sep\":\" \"},{\"text\":\"jagat sarvaṁ\",\"trans\":\"el mundo entero\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"govinda-viraheṇa\",\"trans\":\"por la separación de Govinda\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"me\",\"trans\":\"mío\",\"sep\":\"\"}]]},{\"number\":\"8\",\"text\":[\"āśliṣya vā pāda-ratāṁ pinaṣṭu mām\",\"adarśanān marma-hatāṁ karotu vā\",\"yathā tathā vā vidadhātu lampaṭo\",\"mat-prāṇa-nāthas tu sa eva nāparaḥ\"],\"word_by_word\":[\"**āśliṣya** — abrazando con fuerza; **vā** — o; **pāda-ratāṁ** — postrado a los pies de loto; **pinaṣṭu** — déjalo pisotear; **mām** — a mí; **adarśanān** — por no ser visible; **marma-hatāṁ** — con el corazón roto; **karotu** — que Él haga; **vā** — o; **yathā tathā** — como a Él le gusta; **vā** — o; **vidadhātu** — déjalo hacer; **lampaṭaḥ** — el libertino; **mat-prāṇa-nāthaḥ** — el Señor de mi vida; **tu** — pero; **saḥ eva** — sólo Él; **na aparaḥ** — nadie más.\"],\"translation\":[\"Kṛṣṇa puede abrazarme con amor o pisotearme bajo Sus pies. Puede romper mi corazón al esconderse de mí. Que ese libertino haga lo que quiera, pero siempre será el único Señor de mi vida.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"āśliṣya\",\"trans\":\"abrazando con fuerza\",\"sep\":\" \"},{\"text\":\"vā\",\"trans\":\"o\",\"sep\":\" \"},{\"text\":\"pāda-ratāṁ\",\"trans\":\"postrado a los pies de loto\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"pinaṣṭu\",\"trans\":\"déjalo pisotear\",\"sep\":\" \"},{\"text\":\"mām\",\"trans\":\"a mí\",\"sep\":\"\"}],[{\"text\":\"adarśanān\",\"trans\":\"por no ser visible\",\"sep\":\" \"},{\"text\":\"marma-hatāṁ\",\"trans\":\"con el corazón roto\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"karotu\",\"trans\":\"que Él haga\",\"sep\":\" \"},{\"text\":\"vā\",\"trans\":\"o\",\"sep\":\"\"}],[{\"text\":\"yathā tathā\",\"trans\":\"como a Él le gusta\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"vā\",\"trans\":\"o\",\"sep\":\" \"},{\"text\":\"vidadhātu\",\"trans\":\"déjalo hacer\",\"sep\":\" \"},{\"text\":\"lampaṭo\",\"trans\":\"el libertino\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"mat-prāṇa-nāthas\",\"trans\":\"el Señor de mi vida\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"tu\",\"trans\":\"pero\",\"sep\":\" \"},{\"text\":\"sa eva\",\"trans\":\"sólo Él\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nāparaḥ\",\"trans\":\"nadie más\",\"sep\":\"\",\"error\":\"mismatch\"}]]}],\"resources\":{\"audio
