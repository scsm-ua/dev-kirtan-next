 abandonar.\"],\"author\":[\"Śrīla Narottam Dās Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"anya-abhilāsa chāḍi        jñāna karma parihari\",\"        kāya mane karibo bhajana\",\"sādhu-saṅge kṛṣṇa-sevā        nā pūjibo devī-devā\",\"        ei bhakti parama-kāraṇa\"],\"word_by_word\":[\"**anya** — otro; **abhilāsa** — deseos; **chāḍi** — abandonar; **jñāna** — conocimiento especulativo; **karma** — acciones fruitivas; **parihari** — abandonar; **kāya mane** — con cuerpo y mente; **kariba** — hará; **bhajana** — adoración; **sādhu-saṅge** — en compañía de devotos; **kṛṣṇa-sevā** — servir al Señor Kṛṣṇa; **nā** — no; **pūjiba** — adorará; **devī** — semidiosas; **devā** — o semidioses; **ei** — esto; **bhakti** — servicio devocional; **parama** — el supremo; **kāraṇa** — proceso.\"],\"translation\":[\"Adora al Señor con el cuerpo y la mente, abandonando el deseo por el esfuerzo material y el conocimiento mundano. Lleva a cabo el servicio en la asociación de los devotos y no adores a los diversos semidioses. Estas actividades son la causa principal de la devoción a Kṛṣṇa.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"anya\",\"trans\":\"otro\",\"sep\":\"-\"},{\"text\":\"abhilāsa\",\"trans\":\"deseos\",\"sep\":\" \"},{\"text\":\"chāḍi\",\"trans\":\"abandonar\",\"sep\":\"        \"},{\"text\":\"jñāna\",\"trans\":\"conocimiento especulativo\",\"sep\":\" \"},{\"text\":\"karma\",\"trans\":\"acciones fruitivas\",\"sep\":\" \"},{\"text\":\"parihari\",\"trans\":\"abandonar\",\"sep\":\"\"}],[{\"text\":\"kāya mane\",\"trans\":\"con cuerpo y mente\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"karibo\",\"trans\":\"hará\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bhajana\",\"trans\":\"adoración\",\"sep\":\"\"}],[{\"text\":\"sādhu-saṅge\",\"trans\":\"en compañía de devotos\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"kṛṣṇa-sevā\",\"trans\":\"servir al Señor Kṛṣṇa\",\"sep\":\"        \",\"error\":\"multi\"},{\"text\":\"nā\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"pūjibo\",\"trans\":\"adorará\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"devī\",\"trans\":\"semidiosas\",\"sep\":\"-\"},{\"text\":\"devā\",\"trans\":\"o semidioses\",\"sep\":\"\"}],[{\"text\":\"ei\",\"trans\":\"esto\",\"sep\":\" \"},{\"text\":\"bhakti\",\"trans\":\"servicio devocional\",\"sep\":\" \"},{\"text\":\"parama\",\"trans\":\"el supremo\",\"sep\":\"-\"},{\"text\":\"kāraṇa\",\"trans\":\"proceso\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"mahājanera jei patha        tā’te ha’be anurata\",\"        pūrvāpara kariyā bichāra\",\"sādhana-smaraṇa-līlā        ihāte nā koro helā\",\"        kāya mane kariyā sūsāra\"],\"word_by_word\":[\"**mahājanera** — de los *mahājanas*; **jei** — aquello que; **patha** — camino; **tā’te** — en eso; **ha’be** — será; **anurata** — adherido; **pūrvāpara** — anterior y posterior; **kariyā** — haciendo; **bichāra** — consideración; **sādhana** — práctica; **smaraṇa** — recuerdo; **līlā** — pasatiempos; **ihāte** — en esto; **nā** — no; **koro** — hacer; **helā** — descuido; **kāya-mane** — con cuerpo y mente; **kariyā** — haciendo; **sūsāra** — esencia.\"],\"translation\":[\"La esencia de la práctica devocional es tener en cuenta y seguir cuidadosamente el sendero revelado por los *mahājanas*. Uno no debe ser negligente en la práctica de recordar los Pasatiempos del Señor, pues el servicio devocional debe realizarse tanto con la mente como con el cuerpo.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"mahājanera\",\"trans\":\"de los *mahājanas*\",\"sep\":\" \"},{\"text\":\"jei\",\"trans\":\"aquello que\",\"sep\":\" \"},{\"text\":\"patha\",\"trans\":\"camino\",\"sep\":\"        \"},{\"text\":\"tā’te\",\"trans\":\"en eso\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"ha’be\",\"trans\":\"será\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"anurata\",\"trans\":\"adherido\",\"sep\":\"\"}],[{\"text\":\"pūrvāpara\",\"trans\":\"anterior y posterior\",\"sep\":\" \"},{\"text\":\"kariyā\",\"trans\":\"haciendo\",\"sep\":\" \"},{\"text\":\"bichāra\",\"trans\":\"consideración\",\"sep\":\"\"}],[{\"text\":\"sādhana\",\"trans\":\"práctica\",\"sep\":\"-\"},{\"text\":\"smaraṇa\",\"trans\":\"recuerdo\",\"sep\":\"-\"},{\"text\":\"līlā\",\"trans\":\"pasatiempos\",\"sep\":\"        \"},{\"text\":\"ihāte\",\"trans\":\"en esto\",\"sep\":\" \"},{\"text\":\"nā\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"koro\",\"trans\":\"hacer\",\"sep\":\" \"},{\"text\":\"helā\",\"trans\":\"descuido\",\"sep\":\"\"}],[{\"text\":\"kāya mane\",\"trans\":\"con cuerpo y mente\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"kariyā\",\"trans\":\"haciendo\",\"sep\":\" \"},{\"text\":\"sūsāra\",\"trans\":\"esencia\",\"sep\":\"\"}]]},{\"number\":\"3\",\"text\":[\"asat-saṅga sadā tyāga        chāḍa anya gīta-rāga\",\"        karmī jnānī parihari dūre\",\"kevala bhakata-saṅga        prema-kathā-rasa-raṅga\",\"        līlā-kathā vraja-rasa-pure\"],\"word_by_word\":[\"**asat-saṅga** — mala asociación; **sadā** — siempre; **tyāga** — abandonar; **chāḍa** — salir; **anya** — otro; **gīta-rāga** — apego a las canciones mundanas; **karmī** — trabajador fruitivo; **jñānī** — especulador mental; **parihari** — rechazar; **dūre** — lejos; **kevala** — solamente; **bhakata-saṅga** — asociación con devotos; **prema-kathā** — temas de amor; **rasa** — dulces; **raṅga** — felicidad; **līlā-kathā** — pasatiempos; **vraja-rasa-pure** — en Vraja.\"],\"translation\":[\"Abandona la mala asociación y evita el canto de canciones mundanas. Mantente alejado de la gente materialista así como de aquellos que se encuentran absortos en el conocimiento mundano. Asóciate solo con los devotos y fusiónate en la felicidad de los temas acerca de los amorosos Pasatiempos de Kṛṣṇa en Vṛndāvan.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"asat-saṅga\",\"trans\":\"mala asociación\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"sadā\",\"trans\":\"siempre\",\"sep\":\" \"},{\"text\":\"tyāga\",\"trans\":\"abandonar\",\"sep\":\"        \"},{\"text\":\"chāḍa\",\"trans\":\"salir\",\"sep\":\" \"},{\"text\":\"anya\",\"trans\":\"otro\",\"sep\":\" \"},{\"text\":\"gīta-rāga\",\"trans\":\"apego a las canciones mundanas\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"karmī\",\"trans\":\"trabajador fruitivo\",\"sep\":\" \"},{\"text\":\"jnānī\",\"trans\":\"especulador mental\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"parihari\",\"trans\":\"rechazar\",\"sep\":\" \"},{\"text\":\"dūre\",\"trans\":\"lejos\",\"sep\":\"\"}],[{\"text\":\"kevala\",\"trans\":\"solamente\",\"sep\":\" \"},{\"text\":\"bhakata-saṅga\",\"trans\":\"asociación con devotos\",\"sep\":\"        \",\"error\":\"multi\"},{\"text\":\"prema-kathā\",\"trans\":\"temas de amor\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"rasa\",\"trans\":\"dulces\",\"sep\":\"-\"},{\"text\":\"raṅga\",\"trans\":\"felicidad\",\"sep\":\"\"}],[{\"text\":\"līlā-kathā\",\"trans\":\"pasatiempos\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"vraja-rasa-pure\",\"trans\":\"en Vraja\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"4\",\"text\":[\"yogī nyāsī karmī jñanī        anya-deva-pūjaka dhyānī\",\"        iha-loka dūre parihari\",\"karma dharma duḥkha śoka    jebā thāke anya yoga\",\"        chāḍi’ bhaja girivara-dhārī\"],\"word_by_word\":[\"**yogī** — los *yogīs*; **nyāsī** — los renunciantes; **karmī** — trabajadores fruitivos; **jñānī** — impersonalistas; **anya-deva pūjaka** — adoradores de los semidioses; **dhyānī** — los meditadores; **iha-loka** — esta gente; **dūre** — lejos; **parihari** — renunciar; **karma** — acciones fruitivas; **dharma** — deberes religiosos; **dūḥkha** — miserias; **śoka** — lamentaciones; **jebā** — lo que sea; **thāke** — en estos; **anya** — otro; **yoga** — apego; **chāḍi** — al rendirse; **bhaja** — adorar; **girivara-dhārī** — el levantador de la colina Govardhan.\"],\"translation\":[\"Por favor, abandona la asociación con los *yogīs*, los *sannyāsīs*, los *karmīs*, los *jñānīs*, los meditadores y los adoradores de los semidioses. También, abandona el apego por toda clase de actividad fruitiva, deber religioso, ansiedad, lamentación y objeto material. Solo adora a Kṛṣṇa, el levantador de la Colina de Govardhan.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"yogī\",\"trans\":\"los *yogīs*\",\"sep\":\" \"},{\"text\":\"nyāsī\",\"trans\":\"los renunciantes\",\"sep\":\" \"},{\"text\":\"karmī\",\"trans\":\"trabajadores fruitivos\",\"sep\":\" \"},{\"text\":\"jñanī\",\"trans\":\"impersonalistas\",\"sep\":\"        \",\"error\":\"mismatch\"},{\"text\":\"anya-deva-pūjaka\",\"trans\":\"adoradores de los semidioses\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"dhyānī\",\"trans\":\"los meditadores\",\"sep\":\"\"}],[{\"text\":\"iha-loka\",\"trans\":\"esta gente\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"dūre\",\"trans\":\"lejos\",\"sep\":\" \"},{\"text\":\"parihari\",\"trans\":\"renunciar\",\"sep\":\"\"}],[{\"text\":\"karma\",\"trans\":\"acciones fruitivas\",\"sep\":\" \"},{\"text\":\"dharma\",\"trans\":\"deberes religiosos\",\"sep\":\" \"},{\"text\":\"duḥkha\",\"trans\":\"miserias\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"śoka\",\"trans\":\"lamentaciones\",\"sep\":\"    \"},{\"text\":\"jebā\",\"trans\":\"lo que sea\",\"sep\":\" \"},{\"text\":\"thāke\",\"trans\":\"en estos\",\"sep\":\" \"},{\"text\":\"anya\",\"trans\":\"otro\",\"sep\":\" \"},{\"text\":\"yoga\",\"trans\":\"apego\",\"sep\":\"\"}],[{\"text\":\"chāḍi\",\"trans\":\"al rendirse\",\"sep\":\"’ \"},{\"text\":\"bhaja\",\"trans\":\"adorar\",\"sep\":\" \"},{\"text\":\"girivara-dhārī\",\"trans\":\"el levantador de la colina Govardhan\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"5\",\"text\":[\"tīrtha-yātrā pariśrama        kevala-manera-bhrama\",\"        sarva-siddhi govinda-charaṇa\",\"dṛdha-viśvāsa hṛde dhari    mada-mātsaryya parihari\",\"        sadā koro ananya bhajana\"],\"word_by_word\":[\"**tīrtha-yātrā** — viajar a los lugares sagrados; **pariśrama** — trabajo duro; **kevala** — solamente; **manera** — mente; **bhrama** — ilusión; **sarva-siddhi** — la máxima perfección; **govinda-charaṇa** — los pies de loto de Govinda; **dṛdha** — firme; **viśvāsa** — convicción; **hṛde** — en el corazón; **dhari** — guardar; **mada** — orgullo; **mātsaryya** — envidia; **parihari** — renunciar; **sadā** — siempre; **koro** — hacer; **ananya-bhajana** — adoración exclusiva.\"],\"translation\":[\"Viajar a los lugares santos constituye únicamente un esfuerzo muy arduo para conseguir una ilusión mental, cuando en realidad los pies de loto de Śrī Govinda son la perfección de nuestra vida. Uno debe abandonar el orgullo y la envidia y ejecutar la adoración pura al Señor con firme determinación en el corazón.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"tīrtha-yātrā\",\"trans\":\"viajar a los lugares sagrados\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"pariśrama\",\"trans\":\"trabajo duro\",\"sep\":\"        \"},{\"text\":\"kevala\",\"trans\":\"solamente\",\"sep\":\"-\"},{\"text\":\"manera\",\"trans\":\"mente\",\"sep\":\"-\"},{\"text\":\"bhrama\",\"trans\":\"ilusión\",\"sep\":\"\"}],[{\"text\":\"sarva-siddhi\",\"trans\":\"la máxima perfección\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"govinda-charaṇa\",\"trans\":\"los pies de loto de Govinda\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"dṛdha\",\"trans\":\"firme\",\"sep\":\"-\"},{\"text\":\"viśvāsa\",\"trans\":\"convicción\",\"sep\":\" \"},{\"text\":\"hṛde\",\"trans\":\"en el corazón\",\"sep\":\" \"},{\"text\":\"dhari\",\"trans\":\"guardar\",\"sep\":\"    \"},{\"text\":\"mada\",\"trans\":\"orgullo\",\"sep\":\"-\"},{\"text\":\"mātsaryya\",\"trans\":\"envidia\",\"sep\":\" \"},{\"text\":\"parihari\",\"trans\":\"renunciar\",\"sep\":\"\"}],[{\"text\":\"sadā\",\"trans\":\"siempre\",\"sep\":\" \"},{\"text\":\"koro\",\"trans\":\"hacer\",\"sep\":\" \"},{\"text\":\"ananya bhajana\",\"trans\":\"adoración exclusiva\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"6\",\"text\":[\"kṛṣṇa-bhakta saṅga kori        kṛṣṇa-bhakta saṅga heri\",\"        śraddhānvita śravaṇa-kīrttana\",\"archana vandana dhyāna    nava-bhakti mahā-jñāna\",\"        ei bhakti parama-kāraṇa\"],\"word_by_word\":[\"**kṛṣṇa-bhakta** — devotos de Kṛṣṇa; **saṅga-kori** — asociando; **kṛṣṇa-bhakta** — devotos de Kṛṣṇa; **saṅgaheri** — ver Su cuerpo; **śraddhānvita** — con fe; **sravaṇa-kīrtana** — oír y cantar; **archana** — adoración; **vandaṇa** — ofrenda de oraciones; **dhyana** — meditando; **nava-bhakti** — nueve tipos de servicio devocional; **mahā-jñāna** — el lugar más elevado; **ei-bhakti** — este servicio devocional; **parama** — supremo; **kāraṇa** — método.\"],\"translation\":[\"El mejor proceso del servicio devocional es escuchar, cantar, adorar, glorificar y meditar con fe en los Nombres, las Formas, las Cualidades y los Pasatiempos de Kṛṣṇa, en compañía de los devotos de Kṛṣṇa, mediante las nueve formas del *bhakti*.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"kṛṣṇa-bhakta\",\"trans\":\"devotos de Kṛṣṇa\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"saṅga kori\",\"trans\":\"asociando\",\"sep\":\"        \",\"error\":\"multi\"},{\"text\":\"kṛṣṇa-bhakta\",\"trans\":\"devotos de Kṛṣṇa\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"saṅga\",\"trans\":\"ver Su cuerpo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"heri\",\"trans\":\"con fe\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"śraddhānvita śravaṇa\",\"trans\":\"oír y cantar\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"kīrttana\",\"trans\":\"adoración\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"archana\",\"trans\":\"ofrenda de oraciones\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"vandana\",\"trans\":\"meditando\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"dhyā una gran felicidad y todos sus peligros se desvanecerán.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"āpani\",\"trans\":\"automáticamente\",\"sep\":\" \"},{\"text\":\"palābe\",\"trans\":\"huir\",\"sep\":\" \"},{\"text\":\"saba\",\"trans\":\"todos\",\"sep\":\"        \"},{\"text\":\"śuniyā\",\"trans\":\"oyendo\",\"sep\":\" \"},{\"text\":\"govinda\",\"trans\":\"el Señor Govinda\",\"sep\":\" \"},{\"text\":\"raba\",\"trans\":\"sonido\",\"sep\":\"\"}],[{\"text\":\"siṁha-rabe\",\"trans\":\"por el sonido de un león\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"jena\",\"trans\":\"tal como\",\"sep\":\" \"},{\"text\":\"kori-gaṇa\",\"trans\":\"venados\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"sakali\",\"trans\":\"todos\",\"sep\":\" \"},{\"text\":\"vipatti\",\"trans\":\"peligros\",\"sep\":\" \"},{\"text\":\"jābe\",\"trans\":\"vencerá\",\"sep\":\"        \"},{\"text\":\"mahānanda\",\"trans\":\"gran placer\",\"sep\":\" \"},{\"text\":\"sūkha\",\"trans\":\"felicidad\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"pābe\",\"trans\":\"voluntad\",\"sep\":\"\"}],[{\"text\":\"jāra\",\"trans\":\"quién\",\"sep\":\" \"},{\"text\":\"hoy\",\"trans\":\"es\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"ekānta\",\"trans\":\"sin mezcla\",\"sep\":\" \"},{\"text\":\"bhajana\",\"trans\":\"adoración\",\"sep\":\"\"}]]},{\"number\":\"14\",\"text\":[\"nā koriha asat-cheṣṭa        lābha pūjā pratiṣṭhā\",\"        sadā chinta govinda-charaṇa\",\"sakala santāpa jābe        parānanda sukha pābe\",\"        prema-bhakti parama-kāraṇa\"],\"word_by_word\":[\"**nā** — no; **koriha** — hacer; **asat** — enfermo; **cheṣṭa** — esfuerzo; **lābha** — beneficio; **pūja** — adoración; **pratiṣṭha** — distinción; **sadā** — siempre; **chinta** — recuerda; **govinda-charaṇa** — los pies de loto de Govinda; **sakala** — todos; **vipatti** — peligro; **jābe** — irá; **mahānanda** — éxtasis; **sukha** — feliz; **pābe** — recibirá; **prema-bhakti** — amoroso servicio devocional; **parama** — supremo; **kāraṇa** — proceso.\"],\"translation\":[\"Por lo tanto, mi querida mente, no te esfuerces en conseguir mala asociación, ganancia, adoración y reconocimiento, sino recuerda siempre los pies de loto de Govinda. Por favor, ocúpate en el amoroso servicio devocional con gran felicidad, y todos los peligros para ti serán destruidos.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"nā\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"koriha\",\"trans\":\"hacer\",\"sep\":\" \"},{\"text\":\"asat\",\"trans\":\"enfermo\",\"sep\":\"-\"},{\"text\":\"cheṣṭa\",\"trans\":\"esfuerzo\",\"sep\":\"        \"},{\"text\":\"lābha\",\"trans\":\"beneficio\",\"sep\":\" \"},{\"text\":\"pūjā\",\"trans\":\"adoración\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"pratiṣṭhā\",\"trans\":\"distinción\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"sadā\",\"trans\":\"siempre\",\"sep\":\" \"},{\"text\":\"chinta\",\"trans\":\"recuerda\",\"sep\":\" \"},{\"text\":\"govinda-charaṇa\",\"trans\":\"los pies de loto de Govinda\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"sakala\",\"trans\":\"todos\",\"sep\":\" \"},{\"text\":\"santāpa\",\"trans\":\"peligro\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"jābe\",\"trans\":\"irá\",\"sep\":\"        \"},{\"text\":\"parānanda\",\"trans\":\"éxtasis\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sukha\",\"trans\":\"feliz\",\"sep\":\" \"},{\"text\":\"pābe\",\"trans\":\"recibirá\",\"sep\":\"\"}],[{\"text\":\"prema-bhakti\",\"trans\":\"amoroso servicio devocional\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"parama\",\"trans\":\"supremo\",\"sep\":\"-\"},{\"text\":\"kāraṇa\",\"trans\":\"proceso\",\"sep\":\"\"}]]},{\"number\":\"15\",\"text\":[\"asat-kriya kuṭināṭi        chāḍa anya paripāṭī\",\"        anya deve nā koriha rati\",\"āpana āpana sthāne        pirīti sabāi ṭāne\",\"        bhakti-pathe paḍaye bigati\"],\"word_by_word\":[\"**asat-kriya** — actividades pecaminosas; **kuṭināṭi** — duplicidad; **chāḍa** — abandonar; **anya** — otro; **paripāṭī** — cuidado del cuerpo; **anya deve** — a otros semidioses; **nā** — no; **koriha** — hacer; **rati** — apego; **āpana āpana** — respectivamente; **sthāne** — lugares; **pirīti** — amor; **sabāi** — todo; **ṭāne** — atrae; **bhakti-pathe** — en el camino de la devoción; **paḍaye** — sucede; **bigati** — comprobado.\"],\"translation\":[\"Por favor, abandona la duplicidad, las actividades ilusorias y la búsqueda de la felicidad para el cuerpo. No te apegues a la adoración de los diversos semidioses. El amor mundano y el afecto por las relaciones materiales atraen a todos a sus respectivas ilusiones, y por eso se detiene el avance en el sendero del servicio devocional.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"asat-kriya\",\"trans\":\"actividades pecaminosas\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"kuṭināṭi\",\"trans\":\"duplicidad\",\"sep\":\"        \"},{\"text\":\"chāḍa\",\"trans\":\"abandonar\",\"sep\":\" \"},{\"text\":\"anya\",\"trans\":\"otro\",\"sep\":\" \"},{\"text\":\"paripāṭī\",\"trans\":\"cuidado del cuerpo\",\"sep\":\"\"}],[{\"text\":\"anya deve\",\"trans\":\"a otros semidioses\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"nā\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"koriha\",\"trans\":\"hacer\",\"sep\":\" \"},{\"text\":\"rati\",\"trans\":\"apego\",\"sep\":\"\"}],[{\"text\":\"āpana āpana\",\"trans\":\"respectivamente\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"sthāne\",\"trans\":\"lugares\",\"sep\":\"        \"},{\"text\":\"pirīti\",\"trans\":\"amor\",\"sep\":\" \"},{\"text\":\"sabāi\",\"trans\":\"todo\",\"sep\":\" \"},{\"text\":\"ṭāne\",\"trans\":\"atrae\",\"sep\":\"\"}],[{\"text\":\"bhakti-pathe\",\"trans\":\"en el camino de la devoción\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"paḍaye\",\"trans\":\"sucede\",\"sep\":\" \"},{\"text\":\"bigati\",\"trans\":\"comprobado\",\"sep\":\"\"}]]},{\"number\":\"16\",\"text\":[\"āpana bhajana-patha        tāhe habe anūrata\",\"        iṣṭa-deva-sthāne-līlā-gāna\",\"naiṣṭhika bhajana ei        tomāre kahinū bhāi\",\"        hanumān tāhāte pramāṇa\"],\"word_by_word\":[\"**āpana** — el propio; **bhajana-patha** — el sendero de la adoración; **tāhe** — en eso; **habe** — será; **anūrata** — adherido; **iṣṭa-deva** — adorable Señor; **sthāne** — en el lugar; **līlā-gāna** — canta los pasatiempos; **naiṣṭhika** — fijo; **bhajana** — adoración; **ei** — esto; **tomāre** — a ti; **kahinū** — hablando; **bhāi** — ¡oh, hermano!; **hanumān** — Śrī Hanumān; **tāhāte** — en eso; **pramāṇa** — ejemplo.\"],\"translation\":[\"Ocúpate continuamente en el sendero de la adoración devocional y desarrolla apego por glorificar los Pasatiempos del Señor Kṛṣṇa en Vṛndāvan. A este proceso de servicio devocional se le conoce como servicio devocional firme. El principal ejemplo de esto es Hanumān.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"āpana\",\"trans\":\"el propio\",\"sep\":\" \"},{\"text\":\"bhajana-patha\",\"trans\":\"el sendero de la adoración\",\"sep\":\"        \",\"error\":\"multi\"},{\"text\":\"tāhe\",\"trans\":\"en eso\",\"sep\":\" \"},{\"text\":\"habe\",\"trans\":\"será\",\"sep\":\" \"},{\"text\":\"anūrata\",\"trans\":\"adherido\",\"sep\":\"\"}],[{\"text\":\"iṣṭa-deva\",\"trans\":\"adorable Señor\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"sthāne\",\"trans\":\"en el lugar\",\"sep\":\"-\"},{\"text\":\"līlā-gāna\",\"trans\":\"canta los pasatiempos\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"naiṣṭhika\",\"trans\":\"fijo\",\"sep\":\" \"},{\"text\":\"bhajana\",\"trans\":\"adoración\",\"sep\":\" \"},{\"text\":\"ei\",\"trans\":\"esto\",\"sep\":\"        \"},{\"text\":\"tomāre\",\"trans\":\"a ti\",\"sep\":\" \"},{\"text\":\"kahinū\",\"trans\":\"hablando\",\"sep\":\" \"},{\"text\":\"bhāi\",\"trans\":\"¡oh, hermano!\",\"sep\":\"\"}],[{\"text\":\"hanumān\",\"trans\":\"Śrī H
