1,"1d:[\"$\",\"$L26\",null,{\"bookId\":\"es\",\"label\":\"Mostrar traducción\",\"song\":{\"meta\":{\"page\":61,\"first_line\":\"saṁsāra-dāvānala-līḍha-loka\"},\"title\":[\"Śrī Śrī Gurvāṣṭakam\"],\"word_by_word\":[\"**śrī śrī guru** — el adorable maestro espiritual; **aṣṭakam** — ocho oraciones.\"],\"author\":[\"Śrīla Viśvanāth Chakravartī Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"saṁsāra-dāvānala-līḍha-loka\",\"trāṇāya kāruṇya-ghanāghanatvam\",\"prāptasya kalyāṇa-guṇārṇavasya\",\"vande guroḥ śrī-charaṇāravindam\"],\"word_by_word\":[\"**saṁsāra** — (de) la existencia material; **dāvā-anala** — (por) el incendio forestal; **līḍha** — afligido; **loka** — la gente; **trāṇāya** — liberar; **kāruṇya** — de misericordia; **ghanāghana-tvam** — densas nubes; **prāptasya** — que ha obtenido; **kalyāṇa** — auspicioso; **guṇa** — (de) cualidades; **arṇavasya** — que es un océano; **vande** — ofrezco reverencias; **guroḥ** — a mi maestro espiritual; **śrī** — auspicioso; **charaṇa** — pies; **aravindam** — tal como lotos.\"],\"translation\":[\"Adoro los pies de loto del Maestro Divino, quien es el océano de lascualidades auspiciosas. A fin de redimir todos los planos de vidaque sufren en el incendio forestal del mundo material, él, como unanube de lluvia de misericordia, derrama en abundancia las aguas de la compasión.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"saṁsāra\",\"trans\":\"(de) la existencia material\",\"sep\":\"-\"},{\"text\":\"dāvānala-līḍha\",\"trans\":\"(por) el incendio forestal\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"loka\",\"trans\":\"afligido\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"trāṇāya\",\"trans\":\"la gente\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kāruṇya\",\"trans\":\"liberar\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"ghanāghanatvam\",\"trans\":\"de misericordia\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"prāptasya kalyāṇa\",\"trans\":\"densas nubes\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"guṇārṇavasya\",\"trans\":\"que ha obtenido\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"vande\",\"trans\":\"auspicioso\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"guroḥ\",\"trans\":\"(de) cualidades\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"śrī\",\"trans\":\"que es un océano\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"charaṇāravindam\",\"trans\":\"ofrezco reverencias\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"2\",\"text\":[\"mahāprabhoḥ kīrtana-nṛtya-gīta-\",\"vāditra-mādyan-manaso rasena\",\"romāñcha-kampāśru-taraṅga-bhājo\",\"vande guroḥ śrī-charaṇāravindam\"],\"word_by_word\":[\"**mahāprabhoḥ** — del Señor Chaitanya Mahāprabhu; **kīrtana** — (por) el canto; **nṛtya** — danza; **gīta** — canto; **vāditra** — tocando instrumentos; **mādyat** — enloquecido; **manasaḥ** — cuya mente; **rasena** — debido a las melosidades de la devoción pura; **roma-añcha** — erizamiento del vello; **kampa** — temblor del cuerpo; **aśru** — lágrimas; **taraṅga** — torrentes; **bhājaḥ** — que siente; **vande** — ofrezco reverencias; **guroḥ** — a mi maestro espiritual; **śrī** — auspicioso; **charaṇa** — pies; **aravindam** — tal como lotos.\"],\"translation\":[\"Adoro los pies de loto del Maestro Divino, cuyo corazón enloquece en el amor nectarino a Śrīman Mahāprabhu mediante el gran canto en congregación del Santo Nombre. Al bailar, cantar, tocar el *khol* y los címbalos, su cuerpo se estremece de júbilo, tiembla, y de sus ojos fluyen torrentes de lágrimas.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"mahāprabhoḥ\",\"trans\":\"del Señor Chaitanya Mahāprabhu\",\"sep\":\" \"},{\"text\":\"kīrtana\",\"trans\":\"(por) el canto\",\"sep\":\"-\"},{\"text\":\"nṛtya\",\"trans\":\"danza\",\"sep\":\"-\"},{\"text\":\"gīta\",\"trans\":\"canto\",\"sep\":\"-\"}],[{\"text\":\"vāditra\",\"trans\":\"tocando instrumentos\",\"sep\":\"-\"},{\"text\":\"m ans\":\"la forma trascendental (de las Deidades)\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"nitya\",\"trans\":\"la adoración\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"nānā\",\"trans\":\"diario\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"śṛṅgāra\",\"trans\":\"(con) varios\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"tan\",\"trans\":\"ropa y adornos\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"mandira\",\"trans\":\"del Señor\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"mārjanādau\",\"trans\":\"(del) templo\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"yuktasya\",\"trans\":\"la limpieza\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bhaktāṁś\",\"trans\":\"primero\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"cha\",\"trans\":\"que está ocupado\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"niyuñjato\",\"trans\":\"sus discípulos\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"’pi\",\"trans\":\"y\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"vande\",\"trans\":\"que se ocupa\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"guroḥ\",\"trans\":\"también\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"śrī\",\"trans\":\"ofrezco reverencias\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"charaṇāravindam\",\"trans\":\"a mi maestro espiritual\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"4\",\"text\":[\"chatur-vidha-śrī-bhagavat-prasāda\",\"svādv-anna-tṛptān hari-bhakta-saṅghān\",\"kṛtvaiva tṛptiṁ bhajataḥ sadaiva\",\"vande guroḥ śrī-charaṇāravindam\"],\"word_by_word\":[\"**chatuḥ** — cuatro; **vidha** — tipos; **śrī** — sagrado; **bhagavat-prasāda** — que se han ofrecido a Kṛṣṇa; **svādu** — apetecible; **anna** — (por) alimentos; **tṛptān** — espiritualmente satisfecho; **hari** — (de) Kṛṣṇa; **bhakta-sanghān** — los devotos reunidos; **kṛtvā** — habiendo hecho; **eva** — así; **tṛptim** — satisfacción; **bhajataḥ** — que siente; **sada** — siempre; **eva** — ciertamente; **vande** — ofrezco reverencias; **guroḥ** — a mi maestro espiritual; **śrī** — auspicioso; **charaṇa** — pies; **aravindam** — tal como lotos.\"],\"translation\":[\"Adoro los pies de loto del Maestro Divino, quien complace completamente a los devotos de Śrī Kṛṣṇa con cuatro clases de *prasādam* nectáreo, alimentos que se mastican, chupan, lamen y beben (es decir, hace que se disipe la mundanidad y que se despierte la alegría del amor que surge por honrar el *prasādam*), y, de ese modo, él queda satisfecho.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"chatur\",\"trans\":\"cuatro\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"vidha\",\"trans\":\"tipos\",\"sep\":\"-\"},{\"text\":\"śrī\",\"trans\":\"sagrado\",\"sep\":\"-\"},{\"text\":\"bhagavat-prasāda\",\"trans\":\"que se han ofrecido a Kṛṣṇa\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"svādv\",\"trans\":\"apetecible\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"anna\",\"trans\":\"(por) alimentos\",\"sep\":\"-\"},{\"text\":\"tṛptān\",\"trans\":\"espiritualmente satisfecho\",\"sep\":\" \"},{\"text\":\"hari\",\"trans\":\"(de) Kṛṣṇa\",\"sep\":\"-\"},{\"text\":\"bhakta-saṅghān\",\"trans\":\"los devotos reunidos\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"kṛtvaiva\",\"trans\":\"habiendo hecho\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"tṛptiṁ\",\"trans\":\"así\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bhajataḥ\",\"trans\":\"satisfacción\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sadaiva\",\"trans\":\"que siente\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"vande\",\"trans\":\"siempre\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"guroḥ\",\"trans\":\"ciertamente\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"śrī\",\"trans\":\"ofrezco reverencias\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"charaṇāravindam\",\"trans\":\"a mi maestro espiritual\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"5\",\"text\":[\"śrī-rādhikā-mādhavayor apāra-\",\"mādhurya-līlā-guṇa-rūpa-nāmnām\",\"prati-kṣaṇāsvādana-lolupasya\",\"vande guroḥ śrī-charaṇāravindam\"],\"word_by_word\":[\"**śrī-rādhikā** — (de) Śrīmatī Rādhārāṇī; **mādhavayoḥ** — del Señor Mādhava (Kṛṣṇa); **apāra** — ilimitado; **mādhurya** — conyugal; **līlā** — pasatiempos; **guṇa** — cualidades; **rūpa** — formas; **nāmnām** — de los santos nombres; **prati-kṣaṇa** — en cada momento; **āsvādana** — saboreando; **lolupasya** — que aspira a; **vande** — ofrezco reverencias; **guroḥ** — a mi maestro espiritual; **śrī** — auspicioso; **charaṇa** — pies; **aravindam** — tal como lotos.\"],\"translation\":[\"Adoro los pies de loto del Maestro Divino, cuyo corazón insaciablemente desea saborear los infinitos Santos Nombres, formas, cualidades y pasatiempos de Śrī Śrī Rādhā-Mādhava, los cuales están plenos de la dulzura del amor divino.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"śrī-rādhikā\",\"trans\":\"(de) Śrīmatī Rādhārāṇī\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"mādhavayor\",\"trans\":\"del Señor Mādhava (Kṛṣṇa)\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"apāra\",\"trans\":\"ilimitado\",\"sep\":\"-\"}],[{\"text\":\"mādhurya\",\"trans\":\"conyugal\",\"sep\":\"-\"},{\"text\":\"līlā\",\"trans\":\"pasatiempos\",\"sep\":\"-\"},{\"text\":\"guṇa\",\"trans\":\"cualidades\",\"sep\":\"-\"},{\"text\":\"rūpa\",\"trans\":\"formas\",\"sep\":\"-\"},{\"text\":\"nāmnām\",\"trans\":\"de los santos nombres\",\"sep\":\"\"}],[{\"text\":\"prati-kṣaṇāsvādana\",\"trans\":\"en cada momento\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"lolupasya\",\"trans\":\"saboreando\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"vande\",\"trans\":\"que aspira a\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"guroḥ\",\"trans\":\"ofrezco reverencias\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"śrī\",\"trans\":\"a mi maestro espiritual\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"charaṇāravindam\",\"trans\":\"auspicioso\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"6\",\"text\":[\"nikuñja-yūno rati-keli-siddhyair\",\"yā yālibhir yuktir apekṣaṇīyā\",\"tatrāti-dākṣyād ati-vallabhasya\",\"vande guroḥ śrī-charaṇāravindam\"],\"word_by_word\":[\"**nikuñja** — lugar de disfrute; **yūnaḥ** — de la juventud (de Rādhā y Kṛṣṇa); **rati** — (del) amor conyugal; **keli** — (de) pasatiempos; **siddhyai** — por la perfección; **yā yā** — lo que sea; **ālibhiḥ** — por las *gopīs*; **yuktiḥ** — arreglos; **apekṣaṇīyā** — deseable; **tatra** — en relación con eso; **ati-dākṣyāt** — por ser muy experto; **ati-vallabhasya** — que es muy querido; **vande** — ofrezco reverencias; **guroḥ** — a mi maestro espiritual; **śrī** — auspicioso; **charaṇa** — pies; **aravindam** — tal como lotos.\"],\"translation\":[\"Adoro los pies de loto del Maestro Divino, quien es extremadamente querido por la Suprema Pareja Divina, quienes juegan en los bosquecillos de Vraja. Él es muy experto en esas ocupaciones apropiadas que las *sakhīs* realizan con el fin de servir a los Pasatiempos amorosos de la Pareja Divina.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"nikuñja\",\"trans\":\"lugar de disfrute\",\"sep\":\"-\"},{\"text\":\"yūno\",\"trans\":\"de la juventud (de Rādhā y Kṛṣṇa)\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"rati\",\"trans\":\"(del) amor conyugal\",\"sep\":\"-\"},{\"text\":\"keli\",\"trans\":\"(de) pasatiempos\",\"sep\":\"-\"},{\"text\":\"siddhyair\",\"trans\":\"por la perfección\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"yā yālibhir\",\"trans\":\"lo que sea\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"yuktir\",\"trans\":\"por las *gopīs*\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"apekṣaṇīyā\",\"trans\":\"arreglos\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"tatrāti\",\"trans\":\"deseable\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"dākṣyād\",\"trans\":\"en relación con eso\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"ati-vallabhasya\",\"trans\":\"por ser muy experto\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"vande guroḥ\",\"trans\":\"que es muy querido\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"śrī\",\"trans\":\"ofrezco reverencias\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"charaṇāravindam\",\"trans\":\"a mi maestro espiritual\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"7\",\"text\":[\"sākṣād dharitvena samasta-śāstrair\",\"uktas tathā bhāvyata eva sadbhiḥ\",\"kintu prabhor yaḥ priya eva tasya\",\"vande guroḥ śrī-charaṇāravindam\"],\"word_by_word\":[\"**sākṣat** — directamente; **hari-tvena** — con la cualidad de Hari; **samasta** — todos; **śāstraiḥ** — por las escrituras; **uktaḥ** — reconocido; **tathā** — por lo tanto; **bhāvyate** — se manifiesta; **eva** — también; **sadbhiḥ** — por grandes personas santas; **kintu** — sin embargo; **prabhoḥ** — al Señor; **yaḥ** — quién; **priyaḥ** — querido; **eva** — ciertamente; **tasya** — de él (el guru); **vande** — ofrezco reverencias; **guroḥ** — a mi maestro espiritual; **śrī** — auspicioso; **charaṇa** — pies; **aravindam** — tal como lotos.\"],\"translation\":[\"Adoro los pies de loto del Maestro Divino, quien es una manifestación,simultánea e inconcebiblemente igual y diferente de la SupremaPersonalidad de Dios. Todas las Escrituras lo glorifican por ser unaforma directa, no diferente del Señor Supremo, Śrī Hari, y los santospuros también reconocen ese hecho; con todo, él es el más querido del Señor.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"sākṣād\",\"trans\":\"directamente\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"dharitvena samasta\",\"trans\":\"con la cualidad de Hari\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"śāstrair\",\"trans\":\"todos\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"uktas\",\"trans\":\"por las escrituras\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"tathā\",\"trans\":\"reconocido\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bhāvyata\",\"trans\":\"por lo tanto\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"eva\",\"trans\":\"se manifiesta\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sadbhiḥ\",\"trans\":\"también\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"kintu\",\"trans\":\"por grandes personas santas\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"prabhor\",\"trans\":\"sin embargo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"yaḥ\",\"trans\":\"al Señor\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"priya\",\"trans\":\"quién\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"eva\",\"trans\":\"querido\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"tasya\",\"trans\":\"ciertamente\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"vande\",\"trans\":\"de él (el guru)\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"guroḥ\",\"trans\":\"ofrezco reverencias\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"śrī\",\"trans\":\"a mi maestro espiritual\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"charaṇāravindam\",\"trans\":\"auspicioso\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"8\",\"text\":[\"yasya prasādād bhagavat-prasādo\",\"yasyāprasādān na gatiḥ kuto ’pi\",\"dhyāyaṁ stuvaṁs tasya yaśas tri-sandhyaṁ\",\"vande guroḥ śrī-charaṇaravindam\"],\"word_by_word\":[\"**yasya** — de quien (el maestro espiritual); **prasādād** — por la gracia; **bhagavat** — (de) Kṛṣṇa; **prasādaḥ** — la misericordia; **yasya** — de quien; **aprasādāt** — sin la gracia; **na** — no; **gatiḥ** — medio de progreso; **kutaḥ api** — de cualquier parte; **dhyāyan** — meditando sobre; **stuvan** — alabando; **tasya** — de él (el maestro espiritual); **yaśaḥ** — la gloria; **tri-sandhyaṁ** — tres veces al día (amanecer, mediodía y atardecer); **vande** — ofrezco reverencias; **guroḥ** — a mi maestro espiritual; **śrī** — auspicioso; **charaṇa** — pies; **aravindam** — tal como lotos.\"],\"translation\":[\"Adoro los pies de loto del Maestro Divino, siempre cantando sus glorias y meditando en él tres veces al día. Por su misericordia, uno obtiene la gracia del Señor. Si él no está complacido, el alma no tiene refugio en ninguna parte.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"yasya\",\"trans\":\"de quien (el maestro espiritual)\",\"sep\":\" \"},{\"text\":\"prasādād\",\"trans\":\"por la gracia\",\"sep\":\" \"},{\"text\":\"bhagavat\",\"trans\":\"(de) Kṛṣṇa\",\"sep\":\"-\"},{\"text\":\"prasādo\",\"trans\":\"la misericordia\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"yasyāprasādān\",\"trans\":\"de quien\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"na\",\"trans\":\"sin la gracia\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"gatiḥ\",\"trans\":\"no\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kuto\",\"trans\":\"medio de progreso\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"’pi\",\"trans\":\"de cualquier parte\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"dhyāyaṁ\",\"trans\":\"meditando sobre\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"stuvaṁs\",\"trans\":\"alabando\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"tasya\",\"trans\":\"de él (el maestro espiritual)\",\"sep\":\" \"},{\"text\":\"yaśas\",\"trans\":\"la gloria\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"tri-sandhyaṁ\",\"trans\":\"tres veces al día (amanecer, mediodía y atardecer)\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"vande\",\"trans\":\"ofrezco reverencias\",\"sep\":\" \"},{\"text\":\"guroḥ\",\"trans\":\"a mi maestro espiritual\",\"sep\":\" \"},{\"text\":\"śrī\",\"trans\":\"auspicioso\",\"sep\":\"-\"},{\"text\":\"charaṇaravindam\",\"trans\":\"pies\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"9\",\"text\":[\"śrīmad guroraṣṭakam etad uchchair\",\"brāhme muhūrte paṭhati prayātnāt\",\"yas tena vṛndāvana-nātha-sākṣāt\",\"sevaiva labhyā januṣo’nta eva\"],\"word_by_word\":[\"**śrīmad-guror aṣṭakam** — los ocho versos que glorifican al maestro espiritual; **etad** — así; **ucchaiḥ** — muy fuerte; **brāhme muhūrte** — en el momento auspicioso de Brāhma Muhurta; **paṭhati** — recita; **prayatnāt** — con gran cuidado; **yaḥ tena** — por esa persona; **vṛndāvana-nātha** — el Señor de Vṛndāvan; **sākṣāt** — personalmente; **sevaiva** — del servicio; **labhyā** — ganancia; **januṣo’nta** — al final de la vida; **eva** — ciertamente.\"],\"translation\":[\"Aquel que, durante el Brāhma-muhūrta (noventa y seis minutos antes de la salida del sol) canta con regularidad y sinceridad estas ocho oraciones al Maestro Divino, tras abandonar el cuerpo en su perfección espiritual, alcanza la cualificación de ocuparse en el servicio directo a Śrī Kṛṣṇa, el Señor de Vṛndāvan.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"śrīmad guroraṣṭakam etad\",\"trans\":\"los ocho versos que glorifican al maestro espiritual\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"uchchair\",\"trans\":\"así\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"brāhme\",\"trans\":\"muy fuerte\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"muhūrte paṭhati\",\"trans\":\"en el momento auspicioso de Brāhma Muhurta\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"prayātnāt\",\"trans\":\"recita\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"yas\",\"trans\":\"con gran cuidado\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"tena vṛndāvana\",\"trans\":\"por esa persona\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"nātha-sākṣāt\",\"trans\":\"el Señor de Vṛndāvan\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"sevaiva\",\"trans\":\"personalmente\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"labhyā\",\"trans\":\"del servicio\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"januṣo\",\"trans\":\"ganancia\",\"sep\":\"’\",\"error\":\"mismatch\"},{\"text\":\"nta eva\",\"tr
