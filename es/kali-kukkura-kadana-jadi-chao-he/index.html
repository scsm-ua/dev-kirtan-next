"de la era de riña\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"pāvana\",\"trans\":\"salvador\",\"sep\":\"        \"},{\"text\":\"kali\",\"trans\":\"de *kali*\",\"sep\":\"-\"},{\"text\":\"bhaya\",\"trans\":\"temor\",\"sep\":\"-\"},{\"text\":\"nāśana\",\"trans\":\"destructor\",\"sep\":\"\"}],[{\"text\":\"śrī-śachī\",\"trans\":\"de Śachī\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"nandana\",\"trans\":\"querido hijo\",\"sep\":\" \"},{\"text\":\"gāo\",\"trans\":\"canta\",\"sep\":\" \"},{\"text\":\"he\",\"trans\":\"¡oh!\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"gadādhara-mādana        nitāiyera prāṇa-dhana\",\"    advaitera prapūjita gorā\",\"nimāi viśvambhara        śrīnivāsa-īśvara\",\"    bhakata-samūha chita-chorā\"],\"word_by_word\":[\"**gadādhara** — de Gadādhar; **mādana** — cupido; **nitāi** — Nityānanda; **yera** — es de; **prāṇa** — vida; **dhana** — riqueza; **advaitera** — de Advaita; **prapūjita** — adorable; **gorā** — el Señor Chaitanya; **nimāi** — Nimāi (nació bajo un árbol de *Neem*); **viśvambhara** — Viśvambhar; (**viśva** — universo; **ambhara** — sustenta); **śrīnivāsa** — Śrīvās; **īśvara** — controlador, amo; **bhakata** — devoto; **samūha** — muchos; **chita** — corazón; **chorā** — ladrón.\"],\"translation\":[\"Él es el cupido trascendental de Gadādhar, la vida y alma de Nityānanda Prabhu, y el Dios adorable de Śrī Advaita Āchārya. Él es conocido como Nimāi, ya que nació bajo un árbol de Neem, y como Viśvambhar, ya que es el sustentador del universo. Él es el amo de Śrīvās y quien le roba el corazón a todos los devotos.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gadādhara\",\"trans\":\"de Gadādhar\",\"sep\":\"-\"},{\"text\":\"mādana\",\"trans\":\"cupido\",\"sep\":\"        \"},{\"text\":\"nitāiyera\",\"trans\":\"Nityānanda\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"prāṇa\",\"trans\":\"es de\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"dhana\",\"trans\":\"vida\",\"sep\":\"\",\"error :true,\"inline_word_by_word\":[[{\"text\":\"nadīyā\",\"trans\":\"en Nadia\",\"sep\":\"-\"},{\"text\":\"śaśadhara\",\"trans\":\"la luna\",\"sep\":\"        \"},{\"text\":\"māyāpura\",\"trans\":\"deMāyāpur\",\"sep\":\"-\"},{\"text\":\"īśvara\",\"trans\":\"amo\",\"sep\":\"\"}],[{\"text\":\"nāma\",\"trans\":\"nombre\",\"sep\":\"-\"},{\"text\":\"pravartana\",\"trans\":\"propagar\",\"sep\":\"-\"},{\"text\":\"śūra\",\"trans\":\"entonar\",\"sep\":\"\"}],[{\"text\":\"gṛhī\",\"trans\":\"casados\",\"sep\":\"-\"},{\"text\":\"jana\",\"trans\":\"pesonas\",\"sep\":\"-\"},{\"text\":\"śikṣaka\",\"trans\":\"instructor\",\"sep\":\"        \"},{\"text\":\"nyāsi\",\"trans\":\"un*sannyāsī*\",\"sep\":\"-\"},{\"text\":\"kula\",\"trans\":\"lineaje\",\"sep\":\"-\"},{\"text\":\"nāyaka\",\"trans\":\"líder\",\"sep\":\"\"}],[{\"text\":\"mādhava\",\"trans\":\"esposo de la diosa de la fortuna (Kṛṣṇa)\",\"sep\":\" \"},{\"text\":\"rādhā\",\"trans\":\"Rādhārāṇī\",\"sep\":\"-\"},{\"text\":\"bhāva\",\"trans\":\"amor extático\",\"sep\":\"-\"},{\"text\":\"pūra\",\"trans\":\"presente\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"sārvabhauma-śodhana    gajapati-tāraṇa\",\"    rāmānanda-poṣaṇa vīra\",\"rūpānanda-vardhana        sanātana-pālana\",\"    haridāsa-modana dhīra\"],\"word_by_word\":[\"**sārvabhauma** — de Sārvabhauma; **śodhana** — purificación; **gajapati** — el rey de Orissa; **tāraṇa** — liberador; **rāmānanda** — de Rāmānanda Rāy; **poṣaṇa** — sustentador; **vīra** — héroe; **rūpa** — de Śrī Rūpa; **ānanda** — éxtasis; **vardhana** — incrementa; **sanātana** — de Sanātan Goswāmī; **pālana** — protector; **haridāsa** — de Haridās Ṭhākur; **modana** — nutre; **dhīra** — sobrio.\"],\"translation\":[\"Él purificó a Sārvabhauma Bhaṭṭāchārya y rescató a Mahārāj Pratāparudra, el gran rey de Orissa. Es el héroe y protector de Rāmānanda Rāya. Incrementa el éxtasis de Śrīla Rūpa Goswāmī, es el guardián de Sanātan Goswāmī y deleita al sobrio Haridās Ṭhākur.\"],\"isWbwInlineModeAvailable\":false,\"inl
