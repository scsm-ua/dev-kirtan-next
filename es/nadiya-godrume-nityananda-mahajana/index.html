ado a liberar a todas las almas caídas.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"nadīyā\",\"trans\":\"en Nadia\",\"sep\":\"-\"},{\"text\":\"godrume\",\"trans\":\"en Godruma; (\",\"sep\":\" \"},{\"text\":\"nityānanda\",\"trans\":\"vaca\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"mahājana\",\"trans\":\"árboles)\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"pātiyāche nāma\",\"trans\":\"Nityānanda la gran alma\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"haṭṭa\",\"trans\":\"ha establecido\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"jivera karaṇa\",\"trans\":\"el mercado del santo nombre\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"2\",\"text\":[\"(śraddhāvān jana he, śraddhāvān jana he)\",\"prabhura ājñāya, bhāi, māgi ei bhikṣā\",\"bolo ‘kṛṣṇa,’ bhajo kṛṣṇa, koro kṛṣṇa-śikṣā\"],\"word_by_word\":[\"**śraddhāvān** — fielmente; **jana he** — ¡oh personas!; **śraddhāvān** — fielmente; **jana he** — ¡oh personas!; **prabhura** — del Señor; **ājñāya** — por la orden; **bhāi** — hermano; **māgi** — pido; **ei** — esta; **bhikṣā** — caridad; **bolo ‘kṛṣṇa’** — canta Kṛṣṇa; **bhajo kṛṣṇa** — adora a Kṛṣṇa; **koro** — haz; **kṛṣṇa-śikṣā** — las instrucciones de Kṛṣṇa.\"],\"translation\":[\"¡Oh, personas de fe! ¡Oh, personas de fe! ¡Oh, hermanos! Por instrucción del Señor Gaurāṅga les hago estas tres peticiones: Canten “¡Kṛṣṇa!”, adoren a Kṛṣṇa y enséñenle a otros acerca de Kṛṣṇa.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"(śraddhāvān\",\"trans\":\"fielmente\",\"sep\":\" \"},{\"text\":\"jana he\",\"trans\":\"¡oh personas!\",\"sep\":\", \",\"error\":\"multi\"},{\"text\":\"śraddhāvān\",\"trans\":\"fielmente\",\"sep\":\" \"},{\"text\":\"jana he\",\"trans\":\"¡oh personas!\",\"sep\":\")\",\"error\":\"multi\"}],[{\"text\":\"prabhura\",\"trans\":\"del Señor\",\"sep\":\" \"},{\"text\":\"ājñāya\",\"trans\":\"por la orden\",\"sep\":\", \"},{\"text\":\"bhāi\",\"trans\":\"hermano\",\"sep\":\", \"},{\"text\":\"māgi\",\"trans\":\"pido\",\"sep\":\" \"},{\"text\":\"ei\",\"trans\":\"esta\",\"sep\":\" \"},{\"text\":\"bhikṣā\",\"trans\":\"caridad\",\"sep\":\"\"}],[{\"text\":\"bolo ‘kṛṣṇa\",\"trans\":\"canta Kṛṣṇa\",\"sep\":\",’ \",\"error\":\"multi\"},{\"text\":\"bhajo kṛṣṇa\",\"trans\":\"adora a Kṛṣṇa\",\"sep\":\", \",\"error\":\"multi\"},{\"text\":\"koro\",\"trans\":\"haz\",\"sep\":\" \"},{\"text\":\"kṛṣṇa-śikṣā\",\"trans\":\"las instrucciones de Kṛṣṇa\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"3\",\"text\":[\"aparādha-śūnya ho’ye loha kṛṣṇa-nāma\",\"kṛṣṇa mātā, kṛṣṇa pita, kṛṣṇa dhana-prāṇa\"],\"word_by_word\":[\"**aparādha** — ofensas; **śūnya** — desprovisto; **ho’ye** — hacer; **loha** — aceptar; **kṛṣṇa-nāma** — el nombre de Kṛṣṇa; **kṛṣṇa** — Kṛṣṇa; **mātā** — madre; **kṛṣṇa** — Kṛṣṇa; **pita** — padre; **kṛṣṇa** — Kṛṣṇa; **dhana** — riqueza; **prāṇa** — vida.\"],\"translation\":[\"Tengan cuidado de permanecer libres de cometer ofensas; solo tomen el Santo Nombre del Señor Kṛṣṇa. Kṛṣṇa es su madre, Kṛṣṇa es su padre y Kṛṣṇa es el tesoro de la vida de ustedes.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"aparādha\",\"trans\":\"ofensas\",\"sep\":\"-\"},{\"text\":\"śūnya\",\"trans\":\"desprovisto\",\"sep\":\" \"},{\"text\":\"ho’ye\",\"trans\":\"hacer\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"loha\",\"trans\":\"aceptar\",\"sep\":\" \"},{\"text\":\"kṛṣṇa-nāma\",\"trans\":\"el nombre de Kṛṣṇa\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"kṛṣṇa\",\"trans\":\"Kṛṣṇa\",\"sep\":\" \"},{\"text\":\"mātā\",\"trans\":\"madre\",\"sep\":\", \"},{\"text\":\"kṛṣṇa\",\"trans\":\"Kṛṣṇa\",\"sep\":\" \"},{\"text\":\"pita\",\"trans\":\"padre\",\"sep\":\", \"},{\"text\":\"kṛṣṇa\",\"trans\":\"Kṛṣṇa\",\"sep\":\" \"},{\"text\":\"dhana\",\"trans\":\"riqueza\",\"sep\":\"-\"},{\"text\":\"prāṇa\",\"trans\":\"vida\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"kṛṣṇera saṁsāra koro chāḍi’ anāchāra\",\"jīve doyā, kṛṣṇa-nāma—sarvva-dharma-sāra\"],\"word_by_word\":[\"**kṛṣṇera** — de Kṛṣṇa; **saṁsāra** — mundo material; **koro** — hacer; **chāḍi’** — renunciar; **anāchāra** — pecados; **jīve** — de las almas; **doyā** — compasión; **kṛṣṇa-nāma** — el nombre de Kṛṣṇa; **sarvva** — todo; **dharma** — religión; **sāra** — escencia.\"],\"translation\":[\"Abandonen todas las actividades pecaminosas, lleven a cabo sus deberes en este mundo relacionándolos únicamente con el Señor Kṛṣṇa. La esencia de toda forma de religión la constituye el ser compasivo con otras almas por cantar fuertemente los Santos Nombres de Kṛṣṇa.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"kṛṣṇera\",\"trans\":\"de Kṛṣṇa\",\"sep\":\" \"},{\"text\":\"saṁsāra\",\"trans\":\"mundo material\",\"sep\":\" \"},{\"text\":\"koro\",\"trans\":\"hacer\",\"sep\":\" \"},{\"text\":\"chāḍi\",\"trans\":\"renunciar\",\"sep\":\"’ \"},{\"text\":\"anāchāra\",\"trans\":\"pecados\",\"sep\":\"\"}],[{\"text\":\"jīve\",\"trans\":\"de las almas\",\"sep\":\" \"},{\"text\":\"doyā\",\"trans\":\"compasión\",\"sep\":\", \"},{\"text\":\"kṛṣṇa-nāma—sarvva\",\"trans\":\"el nombre de Kṛṣṇa\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"dharma\",\"trans\":\"todo\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"sāra\",\"trans\":\"religión\",\"sep\":\"\",\"error\":\"mismatch\"}]]}],\"hasWbw\":true,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"17:[\"$\",\"$L1f\",null,{\"navMap\":{\"115\":{\"prev\":{\"path\":\"/es/sujanarvuda-radhita-pada-yugam/\",\"title\":\"Śrī Śrīla Prabhupāda-padma Stavakaḥ\"},\"next\":{\"path\":\"/es/nitai-pada-kamala-koti-chandra-sushitala/\",\"title\":\"Manaḥ-śikṣā\"}}}}]\n20:Tba0,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organiz
