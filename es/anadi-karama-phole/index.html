ext\":\"bhavāmbudhau\",\"trans\":\"en el océano de la nesciencia\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"kṛpayā\",\"trans\":\"por misericordia sin causa\",\"sep\":\" \"},{\"text\":\"tava\",\"trans\":\"tus\",\"sep\":\" \"},{\"text\":\"pāda-paṅkaja\",\"trans\":\"pies de loto\",\"sep\":\"-\",\"error\":\"multi\"}],[{\"text\":\"sthita\",\"trans\":\"situado en\",\"sep\":\"-\"},{\"text\":\"dhūlī\",\"trans\":\"el polvo\",\"sep\":\"-\"},{\"text\":\"sadṛśaṁ\",\"trans\":\"igual que\",\"sep\":\" \"},{\"text\":\"vichintaya\",\"trans\":\"por favor considera\",\"sep\":\"\"}]]},{\"number\":\"1\",\"text\":[\"anādi karama-phole,        poḍi bhavārṇava-jole,\",\"        toribāre nā dekhi upāy,\",\"e-viṣoya-holāhole,        divā-niśi hiyā jvole,\",\"        mon kobhu sukha nāhi pāy\"],\"word_by_word\":[\"**anādi** — sin comienzo; **karama** — del *karma*; **phole** — del fruto; **poḍi** — caer; **bhava** — del nacimiento y muerte; **ārṇava** — del océano; **jole** — en el agua; **toribāre** — cruzar; **nā** — no; **dekhi** — veo; **upāy** — una manera; **e-viṣoya** — de los objetos de los sentidos; **holāhole** — veneno; **divā** — día; **niśi** — noche; **hiyā** — el corazón; **jvole** — quema; **mon** — la mente; **kobhu** — ¿cuándo?; **sukha** — felicidad; **nāhi** — no; **pāy** — obtiene.\"],\"translation\":[\"He caído dentro del océano de la existencia material, como resultado de mis egoístas actividades fruitivas, las cuales no tienen principio. Y ahora no encuentro los medios de liberación. Día y noche mi corazón se quema debido al malicioso veneno de estos asuntos mundanos, y debido a eso, mi mente nunca encuentra felicidad verdadera alguna.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"anādi\",\"trans\":\"sin comienzo\",\"sep\":\" \"},{\"text\":\"karama\",\"trans\":\"del *karma*\",\"sep\":\"-\"},{\"text\":\"phole\",\"trans\":\"del fruto\",\"sep\":\",        \"},{\"text\":\"poḍi\",\"trans\":\"caer\",\"sep\":\" \"},{\"text\":\"bhavārṇava\",\"trans\":\"del nacimiento y muerte\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"jole\",\"trans\":\"del océano\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"toribāre\",\"trans\":\"en el agua\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nā\",\"trans\":\"cruzar\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"dekhi\",\"trans\":\"no\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"upāy\",\"trans\":\"veo\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"e\",\"trans\":\"una manera\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"viṣoya-holāhole\",\"trans\":\"de los objetos de los sentidos\",\"sep\":\",        \",\"error\":\"mismatch\"},{\"text\":\"divā\",\"trans\":\"veneno\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"niśi\",\"trans\":\"día\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hiyā\",\"trans\":\"noche\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"jvole\",\"trans\":\"el corazón\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"mon\",\"trans\":\"quema\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kobhu\",\"trans\":\"la mente\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sukha\",\"trans\":\"¿cuándo?\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nāhi\",\"trans\":\"felicidad\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"pāy\",\"trans\":\"no\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"2\",\"text\":[\"āśā-pāśa-śata, śata    kleśa deya abirata,\",\"        pravṛti-ūrmira tāhe khelā\",\"kāma-krodha-ādi choy,    bāṭapāḍe dey bhoy,\",\"        abasāna hoilo āsi belā\"],\"word_by_word\":[\"**āśā** — deseos; **pāśa** — cuerdas; **śata, śata** — cientos y cientos; **kleśa** — miserias; **deya** — dado; **abirata** — sin parar; **pravṛti** — acción; **ūrmira** — olas; **tāhe** — en eso; **khelā** — jugando; **kāma-krodha-ādi** — comenzando con lujuria e ira; **choy** — seis; **bāṭapāḍe** — ladrones; **dey** — dado; **bhoy** — miedo; **abasāna** — oportunidad; **hoilo** — es; **āsi** — tomar; **belā** — fue.\"],\"translation\":[\"Me encuentro atado por cientos y cientos de deseos que me provocan una interminable aflicción, y esos deseos surgen en las olas de una siempre creciente tendencia materialista. La lujuria, la ira, la codicia, la ilusión y la envidia son como seis asaltantes de caminos que me hacen sentirme sumamente temeroso, y mi vida está llegando a su fin de esa manera.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"āśā\",\"trans\":\"deseos\",\"sep\":\"-\"},{\"text\":\"pāśa\",\"trans\":\"cuerdas\",\"sep\":\"-\"},{\"text\":\"śata, śata\",\"trans\":\"cientos y cientos\",\"sep\":\"    \",\"error\":\"multi\"},{\"text\":\"kleśa\",\"trans\":\"miserias\",\"sep\":\" \"},{\"text\":\"deya\",\"trans\":\"dado\",\"sep\":\" \"},{\"text\":\"abirata\",\"trans\":\"sin parar\",\"sep\":\",\"}],[{\"text\":\"pravṛti\",\"trans\":\"acción\",\"sep\":\"-\"},{\"text\":\"ūrmira\",\"trans\":\"olas\",\"sep\":\" \"},{\"text\":\"tāhe\",\"trans\":\"en eso\",\"sep\":\" \"},{\"text\":\"khelā\",\"trans\":\"jugando\",\"sep\":\"\"}],[{\"text\":\"kāma-krodha-ādi\",\"trans\":\"comenzando con lujuria e ira\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"choy\",\"trans\":\"seis\",\"sep\":\",    \"},{\"text\":\"bāṭapāḍe\",\"trans\":\"ladrones\",\"sep\":\" \"},{\"text\":\"dey\",\"trans\":\"dado\",\"sep\":\" \"},{\"text\":\"bhoy\",\"trans\":\"miedo\",\"sep\":\",\"}],[{\"text\":\"abasāna\",\"trans\":\"oportunidad\",\"sep\":\" \"},{\"text\":\"hoilo\",\"trans\":\"es\",\"sep\":\" \"},{\"text\":\"āsi\",\"trans\":\"tomar\",\"sep\":\" \"},{\"text\":\"belā\",\"trans\":\"fue\",\"sep\":\"\"}]]},{\"number\":\"3\",\"text\":[\"jñāna-karma-ṭhāga dui,        more pratāriyā loi,\",\"        abaśeṣe phele sindhu-jole\",\"e heno somoye, bandhu,        tumi kṛṣṇa kṛpā-sindhu\",\"        kṛpā kori’ tolo more bale\"],\"word_by_word\":[\"**jñāna** — conocimiento; **karma** — actividad fruitiva; **ṭhāga** — estafador; **dui** — dos; **more** — mío; **pratāriyā** — engañar; **loi** — acepta; **abaśeṣe** — el fin; **phele** — lanza; **sindhu-jole** — en el océano; **e** — esto; **heno** — de esa manera; **somoye** — en ese momento; **bandhu** — amigo; **tumi** — Tú; **kṛṣṇa** — Kṛṣṇa; **kṛpā-sindhu** — océano de misericordia; **kṛpā kori’** — otorga misericordia; **tolo** — recoge; **more** — mío; **bale** — fuerza.\"],\"translation\":[\"Los dos asaltantes de caminos llamados el conocimiento intelectual y la actividad fruitiva me engañaron y me descarriaron, y finalmente me arrojaron al océano de la miseria. En un momento como este, querido Kṛṣṇa, Tú eres mi único amigo. Eres un océano de misericordia. Por favor, sé bondadoso conmigo y, mediante Tu divino poder, levántame de esta condición de sufrimiento.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"jñāna\",\"trans\":\"conocimiento\",\"sep\":\"-\"},{\"text\":\"karma\",\"trans\":\"actividad fruitiva\",\"sep\":\"-\"},{\"text\":\"ṭhāga\",\"trans\":\"estafador\",\"sep\":\" \"},{\"text\":\"dui\",\"trans\":\"dos\",\"sep\":\",        \"},{\"text\":\"more\",\"trans\":\"mío\",\"sep\":\" \"},{\"text\":\"pratāriyā\",\"trans\":\"engañar\",\"sep\":\" \"},{\"text\":\"loi\",\"trans\":\"acepta\",\"sep\":\",\"}],[{\"text\":\"abaśeṣe\",\"trans\":\"el fin\",\"sep\":\" \"},{\"text\":\"phele\",\"trans\":\"lanza\",\"sep\":\" \"},{\"text\":\"sindhu-jole\",\"trans\":\"en el océano\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"e\",\"trans\":\"esto\",\"sep\":\" \"},{\"text\":\"heno\",\"trans\":\"de esa manera\",\"sep\":\" \"},{\"text\":\"somoye\",\"trans\":\"en ese momento\",\"sep\":\", \"},{\"text\":\"bandhu\",\"trans\":\"amigo\",\"sep\":\",        \"},{\"text\":\"tumi\",\"trans\":\"Tú\",\"sep\":\" \"},{\"text\":\"kṛṣṇa\",\"trans\":\"Kṛṣṇa\",\"sep\":\" \"},{\"text\":\"kṛpā-sindhu\",\"trans\":\"océano de misericordia\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"kṛpā kori\",\"trans\":\"otorga misericordia\",\"sep\":\"
