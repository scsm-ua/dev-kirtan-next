lante\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"girā\",\"trans\":\"siendo ahogado\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"pulakair\",\"trans\":\"mis palabras\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nichitaṁ\",\"trans\":\"por vellos que se erizan\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"vapuḥ\",\"trans\":\"cubierto\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kadā\",\"trans\":\"mi cuerpo\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"tava\",\"trans\":\"¿cuándo?\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nāma\",\"trans\":\"tu\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"grahaṇe bhaviṣyati\",\"trans\":\"al cantar el Santo Nombre\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"1\",\"text\":[\"aparādha-phole mama        chitta bhela vajra sama\",\"        tuyā nāme nā lobhe bikāra\",\"hatāś hoiya hari            tava nāma ucha kori\",\"        boḍo duḥkhe ḍāki bāro bāro\"],\"word_by_word\":[\"**aparādha** — ofensas; **phole** — del fruto; **mama** — mío; **chitta** — corazón; **bhela** — fue; **vajra** — trueno; **sama** — tal como; **tuyā** — de Tí; **nāme** — en el nombre; **nā** — no; **lobhe** — obtenido; **bikāra** — éxtasis; **hatāś** — destruído; **hoiya** — eso es; **hari** — de Hari; **tava** — Tuyo; **nāma** — el nombre; **ucha** — alto; **kori** — hacer; **boḍo** — hizo; **duḥkhe** — sufrimiento; **ḍāki** — llamo; **bāro bāro** — una y otra vez.\"],\"translation\":[\"¡Oh, Señor Hari! Como un resultado de mis ofensas cometidas en mis vidas previas, mi corazón se ha endurecido como un rayo, y no experimento cambio alguno al cantar Tu Santo Nombre. Desalentado, sin esperanza y con gran aflicción, invoco en voz alta Tu Nombre, una y otra vez.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"aparādha\",\"trans\":\"ofensas\",\"sep\":\"-\"},{\"text\":\"phole\",\"trans\":\"del fruto\",\"sep\":\" \"},{\"text\":\"mama\",\"trans\":\"mío\",\"sep\" }],[{\"text\":\"bhāva-bindu\",\"trans\":\"océano de nacimiento y muerte\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"dei\",\"trans\":\"otorga\",\"sep\":\" \"},{\"text\":\"rākhoho\",\"trans\":\"por favor salva\",\"sep\":\" \"},{\"text\":\"parāṇa\",\"trans\":\"vida\",\"sep\":\"\"}]]},{\"number\":\"3\",\"text\":[\"kabe tuyā nāma-uchārane mora\",\"nayane jharabo daro daro lora\"],\"word_by_word\":[\"**kabe** — ¿cuándo?; **tuyā** — Tuyo; **nāma-uchārane** — llamar tu nombre; **mora** — mío; **nayane** — en los ojos; **jharabo** — cae; **daro daro** — una y otra vez; **lora** — lágrimas.\"],\"translation\":[\"¿Cuándo fluirá de mis ojos una incesante corriente de lágrimas mientras canto Tu nombre en éxtasis divino?\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"kabe\",\"trans\":\"¿cuándo?\",\"sep\":\" \"},{\"text\":\"tuyā\",\"trans\":\"Tuyo\",\"sep\":\" \"},{\"text\":\"nāma-uchārane\",\"trans\":\"llamar tu nombre\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"mora\",\"trans\":\"mío\",\"sep\":\"\"}],[{\"text\":\"nayane\",\"trans\":\"en los ojos\",\"sep\":\" \"},{\"text\":\"jharabo\",\"trans\":\"cae\",\"sep\":\" \"},{\"text\":\"daro daro\",\"trans\":\"una y otra vez\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"lora\",\"trans\":\"lágrimas\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"gada-gada-svara kaṇṭhe upajabo\",\"mukhe bolo ādha ādha bāhirābo\"],\"word_by_word\":[\"**gada-gada** — vacilante; **svara** — sonido; **kaṇṭhe** — en la voz; **upajabo** — nació; **mukhe** — en la boca; **bolo** — canta; **ādha ādha** — distorsionado; **bāhirābo** — afuera.\"],\"translation\":[\"¿Cuándo se ahogará mi voz con emoción divina y cuando mis palabras se distorsionarán debido al éxtasis proveniente de mis labios?\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gada-gada\",\"trans\":\"vacilante\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"svara\",\"trans\":\"sonido\",\"sep\":\" \"},{\"text\":\"kaṇṭhe\",\"trans\":\"en la voz\",\"sep\":\" \"},{\"text\":\"upajabo\",\"trans\":\"nació\",\"sep\":\"\"}],[{\"text\":\"mukhe\",\"trans\":\"en la boca\",\"sep\":\" \"},{\"text\":\"bolo\",\"trans\":\"canta\",\"sep\":\" \"},{\"text\":\"ādha ādha\",\"trans\":\"distorsionado\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"bāhirābo\",\"trans\":\"afuera\",\"sep\":\"\"}]]},{\"number\":\"5\",\"text\":[\"pulake bharabo śorīra hāmāra\",\"sveda-kampa-stambha hobe bāro bāro\"],\"word_by_word\":[\"**pulake** — vellos erizados; **bharabo** — será; **śorīra** — en el cuerpo; **hāmāra** — mío; **sveda** — transpiración; **kampa** — temblor; **stambha** — aturdido; **hobe** — será; **bāro bāro** — una y otra vez.\"],\"translation\":[\"¿Cuándo los vellos de mi cuerpo se erizarán en el éxtasis? ¿Cuándo quedaré pasmado con éxtasis, con estremecimientos y transpiración debido al éxtasis del amor divino? ¿Cuándo me veré colmado una y otra vez de estos síntomas de éxtasis?\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"pulake\",\"trans\":\"vellos erizados\",\"sep\":\" \"},{\"text\":\"bharabo\",\"trans\":\"será\",\"sep\":\" \"},{\"text\":\"śorīra\",\"trans\":\"en el cuerpo\",\"sep\":\" \"},{\"text\":\"hāmāra\",\"trans\":\"mío\",\"sep\":\"\"}],[{\"text\":\"sveda\",\"trans\":\"transpiración\",\"sep\":\"-\"},{\"text\":\"kampa\",\"trans\":\"temblor\",\"sep\":\"-\"},{\"text\":\"stambha\",\"trans\":\"aturdido\",\"sep\":\" \"},{\"text\":\"hobe\",\"trans\":\"será\",\"sep\":\" \"},{\"text\":\"bāro bāro\",\"trans\":\"una y otra vez\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"6\",\"text\":[\"bibarṇa-śorīre hārāobū̐ jñāna\",\"nāma-samāśraye dharobu parāṇa\"],\"word_by_word\":[\"**bibarṇa** — palidecerse; **śorīre** — cuerpo; **hārāobū̐** — será; **jñāna** — conocimiento; **nāma-samāśraye** — habiendo tomado refugio en el santo nombre; **dharobu** — mantendré; **parāṇa** — mi vida.\"],\"translation\":[\"¿Cuándo mi cuerpo cambiará de color y palidecerá debido al éxtasis? ¿Cuándo perderé la conciencia? ¿Y cuándo mi vida misma estará bajo el refugio del Santo Nombre?\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"bibarṇa\",\"trans\":\"palidecerse\",\"sep\":\"-\"},{\"text\":\"śorīre\",\"trans\":\"cuerpo\",\"sep\":\" \"},{\"text\":\"hārāobū̐\",\"trans\":\"será\",\"sep\":\" \"},{\"text\":\"jñāna\",\"trans\":\"conocimiento\",\"sep\":\"\"}],[{\"text\":\"nāma-samāśraye\",\"trans\":\"habiendo tomado refugio en el santo nombre\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"dharobu\",\"trans\":\"mantendré\",\"sep\":\" \"},{\"text\":\"parāṇa\",\"trans\":\"mi vida\",\"sep\":\"\"}]]},{\"number\":\"7\",\"text\":[\"milabo hāmār kiye aiche dina\",\"roye bhakativinoda mati hīna\"],\"word_by_word\":[\"**milabo** — conoceré; **hāmār** — mío; **kiye** — ¿cuándo?; **aiche** — será; **dina** — día; **roye** — permanece; **bhakativinoda** — Bhakti Vinoda; **mati** — inteligencia; **hīna** — desprovisto.\"],\"translation\":[\"Bhaktivinod, quien está desprovisto de buena inteligencia, llora: “¿Cuándo veré ese día?”\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"milabo\",\"trans\":\"conoceré\",\"sep\":\" \"},{\"text\":\"hāmār\",\"trans\":\"mío\",\"sep\":\" \"},{\"text\":\"kiye\",\"trans\":\"¿cuándo?\",\"sep\":\" \"},{\"text\":\"aiche\",\"trans\":\"será\",\"sep\":\" \"},{\"text\":\"dina\",\"trans\":\"día\",\"sep\":\"\"}],[{\"text\":\"roye\",\"trans\":\"permanece\",\"sep\":\" \"},{\"text\":\"bhakativinoda\",\"trans\":\"Bhakti Vinoda\",\"sep\":\" \"},{\"text\":\"mati\",\"trans\":\"inteligencia\",\"sep\":\" \"},{\"text\":\"hīna\",\"trans\":\"desprovisto\",\"sep\":\"\"}]]}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Bhakti Lalita Devi\",\"ru\":\"Бхакти Лалита Деви\",\"ua\":\"Бгакті Лаліта Деві\"},\"embed_url\":\"https://soundcloud.com/bhakti-lalita-devi/aparadha-phole-mama\"},{\"title\":{\"en\":\"Srila B.N. Acharya Maharaj\",\"ru\":\
