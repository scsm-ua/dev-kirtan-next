"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"$L25\",null,{\"bookId\":\"es\",\"label\":\"Mostrar traducción\",\"song\":{\"meta\":{\"page\":164,\"first_line\":\"mānasa, deha, geha, yo kichhu mora\"},\"title\":[\"Atma Nivedana, 3\"],\"word_by_word\":[\"**atma** — del alma; **nivedana** — sumisión.\"],\"author\":[\"Śrīla Bhakti Vinod Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"mānasa, deha, geha, yo kichhu mora\",\"arpilu̐ tuyā pade nanda-kiśora\"],\"word_by_word\":[\"**mānasa** — *(mana)* — mente; **deha** — cuerpo; **geha** — *(gṛha)* — hogar; **yo** — cual; **kichhu** — algo; **mora** — mío; **arpilu̐** — ofrezco; **tuyā** — *(tomāra)*–Tuyos; **pade** — a los pies; **nanda** — de Nanda Mahārāj; **kiśora** — hijo adolescente.\"],\"translation\":[\"Ofrezco mi mente, mi cuerpo, mi casa, y todo lo que puede ser mío a Tus pies, ¡Oh Nanda Kiśor!\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"mānasa\",\"trans\":\"*(mana)* — mente\",\"sep\":\", \"},{\"text\":\"deha\",\"trans\":\"cuerpo\",\"sep\":\", \"},{\"text\":\"geha\",\"trans\":\"*(gṛha)* — hogar\",\"sep\":\", \"},{\"text\":\"yo\",\"trans\":\"cual\",\"sep\":\" \"},{\"text\":\"kichhu\",\"trans\":\"algo\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"mío\",\"sep\":\"\"}],[{\"text\":\"arpilu̐\",\"trans\":\"ofrezco\",\"sep\":\" \"},{\"text\":\"tuyā\",\"trans\":\"*(tomāra)*–Tuyos\",\"sep\":\" \"},{\"text\":\"pade\",\"trans\":\"a los pies\",\"sep\":\" \"},{\"text\":\"nanda\",\"trans\":\"de Nanda Mahārāj\",\"sep\":\"-\"},{\"text\":\"kiśora\",\"trans\":\"hijo adolescente\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"sampade vipade jīvane maraṇe\",\"dāya mama gelā tuyā o pada varaṇe\"],\"word_by_word\":[\"**sampade** — en la felicidad, buena fortuna; **vipade** — en la angustia, peligro; **jīvane** — en la vida; **maraṇe** — en la muerte; **dāya** — responsabilidad, ansiedad; **mama** — mi; **gelā** — se ha ido; **tuyā** — Tuyos; **o** — esos; **pada** — pies; **varaṇe** — por aceptar.\"],\"translation\":[\"En los buenos tiempos y en los malos, en la vida y en la muerte, toda responsabilidad ha desaparecido abrazando Tus pies.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"sampade\",\"trans\":\"en la felicidad, buena fortuna\",\"sep\":\" \"},{\"text\":\"vipade\",\"trans\":\"en la angustia, peligro\",\"sep\":\" \"},{\"text\":\"jīvane\",\"trans\":\"en la vida\",\"sep\":\" \"},{\"text\":\"maraṇe\",\"trans\":\"en la muerte\",\"sep\":\"\"}],[{\"text\":\"dāya\",\"trans\":\"responsabilidad, ansiedad\",\"sep\":\" \"},{\"text\":\"mama\",\"trans\":\"mi\",\"sep\":\" \"},{\"text\":\"gelā\",\"trans\":\"se ha ido\",\"sep\":\" \"},{\"text\":\"tuyā\",\"trans\":\"Tuyos\",\"sep\":\" \"},{\"text\":\"o\",\"trans\":\"esos\",\"sep\":\" \"},{\"text\":\"pada\",\"trans\":\"pies\",\"sep\":\" \"},{\"text\":\"varaṇe\",\"trans\":\"por aceptar\",\"sep\":\"\"}]]},{\"number\":\"3\",\"text\":[\"mārabi rākhabi yo ichchha tohārā\",\"nitya-dāse prati tuyā adhikārā\"],\"word_by_word\":[\"**mārabi** — puedes matar; **rākhabi** — puedes proteger; **yo** — *(ye)* — el cual; **ichchha** — deseo; **tohārā** — Tu; **nitya** — eterno; **dāse** — a Tu sirviente; **prati** — hacia; **tuyā** — Tu; **adhikāra** — autoridad.\"],\"translation\":[\"Puedes matarme o protegerme como quieras. Tienes plena autoridad sobre Tu eterno sirviente.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"mārabi\",\"trans\":\"puedes matar\",\"sep\":\" \"},{\"text\":\"rākhabi\",\"trans\":\"puedes proteger\",\"sep\":\" \"},{\"text\":\"yo\",\"trans\":\"*(ye)* — el cual\",\"sep\":\" \"},{\"text\":\"ichchha\",\"trans\":\"deseo\",\"sep\":\" \"},{\"text\":\"tohārā\",\"trans\":\"Tu\",\"sep\":\"\"}],[{\"text\":\"nitya\",\"trans\":\"eterno\",\"sep\":\"-\"},{\"text\":\"dāse\",\"trans\":\"a Tu sirviente\",\"sep\":\" \"},{\"text\":\"prati\",\"trans\":\"hacia\",\"sep\":\" \"},{\"text\":\"tuyā\",\"trans\":\"Tu\",\"sep\":\" \"},{\"text\":\"adhikārā\",\"trans\":\"autoridad\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"4\",\"text\":[\"janmāobi moye ichchhā yadi tora\",\"bhakta-gṛhe jani janma ha-u mora\"],\"word_by_word\":[\"**janmāobi** — puedes causar que nazca; **moye** — a mí; **ichchhā** — deseo; **yadi** — si; **tora** — Tuyo; **bhakta** — (de un) devoto; **gṛhe** — en el hogar; **jani** — *(yena)* — por eso; **janma** — nacimiento; **ha-u** — permite; **mora** — mío.\"],\"translation\":[\"Si es Tu deseo que vuelva a nacer, déjame hacerlo en el hogar de Tu devoto.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"janmāobi\",\"trans\":\"puedes causar que nazca\",\"sep\":\" \"},{\"text\":\"moye\",\"trans\":\"a mí\",\"sep\":\" \"},{\"text\":\"ichchhā\",\"trans\":\"deseo\",\"sep\":\" \"},{\"text\":\"yadi\",\"trans\":\"si\",\"sep\":\" \"},{\"text\":\"tora\",\"trans\":\"Tuyo\",\"sep\":\"\"}],[{\"text\":\"bhakta\",\"trans\":\"(de un) devoto\",\"sep\":\"-\"},{\"text\":\"gṛhe\",\"trans\":\"en el hogar\",\"sep\":\" \"},{\"text\":\"jani\",\"trans\":\"*(yena)* — por eso\",\"sep\":\" \"},{\"text\":\"janma\",\"trans\":\"nacimiento\",\"sep\":\" \"},{\"text\":\"ha-u\",\"trans\":\"permite\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"mora\",\"trans\":\"mío\",\"sep\":\"\"}]]},{\"number\":\"5\",\"text\":[\"kīṭa janma ha-u yathā tuyā dāsa\",\"bahir-mukha brahma-janme nāhi āśa\"],\"word_by_word\":[\"**kīṭa** — un gusano, insecto; **janma** — nacimiento; **ha-u** — puede ser; **yathā** — siempre y cuando; **tuyā** — Tuyo; **dāsa** — sirviente; **bahir** — exterior; **mukha** — afrontar; **brahma** — como Brahmā, el creador universal; **janme** — tal nacimiento; **nāhi** — no; **āśa** — deseo.\"],\"translation\":[\"Permíteme nacer de nuevo como un gusano, mientras pueda seguir siendo Tu sirviente. No tengo ningún deseo de nacer ni siquiera como Brahmā, si me opongo a Ti.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"kīṭa\",\"trans\":\"un gusano, insecto\",\"sep\":\" \"},{\"text\":\"janma\",\"trans\":\"nacimiento\",\"sep\":\" \"},{\"text\":\"ha-u\",\"trans\":\"puede ser\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"yathā\",\"trans\":\"siempre y cuando\",\"sep\":\" \"},{\"text\":\"tuyā\",\"trans\":\"Tuyo\",\"sep\":\" \"},{\"text\":\"dāsa\",\"trans\":\"sirviente\",\"sep\":\"\"}],[{\"text\":\"bahir\",\"trans\":\"exterior\",\"sep\":\"-\"},{\"text\":\"mukha\",\"trans\":\"afrontar\",\"sep\":\" \"},{\"text\":\"brahma\",\"trans\":\"como Brahmā, el creador universal\",\"sep\":\"-\"},{\"text\":\"janme\",\"trans\":\"tal nacimiento\",\"sep\":\" \"},{\"text\":\"nāhi\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"āśa\",\"trans\":\"deseo\",\"sep\":\"\"}]]},{\"number\":\"6\",\"text\":[\"bhukti-mukti-spṛhā-vihīna ye bhakta\",\"labha-ite tā̐’ka saṅga anurakta\"],\"word_by_word\":[\"**bhukti** — disfrute mundano, explotación; **mukti** — liberación, renunciación; **spṛhā** — deseo; **vihīna** — desprovisto; **ye** — quienes; **bhakta** — devotos; **labha-ite** — de obtener; **tā̐’ka** — *(tād̐era)* — su; **saṅga** — asociación; **anurakta** — apego (apego amoroso).\"],\"translation\":[\"Siempre estoy ansioso por alcanzar la asociación de devotos que están completamente desprovistos de todo deseo de disfrute y liberación mundanos.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"bhukti\",\"trans\":\"disfrute mundano, explotación\",\"sep\":\"-\"},{\"text\":\"mukti\",\"trans\":\"liberación, renunciación\",\"sep\":\"-\"},{\"text\":\"spṛhā\",\"trans\":\"deseo\",\"sep\":\"-\"},{\"text\":\"vihīna\",\"trans\":\"desprovisto\",\"sep\":\" \"},{\"text\":\"ye\",\"trans\":\"quienes\",\"sep\":\" \"},{\"text\":\"bhakta\",\"trans\":\"devotos\",\"sep\":\"\"}],[{\"text\":\"labha-ite\",\"trans\":\"de obtener\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"tā̐’ka\",\"trans\":\"*(tād̐era)* — su\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"saṅga\",\"trans\":\"asociación\",\"sep\":\" \"},{\"text\":\"anurakta\",\"trans\":\"apego (apego amoroso)\",\"sep\":\"\"}]]},{\"number\":\"7\",\"text\":[\"janaka, jananī, dayita, tanaya\",\"prabhu, guru, pati tuhu̐—sarva-maya\"],\"word_by_word\":[\"**janaka** — padre; **jananī** — madre; **dayita** — amado; **tanaya** — hijo; **prabhu** — Señor; **guru** — maestro espiritual; **pati** — esposo; **tuhu̐** — Tu; **sarva** — todo; **maya** — hecho de.\"],\"translation\":[\"Padre, madre, amante, hijo, Señor, Guru, marido—Tú estás en todas partes.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"janaka\",\"trans\":\"padre\",\"sep\":\", \"},{\"text\":\"jananī\",\"trans\":\"madre\",\"sep\":\", \"},{\"text\":\"dayita\",\"trans\":\"amado\",\"sep\":\", \"},{\"text\":\"tanaya\",\"trans\":\"hijo\",\"sep\":\"\"}],[{\"text\":\"prabhu\",\"trans\":\"Señor\",\"sep\":\", \"},{\"text\":\"guru\",\"trans\":\"maestro espiritual\",\"sep\":\", \"},{\"text\":\"pati\",\"trans\":\"esposo\",\"sep\":\" \"},{\"text\":\"tuhu̐—sarva\",\"trans\":\"Tu\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"maya\",\"trans\":\"todo\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"8\",\"text\":[\"bhakati-vinoda kahe śuna kāna!\",\"rādhānātha! tuhu̐ hāmāra parāṇa\"],\"word_by_word\":[\"**bhakati-vinoda** — Bhakti Vinod; **kahe** — dice; **śuna** — por favor escuha; **kāna!** — ¡oh Kṛṣṇa!; **rādhānātha!** — ¡oh Señor de Rādhā!; **tuhu̐** — Tu; **hāmāra** — mi; **parāṇa** — vida, alma.\"],\"translation\":[\"Bhakti Vinod dice: “¡Por favor, escucha, oh Kāna! ¡Oh Rādhānāth! Eres mi vida y alma”.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"bhakati-vinoda\",\"trans\":\"Bhakti Vinod\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"kahe\",\"trans\":\"dice\",\"sep\":\" \"},{\"text\":\"śuna\",\"trans\":\"por favor escuha\",\"sep\":\" \"},{\"text\":\"kāna\",\"trans\":\"¡oh Kṛṣṇa!\",\"sep\":\"!\"}],[{\"text\":\"rādhānātha\",\"trans\":\"
