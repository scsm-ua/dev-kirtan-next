iddhānta Saraswatī Ṭhākur\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"karuṇā murati\",\"trans\":\"relacionado con Bhakti Vinod Ṭhākur\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"2\",\"text\":[\"prakāśile gaura-sevā bhūvana maṅgala\",\"bhakati-siddhānta śuddha prajñāna ujjvala\"],\"word_by_word\":[\"**prakāśile** — revelar; **gaura-sevā** — el servicio de Gaurāṅga; **bhūvana** — de los mundos; **maṅgala** — auspicioso; **bhakati-siddhānta** — conclusiones de la devoción; **śuddha** — pura; **prajñāna** — conocimiento elevado; **ujjvala** — resplandeciente.\"],\"translation\":[\"Tú revelaste el servicio devocional al Señor Gaurāṅga, el cual beneficia a todo el universo. Tus conclusiones devocionales puras resplandecen con el conocimiento absoluto.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"prakāśile\",\"trans\":\"revelar\",\"sep\":\" \"},{\"text\":\"gaura-sevā\",\"trans\":\"el servicio de Gaurāṅga\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"bhūvana\",\"trans\":\"de los mundos\",\"sep\":\" \"},{\"text\":\"maṅgala\",\"trans\":\"auspicioso\",\"sep\":\"\"}],[{\"text\":\"bhakati-siddhānta\",\"trans\":\"conclusiones de la devoción\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"śuddha\",\"trans\":\"pura\",\"sep\":\" \"},{\"text\":\"prajñāna\",\"trans\":\"conocimiento elevado\",\"sep\":\" \"},{\"text\":\"ujjvala\",\"trans\":\"resplandeciente\",\"sep\":\"\"}]]},{\"number\":\"3\",\"text\":[\"rādhā-śyāma eka-tanu dakṣe gorā rāya\",\"bāme rādha madhye svayaṁ śyāma-gopa jaya\"],\"word_by_word\":[\"**rādhā-śyāma** — Rādhā y Kṛṣṇa; **eka-tanu** — un solo cuerpo; **dakṣe** — a la derecha; **gorā** — Gaurāṅga; **rāya** — honorable; **bāme** — a la izquierda; **rādha** — Rādhārāṇī; **madhye** — al medio; **svayaṁ** — en persona; **śyāma-gopa** — el vaquerito Śyāmasundar; **jaya** — todas las glorias.\"],\"translation\":[\"Todas las glorias a la forma combinada de Rādhā y Śyām (Kṛṣṇa), Śrī Gaurāṅga, del lado derecho; a Śrī Rādhā, del lado izquierdo; y al pastorcillo de vacas, Śrī Śyāmasundar, en el medio.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"rādhā-śyāma\",\"trans\":\"Rādhā y Kṛṣṇa\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"eka-tanu\",\"trans\":\"un solo cuerpo\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"dakṣe\",\"trans\":\"a la derecha\",\"sep\":\" \"},{\"text\":\"gorā\",\"trans\":\"Gaurāṅga\",\"sep\":\" \"},{\"text\":\"rāya\",\"trans\":\"honorable\",\"sep\":\"\"}],[{\"text\":\"bāme\",\"trans\":\"a la izquierda\",\"sep\":\" \"},{\"text\":\"rādha\",\"trans\":\"Rādhārāṇī\",\"sep\":\" \"},{\"text\":\"madhye\",\"trans\":\"al medio\",\"sep\":\" \"},{\"text\":\"svayaṁ\",\"trans\":\"en persona\",\"sep\":\" \"},{\"text\":\"śyāma-gopa\",\"trans\":\"el vaquerito Śyāmasundar\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"jaya\",\"trans\":\"todas las glorias\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"vraja-rasa nava-bhāve navadvīpe rāje\",\"udāre madhura rāga abhinava sāje\"],\"word_by_word\":[\"**vraja-rasa** — la melosidad de Vraja; **nava-bhāve** — un humor fresco; **navadvīpe** — de Nabadwīp; **rāje** — como un rey; **udāre** — dentro de; **madhura** — muy dulce; **rāga** — amor espontáneo; **abhinava** — sin precedente; **sāje** — lucir.\"],\"translation\":[\"La melosidad de Vraja está presente en Nabadwīp con un humor nuevo. Cuando este dulce sentimiento amoroso se mezcla con la magnanimidad, luce entonces extraordinariamente hermoso.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"vraja-rasa\",\"trans\":\"la melosidad de Vraja\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"nava-bhāve\",\"trans\":\"un humor fresco\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"navadvīpe\",\"trans\":\"de Nabadwīp\",\"sep\":\" \"},{\"text\":\"rāje\",\"trans\":\"como un rey\",\"sep\":\"\"}],[{\"text\":\"udāre\",\"trans\":\"dentro de\",\"sep\":\" \"},{\"text\":\"madhura\",\"trans\":\"muy dulce\",\"sep\":\" \"},{\"text\":\"rāga\",\"trans\":\"amor espontáneo\",\"sep\":\" \"},{\"text\":\"abhinava\",\"trans\":\"sin precedente\",\"sep\":\" \"},{\"text\":\"sāje\",\"trans\":\"lucir\",\"sep\":\"\"}]]},{\"number\":\"5\",\"text\":[\"mādhurya kaivalya rāga vrajera niryāsa\",\"prāpti parākāṣṭhā tāhe gaurāṅga vilāsa\"],\"word_by_word\":[\"**mādhurya** — el amor conyugal; **kaivalya** — emancipación; **rāga** — amor espontáneo; **vrajera** — de  Vraja; **niryāsa** — la escencia; **prāpti** — obtener; **parākāṣṭhā** — el límite; **tāhe** — en eso; **gaurāṅga vilāsa** — los pasatiempos de Gaurāṅga.\"],\"translation\":[\"Mādhurya-rāsa (el amor conyugal) es la esencia de Vraja Dhām, y los Pasatiempos de Mahāprabhu lo llevan a su más elevada perfección.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"mādhurya\",\"trans\":\"el amor conyugal\",\"sep\":\" \"},{\"text\":\"kaivalya\",\"trans\":\"emancipación\",\"sep\":\" \"},{\"text\":\"rāga\",\"trans\":\"amor espontáneo\",\"sep\":\" \"},{\"text\":\"vrajera\",\"trans\":\"de  Vraja\",\"sep\":\" \"},{\"text\":\"niryāsa\",\"trans\":\"la escencia\",\"sep\":\"\"}],[{\"text\":\"prāpti\",\"trans\":\"obtener\",\"sep\":\" \"},{\"text\":\"parākāṣṭhā\",\"trans\":\"el límite\",\"sep\":\" \"},{\"text\":\"tāhe\",\"trans\":\"en eso\",\"sep\":\" \"},{\"text\":\"gaurāṅga vilāsa\",\"trans\":\"los pasatiempos de Gaurāṅga\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"6\",\"text\":[\"rādhā bhāva-kānti aṅgikari’ bhāla mate\",\"dakṣiṇe āsana rasa garimā dekhāte\"],\"word_by_word\":[\"**rādhā** — de Rādhārāṇī; **bhāva** — humor; **kānti** — lustre, halo; **aṅgikari’** — aceptar; **bhāla** — auspicioso; **mate** — acorde; **dakṣiṇe** — a su lado derecho; **āsana** — sentado; **rasa** — degustar; **garimā** — gloria; **dekhāte** — contemplar.\"],\"translation\":[\"Aceptando intensamente el humor y la belleza de Śrī Rādhā, Él ha tomado Su lugar a la derecha para mostrar Su posición gloriosa.\"],\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"rādhā\",\"trans\":\"de Rādhārāṇī\",\"sep\":\" \"},{\"text\":\"bhāva\",\"trans\":\"humor\",\"sep\":\"-\"},{\"text\":\"kānti\",\"trans\":\"lustre, halo\",\"sep\":\" \"},{\"text\":\"aṅgikari\",\"trans\":\"aceptar\",\"sep\":\"’ \"},{\"text\":\"bhāla\",\"trans\":\"auspicioso\",\"sep\":\" \"},{\"text\":\"mate\",\"trans\":\"acorde\",\"sep\":\"\"}],[{\"text\":\"dakṣiṇe\",\"trans\":\"a su lado derecho\",\"sep\":\" \"},{\"text\":\"āsana\",\"trans\":\"sentado\",\"sep\":\" \"},{\"text\":\"rasa\",\"trans\":\"degustar\",\"sep\":\" \"},{\"text\":\"garimā\",\"trans\":\"gloria\",\"sep\":\" \"},{\"text\":\"dekhāte\",\"trans\":\"contemplar\",\"sep\":\"\"}]]},{\"number\":\"7\",\"text\":[\"rādhā-rasa-traya-svāda rahasya prayāsa\",\"nirakhi praphulla rādhā mukhe manda hāsa\"],\"word_by_word\":[\"**rādhā-rasa** — la melosidad de Rādhārāṇī; **traya-svāda** — el gusto triple; **rahasya** — travieso; **prayāsa** — esfuerzo; **nirakhi** — observar; **praphulla** — animada; **rādhā** — Rādhārāṇī; **mukhe** — en su rostro; **manda** — leve; **hāsa** — sonrisa.\"],\"translation\":[\"Cuando Rādhārāṇī ve el deseo travieso de Kṛṣṇa de entender la gloria de Su amor, Rādhārāṇī se siente muy complacida y una suave sonrisa aparece en Su rostro.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"rādhā-rasa\",\"trans\":\"la melosidad de Rādhārāṇī\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"traya-svāda\",\"trans\":\"el gusto triple\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"rahasya\",\"trans\":\"travieso\",\"sep\":\" \"},{\"text\":\"prayāsa\",\"trans\":\"esfuerzo\",\"sep\":\"\"}],[{\"text\":\"nirakhi\",\"trans\":\"observar\",\"sep\":\" \"},{\"text\":\"praphulla\",\"trans\":\"animada\",\"sep\":\" \"},{\"text\":\"rādhā\",\"trans\":\"Rādhārāṇī\",\"sep\":\" \"},{\"text\":\"mukhe\",\"trans\":\"en su rostro\",\"sep\":\" \"},{\"text\":\"manda\",\"trans\":\"leve\",\"sep\":\" \"},{\"text\":\"hāsa\",\"trans\":\"sonrisa\",\"sep\":\"\"}]]},{\"number\":\"8\",\"text\":[\"madhye rahi’ vaṁśī-rave ghoṣe vaṁśī-dhara\",\"rādhāra sampade āmi gaurāṅga-sundara!\"],\"word_by_word\":[\"**madhye** — en medio; **rahi’** — permanece; **vaṁśī-rave** — sonido fuerte de la flauta; **ghoṣe** — declara; **vaṁśī-dhara** — el que sostiene a Vaṁśi (la Flauta); **rādhāra** — de Śrīmati Rādhārāṇī; **sampade** — opulencia; **āmi** — Yo soy; **gaurāṅga-sundara!** — Gaurāṅga Sundar.\"],\"translation\":[\"En el centro, Vaṁśīdhar (el Flautista) toca Su flauta, y piensa: “Solo debido a la riqueza de Rādhārāṇī soy Gaurāṅga Sundar”.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"madhye\",\"trans\":\"en medio\",\"sep\":\" \"},{\"text\":\"rahi\",\"trans\":\"permanece\",\"sep\":\"’ \"},{\"text\":\"vaṁśī-rave\",\"trans\":\"sonido fuerte de la flauta\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"ghoṣe\",\"trans\":\"declara\",\"sep\":\" \"},{\"text\":\"vaṁśī-dhara\",\"trans\":\"el que sostiene a Vaṁśi (la Flauta)\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"rādhāra\",\"trans\":\"de Śrīmati Rādhārāṇī\",\"sep\":\" \"},{\"text\":\"sampade\",\"trans\":\"opulencia\",\"sep\":\" \"},{\"text\":\"āmi\",\"trans\":\"Yo soy\",\"sep\":\" \"},{\"text\":\"gaurāṅga-sundara\",\"trans\":\"Gaurāṅga Sundar\",\"sep\":\"!\",\"error\":\"multi\"}]]},{\"number\":\"9\",\"text\":[\"mad abhīṣṭha rūpa rādhāra hṛdaya mandire\",\"gaurāṅga bhajile suṣṭhu sphūrti pāya tāre\"],\"word_by_word\":[\"**mad** — mía; **abhīṣṭha** — anhelada; **rūpa** — forma; **rādhāra** — de Śrīmati Rādhārāṇī; **hṛdaya** — el corazón; **mandire** — en el templo; **gaurāṅga bhajile** — adorar a Gaurāṅga; **suṣṭhu** — apropiadamente; **sphūrti** — manifestación; **pāya** — obtiener; **tāre** — a él.\"],\"translation\":[\"“Mi forma se manifiesta en el templo del corazón de Rādhārāṇī, yesa suprema manifestación Mía solo puede ser alcanzada por adorar a Gaurāṅga”.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"mad\",\"trans\":\"mía\",\"sep\":\" \"},{\"text\":\"abhīṣṭha\",\"trans\":\"anhelada\",\"sep\":\" \"},{\"text\":\"rūpa\",\"trans\":\"forma\",\"sep\":\" \"},{\"text\":\"rādhāra\",\"trans\":\"de Śrīmati Rādhārāṇī\",\"sep\":\" \"},{\"text\":\"hṛdaya\",\"trans\":\"el corazón\",\"sep\":\" \"},{\"text\":\"mandire\",\"trans\":\"en el templo\",\"sep\":\"\"}],[{\"text\":\"gaurāṅga bhajile\",\"trans\":\"adorar a Gaurāṅga\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"suṣṭhu\",\"trans\":\"apropiadamente\",\"sep\":\" \"},{\"text\":\"sphūrti\",\"trans\":\"manifestación\",\"sep\":\" \"},{\"text\":\"pāya\",\"trans\":\"obtiener\",\"sep\":\" \"},{\"text\":\"tāre\",\"trans\":\"a él\",\"sep\":\"\"}]]},{\"number\":\"10\",\"text\":[\"nadīyā prakāśe mahāprabhu gaura-nidhi\",\"patita-pāvana deve milāila vidhi\"],\"word_by_word\":[\"**nadīyā** — del distrito de Nadia; **prakāśe** — revelar; **mahāprabhu** — Mahāprabhu; **gaura-nidhi** — el tesoro de Gaurāṅga; **patita-pāvana** — redentor de los caídos; **deve** — dar; **milāila** — reunir; **vidhi** — arreglo.\"],\"translation\":[\"Mediante el divino arreglo del Señor, el Supremo redentor delas almas caídas apareció en Nadīyā como el muy amado Śrī Gaurāṅga Mahāprabhu.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"nadīyā\",\"trans\":\"del distrito de Nadia\",\"sep\":\" \"},{\"text\":\"prakāśe\",\"trans\":\"revelar\",\"sep\":\" \"},{\"text\":\"mahāprabhu\",\"trans\":\"Mahāprabhu\",\"sep\":\" \"},{\"text\":\"gaura-nidhi\",\"trans\":\"el tesoro de Gaurāṅga\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"patita-pāvana\",\"trans\":\"redentor de los caídos\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"deve\",\"trans\":\"dar\",\"sep\":\" \"},{\"text\":\"milāila\",\"trans\":\"reunir\",\"sep\":\" \"},{\"text\":\"vidhi\",\"trans\":\"arreglo\",\"sep\":\"\"}]]},{\"number\":\"11\",\"text\":[\"e-rūpa ārati brahmā śambhu agochara\",\"gaura-bhakta kṛpā-pātra mātra siddhi sāra\"],\"word_by_word\":[\"**e-rūpa** — esa clase; **ārati** — de ceremonia; **brahmā** — el Señor Brahmā; **śambhu** — el Señor Śiva; **agochara** — desconocido; **gaura-bhakta** — los devotos del Señor Gaura; **kṛpā-pātra** — recipiente de misericordia; **mātra** — simplemente; **siddhi** — perfección; **sāra** — la mejor.\"],\"translation\":[\"Esta clase de *ārati* es desconocido para Brahmā y Śiva. Uno puede alcanzar tal perfección solo por recibir la misericordia de un devoto del Señor Gaurāṅga.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"e-rūpa\",\"trans\":\"esa clase\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"ārati\",\"trans\":\"de ceremonia\",\"sep\":\" \"},{\"text\":\"brahmā\",\"trans\":\"el Señor Brahmā\",\"sep\":\" \"},{\"text\":\"śambhu\",\"trans\":\"el Señor Śiva\",\"sep\":\" \"},{\"text\":\"agochara\",\"trans\":\"desconocido\",\"sep\":\"\"}],[{\"text\":\"gaura-bhakta\",\"trans\":\"los devotos del Señor Gaura\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"kṛpā-pātra\",\"trans\":\"recipiente de misericordia\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"mātra\",\"trans\":\"simplemente\",\"sep\":\" \"},{\"text\":\"siddhi\",\"trans\":\"perfección\",\"sep\":\" \"},{\"text\":\"sāra\",\"trans\":\"la mejor\",\"sep\":\"\"}]]},{\"number\":\"12\",\"text\":[\"śrī svarūpa, rāmānanda, rūpa, sanātana\",\"śrī raghu, jīvādi kṛpāya dekhe bhakta-jana\"],\"word_by_word\":[\"**śrī svarūpa** — Śrī Svarūp Dāmodar; **rāmānanda** — Śrī Rāmānanda Rāy; **rūpa** — Śrī Rūpa; **sanātana** — Śrī Sanātan; **śrī raghu** — Śrī Raghunāth; **jīvādi** — Śrī Jīva y sus asociados; **kṛpāya** — por la misericordia; **dekhe** — visión; **bhakta-jana** — los devotos.\"],\"translation\":[\"Solo por la misericordia de Śrī Svarūp Dāmodar, Śrī Rāmānanda Rāy, Śrī Rūpa,Śrī Sanātan, Śrī Raghunāth, Śrī Jīva y sus asociados, los devotos obtienen esavisión.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"śrī svarūpa\",\"trans\":\"Śrī Svarūp Dāmodar\",\"sep\":\", \",\"error\":\"multi\"},{\"text\":\"rāmānanda\",\"trans\":\"Śrī Rāmānanda
