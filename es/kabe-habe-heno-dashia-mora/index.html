"sep\":\" \"},{\"text\":\"bijana-sthale\",\"trans\":\"en un lugar solitario\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"kṛṣṇa-nāmāmṛta\",\"trans\":\"el néctar del nombre de Kṛṣṇa\",\"sep\":\",    \",\"error\":\"multi\"},{\"text\":\"nirantara\",\"trans\":\"siempre\",\"sep\":\" \"},{\"text\":\"pibo\",\"trans\":\"beberé\",\"sep\":\",\"}],[{\"text\":\"ḍākibo\",\"trans\":\"llamaré\",\"sep\":\" \"},{\"text\":\"‘gaurāṅga\",\"trans\":\"Gaurāṅga\",\"sep\":\"’ \"},{\"text\":\"bo’le\",\"trans\":\"al decir\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"4\",\"text\":[\"hā gaura-nitāi,        torā du’ṭi bhāi,\",\"        patita-janer bandhu\",\"adhama patita,        āmi he durjana,\",\"        hao more kṛpā sindhu\"],\"word_by_word\":[\"**hā** — ¡oh!; **gaura-nitāi** — Gaura y Nitāi; **torā** — ustedes; **du’ṭi** — dos; **bhāi** — hermanos; **patita-janer** — de las personas caídas; **bandhu** — amigo; **adhama** — bajo; **patita** — caído; **āmi** — yo; **he** — ¡oh!; **durjana** — malvado; **hao** — soy; **more** — a mí; **kṛpā** — misericordia; **sindhu** — océano.\"],\"translation\":[\"“¡Oh, Gaura Nitai! ¡Ustedes dos hermanos son los únicos amigos verdaderos de todas las almas caídas! Soy el más bajo de los bajos, el más caído y de mente malvada, tan amablemente concédanme Su océano de misericordia.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"hā\",\"trans\":\"¡oh!\",\"sep\":\" \"},{\"text\":\"gaura-nitāi\",\"trans\":\"Gaura y Nitāi\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"torā\",\"trans\":\"ustedes\",\"sep\":\" \"},{\"text\":\"du’ṭi\",\"trans\":\"dos\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"bhāi\",\"trans\":\"hermanos\",\"sep\":\",\"}],[{\"text\":\"patita-janer\",\"trans\":\"de las personas caídas\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"bandhu\",\"trans\":\"amigo\",\"sep\":\"\"}],[{\"text\":\"adhama\",\"trans\":\"bajo\",\"sep\":\" \"},{\"text\":\"patita\",\"trans\":\"caído\",\"sep\":\",        \"},{\"text\":\"āmi\",\"trans\":\"yo\",\"sep\":\" \"},{\"text\":\"he\",\"trans\":\"¡oh!\",\"sep\":\" \"},{\"text\":\"durjana\",\"trans\":\"malvado\",\"sep\":\",\"}],[{\"text\":\"hao\",\"trans\":\"soy\",\"sep\":\" \"},{\"text\":\"more\",\"trans\":\"a mí\",\"sep\":\" \"},{\"text\":\"kṛpā\",\"trans\":\"misericordia\",\"sep\":\" \"},{\"text\":\"sindhu\",\"trans\":\"océano\",\"sep\":\"\"}]]},{\"number\":\"5\",\"text\":[\"kāndite kāndite,        ṣola-krośa-dhāma,\",\"        jāhnavī ubhoy kūle\",\"bhramite bhramite,    kabhu bhāgya-phale,\",\"        dekhi kuchu taru-mūle\"],\"word_by_word\":[\"**kāndite** — llorando; **kāndite** — y llorando; **ṣola-krośa-dhāma** — la morada de 32 millas cuadradas; **jāhnavī** — del Gaṅgā; **ubhoy** — ambas; **kūle** — orillas; **bhramite** — vagando; **bhramite** — y vagando; **kabhu** — ¿cuándo?; **bhāgya** — de buena fortuna; **phale** — la fruta; **dekhi** — veo; **kichu** — algo; **taru-mūle** — bajo un árbol.\"],\"translation\":[\"Así sollozando y gritando repetidamente, vagaré por toda la morada de 32 millas cuadradas, a veces en una orilla del Ganges y otras veces en la otra. A veces, mientras deambulo, si alguna vez recibo una gota de buena fortuna, de repente puedo mirar hacia la base de un árbol (y contemplar una visión allí...)\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"kāndite\",\"trans\":\"llorando\",\"sep\":\" \"},{\"text\":\"kāndite\",\"trans\":\"y llorando\",\"sep\":\",        \"},{\"text\":\"ṣola-krośa-dhāma\",\"trans\":\"la morada de 32 millas cuadradas\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"jāhnavī\",\"trans\":\"del Gaṅgā\",\"sep\":\" \"},{\"text\":\"ubhoy\",\"trans\":\"ambas\",\"sep\":\" \"},{\"text\":\"kūle\",\"trans\":\"orillas\",\"sep\":\"\"}],[{\"text\":\"bhramite\",\"trans\":\"vagando\",\"sep\":\" \"},{\"text\":\"bhramite\",\"trans\":\"y vagando\",\"sep\":\",    \"},{\"text\":\"kabhu\",\"trans\":\"¿cuándo?\",\"sep\":\" \"},{\"text\":\"bhāgya\",\"trans\":\"de buena fortuna\",\"sep\":\"-\"},{\"text\":\"phale\",\"trans\":\"la fruta\",\"sep\":\",\"}],[{\"text\":\"dekhi\",\"trans\":\"veo\",\"sep\":\" \"},{\"text\":\"kuchu\",\"trans\":\"algo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"taru-mūle\",\"trans\":\"bajo un árbol\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"6\",\"text\":[\"ha ha manohara,        ki dekhinu āmi,\",\"        boliya mūrchita ha’bo\",\"samvit pāiya,        kandibo gopane,\",\"        smari duṅhu kṛpā-laba\"],\"word_by_word\":[\"**ha ha** — ¡oh! ¡oh!; **mana** — de mi corazón; **hara** — ladrón; **ki** — ¿qué?; **dekhinu** — ves; **āmi** — yo; **boliya** — diciendo; **mūrchita** — inconciente; **ha’bo** — será; **samvit** — conciencia; **pāiya** — recobrar; **kandibo** — lloraré; **gopan** — en un lugar solitario; **smari** — recordando; **duṅhu** — a ambos; **kṛpā** — misericordia; **laba** — una partícula.\"],\"translation\":[\"Diré: “¡Ay, ay, qué maravilloso! ¡¿Qué cosa tan asombrosa he visto ahora?!” Y me desmayaré sin sentido en el acto. Al recobrar la conciencia más tarde, me esconderé y lloraré en secreto, recordando que todo este éxtasis se debe al recibir solo una pequeña pizca de la misericordia de Śrī Śrī Gaura Nitāi.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"ha ha\",\"trans\":\"¡oh! ¡oh!\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"manohara\",\"trans\":\"de mi corazón\",\"sep\":\",        \",\"error\":\"mismatch\"},{\"text\":\"ki\",\"trans\":\"ladrón\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"dekhinu\",\"trans\":\"¿qué?\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"āmi\",\"trans\":\"ves\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"boliya\",\"trans\":\"yo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"mūrchita\",\"trans\":\"diciendo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"ha\",\"trans\":\"inconciente\",\"sep\":\"’\",\"error\":\"mismatch\"},{\"text\":\"bo\",\"trans\"
