},{\"text\":\"kali-yuge\",\"trans\":\"de la era de Kali\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"re\",\"trans\":\"¡oh!\",\"sep\":\" \"},{\"text\":\"chaitanya avatāra\",\"trans\":\"la encarnación de Chaitanya\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"2\",\"text\":[\"āmāra gaurāṅgera ghāṭe ujānakheyā boy\",\"kaḍipāti nāhi lāge amani pāra hoy\"],\"word_by_word\":[\"**āmāra** — mío; **gaurāṅgera** — del Señor Gaurāṅga; **ghāṭe** — a la orilla; **ujāna-kheyā** — muelle contrario; **boy** — cargar; **kaḍipāti** — propietario; **nāhi** — no; **lāge** — costo; **amani** — sin respeto; **pāra** — trascendental; **hoy** — cargar.\"],\"translation\":[\"Mi Señor Gaurāṅga permanece como el muelle disponible para llevar río arriba a Sus sirvientes, al otro lado de esta existencia material. Sin costo alguno, Él de inmediato los transporta.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"āmāra\",\"trans\":\"mío\",\"sep\":\" \"},{\"text\":\"gaurāṅgera\",\"trans\":\"del Señor Gaurāṅga\",\"sep\":\" \"},{\"text\":\"ghāṭe\",\"trans\":\"a la orilla\",\"sep\":\" \"},{\"text\":\"ujānakheyā boy\",\"trans\":\"muelle contrario\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"kaḍipāti\",\"trans\":\"cargar\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nāhi\",\"trans\":\"propietario\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"lāge\",\"trans\":\"no\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"amani\",\"trans\":\"costo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"pāra\",\"trans\":\"sin respeto\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hoy\",\"trans\":\"trascendental\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"3\",\"text\":[\"harināmera tarīkhāni śrī-guru-kāṇḍārī\",\"saṅkīrttana-keroyāla du’bahu pasāri\"],\"word_by_word\":[\"**harināmera** — del santo nombre; **tarīkhāni** — transportador; **śrī-guru-kāṇḍārī** — el capitán, el maestro espiritual; **saṅkīrttana** — el canto en congregación; **keroyāla** — remos; **du’bahu** — los brazos; **pasāri** — expandir.\"],\"translation\":[\"El transbordador es el Santo Nombre del Señor y el capitán es el Maestro Espiritual. Los remos son los brazos levantados en el *saṅkīrtan*.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"harināmera\",\"trans\":\"del santo nombre\",\"sep\":\" \"},{\"text\":\"tarīkhāni\",\"trans\":\"transportador\",\"sep\":\" \"},{\"text\":\"śrī-guru-kāṇḍārī\",\"trans\":\"el capitán, el maestro espiritual\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"saṅkīrttana\",\"trans\":\"el canto en congregación\",\"sep\":\"-\"},{\"text\":\"keroyāla\",\"trans\":\"remos\",\"sep\":\" \"},{\"text\":\"du’bahu\",\"trans\":\"los brazos\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"pasāri\",\"trans\":\"expandir\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"sarvva-jīva uddhāra hoilo premera bātāse\",\"lochana paḍiyā roilo karamera doṣe\"],\"word_by_word\":[\"**sarvva-jīva** — todas las almas; **uddhāra** — rescatar; **hoilo** — volverse; **premera** — del amor divino; **bātāse** — del viento; **lochana** — Lochan Dās; **paḍiyā** — recita; **roilo** — permanece; **karamera** — de las actividades; **doṣe** — faltas.\"],\"translation\":[\"El viento favorable es el amor divino hacia el Señor Kṛṣṇa y todas las almas caídas han sido rescatadas por este barco. Solo Lochan Dās ha sido abandonado por culpa de sus propias fechorías.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"sarvva-jīva\",\"trans\":\"todas las almas\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"uddhāra\",\"trans\":\"rescatar\",\"sep\":\" \"},{\"text\":\"hoilo\",\"trans\":\"volverse\",\"sep\":\" \"},{\"text\":\"premera\",\"trans\":\"del amor divino\",\"sep\":\" \"},{\"text\":\"bātāse\",\"trans\":\"del viento\",\"sep\":\"\"}],[{\"text\":\"lochana\",\"trans\":\"Lochan Dās\",\"sep\":\" \"},{\"text\":\"paḍiyā\",\"trans\":\"recita\",\"sep\":\" \"}
