puṇyera leśa\",\"parere udvega,         diyāchhi ye kata,\",\"    diyāchhi jīvere kleśa\"],\"word_by_word\":[\"**āmāra** — mi; **jīvana** — vida; **sadā** — siempre; **pāpe** — en pecado; **rata** — ocupada; **nāhika** — no hay; **puṇyera** — de piedad; **leśa** — un rastro; **parere** — a otros; **udvega** — agitación; **diyāchhi** — he dado; **ye** — la cual; **kata** — mucho; **diyāchhi** — he dado; **jīvere** — a otras almas; **kleśa** — aflicciones.\"],\"translation\":[\"Mi vida siempre está absorta en el pecado; No hay un rastro de piedad dentro de ella. He causado a otros mucha ansiedad y problemas.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"āmāra\",\"trans\":\"mi\",\"sep\":\" \"},{\"text\":\"jīvana\",\"trans\":\"vida\",\"sep\":\",         \"},{\"text\":\"sadā\",\"trans\":\"siempre\",\"sep\":\" \"},{\"text\":\"pāpe\",\"trans\":\"en pecado\",\"sep\":\" \"},{\"text\":\"rata\",\"trans\":\"ocupada\",\"sep\":\",\"}],[{\"text\":\"nāhika\",\"trans\":\"no hay\",\"sep\":\" \"},{\"text\":\"puṇyera\",\"trans\":\"de piedad\",\"sep\":\" \"},{\"text\":\"leśa\",\"trans\":\"un rastro\",\"sep\":\"\"}],[{\"text\":\"parere\",\"trans\":\"a otros\",\"sep\":\" \"},{\"text\":\"udvega\",\"trans\":\"agitación\",\"sep\":\",         \"},{\"text\":\"diyāchhi\",\"trans\":\"he dado\",\"sep\":\" \"},{\"text\":\"ye\",\"trans\":\"la cual\",\"sep\":\" \"},{\"text\":\"kata\",\"trans\":\"mucho\",\"sep\":\",\"}],[{\"text\":\"diyāchhi\",\"trans\":\"he dado\",\"sep\":\" \"},{\"text\":\"jīvere\",\"trans\":\"a otras almas\",\"sep\":\" \"},{\"text\":\"kleśa\",\"trans\":\"aflicciones\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"nija sukha lāgi’,        pāpe nāhi ḍari,\",\"        dayā-hīna svārtha-para\",\"    para-sukhe duḥkhī,     sadā mithyā-bhāṣī,\",\"        para-duḥkha sukha-kara\"],\"word_by_word\":[\"**nija** — mi propia; **sukha** — felicidad; **lāgi’** — por el bien; **pāpe** — de pecar; **nāhi** — no hacer; **ḍari** — temo; **dayā** — misericordia; **hīna** — desprovisto de; **sva-artha** — mi propio intéres; **para** — a otros; **para** — de otros; **sukhe** — por la felicidad; **duḥkhī** — angustiado; **sadā** — siempre; **mithyā** — mentiras; **bhāṣī** — hablando; **para** — de otros; **duḥkha** — angustia; **sukha** — felicidad; **kara** — otorga.\"],\"translation\":[\"Nunca tengo miedo de participar en actividades pecaminosas en aras de mi propia felicidad. Soy despiadado y egoísta. Estoy angustiado por la felicidad de otros, soy un mentiroso perpetuo, y la angustia de los demás me otorga felicidad.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"nija\",\"trans\":\"mi propia\",\"sep\":\" \"},{\"text\":\"sukha\",\"trans\":\"felicidad\",\"sep\":\" \"},{\"text\":\"lāgi\",\"trans\":\"por el bien\",\"sep\":\"’,        \"},{\"text\":\"pāpe\",\"trans\":\"de pecar\",\"sep\":\" \"},{\"text\":\"nāhi\",\"trans\":\"no hacer\",\"sep\":\" \"},{\"text\":\"ḍari\",\"trans\":\"temo\",\"sep\":\",\"}],[{\"text\":\"dayā\",\"trans\":\"misericordia\",\"sep\":\"-\"},{\"text\":\"hīna\",\"trans\":\"desprovisto de\",\"sep\":\" \"},{\"text\":\"svārtha-para\",\"trans\":\"mi propio intéres\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"para\",\"trans\":\"a otros\",\"sep\":\"-\"},{\"text\":\"sukhe\",\"trans\":\"de otros\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"duḥkhī\",\"trans\":\"por la felicidad\",\"sep\":\",     \",\"error\":\"mismatch\"},{\"text\":\"sadā\",\"trans\":\"angustiado\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"mithyā\",\"trans\":\"siempre\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"bhāṣī\",\"trans\":\"mentiras\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"para\",\"trans\":\"hablando\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"duḥkha\",\"trans\":\"de otros\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sukha\",\"trans\":\"angustia\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"kara\",\"trans\":\"felicidad\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"3\",\"text\":[\"aśeṣa kāmanā,        hṛdi mājhe mora,\",\"        krodhī, dambha-parāyaṇa\",\"    mada-matta sadā,     viṣaye mohita,\",\"        hiṁsā-garva vibhūṣaṇa\"],\"word_by_word\":[\"**aśeṣa** — ilimitado; **kāmanā** — deseos pecaminosos; **hṛdi** — en el corazón; **mājhe** — en el interior; **mora** — mi; **krodhī** — ira; **dambha** — arrogancia; **parāyaṇa** — lleno con; **mada** — vanidad; **matta** — enloquecido; **sadā** — siempre; **viṣaye** — por la mundanidad; **mohita** — perturbado; **hiṁsā** — malicia, celos, violencia; **garva** — orgullo, egoismo; **vibhūṣaṇa** — ornamentos.\"],\"translation\":[\"Hay ilimitados deseos pecaminosos dentro de mi corazón. Estoy lleno de ira y soy arrogante, siempre enloquecido por la vanidad, encaprichado por la mundanidad, y adornado con malicia y orgullo.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"aśeṣa\",\"trans\":\"ilimitado\",\"sep\":\" \"},{\"text\":\"kāmanā\",\"trans\":\"deseos pecaminosos\",\"sep\":\",        \"},{\"text\":\"hṛdi\",\"trans\":\"en el corazón\",\"sep\":\" \"},{\"text\":\"mājhe\",\"trans\":\"en el interior\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"mi\",\"sep\":\",\"}],[{\"text\":\"krodhī\",\"trans\":\"ira\",\"sep\":\", \"},{\"text\":\"dambha\",\"trans\":\"arrogancia\",\"sep\":\"-\"},{\"text\":\"parāyaṇa\",\"trans\":\"lleno con\",\"sep\":\"\"}],[{\"text\":\"mada\",\"trans\":\"vanidad\",\"sep\":\"-\"},{\"text\":\"matta\",\"trans\":\"enloquecido\",\"sep\":\" \"},{\"text\":\"sadā\",\"trans\":\"siempre\",\"sep\":\",     \"},{\"text\":\"viṣaye\",\"trans\":\"por la mundanidad\",\"sep\":\" \"},{\"text\":\"mohita\",\"trans\":\"perturbado\",\"sep\":\",\"}],[{\"text\":\"hiṁsā\",\"trans\":\"malicia, celos, violencia\",\"sep\":\"-\"},{\"text\":\"garva\",\"trans\":\"orgullo, egoismo\",\"sep\":\" \"},{\"text\":\"vibhūṣaṇa\",\"trans\":\"ornamentos\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"nidrāl
