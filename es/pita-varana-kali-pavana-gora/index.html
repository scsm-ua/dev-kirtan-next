**śrī** — adorable; **śikṣa** — instrucciones; **aṣṭakam** — ocho versos.\"],\"author\":[\"Śrīla Bhakti Vinod Ṭhākur\"],\"subtitle\":[\"Canción 1\"],\"verses\":[{\"text\":[\"cheto-darpaṇa-mārjanaṁ bhava-mahādāvāgni-nirvāpaṇaṁ\",\"śreyaḥ-kairava-chandrikā-vitaraṇaṁ vidyā-vadhū-jīvanam\",\"ānandāmbudhi-vardhanaṁ prati-padaṁ pūrṇāmṛtāsvādanaṁ\",\"sarvātma-snapanaṁ paraṁ vijayate śrī-kṛṣṇa-saṅkīrtanam\"],\"word_by_word\":[\"**chetaḥ-darpaṇa** — el espejo del corazón; **mārjanaṁ** — limpieza; **bhava** — de la existencia material; **mahā-dāva-agni** — el gran incendio forestal; **nirvāpaṇaṁ** — extinción; **śreyaḥ** — buena fortuna; **kairava** — el loto blanco; **chandrikā** — los rayos de la luna; **vitaraṇaṁ** — esparciendo; **vidyā-vadhū** — la esposa de toda educación; **jīvanam** — la vida; **ānanda-ambudhi** — el océano de bienaventuranza; **vardhanaṁ** — aumentando; **prati-padaṁ** — en cada paso; **pūrṇa amṛta** — el néctar pleno; **āsvādanaṁ** — dando un sabor delicioso; **sarva-ātma** — a todas las almas; **snapanaṁ** — bañando; **paraṁ** — trascendental; **vijayate** — que haya victoria; **śrī-kṛṣṇa-saṅkīrtanam** — para el canto en congregación del Santo Nombre de Kṛṣṇa.\"],\"translation\":[\"El Santo Nombre de Kṛṣṇa limpia el espejo del corazón y extingue el incendio de la miseria en el bosque del nacimiento y la muerte. Del mismo modo en que el loto nocturno florece con los refrescantes rayos de la luna, el corazón empieza a florecer con el néctar del Nombre. Y el alma por fin despierta a su verdadero tesoro interno—una vida de amor con Kṛṣṇa. Al saborear una y otra vez el néctar, el alma se zambulle y emerge a la superficie en el océano siempre creciente del júbilo extático. Todas las fases del ser que podamos concebir se satisfacen y purifican plenamente, y son finalmente conquistadas por la toda auspiciosa influencia del Santo Nombre de Kṛṣṇa.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"cheto-darpaṇa\",\"trans\":\"el espejo del corazón\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"mārjanaṁ\",\"trans\":\"limpieza\",\"sep\":\" \"},{\"text\":\"bhava\",\"trans\":\"de la existencia material\",\"sep\":\"-\"},{\"text\":\"mahādāvāgni-nirvāpaṇaṁ\",\"trans\":\"el gran incendio forestal\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"śreyaḥ\",\"trans\":\"extinción\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"kairava\",\"trans\":\"buena fortuna\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"chandrikā\",\"trans\":\"el loto blanco\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"vitaraṇaṁ\",\"trans\":\"los rayos de la luna\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"vidyā\",\"trans\":\"esparciendo\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"vadhū-jīvanam\",\"trans\":\"la esposa de toda educación\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"ānandāmbudhi\",\"trans\":\"la vida\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"vardhanaṁ prati\",\"trans\":\"el océano de bienaventuranza\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"padaṁ\",\"trans\":\"aumentando\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"pūrṇāmṛtāsvādanaṁ\",\"trans\":\"en cada paso\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"sarvātma-snapanaṁ\",\"trans\":\"el néctar pleno\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"paraṁ\",\"trans\":\"dando un sabor delicioso\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"vijayate śrī\",\"trans\":\"a todas las almas\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"kṛṣṇa\",\"trans\":\"bañando\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"saṅkīrtanam\",\"trans\":\"trascendental\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"1\",\"text\":[\"pīta-baraṇa kali-pāvana gorā\",\"gāoyāi aichana bhāva-bibhorā\"],\"word_by_word\":[\"**pīta** — amarillento, dorado; **baraṇa** — tez; **kali** — de la era de Kali; **pāvana** — salvador; **gorā** — el Señor Gaurāṅga; **gāoyāi** — canta; **aichana** — de esa manera; **bhāva** — en éxtasis; **bibhorā** — agitado.\"],\"translation\":[\"El Señor Gaurāṅga, cuyo color es dorado y quien es el redentor de las almas caídas de Kali-yuga, colmado de éxtasis espiritual, canta lo siguiente:\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"pīta\",\"trans\":\"amarillento, dorado\",\"sep\":\"-\"},{\"text\":\"baraṇa\",\"trans\":\"tez\",\"sep\":\" \"},{\"text\":\"kali\",\"trans\":\"de la era de Kali\",\"sep\":\"-\"},{\"text\":\"pāvana\",\"trans\":\"salvador\",\"sep\":\" \"},{\"text\":\"gorā\",\"trans\":\"el Señor Gaurāṅga\",\"sep\":\"\"}],[{\"text\":\"gāoyāi\",\"trans\":\"canta\",\"sep\":\" \"},{\"text\":\"aichana\",\"trans\":\"de esa manera\",\"sep\":\" \"},{\"text\":\"bhāva\",\"trans\":\"en éxtasis\",\"sep\":\"-\"},{\"text\":\"bibhorā\",\"trans\":\"agitado\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"chitta-darpaṇa-parimārjjana-kārī\",\"kṛṣṇa-kīrttana jaya chitta-bihārī\"],\"word_by_word\":[\"**chitta** — de la mente; **darpaṇa** — el espejo; **parimārjjana** — limpieza; **kārī** — hacer; **kṛṣṇa-kīrttana** — el canto del nombre de Kṛṣṇa; **jaya** — gloria; **chitta** — en el corazón; **bihārī** — pasatiempos.\"],\"translation\":[\"¡Todas las glorias al Santo Nombre de Kṛṣṇa! Él limpia por completo el espejo del corazón y es el deleite del alma.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"chitta\",\"trans\":\"de la mente\",\"sep\":\"-\"},{\"text\":\"darpaṇa\",\"trans\":\"el espejo\",\"sep\":\"-\"},{\"text\":\"parimārjjana\",\"trans\":\"limpieza\",\"sep\":\"-\"},{\"text\":\"kārī\",\"trans\":\"hacer\",\"sep\":\"\"}],[{\"text\":\"kṛṣṇa-kīrttana\",\"trans\":\"el canto del nombre de Kṛṣṇa\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"jaya\",\"trans\":\"gloria\",\"sep\":\" \"},{\"text\":\"chitta\",\"trans\":\"en el corazón\",\"sep\":\"-\"},{\"text\":\"bihārī\",\"trans\":\"pasatiempos\",\"sep\":\"\"}]]},{\"number\":\"3\",\"text\":[\"helā-bhava-dāva-nirvāpaṇa-vṛtti\",\"kṛṣṇa-kīrttana jaya kleśa-nivṛtti\"],\"word_by_word\":[\"**helā-bhava** — de la existencia material; **dāva** — el fuego forestal; **nirvāpaṇa** — extinguiendo; **vṛtti** — actividad; **kṛṣṇa-kīrttana** — el canto del nombre de Kṛṣṇa; **jaya** — gloria; **kleśa** — sufrimientos; **nivṛtti** — detener.\"],\"translation\":[\"¡Todas las glorias al canto del Santo Nombre de Kṛṣṇa! Él extingue el incendio forestal de la existencia material y erradica todas las tribulaciones materiales.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"helā-bhava\",\"trans\":\"de la existencia material\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"dāva\",\"trans\":\"el fuego forestal\",\"sep\":\"-\"},{\"text\":\"nirvāpaṇa\",\"trans\":\"extinguiendo\",\"sep\":\"-\"},{\"text\":\"vṛtti\",\"trans\":\"actividad\",\"sep\":\"\"}],[{\"text\":\"kṛṣṇa-kīrttana\",\"trans\":\"el canto del nombre de Kṛṣṇa\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"jaya\",\"trans\":\"gloria\",\"sep\":\" \"},{\"text\":\"kleśa\",\"trans\":\"sufrimientos\",\"sep\":\"-\"},{\"text\":\"nivṛtti\",\"trans\":\"detener\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"śreyaḥ-kumuda-bidhu-jyotsnā-prakāśa\",\"kṛṣṇa-kīrttana jaya bhakti-vilāsa\"],\"word_by_word\":[\"**śreyaḥ** — buena fortuna; **kumuda** — loto; **bidhu** — luna; **jyotsnā** — luz de la luna; **prakāśa** — brillo; **kṛṣṇa-kīrttana** — el canto del nombre de Kṛṣṇa; **jaya** — gloria; **bhakti-vilāsa** — pasatiempos del servicio devocional.\"],\"translation\":[\"¡Todas las glorias al canto del Santo Nombre de Kṛṣṇa! Él surge como la luna en el corazón y distribuye sus refrescantes rayos de luz haciendo que brote y florezca el loto blanco de la buena fortuna del alma. El Kṛṣṇa-kīrtan es el hermoso Pasatiempo de la devoción, *bhakti-vilāsa*.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"śreyaḥ\",\"trans\":\"buena fortuna\",\"sep\":\"-\"},{\"text\":\"kumuda\",\"trans\":\"loto\",\"sep\":\"-\"},{\"text\":\"bidhu\",\"trans\":\"luna\",\"sep\":\"-\"},{\"text\":\"jyotsnā\",\"trans\":\"luz de la luna\",\"sep\":\"-\"},{\"text\":\"prakāśa\",\"trans\":\"brillo\",\"sep\":\"\"}],[{\"text\":\"kṛṣṇa-kīrttana\",\"trans\":\"el canto del nombre de Kṛṣṇa\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"jaya\",\"trans\":\"gloria\",\"sep\":\" \"},{\"text\":\"bhakti-vilāsa\",\"trans\":\"pasatiempos del servicio devocional\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"5\",\"text\":[\"viśuddha-vidyā-vadhu jīvana-rūpa\",\"kṛṣṇa-kīrttana jaya siddha-svarūpa\"],\"word_by_word\":[\"**viśuddha** — puro; **vidyā** — conocimiento; **vadhu** — muchacha; **jīvana** — la vida; **rūpa** — forma; **kṛṣṇa-kīrttana** — el canto del nombre de Kṛṣṇa; **jaya** — gloria; **siddha-svarūpa** — forma perfecta.\"],\"translation\":[\"¡Todas las glorias al canto del Santo Nombre de Kṛṣṇa! Él nos revela nuestra identidad pura en relación con el Señor, aún hasta la relación divina de consorte. Este canto es la verdadera perfección de la vida.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"viśuddha\",\"trans\":\"puro\",\"sep\":\"-\"},{\"text\":\"vidyā\",\"trans\":\"conocimiento\",\"sep\":\"-\"},{\"text\":\"vadhu\",\"trans\":\"muchacha\",\"sep\":\" \"},{\"text\":\"jīvana\",\"trans\":\"la vida\",\"sep\":\"-\"},{\"text\":\"rūpa\",\"trans\":\"forma\",\"sep\":\"\"}],[{\"text\":\"kṛṣṇa-kīrttana\",\"trans\":\"el canto del nombre de Kṛṣṇa\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"jaya\",\"trans\":\"gloria\",\"sep\":\" \"},{\"text\":\"siddha-svarūpa\",\"trans\":\"forma perfecta\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"6\",\"text\":[\"ānanda-payo-nidhi-vardhana-kīrtti\",\"kṛṣṇa-kīrttana jaya plābana-mūrtti\"],\"word_by_word\":[\"**ānanda** — bienaventuranza; **payo-nidhi** — el océano; **vardhana** — incrementa; **kīrtti** — gloria; **kṛṣṇa-kīrttana** — el canto del nombre de Kṛṣṇa; **jaya** — gloria; **plābana** — inundación; **mūrtti** — la forma.\"],\"translation\":[\"¡Todas las glorias al canto del Santo Nombre de Kṛṣṇa! El Kṛṣṇa-kīrtan hace que se desborde el océano del júbilo extático. Él constituye una inundación de amor divino.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"ānanda\",\"trans\":\"bienaventuranza\",\"sep\":\"-\"},{\"text\":\"payo-nidhi\",\"trans\":\"el océano\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"vardhana\",\"trans\":\"incrementa\",\"sep\":\"-\"},{\"text\":\"kīrtti\",\"trans\":\"gloria\",\"sep\":\"\"}],[{\"text\":\"kṛṣṇa-kīrttana\",\"trans\":\"el canto del nombre de Kṛṣṇa\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"jaya\",\"trans\":\"gloria\",\"sep\":\" \"},{\"text\":\"plābana\",\"trans\":\"inundación\",\"sep\":\"-\"},{\"text\":\"mūrtti\",\"trans\":\"la forma\",\"sep\":\"\"}]]},{\"number\":\"7\",\"text\":[\"pade pade pījuṣa-svāda-pradātā\",\"kṛṣṇa-kīrttana jaya prema-bidhātā\"],\"word_by_word\":[\"**pade pade** — paso a paso; **pījuṣa** — de néctar; **svāda** — el gusto; **pradātā** — dando; **kṛṣṇa-kīrttana** — el canto del nombre de Kṛṣṇa; **jaya** — gloria; **prema** — amor divino; **bidhātā** — otorgar.\"],\"translation\":[\"¡Todas las glorias al canto del Santo Nombre de Kṛṣṇa! El Kṛṣṇa-kīrtan nos concede a cada paso una probada del totalmente satisfactorio néctar; finalmente concede el amor extático por el Supremo.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"pade pade\",\"trans\":\"paso a paso\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"pījuṣa\",\"trans\":\"de néctar\",\"sep\":\"-\"},{\"text\":\"svāda\",\"trans\":\"el gusto\",\"sep\":\"-\"},{\"text\":\"pradātā\",\"trans\":\"dando\",\"sep\":\"\"}],[{\"text\":\"kṛṣṇa-kīrttana\",\"trans\":\"el canto del nombre de Kṛṣṇa\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"jaya\",\"trans\":\"gloria\",\"sep\":\" \"},{\"text\":\"prema\",\"trans\":\"amor divino\",\"sep
