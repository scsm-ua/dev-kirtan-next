nda Prabhu; **more** — a mí; **kari’** — hacer; **dayā** — misericordia; **chhāḍāibe** — hará que abandone; **mora** — mi; **viṣayera** — de mundanidad; **māyā** — apego; **diyā** — dar; **more** — a mí; **nija** — propio; **charaṇera** — de Sus pies; **chhāyā** — sombra; **nāmera** — del Nombre; **hāṭete** — en el mercado; **dibe** — dará; **adhikāra** — cualificación.\"],\"translation\":[\"¿Cuándo Nityānanda será misericordioso conmigo y me hará abandonar mi apego a la mundanidad? ¿Cuándo me dará la sombra de Sus pies y me concederá un lugar en el mercado del Nombre?\"],\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"kabe\",\"trans\":\"¿cuándo?\",\"sep\":\" \"},{\"text\":\"nityānanda\",\"trans\":\"Śrī Nityānanda Prabhu\",\"sep\":\",        \"},{\"text\":\"more\",\"trans\":\"a mí\",\"sep\":\" \"},{\"text\":\"kari\",\"trans\":\"hacer\",\"sep\":\"’ \"},{\"text\":\"dayā\",\"trans\":\"misericordia\",\"sep\":\",\"}],[{\"text\":\"chhāḍāibe\",\"trans\":\"hará que abandone\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"mi\",\"sep\":\" \"},{\"text\":\"viṣayera\",\"trans\":\"de mundanidad\",\"sep\":\" \"},{\"text\":\"māyā\",\"trans\":\"apego\",\"sep\":\"\"}],[{\"text\":\"diyā\",\"trans\":\"dar\",\"sep\":\" \"},{\"text\":\"more\",\"trans\":\"a mí\",\"sep\":\" \"},{\"text\":\"nija\",\"trans\":\"propio\",\"sep\":\"-            \"},{\"text\":\"charaṇera\",\"trans\":\"de Sus pies\",\"sep\":\" \"},{\"text\":\"chhāyā\",\"trans\":\"sombra\",\"sep\":\",\"}],[{\"text\":\"nāmera\",\"trans\":\"del Nombre\",\"sep\":\" \"},{\"text\":\"hāṭete\",\"trans\":\"en el mercado\",\"sep\":\" \"},{\"text\":\"dibe\",\"trans\":\"dará\",\"sep\":\" \"},{\"text\":\"adhikāra\",\"trans\":\"cualificación\",\"sep\":\"\"}]]},{\"number\":\"7\",\"text\":[\"kiniba luṭiba,            hari-nāma-rasa,\",\"        nama-rase māti’ ha-iba vivaśa\",\"rasera rasika-            charaṇa-paraśa,\",\"        kariyā majiba rase anibāra\"],\"word_by_word\":[\"**kiniba** — compraré; **luṭiba** — distri
