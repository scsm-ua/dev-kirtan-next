a?\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"kabe\",\"trans\":\"¿cuándo?\",\"sep\":\" \"},{\"text\":\"ha’be\",\"trans\":\"será\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"bala\",\"trans\":\"por favor dime\",\"sep\":\" \"},{\"text\":\"se\",\"trans\":\"eso\",\"sep\":\" \"},{\"text\":\"dina\",\"trans\":\"día\",\"sep\":\" \"},{\"text\":\"āmāra\",\"trans\":\"mío\",\"sep\":\"\"}],[{\"text\":\"(āmāra\",\"trans\":\"ofensas\",\"sep\":\") \",\"error\":\"mismatch\"},{\"text\":\"aparādha\",\"trans\":\"disipado\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"ghuchi\",\"trans\":\"puro\",\"sep\":\"’,    \",\"error\":\"mismatch\"},{\"text\":\"śuddha\",\"trans\":\"por el Nombre\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nāme\",\"trans\":\"gusto (profundo apego amoroso)\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"ruchi\",\"trans\":\"de misericordia (de la misericordia del Nombre, o de la misericordia de Śrī Guru)\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"kṛpā\",\"trans\":\"por el poder\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"bale ha\",\"trans\":\"será\",\"sep\":\"’\",\"error\":\"mismatch\"},{\"text\":\"be\",\"trans\":\"en mi corazón\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hṛdaye\",\"trans\":\"infundido\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sañchara\",\"trans\":\"-\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"2\",\"text\":[\"tṛṇādhika hīna,            kabe nije māni,\",\"        sahiṣṇutā-guṇa hṛdayete āni’\",\"sakale mānada,            āpani amānī,\",\"        ha’ye āsvādiba nāma-rasa-sāra\"],\"word_by_word\":[\"**tṛṇa** — una brizna de hierba; **adhika** — más que; **hīna** — bajo; **kabe** — ¿cuándo?; **nije** — hacia mí mismo; **māni** — considerar; **sahiṣṇutā** — de tolerancia; **guṇa** — la cualidad; **hṛdayete** — en el corazón; **āni’** — traer; **sakale** — a todo; **mānada** — deseo de ofrecer honor; **āpani** — a mí mismo; **amānī** — si \"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"3\",\"text\":[\"dhana jana āra,            kavitā-sundarī,\",\"        baliba nā chāhi deha-sukha-karī\",\"janme janme dāo,        ohe gaurahari!\",\"        ahaitukī bhakti charaṇe tomāra\"],\"word_by_word\":[\"**dhana** — riqueza; **jana** — seguidores (familia); **āra** — y; **kavitā** — erudicción; **sundarī** — mujer hermosa; **baliba** — diré; **nā** — no; **chāhi** — yo deseo; **deha** — el cuerpo material; **sukha** — placer; **karī** — hacer; **janme** — en nacimiento; **janme** — depués de nacer; **dāo** — por favor da; **ohe** — oh; **gaurahari!** — ¡Śrīman Mahāprabhu!; **ahaitukī** — sin causa; **bhakti** — devoción; **charaṇe** — a los pies; **tomāra** — Tuyos.\"],\"translation\":[\"¿Cuándo declararé que no deseo riqueza, seguidores, erudición, hermosas mujeres, o cualquier otro placer corporal? ¡Oh Gaurahari! Nacimiento tras nacimiento, por favor otorgame devoción incondicional a Tus pies”.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"dhana\",\"trans\":\"riqueza\",\"sep\":\" \"},{\"text\":\"jana\",\"trans\":\"seguidores (familia)\",\"sep\":\" \"},{\"text\":\"āra\",\"trans\":\"y\",\"sep\":\",            \"},{\"text\":\"kavitā\",\"trans\":\"erudicción\",\"sep\":\"-\"},{\"text\":\"sundarī\",\"trans\":\"mujer hermosa\",\"sep\":\",\"}],[{\"text\":\"baliba\",\"trans\":\"diré\",\"sep\":\" \"},{\"text\":\"nā\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"chāhi\",\"trans\":\"yo deseo\",\"sep\":\" \"},{\"text\":\"deha\",\"trans\":\"el cuerpo material\",\"sep\":\"-\"},{\"text\":\"sukha\",\"trans\":\"placer\",\"sep\":\"-\"},{\"text\":\"karī\",\"trans\":\"hacer\",\"sep\":\"\"}],[{\"text\":\"janme\",\"trans\":\"en nacimiento\",\"sep\":\" \"},{\"text\":\"janme\",\"trans\":\"depués de nacer\",\"sep\":\" \"},{\"text\":\"dāo\",\"trans\":\"por favor da\",\"sep\":\",        \"},{\"text\":\"ohe\",\"trans\":\"oh\",\"sep\":\" \"},{\"text\":\"gaurahari\",\"trans\":\"¡Śrīman Mahāprabhu!\",\"sep\":\"!\"}],[{\"text\":\"ahaitukī\",\"trans\":\"sin causa\",\"sep\":\" \"},{\"text\":\"bhakti\",\"trans\":\"devoción\",\"sep\":\" \"},{\"text\":\"charaṇe\",\"trans\":\"a los pies\",\"sep\":\" \"},{\"text\":\"tomāra\",\"trans\":\"Tuyos\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"(kabe) karite śrī-kṛṣṇa-        nāma uchchāraṇa,\",\"        pulakita deha gadgada vachana\",\"vaivarṇya-vepathu,        ha’be saṁghaṭana,\",\"        nirantara netre va’be aśru-dhāra\"],\"word_by_word\":[\"**kabe** — ¿cuándo?; **karite** — en hacer; **śrī-kṛṣṇa** — de Śrī Kṛṣṇa; **nāma** — el Nombre; **uchchāraṇa** — expresar en alto; **pulakita** — asombro; **deha** — cuerpo; **gadgada** — ahogado; **vachana** — pronunciados; **vaivarṇya** — volteado; **vepathu** — temblando; **ha’be** — será; **saṁghaṭana** — ocurrencia; **nirantara** — incesantemente; **netre** — en los ojos; **va’be** — fluirá; **aśru** — de lágrimas; **dhāra** — torrentes.\"],\"translation\":[\"¿Cuándo se erizarán los vellos de mi cuerpo, mi voz se ahogará, mi tez palidecerá, mi cuerpo temblará y las lágrimas se derramarán incesantemente de mis ojos mientras yo llamo en voz alta el Nombre de Śrī Kṛṣṇa?\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"(kabe\",\"trans\":\"¿cuándo?\",\"sep\":\") \"},{\"text\":\"karite\",\"trans\":\"en hacer\",\"sep\":\" \"},{\"text\":\"śrī-kṛṣṇa\",\"trans\":\"de Śrī Kṛṣṇa\",\"sep\":\"-        \",\"error\":\"multi\"},{\"text\":\"nāma\",\"trans\":\"el Nombre\",\"sep\":\" \"},{\"text\":\"uchchāraṇa\",\"trans\":\"expresar en alto\",\"sep\":\",\"}],[{\"text\":\"pulakita\",\"trans\":\"asombro\",\"sep\":\" \"},{\"text\":\"deha\",\"trans\":\"cuerpo\",\"sep\":\" \"},{\"text\":\"gadgada\",\"trans\":\"ahogado\",\"sep\":\" \"},{\"text\":\"vachana\",\"trans\":\"pronunciados\",\"sep\":\"\"}],[{\"text\":\"vaivarṇya\",\"trans\":\"volteado\",\"sep\":\"-\"},{\"text\":\"vepathu\",\"trans\":\"temblando\",\"sep\":\",        \"},{\"text\":\"ha’be\",\"trans\":\"será\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"saṁghaṭana\",\"trans\":\"ocurrencia\",\"sep\":\",\"}],[{\"text\":\"nirantara\",\"trans\":\"incesantemente\",\"sep\":\" \"},{\"text\":\"netre\",\"trans\":\"en los ojos\",\"sep\":\" \"},{\"text\":\"va’be\",\"trans\":\"fluirá\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"aśru\",\"trans\":\"de lágrimas\",\"sep\":\"-\"},{\"text\":\"dhāra\",\"trans\":\"torrentes\",\"sep\":\"\"}]]},{\"number\":\"5\",\"text\":[\"kabe navadvīpe,            suradhunī-taṭe,\",\"        ‘gaura-nityānanda’ bali’ niṣkapaṭe\",\"nāchiyā gāiyā,            beḍāiba chhuṭe,\",\"        vātulera prāya chhāḍiyā vichāra\"],\"word_by_word\":[\"**kabe** — ¿cuándo?; **navadvīpe** — en Nabadwīp; **suradhunī** — del Ganges; **taṭe** — en la orilla; **gaura-nityānanda** — ‘¡Gaura-Nityānanda!’; **bali’** — diciendo; **niṣkapaṭe** — sinceramente; **nāchiyā** — danzar; **gāiyā** — cantar; **beḍāiba** — vagaré; **chhuṭe** — corriendo alrededor; **vātulera** — como un loco; **prāya** — casi; **chhāḍiyā** — abandonar; **vichāra** — preocupación, prudencia.\"],\"translation\":[\"¿Cuándo vagaré a lo largo de las orillas del Ganges en Nabadwīp, sinceramente llamando, “¡Gaura-Nityānanda!”, mientras danzo, canto y corro, habiendo abandonado todas las preocupaciones como si estuviese loco?\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"kabe\",\"trans\":\"¿cuándo?\",\"sep\":\" \"},{\"text\":\"navadvīpe\",\"trans\":\"en Nabadwīp\",\"sep\":\",            \"},{\"text\":\"suradhunī\",\"trans\":\"del Ganges\",\"sep\":\"-\"},{\"text\":\"taṭe\",\"trans\":\"en la orilla\",\"sep\":\",\"}],[{\"text\":\"‘gaura-nityānanda\",\"trans\":\"‘¡Gaura-Nityānanda!’\",\"sep\":\"’ \",\"error\":\"multi\"},{\"text\":\"bali\",\"trans\":\"diciendo\",\"sep\":\"’ \"},{\"text\":\"niṣkapaṭe\",\"trans\":\"sinceramente\",\"sep\":\"\"}],[{\"text\":\"nāchiyā\",\"trans\":\"danzar\",\"sep\":\" \"},{\"text\":\"gāiyā\",\"trans\":\"cantar\",\"sep\":\",            \"},{\"text\":\"beḍāiba\",\"trans\":\"vagaré\",\"sep\":\" \"},{\"text\":\"chhuṭe\",\"trans\":\"corriendo alrededor\",\"sep\":\",\"}],[{\"text\":\"vātulera\",\"trans\":\"como un loco\",\"sep\":\" \"},{\"text\":\"prāya\",\"trans\":\"casi\",\"sep\":\" \"},{\"text\":\"chhāḍiyā\",\"trans\":\"abandonar\",\"sep\":\" \"},{\"text\":\"vichāra\",\"trans\":\"preocupación, prudencia\",\"sep\":\"\"}]]},{\"number\":\"6\",\"text\":[\"kabe nityānanda,        more kari’ dayā,\",\"        chhāḍāibe mora viṣayera māyā\",\"diyā more nija-            charaṇera chhāyā,\",\"        nāmera hāṭete dibe adhikāra\"],\"word_by_word\":[\"**kabe** — ¿cuándo?; **nityānanda** — Śrī Nityānanda Prabhu; **more** — a mí; **kari’** — hacer; **dayā** — misericordia; **chhāḍāibe** — hará que abandone; **mora** — mi; **viṣayera** — de mundanidad; **māyā** — apego; **diyā** — dar; **more** — a mí; **nija** — propio; **charaṇera** — de Sus pies; **chhāyā** — sombra; **nāmera** — del Nombre; **hāṭete** — en el mercado; **dibe** — dará; **adhikāra** — cualificación.\"],\"translation\":[\"¿Cuándo Nityānanda será misericordioso conmigo y me hará abandonar mi apego a la mundanidad? ¿Cuándo me dará la sombra de Sus pies y me concederá un lugar en el mercado del Nombre?\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"kabe\",\"trans\":\"¿cuándo?\",\"sep\":\" \"},{\"text\":\"nityānanda\",\"trans\":\"Śrī Nityānanda Prabhu\",\"sep\":\",        \"},{\"text\":\"more\",\"trans\":\"a mí\",\"sep\":\" \"},{\"text\":\"kari\",\"trans\":\"hacer\",\"sep\":\"’ \"},{\"text\":\"dayā\",\"trans\":\"misericordia\",\"sep\":\",\"}],[{\"text\":\"chhāḍāibe\",\"trans\":\"hará que abandone\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"mi\",\"sep\":\" \"},{\"text\":\"viṣayera\",\"trans\":\"de mundanidad\",\"sep\":\" \"},{\"text\":\"māyā\",\"trans\":\"apego\",\"sep\":\"\"}],[{\"text\":\"diyā\",\"trans\":\"dar\",\"sep\":\" \"},{\"text\":\"more\",\"trans\":\"a mí\",\"sep\":\" \"},{\"t
