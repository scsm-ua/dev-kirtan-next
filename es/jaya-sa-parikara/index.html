"\u003ci class=\\\"SongHeader__bold\\\"\u003ejay\u003c/i\u003e — gloria; \u003ci class=\\\"SongHeader__bold\\\"\u003edhvani\u003c/i\u003e — cantar.\"}}]],[],[]]}]]\n"])</script><script>self.__next_f.push([1,"18:[\"$\",\"$L21\",null,{\"bookId\":\"es\",\"label\":\"Mostrar traducción\",\"song\":{\"meta\":{\"page\":20,\"no-author\":1,\"first_line\":\"jay sa-parikara\"},\"title\":[\"Jay Dhvani\"],\"word_by_word\":[\"**jay** — gloria; **dhvani** — cantar.\"],\"verses\":[{\"translation\":[\"Su Divina Gracia Śrīla B. S. Govinda Dev-Goswāmī Mahārāj recomendó que en cada Templo o *aśram*, los devotos particularmente glorifiquen a las Deidades que presiden en su altar. En el Maṭh de Nabadwīp, los devotos glorifican así a las Deidades:\",\"*¡jaya sa-parikara śrī-śrī-guru-gaurāṅga gāndharvā govindasundar giridhārī gopāl jīu kī jaya!*\",\"Por ejemplo, en el caso del Maṭh de Veracruz (México), los devotos glorifican a Sus Señorías de esta manera:\",\"*¡jaya sa-parikara śrī-śrī-guru-gaurāṅga gāndharvā govinda nanda nandana kī jaya!*\",\"Por otra parte, los devotos del Maṭh de Caracas (Venezuela) glorifican a las divinas formas del Señor instaladas allí, de la siguiente manera:\",\"*¡jaya sa-parikara śrī śrī parama karuṇa nitāi gaurachandra giri-govardhan kī jaya!*\",\"Podemos recitar además el nombre de las Deidades locales del Śrī Chaitanya Sāraswat Maṭh de Nabadwīp Dhām y de Tarakeśwar. En ocasiones especiales e importantes como lo son el día del Vyāsa-pūjā de nuestros Āchāryas, el día de la Aparición del Señor, el día del Aniversario de la Instalación de las Deidades, etc.\"],\"isLong\":false},{\"text\":[\"¡Jay sa-parikara Śrī Śrī Guru Gaurāṅga Gāndharvā Govinda Sundar Giridhārī Gopāl jīu kī jay!\"],\"word_by_word\":[\"**¡jay!** — ¡toda gloria!; **sa** — junto con; **parikara** — asociados; **śrī śrī** — Sus Señorías; **guru** — maestro espiritual; **gaurāṅga** — el Señor dorado; (**gaura** — dorado; **aṅga** — cuerpo); **gāndharvā** — quien danza para Kṛṣṇa, Gāndharvīka (Rādhārāṇī); **govinda sundar** — el hermoso Govinda; (**go** — vaca; **vinda** — quien da placer); **giridhārī** — quien sostiene a Giriraj Govardhan (Kṛṣṇa); **gopāl** — ; quien proteje a las vacas, (Kṛṣṇa); (**go** — vaca; **pāla** — protector); **jīu** — vivan siempre; **kī** — que así sea; **¡jay!** — ¡toda gloria!\"],\"translation\":[\"¡Todas las glorias a Śrī Gurudev y al Señor Gaurāṅga, a Sus Señorías Śrī Śrī Gāndharvā Govinda Sundar, a Śrī Giridhārī, a Śrī Gopāl, a todos Sus asociados y a Sus Pasatiempos eternos!\"],\"isLong\":true,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"¡Jay\",\"trans\":\"¡toda gloria!\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sa\",\"trans\":\"junto con\",\"sep\":\"-\"},{\"text\":\"parikara\",\"trans\":\"asociados\",\"sep\":\" \"},{\"text\":\"Śrī Śrī\",\"trans\":\"Sus Señorías\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"Guru\",\"trans\":\"maestro espiritual\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"Gaurāṅga\",\"trans\":\"el Señor dorado; (\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"Gāndharvā\",\"trans\":\"dorado\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"Govinda\",\"trans\":\"cuerpo)\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"Sundar\",\"trans\":\"quien danza para Kṛṣṇa, Gāndharvīka (Rādhārāṇī)\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"Giridhārī Gopāl\",\"trans\":\"el hermoso Govinda; (\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"jīu\",\"trans\":\"vaca\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kī\",\"trans\":\"quien da placer)\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"jay\",\"trans\":\"quien sostiene a Giriraj Govardhan (Kṛṣṇa)\",\"sep\":\"!\",\"error\":\"mismatch\"}]]},{\"text\":[\"¡Jay sa-parikara Śrī Śrī Parama Karuṇa Nitāi Gaurachandra Giri-Govardhan jīu kī jay!\"],\"word_by_word\":[\"**¡jay!** — ¡toda gloria!; **sa** — junto con; **parikara** — asociados; **śrī śrī** — Sus Señorías; **parama** — supremo; **karuṇa** — m
