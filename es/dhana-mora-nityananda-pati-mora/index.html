 Advaita Āchārya Prabhu; **bala** — fuerza; **gadādhara** — Gadādhara Paṇḍit; **mora** — mío; **kula** — familia; **narahari** — Narahari Sarakār; **vilasai** — gloria; **mora** — mía.\"],\"translation\":[\"El Señor Nityānanda es mi riqueza. El Señor Gaurachandra es mi amo. La joven Divina Pareja es mi vida. Advaita Āchārya es mi fuerza. Gadādhar es mi familia. Narahari Sarakār es mi gloria.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"dhana\",\"trans\":\"riqueza\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"mía\",\"sep\":\" \"},{\"text\":\"nityānanda\",\"trans\":\"Nityānanda\",\"sep\":\"        \"},{\"text\":\"pati\",\"trans\":\"amo\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"mío\",\"sep\":\" \"},{\"text\":\"gaurachandra\",\"trans\":\"Gaurachandra\",\"sep\":\"\"}],[{\"text\":\"prāṇa\",\"trans\":\"vida\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"mía\",\"sep\":\" \"},{\"text\":\"jugala\",\"trans\":\"pareja\",\"sep\":\"-\"},{\"text\":\"kiśora\",\"trans\":\"joven\",\"sep\":\"\"}],[{\"text\":\"advaita āchāryya\",\"trans\":\"Advaita Āchārya Prabhu\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"bala\",\"trans\":\"fuerza\",\"sep\":\"        \"},{\"text\":\"gadādhara\",\"trans\":\"Gadādhara Paṇḍit\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"mío\",\"sep\":\" \"},{\"text\":\"kula\",\"trans\":\"familia\",\"sep\":\"\"}],[{\"text\":\"narahari\",\"trans\":\"Narahari Sarakār\",\"sep\":\" \"},{\"text\":\"vilasai\",\"trans\":\"gloria\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"mía\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"vaiṣṇavera pada-dhūli        tāhe mora snāna–keli\",\"        tarpaṇa mora vaiṣṇavera nāma\",\"bichāra koriyā mane        bhakti-rasa āsvādane\",\"        madhyastha śrī-bhāgavata purāṇa\"],\"word_by_word\":[\"**vaiṣṇavera** — de los devotos; **pada** — los pies; **dhūli** — polvo; **tāhe** — ellos; **mora** — mío; **snāna** — de baño; **keli** — pasatiempos; **tarpaṇa** — satisfacción; **mora** — mío; **vaiṣṇavera** — de los devotos; **nāma** — el nombre; **bichāra** — consideración; **koriyā** — hacer; **mane** — en la mente; **bhakti-rasa** — néctar del servicio; **āsvādane** — al degustar; **madhyastha** — en medio; **śrī-bhāgavata purāṇa** — el *Śrīmad Bhāgavatam Purāṇa*.\"],\"translation\":[\"El polvo de los pies de loto de los devotos es el agua con la que me baño. El canto de los nombres de los devotos es mi satisfacción. Tomando en cuenta los méritos de todas las literaturas védicas a la luz del servicio devocional, llegué a la conclusión de que el *Śrīmad Bhāgavatam* es la mejor de todas las Escrituras.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"vaiṣṇavera\",\"trans\":\"de los devotos\",\"sep\":\" \"},{\"text\":\"pada\",\"trans\":\"los pies\",\"sep\":\"-\"},{\"text\":\"dhūli\",\"trans\":\"polvo\",\"sep\":\"        \"},{\"text\":\"tāhe\",\"trans\":\"ellos\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"mío\",\"sep\":\" \"},{\"text\":\"snāna–keli\",\"trans\":\"de baño\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"tarpaṇa\",\"trans\":\"pasatiempos\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"mora\",\"trans\":\"satisfacción\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"vaiṣṇavera\",\"trans\":\"mío\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nāma\",\"trans\":\"de los devotos\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"bichāra\",\"trans\":\"el nombre\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"koriyā\",\"trans\":\"consideración\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"mane\",\"trans\":\"hacer\",\"sep\":\"        \",\"error\":\"mismatch\"},{\"text\":\"bhakti\",\"trans\":\"en la mente\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"rasa āsvādane\",\"trans\":\"néctar del servicio\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"madhyastha\",\"trans\":\"al degustar\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"śrī\",\"trans\":\"en medio\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"bhāgavata purāṇa\",\"trans\":\"el *Śrīmad Bhāgavatam Purāṇa*\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"3\",\"text\":[\"vaiṣṇavera uchiṣṭa        tāhe mora mano-niṣṭha\",\"        vaiṣṇavera nāmete ullāsa\",\"vṛndāvane chaturā        tāhe mora mano-gherā\",\"        kohe dīne narottama dāsa\"],\"word_by_word\":[\"**vaiṣṇavera** — de los devotos; **uchiṣṭa** — remanentes; **tāhe** — ellos; **mora** — mío; **mano** — de la mente; **niṣṭha** — fe; **vaiṣṇavera** — de los devotos; **nāmete** — el nombre; **ullāsa** — júbilo; **vṛndāvane chaturā** — en Vṛndāvan; **tāhe** — ellos; **mora** — mío; **mano** — de la mente; **gherā** — recinto; **kohe** — dice; **dīne** — pobre; **narottama dāsa** — Narottam Dās.\"],\"translation\":[\"Mi mente está firmemente convencida del beneficio espiritual que se obtiene al comer los remanentes de la comida de los devotos. Los nombres de los devotos son mi felicidad. La tierra de Vṛndāvan es el recinto dentro del cual mantengo mi mente. Narottam Dās, quien es pobre de corazón, habla de esta manera.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"vaiṣṇavera\",\"trans\":\"de los devotos\",\"sep\":\" \"},{\"text\":\"uchiṣṭa\",\"trans\":\"remanentes\",\"sep\":\"        \"},{\"text\":\"tāhe\",\"trans\":\"ellos\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"mío\",\"sep\":\" \"},{\"text\":\"mano\",\"trans\":\"de la mente\",\"sep\":\"-\"},{\"text\":\"niṣṭha\",\"trans\":\"fe\",\"sep\":\"\"}],[{\"text\":\"vaiṣṇavera\",\"trans\":\"de los devotos\",\"sep\":\" \"},{\"text\":\"nāmete\",\"trans\":\"el nombre\",\"sep\":\" \"},{\"text\":\"ullāsa\",\"trans\":\"júbilo\",\"sep\":\"\"}],[{\"text\":\"vṛndāvane chaturā\",\"trans\":\"en Vṛndāvan\",\"sep\":\"        \",\"error\":\"multi\"},{\"text\":\"tāhe\",\"trans\":\"ellos\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"mío\",\"sep\":\" \"},{\"text\":\"mano\",\"trans\":\"de la mente\",\"sep\":\"-\"},{\"text\":\"gherā\",\"trans\":\"recinto\",\"sep\
