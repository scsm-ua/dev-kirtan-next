 Gaurachandra es mi amo. La joven Divina Pareja es mi vida. Advaita Āchārya es mi fuerza. Gadādhar es mi familia. Narahari Sarakār es mi gloria.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"dhana\",\"trans\":\"riqueza\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"mía\",\"sep\":\" \"},{\"text\":\"nityānanda\",\"trans\":\"Nityānanda\",\"sep\":\"        \"},{\"text\":\"pati\",\"trans\":\"amo\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"mío\",\"sep\":\" \"},{\"text\":\"gaurachandra\",\"trans\":\"Gaurachandra\",\"sep\":\"\"}],[{\"text\":\"prāṇa\",\"trans\":\"vida\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"mía\",\"sep\":\" \"},{\"text\":\"jugala\",\"trans\":\"pareja\",\"sep\":\"-\"},{\"text\":\"kiśora\",\"trans\":\"joven\",\"sep\":\"\"}],[{\"text\":\"advaita āchāryya\",\"trans\":\"Advaita Āchārya Prabhu\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"bala\",\"trans\":\"fuerza\",\"sep\":\"        \"},{\"text\":\"gadādhara\",\"trans\":\"Gadādhara Paṇḍit\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"mío\",\"sep\":\" \"},{\"text\":\"kula\",\"trans\":\"familia\",\"sep\":\"\"}],[{\"text\":\"narahari\",\"trans\":\"Narahari Sarakār\",\"sep\":\" \"},{\"text\":\"vilasai\",\"trans\":\"gloria\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"mía\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"vaiṣṇavera pada-dhūli        tāhe mora snāna–keli\",\"        tarpaṇa mora vaiṣṇavera nāma\",\"bichāra koriyā mane        bhakti-rasa āsvādane\",\"        madhyastha śrī-bhāgavata purāṇa\"],\"word_by_word\":[\"**vaiṣṇavera** — de los devotos; **pada** — los pies; **dhūli** — polvo; **tāhe** — ellos; **mora** — mío; **snāna** — de baño; **keli** — pasatiempos; **tarpaṇa** — satisfacción; **mora** — mío; **vaiṣṇavera** — de los devotos; **nāma** — el nombre; **bichāra** — consideración; **koriyā** — hacer; **mane** — en la mente; **bhakti-rasa** — néctar del servicio; **āsvādane** — al degustar; **madhyastha** — en medio; **śrī-bhāgavata iṣṇavera nāmete ullāsa\",\"vṛndāvane chaturā        tāhe mora mano-gherā\",\"        kohe dīne narottama dāsa\"],\"word_by_word\":[\"**vaiṣṇavera** — de los devotos; **uchiṣṭa** — remanentes; **tāhe** — ellos; **mora** — mío; **mano** — de la mente; **niṣṭha** — fe; **vaiṣṇavera** — de los devotos; **nāmete** — el nombre; **ullāsa** — júbilo; **vṛndāvane chaturā** — en Vṛndāvan; **tāhe** — ellos; **mora** — mío; **mano** — de la mente; **gherā** — recinto; **kohe** — dice; **dīne** — pobre; **narottama dāsa** — Narottam Dās.\"],\"translation\":[\"Mi mente está firmemente convencida del beneficio espiritual que se obtiene al comer los remanentes de la comida de los devotos. Los nombres de los devotos son mi felicidad. La tierra de Vṛndāvan es el recinto dentro del cual mantengo mi mente. Narottam Dās, quien es pobre de corazón, habla de esta manera.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"vaiṣṇavera\",\"trans\":\"de los devotos\",\"sep\":\" \"},{\"text\":\"uchiṣṭa\",\"trans\":\"remanentes\",\"sep\":\"        \"},{\"text\":\"tāhe\",\"trans\":\"ellos\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"mío\",\"sep\":\" \"},{\"text\":\"mano\",\"trans\":\"de la mente\",\"sep\":\"-\"},{\"text\":\"niṣṭha\",\"trans\":\"fe\",\"sep\":\"\"}],[{\"text\":\"vaiṣṇavera\",\"trans\":\"de los devotos\",\"sep\":\" \"},{\"text\":\"nāmete\",\"trans\":\"el nombre\",\"sep\":\" \"},{\"text\":\"ullāsa\",\"trans\":\"júbilo\",\"sep\":\"\"}],[{\"text\":\"vṛndāvane chaturā\",\"trans\":\"en Vṛndāvan\",\"sep\":\"        \",\"error\":\"multi\"},{\"text\":\"tāhe\",\"trans\":\"ellos\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"mío\",\"sep\":\" \"},{\"text\":\"mano\",\"trans\":\"de la mente\",\"sep\":\"-\"},{\"text\":\"gherā\",\"trans\":\"recinto\",\"sep\":\"\"}],[{\"text\":\"kohe\",\"trans\":\"dice\",\"sep\":\" \"},{\"text\":\"dīne\",\"trans\":\"pobre\",\"sep\":\" \"},{\"text\":\"narottama dāsa\",\"trans\":\"Narottam Dās\",\"sep\":\"\",\"error\":\"m
