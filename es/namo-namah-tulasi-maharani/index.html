\":\"nārāyaṇī\",\"trans\":\"a Nārāyaṇī\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"yā̐ko daraśe paraśe agha-nāśa hoi\",\"mahimā veda-purāṇe vākhāni\"],\"word_by_word\":[\"**yā̐ko** — aquellos; **daraśe** — visión; **paraśe** — toque; **agha** — pecados; **nāśa** — destruidos; **hoi** — volverse; **mahimā** — glorias; **veda-purāṇe** — en los *Vedas* y *Purāṇas*; **vākhāni** — describen.\"],\"translation\":[\"Al verte o tocarte, todos los pecados son destruidos. Tus glorias son cantadas en los *Vedas* y los *Purāṇas*.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"yā̐ko\",\"trans\":\"aquellos\",\"sep\":\" \"},{\"text\":\"daraśe\",\"trans\":\"visión\",\"sep\":\" \"},{\"text\":\"paraśe\",\"trans\":\"toque\",\"sep\":\" \"},{\"text\":\"agha\",\"trans\":\"pecados\",\"sep\":\"-\"},{\"text\":\"nāśa\",\"trans\":\"destruidos\",\"sep\":\" \"},{\"text\":\"hoi\",\"trans\":\"volverse\",\"sep\":\"\"}],[{\"text\":\"mahimā\",\"trans\":\"glorias\",\"sep\":\" \"},{\"text\":\"veda-purāṇe\",\"trans\":\"en los *Vedas* y *Purāṇas*\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"vākhāni\",\"trans\":\"describen\",\"sep\":\"\"}]]},{\"number\":\"3\",\"text\":[\"yā̐ko patra mañjarī komala\",\"śrī-pati-charaṇa-kamale lepaṭāni\"],\"word_by_word\":[\"**yā̐ko** — aquellas; **patra** — hojas; **mañjarī** — flores de Tulasī; **komala** — suave; **śrī-pati-charaṇa-kamale** — a los pies de de loto de su señoradorable (Nārāyaṇ); **lepaṭāni** — entrelazada.\"],\"translation\":[\"Tus hojas y tus suaves *mañjarīs* están entrelazadas a los pies de loto de Nārāyaṇ.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"yā̐ko\",\"trans\":\"aquellas\",\"sep\":\" \"},{\"text\":\"patra\",\"trans\":\"hojas\",\"sep\":\" \"},{\"text\":\"mañjarī\",\"trans\":\"flores de Tulasī\",\"sep\":\" \"},{\"text\":\"komala\",\"trans\":\"suave\",\"sep\":\"\"}],[{\"text\":\"śrī-pati-charaṇa-kamale\",\"trans\":\"a los pies de de loto de su señoradorable (Nārāyaṇ)\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"lepaṭāni\",\"trans\":\"entrelazada\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"dhanya tulasī pūraṇa tapa kiye\",\"śrī-śālagrāma-mahā-pāṭarāṇī\"],\"word_by_word\":[\"**dhanya** — afortunada; **tulasī** — Tulasī; **pūraṇa** — cumpliendo; **tapa** — austeridad; **kiye** — realizar; **śrī-śālagrāma** — deidad adorable; **mahā-pāṭarāṇī** — la adorable consorte.\"],\"translation\":[\"¡Oh, afortunada Tulasī! Mediante la ejecución de tus austeridades, has llegado a ser la adorable consorte de Śrī Śālagrām.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"dhanya\",\"trans\":\"afortunada\",\"sep\":\" \"},{\"text\":\"tulasī\",\"trans\":\"Tulasī\",\"sep\":\" \"},{\"text\":\"pūraṇa\",\"trans\":\"cumpliendo\",\"sep\":\" \"},{\"text\":\"tapa\",\"trans\":\"austeridad\",\"sep\":\" \"},{\"text\":\"kiye\",\"trans\":\"realizar\",\"sep\":\"\"}],[{\"text\":\"śrī-śālagrāma\",\"trans\":\"deidad adorable\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"mahā-pāṭarāṇī\",\"trans\":\"la adorable consorte\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"5\",\"text\":[\"dhūpa, dīpa, naivedya, ārati\",\"phulanā kiye varakhā varakhāni\"],\"word_by_word\":[\"**dhūpa** — incienso; **dīpa** — lámpara; **naivedya** — alimentos; **ārati** — ceremonia; **phulanā** — de flores; **kiye** — tanto; **varakhā** — derramar; **varakhāni** — la que derrama gracia.\"],\"translation\":[\"Derramas tu misericordia sobre quienquiera que te ofrece un incienso, una lámpara, alimentos, adoración y flores.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"dhūpa\",\"trans\":\"incienso\",\"sep\":\", \"},{\"text\":\"dīpa\",\"trans\":\"lámpara\",\"sep\":\", \"},{\"text\":\"naivedya\",\"trans\":\"alimentos\",\"sep\":\", \"},{\"text\":\"ārati\",\"trans\":\"ceremonia\",\"sep\":\"\"}],[{\"text\":\"phulanā\",\"trans\":\"de flores\",\"sep\":\" \"},{\"text\":\"kiye\",\"trans\":\"tanto\",\"sep\":\" \"},{\"text\":\"varakhā\",\"trans\":\"derramar\",\"sep\":\" \"},{\"text\":\"varakhāni\",\"trans\":\"la que derrama gracia\",\"sep\":\"\"}]]},{\"number\":\"6\",\"text\":[\"chhāppānna bhoga, chhatriśa vyañjana\",\"vinā tulasī prabhu eka nāhi māni\"],\"word_by_word\":[\"**chhāppānna** — cincuenta y seis clases de granos; **bhoga** — ofrenda; **chhatriśa** — treinta y seis; **vyañjana** — vegetales cocidos; **vinā** — sin; **tulasī** — Tulasī; **prabhu** — el Señor; **eka** — una; **nāhi** — no; **māni** — acepta.\"],\"translation\":[\"El Señor no acepta ni siquiera una de las cincuenta y seis ofrendas de granos o de las treinta y seis ofrendas de vegetales ofrecidas sin hojas de Tulasī.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"chhāppānna\",\"trans\":\"cincuenta y seis clases de granos\",\"sep\":\" \"},{\"text\":\"bhoga\",\"trans\":\"ofrenda\",\"sep\":\", \"},{\"text\":\"chhatriśa\",\"trans\":\"treinta y seis\",\"sep\":\" \"},{\"text\":\"vyañjana\",\"trans\":\"vegetales cocidos\",\"sep\":\"\"}],[{\"text\":\"vinā\",\"trans\":\"sin\",\"sep\":\" \"},{\"text\":\"tulasī\",\"trans\":\"Tulasī\",\"sep\":\" \"},{\"text\":\"prabhu\",\"trans\":\"el Señor\",\"sep\":\" \"},{\"text\":\"eka\",\"trans\":\"una\",\"sep\":\" \"},{\"text\":\"nāhi\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"māni\",\"trans\":\"acepta\",\"sep\":\"\"}]]},{\"number\":\"7\",\"text\":[\"śiva śuka nārada ā-ura brahmādika\",\"ḍhu̐rata phirata mahā-muni jñānī\"],\"word_by_word\":[\"**śiva** — Śiva; **śuka** — Śuka; **nārada** — Nārada; **ā-ura** — además; **brahmādika** — todos los Brahmās; **ḍhu̐rata** — dador de riqueza; **phirata** — rodean; **mahā-muni** — grandes sabios; **jñānī** — escolástico.\"],\"translation\":[\"Śiva, Śukadev, Nārada, Brahmā, los otros semidioses, los místicos y los grandes *munis* te circunvalan.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"śiva\",\"trans\":\
