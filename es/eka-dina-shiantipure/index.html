*bhakta-gaṇa** — los devotos reunidos; **ei śāk** — este *śāk*; **kṛṣṇa āsvādilo** — Kṛṣṇa lo ha probado.\"],\"translation\":[\"¡Oh hermanos! Un día, en la casa de Śrī Advaita en Śāntipura, los dos Señores, Chaitanya y Nityānanda, estaban sentados listos para almorzar. El Señor Chaitanya probó la preparación de vegetales de hojas verdes y se dirigió a la asamblea de Sus devotos: “¡Este *śāk* es tan delicioso! El Señor Kṛṣṇa definitivamente lo ha probado”.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"bhāi-re\",\"trans\":\"¡oh hermanos!\",\"sep\":\"!\",\"error\":\"multi\"}],[{\"text\":\"eka-dina\",\"trans\":\"un día\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"śāntipure\",\"trans\":\"en Śāntipura\",\"sep\":\",        \"},{\"text\":\"prabhu advaitera\",\"trans\":\"de Advaita Prabhu\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"ghare\",\"trans\":\"en la casa\",\"sep\":\",\"}],[{\"text\":\"dui prabhu\",\"trans\":\"los dos Prabhus\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"bhojane\",\"trans\":\"a comer\",\"sep\":\" \"},{\"text\":\"bosilo\",\"trans\":\"se sentaron\",\"sep\":\"\"}],[{\"text\":\"śāk\",\"trans\":\"*śāk* (hojas verdes)\",\"sep\":\" \"},{\"text\":\"kori\",\"trans\":\"hicieron\",\"sep\":\"’ \"},{\"text\":\"āsvādana\",\"trans\":\"probaron\",\"sep\":\",        \"},{\"text\":\"prabhu bole\",\"trans\":\"el Señor dijo\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"bhakta-gaṇa\",\"trans\":\"los devotos reunidos\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"ei śāk\",\"trans\":\"este *śāk*\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"kṛṣṇa āsvādilo\",\"trans\":\"Kṛṣṇa lo ha probado\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"2\",\"text\":[\"heno śāk-āsvādane,        kṛṣṇa-prema aise mane,\",\"        sei preme koro āsvādana\",\"jaḍa-buddhi parihari’,        prasāda bhojana kori’,\",\"        ‘hari hari’ bolo sarva jana\"],\"word_by_word\":[\"**heno** — de esta manera; **śāk-āsvādane** — probar el *śāk*; **kṛṣṇa-prema** — amor puro por Kṛṣṇa; **aise** — obtiene; **mane** — en el corazón; **sei** — ese; **preme** — amor; **koro** — hace; **āsvādana** — prueba; **jaḍa** — material; **buddhi** — concepciones; **parihari’** — derrotando; **prasāda bhojana** — tomando *prasādam*; **kori’** — hizo; **‘hari hari’ bolo** — cantar Hari Hari; **sarva jana** — todas las personas.\"],\"translation\":[\"“Al saborear un *śāk* como este, el amor por Kṛṣṇa surge en el corazón. Con tal amor deberían probar estos remanentes. Abandonando todas las concepciones materialistas y tomando el *prasādam* del Señor, todos ustedes simplemente canten ‘¡Hari! ¡Hari!’”.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"heno\",\"trans\":\"de esta manera\",\"sep\":\" \"},{\"text\":\"śāk-āsvādane\",\"trans\":\"probar el *śāk*\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"kṛṣṇa-prema\",\"trans\":\"amor puro por Kṛṣṇa\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"aise\",\"trans\":\"obtiene\",\"sep\":\" \"},{\"text\":\"mane\",\"trans\":\"en el corazón\",\"sep\":\",\"}],[{\"text\":\"sei\",\"trans\":\"ese\",\"sep\":\" \"},{\"text\":\"preme\",\"trans\":\"amor\",\"sep\":\" \"},{\"text\":\"koro\",\"trans\":\"hace\",\"sep\":\" \"},{\"text\":\"āsvādana\",\"trans\":\"prueba\",\"sep\":\"\"}],[{\"text\":\"jaḍa\",\"trans\":\"material\",\"sep\":\"-\"},{\"text\":\"buddhi\",\"trans\":\"concepciones\",\"sep\":\" \"},{\"text\":\"parihari\",\"trans\":\"derrotando\",\"sep\":\"’,        \"},{\"text\":\"prasāda bhojana\",\"trans\":\"tomando *prasādam*\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"kori\",\"trans\":\"hizo\",\"sep\":\"’,\"}],[{\"text\":\"‘hari hari’ bolo\",\"trans\":\"cantar Hari Hari\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"sarva jana\",\"trans\":\"todas las personas\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"3\",\"text\":[\"śachīra aṅgane kabhu,        mādhavendra-purī prabhu,\",\"        prasādānna korena bhojana\",\"khāite khāite tā’ra,        āilo prema sudurbāra,\",\"        bole, śuno sannyāsīra gaṇa\"],\"word_by_word\":[\"**śachīra** — de Madre Śachī; **aṅgane** — en el patio; **kabhu** — cuando; **mādhavendra-purī** — Mādhavendra Purī; **prabhu** — del Señor; **prasādānna** — el alimento *prasādam*; **korena** — hizo; **bhojana** — comiendo; **khāite khāite** — comer y comer; **tā’ra** — de eso; **āilo** — estaba; **prema** — amor divino; **sudurbāra** — irresistible; **bole** — por el poder; **śuno** — escuchen; **sannyāsīra gaṇa** — al grupo de *sannyāsīs*.\"],\"translation\":[\"Madhavendra Purī Prabhu a veces honraba *prasādam* en el patio de Madre Śachī. Mientras comía y comía, se sentía abrumado por síntomas de amor extático por Dios. Una vez, se dirigió a los renunciantes que lo acompañaban: “¡Oh *sannyāsīs* reunidos! Escuchen esto:\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"śachīra\",\"trans\":\"de Madre Śachī\",\"sep\":\" \"},{\"text\":\"aṅgane\",\"trans\":\"en el patio\",\"sep\":\" \"},{\"text\":\"kabhu\",\"trans\":\"cuando\",\"sep\":\",        \"},{\"text\":\"mādhavendra-purī\",\"trans\":\"Mādhavendra Purī\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"prabhu\",\"trans\":\"del Señor\",\"sep\":\",\"}],[{\"text\":\"prasādānna\",\"trans\":\"el alimento *prasādam*\",\"sep\":\" \"},{\"text\":\"korena\",\"trans\":\"hizo\",\"sep\":\" \"},{\"text\":\"bhojana\",\"trans\":\"comiendo\",\"sep\":\"\"}],[{\"text\":\"khāite khāite\",\"trans\":\"comer y comer\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"tā’ra\",\"trans\":\"de eso\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"āilo\",\"trans\":\"estaba\",\"sep\":\" \"},{\"text\":\"prema\",\"trans\":\"amor divino\",\"sep\":\" \"},{\"text\":\"sudurbāra\",\"trans\":\"irresistible\",\"sep\":\",\"}],[{\"text\":\"bole\",\"trans\":\"por el poder\",\"sep\":\", \"},{\"text\":\"śuno\",\"trans\":\"escuchen\",\"sep\":\" \"},{\"text\":\"sannyāsīra gaṇa\",\"trans\":\"al grupo de *sannyāsīs*\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"4\",\"text\":[\"mochā-ghanṭa phula-baḍi,    dāli-dālnā-chacchaḍi,\",\"        śachī-mātā korilo randhana\",\"tā’ra śuddhā bhakti heri’,    bhojana korilo hari,\",\"        sudhā-sama e anna-byañjana\"],\"word_by_word\":[\"**mochā-ghanṭa** — flores de banana; **phula-baḍi** — pastel de *dāl*; **dāli** — cesta de frutas; **dālnā** — salsa gustosa; **chacchaḍi** — vegetales picantes; **śachī-mātā** — Madre Śachī; **korilo** — hizo; **randhana** — cocinando; **tā’ra** — de eso; **śuddhā bhakti** — devoción pura; **heri’** — viendo; **bhojana** — comer; **korilo** — hizo; **hari** — el Señor Hari; **sudhā-sama** — como el néctar; **e anna** — este arroz; **byañjana** — y vegetales.\"],\"translation\":[\"“Madre Śachī había cocinado muchas variedades de *prasādam*, tales como delicias semisólidas hechas con flor de banano, una preparación especial de *dāhl*, cestas de frutas, pequeños pasteles cuadrados hechos de lentejas y leche cocida, entre otros. Al ver su devoción pura, El Señor Kṛṣṇa comió personalmente todas estas preparaciones, las cuales eran tal como el néctar”.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"mochā-ghanṭa\",\"trans\":\"flores de banana\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"phula-baḍi\",\"trans\":\"pastel de *dāl*\",\"sep\":\",    \",\"error\":\"multi\"},{\"text\":\"dāli\",\"trans\":\"cesta de frutas\",\"sep\":\"-\"},{\"text\":\"dālnā\",\"trans\":\"salsa gustosa\",\"sep\":\"-\"},{\"text\":\"chacchaḍi\",\"trans\":\"vegetales picantes\",\"sep\":\",\"}],[{\"text\":\"śachī-mātā\",\"trans\":\"Madre Śachī\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"korilo\",\"trans\":\"hizo\",\"sep\":\" \"},{\"text\":\"randhana\",\"trans\":\"cocinando\",\"sep\":\"\"}],[{\"text\":\"tā’ra\",\"trans\":\"de eso\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"śuddhā bhakti\",\"trans\":\"devoción pura\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"heri\",\"trans\":\"viendo\",\"sep\":\"’,    \"},{\"text\":\"bhojana\",\"trans\":\"comer\",\"sep\":\" \"},{\"text\":\"korilo\",\"trans\":\"hizo\",\"sep\":\" \"},{\"text\":\"hari\",\"trans\":\"el Señor Hari\",\"sep\":\",\"}],[{\"text\":\"sudhā-sama\",\"trans\":\"como el néctar\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"e anna\",\"trans\":\"este arroz\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"byañjana\",\"trans\":\"y vegetales\",\"sep\":\"\"}]]},{\"number\":\"5\",\"text\":[\"yoge yogī pāya jāhā,        bhoge āja ha’be tāhā,\",\"        ‘hari’ boli’ khāo sabe bhāi\",\"kṛṣṇera prasād-anna,        tri-jagat kore dhanya,\",\"        tripurāri nāche jāhā pāi’\"],\"word_by_word\":[\"**yoge** — por el *yoga*; **yogī** — el *yogī*; **pāya** — obtiene; **jāhā** — aquel; **bhoge** — por comer; **āja** — ahora; **ha’be** — será; **tāhā** — de eso; **‘hari’ boli’** — cantando Hari; **khāo** — por favor come; **sabe** — todos; **bhāi** — hermanos; **kṛṣṇera** — de Kṛṣṇa; **prasād-anna** — el alimento *prasādam*; **tri-jagat** — los tres mundos; **kore** — hace; **dhanya** — gloria; **tripurāri** — el Señor Śiva; **nāche** — danza; **jāhā** — lo cual; **pāi’** — obtiene.\"],\"translation\":[\"Lo que los *yogīs* obtienen practicando *yoga*, hoy se obtiene comiendo. ¡Oh hermanos míos! Por favor canten ‘Hari’ y coman Kṛṣṇa-prasādam. Los tres mundos glorifican el Kṛṣṇa-prasādam. Cuando lo obtiene, el Señor Śiva danza.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"yoge\",\"trans\":\"por el *yoga*\",\"sep\":\" \"},{\"text\":\"yogī\",\"trans\":\"el *yogī*\",\"sep\":\" \"},{\"text\":\"pāya\",\"trans\":\"obtiene\",\"sep\":\" \"},{\"text\":\"jāhā\",\"trans\":\"aquel\",\"sep\":\",        \"},{\"text\":\"bhoge\",\"trans\":\"por comer\",\"sep\":\" \"},{\"text\":\"āja\",\"trans\":\"ahora\",\"sep\":\" \"},{\"text\":\"ha’be\",\"trans\":\"será\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"tāhā\",\"trans\":\"de eso\",\"sep\":\",\"}],[{
