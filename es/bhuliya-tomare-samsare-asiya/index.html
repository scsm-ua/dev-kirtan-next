jaṭhare,        chhilāma yakhana,\",\"        viṣama bandhana-pāśe\",\"eka-bāra prabhu!    dekhā diyā more,\",\"        vañchile e dīna dāse\"],\"word_by_word\":[\"**jananī** — de mi madre; **jaṭhare** — en el vientre; **chhilāma** — estaba; **yakhana** — cuando; **viṣama** — terrible; **bandhana** — atado; **pāśe** — con las cuerdas; **eka** — una; **bāra** — momento; **prabhu!** — ¡oh Señor!; **dekha** — vista; **diyā** — dando; **more** — a mí; **vañchile** — privado; **e** — este; **dīna** — pobre; **dāse** — a este sirviente.\"],\"translation\":[\"Mientras estaba atado en los terribles confines del vientre de mi madre, ¡Tú una vez te revelaste a mí, Señor! Sin embargo, desde entonces has privado a este pobre sirviente.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"jananī\",\"trans\":\"de mi madre\",\"sep\":\"-\"},{\"text\":\"jaṭhare\",\"trans\":\"en el vientre\",\"sep\":\",        \"},{\"text\":\"chhilāma\",\"trans\":\"estaba\",\"sep\":\" \"},{\"text\":\"yakhana\",\"trans\":\"cuando\",\"sep\":\",\"}],[{\"text\":\"viṣama\",\"trans\":\"terrible\",\"sep\":\" \"},{\"text\":\"bandhana\",\"trans\":\"atado\",\"sep\":\"-\"},{\"text\":\"pāśe\",\"trans\":\"con las cuerdas\",\"sep\":\"\"}],[{\"text\":\"eka\",\"trans\":\"una\",\"sep\":\"-\"},{\"text\":\"bāra\",\"trans\":\"momento\",\"sep\":\" \"},{\"text\":\"prabhu\",\"trans\":\"¡oh Señor!\",\"sep\":\"!    \"},{\"text\":\"dekhā\",\"trans\":\"vista\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"diyā\",\"trans\":\"dando\",\"sep\":\" \"},{\"text\":\"more\",\"trans\":\"a mí\",\"sep\":\",\"}],[{\"text\":\"vañchile\",\"trans\":\"privado\",\"sep\":\" \"},{\"text\":\"e\",\"trans\":\"este\",\"sep\":\" \"},{\"text\":\"dīna\",\"trans\":\"pobre\",\"sep\":\" \"},{\"text\":\"dāse\",\"trans\":\"a este sirviente\",\"sep\":\"\"}]]},{\"number\":\"3\",\"text\":[\"takhana bhāvinu,    janama pāiyā,\",\"        kariba bhajana tava\",\"janama ha-ila,        paḍi’ māyā-jāle,\",\"        nā ha-ila jñāna-lava\"],\"word_by_word\":[\"**takhana** — entonces; **bhāvinu** — pensé; **janama** — nacimiento; **pāiyā** — obteniendo; **kariba** — haría; **bhajana** — servicio; **tava** — Tu; **janama** — nacimiento; **ha-ila** — ocurrió; **paḍi’** — cayendo; **māyā** — de *m**āyā*; **jāle** — en la red (trampa); **nā** — no; **ha-ila** — se volvió; **jñāna** — del conocimiento; **lava** — una fracción.\"],\"translation\":[\"En ese momento pensé que me ocuparía en Tu servicio después de nacer. Sin embargo, cuando nací, caí en la trampa de māyā, y no quedó ni un rastro de tal conciencia.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"takhana\",\"trans\":\"entonces\",\"sep\":\" \"},{\"text\":\"bhāvinu\",\"trans\":\"pensé\",\"sep\":\",    \"},{\"text\":\"janama\",\"trans\":\"nacimiento\",\"sep\":\" \"},{\"text\":\"pāiyā\",\"trans\":\"obteniendo\",\"sep\":\",\"}],[{\"text\":\"kariba\",\"trans\":\"haría\",\"sep\":\" \"},{\"text\":\"bhajana\",\"trans\":\"servicio\",\"sep\":\" \"},{\"text\":\"tava\",\"trans\":\"Tu\",\"sep\":\"\"}],[{\"text\":\"janama\",\"trans\":\"nacimiento\",\"sep\":\" \"},{\"text\":\"ha-ila\",\"trans\":\"ocurrió\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"paḍi\",\"trans\":\"cayendo\",\"sep\":\"’ \"},{\"text\":\"māyā\",\"trans\":\"de *m\",\"sep\":\"-\"},{\"text\":\"jāle\",\"trans\":\"en la red (trampa)\",\"sep\":\",\"}],[{\"text\":\"nā\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"ha-ila\",\"trans\":\"se volvió\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"jñāna\",\"trans\":\"del conocimiento\",\"sep\":\"-\"},{\"text\":\"lava\",\"trans\":\"una fracción\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"ādarera chhele,        svajanera kole,\",\"        hāsiyā kāṭānu kāla\",\"janaka-jananī-        snehete bhuliyā,\",\"        saṁsāra lāgila bhāla\"],\"word_by_word\":[\"**ādarera** — adorando a los padres; **chhele** — un hijo; **svajanera** — de parientes; **kole** — en el regazo; **hāsiyā** — sonriendo; **kāṭānu** — pasé; **kāla** — tiempo; **janaka** — de mi padre; **jananī** — de mi madre; **snehete** — debido al afecto; **bhuliyā** — olvidando; **saṁsāra** — vida familiar, el mundo material; **lāgila** — sentí; **bhāla** — bien.\"],\"translation\":[\"Como un hijo adorado por sus padres, pasé mi tiempo en sus regazos, sonriendo y riendo. Debido al afecto de mi madre y padre, te olvidé y tuve placer en la vida familiar (la existencia material).\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"ādarera\",\"trans\":\"adorando a los padres\",\"sep\":\" \"},{\"text\":\"chhele\",\"trans\":\"un hijo\",\"sep\":\",        \"},{\"text\":\"svajanera\",\"trans\":\"de parientes\",\"sep\":\" \"},{\"text\":\"kole\",\"trans\":\"en el regazo\",\"sep\":\",\"}],[{\"text\":\"hāsiyā\",\"trans\":\"sonriendo\",\"sep\":\" \"},{\"text\":\"kāṭānu\",\"trans\":\"pasé\",\"sep\":\" \"},{\"text\":\"kāla\",\"trans\":\"tiempo\",\"sep\":\"\"}],[{\"text\":\"janaka\",\"trans\":\"de mi padre\",\"sep\":\"-\"},{\"text\":\"jananī\",\"trans\":\"de mi madre\",\"sep\":\"-        \"},{\"text\":\"snehete\",\"trans\":\"debido al afecto\",\"sep\":\" \"},{\"text\":\"bhuliyā\",\"trans\":\"olvidando\",\"sep\":\",\"}],[{\"text\":\"saṁsāra\",\"trans\":\"vida familiar, el mundo material\",\"sep\":\" \"},{\"text\":\"lāgila\",\"trans\":\"sentí\",\"sep\":\" \"},{\"text\":\"bhāla\",\"trans\":\"bien\",\"sep\":\"\"}]]},{\"number\":\"5\",\"text\":[\"krame dina dina,    bālaka ha-iyā,\",\"        khelinu bālaka saha\",\"āra kichhu-dine,        jñāna upajila,\",\"        pāṭha paḍi ahar-ahaḥ\"],\"word_by_word\":[\"**krame** — gradualmente; **dina** — día; **dina** — día; **bālaka** — un niño; **ha-iyā** — volviéndose; **khelinu** — jugué; **bālaka** — niños; **saha** — con; **āra** — más; **kichhu** — algo; **dine** — tras día; **jñāna** — facultad de conocimiento; **upajila** — surgió; **pāṭha** — lecciones; **paḍi** — estudié; **ahar-ahaḥ** — día tras día (todo el tiempo).\"],\"translation\":[\"Día a día me convertí en un niño y jugué con otros chicos jóvenes. Más tarde mi intelecto se desarrolló, y estudié mis lecciones día tras día.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"krame\",\"trans\":\"gradualmente\",\"sep\":\" \"},{\"text\":\"dina\",\"trans\":\"día\",\"sep\":\" \"},{\"text\":\"dina\",\"trans\":\"día\",\"sep\":\",    \"},{\"text\":\"bālaka\",\"trans\":\"un niño\",\"sep\":\" \"},{\"text\":\"ha-iyā\",\"trans\":\"volviéndose\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"khelinu\",\"trans\":\"jugué\",\"sep\":\" \"},{\"text\":\"bālaka\",\"trans\":\"niños\",\"sep\":\" \"},{\"text\":\"saha\",\"trans\":\"con\",\"sep\":\"\"}],[{\"text\":\"āra\",\"trans\":\"más\",\"sep\":\" \"},{\"text\":\"kichhu\",\"trans\":\"algo\",\"sep\":\"-\"},{\"text\":\"dine\",\"trans\":\"tras día\",\"sep\":\",        \"},{\"text\":\"jñāna\",\"trans\":\"facultad de conocimiento\",\"sep\":\" \"},{\"text\":\"upajila\",\"trans\":\"surgió\",\"sep\":\",\"}],[{\"text\":\"pāṭha\",\"trans\":\"lecciones\",\"sep\":\" \"},{\"text\":\"paḍi\",\"trans\":\"estudié\",\"sep\":\" \"},{\"text\":\"ahar-ahaḥ\",\"trans\":\"día tras día (todo el tiempo)\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"6\",\"text\":[\"vidyāra gaurave,        bhrami’ deśe deśe,\",\"        dhana upārjana kari’\",\"svajana-pālana,        kari eka-mane,\",\"        bhulinu tomāre hari!\"],\"word_by_word\":[\"**vidyāra** — aprendizaje; **gaurave** — por la fuerza; **bhrami’** — viajar; **deśe** — en un país; **deśe** — en (otro) país; **dhana** — riqueza; **upārjana** — ganancia; **kari’** — hacer; **svajana** — parientes; **pālana** — mantener; **kari** — hago; **eka** — único; **mane** — con una mente; **bhulinu** — olvidé; **tomāre** — acerca de Tí; **hari!** — ¡oh Señor!\"],\"translation\":[\"Luego, por la fuerza de mi aprendizaje, viajé de un lugar a otro, gané dinero y mantuve a mi familia con íntegra atención. ¡Te olvidé, Señor!\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"vidyāra\",\"trans\":\"aprendizaje\",\"sep\":\" \"},{\"text\":\"gaurave\",\"trans\":\"por la fuerza\",\"sep\":\",        \"},{\"text\":\"bhrami\",\"trans\":\"viajar\",\"sep\":\"’ \"},{\"text\":\"deśe\",\"trans\":\"en un país\",\"sep\":\" \"},{\"text\":\"deśe\",\"trans\":\"en (otro) país\",\"sep\":\",\"}],[{\"text\":\"dhana\",\"trans\":\"riqueza\",\"sep\":\" \"},{\"text\":\"upārjana\",\"trans\":\"ganancia\",\"sep\":\" \"},{\"text\":\"kari\",\"trans\":\"hacer\",\"sep\":\"’\"}],[{\"text\":\"svajana\",\"trans\":\"parientes\",\"sep\":\"-\"},{\"text\":\"pālana\",\"trans\":\"mantener\",\"sep\":\",        \"},{\"text\":\"kari\",\"trans\":\"hago\",\"sep\":\" \"},{\"text\":\"eka\",\"trans\":\"único\",\"sep\":\"-\"},{\"text\":\"mane\",\"trans\":\"con una mente\",\"sep\":\",\"}],[{\"text\":\"bhulinu\",\"trans\":\"olvidé\",\"sep\":\" \"},{\"text\":\"tomāre\",\"trans\":\"acerca de Tí\",\"sep\":\" \"},{\"text\":\"hari\",\"trans\":\"¡oh Señor!\",\"sep\":\"!\"}]]},{\"number\":\"7\",\"text\":[\"vārddhakye ekhana,    bhakati-vinoda,\",\"        kā̐diyā kātara ati\",\"nā bhajiyā tore,        dina vṛthā gelo\",\"        ekhon ki ho’be gati!\"],\"word_by_word\":[\"**vārddhakye** — en la vejez; **ekhana** — ahora; **bhakati-vinoda** — Bhakti Vinod; **kāndiyā** — llorando; **kātara** — angustiado; **ati** — muy; **nā** — no; **bhajiyā** — servir; **tore** — a Tí; **dina** — días; **vṛthā** — vano; **gela** — pasados; **ekhana** — ahora; **ki** — ¿qué?; **habe** — será; **gati** — destino.\"],\"translation\":[\"Ahora anciano, Bhakti Vinod llora con gran angustia, “sin servirte, he pasado mis días en vano. ¿Cuál será mi destino ahora?”\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"vārddhakye\",\"trans\":\"en la vejez\",\"sep\":\" \"},{\"text\":\"ekhana\",\"trans\":\"ahora\",\"sep\":\",    \"},{\"text\":\"bhakati-vinoda\",\"trans\":\"Bhakti Vinod\",\"sep\":\",\",\"err
