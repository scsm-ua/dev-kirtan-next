t\":\"tā’ra\",\"trans\":\"de él\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"kṛṣṇa-daraśana\",\"trans\":\"la visión del Señor Kṛṣṇa\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"jā’ra\",\"trans\":\"de quien\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"bhāgye\",\"trans\":\"buena fortuna\",\"sep\":\" \"},{\"text\":\"hoiyāche\",\"trans\":\"se vuelve\",\"sep\":\" \"},{\"text\":\"eka-bāra\",\"trans\":\"una vez\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"bikaśiyā\",\"trans\":\"manifestar\",\"sep\":\" \"},{\"text\":\"hrin-nayana\",\"trans\":\"en los ojos del corazón\",\"sep\":\"        \",\"error\":\"multi\"},{\"text\":\"kori\",\"trans\":\"hacer\",\"sep\":\"’ \"},{\"text\":\"kṛṣṇa daraśana\",\"trans\":\"la visión del Señor Kṛṣṇa\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"chāḍe\",\"trans\":\"abandonar\",\"sep\":\" \"},{\"text\":\"jīva\",\"trans\":\"el alma\",\"sep\":\" \"},{\"text\":\"chittera\",\"trans\":\"del corazón\",\"sep\":\" \"},{\"text\":\"bikāra\",\"trans\":\"concepciones materiales\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"        vṛndāvana-keli chatur vanamālī\",\"tribhaṅga-bhaṅgimārūpa    vaṁśī-dharī aparūpa\",\"        rasamoya nidhi, guṇa-śālī\"],\"word_by_word\":[\"**vṛndāvana-keli** — pasatiempos de Vṛndāvan; **chatur** — experto; **vanamālī** — llevando una guirnalda del bosque; **tribhaṅga-bhaṅgimā-rūpa** — forma triplemente curvada; **vaṁśī-dharī** — sostiene una flauta; **aparūpa** — maravilloso; **rasamoya nidhi** — océano de néctar; **guṇa-śālī** — pleno de cualidades trascendentales.\"],\"translation\":[\"Uno ve allí a Kṛṣṇa completamente decorado con guirnaldas de flores silvestres y como el más experto conocedor de todos los cariñosos juegos de amor en Vṛndāvan. Su trascendental forma curvada en tres partes de Su cuerpo, tocando maravillosamente Su flauta. Él es la fuente de todas las melosidades deleitables y la morada de todas las cualidades virtuosas.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"vṛndāvana-keli\",\"trans\":\"pasatiempos de Vṛndāvan\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"chatur\",\"trans\":\"experto\",\"sep\":\" \"},{\"text\":\"vanamālī\",\"trans\":\"llevando una guirnalda del bosque\",\"sep\":\"\"}],[{\"text\":\"tribhaṅga-bhaṅgimārūpa    vaṁśī\",\"trans\":\"forma triplemente curvada\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"dharī aparūpa\",\"trans\":\"sostiene una flauta\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"rasamoya\",\"trans\":\"maravilloso\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nidhi, guṇa\",\"trans\":\"océano de néctar\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"śālī\",\"trans\":\"pleno de cualidades trascendentales\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"3\",\"text\":[\"varṇa nava jaladhara        śire śikhi picha vara\",\"        alakā tilaka śobhā pāya\",\"paridhāne pīta-vāsa        vadane madhūra hāsa\",\"        heno rūpa jagata mātāya\"],\"word_by_word\":[\"**varṇa nava jaladhara** — el color de una nube nueva; **śire** — en su cabeza; **śikhi picha vara** — una graciosa pluma de pavoreal; **alakā** — pelo rizado; **tilaka** — *tilaka*; **śobhā** — belleza; **pāya** — obtener; **paridhāne** — vistiendo; **pīta-vāsa** — ropas amarillas; **vadane** — en su boca; **madhūra hāsa** — sonrisa dulce; **heno** — tal como; **rūpa** — forma; **jagata** — el mundo; **mātāya** — enloquecido.\"],\"translation\":[\"Mediante esa forma maravillosa enloquece al universo entero. Su tez es como la de una nueva y fresca nube de lluvia, Su cabeza está adornada con una gran pluma de pavoreal, y el *tilaka* de sándalo en Su frente le sienta muy bien. Usa brillantes ropas de un color amarillo y está de pie, con Su cara decorada con una amplia y dulce sonrisa.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"varṇa nava jaladhara\",\"trans\":\"el color de una nube nueva\",\"sep\":\"        \",\"error\":\"multi\"},{\"text\":\"śire\",\"trans\":\"en su cabeza\",\"sep\":\" \"},{\"text\":\"śikhi picha vara\",\"trans\":\"una graciosa pluma de pavoreal\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"alakā\",\"trans\":\"pelo rizado\",\"sep\":\" \"},{\"text\":\"tilaka\",\"trans\":\"*tilaka*\",\"sep\":\" \"},{\"text\":\"śobhā\",\"trans\":\"belleza\",\"sep\":\" \"},{\"text\":\"pāya\",\"trans\":\"obtener\",\"sep\":\"\"}],[{\"text\":\"paridhāne\",\"trans\":\"vistiendo\",\"sep\":\" \"},{\"text\":\"pīta-vāsa\",\"trans\":\"ropas amarillas\",\"sep\":\"        \",\"error\":\"multi\"},{\"text\":\"vadane\",\"trans\":\"en su boca\",\"sep\":\" \"},{\"text\":\"madhūra hāsa\",\"trans\":\"sonrisa dulce\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"heno\",\"trans\":\"tal como\",\"sep\":\" \"},{\"text\":\"rūpa\",\"trans\":\"forma\",\"sep\":\" \"},{\"text\":\"jagata\",\"trans\":\"el mundo\",\"sep\":\" \"},{\"text\":\"mātāya\",\"trans\":\"enloquecido\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"indranīla jini        kṛṣṇa-rūpakhāni\",\"        heriyā kadamba-mule\",\"mana uchāṭana        na chole charaṇa\",\"        saṁsāra gelāma bhūle\"],\"word_by_word\":[\"**indranīla** — zafiro; **jini** — vencer; **kṛṣṇa-rūpa-khāni** — la mina de hermosura de Kṛṣṇa; **heriyā** — viendo; **kadamba-mule** — a la raiz del *kadamba*; **mana** — corazón; **uchāṭana** — ansiedad; **na chole** — sin trucos; **charaṇa** — a los pies; **saṁsāra** — mundo material; **gelāma** — ir; **bhūle** — olvidar.\"],\"translation\":[\"Cuando lo contemplo, parado al pie de un árbol *kadamba*, puedo ver que la belleza de Kṛṣṇa vence el brillo de una mina entera de zafiros. Al verlo, mi mente se ha tornado tan inquieta que mis pies ya no se pueden mover, y me he olvidado por completo de mi hogar y mi vida familiar en este mundo.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"indranīla\",\"trans\":\"zafiro\",\"sep\":\" \"},{\"text\":\"jini\",\"trans\":\"vencer\",\"sep\":\"        \"},{\"text\":\"kṛṣṇa-rūpakhāni\",\"trans\":\"la mina de hermosura de Kṛṣṇa\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"heriyā\",\"trans\":\"viendo\",\"sep\":\" \"},{\"text\":\"kadamba-mule\",\"trans\":\"a la raiz del *kadamba*\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"mana\",\"trans\":\"corazón\",\"sep\":\" \"},{\"text\":\"uchāṭana\",\"trans\":\"ansiedad\",\"sep\":\"        \"},{\"text\":\"na chole\",\"trans\":\"sin trucos\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"charaṇa\",\"trans\":\"a los pies\",\"sep\":\"\"}],[{\"text\":\"saṁsāra\",\"trans\":\"mundo material\",\"sep\":\" \"},{\"text\":\"gelāma\",\"trans\":\"ir\",\"sep\":\" \"},{\"text\":\"bhūle\",\"trans\":\"olvidar\",\"sep\":\"\"}]]},{\"number\":\"5\",\"text\":[\"(sakhī he) sudhāmoya se rūpa-mādhurī\",\"    dekhile nayana,         hoya achetana,\",\"        jhore premamoya bāri\"],\"word_by_word\":[\"(**sakhī he)** — ¡oh *sakhī*!; **sudhāmoya** — pleno de néctar; **se** — esta; **rūpa-mādhurī** — forma de dulzura; **dekhile** — al ver; **nayana** — ojos; **hoya** — es; **achetana** — inconsciente; **jhore** — fluye; **premamoya** — pleno de amor; **bāri** — lágrimas.\"],\"translation\":[\"¡Oh, *sakhī*! ¡Oh, querida amiga! Viendo esa dulce forma abundante en néctar he caído inconsciente, mientras una fuente de lágrimas brotando con amor extático surge como cascada de mis ojos.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"(sakhī he\",\"trans\":\"¡oh *sakhī*!\",\"sep\":\") \",\"error\":\"multi\"},{\"text\":\"sudhāmoya\",\"trans\":\"pleno de néctar\",\"sep\":\" \"},{\"text\":\"se\",\"trans\":\"esta\",\"sep\":\" \"},{\"text\":\"rūpa-mādhurī\",\"trans\":\"forma de dulzura\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"dekhile\",\"trans\":\"al ver\",\"sep\":\" \"},{\"text\":\"nayana\",\"trans\":\"ojos\",\"sep\":\",         \"},{\"text\":\"hoya\",\"trans\":\"es\",\"sep\":\" \"},{\"text\":\"achetana\",\"trans\":\"inconsciente\",\"sep\":\",\"}],[{\"text\":\"jhore\",\"trans\":\"fluye\",\"sep\":\" \"},{\"text\":\"premamoya\",\"trans\":\"pleno de amor\",\"sep\":\" \"},{\"text\":\"bāri\",\"trans\":\"lágrimas\",\"sep\":\"\"}]]},{\"number\":\"6\",\"text\":[\"kibā chūḍā śire        kibā vaṁśī kore\",\"        kibā se tribhaṅga-ṭhāma\",\"charaṇa-kamale,        amiyā uchole,\",\"        tāhāte nūpura dāma\"],\"word_by_word\":[\"**kibā** — cuan glorioso; **chūḍā** — la corona; **śire** — en su cabeza; **kibā** — cuan glorioso; **vaṁśī kore** — lleva la flauta; **kibā** — cuan gloriosa; **se tribhaṅga-ṭhāma** — esa forma curvada en tres partes; **charaṇa-kamale** — en sus pies de loto; **amiyā** — néctar; **uchole** — inunda; **tāhāte** — allí; **nūpura** — tobilleras; **dāma** — cuerda.\"],\"translation\":[\"¡Qué maravillosa corona lleva sobre Su cabeza! ¡Qué maravillosa flauta sostiene en Sus manos! ¡Qué maravillosamente hermosa es Su forma cuando está de pie con Su postura curvada en tres partes de Su cuerpo! El néctar de Sus pies de loto está derramándose junto con el sonido tintineante del racimo de campanitas de las ajorcas que adornan Sus pies de loto.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"kibā\",\"trans\":\"cuan glorioso\",\"sep\":\" \"},{\"text\":\"chūḍā\",\"trans\":\"la corona\",\"sep\":\" \"},{\"text\":\"śire\",\"trans\":\"en su cabeza\",\"sep\":\"        \"},{\"text\":\"kibā\",\"trans\":\"cuan glorioso\",\"sep\":\" \"},{\"text\":\"vaṁśī kore\",\"trans\":\"lleva la flauta\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"kibā\",\"trans\":\"cuan gloriosa\",\"sep\":\" \"},{\"text\":\"se tribhaṅga-ṭhāma\",\"trans\":\"esa forma curvada en tres partes\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"charaṇa-kamale\",\"trans\":\"en sus pies de loto\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"amiyā\",\"trans\":\"néctar\",\"sep\":\" \"},{\"text\":\"uchole\",\"trans\":\"inunda\",\"sep\":\",\"}],[{\"text\":\"tāhāte\",\"trans\":\"allí\",\"sep\":\" \"},{\"text\":\"nūpura\",\"trans\":\"tobilleras\",\"sep\":\" \"},{\"text\":\"dāma\",\"trans\":\"cuerda\",\"sep\":\"\"}]]},{\"number\":\"7\",\"text\":[\"sadā āśā kori        bhṛṅga-rūpa dhori\",\"        charaṇa kamale sthāna\",\"anāyāse pāi        kṛṣṇa-guṇa gāi\",\"        āro nā bhajibo āna\"],\"word_by_word\":[\"**sadā** — siempre; **āśā** — yo deseo; **kori** — hago; **bhṛṅga-rūpa** — la forma de una abeja; **dhori** — sostener; **charaṇa kamale** — a los pies de loto; **sthāna** — lugar; **anāyāse** — fácilmente; **pāi** — obtengo; **kṛṣṇa-guṇa** — las glorias de Śrī Kṛṣṇa; **gāi** — canto; **āro nā** — nada más; **bhajibo** — adoración; **āna** — otro.\"],\"translation\":[\"Aceptando la forma de una abeja, anhelo siempre residir cerca de Sus pies de loto. Y lo conseguiré muy fácilmente debido a que canto siempre las glorias de este Kṛṣṇa, sin adorar a nadie más.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"sadā\",\"trans\":\"siempre\",\"sep\":\" \"},{\"text\":\"āśā\",\"trans\":\"yo deseo\",\"sep\":\" \"},{\"text\":\"kori\",\"trans\":\"hago\",\"sep\":\"        \"},{\"text\":\"bhṛṅga-rūpa\",\"trans\":\"la forma de una abeja\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"dhori\",\"trans\":\"sostener\",\"sep\":\"\"}],[{\"text\":\"charaṇa kamale\",\"trans\":\"a los pies de loto\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"sthāna\",\"trans\":\"lugar\",\"sep\":\"\"}],[{\"text\":\"anāyāse\",\"trans\":\"fácilmente\",\"sep\":\" \"},{\"text\":\"pāi\",\"trans\":\"obtengo\",\"sep\":\"        \"},{\"text\":\"kṛṣṇa-guṇa\",\"trans\":\"las glorias de Śrī Kṛṣṇa\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"gāi\",\"trans\":\"canto\",\"sep\":\"\"}],[{\"text\":\"āro nā\",\"trans\":\"nada más\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"bhajibo\",\"trans\":\"adoración\",\"sep\":\" \"},{\"text\":\"āna\",\"trans\":\"otro\",\"sep\":\"\"}]]}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},
