na** — el mundo; **maṅgala** — auspicioso; **nitāi-chaitanya** — Nitāi y Chaitanya; **deva** — señores; **sevā** — servicio; **sama-ujjvala** — igual de radiante.\"],\"translation\":[\"Mediante Su misericordia, Śrī Śrī Nitāi-Chaitanyadev se han manifestado en Purī Dhām dispensando lo auspicioso sobre todo el mundo y revelando que radiante es el servicio devocional a Ellos.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"prakāśile\",\"trans\":\"manifestado, revelado\",\"sep\":\" \"},{\"text\":\"nīlāchale\",\"trans\":\"en Nīlāchal (Purī Dhām)\",\"sep\":\" \"},{\"text\":\"bhuvana\",\"trans\":\"el mundo\",\"sep\":\"-\"},{\"text\":\"maṅgala\",\"trans\":\"auspicioso\",\"sep\":\"\"}],[{\"text\":\"nitāi-chaitanya\",\"trans\":\"Nitāi y Chaitanya\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"deva\",\"trans\":\"señores\",\"sep\":\"-\"},{\"text\":\"sevā\",\"trans\":\"servicio\",\"sep\":\" \"},{\"text\":\"samujjvala\",\"trans\":\"igual de radiante\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"3\",\"text\":[\"gorāpreme mātoyārā nityānanda-rūpa\",\"rasarāja mahābhāva chaitanya-svarūpa\"],\"word_by_word\":[\"**gorā-preme** — amor divino por Gaura; **mātoyārā** — enloquece; **nityānanda-rūpa** — la forma de Nityānanda; **rasa-rāja** — el rey de las melosidades (Kṛṣṇa); **mahābhāva** — éxtasis trascendental (Rādhārāṇī); **chaitanya-svarūpa** — la forma no diferente de Chaitanya.\"],\"translation\":[\"La forma de Śrī Nityānanda Prabhu baila extáticamente embriagada del amor divino por Śrī Gaura, cuya manifestación es la de Rasarāj Śrī Kṛṣṇa, llevando el corazón y el halo de Mahābhāva, Śrīmatī Rādhārāṇī.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gorāpreme mātoyārā\",\"trans\":\"amor divino por Gaura\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nityānanda\",\"trans\":\"enloquece\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"rūpa\",\"trans\":\"la forma de Nityānanda\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"rasarāja mahābhāva\",\"trans\":\"el rey de las melosidades (Kṛṣṇa)\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"chaitanya\",\"trans\":\"éxtasis trascendental (Rādhārāṇī)\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"svarūpa\",\"trans\":\"la forma no diferente de Chaitanya\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"4\",\"text\":[\"kasita-kāñchana jini śrī-aṅga lābaṇi\",\"dū̐hū̐gale vanamālā bhāvera dolanī\"],\"word_by_word\":[\"**kasita** — brillo; **kāñchana** — hecho de oro; **jini** — quienes; **śrī-aṅga** — sus adorables cuerpos; **lābaṇi** — elegante; **dū̐hū̐gale** — en Sus cuellos; **vana-mālā** — guirnalda del bosque; **bhāvera** — de éxtasis; **dolanī** — mecerse.\"],\"translation\":[\"Ambos Señores se encuentran de pie, completamente resplandecientes, y brillan como el oro natural, mientras guirnaldas con diversas hermosas flores del bosque se mecen en Sus cuellos.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"kasita\",\"trans\":\"brillo\",\"sep\":\"-\"},{\"text\":\"kāñchana\",\"trans\":\"hecho de oro\",\"sep\":\" \"},{\"text\":\"jini\",\"trans\":\"quienes\",\"sep\":\" \"},{\"text\":\"śrī-aṅga\",\"trans\":\"sus adorables cuerpos\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"lābaṇi\",\"trans\":\"elegante\",\"sep\":\"\"}],[{\"text\":\"dū̐hū̐gale\",\"trans\":\"en Sus cuellos\",\"sep\":\" \"},{\"text\":\"vanamālā bhāvera\",\"trans\":\"guirnalda del bosque\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"dolanī\",\"trans\":\"de éxtasis\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"5\",\"text\":[\"murachita koṭīkāma rūparāsaraṅge\",\"madhūra narttana-bhāva varābhaya bhaṅge\"],\"word_by_word\":[\"**murachita** — desmayarse; **koṭī** — millones; **kāma** — de Cupido; **rūpa-rāsa-raṅge** — una forma de melosidad y muy colorida; **madhūra** — de la dulzura; **narttana** — danzando; **bhāva** — éxtasis; **varābhaya** — generosidad; **bhaṅge** — conmueve.\"],\"translation\":[\"Millones y millones de cupidos caen inconscientes ante los divinos pies de Sus Señorías al contemplar Su belleza y Sus divinas formas, que juguetonamente se balancean de aquí para allá. Ellos bailan, conmoviendo los corazones de todos y derramando liberalmente Su misericordia sobre las almas condicionadas.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"murachita\",\"trans\":\"desmayarse\",\"sep\":\" \"},{\"text\":\"koṭīkāma\",\"trans\":\"millones\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"rūparāsaraṅge\",\"trans\":\"de Cupido\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"madhūra narttana-bhāva\",\"trans\":\"una forma de melosidad y muy colorida\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"varābhaya\",\"trans\":\"de la dulzura\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bhaṅge\",\"trans\":\"danzando\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"6\",\"text\":[\"koṭi-chandra-bhānuśobhā ratna-siṁhāsane\",\"prema netre dekhe mahā-bhāgyavāna jane\"],\"word_by_word\":[\"**koṭi-chandra** — millones de lunas; **bhānu** — un rayo; **śobhā** — esplendor; **ratna** — joya; **siṁhāsane** — en el trono; **prema** — amor divino; **netre** — de ojos; **dekhe** — ven; **mahā-bhāgyavāna** — muy afortunado; **jane** — de personas.\"],\"translation\":[\"Brillantes como millones de lunas, se yerguen radiantes sobre Su trono enjoyado. Las almas afortunadas, con ojos devocionales llenos de amor y afecto, pueden ver Sus formas divinas.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"koṭi-chandra\",\"trans\":\"millones de lunas\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"bhānuśobhā\",\"trans\":\"un rayo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"ratna\",\"trans\":\"esplendor\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"siṁhāsane\",\"trans\":\"joya\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"prema\",\"trans\":\"en el trono\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"netre\",\"trans\":\"amor divino\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"dekhe\",\"trans\":\"de ojos\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"mahā\",\"trans\":\"ven\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"bhāgyavāna jane\",\"trans\":\"muy afortunado\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"7\",\"text\":[\"mṛdaṅga mandirā bāje suśaṅkha-dhvanita\",\"śruti-mauli-ratnamālā-dīpa-nirājita\"],\"word_by_word\":[\"**mṛdaṅga** — el tambor *mṛdaṅga*; (**mṛda** — arcilla; **aṅga** — cuerpo); **mandirā** — el templo; **bāje** — suena; **su-śaṅkha** — la gloriosa caracola; **dhvanita** — el sonido; **śruti** — las escrituras; **mauli** — guirnaldas; **ratna-mālā** — collar de perlas; **dīpa** — lámpara; **nirājita** — adorado de esa manera.\"],\"translation\":[\"En el templo, durante el *ārati*, las *mṛdaṅgas* suenan dulcemente mientras que son sopladas las caracolas y es ofrecida la lámpara de *guee*. En el *ārati*, las diferentes partes de los *Vedas* dentro del *bhakti-yoga *adoptaron forma en cada flama como una flama de *bhakti-yoga*, y adoran de ese modo a Sus Señorías.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"mṛdaṅga\",\"trans\":\"el tambor *mṛdaṅga*; (\",\"sep\":\" \"},{\"text\":\"mandirā\",\"trans\":\"arcilla\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bāje\",\"trans\":\"cuerpo)\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"suśaṅkha\",\"trans\":\"el templo\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"dhvanita\",\"trans\":\"suena\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"śruti-mauli\",\"trans\":\"la gloriosa caracola\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"ratnamālā\",\"trans\":\"el sonido\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"dīpa\",\"trans\":\"las escrituras\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"nirājita\",\"trans\":\"guirnaldas\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"8\",\"text\":[\"bhuvana-mohana dū̐hū̐ rūpera ārati\",\"gupta-vṛndāraṇya-vāsī dekhe niravadhi\"],\"word_by_word\":[\"**bhuvana** — del mundo; **mohana** — encantador; **dū̐hū̐** — ambos; **rūpera** — de su forma; **ārati** — ceremonia; **gupta-vṛndāraṇya** — Vṛndāvan oculto (Nabadwīp); **vāsī** — residentes; **dekhe** — ven; **niravadhi** — continuamente.\"],\"translation\":[\"Este tipo de *ārati* solo es visto por los residentes de Nabadwīp Dhām y por los queridos asociados de Śrī Chaitanya. Aquel que lo observe quedará extremamente encantado.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"bhuvana\",\"trans\":\"del mundo\",\"sep\":\"-\"},{\"text\":\"mohana\",\"trans\":\"encantador\",\"sep\":\" \"},{\"text\":\"dū̐hū̐\",\"trans\":\"ambos\",\"sep\":\" \"},{\"text\":\"rūpera\",\"trans\":\"de su forma\",\"sep\":\" \"},{\"text\":\"ārati\",\"trans\":\"ceremonia\",\"sep\":\"\"}],[{\"text\":\"gupta-vṛndāraṇya\",\"trans\":\"Vṛndāvan oculto (Nabadwīp)\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"vāsī\",\"trans\":\"residentes\",\"sep\":\" \"},{\"text\":\"dekhe\",\"trans\":\"ven\",\"sep\":\" \"},{\"text\":\"niravadhi\",\"trans\":\"continuamente\",\"sep\":\"\"}]]},{\"number\":\"9\",\"text\":[\"śrī svarūpa rāmānanda rūpa-sanātana\",\"raghunātha haridāsa gadādhara dhana\"],\"word_by_word\":[\"**śrī svarūpa** — Śrī Svarūp Dāmodar; **rāmānanda** — Rāmānanda Rāy; **rūpa-sanātana** — Rūpa Goswāmī, Sanātan Goswāmī; **raghunātha** — Raghunāth Dās Goswāmī; **haridāsa** — Haridās Ṭhākur; **gadādhara** — Gadādhar Paṇḍit; **dhana** — queridos.\"],\"translation\":[\"Los queridos asociados de Śrī Chaitanya: Śrī Svarūp Dāmodar, Rāmānanda Rāy, Rūpa Goswāmī, Sanātan Goswāmī, Raghunāth Dās Goswāmī, Haridās Ṭhākur y Gadādhar Paṇḍit miran y llevan a cabo este *ārati*.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"śrī svarūpa\",\"trans\":\"Śrī Svarūp Dāmodar\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"rāmānanda\",\"trans\":\"Rāmānanda Rāy\",\"sep\":\" \"},{\"t
