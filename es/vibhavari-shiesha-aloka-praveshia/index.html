**śeṣa** — al final.\"],\"author\":[\"Śrīla Bhakti Vinod Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"vibhāvarī śeṣa    āloka praveśa\",\"    nidrā chhāḍi’ uṭha jīva\",\"bala hari hari        mukunda murāri\",\"    rāma kṛṣṇa hayagrīva\"],\"word_by_word\":[\"**vibhāvarī** — la noche; **śeṣa** — al final; **āloka** — la luz; **praveśa** — entra; **nidrā** — sueño; **chhāḍi’** — abandonar; **uṭha** — levantar; **jīva** — ¡oh alma!; **bala** — canta; **hari hari** — Hari; **mukunda** — Mukunda, el dador de liberación; **murāri** — Murāri, el enemigo del demonio Mura; **rāma** — Rāma, el Supremo disfrutador; **kṛṣṇa** — Kṛṣṇa, el todo atractivo; **hayagrīva** — Hayagrīva, la encarnación de cabeza decaballo.\"],\"translation\":[\"La noche terminó y la alborada despunta. ¡Oh, alma *jīva*, levántate y abandona tu sueño! Canta los Santos Nombres del Señor Hari, el que otorga la liberación, el enemigo del demonio Mura, el Supremo disfrutador, quien es plenamente atractivo, y la encarnación con cabeza de caballo, Hayagrīva.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"vibhāvarī\",\"trans\":\"la noche\",\"sep\":\" \"},{\"text\":\"śeṣa\",\"trans\":\"al final\",\"sep\":\"    \"},{\"text\":\"āloka\",\"trans\":\"la luz\",\"sep\":\" \"},{\"text\":\"praveśa\",\"trans\":\"entra\",\"sep\":\"\"}],[{\"text\":\"nidrā\",\"trans\":\"sueño\",\"sep\":\" \"},{\"text\":\"chhāḍi\",\"trans\":\"abandonar\",\"sep\":\"’ \"},{\"text\":\"uṭha\",\"trans\":\"levantar\",\"sep\":\" \"},{\"text\":\"jīva\",\"trans\":\"¡oh alma!\",\"sep\":\"\"}],[{\"text\":\"bala\",\"trans\":\"canta\",\"sep\":\" \"},{\"text\":\"hari hari\",\"trans\":\"Hari\",\"sep\":\"        \",\"error\":\"multi\"},{\"text\":\"mukunda\",\"trans\":\"Mukunda, el dador de liberación\",\"sep\":\" \"},{\"text\":\"murāri\",\"trans\":\"Murāri, el enemigo del demonio Mura\",\"sep\":\"\"}],[{\"text\":\"rāma\",\"trans\":\"Rāma, el Supremo disfrutador\",\"sep\":\" \"},{\"text\":\"kṛṣṇa\",\"trans\":\"Kṛṣṇa, el todo atractivo\",\"sep\":\" \"},{\"text\":\"hayagrīva\",\"trans\":\"Hayagrīva, la encarnación de cabeza decaballo\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"nṛsiṁha vāmana    śrī-madhusūdana\",\"    vrajendra-nandana śyāma\",\"pūtanā-ghātana    kaiṭabha-śātana\",\"    jaya dāśarathi-rāma\"],\"word_by_word\":[\"**nṛsiṁha** — Nṛsiṁha, mitad hombre mitad león; **vāmana** — Vāmana, el *brahmāṇa* enano; **śrī-madhusūdana** — Śrī Madhusūdana, el vencedor del demonio Madhu; **vrajendra-nandana** — el querido hijo del rey de Vraja; **śyāma** — que es de tez negruzca; **pūtanā-ghātana** — el asesino de la bruja Pūtanā; **kaiṭabha-śātana** — el destructor del demonio Kaiṭabha; **jaya** — toda gloria; **dāśarathi-rāma** — el Señor Rāma, el hijo del rey Daśaratha.\"],\"translation\":[\"El Señor Hari encarnó como Nṛṣiṁha, mitad hombre y mitad león. Apareció como un brahmín enano llamado Upendra y mató al demonio Madhu. Él es el hijo amado del Rey de Vraja, Nanda Mahārāj, y tiene una tez negruzca; dio muerte a la bruja Pūtanā y aniquiló al demonio Kaiṭabha. Todas las glorias al Señor Hari, quien apareció como el Señor Rāma, el hijo del Rey Dāśarath.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"nṛsiṁha\",\"trans\":\"Nṛsiṁha, mitad hombre mitad león\",\"sep\":\" \"},{\"text\":\"vāmana\",\"trans\":\"Vāmana, el *brahmāṇa* enano\",\"sep\":\"    \"},{\"text\":\"śrī-madhusūdana\",\"trans\":\"Śrī Madhusūdana, el vencedor del demonio Madhu\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"vrajendra-nandana\",\"trans\":\"el querido hijo del rey de Vraja\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"śyāma\",\"trans\":\"que es de tez negruzca\",\"sep\":\"\"}],[{\"text\":\"pūtanā-ghātana\",\"trans\":\"el asesino de la bruja Pūtanā\",\"sep\":\"    \",\"error\":\"multi\"},{\"text\":\"kaiṭabha-śātana\",\"trans\":\"el destructor del demonio Kaiṭabha\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"jaya\",\"trans\":\"toda gloria\",\"sep\":\" \"},{\"text\":\"dāśarathi-rāma\",\"trans\":\"el Señor Rāma, el hijo del rey Daśaratha\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"3\",\"text\":[\" yaśodā dulāla    govinda gopāla\",\"    vṛndāvana purandara\",\"gopī-priya-jana    rādhikā-ramaṇa\",\"    bhuvana-sundara-vara\"],\"word_by_word\":[\"**yaśodā dulāla** — el niño mimado de madre Yaśodā; **govinda** — el que da placer a las vacas; **gopāla** — el protector de las vacas; **vṛndāvana purandara** — el monarca del bosque de Vṛndāvan; **gopī-priya jana** — el amado de las *gopīs*; **rādhikā-ramaṇa** — el amante de Rādhikā; **bhuvana sundara-bara** — la personalidad más bella de todos los mundos.\"],\"translation\":[\"Él es el querido de Madre Yaśodā, quien da placer a las vacas, la tierra y los sentidos espirituales; y el protector de las vacas, el Señor del bosque de Vṛndāvan, el amado de las *gopīs*, el amante de Rādhikā y la personalidad más hermosa en todos los mundos.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"yaśodā dulāla\",\"trans\":\"el niño mimado de madre Yaśodā\",\"sep\":\"    \",\"error\":\"multi\"},{\"text\":\"govinda\",\"trans\":\"el que da placer a las vacas\",\"sep\":\" \"},{\"text\":\"gopāla\",\"trans\":\"el protector de las vacas\",\"sep\":\"\"}],[{\"text\":\"vṛndāvana purandara\",\"trans\":\"el monarca del bosque de Vṛndāvan\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"gopī-priya-jana\",\"trans\":\"el amado de las *gopīs*\",\"sep\":\"    \",\"error\":\"multi\"},{\"text\":\"rādhikā-ramaṇa\",\"trans\":\"el amante de Rādhikā\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"bhuvana-sundara-vara\",\"trans\":\"la personalidad más bella de todos los mundos\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"4\",\"text\":[\" rāvāṇāntakara    mākhana-taskara\",\"    gopī-jana-vastra-hārī\",\"vrajera rākhāla    gopa-vṛnda-pāla\",\"    chita-hārī vaṁśī-dhārī\"],\"word_by_word\":[\"**rāvāṇāntakara** — que provocó el fin del demonio Rāvaṇa; **makhana-taskara** — que robó la mantequilla de las *gopīs* mayores; **gopī-jana-vastra-hārī** — que robó la ropa de las *gopīs* más jóvenes; **vrajera rākhala** — un pastorcillo de vacas de Vraja; **gopa-vṛnda-pāla** — el protector de los pastorcillos de vacas; **chita-hārī** — que roba los corazones de todos; **vaṁśī-dhārī** — que siempre sostiene una flauta.\"],\"translation\":[\"Como Rāmachandra, puso fin al demoníaco rey Rāvana; como Kṛṣṇa, robó la mantequilla de las *gopīs* mayores, robó las ropas de las *gopīs* jóvenes mientras se bañaban en el Yamunā. Es el pastorcillo de vacas de Vraja y el protector de los pastorcillos de vacas. Les roba el corazón a todos y siempre lleva una flauta.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"rāvāṇāntakara\",\"trans\":\"que provocó el fin del demonio Rāvaṇa\",\"sep\":\"    \"},{\"text\":\"mākhana-taskara\",\"trans\":\"que robó la mantequilla de las *gopīs* mayores\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"gopī-jana-vastra-hārī\",\"trans\":\"que robó la ropa de las *gopīs* más jóvenes\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"vrajera rākhāla\",\"trans\":\"un pastorcillo de vacas de Vraja\",\"sep\":\"    \",\"error\":\"multi\"},{\"text\":\"gopa-vṛnda-pāla\",\"trans\":\"el protector de los pastorcillos de vacas\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"chita-hārī\",\"trans\":\"que roba los corazones de todos\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"vaṁśī-dhārī\",\"trans\":\"que siempre sostiene una flauta\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"5\",\"text\":[\"yogīndra-vandana    śrī-nanda-nandana\",\"    vraja-jana-bhaya-hārī\",\"navīna nīrada        rūpa manohara\",\"    mohana-vaṁśī-vihārī\"],\"word_by_word\":[\"**yogīndra-vandana** — adorado por los mejores *yogīs*; **śrī-nanda-nandana** — el encantador hijo de Nanda; **vraja-jana-bhaya-hārī** — que elimina todos los temores de los habitantes de Vraja; **navīnanīrada** — que es del color de una nube de lluvia fresca; **rūpa manohara** — cuya forma es encantadora; **mohana vaṁśī-vihārī** — quien se ve muy encantador vagando y tocando Su flauta.\"],\"translation\":[\"El Señor Kṛṣṇa es adorado por el mejor de los *yogīs* y es el hijo deNanda. Él desecha todos los temores de los habitantes de Vraja. Su color es el de una fresca nube de lluvia, y Su forma es encantadora. Mientras camina, tocando Su flauta, luce muy atractivo.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"yogīndra-vandana\",\"trans\":\"adorado por los mejores *yogīs*\",\"sep\":\"    \",\"error\":\"multi\"},{\"text\":\"śrī-nanda-nandana\",\"trans\":\"el encantador hijo de Nanda\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"vraja-jana-bhaya-hārī\",\"trans\":\"que elimina todos los temores de los habitantes de Vraja\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"navīna\",\"trans\":\"que es del color de una nube de lluvia fresca\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nīrada        rūpa\",\"trans\":\"cuya forma es encantadora\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"manohara\",\"trans\":\"quien se ve muy encantador vagando y tocando Su flauta\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"mohana\",\"trans\":\"-\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"vaṁśī\",\"trans\":\"-\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"vihārī\",\"trans\":\"-\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"6\",\"text\":[\"yaśodā-nandana    kaṁsa-nisūdana\",\"    nikuñja-rāsa-vilāsī\",\"kadamba-kānana    rāsa-parāyaṇa\",\"    vṛndā-vipina-nivāsī\"],\"word_by_word\":[\"**yaśodā-nandana** — el encantador hijo de Yaśodā; **kaṁsa-nisūdana** — el asesino del rey Kaṁsa; **nikuñja-rāsa-vilāsī** — que practica la danza *rāsa* entre las arboledas; **kadamba-kānana** — debajo de los árboles *kadamba*; **rāsa-parāyaṇa** — a quien le gusta participar en la danza *rāsa*; **vṛndā vipina-nivāsī** — que reside en el bosque de Vṛndā Devī.\"],\"translation\":[\"Él es el hijo de Yaśodā; mató al rey Kaṁsa y juega en la danza *rāsa* entre los bosquecillos de Vraja. Kṛṣṇa se ocupa en esta danza *rāsa* bajo los árboles *kadamba* y reside en el bosque de Vṛndāvan.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"yaśodā-nandana\",\"trans\":\"el encantador hijo de Yaśodā\",\"sep\":\"    \",\"error\":\"multi\"},{\"text\":\"kaṁsa-nisūdana\",\"trans\":\"el asesino del rey Kaṁsa\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"nikuñja-rāsa-vilāsī\",\"trans\":\"que practica la danza *rāsa* entre las arboledas\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"kadamba-kānana\",\"trans\":\"debajo de los árboles *kadamba*\",\"sep\":\"    \",\"error\":\"multi\"},{\"text\":\"rāsa-parāyaṇa\",\"trans\":\"a quien le gusta participar en la danza *rāsa*\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"vṛndā-vipina-nivāsī\",\"trans\":\"que reside en el bosque de Vṛndā Devī\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"7\",\"text\":[\" ānanda-vardhana    prema-niketana\",\"    phula-śara-yojaka kāma\",\"gopāṅgaṇā-gaṇa-    chita-vinodana\",\"    samasta-guṇa-gaṇa-dhāma\"],\"word_by_word\":[\"**ānanda-vardhana** — que aumenta el éxtasis de Sus devotos; **prema niketana** — el depósito de todo amor; **phula-śara** — flechas floridas; **yojaka** — que usa; **kāma** — el Cupido trascendental; **gopāṅgana-gaṇa** — de las pastorcillas de vacas; **chita vinodana** — el placer del corazón; **samasta-guṇa-gaṇa dhāma** — la morada de todas las cualidades maravillosas.\"],\"translation\":[\"Él incrementa el éxtasis de Sus devotos, es la fuente de todo amor y el cupido trascendental que usa flechas de flores para incrementar los deseos amorosos de las *gopīs*. Es el placer de los corazones de las *gopīs* y la morada de todas las cualidades maravillosas.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"ānanda-vardhana\",\"trans\":\"que aumenta el éxtasis de Sus devotos\",\"sep\":\"    \",\"error\":\"multi\"},{\"text\":\"prema-niketana\",\"trans\":\"el depósito de todo amor\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"phula-śara\",\"trans\":\"flechas floridas\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"yojaka\",\"trans\":\"que usa\",\"sep\":\" \"},{\"text\":\"kāma\",\"trans\":\"el Cupido trascendental\",\"sep\":\"\"}],[{\"text\":\"gopāṅgaṇā-gaṇa\",\"trans\":\"de las pastorcillas de vacas\",\"sep\":\"-    \",\"error\":\"mismatch\"},{\"text\":\"chita-vinodana\",\"trans\":\"el placer del corazón\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"samasta-guṇa-gaṇa-dhāma\",\"trans\":\"la morada de todas las cualidades maravillosas\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"8\",\"text\":[\"yāmuna-jīvana    keli-parāyaṇa\",\"    mānasa-chandra-chakora\",\"nāma-sudhā-rasa    gāo kṛṣṇa-yaśa\",\"    rākha vachana mana mora\"],\"word_by_word\":[\"**yāmuna-jīvana** — la vida del río Yamunā; **keli-parāyaṇa** — que siempre está absorto en pasatiempos amorosos; **mānasa-chandra-chakora** — que es la luna de la mente de las *gopīs*, que son como pájaros *chakora* (que subsisten únicamente con la luz de la luna); **nāma-sudhā-rasa** — las melosidades nectáreas de estos santos nombres; **gāo** — por favor canta; **kṛṣṇa yaśa** — las glorias de Srī Kṛṣṇa; **rākhovachana** — por favor obedece este consejo; **mana mora** — ¡oh, mi querida mente!\"],\"translation\":[\"Kṛṣṇa es la vida del río Yamunā y es la luna para las mentes de las *gopīs*, quienes son como los pájaros *chakora*. ¡Oh mente!Obedece mis palabras y canta las glorias de Śrī Kṛṣṇa y Sus nectáreos Nombres.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"yāmuna-jīvana\",\"trans\":\"la vida del río Yamunā\",\"sep\":\"    \",\"error\":\"multi\"},{\"text\":\"keli-parāyaṇa\",\"trans\":\"que siempre está absorto en pasatiempos amorosos\",\"sep\":\"\",\"error\"
