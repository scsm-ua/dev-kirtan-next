ayi** — de anhelo.\"],\"author\":[\"Śrīla Bhakti Vinod Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"        kṛpa koro’ vaiṣṇava ṭhākura\",\"sambandha jāniyā,    bhajite bhajite,\",\"        abhimān hau dūra\"],\"word_by_word\":[\"**kṛpa** — misericordia; **koro’** — otorga; **vaiṣṇava ṭhākura** — devoto adorable; **sambandha** — relación; **jāniyā** — sabiendo; **bhajite** — adorando; **bhajite** — y adorando; **abhimān** — orgullo; **hau** — hará; **dūra** — lejos.\"],\"translation\":[\"Por favor, concédeme tu misericordia ahora, ¡oh, venerado devoto puro! ¡Vaiṣṇava Ṭhākur! Solo así mi ego falso se irá lejos mediante mi constante adoración con entero conocimiento de mi verdadera posición eterna.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"kṛpa\",\"trans\":\"misericordia\",\"sep\":\" \"},{\"text\":\"koro\",\"trans\":\"otorga\",\"sep\":\"’ \"},{\"text\":\"vaiṣṇava ṭhākura\",\"trans\":\"devoto adorable\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"sambandha\",\"trans\":\"relación\",\"sep\":\" \"},{\"text\":\"jāniyā\",\"trans\":\"sabiendo\",\"sep\":\",    \"},{\"text\":\"bhajite\",\"trans\":\"adorando\",\"sep\":\" \"},{\"text\":\"bhajite\",\"trans\":\"y adorando\",\"sep\":\",\"}],[{\"text\":\"abhimān\",\"trans\":\"orgullo\",\"sep\":\" \"},{\"text\":\"hau\",\"trans\":\"hará\",\"sep\":\" \"},{\"text\":\"dūra\",\"trans\":\"lejos\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"‘ami to’ vaiṣṇava’        e buddhi hoile,\",\"        amānī nā ho’ bo āmi\",\"pratiṣṭhāśā āsi’,        hṛdoya dūṣibe,\",\"        hoibo nirayagāmī\"],\"word_by_word\":[\"**‘ami** — yo; **to’** — de hecho; **vaiṣṇava’** — un Vaiṣṇava; **e** — este; **buddhi** — inteligencia; **hoile** — volverse; **amānī** — sin orgullo; **nā** — no; **ho’ bo** — será; **āmi** — yo; **pratiṣṭha** — fama; **āśā** — deseo; **āsi’** — tomando; **hṛdoya** — corazón; **dūṣibe** — se contamina; **hoibo** — será; **niraya** — al infierno; **gāmī** — ir.\"],\"translation\":[\"Si pienso falsamente que “yo soy un Vaiṣṇava”, entonces buscaré recibir el respeto de los demás. Y si el deseo de fama y reputación contaminan mi corazón, ciertamente iré de inmediato a morar en el infierno.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"‘ami\",\"trans\":\"yo\",\"sep\":\" \"},{\"text\":\"to\",\"trans\":\"de hecho\",\"sep\":\"’ \"},{\"text\":\"vaiṣṇava\",\"trans\":\"un Vaiṣṇava\",\"sep\":\"’        \"},{\"text\":\"e\",\"trans\":\"este\",\"sep\":\" \"},{\"text\":\"buddhi\",\"trans\":\"inteligencia\",\"sep\":\" \"},{\"text\":\"hoile\",\"trans\":\"volverse\",\"sep\":\",\"}],[{\"text\":\"amānī\",\"trans\":\"sin orgullo\",\"sep\":\" \"},{\"text\":\"nā\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"ho’ bo\",\"trans\":\"será\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"āmi\",\"trans\":\"yo\",\"sep\":\"\"}],[{\"text\":\"pratiṣṭhāśā\",\"trans\":\"fama\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"āsi\",\"trans\":\"deseo\",\"sep\":\"’,        \",\"error\":\"mismatch\"},{\"text\":\"hṛdoya\",\"trans\":\"tomando\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"dūṣibe\",\"trans\":\"corazón\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"hoibo\",\"trans\":\"se contamina\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nirayagāmī\",\"trans\":\"será\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"3\",\"text\":[\"tomāra kiṅkora,        āpane jānibo,\",\"        ‘guru’-abhimān tyaji’\",\"tomāra uchiṣṭha,        padajala-reṇu,\",\"        sadā niṣkapaṭe bhaji\"],\"word_by_word\":[\"**tomāra** — de ti; **kiṅkora** — el sirviente; **āpane** — propio; **jānibo** — sabré; **‘guru’-abhimān** — el honor de un guru; **tyaji’** — renunciar; **tomāra** — de ti; **uchiṣṭha** — remanentes; **pada** — de los pies; **jala** — agua; **reṇu** — polvo; **sadā** — siempre; **niṣkapaṭe** — sinceramente; **bhaji** — adoro.\"],\"translation\":[\"Por renunciar al concepto falso de que yo soy un guru, entenderé que soy tu humilde sirviente. ¡Oh, devoto puro! Yo adoro con sinceridad los remanentes de tu comida, así como al agua que ha lavado el sagrado polvo de tus pies de loto.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"tomāra\",\"trans\":\"de ti\",\"sep\":\" \"},{\"text\":\"kiṅkora\",\"trans\":\"el sirviente\",\"sep\":\",        \"},{\"text\":\"āpane\",\"trans\":\"propio\",\"sep\":\" \"},{\"text\":\"jānibo\",\"trans\":\"sabré\",\"sep\":\",\"}],[{\"text\":\"‘guru’-abhimān\",\"trans\":\"el honor de un guru\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"tyaji\",\"trans\":\"renunciar\",\"sep\":\"’\"}],[{\"text\":\"tomāra\",\"trans\":\"de ti\",\"sep\":\" \"},{\"text\":\"uchiṣṭha\",\"trans\":\"remanentes\",\"sep\":\",        \"},{\"text\":\"padajala\",\"trans\":\"de los pies\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"reṇu\",\"trans\":\"agua\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"sadā\",\"trans\":\"polvo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"niṣkapaṭe\",\"trans\":\"siempre\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bhaji\",\"trans\":\"sinceramente\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"4\",\"text\":[\"‘nije sreṣṭha’ jāni’,    uchiṣṭhādi dāne,\",\"        ha’be abhimān bhār\",\"tāi śiṣya tava,        thākiyā sarvvadā,\",\"        nā loibo pūjā kā’ra\"],\"word_by_word\":[\"**‘nije** — propio; **sreṣṭha’** — el mejor; **jāni’** — pensar; **uchiṣṭha** — remanentes; **ādi** — otros; **dāne** — de su dádiva; **ha’be** — será; **abhimān** — orgullo; **bhāra** — gran; **tāi** — debido; **śiṣya** — discípulo; **tava** — tuyo; **thākiyā** — permanecer; **sarvvadā** — siempre; **nā** — no; **loibo** — aceptaré; **pūjā** — adoración; **kā’ra** — aquellos.\"],\"translation\":[\"Si les brindo los remanentes de mi comida a otros, me consideraré superior y quedaré agobiado por el peso del orgullo falso. Por lo tanto, permaneciendo como tu entregado discípulo, no he de aceptar
