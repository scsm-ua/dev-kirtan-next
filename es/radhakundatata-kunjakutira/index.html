:\"-\"},{\"text\":\"tīra\",\"trans\":\"la orilla\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"kusuma-sarovara, mānasa-gaṅgā\",\"kalinda-nandinī vipula-taraṅgā\"],\"word_by_word\":[\"**kusuma-sarovara** — el lago cerca de la Colina de Govardhan; **mānasa-gaṅgā** — un lago cerca de la Colina de Govardhan; **kalinda-nandinī** — del río Yamunā (la hija del Monte Kalinda); **vipula** — grandes; **taraṅgā** — olas.\"],\"translation\":[\"Kusum Sarovar, Mānasa Gaṅgā, las grandes olas del Yamunā...\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"kusuma-sarovara\",\"trans\":\"el lago cerca de la Colina de Govardhan\",\"sep\":\", \",\"error\":\"multi\"},{\"text\":\"mānasa-gaṅgā\",\"trans\":\"un lago cerca de la Colina de Govardhan\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"kalinda-nandinī\",\"trans\":\"del río Yamunā (la hija del Monte Kalinda)\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"vipula\",\"trans\":\"grandes\",\"sep\":\"-\"},{\"text\":\"taraṅgā\",\"trans\":\"olas\",\"sep\":\"\"}]]},{\"number\":\"3\",\"text\":[\"vaṁśī-vaṭa, gokula, dhīra-samīra\",\"vṛndāvana-taru-latikā-vānīra\"],\"word_by_word\":[\"**vaṁśī-vaṭa** — el lugar debajo de un árbol baniano cerca del sitio del *rāsa-līlā* en Vṛndāvan donde Kṛṣṇa se para y toca Su flauta; **gokula** — la tierra de los Pasatiempos de Kṛṣṇa; **dhīra-samīra** — un sitio de varios Pasatiempos de Kṛṣṇa (lit. ‘brisa suave’); **vṛndāvana** — la tierra natal de Kṛṣṇa (lit. bosque de Tulasī); **taru** — árboles; **latikā** — enredaderas; **vānīra** — palmeras.\"],\"translation\":[\"Vaṁśī Vaṭa, Gokula, Dhīra Samīra, los árboles, las enredaderas, las palmeras de Vṛndāvan...\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"vaṁśī-vaṭa\",\"trans\":\"el lugar debajo de un árbol baniano cerca del sitio del *rāsa-līlā* en Vṛndāvan donde Kṛṣṇa se para y toca Su flauta\",\"sep\":\", \",\"error\":\"multi\"},{\"text\":\"gokula\",\"trans\":\"la tierra de los Pasatiempos de Kṛṣṇa\",\"sep\":\", \"},{\"text\":\"dhīra-samīra\",\"trans\":\"un sitio de varios Pasatiempos de Kṛṣṇa (lit. ‘brisa suave’)\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"vṛndāvana\",\"trans\":\"la tierra natal de Kṛṣṇa (lit. bosque de Tulasī)\",\"sep\":\"-\"},{\"text\":\"taru\",\"trans\":\"árboles\",\"sep\":\"-\"},{\"text\":\"latikā\",\"trans\":\"enredaderas\",\"sep\":\"-\"},{\"text\":\"vānīra\",\"trans\":\"palmeras\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"khaga-mṛga-kula, malaya-vātāsa\",\"mayūra, bhramara, muralī-vilāsa\"],\"word_by_word\":[\"**khaga** — pájaros; **mṛga** — animales; **kula** — multitudes; **malaya** — primavera; **vātāsa** — brisas; **mayūra** — pavoreales; **bhramara** — abejorros; **muralī** — de la flauta de madera de dieciocho pulgadas conocida como *muralī*; **vilāsa** — tocar.\"],\"translation\":[\"Los pájaros, los animales, la fresca brisa primaveral, los pavos reales, los abejorros, el sonar de la flauta *muralī*...\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"khaga\",\"trans\":\"pájaros\",\"sep\":\"-\"},{\"text\":\"mṛga\",\"trans\":\"animales\",\"sep\":\"-\"},{\"text\":\"kula\",\"trans\":\"multitudes\",\"sep\":\", \"},{\"text\":\"malaya\",\"trans\":\"primavera\",\"sep\":\"-\"},{\"text\":\"vātāsa\",\"trans\":\"brisas\",\"sep\":\"\"}],[{\"text\":\"mayūra\",\"trans\":\"pavoreales\",\"sep\":\", \"},{\"text\":\"bhramara\",\"trans\":\"abejorros\",\"sep\":\", \"},{\"text\":\"muralī\",\"trans\":\"de la flauta de madera de dieciocho pulgadas conocida como *muralī*\",\"sep\":\"-\"},{\"text\":\"vilāsa\",\"trans\":\"tocar\",\"sep\":\"\"}]]},{\"number\":\"5\",\"text\":[\"veṇu, śṛṅga, pada-chihṇa, megha-mālā\",\"vasanta, śaśāṅka, śaṅkha, karatāla\"],\"word_by_word\":[\"**veṇu** — la flauta silbante de seis pulgadas conocida como *veṇu*; **śṛṅga** — cuerno; **pada-chihṇa** — huellas (de las vacas); **megha** — de las nubes; **mālā** — filas; **vasanta** — primavera; **śaśāṅka** — luna; **śaṅkha** — caracola; **karatāla** — címbalos.\"],\"translation\":[\"La flauta *veṇu*, el cuerno de búfalo, las huellas, las filas de nubes, la primavera, la luna, la caracola, los *kartālas*...\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"veṇu\",\"trans\":\"la flauta silbante de seis pulgadas conocida como *veṇu*\",\"sep\":\", \"},{\"text\":\"śṛṅga\",\"trans\":\"cuerno\",\"sep\":\", \"},{\"text\":\"pada-chihṇa\",\"trans\":\"huellas (de las vacas)\",\"sep\":\", \",\"error\":\"multi\"},{\"text\":\"megha\",\"trans\":\"de las nubes\",\"sep\":\"-\"},{\"text\":\"mālā\",\"trans\":\"filas\",\"sep\":\"\"}],[{\"text\":\"vasanta\",\"trans\":\"primavera\",\"sep\":\", \"},{\"text\":\"śaśāṅka\",\"trans\":\"luna\",\"sep\":\", \"},{\"text\":\"śaṅkha\",\"trans\":\"caracola\",\"sep\":\", \"},{\"text\":\"karatāla\",\"trans\":\"címbalos\",\"sep\":\"\"}]]},{\"number\":\"6\",\"text\":[\"yugala-vilāse anukūla jāni\",\"līlā-vilāsa-uddīpaka māni\"],\"word_by_word\":[\"**yugala** — de la Divina Pareja; **vilāse** — en los Pasatiempos; **anukūla** — favorable; **jāni** — yo sé; **līlā-vilāsa** — Sus Pasatiempos de amor; **uddīpaka** — estimula; **māni** — yo sé.\"],\"translation\":[\"Sé que todas estas cosas son favorables a los Pasatiempos de la Pareja Divina. Sé que todos ellos estimulan Sus pasatiempos amorosos.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"yugala\",\"trans\":\"de la Divina Pareja\",\"sep\":\"-\"},{\"text\":\"vilāse\",\"trans\":\"en los Pasatiempos\",\"sep\":\" \"},{\"text\":\"anukūla\",\"trans\":\"favorable\",\"sep\":\" \"},{\"text\":\"jāni\",\"trans\":\"yo sé\",\"sep\":\"\"}],[{\"text\":\"līlā-vilāsa\",\"trans\":\"Sus Pasatiempos de amor\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"uddīpaka\",\"trans\":\"estimula\",\"sep\":\" \"},{\"text\":\"māni\",\"trans\":\"yo sé\",\"sep\":\"\"}]]},{\"number\":\"7\",\"text\":[\"e saba chhoḍata kā̐hā nāhi yāu̐\",\"e saba chhoḍata parāṇa hārāu̐\"],\"word_by_word\":[\"**e** — estas; **saba** — todo; **chhoḍata** — abandonar; **kā̐hā** — algún lugar; **nāhi** — no; **yāu̐** — iré; **e** — estas; **saba** — todo; **chhoḍata** — abandonar; **parāṇa** — mivida; **hārāu̐** — perderé.\"],\"translation\":[\"Nunca abandonaré estas cosas e iré a otra parte. Perderé mi vida si las abandono.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"e\",\"trans\":\"estas\",\"sep\":\" \"},{\"text\":\"saba\",\"trans\":\"todo\",\"sep\":\" \"},{\"text\":\"chhoḍata\",\"trans\":\"abandonar\",\"sep\":\" \"},{\"text\":\"kā̐hā\",\"trans\":\"algún lugar\",\"sep\":\" \"},{\"text\":\"nāhi\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"yāu̐\",\"trans\":\"iré\",\"sep\":\"\"}],[{\"text\":\"e\",\"trans\":\"estas\",\"sep\":\" \"},{\"text\":\"saba\",\"trans\":\"todo\",\"sep\":\" \"},{\"text\":\"chhoḍata\",\"trans\":\"abandonar\",\"sep\":\" \"},{\"text\":\"parāṇa\",\"trans\":\"mivida\",\"sep\":\" \"},{\"text\":\"hārāu̐\",\"trans\":\"perderé\",\"sep\":\"\"}]]},{\"number\":\"8\",\"text\":[\"bhakati-vinoda kahe śuna kāna!\",\"tuyā uddīpaka hāmāra parāṇa\"],\"word_by_word\":[\"**bhakati-vinoda** — Bhakti Vinod; **kahe** — dice; **śuna** — por favor escucha; **kāna!** — ¡oh Kṛṣṇa!; **tuyā** — de Ti; **uddīpaka** — estimular; **hāmāra** — mi; **parāṇa** — vida y alma.\"],\"translation\":[\"Bhakti Vinod dice: “Por favor, escucha, ¡Oh Kāna! Todas estas cosas que me recuerdan a Ti, son mi vida y mi alma”.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"bhakati-vinoda\",\"trans\":\"Bhakti Vinod\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"kahe\",\"trans\":\"dice\",\"sep\":\" \"},{\"text\":\"śuna\",\"trans\":\"por favor escucha\",\"sep\":\" \"},{\"text\":\"kāna\",\"trans\":\"¡oh Kṛṣṇa!\",\"sep\":\"!\"}],[{\"text\":\"tuyā\",\"trans\":\"de Ti\",\"sep\":\" \"},{\"text\":\"uddīpaka\",\"trans\":\"estimular\",\"sep\":\" \"},{\"text\":\"hāmāra\",
