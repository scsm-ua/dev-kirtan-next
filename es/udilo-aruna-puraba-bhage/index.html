el Señor.\"],\"translation\":[\"“Con cada salida y puesta del sol, un día pasa y se pierde. Por lo tanto, ¿por qué permanecen ociosos y rehúsan servir al Señor del corazón?”\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"udita\",\"trans\":\"creciente\",\"sep\":\" \"},{\"text\":\"tapana\",\"trans\":\"el sol\",\"sep\":\" \"},{\"text\":\"ha-ile asta\",\"trans\":\"habiendo puesto\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"dina gela\",\"trans\":\"pasa el día\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"bali\",\"trans\":\"diciendo\",\"sep\":\"’ \"},{\"text\":\"ha-ibe\",\"trans\":\"se perderá\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"vyasta\",\"trans\":\"entonces\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"tabe\",\"trans\":\"por qué\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kena\",\"trans\":\"ahora\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"ebe alasa ha\",\"trans\":\"permaneces ocioso\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"i\",\"trans\":\"no adoras\",\"sep\":\"’\",\"error\":\"mismatch\"}],[{\"text\":\"nā\",\"trans\":\"del corazón\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bhaja\",\"trans\":\"el Señor\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hṛdaya\",\"trans\":\"-\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"rāje\",\"trans\":\"-\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"6\",\"text\":[\"jīvana anitya jānaha sāra\",\"tāhe nānā-vidha vipada-bhāra\",\"nāmāśraya kari’ yatane tumi\",\"thākaha āpana kāje\"],\"word_by_word\":[\"**jīvana** — la vida; **anitya** — es temporal; **jānaha** — comprende; **sāra** — lo esencial; **tāhe** — en eso; **nānāvidha** — varias clases; **vipada** — de miserias; **bhāra** — cargado; **nāma-aśraya** — el refugio del Santo Nombre; **kari’** — hacer; **jatane** — con cuidado; **tumi** — tú; **thākaha** — siempre ocupado; **āpana** — propia; **kāje** — ocupación eterna.\"],\"translation\":[\"“Deben entend
