ya jaya mādhava-dayite\"},\"title\":[\"Śrī Rādhikā-stava\"],\"word_by_word\":[\"**śrī** — adorable; **rādhikā** — Rādhārāṇī; **stava** — alabanza.\"],\"author\":[\"Śrīla Rūpa Goswāmī\"],\"verses\":[{\"number\":\"1\",\"text\":[\"rādhe jaya jaya mādhava-dayite\",\"gokula-taruṇī-maṇḍala-mahite\"],\"word_by_word\":[\"**rādhe** — ¡oh Rādhā!; **jaya jaya** — ¡toda gloria a Ti! ¡toda gloria a Ti!; **mādhava-dayite** — ¡oh, amada de Mādhava!; **gokula** — de Gokula; **taruṇī** — de las jóvenes; **maṇḍala** — círculo; **mahite** — ¡oh Tú que eres glorificada!\"],\"translation\":[\"¡Oh, Rādhā! ¡Oh, amada de Mādhava! ¡Oh, Tú, quien eres adorada por todas las jovencitas de Gokula, todas las glorias a Ti! ¡Todas las glorias aTi!\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"rādhe\",\"trans\":\"¡oh Rādhā!\",\"sep\":\" \"},{\"text\":\"jaya jaya\",\"trans\":\"¡toda gloria a Ti! ¡toda gloria a Ti!\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"mādhava-dayite\",\"trans\":\"¡oh, amada de Mādhava!\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"gokula\",\"trans\":\"de Gokula\",\"sep\":\"-\"},{\"text\":\"taruṇī\",\"trans\":\"de las jóvenes\",\"sep\":\"-\"},{\"text\":\"maṇḍala\",\"trans\":\"círculo\",\"sep\":\"-\"},{\"text\":\"mahite\",\"trans\":\"¡oh Tú que eres glorificada!\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"dāmodara-rati-vardhana-veśe\",\"hari-niṣkuṭa-vṛndā-vipineśe\"],\"word_by_word\":[\"**dāmodara-rati** — el amor y el apego del Señor Dāmodar; **vardhana** — aumentar; **veśe** — ¡oh Tú que te vistes de tal manera!; **hari-niṣkuta** — el bosque de placer del Señor Hari; **vṛndā-vipina** — del bosque de Vṛndā Devī; **īśe** — ¡oh reina!\"],\"translation\":[\"Tú, quien vistes de tal manera con el fin de incrementar el amor y el apego del Señor Dāmodar hacia Ti! ¡Oh, Reina de Vṛndāvan, cuyo bosquecillo es el placer del Señor Hari!\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"d
