"}],[{\"text\":\"manuṣya-janama\",\"trans\":\"Rādhā y Kṛṣṇa\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"pāiyā,     rādhā\",\"trans\":\"sin haber adorado\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"kṛṣṇa nā\",\"trans\":\"incluso después de saberlo y escucharlo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bhajiyā\",\"trans\":\"he bebido veneno\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"jāniyā\",\"trans\":\"-\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"śuniyā\",\"trans\":\"-\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"viṣa\",\"trans\":\"-\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"khāinu\",\"trans\":\"-\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"2\",\"text\":[\"golokera prema-dhana,        harināma-saṅkīrttana,\",\"        rati nā janmilo keno tāya\",\"saṁsāra-biṣānale,        divā-niśi hiyā jvale,\",\"        juḍāite nā koinu upāya\"],\"word_by_word\":[\"**golokera** — de Goloka Vṛndāvan; **prema-dhana** — el tesoro del amor divino; **hari-nāma-saṅkīrtana** — el canto en congregación de los santos nombres del Señor Hari; **rati** — mi atracción; **nā janmilo** — nunca sucedió; **kene** — ¿por qué?; **tāy** — por eso; **saṁsāra-viṣānale** — en el fuego del veneno de la mundanidad; **divā-niśi** — día y noche; **hiyā jvale** — mi corazón arde; **juḍāite** — para aliviarlo; **nā koinu upāy** — no he tomado los medios.\"],\"translation\":[\"El tesoro del amor divino en Goloka Vṛndāvan ha descendido como el canto en congregación de los Santos Nombres del Señor Hari. ¿Por qué nunca surge atracción en mí hacia ese canto? Mi corazón arde día y noche debido al fuego del veneno de la mundanidad, y yo no he buscado los medios para remediarlo.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"golokera\",\"trans\":\"de Goloka Vṛndāvan\",\"sep\":\" \"},{\"text\":\"prema-dhana\",\"trans\":\"el tesoro del amor divino\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"harināma-saṅkīrttana\",\"trans\":\"el canto en congregación de los santos nombres del Señor Hari\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"rati\",\"trans\":\"mi atracción\",\"sep\":\" \"},{\"text\":\"nā janmilo\",\"trans\":\"nunca sucedió\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"keno\",\"trans\":\"¿por qué?\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"tāya\",\"trans\":\"por eso\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"saṁsāra-biṣānale\",\"trans\":\"en el fuego del veneno de la mundanidad\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"divā-niśi\",\"trans\":\"día y noche\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"hiyā jvale\",\"trans\":\"mi corazón arde\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"juḍāite\",\"trans\":\"para aliviarlo\",\"sep\":\" \"},{\"text\":\"nā koinu upāya\",\"trans\":\"no he tomado los medios\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"3\",\"text\":[\"vrajendra-nandana jei,        śachī-suta hoilo sei,\",\"        balarāma hoilo nitāi\",\"dīna-hīna jata chilo,        harināme udhārilo,\",\"        tāra śākṣī jagāi mādhāi\"],\"word_by_word\":[\"**vrajendra-nandana jei** — el Señor Kṛṣṇa, el hijo del rey de Vraja; **śachīsuta** — el hijo de Śachī (el Señor Chaitanya); **hoilo** — se convirtió; **sei** — él; **balarama** — el Señor Balarāma; **hoilo** — se convirtió; **nitāi** — el Señor Nityānanda; **dīna-hīna** — que eran humildes y miserables; **yata chilo** — todas aquellas almas que fueron; **harināme** — por el santo nombre; **uddhārilo** — fueron liberados; **tāra śākṣī** — la evidencia de eso; **jagāi mādhāi** — los dos pecadores llamados Jagāi y Mādhāi.\"],\"translation\":[\"El Señor Kṛṣṇa, quien es el hijo del rey de Vraja, apareció como el hijo de Śachī (el Señor Chaitanya), y Balarāma vino como Nitāi. El Santo Nombre redime a todas las almas que son bajas y desgraciadas. Los dos pecadores, Jagāi y Mādhāi, son una evidencia de esto.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"vrajendra-nandana jei\",\"trans\":\"el Señor Kṛṣṇa, el hijo del rey de Vraja\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"śachī\",\"trans\":\"el hijo de Śachī (el Señor Chaitanya)\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"suta\",\"trans\":\"se convirtió\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hoilo\",\"trans\":\"él\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sei\",\"trans\":\"el Señor Balarāma\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"balarāma\",\"trans\":\"se convirtió\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hoilo\",\"trans\":\"el Señor Nityānanda\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nitāi\",\"trans\":\"que eran humildes y miserables\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"dīna-hīna\",\"trans\":\"todas aquellas almas que fueron\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"jata\",\"trans\":\"por el santo nombre\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"chilo\",\"trans\":\"fueron liberados\",\"sep\":\",        \",\"error\":\"mismatch\"},{\"text\":\"harināme udhārilo\",\"trans\":\"la evidencia de eso\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"tāra śākṣī\",\"trans\":\"los dos pecadores llamados Jagāi y Mādhāi\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"jagāi\",\"trans\":\"-\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"mādhāi\",\"trans\":\"-\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"4\",\"text\":[\"hā hā prabhu nanda-suta,    vṛṣabhānu-sutā-juta,\",\"        karuṇā karaha ei-bāro\",\"narottama-dāsa koy,        nā ṭheliho rāṅgā pāy,\",\"        tomā bine ke āche āmāra\"],\"word_by_word\":[\"**ha ha prabhu** — ¡oh pobre de mí! ¡oh amado Señor!; **nanda-suta** — ¡oh, hijo de Nanda!; **vṛṣabhānu-sutā yuta** — acompañado por la hija de Vṛṣabhānu; **karuṇā karaha** — por favor, sé misericordioso conmigo; **ei-baro** — ahora; **narottama-dāsa koy** — Narottama Dās dice;
