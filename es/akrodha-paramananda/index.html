ānanda rāy\",\"abhimāna-śūnya nitāi nagare beḍāya\"],\"word_by_word\":[\"**akrodha** — libre de ira; **paramānanda** — bienaventuranza suprema; **nityānanda rāy** — Señor Nityananda; **abhimāna** — ego falso; **śūnya** — vacío; **nitāi** — el Señor Nityananda; **nagare** — en las aldeas; **beḍāya** — deambula.\"],\"translation\":[\"La gran personalidad, el Señor Nityānanda Prabhu, está libre de la ira y pleno de éxtasis trascendental. Él recorre todos los pueblos, libre del prestigio falso y la arrogancia.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"akrodha\",\"trans\":\"libre de ira\",\"sep\":\" \"},{\"text\":\"paramānda\",\"trans\":\"bienaventuranza suprema\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nityānanda rāy\",\"trans\":\"Señor Nityananda\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"abhimāna\",\"trans\":\"ego falso\",\"sep\":\"-\"},{\"text\":\"śūnya\",\"trans\":\"vacío\",\"sep\":\" \"},{\"text\":\"nitāi\",\"trans\":\"el Señor Nityananda\",\"sep\":\" \"},{\"text\":\"nagare\",\"trans\":\"en las aldeas\",\"sep\":\" \"},{\"text\":\"beḍāya\",\"trans\":\"deambula\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"adhama patita jīver dvāre dvāre giyā\",\"harināma mahāmantra dena bilāiyā\"],\"word_by_word\":[\"**adhama** — desdichado; **patita** — caído; **jīvera** — de las almas; **dvāre dvāre** — puerta a puerta; **giyā** — habiéndose ido; **harināma mahā-mantra** — el gran canto de los Santos Nombres; **dena** — Él da; **bilāiyā** — distribuir.\"],\"translation\":[\"Va de puerta en puerta a las casas de las almas caídas, distribuyendo liberalmente el *mahāmantra* Hare Kṛṣṇa.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"adhama\",\"trans\":\"desdichado\",\"sep\":\" \"},{\"text\":\"patita\",\"trans\":\"caído\",\"sep\":\" \"},{\"text\":\"jīver\",\"trans\":\"de las almas\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"dvāre dvāre\",\"trans\":\"puerta a puerta\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"giyā\",\"trans\":\"habiéndose ido\",\"sep\":\"\"}],[{\"text\":\"harināma mahāmantra dena\",\"trans\":\"el gran canto de los Santos Nombres\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"bilāiyā\",\"trans\":\"Él da\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"3\",\"text\":[\"jāre dekhe tāre kahe dante tṛṇa kori,\",\"āmāre kiniyā laha bhaja gaurahari\"],\"word_by_word\":[\"**jā’re dekhe** — a quien Él ve; **tā’re kahe** — a ellos les dice; **dante** — en los dientes; **tṛṇa dhari’** — sosteniendo una hierba; **āmāre** — a mí; **kiniyā** — comprar; **laha** — por favor toma; **bhaja** — adorar; **gaurahari** — Señor Gaurahari.\"],\"translation\":[\"Con una paja entre Sus dientes, mendiga de todos aquellos que cruzan Su camino: ‘Adoren al Señor Gaurahari y ustedes me comprarán a Mí’.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"jāre dekhe tāre\",\"trans\":\"a quien Él ve\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kahe dante tṛṇa\",\"trans\":\"a ellos les dice\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kori\",\"trans\":\"en los dientes\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"āmāre kiniyā\",\"trans\":\"sosteniendo una hierba\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"laha\",\"trans\":\"a mí\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bhaja\",\"trans\":\"comprar\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"gaurahari\",\"trans\":\"por favor toma\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"4\",\"text\":[\"eta bali’ nityānanda bhūme goḍi jay\",\"sonāra parvvata jena dhūlāte loṭāy\"],\"word_by_word\":[\"**eta** — así; **bali’** — habiendo dicho; **nityānanda** — el Señor Nityānanda; **bhūme** — en el suelo; **gaḍi’ jāya** — da vueltas; **sonāra** — hecha de oro; **parvata** — la montaña; **jena** — como; **dhūlāte loṭāy** — cayendo en el polvo.\"],\"translation\":[\"Al decir esto, el Señor Nityānanda cae al suelo, pareciendo una montaña dorada que rueda en el polvo.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"eta\",\"trans\":\"así\",\"sep\":\" \"},{\"text\":\"bali\",\"trans\":\"habiendo dicho\",\"sep\":\"’ \"},{\"text\":\"nityānanda\",\"trans\":\"el Señor Nityānanda\",\"sep\":\" \"},{\"text\":\"bhūme\",\"trans\":\"en el suelo\",\"sep\":\" \"},{\"text\":\"goḍi jay\",\"trans\":\"da vueltas\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"sonāra\",\"trans\":\"hecha de oro\",\"sep\":\" \"},{\"text\":\"parvvata\",\"trans\":\"la montaña\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"jena\",\"trans\":\"como\",\"sep\":\" \"},{\"text\":\"dhūlāte loṭāy\",\"trans\":\"cayendo en el polvo\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"5\",\"text\":[\"heno avatāre jāra rati nā janmilo\",\"lochan bole sei pāpī elo āra gelo\"],\"word_by_word\":[\"**hena avatāre** — para tal encarnación; **jāra rati** — cuyo afecto; **nā janmilo** — no se ha producido; **lochana** — Lochana Dās Ṭhākur; **bole** — dice; **sei pāpī** — esa persona pecaminosa; **elo** — viene; **āra** — y; **gela** — va (en repetidos nacimientos y muertes).\"],\"translation\":[\"Lochan Dās dice que esa persona pecaminosa, en quien no ha surgido apego por esa encarnación, va y viene dentro del ciclo de nacimientos y muertes repetidos.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"heno avatāre\",\"trans\":\"para tal encarnación\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"jāra rati\",\"trans\":\"cuyo afecto\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"nā janmilo\",\"trans\":\"no se ha producido\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"lochan\",\"trans\":\"Lochana Dās Ṭhākur\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bole\",\"trans\":\"dice\",\"sep\":\" \"},{\"text\":\"sei pāpī\",\"trans\":\"esa persona pecaminosa\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"elo\",\"trans\":
