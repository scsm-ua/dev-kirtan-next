 mora tā̐hāra charaṇe\"],\"word_by_word\":[\"**yoga-pīṭhopari-sthita** — estando en *y**oga**-**piṭh**a*; **aṣṭa-sakhī** — por las ocho amigas; **subeṣṭita** — rodeadas; **vṛndāraṇye** — en Vṛndāvan; **kadamba-kānane** — en un bosque de *kadamba*; **rādhā-saha** — con Rādhā; **vaṁśī-dhārī** — tocando la flauta; **biśva** — del mundo; **jana** — de las personas; **chitta** — los corazones; **hārī** — encantador; **prāṇa** — vida; **mora** — de mí; **tā̐hāra** — de él; **charaṇe** — a los pies.\"],\"translation\":[\"En un bosquecillo de árboles *kadamba* dentro de la foresta de Vṛndāvan, en el *yoga-pīṭha*, rodeado de las *aṣṭa-sakhīs*, al lado de Śrī Rādhā, Śrī Kṛṣṇa, tocando Su flauta, cautiva a todas las almas del universo. Caigo a Sus pies y le entrego mi vida.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"yoga-pīṭhopari-sthita\",\"trans\":\"estando en *y\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"aṣṭa\",\"trans\":\"**piṭh\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"sakhī-subeṣṭita\",\"trans\":\"por las ocho amigas\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"vṛndāraṇye\",\"trans\":\"rodeadas\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kadamba\",\"trans\":\"en Vṛndāvan\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"kānane\",\"trans\":\"en un bosque de *kadamba*\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"rādhā-saha\",\"trans\":\"con Rādhā\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"vaṁśī-dhārī\",\"trans\":\"tocando la flauta\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"biśva\",\"trans\":\"del mundo\",\"sep\":\"-\"},{\"text\":\"jana\",\"trans\":\"de las personas\",\"sep\":\"-\"},{\"text\":\"chitta\",\"trans\":\"los corazones\",\"sep\":\"-\"},{\"text\":\"hārī\",\"trans\":\"encantador\",\"sep\":\",\"}],[{\"text\":\"prāṇa\",\"trans\":\"vida\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"de mí\",\"sep\":\" \"},{\"text\":\"tā̐hāra\",\"trans\":\"de él\",\"sep\":\" \"},{\"text\":\"charaṇe\",\"trans\":\"a los pies\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"sakhī-ājñāmata kori do̐hāra sevana\",\"pālya-dāsī sadā bhāvi do̐hāra charaṇa\"],\"word_by_word\":[\"**sakhī** — de las *sakhīs*; **ājñā-mata** — seguir la orden; **kori** — hacer; **do̐hāra** — de la pareja divina; **sevana** — servicio; **pālya-dāsī** — una sirvienta; **sadā** — siempre; **bhāvi** — recuerdo; **do̐hāra** — de la pareja divina; **charaṇa** — los pies.\"],\"translation\":[\"Siguiendo las instrucciones de una *sakhī*, me ocupo en el servicio de la Pareja Divina, Śrī Rādhā y Kṛṣṇa, considerándome siempre una sirvienta dependiente a Sus pies de loto.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"sakhī\",\"trans\":\"de las *sakhīs*\",\"sep\":\"-\"},{\"text\":\"ājñāmata kori\",\"trans\":\"seguir la orden\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"do̐hāra\",\"trans\":\"hacer\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sevana\",\"trans\":\"de la pareja divina\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"pālya\",\"trans\":\"servicio\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"dāsī sadā\",\"trans\":\"una sirvienta\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bhāvi\",\"trans\":\"siempre\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"do̐hāra\",\"trans\":\"recuerdo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"charaṇa\",\"trans\":\"de la pareja divina\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"3\",\"text\":[\"kobhu kṛpā kori,    mama hasta dhori’,\",\"        madhura vachana bole\",\"tāmbula loiyā,        khāya dui jane,\",\"        mālā loya kutūhale\"],\"word_by_word\":[\"**kobhu** — ¿cuándo?; **kṛpā** — misericordia; **kori** — otorgar; **mama** — a mí; **hasta** — mano; **dhori’** — sostener; **madhura** — dulce; **vachana** — palabras; **bole** — habla; **tāmbula** — nueces de betel; **loiyā** — aceptar; **khāya** — masticar; **dui jane** — dos personas; **mālā** — guirnalda; **loya** — aceptar; **kutūhale** — con alegría.\"],\"translation\":[\"A veces, siendo bondadosos, Ellos me agarran de la mano y me dicen palabras dulces debido al afecto. Ambos aceptan las nueces betel que les he preparado, las comen, y reciben de mí, con gran deleite, una guirnalda.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"kobhu\",\"trans\":\"¿cuándo?\",\"sep\":\" \"},{\"text\":\"kṛpā\",\"trans\":\"misericordia\",\"sep\":\" \"},{\"text\":\"kori\",\"trans\":\"otorgar\",\"sep\":\",    \"},{\"text\":\"mama\",\"trans\":\"a mí\",\"sep\":\" \"},{\"text\":\"hasta\",\"trans\":\"mano\",\"sep\":\" \"},{\"text\":\"dhori\",\"trans\":\"sostener\",\"sep\":\"’,\"}],[{\"text\":\"madhura\",\"trans\":\"dulce\",\"sep\":\" \"},{\"text\":\"vachana\",\"trans\":\"palabras\",\"sep\":\" \"},{\"text\":\"bole\",\"trans\":\"habla\",\"sep\":\"\"}],[{\"text\":\"tāmbula\",\"trans\":\"nueces de betel\",\"sep\":\" \"},{\"text\":\"loiyā\",\"trans\":\"aceptar\",\"sep\":\",        \"},{\"text\":\"khāya\",\"trans\":\"masticar\",\"sep\":\" \"},{\"text\":\"dui jane\",\"trans\":\"dos personas\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"mālā\",\"trans\":\"guirnalda\",\"sep\":\" \"},{\"text\":\"loya\",\"trans\":\"aceptar\",\"sep\":\" \"},{\"text\":\"kutūhale\",\"trans\":\"con alegría\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"adarśana hoya kokhona ki chole\",\"nā dekhiyā do̐he hiyā mora jvole\"],\"word_by_word\":[\"**adarśana** — sin ver; **hoya** — es; **kokhona** — algunas veces; **ki** — ¿qué?; **chole** — truco; **nā** — no; **dekhiyā** — ver; **do̐he** — la divina pareja; **hiyā** — está; **mora** — de mí; **jvole** — quema.\"],\"translation\":[\"De nuevo, por algún truco, Ellos desaparecen de mi vista. Sin poder ver a Rādhā y Kṛṣṇa, la agonía consume mi corazón.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"adarśana\",\"trans\":\"sin ver\",\"sep\":\" \"},{\"text\":\"hoya\",\"trans\":\"es\",\"sep\":\" \"},{\"text\":\"kokhona\",\"trans\":\"algunas veces\",\"sep\":\" \"},{\"text\":\"ki\",\"trans\":\"¿qué?\",\"sep\":\" \"},{\"text\":\"chole\",\"trans\":\"truco\",\"sep\":\"\"}],[{\"text\":\"nā\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"dekhiyā\",\"trans\":\"ver\",\"sep\":\" \"},{\"text\":\"do̐he\",\"trans\":\"la divina pareja\",\"sep\":\" \"},{\"text\":\"hiyā\",\"trans\":\"está\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"de mí\",\"sep\":\" \"},{\"text\":\"jvole\",\"trans\":\"quema\",\"sep\":\"\"}]]},{\"number\":\"5\",\"text\":[\"jekhāne sekhāne,    thākuka du’ jane,\",\"        āmi to charaṇa-dāsī\",\"milane ānanda,        virahe jātanā,\",\"        sakala samāna bāsi\"],\"word_by_word\":[\"**jekhāne** — dondequiera; **sekhāne** — allá; **thākuka** — pueda estar; **du’ jane** — dos personas; **āmi** — yo; **to charaṇa-dāsī** — las sirvientas de sus pies; **milane** — encontrarse; **ānanda** — bienaventuranza; **virahe** — separación; **jātanā** — tormento; **sakala** — siempre; **samāna** — lo mismo; **bāsi** — permanezco.\"],\"translation\":[\"Dondequiera que Ellos estén, aquí o allá, soy la sirvienta de Sus pies de loto. De un extremo al otro, de la felicidad de la unión a la agonía de la separación, soy Su sirvienta.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"jekhāne\",\"trans\":\"dondequiera\",\"sep\":\" \"},{\"text\":\"sekhāne\",\"trans\":\"allá\",\"sep\":\",    \"},{\"text\":\"thākuka\",\"trans\":\"pueda estar\",\"sep\":\" \"},{\"text\":\"du’ jane\",\"trans\":\"dos personas\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"āmi\",\"trans\":\"yo\",\"sep\":\" \"},{\"text\":\"to charaṇa-dāsī\",\"trans\":\"las sirvientas de sus pies\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"milane\",\"trans\":\"encontrarse\",\"sep\":\" \"},{\"text\":\"ānanda\",\"trans\":\"bienaventuranza\",\"sep\":\",        \"},{\"text\":\"virahe\",\"trans\":\"separación\",\"sep\":\" \"},{\"text\":\"jātanā\",\"trans\":\"tormento\",\"sep\":\",\"}],[{\"text\":\"sakala\",\"trans\":\"siempre\",\"sep\":\" \"},{\"text\":\"samāna\",\"trans\":\"lo mismo\",\"sep\":\" \"},{\"text\":\"bāsi\",\"trans\":\"permanezco\",\"sep\":\"\"}]]},{\"number\":\"6\",\"text\":[\"rādhā-kṛṣṇa prāṇa mor jīvane maraṇe\",\"more rākhi’ māri’ sukhe thākuka du’ jone\"],\"word_by_word\":[\"**rādhā-kṛṣṇa** — Rādhā y Kṛṣṇa; **prāṇa** — vida; **mor** — mía; **jīvane** — en la vida; **maraṇe** — en la muerte; **more** — a mí; **rākhi’** — proteger; **māri’** — matar; **sukhe** — en la felicidad; **thākuka** — permanezca; **du’ jone** — dos personas.\"],\"translation\":[\"Rādhā y Kṛṣṇa son mi vida y alma, en la vida o en la muerte; sea que Ellos me protejan o me quiten la vida. Que Ellos sean por siempre felices.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"rādhā-kṛṣṇa\",\"trans\":\"Rādhā y Kṛṣṇa\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"prāṇa\",\"trans\":\"vida\",\"sep\":\" \"},{\"text\":\"mor\",\"trans\":\"mía\",\"sep\":\" \"},{\"text\":\"jīvane\",\"trans\":\"en la vida\",\"sep\":\" \"},{\"text\":\"maraṇe\",\"trans\":\"en la muerte\",\"sep\":\"\"}],[{\"text\":\"more\",\"trans\":\"a mí\",\"sep\":\" \"},{\"text\":\"rākhi\",\"trans\":\"proteger\",\"sep\":\"’ \"},{\"text\":\"māri\",\"trans\":\"matar\",\"sep\":\"’ \"},{\"text\":\"sukhe\",\"trans\":\"en la felicidad\",\"sep\":\" \"},{\"text\":\"thākuka\",\"trans\":\"permanezca\",\"sep\":\" \"},{\"text\":\"du’ jone\",\"trans\":\"dos personas\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"7\",\"text\":[\"bhakativinoda,        āna nāhi jāne,\",\"        poḍi’ nija-sakhī-pāy\",\"rādhikāra gaṇe        thākiyā satata,\",\"        jugala-charaṇa chāy\"],\"word_by_word\":[\"**bhakativinoda** — Bhakti Vinoda; **āna** — otro; **nāhi** — nunca; **jāne** — sabe; **poḍi’** — caigo; **nija-sakhī** — propia amiga; **pāy** — obtener; **rādhikāra** — de Rādhā; **gaṇe** — en el grupo; **thākiyā** — permanecer; **satata** — siempre; **jugala** — de la divina pareja; **charaṇa** — los pies; **chāy** — deseos.\"],\"translation\":[\"Bhaktivinod no conoce otra cosa. Cayendo a los pies de la *sakhī*, Bhakti Vinod permanece entre las íntimas confidentes de Śrī Rādhā. Los pies de loto de Śrī Rādhā y Kṛṣṇa son el anhelo eterno de Bhakti Vinod.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"bhakativinoda\",\"trans\":\"Bhakti Vinoda\",\"sep\":\",        \"},{\"text\":\"āna\",\"trans\":\"otro\",\"sep\":\" \"},{\"text\":\"nāhi\",\"trans\":\"nunca\",\"sep\":\" \"},{\"text\":\"jāne\",\"trans\":\"sabe\",\"sep\":\",\"}],[{\"text\":\"poḍi\",\"trans\":\"caigo\",\"sep\":\"’ \"},{\"text\":\"nija-sakhī\",\"trans\":\"propia amiga\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"pāy\",\"trans\":\"obtener\",\"sep\":\"\"}],[{\"text\":\"rādhikāra\",\"trans\":\"de Rādhā\",\"sep\":\" \"},{\"text\":\"gaṇe\",\"trans\":\"en el grupo\",\"sep\":\"        \"},{\"text\":\"thākiyā\",\"trans\":\"permanecer\",\"sep\":\" \"},{\"text\":\"satata\",\"trans\":\"siempre\",\"sep\":\",\"}],[{\"text\":\"jugala\",\"trans\":\"de la divina pareja\",\"sep\":\"-\"},{\"text\":\"charaṇa\",\"trans\":\"los pies\",\"sep\":\" \"},{\"text\":\"chāy\",\"trans\":\"deseos\",\"sep\":\"\"}]]}],\"hasWbw\":true,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1f:[\"$\",\"$L27\",null,{\"navMap\":{\"232\":{\"prev\":{\"path\":\"/es/bondhu-gon-shiunoho-vachana-mora/\",\"title\":\"8a. Bondhu-goṇ! śunoho\"},\"next\":{\"path\":\"/es/radhika-charana-padma-sakala-shreyera/\",\"title\":\"Śrī Rādhāṣṭaka, 1\"}}}}]\n28:Td2d,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https:/
