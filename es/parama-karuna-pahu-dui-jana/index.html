"author\":[\"Śrīla Lochan Dās Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"parama karuṇa,        pahū̐ dūi jana,\",\"        nitāi gaurachandra\",\"saba avatāra-        sāra śiromaṇi,\",\"        kevala ānanda-kanda\",\"    (kevala-i ānanda-kanda)\",\"    (nityānanda gaurachandra kevala-i ānanda-kanda)\"],\"word_by_word\":[\"**parama** — suprema; **karuṇa** — misericordia; **pahū̐** — señor; **dui jana** — los dos; **nitāigaurachandra** — el Señor Nityānanda y el Señor Gaurachandra; **saba avatāra** — de todas las encarnaciones; **sāra** — la esencia; **śiromaṇi** — la joya cimera; **kevala** — única; **ānanda-kanda** — fuente de dicha; (**kevala-i** — la única; **ānanda-kanda** — fuente de dicha); (**nityānanda gaurachandra** — Nityānanda y Gaurachandra; **kevala-i** — la única; **ānanda-kanda** — fuente de dicha).\"],\"translation\":[\"El Señor Gaurāṅga y el Señor Nityānanda son los dos Señores más misericordiosos. Ellos son las joyas cimeras de todas las encarnaciones y la única fuente del júbilo extático trascendental. (Ellos son la única fuente de dicha. Nityānanda y Gaurachandra son la única fuente de dicha).\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"parama\",\"trans\":\"suprema\",\"sep\":\" \"},{\"text\":\"karuṇa\",\"trans\":\"misericordia\",\"sep\":\",        \"},{\"text\":\"pahū̐\",\"trans\":\"señor\",\"sep\":\" \"},{\"text\":\"dūi jana\",\"trans\":\"los dos\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"nitāi\",\"trans\":\"el Señor Nityānanda y el Señor Gaurachandra\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"gaurachandra\",\"trans\":\"de todas las encarnaciones\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"saba\",\"trans\":\"la esencia\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"avatāra\",\"trans\":\"la joya cimera\",\"sep\":\"-        \",\"error\":\"mismatch\"},{\"text\":\"sāra\",\"trans\":\"única\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"śiromaṇi\",\"trans\":\"fuente de dicha; (\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"kevala ānanda\",\"trans\":\"la única\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"kanda\",\"trans\":\"fuente de dicha); (\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"(kevala-i\",\"trans\":\"Nityānanda y Gaurachandra\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"ānanda-kanda\",\"trans\":\"la única\",\"sep\":\")\",\"error\":\"mismatch\"}],[{\"text\":\"(nityānanda gaurachandra\",\"trans\":\"fuente de dicha)\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kevala\",\"trans\":\"-\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"i\",\"trans\":\"-\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"ānanda\",\"trans\":\"-\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"kanda\",\"trans\":\"-\",\"sep\":\")\",\"error\":\"mismatch\"}]]},{\"number\":\"2\",\"text\":[\"bhaja bhaja bhāi        chaitanya nitāi\",\"        sudṛḍha viśvāsa kori’\",\"viṣaya chāḍiyā,        se rase majiyā\",\"        mukhe bolo hari hari\",\"    (mukhe bolo gaurahari)\",\"    (viṣay-kathā parihari’    mukhe bolo gaurahari)\",\"    (grāmya-kathā parihari’    mukhe bolo gaurahari)\"],\"word_by_word\":[\"**bhaja bhaja** — tan solo adora, tan solo adora; **bhāi** — ¡oh, hermano!; **chaitanya nitāi** — al Señor Chaitanya y Nityānanda; **sudṛḍha viśvāsa kori’** — teniendo fe firme; **viṣaya** — gratificación sensorial; **chāḍiyā** — renunciar; **se rase** — en esa melosidad de adoración; **majiyā** — absorbente; **mukhe** — con tu boca; **bolo hari hari** — canta ¡Hari! ¡Hari!; (**mukhe** — con tu boca; **bolo** — canta; **gaurahari** — Gaurahari); (**viṣaya-kathā** — conversaciones materialistas; **parihari** — renunciando; **mukhe** — con tu boca; **bolo** — canta; **gaurahari** — Gaurahari); (**gramya-kathā** — conversaciones mundanas; **mukhe** — con tu boca; **bolo** — canta; **gaurahari** — Gaurahari).\"],\"translation\":[\"¡Oh, hermano! Te imploro que adores a Śrī Chaitanya-Nitāi con fe firme. Abandona tu apego a la gratificación de los sentidos y sumérgete en este néctar por medio del canto de los Nombres de Hari.Canta en voz alta, ‘¡Gaurahari!’ Abandona las conversaciones mundanas y canta en voz alta ‘¡Gaurahari!’ Abandona las conversaciones inútiles y canta en voz alta ‘¡Gaurahari!’\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"bhaja bhaja\",\"trans\":\"tan solo adora, tan solo adora\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"bhāi\",\"trans\":\"¡oh, hermano!\",\"sep\":\"        \"},{\"text\":\"chaitanya nitāi\",\"trans\":\"al Señor Chaitanya y Nityānanda\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"sudṛḍha viśvāsa kori\",\"trans\":\"teniendo fe firme\",\"sep\":\"’\",\"error\":\"multi\"}],[{\"text\":\"viṣaya\",\"trans\":\"gratificación sensorial\",\"sep\":\" \"},{\"text\":\"chāḍiyā\",\"trans\":\"renunciar\",\"sep\":\",        \"},{\"text\":\"se rase\",\"trans\":\"en esa melosidad de adoración\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"majiyā\",\"trans\":\"absorbente\",\"sep\":\"\"}],[{\"text\":\"mukhe\",\"trans\":\"con tu boca\",\"sep\":\" \"},{\"text\":\"bolo hari hari\",\"trans\":\"canta ¡Hari! ¡Hari!; (\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"(mukhe\",\"trans\":\"con tu boca\",\"sep\":\" \"},{\"text\":\"bolo\",\"trans\":\"canta\",\"sep\":\" \"},{\"text\":\"gaurahari\",\"trans\":\"Gaurahari); (\",\"sep\":\")\"}],[{\"text\":\"(viṣay-kathā\",\"trans\":\"conversaciones materialistas\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"parihari\",\"trans\":\"renunciando\",\"sep\":\"’    \"},{\"text\":\"mukhe\",\"trans\":\"con tu boca\",\"sep\":\" \"},{\"text\":\"bolo\",\"trans\":\"canta\",\"sep\":\" \"},{\"text\":\"gaurahari\",\"trans\":\"Gaurahari); (\",\"sep\":\")\"}],[{\"text\":\"(grāmya-kathā\",\"trans\":\"conversaciones mundanas\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"parihari\",\"trans\":\"con tu boca\",\"sep\":\"’    \",\"error\":\"mismatch\"},{\"text\":\"mukhe\",\"trans\":\"canta\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bolo\",\"trans\":\"Gaurahari)\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"gaurahari\",\"trans\":\"-\",\"sep\":\")\",\"error\":\"mismatch\"}]]},{\"number\":\"3\",\"text\":[\"dekha ore bhāi,        tri-bhuvane nāi,\",\"        emona dayāla dātā\",\"    (eman dayāl ke vā āchhe)\",\"    (nitāier gaurer mata        eman dayāl ke vā āchhe)\",\"    (mar kheyeo nām prema yāche eman dayāl ke vā āchhe)\",\"paśu pākhī jhure,    pāṣāṇa vidare,\",\"        śuni yā̐ra guṇa-gāthā\"],\"word_by_word\":[\"**dekha** — tan solo mira; **ore bhāi** — ¡oh querido hermano!; **tri-bhuvane** — dentro de los tres mundos; **nai** — no hay; **emona** — como estos; **dayāla dātā** — dadores de misericordia; (**eman** — como estos; **dayāl** — misericordioso; **ke va** — ¿quienes?; **āchhe** — hay); (**nitāier** — de Nitāi; **gaurer** — de Gaura; **mata** — veredicto; **eman** — como estos; **dayāl** — misericordioso; **ke va** — ¿quienes?; **āchhe** — hay); (**mar kheyeo** — golpes y ofensas; **nām** — del nombre; **prema** — amor divino; **yāche** — ora; **eman** — como estos; **dayāl** — misericordioso; **ke va** — ¿quienes?; **āchhe** — hay); **paśu** — los animales; **pakhī** — los pájaros; **jhure** — llorar; **pāṣāṇa** — la piedra; **vidare** — se derrite; **śuni’** — al escuchar; **yā̐ra** — Suyo; **guṇa-gāthā** — glorificación de cualidades.\"],\"translation\":[\"¡Tan solo mira, oh, hermano! No existen en los tres mundos benefactores tan misericordiosos como Ellos. Incluso las aves y los animales derraman lágrimas y las piedras se derriten al escuchar las glorias de Sus cualidades.¿Quién más es tan misericordioso? ¿Quién es tan misericordioso como Nitāi y Gaura? Ellos soportan incluso ser golpeados, y aun así Ellos piden a Sus agresores que acepten el Santo Nombre y amor divino. ¿Quién más es tan misericordioso?\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"dekha\",\"tr
