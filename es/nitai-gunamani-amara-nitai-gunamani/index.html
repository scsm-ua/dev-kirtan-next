"bookId\":\"es\",\"label\":\"Mostrar traducción\",\"song\":{\"meta\":{\"page\":119,\"first_line\":\"nitāi guṇamaṇi āmāra nitāi guṇamaṇi\"},\"title\":[\"Nitāi Guṇa Manī\"],\"word_by_word\":[\"**nitāi** — Nitāi; **guṇa** — cualidades; **manī** — joya.\"],\"author\":[\"Śrīla Lochan Dās Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"nitāi guṇamaṇi āmāra nitāi guṇamaṇi\",\"āniyā premera vanyā bhāsāla avanī\"],\"word_by_word\":[\"**nitāi guṇa-maṇi** — Nitāi, la joya de las buenas cualidades; **āmāra** — nuestro; **nitāi guṇa-maṇi** — Nitāi, la joya de las buenas cualidades; **āniyā** — ha tráido; **premera** — del amor divino; **vanyā** — un torrente; **bhāsāla** — inundado; **avanī** — el mundo.\"],\"translation\":[\"Nitāi, la joya de todas las buenas cualidades, mi Nitāi, la joya de todas las buenas cualidades ha traído un torrente de amor divino que ha inundado al mundo entero.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"nitāi guṇamaṇi āmāra\",\"trans\":\"Nitāi, la joya de las buenas cualidades\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"nitāi\",\"trans\":\"nuestro\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"guṇamaṇi\",\"trans\":\"Nitāi, la joya de las buenas cualidades\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"āniyā\",\"trans\":\"ha tráido\",\"sep\":\" \"},{\"text\":\"premera\",\"trans\":\"del amor divino\",\"sep\":\" \"},{\"text\":\"vanyā\",\"trans\":\"un torrente\",\"sep\":\" \"},{\"text\":\"bhāsāla\",\"trans\":\"inundado\",\"sep\":\" \"},{\"text\":\"avanī\",\"trans\":\"el mundo\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"prema-vanyā laye nitāi āila gauḍa-deśe\",\"ḍubila bhakata-gaṇa dīna-hīna bhāse\"],\"word_by_word\":[\"**prema-vanyā** — un torrente de amor divino; **laye** — trajo; **nitāi** — Nitāi; **āila** — llegó; **gauḍa-deśe** — la tierra de Gauḍa; **ḍubila** — inmerso; **bhakata-gaṇa** — los devotos; **dīna-hīna** — pobres y desafortunados; **bhāse** — flotan.\"],\"translation\":[\"Nitāi trajo una inundación de amor divino a la tierra de Gauḍa. Los devotos se sumergieron en ella, pero los desafortunados flotaron en su superficie.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"prema-vanyā\",\"trans\":\"un torrente de amor divino\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"laye\",\"trans\":\"trajo\",\"sep\":\" \"},{\"text\":\"nitāi\",\"trans\":\"Nitāi\",\"sep\":\" \"},{\"text\":\"āila\",\"trans\":\"llegó\",\"sep\":\" \"},{\"text\":\"gauḍa-deśe\",\"trans\":\"la tierra de Gauḍa\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"ḍubila\",\"trans\":\"inmerso\",\"sep\":\" \"},{\"text\":\"bhakata-gaṇa\",\"trans\":\"los devotos\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"dīna-hīna\",\"trans\":\"pobres y desafortunados\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"bhāse\",\"trans\":\"flotan\",\"sep\":\"\"}]]},{\"number\":\"3\",\"text\":[\"dīna-hīna patita pāmara nāhi bāchhe\",\"brahmāra durlabha prema sabākāre yāche\"],\"word_by_word\":[\"**dīna-hīna** — pobrey bajo; **patita** — caído; **pāmara** — desamparado; **nāhi** — no; **bāchhe** — elegido; **brahmāra** — al Señor Brahmā; **durlabha** — raro; **prema** — amor divino; **sabākāre** — a todos; **yāche** — orar.\"],\"translation\":[\"Los pecadores, desafortunados y caídos no deseaban este amor divino, el cual es difícil incluso para Brahmā de obtener, sin embargo Nitāi les rogó que lo aceptaran.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"dīna-hīna\",\"trans\":\"pobrey bajo\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"patita\",\"trans\":\"caído\",\"sep\":\" \"},{\"text\":\"pāmara\",\"trans\":\"desamparado\",\"sep\":\" \"},{\"text\":\"nāhi\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"bāchhe\",\"trans\":\"elegido\",\"sep\":\"\"}],[{\"text\":\"brahmāra\",\"trans\":\"al Señor Brahmā\",\"sep\":\" \"},{\"text\":\"durlabha\",\"trans\":\"raro\",\"sep\":\" \"},{\"text\":\"prema\",\"trans\":\"amor divino\",\"sep\":\" \"},{\"text\":\"sabākāre\",\"trans\":\"a todos\",\"sep\":\" \"},{\"text\":\"yāche\",\"trans\":\"orar\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"ābaddha karuṇā-sindhu kāṭiyā muhāna\",\"ghare ghare bule prema-amiyāra vāna\"],\"word_by_word\":[\"**ābaddha** — sellado; **karuṇā-sindhu** — océano de misericordia; **kāṭiyā** — cortar; **muhāna** — canal; **ghare ghare** — a cada casa; **bule** — fue; **prema-amiyāra** — del néctar del amor divino; **vāna** — fluyó.\"],\"translation\":[\"Nitāi cortó un canal en el sellado océano de misericordia y una inundación de divino amor nectáreo llegó a cada casa.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"ābaddha\",\"trans\":\"sellado\",\"sep\":\" \"},{\"text\":\"karuṇā-sindhu\",\"trans\":\"océano de misericordia\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"kāṭiyā\",\"trans\":\"cortar\",\"sep\":\" \"},{\"text\":\"muhāna\",\"trans\":\"canal\",\"sep\":\"\"}],[{\"text\":\"ghare ghare\",\"trans\":\"a cada casa\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"bule\",\"trans\":\"fue\",\"sep\":\" \"},{\"text\":\"prema-amiyāra\",\"trans\":\"del néctar del amor divino\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"vāna\",\"trans\":\"fluyó\",\"sep\":\"\"}]]},{\"number\":\"5\",\"text\":[\"lochan bale hena nitāi yebā nā bhajila\",\"jāniyā śuniyā sei ātma-ghātī haila\"],\"word_by_word\":[\"**lochan** — Lochan Dās; **bale** — dice; **hena nitāi** — tal Nitāi; **yebā nā** — quien no; **bhajila** — glorificado; **jāniyā** — sabiendo; **śuniyā** — por escuchar; **sei** — eso; **ātma-ghātī** — suicidio; **haila** — ocurre.\"],\"translation\":[\"Lochan Dās dice “Quienquiera que no haya adorado a Nitāi conscientemente comete suicidio”.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"lochan\",\"trans\":\"Lochan Dās\",\"sep\":\" \"},{\"text\":\"bale\",\"trans\":\"dice\",\"sep\":\" \"},{\"text\":\"hena nitāi\",\"trans\":\"t
