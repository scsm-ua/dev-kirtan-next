! Tus pasatiempos en Kolādwīp Dhām soninterminables.\"],\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"jaya\",\"trans\":\"toda gloria\",\"sep\":\" \"},{\"text\":\"jaya\",\"trans\":\"toda gloria\",\"sep\":\" \"},{\"text\":\"gurudeva\",\"trans\":\"Śrīla Gurudev\",\"sep\":\" \"},{\"text\":\"āchārya\",\"trans\":\"el *āchārya* (maestro ejemplar)\",\"sep\":\" \"},{\"text\":\"nirmala\",\"trans\":\"inmaculado, sin mancha\",\"sep\":\"\"}],[{\"text\":\"koladvīpe\",\"trans\":\"en Koladwīp\",\"sep\":\" \"},{\"text\":\"mājhe\",\"trans\":\"en medio, a través\",\"sep\":\" \"},{\"text\":\"tomār\",\"trans\":\"tus\",\"sep\":\" \"},{\"text\":\"līlā\",\"trans\":\"pasatiempos\",\"sep\":\" \"},{\"text\":\"avirala\",\"trans\":\"sin fin\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"tumi bhakti nirmal tomār karuṇā nirmala\",\"tomār mato guru pāoyā bhuvane virala\"],\"word_by_word\":[\"**tumi** — tú eres; **bhakti nirmal** — Bhakti Nirmal; **tomār** — tuya; **karuṇā** — compasión, misericordia; **nirmala** — sin mancha, puro; **tomār** — tuya; **mato** — como; **guru** — Guru; **pāoyā** — encontrar; **bhuvane** — en este mundo; **virala** — raramente.\"],\"translation\":[\"Tú eres “Bhakti Nirmal” (eres llamado así porque estás dotado de devoción pura) y tu compasión es pura. Obtener un Guru como tú es muy raro en este mundo.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"tumi\",\"trans\":\"tú eres\",\"sep\":\" \"},{\"text\":\"bhakti nirmal\",\"trans\":\"Bhakti Nirmal\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"tomār\",\"trans\":\"tuya\",\"sep\":\" \"},{\"text\":\"karuṇā\",\"trans\":\"compasión, misericordia\",\"sep\":\" \"},{\"text\":\"nirmala\",\"trans\":\"sin mancha, puro\",\"sep\":\"\"}],[{\"text\":\"tomār\",\"trans\":\"tuya\",\"sep\":\" \"},{\"text\":\"mato\",\"trans\":\"como\",\"sep\":\" \"},{\"text\":\"guru\",\"trans\":\"Guru\",\"sep\":\" \"},{\"text\":\"pāoyā\",\"trans\":\"encontrar\",\"sep\":\" \"},{\"text\":\"bhuvane\",\"trans\":\"en este mundo\",\"sep\":\" \"},{\"text\":\"virala\",\"trans\":\"raramente\",\"sep\":\"\"}]]},{\"number\":\"3\",\"text\":[\"tumi dayāl tumi mukti tumi karuṇā-maya\",\"goloka mājhāre tomāra mahimā ye gāya\"],\"word_by_word\":[\"**tumi** — tú (eres); **dayāl** — misericordioso; **tumi** — tú (das); **mukti** — liberación; **tumi** — tú (eres); **karuṇā-maya** — compasivo en extremo; **goloka** — Goloka; **mājhāre** — dentro de; **tomāra** — tuyas; **mahimā** — glorias; **ye** — esas; **gāya** — son cantadas.\"],\"translation\":[\"Eres misericordioso, otorgas liberación y eres compasivo. Tus glorias son cantadas en todo Goloka.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"tumi\",\"trans\":\"tú (eres)\",\"sep\":\" \"},{\"text\":\"dayāl\",\"trans\":\"misericordioso\",\"sep\":\" \"},{\"text\":\"tumi\",\"trans\":\"tú (das)\",\"sep\":\" \"},{\"text\":\"mukti\",\"trans\":\"liberación\",\"sep\":\" \"},{\"text\":\"tumi\",\"trans\":\"tú (eres)\",\"sep\":\" \"},{\"text\":\"karuṇā-maya\",\"trans\":\"compasivo en extremo\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"goloka\",\"trans\":\"Goloka\",\"sep\":\" \"},{\"text\":\"mājhāre\",\"trans\":\"dentro de\",\"sep\":\" \"},{\"text\":\"tomāra\",\"trans\":\"tuyas\",\"sep\":\" \"},{\"text\":\"mahimā\",\"trans\":\"glorias\",\"sep\":\" \"},{\"text\":\"ye\",\"trans\":\"esas\",\"sep\":\" \"},{\"text\":\"gāya\",\"trans\":\"son cantadas\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"guru-kṛpāy tumi karo āsana alaṅkṛta\",\"adhama janere kṛpā karo avirata\"],\"word_by_word\":[\"**guru-kṛpāy** — por la gracia de Śrī Guru; **tumi** — tú; **karo** — haces; **āsana** — el asiento, silla; **alaṅkṛta** — adornado; **adhama** — caídas; **janere** — almas, personas; **kṛpā** — misericordia; **karo avirata** — haces continuamente.\"],\"translation\":[\"Por la gracia de Śrī Guru, estás adornando el asiento del Āchārya y continuamente otorgas misericordia a las almas caídas.\"],\"isWbwInlineModeAvailable\":fal
