trans\":\"el encuentro de la pareja\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"ārati\",\"trans\":\"ceremonia\",\"sep\":\" \"},{\"text\":\"koroye\",\"trans\":\"hago\",\"sep\":\" \"},{\"text\":\"lalitādi\",\"trans\":\"encabezadas por Lalitā\",\"sep\":\" \"},{\"text\":\"sakhī-goṇ\",\"trans\":\"las *gopīs*\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"2\",\"text\":[\"madana-mohana rūpa tri bhaṅga-sundara\",\"pītāmbara śikhi-pucha-chūḍā-manohara\"],\"word_by_word\":[\"**madana** — Kamadeva (Cupido); **mohana** — encantador; **rūpa** — forma; **tri bhaṅga** — curvado en tres partes; **sundara** — hermoso; **pītāmbara** — vestimentas amarillas; **śikhi-pucha-chūḍā** — corona de pluma de pavoreal; **manohara** — encantador.\"],\"translation\":[\"Kṛṣṇa es quien atrae a Cupido. Su hermosa forma se curva en tres partes de Su cuerpo. Viste ropas de color amarillo y lleva una encantadora corona de plumas de pavoreal.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"madana\",\"trans\":\"Kamadeva (Cupido)\",\"sep\":\"-\"},{\"text\":\"mohana\",\"trans\":\"encantador\",\"sep\":\" \"},{\"text\":\"rūpa\",\"trans\":\"forma\",\"sep\":\" \"},{\"text\":\"tri bhaṅga\",\"trans\":\"curvado en tres partes\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"sundara\",\"trans\":\"hermoso\",\"sep\":\"\"}],[{\"text\":\"pītāmbara\",\"trans\":\"vestimentas amarillas\",\"sep\":\" \"},{\"text\":\"śikhi-pucha-chūḍā\",\"trans\":\"corona de pluma de pavoreal\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"manohara\",\"trans\":\"encantador\",\"sep\":\"\"}]]},{\"number\":\"3\",\"text\":[\"lalita-mādhava-bāme vṛṣabhānu-kanyā\",\"nīla-basanā gaurī rūpe guṇe dhanyā\"],\"word_by_word\":[\"**lalita** — encantador; **mādhava** — Kṛṣṇa; **bāme** — a la izquierda; **vṛṣabhānu-kanyā** — hija de Vṛṣabhānu; **nīla** — azul; **basanā** — vestimentas; **gaurī** — justo; **rūpe** — forma; **guṇe** — de virtudes; **dhanyā** — glorioso.\"],\"translation\":[\"La hija del Rey Vṛṣabhānu, Śrīmatī Rādhikā, de hermosa tez, vestida con ropas de color azul y con Sus gloriosas virtudes, se encuentra a la izquierda del encantador Señor Mādhava.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"lalita\",\"trans\":\"encantador\",\"sep\":\"-\"},{\"text\":\"mādhava\",\"trans\":\"Kṛṣṇa\",\"sep\":\"-\"},{\"text\":\"bāme\",\"trans\":\"a la izquierda\",\"sep\":\" \"},{\"text\":\"vṛṣabhānu-kanyā\",\"trans\":\"hija de Vṛṣabhānu\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"nīla\",\"trans\":\"azul\",\"sep\":\"-\"},{\"text\":\"basanā\",\"trans\":\"vestimentas\",\"sep\":\" \"},{\"text\":\"gaurī\",\"trans\":\"justo\",\"sep\":\" \"},{\"text\":\"rūpe\",\"trans\":\"forma\",\"sep\":\" \"},{\"text\":\"guṇe\",\"trans\":\"de virtudes\",\"sep\":\" \"},{\"text\":\"dhanyā\",\"trans\":\"glorioso\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"nānā-bidha alaṅkāra kore jhalamala\",\"hari-mano-bimohana vadana ujvala\"],\"word_by_word\":[\"**nānā-bidha** — varios; **alaṅkāra** — ornamentos; **kore** — hacer; **jhalamala** — refulgencia; **hari-mano-bimohana** — encanta el corazón de Kṛṣṇa; **vadana** — cara; **ujvala** — esplendor.\"],\"translation\":[\"El brillo de Sus diversos adornos y la refulgencia de Su cara cautivan el corazón del Señor Kṛṣṇa.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"nānā-bidha\",\"trans\":\"varios\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"alaṅkāra\",\"trans\":\"ornamentos\",\"sep\":\" \"},{\"text\":\"kore\",\"trans\":\"hacer\",\"sep\":\" \"},{\"text\":\"jhalamala\",\"trans\":\"refulgencia\",\"sep\":\"\"}],[{\"text\":\"hari-mano-bimohana\",\"trans\":\"encanta el corazón de Kṛṣṇa\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"vadana\",\"trans\":\"cara\",\"sep\":\" \"},{\"text\":\"ujvala\",\"trans\":\"esplendor\",\"sep\":\"\"}]]},{\"number\":\"5\",\"text\":[\"viśākhādi sakhī-goṇ nānā rāge gāya\",\"priya-narma-sakhī jata chāmāra ḍhulāya\"],\"word_by_word\":[\"**viśākhādi** — encabezadas por Viśākha; **sakhī-goṇ** — las *gopīs*; **nānā** — varios; **rāge** — *ragās*; **gāya** — cantando; **priya-narma-sakhī** — queridas amigas alegres; **jata** — las cuales; **chāmāra** — abaníco; **ḍhulāya** — ondear.\"],\"translation\":[\"Viśākhā y las otras jóvenes cantan, con diversas tonadas y humores, mientras que las íntimas y juguetonas amigas de Kṛṣṇa abanican a la Pareja divina.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"viśākhādi\",\"trans\":\"encabezadas por Viśākha\",\"sep\":\" \"},{\"text\":\"sakhī-goṇ\",\"trans\":\"las *gopīs*\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"nānā\",\"trans\":\"varios\",\"sep\":\" \"},{\"text\":\"rāge\",\"trans\":\"*ragās*\",\"sep\":\" \"},{\"text\":\"gāya\",\"trans\":\"cantando\",\"sep\":\"\"}],[{\"text\":\"priya-narma-sakhī\",\"trans\":\"queridas amigas alegres\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"jata\",\"trans\":\"las cuales\",\"sep\":\" \"},{\"text\":\"chāmāra\",\"trans\":\"abaníco\",\"sep\":\" \"},{\"text\":\"ḍhulāya\",\"trans\":\"ondear\",\"sep\":\"\"}]]},{\"number\":\"6\",\"text\":[\"śrī-rādhā-mādhava-pada-sarasija-āśe\",\"bhakativinoda sakhī-pade sukhe bhāse\"],\"word_by_word\":[\"**śrī-rādhā-mādhava** — de Śrī Śrī Rādhā Kṛṣṇa; **pada** — pies; **sarasija** — loto; **āśe** — esperanza; **bhakativinoda** — Bhakti Vinod; **sakhī-pade** — a los pies de las *sakh**ī*; **sukhe** — en la felicidad; **bhāse** — flota.\"],\"translation\":[\"Anhelando alcanzar los pies de loto de Śrī Śrī Rādhā Kṛṣṇa, Bhakti Vinod flota en la felicidad, a los pies de las *gopīs*.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"śrī-rādhā-mādhava\",\"trans\":\"de Śrī Śrī Rādhā Kṛṣṇa\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"pada\",\"trans\":\"pies\",\"sep\":\"-\"},{\"text\":\"sarasija\",\"trans\":\"loto\",\"sep\":\"-\"},{\"text\":\"āśe\",\"trans\":\"esperanza\",\"sep\":\"\"}],
