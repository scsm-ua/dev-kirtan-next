pīnāth,    mama\",\"trans\":\"¡oh, Señor de las *gopīs*!\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nivedana śuno\",\"trans\":\"mi pedido\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"viṣoyī\",\"trans\":\"por favor escucha\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"durjana\",\"trans\":\"soy un gratificador de los sentidos\",\"sep\":\",        \",\"error\":\"mismatch\"},{\"text\":\"sadā\",\"trans\":\"y un materialista perverso\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kāma\",\"trans\":\"siempre\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"rata\",\"trans\":\"adicto a los deseos mundanos\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"kichu nāhi\",\"trans\":\"en lo más mínimo\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"mora\",\"trans\":\"mi\",\"sep\":\" \"},{\"text\":\"guṇa\",\"trans\":\"buenas cualidades\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"gopīnāth,    āmāra bharasā tumi\",\"tomāra charaṇe,        loinu śaraṇa,\",\"    tomāra kiṅkoro āmi\"],\"word_by_word\":[\"**gopī-nātha** — ¡oh, Señor de las *gopīs*!; **āmāra** — mi; **bharasā** — única esperanza; **tumi** — Tú eres; **tomāra charaṇe** — a Tus pies de loto; **loinu śaraṇa** — me he refugiado; **tomāra** — Tu; **kiṅkora** — sirviente; **āmi** — yo.\"],\"translation\":[\"¡Oh, Gopīnāth! Eres mi única esperanza, y por eso me he refugiado a Tus pies de loto. Ahora soy Tu sirviente eterno.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gopīnāth,    āmāra\",\"trans\":\"¡oh, Señor de las *gopīs*!\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bharasā\",\"trans\":\"mi\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"tumi\",\"trans\":\"única esperanza\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"tomāra\",\"trans\":\"Tú eres\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"charaṇe,        loinu\",\"trans\":\"a Tus pies de loto\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"śaraṇa\",\"trans\":\"me he refugiado\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"tomāra\",\"trans\":\"Tu\",\"sep\":\" \"},{\"text\":\"kiṅkoro\",\"trans\":\"sirviente\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"āmi\",\"trans\":\"yo\",\"sep\":\"\"}]]},{\"number\":\"3\",\"text\":[\"gopīnāth,    kemone śodhive more\",\"nā jāni bhakati,        karme jaḍamati,\",\"    poḍechi saṁsāra ghore\"],\"word_by_word\":[\"**gopī-nātha** — ¡oh, Señor de las *gopīs*!; **kemone** — ¿cómo?; **śodhive** — será purificado; **more** — yo; **nā jāni** — no sé; **bhakati** — devoción; **karme** — en el trabajo fruitivo; **jaḍa-mati** — mi mente materialista; **poḍechi** — he caído; **saṁsāra-ghore** — a esta oscura y peligrosa existencia mundana.\"],\"translation\":[\"¡Oh, Gopīnāth! ¿Cómo me purificarás? No sé lo que es devoción, y mi mente mundana está absorta en el trabajo fruitivo. He caído dentro de esta oscura y peligrosa existencia material.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gopīnāth,    kemone\",\"trans\":\"¡oh, Señor de las *gopīs*!\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"śodhive\",\"trans\":\"¿cómo?\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"more\",\"trans\":\"será purificado\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"nā\",\"trans\":\"yo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"jāni bhakati\",\"trans\":\"no sé\",\"sep\":\",        \",\"error\":\"mismatch\"},{\"text\":\"karme\",\"trans\":\"devoción\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"jaḍamati\",\"trans\":\"en el trabajo fruitivo\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"poḍechi saṁsāra\",\"trans\":\"mi mente materialista\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"ghore\",\"trans\":\"he caído\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"4\",\"text\":[\"gopīnāth,    sakali tomāra māyā\",\"nāhi mama bolo,        jñāna sunirmala,\",\"    svādhīna nahe e kāyā\"],\"word_by_word\":[\"**gopī-nātha** — ¡oh, Señor de las *gopīs*!; **sakali** — todo aquí; **tomāra** — es Tu; **māyā** — energía ilusoria; **nāhimama** — no tengo ninguna; **bala** — fuerza; **jñāna** — o conocimiento; **sunirmala** — pura y trascendental; **svādhīna nāhe** — no es independiente del control de la naturaleza material; **e kāya** — este cuerpo mío.\"],\"translation\":[\"¡Oh, Gopīnāth! Todo lo que aquí hay es Tu energía ilusoria. No tengo fuerza ni conocimiento trascendental alguno, y mi cuerpo ni es independiente ni está libre del control de la naturaleza material.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gopīnāth,    sakali\",\"trans\":\"¡oh, Señor de las *gopīs*!\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"tomāra\",\"trans\":\"todo aquí\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"māyā\",\"trans\":\"es Tu\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"nāhi\",\"trans\":\"energía ilusoria\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"mama\",\"trans\":\"no tengo ninguna\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bolo\",\"trans\":\"fuerza\",\"sep\":\",        \",\"error\":\"mismatch\"},{\"text\":\"jñāna\",\"trans\":\"o conocimiento\",\"sep\":\" \"},{\"text\":\"sunirmala\",\"trans\":\"pura y trascendental\",\"sep\":\",\"}],[{\"text\":\"svādhīna nahe\",\"trans\":\"no es independiente del control de la naturaleza material\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"e kāyā\",\"trans\":\"este cuerpo mío\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"5\",\"text\":[\"gopīnāth,    niyata charaṇe sthāna\",\"māge e pāmara,        kā̐diyā kā̐diyā,\",\"    korohe koruṇā dāna\"],\"word_by_word\":[\"**gopī-nātha** — ¡oh, Señor de las *gopīs*!; **niyata** — eterno; **charaṇe** — a Tus pies; **sthāna** — un lugar; **māge** — ruega; **e pāmara** — este pecador; **kā̐diyā kā̐diyā** — que está llorando y llorando; **korohe** — ¡oh!, por favor otorga; **karuṇā dāna** — el regalo de Tu misericordia.\"],\"translation\":[\"¡Oh, Gopīnāth! Este pecador, quien llora constantemente, implora un lugar eterno a Tus divinos pies. Por favor, concédele Tu misericordia.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gopīnāth,    niyata\",\"trans\":\"¡oh, Señor de las *gopīs*!\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"charaṇe\",\"trans\":\"eterno\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sthāna\",\"trans\":\"a Tus pies\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"māge\",\"trans\":\"un lugar\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"e\",\"trans\":\"ruega\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"pāmara,        kā̐diyā\",\"trans\":\"este pecador\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kā̐diyā\",\"trans\":\"que está llorando y llorando\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"korohe\",\"trans\":\"¡oh!, por favor otorga\",\"sep\":\" \"},{\"text\":\"koruṇā dāna\",\"trans\":\"el regalo de Tu misericordia\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"6\",\"text\":[\"gopīnāth,    tumi to sakali pāro\",\"durjane tārite,        tomāra śakati,\",\"    ke āche pāpīra āro\"],\"word_by_word\":[\"**gopī-nātha** — ¡oh, Señor de las *gopīs*!; **tumi** — Tú; **to’** — ciertamente; **sakali pāro** — son capaces de hacer cualquier cosa; **durjane** — todos los pecadores; **tārite** — entregar; **tomāra** — Tu; **śakati** — poder; **ke āche** — ¿quién está ahí?; **pāpīra āro** — más pecador que yo.\"],\"translation\":[\"¡Oh, Gopīnāth! Eres capaz de hacer cualquier cosa, y por lo tanto, tienes el poder de redimir a todos los pecadores. ¿Quién puede ser más pecador que yo?\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gopīnāth,    tumi\",\"trans\":\"¡oh, Señor de las *gopīs*!\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"to\",\"trans\":\"Tú\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sakali\",\"trans\":\"ciertamente\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"pāro\",\"trans\":\"son capaces de hacer cualquier cosa\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"durjane\",\"trans\":\"todos los pecadores\",\"sep\":\" \"},{\"text\":\"tārite\",\"trans\":\"entregar\",\"sep\":\",        \"},{\"text\":\"tomāra\",\"trans\":\"Tu\",\"sep\":\" \"},{\"text\":\"śakati\",\"trans\":\"poder\",\"sep\":\",\"}],[{\"text\":\"ke āche\",\"trans\":\"¿quién está ahí?\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"pāpīra āro\",\"trans\":\"más pecador que yo\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"7\",\"text\":[\"gopīnāth,    tumi kṛpā-pārābāra\",\"jīvera kāraṇe,        āsiyā prapañche,\",\"    līlā koile suvistāra\"],\"word_by_word\":[\"**gopī-nātha** — ¡oh, Señor de las *gopīs*!; **tumi** — Tú eres; **kṛpā-pārābāra** — el océano de misericordia; **jīverakāraṇe** — por el bien de las almas caídas; **āsiyā** — habiendo venido; **prapañche** — a este mundo fenoménico; **līlā** — Tus pasatiempos divinos; **koile suvistara** — te expandes.\"],\"translation\":[\"¡Oh, Gopīnāth! Eres el océano de la misericordia. Habiendo entrado en este mundo fenoménico, manifiestas Tus pasatiempos divinos para el bien de las almas caídas.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gopīnāth,    tumi\",\"trans\":\"¡oh, Señor de las *gopīs*!\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kṛpā\",\"trans\":\"Tú eres\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"pārābāra\",\"trans\":\"el océano de misericordia\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"jīvera\",\"trans\":\"por el bien de las almas caídas\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kāraṇe\",\"trans\":\"habiendo venido\",\"sep\":\",        \",\"error\":\"mismatch\"},{\"text\":\"āsiyā\",\"trans\":\"a este mundo fenoménico\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"prapañche\",\"trans\":\"Tus pasatiempos divinos\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"t
