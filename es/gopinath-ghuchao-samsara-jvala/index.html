ama-maraṇa-mālā\"],\"word_by_word\":[\"**gopī-nātha** — ¡oh, Señor de las *gopīs*!; **ghuchāo** — por favor quita; **saṁsāra jvālā** — el tormento de la existencia mundana; **avidyā-jātanā** — el dolor de la ignorancia; **āro nāhi sahe** — ya no puedo tolerar; **janama-maraṇa** — de nacimientos y muertes; **mālā** — la sucesión repetida.\"],\"translation\":[\"¡Oh, Gopīnāth! Por favor, erradica el tormento de la existencia material. Ya no puedo tolerar más el dolor de la ignorancia ni la repetida sucesión de nacimientos y muertes.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gopīnāth,    ghuchāo\",\"trans\":\"¡oh, Señor de las *gopīs*!\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"saṁsāra\",\"trans\":\"por favor quita\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"jvālā\",\"trans\":\"el tormento de la existencia mundana\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"avidyā-jātanā\",\"trans\":\"el dolor de la ignorancia\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"āro nāhi sahe\",\"trans\":\"ya no puedo tolerar\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"janama-maraṇa\",\"trans\":\"de nacimientos y muertes\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"mālā\",\"trans\":\"la sucesión repetida\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"gopīnāth,    āmi to’ kāmera dāsa\",\"viṣaya-vāsanā,        jāgiche hṛdoye,\",\"    phāṅdiche karama phāṅsa\"],\"word_by_word\":[\"**gopī-nātha** — ¡oh, Señor de las *gopīs*!; **āmi** — yo; **to’** — soy ciertamente; **kāmera dāsa** — un sirviente de la lujuria; **viṣaya-vāsanā** — deseos mundanos; **jāgiche hṛdoye** — están despertando en mi corazón; **phāṅdiche** — está apretando; **karama-phāṅsa** — la soga del trabajo fruitivo.\"],\"translation\":[\"¡Oh, Gopīnāth! En verdad, soy un sirviente de la lujuria. Los deseos mundanos se han despertado en mi corazón, y así, la soga del trabajo fruitivo comienza a apretarme.\"],\"isWbwInlineModeAvailable\":false,\"inline_
