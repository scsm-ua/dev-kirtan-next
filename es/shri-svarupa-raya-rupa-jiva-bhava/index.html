wāmī Mahārāj\"],\"verses\":[{\"text\":[\"śrī-svarūpa-rāya-rūpa-jīva-bhāva-sambharaṁ\",\"varṇa-dharma-nirviśeṣa-sarvaloka-nistaram\",\"śrī-sarasvatī-priyañ cha bhakti-sundarāśrayaṁ\",\"śrīdharaṁ namāmi bhakti-rakṣakaṁ jagad-gurum\"],\"word_by_word\":[\"**śrī-svarūpa** — Śrī Svarūp Damodār; **rāya** — Rāmānanda Rāy; **rūpa** — Rūpa Goswāmī; **jīva** — Jīva Goswāmī; **bhāva** — humor; **sambharaṁ** — en conjunto; **varṇa-dharma** — casta y religión; **nirviśeṣa** — sin variedad; **sarva-loka** — todas las personas; **nistaram** — liberar; **śrī-sarasvatī-priyañ** — el querido de Śrīla Saraswatī; **cha** — y; **bhakti-sundara-aśrayaṁ** — el refugio de Śrīla Bhakti Sundar; **śrīdharaṁ** — a Śrīdhār; **namāmi** — ofrezco obediencias; **bhakti-rakṣakaṁ** — Bhakti Rakṣak; **jagad-gurum** — el guru del universo.\"],\"translation\":[\"Ofrezco mis humildes reverencias al Guru del universo, Oṁ Viṣṇupād Śrī Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj, quien porta la concepción de Śrī Svarūp Damodār, Śrī Rāmānanda Rāy, Śrī Rūpa Goswāmī y Śrī Jīva Goswāmī. Él libera a todos sin importar casta o religión. Es el más querido por Śrīla Bhakti Siddhānta Saraswatī Goswāmī Prabhupād, es la morada del Amoroso Servicio Trascendental y único refugio de Śrī Bhakti Sundar Govinda.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"śrī-svarūpa\",\"trans\":\"Śrī Svarūp Damodār\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"rāya\",\"trans\":\"Rāmānanda Rāy\",\"sep\":\"-\"},{\"text\":\"rūpa\",\"trans\":\"Rūpa Goswāmī\",\"sep\":\"-\"},{\"text\":\"jīva\",\"trans\":\"Jīva Goswāmī\",\"sep\":\"-\"},{\"text\":\"bhāva\",\"trans\":\"humor\",\"sep\":\"-\"},{\"text\":\"sambharaṁ\",\"trans\":\"en conjunto\",\"sep\":\"\"}],[{\"text\":\"varṇa-dharma\",\"trans\":\"casta y religión\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"nirviśeṣa\",\"trans\":\"sin variedad\",\"sep\":\"-\"},{\"text\":\"sarvaloka-nistaram\",\"trans\":\"todas las personas\",\"sep\":\"\",\"e
