nāth,    paḍechi māyāra phere\",\"dhana, dārā, suta,    ghireche āmāre,\",\"    kāmete rekheche jere\"],\"word_by_word\":[\"**gopī-nātha** — ¡oh, Señor de las *gopīs*!; **paḍechi** — he caído; **māyāra phere** — a los peligros de la ilusión material; **dhana** — riqueza; **dāra** — esposa; **suta** — e hijos; **ghireche āmāre** — me han rodeado; **kāmete** — absorto en la lujuria; **rekhechejere** — me está consumiendo.\"],\"translation\":[\"¡Oh, Gopīnāth! Soy presa de los peligros de la ilusión material. Estoy rodeado de riquezas, esposa e hijos, y la lujuria me ha consumido.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gopīnāth,    paḍechi\",\"trans\":\"¡oh, Señor de las *gopīs*!\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"māyāra\",\"trans\":\"he caído\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"phere\",\"trans\":\"a los peligros de la ilusión material\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"dhana\",\"trans\":\"riqueza\",\"sep\":\", \"},{\"text\":\"dārā\",\"trans\":\"esposa\",\"sep\":\", \",\"error\":\"mismatch\"},{\"text\":\"suta\",\"trans\":\"e hijos\",\"sep\":\",    \"},{\"text\":\"ghireche āmāre\",\"trans\":\"me han rodeado\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"kāmete\",\"trans\":\"absorto en la lujuria\",\"sep\":\" \"},{\"text\":\"rekheche\",\"trans\":\"me está consumiendo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"jere\",\"trans\":\"-\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"3\",\"text\":[\"gopīnāth,    mana ye pāgala mora\",\"nā māne śāsana,        sadā achetana,\",\"    viṣaye royeche ghora\"],\"word_by_word\":[\"**gopī-nātha** — ¡oh, Señor de las *gopīs*!; **mana** — la mente; **ye** — tal; **pāgala** — está loco; **mora** — mi; **nāmāne** — no le importa; **śāsana** — para cualquier autoridad; **sadā achetana** — siempre sin sentido; **viṣaye** — en asuntos mundanos; **ro’yeche** — ha permanecido; **ghora** — el pozo oscuro.\"],\"translation\":[\"¡Oh, Gopīnāth! Mi mente está enloquecida y no acepta autoridad alguna. Siempre es insensata y permanece en el oscuro pozo de los asuntos mundanos.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gopīnāth,    mana\",\"trans\":\"¡oh, Señor de las *gopīs*!\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"ye\",\"trans\":\"la mente\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"pāgala\",\"trans\":\"tal\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"mora\",\"trans\":\"está loco\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"nā\",\"trans\":\"mi\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"māne\",\"trans\":\"no le importa\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"śāsana\",\"trans\":\"para cualquier autoridad\",\"sep\":\",        \"},{\"text\":\"sadā achetana\",\"trans\":\"siempre sin sentido\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"viṣaye\",\"trans\":\"en asuntos mundanos\",\"sep\":\" \"},{\"text\":\"royeche ghora\",\"trans\":\"ha permanecido\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"4\",\"text\":[\"gopīnāth,    hāra ye menechi āmi\",\"aneka jatana,        hoilo biphala,\",\"    ekhona bharasā tumi\"],\"word_by_word\":[\"**gopī-nātha** — ¡oh, Señor de las *gopīs*!; **hāra** — derrota; **ye** — tal; **menechi āmi** — he aceptado; **anekajatana** — todos mis diversos esfuerzos; **hoilo biphala** — eran totalmente inútiles; **ekhona** — ahora; **bharasā tumi** — Tú eres la única esperanza.\"],\"translation\":[\"¡Oh, Gopīnāth! Acepto mi derrota. Todos mis diversos esfuerzos fueron inútiles. Ahora, Tú eres la única esperanza.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gopīnāth,    hāra\",\"trans\":\"¡oh, Señor de las *gopīs*!\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"ye\",\"trans\":\"derrota\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"menechi\",\"trans\":\"tal\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"āmi\",\"trans\":\"he aceptado\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"aneka\",\"trans\":\"todos mis diversos esfuerzos\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"jatana,        hoilo\",\"trans\":\"eran totalmente inútiles\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"biphala\",\"trans\":\"ahora\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"ekhona bharasā\",\"trans\":\"Tú eres la única esperanza\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"tumi\",\"trans\":\"-\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"5\",\"text\":[\"gopīnāth,    kemone hoibe gati\",\"prabala indriya,        bośī-bhūta mana,\",\"    nā chāḍe viṣaya-rati\"],\"word_by_word\":[\"**gopī-nātha** — ¡oh, Señor de las *gopīs*!; **kemone** — ¿cómo?; **hoibe gati** — debo hacer algún avance; **prabala indriya** — los poderosos sentidos; **bośī-bhūta** — ha quedado bajo control; **mana** — mi mente; **nā chāḍe** — y no abandona; **viṣaya-rati** — su apego al materialismo.\"],\"translation\":[\"¡Oh, Gopīnāth! ¿Cómo haré avance alguno cuando mi mente ha quedado bajo el control de los poderosos sentidos y no abandona su apego al materialismo?\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gopīnāth,    kemone\",\"trans\":\"¡oh, Señor de las *gopīs*!\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hoibe\",\"trans\":\"¿cómo?\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"gati\",\"trans\":\"debo hacer algún avance\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"prabala indriya\",\"trans\":\"los poderosos sentidos\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"bośī-bhūta\",\"trans\":\"ha quedado bajo control\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"mana\",\"trans\":\"mi mente\",\"sep\":\",\"}],[{\"text\":\"nā chāḍe\",\"trans\":\"y no abandona\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"viṣaya-rati\",\"trans\":\"su apego al materialismo\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"6\",\"text\":[\"gopīnāth,    hṛdoye bosiyā mora\",\"manake śamiyā,        loho nija pāne,\",\"    ghuchibe vipada ghora\"],\"word_by_word\":[\"**gopī-nātha** — ¡oh, Señor de las *gopīs*!; **hṛdoye** — en el centro de mi corazón; **bosiyā** — después de sentarse; **mora** — mi; **manake** — mente; **śamiyā** — subyugar; **laho** — por favor llévame; **nija pane** — a Ti mismo; **ghuchibe** — se sentirá aliviado; **vipada ghora** — los horribles peligros de este mundo.\"],\"translation\":[\"¡Oh, Gopīnāth! Después de tomar asiento en el recinto de mi corazón y de subyugar mi mente, por favor, llévame hacia Ti. De esa manera, desaparecerán los horribles peligros de este mundo.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gopīnāth,    hṛdoye\",\"trans\":\"¡oh, Señor de las *gopīs*!\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bosiyā\",\"trans\":\"en el centro de mi corazón\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"mora\",\"trans\":\"después de sentarse\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"manake\",\"trans\":\"mi\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"śamiyā\",\"trans\":\"mente\",\"sep\":\",        \",\"error\":\"mismatch\"},{\"text\":\"loho\",\"trans\":\"subyugar\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nija\",\"trans\":\"por favor llévame\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"pāne\",\"trans\":\"a Ti mismo\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"ghuchibe\",\"trans\":\"se sentirá aliviado\",\"sep\":\" \"},{\"text\":\"vipada ghora\",\"trans\":\"los horribles peligros de este mundo\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"7\",\"text\":[\"gopīnāth,    anātha dekhiyā more\",\"tumi hṛṣīkeśa,        hṛṣīka damiyā,\",\"    tāro’he saṁsṛti-ghore\"],\"word_by_word\":[\"**gopī-nātha** — ¡oh, Señor de las *gopīs*!; **anātha dekhiyā more** — al verme tan indefenso; **tumi hṛṣīkeśa** — Tú eres Hṛṣīkeśa, el Señor de los sentidos; **hṛṣīka damiyā** — controlar estos sentidos míos; **tāro’he** — ¡oh, por favor, libera!; **saṁsṛti-ghore** — de esta oscura y peligrosa existencia mundana.\"],\"translation\":[\"¡Oh, Gopīnāth! Tú eres Hṛṣīkeś, el Amo de los sentidos. Vé que tan desvalido estoy; ten la bondad de controlar mis sentidos y liberarme de esta oscura y peligrosa existencia material.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gopīnāth,    anātha\",\"trans\":\"¡oh, Señor de las *gopīs*!\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"dekhiyā more\",\"trans\":\"al verme tan indefenso\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"tumi hṛṣīkeśa\",\"trans\":\"Tú eres Hṛṣīkeśa, el Señor de los sentidos\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"hṛṣīka damiyā\",\"trans\":\"controlar estos sentidos míos\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"tāro’he\",\"trans\":\"¡oh, por favor, libera!\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"saṁsṛti-ghore\",\"trans\":\"de esta oscura y peligrosa existencia mundana\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"8\",\"text\":[\"gopīnāth,    galāya legeche phā̐sa\",\"kṛpā-asi dhori,        bandhana chediyā,\",\"    vinode koroho dāsa\"],\"word_by_word\":[\"**gopī-nātha** — ¡oh, Señor de las *gopīs*!; **galāya** — alrededor de mi cuello; **legeche** — está fija; **phā̐sa** — la soga del materialismo; **kṛpā-asi** — la espada de Tu misericordia; **dhori’** — tomando; **bandhanachediyā** — y cortando esta atadura; **vinode** — este Bhaktivinoda; **koroho dāsa** — hazlo Tu humilde sirviente.\"],\"translation\":[\"¡Oh, Gopīnāth! La soga del materialismo me tiene atado por el cuello. Tomando la espada de Tu misericordia y cortando este lazo de cautiverio, haz a este Bhakti Vinod Tu humilde sirviente.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gopīnāth,    galāya\",\"trans\":\"¡oh, Señor de las *gopīs*!\",\"sep\":\" \",\"
