imā\"},\"title\":[\"Śrī Nāmāṣṭakam 7\"],\"word_by_word\":[\"**śrī** — adorable; **nāma** — nombre; **aṣṭakam** — ocho versos.\"],\"author\":[\"Śrīla Bhakti Vinod Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"ohe harinām, tava mahimā apāra\",\"tava pade nati āmi kori bāro bāro\"],\"word_by_word\":[\"**ohe harinām,** — ¡Oh santo nombre!; **tava** — tuyo; **mahimā** — las glorias; **apāra** — ilimitadas; **tava** — tuyo; **pade** — a tus pies; **nati āmi** — yo me postro; **kori** — hago; **bāro bāro** — una y otra vez.\"],\"translation\":[\"¡Oh, Santo Nombre, Tus glorias son ilimitadas! Por lo tanto, me postro a Tus pies de loto una y otra vez.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"ohe harinām\",\"trans\":\"¡Oh santo nombre!\",\"sep\":\", \",\"error\":\"multi\"},{\"text\":\"tava\",\"trans\":\"tuyo\",\"sep\":\" \"},{\"text\":\"mahimā\",\"trans\":\"las glorias\",\"sep\":\" \"},{\"text\":\"apāra\",\"trans\":\"ilimitadas\",\"sep\":\"\"}],[{\"text\":\"tava\",\"trans\":\"tuyo\",\"sep\":\" \"},{\"text\":\"pade\",\"trans\":\"a tus pies\",\"sep\":\" \"},{\"text\":\"nati āmi\",\"trans\":\"yo me postro\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"kori\",\"trans\":\"hago\",\"sep\":\" \"},{\"text\":\"bāro bāro\",\"trans\":\"una y otra vez\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"2\",\"text\":[\"gokuler mahotsava ānanda-sāgara\",\"tomāra charaṇe poḍi hoiyā kātara\"],\"word_by_word\":[\"**gokuler** — de Gokula; **mahotsava** — gran festival; **ānanda-sāgara** — océano de felicidad; **tomāra** — tuyo; **charaṇe** — a tus pies; **poḍi** — caigo; **hoiyā** — estando; **kātara** — infeliz.\"],\"translation\":[\"¡Oh, gran festival de Gokula! ¡Oh, océano de dicha! Caigo a Tus pies de loto, pues me siento internamente muy afligido y preocupado.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gokuler\",\"trans\":\"de Gokula\",\"sep\":\" \"},{\"text\":\"mahotsava\",\"trans\":\"gran festival\",\"sep\":\" \"},{\"text\":\"ānanda-sāgara\",\"trans\":\"océano de felicidad\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"tomāra\",\"trans\":\"tuyo\",\"sep\":\" \"},{\"text\":\"charaṇe\",\"trans\":\"a tus pies\",\"sep\":\" \"},{\"text\":\"poḍi\",\"trans\":\"caigo\",\"sep\":\" \"},{\"text\":\"hoiyā\",\"trans\":\"estando\",\"sep\":\" \"},{\"text\":\"kātara\",\"trans\":\"infeliz\",\"sep\":\"\"}]]},{\"number\":\"3\",\"text\":[\"tumi kṛṣṇa, pūrṇa-vapu, rasera nidāna\",\"tava pade poḍi tava guṇa kori gāna\"],\"word_by_word\":[\"**tumi kṛṣṇa** — Tú eres Kṛṣṇa; **pūrṇa-vapu** — la forma plena; **rasera** — de néctar; **nidāna** — el origen; **tava pade** — a Tus pies; **poḍi** — caigo; **tava guṇa** — Tus virtudes; **kori gāna** — yo canto.\"],\"translation\":[\"Tú eres el Señor Kṛṣṇa, Tu forma divina es plenamente perfecta y completa, y eres el origen de todas las melosidades trascendentales. Cayendo a Tus pies de loto, canto Tus cualidades divinas.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"tumi kṛṣṇa\",\"trans\":\"Tú eres Kṛṣṇa\",\"sep\":\", \",\"error\":\"multi\"},{\"text\":\"pūrṇa-vapu\",\"trans\":\"la forma plena\",\"sep\":\", \",\"error\":\"multi\"},{\"text\":\"rasera\",\"trans\":\"de néctar\",\"sep\":\" \"},{\"text\":\"nidāna\",\"trans\":\"el origen\",\"sep\":\"\"}],[{\"text\":\"tava pade\",\"trans\":\"a Tus pies\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"poḍi\",\"trans\":\"caigo\",\"sep\":\" \"},{\"text\":\"tava guṇa\",\"trans\":\"Tus virtudes\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"kori gāna\",\"trans\":\"yo canto\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"4\",\"text\":[\"je kore tomār pade ekānta āśroya\",\"tā’ra ārti-rāśi nāśa koroho niśchoya\"],\"word_by_word\":[\"**je** — quién; **kore** — hace; **tomār** — Tuyo; **pade** — a Tus pies; **ekānta** — exclusivo; **āśroya** — refugio; **tā’ra** — de aquel; **ārti-rāśi** — muchos sufrimientos; **nāśa** — destrucción; **koroho** — haces; **niśchoya** — sin duda.\"],\"translation\":[\"Indudablemente destruyes la multitud de aflicciones de aquellas personas que se refugian exclusivamente en Tus sagrados pies.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"je\",\"trans\":\"quién\",\"sep\":\" \"},{\"text\":\"kore\",\"trans\":\"hace\",\"sep\":\" \"},{\"text\":\"tomār\",\"trans\":\"Tuyo\",\"sep\":\" \"},{\"text\":\"pade\",\"trans\":\"a Tus pies\",\"sep\":\" \"},{\"text\":\"ekānta\",\"trans\":\"exclusivo\",\"sep\":\" \"},{\"text\":\"āśroya\",\"trans\":\"refugio\",\"sep\":\"\"}],[{\"text\":\"tā’ra\",\"trans\":\"de aquel\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"ārti-rāśi\",\"trans\":\"muchos sufrimientos\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"nāśa\",\"trans\":\"destrucción\",\"sep\":\" \"},{\"text\":\"koroho\",\"trans\":\"haces\",\"sep\":\" \"},{\"text\":\"niśchoya\",\"trans\":\"sin duda\",\"sep\":\"\"}]]},{\"number\":\"5\",\"text\":[\"sarvva aparādha tumi nāśa koro tā’ra\",\"nāma-aparādhāvadhi nāśaho tāhāra\"],\"word_by_word\":[\"**sarvva** — todas; **aparādha** — ofensas; **tumi** — Tú; **nāśa** — destruyes; **koro** — haces; **tā’ra** — de aquel; **nāma-aparādha** — ofensas al nombre; **āvadhi** — al límite; **nāśaho** — destruyes; **tāhāra** — de aquel.\"],\"translation\":[\"Destruyes todas sus ofensas, incluso las diez ofensas en contra del canto del Santo Nombre (*nāma-aparādhas*).\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"sarvva\",\"trans\":\"todas\",\"sep\":\" \"},{\"text\":\"aparādha\",\"trans\":\"ofensas\",\"sep\":\" \"},{\"text\":\"tumi\",\"trans\":\"Tú\",\"sep\":\" \"},{\"text\":\"nāśa\",\"trans\":\"destruyes\",\"sep\":\" \"},{\"text\":\"koro\",\"trans\":\"haces\",\"sep\":\" \"},{\"text\":\"tā’ra\",\"trans\":\"de aquel\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"nāma-aparādhāvadhi\",\"trans\":\"ofensas al nombre\",\"sep\":\" \",\"error\":\"multi\"},{\"text\  de todas las melosidades trascendentales”.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"ati-ramya\",\"trans\":\"muy encantador\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"chid\",\"trans\":\"espiritual\",\"sep\":\"-\"},{\"text\":\"ghana\",\"trans\":\"intenso\",\"sep\":\"-\"},{\"text\":\"ānanda\",\"trans\":\"regocijo\",\"sep\":\"-\"},{\"text\":\"mūrtimān\",\"trans\":\"teniendo una forma\",\"sep\":\"\"}],[{\"text\":\"‘raso\",\"trans\":\"néctar\",\"sep\":\" \"},{\"text\":\"vai\",\"trans\":\"ciertamente\",\"sep\":\" \"},{\"text\":\"saḥ\",\"trans\":\"Él\",\"sep\":\"’ \"},{\"text\":\"boli\",\"trans\":\"dice\",\"sep\":\"’ \"},{\"text\":\"veda\",\"trans\":\"los Vedas\",\"sep\":\" \"},{\"text\":\"kore\",\"trans\":\"hace\",\"sep\":\" \"},{\"text\":\"tuyā\",\"trans\":\"de Ti\",\"sep\":\" \"},{\"text\":\"gāna\",\"trans\":\"canta\",\"sep\":\"\"}]]},{\"number\":\"8\",\"text\":[\"bhaktivinoda rūpa-gosvāmī-charaṇe\",\"māgaye sarvvadā nāma-sphūrti sarvva-kṣane\"],\"word_by_word\":[\"**bhaktivinoda** — Bhakti Vinod; **rūpa-gosvāmī-charaṇe** — a los pies de Śrīla Rūpa Goswāmī; **māgaye** — ruega; **sarvvadā** — siempre; **nāma-sphūrti** — la manifestación del nombre; **sarvva-kṣane** — a cada momento.\"],\"translation\":[\"Bhakti Vinod ruega a los pies de loto de Śrīla Rūpa Goswāmī, constantemente, a cada momento, la revelación directa del Santo Nombre.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"bhaktivinoda\",\"trans\":\"Bhakti Vinod\",\"sep\":\" \"},{\"text\":\"rūpa-gosvāmī-charaṇe\",\"trans\":\"a los pies de Śrīla Rūpa Goswāmī\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"māgaye\",\"trans\":\"ruega\",\"sep\":\" \"},{\"text\":\"sarvvadā\",\"trans\":\"siempre\",\"sep\":\" \"},{\"text\":\"nāma-sphūrti\",\"trans\":\"la manifestación del nombre\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"sarvva-kṣane\",\"trans\":\"a cada momento\",\"sep\":\"\",\"error\":\"multi\"}]]}],\"hasWbw\":true,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"19:[\"$\",\"$L21\",null,{\"navMap\":{\"397\":{\"prev\":{\"path\":\"/es/kali-ghora-timire-garasala-jagajana/\",\"title\":\"Kali-ghora timire\"},\"next\":{\"path\":\"/es/atha-govardhane-ramye-surabhi/\",\"title\":\"Śrī Govinda Kuṇḍa Mahātmya\"}}}}]\n22:Tbba,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"description\":\"A digital Vaishnava songbook with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPage\",\"@id\":\"https://dev.kirtan.site/es/ohe-harinam-tava-mahima-apara/\",\"url\":\"https://dev.kirtan.site/es/ohe-harinam-tava-mahima-apara/\",\"name\":\"Śrī Nāmāṣṭakam 7. Śrīla Bhakti Vinod Ṭhākur\",\"inLanguage\":\"es\",\"description\":\"Śrī Nāmāṣṭakam 7 — una canción vaiṣṇava de Śrīla Bhakti Vinod Ṭhākur con letra, traducción al español y significado palabra por palabra. Del libro «Guía de Kīrtan».\",\"breadcrumb\":{\"@id\":\"https://dev.kirtan.site/es/ohe-harinam-tava-mahima-apara/#breadcrumb\"},\"mainEntity\":{\"@id\":\"https://dev.kirtan.site/es/ohe-harinam-tava-mahima-apara/#composition\"},\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"}},{\"@type\":\"BreadcrumbList\",\"@id\":\"https://dev.kirtan.site/es/ohe-harinam-tava-mahima-apara/#breadcrumb\",\"itemListElement\":[{\"@type\":\"ListItem\",\"position\":1,\"name\":\"Guía de Kīrtan\",\"item\":\"https://dev.kirtan.site/es/\"},{\"@type\":\"ListItem\",\"position\":2,\"name\":\"Contenido\",\"item\":\"https://dev.kirtan.site/es/contents/\"},{\"@type\":\"Lis
