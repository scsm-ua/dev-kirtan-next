rd\":[\"**gay** — canta; **gorā** — el Señor Gaurasundara; **madhur svare** — con una voz muy dulce; **hare kṛṣṇa hare kṛṣṇa, kṛṣṇa kṛṣṇa hare hare hare rāma hare rāma, rāma rāma hare hare.**.\"],\"translation\":[\"El Señor Gaurasundar canta con voz muy dulce: “Hare Kṛṣṇa, Hare Kṛṣṇa, Kṛṣṇa Kṛṣṇa, Hare Hare; Hare Rāma, Hare Rāma, Rāma Rāma, Hare Hare”.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gāy\",\"trans\":\"canta\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"gorā\",\"trans\":\"el Señor Gaurasundara\",\"sep\":\" \"},{\"text\":\"madhur svare\",\"trans\":\"con una voz muy dulce\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"hare\",\"trans\":\"-\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kṛṣṇa\",\"trans\":\"-\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hare\",\"trans\":\"-\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kṛṣṇa\",\"trans\":\"-\",\"sep\":\", \",\"error\":\"mismatch\"},{\"text\":\"kṛṣṇa\",\"trans\":\"-\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kṛṣṇa\",\"trans\":\"-\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hare\",\"trans\":\"-\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hare\",\"trans\":\"-\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"hare\",\"trans\":\"-\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"rāma\",\"trans\":\"-\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hare\",\"trans\":\"-\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"rāma\",\"trans\":\"-\",\"sep\":\", \",\"error\":\"mismatch\"},{\"text\":\"rāma\",\"trans\":\"-\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"rāma\",\"trans\":\"-\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hare\",\"trans\":\"-\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hare\",\"trans\":\"-\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"2\",\"text\":[\"gṛhe thāko, vane thāko, sadā ‘hari’ bole’ ḍāko,\",\"sukhe duḥkhe bhulo nāko, vadane harinām koro re\"],\"word_by_word\":[\"**gṛhe thāko** — al vivir en casa; **vane thāko** — o vivir en el bosque; **sadā** — siempre; **‘hari’** — el santo nombre de Hari; **bole’ ḍāko** — gritar mientras se canta; **sukhe duḥkhe** — en felicidad o angustia; **bhulo nā’ko** — no olvides; **vadane** — con tus labios; **hari-nām** — los santos nombres; **koro re** — ¡oh, por favor canta!\"],\"translation\":[\"Ya sea que vivas en casa o en el bosque, canta siempre el Santo Nombre del Señor. Ya sea que estés feliz o triste, no lo olvides, canta el Santo Nombre y llena tus labios con Harinām.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gṛhe thāko\",\"trans\":\"al vivir en casa\",\"sep\":\", \",\"error\":\"multi\"},{\"text\":\"vane thāko\",\"trans\":\"o vivir en el bosque\",\"sep\":\", \",\"error\":\"multi\"},{\"text\":\"sadā\",\"trans\":\"siempre\",\"sep\":\" \"},{\"text\":\"‘hari\",\"trans\":\"el santo nombre de Hari\",\"sep\":\"’ \"},{\"text\":\"bole’ ḍāko\",\"trans\":\"gritar mientras se canta\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"sukhe duḥkhe\",\"trans\":\"en felicidad o angustia\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"bhulo nāko, vadane\",\"trans\":\"no olvides\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"harinām\",\"trans\":\"con tus labios\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"koro re\",\"trans\":\"los santos nombres\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"3\",\"text\":[\"māyā-jāle baddha ho’ye, ācho miche kāja lo’ye,\",\"ekhona o chetana peye, rādhā-mādhava-nām bolo re\"],\"word_by_word\":[\"**māyā-jāle** — en la red de *māyā*; **baddha ho’ye** — estás atado; **ācho** — tuyo es; **miche kāja** — trabajo infructuoso; **lo’ye** — aceptando; **ekhona** — ahora; **chetana pe’ye** — obtener plena conciencia; **‘rādhā-mādhava’ nām** — los nombres de Śrī Śrī Rādhā y Mādhava; **bolo re** — ¡así que canta!\"],\"translation\":[\"Atrapado en la red de Māyā, has trabajado duro como un esclavo, en vano. Ahora que obtuviste una vida humana y conciencia, canta el Nombre del Señor: “Rādhā-Mādhava”.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"māyā-jāle\",\"trans\":\"en la red de *māyā*\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"baddha ho’ye\",\"trans\":\"estás atado\",\"sep\":\", \",\"error\":\"multi\"},{\"text\":\"ācho\",\"trans\":\"tuyo es\",\"sep\":\" \"},{\"text\":\"miche kāja\",\"trans\":\"trabajo infructuoso\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"lo’ye\",\"trans\":\"aceptando\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"ekhona\",\"trans\":\"ahora\",\"sep\":\" \"},{\"text\":\"o chetana peye\",\"trans\":\"obtener plena conciencia\",\"sep\":\", \",\"error\":\"mismatch\"},{\"text\":\"rādhā-mādhava-nām\",\"trans\":\"los nombres de Śrī Śrī Rādhā y Mādhava\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"bolo re\",\"trans\":\"¡así que canta!\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"4\",\"text\":[\"jīvana hoilo śeṣa, nā bhajile hṛṣīkeśa\",\"bhaktivinod-upadeśa, ekbār nām-rase māto re\"],\"word_by_word\":[\"**jīvana** — tu vida; **hoilo śeṣa** — puede terminar en cualquier momento; **na bhajile** — no has adorado; **hṛṣīkeśa** — el Señor de los sentidos; **bhaktivinod-upadeśa** — este consejo de Bhakti Vinod Thākur; **ekbār** — solo una vez; **nām-rase** — en el néctar del santo nombre; **māto** — embriagarse; **re** — ¡oh!\"],\"translation\":[\"Sin duda, esta vida pronto se acabará, y no has adorado a Hṛṣīkeśa, el amo de los sentidos. Bhakti Vinod te aconseja: Por lo menos una vez, prueba el* nāma-rāsa*, el néctar del Santo Nombre.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"jīvana\",\"trans\":\"tu vida\",\"sep\":\" \"},{\"text\":\"hoilo śeṣa\",\"trans\":\"puede terminar en cualquier momento\",\"sep\":\", \",\"error\":\"multi\"},{\"text\":\"nā bhajile\",\"trans\":\"no has adorado\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hṛṣīkeś
