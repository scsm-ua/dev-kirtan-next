ṇa puede abrazarme con amor o pisotearme bajo Sus pies. Puede romper mi corazón al esconderse de mí. Que ese libertino haga lo que quiera, pero siempre será el único Señor de mi vida.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"āśliṣya\",\"trans\":\"abrazando con fuerza\",\"sep\":\" \"},{\"text\":\"vā\",\"trans\":\"o\",\"sep\":\" \"},{\"text\":\"pāda-ratāṁ\",\"trans\":\"postrado a los pies de loto\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"pinaṣṭu\",\"trans\":\"déjalo pisotear\",\"sep\":\" \"},{\"text\":\"mām\",\"trans\":\"a mí\",\"sep\":\"\"}],[{\"text\":\"adarśanān\",\"trans\":\"por no ser visible\",\"sep\":\" \"},{\"text\":\"marma-hatāṁ\",\"trans\":\"con el corazón roto\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"karotu\",\"trans\":\"que Él haga\",\"sep\":\" \"},{\"text\":\"vā\",\"trans\":\"o\",\"sep\":\"\"}],[{\"text\":\"yathā tathā\",\"trans\":\"como a Él le gusta\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"vā\",\"trans\":\"o\",\"sep\":\" \"},{\"text\":\"vidadhātu\",\"trans\":\"déjalo hacer\",\"sep\":\" \"},{\"text\":\"lampaṭo\",\"trans\":\"el libertino\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"mat-prāṇa-nāthas\",\"trans\":\"el Señor de mi vida\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"tu\",\"trans\":\"pero\",\"sep\":\" \"},{\"text\":\"sa eva\",\"trans\":\"sólo Él\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nāparaḥ\",\"trans\":\"nadie más\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"1\",\"text\":[\"bandhu-gon!    śunoho vachana mora\",\"bhāvete bibhora,    thākiye jokhon,\",\"    dekhā deya chitta-chora\"],\"word_by_word\":[\"**bondhu-gon!** — ¡oh amigos!; **śunoho** — por favor escucha; **vachana** — palabras; **mora** — mío; **bhāvete** — por amor extático; **bibhora** — agitado; **thākiye** — estando; **jokhon** — donde; **dekhā** — ver; **deya** — dar; **chitta-chora** — el ladrón de mi corazón.\"],\"translation\":[\"¡Oh, mis amigos! Escuchen mis palabras. Cuando tengo una visión divina de ese ladrón que se ha robado mi corazón, me siendo colmado hasta rebosar de éxtasis devocional.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"bandhu-gon\",\"trans\":\"¡oh amigos!\",\"sep\":\"!    \",\"error\":\"mismatch\"},{\"text\":\"śunoho\",\"trans\":\"por favor escucha\",\"sep\":\" \"},{\"text\":\"vachana\",\"trans\":\"palabras\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"mío\",\"sep\":\"\"}],[{\"text\":\"bhāvete\",\"trans\":\"por amor extático\",\"sep\":\" \"},{\"text\":\"bibhora\",\"trans\":\"agitado\",\"sep\":\",    \"},{\"text\":\"thākiye\",\"trans\":\"estando\",\"sep\":\" \"},{\"text\":\"jokhon\",\"trans\":\"donde\",\"sep\":\",\"}],[{\"text\":\"dekhā\",\"trans\":\"ver\",\"sep\":\" \"},{\"text\":\"deya\",\"trans\":\"dar\",\"sep\":\" \"},{\"text\":\"chitta-chora\",\"trans\":\"el ladrón de mi corazón\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"2\",\"text\":[\"bichakṣaṇa kori’        dekhite chāhile,\",\"        hoya ā̐khi-agochara\",\"punaḥ nāhi dekhi’,    kā̐daye parāṇa,\",\"    duḥkhera nā thāke ora\"],\"word_by_word\":[\"**bichakṣaṇa** — pensamiento; **kori’** — hacer; **dekhite** — ver; **chāhile** — deseo; **hoya** — es; **ā̐khi** — a los ojos; **agochara** — invisible; **punaḥ** — otra vez; **nāhi** — no; **dekhi’** — veo; **kā̐daye** — sollozo; **parāṇa** — vida; **duḥkhera** — de sufrimiento; **nā** — no; **thāke** — permaneces; **ora** — ¡oh!\"],\"translation\":[\"Y cuando deseo verlo más claramente, desaparece de mi visión y se torna invisible. Al perderlo de vista nuevamente, mi alma llora y mi pena no tiene límites.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"bichakṣaṇa\",\"trans\":\"pensamiento\",\"sep\":\" \"},{\"text\":\"kori\",\"trans\":\"hacer\",\"sep\":\"’        \"},{\"text\":\"dekhite\",\"trans\":\"ver\",\"sep\":\" \"},{\"text\":\"chāhile\",\"trans\":\"deseo\",\"sep\":\",\"}],[{\"text\":\"hoya\",\"trans\":\"es\",\"sep\":\" \"},{\"text\":\"ā̐khi\",\"trans\":\"a los ojos\",\"sep\":\"-\"},{\"text\":\"agochara\",\"trans\":\"invisible\",\"sep\":\"\"}],[{\"text\":\"punaḥ\",\"trans\":\"otra vez\",\"sep\":\" \"},{\"text\":\"nāhi\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"dekhi\",\"trans\":\"veo\",\"sep\":\"’,    \"},{\"text\":\"kā̐daye\",\"trans\":\"sollozo\",\"sep\":\" \"},{\"text\":\"parāṇa\",\"trans\":\"vida\",\"sep\":\",\"}],[{\"text\":\"duḥkhera\",\"trans\":\"de sufrimiento\",\"sep\":\" \"},{\"text\":\"nā\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"thāke\",\"trans\":\"permaneces\",\"sep\":\" \"},{\"text\":\"ora\",\"trans\":\"¡oh!\",\"sep\":\"\"}]]},{\"number\":\"3\",\"text\":[\"jagatera bandhu sei kobhu more loya sātha\",\"jathā tathā rākhu more āmāra se prāṇanātha\"],\"word_by_word\":[\"**jagatera** — del universo; **bandhu** — amigo; **sei** — de él; **kobhu** — nunca; **more** — a mí; **loya** — obtener; **sātha** — junto con; **jathā** — como; **tathā** — entonces; **rākhu** — que proteja; **more** — mío; **āmāra** — de mí; **se** — él; **prāṇa-nātha** — el amo de mi vida.\"],\"translation\":[\"A veces, Kṛṣṇa, el amigo del universo, me acepta como suyo, y a veces me ignora, pero, como quiera que Él me mantenga, es el único Señor de mi vida.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"jagatera\",\"trans\":\"del universo\",\"sep\":\" \"},{\"text\":\"bandhu\",\"trans\":\"amigo\",\"sep\":\" \"},{\"text\":\"sei\",\"trans\":\"de él\",\"sep\":\" \"},{\"text\":\"kobhu\",\"trans\":\"nunca\",\"sep\":\" \"},{\"text\":\"more\",\"trans\":\"a mí\",\"sep\":\" \"},{\"text\":\"loya\",\"trans\":\"obtener\",\"sep\":\" \"},{\"text\":\"sātha\",\"trans\":\"junto con\",\"sep\":\"\"}],[{\"text\":\"jathā\",\"trans\":\"como\",\"sep\":\" \"},{\"text\":\"tathā\",\"trans\":\"entonces\",\"sep\":\" \"},{\"text\":\"rākhu\",\"trans\":\"que proteja\",\"sep\":\" \"},{\"text\":\"more\",\"trans\":\"mío\",\"sep\":\" \"},{\"text\":\"āmāra\",\"trans\":\"de mí\",\"sep\":\" \"},{\"text\":\"se\",\"trans\":\"él\",\"sep\":\" \"},{\"text\":\"prāṇanātha\",\"trans\":\"el amo de mi vida\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"4\",\"text\":[\"darśan-ānanda-dāne,    sukha dey mora prāṇe,\",\"        bole more praṇoya-vachan\",\"punaḥ adarśan diyā,    dagdha kore mora hiyā,\",\"    prāṇe more māre prāṇa-dhan\"],\"word_by_word\":[\"**darśan** — visión; **ānanda** — bienaventuranza; **dāne** — al dar; **sukha** — felicidad; **dey** — otorga; **mora** — de mí; **prāṇe** — la vida; **bole** — dice; **more** — a mí; **praṇoya** — de amor; **vachan** — palabras; **punaḥ** — otra vez; **adarśan** — sin ver; **diyā** — dar; **dagdha** — quemado; **kore** — hace; **mora** — de mí; **hiyā** — el corazón; **prāṇe** — vida; **more** — de mí; **māre** — muere; **prāṇa-dhan** — el tesoro de mi vida.\"],\"translation\":[\"Cuando me da Su bienaventurada audiencia, le brinda felicidad a mi alma. Él me otorga un maravilloso éxtasis por permitirme verlo y por hablarme afectuosamente. Nuevamente se va, desvaneciéndose de mi vista. Y cuando no me permite verlo, mi corazón arde con el fuego de la separación.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"darśan\",\"trans\":\"visión\",\"sep\":\"-\"},{\"text\":\"ānanda\",\"trans\":\"bienaventuranza\",\"sep\":\"-\"},{\"text\":\"dāne\",\"trans\":\"al dar\",\"sep\":\",    \"},{\"text\":\"sukha\",\"trans\":\"felicidad\",\"sep\":\" \"},{\"text\":\"dey\",\"trans\":\"otorga\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"de mí\",\"sep\":\" \"},{\"text\":\"prāṇe\",\"trans\":\"la vida\",\"sep\":\",\"}],[{\"text\":\"bole\",\"trans\":\"dice\",\"sep\":\" \"},{\"text\":\"more\",\"trans\":\"a mí\",\"sep\":\" \"},{\"text\":\"praṇoya\",\"trans\":\"de amor\",\"sep\":\"-\"},{\"text\":\"vachan\",\"trans\":\"palabras\",\"sep\":\"\"}],[{\"text\":\"punaḥ\",\"trans\":\"otra vez\",\"sep\":\" \"},{\"text\":\"adarśan\",\"trans\":\"sin ver\",\"sep\":\" \"},{\"text\":\"diyā\",\"trans\":\"dar\",\"sep\":\",    \"},{\"text\":\"dagdha\",\"trans\":\"quemado\",\"sep\":\" \"},{\"text\":\"kore\",\"trans\":\"hace\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"de mí\",\"sep\":\" \"},{\"text\":\"hiyā\",\"trans\":\"el corazón\",\"sep\":\",\"}],[{\"text\":\"prāṇe\",\"trans\":\"vida\",\"sep\":\" \"},{\"text\":\"more\",\"trans\":\"de mí\",\"sep\":\" \"},{\"text\":\"māre\",\"trans\":\"muere\",\"sep\":\" \"},{\"text\":\"prāṇa-dhan\",\"trans\":\"el tesoro de mi vida\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"5\",\"text\":[\"jāhe tā’ra sukha hoy, sei sukha mama\",\"nija sukhe-duḥkhe mora sarvvadāi sama\"],\"word_by_word\":[\"**jāhe** — en quien; **tā’ra** — de él; **sukha** — felicidad; **hoy** — es; **sei** — esa; **sukha** — felicidad; **mama** — de mí; **nija** — propio; **sukhe** — en la felicidad; **duḥkhe** — en el sufrimiento; **mora** — de mí; **sarvvadāi** — siempre; **sama** — lo mismo.\"],\"translation\":[\"Pero aunque le cause dolor a mi alma de esa manera, de todos modos es el Señor de mi vida. Cualquier cosa que sea Su felicidad es también mi felicidad. De manera que mi propia felicidad y aflicción son ambas lo mismo.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"jāhe\",\"trans\":\"en quien\",\"sep\":\" \"},{\"text\":\"tā’ra\",\"trans\":\"de él\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"sukha\",\"trans\":\"felicidad\",\"sep\":\" \"},{\"text\":\"hoy\",\"trans\":\"es\",\"sep\":\", \"},{\"text\":\"sei\",\"trans\":\"esa\",\"sep\":\" \"},{\"text\":\"sukha\",\"trans\":\"felicidad\",\"sep\":\" \"},{\"text\":\"mama\",\"trans\":\"de mí\",\"sep\":\"\"}],[{\"text\":\"nija\",\"trans\":\"propio\",\"sep\":\" \"},{\"text\":\"sukhe\",\"trans\":\"en la felicidad\",\"sep\":\"-\"},{\"text\":\"duḥkhe\",\"trans\":\"en el sufrimiento\",\"sep\":\" \"},{\"text\":\"mora\",\"trans\":\"de mí\",\"sep\":\" \"},{\"text\":\"sarvvadāi\",\"trans\":\"siempre\",\"sep\":\" \"},{\"text\":\"sama\",\"trans\":\"lo mismo\",\"sep\":\"\"}]]},{\"number\":\"6\",\"text\":[\"bhakativinoda,        saṁjoge bijoge,\",\"        tāhe jāne prāṇeśvara\",\"tā’ra sukhe sukhī,    sei prāṇa-nātha,\",\"    se kobhu nā hoya paro\"],\"word_by_word\":[\"**bhakativinoda** — Bhakti Vinoda; **saṁjoge** — al encontrar; **bijoge** — en separación; **tāhe** — en eso; **jāne** — yo sé; **prāṇeśvara** — el amo de la vida; **tā’ra** — de él; **sukhe** — en la felicidad; **sukhī** — feliz; **sei** — esto; **prāṇa-nātha** — amo de la vida; **se** — él; **kobhu** — nunca; **nā** — no; **hoya** — es; **paro** — otro.\"],\"translation\":[\"De ese modo, tanto en la unión como en la separación, Bhakti Vinod sabe que Kṛṣṇa es el único Señor de su alma. Su felicidad es mi felicidad. Él es el Señor de mi vida y no hay otro para mí más que Él.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"bhakativinoda\",\"trans\":\"Bhakti Vinoda\",\"sep\":\",        \"},{\"text\":\"saṁjoge\",\"trans\":\"al encontrar\",\"sep\":\" \"},{\"text\":\"bijoge\",\"trans\":\"en separación\",\"sep\":\",\"}],[{\"text\":\"tāhe\",\"trans\":\"en eso\",\"sep\":\" \"},{\"text\":\"jāne\",\"trans\":\"yo sé\",\"sep\":\" \"},{\"text\":\"prāṇeśvara\",\"trans\":\"el amo de la vida\",\"sep\":\"\"}],[{\"text\":\"tā’ra\",\"trans\":\"de él\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"sukhe\",\"trans\":\"en la felicidad\",\"sep\":\" \"},{\"text\":\"sukhī\",\"trans\":\"feliz\",\"sep\":\",    \"},{\"text\":\"sei\",\"trans\":\"esto\",\"sep\":\" \"},{\"text\":\"prāṇa-nātha\",\"trans\":\"amo de la vida\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"se\",\"trans\":\"él\",\"sep\":\" \"},{\"text\":\"kobhu\",\"trans\":\"nunca\",\"sep\":\" \"},{\"text\":\"nā\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"hoya\",\"trans\":\"es\",\"sep\":\" \"},{\"text\":\"paro\",\"trans\":\"otro\",\"sep\":\"\"}]]}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Bhakti Lalita Devi\",\"ru\":\"Бхакти Лалита Деви\",\"ua\":\"Бга
