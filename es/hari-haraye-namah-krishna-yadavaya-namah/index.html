:\"hari haraye namaḥ kṛṣṇa yādavāya namaḥ\"},\"title\":[\"Nāma-Saṇkīrtan\"],\"word_by_word\":[\"**nāma** — del nombre; **saṇkīrtan** — canto en congregación.\"],\"author\":[\"Śrīla Narottam Dās Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"hari haraye namaḥ kṛṣṇa yādavāya namaḥ\",\"yādavāya mādhavāya keśavāya namaḥ\"],\"word_by_word\":[\"**hari haraye** — a Hari; **namaḥ** — reverencias; **kṛṣṇa yādavāya** — a Kṛṣṇa conocido como Yādava (el mejor de la dinastía Yadu); **namaḥ** — reverencias; **yādavāya** — a Yādava; **mādhavāya** — a Mādhava, el esposo de la diosa de la fortuna; **keśavāya** — a Keśava, el de cabello fino; **namaḥ** — reverencias.\"],\"translation\":[\"¡Oh, Señor Hari! ¡Oh, Señor Kṛṣṇa! Te ofrezco mis reverencias a Ti, quien eres conocido como Yādava, Hari, Mādhava y Keśava.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"hari haraye\",\"trans\":\"a Hari\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"namaḥ\",\"trans\":\"reverencias\",\"sep\":\" \"},{\"text\":\"kṛṣṇa yādavāya\",\"trans\":\"a Kṛṣṇa conocido como Yādava (el mejor de la dinastía Yadu)\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"namaḥ\",\"trans\":\"reverencias\",\"sep\":\"\"}],[{\"text\":\"yādavāya\",\"trans\":\"a Yādava\",\"sep\":\" \"},{\"text\":\"mādhavāya\",\"trans\":\"a Mādhava, el esposo de la diosa de la fortuna\",\"sep\":\" \"},{\"text\":\"keśavāya\",\"trans\":\"a Keśava, el de cabello fino\",\"sep\":\" \"},{\"text\":\"namaḥ\",\"trans\":\"reverencias\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"gopāla govinda rām śrī madhusūdana\",\"giridhārī gopīnātha madana-mohana\"],\"word_by_word\":[\"**gopāla** — un pastorcillo de vacas; **govinda** — el que complace a las vacas; **rāma** — el depósito de placer; **śrī-madhusūdana** — el magnífico asesino del demonio llamado Madhu; **giridhārī** — el levantador de la colina Govardhan; **gopīnātha** — el Señor de las doncellas pastorcillas de vacas; **madana-mohana** — el encantador de Cupido.\"],\"translation\":[\"¡Oh, Gopāla, Govinda, Rāma, Śrī Madhusūdana, Giridhāri, Gopīnāth, Madana-mohan!\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gopāla\",\"trans\":\"un pastorcillo de vacas\",\"sep\":\" \"},{\"text\":\"govinda\",\"trans\":\"el que complace a las vacas\",\"sep\":\" \"},{\"text\":\"rām\",\"trans\":\"el depósito de placer\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"śrī madhusūdana\",\"trans\":\"el magnífico asesino del demonio llamado Madhu\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"giridhārī\",\"trans\":\"el levantador de la colina Govardhan\",\"sep\":\" \"},{\"text\":\"gopīnātha\",\"trans\":\"el Señor de las doncellas pastorcillas de vacas\",\"sep\":\" \"},{\"text\":\"madana-mohana\",\"trans\":\"el encantador de Cupido\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"3\",\"text\":[\"śrī-chaitanya nityānanda śrī advaita-chandra\",\"gadādhara śrīvāsādi gaura-bhakta-vṛnda\"],\"word_by_word\":[\"**śrī-chaitanya-nityānanda** — cantar los Nombres del Señor Chaitanya y el Señor Nityānanda; **śrī-advaita-chandra** — Śrī Advaita Āchārya la luna de Nadia; **gadādhara** — Gadādhara Paṇḍit; **śrīvāsādi** — encabezados por Śrīvas Ṭhākur; **gaura** — de Gaura; **bhakta-vṛnda** — todos los devotos reunidos.\"],\"translation\":[\"Todas las glorias a Śrī Chaitanya y a Nityānanda. Todas las glorias a Śrī Advaita Āchārya, quien es como una luna. Todas las glorias a Śrī Gadādhar Paṇḍit y a todos los devotos de Śrī Chaitanya encabezados por Śrīvās Ṭhākur.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"śrī-chaitanya nityānanda\",\"trans\":\"cantar los Nombres del Señor Chaitanya y el Señor Nityānanda\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"śrī advaita-chandra\",\"trans\":\"Śrī Advaita Āchārya la luna de Nadia\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"gadādhara\",\"trans\":\"Gadādhara Paṇḍit\",\"sep\":\" \"},{\"text\":\"śrīvāsādi\",\"trans\":\"encabezados por Śrīvas Ṭhākur\",\"sep\":\" \"},{\"text\":\"gaura\",\"trans\":\"de Gaura\",\"sep\":\"-\"},{\"text\":\"bhakta-vṛnda\",\"trans\":\"todos los devotos reunidos\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"4\",\"text\":[\"jaya rūpa sanātana bhaṭṭa raghunātha\",\"śrī-jīva-gopāla-bhaṭṭa dāsa raghunātha\"],\"word_by_word\":[\"**jay** — todas las glorias; **rūpa sanātana bhaṭṭa-raghunāth śrī-jīva gopāla-bhaṭṭa dāsa raghunāth** — a los Seis Gosvāmīs: Śrī Rūpa, Sanātana, Raghunāth Bhaṭṭa, Śrī Jīva, Gopāla Bhaṭa, y Raghunāth Bhaṭṭa.\"],\"translation\":[\"Todas las glorias a Śrī Rūpa Goswāmī, Sanātan Goswāmī, Raghunāth Bhaṭṭa Goswāmī, Śrī Jīva Goswāmī, Gopāla Bhaṭṭa Goswāmī y Raghunāth Dās Goswāmī.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"jaya\",\"trans\":\"todas las glorias\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"rūpa sanātana bhaṭṭa raghunātha\",\"trans\":\"a los Seis Gosvāmīs: Śrī Rūpa, Sanātana, Raghunāth Bhaṭṭa, Śrī Jīva, Gopāla Bhaṭa, y Raghunāth Bhaṭṭa\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"śrī\",\"trans\":\"-\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"jīva\",\"trans\":\"-\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"gopāla\",\"trans\":\"-\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"bhaṭṭa\",\"trans\":\"-\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"dāsa\",\"trans\":\"-\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"raghunātha\",\"trans\":\"-\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"5\",\"text\":[\"ei chay gosāir kori charaṇa vandana\",\"yāhā hoite vighna-nāś abhīṣṭa pūraṇa\"],\"word_by_word\":[\"**ei chay gosāir** — de estos seis Goswāmīs; **kori** — ofrezco; **charaṇa vandana** — reverencias a sus pies; **yāhā hoite** — por el cual; **vighna-nāś** — se destruyen los obstáculos a la devoción; **abhīṣṭa-pūraṇa** — se cumplen todos los deseos espirituales.\"],\"translation\":[\"Les ofrezco mis reverencias a los seis Goswāmīs. Por ofrecerles reverencias a ellos, son destruidos todos los obstáculos a la devoción y se cumplen todos los deseos espirituales.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"ei chay gosāir\",\"trans\":\"de estos seis Goswāmīs\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"kori\",\"trans\":\"ofrezco\",\"sep\":\" \"},{\"text\":\"charaṇa vandana\",\"trans\":\"reverencias a sus pies\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"yāhā hoite\",\"trans\":\"por el cual\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"vighna-nāś\",\"trans\":\"se destruyen los obstáculos a la devoción\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"abhīṣṭa pūraṇa\",\"trans\":\"se cumplen todos los deseos espirituales\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"6\",\"text\":[\"ei chay gosāir jā̐ra muni tā̐ra dāsa\",\"tā̐-sabāra pada-reṇu mora pañcha-grāsa\"],\"word_by_word\":[\"**ei chay gosāir** — de estos seis Goswāmīs; **jā̐ra** — quienquiera que sea; **muni** — yo; **tā̐ra** — su; **dāsa** — sirviente; **tā̐-sabāra** — de todos ellos; **pada-reṇu** — el polvo de los pies; **mora** — mi; **pañcha-grāsa** — cinco tipos de alimentos.\"],\"translation\":[\"Soy un sirviente de esa persona que es un sirviente de esos seis Goswāmīs. El polvo de sus sagrados pies constituye mis cinco clases de alimento.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"ei chay gosāir\",\"trans\":\"de estos seis Goswāmīs\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"jā̐ra\",\"trans\":\"quienquiera que sea\",\"sep\":\" \"},{\"text\":\"muni\",\"trans\":\"yo\",\"sep\":\" \"},{\"text\":\"tā̐ra\",\"trans\":\"su\",\"sep\":\" \"},{\"text\":\"dāsa\",\"trans\":\"sirviente\",\"sep\":\"\"}],[{\"text\":\"tā̐-sabāra\",\"trans\":\"de todos ellos\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"pada-reṇu\",\"trans\":\"el polvo de los pies\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"mora\",\"trans\":\"mi\",\"sep\":\" \"},{\"text\":\"pañcha-grāsa\",\"trans\":\"cinco tipos de alimentos\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"7\",\"text\":[\"tā̐dera charaṇa sevi bhakta sane vāsa\",\"janame janame mora ei abhilāṣa\"],\"word_by_word\":[\"**tā̐dera charaṇa** — sus pies de loto (de esos seis Goswāmīs); **sevi bhakta** — aquellos devotos que sirven; **sane vāsa** — vivir junto con; **janame janame** — nacimiento tras nacimiento; **mora** — mío; **eiabhilāṣa** — deseo.\"],\"translation\":[\"Es mi deseo que, nacimiento tras nacimiento, pueda vivir con esos devotos que ofrecen servicio a los pies de loto de los seis Goswāmīs.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"tā̐dera charaṇa\",\"trans\":\"sus pies de loto (de esos seis Goswāmīs)\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"sevi bhakta\",\"trans\":\"aquellos devotos que sirven\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"sane vāsa\",\"trans\":\"vivir junto con\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"janame janame\",\"trans\":\"nacimiento tras nacimiento\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"mora\",\"trans\":\"mío\",\"sep\":\" \"},{\"text\":\"ei\",\"trans\":\"deseo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"abhilāṣa\",\"trans\":\"-\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"8\",\"text\":[\"ei chay gosāir jabe vraje koilā vāsa\",\"rādhā-kṛṣṇa-nitya-līlā korilā prakāśa\"],\"word_by_word\":[\"**ei chay gosāir** — estos seis Goswāmīs; **jabe** — cuando; **vraje** — en Vraja; **koilā vāsa** — vivió; **rādhā-kṛṣṇa-nitya-līlā** — los pasatiempos eternos de Rādhā y Kṛṣṇa; **korilā prakāśa** — revelaron.\"],\"translation\":[\"Cuando estos seis Goswāmīs residían en Vraja, revelaron y explicaron los pasatiempos eternos de Rādhā y Kṛṣṇa.\"],\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"ei chay gosāir\",\"trans\":\"estos seis Goswāmīs\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"jabe\",\"trans\":\"cuando\",\"sep\":\" \"},{\"text\":\"vraje\",\"trans\":\"en Vraja\",\"sep\":\" \"},{\"text\":\"koilā vāsa\",\"
