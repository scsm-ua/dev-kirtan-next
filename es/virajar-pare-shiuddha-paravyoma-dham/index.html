e; \u003ci class=\\\"SongHeader__bold\\\"\u003erādhā\u003c/i\u003e — de Śrīmati Rādhārāṇī; \u003ci class=\\\"SongHeader__bold\\\"\u003eaṣṭakam\u003c/i\u003e — ocho canciones.\"}}]]\n18:[\"$\",\"div\",\"0\",{\"className\":\"SongHeader__author\",\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[false,[\"$\",\"a\",null,{\"href\":\"/es/authors/\",\"rel\":\"author\",\"children\":\"Śrīla Bhakti Vinod Ṭhākur\"}]]}]]}]\n"])</script><script>self.__next_f.push([1,"19:[\"$\",\"$L21\",null,{\"bookId\":\"es\",\"label\":\"Mostrar traducción\",\"song\":{\"meta\":{\"page\":238,\"first_line\":\"virajār pāre śuddha-paravyoma-dhām\"},\"title\":[\"Śrī Rādhāṣṭaka, 2\"],\"word_by_word\":[\"**śrī** — adorable; **rādhā** — de Śrīmati Rādhārāṇī; **aṣṭakam** — ocho canciones.\"],\"author\":[\"Śrīla Bhakti Vinod Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"virajār pāre śuddha-paravyoma-dhām\",\"tad upari śrī-gokula-vṛndāraṇya nām\"],\"word_by_word\":[\"**virajār** — del río Viraja; **pāre** — más allá; **śuddha-paravyoma-dhām** — la suprema morada pura; **tad upari** — por encima; **śrī-gokula-vṛndāraṇya nām** — llamada Śrī Gokula Vṛndāvan.\"],\"translation\":[\"Más allá del río Virajā yace el cielo espiritual puro, y por encima de ese reino de Vaikuṇṭha se encuentra la morada divina conocida como Śrī Goloka Vṛndāvan.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"virajār\",\"trans\":\"del río Viraja\",\"sep\":\" \"},{\"text\":\"pāre\",\"trans\":\"más allá\",\"sep\":\" \"},{\"text\":\"śuddha-paravyoma-dhām\",\"trans\":\"la suprema morada pura\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"tad upari\",\"trans\":\"por encima\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"śrī-gokula-vṛndāraṇya nām\",\"trans\":\"llamada Śrī Gokula Vṛndāvan\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"2\",\"text\":[\"vṛndāvana chintāmaṇi,        chid-ānanda-ratna-khani,\",\"        chinmoy apūrvva-daraśan\",\"tā̐hi mājhe chamatkār,        kṛṣṇa vanaspati sār,\",\"        nīla-maṇi tamāla jemon\"],\"word_by_word\":[\"**vṛndāvana** — Vṛndāvan; **chintāmaṇi** — de gemas*chintāmanī*; **chid** — espiritual; **ānanda** — bienaventuranza; **ratna** — joyas; **khani** — morada; **chinmoy** — espiritual; **apūrvva** — maravilloso; **daraśan** — visión; **tā̐hi** — allí; **mājhe** — en el medio; **chamatkār** — magnífico; **kṛṣṇa** — Kṛṣṇa; **vanaspati sār** — el mejor de los árboles; **nīla-maṇi** — záfiro; **tamāla** — árbol *tamāla*; **jemon** — tal como.\"],\"translation\":[\"La tierra de Vṛndāvan está hecha de gemas espirituales y, por lo tanto, se asemeja a una mina de joyas plenamente conscientes y bienaventuradas. Ese reino trascendentalmente consciente constituye en verdad un lugar maravilloso y extraordinario. En esa morada se encuentra la muy asombrosa presencia del Señor Kṛṣṇa, quien es comparado a un árbol *tamāla*, el rey de los árboles, el cual posee el color de un oscuro zafiro.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"vṛndāvana\",\"trans\":\"Vṛndāvan\",\"sep\":\" \"},{\"text\":\"chintāmaṇi\",\"trans\":\"de gemas*chintāmanī*\",\"sep\":\",        \"},{\"text\":\"chid\",\"trans\":\"espiritual\",\"sep\":\"-\"},{\"text\":\"ānanda\",\"trans\":\"bienaventuranza\",\"sep\":\"-\"},{\"text\":\"ratna\",\"trans\":\"joyas\",\"sep\":\"-\"},{\"text\":\"khani\",\"trans\":\"morada\",\"sep\":\",\"}],[{\"text\":\"chinmoy\",\"trans\":\"espiritual\",\"sep\":\" \"},{\"text\":\"apūrvva\",\"trans\":\"maravilloso\",\"sep\":\"-\"},{\"text\":\"daraśan\",\"trans\":\"visión\",\"sep\":\"\"}],[{\"text\":\"tā̐hi\",\"trans\":\"allí\",\"sep\":\" \"},{\"text\":\"mājhe\",\"trans\":\"en el medio\",\"sep\":\" \"},{\"text\":\"chamatkār\",\"trans\":\"magnífico\",\"sep\":\",        \"},{\"text\":\"kṛṣṇa\",\"trans\":\"Kṛṣṇa\",\"sep\":\" \"},{\"text\":\"vanaspati sār\",\"trans\":\"el mejor de los árboles\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"nīla-maṇi\",\"trans\":\"záfiro\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"tamāla\",\"trans\":\"árbol *tamāla*\",\"sep\":\" \"},{\"text\":\"jemon\",\"trans\":\"tal como\",\"sep\":\"\"}]]},{\"number\":\"3\",\"text\":[\"tāhe eka svarna-mayī,        latā sarvva-dhāma-jayī,\",\"        uthiyāche parama-pāvanī\",\"hlādinī-śaktir sār,        ‘mahābhāva’ nām jār,\",\"        tribhuvana-mohana-mohinī\"],\"word_by_word\":[\"**tāhe** — allí; **eka** — uno; **svarna-mayī** — dorado; **latā** — enredadera; **sarvva-dhāma-jayī** — muy glorioso; **uthiyāche** — crece; **parama-pāvanī** — muy puro; **hlādinī-śaktir** — potencia de placer; **sār** — mejor; **‘mahābhāva’** — gran éxtasis; **nām** — el nombre; **jār** — de quien; **tribhuvana-mohana** — quien encanta los tres mundos; **mohinī** — la que encanta.\"],\"translation\":[\"Entrelazada con ese árbol negruzco ha surgido una hermosa enredadera dorada, quien es la conquistadora de todos los reinos y quien posee el supremo poder purificador. Su nombre es Mahābhāva, debido a que Ella es la esencia de la suprema potencia dadora de placer (*hlādinī*). Ella es quien encanta a Śrī Kṛṣṇa, quien es el encantador de los tres mundos.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"tāhe\",\"trans\":\"allí\",\"sep\":\" \"},{\"text\":\"eka\",\"trans\":\"uno\",\"sep\":\" \"},{\"text\":\"svarna-mayī\",\"trans\":\"dorado\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"latā\",\"trans\":\"enredadera\",\"sep\":\" \"},{\"text\":\"sarvva-dhāma-jayī\",\"trans\":\"muy glorioso\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"uthiyāche\",\"trans\":\"crece\",\"sep\":\" \"},{\"text\":\"parama-pāvanī\",\"trans\":\"muy puro\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"hlādinī-śaktir\",\"trans\":\"potencia de placer\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"sār\",\"trans\":\"mejor\",\"sep\":\",        \"},{\"text\":\"‘mahābhāva\",\"trans\":\"gran éxtasis\",\"sep\":\"’ \"},{\"text\":\"nām\",\"trans\":\"el nombre\",\"sep\":\" \"},{\"text\":\"jār\",\"trans\":\"de quien\",\"sep\":\",\"}],[{\"text\":\"tribhuvana-mohana\",\"trans\":\"quien encanta los tres mundos\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"mohinī\",\"trans\":\"la que encanta\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"rādhā-nāme parichita,        tuṣiyā govinda-chita,\",\"        virājaye parama ānande\",\"sei latā-patra-phul,        lalitādi sakhī-kul,\",\"        sobe mili’ vṛkse dṛdha bāndhe\"],\"word_by_word\":[\"**rādhā-nāme** — del nombre de Rādhā; **parichita** — conocido; **tuṣiyā** — agradable; **govinda-chita** — el corazón de Govinda; **virājaye** — graciosamente presente; **parama ānande** — con gran júbilo; **sei** — esto; **latā** — enredadera; **patra** — hojas; **phul** — flores; **lalitādi sakhī** — las amigas comenzando con Lālita; **kul** — multitud; **sobe** — todo; **mili’** — encuentro; **vṛkse** — en el árbol; **dṛdha** — firme; **bāndhe** — abrazo.\"],\"translation\":[\"Conocida con el nombre de Rādhā, Ella brilla con gran éxtasis, siempre ocupada en satisfacer el corazón de Govinda. Las hojas y las flores de esa enredadera las forman la asamblea de Sus amigas, encabezadas por Lalitā. Juntas, Ella y Sus amigas se entrelazan con ese árbol negruzco en un fuerte abrazo.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"rādhā-nāme\",\"trans\":\"del nombre de Rādhā\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"parichita\",\"trans\":\"conocido\",\"sep\":\",        \"},{\"text\":\"tuṣiyā\",\"trans\":\"agradable\",\"sep\":\" \"},{\"text\":\"govinda-chita\",\"trans\":\"el corazón de Govinda\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"virājaye\",\"trans\":\"graciosamente presente\",\"sep\":\" \"},{\"text\":\"parama ānande\",\"trans\":\"con gran júbilo\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"sei\",\"trans\":\"esto\",\"sep\":\" \"},{\"text\":\"latā\",\"trans\":\"enredadera\",\"sep\":\"-\"},{\"text\":\"patra\",\"trans\":\"hojas\",\"sep\":\"-\"},{\"text\":\"phul\",\"trans\":\"flores\",\"sep\":\",        \"},{\"text\":\"lalitādi sakhī\",\"trans\":\"las amigas comenzando con Lālita\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"kul\",\"trans\":\"multitud\",\"sep\":\",\"}],[{\"text\":\"sobe\",\"trans\":\"todo\",\"sep\":\" \"},{\"text\":\"mili\",\"trans\":\"encuentro\",\"sep\":\"’ \"},{\"text\":\"vṛkse\",\"trans\":\"en el árbol\",\"sep\":\" \"},{\"text\":\"dṛdha\",\"trans\":\"firme\",\"sep\":\" \"},{\"text\":\"bāndhe\",\"trans\":\"abrazo\",\"sep\":\"\"}]]},{\"number\":\"5\",\"text\":[\"latāra paraśe praphulla tamāl\",\"latā chāḍi’ nāhi rohe kono kāl\"],\"word_by_word\":[\"**latāra** — de la enredadera; **paraśe** — por el toque; **praphulla** — florecido; **tamāl** — el árbol *tamāla*; **latā** — enredadera; **chāḍi’** — abandonar; **nāhi rohe** — no permanece; **kono kāl** — cualquier momento.\"],\"translation\":[\"Al contacto de esa enredadera, el árbol *tamāla* florece; sin el abrazo de la enredadera, Él no puede existir más.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"latāra\",\"trans\":\"de la enredadera\",\"sep\":\" \"},{\"text\":\"paraśe\",\"trans\":\"por el toque\",\"sep\":\" \"},{\"text\":\"praphulla\",\"trans\":\"florecido\",\"sep\":\" \"},{\"text\":\"tamāl\",\"trans\":\"el árbol *tamāla*\",\"sep\":\"\"}],[{\"text\":\"latā\",\"trans\":\"enredadera\",\"sep\":\" \"},{\"text\":\"chāḍi\",\"trans\":\"abandonar\",\"sep\":\"’ \"},{\"text\":\"nāhi rohe\",\"trans\":\"no permanece\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"kono kāl\",\"trans\":\"cualquier momento\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"6\",\"text\":[\"tamāla chaḍiyā latā nāhi bā̐che\",\"se latā milan sadā-kāla jāche\"],\"word_by_word\":[\"**tamāla** — árbol *tamāla*; **chaḍiyā** — abandonar; **latā** — enredadera; **nāhi** — no; **bā̐che** — deseos; **se latā** — esa enredadera; **milan** — encuentro; **sadā-kāla** — en todo momento; **jāche** — pide.\"],\"translation\":[\
