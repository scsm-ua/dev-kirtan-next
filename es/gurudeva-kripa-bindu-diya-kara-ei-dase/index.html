el Santo Nombre felizmente.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"sakale\",\"trans\":\"a todos\",\"sep\":\" \"},{\"text\":\"sammāna\",\"trans\":\"honor\",\"sep\":\"    \"},{\"text\":\"karite\",\"trans\":\"hacer\",\"sep\":\" \"},{\"text\":\"śakati\",\"trans\":\"la fuerza\",\"sep\":\"\"}],[{\"text\":\"deha\",\"trans\":\"por favor otorga\",\"sep\":\" \"},{\"text\":\"nātha\",\"trans\":\"¡oh maestro!\",\"sep\":\"! \"},{\"text\":\"yathā yatha\",\"trans\":\"adecuadamente\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"tabe\",\"trans\":\"entonces\",\"sep\":\" \"},{\"text\":\"ta\",\"trans\":\"ciertamente\",\"sep\":\"’ \"},{\"text\":\"gāiba\",\"trans\":\"cantaré\",\"sep\":\"        \"},{\"text\":\"hari\",\"trans\":\"del Señor\",\"sep\":\"-\"},{\"text\":\"nāma\",\"trans\":\"el Nombre\",\"sep\":\" \"},{\"text\":\"sukhe\",\"trans\":\"felizmente\",\"sep\":\"\"}],[{\"text\":\"aparādha\",\"trans\":\"ofensas\",\"sep\":\" \"},{\"text\":\"habe hata\",\"trans\":\"será\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"3\",\"text\":[\"kabe hena kṛpā    labhiyā e jana\",\"    kṛtārtha ha-ibe, nātha!\",\"śakti-buddhi-hīna    āmi ati dīna\",\"    kara more ātma-sātha\"],\"word_by_word\":[\"**kabe** — ¿cuándo?; **hena** — tal; **kṛpā** — misericordia; **labhiyā** — obtener; **e** — esta; **jana** — persona; **kṛtārtha** — cumplido; **ha-ibe** — será; **nātha!** — ¡oh maestro!; **śakti** — fuerza; **buddhi** — e inteligencia; **hīna** — desprovisto; **ami** — yo; **ati** — mucho; **dīna** — angustiado; **kara’** — por favor hazlo; **more** — a mí; **ātma** — el ser; **sātha** — con.\"],\"translation\":[\"¡Oh, mi Señor! ¿Cuándo esa misericordia recaerá en esta persona? Soy débil, desvalido y desprovisto de inteligencia. Por favor, permíteme estar contigo.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"kabe\",\"trans\":\"¿cuándo?\",\"sep\":\" \"},{\"text\":\"hena\",\"trans\":\"tal\",\"se
