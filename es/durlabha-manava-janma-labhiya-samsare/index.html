\"word_by_word\":[\"**nirvedana** — arrepentimiento; **laksana** — síntoma; **upaladbhi** — sentimiento.\"],\"author\":[\"Śrīla Bhakti Vinod Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"durlabha mānava-janma labhiyā saṁsāre\",\"kṛṣṇa nā bhajinu duḥka kohibo kāhāre?\"],\"word_by_word\":[\"**durlabha** — raro; **mānava-janma** — nacimiento humano; **labhiyā** — obtener; **saṁsāre** — mundo material; **kṛṣṇa** — Kṛṣṇa; **nā** — no; **bhajinu** — adoré; **duḥka** — tristeza; **kohibo** — diré; **kāhāre?** — ¿a quién?\"],\"translation\":[\"La forma humana de vida es la oportunidad más extraordinaria para lograr la perfección espiritual. Pero ahora estoy lamentándome, pues, de una u otra manera, nací con esa oportunidad y la desperdicié al nunca adorar al Señor Kṛṣṇa. ¡Oh! ¿A quién le diré el relato de esta miseria?\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"durlabha\",\"trans\":\"raro\",\"sep\":\" \"},{\"text\":\"mānava-janma\",\"trans\":\"nacimiento humano\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"labhiyā\",\"trans\":\"obtener\",\"sep\":\" \"},{\"text\":\"saṁsāre\",\"trans\":\"mundo material\",\"sep\":\"\"}],[{\"text\":\"kṛṣṇa\",\"trans\":\"Kṛṣṇa\",\"sep\":\" \"},{\"text\":\"nā\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"bhajinu\",\"trans\":\"adoré\",\"sep\":\" \"},{\"text\":\"duḥka\",\"trans\":\"tristeza\",\"sep\":\" \"},{\"text\":\"kohibo\",\"trans\":\"diré\",\"sep\":\" \"},{\"text\":\"kāhāre\",\"trans\":\"¿a quién?\",\"sep\":\"?\"}]]},{\"number\":\"2\",\"text\":[\"‘saṁsār’ ‘saṁsār’, kori miche gela kāl\",\"lābha nā koilo kichu, ghaṭilo jañjāl\"],\"word_by_word\":[\"**‘saṁsār’** — vida de famila; **‘saṁsār’** — vida de familia; **kori** — hacer; **miche** — falsamente; **gelo** — se ha ido; **kāl** — el tiempo; **lābha** — obtener; **nā** — no; **koila** — hice; **kichu** — nada; **ghaṭilo** — fue; **jañjāl** — problema.\"],\"translation\":[\"Me casé y entré en los enredos de la vida familiar materialista, y pasé mi tiempo en vano. Nunca obtuve ganancia tangible o beneficio permanente alguno, solo problemas y lamentación.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"‘saṁsār\",\"trans\":\"vida de famila\",\"sep\":\"’ \"},{\"text\":\"‘saṁsār\",\"trans\":\"vida de familia\",\"sep\":\"’, \"},{\"text\":\"kori\",\"trans\":\"hacer\",\"sep\":\" \"},{\"text\":\"miche\",\"trans\":\"falsamente\",\"sep\":\" \"},{\"text\":\"gela\",\"trans\":\"se ha ido\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kāl\",\"trans\":\"el tiempo\",\"sep\":\"\"}],[{\"text\":\"lābha\",\"trans\":\"obtener\",\"sep\":\" \"},{\"text\":\"nā\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"koilo\",\"trans\":\"hice\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kichu\",\"trans\":\"nada\",\"sep\":\", \"},{\"text\":\"ghaṭilo\",\"trans\":\"fue\",\"sep\":\" \"},{\"text\":\"jañjāl\",\"trans\":\"problema\",\"sep\":\"\"}]]},{\"number\":\"3\",\"text\":[\"kisera saṁsār ei chāyābāji prāy\",\"ihāte mamatā kori bṛthā dina jāy\"],\"word_by_word\":[\"**kisera** — ¿de qué tipo?; **saṁsār** — mundo material; **ei** — este; **chāyābāji** — mágico; **prāy** — tal como; **ihāte** — aquí; **mamatā** — apego; **kori** — hacer; **bṛthā** — inútil; **dina** — días; **jāy** — pasa.\"],\"translation\":[\"De cualquier modo, ¿qué clase de mundo es este? Se parece al espectáculo de una linterna mágica que vi en un carnaval, donde muchas sombras e ilusiones ópticas bailaron ante mis ojos. Siento un gran apego e identificación con semejante mundo, y, de ese modo, un día tras otro transcurre infructuosamente, sin ningún propósito.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"kisera\",\"trans\":\"¿de qué tipo?\",\"sep\":\" \"},{\"text\":\"saṁsār\",\"trans\":\"mundo material\",\"sep\":\" \"},{\"text\":\"ei\",\"trans\":\"este\",\"sep\":\" \"},{\"text\":\"chāyābāji\",\"trans\":\"mágico\",\"sep\":\" \"},{\"text\":\"prāy\",\"trans\":\"tal como\",\"sep\":\"\"}],[{\"text\":\"ihāte\",\"trans\":\"aquí\",\"sep\":\" \"},{\"text\":\"mamatā\",\"trans\":\"apego\",\"sep\":\" \"},{\"text\":\"kori\",\"trans\":\"hacer\",\"sep\":\" \"},{\"text\":\"bṛthā\",\"trans\":\"inútil\",\"sep\":\" \"},{\"text\":\"dina\",\"trans\":\"días\",\"sep\":\" \"},{\"text\":\"jāy\",\"trans\":\"pasa\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"e deho patana ho’le ki robe āmār?\",\"keho sukha nāhi dibe putra paribār\"],\"word_by_word\":[\"**e deho** — este cuerpo; **patana** — caer; **ho’le** — es; **ki** — ¿qué?; **robe** — estará; **āmār?** — mío; **keho** — algo; **sukha** — felicidad; **nāhi** — no; **dibe** — dará; **putra** — hijo; **paribār** — séquito.\"],\"translation\":[\"Cuando este cuerpo caiga al piso, muerto, ¿qué podrá quedar que sea mío? En ese momento, todos mis hijos y las personas que me son más queridas no podrán proporcionarme felicidad alguna.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"e deho\",\"trans\":\"este cuerpo\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"patana\",\"trans\":\"caer\",\"sep\":\" \"},{\"text\":\"ho’le\",\"trans\":\"es\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"ki\",\"trans\":\"¿qué?\",\"sep\":\" \"},{\"text\":\"robe\",\"trans\":\"estará\",\"sep\":\" \"},{\"text\":\"āmār\",\"trans\":\"mío\",\"sep\":\"?\"}],[{\"text\":\"keho\",\"trans\":\"algo\",\"sep\":\" \"},{\"text\":\"sukha\",\"trans\":\"felicidad\",\"sep\":\" \"},{\"text\":\"nāhi\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"dibe\",\"trans\":\"dará\",\"sep\":\" \"},{\"text\":\"putra\",\"trans\":\"hijo\",\"sep\":\" \"},{\"text\":\"paribār\",\"trans\":\"séquito\",\"sep\":\"\"}]]},{\"number\":\"5\",\"text\":[\"garddabher mata āmi kori pariśram\",\"kāra lāgi’ eto kori, na ghuchilo bhrama\"],\"word_by_word\":[\"**garddabher** — un asno; **mata** — tal como; **āmi** — yo; **kori** — hacer; **pariśram** — trabajo duro; **kāra** — ¿a quién?; **lāgi’** — tocar; **eto** — esto; **kori** — hago; **na** — no; **ghuchilo** — destriur; **bhrama** — ilusión.\"],\"translation\":[\"Cada día trabajo duro como un asno, y me pregunto ahora, ¿para quién trabajo tan duro? Aún estoy rodeado de tantas ilusiones.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"garddabher\",\"trans\":\"un asno\",\"sep\":\" \"},{\"text\":\"mata\",\"trans\":\"tal como\",\"sep\":\" \"},{\"text\":\"āmi\",\"trans\":\"yo\",\"sep\":\" \"},{\"text\":\"kori\",\"trans\":\"hacer\",\"sep\":\" \"},{\"text\":\"pariśram\",\"trans\":\"trabajo duro\",\"sep\":\"\"}],[{\"text\":\"kāra\",\"trans\":\"¿a quién?\",\"sep\":\" \"},{\"text\":\"lāgi\",\"trans\":\"tocar\",\"sep\":\"’ \"},{\"text\":\"eto\",\"trans\":\"esto\",\"sep\":\" \"},{\"text\":\"kori\",\"trans\":\"hago\",\"sep\":\", \"},{\"text\":\"na\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"ghuchilo\",\"trans\":\"destriur\",\"sep\":\" \"},{\"text\":\"bhrama\",\"trans\":\"ilusión\",\"sep\":\"\"}]]},{\"number\":\"6\",\"text\":[\"dina jāy michā kāje, niśā nidrā-baśe\",\"nāhi bhāvi maraṇa nikaṭe āche bose\"],\"word_by_word\":[\"**dina** — días; **jāy** — pasa; **michā** — inútilmente; **kāje** — trabajando; **niśā** — de noche; **nidrā-baśe** — controlado por el sueño; **nāhi** — no; **bhāvi** — pienso; **maraṇa** — la muerte; **nikaṭe** — cerca; **āche** — está; **bose** — sentada.\"],\"translation\":[\"Desperdicio cada día en un trabajo inútil e insignificante, y, gobernado por el sueño, desperdicio cada noche. Y en el transcurso de cada veinticuatro horas nunca considero por un segundo que la muerte se encuentra sentada muy cerca de mí.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"dina\",\"trans\":\"días\",\"sep\":\" \"},{\"text\":\"jāy\",\"trans\":\"pasa\",\"sep\":\" \"},{\"text\":\"michā\",\"trans\":\"inútilmente\",\"sep\":\" \"},{\"text\":\"kāje\",\"trans\":\"trabajando\",\"sep\":\", \"},{\"text\":\"niśā\",\"trans\":\"de noche\",\"sep\":\" \"},{\"text\":\"nidrā-baśe\",\"trans\":\"controlado por el sueño\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"nāhi\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"bhāvi\",\"trans\":\"pienso\",\"sep\":\" \"},{\"text\":\"maraṇa\",\"trans\":\"la muerte\",\"sep\":\" \"},{\"text\":\"nikaṭe\",\"trans\":\"cerca\",\"sep\":\" \"},{\"text\":\"āche\",\"trans\":\"está\",\"sep\":\" \"},{\"text\":\"bose\",\"trans\":\"sentada\",\"sep\":\"\"}]]},{\"number\":\"7\",\"text\":[\"bhālo manda-khāi, heri, pari, chintā-hīna\",\"nāhi bhāvi, e deho chāḍibo kon dina\"],\"word_by_word\":[\"**bhālo** — bueno; **manda** — malo; **khāi** — yo como; **heri** — yo veo; **pari** — yo hago; **chintā-hīna** — sin ansiedad; **nāhi** — no; **bhāvi** — yo sé; **e deho** — este cuerpo; **chāḍibo** — abandonaré; **kon** — algún; **dina** — día.\"],\"translation\":[\"Vivo un estilo de vida muy libre de cuidados, comiendo, saliendo afuera, usando una buena ropa que me guste, pero nunca considero que un día tendré que abandonar este cuerpo.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"bhālo\",\"trans\":\"bueno\",\"sep\":\" \"},{\"text\":\"manda\",\"trans\":\"malo\",\"sep\":\"-\"},{\"text\":\"khāi\",\"trans\":\"yo como\",\"sep\":\", \"},{\"text\":\"heri\",\"trans\":\"yo veo\",\"sep\":\", \"},{\"text\":\"pari\",\"trans\":\"yo hago\",\"sep\":\", \"},{\"text\":\"chintā-hīna\",\"trans\":\"sin ansiedad\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"nāhi\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"bhāvi\",\"trans\":\"yo sé\",\"sep\":\", \"},{\"text\":\"e deho\",\"trans\":\"este cuerpo\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"chāḍibo\",\"trans\":\"abandonaré\",\"sep\":\" \"},{\"text\":\"kon\",\"trans\":\"algún\",\"sep\":\" \"},{\"text\":\"dina\",\"trans\":\"día\",\"sep\":\"\"}]]},{\"number\":\"8\",\"text\":[\"deho-geho-kalatrādi-chintā abirata\",\"jāgiche hṛdoye mora buddhi kori hoto\"],\"word_by_word\":[\"**deho** — cuerpo; **geho** — hogar; **kalatra-ādi** — esposa y otros; **chintā** — preocupación; **abirata** — sin parar; **jāgiche** — despierto; **hṛdoye** — en el corazón; **mora** — mío; **buddhi** — inteligencia; **kori** — hacer; **hoto** — destruído.\"],\"translation\":[\"Mi pobre corazón está plagado de constantes ansiedades provocadas por la manutención y la agitación diaria que conllevan mi cuerpo, mi casa, mi esposa, los miembros de mi familia y mis obligaciones sociales. Todas estas ansiedades me afligen y están destruyendo toda mi inteligencia.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"deho\",\"trans\":\"cuerpo\",\"sep\":\"-\"},{\"text\":\"geho\",\"trans\":\"hogar\",\"sep\":\"-\"},{\"text\":\"kalatrādi-chintā\",\"trans\":\"esposa y otros\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"abirata\",\"trans\":\"preocupación\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"jāgiche\",\"trans\":\"sin parar\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hṛdoye\",\"trans\":\"despierto\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"mora\",\"trans\":\"en el corazón\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"buddhi\",\"trans\":\"mío\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kori\",\"trans\":\"inteligencia\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hoto\",\"trans\":\"hacer\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"9\",\"text\":[\"¡hāy, hāy! nāhi bhāvi-anitya e saba\",\"jīvana bigate kothā rohibe vaibhava?\"],\"word_by_word\":[\"**¡hāy, hāy!** — ¡ay de mí, ay de mí!; **nāhi** — no; **bhāvi** — pienso; **anitya** — temporal; **e saba** — todo esto; **jīvana** — vida; **bigate** — se fue; **kothā** — ¿adónde?; **rohibe** — estará; **vaibhava?** — opulencias.\"],\"translation\":[\"¡Ay de mí, ay de mí! ¡Qué situación tan llena de remordimientos ha surgido! Estoy absorto en todos estos problemas, sin considerar que todas estas cosas son temporales y están sujetas a perecer muy pronto. Después de que muera y me vaya, ¿dónde quedará todo eso que era mi opulencia material?\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"¡hāy, hāy\",\"trans\":\"¡ay de mí, ay de mí!\",\"sep\":\"! \",\"error\":\"multi\"},{\"text\":\"nāhi\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"bhāvi\",\"trans\":\"pienso\",\"sep\":\"-\"},{\"text\":\"anitya\",\"trans\":\"temporal\",\"sep\":\" \"},{\"text\":\"e saba\",\"trans\":\"todo esto\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"jīvana\",\"trans\":\"vida\",\"sep\":\" \"},{\"text\":\"bigate\",\"trans\":\"se fue\",\"sep\":\" \"},{\"text\":\"kothā\",\"trans\":\"¿adónde?\",\"sep\":\" \"},{\"text\":\"rohibe\",\"trans\":\"estará\",\"sep\":\" \"},{\"text\":\"vaibhava\",\"trans\":\"opulencias\",\"sep\":\"?\"}]]},{\"number\":\"10\",\"text\":[\"śmaśane śorīra mama poḍiyā rohibe\",\"bihaṅga-pataṅga tāy bihāra koribe\"],\"word_by_word\":[\"**śmaśane** — en la cremación; **śorīra** — cuerpo; **mama** — mi; **poḍiyā** — caer; **rohibe** — estará; **bihaṅga** — pájaros; **pataṅga** — insectos; **tāy** — de eso; **bihāra** — diversión; **koribe** — será.\"],\"translation\":[\"Cuando mi cuerpo sea arrojado en el hoyo de un campo crematorio, simplemente yacerá allí, inerte. Luego, muchos cuervos, buitres, hormigas y gusanos irán allí a divertirse.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"śmaśane\",\"trans\":\"en la cremación\",\"sep\":\" \"},{\"text\":\"śorīra\",\"trans\":\"cuerpo\",\"sep\":\" \"},{\"text\":\"mama\",\"trans\":\"mi\",\"sep\":\" \"},{\"text\":\"poḍiyā\",\"trans\":\"caer\",\"sep\":\" \"},{\"text\":\"rohibe\",\"trans\":\"estará\",\"sep\":\"\"}],[{\"text\":\"bihaṅga\",\"trans\":\"pájaros\",\"sep\":\"-\"},{\"text\":\"pataṅga\",\"trans\":\"insectos\",\"sep\":\" \"},{\"text\":\"tāy\",\"trans\":\"de eso\",\"sep\":\" \"},{\"text\":\"bihāra\",\"trans\":\"diversión\",\"sep\":\" \"},{\"text\":\"koribe\",\"trans\":\"será\",\"sep\":\"\"}]]},{\"number\":\"11\",\"text\":[\"kukkur sṛgāl saba ānandita ho’ye\",\"mahotsava koribe āmār deho lo’ye\"],\"word_by_word\":[\"**kukkur** — perros; **sṛgāl** — chacales; **saba** — todos; **ānandita** — encantados; **ho’ye** — estarán; **mahotsava** — gran festival; **koribe** — harán; **āmār** — de mi; **deho** — cuerpo; **lo’ye** — obtener.\"],\"translation\":[\"Todos los perros callejeros y chacales se sentirán muy encantados, y con gran éxtasis harán con mi cuerpo un enorme festival, a ras de tierra.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"kukkur\",\"trans\":\"perros\",\"sep\":\" \"},{\"text\":\"sṛgāl\",\"trans\":\"chacales\",\"sep\":\" \"},{\"text\":\"saba\",\"trans\":\"todos\",\"sep\":\" \"},{\"text\":\"ānandita\",\"trans\":\"encantados\",\"sep\":\" \"},{\"text\":\"ho’ye\",\"trans\":\"estarán\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"mahotsava\",\"trans\":\"gran festival\",\"sep\":\" \"},{\"text\":\"koribe\",\"trans\":\"harán\",\"sep\":\" \"},{\"text\":\"āmār\",\"trans\":\"de mi\",\"sep\":\" \"},{\"text\":\"deho\",\"trans\":\"cuerpo\",\"sep\":\" \"},{\"text\":\"lo’ye\",\"trans\":\"obtener\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"12\",\"text\":[\"je deher ei gati, tāra anugata\",\"saṁsār-vaibhava āro bandhu-jan jata\"],\"word_by_word\":[\"**je** — tal; **deher** — del cuerpo; **ei gati** — ese destino; **tāra** — de eso; **anugata** — seguir; **saṁsār-vaibhava** — opulencias materiales; **āro** — y; **bandhu-jan** — amigos y parientes; **jata** — cuyos.\"],\"translation\":[\"Solo vean, este es el destino final de este cuerpo material. Y lo más asombroso es que toda mi opulencia material, mi casa, mi familia y mis amigos tendrán exactamente el mismo destino.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"je\",\"trans\":\"tal\",\"sep\":\" \"},{\"text\":\"deher\",\"trans\":\"del cuerpo\",\"sep\":\" \"},{\"text\":\"ei gati\",\"trans\":\"ese destino\",\"sep\":\", \",\"error\":\"multi\"},{\"text\":\"tāra\",\"trans\":\"de eso\",\"sep\":\" \"},{\"text\":\"anugata\",\"trans\":\"seguir\",\"sep\":\"\"}],[{\"text\":\"saṁsār-vaibhava\",\"trans\":\"opulencias materiales\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"āro\",\"trans\":\"y\",\"sep\":\" \"},{\"text\":\"bandhu-jan\",\"trans\":\"amigos y parientes\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"jata\",\"trans\":\"cuyos\",\"sep\":\"\"}]]},{\"number\":\"13\",\"text\":[\"ataeva māyā-moha chāḍi buddhimān\",\"nitya-tattva kṛṣṇa-bhakti koruna sandhān\"],\"word_by_word\":[\"**ataeva** — por lo tanto; **māyā-moha** — desconciertos; **chāḍi** — renunciar; **buddhimān** — inteligente; **nitya-tattva** — verdad eterna; **kṛṣṇa-bhakti** — servicio devocional a Kṛṣṇa; **koruna** — bondad; **sandhān** — práctica.\"],\"translation\":[\"Por lo tanto, le pido a quienquiera que tenga una inteligencia aguda: Por favor, abandona esas ilusiones temporales que Māyā ofrece y ten la bondad de buscar los medios para alcanzar una devoción pura por el Señor Krisna, pues esta es realmente la única verdad eterna tangible.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"ataeva\",\"trans\":\"por lo tanto\",\"sep\":\" \"},{\"text\":\"māyā-moha\",\"trans\":\"desconciertos\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"chāḍi\",\"trans\":\"renunciar\",\"sep\":\" \"},{\"text\":\"buddhimān\",\"trans\":\"inteligente\",\"sep\":\"\"}],[{\"text\":\"nitya-tattva\",\"trans\":\"verdad eterna\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"kṛṣṇa-bhakti\",\"trans\":\"servicio devocional a Kṛṣṇa\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"koruna\",\"trans\":\"bondad\",\"sep\":\" \"},{\"text\":\"sandhān\",\"trans\":\"práctica\",\"sep\":\"\"}]]}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/kostya-netrebenko/16-durlabha-manava-janma-9\"},{\"title\":{\"en\":\"Caracas temple\",\"ru\":\"Храм г.Каракас\",\"ua\":\"Храм м.Каракас\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/shchsm-karakas-durlava-manava\"}]},\"hasWbw\":true,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1f:[\"$\",\"$L28\",null,{\"audio\":\"$1e:props:song:resources:audio\",\"caption\":\"Escuchar audio:\",\"language\":\"es\"}]\n20:[\"$\",\"$L29\",null,{\"navMap\":{\"208\":{\"prev\":{\"path\":\"/es/shri-rupa-manjari-pada-sei-mora-sampada/\",\"title\":\"Lālasā\"},\"next\":{\"path\":\"/es/anya-abhilasha-chadi-jniana-karma-parihari/\",\"title\":\"Anya-abhilāṣa chāḍi\"}}}}]\n2a:T108a,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"description\":\"A digital Vaishnava songbook with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPage\",\"@id\":\"https://dev.kirtan.site/es/durlabha-manava-janma-labhiya-samsare/\",\"url\":\"https://dev.kirtan.site/es/durlabha-manava-janma-labhiya-samsare/\",\"name\":\"Nirvedana lakṣaṇa upaladbhi, 4. Śrīla Bhakti Vinod Ṭhākur\",\"inLanguage\":\"es\",\"description\":\"Nirvedana lakṣaṇa upaladbhi, 4 — una canción vaiṣṇava de Śrīla Bhakti Vinod Ṭhākur con letra, traducción al español y significado palabra por palabra. Del libro «Guía de Kīrtan».\",\"breadcrumb\":{\"@id\":\"https://dev.kirtan.site/es/durlabha-manava-janma-labhiya-samsare/#breadcrumb\"},\"mainEntity\":{\"@id\":\"https://dev.kirtan.site/es/durlabha-manava-janma-labhiya-samsare/#composition\"},\"isPartOf\":{\"@id\":\"https://dev.kir
