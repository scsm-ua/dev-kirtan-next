ama\",\"gharma muhur-muhuḥ,        vivarṇa ha-ibe,\",\"        stambhita pralaya-sama\"],\"word_by_word\":[\"**gada-gada** — vacilante; **vāṇī** — enunciado; **mukhe** — de mi boca; **vāhiribe** — saldrá; **kā̐pibe** — temblará; **śarīra** — cuerpo; **mama** — mi; **gharma** — transpiración; **muhuḥ** — otra vez; **muhuḥ** — y otra vez; **vivarṇa** — pálido; **ha-ibe** — será; **stambhita** — aturdido; **pralaya** — devastación; **sama** — tal como.\"],\"translation\":[\"Mi boca emitirá voces vacilantes. Mi cuerpo temblará, transpirará una y otra vez, se pondrá pálido y quedará aturdido tal como si estuviese devastado.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"gada-gada\",\"trans\":\"vacilante\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"vāṇī\",\"trans\":\"enunciado\",\"sep\":\",        \"},{\"text\":\"mukhe\",\"trans\":\"de mi boca\",\"sep\":\" \"},{\"text\":\"vāhiribe\",\"trans\":\"saldrá\",\"sep\":\",\"}],[{\"text\":\"kā̐pibe\",\"trans\":\"temblará\",\"sep\":\" \"},{\"text\":\"śarīra\",\"trans\":\"cuerpo\",\"sep\":\" \"},{\"text\":\"mama\",\"trans\":\"mi\",\"sep\":\"\"}],[{\"text\":\"gharma\",\"trans\":\"transpiración\",\"sep\":\" \"},{\"text\":\"muhur\",\"trans\":\"otra vez\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"muhuḥ\",\"trans\":\"y otra vez\",\"sep\":\",        \"},{\"text\":\"vivarṇa\",\"trans\":\"pálido\",\"sep\":\" \"},{\"text\":\"ha-ibe\",\"trans\":\"será\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"stambhita\",\"trans\":\"aturdido\",\"sep\":\" \"},{\"text\":\"pralaya\",\"trans\":\"devastación\",\"sep\":\"-\"},{\"text\":\"sama\",\"trans\":\"tal como\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"niṣkapaṭe hena,        daśā kabe ha’be,\",\"        nirantara nāma gāba\",\"āveśe rahiyā,        deha-yātrā kari’\",\"        tomāra karuṇā pāba\"],\"word_by_word\":[\"**niṣkapaṭe** — sin engaño, sinceramente; **hena** — tal; **daśā** — condición, estado de éxtasis; **kabe** — ¿cuándo?; **h
