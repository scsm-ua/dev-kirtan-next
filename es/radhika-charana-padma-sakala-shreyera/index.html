hor\":[\"Śrīla Bhakti Vinod Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"rādhikā-charaṇa-padma,        sakala śreyera sadma,\",\"        jatane je nāhi ārādhilo\",\"rādhā-padāṅkita dhāma,        vṛndāvana jār nāma,\",\"        tāhā je nā āśroya korilo\"],\"word_by_word\":[\"**rādhikā-charaṇa-padma** — los pies de loto de Śrī Rādhā; **sakala śreyera** — todo lo que es bueno; **sadma** — la morada; **jatane** — con cuidado; **je nāhi** — los cuales no; **ārādhilo** — adorado; **rādhā** — de Rādhā; **padāṅkita** — marcados con lotos; **dhāma** — morada; **vṛndāvana** — de Vṛndāvan; **jār** — de quien; **nāma** — el nombre; **tāhā** — Tuyo; **je nā** — el que no; **āśroya** — refugio; **korilo** — hace.\"],\"translation\":[\"Los pies de loto de Śrī Rādhā son la morada de todo lo auspicioso, la meta suprema de la vida. Aquel que en su vida descuida el tomar refugio de ese santo Dhām llamado Vṛndāvan, el cual está decorado por el loto que es Rādhā...\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"rādhikā-charaṇa-padma\",\"trans\":\"los pies de loto de Śrī Rādhā\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"sakala śreyera\",\"trans\":\"todo lo que es bueno\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"sadma\",\"trans\":\"la morada\",\"sep\":\",\"}],[{\"text\":\"jatane\",\"trans\":\"con cuidado\",\"sep\":\" \"},{\"text\":\"je nāhi\",\"trans\":\"los cuales no\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"ārādhilo\",\"trans\":\"adorado\",\"sep\":\"\"}],[{\"text\":\"rādhā\",\"trans\":\"de Rādhā\",\"sep\":\"-\"},{\"text\":\"padāṅkita\",\"trans\":\"marcados con lotos\",\"sep\":\" \"},{\"text\":\"dhāma\",\"trans\":\"morada\",\"sep\":\",        \"},{\"text\":\"vṛndāvana\",\"trans\":\"de Vṛndāvan\",\"sep\":\" \"},{\"text\":\"jār\",\"trans\":\"de quien\",\"sep\":\" \"},{\"text\":\"nāma\",\"trans\":\"el nombre\",\"sep\":\",\"}],[{\"text\":\"tāhā\",\"trans\":\"Tuyo\",\"sep\":\" \"},{\"text\":\"je nā\",\"trans\":\"el que no\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"āśroya\",\"trans\":\"refugio\",\"sep\":\" \"},{\"text\":\"korilo\",\"trans\":\"hace\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"rādhikā-bhāva-gambhīra,    chitta jebā mahādhīra\",\"        gaṇa-saṅga nā koilo jīvane\",\"kemone se śyāmānanda,        rasa-sindhu-snānānanda,\",\"        lobhibe bujhoho ek-mane\"],\"word_by_word\":[\"**rādhikā** — de Śrī Rādhā; **bhāva** — amor; **gambhīra** — profundo; **chitta** — corazón; **jebā** — quien; **mahā-dhīra** — muy santo; **gaṇa-saṅga** — asociación de muchos; **nā koilo** — no hace; **jīvane** — vida; **kemone** — ¿cómo?; **se** — él; **śyāmānanda** — el oscuro Señor Kṛṣṇa; **rasa** — néctar; **sindhu** — océano; **snāna** — bañarse; **ānanda** — júbilo; **lobhibe** — obtendrás; **bujhoho** — por favor sepan; **ek-mane** — una mente.\"],\"translation\":[\"...quien descuida el asociarse con los íntimos asociados de Śrī Rādhā, los cuales son excelentemente inteligentes y se encuentran profundamente colmados del humor de devoción de Śrī Rādhā, ¿cómo esa persona podrá bañarse en ese océano de júbilo extático (*rāsa-sindhu*) el cual es Śyāmasundar? Ustedes deben entender sinceramente este punto.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"rādhikā\",\"trans\":\"de Śrī Rādhā\",\"sep\":\"-\"},{\"text\":\"bhāva\",\"trans\":\"amor\",\"sep\":\"-\"},{\"text\":\"gambhīra\",\"trans\":\"profundo\",\"sep\":\",    \"},{\"text\":\"chitta\",\"trans\":\"corazón\",\"sep\":\" \"},{\"text\":\"jebā\",\"trans\":\"quien\",\"sep\":\" \"},{\"text\":\"mahādhīra\",\"trans\":\"muy santo\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"gaṇa-saṅga\",\"trans\":\"asociación de muchos\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"nā koilo\",\"trans\":\"no hace\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"jīvane\",\"trans\":\"vida\",\"sep\":\"\"}],[{\"text\":\"kemone\",\"trans\":\"¿cómo?\",\"sep\":\" \"},{\"text\":\"se\",\"trans\":\"él\",\"sep\":\" \"},{\"text\":\"śyāmānanda\",\"trans\":\"el oscuro Señor Kṛṣṇa\",\"sep\":\",        \"},{\"text\":\"rasa\",\"trans\":\"néctar\",\"sep\":\"-\"},{\"text\":\"sindhu\",\"trans\":\"océano\",\"sep\":\"-\"},{\"text\":\"snānānanda\",\"trans\":\"bañarse\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"lobhibe\",\"trans\":\"júbilo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bujhoho\",\"trans\":\"obtendrás\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"ek\",\"trans\":\"por favor sepan\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"mane\",\"trans\":\"una mente\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"3\",\"text\":[\"rādhikā ujvala-rasera āchāryya\",\"rādhā-mādhava-śuddha-prema bichāryya\"],\"word_by_word\":[\"**rādhikā** — de Śrī Rādhā; **ujvala** — espléndido; **rasera** — del *rasa*; **āchāryya** — instructor ejemplar; **rādhā-mādhava** — Śrī Śrī Rādḥā Kṛṣṇa; **śuddha** — puro; **prema** — amor divino; **bichāryya** — considerado.\"],\"translation\":[\"Śrī Rādhā es el instructor ejemplar de las melosidades del amor conyugal. El amor extático puro por Śrī Śrī Rādhā-Mādhava es lo que debe ser considerado y discutido.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"rādhikā\",\"trans\":\"de Śrī Rādhā\",\"sep\":\" \"},{\"text\":\"ujvala\",\"trans\":\"espléndido\",\"sep\":\"-\"},{\"text\":\"rasera\",\"trans\":\"del *rasa*\",\"sep\":\" \"},{\"text\":\"āchāryya\",\"trans\":\"instructor ejemplar\",\"sep\":\"\"}],[{\"text\":\"rādhā-mādhava\",\"trans\":\"Śrī Śrī Rādḥā Kṛṣṇa\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"śuddha\",\"trans\":\"puro\",\"sep\":\"-\"},{\"text\":\"prema\",\"trans\":\"amor divino\",\"sep\":\" \"},{\"text\":\"bichāryya\",\"trans\":\"considerado\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"je dhorilo rādhā-pada parama jatane\",\"se pāilo kṛṣṇa-pada amūlya-ratane\"],\"word_by_word\":[\"**je dhorilo** — quien sostiene; **rādhā-pada** — los pies de Śrī Rādhā; **parama** — con grandeza; **jatane** — con cuidado; **se pāilo** — él obtiene; **kṛṣṇa-pada** — los pies de Kṛṣṇa; **amúlya** — sin precio; **ratane** — joya.\"],\"translation\":[\"Aquel que se abraza fuertemente, con gran atención, a los pies de loto de Śrī Rādhā, ciertamente obtendrá las inestimables joyas de los pies de loto de Kṛṣṇa.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"je dhorilo\",\"trans\":\"quien sostiene\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"rādhā-pada\",\"trans\":\"los pies de Śrī Rādhā\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"parama\",\"trans\":\"con grandeza\",\"sep\":\" \"},{\"text\":\"jatane\",\"trans\":\"con cuidado\",\"sep\":\"\"}],[{\"text\":\"se pāilo\",\"trans\":\"él obtiene\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"kṛṣṇa-pada\",\"trans\":\"los pies de Kṛṣṇa\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"amūlya\",\"trans\":\"sin precio\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"ratane\",\"trans\":\"joya\",\"sep\":\"\"}]]},{\"number\":\"5\",\"text\":[\"rādhā-pada binā kobhu kṛṣṇa nāhi mile\",\"rādhāra dāsīr kṛṣṇa sarvva-vede bole\"],\"word_by_word\":[\"**rādhā-pada** — los pies de Śrī Rādhā; **binā** — sin; **kobhu** — cuando; **kṛṣṇa** — Kṛṣṇa; **nāhi** — no; **mile** — encuentra; **rādhāra** — de Rādhā; **dāsīr** — de la sirvienta; **kṛṣṇa** — Kṛṣṇa; **sarvva-vede** — todos los *Vedas*; **bole** — dicen.\"],\"translation\":[\"Sin tomar refugio en los pies de loto de Śrī Rādhā, uno nunca verá a Kṛṣṇa. Todos los *Vedas* afirman que Kṛṣṇa pertenece a las sirvientas de Śrī Rādhā.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"rādhā-pada\",\"trans\":\"los pies de Śrī Rādhā\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"binā\",\"trans\":\"sin\",\"sep\":\" \"},{\"text\":\"kobhu\",\"trans\":\"cuando\",\"sep\":\" \"},{\"text\":\"kṛṣṇa\",\"trans\":\"Kṛṣṇa\",\"sep\":\" \"},{\"text\":\"nāhi\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"mile\",\"trans\":\"encuentra\",\"sep\":\"\"}],[{\"text\":\"rādhāra\",\"trans\":\"de Rādhā\",\"sep\":\" \"},{\"text\":\"dāsīr\",\"trans\":\"de la sirvienta\",\"sep\":\" \"},{\"text\":\"kṛṣṇa\",\"trans\":\"Kṛṣṇa\",\"sep\":\" \"},{\"text\":\"sarvva-vede\",\"trans\":\"todos los *Vedas*\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"bole\",\"trans\":\"dicen\",\"sep\":\"\"}]]},{\"number\":\"6\",\"text\":[\"choḍata dhana-jana,        kalatra-suta-mita,\",\"        choḍata karama geyān\",\"rādhā-pada-paṅkaja,        madhurata sevana,\",\"        bhakativinoda paramāṇ\"],\"word_by_word\":[\"**choḍata** — renunciar; **dhana-jana** — riqueza y seguidores; **kalatra** — esposa; **suta** — hijos; **mita** — amigos; **choḍata** — renunciar; **karama** — actividades fruitivas; **geyān** — al *jñana*; **rādhā-pada-paṅkaja** — los pies de loto de Śrī Rādḥā; **madhurata** — dulces; **sevana** — servicio; **bhakativinoda** — Bhakti Vinoda; **paramāṇ** — testimonio.\"],\"translation\":[\"Tras abandonar la riqueza, los seguidores, la esposa, los hijos, la familia, los amigos, las actividades materiales y el conocimiento intelectual, uno debe absorberse en la dulzura divina del servicio a los pies de Śrī Rādhā como una de Sus sirvientas en *madhura-rasa*. Esta es la solemne declaración de Bhakti Vinod.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"choḍata\",\"trans\":\"renunciar\",\"sep\":\" \"},{\"text\":\"dhana-jana\",\"trans\":\"riqueza y seguidores\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"kalatra\",\"trans\":\"esposa\",\"sep\":\"-\"},{\"text\":\"suta\",\"trans\":\"hijos\",\"sep\":\"-\"},{\"text\":\"mita\",\"trans\":\"amigos\",\"sep\":\",\"}],[{\"text\":\"choḍata\",\"trans\":\"renunciar\",\"sep\":\" \"},{\"text\":\"karama\",\"trans\":\"actividades fruitivas\",\"sep\":\" \"},{\"text\":\"geyān\",\"trans\":\"al *jñana*\",\"sep\":\"\"}],[{\"text\":\"rādhā-pada-paṅkaja\",\"trans\":\"los pies de loto de Śrī Rādḥā\",
