xt\":[\"bhaja bhakata-vatsala śrī-gaurahari\",\"śrī-gaurahari sohi goṣṭha-vihārī\",\"nanda-yaśomatī-chita-hārī\"],\"word_by_word\":[\"**bhaja** — solo adora; **bhakata-vatsala** — quien siempre es muy afectuoso con Sus devotos; **śrī-gaurahari** — el Señor Chaitanya; **śrī-gaurahari** — este Śrī Gaurahari; **sohi** — es lo mismo que; **goṣṭha** — en los campos; **bihārī** — el que se divierte; **nanda-yaśomatī** — de Nanda Mahārāj y Madre Yaśodā; **chitta-hārī** — quien ha robado los corazones.\"],\"translation\":[\"Tan solo adora a Śrī Gaurahari, quien es siempre afectuoso con Sus devotos. Él es el mismo Dios Supremo, Kṛṣṇa, quien jugó en los campos de pastoreo de Vraja y quien robó los corazones de Nanda y Yaśodā.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"bhaja\",\"trans\":\"solo adora\",\"sep\":\" \"},{\"text\":\"bhakata-vatsala\",\"trans\":\"quien siempre es muy afectuoso con Sus devotos\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"śrī-gaurahari\",\"trans\":\"el Señor Chaitanya\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"śrī-gaurahari\",\"trans\":\"este Śrī Gaurahari\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"sohi\",\"trans\":\"es lo mismo que\",\"sep\":\" \"},{\"text\":\"goṣṭha\",\"trans\":\"en los campos\",\"sep\":\"-\"},{\"text\":\"vihārī\",\"trans\":\"el que se divierte\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"nanda-yaśomatī\",\"trans\":\"de Nanda Mahārāj y Madre Yaśodā\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"chita-hārī\",\"trans\":\"quien ha robado los corazones\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"2\",\"text\":[\"“belā ha’lo, dāmodara, āisa ekhana\",\"bhoga-mandire basi’ karaha bhojana”\"],\"word_by_word\":[\"**belā ha’lo** — es muy tarde; **dāmodara** — ¡oh, Dāmodara!; **āisa** — por favor, ven; **ekhona** — aquí; **bhoga-mandire** — en la sala de *prasādam*; **basi’** — sentado; **karoha** — por favor toma; **bhojana** — tu almuerzo.\"],\"translation\":[\"Madre Yaśodā llama a Kṛṣṇa: “Mi querido Dāmodar, ya es tarde. Por favor, ven de inmediato, siéntate en el comedor para que tomes Tu almuerzo”.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"“belā ha’lo\",\"trans\":\"es muy tarde\",\"sep\":\", \",\"error\":\"mismatch\"},{\"text\":\"dāmodara\",\"trans\":\"¡oh, Dāmodara!\",\"sep\":\", \"},{\"text\":\"āisa\",\"trans\":\"por favor, ven\",\"sep\":\" \"},{\"text\":\"ekhana\",\"trans\":\"aquí\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"bhoga-mandire\",\"trans\":\"en la sala de *prasādam*\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"basi\",\"trans\":\"sentado\",\"sep\":\"’ \"},{\"text\":\"karaha\",\"trans\":\"por favor toma\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bhojana”\",\"trans\":\"tu almuerzo\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"3\",\"text\":[\"nandera nirdeśe vaise giri-vara-dhārī\",\"baladeva-saha sakhā vaise sāri sāri\"],\"word_by_word\":[\"**nandera** — de Nanda Mahārāj; **nirdeśe** — por instrucción; **vaise** — se sienta; **girivara-dhārī** — el sostenedor de la colina Govardhan; **baladeva-saha** — junto con Śrī Baladeva; **sakhā** — los amigos; **baise sāri sāri** — sentados en filas.\"],\"translation\":[\"Siguiendo las instrucciones de Nanda Mahārāj, Kṛṣṇa, el sostenedor de la colina de Govardhan, Baladev y todos los pastorcillos de vacas se sientan en filas para tomar su almuerzo.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"nandera\",\"trans\":\"de Nanda Mahārāj\",\"sep\":\" \"},{\"text\":\"nirdeśe\",\"trans\":\"por instrucción\",\"sep\":\" \"},{\"text\":\"vaise\",\"trans\":\"se sienta\",\"sep\":\" \"},{\"text\":\"giri-vara\",\"trans\":\"el sostenedor de la colina Govardhan\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"dhārī\",\"trans\":\"junto con Śrī Baladeva\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"baladeva\",\"trans\":\"los amigos\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"saha sakhā vaise\",\"trans\":\"sentados en filas\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sāri\",\"trans\":\"-\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"sāri\",\"trans\":\"-\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"4\",\"text\":[\"śuktā-śākādi bhāji nālitā kuṣmāṇḍa\",\"ḍāli ḍālnā dugdha-tumbī dadhi mochā-ghaṇṭa\"],\"word_by_word\":[\"**śuktā** — curry amargo; **śāka** — espinacas; **adi** — y demás; **bhāji** — preparaciones fritas; **nālitā** — ensalada con hojas verdes de la planta de yute; **kuṣmāṇḍa** — calabaza; **ḍāli ḍālnā** — canastas de frutas; **dugdha-tumbī** — calabaza cocida con leche; **dadhi** — yogur espeso; **mochā-khaṇḍa** — preparaciones vegetales hechas de la flor del banano.\"],\"translation\":[\"Enseguida les sirven un festín de *śuktā*, *śāk*, frituras, ensalada de hojas de yute, calabaza, cestas de frutas, pastelillos de lentejas, yogur, y vegetales hechos con la flor de la banana.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"śuktā\",\"trans\":\"curry amargo\",\"sep\":\"-\"},{\"text\":\"śākādi\",\"trans\":\"espinacas\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bhāji\",\"trans\":\"y demás\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"nālitā\",\"trans\":\"preparaciones fritas\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kuṣmāṇḍa\",\"trans\":\"ensalada con hojas verdes de la planta de yute\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"ḍāli\",\"trans\":\"calabaza\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"ḍālnā dugdha\",\"trans\":\"canastas de frutas\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"tumbī dadhi\",\"trans\":\"calabaza cocida con leche\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"mochā\",\"trans\":\"yogur espeso\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"ghaṇṭa\",\"trans\":\"preparaciones vegetales hechas de la flor del banano\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"5\",\"text\":[\"mudga-baḍā māṣa-baḍā roṭikā ghṛtānna\",\"śaṣkulī piṣṭaka kṣīr puli pāyasānna\"],\"word_by_word\":[\"**mudga-boḍā** — cubos fritos de *d**ā**l*; **roṭikā** — *chapātīs*; **ghṛtānna** — arroz con *ghee*; **śaṣkulī** — dulces hechos con leche, azúcar y semillas de sésamo; **piṣṭaka** — tortas de harina de arroz endulzadas; **kṣīr** — leche condensada; **puli** — panecillos dulces; **pāyasānna** — arroz dulce en leche condensada.\"],\"translation\":[\"Después reciben pastelillos de *moong dāl* (arvejas amarillas), y otros de *urad dāl* (arvejas verdes), *chapātīs*, arroz con *ghee*, dulces hechos con leche, azúcar y ajonjolí, pasteles de harina de arroz, leche condensada, panquecas, y arroz dulce.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"mudga-baḍā\",\"trans\":\"cubos fritos de *d\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"māṣa\",\"trans\":\"*chapātīs*\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"baḍā\",\"trans\":\"arroz con *ghee*\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"roṭikā\",\"trans\":\"dulces hechos con leche, azúcar y semillas de sésamo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"ghṛtānna\",\"trans\":\"tortas de harina de arroz endulzadas\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"śaṣkulī\",\"trans\":\"leche condensada\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"piṣṭaka\",\"trans\":\"panecillos dulces\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kṣīr\",\"trans\":\"arroz dulce en leche condensada\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"puli\",\"trans\":\"-\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"pāyasānna\",\"trans\":\"-\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"6\",\"text\":[\"karpūra amṛta-kelī rambhā kṣīra-sāra\",\"amṛta rasālā, amla dvādaśa prakāra\"],\"word_by_word\":[\"**karpūra** — perfumado con alcanfor; **amṛta-keli** — arroz dulce exótico; **rambha** — bananas; **kṣīra-sāra** — delicioso queso; **amṛta rasāla** — mangos nectáreos; **amla** — preparaciones agrias; **dvādaśa prakāra** — de doce tipos diferentes.\"],\"translation\":[\"También reciben leche caliente mezclada con alcanfor, bananas, mantequilla, doce clases de preparaciones dulces, jugosas y ácidas.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"karpūra\",\"trans\":\"perfumado con alcanfor\",\"sep\":\" \"},{\"text\":\"amṛta-kelī\",\"trans\":\"arroz dulce exótico\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"rambhā\",\"trans\":\"bananas\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"kṣīra-sāra\",\"trans\":\"delicioso queso\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"amṛta rasālā\",\"trans\":\"mangos nectáreos\",\"sep\":\", \",\"error\":\"multi\"},{\"text\":\"amla\",\"trans\":\"preparaciones agrias\",\"sep\":\" \"},{\"text\":\"dvādaśa prakāra\",\"trans\":\"de doce tipos diferentes\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"7\",\"text\":[\"luchi chini sarapurī lāḍḍu rasābalī\",\"bhojana karena kṛṣṇa ha’ye kutūhalī\"],\"word_by_word\":[\"**luchi chini** — *purīs* con azúcar; **sarpurī** — *purīs* rellenos de crema; **lāḍḍu** — bolas dulces de harina de garbanzos; **rasābalī** — *d**ā**l* hervido en arroz azucarado; **bhojana korena kṛṣṇa** — Kṛṣṇa come el almuerzo; **ho’ye kutūhalī** — muy divertido.\"],\"translation\":[\"Hay *purīs* dulces, *purīs* rellenos de crema, *lāḍḍus* y pastelillos de *dāhl* cocidos en arroz azucarado. Kṛṣṇa come ávidamente todas las preparaciones.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"luchi chini\",\"trans\":\"*purīs* con azúcar\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"sarapurī\",\"trans\":\"*purīs* rellenos de crema\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"lāḍḍu\",\"trans\":\"bolas dulces de harina de garbanzos\",\"sep\":\" \"},{\"text\":\"rasābalī\",\"trans\":\"*d\",\"sep\":\"\"}],[{\"text\":\"bhojana karena kṛṣṇa\",\"trans\":\"Kṛṣṇa come el almuerzo\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"ha’ye kutūhalī\",\"trans\":\"muy divertido\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"8\",\"text\":[\"rādhikāra pakka anna vividha vyañjana\",\"parama ānande kṛṣṇa karena bhojana\"],\"word_by_word\":[\"**rādhikāra** — hechos por Rādhikā; **pakka anna** — granos cocidos; **vividha** — varios; **vyañjana** — vegetales cocidos; **parama ānande** — en bienaventuranza suprema; **kṛṣṇa korena bhojana** — Kṛṣṇa come Su almuerzo.\"],\"translation\":[\"Con gran alegría Kṛṣṇa saborea el arroz, los vegetales al curry, los dulces y los pasteles preparados por Śrīmatī Rādhārāṇī.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"rādhikāra\",\"trans\":\"hechos por Rādhikā\",\"sep\":\" \"},{\"text\":\"pakka anna\",\"trans\":\"granos cocidos\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"vividha\",\"trans\":\"varios\",\"sep\":\" \"},{\"text\":\"vyañjana\",\"trans\":\"vegetales cocidos\",\"sep\":\"\"}],[{\"text\":\"parama ānande\",\"trans\":\"en bienaventuranza suprema\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"kṛṣṇa karena bhojana\",\"trans\":\"Kṛṣṇa come Su almuerzo\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"9\",\"text\":[\"chhale-bale lāḍḍu khāy śrī-madhumaṅgala\",\"bagala bājāy āra deya haribolo\"],\"word_by_word\":[\"**chhale-bale** — por las buenas o por las malas; **lāḍḍu khāy** — come bolas dulces de *lāḍḍu*; **śrī-madhumaṅgala** — el juguetón *brāhmaṇa* amigo de Kṛṣṇa, Madhumaṅgala; **bagala bājāy** — hace un sonido divertido golpeando sus manos debajo de sus axilas; **āra deya** — ¡dame más!; **hari-bolo** — “¡Haribol! ¡Haribol!”.\"],\"translation\":[\"Madhumaṅgal, el amigo de Kṛṣṇa, se come los laḍḍus de una u otra manera. Al comerlos, grita, ‘¡Haribol, Haribol!’ y hace un sonido chistoso al palmotear sus axilas.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"chhale-bale\",\"trans\":\"por las buenas o por las malas\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"lāḍḍu khāy\",\"trans\":\"come bolas dulces de *lāḍḍu*\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"śrī-madhumaṅgala\",\"trans\":\"el juguetón *brāhmaṇa* amigo de Kṛṣṇa, Madhumaṅgala\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"bagala bājāy\",\"trans\":\"hace un sonido divertido golpeando sus manos debajo de sus axilas\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"āra deya\",\"trans\":\"¡dame más!\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"haribolo\",\"trans\":\"“¡Haribol! ¡Haribol!”\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"10\",\"text\":[\"rādhikādi gaṇe heri’ nayanera koṇe\",\"tṛpta ha’ye khāya kṛṣṇa yaśodā-bhavane\"],\"word_by_word\":[\"**rādhikādi gaṇe** — Rādhārāṇī y Sus amigas *gopīs*; **heri’** — contemplando; **nayanera koṇe** — por el rabillo del ojo; **tṛpta ha’ye** — estar muy satisfecho; **khāya kṛṣṇa** — Kṛṣṇa come; **yaśodā-bhavane** — en la casa de Madre Yaśodā.\"],\"translation\":[\"Mientras come con gran satisfacción en la casa de Madre Yaśodā, Kṛṣṇa mira de reojo a Rādhārāṇī y a Sus amigas, las *gopīs*.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"rādhikādi gaṇe\",\"trans\":\"Rādhārāṇī y Sus amigas *gopīs*\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"heri\",\"trans\":\"contemplando\",\"sep\":\"’ \"},{\"text\":\"nayanera koṇe\",\"trans\":\"por el rabillo del ojo\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"tṛpta ha’ye\",\"trans\":\"estar muy satisfecho\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"khāya kṛṣṇa\",\"trans\":\"Kṛṣṇa come\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"yaśodā-bhavane\",\"trans\":\"en la casa de Madre Yaśodā\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"11\",\"text\":[\"bhojanānte piye kṛṣṇa suvāsita vāri\",\"sabe mukha prakṣālaya ha’ye sāri sāri\"],\"word_by_word\":[\"**bhojanānte** — después del almuerzo; **piye kṛṣṇa** — Kṛṣṇa bebe; **suvāsita vāri** — agua de dulce aroma; **sabe** — todos Sus amigos; **mukha prakṣālaya** — lavarles la boca; **ho’ ye sāri sāri** — de pie en filas.\"],\"translation\":[\"Tras almorzar, Kṛṣṇa bebe agua de rosas, y luego, todos los niños, en fila, lavan sus bocas.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"bhojanānte\",\"trans\":\"después del almuerzo\",\"sep\":\" \"},{\"text\":\"piye kṛṣṇa\",\"trans\":\"Kṛṣṇa bebe\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"suvāsita vāri\",\"trans\":\"agua de dulce aroma\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"sabe\",\"trans\":\"todos Sus amigos\",\"sep\":\" \"},{\"text\":\"mukha prakṣālaya\",\"trans\":\"lavarles la boca\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"ha’ye sāri sāri\",\"trans\":\"de pie en filas\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"12\",\"text\":[\"hasta-mukha prakṣāliyā yata sakhā-gaṇe\",\"ānande viśrāma kare baladeva-sane\"],\"word_by_word\":[\"**hasta-mukha** — sus manos y bocas; **prakṣāliyā** — después del lavado; **jata sakhā-gaṇe** — todos los pastorcillos de vacas; **ānande** —  en gran dicha; **viśrāma kare** — descansan; **baladeva-sane** — junto con el Señor Balarāma.\"],\"translation\":[\"Después de que todos los pastorcillos de vacas han lavado sus manos y bocas, descansan con gran dicha junto al Señor Balarāma.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"hasta-mukha\",\"trans\":\"sus manos y bocas\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"prakṣāliyā\",\"trans\":\"después del lavado\",\"sep\":\" \"},{\"text\":\"yata sakhā-gaṇe\",\"trans\":\"todos los pastorcillos de vacas\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"ānande\",\"trans\":\"en gran dicha\",\"sep\":\" \"},{\"text\":\"viśrāma kare\",\"trans\":\"descansan\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"baladeva-sane\",\"trans\":\"junto con el Señor Balarāma\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"13\",\"text\":[\"jāmbula rasāla āne tāmbula-maśālā\",\"tāhā kheye kṛṣṇachandra sukhe nidrā gelā\"],\"word_by_word\":[\"**jāmbula rasāla** — los sirvientes de Kṛṣṇa llamados Jāmbula y Rasāla; **āne** — traer; **tāmbūla-masālā** — nueces de betel especiadas; **tāhā kheye** — masticando eso; **kṛṣṇachandra** — Kṛṣṇa semejante a la luna; **sukhe** — felizmente; **nidrā gelā** — se va a dormir.\"],\"translation\":[\"Jāmbula y Rasāla, le llevan a Kṛṣṇa *pān*. Después de masticar ese *pān*, Śrī Kṛṣṇachandra va a descansar plácidamente.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"jāmbula rasāla\",\"trans\":\"los sirvientes de Kṛṣṇa llamados Jāmbula y Rasāla\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"āne\",\"trans\":\"traer\",\"sep\":\" \"},{\"text\":\"tāmbula-maśālā\",\"trans\":\"nueces de betel especiadas\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"tāhā kheye\",\"trans\":\"masticando eso\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"kṛṣṇachandra\",\"trans\":\"Kṛṣṇa semejante a la luna\",\"sep\":\" \"},{\"text\":\"sukhe\",\"trans\":\"felizmente\",\"sep\":\" \"},{\"text\":\"nidrā gelā\",\"trans\":\"se va a dormir\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"14\",\"text\":[\"viśālākṣa śikhi-puchchha chāmara ḍhulāya\",\"apūrva śayāya kṛṣṇa sukhe nidrā yāya\"],\"word_by_word\":[\"**viśālākṣa** — Su sirviente llamado Viśālākṣa; **śikhi-puchchha-chāmara** — un abanico de plumas de pavo real; **ḍhulāya** — olas; **apūrva śayāya** — en un lecho excelente; **kṛṣṇa** — Kṛṣṇa; **sukhe** — felizmente; **nidrā yāya** — se va a dormir.\"],\"translation\":[\"Mientras Kṛṣṇa descansa felizmente en una magnífica cama, Su sirviente Viśālākṣa lo refresca con un abanico de plumas de pavoreal.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"viśālākṣa\",\"trans\":\"Su sirviente llamado Viśālākṣa\",\"sep\":\" \"},{\"text\":\"śikhi-puchchha chāmara\",\"trans\":\"un abanico de plumas de pavo real\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"ḍhulāya\",\"trans\":\"olas\",\"sep\":\"\"}],[{\"text\":\"apūrva śayāya\",\"trans\":\"en un lecho excelente\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"kṛṣṇa\",\"trans\":\"Kṛṣṇa\",\"sep\":\" \"},{\"text\":\"sukhe\",\"trans\":\"felizmente\",\"sep\":\" \"},{\"text\":\"nidrā yāya\",\"trans\":\"se va a dormir\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"15\",\"text\":[\"yaśomatī-ājñā peye dhaniṣṭhā ānīta\",\"śrī-kṛṣṇa-prasāda rādhā bhuñje haye prīta\"],\"word_by_word\":[\"**yaśomatī-ājñā** — la orden de Madre Yaśodā; **peye** — recibir; **dhaniṣṭhā ānīto** — traído por la *gopī* llamada Dhaniṣṭhā; **śrī-kṛṣṇa-prasāda** — los remanentes de comida de Śrī Kṛṣṇa; **rādhā** — Śrīmatī Rādhārāṇī; **bhuñje** — come; **haye prīta** — estar extremadamente encantado.\"],\"translation\":[\"La *gopī* Dhaniṣṭhā, a pedido de Madre Yaśodā, le lleva los remanentes de la comida de Kṛṣṇa a Śrīmatī Rādhārāṇī, quien los come con gran deleite.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"yaśomatī-ājñā\",\"trans\":\"la orden de Madre Yaśodā\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"peye\",\"trans\":\"recibir\",\"sep\":\" \"},{\"text\":\"dhaniṣṭhā ānīta\",\"trans\":\"traído por la *gopī* llamada Dhaniṣṭhā\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"śrī-kṛṣṇa-prasāda\",\"trans\":\"los remanentes de comida de Śrī Kṛṣṇa\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"rādhā\",\"trans\":\"Śrīmatī Rādhārāṇī\",\"sep\":\" \"},{\"text\":\"bhuñje\",\"trans\":\"come\",\"sep\":\" \"},{\"text\":\"haye prīta\",\"trans\":\"estar extremadamente encantado\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"16\",\"text\":[\"lalitādi sakhī-gaṇa avaśeṣa pāya\",\"mane mane sukhe rādhā-kṛṣṇa-guṇa gāya\"],\"word_by_word\":[\"**lalitādi** — encabezada por Lalitā; **sakhī-gaṇa** — la asamblea de amigas; **avaśeṣa pāya** — recibiendo Sus remanentes; **mane mane** — en el centro de sus corazones; **sukhe** — dichosamente; **rādhā-kṛṣṇa-guṇa** — las cualidades de Rādhā y Kṛṣṇa; **gāya** — ellos cantan.\"],\"translation\":[\"Luego, Lalitā Devī y las otras *gopīs* reciben los remanentes, y dentro de sus corazones cantan con gran alegría las glorias de Rādhārāṇī y de Kṛṣṇa.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"lalitādi\",\"trans\":\"encabezada por Lalitā\",\"sep\":\" \"},{\"text\":\"sakhī-gaṇa\",\"trans\":\"la asamblea de amigas\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"avaśeṣa pāya\",\"trans\":\"recibiendo Sus remanentes\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"mane mane\",\"trans\":\"en el centro de sus corazones\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"sukhe\",\"trans\":\"dichosamente\",\"sep\":\" \"},{\"text\":\"rādhā-kṛṣṇa-guṇa\",\"trans\":\"las cualidades de Rādhā y Kṛṣṇa\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"gāya\",\"trans\":\"ellos cantan\",\"sep\":\"\"}]]},{\"number\":\"17\",\"text\":[\"hari-līlā eka-mātra yāhāra pramoda\",\"bhogārati gāy ṭhākur bhakativinoda\"],\"word_by_word\":[\"**hari-līlā** — los maravillosos pasatiempos del Señor Hari; **eka-mātra** — uno y único; **yāhāra** — cuyo; **pramoda** — alegría; **bhogārati** — esta canción de* bhoga-ārati*; **gay** — canta; **ṭhākur bhakativinoda** — Ṭhākur Bhaktivinoda.\"],\"translation\":[\"Ṭhākur Bhakti Vinod, cuya sola y única alegría son los Pasatiempos del Señor Hari, canta esta canción del *bhoga ārati*.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"hari-līlā\",\"trans\":\"los maravillosos pasatiempos del Señor Hari\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"eka-mātra\",\"trans\":\"uno y único\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"yāhāra\",\"trans\":\"cuyo\",\"sep\":\" \"},{\"text\":\"pramoda\",\"trans\":\"alegría\",\"sep\":\"\"}],[{\"text\":\"bhogārati\",\"trans\":\"esta canción de* bhoga-ārati
