eAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"nārada muni\",\"trans\":\"Nārada Muni\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"bājāya\",\"trans\":\"toca\",\"sep\":\" \"},{\"text\":\"vīṇā\",\"trans\":\"el instrumento de cuerda *vīṇā*\",\"sep\":\",\"}],[{\"text\":\"‘rādhikā-ramaṇa’ -nāme\",\"trans\":\"el nombre de Rādhikā Ramaṇa (encantador de Rādhikā)\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"nāma\",\"trans\":\"el Santo nombre\",\"sep\":\" \"},{\"text\":\"amani\",\"trans\":\"espontáneamente\",\"sep\":\",        \"},{\"text\":\"udita hoya\",\"trans\":\"surge\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"bhakata\",\"trans\":\"devotos\",\"sep\":\"-\"},{\"text\":\"gīta\",\"trans\":\"canciones\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"sāme\",\"trans\":\"delante de\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"amiya-dhārā,        bariṣe ghana,\",\"        śravaṇa-yugale giyā\",\"bhakata-jana,        saghane nāche\",\"        bhoriyā āpana hiyā\"],\"word_by_word\":[\"**amiya** — néctar; **dhārā** — corriente del río; **bariṣe** — llover; **ghana** — tormenta; **śravaṇa** — escuchando; **yugale** — la Divina Pareja; **giyā** — entra; **bhakata jana** — la asamblea de devotos; **saghane nāche** — danzas en éxtasis; **bhoriyā** — lleno de; **āpana hiyā** — en sus propios corazones.\"],\"translation\":[\"Como una nube del monzón, el Santo Nombre derrama néctar puro en sus oídos. Todos los devotos, a causa del gran éxtasis, bailan con entusiasmo a su completa satisfacción.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"amiya\",\"trans\":\"néctar\",\"sep\":\"-\"},{\"text\":\"dhārā\",\"trans\":\"corriente del río\",\"sep\":\",        \"},{\"text\":\"bariṣe\",\"trans\":\"llover\",\"sep\":\" \"},{\"text\":\"ghana\",\"trans\":\"tormenta\",\"sep\":\",\"}],[{\"text\":\"śravaṇa\",\"trans\":\"escuchando\",\"sep\":\"-\"},{\"text\":\"yugale\",\"trans\":\"la Divina Pareja\",\"sep\":\" \"},{\"text\":\"giyā\",\"trans\":\"entra\",\"sep\":\"\"}],[{\"text\":\"bhakata-jana\",\"trans\":\"la asamblea de devotos\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"saghane nāche\",\"trans\":\"danzas en éxtasis\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"bhoriyā\",\"trans\":\"lleno de\",\"sep\":\" \"},{\"text\":\"āpana hiyā\",\"trans\":\"en sus propios corazones\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"3\",\"text\":[\"mādhurī-pūra,        āsabo paśi’,\",\"        mātāya jagata-jane\",\"keho vā kā̐de,        keho vā nāche,\",\"        keho māte mane mane\"],\"word_by_word\":[\"**mādhurī** — dulzura; **pūra** — llenar; **āsava** — vino; **paśi(yā)** — entrar en; **mātāya** — intoxicación; **jagata-jane** — la gente del universo; **keho** — alguien; **vā** — cualquiera; **kā̐de** — llora; **keho** — alguien; **vā** — cualquiera; **nāche** — danzas; **keho** — alguien; **mate** — intoxicado; **mane mane** — en sus mentes.\"],\"translation\":[\"Toda la gente del universo enloquece al entrar en contacto con esta embriagadora lluvia de dulzura divina. Algunos lloran, otros danzan y otros quedan completamente embriagados dentro de sus mentes.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"mādhurī\",\"trans\":\"dulzura\",\"sep\":\"-\"},{\"text\":\"pūra\",\"trans\":\"llenar\",\"sep\":\",        \"},{\"text\":\"āsabo\",\"trans\":\"vino\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"paśi\",\"trans\":\"entrar en\",\"sep\":\"’,\",\"error\":\"multi\"}],[{\"text\":\"mātāya\",\"trans\":\"intoxicación\",\"sep\":\" \"},{\"text\":\"jagata-jane\",\"trans\":\"la gente del universo\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"keho\",\"trans\":\"alguien\",\"sep\":\" \"},{\"text\":\"vā\",\"trans\":\"cualquiera\",\"sep\":\" \"},{\"text\":\"kā̐de\",\"trans\":\"llora\",\"sep\":\",        \"},{\"text\":\"keho\",\"trans\":\"alguien\",\"sep\":\" \"},{\"text\":\"vā\",\"trans\":\"cualquiera\",\"sep\":\" \"},{\"text\":\"nāche\",\"trans\":\"danzas\",\"sep\":\",\"}],[{\"text\":\"keho\",\"trans\":\"alguien\",\"sep\":\" \"},{\"text\":\"māte\",\"trans\":\"intoxicado\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"mane mane\",\"trans\":\"en sus mentes\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"4\",\"text\":[\"pañcha-vadana,        nārade dhori’\",\"        premera saghana rol\",\"kamalāsana,        nāchiyā bole,\",\"        ‘bolo, bolo, hari bolo’\"],\"word_by_word\":[\"**pañcha-vadana** — aquel de cinco caras (el Señor Śiva); **nārade** — a Nārada Muni; **dhori(yā)** — contempla; **premera** — de amor; **saghana** — extasiado; **rol** — llora; **kamala-āsana** — sentado en el loto (Señor Brahmā); **nāchiyā** — bailando; **bole** — dice; **‘bolo bolo hari bolo’** — ¡canta, canta, canta el nombre de Hari!\"],\"translation\":[\"El Señor Śiva, de cinco caras, abraza a Nārada Muni, y repetidas veces da fuertes gritos de júbilo extático, mientras que el Señor Brahmā baila muy extáticamente y exclama: “Todos ustedes canten: “¡Haribol, Haribol!”.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"pañcha-vadana\",\"trans\":\"aquel de cinco caras (el Señor Śiva)\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"nārade\",\"trans\":\"a Nārada Muni\",\"sep\":\" \"},{\"text\":\"dhori\",\"trans\":\"contempla\",\"sep\":\"’\",\"error\":\"multi\"}],[{\"text\":\"premera\",\"trans\":\"de amor\",\"sep\":\" \"},{\"text\":\"saghana\",\"trans\":\"extasiado\",\"sep\":\" \"},{\"text\":\"rol\",\"trans\":\"llora\",\"sep\":\"\"}],[{\"text\":\"kamalāsana,        nāchiyā\",\"trans\":\"sentado en el loto (Señor Brahmā)\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"bole\",\"trans\":\"bailando\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"‘bolo\",\"trans\":\"dice\",\"sep\":\", \",\"error\":\"mismatch\"},{\"text\":\"bolo, hari bolo\",\"trans\":\"¡canta, canta, canta el nombre de Hari!\",\"sep\":\"’\",\"error\":\"multi\"}]]},{\"number\":\"5\",\"text\":[\"sahasrānana,        parama-sukhe,\",\"        ‘hari hari’ boli gāy\",\"nāma-prabhāve,        mātilo viśva,\",\"        nāma-rasa sabe pāy\"],\"word_by_word\":[\"**sahasra-ānana** — el de mil caras (Señor Ananta Śeṣa); **parama** — el más alto; **sukhe** — en felicidad; **‘hari hari’ boli’** — cantar los nombres: Hari Hari; **gāya** — canta; **nāma** — el Santo Nombre; **prabhāve** — poder; **mātilo** — intoxica; **viśva** — todo el universo; **nāma-rasa** — las melosidades del Santo Nombre; **sabe** — todos; **pāya** — recibe.\"],\"translation\":[\"Ananta Śeṣa, quien posee innumerables bocas, con felicidad suprema canta y exclama: “¡Hari, Hari!”. Debido a la influencia de la vibración trascendental de ese Nombre, todo el universo enloquece extáticamente y todos prueban y disfrutan las melosidades del Santo Nombre.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"sahasrānana,        parama\",\"trans\":\"el de mil caras (Señor Ananta Śeṣa)\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"sukhe\",\"trans\":\"el más alto\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"‘hari\",\"trans\":\"en felicidad\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hari’ boli gāy\",\"trans\":\"cantar los nombres: Hari Hari\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"nāma\",\"trans\":\"canta\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"prabhāve\",\"trans\":\"el Santo Nombre\",\"sep\":\",        \",\"error\":\"mismatch\"},{\"text\":\"mātilo\",\"trans\":\"poder\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"viśva\",\"trans\":\"intoxica\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"nāma\",\"trans\":\"todo el universo\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"rasa sabe\",\"trans\":\"las melosidades del Santo Nombre\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"pāy\",\"trans\":\"todos\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"6\",\"text\":[\"śrī-kṛṣṇa-nāma,        rasane sphuri’,\",\"        pūrā’o āmāra āśa\",\"śrī-rūpa-pade,        jāchaye ihā,\",\"        bhakativinoda-dāsa\"],\"word_by_word\":[\"**śrī-kṛṣṇa-nāma** — el Santo Nombre de Śrī Kṛṣṇa; **rasane** — en la lengua; **sphuri(yā)** — se manifiesta; **pūrā’lo** — ha llenado; **āmāra āśa** — mis esperanzas; **śrī-rūpa-pade** — a los pies de loto de Śrīla Rūpa Goswāmī; **jāchaye** — ruega; **iha** — aquí; **bhakativinoda-dāsa** — el sirviente Bhakti Vinod Ṭhākur.\"],\"translation\":[\"El Santo Nombre de Śrī Kṛṣṇa ha cumplido todos mis deseos por manifestarse en la lengua de todos. Bhakti Vinod, el humilde sirviente del Señor, ora a los pies de Śrī Rūpa Goswāmī para que el canto de Harinām continúe siempre de esa manera.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"śrī-kṛṣṇa-nāma\",\"trans\":\"el Santo Nombre de Śrī Kṛṣṇa\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"rasane\",\"trans\":\"en la lengua\",\"sep\":\" \"},{\"text\":\"sphuri\",\"trans\":\"se manifiesta\",\"sep\":\"’,\",\"error\":\"multi\"}],[{\"text\":\"pūrā’o\",\"trans\":\"ha llenado\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"āmāra āśa\",\"trans\":\"mis esperanzas\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"śrī-rūpa-pade\",\"trans\":\"a los pies de loto de Śrīla Rūpa Goswāmī\",\"sep\":\",        \",\"error\":\"multi\"},{\"text\":\"jāchaye\",\"trans\":\"ruega\",\"sep\":\" \"},{\"text\":\"ihā\",\"trans\":\"aquí\",\"sep\":\",\",\"error\":\"mismatch\"}],[{\"text\":\"bhakativinoda-dāsa\",\"trans\":\"el sirviente Bhakti Vinod Ṭhākur\",\"sep\":\"\",\"error\":\"multi\"}]]}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Bhakti Lalita Devi\",\"ru\":\"Бхакти Лалита Деви\",\"ua\":\"Бгакті Лаліта Деві\"},\"embed_url\":\"https://soundcloud.com/bhakti-lalita-devi/bhakti-lalita-devi-namastakam-song-8-narada-muni-bajaya-vina\"}]},\"hasWbw\":true,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><scri
