*śrīla mahārāj** — el adorable gran rey; **charaṇa-āravinda** — pies de loto; **śrī bhakti sundara deva-gosvāmī govinda** — Śrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj.\"],\"translation\":[\"Todas las glorias a los pies de loto de nuestro Śrī Gurudev, Śrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"jaya\",\"trans\":\"toda gloria\",\"sep\":\" \"},{\"text\":\"śrīla mahārāj\",\"trans\":\"el adorable gran rey\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"charaṇāravinda\",\"trans\":\"pies de loto\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"śrī bhakti sundara deva-gosvāmī govinda\",\"trans\":\"Śrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"2\",\"text\":[\"jagatera sumaṅgala koribāra āśe\",\"tumi avatīrṇa hoilā snigdha guru-veśe\"],\"word_by_word\":[\"**jagatera** — del universo; **su-maṅgala** — muy auspicioso; **koribāra** — hacer; **āśe** — anhelo; **tumi** — tú; **avatīrṇa** — descendió; **hoilā** — ocurre; **snigdha** — benevolente; **guru-veśe** — representación del maestro.\"],\"translation\":[\"Anhelando la Gracia Divina sobre toda la creación, descendiste de Goloka Tú, la encarnación más benevolente.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"jagatera\",\"trans\":\"del universo\",\"sep\":\" \"},{\"text\":\"sumaṅgala koribāra\",\"trans\":\"muy auspicioso\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"āśe\",\"trans\":\"hacer\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"tumi\",\"trans\":\"anhelo\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"avatīrṇa\",\"trans\":\"tú\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hoilā\",\"trans\":\"descendió\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"snigdha\",\"trans\":\"ocurre\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"guru\",\"trans\":\"benevolente\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"veśe\",\"trans\":\"representación del maestro\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"3\",\"text\":[\"praphulla nalina jena hāsimākhā mukha\",\"dekhi vṛddha-bāla-juvā pāya mahā-sukha\"],\"word_by_word\":[\"**praphulla** — florecido; **nalina** — loto; **jena** — tal como; **hāsimākhā** — cara sonriente; **mukha** — cara; **dekhi** — veo; **vṛddha** — viejo; **bāla-juvā** — jóvenes; **pāya** — obtienen; **mahā-sukha** — gran felicidad.\"],\"translation\":[\"Una flor de loto de cien pétalos—una cara de loto floreciente—. Jóvenes y viejos te contemplan, y sus corazones rebosan de júbilo.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"praphulla\",\"trans\":\"florecido\",\"sep\":\" \"},{\"text\":\"nalina\",\"trans\":\"loto\",\"sep\":\" \"},{\"text\":\"jena\",\"trans\":\"tal como\",\"sep\":\" \"},{\"text\":\"hāsimākhā\",\"trans\":\"cara sonriente\",\"sep\":\" \"},{\"text\":\"mukha\",\"trans\":\"cara\",\"sep\":\"\"}],[{\"text\":\"dekhi\",\"trans\":\"veo\",\"sep\":\" \"},{\"text\":\"vṛddha\",\"trans\":\"viejo\",\"sep\":\"-\"},{\"text\":\"bāla-juvā\",\"trans\":\"jóvenes\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"pāya\",\"trans\":\"obtienen\",\"sep\":\" \"},{\"text\":\"mahā-sukha\",\"trans\":\"gran felicidad\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"4\",\"text\":[\"svadeśe-videśe harināmera prachāre\",\"abhinava gaura-preme bhāsāle sabāre\"],\"word_by_word\":[\"**svadeśe-videśe** — locales y extranjeros; **harināmera** — del canto del santo nombre; **prachāre** — prédica; **abhinava** — sin precedente; **gaura-preme** — del amor de Gaura; **bhāsāle** — inunda; **sabāre** — a todos.\"],\"translation\":[\"Tanto en casa como en otras tierras, estás predicando el Santo Nombre del Señor. Un flujo de Amor por Gaura inunda todo el planeta.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"svadeśe-videśe\",\"trans\":\"locales y extranjeros\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"harināmera\",\"trans\":\"del canto del santo nombre\",\"sep\":\" \"},{\"text\":\"prachāre\",\"trans\":\"prédica\",\"sep\":\"\"}],[{\"text\":\"abhinava\",\"trans\":\"sin precedente\",\"sep\":\" \"},{\"text\":\"gaura-preme\",\"trans\":\"del amor de Gaura\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"bhāsāle\",\"trans\":\"inunda\",\"sep\":\" \"},{\"text\":\"sabāre\",\"trans\":\"a todos\",\"sep\":\"\"}]]},{\"number\":\"5\",\"text\":[\"śrī-kore lekhanī jena ananta phoyārā\",\"sumadhura divyavāṇī-vigalita-dhārā\"],\"word_by_word\":[\"**śrī-kore** — hacer adorable; **lekhanī** — lapiz; **jena ananta** — ilimitado; **phoyārā** — fuente; **su-madhura** — muy dulce; **divyavāṇī** — mensaje divino; **vigalita-dhārā** — flujo que emana.\"],\"translation\":[\"De tu pluma, fuente bendita, son escritas las más Dulces canciones de Amor Divino en un flujo interminable.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"śrī-kore\",\"trans\":\"hacer adorable\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"lekhanī\",\"trans\":\"lapiz\",\"sep\":\" \"},{\"text\":\"jena ananta\",\"trans\":\"ilimitado\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"phoyārā\",\"trans\":\"fuente\",\"sep\":\"\"}],[{\"text\":\"sumadhura divyavāṇī\",\"trans\":\"muy dulce\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"vigalita\",\"trans\":\"mensaje divino\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"dhārā\",\"trans\":\"flujo que emana\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"6\",\"text\":[\"su-siddhānta-dhārādhara satya sugambhīra\",\"śrī-guru-vaiṣṇava-sevā-niṣṭha mahādhīra\"],\"word_by_word\":[\"**su-siddhānta** — conclusiones perfectas; **dhārādhara** — quien sostiene la corriente; **satya** — verdad; **sugambhīra** — muy profundas; **śrī-guru-vaiṣṇava-sevā** — servicio al Guru y los Vaiṣṇavas; **niṣṭha** — firme; **mahādhīra** — muy sobrio.\"],\"translation\":[\"Agente de las olas de la Verdad perfecta—un océano insondable—¡sirves a Śrī Guru y al Vaiṣṇava!, es la dedicación de tu corazón.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"su-siddhānta\",\"trans\":\"conclusiones perfectas\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"dhārādhara\",\"trans\":\"quien sostiene la corriente\",\"sep\":\" \"},{\"text\":\"satya\",\"trans\":\"verdad\",\"sep\":\" \"},{\"text\":\"sugambhīra\",\"trans\":\"muy profundas\",\"sep\":\"\"}],[{\"text\":\"śrī-guru-vaiṣṇava-sevā\",\"trans\":\"servicio al Guru y los Vaiṣṇavas\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"niṣṭha\",\"trans\":\"firme\",\"sep\":\" \"},{\"text\":\"mahādhīra\",\"trans\":\"muy sobrio\",\"sep\":\"\"}]]},{\"number\":\"7\",\"text\":[\"sādhu-priya saralatā tomāra bhūṣaṇa\",\"amānī mānada sadā miṣṭha-sambhāṣaṇa\"],\"word_by_word\":[\"**sādhu-priya** — querido por los santos; **saralatā** — humilde, simple; **tomāra** — tuyo; **bhūṣaṇa** — adornos; **amānī** — sin prestigio; **mānada** — moderado; **sadā** — siempre; **miṣṭha** — dulce; **sambhāṣaṇa** — hablar.\"],\"translation\":[\"Un corazón veraz adorado por los santos—tu compasión natural—siempre humilde, ofreces honor con un hablar dulce.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"sādhu-priya\",\"trans\":\"querido por los santos\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"saralatā\",\"trans\":\"humilde, simple\",\"sep\":\" \"},{\"text\":\"tomāra\",\"trans\":\"tuyo\",\"sep\":\" \"},{\"text\":\"bhūṣaṇa\",\"trans\":\"adornos\",\"sep\":\"\"}],[{\"text\":\"amānī\",\"trans\":\"sin prestigio\",\"sep\":\" \"},{\"text\":\"mānada\",\"trans\":\"moderado\",\"sep\":\" \"},{\"text\":\"sadā\",\"trans\":\"siempre\",\"sep\":\" \"},{\"text\":\"miṣṭha\",\"trans\":\"dulce\",\"sep\":\"-\"},{\"text\":\"sambhāṣaṇa\",\"trans\":\"hablar\",\"sep\":\"\"}]]},{\"number\":\"8\",\"text\":[\"guru-mahārāj jatirāja-rājeśvara\",\"śrī-bhakti-rakṣaka deva-gosvāmī śrīdhara\"],\"word_by_word\":[\"**guru-mahārāj** — Guru Mahārāj; **jati** — casta; **rāja-rājeśvara** — de los reyes *sannyasīs*; **śrī-bhakti-rakṣaka deva-gosvāmī śrīdhara** — Śrīla Bhakti Rakṣak Dev-Goswāmī Śrīdhar.\"],\"translation\":[\"Guru Mahārāj, Śrīla Bhakti Rakṣak Dev-Goswāmī Śrīdhar, de los Reyes *sannyāsīs*, el noble abuelo.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"guru-mahārāj\",\"trans\":\"Guru Mahārāj\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"jatirāja\",\"trans\":\"casta\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"rājeśvara\",\"trans\":\"de los reyes *sannyasīs*\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"śrī-bhakti-rakṣaka deva-gosvāmī śrīdhara\",\"trans\":\"Śrīla Bhakti Rakṣak Dev-Goswāmī Śrīdhar\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"9\",\"text\":[\"parama santuṣṭa tava viśrambha-sevāya\",\"nija-hāte vyāsāsane vasā’la tomāya\"],\"word_by_word\":[\"**parama** — supremo; **santuṣṭa** — satisfecho; **tava** — tuyo; **viśrambha-sevāya** — dedicado servicio; **nija-hāte** — propia mano; **vyāsāsane** — el asiento de Vyāsa; **vasā’la** — sentar; **tomāya** — a ti.\"],\"translation\":[\"Supremamente satisfecho con tu dedicado Servicio, con su propia mano te instaló en su excelso asiento.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"parama\",\"trans\":\"supremo\",\"sep\":\" \"},{\"text\":\"santuṣṭa\",\"trans\":\"satisfecho\",\"sep\":\" \"},{\"text\":\"tava\",\"trans\":\"tuyo\",\"sep\":\" \"},{\"text\":\"viśrambha-sevāya\",\"trans\":\"dedicado servicio\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"nija-hāte\",\"trans\":\"propia mano\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"vyāsāsane\",\"trans\":\"el asiento de Vyāsa\",\"sep\":\" \"},{\"text\":\"vasā’la\",\"trans\":\"sentar\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"tomāya\",\"trans\":\"a ti\",\"sep\":\"\"}]]},{\"number\":\"10\",\"text\":[\"sukhe manonīta koilā uttarādhikārī\",\"ehena apūrvva sneha kothāo nā heri\"],\"word_by_word\":[\"**sukhe** — de felicidad; **manonīta** — elegido; **koilā** — hecho; **uttarādhikārī** — candidato apropiado; **ehena** — tal como; **apūrvva** — maravilloso; **sneha** — afecto; **kothāo nā** — en ningún lugar; **heri** — ver.\"],\"translation\":[\"Jubilosamente te escogió como su sucesor, semejante afecto benigno nunca lo veremos en toda la creación.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"sukhe\",\"trans\":\"de felicidad\",\"sep\":\" \"},{\"text\":\"manonīta\",\"trans\":\"elegido\",\"sep\":\" \"},{\"text\":\"koilā\",\"trans\":\"hecho\",\"sep\":\" \"},{\"text\":\"uttarādhikārī\",\"trans\":\"candidato apropiado\",\"sep\":\"\"}],[{\"text\":\"ehena\",\"trans\":\"tal como\",\"sep\":\" \"},{\"text\":\"apūrvva\",\"trans\":\"maravilloso\",\"sep\":\" \"},{\"text\":\"sneha\",\"trans\":\"afecto\",\"sep\":\" \"},{\"text\":\"kothāo nā\",\"trans\":\"en ningún lugar\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"heri\",\"trans\":\"ver\",\"sep\":\"\"}]]},{\"number\":\"11\",\"text\":[\"rūpa-sarasvatī-śrīdhar-dhārā-srotasvinī\",\"tava hṛde vahe sadā bhuvana pāvanī\"],\"word_by_word\":[\"**rūpa-sarasvatī-śrīdhar** — de Rūpa, Saraswatī y Śrīdhar; **dhārā** — sostener; **srotasvinī** — la corriente; **tava** — tuyo; **hṛde** — del corazón; **vahe** — fluye; **sadā** — siempre; **bhuvana** — el mundo; **pāvanī** — purificado.\"],\"translation\":[\"La corriente de Rūpa-Saraswatī-Śrīdhar fluyendo libremente, desde tu corazón a todo el mundo, vuelve todo muy sagrado.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"rūpa-sarasvatī-śrīdhar\",\"trans\":\"de Rūpa, Saraswatī y Śrīdhar\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"dhārā\",\"trans\":\"sostener\",\"sep\":\"-\"},{\"text\":\"srotasvinī\",\"trans\":\"la corriente\",\"sep\":\"\"}],[{\"text\":\"tava\",\"trans\":\"tuyo\",\"sep\":\" \"},{\"text\":\"hṛde\",\"trans\":\"del corazón\",\"sep\":\" \"},{\"text\":\"vahe\",\"trans\":\"fluye\",\"sep\":\" \"},{\"text\":\"sadā\",\"trans\":\"siempre\",\"sep\":\" \"},{\"text\":\"bhuvana\",\"trans\":\"el mundo\",\"sep\":\" \"},{\"text\":\"pāvanī\",\"trans\":\"purificado\",\"sep\":\"\"}]]},{\"number\":\"12\",\"text\":[\"śīva-guru-saṅkarṣaṇa koruṇā-nilaya\",\"nityānanda-rūpe tava hṛde vilasaya\"],\"word_by_word\":[\"**śīva-guru** — guía divino; **saṅkarṣaṇa** — quien atrae; **koruṇā-nilaya** — morada de la compasión; **nityānanda-rūpe** — la forma de Nityānanda; **tava** — tuyo; **hṛde** — corazón; **vilasaya** — satisfacción.\"],\"translation\":[\"Nuestro guía, Dios supremo del bien, tesoro divino de compasión, vive siempre dentro de tu corazón para la satisfacción de Nityānanda.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"śīva-guru\",\"trans\":\"guía divino\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"saṅkarṣaṇa\",\"trans\":\"quien atrae\",\"sep\":\" \"},{\"text\":\"koruṇā-nilaya\",\"trans\":\"morada de la compasión\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"nityānanda-rūpe\",\"trans\":\"la forma de Nityānanda\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"tava\",\"trans\":\"tuyo\",\"sep\":\" \"},{\"text\":\"hṛde\",\"trans\":\"corazón\",\"sep\":\" \"},{\"text\":\"vilasaya\",\"trans\":\"satisfacción\",\"sep\":\"\"}]]},{\"number\":\"13\",\"text\":[\"sujana sudhīra-gaṇa tava guṇa-gāya\",\"durbhāgā vañchita aparādhe more hāya\"],\"word_by_word\":[\"**sujana** — genuino; **sudhīra-gaṇa** — muy serios; **tavaguṇa-gāya** — cantan tus cualidades; **durbhāgā** — desafortunado; **vañchita** — deseado; **aparādhe** — de las ofensas; **more** — mías; **hāya** — ocurridas.\"],\"translation\":[\"Los devotos genuinos cantan fielmente tus Glorias Supremas. ¡Qué desgracia! Las almas perdidas y confundidas te deshonran, y perecen.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"sujana\",\"trans\":\"genuino\",\"se
