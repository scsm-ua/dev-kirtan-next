",\"text\":[\"vimala hema jini        tanu anupāma re\",\"        tāhe śobhe nānā phula-dāma\",\"kadamba keśara jini        ekati pulaka re\",\"        tara mājhe bindu bindu ghāma\"],\"word_by_word\":[\"**vimala** — puro; **hema** — oro; **jini** — conquista; **tanu** — cuerpo; **anupāma** — incomparable; **re** — oh; **tāhe** — en ello; **śobhe** — luce hermoso; **nānā** — varios; **phula-dāma** — hilera de flores; **kadamba** — flor *kadamba*; **keśara** — filamentos; **jini** — conquista; **ekati pulaka** — vellos erguidos aquí y allá; **re** — oh; **tara** — suyos; **mājhe** — en medio; **bindu bindu** — gotas; **ghāma** — sudor.\"],\"translation\":[\"Su figura vence al oro puro. Varias guirnaldas de flores lo adornan resaltando Su belleza y, en Su emoción extática, los vellos de Su cuerpo erguidos vencen los filamentos de las flores *kadamba*. Su cuerpo está cubierto de gotas de sudor.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"vimala\",\"trans\":\"puro\",\"sep\":\" \"},{\"text\":\"hema\",\"trans\":\"oro\",\"sep\":\" \"},{\"text\":\"jini\",\"trans\":\"conquista\",\"sep\":\"        \"},{\"text\":\"tanu\",\"trans\":\"cuerpo\",\"sep\":\" \"},{\"text\":\"anupāma\",\"trans\":\"incomparable\",\"sep\":\" \"},{\"text\":\"re\",\"trans\":\"oh\",\"sep\":\"\"}],[{\"text\":\"tāhe\",\"trans\":\"en ello\",\"sep\":\" \"},{\"text\":\"śobhe\",\"trans\":\"luce hermoso\",\"sep\":\" \"},{\"text\":\"nānā\",\"trans\":\"varios\",\"sep\":\" \"},{\"text\":\"phula-dāma\",\"trans\":\"hilera de flores\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"kadamba\",\"trans\":\"flor *kadamba*\",\"sep\":\" \"},{\"text\":\"keśara\",\"trans\":\"filamentos\",\"sep\":\" \"},{\"text\":\"jini\",\"trans\":\"conquista\",\"sep\":\"        \"},{\"text\":\"ekati pulaka\",\"trans\":\"vellos erguidos aquí y allá\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"re\",\"trans\":\"oh\",\"sep\":\"\"}],[{\"text\":\"tara\",\"trans\":\"suyos\",\"sep\":\" \"},{\"text\":\"mājhe\",\"trans\":\"en medio\",\"sep\":\" \"},{\"text\":\"bindu bindu\",\"trans\":\"gotas\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"ghāma\",\"trans\":\"sudor\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"jini’ mada-matta hātī        gamana manthara-ati\",\"        bhāvāveśe ḍhuli ḍhuli jāya\",\"aruṇa vasana-chabi        jini prabhātera ravi\",\"        gorā aṅge laharī khelāya\"],\"word_by_word\":[\"**gamana** — andando; **manthara** — suavemente; **ati** — grande; **jini** — conquista; **maya-matta** — estando enloquecido; **hātī** — elefante; **bhāva-aveśe** — en humor extático; **ḍhuli ḍhuli** — el polvo; **jāya** — gloria; **aruṇa** — rojizo; **vasana** — vestimenta; **chabi** — llevar; **jini** — conquista; **prabhātera** — del amanecer; **ravi** — sol; **gorā** — Gaurāṅga; **aṅge** — miembros corporales; **laharī** — olas; **khelāya** — causa.\"],\"translation\":[\"Su andar suave supera el andar de un elefante enloquecido; vencido por el amor divino, se tambalea y camina; el resplandor de Sus vestiduras azafrán vence al resplandor del sol de la mañana; Sus miembros dorados se balancean tal como grandes olas de un océano.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"jini\",\"trans\":\"andando\",\"sep\":\"’ \",\"error\":\"mismatch\"},{\"text\":\"mada\",\"trans\":\"suavemente\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"matta\",\"trans\":\"grande\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hātī\",\"trans\":\"conquista\",\"sep\":\"        \",\"error\":\"mismatch\"},{\"text\":\"gamana manthara\",\"trans\":\"estando enloquecido\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"ati\",\"trans\":\"elefante\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"bhāvāveśe ḍhuli\",\"trans\":\"en humor extático\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"ḍhuli jāya\",\"trans\":\"el polvo\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"aruṇa\",\"trans\":\"gloria\",\"sep\":\" \",\"error\":
