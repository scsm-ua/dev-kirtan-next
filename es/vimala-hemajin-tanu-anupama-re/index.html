\":\"incomparable\",\"sep\":\" \"},{\"text\":\"re\",\"trans\":\"oh\",\"sep\":\"\"}],[{\"text\":\"tāhe\",\"trans\":\"en ello\",\"sep\":\" \"},{\"text\":\"śobhe\",\"trans\":\"luce hermoso\",\"sep\":\" \"},{\"text\":\"nānā\",\"trans\":\"varios\",\"sep\":\" \"},{\"text\":\"phula-dāma\",\"trans\":\"hilera de flores\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"kadamba\",\"trans\":\"flor *kadamba*\",\"sep\":\" \"},{\"text\":\"keśara\",\"trans\":\"filamentos\",\"sep\":\" \"},{\"text\":\"jini\",\"trans\":\"conquista\",\"sep\":\"        \"},{\"text\":\"ekati pulaka\",\"trans\":\"vellos erguidos aquí y allá\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"re\",\"trans\":\"oh\",\"sep\":\"\"}],[{\"text\":\"tara\",\"trans\":\"suyos\",\"sep\":\" \"},{\"text\":\"mājhe\",\"trans\":\"en medio\",\"sep\":\" \"},{\"text\":\"bindu bindu\",\"trans\":\"gotas\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"ghāma\",\"trans\":\"sudor\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"jini’ mada-matta hātī        gamana manthara-ati\",\"        bhāvāveśe ḍhuli ḍhuli jāya\",\"aruṇa vasana-chabi        jini prabhātera ravi\",\"        gorā aṅge laharī khelāya\"],\"word_by_word\":[\"**gamana** — andando; **manthara** — suavemente; **ati** — grande; **jini** — conquista; **maya-matta** — estando enloquecido; **hātī** — elefante; **bhāva-aveśe** — en humor extático; **ḍhuli ḍhuli** — el polvo; **jāya** — gloria; **aruṇa** — rojizo; **vasana** — vestimenta; **chabi** — llevar; **jini** — conquista; **prabhātera** — del amanecer; **ravi** — sol; **gorā** — Gaurāṅga; **aṅge** — miembros corporales; **laharī** — olas; **khelāya** — causa.\"],\"translation\":[\"Su andar suave supera el andar de un elefante enloquecido; vencido por el amor divino, se tambalea y camina; el resplandor de Sus vestiduras azafrán vence al resplandor del sol de la mañana; Sus miembros dorados se balancean tal como grandes olas de un océano.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"jini\",\"trans\":\"andando\",\"sep\":\"’ \",\"error\":\"mismatch\"},{\"text\":\"mada\",\"trans\":\"suavemente\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"matta\",\"trans\":\"grande\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"hātī\",\"trans\":\"conquista\",\"sep\":\"        \",\"error\":\"mismatch\"},{\"text\":\"gamana manthara\",\"trans\":\"estando enloquecido\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"ati\",\"trans\":\"elefante\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"bhāvāveśe ḍhuli\",\"trans\":\"en humor extático\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"ḍhuli jāya\",\"trans\":\"el polvo\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"aruṇa\",\"trans\":\"gloria\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"vasana\",\"trans\":\"rojizo\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"chabi\",\"trans\":\"vestimenta\",\"sep\":\"        \",\"error\":\"mismatch\"},{\"text\":\"jini\",\"trans\":\"llevar\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"prabhātera\",\"trans\":\"conquista\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"ravi\",\"trans\":\"del amanecer\",\"sep\":\"\",\"error\":\"mismatch\"}],[{\"text\":\"gorā\",\"trans\":\"sol\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"aṅge\",\"trans\":\"Gaurāṅga\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"laharī\",\"trans\":\"miembros corporales\",\"sep\":\" \",\"error\":\"mismatch\"},{\"text\":\"khelāya\",\"trans\":\"olas\",\"sep\":\"\",\"error\":\"mismatch\"}]]},{\"number\":\"3\",\"text\":[\"chalite nā pāre gorā-        chānda gosāñi re\",\"        balite nā pāre ādha bola\",\"bhāvete avaśa ha-iyā        hari hari bolāiyā\",\"        āchaṇḍāle dhari deya kola\"],\"word_by_word\":[\"**chalite** — caminar; **nā pāre** — incapaz; **gorā-chānda** — Gaurachandra; **gosāñi re** — oh Gosāi; **balite** — hablar; **nā pāre** — incapaz; **ādha** — mitad; **bola** — palabra; **bhāvete** — en éxtasis; **avaśa** — indefenso; **ha-iyā** — volviéndose; **hari hari** — Hari Hari; **bolāiyā** — cantando; **āchaṇḍāle** — al *chaṇḍāla*; **dhari** — aceptar; **deya** — dar; **kola** — abrazo.\"],\"translation\":[\"Gorāchānda ya no puede caminar, ya no puede hablar, apenas pronuncia algunas medias palabras. Profundamente absorto por las melosidades del amor divino, cantando: “Hari, Hari”, agarra al más bajo de los hombres y lo abraza.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"chalite\",\"trans\":\"caminar\",\"sep\":\" \"},{\"text\":\"nā pāre\",\"trans\":\"incapaz\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"gorā-        chānda\",\"trans\":\"Gaurachandra\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"gosāñi re\",\"trans\":\"oh Gosāi\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"balite\",\"trans\":\"hablar\",\"sep\":\" \"},{\"text\":\"nā pāre\",\"trans\":\"incapaz\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"ādha\",\"trans\":\"mitad\",\"sep\":\" \"},{\"text\":\"bola\",\"trans\":\"palabra\",\"sep\":\"\"}],[{\"text\":\"bhāvete\",\"trans\":\"en éxtasis\",\"sep\":\" \"},{\"text\":\"avaśa\",\"trans\":\"indefenso\",\"sep\":\" \"},{\"text\":\"ha-iyā\",\"trans\":\"volviéndose\",\"sep\":\"        \",\"error\":\"multi\"},{\"text\":\"hari hari\",\"trans\":\"Hari Hari\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"bolāiyā\",\"trans\":\"cantando\",\"sep\":\"\"}],[{\"text\":\"āchaṇḍāle\",\"trans\":\"al *chaṇḍāla*\",\"sep\":\" \"},{\"text\":\"dhari\",\"trans\":\"aceptar\",\"sep\":\" \"},{\"text\":\"deya\",\"trans\":\"dar\",\"sep\":\" \"},{\"text\":\"kola\",\"trans\":\"abrazo\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"e sukha-sampada kāle        gorā nā bhajiluñ hele\",\"        hena pade nā karinu āśa\",\"śrī-kṛṣṇa-chaitanya chandra    ṭhākura śrī-nityānanda\",\"        guṇa gāya vṛndāvana dāsa\"],\"word_by_word\":[\"**e sukha** — esta felicidad; **sampada** — dotado; **kāle** — en el momento; **gorā** — Gaurāṅga; **nā bhajiluñ** — no adoré; **hele** — inclinarse; **hena pade** — tales pies; **nā karinu** — no lo hice; **āśa** — deseo; **śrī-kṛṣṇa-chaitanya chandra** — Śrī Kṛṣṇa Chaitanya Chandra; **ṭhākura śrī-nityānanda** — Ṭhākura Śrī Nityānanda; **guṇa** — glorias; **gāya** — canta; **vṛndāvana dāsa** — Vṛndāvan Dās.\"],\"translation\":[\"Durante este mismo tiempo que estuvo dotado de tanta felicidad, no adoré a Gorā. ¡No aspiré a Sus pies de loto! Vṛndāvan Dās canta las glorias de Śrī Kṛṣṇa Chaitanya Chandra y Ṭhākura Śrī Nityānanda.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"e sukha\",\"trans\":\"esta felicidad\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"sampada\",\"trans\":\"dotado\",\"sep\":\" \"},{\"text\":\"kāle\",\"trans\":\"en el momento\",\"sep\":\"        \"},{\"text\":\"gorā\",\"trans\":\"Gaurāṅga\",\"sep\":\" \"},{\"text\":\"nā bhajiluñ\",\"trans\":\"no adoré\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"hele\",\"trans\":\"inclinarse\",\"sep\":\"\"}],[{\"text\":\"hena pade\",\"trans\":\"tales pies\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"nā karinu\",\"trans\":\"no lo hice\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"āśa\",\"trans\":\"deseo\",\"sep\":\"\"}],[{\"text\":\"śrī-kṛṣṇa-chaitanya chandra\",\"trans\":\"Śrī Kṛṣṇa Chaitanya Chandra\",\"sep\":\"    \",\"error\":\"multi\"},{\"text\":\"ṭhākura śrī-nityānanda\",\"trans\":\"Ṭhākura Śrī Nityānanda\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"guṇa\",\"trans\":\"glorias\",\"sep\":\" \"},{\"text\":\"gāya\",\"trans\":\"canta\",\"sep\":\" \"},{\"text\":\"vṛndāvana dāsa\",\"trans\":\"Vṛndāvan Dās\",\"sep\":\"\",\"error\":\"multi\"}]]}],\"hasWbw\":true,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1a:[\"$\",\"$L22\",null,{\"navMap\":{\"416\":{\"prev\":{\"path\":\"/es/chit-kana-jiva-krishna/\",\"title\":\"Jīva-gati\"},\"next\":{\"path\":\"/es/radhe-govinda/\",\"title\":\"Rādhā Kṛṣṇa vand
