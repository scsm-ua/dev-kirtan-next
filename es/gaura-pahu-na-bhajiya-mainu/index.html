\":\"gaura pahū̐ nā bhajiyā mainu\"},\"title\":[\"Gaura Pahū̐\"],\"word_by_word\":[\"**gaura** — Gaurāṅga; **pahū̐** — el Señor.\"],\"author\":[\"Śrīla Narottam Dās Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"gaura pahū̐ nā bhajiyā mainu\",\"prema ratana-dhana helāya hārāinu\"],\"word_by_word\":[\"**gaura** — Gauraṅga; **pahū̐** — el Señor; **nā** — no; **bhajiyā** — adorado; **mainu** — volverse angustiado; **prema** — amor divino; **ratana** — joyas; **dhana** — riqueza; **helāya** — negligir; **hārāinu** — he perdido.\"],\"translation\":[\"¡Oh, Señor Gaura! No te he adorado, y por mi propia negligencia se me ha privado de la joya del amor divino.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"gaura\",\"trans\":\"Gauraṅga\",\"sep\":\" \"},{\"text\":\"pahū̐\",\"trans\":\"el Señor\",\"sep\":\" \"},{\"text\":\"nā\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"bhajiyā\",\"trans\":\"adorado\",\"sep\":\" \"},{\"text\":\"mainu\",\"trans\":\"volverse angustiado\",\"sep\":\"\"}],[{\"text\":\"prema\",\"trans\":\"amor divino\",\"sep\":\" \"},{\"text\":\"ratana\",\"trans\":\"joyas\",\"sep\":\"-\"},{\"text\":\"dhana\",\"trans\":\"riqueza\",\"sep\":\" \"},{\"text\":\"helāya\",\"trans\":\"negligir\",\"sep\":\" \"},{\"text\":\"hārāinu\",\"trans\":\"he perdido\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"adhane jatana kori dhana teyā-ginu\",\"āpana karama doṣe āpani ḍubinu\"],\"word_by_word\":[\"**adhane** — pobre; **jatana** — esfuerzo; **kori** — hacer; **dhana** — tesoro; **teyā-ginu** — yo renuncio; **āpana** — yo mismo; **karama** — de acciones; **doṣe** — por faltas; **āpani** — personalmente; **ḍubinu** — me sumerjo.\"],\"translation\":[\"Aunque estoy necesitado de Tu riqueza, he intentado por todos los medios rechazar Tus riquezas, y, más bien, me he sumergido en las pecaminosas actividades materiales.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"adhane\",\"trans\":\"pobre\",\"sep\":\" \"},{\"text\":\"jatana\",\"trans\":\"esfuerzo\",\"sep\":\" \"},{\"text\":\"kori\",\"trans\":\"hacer\",\"sep\":\" \"},{\"text\":\"dhana\",\"trans\":\"tesoro\",\"sep\":\" \"},{\"text\":\"teyā-ginu\",\"trans\":\"yo renuncio\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"āpana\",\"trans\":\"yo mismo\",\"sep\":\" \"},{\"text\":\"karama\",\"trans\":\"de acciones\",\"sep\":\" \"},{\"text\":\"doṣe\",\"trans\":\"por faltas\",\"sep\":\" \"},{\"text\":\"āpani\",\"trans\":\"personalmente\",\"sep\":\" \"},{\"text\":\"ḍubinu\",\"trans\":\"me sumerjo\",\"sep\":\"\"}]]},{\"number\":\"3\",\"text\":[\"sat-saṅga chāḍi koinu asate vilāsa\",\"te-kāraṇe lāgilo ye karma-bandha-phāṅsa\"],\"word_by_word\":[\"**sat-saṅga** — asociación de santos; **chāḍi** — rechazar; **koinu** — hice; **asate** — entre los ímpios; **vilāsa** — mis actividades; **te-kāraṇe** — por esa razón; **lāgilo** — obtuve; **ye** — tal; **karma** — actividades fuitivas; **bandha** — cautiverio; **phāṅsa** — nudo.\"],\"translation\":[\"Evitando la asociación de las personas santas, he disfrutado divertirme con gente materialista. Por tal razón me encuentro atado por la soga de la actividad fruitiva y sus reacciones.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"sat-saṅga\",\"trans\":\"asociación de santos\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"chāḍi\",\"trans\":\"rechazar\",\"sep\":\" \"},{\"text\":\"koinu\",\"trans\":\"hice\",\"sep\":\" \"},{\"text\":\"asate\",\"trans\":\"entre los ímpios\",\"sep\":\" \"},{\"text\":\"vilāsa\",\"trans\":\"mis actividades\",\"sep\":\"\"}],[{\"text\":\"te-kāraṇe\",\"trans\":\"por esa razón\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"lāgilo\",\"trans\":\"obtuve\",\"sep\":\" \"},{\"text\":\"ye\",\"trans\":\"tal\",\"sep\":\" \"},{\"text\":\"karma\",\"trans\":\"actividades fuitivas\",\"sep\":\"-\"},{\"text\":\"bandha\",\"trans\":\"cautiverio\",\"sep\":\"-\"},{\"text\":\"phāṅsa\",\"trans\":\"nudo\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"viṣoya-biṣama-biṣa satata khāinu\",\"gaura-kīrttana rase magana nā hoinu\"],\"word_by_word\":[\"**viṣoya** — de la gratificación sensorial; **biṣama** — peligroso; **biṣa** — veneno; **satata** — continuamente; **khāinu** — bebí; **gaura-kīrttana** — el canto del nombre de Gaurāṅga; **rase** — en la melosidad trascendental; **magana** — inmerso; **nā** — no; **hoinu** — hice.\"],\"translation\":[\"Siempre he bebido el horrible veneno de la gratificación de los sentidos y nunca he llegado a absorberme en el dulce néctar del canto de los Nombres de Gaura.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"viṣoya\",\"trans\":\"de la gratificación sensorial\",\"sep\":\"-\"},{\"text\":\"biṣama\",\"trans\":\"peligroso\",\"sep\":\"-\"},{\"text\":\"biṣa\",\"trans\":\"veneno\",\"sep\":\" \"},{\"text\":\"satata\",\"trans\":\"continuamente\",\"sep\":\" \"},{\"text\":\"khāinu\",\"trans\":\"bebí\",\"sep\":\"\"}],[{\"text\":\"gaura-kīrttana\",\"trans\":\"el canto del nombre de Gaurāṅga\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"rase\",\"trans\":\"en la melosidad trascendental\",\"sep\":\" \"},{\"text\":\"magana\",\"trans\":\"inmerso\",\"sep\":\" \"},{\"text\":\"nā\",\"trans\":\"no\",\"sep\":\" \"},{\"text\":\"hoinu\",\"trans\":\"hice\",\"sep\":\"\"}]]},{\"number\":\"5\",\"text\":[\"keno bā āchaye prāṇa ki sukha lāgiyā\",\"narottama dāsa keno nā gela moriyā\"],\"word_by_word\":[\"**keno** — ¿por qué?; **bā** — ¡oh!; **āchaye** — estoy; **prāṇa** — vida; **ki** — ¿qué?; **sukha** — felicidad; **lāgiyā** — motivo; **narottama** — Narottama; **dāsa** — sirviente; **keno** — ¿por qué?; **nā** — no; **gela** — ido; **moriyā** — morir.\"],\"translation\":[\"¡Oh! ¿Por qué mi corazón no experimenta satisfacción alguna y por qué Narottam Dās no ha muerto?\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"keno\",\"trans\":\"¿por qué?\",\"sep\":\" \"},{\"text\":\"bā\",\"t
