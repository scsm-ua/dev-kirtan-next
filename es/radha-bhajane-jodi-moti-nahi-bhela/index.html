",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"ātapa-rohita sūray nāhi jāni\",\"rādhā-birahita mādhav nāhi māni\"],\"word_by_word\":[\"**ātapa-rohita** — sin la luz del sol; **sūray** — el sol; **nāhi jāni** — no sé; **rādhā-birahita** — si Rādhā; **mādhav** — Kṛṣṇa; **nāhi māni** — no conozco.\"],\"translation\":[\"Sin su luz, el sol no puede ser visto; similarmente, no tengo interés alguno en Kṛṣṇa sin Rādhā.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"ātapa-rohita\",\"trans\":\"sin la luz del sol\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"sūray\",\"trans\":\"el sol\",\"sep\":\" \"},{\"text\":\"nāhi jāni\",\"trans\":\"no sé\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"rādhā-birahita\",\"trans\":\"si Rādhā\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"mādhav\",\"trans\":\"Kṛṣṇa\",\"sep\":\" \"},{\"text\":\"nāhi māni\",\"trans\":\"no conozco\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"3\",\"text\":[\"kevala mādhav pūjaye so ajñānī\",\"rādhā anādara koroi abhimānī\"],\"word_by_word\":[\"**kevala** — solo; **mādhav** — Kṛṣṇa; **pūjaye** — adoración; **so** — eso; **ajñānī** — ignorante; **rādhā anādara** — sin la adoración a Rādhā; **koroi** — hago; **abhimānī** — orgulloso.\"],\"translation\":[\"Aquel que adora a Kṛṣṇa solo es un ignorante. Aquel que no adora a Śrī Rādhā es un egoísta.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"kevala\",\"trans\":\"solo\",\"sep\":\" \"},{\"text\":\"mādhav\",\"trans\":\"Kṛṣṇa\",\"sep\":\" \"},{\"text\":\"pūjaye\",\"trans\":\"adoración\",\"sep\":\" \"},{\"text\":\"so\",\"trans\":\"eso\",\"sep\":\" \"},{\"text\":\"ajñānī\",\"trans\":\"ignorante\",\"sep\":\"\"}],[{\"text\":\"rādhā anādara\",\"trans\":\"sin la adoración a Rādhā\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"koroi\",\"trans\":\"hago\",\"sep\":\" \"},{\"text\":\"abhimānī\",\"trans\":\"orgulloso\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"kobohi nāhi korobi tā̐kor saṅga\",\"chitte ichāsi jadi vraja-rasa-raṅga\"],\"word_by_word\":[\"**kobohi** — en cualquier momento; **nāhi korobi** — no haré; **tā̐kor** — de él; **saṅga** — asociación; **chitte** — en el corazón; **ichāsi** — tu deseo; **jadi** — si; **vraja-rasa** — el néctar de Vraja; **raṅga** — pasatiempos.\"],\"translation\":[\"No permanezcas en la compañía de aquellos que envidian a Rādhā, si toda la aspiración de tu corazón son los pasatiempos amorosos de Vraja.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"kobohi\",\"trans\":\"en cualquier momento\",\"sep\":\" \"},{\"text\":\"nāhi korobi\",\"trans\":\"no haré\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"tā̐kor\",\"trans\":\"de él\",\"sep\":\" \"},{\"text\":\"saṅga\",\"trans\":\"asociación\",\"sep\":\"\"}],[{\"text\":\"chitte\",\"trans\":\"en el corazón\",\"sep\":\" \"},{\"text\":\"ichāsi\",\"trans\":\"tu deseo\",\"sep\":\" \"},{\"text\":\"jadi\",\"trans\":\"si\",\"sep\":\" \"},{\"text\":\"vraja-rasa\",\"trans\":\"el néctar de Vraja\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"raṅga\",\"trans\":\"pasatiempos\",\"sep\":\"\"}]]},{\"number\":\"5\",\"text\":[\"rādhikā-dāsī jadi hay abhimān\",\"śīghrai milai tava gokula kāna\"],\"word_by_word\":[\"**rādhikā-dāsī** — sivienta de Rādhārāṇī; **jadi hay** — si es; **abhimān** — ídea; **śīghrai** — rápidamente; **milai** — encuentro; **tava** — tuyo; **gokula kāna** — el Kāna de Gokula (Kṛṣṇa).\"],\"translation\":[\"Aquellos que se consideran a sí mismos sirvientas de Śrī Rādhā muy pronto verán a Gokul-Kṛṣṇa.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"rādhikā-dāsī\",\"trans\":\"sivienta de Rādhārāṇī\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"jadi hay\",\"trans\":\"si es\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"abhimān\",\"trans\":\"ídea\",\"sep\":\"\"}],[{\"text\":\"śīghrai\",\"trans\":\"rápidamente\",\"sep\":\" \"},{\"text\":\"milai\",\"trans\":\"encuentro\",\"sep\":\" \"},{\"text\":\"tava\",\"trans\":\"tuyo\",\"sep\":\" \"},{\"text\":\"gokula kāna\",\"trans\":\"el Kāna de Gokula (Kṛṣṇa)\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"6\",\"text\":[\"brahmā, śiva, nārada, śruti, nārāyaṇī\",\"rādhikā-pada-raja pūjaye māni\"],\"word_by_word\":[\"**brahmā, śiva, nārada** — Brahmā, Śiva y Nārada; **śruti** — los *Vedas*; **nārāyaṇī** — Laṣkmī; **rādhikā-pada** — los pies de Rādhikā; **raja** — polvo; **pūjaye** — adoración; **māni** — honor.\"],\"translation\":[\"Brahmā, Śiva, Nārada, los *śrutis* y Nārāyaṇī (Lakṣmī) adoran con respeto los sagrados pies de Śrī Rādhā.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"brahmā, śiva, nārada\",\"trans\":\"Brahmā, Śiva y Nārada\",\"sep\":\", \",\"error\":\"multi\"},{\"text\":\"śruti\",\"trans\":\"los *Vedas*\",\"sep\":\", \"},{\"text\":\"nārāyaṇī\",\"trans\":\"Laṣkmī\",\"sep\":\"\"}],[{\"text\":\"rādhikā-pada\",\"trans\":\"los pies de Rādhikā\",\"sep\":\"-\",\"error\":\"multi\"},{\"text\":\"raja\",\"trans\":\"polvo\",\"sep\":\" \"},{\"text\":\"pūjaye\",\"trans\":\"adoración\",\"sep\":\" \"},{\"text\":\"māni\",\"trans\":\"honor\",\"sep\":\"\"}]]},{\"number\":\"7\",\"text\":[\"umā, ramā, satyā, śachī, chandrā, rukmiṇī\",\"rādhā-avatār sobe,—āmnāya-vāṇī\"],\"word_by_word\":[\"**umā, ramā, satyā, śachī, chandrā, rukmiṇī** — Umā, Ramā, Satyā, Śachī, Chandrāvālī y Rukminī; **rādhā-avatār** — encarnaciones de Śrī Rādhā; **sobe** — todas; **āmnāya** — de los *Vedas*; **vāṇī** — palabras.\"],\"translation\":[\"Umā, Ramā, Satyā, Śachī, Chandrāvālī y Rukminī son todas expansiones personales de Śrīmatī Rādhārāṇī. Este es el veredicto autoevidente de los *Vedas*.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"umā, ramā, satyā, śachī, chandrā, rukmiṇī\",\"trans\":\"Umā, Ramā, Satyā, Śachī, Chandrāvālī y Rukminī\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"rādhā-avatār\",\"trans\":\"encarnaciones de Śrī Rādhā\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"sobe\",\"trans\":\"todas\",\"sep\":\",\"},{\"text\":\"—āmnāya\",\"trans\":\"de los *Vedas*\",\"sep\":\"-\",\"error\":\"mismatch\"},{\"text\":\"vāṇī\",\"trans\":\"palabras\",\"sep\":\"\"}]]},{\"number\":\"8\",\"text\":[\"heno rādhā-paricharjyā jā̐kara dhana\",\"bhakativinoda tā̐ra māgaye charaṇa\"],\"word_by_word\":[\"**heno** — de tal manera; **rādhā-paricharjyā** — la adoración a Rādhā; **jā̐kara** — de quien; **dhana** — riqueza; **bhakativinoda** — Bhakti Vinod; **tā̐ra** — de él; **māgaye** — ora; **charaṇa** — a los pies.\"],\"translation\":[\"Bhakti Vinod, cuya única riqueza es el servicio a Śrī Rādhā, humildemente ora por ser una sirvienta a Sus pies de loto.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"heno\",\"trans\":\"de tal manera\",\"sep\":\" \"},{\"text\":\"rādhā-paricharjyā\",\"trans\":\"la adoración a Rādhā\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"jā̐kara\",\"trans\":\"de quien\",\"sep\":\" \"},{\"text\":\"dhana\",\"trans\":\"riqueza\",\"sep\":\"\"}],[{\"text\":\"bhakativinoda\",\"trans\":\"Bhakti Vinod\",\"sep\":\" \"},{\"text\":\"tā̐ra\",\"trans\":\"de él\",\"sep\":\" \"},{\"text\":\"māgaye\",\"trans\":\"ora\",\"sep\":\" \"},{\"text\":\"charaṇa\",\"trans\":\"a los pies\",\"sep\":\"\"}]]}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/krsnachaitanya-das/31-radha-bhajane-yadi-8\"},{\"title\":{\"en\":\"Srila B.N. Acharya Maharaj\",\"ru\":\"Шрила Б.Н. Ачарья Махарадж\",\"ua\":\"Шріла Б.Н. Ачарʼя Махарадж\"},\"embed_url\":\"https://soundcloud.com/kostya-netrebenko/076-radhabhajaneyadi-10\"},{\"title\":{\"en\":\"Caracas temple\",\"ru\":\"Храм г.Каракас\",\"ua\":\"Храм м.Каракас\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/sridhar
