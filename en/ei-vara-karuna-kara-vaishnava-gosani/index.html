thāne aparādhe tāre hari-nāma\",\"tomā-sthāne aparādhe nāhika eḍāna\"],\"translation\":[\"If one commits an offence at the feet of Lord Hari, he can be forgiven if he chants the Holy Name. But if one offends you, there is no salvation for him.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"tomāra hṛdaye sadā govinda-viśrāma\",\"govinda kahena mama vaiṣṇava parāṇa\"],\"translation\":[\"In your heart Govinda is always resting. Śrī Govinda Himself says, “My devotees are My life and soul.”\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"prati janme kari āśā charaṇera dhūli\",\"narottame kara dayā āpanāra bali’\"],\"translation\":[\"I hope that in every birth I will obtain the dust of your lotus feet. Śrī Narottam prays, “Please, O Vaiṣṇava Goswāmī, be kind unto me.”\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-ei-baro-koruna\",\"personSlug\":\"srila-b-s-govinda-dev-goswami-maharaj\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1e:[\"$\",\"$L28\",null,{\"audio\":\"$1d:props:song:resources:audio\",\"bookId\":\"en\",\"caption\":\"Listen to recordings:\",\"songTitle\":\"Vaiṣṇava Vijñāpti\"}]\n1f:[\"$\",\"$L29\",null,{\"navMap\":{\"120\":{\"prev\":{\"path\":\"/en/je-anilo-prema-dhana-karuna-prachura/\",\"title\":\"Viraha-gīti\"},\"next\":{\"path\":\"/en/kripa-kara-vaishnava-thakura/\",\"title\":\"Prārthanā Lālasāmayī\"}}}}]\n2a:Tf61,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"alternateName\":[\"Kirt
