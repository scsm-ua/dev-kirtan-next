by Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\"}]]}]]}]]]}]]\n"])</script><script>self.__next_f.push([1,"1e:[\"$\",\"$L27\",null,{\"bookId\":\"en\",\"label\":\"Show verses / translation\",\"song\":{\"meta\":{\"page\":50,\"first_line\":\"jaya śachīnandana sura-muni-vandana\",\"author\":\"Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\"},\"title\":[\"Śrī Śachīnandana-vandanā\"],\"author\":[\"by Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\"],\"verses\":[{\"number\":\"1\",\"text\":[\"jaya śachī-nandana sura-muni-vandana,\",\"    bhava-bhaya-khaṇḍana jayo he\",\"jaya hari-kīrtana nartanā vartana,\",\"    kali-mala-kartana jayo he\"],\"word_by_word\":[\"**jaya** — Glories; **śachī** — Śachi's; **nandana** — son; **sura** — gods; **muni** — sages; **vandana** — worship; **bhava** — worldy existence; **bhaya** — fear; **khaṇḍana** — destroyer; **jayo** — Glories; **he** — O!; **jaya** — Glories; **hari** — Hari; **kīrtana** — chanting; **nartanā** — dancing; **vartana** — inaugurator; **kali** — Kali Yuga; **mala** — contamination; **kartana** — severs; **jayo** — All glory; **he** — O!\"],\"translation\":[\"All glories to Śrī Krishna Chaitanya Mahāprabhu, the son of Śachī Devī. Great sages and demigods always sing His praise, for by doing so, the fear of repeated birth and death is cut to pieces. All glories to the *kīrtan* of the Holy Name of Krishna, for when one chants the Holy Name of Krishna and dances in ecstasy, the filth of this age of Kali disappears.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"jaya\",\"trans\":\"Glories\",\"sep\":\" \"},{\"text\":\"śachī\",\"trans\":\"Śachi's\",\"sep\":\"-\"},{\"text\":\"nandana\",\"trans\":\"son\",\"sep\":\" \"},{\"text\":\"sura\",\"trans\":\"gods\",\"sep\":\"-\"},{\"text\":\"muni\",\"trans\":\"sages\",\"sep\":\"-\"},{\"text\":\"vandana\",\"trans\":\"worship\",\"sep\":\",\"}],[{\"text\":\"bhava\",\"trans\":\"worldy existence\",\"sep\":\"-\"},{\"text\":\"bhaya\",\"trans\":\"fear\",\"sep\":\"-\"},{\"text\":\"khaṇḍana\",\"trans\":\"destroyer\",\"sep\":\" \"},{\"text\":\"jayo\",\"trans\":\"Glories\",\"sep\":\" \"},{\"text\":\"he\",\"trans\":\"O!\",\"sep\":\"\"}],[{\"text\":\"jaya\",\"trans\":\"Glories\",\"sep\":\" \"},{\"text\":\"hari\",\"trans\":\"Hari\",\"sep\":\"-\"},{\"text\":\"kīrtana\",\"trans\":\"chanting\",\"sep\":\" \"},{\"text\":\"nartanā\",\"trans\":\"dancing\",\"sep\":\" \"},{\"text\":\"vartana\",\"trans\":\"inaugurator\",\"sep\":\",\"}],[{\"text\":\"kali\",\"trans\":\"Kali Yuga\",\"sep\":\"-\"},{\"text\":\"mala\",\"trans\":\"contamination\",\"sep\":\"-\"},{\"text\":\"kartana\",\"trans\":\"severs\",\"sep\":\" \"},{\"text\":\"jayo\",\"trans\":\"All glory\",\"sep\":\" \"},{\"text\":\"he\",\"trans\":\"O!\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"nayana-purandara viśvarūpa snehadhara,\",\"    viśvambhara viśvera kalyāṇa\",\"jaya lakṣmī-viṣṇupriyā viśvambhara priya-hiyā,\",\"    jaya priya kiṅkara īśāna\"],\"word_by_word\":[\"**nayana** — eyes; **purandara** — king; **viśvarūpa** — Viśvarūp; **snehadhara** — who has affection; **viśvambhara** — universe maintainer; **viśvera** — universe of; **kalyāṇa** — good fortune; **jaya** — All glory; **lakṣmī** — Lakṣmī Priyā; **viṣṇupriyā** — Viṣṇu Priyā; **viśvambhara** — Viśvambhar; **priya** — dear; **hiyā** — heart!; **jaya** — All glory; **priya** — dear; **kiṅkara** — servant; **īśāna** — Īśān.\"],\"translation\":[\"Śrī Chaitanya delights all eyes with His charming beauty. He is the most dearly beloved Lord of all and the intimate brother of Viśvarūp. He brings the highest auspiciousness to everyone, for He floods the entire universe with the nectar of love of Godhead and thus saves all living beings. All glories to Lakṣmī Priyā and Viṣṇu Priyā Devī, who are very dear to Śrī Nimāi Paṇḍit. All glories to Their family servant, Īśāna.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"nayana\",\"trans\":\"eyes\",\"sep\":\"-\"},{\"text\":\"purandara\",\"trans\":\"king\",\"sep\":\" \"},{\"text\":\"viśvarūpa\",\"trans\":\"Viśvarūp\",\"sep\":\" \"},{\"text\":\"snehadhara\",\"trans\":\"who has affection\",\"sep\":\",\"}],[{\"text\":\"viśvambhara\",\"trans\":\"universe maintainer\",\"sep\":\" \"},{\"text\":\"viśvera\",\"trans\":\"universe of\",\"sep\":\" \"},{\"text\":\"kalyāṇa\",\"trans\":\"good fortune\",\"sep\":\"\"}],[{\"text\":\"jaya\",\"trans\":\"All glory\",\"sep\":\" \"},{\"text\":\"lakṣmī\",\"trans\":\"Lakṣmī Priyā\",\"sep\":\"-\"},{\"text\":\"viṣṇupriyā\",\"trans\":\"Viṣṇu Priyā\",\"sep\":\" \"},{\"text\":\"viśvambhara\",\"trans\":\"Viśvambhar\",\"sep\":\" \"},{\"text\":\"priya\",\"trans\":\"dear\",\"sep\":\"-\"},{\"text\":\"hiyā\",\"trans\":\"heart!\",\"sep\":\",\"}],[{\"text\":\"jaya\",\"trans\":\"All glory\",\"sep\":\" \"},{\"text\":\"priya\",\"trans\":\"dear\",\"sep\":\" \"},{\"text\":\"kiṅkara\",\"trans\":\"servant\",\"sep\":\" \"},{\"text\":\"īśāna\",\"trans\":\"Īśān\",\"sep\":\"\"}]]},{\"number\":\"3\",\"text\":[\"śrī sītā-advaita-rāy mālinī-śrīvāsa jay,\",\"    jay chandraśekhara āchārya\",\"jay nityānanda rāy gadādhara jay jay,\",\"    jaya haridās nāmāchārya\"],\"word_by_word\":[\"**śrī** — Śrī; **sītā** — Sītā; **advaita** — Advaita; **rāy** — Rāy; **mālinī** — Mālinī; **śrīvāsa** — Śrīvās; **jay** — All glory; **jay** — All glory; **chandraśekhara** — Chandraśekhar; **āchārya** — āchārya; **jay** — All glory; **nityānanda** — Nityānanda; **rāy** — Rāy; **gadādhara** — Gadādhar; **jay** — All glory; **jay** — All glory; **jaya** — All glory; **haridās** — Haridās; **nāmāchārya** — Holy Name Acharya.\"],\"translation\":[\"All glories to Sītā Ṭhākurāṇī and Śrī Advaita Āchārya, all glories to Mālinī-devī and Śrīvās Ṭhākur, and all glories to Āchārya Chandraśekhara. All glories to Śrīla Nityānanda Prabhu, Śrīla Gadādhara Paṇḍit and Śrīla Haridās Ṭhākur, the Nāmāchārya.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"śrī\",\"trans\":\"Śrī\",\"sep\":\" \"},{\"text\":\"sītā\",\"trans\":\"Sītā\",\"sep\":\"-\"},{\"text\":\"advaita\",\"trans\":\"Advaita\",\"sep\":\"-\"},{\"text\":\"rāy\",\"trans\":\"Rāy\",\"sep\":\" \"},{\"text\":\"mālinī\",\"trans\":\"Mālinī\",\"sep\":\"-\"},{\"text\":\"śrīvāsa\",\"trans\":\"Śrīvās\",\"sep\":\" \"},{\"text\":\"jay\",\"trans\":\"All glory\",\"sep\":\",\"}],[{\"text\":\"jay\",\"trans\":\"All glory\",\"sep\":\" \"},{\"text\":\"chandraśekhara\",\"trans\":\"Chandraśekhar\",\"sep\":\" \"},{\"text\":\"āchārya\",\"trans\":\"āchārya\",\"sep\":\"\"}],[{\"text\":\"jay\",\"trans\":\"All glory\",\"sep\":\" \"},{\"text\":\"nityānanda\",\"trans\":\"Nityānanda\",\"sep\":\" \"},{\"text\":\"rāy\",\"trans\":\"Rāy\",\"sep\":\" \"},{\"text\":\"gadādhara\",\"trans\":\"Gadādhar\",\"sep\":\" \"},{\"text\":\"jay\",\"trans\":\"All glory\",\"sep\":\" \"},{\"text\":\"jay\",\"trans\":\"All glory\",\"sep\":\",\"}],[{\"text\":\"jaya\",\"trans\":\"All glory\",\"sep\":\" \"},{\"text\":\"haridās\",\"trans\":\"Haridās\",\"sep\":\" \"},{\"text\":\"nāmāchārya\",\"trans\":\"Holy Name Acharya\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"murāri mukunda jay premanidhi mahāśaya,\",\"    jaya jata prabhu pāriṣad\",\"vandi savākāra pāya adhamere kṛpā hoy,\",\"    bhakti sapārṣada-prabhupād\"],\"word_by_word\":[\"**murāri** — Murāri; **mukunda** — Mukunda; **jay** — All glory; **premanidhi** — Premanidhi; **mahāśaya** — magnanimous (Pundarika Vidyanidhi); **jaya** — Glory; **jata** — all; **prabhu** — Lord; **pāriṣad** — associates; **vandi** — I bow; **savākāra** — to everone's; **pāya** — feet; **adhamere** — fallen soul; **kṛpā** — mercy; **hoy** — happens; **bhakti** — devotion; **sapārṣada** — with associates; **prabhupād** — Śrīla Prabhupāda (Śrīla B.S. Saraswati Thākur).\"],\"translation\":[\"All glories to Murāri Gupta, and all glories to Mukunda Datta. All glories to all the other eternal associates of Śrī Chaitanya Mahāprabhu. By singing the glories of Śrīla Prabhupād and all those great souls who are eterna
