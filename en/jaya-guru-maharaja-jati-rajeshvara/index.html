,\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;your effulgence fills the skies.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"suvarṇa-sūraja-kānti aruṇa-vasana\",\"tilaka, tulasī-mālā, chandana-bhūṣaṇa\"],\"translation\":[\"A golden Sun resplendent,\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;in robes of saffron dressed;\\\\\",\"Adorned with tilak, Tulasī beads,\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;and with sandal fragrance blessed.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"apūrva śrī-aṅga-śobhā kore jhalamala\",\"audārya-unnata-bhāva mādhurya-ujjvala\"],\"translation\":[\"The matchless beauty of your holy form,\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dazzling in its brightness;\\\\\",\"Your benevolence of most noble heart,\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;in the moonglow of love’s sweetness.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"achintya-pratibhā, snigdha, gambhīra, udāra\",\"jaḍa-jñāna-giri-vajra divya-dīkṣādhāra\"],\"translation\":[\"Inconceivable genius, affection,\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gravity, magnanimity —\\\\\",\"A thunderbolt crushing mundane knowledge,\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;the reservoir bestowing divinity.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"gaura-saṅkīrtana-rāsa-rasera āśray\",\"“dayāla nitāi” nāme nitya premamoy\"],\"translation\":[\"In the Golden Lord’s Saṅkīrtan Dance,\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;you revel ecstatically;\\\\\",\"“Dayāl Nitāi, Dayāl Nitāi!”\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;you ever call so lovingly.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"sāṅgopāṅge gaura-dhāme nitya-parakāśa\",\"gupta-govardhane divya-līlāra-vilāsa\"],\"translation\":[\"Eternally present in Nabadwīp Dhām\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;with your associates, by your sweet will,\\\\\",\"You enjoy your holy Pastimes\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;on hidden Govardhan Hill.\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"gauḍīya-āchārya-goṣṭhī-gaurava-bhājana\",\"gauḍīya-siddhāntamaṇi kaṇṭha-vibhuṣaṇa\"],\"translation\":[\"You’re the fit recipient of your dignity\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;In the Gauḍīya Āchārya assembly,\\\\\",\"The jewel of the Gauḍīya-*siddhānta*\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;adorning your chest so nobly.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"gaura-sarasvatī-sphūrta siddhāntera khani\",\"āviṣkṛta gāyatrīra artha-chintāmaṇi\"],\"translation\":[\"You’re the living message of Śrī Gaura,\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;you’re the mine of perfect conclusions;\\\\\",\"You revealed the Gāyatrī’s inner purport:\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;the gem fulfilling all aspirations.\"],\"isLong\":false},{\"number\":\"12\",\"text\":[\"eka-tattva varṇanete nitya-nava-bhāva\",\"susaṅgati, sāmañjasya, e saba prabhāva\"],\"translation\":[\"When you speak, one subject alone\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;is revealed in ever-new light;\\\\\",\"Proper adjustment, and harmony —\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;All these are your spiritual might.\"],\"isLong\":false},{\"number\":\"13\",\"text\":[\"tomāra satīrtha-varga sabe eka-mate\",\"rūpa-sarasvatī-dhārā dekhena tomāte\"],\"translation\":[\"All your dear Godbrothers\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;declare unanimously\\\\\",\"They see within your Holiness\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;the line of Rūpa-Saraswatī.\"],\"isLong\":false},{\"number\":\"14\",\"text\":[\"tulasī-mālikā-haste śrī-nāma-grahaṇa\",\"dekhi’ sakalera hoy ‘prabhu’ uddīpana\"],\"translation\":[\"Seeing you take the Holy Name,\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;with Tulasī beads in hand,\\\\\",\"Awakens the thought of Saraswatī Ṭhākur\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;in everybody’s mind.\"],\"isLong\":false},{\"number\":\"15\",\"text\":[\"koṭī-chandra-suśītala o pada bharasā\",\"gāndharvā-govinda-līlāmṛta-lābha-āśā\"],\"translation\":[\"Your feet, cooling like ten million moons —\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;In their service all faith do I place;\\\\\",\"The nectar of Rādhā-Govinda’s Pastimes\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;one day we may drink, by your grace.\"],\"isLong\":false},{\"number\":\"16\",\"text\":[\"avichintya-bhedābheda-siddhānta-prakāśa\",\"sānande ārati stuti kore dīna-dāsa\"],\"translation\":[\"O personification of perfect conclusions\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;inconceivably one, yet different!\\\\\",\"I sing this prayer at your *ārati*,\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;with joy — your humble servant.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-sri-guru-arati\"},{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-jaya-guru\"},{\"title\":{\"en\":\"Srila B.K. Ashram Maharaj\",\"ru\":\"Шрила Б.К. Ашрам Махарадж\",\"ua\":\"Шріла Б.К. Ашрам Махарадж\"},\"embed_url\":\"https://soundcloud.com/scsmathcolombia/4-sri-guru-arati-stuti\"},{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-jaya-guru\"},{\"title\":{\"en\":\"Caracas temple\",\"ru\":\"Храм г.Каракас\",\"ua\":\"Храм м.Каракас\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/shchsm-karakas-dzhaya-guru-1\"}]},\"hasWbw\":fals
