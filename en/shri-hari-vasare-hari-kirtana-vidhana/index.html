rated with sandalwood paste and flower garlands, and danced, overwhelmed with joy.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"nijānande nāche mahāprabhu viśvambhara\",\"charaṇera tāli śuni ati manohara\"],\"translation\":[\"Mahāprabhu Viśvambhar danced in the ecstasy of Himself. Hearing the rhythm of His feet was heart capturing.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"bhāvāveśe mālā nāhi rahaye galāya\",\"chhiṇḍiyā paḍaye giyā bhakatera gāya\"],\"translation\":[\"While He was rapt in ecstasy, His flower garland could not remain around His neck. It broke and fell as the devotees sang.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"yā̐ra nāmānande śiva vasana nā jāne\",\"yā̐ra rase nāche śiva se nāche āpane\"],\"translation\":[\"In the ecstasy of whose Name, Śiva does not notice if he is clothed. In that ecstasy which causes Śiva to dance, that Supreme Lord Himself now dances.\"],\"isLong\":false},{\"number\":\"10-11\",\"text\":[\"yā̐ra nāme vālmīki ha-ila tapodhana\",\"yā̐ra nāme ajāmila pāila mochana\",\"\",\"yā̐ra nāme śravane saṁsāra-bandha ghuche\",\"hena prabhu avatari kali-yuge nāche\"],\"translation\":[\"By whose Name Vālmīki became a powerful sage, by whose Name Ajāmil attained liberation, by hearing whose Name the bondage of material existence is destroyed, that very Lord descends in the Age of Kali and dances.\"],\"isLong\":false},{\"number\":\"12-13\",\"text\":[\"yā̐ra nāma la-i śuka nārada beḍāya\",\"sahasra-vadana-prabhu yāra guṇa gāya\",\"\",\"sarva-mahā-prāyaśchita ye prabhura nāma\",\"se prabhu nāchaye dekhe yata bhāgyavān\"],\"translation\":[\"You whose Name Śukadev and Nārad take as they wander about, whose glories the thousand-mouthed Anantadev sings, whose Name is the supreme form of atonement, that Supreme Lord now dances and glances upon the fortunate souls.\"],\"isLong\":false},{\"number\":\"14\",\"text\":[\"śrī kṛṣṇa-chaitanya nityānanda-chā̐da jāna\",\"vṛndāvana dāsa tachhu pada-yuge gāna\"],\"translation\":[\"Embracing Śrī Kṛṣṇa Chaitanya and Nityānanda Prabhu as his life and soul, Vṛndāvan Dās sings the glories of Their lotus feet.\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"2f:[\"$\",\"$L37\",null,{\"navMap\":{\"243\":{\"prev\":{\"path\":\"/en/nagare-nagare-gora-gay/\",\"title\":\"Śrī Kṛṣṇera Viṁśottara-śata-nāma\"},\"next\":{\"path\":\"/en/shiuddha-bhakata-charana-renu/\",\"title\":\"Śuddha-bhakata\"}}}}]\n30:[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"CollectionPage\\\",\\\"@id\\\":\\\"https://dev.kirtan.site/en/shri-hari-vasare-hari-kirtana-vidhana\\\",\\\"url\\\":\\\"https://dev.kirtan.site/en/shri-hari-vasare-hari-kirtana-vidhana\\\",\\\"name\\\":\\\"Śrī Hari-vāsara Gīti. by Śrīla Vṛndāvan Dās Ṭhākur\\\",\\\"inLanguage\\\":\\\"en\\\",\\\"isPartOf\\\":{\\\"@id\\\":\\\"https://dev.kirtan.site/#website\\\"}},{\\\"@type\\\":\\\"MusicComposition\\\",\\\"@id\\\":\\\"https://dev.kirtan.site/en/shri-hari-vasare-hari-kirtana-vidhana#composition\\\",\\\"alternateName\\\":[\\\"śrī-hari-vāsare hari-kīrtana-vidhāna\\\"],\\\"name\\\":\\\"Śrī Hari-vāsara Gīti. by Śrīla Vṛndāvan Dās Ṭhākur\\\",\\\"url\\\":\\\"https://dev.kirtan.site/en/shri-hari-vasare-hari-kirtana-vidhana\\\",\\\"composer\\\":{\\\"@type\\\":\\\"Person\\\",\\\"name\\\":\\\"Śrīla Vṛndāvan Dās Ṭhākur\\\"},\\\"isPartOf\\\":{\\\"@id\\\":\\\"https://dev.kirtan.site/#website\\\"},\\\"about\\\":[{\\\"@type\\\":\\\"Thing\\\",\\\"name\\\":\\\"Bhakti Yoga\\\"},{\\\"@type\\\":\\\"Thing\\\",\\\"name\\\":\\\"Gaudiya Vaishnavism\\\"}],\\\"genre\\\":[\\\"Devotional\\\",\\\"Bhajan\\\",\\\"Kirtan\\\"],\\\"mainEntityOfPage\\\":{\\\"@id\\\":\\\"https://dev.kirtan.site/en/shri-hari-vasare-hari-kirtana-vidhana\\\"}}]}\"}}]\n31:[\"$\",\"$L38\",null,{\"bookId\":\"en\",\
