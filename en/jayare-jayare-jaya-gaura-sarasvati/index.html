and Śrī Śyāma (Kṛṣṇa) who are combined in the one body of Śrī Gaurāṅga, who is on the right side. Glories to Śrīmatī Rādhārāṇī, who is on the left side; and glories to Him, who is in the middle and who is none other than the Supreme Cowherd Boy, Śrī Śyāmasundar Himself.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"vraja-rasa nava-bhāve navadvīpe rāje\",\"udāre madhura-rāga abhinava sāje\"],\"translation\":[\"The mellow of Vraja (Vṛndāvan) is present in Nabadwīp in a new mood; when this sweet loving sentiment is mixed with magnanimity, then it shows itself as uniquely beautiful.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"mādhurya-kaivalya-rāga vrajera niryāsa\",\"prāpti parākāṣṭhā tāhe gaurāṅga-vilāsa\"],\"translation\":[\"Mādhurya-rasa (conjugal love) is the essence of Vraja Dhām, and the Pastimes of Mahāprabhu take it to its highest perfection.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"rādhā-bhāva-kānti aṅgikari’ bhāla-mate\",\"dakṣiṇe āsana rasa-garimā dekhāte\"],\"translation\":[\"Earnestly accepting Śrī Rādhā’s mood and beauty, He has taken His place on the right to show His glorious position.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"rādhā-rasa-traya-svāda rahasya prayāsa\",\"nirakhi’ praphulla rādhā mukhe manda-hāsa\"],\"translation\":[\"Seeing Kṛṣṇa’s mischievous desire to understand the glories of Her love, Kṛṣṇa’s wonderful sweetness that only She can relish through Her transcendental qualities, and the happiness She feels from Kṛṣṇa’s sweet love for Her, Rādhārāṇī is very pleased and there is a subdued smile on Her face.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"madhye rahi’ vaṁśī-rave ghoṣe vaṁśī-dhara\",\"rādhāra sampade āmi gaurāṅga-sundara!\"],\"translation\":[\"In the middle, Vaṁśīdhara (the Flute Player) is playing His flute, thinking that, “Only by the wealth of Rādhārāṇī do I become Gaurāṅga Sundar.”\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"mad-abhīṣṭha rūpa rādhāra hṛdaya-mandire\",\"gaurāṅga bhajile suṣṭhu sphūrti pāya tāre\"],\"translation\":[\"“My most cherished form is revealed in the temple of Rādhārāṇī’s heart, and that highest manifestation of Myself can be attained only by worshiping Gaurāṅga.”\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"nadīyā-prakāśe mahāprabhu gaura-nidhi\",\"patita-pāvana deve milāila vidhi\"],\"translation\":[\"By the Lord’s divine arrangement, the Supreme Savior of the fallen souls appeared in Nadīyā as the most beloved Śrī Gaurāṅga Mahāprabhu.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"e-rūpa ārati brahmā-śambhu-agochara\",\"gaura-bhakta-kṛpā-pātra mātra siddhi-sāra\"],\"translation\":[\"This type of divine worship of Mahāprabhu is beyond the vision of even Lord Brahmā or Lord Śiva. Only by receiving the mercy of a devotee of Lord Gaurāṅga can one attain such perfection.\"],\"isLong\":false},{\"number\":\"12\",\"text\":[\"śrī svarūpa, rāmānanda, rūpa, sanātana\",\"śrī raghu, jīvādi-kṛpāya dekhe bhakta-jana\"],\"translation\":[\"Only by the mercy of Śrī Svarūp Dāmodar, Śrī Rāmananda Rāya, Śrī Rūpa, Śrī Sanātan, Śrī Raghunāth, Śrī Jīva, and their associates do the devotees attain that vision.\"],\"isLong\":false},{\"number\":\"13\",\"text\":[\"jaya guru-gaura-rādhā-govinda-sundara\",\"jaya dāo bhakta-vṛnda nitya nirantara\"],\"translation\":[\"All glories to Śrī Guru, Gaurāṅga, Rādhā-Govindasundar. O devotees, always sing Their eternal glories.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-kiba-jaya-jaya\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"20:[\"$\",\"$L29\",null,{\"audio\":\"$1f:props:song:resources:audio\",\"caption\":\"Listen audio:\",\"language\":\"en\"}]\n21:[\"$\",\"$L2a\",null,{\"navMap\":{\"75\":{\"prev\":
