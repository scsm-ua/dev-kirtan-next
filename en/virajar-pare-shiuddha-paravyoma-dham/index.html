":[\"Song 2\"],\"verses\":[{\"number\":\"1\",\"text\":[\"virajār pāre śuddha-paravyoma-dhām\",\"tad upari śrī-gokula-vṛndāraṇya nām\"],\"translation\":[\"Beyond the Virajā River lies the pure spiritual sky, and above that Vaikuṇṭha realm lies the divine abode known as Śrī Goloka Vṛndāvan.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"vṛndāvana chintāmaṇi,    chid-ānanda-ratna-khani,\",\"    chinmoy apūrva-daraśan\",\"ta̐hi mājhe chamatkār,    kṛṣṇa vanaspati sār,\",\"    nīla-maṇi tamāla jemon\"],\"translation\":[\"The land of Vṛndāvan is made of spiritual gems and is therefore likened to a mine of fully cognizant and blissful jewels. This transcendentally conscious realm is certainly a wonderful and extraordinary sight. Within that abode is the most astonishing presence of Lord Krishna, who is compared to a *tamāl* tree, the king of trees possessing the hue of a dark sapphire.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"tāhe eka svarna-mayī,    latā sarva-dhāma-jayī,\",\"    uthiyāche parama-pāvanī\",\"hlādinī-śaktir sār,    ‘mahābhāva’ nām jār,\",\"    tribhuvana-mohana-mohinī\"],\"translation\":[\"Entwined upon that blackish tree a beautiful golden creeper has arisen, who is the conqueror of all realms, being the supreme purifier. Her name is Mahābhāva, being the essence of the supreme pleasure-giving hlādinī potency. She is the enchantress of Śrī Krishna, who is Himself the enchanter of the three worlds.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"rādhā-nāme parichita,    tuṣiyā govinda-chita,\",\"    virājaye parama ānande\",\"sei latā-patra-phul,    lalitādi sakhī-kul,\",\"    sobe mili’ vṛkṣe dṛḍha bāndhe\"],\"translation\":[\"Known by the name of Rādhā, She remains shining there in great ecstasy, always engaged in satisfying Govinda’s heart. The leaves and flowers of that creeper form the assembly of Her girlfriends headed by Lalitā. Together She and all Her friends entwine that blackish tree in a tight embrace.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"latāra paraśe praphulla tamāl\",\"latā chāḍi’ nāhi rohe kono kāl\"],\"translation\":[\"At the touch of this creeper, the Tamāl tree blooms; without the embrace of the creeper, He can no longer exist.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"tamāla chaḍiyā latā nāhi bā̐che\",\"se latā milan sadā-kāla jāche\"],\"translation\":[\"The creeper never desires to leave the company of the tamāl tree; the creeper perpetually craves Their union.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"bhakativinoda milana do̐hār\",\"nā chāhe kokhona vinā kichu ār\"],\"translation\":[\"Other than the meeting of these two, Bhakti Vinod desires but nothing else.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.R. Sridhar Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.Р. Шридхар Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.Р. Шрідгар Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/sridhar-maharaj-and-govinda-1\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"19:[\"$\",\"$L21\",null,{\"audio\":\"$18:props:song:resources:audio\",\"caption\":\"Listen audio:\",\"language\":\"en\"}]\n1a:[\"$\",\"$L22\",null,{\"navMap\":{\"237\":{\"prev\":{\"path\":\"/en/radhika-charana-padma-sakala-shreyera/\",\"title\":\"Śrī Rādhāṣṭaka 1\"},\"next\":{\"path\":\"/en/radha-bhajane-jodi-moti-nahi-bhela/\",\"title\":\"Śrī Rādhāṣṭaka 3\"}}}}]\n23:Tcfd,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"description\":\"A digital Vaishnava songbook with lyrics, translations, and audio recordings.\",\"p
