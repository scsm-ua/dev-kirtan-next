ī Rādhārāṇī is certainly the most treasured object of Kṛṣṇa’s love. And, in every respect, Her divine kuṇḍa is described by great sages as similarly dear to Him. Undoubtedly Rādhā Kuṇḍa is very rarely attained even by the great devotees; therefore it is even more difficult for ordinary devotees to attain. If one simply bathes once within those holy waters, one’s pure love of Kṛṣṇa is fully aroused.\",\"---\",\"*Śrīla Bhakti Vinod Ṭhākur’s corresponding Bengali composition:*\"],\"isLong\":true},{\"number\":\"1\",\"text\":[\"sakala preyasī-śreṣṭhā vṛṣabhānu-sutā\",\"tā̐hāra sarasī nitya śrī-kṛṣṇa-dayitā\"],\"translation\":[\"The daughter of Vṛṣabhānu is the best of all Kṛṣṇa’s lovers, and Her lake is always dear to Śrī Kṛṣṇa.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"muṇi-gaṇa śāstre ei-rūpa nirdhārila\",\"vraja-madhye śreṣṭha bali’ kuṇḍe sthira kaila\"],\"translation\":[\"In the scriptures, the sages have ascertained this and determined that this lake is supreme within all of Vraja.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"sādhana bhaktira kathā ki baliba āra\",\"kṛṣṇa-preṣṭha-gaṇera durlabha prema-sāra\"],\"translation\":[\"What more can I say of sādhana-bhakti? The highest form of prema is difficult to attain even for those who are dear to Kṛṣṇa.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"niṣkapaṭe sei kuṇḍe ye kare majjana\",\"kuṇḍa tā̐re sei prema kare vitaraṇa\"],\"translation\":[\"Yet Rādhā Kuṇḍa gives such prema to those who bathe within it sincerely.\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}],false]]}]}],\"$L20\",\"$L21\"]}]]}],\"$L22\"]}],\"$L23\",\"$L24\",\"$L25\"]}]]}]\n"])</script><script>self.__next_f.push([1,"26:I[4423,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-e1523b9d825cefcd.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/pa
