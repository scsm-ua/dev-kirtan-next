verses / translation\",\"song\":{\"meta\":{\"page\":\"263/2\",\"author\":\"Śrīla Jayadev Goswāmī\",\"first_line\":\"śrita-kamalā-kucha-maṇḍala dhṛta-kuṇḍala\"},\"title\":[\"Śrita-kamalā\"],\"author\":[\"Sanskrit composition by Śrīla Jayadev Goswāmī\"],\"verses\":[{\"number\":\"1\",\"text\":[\"śrita-kamalā-kucha-maṇḍala dhṛta-kuṇḍala he\",\"kalita-lalita-vana-māla jaya jaya deva hare\"],\"translation\":[\"Glories, glories to Lord Hari, the Supreme Personality of Godhead, who is bedecked with jeweled earrings and a garland of forest flowers, and whose feet are marked with a lotus!\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"dinamaṇi-maṇḍala-maṇḍana bhava-khaṇḍana he\",\"muni-jana-mānasa-haṁsa jaya jaya deva hare\"],\"translation\":[\"The Lord’s face shines like the whorl of the sun. He removes the miseries of His devotees and is the resting place of the minds of the swan-like sages. Glories! Glories to Lord Śrī Hari!\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"kāliya-viṣadhara-gañjana jana-rañjana he\",\"yadu-kula-nalina-dineśa jaya jaya deva hare\"],\"translation\":[\"O Supreme Personality of Godhead who defeated the demoniac Kāliya serpent! O Lord, You are the beloved of all living entities and the sun in the galaxy of the Yadu dynasty. Glories! Glories to Lord Śrī Hari.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"madhu-mura-naraka-vināśana garuḍāsana he\",\"sura-kula-keli-nidāna jaya jaya deva hare\"],\"translation\":[\"O Lord, destroyer of the demons Madhu, Mura, and Naraka! Seated on Garuḍa, You are the source of joy for the demigods. All glories to Hari!\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"amala-kamala-dala-lochana bhava-mochana he\",\"tribhuvana-bhavana-nidhāna jaya jaya deva hare\"],\"translation\":[\"O Lord Your eyes are like lotus petals, and You destroy the bondage of the material world. You are the maintainer of the three worlds. Glories to Lord Hari!\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"janaka-sutā-kṛta-bhūṣaṇa jita-dūṣaṇa he\",\"samara-śam-ita-daśa-kaṇṭha jaya jaya deva hare\"],\"translation\":[\"O Lord, You are adorned by Sītā, the daughter of Janaka, You were victorious over the demon Dūṣaṇa and all the asuras, and You smashed the greatest asura, the ten-headed Rāvaṇa. Glories, glories, to Lord Hari!\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"abhinava-jaladhara-sundara dhṛta-mandara he\",\"śrī-mukha-chandra-chakora jaya jaya deva hare\"],\"translation\":[\"O Supreme Personality of Godhead who held Govardhan Hill! Your complexion is like a fresh monsoon cloud, and Śrī Rādhārāṇī is like a chakora bird who is nourished by drinking the light of Your moonlike face. Glories! Glories to Lord Hari.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"tava charaṇe praṇatā vayam iti bhāvaya he\",\"kuru kuśalaṁ praṇateṣu jaya jaya deva hare\"],\"translation\":[\"O Lord, I offer my humble obeisances at Your lotus feet. Please bless me by Your limitless mercy. Glories! Glories to Lord Śrī Hari!\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"śrī-jayadeva-kaver idaṁ kurute mudaṁ he\",\"maṅgalam ujjvala-gīti jaya jaya deva hare\"],\"translation\":[\"The poet Śrī Jayadeva offers this song of devotion and shining good fortune to Thee. All glories! All glories to Lord Śrī Hari!\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"33:[\"$\",\"$L3a\",null,{\"navMap\":{\"263/2\":{\"prev\":{\"path\":\"/en/jaya-yashoda-nandana-krishna-gopala-govinda/\",\"title\":\"Jaya Yaśodā Nandana Kṛṣṇa\"},\"next\":{\"path\":\"/en/nava-nirada-nindita/\",\"title\":\"Bhaja Kṛṣṇa-nidhiṁ\"}}}}]\n34:[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"CollectionPage\\\",\\\"@id\\\":\\\"https://dev.kirtan.site/en/shrita-kamala-kuchha-mandala
