"text\":[\"pīta-varaṇa kali-pāvana gorā\",\"gāoya-i aichhana bhāva-vibhorā\"],\"translation\":[\"Lord Gaurāṅga, whose complexion is golden and who is the deliverer of the fallen souls of Kali-yuga, sings as follows, overwhelmed with spiritual ecstasy.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"chitta-darpaṇa-parimārjanakārī\",\"kṛṣṇa-kīrtana jaya chitta-vihārī\"],\"translation\":[\"“All glories to the chanting of the Holy Name of Kṛṣṇa! It thoroughly cleanses the mirror of the heart (or mind) and is the delight of the soul.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"helā-bhava-dāva-nirvāpaṇa-vṛtti\",\"kṛṣṇa-kīrtana jaya kleśa-nivṛtti\"],\"translation\":[\"“All glories to the chanting of the Holy Name of Kṛṣṇa! It extinguishes the forest fire of material existence and removes all material tribulations.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"śreyaḥ-kumuda-vidhu-jyotsnā-prakāśa\",\"kṛṣṇa-kīrtana jaya bhakti-vilāsa\"],\"translation\":[\"“All glories to the chanting of the Holy Name of Kṛṣṇa! It appears like the moon in the heart and distributes its cooling moonlight, making the white lotus of the soul’s good fortune blossom and bloom. Kṛṣṇa-kīrtan is the bhakti-vilāsa, the beautiful Pastime of devotion.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"viśuddha-vidyā-vadhū-jīvana-rūpa\",\"kṛṣṇa-kīrtana jaya siddha-svarūpa\"],\"translation\":[\"“All glories to the chanting of the Holy Name of Kṛṣṇa! It reveals one’s pure identity in relationship with the Lord even up to divine consorthood. This chanting is the real perfection of life.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"ānanda-payonidhi-vardhana-kīrti\",\"kṛṣṇa-kīrtana jaya plāvana-mūrti\"],\"translation\":[\"“All glories to the chanting of the Holy Name of Kṛṣṇa! Kṛṣṇa-kīrtan causes the ocean of ecstatic joy to overflow. It is an inundation of divine love.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"pade pade pīyūṣa-svāda-pradātā\",\"kṛṣṇa-kīrtana jaya prema-vidhātā\"],\"translation\":[\"“All glories to the chanting of the Holy Name of Kṛṣṇa! Kṛṣṇa-kīrtan gives one a taste of fully satisfying nectar at every step; ultimately it bestows ecstatic love of Godhead.”\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"bhakati-vinoda svātma-snapana-vidhāna\",\"kṛṣṇa-kīrtana jaya prema-nidāna\"],\"translation\":[\"All glories to the chanting of the Holy Name of Kṛṣṇa! It bathes the soul of Bhakti Vinod. This chanting is a storehouse of love of Godhead.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":\"Manasa Krishna Prabhu\",\"embed_url\":\"https://soundcloud.com/huron/pita-barana-kali-pavana-gora\",\"personSlug\":\"manasa-krishna-prabhu\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1d:[\"$\",\"$L27\",null,{\"audio\":\"$1c:props:song:resources:audio\",\"bookId\":\"en\",\"caption\":\"Listen to recordings:\",\"songTitle\":\"Śrī Śikṣāṣṭakam\"}]\n1e:[\"$\",\"$L28\",null,{\"navMap\":{\"192\":{\"prev\":{\"path\":\"/en/bondhu-gon-shiunoho-vachana-mora/\",\"title\":\"Verse 8. Āśliṣya vā pāda-ratāṁ pinaṣṭu mām\"},\"next\":{\"path\":\"/en/tuhu-daya-sagara-tarayite-prani/\",\"title\":\"Kīrtan 2. Tuhu̐ dayā-sāgara\"}}}}]\n29:Tedd,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"alternateName\":[\"Kirtan Guide\",\"Vaishnava Songbook\"],\"description\":\"A digital Vaishnava songbook and kirtan guide with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPage\",\"@id\":\"https://dev.kirtan.site/en/pita-varana-kali-pavana-gora/\"
