position:*\"],\"isLong\":false},{\"number\":\"1\",\"text\":[\"prabhu tava pada-yuge mora nivedana\",\"nāhi māgi deha-sukha vidyā dhana jana\"],\"translation\":[\"O Lord! This is my humble submission at Your lotus feet: I do not ask from You sensual pleasure, learning, wealth, or followers.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"nāhi māgi svarga āra mokṣa nāhi māgi\",\"nā kari prārthanā kona vibhūtira lāgi’\"],\"translation\":[\"I do not beg for residence on the celestial planets, nor do I wish liberation from this mundane existence. Nor do I pray for the attainment of any mystic powers.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"nija karma-guṇa-doṣe ye ye janma pāi\",\"janme janme yena tava nāma guṇa gāi\"],\"translation\":[\"Whatever birth I may obtain due to the results of my previous worldly activities, I pray that I may sing the glories of Your Holy Name birth after birth.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"ei mātra āśā mama tomāra charaṇe\",\"ahaitukī-bhakti hṛde jāge anukṣaṇe\"],\"translation\":[\"This alone is my cherished hope, my aspiration, my prayer at Your lotus feet: Let causeless and uninterrupted devotion awaken within my heart and flow towards You.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"viṣaye ye prīti ebe āchhaye āmāra\",\"sei mata prīti ha-uk charaṇe tomāra\"],\"translation\":[\"Let me love Your lotus feet as much as I now love sense gratification; transfer my affection from the objects of the senses to Your lotus feet.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"vipade sampade tāhā thākuk samabhāve\",\"dine dine vṛddhi ha-uk nāmera prabhāve\"],\"translation\":[\"In danger or success, good fortune or disaster, let me remain equipoised, and let my affection for You increase day by day by the influence of the Holy Name.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"paśu pakṣī haye thāki’ svarge vā niraye\",\"tava bhakti rahu bhakti-vinoda-hṛdaye\"],\"translation\":[\"Whether I live as bird or beast, in heaven or in hell, let the humble Bhakti Vinod always cherish devotion to You in his heart of hearts.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":\"Manasa Krishna Prabhu\",\"embed_url\":\"https://soundcloud.com/huron/prabhu-pada-tava-juge\",\"personSlug\":\"manasa-krishna-prabhu\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false},\"telegraphUrl\":\"https://telegra.ph/Śrī-Śikṣāṣṭakam-02-22-8\"},\"head\":{\"canonical\":\"/en/prabhu-tava-pada-juge-mora-nivedana/\",\"description\":\"Śrī Śikṣāṣṭakam — a Vaiṣṇava song by Śrīla Bhakti Vinod Ṭhākur with lyrics, English translation and word-by-word meaning. From Kirtan Guide.\",\"title\":\"Śrī Śikṣāṣṭakam. Verse Four | Kirtan Site\"},\"kind\":\"song\",\"route\":{\"kind\":\"item\",\"bookId\":\"en\",\"slug\":\"prabhu-tava-pada-juge-mora-nivedana\"}}}]}]]}]\n"])</script></body></html>
