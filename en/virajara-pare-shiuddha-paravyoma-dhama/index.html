ohinī\"],\"translation\":[\"Entwined upon that blackish tree a beautiful golden creeper has arisen, who is the conqueror of all realms, being the supreme purifier. Her Name is Mahābhāva, being the essence of the supreme pleasure-giving hlādinī potency. She is the enchantress of Śrī Kṛṣṇa, who is Himself the enchanter of the three worlds.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"rādhā-nāme parichita    tuṣiyā govinda-chitta\",\"    virājaye parama ānande\",\"sei latā-patra-phula    lalitādi sakhī-kula\",\"    sabe mili’ vṛkṣe dṛḍha bāndhe\"],\"translation\":[\"Known by the Name of Rādhā, She remains shining there in great ecstasy, always engaged in satisfying Govinda’s heart. The leaves and flowers of that creeper form the assembly of Her girlfriends headed by Lalitā. Together She and all Her friends entwine that blackish tree in a tight embrace.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"latāra paraśe praphulla tamāla\",\"latā chhāḍi’ nāhi rahe kona kāla\"],\"translation\":[\"At the touch of this creeper, the Tamāl Tree blooms; without the embrace of the creeper, He can no longer exist.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"tamāla chhaḍiyā latā nāhi bā̐che\",\"se latā-milana sadā kāla yāche\"],\"translation\":[\"The creeper never desires to leave the company of the Tamāl Tree; the creeper perpetually craves Their union.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"bhakati-vinoda milana do̐hāra\",\"nā chāhe kakhana vinā kichhu āra\"],\"translation\":[\"Other than the meeting of these two, Bhakti Vinod desires nothing else.\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}],false]]}]}],\"$L37\",\"$L38\"]}]]}],\"$L39\"]}],\"$L3a\",\"$L3b\",\"$L3c\"]}]]}]\n"])</script><script>self.__next_f.push([1,"3d:I[4423,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-a
