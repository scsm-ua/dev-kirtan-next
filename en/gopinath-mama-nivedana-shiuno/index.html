Part One\"],\"verses\":[{\"number\":\"1\",\"text\":[\"    gopīnāth, mama nivedana śuna\",\"viṣayī durjana    sadā kāma-rata\",\"    kichhu nāhi mora guṇa\"],\"translation\":[\"O Gopīnāth, Lord of the gopīs, please hear my submission. I am a wicked materialist, always addicted to worldly desires, and no good qualities do I possess.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"    gopīnāth, āmāra bharasā tumi\",\"tomāra charaṇe    la-inu śaraṇa\",\"    tomāra kiṅkara āmi\"],\"translation\":[\"O Gopīnāth, You are my only hope, and therefore I have taken shelter at Your lotus feet. I am now Your eternal servant.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"    gopīnāth, kemane śodhibe more\",\"nā jāni bhakati    karme jaḍa-mati\",\"    paḍechhi saṁsāra ghore\"],\"translation\":[\"O Gopīnāth, how will You purify me? I do not know what devotion is, and my materialistic mind is absorbed in fruitive work. I have fallen into this dark and perilous worldly existence.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"    gopīnāth, sakali tomāra māyā\",\"nāhi mama bala    jñāna sunirmala\",\"    svādhīna nahe e kāyā\"],\"translation\":[\"O Gopīnāth, everything here is Your illusory energy. I have no strength or transcendental knowledge, and this body of mine is not independent and free from the control of material nature.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"    gopīnāth, niyata charaṇe sthāna\",\"māge e pāmara    kā̐diyā kā̐diyā\",\"    karahe karuṇā dāna\"],\"translation\":[\"O Gopīnāth, this sinner, who is weeping and weeping, begs for an eternal place at Your divine feet. Please give him Your mercy.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"    gopīnāth, tumi ta sakali pāra\",\"durjane tārite    tomāra śakati\",\"    ke āchhe pāpīra āra\"],\"translation\":[\"O Gopīnāth, You are able to do anything, and therefore You have the power to deliver all sinners. Who is there that is more of a sinner than myself?\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"    gopīnāth, tumi kṛpā-pārāvāra\",\"jīvera kāraṇe    āsiyā prapañche\",\"    līlā kaile suvistāra\"],\"translation\":[\"O Gopīnāth, You are the ocean of mercy. Having come into this phenomenal world, You expand Your divine Pastimes for the sake of the fallen souls.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"    gopīnāth, āmi ki doṣera doṣī\",\"asura sakala    pāila charaṇa\",\"    vinoda thākila vasi’\"],\"translation\":[\"O Gopīnāth, I am so sinful that although all the demons attained Your lotus feet, Bhakti Vinod has remained in worldly existence.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/krsnachaitanya-das/37-gopinath-mama-nivedana-suna-4\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"30:[\"$\",\"$L39\",null,{\"audio\":\"$2f:props:song:resources:audio\",\"caption\":\"Listen audio:\",\"language\":\"en\"}]\n31:[\"$\",\"$L3a\",null,{\"navMap\":{\"255\":{\"prev\":{\"path\":\"/en/chaudda-shiata-sata-shiake-masa-je-phalgun/\",\"title\":\"Śrī Nimāi Sundar’s Advent\"},\"next\":{\"path\":\"/en/gopinath-ghuchao-samsara-jvala/\",\"title\":\"Nivedana – Part Two\"}}}}]\n3b:T608,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"CollectionPage\",\"@id\":\"https://dev.kirtan.site/en/gopinath-mama-nivedana-shiuno\",\"url\":\"https://dev.kirtan.site/en/gopinath-mama-nivedana-shiuno\",\"name\":\"Nivedana. by Śrīla Bhakti Vinod Ṭhākur. Part One\",\"inLanguage\":\"en\",\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"}},{\"@type\":\"MusicComposition\",\"@id\":\"https://dev.kirtan.site/en/gopinath-mama-nivedana-shiuno#composition\",\"alternateName\":[\"gopīnāth, mama
