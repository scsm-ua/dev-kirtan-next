arrogance, intoxicated by vanity, and always bewildered by enjoying sense objects. Violence and pride are my ornaments.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"nidrālasya hata    sukārye virata\",\"    akārye udyogī āmi\",\"pratiṣṭhā lāgiyā    śāṭhya-ācharaṇa\",\"    lobha-hata sadā kāmī\"],\"translation\":[\"Ruined by laziness and sleep, I resist all pious deeds, yet am very enthusiastic to perform wicked acts. For the sake of worldly fame and reputation I engage in the practice of deceitfulness. I am always lustful and a victim of my own greed.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"e hena durjana    sajjana-varjita\",\"    aparādhi nirantara\",\"śubha-kārya-śūnya    sadānartha-manāḥ\",\"    nānā duḥkhe jara jara\"],\"translation\":[\"A vile, wicked person such as this, rejected by saintly persons, is a constant offender, devoid of auspicious works, always in the mentality of separate interest, and wasted away by various kinds of miseries.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"vārdhakye ekhana    upāya-vihīna\",\"    tā’te dīna akiñchana\",\"bhakati-vinoda    prabhura charaṇe\",\"    kare duḥkha nivedana\"],\"translation\":[\"Now in old age, deprived of all means of relief, thus humbled and destitute, this Bhakti Vinod submits his tale of grief at the feet of the Supreme Lord.\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"3f:[\"$\",\"$L47\",null,{\"navMap\":{\"176\":{\"prev\":{\"path\":\"/en/atma-nivedana-tuya-pade-kori/\",\"title\":\"Ātma-nivedana\"},\"next\":{\"path\":\"/en/tumi-sarveshvareshvara-vrajendra-kumara/\",\"title\":\"Tumi Sarveśvareśvara\"}}}}]\n40:[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"CollectionPage\\\",\\\"@id\\\":\\\"https://dev.kirtan
