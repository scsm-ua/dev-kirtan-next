false},{\"number\":\"2\",\"text\":[\"vrajendranandana kṛṣṇa sarveśvareśvara\",\"maheśvara ādi tāra sevana-tatpara\",\"nāma chintāmaṇi kṛṣṇa-chaitanya-svarūpa\",\"bheda-jñāna nā koribe līlā-guṇa-rūpa\"],\"translation\":[\"Lord Krishna, son of Nanda, of all lords the Leader —\\\\\",\"The great Shiva and all the gods serve His feet forever;\\\\\",\"The touchstone of the Name is Krishna incarnate —\\\\\",\"His Pastimes, nature, form, also think not separate.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"“guru kṛṣṇa-rūpa hon śāstrera pramāṇe\",\"guru-rūpe kṛṣṇa kṛpā kore bhāgyavāne”\",\"se gurute martya-buddhi avajñādi tyaji\",\"iṣṭa-lābha kara, nirantara nāma bhaji\"],\"translation\":[\"“Guru’s a form of Krishna — the Scriptures corroborate;\\\\\",\"In the form of Guru, Krishna blesses the fortunate.”\\\\\",\"Never offend that Guru by thinking him mere mortal;\\\\\",\"Gain your highest objective — serve the Name for time eternal.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"śruti, śruti-mātā-saha sātvata-purāṇa\",\"śrī-nāma-charaṇa-padma kore nīrājana\",\"sei śruti śāstra jebā karaye nindana\",\"se aparadhīra saṅga koribe varjana\"],\"translation\":[\"The Vedas with Mother Gāyatrī and Śrīmad-Bhāgavatam\\\\\",\"Illuminate the lotus feet of Śrī Hari’s Name;\\\\\",\"Whoever vilifies those Holy Vedic Scriptures —\\\\\",\"Never keep their company, know them as offenders.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"nāmera mahimā sarva-śāstrete vākhāne\",\"atistuti, heno kabhu nā bhāviha mane\",\"agastya, ananta, brahmā, śivādi satata\",\"je nāma-mahimā-gāthā saṅkīrtana-rata\",\"se nāma-mahimā-sindhu ke pāibe pāra\",\"atistuti bole jei—sei durāchāra\"],\"translation\":[\"The glories of the Name — all Scriptures’ exaltation;\\\\\",\"Dare not think their praise to be exaggeration.\\\\\",\"Agastya, Ananta, Brahmā, Shiva, etc., ever\\\\\",\"Sing the glories of that Name with full-hearted fervour.\\\\\",\"Who can cross the ocean of the glories of that Name?\\\\\",\"Whoever says ‘exaggeration’ have their sin to blame.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"kṛṣṇa-nāmāboli nitya golokera dhana\",\"kalpita, prākṛta, bhāve—aparādhi-jana\"],\"translation\":[\"The Holy Names of Krishna — eternal wealth of Goloka:\\\\\",\"Who thinks those Names imaginary, mundane — he’s offender.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"nāme sarva-pāpa-kṣaya sarva-śāstre kaya\",\"sārā-dina pāpa kori sei bharasāya—\",\"emata durbuddhi jāra sei aparādhi\",\"māyā-pravañchita, duḥkha bhuñje niravadhi\"],\"translation\":[\"All Scriptures claim the Name all sin it can destroy,\\\\\",\"But those who spend their time in sin making it a ploy —\\\\\",\"Such a wicked attitude is that of an offender\\\\\",\"Deceived by illusion, perpetually to suffer.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"atulya śrī-kṛṣṇa-nāma pūrṇa-rasa-nidhi\",\"tāra sama nā bhāviha śubha-karma ādi\"],\"translation\":[\"Incomparable Name of Krishna — the treasure of ecstasy:\\\\\",\"Never dare compare it with auspicious piety.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"nāme śraddhā-hina-jana—vidhātā vāñchita\",\"tāre nāma dāne aparādha suniśchita\"],\"translation\":[\"Those who’re faithless t’ward the Name — deceived by Providence: \\\\\",\"Giving them the Holy Name surely’s an offence.\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"śuniyāo kṛṣṇa-nāma-māhātmya apāra\",\"je priti-rahita, sei narādhama chāra\",\"allaṅtā mamatā jāra antare bāhire\",\"śuddha kṛṣṇa-nāma tāra kabhu nāhi sphure\"],\"translation\":[\"Despite them hearing the infinite glories of Krishna’s Name,\\\\\",\"Those whose hearts don’t melt in love are rascals of ill fame;\\\\\",\"Only pride and avarice their thoughts and deeds do yield —\\\\\",\"The Pure Name of Krishna to them is ne’er revealed.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"ei daśa aparādha koriyā varjana\",\"jena jana kore harināma saṅkīrtana\",\"apūrva śrī-kṛṣṇa-prema labhya tāre hoy\",\"nāma-prabhu tāra hṛde nitya vilasay\"],\"translation\":[\"Casting off these ten offences, leaving no exception,\\\\\",\"Those pure souls who chant the Name in Holy Congregation —\\\\\",\"The miracle of love for Krishna they will surely savour,\\\\\",\"The Name Divine Himself will shine within their hearts forever.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.R. Madhusudan Maharaj\",\"ru\":\"Шрила Б.Р. Мадхусудан Махарадж\",\"ua\":\"Шріла Б.Р. Мадгусудан Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/madhusudan-maharaj-dasa-vidha-namaparadha\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"20:[\"$\",\"$L29\",null,{\"audio\":\"$1f:props:song:resources:audio\",\"caption\":\"Listen audio:\",\"language\":\"en\"}]\n21:[\"$\",\"$L2a\",null,{\"navMap\":{\"29\":{\"prev\":{\"path\":\"/en/hare-krishna-hare-krishna-krishna-krishna-hare-hare/\",\"title\":\"Hare Krishna mahāmantra\"},\"next\":{\"path\":\"/en/nija-pati-bhuja-danda-chchhatra-bhavam/\",\"title\":\"Śrī Śrī Govardhana-vāsa-prārthanā-daśakam\"}}}}]\n2b:Tfdd,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"description\":\"A digital Vaishnava songbook with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPage\",\"@id\":\"https://dev.kirtan.site/en/hari-nama-mahamantra-sarva-mantra-sara/\",\"url\":\"https://dev.kirtan.site/en/hari-nama-mahamantra-sarva-mantra-sara/\",\"name\":\"Daśa-vidha Nāmāparādha. Bengali poem composed by. The Ten Offences to the Holy Name\",\"inLanguage
