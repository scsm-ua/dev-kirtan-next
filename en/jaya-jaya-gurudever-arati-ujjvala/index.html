ala\",\"author\":\"Śrīpād B. A. Paramahaṁsa Mahārāj\"},\"title\":[\"Śrī Guru Ārati\"],\"author\":[\"by Śrīpād B. A. Paramahaṁsa Mahārāj\",\"\",\"Translated by Devamoyī Devī Dasī\"],\"subtitle\":[\"Glorification of Śrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj\"],\"verses\":[{\"number\":\"1\",\"text\":[\"jaya jaya gurudever ārati ujjvala\",\"govardhana-pāda-pīthe bhuvana-maṅgala\"],\"translation\":[\"All glories to the effulgent arati of Śrī Gurudeva, which is going on at the foot of Govardhan, benefitting the whole world.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"śrī bhakti sundara deva prabhu śiromaṇi\",\"gosvāmī govinda jaya ānandera khani\"],\"translation\":[\"All glories to Śrī Bhakti Sundar Govinda Goswāmī, who is our supreme master and is like a reservoir of joy.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"ājānu lambita bhuja divya kalevara\",\"ananta pratibhā bharā divya guṇadhara\"],\"translation\":[\"His graceful long hands touch his knees and his body is beautiful and transcendental. He is an ocean of infinite genius and transcendental qualities.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"gaura-kṛṣṇe jāni tava abhinna svarūpa\",\"saṁsāra tarite ebe śuddha-bhakta-rūpa\"],\"translation\":[\"We consider your real identity to be non-different from Krishna and Gaurāṅga. But now, to deliver this material world, you have assumed the form of a pure devotee.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"rūpānuga-dhārā tumi kara ālokita\",\"prabhākara sama prabhā bhuvana-vidita\"],\"translation\":[\"You are brightening the line of the followers of Śrīla Rūpa Goswāmī. Your effulgence, which is comparable to that of the sun, is known throughout the whole world.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"śuddha bhakti prachārite tomā sama nāi\",\"akalaṅka indu jena dayāla nitāi\"],\"translation\":[\"There is no one like you to preach pure devotion. You are the spotless moon, and you are merciful like Lord Nityānanda.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"ullasita viśvavāsī labhe prema-dhana\",\"ānande nāchiyā gāhe tava guṇagaṇa\"],\"translation\":[\"As ecstatic people all over the world are attaining the treasure of love of Krishna, they are dancing and singing your glories.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"sthāpilā āśrama bahu jagata mājhāre\",\"pāramahaṁsa-dharma-jñāna śikṣāra prachāre\"],\"translation\":[\"To teach the essence of the highest knowledge and to preach it to all, you have established many ashrams all over the world.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"chintyāchintya veda-jñāne tumi ādhikārī\",\"sakala saṁśaya chettvā susiddhāntadhārī\"],\"translation\":[\"You have mastery over the knowledge of the Vedas, both conceivable and inconceivable. You are the treasurer of bona fide conclusions, which can destroy all doubt.\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"tomāra mahimā gāhe goloka maṇḍale\",\"nitya-siddha parikare tava līlāsthale\"],\"translation\":[\"Your glories are being sung in the spiritual world of Goloka, the realm of your Pastimes, by your servants who are eternally liberated.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"patita pāvana tumi dayāra samīra\",\"sarva-kārye sunipuṇa satya-sugambhīra\"],\"translation\":[\"To deliver the fallen souls, you are like a breeze of mercy. You are expert in all service, and you are established in truth and gravity.\"],\"isLong\":false},{\"number\":\"12\",\"text\":[\"apurva lekhanī dhārā pragāḍha pāṇḍitya\",\"sadā hāsya miṣṭa bhāśī suśila kavitva\"],\"translation\":[\"Your beautiful and unprecedented writing reflects your deep scholarship. You are always smiling and speaking sweet words, which remind one of your soothing poetry.\"],\"isLong\":false},{\"number\":\"13\",\"text\":[\"sādhu-saṅge sadānandī sarala vinayī\",\"sabhā-madhye vaktā śreṣṭha sarvatra vijayī\"],\"translation\":[\"You are always straightforward and humble, and you are always joyful in the association of pure devotees. In a spiritual gathering, you are always the best speaker. In every field of life, you always come out victorious.\"],\"isLong\":false},{\"number\":\"14\",\"text\":[\"gauḍīya gagane tumi āchārya-bhāskara\",\"nirantara sevāpriya miṣṭa kaṇṭhasvara\"],\"translation\":[\"In the sky of the Gauḍīya Vaiṣṇava world, you are a preceptor who is prominent like the sun. You are always fond of service, and your sweet voice inspires others to do service also.\"],\"isLong\":false},{\"number\":\"15\",\"text\":[\"tomāra karuṇā māge trikāla vilāse\",\"gāndharvikā-giridhārī sevā-mātra āśe\"],\"translation\":[\"Past, present, and future—for all eternity, we beg your mercy. Only by your mercy will one receive devotional service to Śrī Śrī Gāndharvikā-Giridhārī.\"],\"isLong\":false},{\"number\":\"16\",\"text\":[\"kṛpā kara ohe prabhu śri-gaura-prakāśa\",\"ārati karaye sadā e adhama dāsa\"],\"translation\":[\"O my lord, who is the manifestation of the mercy of Śrī Gaurāṅga, please be merciful to me. This insignificant servant of yours is always praying this way while worshipping you.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.K. Ashram Maharaj\",\"ru\":\"Шрила Б.К. Ашрам Махарадж\",\"ua\":\"Шріла Б.К. Ашрам Махарадж\"},\"embed_url\":\"https://soundcloud.com/scsmathcolombia/3-sri-guru-arati\"},{\"title\":{\"en\":\"Srila B.N. Acharya Maharaj\",\"ru\":\"Шрила Б.Н. Ачарья Махарадж\",\"ua\":\"Шріла Б.Н. Ачарʼя Махарадж\"},\"embed_url\":\"https://soundcloud.com/kostya-netrebenko/003-jayajayagurudeveraratiujjvala-5\"},{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-jaya-jaya\"},{\"title\":{\"en\":\"Caracas temple\",\"ru\":\"Храм г.Каракас\",\"ua\":\"Храм м.Каракас\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/shchsm-karakas-dzhaya-dzhaya\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"ha
