of pure devotees is conducive to devotional service, while service to the Vaiṣṇavas is itself the supreme perfection and the root of the tender creeper of divine love.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"mādhava-tithi    bhakti-jananī\",\"    yatane pālana kari\",\"kṛṣṇa-vasati    vasati bali’\",\"    parama ādare vari\"],\"translation\":[\"I observe with great care the holy days like Ekādaśī and Janmāṣṭamī, for they are the mother of devotion. As my dwelling place I choose with the greatest reverence and love the transcendental abode of Śrī Kṛṣṇa.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"gaura āmāra    ye-saba sthāne\",\"    karala bhramaṇa raṅge\",\"se-saba sthāna    heriba āmi\",\"    praṇayi-bhakata-saṅge\"],\"translation\":[\"All those places where my Lord Gaurasundar travelled for Pastimes I will visit in the company of loving devotees.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"mṛdaṅga-vādya    śunite mana\",\"    avasara sadā yāche\",\"gaura-vihita    kīrtana śuni’\",\"    ānande hṛdaya nāche\"],\"translation\":[\"My mind always begs for the opportunity to hear the music of the mṛdaṅga. Upon hearing the kind of kīrtan ordained by Lord Gaurachandra, my heart dances in ecstasy.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"yugala-mūrti    dekhiyā mora\",\"    parama-ānanda haya\",\"prasāda-sevā    karite haya\",\"    sakala prapañcha jaya\"],\"translation\":[\"By beholding the Deity forms of the Divine Couple, Śrī Śrī Rādhā-Kṛṣṇa, I feel the greatest joy. By honouring the Lord’s prasādam, I conquer over all worldly illusions.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"ye-dina gṛhe    bhajana dekhi\",\"    gṛhete goloka bhāya\",\"charaṇa-sīdhu    dekhiyā gaṅgā\",\"    sukha nā sīmā pāya\"],\"translation\":[\"Goloka Vṛndāvan appears in my home whenever I see the worship and service of Lord Hari going on there. Upon seeing the Ganges, which is a river of nectar emanating from the lotus feet of the Lord, my happiness knows no bounds.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"tulasī dekhi’    juḍāya prāṇa\",\"    mādhava-toṣaṇī jāni’\",\"gaura-priya    śāka-sevane\",\"    jīvana sārthaka māni\"],\"translation\":[\"The sight of the holy Tulasī tree soothes my soul, for I know she gives pleasure to Lord Kṛṣṇa. By honouring śāk (a green leafy vegetable preparation), a dear favourite of Lord Chaitanya, I consider life worthwhile.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"bhakativinoda    kṛṣṇa-bhajane\",\"    anukūla pāya yāhā\",\"prati-divase    parama-sukhe\",\"    svīkāra karaye tāhā\"],\"translation\":[\"Whatever Bhakti Vinod obtains that is conducive for the service of Śrī Kṛṣṇa, he accepts every day with the greatest of joy.\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"19:[\"$\",\"$L21\",null,{\"navMap\":{\"245\":{\"prev\":{\"path\":\"/en/shri-hari-vasare-hari-kirtana-vidhana/\",\"title\":\"Śrī Hari-vāsara Gīti\"},\"next\":{\"path\":\"/en/chaudda-shiata-sata-shiake-masa-je-phalgun/\",\"title\":\"Śrī Nimāi Sundar’s Advent\"}}}}]\n22:Tc65,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"description\":\"A digital Vaishnava songbook with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPage\",\"@id\":\"https://dev.kirtan.site/en/shiuddha-bhakata-charana-renu/\",\"url\":\"https://dev.kirtan.site/en/shiuddha-bhakata-charana-renu/\",\"name\":\"Śuddha-bhakata. by Śrīla Bhakti Vinod Ṭhākur\",\"inLanguage\":\"en\",\"description\":\"Śuddha
