or\":\"Śrīla Bhakti Vinod Ṭhākur\"},\"title\":[\"Śrī Kṛṣṇera\",\"Viṁsottara-śata-nāma\"],\"author\":[\"by Śrīla Bhakti Vinod Ṭhākur\"],\"verses\":[{\"text\":[\"nagare nagare gorā gāy\"],\"translation\":[\"From village to village Lord Gaura sings these names of Śrī Krishna.\"],\"isLong\":false},{\"number\":\"1\",\"text\":[\"jaśomatī-stanya-pāyī śrī-nanda-nandana\",\"indra-nīla-maṇi vraja-janera jīvana\"],\"translation\":[\"Krishna is the baby who feeds on the breast of Mother Yaśodā. He is the son of Mahārāj Nanda, dark blue like an indra-nīla gem, and the life of the residents of Vraja.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"śrī gokula niśācharī-pūtanā ghātana\",\"duṣṭa-tṛṇāvarta-hantā śakaṭa-bhañjana\"],\"translation\":[\"Krishna destroyed the witch of Gokul, Pūtanā; He broke the cart in which the demon Śakaṭāsura was hiding; and He destroyed the wicked demon, Tṛṇāvarta.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"navanīta-chora dadhi-haraṇa-kuśala\",\"jamala-arjuna-bhañjī govinda gopāla\"],\"translation\":[\"He is an expert thief of butter and yoghurt, He broke the two Jamala Arjuna trees, and He is a cowherd boy who is always giving pleasure to the cows, land and senses.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"dāmodara vṛndāvana-go-vatsa-rākhāla\",\"vatsāsurāntaka hari nija-jana-pāla\"],\"translation\":[\"He is so naughty that His mother bound Him around the waist with ropes. Thus He is known as Dāmodar. He is the keeper of Vṛndāvan’s cows and calves, the destroyer of the demon Vatsāsura, He is the remover of all evils and is the protector of His devotees.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"baka-śatru agha-hantā brahma-vimohana\",\"dhenuka-nāśana kṛṣṇa kālīya-damana\"],\"translation\":[\"Krishna is the enemy of the demon Bakāsura, the slayer of Aghāsura, the bewilderer of Lord Brahmā, the destroyer of Dhenukāsura and the subduer of the Kālīya serpent. He is all-attractive and is the colour of a fresh rain cloud.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"pītāmbara śikhi-picha-dhārī veṇu-dhara\",\"bhāṇḍīra-kānana-līla dāvānala-hara\"],\"translation\":[\"Lord Krishna dresses in yellow silk cloth and wears peacock feathers on His head. He holds a flute, performs Pastimes in the Bhāṇḍīra forest, and He once swallowed a forest fire to save the inhabitants of Vraja.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"naṭavara-guhāchara śarata-bihārī\",\"ballabhī-ballabha deva gopī-vastra-hārī\"],\"translation\":[\"Krishna, best of dancers, sometimes wanders in the caves of Govardhān Hill. He enjoys various amorous Pastimes in the autumn season, He is the lover of the young cowherd maidens, the stealer of their garments, and the Supreme Lord of all.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"yajña-patnī-goṇ-prati karuṇāra sindhu\",\"govardhana-dhṛk mādhava vraja-vāsi-bandhu\"],\"translation\":[\"Krishna is the ocean of mercy of the wives of the sacrificial *brāhmaṇs*, He is the holder of Govardhān Hill, the husband of the goddess of fortune, Lakṣmī, and the dearmost friend of the inhabitants of Vraja.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"indra-darpa-hārī nanda-rakṣitā mukunda\",\"śrī-gopī-ballabha rāsa-krīḍa pūrṇānanda\"],\"translation\":[\"He broke Indra’s pride and protected His father, Nanda Mahārāj. He is the giver of liberation, the lover of the cowherd maidens of Vraja, the enjoyer of the Rāsa Dance and the reservoir of pleasure.\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"śrī-rādhā-vallabha rādhā-mādhava sundara\",\"lalitā-viśākhā-ādi sakhī-prāṇeśvara\"],\"translation\":[\"He is the lover of Śrīmatī Rādhārāṇī and the very springtime of Her life. He is the Lord of the lives of all the gopīkās of Vṛndāvan, headed by Lalitā and Viśākhā.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"nava-jaladhara-kānti madana-mohana\",\"vana-mālī smera-mukha gopī-prāṇadhana\"],\"translation\":[\"Krishna possesses the loveliness of a fresh rain cloud in the Autumn sky. He is the bewilderer of Cupid, always garlanded with fresh forest flowers. His face is like a full-blown lotus flower of sweet smiles and laughter. He is the wealth of the lives of all the young maidens in Vraja.\"],\"isLong\":false},{\"number\":\"12\",\"text\":[\"tri-bhaṅgī muralī-dhara jāmuna-nāgara\",\"rādhā-kuṇḍa-raṅga-netā rasera sāgara\"],\"translation\":[\"He possesses a beautiful three-fold bending form and holds a flute known as Muralī. He is the lover of the Yamunā River, the director of all the amorous love sports at Rādhā Kuṇḍa, and He is the ocean of devotional mellows.\"],\"isLong\":false},{\"number\":\"13\",\"text\":[\"chandrāvalī-prāṇanātha kautukābhilāṣī\",\"rādhā-māna-sulampaṭa milana-prayāsī\"],\"translation\":[\"Krishna is the Lord of the life of Chandrāvalī, and He is always desirous of joking and sporting. He is very anxious to taste the rasa of his beloved Rādhikā’s feigned sulking and always endeavours for Their meeting.\"],\"isLong\":false},{\"number\":\"14\",\"text\":[\"mānasa-gaṅgāra dānī prasūna-taskara\",\"gopī-saha haṭha-kārī vraja-vaneśvara\"],\"translation\":[\"He is the giver of the Mānasa Gaṅgā Lake to the inhabitants of Vṛndāvan. This thief of flower blossoms acts very outrageously with the maidens of Vṛndāvan. not caring for social restrictions, for He is the Lord of the Vraja Maṇḍal forests.\"],\"isLong\":false},{\"number\":\"15\",\"text\":[\"gokula-sampada gopa-duḥkha-nibāraṇa\",\"durmada-damana bhakta-santāpa-haraṇa\"],\"translation\":[\"He is the wealth of Gokul and protects the cowherd men and boys from all miseries. He curbs all foolish pride and removes all distress from His devotees.\"],\"isLong\":false},{\"number\":\"16\",\"text\":[\"sudarśana-mochana śrī-saṅkhachūḍāntaka\",\"rāmānuja śyāma-chā̐da muralī-bādaka\"],\"translation\":[\"Krishna gives the gopīs side-long glances and is the destroyer of Śaṅkhachūḍa. He is the younger brother of Lord Baladeva, He is the beautiful dark moon of Vṛndāvan and the player of the flute.\"],\"isLong\":false},{\"number\":\"17\",\"text\":[\"gopī-gīta-śrotā madhusūdana murāri\",\"ariṣṭa-ghātaka rādhā-kuṇḍādi-bihārī\"],\"translation\":[\"He hears the songs of the gopīs and is the slayer of the Madhu demon. This enemy of the demon Mura and killer of Ariṣṭāsura enjoys amorous sports and Pastimes at Rādhā Kuṇḍa and other places in Vraja.\"],\"isLong\":false},{\"number\":\"18\",\"text\":[\"vyomāntaka padma-netra keśī-nisūdana\",\"raṅga-krīḍa kaṁsa-hantā mallu-praharaṇa\"],\"translation\":[\"Krishna is the destroyer of the demon Vyomāsura. He is lotus-eyed, the killer of the Keśī demon, frolicsome, the slayer of King Kaṁsa and the conquerer of Kaṁsa’s wrestlers, Chāṇūra and Muṣṭika.\"],\"isLong\":false},{\"number\":\"19\",\"text\":[\"vasudeva-suta vṛṣṇi-baṁśa-kīrti-dhvaja\",\"dīnanātha mathureśa devakī-garbha-ja\"],\"translation\":[\"He is the beloved son of Vasudeva and the emblem of fame for the Vṛṣṇi dynasty. The Lord of the fallen souls, Śrī Krishna, is the Lord of Mathurā and He appears to have taken birth from the womb of Devakī.\"],\"isLong\":false},{\"number\":\"20\",\"text\":[\"kubjā-kṛpāmoya viṣṇu śauri nārāyaṇa\",\"dvārakeśa narakaghna śrī-jadunandana\"],\"translation\":[\"Krishna is full of mercy for the hunchbacked Kubjā. He is the maintainer of the entire creation, the son of Vasudeva, the refuge of all souls, the Lord of Dvārakā, the slayer of Narakāsura and the beloved descendent of the Jadu dynasty.\"],\"isLong\":false},{\"number\":\"21\",\"text\":[\"śrī-rukmiṇī-kānta satyā-pati sura-pāla\",\"pāṇḍava-bāndhava śiśupālādira kāla\"],\"translation\":[\"He is the lover of Rukmiṇī, the husband of Satyā, the protector of the godly, the beloved friend and relative of the five Pāṇḍava brothers and the cause of death for Śiśupāla and other demoniac kings.\"],\"isLong\":false},{\"number\":\"22\",\"text\":[\"jagadīśa janārdana keśavārta-trāṇa\",\"sarva-avatāra-bīja viśvera nidāna\"],\"translation\":[\"Krishna is the Lord of the universe, the maintainer of all living beings and He possesses beautiful hair. He is the deliverer from all misery and the origin of the universe and all incarnations.\"],\"isLong\":false},{\"number\":\"23\",\"text\":[\"māyeśvara yogeśvara brāhma-tejā-dhāra\",\"sarvātmāra ātmā prabhu prakṛtira pāra\"],\"translation\":[\"He is the Lord of Māyā; the master of mysticism; the proprietor of the spiritual powers of the brāhmanas; the Lord, master and soul of all souls, and He is the opposite shore of the ocean of material nature.\"],\"isLong\":false},{\"number\":\"24\",\"text\":[\"patita-pāvana jagannātha sarveśvara\",\"vṛndāvana-chandra sarva-rasera ākara\"],\"translation\":[\"Lord Krishna is the purifier of the fallen souls, the Lord of the universe, the Lord of all beings, the moon of Vṛndāvan and the origin of all rasas.\"],\"isLong\":false},{\"number\":\"25\",\"text\":[\"nagare nagare gorā gāy\",\"bhakativinoda tachu pāy\"],\"translation\":[\"Lord Chaitanya sings these names of Krishna from village to village, and Ṭhākur Bhakti Vinod falls at His lotus feet.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Goswami Maharaj\",\"ru\":\"Шрила Б.С. Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/goswami-maharaj-jasomati\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"17:[\"$\",\"$L1f\",null,{\"audio\":\"$16:props:song:resources:audio\",\"caption\":\"Listen audio:\",\"language\":\"en\"}]\n18:[\"$\",\"$L20\",null,{\"navMap\":{\"280\":{\"prev\":{\"path\":\"/en/nadiya-nagare-nitai-neche-neche-gay-re/\",\"title\":\"Śrīman Mahāprabhur śata-nāma\"},\"next\":{\"path\":\"/en/shri-hari-vasare-hari-kirtana-vidhana/\",\"title\":\"Śrī Hari-vāsara-gīti\"}}}}]\n21:Td2e,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organizat
