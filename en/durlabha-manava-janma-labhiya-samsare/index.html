tle\":\"Gaudija Gītandžalī\",\"subtitle\":\"Vaišnavu dziesmas un lūgšanas\",\"slug\":\"lv\",\"sort_order\":5,\"songsCount\":91},{\"title\":\"Ґаудія Ґітанджалі\",\"subtitle\":\"Вайшнавський пісенник українскою мовою\",\"slug\":\"ua\",\"sort_order\":6,\"language\":\"uk\",\"render\":{\"tg.contents.first_line\":false,\"tg.a-z.title.words\":4},\"songsCount\":74},{\"title\":\"Kirtan Guide\",\"subtitle\":\"Chiang Mai English Edition, 2022\",\"slug\":\"en-2022\",\"sort_order\":7,\"hidden\":false,\"is_legacy\":{\"show_micro_thumbnail_on_main\":true},\"songsCount\":166},{\"title\":\"Pocket Kirtan Guide\",\"subtitle\":\"Nabadwip, 2013\",\"slug\":\"en-pe\",\"language\":\"en\",\"sort_order\":8,\"is_legacy\":{\"show_micro_thumbnail_on_main\":true},\"songsCount\":80}],\"nav\":{\"185\":{\"prev\":{\"path\":\"/en/kobe-hobe-bolo-se-dina-amar/\",\"title\":\"Kabe Ha’be Bala\"},\"next\":{\"path\":\"/en/anya-abhilasha-chadi-jniana-karma-parihari/\",\"title\":\"Anya-abhilāṣa Chhāḍi\"}}},\"song\":{\"meta\":{\"page\":185,\"author\":\"Śrīla Bhakti Vinod Ṭhākur\",\"first_line\":\"durlabha mānava-janma labhiyā saṁsāre\"},\"title\":[\"Durlabha Mānava-janma\"],\"author\":[\"by Śrīla Bhakti Vinod Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"durlabha mānava-janma labhiyā saṁsāre\",\"kṛṣṇa nā bhajinu duḥkha kahiba kāhāre?\"],\"translation\":[\"The human form of life is the rarest opportunity for attaining spiritual perfection. Now I am lamenting because I’ve somehow or other been born with such an opportunity, but I wasted it by never worshiping Lord Kṛṣṇa. O, to whom shall I tell the tale of this misery?\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"‘saṁsāra’ ‘saṁsāra’ kari’ michhe gela kāla\",\"lābha nā ha-ila kichhu, ghaṭila jañjāla\"],\"translation\":[\"Having married and entered into the entanglements of materialistic family life, I passed my time in vain. I never got any tangible gain or permanent benefit, only trouble and botheration.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"kisera saṁsāra ei chhāyābāji prāya\",\"ihāte mamatā kari vṛthā dina yāya\"],\"translation\":[\"What kind of world is this anyway? It seems to be just like a magic lantern show that I saw at a carnival, wherein so many shadows and optical illusions dance magically before my eyes. I feel great attachment and identification with such a world, and thus day after day passes by fruitlessly, without any purpose whatsoever.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"e deha patana ha’le ki rabe āmāra?\",\"keha sukha nāhi dibe putra paribāra\"],\"translation\":[\"When this body drops dead on the ground, then what will remain mine? At that moment, all of my sons and dearest loved ones will not be able to give me any happiness.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"gardabhera mata āmi kari pariśrama\",\"kāra lāgi’ eta kari, nā ghuchila bhrama\"],\"translation\":[\"I work hard just like an ass every day, and now I am wondering for whom am I working so hard? I am still surrounded by so many illusions.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"dina yāya michhā kāje, niśā nidrā-vaśe\",\"nāhi bhāvi maraṇa nikaṭe āchhe vase\"],\"translation\":[\"I waste every day in useless, insignificant work, and I waste every night controlled by sleep. And in every twenty-four hours I never for one second consider that death is sitting very close by my side.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"bhāla manda khāi, heri, pari, chintā-hīna\",\"nāhi bhāvi, e deha chhāḍiba kona dina\"],\"translation\":[\"I live a very carefree life-style, eating, going out, wearing nice clothes, as I please, but I never consider that one day I will have to give up this body.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"deha-geha-kalatrādi-chintā avirata\",\"jāgichhe hṛdaye mora buddhi kari hata\"],\"translation\":[\"My poor heart is plagued by constant anxieties about the maintenance and daily turmoils created by my body, my house, my wife, my family members, and my social obligations. All these anxieties are pinching me and destroying all my intelligence.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"hāya, hāya! nāhi bhāvi – anitya e saba\",\"jīvana vigate kothā rahibe vaibhava?\"],\"translation\":[\"Alas, alas! What a remorseful situation has arisen! I am absorbed in all this trouble, but I never consider that all these things are temporary and subject to perish very soon. After I’m dead and gone, where will all of my material opulences remain?\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"śmaśāne śarīra mama paḍiyā rahibe\",\"vihaṅga-pataṅga tāya vihāra karibe\"],\"translation\":[\"When my body will be thrown in the pit at the cremation grounds, it will simply lie there motionlessly. Then many crows, vultures, ants, and worms will come and playfully sport there.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"kukkura sṛgāla saba ānandita ha’ye\",\"mahotsava karibe āmāra deha la’ye\"],\"translation\":[\"All the stray dogs and jackals will then become very much delighted, and in great ecstasy they will make a festival ground out of my body and will have a huge celebration and feast.\"],\"isLong\":false},{\"number\":\"12\",\"text\":[\"ye dehera ei gati, tāra anugata\",\"saṁsāra-vaibhava āra bandhu-jana yata\"],\"translation\":[\"Just see, this is the ultimate destination of this material body. And the most amazing thing is that all of my material opulences, house, family and friends have exactly the same destination.\"],\"isLong\":false},{\"number\":\"13\",\"text\":[\"ataeva māyā-moha chhāḍi buddhimāna\",\"nitya-tattva kṛṣṇa-bhakti karuna sandhāna\"],\"translation\":[\"Therefore I ask of anyone who has any sharp intelligence: please give up all of these temporary illusions presented by Māyā, and kindly search after the means to get pure devotion to Lord Kṛṣṇa, for this is the only really tangible eternal truth.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"embed_url\":\"https://soundcloud.com/kostya-netrebenko/16-durlabha-manava-janma-9\",\"personSlug\":\"srila-b-s-govinda-dev-goswami-maharaj\"},{\"title\":\"Manasa Krishna Prabhu\",\"embed_url\":\"https://soundcloud.com/huron/durlabha-manava-janma\",\"personSlug\":\"manasa-krishna-prabhu\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false},\"telegraphUrl\":\"https://telegra.ph/Durlabha-mānava-janma-02-22-2\"},\"head\":{\"canonical\":\"/en/durlabha-manava-janma-labhiya-samsare/\",\"description\":\"Durlabha Mānava-janma — a Vaiṣṇava song by Śrīla Bhakti Vinod Ṭhākur with lyrics, English translation and word-by-word meaning. From Kirtan Guide.\",\"title\":\"Durlabha Mānava-janma. by Śrīla Bhakti Vinod Ṭhākur | Kirtan Site\"},\"kind\":\"song\",\"route\":{\"kind\":\"item\",\"bookId\":\"en\",\"slug\":\"durlabha-manava-janma-labhiya-samsare\"}}}]}]]}]\n"])</script></body></html>
