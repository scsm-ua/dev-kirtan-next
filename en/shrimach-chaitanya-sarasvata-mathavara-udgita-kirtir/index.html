ratā-gaura-gāthā gṛṇanti\",\"nityaṁ rūpānuga śrī-kṛtamati-guru-gaurāṅga-rādhā-jitāśāḥ\"],\"translation\":[\"*Composed by Śrīla B.R. Śrīdhar Dev-Goswāmī Mahārāj while residing in a hut on the banks of the Ganges in 1941. Śrīla B.S. Govinda Dev-Goswāmī Mahārāj crafted this translation, based upon his own Bengali translation.*\",\"In the Holy Abode of transcendental touchstone,\\\\\",\"Śrī Nabadwīp Dham – the selfsame Śrī Vṛndāvan,\\\\\",\"in the land of Koladwīp, whose inner identity\\\\\",\"is the King of mountains Śrī Govardhan,\\\\\",\"near the charming shores of the holy River Bhāgīrathī\\\\\",\"who delivers all the fallen souls,\\\\\",\"stands that grand and glorious King of all Temples – \\\\\",\"Śrī Chaitanya Sāraswat Maṭh.\",\"In that beautiful retreat, the surrendered devotees\\\\\",\"whose lives are the message of Śrī Gaura,\\\\\",\"are eternally absorbed in the loving service\\\\\",\"of the Divine Master, the Golden Lord Gaurāṅga,\\\\\",\"and the Loving Lord Śrī Govindasundar\\\\\",\"with His consort Śrīmatī Gāndharvā,\\\\\",\"accompanied by all Their beloved associates.\",\"With hearts always filled with good hope\\\\\",\"to attain the grace of the Lord,\\\\\",\"following faithfully in the line\\\\\",\"of Śrī Śrī Rūpa and Raghunāth – \\\\\",\"the storekeepers of the unlimited treasure\\\\\",\"of pure, sweet love divine – \\\\\",\"those surrendered souls ever sing the unending glories\\\\\",\"of the transcendental Name and qualities\\\\\",\"of the most magnanimous, original Supreme Lord,\\\\\",\"Śrī Śrī Gaurāṅgasundar.\",\"Indeed the hearts of all beings, moving and still,\\\\\",\"marvel in the glory of Śrī Chaitanya Sāraswat Maṭh\\\\\",\"as they take shelter in the soothing, affectionate shade\\\\\",\"of the victory flag that flies aloft\\\\\",\"and sings wholeheartedly to the world the ever-expanding\\\\\",\"renown of Śrī Chaitanya Sāraswat Maṭh;\\\\\",\"bearing that banner of all transcendental benedictions,\\\\\",\"Śrī Chaitanya Sāraswat Maṭh ever shines resplendent\\\\\",\"in all its divine magnificence.\"],\"isLong\":true}],\"resources\":{\"image\":\"$3a:0:props:image\"},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":true,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"3c:[\"$\",\"$L44\",null,{\"navMap\":{\"28\":{\"prev\":{\"path\":\"/en/namah-om-vishnupadaya-krishna/\",\"title\":\"Śrīla A.C. Bhaktivedānta Swāmī Prabhupād\"},\"next\":{\"path\":\"/en/jaya-sa-parikara/\",\"title\":\"Jaya Dhvani\"}}}}]\n45:T446,{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"CollectionPage\",\"@id\":\"https://dev.kirtan.site/en/shrimach-chaitanya-sarasvata-mathavara-udgita-kirtir\",\"url\":\"https://dev.kirtan.site/en/shrimach-chaitanya-sarasvata-mathavara-udgita-kirtir\",\"name\":\"The Glory of Śrī Chaitanya Sāraswat Maṭh\",\"inLanguage\":\"en\",\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"}},{\"@type\":\"MusicComposition\",\"@id\":\"https://dev.kirtan.site/en/shrimach-chaitanya-sarasvata-mathavara-udgita-kirtir#composition\",\"alternateName\":[\"śrīmach-chaitanya-sārasvata\"],\"name\":\"The Glory of Śrī Chaitanya Sāraswat Maṭh\",\"url\":\"https://dev.kirtan.site/en/shrimach-chaitanya-sarasvata-mathavara-udgita-kirtir\",\"composer\":{\"@type\":\"Person\",\"name\":\"Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\"},\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"},\"about\":[{\"@type\":\"Thing\",\"name\":\"Bhakti Yoga\"},{\"@type\":\"Thing\",\"name\":\"Gaudiya Vaishnavism\"}],\"genre\":[\"Devotional\",\"Bhajan\",\"Kirtan\"],\"mainEntityOfPage\":{\"@id\":\"https://dev.kirtan.site/en/shrimach-chaitanya-sarasvata-mathavara-udgita-kirtir\"}}]}3d:[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$45\"}}]\n3e:[\"$\",\"$L46\",null,{\"bookId\":\"en\",\"page\":28}]\n3f:[\"$\",\"$L47\",null,{\"bookId\":\"en\",\"songId\":\"shrimach-chaitanya-sarasvata-mathavara-udgita-kirtir\"}]\n40:[\"$\",\"$
