,\"author\":[\"by Śrīla Bhakti Vinod Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"jaśomatī-nandana    vraja-vara nāgara,\",\"    gokula-rañjana kāna\",\"gopī-parāṇa-dhana    madana manohara,\",\"    kālīya-damana-vidhāna\"],\"word_by_word\":[\"**jaśomatī** — Yaśodā; **nandana** — darling son; **vraja** — Vraja; **vara** — beloved; **nāgara** — paramour; **gokula** — Gokula; **rañjana** — delight; **kāna** — Kãna!; **gopī** — gopis; **parāṇa** — life; **dhana** — wealth; **madana** — Cupid; **manohara** — stealer of the mind; **kālīya** — Kaliya Serpant; **damana** — subduer; **vidhāna** — enacted.\"],\"translation\":[\"Śrī Krishna is the beloved son of Mother Yaśodā, the transcendental lover of the land of Vraja and the delight of Gokula. One of His nicknames is Kāna. He is the life and soul of the *gopīs*. He is the enchanter of Cupid and the conqueror of the Kālīya serpent.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"jaśomatī\",\"trans\":\"Yaśodā\",\"sep\":\"-\"},{\"text\":\"nandana\",\"trans\":\"darling son\",\"sep\":\"    \"},{\"text\":\"vraja\",\"trans\":\"Vraja\",\"sep\":\"-\"},{\"text\":\"vara\",\"trans\":\"beloved\",\"sep\":\" \"},{\"text\":\"nāgara\",\"trans\":\"paramour\",\"sep\":\",\"}],[{\"text\":\"gokula\",\"trans\":\"Gokula\",\"sep\":\"-\"},{\"text\":\"rañjana\",\"trans\":\"delight\",\"sep\":\" \"},{\"text\":\"kāna\",\"trans\":\"Kãna!\",\"sep\":\"\"}],[{\"text\":\"gopī\",\"trans\":\"gopis\",\"sep\":\"-\"},{\"text\":\"parāṇa\",\"trans\":\"life\",\"sep\":\"-\"},{\"text\":\"dhana\",\"trans\":\"wealth\",\"sep\":\"    \"},{\"text\":\"madana\",\"trans\":\"Cupid\",\"sep\":\" \"},{\"text\":\"manohara\",\"trans\":\"stealer of the mind\",\"sep\":\",\"}],[{\"text\":\"kālīya\",\"trans\":\"Kaliya Serpant\",\"sep\":\"-\"},{\"text\":\"damana\",\"trans\":\"subduer\",\"sep\":\"-\"},{\"text\":\"vidhāna\",\"trans\":\"enacted\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"    amala hari-nām amiya-vilāsā\",\"vipina-purandara    navīna nāgara-vara,\",\"    vaṁśī-badana suvāsā\"],\"word_by_word\":[\"**amala** — pure; **hari** — Hari; **nām** — Name; **amiya** — nectar eternal; **vilāsā** — play; **vipina** — forest; **purandara** — lord, hero; **navīna** — youthful; **nāgara** — gallant lover; **vara** — the best; **vaṁśī** — flute; **badana** — playing; **suvāsā** — beautifully dressed.\"],\"translation\":[\"The Holy Names of Krishna are spotless and full of sweetness and beauty. Krishna is the king of the forest of Vṛndāvan. He is the ever-fresh youth, an excellent dresser, and the best of lovers. He always plays sweet melodies upon His flute.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"amala\",\"trans\":\"pure\",\"sep\":\" \"},{\"text\":\"hari\",\"trans\":\"Hari\",\"sep\":\"-\"},{\"text\":\"nām\",\"trans\":\"Name\",\"sep\":\" \"},{\"text\":\"amiya\",\"trans\":\"nectar eternal\",\"sep\":\"-\"},{\"text\":\"vilāsā\",\"trans\":\"play\",\"sep\":\"\"}],[{\"text\":\"vipina\",\"trans\":\"forest\",\"sep\":\"-\"},{\"text\":\"purandara\",\"trans\":\"lord, hero\",\"sep\":\"    \"},{\"text\":\"navīna\",\"trans\":\"youthful\",\"sep\":\" \"},{\"text\":\"nāgara\",\"trans\":\"gallant lover\",\"sep\":\"-\"},{\"text\":\"vara\",\"trans\":\"the best\",\"sep\":\",\"}],[{\"text\":\"vaṁśī\",\"trans\":\"flute\",\"sep\":\"-\"},{\"text\":\"badana\",\"trans\":\"playing\",\"sep\":\" \"},{\"text\":\"suvāsā\",\"trans\":\"beautifully dressed\",\"sep\":\"\"}]]},{\"number\":\"3\",\"text\":[\"vraja-jana-pālana    asura-kula-nāśana,\",\"    nanda-godhana rākhoyālā\",\"govinda mādhava    navanīta-taṣkara,\",\"    sundara nanda-gopālā\"],\"word_by_word\":[\"**vraja** — Vraja; **jana** — people; **pālana** — guardian; **asura** — demons; **kula** — section; **nāśana** — destroyer; **nanda** — Nanda; **godhana** — cows; **rākhoyālā** — keeper; **govinda** — Govinda; **mādhava** — Mādhava; **navanīta** — butter; **taṣkara** — thief; **sundara** — beautiful; **nanda** — Nanda; **gopālā** — cowherd boy.\"],\"translation\":[\"Krishna is the guardian of all who live in Vṛndāvan, and the destroyer of demons. He tends the cows and is known as Govinda, for He delights the cows and the senses. He is Mādhava, the husband of the goddess of fortune, He loves to steal butter and He is the beautiful cowherd boy of Nanda Mahārāj.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"vraja\",\"trans\":\"Vraja\",\"sep\":\"-\"},{\"text\":\"jana\",\"trans\":\"people\",\"sep\":\"-\"},{\"text\":\"pālana\",\"trans\":\"guardian\",\"sep\":\"    \"},{\"text\":\"asura\",\"trans\":\"demons\",\"sep\":\"-\"},{\"text\":\"kula\",\"trans\":\"section\",\"sep\":\"-\"},{\"text\":\"nāśana\",\"trans\":\"destroyer\",\"sep\":\",\"}],[{\"text\":\"nanda\",\"trans\":\"Nanda\",\"sep\":\"-\"},{\"text\":\"godhana\",\"trans\":\"cows\",\"sep\":\" \"},{\"text\":\"rākhoyālā\",\"trans\":\"keeper\",\"sep\":\"\"}],[{\"text\":\"govinda\",\"trans\":\"Govinda\",\"sep\":\" \"},{\"text\":\"mādhava\",\"trans\":\"Mādhava\",\"sep\":\"    \"},{\"text\":\"navanīta\",\"trans\":\"butter\",\"sep\":\"-\"},{\"text\":\"taṣkara\",\"trans\":\"thief\",\"sep\":\",\"}],[{\"text\":\"sundara\",\"trans\":\"beautiful\",\"sep\":\" \"},{\"text\":\"nanda\",\"trans\":\"Nanda\",\"sep\":\"-\"},{\"text\":\"gopālā\",\"trans\":\"cowherd boy\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"yamunā-taṭa-chara    gopī-vasana-hara,\",\"    rāsa-rasika kṛpāmoya\",\"śrī-rādhā-vallabha    vṛndāvana-naṭavara,\",\"    bhakati-vinod-āśraya\"],\"word_by_word\":[\"**yamunā** — Yamunā; **taṭa** — banks; **chara** — spy; **gopī** — gopis; **vasana** — garments; **hara** — stealer; **rāsa** — Rāsa; **rasika** — relisher; **kṛpāmoya** — merciful one; **śrī** — Śrī; **rādhā** — Rādhā; **vallabha** — beloved; **vṛndāvana** — Vrndāvan; **naṭavara** — supreme dancer; **bhakati** — Bhakti; **vinod** — Vinod; **āśraya** — shelter.\"],\"translation\":[\"Wandering on the banks of the Yamunā River, Krishna stole the garments of the *gopīs* while they were bathing. He enjoys the mellows of the rāsa dance. He is the most merciful, beloved lover of Śrīmatī Rādhārāṇī. He is the great dancer of Vṛndāvan, and the supreme shelter of Śrīla Bhakti Vinod Ṭhākur.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"yamunā\",\"trans\":\"Yamunā\",\"sep\":\"-\"},{\"text\":\"taṭa\",\"trans\":\"banks\",\"sep\":\"-\"},{\"text\":\"chara\",\"trans\":\"spy\",\"sep\":\"    \"},{\"text\":\"gopī\",\"trans\":\"gopis\",\"sep\":\"-\"},{\"text\":\"vasana\",\"trans\":\"garments\",\"sep\":\"-\"},{\"text\":\"hara\",\"trans\":\"stealer\",\"sep\":\",\"}],[{\"text\":\"rāsa\",\"trans\":\"Rāsa\",\"sep\":\"-\"},{\"text\":\"rasika\",\"trans\":\"relisher\",\"sep\":\" \"},{\"text\":\"kṛpāmoya\",\"trans\":\"merciful one\",\"sep\":\"\"}],[{\"text\":\"śrī\",\"trans\":\"Śrī\",\"sep\":\"-\"},{\"text\":\"rādhā\",\"trans\":\"Rādhā\",\"sep\":\"-\"},{\"text\":\"vallabha\",\"trans\":\"beloved\",\"sep\":\"    \"},{\"text\":\"vṛndāvana\",\"trans\":\"Vrndāvan\",\"sep\":\"-\"},{\"text\":\"naṭavara\",\"trans\":\"supreme dancer\",\"sep\":\",\"}],[{\"text\":\"bhakati\",\"trans\":\"Bhakti\",\"sep\":\"-\"},{\"text\":\"vinod\",\"trans\":\"Vinod\",\"sep\":\"-\"},{\"text\":\"āśraya\",\"trans\":\"shelter\",\"sep\":\"\"}]]}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-yasomati\"},{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-yasomati-1\"},{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі
