3e:[\"$undefined\",[\"$\",\"section\",null,{\"className\":\"SongHeader\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"SongHeader__title\",\"children\":[[\"$\",\"div\",\"0\",{\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[false,\"Jaya Dhvani\"]}]]}]]}],null,[],[]]}]]\n"])</script><script>self.__next_f.push([1,"3f:[\"$\",\"$L48\",null,{\"bookId\":\"en\",\"label\":\"Show verses / translation\",\"song\":{\"meta\":{\"page\":30,\"no-author\":1,\"first_line\":\"Jaya Saparikar\",\"verse parentheses\":\"non bold\"},\"title\":[\"Jaya Dhvani\"],\"verses\":[{\"translation\":[\"*This is not a comprehensive list, but a guideline to the glorifications chanted at the end of each ārati in the Temple. It is flexible.*\"],\"isLong\":false},{\"text\":[\"Jaya Saparikar Śrī Śrī Guru Gaurāṅga Gāndharvā Govindasundar-jīu kī jaya!\",\"\",\"Jaya Saparikar Śrī Śrī (the Names of the local Temple Deities) kī jaya!\",\"\",\"Jaya Om Viṣṇupād Paramahaṁsa Parivrājakāchārya-varya Aṣṭottara-śata-śrī Śrīla Bhakti Sundar Govinda Dev-Goswāmī Mahārāj kī jaya!\",\"\",\"Jaya Om Viṣṇupād Paramahaṁsa Parivrājakāchārya-varya Aṣṭottara-śata-śrī Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj kī jaya!\",\"\",\"Jaya Om Viṣṇupād Bhagavān Śrī Śrīla Bhakti Siddhānta Saraswatī Ṭhākur kī jaya!\",\"\",\"Jaya Om Viṣṇupād Śrīla Gaura Kiśor Dās Bābājī Mahārāj kī jaya!\",\"\",\"Jaya Om Viṣṇupād Śrīla Sachchidānanda Bhakti Vinod Ṭhākur kī jaya!\",\"\",\"Jaya Om Viṣṇupād Śrīla Jagannātha Dās Bābājī Mahārāj kī jaya!\",\"\",\"Jaya Śrīla Baladev Vidyābhūṣaṇ kī jaya!\",\"\",\"Jaya Śrīla Viśvanāth Chakravartī Ṭhākur kī jaya!\",\"\",\"Jaya Śrī Śrī Narottam, Śyāmānanda, Śrīnivās – Prabhu-traya kī jaya!\",\"\",\"Jaya Śrīla Kṛṣṇa Dās Kavirāj Goswāmī kī jaya!\",\"\",\"Jaya Śrīla Vṛndāvan Dās Ṭhākur kī jaya!\",\"\",\"Jaya Śrī Rūpa, Sanātan, Bhaṭṭa Raghunāth, Śrī Jīva, Gopāl Bhaṭṭa, Dās Raghunāth – Śrī Ṣaḍ Goswāmī Prabhu kī jaya!\",\"\",\"Jaya Śrīla Svarūp Dāmodar, Śrīla Rāy Rāmānanda kī jaya!\",\"\",\"Jaya Śrī Rūpānuga Guru-varga kī jaya!\",\"\",\"Jaya Namāchārya Śrīla Hari Dās Ṭhākur kī jaya!\",\"\",\"Jaya Viśva-vareṇya Śrīla A.C. Bhaktivedānta Swāmī Prabhupād kī jaya!\",\"\",\"Jaya Śrī Kṛṣṇa Chaitanya, Prabhu Nityānanda, Śrī Advaita, Gadādhar, Śrīvās-ādi Gaura-bhakta-vṛnda kī jaya!\",\"\",\"Jaya Sapārṣada Śrī Nityānanda Prabhu kī jaya!\",\"\",\"Jaya Sapārṣada Śrīman Mahāprabhu kī jaya!\",\"\",\"Jaya Śrī Nabadwīp Dhām kī jaya!\",\"\",\"Jaya Śrī Chaitanya Sāraswat Maṭh kī jaya!\",\"\",\"Jaya Śrī Gaṅgā-mayī, Śrī Yamunā-mayī kī jaya!\",\"\",\"Jaya Śrī Vṛndāvan Dhām kī jaya!\",\"\",\"Jaya Śrī Śrī Rādhā-Kṛṣṇa, Gopa, Gopī, Gopīnāth, Śyāma Kuṇḍa, Rādhā Kuṇḍa, Girirāj Govardhan kī jaya!\",\"\",\"Jaya Bhakti Devī, Vṛndā Devī, Tulasī Devī, kī jaya!\",\"\",\"Jaya Śrī Puruṣottam Dhām kī jaya!\",\"\",\"Jaya Baladev, Subhadrā, Jagannātha-jīu kī jaya!\",\"\",\"Jaya Grantharāj Śrīmad Bhāgavatam kī jaya!\",\"\",\"Jaya Grantharāj Śrī Chaitanya Charitāmṛta kī jaya!\",\"\",\"Jaya Ākara Maṭh Rāja Śrī Chaitanya Maṭh kī jaya!\",\"\",\"Jaya Tadīya Śākhā Maṭh kī jaya!\",\"\",\"Jaya Viśva-vyāpī Tadīya Śākhā Maṭh kī jaya!\",\"\",\"Jaya Śuddha Bhakti Vighna Vināśāya Śrī Nṛsiṁhadeva kī jaya!\",\"\",\"Jaya Bhakta-pravara Prahlād Mahārāj kī jaya!\",\"\",\"Jaya Ananta-koṭī Vaiṣṇava-vṛnda kī jaya!\",\"\",\"Jaya Samaveta Vaiṣṇava-maṇḍala kī jaya!\",\"\",\"Jaya Samaveta Bhakta-vṛnda kī jaya!\",\"\",\"Śrī Chaitanya Sāraswat Āchārya-vṛnda kī jaya!\",\"\",\"Śrī Sannyāsa-vṛnda kī jaya!\",\"\",\"(Names of sannyasīs/senior Vaiṣṇavas present in the assembly, kī jaya!)\",\"\",\"Jaya Śrī Harināma-saṅkīrtan kī jaya!\",\"\",\"Nitāi Gaura Premānande! Haribol!\"],\"isLong\":true},{\"subtitle\":[\"Translations of key phrases\"],\"translation\":[\"**Āchārya-varya** – The best, preferred, beloved teacher\",\"**Ananta-koṭī Vaiṣṇava-vṛnda** – An assembly of innumerable Vaiṣṇavas\",\"**Ākara Maṭh Rāja Śrī Chaitanya Maṭh** – Śrīla Bhakti Siddhānta Saraswatī Ṭhākur’s headquarters maṭh, Śrī Gauḍīya Maṭh in Māyāpur\",\"**Aṣṭottara-śata-śrī** – Highly respectful and auspicious form of address\",\"**Bhakta-pravara** – The best, topmost, devotee\",\"**Grantharāj** – The king of scriptures\",\"**Jaya** – All glories, victory, and triumph\",\"**Jīu** – An affectionate and reverential term for a Deity\",\"**Nitāi Gaura Premānande** – May the divine Names of Śrī Nityānanda Prabhu and Śrī Gaurāṅga Mahāprabhu be ecstatically, lovingly sung\",\"**Namāchārya** – Āchārya of the Holy Name\",\"**Om Viṣṇupād** – At the lotus feet of Lord Viṣṇu\",\"**Paramahaṁsa** – Sage or saint who sees divinity everywhere; extracts the essence; (literally) supreme swan\",\"**Parivrājak** – Constantly moving\",\"**Prabhu-traya** – Three Prabhus\",\"**Samaveta Bhakta-vṛnda** – All the assembled devotees\",\"**Samaveta Vaiṣṇava-maṇḍala** – All the circle, group, of Vaiṣṇavas\",\"**Saparikar; Sapārṣada** – (Accompanied by) Their paraphernalia; Their eternal associates\",\"**Śrī Chaitanya Sāraswat Maṭh** – the Temple and ashram in Nabadwīp established by Śrīla Guru Mahārāj and developed by Śrīla Gurudev\",\"**Śrī Harināma-saṅkīrtan** – The congregational chanting of the Holy Names of Śrī Kṛṣṇa\",\"**Śrīla** – One who is endowed with divine qualities, (literally) one who possesses ‘Śrī’ (all good qualities/fortune/beauty)\",\"**Śrī Rūpānuga Guru-varga** – The spiritual masters in the line of Śrī Rūpa Goswāmī\",\"**Śuddha Bhakti Vighna Vināśāya** – Destroyer of all obstacles on the path of pure devotion; (literally) pure devotion obstacles destroyer\",\"**Tadīya Śākhā Maṭh** – All the branches, missions, and ashrams that originated from the main Maṭh; (literally) related branch maṭhs\",\"**Viśva-vareṇya** – Universally worshipable\",\"**Viśva-vyāpī Tadīya Śākhā Maṭh** – (literally) universally expanded related branch maṭhs\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_u
