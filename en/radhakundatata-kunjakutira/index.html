lebees, the flute’s sweet song;\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"veṇu, śṛṇga, padachihna, meghamālā\",\"vasanta, śaśāṅka, śaṅkha, karatālā\"],\"translation\":[\"Flute, horn, His footsteps, range of clouds in the sky,\\\\\",\"season of spring, the moon, the conch, the hand-cymbals;\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"jugala vilāse anukūla jāni\",\"līlā-vilāsa-uddīpaka māni\"],\"translation\":[\"I know all these things are nourishing the Pastimes of the Divine Couple, I can feel they arouse the holy Pastimes of the Lord.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"e saba choḍata kā̐hā nāhi jāu̐\",\"e saba choḍata parāṇa hārāu̐\"],\"translation\":[\"I can never leave all these things so dear to me,\\\\\",\"without them I know I’ll surely die.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"bhaktivinoda kahe, śuna kāna\",\"tuyā uddīpaka hāmārā parāṇa\"],\"translation\":[\"Hear me, O Kāna, says Śrī Bhakti Vinod,\\\\\",\"You are the only light of my life.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/krsnachaitanya-das/36-radha-kunda-tata-5\"},{\"title\":{\"en\":\"Srila B.R. Sridhar Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.Р. Шридхар Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.Р. Шрідгар Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/sridhar-maharaj-and-govinda-5\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"3d:[\"$\",\"$L46\",null,{\"audio\":\"$3c:props:song:resources:audio\",\"caption\":\"Listen audio:\",\"language\":\"en\"}]\n3e:[\"$\",\"$L47\",null,{\"navMap\":{\"286\":{\"prev\":{\"path\":\"/en/radha-bhajane-jodi-moti-nahi-bhela/\",\"title\":\"Śrī Rādhāṣṭaka – Kīrtan Eight\"},
