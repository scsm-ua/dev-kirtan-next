 āpana sthāne ṭāne\",\"aichhāna āmāra mana    phire yena andha jana\",\"    supatha vipatha nāhi jāne\"],\"translation\":[\"I am just like a blind person unable to see what path is auspicious or inauspicious. I am helplessly dragged from here to there by lust, anger, greed, bewilderment, madness, and pride.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"nā la-inu sat mata    asate majila chitta\",\"    tuyā pāye nā karinu āśa\",\"narottama dāse kaya    dekhi’ śuni’ lāge bhaya\",\"    tarāiyā laha nija pāśa\"],\"translation\":[\"My mind became immersed in the impermanent satisfaction of the senses, and I could not understand the real goal of life. For this reason I did not aspire to attain Your lotus feet. Narottam Dās says, “Now that I am able to see and hear the Vaiṣṇavas, I have become free from all fear.”\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-thakura-vaisnava\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"42:[\"$\",\"$L4b\",null,{\"audio\":\"$41:props:song:resources:audio\",\"caption\":\"Listen audio:\",\"language\":\"en\"}]\n43:[\"$\",\"$L4c\",null,{\"navMap\":{\"64\":{\"prev\":{\"path\":\"/en/vibhavari-shiesha-aloka-praveshia/\",\"title\":\"Vibhāvarī Śeṣa\"},\"next\":{\"path\":\"/en/hari-haraye-namah-krishna-yadavaya-namah/\",\"title\":\"Nāma-saṅkīrtan\"}}}}]\n4d:T615,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"CollectionPage\",\"@id\":\"https://dev.kirtan.site/en/thakura-vaishnava-gana-kori-ei-nivedana\",\"url\":\"https://dev.kirtan.site/en/thakura-vaishnava-gana-kori-ei-nivedana\",\"name\":\"Ṭhākura Vaiṣṇava-gaṇa. by Śrīla Narottam Dās Ṭhākur\",\"inLanguage\":\"en\",\"isPartOf\":{\"@id\":\"https://de
