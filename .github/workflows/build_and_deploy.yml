name: Build and Deploy
on:
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Configure Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install shared packages (download + build)
              run: pnpm run install:fetch

            - name: Process sources (copy json)
              run: pnpm run install:post-fetch

            - name: Validation
              run: pnpm run validation

            - name: Build 🔧
              env:
                  NEXT_PUBLIC_ENV: ${{ vars.NEXT_PUBLIC_ENV }}
                  NEXT_PUBLIC_ORIGIN: ${{ vars.NEXT_PUBLIC_ORIGIN }}
                  NEXT_PUBLIC_G_ID: ${{ vars.NEXT_PUBLIC_G_ID }}
                  NEXT_PUBLIC_SEARCH_ACCOUNT_ID: ${{ vars.NEXT_PUBLIC_SEARCH_ACCOUNT_ID }}
                  NEXT_PUBLIC_SEARCH_API_KEY: ${{ vars.NEXT_PUBLIC_SEARCH_API_KEY }}
              run: pnpm run build

            - name: Deploy 🚀
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  token: ${{ secrets.GH_TOKEN }}
                  BRANCH: gh-pages # The branch the action should deploy to
                  FOLDER: ./out # The folder the action should deploy
                  CLEAN: true # Automatically remove deleted files from the deploy branch
