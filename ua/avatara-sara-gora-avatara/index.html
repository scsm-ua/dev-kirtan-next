 дерева бажань любові Господа Ґауранги, то я відмовився від них, вважаючи, що це отрута.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"саура-бгера а̄шє    пала̄шя шюнкілі (мана)\",\"    на̄са̄те пашіло кīта\",\"‘ікшу-данда’ бга̄ві’    ка̄тха чушилі (мана)\",\"    кемоне па̄ібі мітха\"],\"translation\":[\"Шукаючи солодкий аромат, я нюхав щось схоже на пахучу квітку. Але вона не мала запаху, як не має запаху квітка *палашя*. Натомість з неї вилетів ґедзь і вкусив мене за носа. Я намагався насолодитися нектаром мирського життя, помилково вважаючи його солодким, як сік цукрової тростини. Натомість я ніби жував сухе дерево. Так всі мої спроби насолоди виявились марними.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"‘ха̄ра’ болія    ґола̄я парілі (мана)\",\"    шямана кінкора са̄па\",\"‘шітала’ болія    а̄ґуна поха̄лі (мана)\",\"    па̄ілі баджара-та̄па\"],\"translation\":[\"Визнавши поразку, змучений та безсилий, я очікую змію смерті. Жар матеріального життя я прийняв за заспокійливу прохолоду. Замість неї я отримав нестерпне страждання, як від удару громом.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"самса̄ра бгаджілі    шрī-ґаура̄нґа бгулілі\",\"    на̄ шюнілі са̄дгура катха̄\",\"іха-парака̄ла    дука̄ла кхоялі (мана)\",\"    кха̄ілі а̄пана ма̄тха̄\"],\"translation\":[\"Присвятивши себе сімʼї та мирському життю, я забув Господа Ґауранґу і не прийняв настанови святих. Тепер, коли мої дні злічено, я розумію, що помираю вдруге. Перший раз я загинув, коли марно стратив життя на потурання чуттєвим насолодам.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/kostya-netrebenko/24-avatara-sara-gaura-avatara-4\"},{\"title\":{\"en\":\"Srila B.N. Acharya Maharaj\",\"ru\":\"Шрила Б.Н. Ачарья Махарадж\",\"ua\":\"Шріла Б.Н. Ачарʼя Махарадж\"},\"embed_url\":\"https://s
