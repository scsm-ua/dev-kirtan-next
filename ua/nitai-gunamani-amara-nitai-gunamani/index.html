– скарб усіх благих якостей! Ти приніс повінь піднесеної любові до Бога, і ці хвилі затопили весь світ.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"премаванья лоє ніта̄і а̄іла ґа̄уда дешє\",\"дубіло бгаката-ґана дīнахīна бга̄се\"],\"translation\":[\"За наказом Господа Чайтаньї Господь Нітьянанда приніс цю могутню повінь божественної любові на землю Бенгалії. Повінь цілковито охопила відданих, тоді як нещасні невіддані лишилися безпорадно борсатися поверхнею цього духовного океану.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"дīнахīна патіта па̄мара на̄хі ба̄чхе\",\"брахма̄ра дурлабга према саба̄ка̄ре джа̄че\"],\"translation\":[\"Господь Нітьянанда щедро й безумовно дарував цю рідкісну любов до Верховного Господа всім без винятку. Цієї любові було важко досягти навіть Творцю Брахмі, а тепер її отримали всі ниці та нещасні душі, які й не прагнули цього.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"а̄баддга каруна̄-сіндгу ка̄тія муха̄на\",\"горе горе буле према-аміяра ба̄на\"],\"translation\":[\"Раніше океан милості був недоступний, але Господь Нітай пробив у ньому шпарину. Тоді могутні потоки божественної любові ринули навсібіч і затопили кожну домівку.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"лочан боле хено ніта̄і джеба̄ на̄ бгаджіло\",\"джа̄нія шюнія сеі а̄тмага̄тī хоіло\"],\"translation\":[\"Лочан Дас промовляє: «Той, хто не поклонявся цьому Господу Нітаю і не прийняв Його великого дару, свідомо чинить самогубство».\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.N. Acharya Maharaj\",\"ru\":\"Шрила Б.Н. Ачарья Махарадж\",\"ua\":\"Шріла Б.Н. Ачарʼя Махарадж\"},\"embed_url\":\"https://soundcloud.com/kostya-netrebenko/034-nitaigunamaniamara-3\"},{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-nitai-guna-mani\"},{\"title\":{\"en\":\"Sudarshan Prabhu\",\"ru\":\"Сударшан Прабху\",\"ua\":\"Сударша
