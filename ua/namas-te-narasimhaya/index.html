 і найвищому притулку.\"]},{\"subtitle\":[\"Шрī Дашявата̄р-стотрам\"]},{\"number\":\"4\",\"text\":[\"тава кара-камала-варе накхам адбгута-шринґам\",\"    даліта-хіраньякашіпу-тану-бгринґам\",\"кешява дгрита-нарахарі-рӯпа джая джаґадīшя харе\"],\"translation\":[\"О Кешяво! О Володарю всесвіту! О Господи Харі! Ти прийняв образ напівлюдини-напівлева. Слава Тобі! Так само, як осу можна легко розчавити пальцями, Ти розірвав тіло демона Хіраньякашипу, подібного до оси, дивовижними гострими кігтями Своїх прекрасних лотосових рук.\"]}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Goswami Maharaj\",\"ru\":\"Шрила Б.С. Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/goswami-maharaj-s-ri-nr-sim-ha\"},{\"title\":{\"en\":\"Bhakti Lalita Devi\",\"ru\":\"Бхакти Лалита Деви\",\"ua\":\"Бгакті Лаліта Деві\"},\"embed_url\":\"https://soundcloud.com/bhakti-lalita-devi/bhakti-lalita-devi-sri-nrsimha-pranam-namas-te-narisimhaya\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"17:[\"$\",\"$L1f\",null,{\"audio\":\"$16:props:song:resources:audio\",\"caption\":\"Слухати аудіо:\",\"language\":\"ua\"}]\n18:[\"$\",\"$L20\",null,{\"navMap\":{\"227\":{\"prev\":{\"path\":\"/ua/pralaya-payodhi-jale-dhritavan-asi-vedam/\",\"title\":\"Шрī Дашявата̄р-стотрам\"},\"next\":{\"path\":\"/ua/namamishvaram-sachchidananda-rupam/\",\"title\":\"Шрī Шрī Да̄модара̄штакам\"}}}}]\n21:T755,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"CollectionPage\",\"@id\":\"https://dev.kirtan.site/ua/namas-te-narasimhaya\",\"url\":\"https://dev.kirtan.site/ua/namas-te-narasimhaya\",\"name\":\"Шрī Нрисімга Прана̄м\",\"inLanguage\":\"ua\",\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"}},{\"@type\":\"MusicComposition\",\"@id\":\"https://dev.kirtan.site/ua/namas-te-narasimhaya#composition\",
