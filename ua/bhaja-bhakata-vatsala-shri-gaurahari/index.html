xt\":[\"шюкта̄-шяка̄ді бга̄джі на̄літа̄ кушма̄нда\",\"да̄лі да̄лна̄ дуґдга-тумбī дадгі моча̄-ганта\"],\"translation\":[\"Після цього їм подають страву з шукти та різних видів зелених листових овочів, потім смачну смажену їжу і салат із зеленого листя джуту. Їм також подають гарбуз, кошики з фруктами, маленькі квадратні коржики з сочевиці на молоці, потім густий йогурт, кабачки, зварені в молоці, і овочеві заготовки з квітів бананового дерева.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"мудґа-бода̄ ма̄ша-бода̄ ротіка̄ грита̄нна\",\"шяшкулī піштака кшир пулі па̄яса̄нна\"],\"translation\":[\"Потім їм подають смажені квадратиками пиріжки *мунг-дал*, а також пиріжки *урад-дал*, *чапаті* й рис з топленим маслом. Далі - солодощі з молока, цукру й кунжуту, коржі з рисового борошна, густе кисле молоко, коржі, що плавають у молоці, і солодкий рис.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"карпӯра амрита–келī рамбга̄ кшира-са̄ра\",\"амрита раса̄ла̄, амла два̄дашя прака̄ра\"],\"translation\":[\"Є також солодкий рис, який на смак нагадує нектар через те, що його змішують з *камфорою*. Є банани і сир, нектарний і дуже смачний. Також подають дванадцять видів кислих напоїв з тамаринду, лаймів, лимонів, апельсинів і гранатів.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"лучі чіні сарапурī ла̄дду раса̄валī\",\"бгоджана корена кришна хо’є кутӯхалī\"],\"translation\":[\"Тут є пурі з білого борошна й цукру, пурі з вершками, ладу і пиріжки дал, зварені в цукровому рисі. Крішна жадібно їсть усю смакоту.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"ра̄дгіка̄ра пакка анна вівідга вʼяньджана\",\"парама а̄нанде кришна корена бгоджана\"],\"translation\":[\"З превеликим задоволенням і радістю Крішна їсть рис, овочі з каррі, солодощі й тістечка, які приготувала Шріматі Радгарані.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"чхоле-боле ла̄дду кха̄й шрī-мадгуманґала\",\"баґала ба̄джа̄й а̄ра дея харі-боло\"],\"translation\":[\"Кумедний друг Крішни, *брахман* Мадгуманґал, що дуже любить ладду, намагається дістати їх усіма правдами й неправдами. Зʼївши ладду, він кричить: «Харібол! Харібол!» і видає кумедний звук, плескаючи себе долонями по боках під пахвами.\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"ра̄дгіка̄ді ґане хері’ наянера коне\",\"трипта хо’є кха̄й кришна яшода̄-бгаване\"],\"translation\":[\"Спостерігаючи краєм ока за Радгарані та Її подругами *ґопі*, Крішна з великим задоволенням їсть у домі матері Яшоди.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"бгоджана̄нте піє кришна сува̄сіта ва̄рі\",\"сабе мукха пракша̄лой хо’є са̄рі са̄рі\"],\"translation\":[\"Після обіду Крішна пʼє трояндову воду. Потім усі хлопчики по черзі ополіскують роти.\"],\"isLong\":false},{\"number\":\"12\",\"text\":[\"хаста-мукха пракша̄лія джата сакха̄-ґане\",\"а̄нанде вішра̄ма коре баладева-сане\"],\"translation\":[\"Коли всі пастушки омили руки й уста, вони у великому блаженстві відпочивають разом з Господом Баларамою.\"],\"isLong\":false},{\"number\":\"13\",\"text\":[\"джа̄мбула раса̄ла а̄не та̄мбӯла-машяла̄\",\"та̄ха̄ кхеє кришна-чандра сукхе нідра̄ ґела̄\"],\"translation\":[\"Двоє пастушків Джамбула й Расала приносять Крішні *пан*, приготований з горіхів *бетелю*, вишуканих прянощів і катеху. Зʼївши той *пан*, Шрі Крішначандра щасливо засинає.\"],\"isLong\":false},{\"number\":\"14\",\"text\":[\"вішяла̄кша шікхі-пуччха-ча̄мара дгула̄я\",\"апӯрва шяяя кришна сукхе нідра̄ джа̄я\"],\"translation\":[\"Поки Крішна щасливо відпочиває на прекрасному ложі, Його слуга Вішялакша охолоджує Його віялом з павичевих пірʼїн.\"],\"isLong\":false},{\"number\":\"15\",\"text\":[\"джашоматī-а̄ґʼя пеє дганіштха̄-а̄ніто\",\"шрī-кришна-праса̄да ра̄дга̄ бгуньдже хоє прīто\"],\"translation\":[\"На прохання матері Яшоди *ґопі* Дганіштха приносить Шріматі Радгарані рештки їжі, що лишилися на тарілці Крішни, і та з великим задоволенням їсть їх.\"],\"isLong\":false},{\"number\":\"16\",\"text\":[\"лаліта̄ді сакхī-ґана авашєша па̄я\",\"мане мане сукхе ра̄дга̄-кришна-ґуна ґа̄я\"],\"translation\":[\"Лаліта Деві й інші *ґопі* отримують рештки і з великою радістю оспівують Радгарані й Крішну в своїх серцях.\"],\"isLong\":false},{\"number\":\"17\",\"text\":[\"харі-лīла̄ ек-ма̄тра джа̄ха̄ра прамода\",\"бгоґа̄раті ґа̄й тха̄кур бгакатівінода\"],\"translation\":[\"Тхакур Бгактівінод, чиєю єдиною радістю є розваги Господа Харі, співає цю пісню Бхоґ Араті.\"],\"isLong\":false},{\"text\":[\"бгаджа ґовінда ґовінда ґопа̄ла\",\"ґірідга̄рī ґопīна̄тха нанда дулала\",\"бгаджа ґовінда ґовінда ґопа̄ла\",\"нанда дулала джая джая шячī дулала\",\"шячī дулала джая джая ґаура ґопа̄ла\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-sri-bhoga\"},{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-bhaja-bhakata\"},{\"title\":{\"en\":\"Caracas temple\",\"ru\":\"Храм г.Каракас\",\"ua\":\"Храм м.Каракас\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/shchsm-karakas-bxadzha-bxakata\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1b:[\"$\",\"$L24\",null,{\"audio\":\"$1a:props:song:resources:audio\",\"caption\":\"Слухати аудіо:\",\"language\":\"ua\"}]\n1c:[\"$\",\"$L25\",null,{\"navMap\":{\"58\":{\"prev\":{\"path\":\"/ua/hari-haraye-namah-krishna-yadavaya-namah/\",\"title\":\"На̄м-санкīртан\"},\"next\":{\"path\":\"/ua/mahaprasade-govinde-nama-brahmani/\",\"title\":\"Маха̄праса̄да\"}}}}]\n26:T12d4,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chait
