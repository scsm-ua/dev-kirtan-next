verses\":[{\"number\":\"1\",\"text\":[\"тха̄кура-вайшнава-пада,    аванīра сусампада,\",\"    шюно бга̄і! хоія ека мана\",\"а̄шроя лоія бгадже,    та̄ре кришна на̄хі тьядже\",\"    а̄ро саба море ака̄рана\"],\"word_by_word\":[\"**тха̄кура** — святого; **вайшнава** — вайшнава; **пада** — стопи; **аванīра** — усього світу; **сусампада** — найцінніший скарб; **шюно** — слухай; **бга̄і** — брате; **хоія** — (хто) стане; **ека** — одним; **мана** — в умі; **а̄шроя** — притулок; **лоія** — прийме; **бгадже** —  і поклонятиметься (вайшнаву); **та̄ре** — того; **кришна** — Крішна; **на̄хі** — не; **тьядже** — покине; **а̄ро** — решта; **саба** — усі; **море** — загинуть; **ака̄рана** — марно.\"],\"translation\":[\"Брате, прошу, вислухай мене уважно. Лотосові стопи *вайшнавів* — найдорожчий скарб у світі. Шукай притулку в таких *вайшнавів* і з вірою служи їм. Крішна ніколи не покине того, хто поклоняється Йому таким чином. Усі інші помирають даремною смертю.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"тха̄кура\",\"trans\":\"святого\",\"sep\":\"-\"},{\"text\":\"вайшнава\",\"trans\":\"вайшнава\",\"sep\":\"-\"},{\"text\":\"пада\",\"trans\":\"стопи\",\"sep\":\",    \"},{\"text\":\"аванīра\",\"trans\":\"усього світу\",\"sep\":\" \"},{\"text\":\"сусампада\",\"trans\":\"найцінніший скарб\",\"sep\":\",\"}],[{\"text\":\"шюно\",\"trans\":\"слухай\",\"sep\":\" \"},{\"text\":\"бга̄і\",\"trans\":\"брате\",\"sep\":\"! \"},{\"text\":\"хоія\",\"trans\":\"(хто) стане\",\"sep\":\" \"},{\"text\":\"ека\",\"trans\":\"одним\",\"sep\":\" \"},{\"text\":\"мана\",\"trans\":\"в умі\",\"sep\":\"\"}],[{\"text\":\"а̄шроя\",\"trans\":\"притулок\",\"sep\":\" \"},{\"text\":\"лоія\",\"trans\":\"прийме\",\"sep\":\" \"},{\"text\":\"бгадже\",\"trans\":\"і поклонятиметься (вайшнаву)\",\"sep\":\",    \"},{\"text\":\"та̄ре\",\"trans\":\"того\",\"sep\":\" \"},{\"text\":\"кришна\",\"trans\":\"Крішна\",\"sep\":\" \"},{\"text\":\"на̄хі\",\"trans\":\"не\",\"sep\":\" \"},{\"text\":\"тьядже\",\"trans\":\"покине\",\"sep\":\"\"}],[{\"text\":\"а̄ро\",\"trans\":\"решта\",\"sep\":\" \"},{\"text\":\"саба\",\"trans\":\"усі\",\"sep\":\" \"},{\"text\":\"море\",\"trans\":\"загинуть\",\"sep\":\" \"},{\"text\":\"ака̄рана\",\"trans\":\"марно\",\"sep\":\"\"}]]},{\"number\":\"2\",\"text\":[\"вайшнава-чарана-джол,    према-бгакті діте бол,\",\"    а̄ро кехо нахе балаванта\",\"вайшнава-чарана-рену,    мастаке бгӯшана віну\",\"    а̄ра на̄хі бгӯшанера анта\"],\"word_by_word\":[\"**вайшнава** — (із) вайшнава; **чарана** — стоп; **джол** — вода; **према** — любовної; **бгакті** — відданості; **діте** — дарує; **бол** — силу; **а̄ро** — інший; **кехо** — хтось; **нахе** — не є; **балаванта** — спроможним; **вайшнава** — (із) вайшнава; **чарана** — стоп; **рену** — пил; **мастаке** — на голову; **бгӯшана** — прикраса; **віну** — окрім (єдина); **а̄ра** — іншої; **на̄хі** — немає; **бгӯшанера** — прикраси; **анта** — довершеної.\"],\"translation\":[\"Вода, якою омили лотосові стопи *вайшнавів*, дарує бгакті, наповнене чистою любовʼю до Верховного Господа. Немає дієвішого способу досягнення цієї божественної любові. Я осипаю свою голову пилом зі стоп-лотосів *вайшнавів*. Це для мене єдина прикраса.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"вайшнава\",\"trans\":\"(із) вайшнава\",\"sep\":\"-\"},{\"text\":\"чарана\",\"trans\":\"стоп\",\"sep\":\"-\"},{\"text\":\"джол\",\"trans\":\"вода\",\"sep\":\",    \"},{\"text\":\"према\",\"trans\":\"любовної\",\"sep\":\"-\"},{\"text\":\"бгакті\",\"trans\":\"відданості\",\"sep\":\" \"},{\"text\":\"діте\",\"trans\":\"дарує\",\"sep\":\" \"},{\"text\":\"бол\",\"trans\":\"силу\",\"sep\":\",\"}],[{\"text\":\"а̄ро\",\"trans\":\"інший\",\"sep\":\" \"},{\"text\":\"кехо\",\"trans\":\"хтось\",\"sep\":\" \"},{\"text\":\"нахе\",\"trans\":\"не є\",\"sep\":\" \"},{\"text\":\"балаванта\",\"trans\":\"спроможним\",\"sep\":\"\"}],[{\"text\":\"вайшнава\",\"trans\":\"(із) вайшнава\",\"sep\":\"-\"},{\"text\":\"чарана\",\"trans\":\"стоп\",\"sep\":\"-\"},{\"text\":\"рену\",\"trans\":\"пил\",\"sep\":\",    \"},{\"text\":\"мастаке\",\"trans\":\"на голову\",\"sep\":\" \"},{\"text\":\"бгӯшана\",\"trans\":\"прикраса\",\"sep\":\" \"},{\"text\":\"віну\",\"trans\":\"окрім (єдина)\",\"sep\":\"\"}],[{\"text\":\"а̄ра\",\"trans\":\"іншої\",\"sep\":\" \"},{\"text\":\"на̄хі\",\"trans\":\"немає\",\"sep\":\" \"},{\"text\":\"бгӯшанера\",\"trans\":\"прикраси\",\"sep\":\" \"},{\"text\":\"анта\",\"trans\":\"довершеної\",\"sep\":\"\"}]]},{\"number\":\"3\",\"text\":[\"тīртха-джол-павітра-ґуне,    лікхіячхе пура̄не,\",\"    се саба бгактіра праваньчана\",\"вайшнавера па̄да-дока,    сама нахе еі саба,\",\"    джа̄те хоя ва̄ньчіто пӯрана\"],\"word_by_word\":[\"**тīртха** — святих місць; **джол** — вода; **павітра** — очисні; **ґуне** — (має) якості; **лікхіячхе** — написано; **пура̄не** — у пуранах; **се** — це; **саба** — все; **бгактіра** — (для) любовної відданості; **праваньчана** — омана; **вайшнавера** — (із) вайшнава; **па̄да** — стоп; **дока** — вода; **сама** — такою ж; **нахе** — не є; **еі** — (як) це; **саба** — все; **джа̄те** — завдяки чому; **хоя** — стає; **ва̄ньчіто** — бажане; **пӯрана** — сповненим.\"],\"translation\":[\"*Пурани* оспівують очищувальну силу води зі святих місць паломництва, але в цьому є певний прихований обман. Насправді немає нічого такого чистого, як вода, що омила лотосові стопи *вайшнавів*. Ця вода задовольняє всі прагнення серця.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"тīртха\",\"trans\":\"святих місць\",\"sep\":\"-\"},{\"text\":\"джол\",\"trans\":\"вода\",\"sep\":\"-\"},{\"text\":\"павітра\",\"trans\":\"очисні\",\"sep\":\"-\"},{\"text\":\"ґуне\",\"trans\":\"(має) якості\",\"sep\":\",    \"},{\"text\":\"лікхіячхе\",\"trans\":\"написано\",\"sep\":\" \"},{\"text\":\"пура̄не\",\"trans\":\"у пуранах\",\"sep\":\",\"}],[{\"text\":\"се\",\"trans\":\"це\",\"sep\":\" \"},{\"text\":\"саба\",\"trans\":\"все\",\"sep\":\" \"},{\"text\":\"бгактіра\",\"trans\":\"(для) любовної відданості\",\"sep\":\" \"},{\"text\":\"праваньчана\",\"trans\":\"омана\",\"sep\":\"\"}],[{\"text\":\"вайшнавера\",\"trans\":\"(із) вайшнава\",\"sep\":\" \"},{\"text\":\"па̄да\",\"trans\":\"стоп\",\"sep\":\"-\"},{\"text\":\"дока\",\"trans\":\"вода\",\"sep\":\",    \"},{\"text\":\"сама\",\"trans\":\"такою ж\",\"sep\":\" \"},{\"text\":\"нахе\",\"trans\":\"не є\",\"sep\":\" \"},{\"text\":\"еі\",\"trans\":\"(як) це\",\"sep\":\" \"},{\"text\":\"саба\",\"trans\":\"все\",\"sep\":\",\"}],[{\"text\":\"джа̄те\",\"trans\":\"завдяки чому\",\"sep\":\" \"},{\"text\":\"хоя\",\"trans\":\"стає\",\"sep\":\" \"},{\"text\":\"ва̄ньчіто\",\"trans\":\"бажане\",\"sep\":\" \"},{\"text\":\"пӯрана\",\"trans\":\"сповненим\",\"sep\":\"\"}]]},{\"number\":\"4\",\"text\":[\"вайшнава-санґете мана, а̄нандіта анукшана,\",\"    сада̄ хой кришна-парасанґа\",\"дīна нароттама ка̄нде, хія дгайрджа на̄хі ба̄ндге,\",\"    мора дошя кено хоіло бганґа\"],\"word_by_word\":[\"**вайшнава** — (з) вайшнавом; **санґете** — спілкуючись; **мана** — ум; **а̄нандіта** — радіє; **анукшана** — щомиті; **сада̄** — (бо) завжди; **хой** — є; **кришна** — (про) Крішну; **парасанґа** — бесіди; **дīна** — немічний; **нароттама** — Нароттама Дас; **ка̄нде** — плаче; **хія** — серце; **дгайрджа** — терпіти; **на̄хі** — не; **ба̄ндге** — витримує; **мора** — моя; **дошя** — провина; **кено** — чому; **хоіло** — сталося; **бганґа** — падіння.\"],\"translation\":[\"Мій розум знову і знову знаходить розраду в спілкуванні з *вайшнавами*. Я повсякчас шукаю товариства відданих Господа Крішни. Бідний серцем Нароттам Дас плаче: «Мені немає спокою. Чому я потрапив у таке жалюгідне становище, що не можу отримати спілкування з *вайшнавами*?»\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"вайшнава\",\"trans\":\"(з) вайшнавом\",\"sep\":\"-\"},{\"text\":\"санґете\",\"trans\":\"спілкуючись\",\"sep\":\" \"},{\"text\":\"мана\",\"tr
