а-па̄вана\",\"trans\":\"спаситель занепалих душ\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"тома̄ віне\",\"trans\":\"окрім тебе\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"кеха на̄і\",\"trans\":\"нікого немає\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"2\",\"text\":[\"ка̄ха̄ра нікате ґеле па̄па дӯре яя\",\"емана даяла прабгу кева̄ котха̄ па̄я\"],\"word_by_word\":[\"**ка̄ха̄ра нікате** — біля кого лише наблизившись; **ґеле** — підійшовши; **па̄па** — усі гріхи; **дӯре яя** — відходять геть; **емана даяла прабгу** — така милостива особа; **кева̄ котха̄ па̄я** — де ж можна знайти когось подібного?\"],\"translation\":[\"Сама твоя присутність стирає всі гріхи. Такої доброти більше ніде не знайти.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"ка̄ха̄ра нікате\",\"trans\":\"біля кого лише наблизившись\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"ґеле\",\"trans\":\"підійшовши\",\"sep\":\" \"},{\"text\":\"па̄па\",\"trans\":\"усі гріхи\",\"sep\":\" \"},{\"text\":\"дӯре яя\",\"trans\":\"відходять геть\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"емана даяла прабгу\",\"trans\":\"така милостива особа\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"кева̄ котха̄ па̄я\",\"trans\":\"де ж можна знайти когось подібного?\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"3\",\"text\":[\"ґанґа̄ра парашя хайле пашча̄те па̄вана\",\"даршяне павітра кара еі тома̄ра ґуна\"],\"word_by_word\":[\"**ґанґа̄ра парашя хайле** — торкнувшись вод священної Ґанґи; **пашча̄те па̄вана** — очищуєшся пізніше; **даршяне** — лише побачивши тебе; **павітра кара** — очищуєшся негайно; **еі** — це; **тома̄ра ґуна** — твоя якість.\"],\"translation\":[\"Священна вода Ґанґи здатна визволити найгіршого грішника. Та бодай одного погляду на тебе достатньо, аби досягти цього визволення. Така твоя природа.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"ґанґа̄ра парашя хайле\",\"trans\":\"торкнувшись вод священної Ґанґи\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"пашча̄те па̄вана\",\"trans\":\"очищуєшся пізніше\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"даршяне\",\"trans\":\"лише побачивши тебе\",\"sep\":\" \"},{\"text\":\"павітра кара\",\"trans\":\"очищуєшся негайно\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"еі\",\"trans\":\"це\",\"sep\":\" \"},{\"text\":\"тома̄ра ґуна\",\"trans\":\"твоя якість\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"4\",\"text\":[\"харі-стха̄не апара̄дге та̄ре харіна̄ма\",\"тома̄-стха̄не апара̄дге на̄хіка еда̄на\"],\"word_by_word\":[\"**харі-стха̄не** — Господу Харі; **апара̄дге** — вчинивши образу; **та̄ре харіна̄ма** — святе ім’я звільняє; **тома̄-стха̄не апара̄дге** — але якщо хтось образить тебе; **на̄хіка** — не буде; **еда̄на** — спасіння.\"],\"translation\":[\"Якщо хтось образить святі стопи Господа Харі, здобуде прощення через оспівування Його Святого Імені. Проте немає спасіння тому, хто образить тебе.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"харі-стха̄не\",\"trans\":\"Господу Харі\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"апара̄дге\",\"trans\":\"вчинивши образу\",\"sep\":\" \"},{\"text\":\"та̄ре харіна̄ма\",\"trans\":\"святе ім’я звільняє\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"тома̄-стха̄не апара̄дге\",\"trans\":\"але якщо хтось образить тебе\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"на̄хіка\",\"trans\":\"не буде\",\"sep\":\" \"},{\"text\":\"еда̄на\",\"trans\":\"спасіння\",\"sep\":\"\"}]]},{\"number\":\"5\",\"text\":[\"тома̄ра хридає сада̄ ґовінда-вішра̄ма\",\"ґовінда кахена мама вайшнава пара̄на\"],\"word_by_word\":[\"**тома̄ра хридає** — у твоєму серці; **сада̄** — завжди; **ґовінда-вішра̄ма** — місце відпочинку Господа Ґовінди; **ґовінда кахена** — Господь Ґовінда каже; **мама вайшнава пара̄на** — «вайшнави — це моє життя».\"],\"translation\":[\"У твоєму серці завжди Господь Ґовінда. Адже Сам Господь Шрі Ґовінда каже: «Мої
