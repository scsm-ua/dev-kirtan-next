хīджана-шікшака    ньясікула-на̄яка,\",\"    ма̄дгава-ра̄дга̄бга̄ва пӯра\"],\"translation\":[\"Шріман Махапрабгу - світоч земель Надії та Господь Маяпуру. Він започаткував релігію Харінама-*санкіртани*. Він - наставник для сімейних людей та лідер серед *санньясі*. Його сутність - Господь Мадгава із серцем Шрі Радги.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"са̄рвабгаума-шодгана    ґаджапаті-та̄рана,\",\"    ра̄ма̄нанда-пошана-вīра\",\"рӯпа̄нанда-вардгана    сана̄тана па̄лана,\",\"    харіда̄са-модана-дгīра\"],\"translation\":[\"Він очистив Сарвабгауму Бгаттачарʼю та визволив Махараджа Пратапарудру. Він вберігає Рамананду Рая і є героєм для всіх відданих. Він захищає Санатану Ґосвамі та надихає Рупу Ґосвамі. Ним зачарований розсудливий Тхакур Харідас.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"враджа раса-бга̄вана    душтамата-шятана,\",\"    капатī-віга̄тана-ка̄ма\",\"шюддга бгакта-па̄лана    шюшка ґʼяна-та̄дана,\",\"    чоло бгакті-дӯшана-ра̄ма\"],\"translation\":[\"Шрі Крішна Чайтанья поглинутий *расами* Враджі. Він відкидає безживне розумування, яке затьмарює красу чистої відданості. Він опора та прихисток Своїх відданих.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.K. Ashram Maharaj\",\"ru\":\"Шрила Б.К. Ашрам Махарадж\",\"ua\":\"Шріла Б.К. Ашрам Махарадж\"},\"embed_url\":\"https://soundcloud.com/scsmathcolombia/5-prabhati-giti\"},{\"title\":{\"en\":\"Srila B.B. Avadhut Maharaj\",\"ru\":\"Шрила Б.Б. Авадхут Махарадж\",\"ua\":\"Шріла Б.Б. Авадгут Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/avadxut-maxaradzh-utrennee-6\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1e:[\"$\",\"$L27\",null,{\"audio\":\"$1d:props:song:resources:audio\",\"caption\":\"Слухати аудіо:\",\"language\":\"ua\"}]\n1f:[\"$\",\"$L28\",null,{\"navMap\":{\"38\":{\"prev\":{\"path\":\"/ua/jaya-guru-maharaj
