":\"ua\",\"label\":\"Показувати вірші / переклад\",\"song\":{\"meta\":{\"page\":206,\"translation\":\"auto\",\"first_line\":\"джая ра̄дге, джая кришна, джая вринда̄ван\",\"version\":\"draft-v8\",\"translator\":\"Alokananda Devi Dasi\"},\"title\":[\"Шрī Враджа-дга̄ма-махіма̄мрита\"],\"author\":[\"Шрīла Кришнада̄с Кавіра̄дж Ґосва̄мī\"],\"verses\":[{\"number\":\"1\",\"text\":[\"джая ра̄дге, джая кришна, джая вринда̄ван\",\"шрī-ґовінда, ґопīна̄тха, мадана-мохан\"],\"translation\":[\"Слава Радзі та Крішні і їхньому божественному лісу Вриндавану. Слава трьом головним Божествам Вриндавана — Шрі Ґовінді, Ґопінатху та Мадана-Мохану.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"шьяма-кунда, ра̄дга̄-кунда, ґірі-ґовардган\",\"ка̄ліндī ямуна̄ джая, джая маха̄ван\"],\"translation\":[\"Слава Шьяма-*кунді*, Радга-*кунді*, пагорбу Ґовардгану та річці Ямуні, знаній як Калінді. Слава безкрайньому лісу Махавану, в якому Крішна й Баларам явили всі Свої дитячі *ліли*.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"кеші-га̄та, вамші-вата, два̄дашя-ка̄нан\",\"джа̄нга̄ соб лīла̄ коіло шрī-нанда-нандан\"],\"translation\":[\"Слава Кеші-*гату*, де Крішна вбив демона Кеші. Вся слава дереву Вамші-ват, під яким грав на Своїй флейті Крішна, закликаючи всіх *ґопі*. Слава дванадцятьом лісам Враджі, місцям, де відбулися всі *ліли* сина Нанди, Шрі Крішни.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"шрī-нанда-яшода̄ джая, джая ґопа-ґан\",\"шрīда̄ма̄ді джая, джая дгену-ватса-ґан\"],\"translation\":[\"Слава божественним батькові й матері Крішни, Нанді та Яшоді. Слава пастушкам, на чолі зі Шрідамою, старшим братом Шріматі Радгарані та Ананґи Маньджарі. Слава коровам і телятам Враджі.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"джая вришабга̄ну, джая кīртіда̄ сундарī\",\"джая паурнама̄сī, джая а̄бгīра-на̄ґарī\"],\"translation\":[\"Слава божественним батькові й матері Радги, Вришабгану та прекрасній Кіртіді. Слава Паурнамасі, матері Сандіпані Муні, бабусі Мадгуманґала й Нандімукхі, яка є улюбленою ученицею Деварши Наради. Слава юним пастушкам Враджі.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"джая джая ґопешвара вринда̄вана-ма̄джг\",\"джая джая кришна-сакха̄ бату двіджа-ра̄дж\"],\"translation\":[\"Слава, слава Ґопешвару Шіві, який перебуває у Вриндавані, щоб оберігати святу *дгаму*. Слава, слава кумедному другові Крішни — *брахману* Мадгуманґалу.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"джая ра̄ма-га̄та, джая рохінī-нандан\",\"джая джая вринда̄вана-ва̄сī джата джон\"],\"translation\":[\"Слава Рама-*гату*, на якому Господь Баларам звершив Свою *раса-лілу*. Слава Господу Баларамі, синові Рохіні. Слава, слава всім мешканцям Вриндавана.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"джая двіджа-патнī, джая на̄ґа-конья-ґон\",\"бгактіте джа̄нга̄ра̄ па̄іло ґовінда-чаран\"],\"translation\":[\"Вся слава дружинам гордовитих ведичних *брахманів*. Вся слава дружинам змія Калії. Завдяки чистоті своєї *бгакті* всі вони досягли лотосових стоп Господа Ґовінди.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"шрī-ра̄са-мандала джая, джая ра̄дга̄-шьям\",\"джая джая ра̄са-лīла̄ сарва-манорам\"],\"translation\":[\"Слава місцю *раса-ліли* Шрі Крішни. Слава Радзі та Шьяму. Слава, слава найпрекраснішій серед усіх *ліл* Господа Крішни — божественній *раса-лілі*.\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"джая джайоджвала-раса сарва-раса-са̄р\",\"паракīя-бга̄ве джа̄ха̄ враджете прача̄р\"],\"translation\":[\"Слава, слава *расі* подружньої любові, найвищій серед усіх *рас*. У Враджі Шрі Крішна являє її у вигляді божественної *паракія-бгави*, настрою кохання поза шлюбом.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"шрī-джа̄хнава̄-па̄да-падма корія смаран\",\"дīна кришнада̄са кохе на̄ма-санкīртан\"],\"translation\":[\"Несучи в серці образ лотосових стоп Шрі Джахнави Деві, супутниці Господа Нітьянанди, цей дуже занепалий і нікчемний Крішнадас співає *санкіртану* Святого Імені.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\"
