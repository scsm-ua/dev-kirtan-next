освамі. Твоє сяйво, яке можна порівняти із сонячним, шириться по всьому світу.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшюддга бгакті прача̄ріте тома̄ сама на̄і\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eакаланка інду джена даяла ніта̄і\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВ проповіді чистої відданості тобі немає рівних. Ти наче бездоганний місяць та милосердний, як Господь Нітьянанда.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eулласіта вішвава̄сī лабге према-дгана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄нанде на̄чія ґа̄хе тава ґунаґана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eКоли захоплений люд по всіх усюдах здобуває Крішна-\u003ci\u003eпрему\u003c/i\u003e, він танцює та оспівує твою славу.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eстха̄піла̄ а̄шрама баху джаґата ма̄джга̄ре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпа̄рамахамса-дгарма-ґʼяна шікша̄ра прача̄ре\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЩоб навчати суті божественних знань і нести їх усім, ти заснував чимало ашрамів по всьому світу.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eчінтьйа̄чінтья веда-ґʼяне тумі а̄дгіка̄рī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсакала самшяя чхеттва̄ сусіддга̄нта-дга̄рī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТи володар ведичних знань - як мислимих, так і незбагнених. Ти розвіюєш будь-які сумніви та затверджуєш істину.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтома̄ра махіма̄ ґа̄хе ґолока мандале\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнітья-сіддга парікаре тава лīла̄стхале\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТвої навіки звільнені слуги оспівують твою славу у царстві твоїх ігор - в духовному світі Ґолоки.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпатіта па̄вана тумі даяра самīра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсарва-ка̄рʼє суніпуна сатья-суґамбгīра\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТи порятунок занепалих, ти вітерець милосердя. Ти вправний у будь-якому служінні, ти проникливий та правдивий.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eапурва лекханī дга̄ра̄ праґа̄дга па̄ндітья\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсада̄ ха̄сья мішта бга̄ші сушіла кавітва\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТвої дивні та неперевершені твори свідчать про глибоку вченість і незрівнянний поетичний дар. Ти завжди посміхаєшся і говориш втішливі слова.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eса̄дгу-санґе сада̄нандī сарала вінаї\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсабга̄-мадгʼє вакта̄ шрештха сарватра віджаї\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТи завжди відвертий і скромний, і ти всякчас радієш товариству чистих відданих. На духовних зібраннях ти - найкращий оратор. Всі твої наміри досягають успіху.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"14\"\u003e\n\u003ch5\u003e14\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґаудīя ґаґане тумі а̄ча̄рʼя-бга̄скара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнірантара сева̄прія мішта кантхасвара\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eНа небосхилі Ґаудія-вайшнавів твоя визначна особистість сяє наче сонце. Ти з любовʼю відправляєш служіння, а твій лагідний голос надихає інших.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"15\"\u003e\n\u003ch5\u003e15\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтома̄ра каруна̄ ма̄ґе тріка̄ла віла̄се\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґа̄ндгарвіка̄-ґірідга̄рī сева̄-ма̄тра а̄шє\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eКрізь минуле, сьогодення та майбутнє ми благаємо твоєї милості - лише через неї можна вдостоїтися відданого служіння Шрі Шрі Ґандгарвіці-Ґірідгарі.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"16\"\u003e\n\u003ch5\u003e16\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкрипа̄ кара охе прабгу шрі-ґаура-прака̄шя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄раті карає сада̄ е адгама да̄са\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЗглянися, мій володарю, проявлення милосердя Шрі Ґауранґи! Цей нікчемний слуга завжди поклоняється тобі.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-guru-maharaja-jati-rajeshvara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Ґуру А̄раті-стуті \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгакті Сундар Ґовінда Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая ‘ґуру-маха̄ра̄джа’ джаті-ра̄джешвара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-бгакті-ракшака дева-ґосва̄мī шрīдгара.\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВся слава тобі, о Ґуру Махарадже, імператору серед царів-\u003ci\u003eсанньясі\u003c/i\u003e - славетний Шріла Бгакті Ракшак Дев-Ґосвамі Шрідгар.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпатіта-па̄вана-лīла̄ віста̄рі’ бгуване\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніста̄ріла̄ дīна-хīна а̄па̄мара джане.\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТи розгорнув у цьому світі Свої ігри як спаситель грішних душ. Ти визволив усіх стражденних, навіть тих, хто був у безнадійному становищі.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтома̄ра каруна̄гана мураті херія\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпреме бга̄ґʼява̄на джīва поде мурачія\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eКоли удачливі душі споглядають твоє святе тіло, сповнене зосередженої милості, вони втрачають свідомість від хвилі божественної любові.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсудīрга супīбʼя дехо дівʼя-бга̄ва̄шрай\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдівʼя-ґʼяна дīпта-нетра дівʼя-джйотірмой.\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТвоя піднесена форма, наповнена божественним настроєм, є нектаром для наших очей. Ти сповнений духовного знання, і твої ясні очі сяють. Ти освітлюєш весь навколишній простір.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсуварна-сӯраджа-ка̄нті аруна-васана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтілака, туласī-ма̄ла̄, чандана-бгӯшана.\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВбраний у шафранові шати, прикрашений \u003ci\u003eтілакою\u003c/i\u003e і намистом із \u003ci\u003eтуласі\u003c/i\u003e, сповнений аромату \u003ci\u003eсандалу\u003c/i\u003e, ти подібний до золотого Сонця, що велично сяє.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eапӯрва шрī-анґа-шобга̄ коре джгаламала\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eауда̄рʼя-унната-бга̄ва ма̄дгурʼя-уджджвала.\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eНеперевершена краса Твоєї святої форми засліплює сяйвом. Твоє милосердя, твоє шляхетне, благородне серце сяє, немов мʼяке світло місяця в солодкій любові.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eачінтья-пратібга̄, сніґдга, ґамбгīра, уда̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджада-ґʼяна-ґірі-ваджра дівʼя-дīкша̄дга̄ра.\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТвій геніальний розум, глибока любов, велич і милосердність — наче грім, що руйнує мирське знання. Ти - глибоке джерело духовного багатства.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґаура-санкīртана-ра̄са-расера а̄шрай\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e“даяла ніта̄і” на̄ме нітья премамой.\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eУ танку Золотого Господа ти занурюєшся в духовну радість. «Даял Нітай, Даял Нітай!» — ти завжди ніжно й палко вигукуєш це Імʼя.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eса̄нґопа̄нґе ґаура-дга̄ме нітья-парака̄шя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґупта-ґовардгане дівʼя-лīла̄ра-віла̄са.\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСвоєю солодкою волею ти вічно перебуваєш у Навадвіп-\u003ci\u003eдгамі\u003c/i\u003e поруч зі своїми супутниками. І там разом ви радісно проводите свої святі \u003ci\u003eліли\u003c/i\u003e на прихованому пагорбі Ґовардган.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґаудīя-а̄ча̄рʼя-ґоштхī-ґаурава-бга̄джана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґаудīя-сіддга̄нтамані кантха-вібгушана.\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТи є гідним носієм слави в зібранні \u003ci\u003eґаудія-ачарʼїв\u003c/i\u003e. Дорогоцінний камінь \u003ci\u003eґаудія-сіддганти\u003c/i\u003e почесно сяє на твоїх грудях.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґаура-сарасватī-спхӯрта сіддга̄нтера кхані\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄вішкрита ґа̄ятрīра артха-чінта̄мані.\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТи — живе послання Шрі Ґаури, ти — скарбниця досконалих висновків. Ти відкрив внутрішнє значення Ґаятрі, яке, наче коштовний камінь \u003ci\u003eчінтамані\u003c/i\u003e, сповнює всі найвищі прагнення.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eека-таттва варнанете нітья-нава-бга̄ва\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсусанґаті, са̄маньджасья, е саба прабга̄ва.\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eКоли ти пояснюєш певну тему, вона щоразу розкривається в новому світлі. Правильний настрій і гармонія у всьому - твої невідʼємні духовні якості.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтома̄ра сатīртха-варґа сабе ека-мате\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eрӯпа-сарасватī-дга̄ра̄ декхена тома̄те.\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eУсі твої духовні брати одноголосно заявляють, що бачать у тобі продовження лінії вчення Рупи Ґосвамі та Сарасваті Тхакура.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"14\"\u003e\n\u003ch5\u003e14\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтуласī-ма̄ліка̄-хасте шрī-на̄ма-ґрахана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдекхі’ сакалера хой ‘прабгу’ уддīпана.\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eКожен, хто бачить, як ти повторюєш Святе Імʼя з вервицею \u003ci\u003eтуласі\u003c/i\u003e в руці, мимоволі згадує образ Сарасваті Тхакура.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"15\"\u003e\n\u003ch5\u003e15\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкотī-чандра-сушітала о пада бгараса̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґа̄ндгарва̄-ґовінда-лīла̄мрита-ла̄бга-а̄шя.\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТвої стопи дарують прохолоду, наче десять мільйонів місяців, - у служіння їм я вкладаю всю свою віру. Одного дня, за твоєї милості, ми зможемо пити нектар ігор Радги-Ґовінди.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"16\"\u003e\n\u003ch5\u003e16\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eавічінтья-бгеда̄бгеда-сіддга̄нта-прака̄шя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eса̄нанде а̄раті стуті коре дīна-да̄са.\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО втілення довершених висновків про незбагненну єдність і відмінність! Я співаю цю молитву під час твого \u003ci\u003eараті\u003c/i\u003e з радістю в серці, як твій смиренний слуга.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-kali-kukkura-kadana-jadi-chao-he\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eПрабга̄ті Ґīті \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;калі-куккура-кадана джаді ча̄о хе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкаліюґа-па̄вана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;калі-бгая-на̄шяна,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī шячī-нандана ґа̄о хе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯкщо ти хочеш приборкати собаку Калі - оспівуй Імена Шрі Шячі Нандана! Він спаситель кожного. Він руйнує страх, яким пронизана ця темна доба.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґада̄дгара-ма̄дана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ніта̄і-ера пра̄надгана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;адвайтера прапӯджіта ґора̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнімай вішвамбгара\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрīніва̄са-īшвара,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгаката самӯха-чітачора̄\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВін — радість Ґададгара, а також багатство та життя Нітая. Йому шанобливо поклоняється Адвайта Ачарʼя. Він відомий як Німай - Той, хто народився під деревом \u003ci\u003eнім\u003c/i\u003e, а також як Вішвамбгар, бо завдяки Йому тримається всесвіт. Він — повелитель Шріваса Тхакура. Він краде серця відданих.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнадīя-шяшядгара\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ма̄япура-īшвара,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ма-прабартана-шюра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґрихīджана-шікшака\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ньясікула-на̄яка,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ма̄дгава-ра̄дга̄бга̄ва пӯра\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eШріман Махапрабгу - світоч земель Надії та Господь Маяпуру. Він започаткував релігію Харінама-\u003ci\u003eсанкіртани\u003c/i\u003e. Він - наставник для сімейних людей та лідер серед \u003ci\u003eсанньясі\u003c/i\u003e. Його сутність - Господь Мадгава із серцем Шрі Радги.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eса̄рвабгаума-шодгана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґаджапаті-та̄рана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄ма̄нанда-пошана-вīра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eрӯпа̄нанда-вардгана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сана̄тана па̄лана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;харіда̄са-модана-дгīра\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВін очистив Сарвабгауму Бгаттачарʼю та визволив Махараджа Пратапарудру. Він вберігає Рамананду Рая і є героєм для всіх відданих. Він захищає Санатану Ґосвамі та надихає Рупу Ґосвамі. Ним зачарований розсудливий Тхакур Харідас.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвраджа раса-бга̄вана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;душтамата-шятана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;капатī-віга̄тана-ка̄ма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшюддга бгакта-па̄лана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шюшка ґʼяна-та̄дана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чоло бгакті-дӯшана-ра̄ма\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eШрі Крішна Чайтанья поглинутий \u003ci\u003eрасами\u003c/i\u003e Враджі. Він відкидає безживне розумування, яке затьмарює красу чистої відданості. Він опора та прихисток Своїх відданих.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jashomati-nandana-vraja-vara-nagara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī На̄м-кīртан \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджашоматī-нандана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;враджа-вара на̄ґара,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґокула-раньджана ка̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґопī-пара̄на-дгана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мадана манохара,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ка̄лīя-дамана-відга̄на\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eШрі Крішна — любий син Матері Яшоди, вічна любов землі Враджі та радість усієї Ґокули. Одне з Його ніжних імен — Кана. Він — життя і душа \u003ci\u003eґопі\u003c/i\u003e. Він зачаровує Купідона і перемагає змія Калію.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;амала харіна̄м амія-віла̄са̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвіпіна-пурандара\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;навīна на̄ґара-бора,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вамші-бадана сува̄са̄\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСвяті Імена Крішни чисті та сповнені солодкості й краси. Крішна — повелитель лісу Вриндавана. Він вічно юний, бездоганно вбраний та найкращий у коханні. Він завжди грає на Своїй флейті солодкі мелодії.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвраджа-джана-па̄лана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;асура-кула-на̄шяна,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нанда-ґодгана ра̄кхояла̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґовінда ма̄дгава\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;наванīта-ташкара,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сундара нанда-ґопа̄ла̄\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eКрішна — хранитель усіх мешканців Вриндавана і винищувач демонів. Він пасе корів і відомий як Ґовінда, бо дарує радість коровам і відчуттям. Він — Мадгава, чоловік богині удачі. Він любить красти масло, і Він — прекрасний пастушок, син Нанди Махараджа.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eямуна̄-тата-чара\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґопī-басана-хара,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄са-расіка крипа̄моя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-ра̄дга̄-валлабга\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вринда̄вана-натабара,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгакатівінод-а̄шрая\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eБлукаючи берегами ріки Ямуни, Крішна викрав одяг \u003ci\u003eґопі\u003c/i\u003e, коли вони купалися. Він насолоджується нектаром танцю \u003ci\u003eраса\u003c/i\u003e. Він — наймилосердніший, найдорожчий коханий Шріматі Радгарані. Він — великий танцівник Вриндавана і найвищий прихисток Шріли Бгактівінода Тхакура.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-shiachinandana-sura-muni-vandana\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Шячīнандана-вандана̄ \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгакті Ракшак Шрīдгар Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая шячīнандана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сура-муні-вандана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгава-бгая-кхандана джайо хе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджая харі-кīртана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нартана̄ вартана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;калімала-картана джайо хе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВся слава Шрі Крішні Чайтаньї Махапрабгу, якому поклоняються напівбоги й мудреці! Вся слава синові Шячі Деві, який звільняє від страху існування в матеріальному світі! Вся слава засновнику \u003ci\u003eсанкіртани\u003c/i\u003e: спільне оспівування Святого Імені Крішни усуває всю погань доби Калі!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнаяна-пурандара\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вішварӯпа снехадгара,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вішвамбгара вішвера кальяна\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджая лакшмī-вішнупрія\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вішвамбгара пріяхія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джая прія кінкара īшяна\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eНезрівнянна краса Шрі Чайтаньї зачаровує кожного. Як Верховний Господь Він підтримує всесвіт і уособлює безмежну вдачу усіх істот. Вішварупа - Його дорогий брат. Уся слава любим серцю Вішвамбгари Лакшмі Прії та Вішну Прії Деві. Вся слава Ішану - слузі їхньої родини.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī сīта̄-адвайта-ра̄й\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ма̄лінī-шрīва̄са джай,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джай чандрашєкхара а̄ча̄рʼя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджай нітьянанда ра̄й\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґада̄дгара джай джай,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джая харіда̄с на̄ма̄ча̄рʼя\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВся слава Сіті Тхакурані та Адвайті Ачарʼї! Вся слава Маліні Деві та Шрівасу Тхакуру! Вся слава Чандрашєкхару Ачарʼї! Вся слава Нітьянанді Раю та Ґададгару Пандіту! Вся слава Намачарʼї - Харідасу Тхакуру!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмура̄рі мукунда джай\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;преманідгі маха̄шяя,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джая джата прабгу па̄рішад\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванді сава̄ка̄ра па̄я\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;адгамере крипа̄ хой,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгакті сапа̄ршада-прабгупа̄д\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВся слава Мурарі Ґупті, Мукунді Датті та Пундаріку Відьянідгі! Вся слава усім сподвижникам Господа Чайтаньї - я схиляюся до їхніх стоп. Співаючи хвалу Шрилі Прабгупаді та цим славетним душам навіть найгірший негідник може дістатися зеніту любові.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gurudeva-kripa-bindu-diya-kara-ei-dase\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eҐурудева \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґурудева!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкрипа̄-бінду дія,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кара’ еі да̄се,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;трина̄пекша̄ аті дīна\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсакала-сахане,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бала дія кара,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ніджа-ма̄не сприха̄-хīна\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eҐурудеве, цей слуга благає в тебе хоча б одну краплю милості. Я менш значущий, ніж травинка. Допоможи мені всебічно, даруй мені наснагу. Нехай я буду, так само як ти, вільним від власних бажань та прагнень.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсакале самма̄н,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;коріте шякаті,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дехо на̄тха! ятха̄ ятха\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтобе то’ ґа̄ібо,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;харіна̄ма-сукхе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;апара̄дга хобе хото\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eНавчи мене щиро поважати і шанувати будь-кого. Лише тоді я радо зможу оспівувати Святе Імʼя та звільнюся від усіх зневаг.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкобе хено крипа̄,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лобгія е джана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;крита̄ртха хоібе, на̄тха!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшякті-буддгі-хīн,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄мі аті дīн,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кара море а̄тма-са̄тха\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВолодарю мій! Коли вже мені, слабкому, убогому та нетямущому, випаде така милість? Прошу, дозволь мені бути з тобою.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджоґʼята̄-віча̄ре,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кічху на̄хі па̄і,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тома̄ра каруна̄-са̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкаруна̄ на̄ хоіле,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ка̄ндія ка̄ндія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пра̄на на̄ ра̄кхібо а̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПоглянувши на мене, ти не знайдеш жодної чесноти. Я повністю залежу від твоєї ласки. Без твоєї прихильності я буду змушений гірко стогнати та втрачу всі життєві сили.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-udilo-aruna-puraba-bhage\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eАрунодоя-кīртан \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eЧастина 1\u003c/h3\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eуділо аруна пӯраба-бга̄ґе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдвіджа-мані ґора̄ амані джа̄ґе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгаката-самӯха лоія са̄тхе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґела̄ наґара-бра̄дже\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eНезадовго до сходу сонця, коли небо починає жевріти, прокидається від сну перлина серед двічінароджених - Шрі Ґаурахарі. Він бере з собою відданих та розпочинає \u003ci\u003eкіртан\u003c/i\u003e, мандруючи містами та селами.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘та̄тхай та̄тхай’ ба̄джало кхол,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eгана гана та̄хе джга̄нджера рол,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпреме дгала дгала сона̄ра анґа,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чаране нӯпура ба̄дже\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e\u003ci\u003eМриданґи\u003c/i\u003e вигукували \"татхай татхай\" під дзвін \u003ci\u003eкараталів\u003c/i\u003e. Золоте тіло Махапрабгу тремтіло від блаженства, а на Його ногах бриніли дзвіночки для ніг.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмукунда ма̄дгава джа̄дава харі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eболоре болоре вадана бгорі’,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмічхе ніда-вашє ґело ре ра̄ті,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;діваса шорīра са̄дже\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eМахапрабгу закликав тих, хто ще спав: \"Не марнуйте ночі на сон, а дні - на прикрашання своїх тіл! Вигукуйте імена Мукунда, Мадгава, Джадава і Харі!\"\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eемона дурллабга ма̄нава-дехо,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпа̄ія кі кара бга̄ва на̄ кехо,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eебе на̄ бгаджіле яшода̄-сута,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чараме подібе ла̄дже\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e\"Здобувши таке рідкісне людське тіло, чи використовуєш ти належно цей цінний дар? Якщо ти не будеш служити сину Яшоди зараз, то зрештою на тебе чекає велике розчарування\".\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eудіта тапана хоіле аста,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдіна ґело-болі’ хоібе вʼяста,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтобе кено ебе аласа хой,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ бгаджа хридоя-ра̄дже\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“З кожним сходом і заходом сонця безповоротно минає день. Чому ж ти марно витрачаєш свій час? Чому не служиш Господу свого серця?”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджīвана анітья джа̄наха са̄р,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eта̄хе на̄на̄-відга віпада-бга̄р,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄ма̄шроя корі’ джатане тумі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тха̄каха а̄пана ка̄дже\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e\"Знай, це життя тимчасове та сповнене страждань. Прийняти прихисток Святого Імені - твій єдиний обовʼязок.\"\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкришна-на̄ма-судга̄ корія па̄н\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджуда̄о бгакатівінода-пра̄н,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄ма віна̄ кічху на̄хіко а̄ро,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чаудда-бгувана-ма̄джге\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПий чистий нектар Святого Імені Крішни і так вгамуй душу Тхакура Бгактівінода. В усіх чотирнадцяти світах немає нічого кращого від Імені Крішни.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджīвера кальяна-са̄дгана-ка̄м,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджаґате а̄сі’ е мадгура на̄м,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eавідья-тіміра-тапана-рӯпе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хрид-ґаґане біра̄дже\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЩоб розсіяти темряву невігластва та благословити всі душі у цьому всесвіті, прекрасне Імʼя Крішни явилось як сяюче сонце.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jiv-jago-jiv-jago-gaurachanda-bole\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eАрунодоя-кīртан \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eЧастина 2\u003c/h3\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджīв джа̄ґо, джīв джа̄ґо, ґаура̄ча̄нда боле\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкота нідра̄ джа̄о ма̄я-пішячīра коле\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eГосподь Ґауранґа співає:\u003cbr /\u003e— Душі, прокиньтесь від сну! Душі, прокиньтесь від сну! Скільки ще ви будете спати на колінах у відьми-Майї!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгаджібо болія есе самса̄ра-бгіторе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгулія рохіле тумі авідьяра бгоре\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВи прийшли в цей світ зі словами: «Мій Господи, повір, я неодмінно буду поклонятися Тобі», але забувши цю обіцянку, ви занурилися у велику пітьму.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтома̄ре лоіте а̄мі хоіну авата̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄мі віна̄ бандгу а̄ра ке а̄чхе тома̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ прийшов врятувати вас! Хто ваш справжній друг, якщо не Я?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eенечхі аушадгі ма̄я на̄шіба̄ро ла̄ґі’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхарі-на̄ма маха̄-мантра лао тумі ма̄ґі’\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ приніс ці ліки, щоб зруйнувати ілюзію, яка повністю заволоділа вами. Моліться ж про цю Харінама-\u003ci\u003eмаха-мантру\u003c/i\u003e та прийміть Її!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгакатівінода прабгура-чаране подія\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсеі харі-на̄ма-мантра лоіло ма̄ґія\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТхакур Бгактівінод, припадаючи до Стоп-Лотосів Господа Ґауранґи, молить про Святе Імʼя та отримує Його, як \u003ci\u003eмаха-мантру\u003c/i\u003e!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-samsara-davanala-lidha-loka\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Шрī Ґурва̄штака \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Вішвана̄тх Чакравартī Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсамса̄ра-да̄ва̄нала-лīдга-лока-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтра̄на̄я ка̄рунья-гана̄ганатвам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпра̄птасья кальяна-ґуна̄рнавасья\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде ґурох шрī-чарана̄равіндам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ поклоняюсь стопам-лотосам Духовного Вчителя, океану благих якостей. Щоб врятувати всі види живих створінь, які страждають в лісовій пожежі мирського життя, Духовний Вчитель у формі грозової хмари милості гасить вогонь страждань зливами співчуття.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмаха̄прабгох кīртана-нритья-ґīта-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eва̄дітра-ма̄дьян-манасо расена\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eрома̄ньча-кампа̄шру-таранґа-бга̄джо\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде ґурох шрī-чарана̄равіндам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ поклоняюсь стопам-лотосам Духовного Вчителя. Його серце збожеволіло від нектарної любові до Шрімана Махапрабгу під час спільного оспівування Святих Імен. Танцюючи, співаючи та граючи на \u003ci\u003eмриданзі\u003c/i\u003e або \u003ci\u003eкараталах\u003c/i\u003e, його тіло тремтить від радості, а потоки сліз ллються з його очей.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-віґраха̄ра̄дгана-нітья-на̄на̄-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшринґа̄ра-тан-мандіра-ма̄рджана̄дау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eюктасья бгакта̄мш ча ніюньджато ’пі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде ґурох шрī-чарана̄равіндам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ поклоняюсь стопам-лотосам Духовного Вчителя, який завжди зайнятий служінням Божествам. Щодня він одягає їх у різний одяг з прикрасами, а також прибирає святий храм Господа, милостиво залучаючи до цього інших відданих.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eчатур-відга-шрī-бгаґават-праса̄да\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсва̄дв-анна-трипта̄н харі-бгакта-санга̄н\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкритвайва триптім бгаджатах садайва\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде ґурох шрī-чарана̄равіндам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ поклоняюсь стопам-лотосам Духовного Вчителя, який дарує відданим Шрі Крішни чотири види нектарного \u003ci\u003eпрасаду\u003c/i\u003e. Його жують, смокчуть, лижуть та пʼють, і це розвіює мирські чари та пробуджує спрагу до духовної любові. Серце Духовного Вчителя переповнюється радістю, коли він бачить як віддані шанують цей \u003ci\u003eпрасад\u003c/i\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-ра̄дгіка̄-ма̄дгавайор апара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eма̄дгурʼя-лīла̄-ґуна-рӯпа-на̄мна̄м\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпраті-кшана̄сва̄дана-лолупасья\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде ґурох шрī-чаранаравіндам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ поклоняюсь стопам-лотосам Духовного Вчителя. Його серце ненаситно прагне втішатись безліччю Святих Імен, форм, якостей та ігор Шрі Радга-Мадгави, які сповнені солодом божественної любові.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнікуньджа-юно раті-келі-сіддгʼяйр\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eя ялібгір юктір апекшанīя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтатра̄ті-да̄кшʼяд аті-валлабгасья\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде ґурох шрī-чарана̄равіндам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ поклоняюсь стопам-лотосам Духовного Вчителя. Він безмежно любий Божій Парі, що бавиться у гаях Враджі, бо досконало знає всі приготування, які роблять \u003ci\u003eсакхі\u003c/i\u003e, щоб послужити любовним іграм Господа.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eса̄кша̄д-дгарітвена самаста-шястрайр\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eуктас татха̄ бга̄вʼята ева садбгіх\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкінту прабгор ях прія ева тасья\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде ґурох шрī-чарана̄равіндам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ поклоняюсь стопам-лотосам Духовного Вчителя, який незбагненним чином одночасно відмінний та невідмінний від Всевишнього. Усі священні писання прославляють його, як невідмінного від Верховного Господа Шрі Харі, а великі святі підтверджують це. При цьому він найбільший улюбленець Господа.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eясья праса̄да̄д бгаґават-праса̄до\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eясьяпраса̄да̄т на ґатіх куто ’пі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдгʼяям стувамс тасья яшяс трі-сандгʼям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде ґурох шрī-чаранаравіндам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ поклоняюсь стопам-лотосам Духовного Вчителя, завжди прославляючи та памʼятаючи про нього - зранку, вдень та ввечері. Тільки по його милості можна знайти милість Господа. Якщо ж він незадоволений кимось, то ця душа ніде не знайде прихистку.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрīмад ґурораштакам етад уччайр\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбра̄хме мухӯрте патхаті праятна̄т\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eяс тена вринда̄вана-на̄тха-са̄кша̄т-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсевайва лабгʼя джанушо ’нта ева\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eХто регулярно та від усього серця співає ці вісім молитв Духовному Вчителю протягом Брахма-мухурти, той неодмінно досягне духовної зрілості та зможе напряму служити Владиці Вріндавана.\u003cbr\u003e\n\u003ci\u003eПримітка:\u003c/i\u003e Брахма-мухурта - девʼяносто шість хвилин перед сходом сонця.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-krishna-chaitanya-prabhu-jive-daya-kori\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШярана̄ґаті. Благодатне звернення \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-кришна-чайтанья прабгу джīве дая корі’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсвапа̄ршада свīя дга̄ма саха аватарі\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eМилостивий до всіх душ - Господь Шрі Крішна Чайтанья - Ти зійшов у цей світ разом зі Своїми супутниками та обителлю.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eатьянта дурлабга према коріба̄ре да̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшікха̄я шярана̄ґаті бгакатера пра̄на\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТи прийшов щоб вільно поширювати надзвичайно рідкісну божественну любов, навчаючи виняткової самопожертви - єдиному сенсу життя відданого.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдайнья, а̄тманіведана, ґоптритве варана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘авашья ракшибе кришна’ — вішва̄са па̄лана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСмирення, самовіддача, покладання на волю Крішни із вірою, що Він неодмінно захистить мене.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгакті-анукӯла ма̄тра ка̄рджера свīка̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгакті-пратікӯла бга̄ва—варджана̄нґīка̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПрийняття всього, що сприяє відданості та відкидання того, що суперечить їй.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшад-анґа шярана̄ґаті хоібе джа̄нга̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eта̄нга̄ра пра̄ртхана̄ шюне шрī-нандакума̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eМолитви тих, хто присвятив себе Господу через ці шість складових відданості, неодмінно будуть почуті божественним сином Нанди.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eрӯпа-сана̄тана-паде данте трина корі’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгакатівінода поде дуі пада дгорі’\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЗатиснувши соломину в зубах, Шрі Бгактівінод падає ниць до Шрі Рупи й Шрі Санатани та обіймає їхні святі лотосові стопи.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eка̄ндія ка̄ндія боле, а̄мі то’ адгама\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшікха̄є шярана̄ґаті карахе уттама\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЗі сльозами відчаю я благаю: «Я нікчемний! Навчіть мене самопосвяті, навчіть чистої відданості».\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-bhaja-re-bhaja-re-amar-mana-ati-manda\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eБгаджан-ґīті \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгаджа ре бгаджа ре а̄ма̄р мана аті манда\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(бгаджан віна̄ ґаті на̄і ре)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(враджа-бане ра̄дга̄-кришна бгаджан віна̄ ґаті на̄і ре)\u003cbr\u003e\n(бгаджа)\u003cstrong\u003e враджа-бане ра̄дга̄-кришна-чарана̄равінда\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(ґʼяна-карма паріхарі’ ре)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(шюддга ра̄ґа патха дгарі ґʼяна-карма паріхарі)\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО мій уме, який же ти нерозумний. Просто поклоняйся лотосовим стопам Радги і Крішни у лісах Враджі. Без цього неможливий духовий ріст. Залиш мирське знання та матеріальну діяльність, і просто поклоняйся Радзі й Крішні у лісах Враджі.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e(бгаджа)\u003cstrong\u003e ґаура-ґада̄дгара̄двайта-ґуру-нітьянанда\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(ґаура-кришне абгеде джене)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(ґуру кришна-прія джене ґаура-кришне абгеда джене ре)\u003cbr\u003e\n\u003cstrong\u003eшрīніва̄са, харіда̄са, мура̄рі, мукунда\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(ґаура-преме смара смара ре)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(шрīніва̄са, харіда̄се, ґаура-преме смара ре)\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТи маєш поклонятися й служити Господу Ґаурі, Ґададгару, Адвайті та предвічному Духовному Вчителеві, Господу Нітьянанді. Розуміючи, що Господь Ґаура і Господь Крішна — одне ціле, і знаючи, що Духовний Вчитель дуже дорогий Крішні, ти маєш памʼятати близьких супутників Господа Чайтаньї, таких як Шрівас Тхакур, Харідас Тхакур, Мурарі Ґупта і Мукунда Датта. У глибокій любові до Господа Ґаури завжди памʼятай про двох великих душ — Шріваса Тхакура і Харідаса Тхакура.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eрӯпа-сана̄тана-джīва-рагуна̄тха-двандва\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(джаді бгаджан корбе ре)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(рӯпа-сана̄тане смаран джаді бгаджан корбе ре)\u003cbr\u003e\n\u003cstrong\u003eра̄гава-ґопа̄ла-бгатта-сварӯпа-ра̄ма̄нанда\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(кришна према джаді ча̄о ре)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(сварӯпа-ра̄ма̄нанде смара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кришна-према джаді ча̄о ре)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПамʼятай Ґосвамі Вриндавана: Шрі Рупу Ґосвамі, Санатану Ґосвамі, Джіву Ґосвамі, Рагунатха Бгатту Ґосвамі та Рагунатха Даса Ґосвамі. Якщо ти поклоняєшся Господу Крішні, тоді обовʼязково памʼятай про двох великих душ — Шрі Рупу Ґосвамі і Санатану Ґосвамі. Також памʼятай про Рагаву Пандіта, Ґопала Бгатту Ґосвамі, Сварупу Дамодара Ґосвамі та Рамананду Рая. Якщо ти по-справжньому прагнеш любові до Крішни, тоді неодмінно маєш памʼятати Сварупу Дамодара Ґосвамі і Рамананду Рая.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґоштхī-саха карнапура-сен-шіва̄нанда\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(аджасра смара смара ре)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(ґоштхī-саха-сен шіва̄нанде аджасра смара ре)\u003cbr\u003e\n\u003cstrong\u003eрӯпа̄нуґа са̄дгу-джана бгаджана-а̄нанда\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(врадже ба̄с джаді ча̄о ре)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(рӯпа̄нуґа са̄дгу-джане смара врадже ба̄с джаді ча̄о ре)\u003cbr\u003e\n\u003cstrong\u003eрӯпа̄нуґа са̄дгу-джана бгаджана-а̄нанда\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгаджа ре бгаджа ре а̄ма̄р мана аті манда\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПамʼятай Шрілу Каві Карнапуру та всіх його родичів, які є щирими слугами Господа Шрі Чайтаньї Махапрабгу. Також памʼятай про батька Каві Карнапури, Шівананду Сену. Завжди памʼятай, завжди памʼятай Шрі Карнапуру і його родину. Памʼятай усіх тих \u003ci\u003eвайшнавів\u003c/i\u003e, які твердо йдуть шляхом Шрі Рупи Ґосвамі та цілковито занурені в настрій \u003ci\u003eбгаджану\u003c/i\u003e. Якщо ти по-справжньому прагнеш оселитися у землі Враджі, тоді ти повинен памʼятати всіх \u003ci\u003eвайшнавів\u003c/i\u003e, які є послідовниками Шріли Рупи Ґосвамі.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vibhavari-shiesha-aloka-praveshia\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eВібга̄варī Шєша \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвібга̄варī шєша,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄лока-правешя,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нідра̄ чха̄ді’ утхо джīва\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eболо харі харі,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мукунда мура̄рі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄ма кришна хаяґрīва\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнрисімга ва̄мана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-мадгусӯдана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;враджендра-нандана шьяма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпӯтана̄-га̄тана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кайтабга-шятана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джая да̄шяратхі-ра̄ма\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eяшода̄ дула̄ла,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґовінда-ґопа̄ла,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вринда̄вана пурандара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґопī-прія-джана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄дгіка̄-рамана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгувана-сундара-вара\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eра̄ва̄на̄нтакара,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ма̄кхона-таскара,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґопī-джана-вастра-ха̄рī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвраджера ра̄кха̄ла,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґопа-вринда-па̄ла,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чітта-ха̄рī бамші-дга̄рī\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджоґīндра-бандана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-нанда-нандана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;враджа-джана-бгая-ха̄рī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнавīна нīрада,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;рӯпа манохара,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мохана-вамші-біха̄рī\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eяшода̄-нандана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;камса-нісӯдана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нікуньджа-ра̄са-віла̄сī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкадамба-ка̄нана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄са-пара̄яна,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вринда̄-віпіна-ніва̄сī\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄нанда-вардгана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;према-нікетана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пхула-шяра-джоджака ка̄ма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґопа̄нґана̄ґана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чітта-вінодана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;самаста-ґуна-ґана-дга̄ма\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджа̄муна-джīвана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;келі-пара̄яна,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ма̄наса-чандра-чакора\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄ма-судга̄-раса,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґа̄о кришна-джашя,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄кхо вачана мана мора\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-thakura-vaishnava-gana-kori-ei-nivedana\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eТха̄кура-вайшнава-ґана \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Нароттам Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтха̄кура вайшнава-ґана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;корі еі ніведана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мо бодо адгама дура̄ча̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eда̄руна-самса̄ра-нідгі\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄хе дгӯбайло відгі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кешє дгорі море кара пара\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО святі \u003ci\u003eвайшнави\u003c/i\u003e, я, пропащий та розпусний, звертаюся до вас із молитвою. Через свою лиху долю я потерпаю у буремному океані матеріального буття. Тож благаю, врятуйте мене, витягнувши за волосся.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвідгі бодо валава̄н\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на шюне дгарама-ґʼяна\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сада̄і карама-па̄шє ба̄ндге\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄ декхі та̄рана лешя\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джата декхі саба клешя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ана̄тха ка̄таре тені ка̄нде\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eНевідворотна доля не зважає на мою вченість чи релігійність -- вона міцно звʼязує мене мотузками \u003ci\u003eкарми\u003c/i\u003e. Я не знаходжу жодного проблиску надії. Єдине, що я бачу, це неминучі злидні. Безпорадний та зламаний, я ридаю.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eка̄ма кродга лобга моха мада абгіма̄на саха\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄пана а̄пана стха̄не та̄не\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eаіча̄на а̄ма̄ра мана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пхіре джена андга джана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;супатха віпатха на̄хі джа̄не\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eХтивість, гнівливість, жадібність, гординя, егоїзм та чари ілюзії жбурляють мене на всі боки. Отже, мій ум-сліпець не в змозі розрізнити сприятливе та згубне.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eна лоіну сат мата\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;асате маджіло чіта\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;туя па̄є на коріну а̄шя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнароттама да̄се кой\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;декхі шюні лаґе бгай\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тара̄ія лохо ніджа па̄шя\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eМій розум занурив мене у потурання почуттям. Не усвідомлюючи істинної мети життя, я так і не привернувся до ваших лотосових стоп. Нароттам Дас молиться: \"Від усвідомлення свого безнадійного становища мене охоплює страх. Врятуйте мене, прихистивши коло себе!\"\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hari-haraye-namah-krishna-yadavaya-namah\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eНа̄м-санкīртан \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Нароттам Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eхарі харає намах кришна ядава̄я намах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eядава̄я ма̄дгава̄я кешява̄я намах\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eГосподь Харі, Господь Крішна, прийми мої поклони! Відомий як Ядава, Мадгава, Кешава - Тобі мої поклони!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопа̄ла ґовінда ра̄ма шрī мадгусӯдана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґірідга̄рī ґопīна̄тха мадана-мохана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО! Ґопал, Ґовінда, Рама, Шрі Мадгусудана Ґірідгарі, Ґопінатх, Мадана-Мохан!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-чайтанья нітьянанда шрī адвайта-чандра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґада̄дгара шрīва̄са̄ді ґаура-бгакта-вринда\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВся слава Шрі Чайтаньї, Слава Нітьянанді, Слава Шрі Адвайта Ачарʼї! Слава Ґададгару Пандіту, Шрівасу Тхакуру, Слава всім відданим Шрі Чайтаньї!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая рӯпа сана̄тана бгатта рагуна̄тха\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-джīва-ґопа̄ла-бгатта да̄са рагуна̄тха\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВся слава Шрі Рупі Ґосвамі, Санатані Ґосвамі, Рагунатху Бгатта Ґосвамі! Слава Шрі Дживі Ґосвамі, Ґопалу Бгатта Ґосвамі, Рагунатху Дасу Ґосвамі!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eеі чхой ґоса̄ір корі чарана вандана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджа̄ха̄ хоіте бігна-на̄ш абгīшта пӯрана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСтопам цих шести ґосвамі, я пропоную свої поклони. Це усуває всі перешкоди до відданості та сповнює всі духовні чаяння.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eеі чхой ґоса̄ір джа̄нра муі та̄нра да̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eта̄н-саба̄ра пада-рену мора паньча-ґра̄са\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ слуга слуги цих шести ґосвамі. Пил з їх стоп - пʼять видів моєї їжі.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eта̄ндера чарана себі бгакта сане ва̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджанаме джанаме мора еі абгіла̄ша\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ бажаю життя за життям жити біля тих відданих, що служать стопам цих шести ґосвамі.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eеі чхой ґоса̄і джабе врадже коіла̄ ва̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄дга̄-кришна-нітья-лīла̄ коріла̄ прака̄шя\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eКоли ці шість ґосвамі жили у Враджі, вони проявили та пояснили вічні ігри Радги та Крішни.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄нанде боло харі бгаджа вринда̄вана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-ґуру-вайшнава-паде маджа̄ія мана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eНаціливши ум на лотосові стопи Духовного Вчителя та святих Вайшнавів, з радістю співай імена Господа Харі та поклоняйся неосяжній дійсності Вриндавана.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-ґуру-вайшнава-па̄да-падма корі а̄шя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(харі) на̄ма-санкīртана кохе нароттама да̄са\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eУповаючи на лотосові стопи Шрі Ґуру та Вайшнавів, Нароттам Дас співає \u003ci\u003eсанкіртану\u003c/i\u003e Святого Імені.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eОбіднє А̄раті\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-bhaja-bhakata-vatsala-shri-gaurahari\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Бгоґ А̄раті Ґīті \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгаджа бгаката-ватсала шрī-ґаурахарі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-ґаурахарі сохі ґоштха-біха̄рī,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнанда-джашоматī-чітта-ха̄рī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПоклоняйся Шрі Ґаурахарі, ласкавому покровителю Своїх відданих. Він - Господь Шрі Крішна, повелитель пасовиськ Враджі та викрадач сердець Нанди та Яшоди.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбела̄ хо’ло, да̄модара, а̄іса екхано\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгоґа-мандіре босі’ корахо бгоджана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eМатінка Яшода гукає: «Любий Дамодаро, вже пізно! Хутко приходь у їдальню та сідай обідати!»\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнандера нірдешє байсе ґірі-вара-дга̄рī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбаладева-саха сакха̄ байсе са̄рі са̄рі\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eНанда Махарадж розсадив усіх в рядочки: Крішну, який підняв пагорб Ґовардган, Його старшого брата - Шрі Баладеву, а також їхніх друзів пастушків.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшюкта̄-шяка̄ді бга̄джі на̄літа̄ кушма̄нда\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eда̄лі да̄лна̄ дуґдга-тумбī дадгі моча̄-ганта\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПісля цього їм подають страву з шукти та різних видів зелених листових овочів, потім смачну смажену їжу і салат із зеленого листя джуту. Їм також подають гарбуз, кошики з фруктами, маленькі квадратні коржики з сочевиці на молоці, потім густий йогурт, кабачки, зварені в молоці, і овочеві заготовки з квітів бананового дерева.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмудґа-бода̄ ма̄ша-бода̄ ротіка̄ грита̄нна\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшяшкулī піштака кшир пулі па̄яса̄нна\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПотім їм подають смажені квадратиками пиріжки \u003ci\u003eмунг-дал\u003c/i\u003e, а також пиріжки \u003ci\u003eурад-дал\u003c/i\u003e, \u003ci\u003eчапаті\u003c/i\u003e й рис з топленим маслом. Далі - солодощі з молока, цукру й кунжуту, коржі з рисового борошна, густе кисле молоко, коржі, що плавають у молоці, і солодкий рис.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкарпӯра амрита–келī рамбга̄ кшира-са̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eамрита раса̄ла̄, амла два̄дашя прака̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЄ також солодкий рис, який на смак нагадує нектар через те, що його змішують з \u003ci\u003eкамфорою\u003c/i\u003e. Є банани і сир, нектарний і дуже смачний. Також подають дванадцять видів кислих напоїв з тамаринду, лаймів, лимонів, апельсинів і гранатів.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eлучі чіні сарапурī ла̄дду раса̄валī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгоджана корена кришна хо’є кутӯхалī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТут є пурі з білого борошна й цукру, пурі з вершками, ладу і пиріжки дал, зварені в цукровому рисі. Крішна жадібно їсть усю смакоту.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eра̄дгіка̄ра пакка анна вівідга вʼяньджана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпарама а̄нанде кришна корена бгоджана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЗ превеликим задоволенням і радістю Крішна їсть рис, овочі з каррі, солодощі й тістечка, які приготувала Шріматі Радгарані.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eчхоле-боле ла̄дду кха̄й шрī-мадгуманґала\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбаґала ба̄джа̄й а̄ра дея харі-боло\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eКумедний друг Крішни, \u003ci\u003eбрахман\u003c/i\u003e Мадгуманґал, що дуже любить ладду, намагається дістати їх усіма правдами й неправдами. Зʼївши ладду, він кричить: «Харібол! Харібол!» і видає кумедний звук, плескаючи себе долонями по боках під пахвами.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eра̄дгіка̄ді ґане хері’ наянера коне\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтрипта хо’є кха̄й кришна яшода̄-бгаване\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСпостерігаючи краєм ока за Радгарані та Її подругами \u003ci\u003eґопі\u003c/i\u003e, Крішна з великим задоволенням їсть у домі матері Яшоди.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгоджана̄нте піє кришна сува̄сіта ва̄рі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсабе мукха пракша̄лой хо’є са̄рі са̄рі\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПісля обіду Крішна пʼє трояндову воду. Потім усі хлопчики по черзі ополіскують роти.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eхаста-мукха пракша̄лія джата сакха̄-ґане\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄нанде вішра̄ма коре баладева-сане\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eКоли всі пастушки омили руки й
