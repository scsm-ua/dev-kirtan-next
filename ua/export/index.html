Як хмара у сезон дощів, це Святе Імʼя проливає чистий нектар у їхні вуха. Усі віддані танцюють, перебуваючи в глибокому блаженстві та сповнені радості у своєму серці.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eма̄дгурī-пӯра,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄сабо паші’,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ма̄та̄я джаґата-джане\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкехо ва̄ ка̄нде,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кехо ва̄ на̄че,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кехо ма̄те мане мане\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eУсі мешканці всесвіту шаленіють, потрапивши під цю пʼянку, солодку, божественну зливу. Хтось плаче, хтось танцює, а хтось повністю пʼяніє в глибині душі.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпаньча-вадана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄раде дгорі’,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;премера сагана рол\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкамала̄сана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄чія боле,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘боло боло харі боло’\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПʼятиликий Господь Шіва обіймає Нараду Муні та безупинно галасує від духовного піднесення, тоді як Господь Брахма захоплено танцює і промовляє: «Усі ви повторюйте: “Харібол! Харібол!”».\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсахасра̄нана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;парама-сукхе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘харі харі’ болі ґа̄й\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄ма-прабга̄ве,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ма̄тіло вішва,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ма-раса сабе па̄й\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТисячеустий Ананта Шєша сповнюється найвищого щастя, співає й вигукує: «Харі! Харі!». Хвилі звуку цього Святого Імені проливають на жителів всесвіту солодкий нектар, від якого всі знову і знову шаленіють.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-кришна-на̄ма,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;расане спхурі’,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пӯра̄’о а̄ма̄ра а̄шя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-рӯпа-паде,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джа̄чає іха̄,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгакатівінода-да̄са\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСвяте Імʼя Шрі Крішни здійснило всі мої прагнення, проявившись в устах кожного. Тому Бгактівінод, смиренний слуга Господа, молиться до лотосових стоп Шрі Рупи Ґосвамі, благаючи, щоб оспівуваня Харінами завжди лунало саме так.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-krishnotkirtana-gana-nartana-parau\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Шрī Шад-Ґосва̄мй-аштакам \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Шрīніва̄с А̄ча̄рʼя\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкришноткīртана-ґа̄на-нартана-парау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрема̄мрита̄мбго-нідгī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдгīра̄дгīра-джанапріяу прія-карау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нірматсарау пӯджітау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-чайтанья-крипа̄-бгарау бгуві бгуво\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бга̄ра̄ваханта̄ракау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде рӯпа-сана̄танау рагу-юґау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-джīва-ґопа̄лакау\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eна̄на̄-шястра-віча̄ранайка-ніпунау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сад-дгарма-самстха̄пакау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eлока̄на̄м хіта-ка̄рінау трі-бгуване\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ма̄ньяу шяраньякарау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄дга̄-кришна-пада̄равінда-бгаджана̄-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нандена матта̄лікау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде рӯпа-сана̄танау рагу-юґау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-джīва-ґопа̄лакау\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-ґаура̄нґа-ґуна̄нуварнана-відгау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шраддга̄-самриддгй-анвітау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпа̄потта̄па-нікринтанау тану-бгрита̄м\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґовінда-ґа̄на̄мритайх\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄нанда̄мбудгі-вардганайка-ніпунау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кайвалья-ніста̄ракау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде рӯпа-сана̄танау рагу-юґау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-джīва-ґопа̄лакау\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтьяктва̄ тӯрнам ашєша-мандала-паті-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шренīм сада̄ туччха-ват\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгӯтва̄ дīна-ґанешякау каруная\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;каупīна-кантха̄шрітау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґопī-бга̄ва-раса̄мрита̄бдгі-лахарī-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;каллола-маґнау мухур\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде рӯпа-сана̄танау рагу-юґау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-джīва-ґопа̄лакау\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкӯджат-кокіла-хамса-са̄раса-ґана̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кīрне маюра̄куле\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄на̄-ратна-нібаддга-мӯла-вітапа-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-юкта-вринда̄ване\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄дга̄-кришнам ахар-нішям прабгаджатау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джīва̄ртхадау яу муда̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде рӯпа-сана̄танау рагу-юґау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-джīва-ґопа̄лакау\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсанкхʼя-пӯрвака-на̄ма-ґа̄на-натібгіх\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eка̄ла̄васа̄нī-критау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнідра̄ха̄ра-віха̄рака̄ді-віджітау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ча̄тьянта-дīнау ча яу\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄дга̄-кришна-ґуна-смритер мадгуріма̄-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нандена саммохітау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде рӯпа-сана̄танау рагу-юґау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-джīва-ґопа̄лакау\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eра̄дга̄-кунда-тате калінда-таная-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тīре ча вамшівате\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпремонма̄да-вашяд ашєша-дашяя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґрастау праматтау сада̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґа̄янтау ча када̄ харер ґуна-варам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бга̄ва̄бгібгӯтау муда̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде рӯпа-сана̄танау рагу-юґау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-джīва-ґопа̄лакау\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eхе ра̄дге враджа-девīке ча лаліте\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хе нанда-сӯно кутах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-ґовардгана-калпа-па̄дапа-тале\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ка̄ліндī-ваньє кутах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eгошанта̄в іті сарвато враджа-пуре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кхедайр маха̄-віхвалау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде рӯпа-сана̄танау рагу-юґау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-джīва-ґопа̄лакау\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-ohe-harinam-tava-mahima-apara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī На̄ма̄штакам 7 \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eохе харіна̄м, тава махіма̄ апа̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтава паде наті а̄мі корі ба̄ро ба̄ро\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Святе Імʼя! Твоя слава безмежна. Тому знову і знову смиренно вклоняюся до Твоїх лотосових стоп.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґокулер махотсава а̄нанда-са̄ґара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтома̄ра чаране поді хоія ка̄тара\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО вічне свято Ґокули! О океане блаженства! Я падаю до Твоїх лотосових стоп, бо серце моє сповнене тяжкого смутку та тривоги.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтумі кришна, пӯрна-вапу, расера ніда̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтава паде поді тава ґуна корі ґа̄на\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТи є Сам Господь Крішна, Твоє божественне тіло досконале й повне, і Ти є джерелом усіх трансцендентних смаків. Падаючи до Твоїх лотосових стоп, я оспівую Твої божественні якості.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдже коре тома̄р паде ека̄нта а̄шроя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eта̄’ра а̄рті-ра̄ші на̄шя карахо нішчоя\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТи безперечно знищуєш більшість страждань тих, хто шукає прихистку лише у Твоїх святих стопах.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсарва апара̄дга тумі на̄шя кара та̄’ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄ма-апара̄дга̄вадгі на̄шяхо та̄ха̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТи знищуєш усі їх образи, аж до \u003ci\u003eнама-апарадг\u003c/i\u003e — десяти образ у повторенні Святого Імені.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсарва-доша дгаута корі’ та̄ха̄ра хридоя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсімга̄сане байсо тумі парама а̄шроя\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eОмиваючи їх від усіляких нечистот, Ти займаєш престол їх сердець, стаючи для них найвищим притулком.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eаті-рамʼя чід-гана-а̄нанда-мӯртіма̄н\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘расо вай сах’ болі’ веда коре туя ґа̄н\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТи привабливий і прекрасний, втілення повного знання і насиченого блаженства. Веди оспівують Тебе, промовляючи: «Верховна Особа Бога воістину є втіленням усіх трансцендентних смаків».\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгактівінода рӯпа-ґосва̄мī-чаране\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eма̄ґає сарвада̄ на̄ма-спхӯрті сарва-кшане\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eБгактівінод біля лотосових стоп Шріли Рупи Ґосвамі безупинно щомиті благає про пряме одкровення Святого Імені.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-ki-rupe-paibo-seva-mui-durachara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eКі-рӯпе па̄ібо сева̄ \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Нароттам Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкі-рӯпе па̄ібо сева̄ муі дура̄ча̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-ґуру-вайшнаве раті на хоіло а̄ма̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ не маю живої відданої прихильності ні до \u003ci\u003eвайшнавів\u003c/i\u003e, ні до мого Духовного Вчителя. Як же такий негідник, як я, зможе досягти справжнього служіння?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eашєша ма̄яте мана маґана хоіло\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвайшнавете лешя-ма̄тра раті на̄ джанміло\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eМій ум в полоні оманливих думок. Всередині я не маю й найменшої іскри відданості до \u003ci\u003eвайшнавів\u003c/i\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбішоє бгулія андга хоіну діва̄-ніші\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґоле пха̄нса діте пхере ма̄я се пішячī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСхильність марити обʼєктами почуттів осліпила мене. Відьма Майядеві накинула мені на шию зашморг ката.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eма̄яре корія джая чха̄да̄на на джа̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eса̄дгу-крипа̄ віна̄ а̄ро нахіко упа̄я\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eНавіть якщо я зцілю цю сліпоту і здолаю ката Майю, без милості святих відданих мені направду не подолати матеріальної омани.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eадоша дараші-прабгу патіта-уддга̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eеі-ба̄ро нароттаме карахо ніста̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО мій володарю, Ти той, Хто очищує грішних, о спасителю всіх занепалих душ, Тобі байдужі чужі недоліки, тож благаю, врятуй цього Нароттама Даса.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-bhajahu-re-mana-shri-nanda-nandana\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eБгаджаху Ре Мана \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Ґовінда Да̄с Кавіра̄дж\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгаджаху ре мана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-нанда-нандана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;абгая-чарана̄равінда ре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдӯрлабга ма̄нава\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джанама сат-санґе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тарохо е бгава-сіндгу ре\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eМій ум! Служи стопам сина Нанди, прекрасним наче лотоси, адже вони звільнять тебе від усякого страху! Тобі поталанило народитися людиною, тому шукай спілкування із святими — так ти подолаєш цей океан матеріального буття.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшіта а̄тапа\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ба̄та барішана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;е діна джа̄мінī джа̄ґі ре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбіпхале севіну\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;крипана дураджана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чапала сукха-лаба ла̄ґі’ ре\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСпека, холод, буревії та зливи мучать мене вдень і вночі без спочину. Женучись за краплею мерехтливого щастя, я обрік себе служити брехливим і низьким людям.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eе дгана, джаувана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;путра, паріджана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ітхе кі а̄чхе паратīті ре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкамала-дала-джала,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джīвана таламала\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгаджаху харі-пада ніті ре\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯк радіти хорошому здоровʼю, молодості, дітям та рідним, коли життя наче крапля роси, яка тремтить на пелюстці лотоса, готова щомиті зірватися донизу? О ум! Прошу тебе, служи Господнім стопам.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшравана, кīртана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;смарана, вандана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;па̄да-севана, да̄сья ре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпӯджана, сакхī-джана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄тма-ніведана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґовінда-да̄са-абгіла̄ша ре\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТому єдине, до чого прагне Ґовінда Дас, — це долучитися до дев'яти практик служіння Господу: слухати про Нього, оспівувати Його славу, памʼятати про Нього, молитися Йому, поклонятися Його стопам, бути слугою, пропонувати Йому квіти, пахощі та інші підношення, бути Його другом і цілковито присвятити себе Йому.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-manasa-deho-geho-jo-kichu-mora\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eМа̄наса Дехо Ґехо \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eма̄наса, дехо, ґехо, джо кічӯ мора\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eарпілу туя паде, нанда-кішора!\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсампаде віпаде, джīване-маране\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eда̄й мама ґела̄, туя о-пада варане\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eма̄робі ра̄кхобі—джо ічха̄ тоха̄ра̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнітья-да̄са праті туя адгіка̄ра̄\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджанма̄обі моє ічха̄ джаді тора\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгакта-ґрихе джані джанма хау мора\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкīта-джанма хау ятха̄ туя да̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбахір-мукха брахма-джанме на̄хі а̄шя\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгукті-мукті-сприха̄ біхīна дже бгакта\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eлабгайте та̄нка санґа ануракта\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджанака, джананī, доїта, таной\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрабгу, ґуру, паті—туху сарва-мой\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгакатівінода кохе, шюно ка̄на!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄дга̄-на̄тха! туху ха̄ма̄ра пара̄на\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-e-ghora-samsare-podiya-manava\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eЕ гора самсаре \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eКа̄ліда̄с\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eе гора самса̄ре,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;подія ма̄нава\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на па̄я духкхера шєша\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eса̄дгу-санґа корі,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;харі бгаджа джоді,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тобе анта хой клешя\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбішоя анале,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джвалічхе хридая,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;анале боде анал\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eапара̄дга чха̄ді’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лой кришна-на̄ма,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;анале падає джола\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eніта̄і чайтанья,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чарана-камале,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄шроя лоіло джеі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eка̄ліда̄с боле\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джīване маране,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ма̄ра а̄шроя сеі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-dushta-mana-tumi-kisera-vaishnava\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eВайшнава Ке? \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003e“Who is a Real Vaiṣṇava?”\u003c/h3\u003e\n\u003ch4\u003eШрīла Бгактісіддга̄нта Сарасватī Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;душта мана!\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тумі кісера вайшнава?\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпратіштха̄ра торе,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нірджанера горе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тава ‘харіна̄ма’ кевала ‘кайтава’\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджадера пратіштха̄,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шюкарер біштха̄,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джа̄но на̄ кі та̄ха̄ ма̄яр вайбгава\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eканака ка̄мінī,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;діваса-джа̄мінī,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бга̄вія кі ка̄джа, анітья се саба\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтома̄ра канака,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгоґера джанака,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;канакера два̄ре севахо ма̄дгава\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eка̄мінīр ка̄ма,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нахе тава дга̄ма,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄ха̄р—ма̄ліка кевала джа̄дава\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпратіштха̄шя-тару,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джада-ма̄я-мару,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ пела ра̄вана джуджгія ра̄гава\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвайшнавī пратіштха̄,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄те кара ніштха̄,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄ха̄ на̄ бгаджіле лабгібе раурава\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eхаріджана-двеша,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пратістха̄шя-клешя,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кара кено тобе та̄ха̄ра ґаурава\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвайшнавер па̄чхе,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пратістха̄шя а̄чхе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄’те кабгу нахе анітья-вайбгава\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсе харі-самбандга,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шюнья-ма̄я-ґандга,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄ха̄ кобгу ной джадер кайтава\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпратіштха̄-чанда̄лī,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нірджаната̄-джа̄лі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;убгає джа̄ніхо ма̄їка раурава\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкīртана чха̄дібо,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пратіштха̄ ма̄ґібо,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кі ка̄джа дгудія та̄дришя ґаурава\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eма̄дгавендра пурī,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бга̄ва-горе чурі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ коріло кобгу сада̄і джа̄набо\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтома̄ра пратіштха̄,—\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шюкарера біштха̄,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄р-саха сама кабгу на̄ ма̄нава\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eматсарата̄-вашє,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тумі джада-расе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ма’джечо чха̄дія кīртана-сауштава\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eта̄і душта мана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нірджана бгаджан,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;прача̄річо чхоле куйоґī-вайбгава\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрабгу сана̄тане,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;парама джатане,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шікша̄ діло джа̄ха̄, чінто сеі саба\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсеі дуті катха̄,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгуло’ на̄ сарватха̄,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;учайх-сваре кара харі-на̄ма-рава\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпхалґу а̄ро джукта,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;баддга а̄ро мукта,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кабгу на̄ бга̄віхо, ‘ека̄ка̄р’ саба\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eканака-ка̄мінī,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пратіштха̄-ба̄гінī,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ча̄діяче джа̄ре, сеі то’ вайшнава\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсеі ана̄сакта,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сеі шюддга-бгакта,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;самса̄ра татха̄ па̄й пара̄бгава\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eятха̄-джоґʼя бгоґа,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄хі татха̄ роґа,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ана̄сакта сеі, кі а̄ро кахабо\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄сакті-рохіта,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;самбандга-сохіто,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вішоя-самӯха сакалі ма̄дгава\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсе джукта-вайра̄ґʼя,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄ха̄ то’ саубга̄ґʼя,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄ха̄і джадете харір вайбгава\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкīртане джа̄ха̄р,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пратіштха̄-самбга̄р,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄ха̄р сампатті кевала кайтава\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"14\"\u003e\n\u003ch5\u003e14\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвішоя-мумукшу,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгоґер бубгукшу,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ду’є тьяджо мана, дуі авайшнава\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкришнер самбандга,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;апра̄крита-скандга,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кобгу на̄хе та̄ха̄ джадер самбгава\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"15\"\u003e\n\u003ch5\u003e15\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eма̄ява̄дī джана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кришнетара мана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мукта абгіма̄не се нінде вайшнава\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвайшнавера да̄са,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тава бгакті-а̄шя,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кено ва̄ да̄кічо нірджана-а̄хава\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"16\"\u003e\n\u003ch5\u003e16\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдже пхалґу-вайра̄ґī,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кохе нідже тьяґī,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;се на̄ па̄ре кобгу хоіте вайшнава\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхарі-пада чха̄ді’,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нірджаната̄ ба̄ді,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лабгія кі пхол, пхалґу се вайбгава\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"17\"\u003e\n\u003ch5\u003e17\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eра̄дга̄-да̄сьє рохі,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чха̄ді бгоґа-ахі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пратіштха̄шя нахе кīртана-ґаурава\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄дга̄-нітья-джана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄ха̄ чха̄ді мана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кено ва̄ нірджана-бгаджана-кайтава\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"18\"\u003e\n\u003ch5\u003e18\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвраджа-ва̄сī-ґана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;прача̄рака-дгана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пратіштха̄-бгікшука та̄ра̄ нахе шява\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпра̄на а̄чхе та̄ра,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;се-хету прача̄ра,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пратіштха̄шя-хīна-‘кришна-ґа̄тха̄’ саба\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"19\"\u003e\n\u003ch5\u003e19\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-даїта-да̄са,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кīртанете а̄шя,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кара учайх-сваре харіна̄ма рава\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкīртана-прабга̄ве,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;смарана свабга̄ве,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;се ка̄ле бгаджана-нірджана самбгава\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-emona-durmati-samsara-bhitore\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eДайньятміка̄ \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(прабгу хе!)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eемона дурматі,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;самса̄ра бгіторе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;подія а̄чхіну а̄мі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтава ніджа-джана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;коно маха̄джане,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;па̄тха̄ія діле тумі\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Господь! Мій порочний ум полонив мене у світі народжень та смерті, але один з Твоїх чистих та піднесених відданих прийшов, щоб врятувати мене.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдая корі море,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;патіта декхія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кохіло а̄ма̄ре ґія\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eохе дīна-джон,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шюно бга̄ло катха̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;улласіта хо’бе хія\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВін побачив мене таким нікчемним та жалюгідним, що проявив співчуття і підійшов зі словами: «О смиренна душе, будь ласка, послухай цю добру звістку, і твоє серце зрадіє».\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтома̄ре та̄ріте,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-кришна-чайтанья,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;набадвīпе авата̄р\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтома̄ хено кото,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дīна хīна джоне,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;корілена бгава-па̄р\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e«Щоб врятувати тебе, Шрі Крішна Чайтанья явився на землі Набадвіпи. Він безпечно переправив багато таких же нещасних душ, як і ти, через океан мирського існування».\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eведера пратіґʼя,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄кхіба̄ра торе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;рукма-варна віпра-сута\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмаха̄прабгу на̄ме,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;надīя ма̄та̄я,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сонґе бга̄і авадгӯта\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e«Щоб виконати пророцтво Вед, син \u003ci\u003eбрахмана\u003c/i\u003e на імʼя Махапрабгу, з тілом золотого кольору, зійшов разом зі Своїм братом, \u003ci\u003eавадгутом\u003c/i\u003e Нітьянандою. Разом Вони затопили На́дію божественним щастям».\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнанда сута джіні,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чайтанья ґоса̄і,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ніджа-на̄ма корі’ да̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eта̄ріло джаґат,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тумі-о джа̄ія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лохо ніджа-парітра̄на\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e«Шрі Чайтанья, Крішна Власною персоною, син Нанди, врятував світ, вільно даруючи Своє власне Святе Імʼя. Тож і ти отримай своє звільнення!»\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсе катха̄ шюнія,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄сіячхі, на̄тха!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тома̄ра чарана-толе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгакатівінода,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ка̄ндія ка̄ндія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄пана-ка̄хінī боле\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Господь, почувши ці слова, Бгактівінод зі сльозами припав до Твоїх стоп лотосів і ділиться історією свого життя.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-ki-jani-ki-bale-tomara-dhamete\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eҐоптритве Варана \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкі джа̄ні кі бале,\u0026nbsp;\u0026nbsp;\u0026nbsp;тома̄ра дга̄мете,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хоіну шярана̄ґата\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтумі даямой,\u0026nbsp;\u0026nbsp;\u0026nbsp;патіта-па̄вана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;патіта-та̄ране рата\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгараса̄ а̄ма̄ра,\u0026nbsp;\u0026nbsp;\u0026nbsp;еі ма̄тра на̄тх!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тумі то’ каруна̄моя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтава дая па̄тра,\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄хі мора сама,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;авашья гуча̄ре бгая\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄ма̄ре та̄ріте,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ка̄ха̄ро шякаті,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;аванī-бгіторе на̄хі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдаяла тха̄кура!\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;гошана̄ тома̄ра,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;адгама па̄маре тра̄хі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсакала чха̄дія,\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄сіячхі а̄мі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тома̄ра чаране на̄тха!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄мі нітья-да̄са,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тумі па̄лаїта̄,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тумі ґопта̄, джаґанна̄тха!\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтома̄ра сакала,\u0026nbsp;\u0026nbsp;а̄мі ма̄тра да̄са,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ма̄ра та̄рібе тумі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтома̄ра чарана, коріну варана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ма̄ра нахі то’ а̄мі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгакатівінода,\u0026nbsp;\u0026nbsp;ка̄ндія шярана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ло’єчхе тома̄ра па̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкхомі апара̄дга,\u0026nbsp;\u0026nbsp;на̄ме ручі дія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;па̄лана карахе та̄я\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-bhuliya-tomare-samsare-asiya\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eДайнья \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгулія тома̄ре,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;самса̄ре а̄сія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пеє на̄на̄бідга бʼятха̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтома̄ра чаране\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄сіячхі а̄мі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;болібо духкхера катха̄\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджананī-джотхоре,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чіла̄ма джокхон,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вішама вандгана-па̄шє\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eекаба̄ра прабгу!\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;декха̄ дія море,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ваньчіле е дīна да̄се\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтокхона бга̄віну,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джанама па̄ія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;корібо бгаджана тава\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджанама хоіло,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;поді ма̄яджа̄ле\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ хоіло ґʼяна-лаба\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄дарера челе.\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сваджанера коле,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ха̄сія ка̄та̄ну ка̄ла\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджанака-джананī-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;снехете бгулія\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;самсара ла̄ґіло бга̄ло\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкраме діна діна,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ба̄лака хоія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кхеліну ба̄лака саха\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄ро кічху діне,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґʼяна упаджіло,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;па̄тха поді ахарахах\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eідьяра ґаураве,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бграмі дешє дешє,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дгана упа̄рджана корі’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсваджана-па̄лана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;корі ека мане,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгуліну тома̄ре, харі!\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eва̄рдгакʼє екхона,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгакатівінода,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ка̄ндія ка̄тара аті\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄ бгаджія торе,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;діна вритха̄ ґело,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;екхон кі хо’бе ґаті!\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hari-he-prapanche-podiya-agati-hoiya\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eБгаджан-Ла̄ласа̄ \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eхарі хе!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрапаньче подія,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;аґаті хоія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ декхі упа̄я а̄ро\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eаґатіра ґаті,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чаране шярана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тома̄я коріну са̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкарама ґеяна,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кічху на̄хі мора,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;са̄дгана бгаджана на̄і\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтумі крипа̄-моя,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄мі то’ ка̄нґа̄ла,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ахайтукī крипа̄ чха̄і\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eва̄кʼя-мано-веґа,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кродга-джіхва̄-веґа,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;удара-упастха-веґа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмілія е саба,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;самса̄ре бга̄са̄є,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дітече парамодвеґа\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eонека джатане,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;се саба дамане,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ча̄діячі а̄шя а̄мі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eана̄тхера на̄тха!\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;да̄кі тава на̄ма,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;екхона бгараса̄ тумі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hari-hari-biphole-janama-goyainu\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eІшта-деве Віґʼяпті \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Нароттам Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eхарі харі!\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;біпхоле джанама ґояіну\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eманушʼя-джанама па̄ія,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄дга̄-кришна на̄ бгаджія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джа̄нія шюнія біша кха̄іну\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґолокера према-дгана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;харіна̄ма-санкīртана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;раті на̄ джанміло кено та̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсамса̄ра-біша̄нале,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;діва̄-ніші хія джвале,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джуда̄іте на̄ коіну упа̄я\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвраджендра-нандана джеі,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шячī-сута хоіло сеі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;балара̄ма хоіло ніта̄і\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдīна-хīна джата чхіло,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;харіна̄ме удга̄ріло,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄ра шякши джаґа̄і ма̄дга̄і\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eха̄ ха̄ прабгу нанда-сута,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вришабга̄ну-сута̄-джута,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;каруна̄ карахо еі-ба̄ро\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнароттама-да̄са кой,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ тхеліхо ра̄нґа̄ па̄й,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тома̄ біне ке а̄чхе а̄ма̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-atma-nivedana-tuya-pade-kori\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eА̄тма-ніведана \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄тма-ніведана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;туя паде корі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хоіну парама сукхī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдухкха дӯре ґело,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чінта̄ на̄ рохіло,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чаудіке а̄нанда декхі\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ відчув найвищу радість, коли вручив себе Твоїм святим лотосовим стопам. Смуток відступив, тривоги зникли. Тепер я бачу радість звідусіль.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eашока-абгая,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;амрита-а̄дга̄ра,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тома̄ра чарана-двая\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eта̄ха̄те екхона,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вішра̄ма лобгія\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чха̄діну бгавера бгая\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТвої дві стопи-лотоси — це осередок нектару безсмертя, де живуть вільними від страждань і страху. Тепер я знайшов там спокій і відкинув жах перед цим світом.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтома̄ра самса̄ре,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;корібо севана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нахібо пхалера бга̄ґī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтава сукха джа̄хе,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;корібо джатана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хо’є паде анура̄ґī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ служитиму в Твоєму домі й не шукатиму насолоди у плодах цього служіння. Я намагатимусь робити тільки те, що до вподоби Тобі, цілковито відданий Твоїм лотосовим стопам.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтома̄ра сева̄я,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;духкха хоя джато,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сео то’ парама сукха\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсева̄-сукха-духкха,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;парама сампада\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄шоє авідья-духкха\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТруднощі, які приходять у служінні, стануть для мене джерелом великої радості. У відданому служінні Тобі і радість, і страждання — однаково велике багатство. І те, й інше позбавляє від невігласних страждань.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпӯрва ітіха̄са,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгуліну сакала,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сева̄-сукха пе’є мане\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄мі то’ тома̄ра,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тумі то’ а̄ма̄ра,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кі ка̄джа апара дгане\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ зовсім забув усе своє минуле, бо в моєму умі зʼявилася велика радість. Я безумовно належу Тобі, а Ти по-справжньому — мій. Навіщо ж мені інші скарби?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгакатівінода,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄нанде дубія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тома̄ра сева̄ра торе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсаба чешта̄ коре,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тава ічха̄-мата,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тха̄кія тома̄ра горе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eБгактівінод, занурений в океан духовної радості, віддає всі свої сили служінню Тобі й живе в Твоєму домі так, як Ти того бажаєш.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-amara-jivana-sada-pape-rata\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eА̄ма̄ра джīвана \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄ма̄ра джīвана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сада̄ па̄пе рата,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄хіко пуньєра лешя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпорере удвеґа,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;діячхі дже кото,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;діячхі джīвере клешя\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eУсе моє життя пронизане гріхами \u003cbr /\u003eі навіть краплі доброчестя в ньому не знайти.\u003cbr /\u003eДля інших душ я - джерело страждання.\u003cbr /\u003eЛише турботи й біль я зміг їм принести.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eніджа сукха ла̄ґі’,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;па̄пе на̄хі дорі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дая-хīна сва̄ртха-паро\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпара-сукхе духкхī,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сада̄ мітхʼя-бга̄ши,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пара-духкха сукха-кара\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eДля власної утіхи я неприховано гріхи творив.\u003cbr /\u003eНе здатний співчувати - себе я ставив вище інших.\u003cbr /\u003eЯ потонув в брехні. Страждаю я від радості у ближніх,\u003cbr /\u003eа насолоджуюсь - смакуючи їх біль.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eашєша ка̄мана̄,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хриді ма̄джге мора,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кродгī, дамбга-пара̄яна\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмада-матта сада̄,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вішоє мохіта,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хімса̄-ґарва вібгӯшана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВ бездонну прірву для бажань перетворилось моє серце.\u003cbr /\u003eЯ повен гніву та пихи, пʼянить мене від марнославства.\u003cbr /\u003eЯ збитий з пантелику від чуттєвих насолод.\u003cbr /\u003eЖорстокість та гординя - ось мої прикраси.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнідра̄ласья хата,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сука̄рдже вірата,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ака̄рдже удьйоґī а̄мі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпратіштха ла̄ґія,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шятхʼя-а̄чарана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лобга-хата сада̄ ка̄мī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСпустошений від ліні й сну, я відкидаю всяке благочестя \u003cbr /\u003eта з особливою жагою прагну до творіння зла.\u003cbr /\u003eБрехнею здобуваю я мирські повагу й славу.\u003cbr /\u003eЯ - жадібності жертва і похоті постійний раб.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eе хено дурджана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;саджджана-варджіта,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;апара̄дгі нірантара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшюбга-ка̄рджа-шюнья,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сада̄нартха-мана̄х,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄на̄ духкхе джара джара\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТакий порочний грішник відторгнутий благочестивим людом.\u003cbr /\u003eНаповнений зневагами, позбавлений благодіянь,\u003cbr /\u003eзавжди у настрої «тільки собі й для себе»,\u003cbr /\u003eослаблений від безлічі страждань.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eба̄рдгакʼє екхона,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;упа̄я-віхīна,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄’те дīна акіньчана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгакатівінода,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;прабгура чаране,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;коре духкха ніведана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВідтак, Бгактівінод на старості років \u003cbr /\u003eпозбавлений відрад, принижений й злиденний,\u003cbr /\u003eдо лотосових стоп Верховного Владики \u003cbr /\u003eпідносить зі смиренням печальну повість своїх літ.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-tumi-sarveshvareshvara-vrajendra-kumara\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eТумі сарвешварешвара \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтумі сарвешварешвара, враджендра-кума̄ра!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтома̄ра іча̄я вішве сриджана самга̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтава ічха̄-мато брахма̄ корена сриджана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтава ічха̄-мато вішну корена па̄лана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтава ічха̄-мате шіва корена самга̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтава ічха̄-мате ма̄я сридже ка̄ра̄ґа̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтава ічха̄-мате джīвер джанама-марана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсамриддгі-ніпа̄та духкха сукха-сангатана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмічхе ма̄я-баддга джīва а̄шя-па̄шє пхіре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтава ічха̄ віна̄ кічху коріте на̄ па̄ре\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтумі то’ ракшака а̄ро па̄лака а̄ма̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтома̄ра чарана віна̄ а̄шя на̄хі а̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eніджа-бала-чешта-праті бгараса̄ чха̄дія\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтома̄ра іча̄я а̄чі нірбгара корія\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгакатівінода аті дīна акіньчана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтома̄ра іча̄я та̄’ра джīвана марана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-sarvasva-tomara-charane-sanpiya\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eСарвасва тома̄ра \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсарвасва тома̄ра,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чаране санпія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;подечхі тома̄ра горе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтумі то’ тха̄кур,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тома̄ра куккур,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;болія джа̄нахо море\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eба̄ндгія нікате,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ма̄ре па̄лібе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;рохібо тома̄ра два̄ре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпратīпа-джонере,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄сіте на̄ дібо,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄кхібо ґодера па̄ре\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтава ніджа-джана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;праса̄д севія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;уччхішта ра̄кхібе джа̄ха̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄ма̄ра бгоджана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;парама-а̄нанде,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;праті-діна хобе та̄ха̄\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбосія шюія,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тома̄ра чарана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чінтібо сатата а̄мі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄чіте на̄чіте,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нікате джа̄ібо,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джокхона да̄кібе тумі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eніджера пошана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кобгу на̄ бга̄вібо,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;рохібо бга̄вера бгоре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгакатівінода,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тома̄ра па̄лака,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;болія варана коре\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-tatala-saikate-vari-bindu-sama\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eТа̄тала Сайкате \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Відьяпаті\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eта̄тала сайкате\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ва̄рі бінду-сама\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сута-міта-раманī-сама̄дже\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтохе вісарі мана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄хе самарпала\u003c/strong\u003e\u003cbr\u003e\n\u003cstron
