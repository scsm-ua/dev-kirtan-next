ass=\"song\" id=\"song-nadiya-godrume-nityananda-mahajana\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eА̄ґʼя-Тахал \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнадīя-ґодруме нітьянанда маха̄джана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпа̄тіячхе на̄ма-хатта джівера ка̄рана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eУ Надії, на острові Ґодрума, великодушний Господь Нітьянанда заснував Ринок Святого Імені, щоб дарувати визволення усім провинним душам.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e(шраддга̄ва̄н джон хе, шраддга̄ва̄н джон хе)\u003cbr\u003e\n\u003cstrong\u003eпрабгура а̄ґʼяя, бга̄і, ма̄ґі еі бгікша̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eболо ‘кришна,’ бгаджо кришна, кара кришна-шікша̄\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eУсі, хто має віру! Усі, хто має віру! Браття, за повелінням Господа Ґауранґи я благаю вас: повторюйте Імʼя Крішни, поклоняйтеся Крішні та обдаровуйте інших знаннями про Крішну!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eапара̄дга-шюнья хо’є лоха кришна-на̄ма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкришна ма̄та̄, кришна піта, кришна дгана-пра̄на\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eУважно дбаючи про те, щоб уникати образ, просто прийміть Святе Імʼя Господа Крішни! Крішна — ваша мати, Крішна — ваш батько, Крішна — скарб вашого життя!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкришнера самса̄ра кара чха̄ді’ ана̄ча̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджīве дая, кришна-на̄ма – сарва-дгарма-са̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eОблиште усі гріховні вчинки і виконуйте мирські обовʼязки, повʼязуючи їх із Господом Крішною! Прояв співчуття до інших душ через оспівування Святого Імені Крішни — суть усіх форм релігії!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-nitai-pada-kamala-koti-chandra-sushitala\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eМанах-Шікша̄ \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Нароттам Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eніта̄і-пада-камала,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;котī-чандра-сушітала,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дже чха̄яя джаґата джуда̄й\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхено ніта̄і біне бга̄і,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄дга̄-кришна па̄іте на̄і,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дридга корі дгаро ніта̄іра па̄я\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСвяті лотосові стопи Нітая, прохолодні, немов десять мільйонів місяців. У їхній тіні весь світ знаходить заспокоєння і полегшення. Без цього Нітая, о брате, ніхто не зможе досягти Радги і Крішни. Тож впевнено й міцно тримайся Його стоп-лотосів.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсе самбандга на̄хі джа̄ра,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вритха̄ джанма ґело та̄ра,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сеі пашю бодо дура̄ча̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніта̄і на̄ боліло мукхе,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;маджіло самса̄ра-сукхе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;відья-куле кі корібе та̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eХто не зміг знайти зв’язку з Ним, прожив своє життя намарно. Така істота - мов лиха тварина. Ні ученість, ні шляхетне походження не врятують того, хто потонув у мирських утіхах і чиї вуста ніколи не кликали: «Нітай!».\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eаханка̄ре матта хоія, ніта̄і-пада па̄сарія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;асатьєре сатья корі ма̄ні\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніта̄ієр каруна̄ хабе, врадже ра̄дга̄-кришна па̄бе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дгаро ніта̄ієр чаран ду’ кха̄ні\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЗасліплений гординею, забувши про лотосові стопи Нітая, я приймаю обман за істину. Але коли Нітай обдарує Своєю милістю, ти досягнеш Радги і Крішни у Враджі. Тому міцно пригорнися до лотосових стоп Нітая.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eніта̄ієр чарана сатья, та̄нга̄ра севака нітья,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ніта̄і-пада сада̄ кара а̄шя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнароттама бодо духкхī, ніта̄і море кара сукхī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄кхо ра̄нґа̄-чаранера па̄шя\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЛотосові стопи Нітая — це істина, а Його слуги — вічні. Завжди прагни знайти прихисток біля Його стоп. О Нітай, зроби мене щасливим, прошу, завжди тримай мене біля Своїх прекрасних лотосових стоп.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-dhana-mora-nityananda-pati-mora\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eСва-Ніштха \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Нароттам Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдгана мора нітьянанда\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;паті мора ґаурачандра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пра̄на мора джуґала-кішора\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eадвайта а̄ча̄рʼя бала\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґада̄дгара мора кула\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нарахарі віласай мора\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвайшнавера пада-дгӯлі\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄хе мора сна̄на-келі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тарпана мора вайшнавера на̄ма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвіча̄ра корія мане\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгакті-раса а̄сва̄дане\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мадгʼястха шрī-бга̄ґавата пура̄на\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвайшнавера уччхішта\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄хе мора мано-ніштха\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вайшнавера на̄мете улла̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвринда̄ване чатура̄\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄хе мора мано-гера̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кохе дīне нароттама да̄са\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-nitai-gunamani-amara-nitai-gunamani\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eНіта̄і ґунамані а̄ма̄ра \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Лочан Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eніта̄і ґунамані а̄ма̄ра ніта̄і ґунамані\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄нія премера ванья бга̄са̄ла абанī\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпремаванья лоє ніта̄і а̄іла ґа̄уда дешє\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдубіло бгаката-ґана дīнахīна бга̄се\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдīнахīна патіта па̄мара на̄хі ба̄чхе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбрахма̄ра дурлабга према саба̄ка̄ре джа̄че\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄баддга каруна̄-сіндгу ка̄тія муха̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eгоре горе буле према-аміяра ба̄на\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eлочан боле хено ніта̄і джеба̄ на̄ бгаджіло\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджа̄нія шюнія сеі а̄тмага̄тī хоіло\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-akrodha-paramananda\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eАкродга парама̄нанда \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Лочан Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eакродга парама̄нанда нітьянанда ра̄й\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eабгіма̄на-шюнья ніта̄і наґаре беда̄й\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eНе знаючи гніву та безмежно щасливий, Нітьянанда крокує!\u003cbr /\u003eБез гордині та пихи, Нітай містами мандрує.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eадгама патіта джīвер два̄ре два̄ре ґія\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхаріна̄ма маха̄мантра дена біла̄ія\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВід дверей до дверей домівок оманутих душ, Він прямує:\u003cbr /\u003eХаре Крішна \u003ci\u003eмаха-мантру\u003c/i\u003e вільно всім дарує!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджа̄ре декхе та̄ре кохе данте трина корі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄ма̄ре кінія лохо бгаджа ґаурахарі\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСмиренно, з соломинкою в зубах, усіх, кого бачить, Він благає:\u003cbr /\u003eПрийміть Господа Ґаурахарі, й Моє серце вашим стане, обіцяю.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eета болі’ нітьянанда бгӯме ґоді джа̄й\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсона̄ра парвата джена дгӯла̄те лота̄й\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПісля слів цих Нітьянанда на землю припадає,\u003cbr /\u003eяк гора золота, Він в пилюці катає.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eхено авата̄ре джа̄ра раті на̄ джанміло\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eлочан боле сеі па̄пī ело а̄ра ґело\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eХто не полюбив такого чудового Нітьянанду - \u003cbr /\u003eЛочан каже: грішник цей народився й помре задарма.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-parama-karuna-pahu-dui-jana\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Шрī Ґаура-Нітьянандер Дая \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Лочан Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпарама каруна,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;паху дӯі джана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ніта̄і ґаурачандра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсаба авата̄ра-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;са̄ра шіромані,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кевала а̄нанда-канда\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгаджа бгаджа бга̄і,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чайтанья ніта̄і,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;судридга бішва̄са корі’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвішоя чха̄дія,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;се расе маджія\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мукхе боло харі харі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдекхо оре бга̄і,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;трі-бгуване на̄і\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;емона даяла да̄та̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпашю па̄кхī джгуре,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;па̄ша̄на відоре,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шюні джа̄ра ґуна-ґа̄тха̄\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсамса̄ре маджія,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;рохілі подія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;се паде нахіло а̄шя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄пана карама,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгуньджа̄є шямана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кохоє лочана-да̄са\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-dayal-nitai-chaitanya-bole-nach-re\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eДаял Ніта̄і Чайтанья \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘даял ніта̄і чайтанья’ бо’ле на̄ч ре а̄ма̄р ман\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄ч ре а̄ма̄р ман, на̄ч ре а̄ма̄р ман\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО мій уме, просто танцюй! О мій уме, просто танцюй! О мій уме, благаю, танцюй і повторюй: «Даял Нітай Чайтанья!»\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e(емон даял то на̄і хе, ма̄р кхеє према дей)\u003cbr\u003e\n(табе)\u003cstrong\u003e апара̄дга дӯре джа̄бе, па̄бе према-дган\u003c/strong\u003e\u003cbr\u003e\n(апара̄дгера-віча̄ра то на̄і хе)\u003cbr\u003e\n\u003cstrong\u003eтакхон кришна-на̄ме ручі хабе, гучібе бандган\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eМилосердю Нітьянанди Прабгу немає меж. Його побили Джаґай та Мадгай, але незважаючи на це Він дарував їм любов до Господа.\u003cbr\u003e\nКоли ти звільнишся від зневаг, то отримаєш любов до Господа. Але Святі Імена Чайтаньї та Нітая настільки милостиві, що для них навіть зневаги не мають значення. Коли в твоєму серці зʼявиться смак до Святого Імені Крішни, твоя привʼязаність до цього світу зникне.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e(анура̄ґ то хабе хе)\u003cbr\u003e\n\u003cstrong\u003eтокхон ана̄ясе сапхал хабе джīвера джīван\u003c/strong\u003e\u003cbr\u003e\n(кришна-раті віна̄ джīван то мічхе хе)\u003cbr\u003e\n\u003cstrong\u003eшєше вринда̄ване ра̄дга̄-шьямер па̄бе дарашян\u003c/strong\u003e\u003cbr\u003e\n(ґаура-крипа̄ холе хе)\u003c/p\u003e\n\u003cp class=\"translation\"\u003eКоли жива істота має привʼязаність до Святого Імені Крішни, вона дуже легко досягає найвищого успіху. Без цієї прив’язаності життя стає порожнім та марним. Якщо ж на тебе зійде милість Господа Ґаури, то зрештою тобі відкриється прекрасне видіння Радги і Шьями у Вриндавані.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eПісні, присвячені Шрі Чайтаньї Маха̄прабгу\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-gaurangera-duti-pada-jar-dhana-sampada\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eСа̄варана-Шрī-Ґаура-махіма̄ \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Нароттам Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґаура̄нґера дуті пада,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джа̄р дгана сампада,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;се джа̄не бгакаті-раса-са̄р\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґаура̄нґера мадгура-лīла̄,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джа̄р карне правешіла̄,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хридоя нірмала бгело та̄р\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдже ґаура̄нґера на̄ма лой,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄ра хой премодой,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄ре муі джа̄і боліха̄рі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґаура̄нґа-ґунете джгуре,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нітья-лīла̄ та̄ре спхуре,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;се джана бгакаті-адгіка̄рī\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґаура̄нґера санґі-ґане, нітья-сіддга корі ма̄не,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;се джа̄й враджендра-сута-па̄ш\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-ґауда-мандала-бгӯмі, джеба̄ джа̄не чінта̄мані,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄ра хой враджа-бгӯме ба̄с\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґаура-према-раса̄рнаве,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;се таранґе джеба̄ дубе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;се ра̄дга̄-ма̄дгава-антаранґа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґрихе ва̄ ванете тха̄ке,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘ха̄ ґаура̄нґа’ бо’ле да̄ке,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нароттама ма̄ґе та̄ра санґа\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gaura-pahu-na-bhajiya-mainu\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eҐаура̄ Паху \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Нароттам Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґаура̄ паху на̄ бгаджія майну\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрема ратана-дгана хела̄я ха̄ра̄іну\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eадгане джатана корі дгана тея-ґіну\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄пана карама доше а̄пані дувіну\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсат-санґа чха̄ді коіну асате віла̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eте-ка̄ране ла̄ґіло дже карма-бандга-пха̄нса\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвішоя-бішама-біша сатата кха̄іну\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґаура-кīртана расе маґана на̄ хоіну\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкено ба̄ а̄чхає пра̄на кі сукха ла̄ґія\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнароттама да̄са кено на̄ ґело морія\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-avatara-sara-gora-avatara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eАвата̄ра Са̄ра \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Лочан Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eавата̄ра са̄ра\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґора̄ авата̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кено на̄ бгаджілі та̄нре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкорі нīре ва̄са ґело на̄ піяса\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄пана карама пхере\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВтілення Шрі Ґаури найкраще серед усіх втілень! Чому ж я не поклонявся Йому? Ніби оточений джерельною водою, я, замість того, щоб втамувати пекельну спрагу, продовжував страждати, повернувшись до діяльності заради плодів.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eканта-кера тару\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сада̄і себілі (мана)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;амрита па̄’ба̄ра а̄шє\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрема-калпатару\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī ґаура̄нґа а̄ма̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄ха̄ре бгабілі біше\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ пережовував колючки з дерева мирського життя та ковтав кров, яка наповнювала мій рот, вважаючи її нектаром. Коли ж мені запропонували плоди з дерева бажань любові Господа Ґауранги, то я відмовився від них, вважаючи, що це отрута.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсаура-бгера а̄шє\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пала̄шя шюнкілі (мана)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄са̄те пашіло кīта\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘ікшу-данда’ бга̄ві’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ка̄тха чушилі (мана)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кемоне па̄ібі мітха\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eШукаючи солодкий аромат, я нюхав щось схоже на пахучу квітку. Але вона не мала запаху, як не має запаху квітка \u003ci\u003eпалашя\u003c/i\u003e. Натомість з неї вилетів ґедзь і вкусив мене за носа. Я намагався насолодитися нектаром мирського життя, помилково вважаючи його солодким, як сік цукрової тростини. Натомість я ніби жував сухе дерево. Так всі мої спроби насолоди виявились марними.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘ха̄ра’ болія\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґола̄я парілі (мана)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шямана кінкора са̄па\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘шітала’ болія\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ґуна поха̄лі (мана)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;па̄ілі баджара-та̄па\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВизнавши поразку, змучений та безсилий, я очікую змію смерті. Жар матеріального життя я прийняв за заспокійливу прохолоду. Замість неї я отримав нестерпне страждання, як від удару громом.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсамса̄ра бгаджілі\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-ґаура̄нґа бгулілі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ шюнілі са̄дгура катха̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eіха-парака̄ла\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дука̄ла кхоялі (мана)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кха̄ілі а̄пана ма̄тха̄\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПрисвятивши себе сімʼї та мирському життю, я забув Господа Ґауранґу і не прийняв настанови святих. Тепер, коли мої дні злічено, я розумію, що помираю вдруге. Перший раз я загинув, коли марно стратив життя на потурання чуттєвим насолодам.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gay-gora-madhur-svare\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī На̄ма \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґа̄й ґора̄ мадгур сваре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхаре кришна харе кришна, кришна кришна харе харе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхаре ра̄ма харе ра̄ма, ра̄ма ра̄ма харе харе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eГосподь Ґаурасундар солодко співає:\u003cbr /\u003e«Харе Крішна Харе Крішна, Крішна Крішна Харе Харе, Харе Рама Харе Рама, Рама Рама Харе Харе».\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґрихе тха̄ко, ване тха̄ко, сада̄ ‘харі’ боле’ да̄ко,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсукхе духкхе бгуло на̄ко, вадане харіна̄м кара ре\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЧи вправний господар ти, чи відлюдник у лісі - завжди співай Святе Імʼя Господа. Чи у радості, чи в смутку - не забувай співати Святе Імʼя та наповнювати свої уста Харінамом.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eма̄я-джа̄ле баддга хо’є, а̄чхо мічхе ка̄джа ло’є,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eекхона о четана пеє, ра̄дга̄-ма̄дгава-на̄м боло ре\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЗвʼязаний путами \u003ci\u003eмайї\u003c/i\u003e, ти став її рабом і трудився даремно. Але зараз, маючи людське тіло та свідомість, співай Імʼя Господа - Радга-Мадгави.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджīвана хоіло шєша, на̄ бгаджіле хришикешя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгактівінод-упадешя, екба̄р на̄м-расе ма̄то ре\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЖиття це скоро мине, а ти досі не поклоняєшся Хришикеші, володарю чуттів. Бгактівінод радить: «Хоча б один раз відчуй смак \u003ci\u003eнама-раси\u003c/i\u003e - нектар Святого Імені».\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-kobe-gaura-vane-suradhuni-tate\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eСіддгі-Ла̄ласа̄ \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкобе ґаура-ване,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сурадгунī-тате,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘ха̄ ра̄дге ха̄ кришна’ бо’ле\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eка̄ндія беда̄бо,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дехо-сукха чха̄ді’,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄на̄ лата̄-тару-толе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшва-пача-ґрихете,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ма̄ґія кха̄ібо,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пібо сарасватī-джала\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпуліне пуліне\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґада̄-ґаді дібо,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;корі’ кришна-кола̄холо\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдга̄ма-ва̄сī джане,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пранаті корія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ма̄ґібо крипа̄ра лешя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвайшнава-чарана-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;рену ґа̄я ма̄кхі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дгарі’ авадгӯта-вешя\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґауда-враджа-бане,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгеда на̄ херібо,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хоібо вараджа-ва̄сī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдга̄мера сварӯпа,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;спхурібе наяне,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хоібо ра̄дга̄ра да̄сī\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-kali-ghora-timire-garasala-jagajana\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eКалі-гора тіміре \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Наяна̄нанда Да̄с\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкалі-гора тіміре\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґарасала джаґаджана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дгарама карама баху-дӯра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eаса̄дгане чінта̄мані\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;відгі міла̄ола а̄ні\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґора̄ бодо даяла тха̄кура\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбга̄і ре бга̄і!\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґора̄ ґуна кохоне на̄ джа̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкото шята-а̄нана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кото чатур-а̄нана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;боронія ора на̄хі па̄я\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eча̄рі веда шад-дара-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шяна корі адгʼяяна\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;се джаді ґаура̄нґа на̄хі бгадже\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвритха̄ та̄ра адгʼяяна\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лочана віхīна джана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дарпане андге кіба̄ ка̄дже\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eведа відья дуі\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кічуі на̄ джа̄ната\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;се джаді ґаура̄нґа джа̄не са̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнаяна̄нанда бгоне\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сеі то сакалі джа̄не\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сарва-сіддгі каратале та̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jadi-gaura-na-hoto-tobe-ki-hoito\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eДжаді Ґаура на̄ хо’то \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Ва̄судева Гоша\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджаді ґаура на̄ хо’то,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тобе кі хоіто,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кемоне дгоріта̄м де\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄дга̄ра махіма̄\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;према-раса-сīма̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джаґате джа̄на̄та ке?\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмадгура вринда̄,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;віпіна ма̄дгурī,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;правешя ча̄турī са̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвараджа-юватī,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бга̄вера бгакаті,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шякаті хоіто ка̄ра?\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґа̄о пунах пунах,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґаура̄нґера ґуна,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сарала корія мана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eе бгава-са̄ґаре,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;емона даяла,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ декхіє ека-джана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґаура̄нґа болія,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ ґену ґолія\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кемоне дгоріну де\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eва̄сур хія,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;па̄ша̄на дія\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кемоне ґодіячхе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-emona-gauranga-bine-nahi-ara\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eЕмона Ґаура̄нґа біне на̄хі а̄ра \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Према̄нанда Да̄с\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;емона ґаура̄нґа біне на̄хі а̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхено авата̄ра\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хобе кі хоєчхе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хено према парача̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдураматі аті\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;патіта па̄шандī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пра̄не на̄ ма̄ріло коре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхаріна̄ма діє\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хридоя шодгіло\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джачі ґія горе горе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгава біріньчіра\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ва̄ньчіто дже према\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джаґата пхеліло дга̄лі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eка̄нґа̄ле па̄ія\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кха̄-іло на̄чіє\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ба̄джа̄іє карата̄лі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eха̄сіє ка̄ндіє\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;преме ґада̄ґаді\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пулаке бʼяпіло анґа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчанда̄ле бра̄хмане\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;коре кола̄кулі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кобе ба̄ чхіло е ранґа\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eда̄кіє ха̄нкіє\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кхол карата̄ле\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґа̄іє дга̄іє пхіре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдекхія шямана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тара̄са па̄іє\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;капа̄та ха̄ніло два̄ре\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eе тіна бгувана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄нанде бгоріло\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;утхіло манґала сора\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкохе према̄нанда\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;емона ґаура̄нґа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;раті на̄ джанміло мора\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-ke-jabi-ke-jabi-bhai-bhava-sindhu-para\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eКе джабі ке джабі \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Лочан Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eке джабі ке джабі бга̄і бгава-сіндгу па̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдганья калі-юґе ре чайтанья авата̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄ма̄ра ґаура̄нґера га̄те уджа̄накхея бой\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкадіпа̄ті на̄хі ла̄ґе амані па̄ра хой\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eхаріна̄мера тарīкха̄ні шрī-ґуру-ка̄нда̄рī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсанкīртана-керояла ду’баху паса̄рі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсарва-джīва уддга̄ра хоіло премера ба̄та̄се\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eлочана падія роіло карамера доше\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vimala-hemajin-tanu-anupama-re\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eВімала хемаджіні \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Вринда̄ван Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвімала хемаджін\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тану анупама ре!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄хе шобге на̄на̄ пхулада̄ма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкадамба кешяра\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джіні ектī пулака ре!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄ра ма̄джге бінду бінду га̄ма\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджіні’ мадаматта ха̄ті\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґамана мантхара аті\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бга̄ва̄вешє дгулі дгулі джа̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eаруна-васана чхгобі\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джіні прабга̄тера робі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґора̄-анґе лахарī кхела̄я\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eчаліте на̄ па̄ре ґора̄-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ча̄нд ґонса̄і ре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;боліте на̄ па̄ре а̄дга-бола\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбга̄вете а̄вешя хоія\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;харі харі бола̄ія\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄чанда̄ле дгарі’ дея кола\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eе сукха-сампада-ка̄ле\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґора̄ на̄ бгаджіну хеле\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хено паде на̄ коріну а̄шя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-кришна-чайтанья-чандра тха̄кура шрī-нітьянанда\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґуна ґа̄я вринда̄вана да̄са\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gauranga-bolite-hobe-pulaka-shorira\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003e‘Ґаура̄нґа’ боліте хабе \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Нароттам Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘ґаура̄нґа’ боліте хобе пулака-шорīра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘харі харі’ боліте наяне ба’бе нīра\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄ра кабе ніта̄і-ча̄нда каруна̄ корібе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсамса̄ра-ва̄сана̄ море кабе туччха ха’бе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбішоя чха̄дія кабе шюддга ха’бе мана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкабе ха̄ма херабо шрī-вринда̄вана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eрӯпа-рагуна̄тха-паде хоібе а̄куті\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкабе ха̄ма буджгабо се джуґала-пірīті\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eрӯпа-рагуна̄тха-паде раху мора а̄шя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпра̄ртхана̄ карає сада̄ нароттама-да̄са\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-aruna-basane-sonara-suraja\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u0 nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;абгіма̄нī джана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кено мла̄на духкха бгоре\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄ка̄шя ба̄та̄са\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;гуча̄ія тра̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄шва̄се бга̄са̄є дей\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eса̄дгу-джана мана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сукха вітарана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄вешє унма̄да хой\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eчаудікете дгвані\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кі апӯрва шюні\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бахуджана учарола\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхаре кришна ра̄ма\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ма дівʼя-дга̄ма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;харі харі харі боло\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпха̄лґунī пӯрніма̄\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хіндола ранґіма̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;суджана-бгаджана ра̄ґе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсанкīртана сане\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;марама ґахане\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Нароттам Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтха̄кура-вайшнава-пада,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;аванīра сусампада,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шюно бга̄і! хоія ека мана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄шроя лоія бгадже,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄ре кришна на̄хі тьядже\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ро саба море ака̄рана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eтха̄кура\u003c/i\u003e — святого; \u003ci class=\"wbw__term\"\u003eвайшнава\u003c/i\u003e — вайшнава; \u003ci class=\"wbw__term\"\u003eпада\u003c/i\u003e — стопи; \u003ci class=\"wbw__term\"\u003eаванīра\u003c/i\u003e — усього світу; \u003ci class=\"wbw__term\"\u003eсусампада\u003c/i\u003e — найцінніший скарб; \u003ci class=\"wbw__term\"\u003eшюно\u003c/i\u003e — слухай; \u003ci class=\"wbw__term\"\u003eбга̄і\u003c/i\u003e — брате; \u003ci class=\"wbw__term\"\u003eхоія\u003c/i\u003e — (хто) стане; \u003ci class=\"wbw__term\"\u003eека\u003c/i\u003e — одним; \u003ci class=\"wbw__term\"\u003eмана\u003c/i\u003e — в умі; \u003ci class=\"wbw__term\"\u003eа̄шроя\u003c/i\u003e — притулок; \u003ci class=\"wbw__term\"\u003eлоія\u003c/i\u003e — прийме; \u003ci class=\"wbw__term\"\u003eбгадже\u003c/i\u003e —  і поклонятиметься (вайшнаву); \u003ci class=\"wbw__term\"\u003eта̄ре\u003c/i\u003e — того; \u003ci class=\"wbw__term\"\u003eкришна\u003c/i\u003e — Крішна; \u003ci class=\"wbw__term\"\u003eна̄хі\u003c/i\u003e — не; \u003ci class=\"wbw__term\"\u003eтьядже\u003c/i\u003e — покине; \u003ci class=\"wbw__term\"\u003eа̄ро\u003c/i\u003e — решта; \u003ci class=\"wbw__term\"\u003eсаба\u003c/i\u003e — усі; \u003ci class=\"wbw__term\"\u003eморе\u003c/i\u003e — загинуть; \u003ci class=\"wbw__term\"\u003eака̄рана\u003c/i\u003e — марно.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвайшнава-чарана-джол,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;према-бгакті діте бол,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ро кехо нахе балаванта\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвайшнава-чарана-рену,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мастаке бгӯшана віну\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ра на̄хі бгӯшанера анта\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eвайшнава\u003c/i\u003e — (із) вайшнава; \u003ci class=\"wbw__term\"\u003eчарана\u003c/i\u003e — стоп; \u003ci class=\"wbw__term\"\u003eджол\u003c/i\u003e — вода; \u003ci class=\"wbw__term\"\u003eпрема\u003c/i\u003e — любовної; \u003ci class=\"wbw__term\"\u003eбгакті\u003c/i\u003e — відданості; \u003ci class=\"wbw__term\"\u003eдіте\u003c/i\u003e — дарує; \u003ci class=\"wbw__term\"\u003eбол\u003c/i\u003e — силу; \u003ci class=\"wbw__term\"\u003eа̄ро\u003c/i\u003e — інший; \u003ci class=\"wbw__term\"\u003eкехо\u003c/i\u003e — хтось; \u003ci class=\"wbw__term\"\u003eнахе\u003c/i\u003e — не є; \u003ci class=\"wbw__term\"\u003eбалаванта\u003c/i\u003e — спроможним; \u003ci class=\"wbw__term\"\u003eвайшнава\u003c/i\u003e — (із) вайшнава; \u003ci class=\"wbw__term\"\u003eчарана\u003c/i\u003e — стоп; \u003ci class=\"wbw__term\"\u003eрену\u003c/i\u003e — пил; \u003ci class=\"wbw__term\"\u003eмастаке\u003c/i\u003e — на голову; \u003ci class=\"wbw__term\"\u003eбгӯшана\u003c/i\u003e — прикраса; \u003ci class=\"wbw__term\"\u003eвіну\u003c/i\u003e — окрім (єдина); \u003ci class=\"wbw__term\"\u003eа̄ра\u003c/i\u003e — іншої; \u003ci class=\"wbw__term\"\u003eна̄хі\u003c/i\u003e — немає; \u003ci class=\"wbw__term\"\u003eбгӯшанера\u003c/i\u003e — прикраси; \u003ci class=\"wbw__term\"\u003eанта\u003c/i\u003e — довершеної.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтīртха-джол-павітра-ґуне,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лікхіячхе пура̄не,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;се саба бгактіра праваньчана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвайшнавера па̄да-дока,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сама нахе еі саба,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джа̄те хоя ва̄ньчіто пӯрана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eтīртха\u003c/i\u003e — святих місць; \u003ci class=\"wbw__term\"\u003eджол\u003c/i\u003e — вода; \u003ci class=\"wbw__term\"\u003eпавітра\u003c/i\u003e — очисні; \u003ci class=\"wbw__term\"\u003eґуне\u003c/i\u003e — (має) якості; \u003ci class=\"wbw__term\"\u003eлікхіячхе\u003c/i\u003e — написано; \u003ci class=\"wbw__term\"\u003eпура̄не\u003c/i\u003e — у пуранах; \u003ci class=\"wbw__term\"\u003eсе\u003c/i\u003e — це; \u003ci class=\"wbw__term\"\u003eсаба\u003c/i\u003e — все; \u003ci class=\"wbw__term\"\u003eбгактіра\u003c/i\u003e — (для) любовної відданості; \u003ci class=\"wbw__term\"\u003eправаньчана\u003c/i\u003e — омана; \u003ci class=\"wbw__term\"\u003eвайшнавера\u003c/i\u003e — (із) вайшнава; \u003ci class=\"wbw__term\"\u003eпа̄да\u003c/i\u003e — стоп; \u003ci class=\"wbw__term\"\u003eдока\u003c/i\u003e — вода; \u003ci class=\"wbw__term\"\u003eсама\u003c/i\u003e — такою ж; \u003ci class=\"wbw__term\"\u003eнахе\u003c/i\u003e — не є; \u003ci class=\"wbw__term\"\u003eеі\u003c/i\u003e — (як) це; \u003ci class=\"wbw__term\"\u003eсаба\u003c/i\u003e — все; \u003ci class=\"wbw__term\"\u003eджа̄те\u003c/i\u003e — завдяки чому; \u003ci class=\"wbw__term\"\u003eхоя\u003c/i\u003e — стає; \u003ci class=\"wbw__term\"\u003eва̄ньчіто\u003c/i\u003e — бажане; \u003ci class=\"wbw__term\"\u003eпӯрана\u003c/i\u003e — сповненим.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвайшнава-санґете мана, а̄нандіта анукшана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сада̄ хой кришна-парасанґа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдīна нароттама ка̄нде, хія дгайрджа на̄хі ба̄ндге,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мора дошя кено хоіло бганґа\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eвайшнава\u003c/i\u003e — (з) вайшнавом; \u003ci class=\"wbw__term\"\u003eсанґете\u003c/i\u003e — спілкуючись; \u003ci class=\"wbw__term\"\u003eмана\u003c/i\u003e — ум; \u003ci class=\"wbw__term\"\u003eа̄нандіта\u003c/i\u003e — радіє; \u003ci class=\"wbw__term\"\u003eанукшана\u003c/i\u003e — щомиті; \u003ci class=\"wbw__term\"\u003eсада̄\u003c/i\u003e — (бо) завжди; \u003ci class=\"wbw__term\"\u003eхой\u003c/i\u003e — є; \u003ci class=\"wbw__term\"\u003eкришна\u003c/i\u003e — (про) Крішну; \u003ci class=\"wbw__term\"\u003eпарасанґа\u003c/i\u003e — бесіди; \u003ci class=\"wbw__term\"\u003eдīна\u003c/i\u003e — немічний; \u003ci class=\"wbw__term\"\u003eнароттама\u003c/i\u003e — Нароттама Дас; \u003ci class=\"wbw__term\"\u003eка̄нде\u003c/i\u003e — плаче; \u003ci class=\"wbw__term\"\u003eхія\u003c/i\u003e — серце; \u003ci class=\"wbw__term\"\u003eдгайрджа\u003c/i\u003e — терпіти; \u003ci class=\"wbw__term\"\u003eна̄хі\u003c/i\u003e — не; \u003ci class=\"wbw__term\"\u003eба̄ндге\u003c/i\u003e — витримує; \u003ci class=\"wbw__term\"\u003eмора\u003c/i\u003e — моя; \u003ci class=\"wbw__term\"\u003eдошя\u003c/i\u003e — провина; \u003ci class=\"wbw__term\"\u003eкено\u003c/i\u003e — чому; \u003ci class=\"wbw__term\"\u003eхоіло\u003c/i\u003e — сталося; \u003ci class=\"wbw__term\"\u003eбганґа\u003c/i\u003e — падіння.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-je-anilo-prema-dhana-karuna-prachura\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eВіраха-ґīті \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Нароттам Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдже а̄ніло према-дгана каруна̄ прачура\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхено прабгу котха̄ ґела̄ а̄ча̄рʼя-тха̄кура\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eдже а̄ніло\u003c/i\u003e — той, хто приніс; \u003ci class=\"wbw__term\"\u003eпрема-дгана\u003c/i\u003e — скарб божественної любови; \u003ci class=\"wbw__term\"\u003eкаруна̄ прачура\u003c/i\u003e — що був сповнений співчуття і милости; \u003ci class=\"wbw__term\"\u003eхено прабгу\u003c/i\u003e — та особа; \u003ci class=\"wbw__term\"\u003eкотха̄ ґела̄\u003c/i\u003e — куди ж зник?; \u003ci class=\"wbw__term\"\u003eа̄ча̄рʼя-тха̄кура\u003c/i\u003e — Шрінівас Ачарʼя.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eДе шукати Ачар'ю Тхакура, Господа, який своєю милістю приніс скарб божественної любові?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eка̄нга̄ мора сварӯп рӯпа ка̄нга̄ сана̄тана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eка̄нга̄ да̄са рагуна̄тха патіта-па̄вана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eка̄нга̄\u003c/i\u003e — де ж?; \u003ci class=\"wbw__term\"\u003eмора\u003c/i\u003e — мій; \u003ci class=\"wbw__term\"\u003eсварӯп рӯпа\u003c/i\u003e — Сварупа Дамодар і Рупа Ґосвамі; \u003ci class=\"wbw__term\"\u003eка̄нга̄\u003c/i\u003e — де ж?; \u003ci class=\"wbw__term\"\u003eсана̄тана\u003c/i\u003e — Санатана Ґосвамі; \u003ci class=\"wbw__term\"\u003eка̄нга̄\u003c/i\u003e — де ж?; \u003ci class=\"wbw__term\"\u003eда̄са рагуна̄тха\u003c/i\u003e — Рагунатха Даса Ґосвамі; \u003ci class=\"wbw__term\"\u003eпатіта-па̄вана\u003c/i\u003e — спаситель падших.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eДе мій Сваруп, де Рупа Ґосвамі, де Санатан? Де Рагунатха Дас, спаситель відступників.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eка̄нга̄ мора бгатта-джуґа ка̄нга̄ кавіра̄джа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eека-ка̄ле котха̄ ґела̄ ґаура̄ ната-ра̄джа\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eка̄нга̄\u003c/i\u003e — де ж?; \u003ci class=\"wbw__term\"\u003eмора\u003c/i\u003e — мій; \u003ci class=\"wbw__term\"\u003eбгатта-джуґа\u003c/i\u003e — два Бгатти (Рагунатха Бгатта і Ґопала Бгатта Ґосвамі); \u003ci class=\"wbw__term\"\u003eка̄нга̄\u003c/i\u003e — де ж?; \u003ci class=\"wbw__term\"\u003eкавіра̄джа\u003c/i\u003e — Крішнадас Кавіраджа; \u003ci class=\"wbw__term\"\u003eека-ка̄ле\u003c/i\u003e — раптово, зненацька; \u003ci class=\"wbw__term\"\u003eкотха̄ ґела̄\u003c/i\u003e — куди ж поділись?; \u003ci class=\"wbw__term\"\u003eґаура̄ ната-ра̄джа\u003c/i\u003e — Господь Ґауранґа, цар танцю.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eДе мої Рагунатха Бгатта та Ґопал Бгатта? Де шукати Крішнадаса Кавіраджа? Куди так раптово зник найпрекрасніший з танцюристів, Шрі Ґауранґа?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпа̄ша̄не кутібо ма̄тха̄ анале пашібо\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґаура̄нґа ґунера нідгі котха̄ ґеле па̄бо\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eка̄нга̄\u003c/i\u003e — де ж?; \u003ci class=\"wbw__term\"\u003eмора\u003c/i\u003e — мій; \u003ci class=\"wbw__term\"\u003eбгатта-джуґа\u003c/i\u003e — два Бгатти (Рагунатха Бгатта і Ґопала Бгатта Ґосвамі); \u003ci class=\"wbw__term\"\u003eка̄нга̄\u003c/i\u003e — де ж?; \u003ci class=\"wbw__term\"\u003eкавіра̄джа\u003c/i\u003e — Крішнадас Кавіраджа; \u003ci class=\"wbw__term\"\u003eека-ка̄ле\u003c/i\u003e — раптово, зненацька; \u003ci class=\"wbw__term\"\u003eкотха̄ ґела̄\u003c/i\u003e — куди ж поділись?; \u003ci class=\"wbw__term\"\u003eґаура̄ ната-ра̄джа\u003c/i\u003e — Господь Ґауранґа, цар танцю.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЩоб долучитися до вічних забав Господа — неперевершеного Шрі Ґауранґи, я однаково готовий розбити голову об камінь чи увійти у вогонь.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсе-саба санґīра санґе дже коіло віла̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсе-санґа на̄ па̄я ка̄нде нароттама да̄са\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eсе-саба\u003c/i\u003e — усі ці; \u003ci class=\"wbw__term\"\u003eсанґīра санґе\u003c/i\u003e — у спільноті всіх цих відданих Господа; \u003ci class=\"wbw__term\"\u003eдже\u003c/i\u003e — з ким; \u003ci class=\"wbw__term\"\u003eкоіло віла̄са\u003c/i\u003e — Господь Ґауранґа звершував Свої розваги; \u003ci class=\"wbw__term\"\u003eсе-санґа\u003c/i\u003e — того спілкування; \u003ci class=\"wbw__term\"\u003eна̄ па̄я\u003c/i\u003e — не отримуючи; \u003ci class=\"wbw__term\"\u003eка̄нде нароттама да̄са\u003c/i\u003e — Нароттама Даса ридає.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eНароттам Дас гірко плаче: йому не пощастило зустрітися зі Шрі Ґауранґою, коли Він забавлявся в оточенні Своїх піднесених відданих.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-ei-vara-karuna-kara-vaishnava-gosani\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eВайшнава Віґʼяпті \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Нароттам Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eеі-ва̄ра каруна̄ кара вайшнава ґоса̄ні\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпатіта-па̄вана тома̄ віне кеха на̄і\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eеі ва̄ра\u003c/i\u003e — зараз; \u003ci class=\"wbw__term\"\u003eкаруна̄ кара\u003c/i\u003e — будь ласкавий, вияв милість; \u003ci class=\"wbw__term\"\u003eвайшнава ґоса̄ні\u003c/i\u003e — о, Вайшнаве Ґосвамі!; \u003ci class=\"wbw__term\"\u003eпатіта-па̄вана\u003c/i\u003e — спаситель занепалих душ; \u003ci class=\"wbw__term\"\u003eтома̄ віне\u003c/i\u003e — окрім тебе; \u003ci class=\"wbw__term\"\u003eкеха на̄і\u003c/i\u003e — нікого немає.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Вайшнав Ґосвамі, благаю, хоч цього разу будь до мене милостивий! Ти — спаситель відступників, ти — моя єдина надія!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eка̄ха̄ра нікате ґеле па̄па дӯре яя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eемана даяла прабгу кева̄ котха̄ па̄я\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eка̄ха̄ра нікате\u003c/i\u003e — біля кого лише наблизившись; \u003ci class=\"wbw__term\"\u003eґеле\u003c/i\u003e — підійшовши; \u003ci class=\"wbw__term\"\u003eпа̄па\u003c/i\u003e — усі гріхи; \u003ci class=\"wbw__term\"\u003eдӯре яя\u003c/i\u003e — відходять геть; \u003ci class=\"wbw__term\"\u003eемана даяла прабгу\u003c/i\u003e — така милостива особа; \u003ci class=\"wbw__term\"\u003eкева̄ котха̄ па̄я\u003c/i\u003e — де ж можна знайти когось подібного?\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСама твоя присутність стирає всі гріхи. Такої доброти більше ніде не знайти.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґанґа̄ра парашя хайле пашча̄те па̄вана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдаршяне павітра кара еі тома̄ра ґуна\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eґанґа̄ра парашя хайле\u003c/i\u003e — торкнувшись вод священної Ґанґи; \u003ci class=\"wbw__term\"\u003eпашча̄те па̄вана\u003c/i\u003e — очищуєшся пізніше; \u003ci class=\"wbw__term\"\u003eдаршяне\u003c/i\u003e — лише побачивши тебе; \u003ci class=\"wbw__term\"\u003eпавітра кара\u003c/i\u003e — очищуєшся негайно; \u003ci class=\"wbw__term\"\u003eеі\u003c/i\u003e — це; \u003ci class=\"wbw__term\"\u003eтома̄ра ґуна\u003c/i\u003e — твоя якість.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСвященна вода Ґанґи здатна визволити найгіршого грішника. Та бодай одного погляду на тебе достатньо, аби досягти цього визволення. Така твоя природа.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eхарі-стха̄не апара̄дге та̄ре харіна̄ма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтома̄-стха̄не апара̄дге на̄хіка еда̄на\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eхарі-стха̄не\u003c/i\u003e — Господу Харі; \u003ci class=\"wbw__term\"\u003eапара̄дге\u003c/i\u003e — вчинивши образу; \u003ci class=\"wbw__term\"\u003eта̄ре харіна̄ма\u003c/i\u003e — святе ім’я звільняє; \u003ci class=\"wbw__term\"\u003eтома̄-стха̄не апара̄дге\u003c/i\u003e — але якщо хтось образить тебе; \u003ci class=\"wbw__term\"\u003eна̄хіка\u003c/i\u003e — не буде; \u003ci class=\"wbw__term\"\u003eеда̄на\u003c/i\u003e — спасіння.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯкщо хтось образить святі стопи Господа Харі, здобуде прощення через оспівування Його Святого Імені. Проте немає спасіння тому, хто образить тебе.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтома̄ра хридає сада̄ ґовінда-вішра̄ма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґовінда кахена мама вайшнава пара̄на\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eтома̄ра хридає\u003c/i\u003e — у твоєму серці; \u003ci class=\"wbw__term\"\u003eсада̄\u003c/i\u003e — завжди; \u003ci class=\"wbw__term\"\u003eґовінда-вішра̄ма\u003c/i\u003e — місце відпочинку Господа Ґовінди; \u003ci class=\"wbw__term\"\u003eґовінда кахена\u003c/i\u003e — Господь Ґовінда каже; \u003ci class=\"wbw__term\"\u003eмама вайшнава пара̄на\u003c/i\u003e — «вайшнави — це моє життя».\u003c/p\u003e\n\u003cp class=\"translation\"\u003eУ твоєму серці завжди Господь Ґовінда. Адже Сам Господь Шрі Ґовінда каже: «Мої віддані — Мої життя та душа».\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпраті джанме карі а̄шя чаранера дгулі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнароттаме кара дая а̄пана̄ра валі\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eпраті джанме\u003c/i\u003e — у кожному народженні, яке можу мати; \u003ci class=\"wbw__term\"\u003eкарі а̄шя\u003c/i\u003e — прагну; \u003ci class=\"wbw__term\"\u003eчаранера дгулі\u003c/i\u003e — пилу з твоїх святих стіп; \u003ci class=\"wbw__term\"\u003eнароттаме\u003c/i\u003e — до Нароттами Даса; \u003ci class=\"wbw__term\"\u003eкара дая\u003c/i\u003e — будь ласкавий; \u003ci class=\"wbw__term\"\u003eа̄пана̄ра валі\u003c/i\u003e — і вважай своїм.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСподіваюся, що життя за життям я матиму нагоду шанувати пил з твоїх чудових, наче лотоси, стіп. Шрі Нароттам молить: «Вайшнав Ґосвамі, будь милостивий до мене!»\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-kripa-kara-vaishnava-thakura\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eПра̄ртхана̄ Лаласа̄маї \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;крипа кара’ вайшнава тха̄кура\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсамбандга джа̄нія,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгаджіте бгаджіте,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;абгіма̄н хау дӯра\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘амі то’ вайшнава’ е буддгі хоіле,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ама̄нī на̄ хо’бо а̄мі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпратіштха̄шя а̄сі’,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хридоя дӯшибе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хоібо ніраяґа̄мī\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтома̄ра кінкора,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄пане джа̄нібо,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘ґуру’-абгіма̄н тьяджі’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтома̄ра учіштха,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пададжала-рену,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сада̄ нішкапате бгаджі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘нідже срештха’ джа̄ні’,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;учіштха̄ді да̄не,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ха’бе абгіма̄н бга̄р\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eта̄і шішʼя тава,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тха̄кія сарвада̄,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ лоібо пӯджа̄ ка̄’ра\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eама̄нī ма̄нада,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хоіле кīртане\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;адгіка̄р дібе тумі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтома̄ра чаране,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нішкапате а̄мі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ка̄ндія лутібо бгӯмі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-narada-muni-bajaya-vina\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī На̄ма̄штакам 8 \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eна̄рада муні,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ба̄джа̄я вīна̄,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘ра̄дгіка̄-рамана’-на̄ме\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄ма амані,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;удіта хоя,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгаката-ґīта-са̄ме\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eКоли великодушний Нарада Муні торкається струн своєї \u003ci\u003eвіни\u003c/i\u003e, Cвяте Імʼя Радгіка-Рамана сходить і відразу ж проявляється у \u003ci\u003eкіртані\u003c/i\u003e відданих Господа.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eамія-дга̄ра̄,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;баріше гана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шравана-джуґале ґія\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгаката-джана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сагане на̄че,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгорія а̄пана хія\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e
