003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eна̄ма̄нанда чапала ба̄лака ма̄три-бгакта\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбрахма̄нда-бадана таркī каутука̄нуракта\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвідьяртхі-удупа чаура-дваєра мохана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтайртхіка-сарвасва ґра̄мʼя-ба̄ліка̄-крīдана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eлакшмī-праті боро-да̄та̄ удгата ба̄лака\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-шячīра паті-путра-шока-ніба̄рака\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eлакшмī-паті пӯрва-дешя-сарва-клешя-хара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдіґвіджаї-дарпа-ха̄рī вішну-прієшвара\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄рʼя-дгарма-па̄ла пітри-ґая пінда-да̄та̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпурī-шішʼя мадгва̄ча̄рʼя-сампрада̄я-па̄та̄\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкришна-на̄монматта кришна-таттва-адгʼяпака\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄ма-санкīртана-джуґа-дгарма-правартака\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u00  матхурешя девакī-ґарбга-джа\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"20\"\u003e\n\u003ch5\u003e20\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкубджа̄-крипа̄моя вішну шяурі на̄ра̄яна\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдва̄ракешя наракагна шрī-джадунандана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"21\"\u003e\n\u003ch5\u003e21\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-рукмінī-ка̄нта сатья-паті сура-па̄ла\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпа̄ндава-ба̄ндгава шішюпа̄ла̄діра ка̄ла\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"22\"\u003e\n\u003ch5\u003e22\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджаґадīшя джана̄рдана кешява̄рта-тра̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсарва-авата̄ра-бīджа вішвера ніда̄на\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"23\"\u003e\n\u003ch5\u003e23\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eма̄єшвара йоґешвара бра̄хма-теджа̄-дга̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсарва̄тма̄ра а̄тма̄ прабгу пракритіра па̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"24\"\u003e\n\u003ch5\u003e24\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпатіта-па̄вана джаґанна̄тха сарвешвара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвринда̄вана-чандра сарва-расера а̄кара\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"25\"\u003e\n\u003ch5\u003e25\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнаґаре наґаре ґора̄ ґа̄й\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгакатівінода тачху па̄й\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-hari-vasare-hari-kirtana-vidhana\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Харі-ва̄сара-ґīті \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Вринда̄ван Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch4\u003e(співається зранку та в дні екадаші)\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī харі-ва̄саре харі-кīртана-відга̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнритья а̄рамбгіла̄ прабгу джаґатера пра̄на\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eшрī харі-ва̄саре\u003c/i\u003e — у день Шрī Харі; \u003ci class=\"wbw__term\"\u003eхарі-кīртана\u003c/i\u003e — спів імені Харі; \u003ci class=\"wbw__term\"\u003eвідга̄на\u003c/i\u003e — установлення, впорядкування; \u003ci class=\"wbw__term\"\u003eнритья\u003c/i\u003e — танець; \u003ci class=\"wbw__term\"\u003eа̄рамбгіла̄\u003c/i\u003e — розпочав; \u003ci class=\"wbw__term\"\u003eпрабгу\u003c/i\u003e — Господь; \u003ci class=\"wbw__term\"\u003eджаґатера\u003c/i\u003e — світу; \u003ci class=\"wbw__term\"\u003eпра̄на\u003c/i\u003e — життєдайна сила.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯкось у сприятливий день Екадаші, разом із своїми супутниками, Шріман Махапрабгу розпочав Свій натхненний \u003ci\u003eкіртан\u003c/i\u003e у будинку Шріваса Пандіта.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпуньяванта шрīва̄са-анґане шюбга̄рамбга\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eутхіло кīртана-дгвані ґопа̄ла ґовінда\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eпуньяванта\u003c/i\u003e — смиренний і доброчесний; \u003ci class=\"wbw__term\"\u003eшрīва̄са-анґане\u003c/i\u003e — на подвір’ї Шріваси Тхакура; \u003ci class=\"wbw__term\"\u003eшюбга̄рамбга\u003c/i\u003e — початок усього сприятливого; \u003ci class=\"wbw__term\"\u003eутхіло\u003c/i\u003e — піднявся (пролунав); \u003ci class=\"wbw__term\"\u003eкīртана-дгвані\u003c/i\u003e — звук прославлення (співу мантр); \u003ci class=\"wbw__term\"\u003eґопа̄ла\u003c/i\u003e — ім’я Ґопали (пастушка); \u003ci class=\"wbw__term\"\u003eґовінда\u003c/i\u003e — ім’я Ґовінди.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЗдійнявшись хвилею божественної нестями, Шріман Махапрабгу, сенс буття та душа всього всесвіту, пустився у Свій чудовий танок. Це божественне видовище глибоко вразило відданих, які оточували Його, і, натхненні, вони взялися всі разом танцювати та співати Святі Імена, такі як Ґопал і Ґовінда.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмриданґа мандіра̄ ба̄дже шянкха карата̄ла\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсанкīртана сонґе соб хоіло мішяла\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eмриданґа\u003c/i\u003e — \u003ci\u003eмриданґа\u003c/i\u003e (барабан); \u003ci class=\"wbw__term\"\u003eмандіра̄\u003c/i\u003e — храму; \u003ci class=\"wbw__term\"\u003eба̄дже\u003c/i\u003e — звучить, лунає; \u003ci class=\"wbw__term\"\u003eшянкха\u003c/i\u003e — раковина; \u003ci class=\"wbw__term\"\u003eкарата̄ла\u003c/i\u003e — маленькі цимбали; \u003ci class=\"wbw__term\"\u003eсанкīртана\u003c/i\u003e — спільне оспівування (божественних імен); \u003ci class=\"wbw__term\"\u003eсонґе\u003c/i\u003e — у супроводі; \u003ci class=\"wbw__term\"\u003eсоб\u003c/i\u003e — усі; \u003ci class=\"wbw__term\"\u003eхоіло\u003c/i\u003e — стали, з’єдналися; \u003ci class=\"wbw__term\"\u003eмішяла\u003c/i\u003e — злилися, змішалися.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЗлагоджені звуки \u003ci\u003eмриданґ\u003c/i\u003e, храмових дзвіночків, \u003ci\u003eкаратал\u003c/i\u003e і мушель, разом із спільним співом і танком, сплелися воєдино і піднесли всіх до надмирної радості.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбрахма̄нде утхіло дгвані пӯрія а̄ка̄шя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчаудікера аманґала джа̄я соб на̄шя\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eбрахма̄нде\u003c/i\u003e — у всесвіті; \u003ci class=\"wbw__term\"\u003eутхіло\u003c/i\u003e — піднявся, здійнявся; \u003ci class=\"wbw__term\"\u003eдгвані\u003c/i\u003e — звук, вібрація; \u003ci class=\"wbw__term\"\u003eпӯрія\u003c/i\u003e — наповнюючи; \u003ci class=\"wbw__term\"\u003eа̄ка̄шя\u003c/i\u003e — небо, простір; \u003ci class=\"wbw__term\"\u003eчаудікера\u003c/i\u003e — у всі боки, всі сторони світу; \u003ci class=\"wbw__term\"\u003eаманґала\u003c/i\u003e — нещастя, лихо, все недобре; \u003ci class=\"wbw__term\"\u003eджа̄я\u003c/i\u003e — зникає, щезає; \u003ci class=\"wbw__term\"\u003eсоб\u003c/i\u003e — усе; \u003ci class=\"wbw__term\"\u003eна̄шя\u003c/i\u003e — знищення, зруйнування.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСвяті звуки \u003ci\u003eсанкіртани\u003c/i\u003e линули небом і полонили геть усе всесвітнє буття. Все пройнялося цими божественними звуками і відтак звільнилося від усього лихого.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eчатурдіке шрī харі-манґала санкīртана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмодгʼє на̄че джаґанна̄тха мішрера нандана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eчатурдіке\u003c/i\u003e — в усіх напрямках; \u003ci class=\"wbw__term\"\u003eшрī харі-манґала\u003c/i\u003e — благословенне Ім’я Шрі Харі; \u003ci class=\"wbw__term\"\u003eсанкīртана\u003c/i\u003e — спільне оспівування; \u003ci class=\"wbw__term\"\u003eмодгʼє\u003c/i\u003e — посередині; \u003ci class=\"wbw__term\"\u003eна̄че\u003c/i\u003e — танцює; \u003ci class=\"wbw__term\"\u003eджаґанна̄тха мішрера\u003c/i\u003e — сина Джаганнатхи Мішри; \u003ci class=\"wbw__term\"\u003eнандана\u003c/i\u003e — улюблений (син).\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЦе сприятливе оспівування Імені Господа наповнило собою усі чотири сторони світу, а у центрі цієї звукової вібрації танцював син Джаґаннатхи Мішри, Шріман Махапрабгу.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6-8\"\u003e\n\u003ch5\u003e6-8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсаба̄ра анґете шобге шрī чандана ма̄ла̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄нанде на̄чоє собе хоіє вібгола̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eні джа̄нанде на̄че маха̄прабгу вішвамбгара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчаранера та̄лі шюні аті манохара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбга̄ва̄вешє ма̄ла̄ на̄хі рохоє ґала̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчхіндія подоє ґія бгакатера ґа̄я\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eсаба̄ра\u003c/i\u003e — у всіх; \u003ci class=\"wbw__term\"\u003eанґете\u003c/i\u003e — на тілах; \u003ci class=\"wbw__term\"\u003eшобге\u003c/i\u003e — сяє; \u003ci class=\"wbw__term\"\u003eшрī чандана\u003c/i\u003e — священний сандал; \u003ci class=\"wbw__term\"\u003eма̄ла̄\u003c/i\u003e — гірлянда; \u003ci class=\"wbw__term\"\u003eа̄нанде\u003c/i\u003e — у блаженстві; \u003ci class=\"wbw__term\"\u003eна̄чоє\u003c/i\u003e — танцюють; \u003ci class=\"wbw__term\"\u003eсобе\u003c/i\u003e — усі; \u003ci class=\"wbw__term\"\u003eхоіє\u003c/i\u003e — ставши; \u003ci class=\"wbw__term\"\u003eвібгола̄\u003c/i\u003e — охоплені захватом;\u003cbr\u003e\n\u003ci class=\"wbw__term\"\u003eні джа̄нанде\u003c/i\u003e — у тому блаженстві; \u003ci class=\"wbw__term\"\u003eна̄че\u003c/i\u003e — танцює; \u003ci class=\"wbw__term\"\u003eмаха̄прабгу\u003c/i\u003e — Махапрабгу; \u003ci class=\"wbw__term\"\u003eвішвамбгара\u003c/i\u003e — Вішвамбгара; \u003ci class=\"wbw__term\"\u003eчаранера\u003c/i\u003e — від стоп; \u003ci class=\"wbw__term\"\u003eта̄лі\u003c/i\u003e — ритм (удар); \u003ci class=\"wbw__term\"\u003eшюні\u003c/i\u003e — чується; \u003ci class=\"wbw__term\"\u003eаті\u003c/i\u003e — вельми; \u003ci class=\"wbw__term\"\u003eманохара\u003c/i\u003e — чарівно;\u003cbr\u003e\n\u003ci class=\"wbw__term\"\u003eбга̄ва̄вешє\u003c/i\u003e — у глибокому блаженстві; \u003ci class=\"wbw__term\"\u003eма̄ла̄\u003c/i\u003e — гірлянда; \u003ci class=\"wbw__term\"\u003eна̄хі\u003c/i\u003e — не; \u003ci class=\"wbw__term\"\u003eрохоє\u003c/i\u003e — тримається; \u003ci class=\"wbw__term\"\u003eґала̄я\u003c/i\u003e — на шиї; \u003ci class=\"wbw__term\"\u003eчхіндія\u003c/i\u003e — порвавшись; \u003ci class=\"wbw__term\"\u003eподоє\u003c/i\u003e — падає; \u003ci class=\"wbw__term\"\u003eґія\u003c/i\u003e — потрапивши; \u003ci class=\"wbw__term\"\u003eбгакатера\u003c/i\u003e — на відданого; \u003ci class=\"wbw__term\"\u003eґа̄я\u003c/i\u003e — на тіло.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eНа всіх була запашна сандалова паста та яскраві гірлянди. Шріман Махапрабгу, Яким були зачаровані усі віддані, відтанцьовував неперевершений ритм. Занурений у танок, Він губив свої квіткові гірлянди, вони падали з Його шиї і прикрашали собою землю. Віддані на власні очі бачили цей рідкісний, дорогоцінний, вражаючий танок верховної таттви, Шрі Ґауранґи, — найпіднесенішого об'єкта поклоніння для таких видатних особистостей як Господь Шіва, Шюка, Нарада й решти.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджа̄нра на̄ма̄нанде шіва васана на̄ джа̄не\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджа̄нра расе на̄че шіва се на̄че а̄пане\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eджа̄нра\u003c/i\u003e — того, чия; \u003ci class=\"wbw__term\"\u003eна̄ма̄нанде\u003c/i\u003e — у радості святого імені; \u003ci class=\"wbw__term\"\u003eшіва\u003c/i\u003e — Шіва; \u003ci class=\"wbw__term\"\u003eвасана\u003c/i\u003e — одяг; \u003ci class=\"wbw__term\"\u003eна̄ джа̄не\u003c/i\u003e — не усвідомлює; \u003ci class=\"wbw__term\"\u003eджа̄нра\u003c/i\u003e — чия; \u003ci class=\"wbw__term\"\u003eрасе\u003c/i\u003e — у смакові (блаженстві); \u003ci class=\"wbw__term\"\u003eна̄че\u003c/i\u003e — танцює; \u003ci class=\"wbw__term\"\u003eшіва\u003c/i\u003e — Шіва; \u003ci class=\"wbw__term\"\u003eсе\u003c/i\u003e — той; \u003ci class=\"wbw__term\"\u003eна̄че\u003c/i\u003e — танцює; \u003ci class=\"wbw__term\"\u003eа̄пане\u003c/i\u003e — сам.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСвяте Ім'я, яке оспівував Махапрабгу, остаточно приголомшило та розгубило Господа Шіву. Його охопила хвиля нестями, і він забув про себе й одяг, що падав з нього під час танку любовної відданості.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджа̄нра на̄ме ва̄лмīкі хоіло таподгана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджа̄нра на̄ме аджа̄міла па̄іло мочана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eджа̄нра\u003c/i\u003e — того, чиє; \u003ci class=\"wbw__term\"\u003eна̄ме\u003c/i\u003e — Ім’я; \u003ci class=\"wbw__term\"\u003eва̄лмīкі\u003c/i\u003e — Вальмікі; \u003ci class=\"wbw__term\"\u003eхоіло\u003c/i\u003e — став; \u003ci class=\"wbw__term\"\u003eтаподгана\u003c/i\u003e — багатим на покаяння; \u003ci class=\"wbw__term\"\u003eджа̄нра\u003c/i\u003e — того, чиє; \u003ci class=\"wbw__term\"\u003eна̄ме\u003c/i\u003e — Ім’я; \u003ci class=\"wbw__term\"\u003eаджа̄міла\u003c/i\u003e — Аджаміла; \u003ci class=\"wbw__term\"\u003eпа̄іло\u003c/i\u003e — здобув; \u003ci class=\"wbw__term\"\u003eмочана\u003c/i\u003e — визволення.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСвяте Імʼя Господа дозволило Шрі Валмікі стати видатним та могутнім ріші, в Аджамілі — досягти справжнього визволення.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджа̄нра на̄ме шраване самса̄ра-бандга гуче\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхено прабгу аватарі калі-джуґе на̄че\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eджа̄нра\u003c/i\u003e — того, чиє; \u003ci class=\"wbw__term\"\u003eна̄ме\u003c/i\u003e — Ім’я; \u003ci class=\"wbw__term\"\u003eшраване\u003c/i\u003e — слухач (той, хто слухає); \u003ci class=\"wbw__term\"\u003eсамса̄ра-бандга\u003c/i\u003e — узи матеріального існування; \u003ci class=\"wbw__term\"\u003eгуче\u003c/i\u003e — зникають; \u003ci class=\"wbw__term\"\u003eхено\u003c/i\u003e — такий; \u003ci class=\"wbw__term\"\u003eпрабгу\u003c/i\u003e — Господь; \u003ci class=\"wbw__term\"\u003eаватарі\u003c/i\u003e — що зійшов (як аватара); \u003ci class=\"wbw__term\"\u003eкалі-джуґе\u003c/i\u003e — у вік Калі; \u003ci class=\"wbw__term\"\u003eна̄че\u003c/i\u003e — танцює.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eБудь-хто, хто з відданістю приймає у глибині свого серця Святе Ім'я та Його святу силу, звільняється від усього лихого та знаходить дійсне спасіння. Так діє природа Господа, Який є джерелом усіх втілень, та Який прийшов у наш час Калі в Своєму осяйному танцюючому образі.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджа̄нра на̄ма лоі шюка на̄рада беда̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсахасра-вадана-прабгу джа̄ра ґуна ґа̄я\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eджа̄нра\u003c/i\u003e — того, чиє; \u003ci class=\"wbw__term\"\u003eна̄ма\u003c/i\u003e — Ім’я; \u003ci class=\"wbw__term\"\u003eлоі\u003c/i\u003e — повторюючи; \u003ci class=\"wbw__term\"\u003eшюка на̄рада\u003c/i\u003e — Шюка й Нарада; \u003ci class=\"wbw__term\"\u003eбеда̄я\u003c/i\u003e — мандрують світом; \u003ci class=\"wbw__term\"\u003eсахасра-вадана-прабгу\u003c/i\u003e — Господь із тисячею вуст (Ананта Шеша); \u003ci class=\"wbw__term\"\u003eджа̄ра\u003c/i\u003e — того; \u003ci class=\"wbw__term\"\u003eґуна\u003c/i\u003e — славні якості; \u003ci class=\"wbw__term\"\u003eґа̄я\u003c/i\u003e — оспівує.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТакі чисті віддані як Шрі Шюкадева та Деварши Нарада у захваті від нектару Святого Імені Господа. Подорожуючи, вони завжди діляться ним із рештою \u003ci\u003eджів\u003c/i\u003e, яким поталанило зустрітися їм на шляху. Від цього їх охоплює неземна трансцендентна радість. Навіть Анантадев усіма своїми тисячами вуст співає славу Святого Імені Господа.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсарва-маха̄-пра̄яшчітта дже прабгура на̄ма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсе прабгу на̄чає декхе джата бга̄ґʼява̄н\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eсарва-махā-пра̄яшчітта\u003c/i\u003e — всеспокутне; \u003ci class=\"wbw__term\"\u003eдже прабгура\u003c/i\u003e — того Господа; \u003ci class=\"wbw__term\"\u003eна̄ма\u003c/i\u003e — Ім’я; \u003ci class=\"wbw__term\"\u003eсе прабгу\u003c/i\u003e — цей Господь; \u003ci class=\"wbw__term\"\u003eна̄чає\u003c/i\u003e — танцює; \u003ci class=\"wbw__term\"\u003eдекхе\u003c/i\u003e — хто бачить; \u003ci class=\"wbw__term\"\u003eджата бга̄ґʼява̄н\u003c/i\u003e — стає щасливим\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСеред усіх покут, оспівування Імені Господа — найпіднесеніша. Кожен, хто побачив танок Господа Шрі Чайтаньї — найщасливіший.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"14\"\u003e\n\u003ch5\u003e14\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī кришна-чайтанья нітьянанда-ча̄нда джа̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвринда̄вана да̄са тучу пада-джуґе ґа̄на\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eшрī кришна-чайтанья\u003c/i\u003e — Шрī Кришна Чайтанья; \u003ci class=\"wbw__term\"\u003eнітьянанда\u003c/i\u003e — Нітьянанда Прабгу; \u003ci class=\"wbw__term\"\u003eча̄нда\u003c/i\u003e — мов повний місяць; \u003ci class=\"wbw__term\"\u003eджа̄на\u003c/i\u003e — вшановані люди; \u003ci class=\"wbw__term\"\u003eвринда̄вана да̄са\u003c/i\u003e — Врінда̄вана Да̄с; \u003ci class=\"wbw__term\"\u003eтучу\u003c/i\u003e — Його; \u003ci class=\"wbw__term\"\u003eпада-джуґе\u003c/i\u003e — до лотосних стіп; \u003ci class=\"wbw__term\"\u003eґа̄на\u003c/i\u003e — співаю\u003c/p\u003e\n\u003cp class=\"translation\"\u003eДвоє братів Шрі Крішна Чайтанья і Шрі Нітьянанда Прабгу — це мої любі володарі, мої життя та душа! Таким чином Вриндаван Дас пише Їх славу і з відданістю пропонує цю пісню Їх чудовим, наче лотоси, стопам.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shiuddha-bhakata-charana-renu\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШюддга-бгаката \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшюддга-бгаката-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чарана-рену,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгаджана-анукӯла\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгаката-сева̄,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;парама-сіддгі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;према-латіка̄ра мӯла\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПил зі стоп-лотосів чистих відданих веде до \u003ci\u003eбгакті\u003c/i\u003e, а служіння \u003ci\u003eвайшнавам\u003c/i\u003e саме по собі є найвищою досконалістю і коренем ніжної ліани божественної любові.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eма̄дгава-тітхі,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгакті-джананī,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джатане па̄лана корі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкришна-басаті,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;басаті болі’,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;парама а̄даре борі\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ з великою увагою дотримуюся святих днів, таких як Екадаші та Джанмаштамі, бо вони є матір’ю відданості. Місцем свого життя я з найглибшою шаною і любов’ю обираю надмирну обитель Шрі Крішни.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґаура а̄ма̄ра,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дже-саба стха̄не,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;корало бграмана ранґе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсе-саба стха̄на,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;херібо а̄мі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пранаї-бгаката-санґе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eРазом з чистими відданими я відвідую усі місця, якими подорожував і де чинив Свої забави мій Господь Ґаурасундар.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмриданґа-ба̄дья,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шюніте мон,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;абасара сада̄ джа̄че\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґаура-біхіта,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кīртана шюні’,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄нанде хридоя на̄че\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eМій ум невпинно благає про можливість слухати звуки \u003ci\u003eмриданґи\u003c/i\u003e. Коли я чую \u003ci\u003eкіртан\u003c/i\u003e, таким, яким його заповідав Господь Ґаурачандра, моє серце пускається у радісний танок.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджуґала-мӯрті,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;декхія мора,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;парама-а̄нанда хой\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпраса̄да-сева̄\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;коріте хоя,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сакала прапаньча джай\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eКоли я споглядаю незбагненні форми Божественної Пари, Шрі Шрі Радги-Крішни, я відчуваю найвище блаженство. Приймаючи \u003ci\u003eпрасадам\u003c/i\u003e Господа, я долаю всі омани матеріального світу.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдже-діна ґрихе,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгаджана декхі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґрихете ґолока бга̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчарана-сīдгу,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;декхія ґанґа̄,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сукха на̄ сīма̄ па̄я\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eКожного разу, коли в моїй оселі відбувається поклоніння і служіння Господу Харі, для мене там постає Ґолока Вриндавана. Коли ж я споглядаю Ґанґу, ріку нектару, що витікає зі стоп-лотосів Господа, я відчуваю безмежну радість.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтуласī декхі’,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джуда̄я пра̄на,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ма̄дгава-тошанī джа̄ні’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґаура-прія,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шяка-севане,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джīвана са̄ртхака ма̄ні\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПогляд на священне деревце Туласі заспокоює мою душу, бо я знаю, що Туласі тішить Самого Господа Крішну. Коли я шаную \u003ci\u003eшак\u003c/i\u003e — страву з зеленого листя, що так до вподоби Господу Чайтаньї, я відчуваю, що моє життя наповнюється змістом.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгакатівінода,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кришна-бгаджане,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;анукӯла па̄я джа̄ха̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпраті-дівасе,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;парама-сукхе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;свīка̄ра карає та̄ха̄\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eУсе, що приходить до Бгактівінода задля служіння Шрі Крішні, він щодня приймає як найбільшу радість.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-chaudda-shiata-sata-shiake-masa-je-phalgun\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"89\"\u003e\n\u003ch2\u003eШрī Ґаура Пурнīма̄ \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eVerses 89-124 from Śrī Chaitanya Charitāmṛta\u003c/h3\u003e\n\u003ch4\u003eШрīла Кришнада̄с Кавіра̄дж Ґосва̄мī\u003c/h4\u003e\n\u003ch5\u003e89\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eчаудда-шята са̄та-шяке ма̄са дже пха̄лґун\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпаурнама̄сīра сондгʼя-ка̄ле хоіле шюбга-кшан\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"90\"\u003e\n\u003ch5\u003e90\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсімга-ра̄ші, сімга-лаґна, уча ґраха-ґон\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшада-варґа, ашта-варґа, сарва сулакшан\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"91\"\u003e\n\u003ch5\u003e91\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа-каланка ґаурачандра діла̄ дарашян\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eса-каланка чандре а̄ро кон прайоджан\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"92\"\u003e\n\u003ch5\u003e92\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eето джа̄ні’ ра̄ху коіло чандрера ґрахан\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘кришна’ ‘кришна’ ‘харі’ на̄ме бга̄се трі-бгуван\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"93\"\u003e\n\u003ch5\u003e93\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая джая дгвані хоіло сакала бгуван\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчаматка̄ра хоія лок бга̄ве моне мон\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"94\"\u003e\n\u003ch5\u003e94\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджаґат бгорія лок боле——‘харі’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘харі’ сеі-кшане ґауракришна бгӯме аватарі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"95\"\u003e\n\u003ch5\u003e95\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпрасанна хо-іло соб джаґатера мон\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘харі’ болі’ хіндуке ха̄сья карає джаван\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"96\"\u003e\n\u003ch5\u003e96\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘харі’ болі’ на̄рīґон деі хула̄хулі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсварґе ва̄дья-нритья коре дева кутӯхалī\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"97\"\u003e\n\u003ch5\u003e97\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпрасанна хоіло дош дік, прасанна надīджол\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eстха̄вара-джанґама хоіло а̄нанде віхвал\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"98\"\u003e\n\u003ch5\u003e98\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнадīя-удаяґірі,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пӯрначандра ґаурахарі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;крипа̄ корі’ хо-іло удой\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпа̄па-тамах хоіло на̄шя,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;трі-джаґатера улла̄са,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джаґабгарі’ харі-дгвані хой\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"99\"\u003e\n\u003ch5\u003e99\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсеі-ка̄ле ніджа̄лоя,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;утхія адвайта ра̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нритья коре а̄нандіта-моне\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхаріда̄се лоя санґе,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хунка̄ра-кīртана-ранґе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кене на̄че, кехо на̄хі джа̄не\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"100\"\u003e\n\u003ch5\u003e100\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдекхі’ упара̄ґа ха̄сі’,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шігра ґанґа̄-га̄те а̄сі’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄нанде коріло ґанґа̄-сна̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпа̄я упара̄ґа-чхоле,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄пана̄ра мано-боле,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бра̄хманере діло на̄на̄ да̄на\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"101\"\u003e\n\u003ch5\u003e101\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджаґата а̄нандамой,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;декхі’ моне са-вісмой\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тха̄ретхоре кохе харіда̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтома̄ра айчана ранґа,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мора мон парасанна,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;декхі—кічху ка̄рджʼє а̄чхе бга̄са\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"102\"\u003e\n\u003ch5\u003e102\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄ча̄рʼяратна, шрīва̄са,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хоіло моне сукхолла̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джа̄і’ сна̄на коіло ґанґа̄-джоле\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄нанде віхвала мон,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;коре харі-санкīртана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄на̄ да̄на коіло мано-боле\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"103\"\u003e\n\u003ch5\u003e103\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eеі мата бгакта-таті,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джа̄нра джеі дешє стхіті,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄ха̄н та̄ха̄н па̄я мано-боле\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄че, коре санкīртана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄нанде віхвала мана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;да̄на коре ґраханера чхоле\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"104\"\u003e\n\u003ch5\u003e104\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбра̄хмана-саджджана-на̄рī, на̄на̄-дравʼє тха̄лī бгорі’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄іла̄ собе джаутука ло-ія\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджена ка̄нча̄-сона̄-дьюті,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;декхі’ ба̄лакера мӯрті,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄шірва̄да коре сукха па̄я\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"105\"\u003e\n\u003ch5\u003e105\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eса̄вітрī, ґаурī, сарасватī, шячī, рамбга̄, арундгатī,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ро джата дева-на̄рīґон\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄на̄-дравʼє па̄тра бгорі’, бра̄хманīра вешя дгорі’,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄сі’ собе корен дарашян\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"106\"\u003e\n\u003ch5\u003e106\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eантарīкше дева-ґон, ґандгарва, сіддга, ча̄рана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;стуті-нритья коре ва̄дья-ґīта\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнартака, ва̄дака, бга̄та,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;навадвīпе джа̄ра на̄та,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;собе а̄сі’ на̄че па̄я прīта\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"107\"\u003e\n\u003ch5\u003e107\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкеба̄ а̄се кеба̄ джа̄я,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кеба̄ на̄че кеба̄ ґа̄я,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;самбга̄літе на̄ре ка̄ра боло\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкханділека духкха-шока, прамода-пӯріта лока,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мішра хоіла̄ а̄нанде віхвала\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"108\"\u003e\n\u003ch5\u003e108\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄ча̄рʼяратна, шрīніва̄са, джаґанна̄тха-мішра-па̄шя,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄сі’ та̄нре коре са̄вадга̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкора̄іло джа̄такарма,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дже а̄чіло відгі-дгарма,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тобе мішра коре на̄на̄ да̄на\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"109\"\u003e\n\u003ch5\u003e109\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджаутука па̄іло джата,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;горе ва̄ а̄чіло ката,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;соб дгон віпре діло да̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджата нартака, ґа̄ян,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бга̄та, акіньчана джон,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дгон дія коіло саба̄ра ма̄на\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"110\"\u003e\n\u003ch5\u003e110\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрīва̄сера бра̄хманī,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ма та̄нра ‘ма̄лінī’,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ча̄рʼяратнера патнī-сонґе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсіндӯра, харідра̄, тоіло,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кхоі, кала̄, на̄на̄ пхол,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дія пӯдже на̄рīґона ронґе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"111\"\u003e\n\u003ch5\u003e111\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eадвайта-а̄ча̄рʼя-бга̄рджʼя,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джаґат-пӯджіта̄ а̄рджʼя,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ма та̄нра ‘сīта̄ тха̄кура̄нī’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄ча̄рджʼєра а̄ґʼя па̄я,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґело упаха̄ра лоя,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;декхіте ба̄лака-шіромані\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"112\"\u003e\n\u003ch5\u003e112\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсуварнера каді-баулі,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;раджатамудра̄-па̄шюлі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;суварнера анґада, конкон\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eду-ба̄хуте дівʼя шянкха,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;раджатера малабанка,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сварна-мудра̄ра на̄на̄ ха̄раґон\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"113\"\u003e\n\u003ch5\u003e113\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвʼягра-накха хема-джоді,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;каті-паттасӯтра-дорī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хаста-падера джата а̄бгаран\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчітра-варна патта-са̄дī,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;буні пхото паттапа̄дī,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сварна-раупʼя-мудра̄ баху-дгон\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"114\"\u003e\n\u003ch5\u003e114\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдурва̄, дга̄нья, ґорочана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;харідра̄, кункума, чандана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;монґол-дравʼя па̄тра бгорія\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвастра-ґупта дола̄ чаді’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сонґе лоя да̄сī чедī,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вастра̄ланка̄ра пета̄рі бгорія\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"115\"\u003e\n\u003ch5\u003e115\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгакшʼя, бгоджʼя, упаха̄ра, сонґе лоіло баху бга̄ра,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шячī ґрихе хоіло упанīто\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдекхія ба̄лака-тха̄м,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;са̄кша̄т ґокула-ка̄н,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;варна-ма̄тра декхі віпарīто\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"116\"\u003e\n\u003ch5\u003e116\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсарва анґа—сунірма̄на, суварна-пратіма̄-бга̄на,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сарва анґа—сулакшанамой\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eба̄лакера дівʼя джйоті,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;декхі’ па̄іло баху прīті,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ва̄тсальєте дравіло хридой\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"117\"\u003e\n\u003ch5\u003e117\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдурва̄, дга̄нья, діло шірше,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;коіло баху а̄шіше,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чіраджīвī хао дуі бга̄і\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eда̄кінī-шянкхінī хоіте,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шянка̄ упаджіло чіте,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;доре на̄ма тхуіло ‘німа̄і’\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"118\"\u003e\n\u003ch5\u003e118\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпутрама̄та̄-сна̄надіне,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;діло вастра вібгӯшане,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;путра-саха мішрере самма̄ні’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшячī-мішрера пӯджа̄ лоя,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;монете харіша хоя,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;горе а̄іла̄ сіта̄ тха̄кура̄нī\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"119\"\u003e\n\u003ch5\u003e119\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eайче шячī-джаґанна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;путра па̄я лакшмīна̄тх,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пӯрна хоіло сакала ва̄ньчіто\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдгон-дга̄ньє бгоре гора,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;локама̄нья калевара,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;діне діне хой а̄нандіто\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"120\"\u003e\n\u003ch5\u003e120\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмішра—вайшнава, шянта, алампата, шюддга, да̄нта,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дгон-бгоґе на̄хі абгіма̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпутрера прабга̄ве джата,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дгон а̄сі’ міле, тата,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вішну-прīте двідже дено да̄на\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"121\"\u003e\n\u003ch5\u003e121\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eлаґна ґоні’ харшаматі,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нīла̄мбара чакравартī,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґупте кічху кохіло мішрере\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмаха̄пурушера чіхна,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лаґне анґе бгінна бгінна,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;декхі, — еі та̄рібе самса̄ре\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"122\"\u003e\n\u003ch5\u003e122\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eайче прабгу шячī-горе,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;крипа̄й коіло авата̄ре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джеі іха̄ карає шравана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґаура-прабгу даямой,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄нре хоєна садой,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сеі па̄я та̄нга̄ра чарана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"123\"\u003e\n\u003ch5\u003e123\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпа̄ія ма̄нуша джанма,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дже на̄ шюне ґаура-ґуна,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хено джанма та̄ра вʼяртха хоіло\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпа̄ія амритадгунī,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;піє віша-ґарта-па̄ні\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джанмія се кене на̄хі моіло\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"124\"\u003e\n\u003ch5\u003e124\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-чайтанья-нітьянанда, а̄ча̄рʼя адвайтачандра,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сварӯпа-рӯпа-рагуна̄тха-да̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eіха̄-саба̄ра шрī-чарана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шіре ванді ніджа-дгон,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джанма-лīла̄ ґа̄іло кришнада̄са\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-prabhu-kohe-kohilan-ei-mahamantra\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eПрабгу кохе \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Вринда̄ван Да̄с Тха̄кур\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eхаре кришна харе кришна кришна кришна харе харе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхаре ра̄ма харе ра̄ма ра̄ма ра̄ма харе харе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e“прабгу кохе—кохілан еі маха̄мантра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eіха̄ джапа ґія сабе корія нірбандга\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eіха̄ хоіте сарва-сіддгі хоібе саба̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсарва-кшана боло, ітхе відгі на̄хі а̄ра”\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e“кі шяяне кі бгоджане, кі ва̄ джа̄ґаране\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eахарнішя чінта кришна, болохо вадане”\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e“а̄ма-праті снеха джаді тха̄ке саба̄ка̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкришна віна̄ кеха кічху на̄ болібе а̄ра”\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-nagara-bhramiya-amara-gaura-elo-ghore\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eПісля парікрами \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнаґара бграмія а̄ма̄ра ґаура ело горе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґаура ело горе а̄ма̄ра ніта̄і ело горе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдгӯла̄ джга̄рі шячīма̄та̄ ґаура коле коре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄нандете бгакта-ґоне харі харі боле\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПісля міської \u003ci\u003eпарікрами\u003c/i\u003e Ґауранґа повертається до Свого дому. Нітай також іде до Себе. Матінка Шячі, обтрушуючи пил із Його тіла, бере Ґауранґу собі на коліна. У великій духовній радості всі віддані вигукують: «Харі Харі Бол!»\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-radha-krishna-bol-bol-bolo-re-sobai\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Наґара Кīртана 4 \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eŚrī Nāma (from Gītāvalī)\u003c/h3\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘ра̄дга̄-кришна’ бол бол боло ре соба̄і\u003c/strong\u003e\u003cbr\u003e\n(еі)\u003cstrong\u003e шікша̄ дія, саб надīя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпхірче нече’ ґаура-ніта̄і\u003c/strong\u003e\u003cbr\u003e\n(мічхе)\u003cstrong\u003e ма̄яр бошє, джа̄ччо бгесе’,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкха̄ччо ха̄будубу, бга̄і\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e(джлв)\u003cstrong\u003e кришна-да̄с, е бішва̄с,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкорле то' а̄р духкхо на̄і\u003c/strong\u003e\u003cbr\u003e\n(кришна)\u003cstrong\u003e болбе джабе, пулак ха'бе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджгорбе а̄нкхі, болі та̄і\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e(‘ра̄дга̄)\u003cstrong\u003e кришна’ боло, санґе чало,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eеі-ма̄тра бгікха̄ чха̄і\u003c/strong\u003e\u003cbr\u003e\n(джа̄й)\u003cstrong\u003e сакал' біпод бгактівінод\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eболе, джакхон о-на̄м ґа̄і\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hari-bole-modera-gaura-elo\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрī Наґара Кīртана 8 \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eŚrī Nāma (from Gītāvalī)\u003c/h3\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘харі’ боле’ модера ґаура ело\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eело ре ґаура̄нґа-ча̄нд преме\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eелотхело ніта̄і-адвайта-санґе ґодруме пашіло\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсанкīртана-расе мете нам біла̄іло\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄мера ха̄те есе преме джаґат бга̄са̄іло\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґодрума-ва̄сīр а̄дж духкха дӯре ґело\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгакта-вринда-санґе а̄сі’ ха̄та джа̄ґа̄іло\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eна̄дīя бграміте ґора̄ ело на̄мер ха̄те\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґаура ело ха̄те, санґе ніта̄і ело ха̄те\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eна̄че ма̄тояра̄ ніта̄і ґодрумера ма̄тхе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджаґат ма̄та̄й ніта̄і премера ма̄ласа̄те\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e(тора̄ декхе’ джа̄’ ре)\u003cbr\u003e\n\u003cstrong\u003eадвайта̄ді бгакта-вринда на̄че га̄те га̄те\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпала̄я дуранта калі подія бібгра̄те\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкі сукхе бга̄сіло джīва ґора̄ча̄ндер на̄те\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдекхія шюнія па̄шандīр бука пха̄те\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eТвори Шрīли Шрīдгара Маха̄ра̄джа\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-ha-ha-bhaktivinoda-thakkura-guroh\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрīмад Бгакті Вінод-віраха Дашякам \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003ePrayer in Separation of Śrīla Bhakti Vinod Ṭhākur\u003c/h3\u003e\n\u003ch4\u003eШрīла Бгакті Ракшак Шрīдгар Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eха̄ ха̄ бгактівінода-тхаккура! ґурох!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;два̄вімшятіс те сама̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдīрга̄д-духкха-бгара̄д-ашєша-віраха̄д-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;духстхīкрита̄ бгӯріям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджīва̄на̄м баху-джанма-пунья-ніваха̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кришто махī-мандале\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄вірбга̄ва-крипа̄м чака̄ра ча бгава̄н\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-ґаура-шяктіх сваям\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдīно ’хам чіра-душкритір на хі бгават-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;па̄да̄бджа-дгӯлі-кана̄-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсна̄на̄нанда-нідгім прапанна-шюбгадам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лабдгум самартхо ’бгавам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкінтв ауда̄рʼя-ґуна̄т-тава̄ті-яшясах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ка̄рунья-шяктіх сваям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-шрī-ґаура-маха̄прабгох пракатіта̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вішвам саманваґрахīт\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eхе дева! ставане тава̄кхіла-ґуна̄на̄м\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;те віріньча̄дайо\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдева̄ вʼяртха-мано-ратха̄х кім у ваям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мартьядгама̄х курмахе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eетан но вібудгайх када̄пй атішяяланка̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ітй учʼята̄м\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшястрешв ева “на па̄рає ’хам” іті яд\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґа̄там мукундена тат\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдгармаш-чарма-ґато ’ґʼятайва сатата̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;йоґаш ча бгоґа̄тмако\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґʼяне шюнья-ґатір джапена тапаса̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кхʼятір джіга̄мсайва ча\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eда̄не да̄мбгіката̄ ’нура̄ґа-бгаджане\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;душта̄пача̄ро яда̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбуддгім буддгі-мата̄м вібгеда хі тада̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дга̄тра̄ бгава̄н прешитах\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвішве ’смін кіранайр ятха̄ хіма-карах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;саньджīваянн ошадгīр\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнакшатра̄ні ча раньджаян ніджа-судга̄м\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;віста̄раян ра̄джате\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсач-ча̄стра̄ні ча тошаян будга-ґанам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;саммодаямс те татха̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнӯнам бгӯмі-тале шюбгодая іті\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хла̄до бахух са̄твата̄м\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eлока̄на̄м хіта-ка̄мʼяя бгаґавато\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгакті-прача̄рас твая\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґрантха̄на̄м рачанайх сата̄м абгіматайр\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄на̄-відгайр даршітах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄ча̄рʼяйх крита-пӯрвам ева кіла тад\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄ма̄нуджа̄дьяйр будгайх\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрема̄мбго-нідгі-віґрахасья бгавато\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ма̄ха̄тмʼя-сīма̄ на тат\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eяд дга̄мнах кхалу дга̄ма чайва ніґаме\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;брахметі самґʼяяте\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eясьямшясья калайва духкха-нікарайр\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;йоґешварайр мриґʼяте\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвайкунтхе пара-мукта-бгринґа-чарано\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ра̄яно ях сваям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтасьямші бгаґава̄н сваям раса-вапух\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кришно бгава̄н тат прадах\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсарва̄чінтьямає пара̄тпара-пуре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґолока-вринда̄ване\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчіл-лīла̄-раса-ранґінī паріврита̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;са̄ ра̄дгіка̄ шрī-харех\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eва̄тсальяді-расайш ча севіта-танор-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ма̄дгурʼя-сева̄-сукхам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнітьям ятра муда̄ таноті хі бгава̄н\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тад дга̄ма-сева̄-прадах\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-ґаура̄нуматам сварӯпа-відітам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;рӯпа̄ґраджена̄дритам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eрӯпа̄дьяйх парівешітам рагу-ґанайр\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄сва̄дітам севітам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджīва̄дьяйр абгіракшитам шюка-шіва-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;брахма̄ді-самма̄нітам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-ра̄дга̄-пада-севана̄мритам ахо\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тад да̄тум īшо бгава̄н\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eква̄хам манда-матіс тв атīва-патітах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ква твам джаґат-па̄ванах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбго сва̄мін крипаяпара̄дга-нічайо\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нӯнам твая кшамʼята̄м\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eяче ’хам каруна̄-нідге! варам імам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;па̄да̄бджа-мӯле бгават-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсарвасва̄вадгі-ра̄дгіка̄-даїта-да̄са̄на̄м\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґане ґаньята̄м\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-guror-guro-me-paramo-gurus-tvam\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Шрīмад Ґаура-Кішора- намаска̄ра Дашякам \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eHomage unto Śrīmad Gaura Kiśora Bābājī Mahārāj\u003c/h3\u003e\n\u003ch4\u003eШрīла Бгакті Ракшак Шрīдгар Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґурор ґуро ме парамо ґурус твам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eваренья! ґаура̄нґа-ґана̄ґраґаньє\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрасīда бгритьє даїта̄шріте те\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнамо намо ґаура-кішора тубгʼям\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсарасватī-на̄ма-джаґат-прасіддгам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрабгум джаґатьям патітайка-бандгум\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтвам ева дева! пракатī-чака̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнамо намо ґаура-кішора тубгʼям\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eквачід-враджа̄ранья-вівікта-ва̄сī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхриді враджа-двандва-рахо-віла̄сī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбахір віра̄ґī тв авадгӯта-веши\u003c/strong\u003 bsp;\u0026nbsp;сарва джīва̄нтарастхо\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eйо ва̄ ґарбгодашяї-дашя-шята-вадано\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;веда-сӯктайр віґīтах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбрама̄нда̄шєша ґарбга̄ пракриті-паті-патір\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джīва-санга̄шраянґах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī нітьянанда-чандрам бгаджа бгаджа сататам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґаура-кришна-прадам там\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eясьямшо вʼюха-мадгʼє віласаті парама-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вйомні самкаршана̄кхʼя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄танван шюддга-саттвам нікхіла-харі-сукхам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;четанам лīлая ча\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджīва̄ханка̄ра-бга̄ва̄спада іті катхітах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кутрачідж-джīвавад ях\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-нітьянанда-чандрам бгаджа бгаджа сататам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґаура-кришна-прадам там\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eяшча̄ді вʼюха-мадгʼє прабгаваті саґано\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мӯла-санкаршана̄кхйо\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдва̄ра̄ватьям тад-ӯрдге мадгупурі васаті\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пра̄бгава̄кхйо віла̄сах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсарва̄мші ра̄ма-на̄ма̄ враджапурі рамате\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;са̄нуджо ях сварӯпе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-нітьянанда-чандрам бгаджа бгаджа сататам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґаура-кришна-прадам там\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-кришна-премана̄ма̄ парама-сукхамаях\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ко’пʼячінтьях пада̄ртхо\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eяд ґандга̄т саджджанауга̄ ніґама-бангуматам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мокшам апй а̄кшипанті\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкайвальяйшварʼя-сева̄-прадаґана іті\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ясьянґатах премада̄тух\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī нітьянанда-чандрам бгаджа бгаджа сататам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґаура-кришна-прадам там\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eйо ба̄льє лīлаяйках парама-мадгурая\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чайкачакра̄наґарʼям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eма̄та̄-пітрор джана̄на̄ матха ніджа-сухрида̄м\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хла̄даямш чітта-чакрам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтīртха̄н вабгра̄ма сарва̄нупахрита джанако\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ньясіна̄ пра̄ртхіташ ча\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-нітьянанда-чандрам бгаджа бгаджа сататам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґаура-кришна-прадам там\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгра̄мам бгра̄мань ча тīртха̄н яті-мукута-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мані ма̄дгавендра прасанґа̄т\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eлабдголла̄сах пратікшʼя пракатіта-чарітам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґаурадга̄ма̄джаґа̄ма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-ґаурах шрīніва̄са̄дібгір апі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;яма̄ва̄па̄лає нанданасья\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī нітьянанда-чандрам бгаджа бгаджа сататам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґаура-кришна-прадам там\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпра̄пта̄ґйо ґаура-чандра̄дакхіладжана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґаноддга̄ра-на̄ма-прада̄не\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eях пра̄пʼя двау сура̄пау калікалуша-хатау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгра̄тарау брахма-дайтьяу\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґа̄дга-према прака̄шяйх крита-рудгіра-вапуш\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ча̄пі та̄в-уджджаха̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-нітьянанда-чандрам бгаджа бгаджа сататам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґаура-кришна-прадам там\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eса̄кша̄д-ґауро ґана̄на̄м шірасі яд\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;авадгӯтасья каупīна-кхандам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсамдгартунь ча̄дідешясава явана вадгӯ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;спришта-дришто ’пі вандьях\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбрахма̄дьяна̄м апīті прабгу-паріхритака̄на̄м\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;апі свешта-пīтах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-нітьянанда-чандрам бгаджа бгаджа сататам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґаура-кришна-прадам там\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eуддгартум ґʼяна-карма̄дй-апахата-чаріта̄н\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґаура-чандро яд а̄сау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eньясам критва
