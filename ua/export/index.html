андра\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґа̄нтхія ма̄ла̄тір ма̄ла̄ дібо донгара ґоле\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eадгаре тулія дібо карпӯра-та̄мбуле\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eлаліта̄ віса̄кха̄-а̄ді джата сакхī-вринда\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄ґʼяя корібо сева̄ чарана̄равінда\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-кришна-чайтанья-прабгур да̄сер ануда̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсева̄ абгіла̄ша коре нароттама-да̄са\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-radhe-jaya-krishna-jaya-vrindavan\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Враджа-дга̄ма-махіма̄мрита \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Кришнада̄с Кавіра̄дж Ґосва̄мī\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая ра̄дге, джая кришна, джая вринда̄ван\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-ґовінда, ґопīна̄тха, мадана-мохан\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава Радзі та Крішні і їхньому божественному лісу Вриндавану. Слава трьом головним Божествам Вриндавана — Шрі Ґовінді, Ґопінатху та Мадана-Мохану.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшьяма-кунда, ра̄дга̄-кунда, ґірі-ґовардган\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eка̄ліндī ямуна̄ джая, джая маха̄ван\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава Шьяма-\u003ci\u003eкунді\u003c/i\u003e, Радга-\u003ci\u003eкунді\u003c/i\u003e, пагорбу Ґовардгану та річці Ямуні, знаній як Калінді. Слава безкрайньому лісу Махавану, в якому Крішна й Баларам явили всі Свої дитячі \u003ci\u003eліли\u003c/i\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкеші-га̄та, вамші-вата, два̄дашя-ка̄нан\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджа̄нга̄ соб лīла̄ коіло шрī-нанда-нандан\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава Кеші-\u003ci\u003eгату\u003c/i\u003e, де Крішна вбив демона Кеші. Вся слава дереву Вамші-ват, під яким грав на Своїй флейті Крішна, закликаючи всіх \u003ci\u003eґопі\u003c/i\u003e. Слава дванадцятьом лісам Враджі, місцям, де відбулися всі \u003ci\u003eліли\u003c/i\u003e сина Нанди, Шрі Крішни.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-нанда-яшода̄ джая, джая ґопа-ґан\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрīда̄ма̄ді джая, джая дгену-ватса-ґан\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава божественним батькові й матері Крішни, Нанді та Яшоді. Слава пастушкам, на чолі зі Шрідамою, старшим братом Шріматі Радгарані та Ананґи Маньджарі. Слава коровам і телятам Враджі.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая вришабга̄ну, джая кīртіда̄ сундарī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджая паурнама̄сī, джая а̄бгīра-на̄ґарī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава божественним батькові й матері Радги, Вришабгану та прекрасній Кіртіді. Слава Паурнамасі, матері Сандіпані Муні, бабусі Мадгуманґала й Нандімукхі, яка є улюбленою ученицею Деварши Наради. Слава юним пастушкам Враджі.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая джая ґопешвара вринда̄вана-ма̄джг\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджая джая кришна-сакха̄ бату двіджа-ра̄дж\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава, слава Ґопешвару Шіві, який перебуває у Вриндавані, щоб оберігати святу \u003ci\u003eдгаму\u003c/i\u003e. Слава, слава кумедному другові Крішни — \u003ci\u003eбрахману\u003c/i\u003e Мадгуманґалу.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая ра̄ма-га̄та, джая рохінī-нандан\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджая джая вринда̄вана-ва̄сī джата джон\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава Рама-\u003ci\u003eгату\u003c/i\u003e, на якому Господь Баларам звершив Свою \u003ci\u003eраса-лілу\u003c/i\u003e. Слава Господу Баларамі, синові Рохіні. Слава, слава всім мешканцям Вриндавана.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая двіджа-патнī, джая на̄ґа-конья-ґон\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгактіте джа̄нга̄ра̄ па̄іло ґовінда-чаран\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВся слава дружинам гордовитих ведичних \u003ci\u003eбрахманів\u003c/i\u003e. Вся слава дружинам змія Калії. Завдяки чистоті своєї \u003ci\u003eбгакті\u003c/i\u003e всі вони досягли лотосових стоп Господа Ґовінди.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-ра̄са-мандала джая, джая ра̄дга̄-шьям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджая джая ра̄са-лīла̄ сарва-манорам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава місцю \u003ci\u003eраса-ліли\u003c/i\u003e Шрі Крішни. Слава Радзі та Шьяму. Слава, слава найпрекраснішій серед усіх \u003ci\u003eліл\u003c/i\u003e Господа Крішни — божественній \u003ci\u003eраса-лілі\u003c/i\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая джайоджвала-раса сарва-раса-са̄р\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпаракīя-бга̄ве джа̄ха̄ враджете прача̄р\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава, слава \u003ci\u003eрасі\u003c/i\u003e подружньої любові, найвищій серед усіх \u003ci\u003eрас\u003c/i\u003e. У Враджі Шрі Крішна являє її у вигляді божественної \u003ci\u003eпаракія-бгави\u003c/i\u003e, настрою кохання поза шлюбом.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-джа̄хнава̄-па̄да-падма корія смаран\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдīна кришнада̄са кохе на̄ма-санкīртан\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eНесучи в серці образ лотосових стоп Шрі Джахнави Деві, супутниці Господа Нітьянанди, цей дуже занепалий і нікчемний Крішнадас співає \u003ci\u003eсанкіртану\u003c/i\u003e Святого Імені.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-janama-saphala-tara-krishna-darashiana-jara\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eРӯпа-Кīртан \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджанама сапхала та̄’ра,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кришна-дарашяна джа̄’ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бга̄ґʼє хоіячхе ека-ба̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбікашія хрін-наяна\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;корі’ кришна дарашяна\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чха̄де джīва чіттера біка̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вринда̄вана-келі чатур ванама̄лī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтрібганґа-бганґіма̄рӯпа\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вамші-дгарī апарӯпа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;расамоя нідгі, ґуна-шялī\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eварна нава джаладгара\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шіре шікхі піччха вара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;алака̄ тілака шобга̄ па̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпарідга̄не пīта-ва̄са\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вадане мадгӯра ха̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хено рӯпа джаґат ма̄та̄я\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eіндранīла джіні\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кришна-рӯпакха̄ні\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;херія кадамба-муле\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмон уча̄тана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на чхоле чарана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;самса̄ра ґела̄ма бгӯле\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(сакхī хе)\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;судга̄моя се рӯпа-ма̄дгурī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;декхіле наяна,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хоя ачетана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джгоре премамоя ва̄рі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкіба̄ чӯда̄ шіре\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кіба̄ вамші коре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кіба̄ се трібганґа-тха̄ма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчарана-камале,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;амія учхоле,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄ха̄те нӯпура да̄ма\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсада̄ а̄шя корі\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгринґа-рӯпа дгорі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чарана камале стха̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eана̄ясе па̄і\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кришна-ґуна ґа̄і\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ро на̄ бгаджібо а̄на\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shiuno-he-rasika-jon-krishna-guna-aganon\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eҐуна-Кīртан \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшюно, хе расіка джон\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кришна ґуна аґанон\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ананта кохіте на̄хі па̄ре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкришна джаґатера ґуру\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кришна ва̄ньча̄калпатару\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄віко се бгава-па̄ра̄ба̄ре\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eхридоя пīдіта джа̄’ра\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кришна чікітсака та̄’ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгава роґа на̄шіте чатура\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкришна бахірмукха джоне\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;према̄мрита вітаране\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;краме лоя ніджа антахпура\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкарма-бандга ґʼяна-бандга, а̄вешє ма̄нава андга\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄ре кришна каруна̄ са̄ґара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпа̄дападма мадгу дія, андга-бга̄ва гуча̄ія\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чаране корена анучара\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвідгі-ма̄рґа рата джоне\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сва̄дгīната̄ ратна да̄не\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄ґама̄рґе кара̄на правешя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄ґа-вашяварті хо’є\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;па̄ракīя-бга̄ва̄шроє\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лобге джīва кришна-према̄вешя\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпрема̄мрита-ва̄рі-дга̄ра̄\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сада̄ па̄нарата та̄н’ра̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кришна та̄нга̄дера бандгу паті\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсеі саба враджа-джана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сукальяна-нікетана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дīнахīна вінодера ґаті\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-yashoda-nandana-krishna-gopala-govinda\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eДжая Яшода̄-Нандана Кришна \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая яшода̄-нандана кришна ґопа̄ла ґовінда\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджая мадана-мохана харі ананта мукунда\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава сину Матінки Яшоди — Крішні, Ґопалу (Пастушку), Ґовінді (Покровителю корів)! Слава Мадана-Мохану (Тому, Хто зачаровує Купідона), Харі (Всевишньому), Ананті (Безмежному), Мукунді (Визволителю)!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая ачʼюта ма̄дгава ра̄м вринда̄вана-чандра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджая муралī-вадана шьяма ґопī-джана̄нанда\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава Ачʼюті (Безгрішному), Мадгаві (Коханому), Рамі (Тому, Хто дарує радість), Вриндавана-Чандрі (Місяцю Вриндавана)! Слава Муралі-вадану (Тому, Хто тримає флейту біля Своїх уст), Шьяму (Тому, Хто кольором подібний до темної грозової хмари) та Ґопі-джанандану (Тому, Хто дарує щастя \u003ci\u003eґопі\u003c/i\u003e)!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shrita-kamala-kuchha-mandala-dhrita\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШріта Камала̄ \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Джаядева Ґосва̄мī\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшріта-камала̄-кучха-мандала дгрита-кундала хе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкаліта-лаліта-вана-ма̄ла джая джая дева харе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдіна-мані-мандала-мандана бгава-кхандана хе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмуні-джана-ма̄наса-хамса джая джая дева харе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eка̄лія-віша-дгара-ґаньджана джана-раньджана хе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eядукула-наліна-дінешя джая джая дева харе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмадгу-мура-нарака-віна̄шяна ґаруда̄сана хе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсура-кула-келі-ніда̄на джая джая дева харе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eамала-камала-дала-лочана бгава-мочана хе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтрібгувана-бгувана-нідга̄на джая джая дева харе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджанака-сута̄-крита-бгӯшана джіта-дӯшана хе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсамара-шяміта-дашя-кантха джая джая дева харе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eабгінава-джала-дгара-сундара дгрита-мандара хе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-мукха-чандра-чакора джая джая дева харе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтава чаранам праната̄ ваям іті бга̄вая хе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкуру кушялам пранатешу джая джая дева харе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-джаядева-кавер ідам куруте мудам хе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eманґалам уджджвала-ґīтам джая джая дева харе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eЕкадаші та святкові дні\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-jaya-shrila-maharaja-charanaravinda\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eА̄ча̄рʼя-чарана-вандана \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīпа̄д Бгакті А̄нанда Са̄ґар Маха̄ра̄дж\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая шрīла маха̄ра̄джа чарана̄равінда\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī бгакті сундара дева-ґосва̄мī ґовінда\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджаґатера суманґала коріба̄ра а̄шє\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтумі аватīрна хоіла̄ сніґдга ґуру-вешє\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпрапхулла наліна джена ха̄сіма̄кха̄ мукха\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдекхі вриддга-ба̄ла-джува̄ па̄я маха̄-сукха\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсвадешє-відешє харіна̄мера прача̄ре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eабгінава ґаура-преме бга̄са̄ле саба̄ре\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-коре лекханī джена ананта пхояра̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсумадгура дівʼява̄нī-віґаліта-дга̄ра̄\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсу-сіддга̄нта-дга̄ра̄дгара сатья суґамбгīра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-ґуру-вайшнава-сева̄-ніштха маха̄дгīра\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eса̄дгу-прія саралата̄ тома̄ра бгӯшана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eама̄нī ма̄нада сада̄ міштха-самбга̄шана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґуру-маха̄ра̄джа джатіра̄джа-ра̄джешвара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-бгакті-ракшака дева-ґосва̄мī шрīдгара\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпарама сонтушта тава вішрамбга-сева̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніджа-ха̄те вʼяса̄сане васа̄’ла тома̄я\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсукхе манонīта коіла̄ уттара̄дгіка̄рī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eехена апӯрва снеха котха̄о на̄ хері\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eрӯпа-сарасватī-шрīдгар-дга̄ра̄-сротасвінī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтава хриде вахе сада̄ бгувана па̄ванī\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшіва-ґуру-санкаршана каруна̄-нілая\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнітьянанда-рӯпе тава хриде віласая\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсуджана судгīра-ґана тава ґуна-ґа̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдурбга̄ґа̄ ваньчіта апара̄дге море ха̄я\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"14\"\u003e\n\u003ch5\u003e14\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґуру-ґаура-кришна-сева̄-саубга̄ґʼя-прака̄шє\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eса̄нанде адгама бга̄се санкīртана ра̄се\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-krishna-hoite-chatur-mukha\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Ґуру-парампара̄ \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eVerses 1-9 composed by Śrīla Saraswati Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкришна хоіте чатур-мукха,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хон кришна-севонмукха,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;брахма̄ хоіте на̄радера маті\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄рада хоіте вʼяса,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мадгва кохе вʼяса-да̄са,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пӯрнапраґʼя падмана̄бга ґаті\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eНа початку творення світу наука відданого служіння була явлена чотириликому Брахмі від Верховного Господа Шрі Крішни. Деварши Нарада прийняв цю божественну науку від Брахми. Великий мудрець Крішна Двайпаяна Вʼяса, якому було даровано силу укласти \u003ci\u003eведичні\u003c/i\u003e писання, став учнем Деварши Наради. Шріпад Мадгва Ачарʼя, засновник школи \u003ci\u003eведантичної\u003c/i\u003e філософії \u003ci\u003eшюддга-двайти\u003c/i\u003e, називає себе слугою Крішни Двайпаяни Вʼяси. У XIII столітті він відвідав Вʼясадеву в Бадарікашрамі, щоб навчатися у нього \u003ci\u003eведанти\u003c/i\u003e. Пурнапраґʼя Тіртха (Мадгва) є \u003ci\u003eґуру\u003c/i\u003e і єдиним притулком Падманабги Тіртхи.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнрихарі ма̄дгава-бамшє,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;акшобгʼя парамахамсе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шішʼя болі анґīка̄ра коре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eакшобгʼєра шішʼя джая-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тīртха на̄ме парічая,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄нра да̄сьє ґʼянасіндгу торе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eДвома іншими головними учнями Мадгви є Нріхарі Тіртха і Мадгава Тіртха. Мадгава Тіртха прийняв великого \u003ci\u003eпарамахамсу\u003c/i\u003e Акшобгʼю Тіртху як свого учня. Головний учень Акшобгʼї Тіртхи був відомий як Джаятіртха. Слугою Джаятіртхи був його учень Ґʼянасіндгу.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eта̄нга̄ хоіте даянідгі,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄нра да̄са відьянідгі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄джендра хоіло та̄нга̄ хоіте\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eта̄нга̄ра кінкора джая-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дгарма на̄ме парічоя,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;парампара̄ джа̄но бга̄ло мате\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eДаянідгі прийняв науку відданого служіння від Ґʼянасіндгу, а слугою Даянідгі був Відьянідгі (Відьядгіраджа Тіртха). Раджендра Тіртха став учнем Відьядгіраджі Тіртхи. Слугою Раджендри Тіртхи був Джаядгарма, відомий також як Віджаядгваджа Тіртха. Так слід належним чином розуміти цю учнівську послідовність.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджаядгарма-да̄сьє кхʼяті,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī пурушоттама-яті\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄н’ха’те брахманья-тīртха сӯрі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвʼясатīртха та̄нра да̄са,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лакшмīпаті вʼяса-да̄са,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄нга хоіте ма̄дгавендра пурī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВеликий \u003ci\u003eсанньясі\u003c/i\u003e Шрі Пурушоттама Тіртха отримав своє духовне знання в служінні своєму \u003ci\u003eґуру\u003c/i\u003e, Віджаядгваджі Тіртсі (Джаядгармі). Головним учнем Пурушоттами Тіртхи був Субрахманья Тіртха. Його слугою був великий Вʼясатіртха (Вʼяса Рая). Слугою Вʼясатіртхи був Лакшміпаті Тіртха, учнем якого став Мадгавендра Пурі Ґосвамі.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eма̄дгавендра пурī-вара,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шішʼя-вара шрī-īшвара,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нітьянанда, шрī-адвайта вібгу\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eīшвара-пурīке дгонья,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;корілена шрī-чайтанья,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джаґад-ґуру ґаура маха̄прабгу\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eГоловним учнем Мадгавендри Пурі був Ішвара Пурі, а двома іншими його учнями були славні втілення Господа - Шрі Нітьянанда і Шрі Адвайта Ачарʼя. Шрі Чайтанья Махапрабгу, духовний наставник усіх світів, обдарував Ішвару Пурі великою вдачею, прийнявши Його як свого духовного вчителя.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмаха̄прабгу шрī-чайтанья,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄дга̄-кришна нахе анья,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;рӯпа̄нуґа джонера джīвана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвішвамбгара пріянкара,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī сварӯпа-да̄модара,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī ґосва̄мī рӯпа-сана̄тана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eМахапрабгу Шрі Чайтанья не відрізняється від Шрі Шрі Радги і Крішни і є самим життям \u003ci\u003eвайшнавів\u003c/i\u003e, які йдуть за Шрі Рупою Ґосвамі. Шрі Сварупа Дамодар Ґосвамі, Рупа Ґосвамі і Санатана Ґосвамі дарували велику радість Вішвамбгару (Шрі Чайтаньї).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eрӯпапрія маха̄джана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джīва-рагуна̄тха хон,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄нра прія каві кришнада̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкришнада̄са-пріявара,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нароттама сева̄пара,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джа̄нра пада вішвана̄тха-а̄шя\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВеликі душі Джіва Ґосвамі і Рагунатх Дас Ґосвамі стали дуже дорогими Рупі Ґосвамі. Джіва Ґосвамі був учнем Рупи Ґосвамі. Рагунатх Дас Ґосвамі, учень учня Адвайти Ачарʼї — Джадунандана Ачарʼї, був прийнятий Рупою і Санатаною як їхній третій брат. Улюбленим учнем Рагунатха Даса Ґосвамі був Крішнадас Кавірадж Ґосвамі. Крішнадас Кавірадж був близьким другом Локанатха Ґосвамі. Вони жили разом у Вриндавані і завжди обговорювали між собою теми, повʼязані з Крішною. Локанатх Ґосвамі, учень Ґададгара Пандіта, мав лише одного учня на імʼя Нароттам Дас. Нароттам Дас завжди служив своєму \u003ci\u003eґуру\u003c/i\u003e, а також віддавав себе служінню близьким друзям свого \u003ci\u003eґуру\u003c/i\u003e. Так він став дуже дорогим для Крішнадаса Кавіраджа Ґосвамі. Служити лотосовим стопам Нароттама Даса Тхакура було єдиним прагненням Вішванатха Чакраварті Тхакура, який був четвертим \u003ci\u003eачарʼєю\u003c/i\u003e в учнівській спадкоємності від Нароттама Даса.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвішвана̄тха-бгакта-са̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;баладева джаґанна̄тх,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄нра прія шрī-бгактівінода\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмаха̄-бга̄ґавата-вара,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-ґауракішора-вара,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;харі-бгаджанете джа̄нра мода\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВішванатх Чакраварті Тхакур був \u003ci\u003eшікша-ґуру\u003c/i\u003e (наставником) Баладеви Відьябгушани, якому він передав науку «Шрімад-Бгаґаватам». Джаґаннатх Дас Бабаджі був дуже визначним \u003ci\u003eачарʼєю\u003c/i\u003e після Шрі Баладеви Відьябгушани і став улюбленим \u003ci\u003eшікша-ґуру\u003c/i\u003e Шрі Бгактівінода Тхакура. Бгактівінод Тхакур мав близьку дружбу і спільне служіння з видатним \u003ci\u003eмахабгаґаватою\u003c/i\u003e Шрі Ґаура Кішором Дасом Бабаджі, чия єдина радість завжди була в \u003ci\u003eхарі-бгаджані\u003c/i\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтадануґа-маха̄джон\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-кришна-кīртана-дгон\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джеба̄ діло пурі джаґа ка̄ма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī ва̄ршабга̄навīбара̄\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сада̄ севʼя сева̄пара̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄нга̄ра даїта-да̄са на̄ма\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПослідовники Шріли Ґаури Кішора Даса Бабаджі наповнюють світ скарбом Шрі Крішна-\u003ci\u003eкіртану\u003c/i\u003e. Його учень, Шрі Варшабганаві Даїта Дас (Шріла Сарасваті Тхакур) - той, хто завжди служить Крішні, найдорожчому коханому Радгарані.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтадабгīнна дехо-дівʼя\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сварӯпа-рӯпа-рагу-джівʼя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сада̄ севʼя джа̄нра па̄дападма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсусіддга̄нта мӯрті-дгара\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī шрīдгара ґурувара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;рупа̄нуґа-са̄дгу шрея садма\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТой, хто є уособленням \u003ci\u003eбгакті-сіддганти\u003c/i\u003e (як і Шріла Сарасваті Тхакур); хто живе в настрої вчення Шріли Сварупи Дамодара, Шріли Рупи Ґосвамі та Шріли Рагунатха Даса Ґосвамі; чиї лотосові стопи завжди є радісним, гідним поклоніння притулком для послідовників Рупи Ґосвамі, - це Шріла Шрідгар Дев-Ґосвамі.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eта̄нра прія мано’ бгīшта\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;стха̄пане сада̄сачешта\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгакті сундара шрī ґовінда на̄ма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eеі парампара̄ дгана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сабе ґаура-ніджаджана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄ндера уччхіште мора ка̄ма\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТой, хто є дуже дорогим учнем цього Шріли Шрідгара Дев-Ґосвамі Махараджа, хто утверджує його божественне вчення і безупинно сповнює його прагнення, — це Шріла Бгакті Судгір Ґовінда Дев-Ґосвамі. Це - наша велична лінія духовних наставників, і всі вони дуже дорогі Шрі Чайтаньї Махапрабгу. Я живу лише їхньою милістю.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-bhayabhanjana-jayashiamsana\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Даїта Да̄с Пранаті Паньчакам \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eHomage unto Śrīla Saraswati Ṭhākur\u003c/h3\u003e\n\u003ch4\u003eШрīла Бгакті Ракшак Шрīдгар Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгаябганьджана джаяшямсана-каруна̄ята-наянам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eканакотпала джанакоджджвала-расаса̄ґара-чаянам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмукхарīкрита-дгаранīтала-харікīртана-расанам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкшитіпа̄вана-бгавата̄рана-піхіта̄руна-васанам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшюбгадодая-дівасе вришаравіджа̄-ніджа-даїтам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпранама̄мі ча чарана̄нтіка-паріча̄рака-сахітам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшярана̄ґата-бгаджанаврата-чірапа̄лана-чаранам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсукрита̄лая-сарала̄шяя-суджана̄кхіла-варанам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхаріса̄дгана-критаба̄дгана джанашясана-каланам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсачара̄чара-каруна̄кара-нікхіла̄шіва-даланам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшюбгадодая-дівасе вришаравіджа̄-ніджа-даїтам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпранама̄мі ча чарана̄нтіка-паріча̄рака-сахітам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eатілаукіка-ґатітауліка-ратікаутука-вапушам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eатідайвата-матівайшнава-яті-вайбгава-пурушам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсасана̄тана-рагурӯпака-парама̄нуґачарітам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсувіча̄рака іва джīвака іті са̄дгубгірудітам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшюбгадодая-дівасе вришаравіджа̄-ніджа-даїтам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпранама̄мі ча чарана̄нтіка-паріча̄рака-сахітам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсарасīтата-сукхадотаджа-нікатапріябгаджанам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eлаліта̄мукха-лалана̄кула-парама̄дараяджанам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвраджака̄нана-бахума̄нана-камалапріянаянам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґунаманьджарі-ґаріма̄-ґуна-харіва̄санаваянам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшюбгадодая-дівасе вришаравіджа̄-ніджа-даїтам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпранама̄мі ча чарана̄нтіка-паріча̄рака-сахітам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвімалотсавам амалоткала-пурушоттама-джананам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпатітоддгриті-каруна̄стриті-кританӯтана-пулінам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eматхура̄пура-пурушоттама-самаґаурапуратанам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхаріка̄мака-харідга̄мака-харіна̄мака-ратанам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшюбгадодая-дівасе вришаравіджа̄-ніджа-даїтам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпранама̄мі ча чарана̄нтіка-паріча̄рака-сахітам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jayare-jayare-jaya-paramahamsa-mahashiaya\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eА̄ча̄рʼя вандана \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eҐопа̄л Ґовінда Маханта\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджаяре джаяре джая\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;парамахамса маха̄шяя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī бгактісіддга̄нта сарасватī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґосва̄мī тха̄кура джая\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;парама каруна̄моя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дīнахīна аґатіра ґаті\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ніла̄чоле хоія удая\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī ґаудамандале а̄сі’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;према бгакті парака̄ші’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джівера на̄шіла̄ бгава-бгая\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтома̄ра махіма̄ ґа̄і\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хено са̄дгʼя мора на̄і\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тобе па̄рі джоді дехо шякті\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвішвахіте авірата\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ча̄ра-прача̄ре рата\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вішюддга шрī рӯпа̄нуґа бгакті\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрīпа̄т кхетарі дга̄ма\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тха̄кура шрī нароттама\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тома̄те та̄нга̄ра ґуна декхі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшястрера сіддга̄нта-са̄ра\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шюні ла̄ґе чаматка̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кута̄ркіка діте на̄ре пха̄нкі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшюддга бгакті-мата джата\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;упадгарма-каваліта\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;херія локера моне тра̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eха̄ні’ сусіддга̄нта-ва̄на\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;упадгарма кха̄на кха̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;саджджанера ва̄да̄ле улла̄са\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсма̄ртамата джаладгара\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шюддга бгакті робі-кара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ча̄діла бга̄вія антаре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшястра сіндгу мантханете\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сусіддга̄нта джганьджга̄ва̄те\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;уда̄іла̄ діґ діґантаре\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eстха̄не стха̄не кото мотх\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;стха̄піяча нішкапот\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;према сева̄ шікха̄іте джīве\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмотхера вайшнава ґон\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;коре сада̄ вітарон\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;харі ґуна-катха̄мрита бгаве\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшюддга-бгакті-манда̄кінī\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вімала права̄ха а̄ні\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шітала коріла̄ таптапра̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдешє дешє нішкіньчан\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;преріла̄ вайшнава ґон\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;віста̄ріте харіґуна ґа̄на\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпӯрве ятха̄ ґаурахарі\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ма̄ява̄да чеда корі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вайшнава коріла̄ ка̄шіва̄сī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвайшнава даршяна-сукшма\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;віча̄ре тумі хе дакша\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тематі тошила̄ ва̄ра̄насī\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдайва-варна̄шрама-дгарма\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;харі бгакті джа̄ра марма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шястра джукте коріла̄-нішчой\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґʼяна-джоґа-карма чхой\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мӯлья та̄ра кічху ной\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгактіра віродгī джоді хой\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī ґаудамандала бгӯмі\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгакта санґе парікрамі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сукīрті стха̄піла̄ маха̄шой\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eабгінна враджа мандала\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґаудабгӯмі премоджвала\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;прача̄ра хоіло вішвамой\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкуліяте па̄шандīра̄\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;атьяча̄ра коіло джа̄’ра̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄ саба̄ра доша кшома̄ корі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджаґате коіле гошана̄\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘тароріва сахішнуна̄’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хон ‘кīртанīях сада̄ харіх’\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī вішва-вайшнава-ра̄джа\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сабга̄-мадгʼє ‘па̄трара̄джа’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;упа̄дгі-бгӯшане вібгӯшита\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвішвера манґала ла̄ґі’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хоіячо сарва’ тьяґī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вішвава̄сī джон-хіте рата\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"14\"\u003e\n\u003ch5\u003e14\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкорітечо упака̄ра\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джа̄те пара упака̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лобге джīва шрī кришна-сева̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдӯре джа̄я бгава-роґа\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кханде джа̄хе карма бгоґа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;харі па̄да падма джа̄’те па̄я\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"15\"\u003e\n\u003ch5\u003e15\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджīва моха-нідра̄ ґата\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джа̄ґа̄’те вайкунтха дӯта\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘ґаудīя’ па̄тха̄о горе горе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eутхоре утхоре бга̄і\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ро то самоя на̄і\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘кришна бгаджа’ боле учайхсваре\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"16\"\u003e\n\u003ch5\u003e16\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтома̄ра мукха̄равінда-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;віґаліта макаранда\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сіньчіта ачʼюта-ґуна-ґа̄тха̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшюніле джуда̄я пра̄на\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тамо моха антардга̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дӯре джа̄я хридоєра вʼятха̄\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"17\"\u003e\n\u003ch5\u003e17\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджа̄ні а̄мі маха̄шой\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джашова̄ньча̄ на̄хі хой\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бінду ма̄тра тома̄ра антаре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтава ґуна вīна̄дга̄рī,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мора кантха-вīна̄ дгорі’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;авашєте бола̄я а̄ма̄ре\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"18\"\u003e\n\u003ch5\u003e18\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвайшнавера ґуна-ґа̄на\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;коріле джīвера тра̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шюніячі са̄дгу ґуру мукхе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкришна бгакті-самудой\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джанама сапхала хой\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;е бгава-са̄ґара торе сукхе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"19\"\u003e\n\u003ch5\u003e19\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eте-ка̄ране праяса\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ятха̄ ва̄манера а̄шя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґаґанера ча̄нда дгорі ба̄ре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eадоша-дараші тумі\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;адгама патіта а̄мі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ніджа ґуне кшоміва̄ а̄ма̄ре\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"20\"\u003e\n\u003ch5\u003e20\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī ґаура̄нґа-па̄рішада\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тха̄кура бгактівінода\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дīнахīна патітера бандгу\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкалі-тамах віна̄шіте\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄нілена аванīте\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тома’ акаланка пӯрна інду\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"21\"\u003e\n\u003ch5\u003e21\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкара крипа̄ вітарана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;премасудга̄ анукшана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ма̄тія утхука джīва ґон\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхаріна̄ма-санкīртане\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄чука джаґата-джане\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вайшнава-да̄сера ніведан\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-pralaya-payodhi-jale-dhritavan-asi-vedam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Дашявата̄р-стотрам \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Джаядева Ґосва̄мī\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпралая-пайодгі-джале дгритава̄н асі ведам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;віхіта-вахітра-чарітрам акхедам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкешява дгрита-мīна-шярīра джая джаґадīшя харе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Кешяво! О Володарю всесвіту! О Господи Харі! Ти прийняв образ риби. Слава Тобі! Ти без зусиль став човном у вигляді велетенської риби, щоб врятувати Веди, які занурились в бурхливий океан спустошення.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкшитір іха віпулатаре тіштхаті тава приштхе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дгарані-дгарана-кіна-чакра-ґаріштхе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкешява дгрита-кӯрма-шярīра джая джаґадīшя харе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Кешяво! О Володарю всесвіту! О Господи Харі! Ти прийняв образ черепахи. Слава Тобі! У цьому втіленні божественної черепахи велика гора Мандара спочиває на Твоїй велетенській спині як вісь для збивання Молочного океану. Від тягаря цієї гори на Твоїй спині залишився шрам у вигляді глибокої западини, що стала Твоєю славною оздобою.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвасаті дашяна-шікхаре дгаранī тава лаґна̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шяшіні каланка-калева німаґна̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкешява дгрита-шюкара-рӯпа джая джаґадīшя харе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Кешяво! О Володарю всесвіту! О Господи Харі! Ти прийняв образ вепра. Слава Тобі! Земля, яка потонула в океані Ґарбгодака і опинилася на дні всесвіту, тепер непохитно спочиває на кінчику Твого ікла, наче темна пляма на диску місяця.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтава кара-камала-варе накхам адбгута-шринґам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;даліта-хіраньякашіпу-тану-бгринґам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкешява дгрита-нарахарі-рӯпа джая джаґадīшя харе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Кешяво! О Володарю всесвіту! О Господи Харі! Ти прийняв образ напівлюдини-напівлева. Слава Тобі! Так само, як осу можна легко розчавити пальцями, Ти розірвав тіло демона Хіраньякашіпу, подібного до оси, дивовижними гострими кігтями Своїх прекрасних лотосових рук.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eчхалаясі вікрамане балім адбгута-ва̄мана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пада-накха-нīра-джаніта-джана-па̄вана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкешява дгрита-ва̄мана-рӯпа джая джаґадīшя харе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Кешяво! О Володарю всесвіту! О Господи Харі! Ти прийняв образ карлика-\u003ci\u003eбрахмана\u003c/i\u003e. Слава Тобі! О дивовижний карлику, Своїми величезними кроками Ти перехитрив царя Балі. З нігтів Твоїх лотосових стоп витекли води Ґанґи, якими Ти даруєш звільнення всім живим істотам цього світу.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкшатрія-рудгіра-має джаґад-апаґата-па̄пам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;снапаясі паясі шяміта-бгава-та̄пам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкешява дгрита-бгриґупаті-рӯпа джая джаґадīшя харе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Кешяво! О Володарю всесвіту! О Господи Харі! Ти прийняв образ Бгриґупаті — Парашюрами. Слава Тобі! На полі Курукшетра Ти омиваєш землю потоками крові з тіл демонічних \u003ci\u003eкшатріїв\u003c/i\u003e, яких Ти знищив. Ти змиваєш гріхи світу, і завдяки Тобі живі істоти звільняються від палаючого вогню матеріального існування.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвітарасі дікшу ране дік-паті-каманīям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дашя-мукха-маулі-балім раманīям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкешява дгрита-ра̄ма-шярīра джая джаґадīшя харе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Кешяво! О Володарю всесвіту! О Господи Харі! Ти прийняв образ Рамачандри. Слава Тобі! У битві за Ланку Ти знищив десятиголового демона Равану і запропонував його голови як вишукане підношення хранителям десяти сторін світу на чолі з Індрою. Вони довго чекали на це, виснажені утисками того лиходія.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвахасі вапуши вішяде васанам джалада̄бгам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хала-хаті-бгīті-міліта ямуна̄бгам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкешява дгрита-халадгара-рӯпа джая джаґадīшя харе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Кешяво! О Володарю всесвіту! О Господи Харі! Ти прийняв образ Баларами — володаря плуга. Слава Тобі! Твоє сяйливе біле тіло вбране в одяг кольору свіжої синьої дощової хмари. Цей одяг має прекрасний відтінок темної води ріки Ямуни, що тремтить від страху перед ударами Твого плуга.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eніндасі яґʼя-відгер ахаха шруті-джа̄там\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;садая-хридоя даршіта-пашю-га̄там\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкешява дгрита-буддга-шярīра джая джаґадīшя харе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Кешяво! О Володарю всесвіту! О Господи Харі! Ти прийняв образ Будди. Слава Тобі! О Буддо, з серцем, сповненим співчуття, Ти засуджуєш \u003ci\u003eведичні\u003c/i\u003e жертвопринесення, під час яких вбивають беззахисних тварин.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмлеччха ніваха-нідгане калаясі карава̄лам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дгӯмакетум іва кім апі кара̄лам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкешява дгрита-калкі-шярīра джая джаґадīшя харе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Кешяво! О Володарю всесвіту! О Господи Харі! Ти прийняв образ Калкі. Слава Тобі! Ти зʼявляєшся як комета й тримаєш у руці грізний меч, щоб знищити полчища дикунів-безбожників наприкінці Калі-юґи.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-джаядева-кавер ідам удітам уда̄рам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрину сукха-дам шюбга-дам бгава-са̄рам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкешява дгрита-дашя-відга-рӯпа джая джаґадīшя харе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Кешяво! О Володарю всесвіту! О Господи Харі! Ти прийняв ці десять різних втілень. Слава Тобі!\u003cbr\u003e\nБлагаю всіх, хто чує: слухайте уважно цей прекрасний гімн поета Джаядеви! Він дарує щастя, він приносить благо, він відкриває найвищу суть буття!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eведа̄н удгарате джаґанті вахате бгӯ-ґолам удбібграте\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдайтьям да̄раяте балім чхалаяте\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кшатра-кшаям курвате\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпауластьям джаяте халам калаяте ка̄руньям а̄танвате\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмлеччха̄н мӯрччхаяте дашякриті-крите\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кришна̄я тубгʼям намах\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Господи Крішно, складаю Тобі свої поклони. Ти зʼявляєшся в образах цих десяти втілень. У образі Матсьї Ти рятуєш Веди, як Курма Ти тримаєш на Своїй спині гору Мандара. Як Вараха Ти піднімаєш землю Своїм іклом, а в образі Нарасімги розриваєш груди демона Хіраньякашіпу. У образі Вамани Ти обманюєш демонічного царя Балі, просячи в нього лише три кроки землі, а потім, розширивши Свої кроки, відбираєш у нього весь всесвіт. Як Парашюрама Ти винищуєш усіх безбожних \u003ci\u003eкшатріїв\u003c/i\u003e, а як Рамачандра перемагаєш царя \u003ci\u003eракшасів\u003c/i\u003e Равану. В образі Баларами Ти тримаєш плуг, яким приборкуєш лиходіїв і притягуєш до Себе ріку Ямуну. Як Господь Будда Ти проявляєш співчуття до всіх живих істот, що страждають у цьому світі, а наприкінці Калі-юґи Ти зʼявляєшся як Калкі, щоб приборкати \u003ci\u003eмлечх\u003c/i\u003e — деградованих ницих людей.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-namas-te-narasimhaya\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрī Нрисімга Прана̄м \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнамас те нарасімга̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрахла̄да̄хла̄да-да̄їне\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхіраньякашіпор вакшах-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшіла̄-танка-накха̄лає\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ складаю свої поклони Господу Нарасімзі, Який приносить радість Прахладі Махараджу, а Його нігті подібні до різців, що розтинають камʼяні груди демона Хіраньякашіпу.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eіто нрисімгах парато нрисімго\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eято ято ямі тато нрисімгах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбахір нрисімго хридає нрисімго\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнрисімгам а̄дім шяранам прападьє\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eГосподь Нарасімга присутній і тут, і там. Куди б я не пішов — усюди є Господь Нарасімга. Він одночасно перебуває і в серці, і зовні. Я вручаю себе Господу Нарасімзі — першоджерелу всього сущого і найвищому притулку.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch3\u003eШрī Дашявата̄р-стотрам\u003c/h3\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтава кара-камала-варе накхам адбгута-шринґам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;даліта-хіраньякашіпу-тану-бгринґам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкешява дгрита-нарахарі-рӯпа джая джаґадīшя харе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Кешяво! О Володарю всесвіту! О Господи Харі! Ти прийняв образ напівлюдини-напівлева. Слава Тобі! Так само, як осу можна легко розчавити пальцями, Ти розірвав тіло демона Хіраньякашипу, подібного до оси, дивовижними гострими кігтями Своїх прекрасних лотосових рук.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-namamishvaram-sachchidananda-rupam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Шрī Да̄модара̄штакам \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрī Сатьяврат Муні\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнама̄мīшварам саччіда̄нанда рӯпам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eласат-кундалам ґокуле бгра̄джама̄нам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eяшода̄-бгійолӯкхала̄д дга̄вама̄нам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпара̄мриштам атьям тато друтья ґопʼя\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ схиляюся перед Верховним Господом, чия форма є втіленням вічного буття, знання і блаженства. Його сережки у формі акул гойдаються туди-сюди, а прекрасне сяйво освітлює божественну обитель Ґокули. Він, злякавшись Матінки Яшоди через розбитий горщик із йогуртом, що вона збивала, та вкрадене масло, підвішене у горщику на мотузці, — швидко біжить від деревʼяної ступи. Та все ж Матінка ловить Його, бо біжить ще швидше. Цьому Верховному Господу, Шрі Дамодару, я приношу свої смиренні поклони.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eрудантам мухур нетра-юґмам мриджантам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкара̄мбгоджа-юґмена са̄танка-нетрам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмухух шва̄са-кампа-трірекха̄нка-кантха-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eстхіта-ґрайва да̄модарам бгакті-баддгам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПобачивши у руці Матінки різку, Він плаче й раз у раз протирає Свої оченята двома лотосовими долонями. Його погляд сповнений страху, а перлове намисто на Його шиї, що має три лінії, подібні до мушлі, тремтить від переривчастого дихання під час плачу. Цьому Верховному Господу, Шрі Дамодару, чий живіт обвʼязаний не мотузками, а чистою любовʼю Його Матусі, я приношу свої смиренні поклони.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eітīдрик сва-лīла̄бгір а̄нанда-кунде\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсва-гошам німаджджантам а̄кхʼяпаянтам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтадīєшита-ґʼєшу бгактайр джітатвам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпунах прематас там шята̄вритті ванде\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТакими дитячими забавами Він занурює мешканців Ґокули в озера духовної радості. Тим, хто живе в пошані до Його величі та могутності, Господь відкриває істину: Його може підкорити лише чиста любов. Ця любов сповнена довірливої близькості, у ній немає місця для шанобливої відстані чи благоговійного страху. З великою любовʼю я знову і знову, сотні разів, схиляюся перед Господом Дамодарою.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eварам дева мокшам на мокша̄вадгім ва̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна ча̄ньям врине ’хам варешяд апīха\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eідан те вапур на̄тха ґопа̄ла-ба̄лам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсада̄ ме манасй а̄віра̄ста̄м кім аньяйх\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Господи, Ти можеш дарувати будь-які благословення. Та я не прошу в Тебе безособового визволення. Не прагну й найвищого звільнення — вічного життя на Вайкунтсі. Не шукаю жодного іншого дару, навіть того, що приходить через практику бгакті. Мій Господи, я бажаю лише одного. Нехай Твій образ Бала Ґопала у Вриндавані завжди сяє в моєму серці. Бо що для мене будь-який інший дар без цього?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eідан те мукха̄мбгоджам авʼякта-нīлайр\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвритам кунталайх сніґдга-рактайш ча ґопʼя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмухуш чумбітам бімба-ракта̄дгарам ме\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eманасй а̄віра̄ста̄м алам лакша-ла̄бгайх\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Господи, Матінка Яшода знову й знову цілує Твоє лотосове обличчя. Його обрамляють м’які чорні кучері з ніжним багряним відблиском. Твої уста червоніють, наче плід \u003ci\u003eбімба\u003c/i\u003e. Нехай Твій прекрасний лотосовий образ завжди живе в моєму серці. Тисячі й тисячі інших благословень для мене нічого не варті.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнамо дева да̄модара̄нанта вішно\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрасīда прабго духкха-джа̄ла̄бдгі-маґнам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкрипа̄-дришті-вриштьяті-дīнам бата̄ну-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґриха̄нешя ма̄м аґʼям едгй акши-дришьях\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Верховний Господь, я складаю Тобі свої поклони. О Дамодаре! О Ананто! О Вішну! О Владико! О мій Господи, будь ласкавий до мене. Змилуйся наді мною, омивши мене поглядом Своєї милості, визволи цього бідного, невігласного нерозумного, який тоне в океані мирських страждань, і яви Себе моїм очам.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкувера̄тмаджау баддга-мӯртьяйва ядват\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтвая мочітау бгакті-бга̄джау критау ча\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтатха̄ према-бгактім свака̄м ме праяча\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна мокше ґрахо ме ’сті да̄модареха\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Господи Дамодаре! Колись, у подобі немовляти, Ти був прив’язаний мотузкою до дерев’яної ступи. Тоді Ти визволив синів Кувери — Маніґріву та Налакішвару — від прокляття Наради і зробив їх Своїми великими відданими. Благаю, так само даруй і мені Твою \u003ci\u003eпрема-бгакті\u003c/i\u003e. Лише цього я прагну — жодного звільнення мені не потрібно.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнамас те ’сту да̄мне спхурад-дīпті-дга̄мне\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтвадīйодара̄ятха вішвасья дга̄мне\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнамо ра̄дгіка̄яй твадīя-пріяяй\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнамо ’нанта-лīла̄я дева̄я тубгʼям\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Господи Дамодаре, передусім я складаю поклони осяйній мотузці, що обвиває Твій живіт. Далі я схиляюся перед Твоїм животом — оселею всього всесвіту. Я смиренно поклоняюся Твоїй найдорожчій Шріматі Радгарані і приношу всі свої поклони Тобі, Верховному Господу, який являє Свої безмежні \u003ci\u003eліли\u003c/i\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-nadiya-nagare-nitai-neche-neche-gay-re\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрīман Маха̄прабгур шята-на̄ма \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнадīя-наґаре ніта̄і нече нече ґа̄й ре\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджаґанна̄тха-сута маха̄прабгу вішвамбгара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eма̄япура-шяші навадвīпа-судга̄кара\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшячī-сута ґаурахарі німа̄і-сундара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄дга̄-бга̄ва-ка̄нті-а̄ча̄діто натавара\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u
