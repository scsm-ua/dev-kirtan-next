ті-сундара̄шраям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрīдгарам нама̄мі бгакті-ракшакам джаґад-ґурум\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсіндгу-чандра-парватенду-шяка-джанма-лīланам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшюддга-дīпта-ра̄ґа-бгакті-ґаурава̄нушіланам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбінду-чандра-ратна-сома-шяка-лочана̄нтарам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрīдгарам нама̄мі бгакті-ракшакам джаґад-ґурум\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eканака суручі ра̄нґам сундарам саумʼя-мӯртім\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвібудга-кула-вареньям шрī-ґурум сіддгі-пӯртім\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтаруна-тапана-ва̄сам бгактідань чід-віла̄сам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгаджа бгаджа ту мано ре шрīдгарам шямбідга̄нам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-naumi-shri-gurupadabjam\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eПранаті Дашякам \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eTen Prayers in glorification of Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\u003c/h3\u003e\n\u003ch4\u003eШрīла Бгакті Сундар Ґовінда Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнаумі шрī-ґурупа̄да̄бджам, ятіра̄джешварешварам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-бгактіракшакам шрīла-шрīдгара-сва̄мінам сада̄\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2-4\"\u003e\n\u003ch5\u003e2-4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсудīргонната-дīпта̄нґам, супīбʼя-вапушам парам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтріданда-туласīма̄ла̄-, ґопīчандана-бгӯшитам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eачінтья-пратібга̄-сніґдгам, дівʼяґʼяна-прабга̄карам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eведа̄ді-сарвашястра̄на̄м, са̄маньджасья-відга̄якам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґаудīяча̄рʼя-ратна̄на̄м, уджджвалам ратна-каустубгам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-чайтанья-маха̄премон-, матта̄лīна̄м шіроманім\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5-6\"\u003e\n\u003ch5\u003e5-6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґа̄ятрй-артха-вінірджʼясам, ґīта̄-ґӯдга̄ртха-ґауравам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eстотраратна̄ді-самриддгам, прапанна-джīвана̄мритам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eапӯрваґрантха-самбга̄рам, бгакта̄на̄м хрид-раса̄янам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкрипая єна даттам там, наумі ка̄рунья-сундарам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсанкīртана-маха̄ра̄сарасабдгеш чандрама̄нібгам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсамбга̄ті вітаран вішве ґаура-кришнам ґанайх саха\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8-10\"\u003e\n\u003ch5\u003e8-10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдга̄мані шрī-навадвīпе, ґуптаґовардгане шюбге\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвішвавішрута-чайтанья-, са̄расвата-матхоттамам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eстха̄паїтва̄ ґурӯн ґаура-, ра̄дга̄-ґовіндавіґраха̄н\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрака̄шяяті ча̄тма̄нам, сева̄-самсіддгі-віґрахах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґаура-шрīрӯпа-сіддга̄нта-, дівʼя-дга̄ра̄дгарам ґурум\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-бгакті-ракшакам девам, шрīдгарам пранама̄мй ахам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшраддгая ях патхен нітьям, пранаті-дашякам муда̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвішяте ра̄ґама̄рґешу, тасья бгакта-праса̄датах\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-samudra-sambhava-gabhi-surabhi-apana\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрī Ґовінда Кунда Ма̄ха̄тмʼя \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eThe Glories of Śrī Govinda Kuṇḍa\u003c/h3\u003e\n\u003ch3\u003eŚrī Girirāj-khaṇḍam – Śrī Garga-saṁhitā\u003c/h3\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eатха ґовардгане рамʼє сурабгі ґаух самудраджа̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсна̄пая ма̄са ґопешям дуґдга дга̄ра̄бгі ра̄тнанах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсурабге дуґдга дга̄ра̄бгі ґовінда сна̄нато нрипа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджа̄то ґовінда кундохадрау маха̄па̄пахарах парах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкада̄ чіттасмін дуґдгасья сва̄дутвам праті падьяте\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтатра сна̄тва̄ нарах са̄кша̄д ґовінда падама̄пнуят\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґовінда кунде вішяде ях сна̄ті кришна-ма̄насах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпра̄пноті кришна-са̄рӯпʼям майтхілендра на самшяях\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсамудра-самбгава̄ ґа̄бгī сурабгī а̄пана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдуґдге абгішека коіло враджендра-нандана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсеі дуґдге пӯрна кунда ‘шрī ґовінда’ на̄ма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eрамʼя ґірі ґовардгане шобге абгіра̄ма\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкундава̄рі маха̄па̄паха̄рī се чінмоя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсна̄не па̄не бгавабгая тріта̄па на̄шяя\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбаху-бга̄ґʼє кехо сеі дуґдга̄сва̄да па̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчіда̄нанда-дехо лабгі кришна-локе джа̄я\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī кришна-ма̄насе джеба̄ коре хетха̄ сна̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґупта-ґовардгане ра̄дга̄-кришна-сева̄ па̄на\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-devadidevam-ahibhushanam-indukashiam\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eҐанґадгара Сада̄шіва Прана̄м-Мантрам \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгакті Сундар Ґовінда Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдева̄дідевам-ахібгӯшанам-індука̄шям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпанча̄нанам пашюпатім варадам прасаннам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґанґа̄дгарам пранатапа̄лакама̄шютошам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде сада̄шіва-харіпрія-чандрамаулім\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-bhagyadhishia-tvadiyo-vimala-sukhamayah\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Ґуру-Прашястіх \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгакті Сундар Ґовінда Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбга̄ґʼядгīшя! твадīйо вімала-сукхамаях\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сампрака̄шясту-нітьйо\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґаудам ра̄дгам татхедам трібгӯванам-акхілам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дганья-дганьян чака̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкханде ка̄ле дришям но ґаґана-расамітам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пӯраїтва̄ будга̄на̄–\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eма̄нандам бардгаян вай сва-паріджана-ґанайр-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дга̄мані твам вібга̄сі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдева̄дьясте ‘кхіла ґуна-ґана̄н-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;найва ґа̄тум самартха̄х\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eква̄хам джīво ’тішяя-патіто\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;манда-бга̄ґйо ’ті кшудрах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбго а̄ра̄дгʼя! ставана-вішає\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кінту дīна̄дгамасья\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпратьяшя тат-сукарунатая\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вīрачандра̄бгідаствам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдриштва̄ вішвасья джīва̄н кхалу харі-вімукха̄н\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґаура-дево даяя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eрӯпам ґауде бгавастам парама-каруная\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пра̄хінод- дīна бандго!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eетадж ґʼятва̄ прака̄шят судіна-самудаям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сма̄рама̄шях сахарша̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджаянте чайва ма̄я-ніґада-нікара-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;саммочане ’смакамаддга̄\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eядвад-бга̄нух кірана-нікарайр-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бга̄саян вішвам етан\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄шям критва̄ нікхіла-тамаса̄м\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;теджаса̄ самвібга̄ті\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкритва̄ на̄шям пракриті-тамаса̄м\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сатья-сӯрʼям прака̄шья\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдівʼя-ґʼянайр-харі-ґуна-ґанайс\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тван ча тадвад-вібга̄сі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдухкхайх пӯрнам вібудга-хридаям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ка̄ла-дгарма̄ч ча дриштва̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eма̄ява̄да̄н каліджакумата̄н\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;душкрита̄н шясітун ча\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдешє дешє бграмасі вітаран\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґаура-ва̄нīн ча на̄ма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдгритва̄ дева! трібгувана-джаям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ваджра-калпам трідандам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eварша̄ям вай саджала-джаладо\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ва̄даян мандрабгерім\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eядьяд вішве бграматі бахудга̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ва̄рідга̄ра̄н ча варшан\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтадвад-бгӯмау бграмасі саґанайр-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;гошаян ґаура-ґа̄тха̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнітьям дівʼямрита-сукаруна̄м\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;твам хі дева! праваршан\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-чайтанья-віла̄са-дга̄мані\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;навадвīпа̄шраме сундаре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-ґаура̄нґа-відгос-татха̄ враджа юнох\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сева̄-судга̄-сампадам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтадван ґа̄нґа-тате даямая-вібго!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;садгӯн сама̄хла̄-даян\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-рӯпа̄нуґа-сампрада̄я-вібгава̄нуд\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бга̄саян бга̄сасе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eча̄рва̄ка̄нта-крита̄нтако ’кхіла\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґурух па̄шанда-шяйла̄шянір\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбауддга-дгва̄нта-мата̄нта-да̄яка\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;маха̄ма̄ртанда-чӯда̄маніх\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eма̄ява̄да-маха̄віварта-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґахана̄дж-джīва̄н самуддга̄-ваян\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-ґауренду-джая-дгваджо віджаяте\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сва̄мін бгава̄н нітьяшях\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-ґаура̄нґа-сарасватī-дгунідгара!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-бгакті-самрак-шака!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-сіддга̄нта-сарасватī пріявара!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ньясīшвара! шрī-ґуро!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдева̄дьєха! бгават-шюбгодая-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;діне сампра̄ртхає ’хам вібго!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпа̄да̄бдже кхалу нітья-бгритья іті\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ме ка̄руньям-а̄тан-вата̄м\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-nava-nalina-ganjitam-kusuma-dala\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eПранаті-Паньчакам \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгакті Сундар Ґовінда Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнава-наліна-ґаньджітам\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кусума-дала-мандітам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;па̄да-юґам-абгая-варада̄нам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eканака-гана-ніндітам вапура-мара-вандітам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;натана-ґаті-ґаурава-ніда̄нам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгадже шрīдгара-сва̄мінам-анішям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшярада-відгу-нінді-мукха- падма-маті-шобганам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґопī-тілака-чарчіта-субга̄лам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґамана-джіта-ва̄ранам\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шямана-бгая-та̄ранам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пракриті-ручі-нінді-крита-вешям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пракриті-ручі-намбграма-сувешям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпхулла-кара-паллавам\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгакта-джана-валлабгам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тунґа-притхулам хридая-дешям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґаура-пурата-саурабгам кришна-пурата-ґауравам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вібудга-кула-падма-налішям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгакта-кула-данданам бганда-мата-кханданам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгакта-кула-нандана-ятīшям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтрібгувана-ніва̄сіне\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кришнам-упадешінам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;асура-кула-да̄мбгіка-крита̄нтам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнаумі будга-на̄якам парама-ґаті-да̄якам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мама шярана-марана-ґана-чінтьям\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1-2\"\u003e\n\u003ch5\u003e1-2\u003c/h5\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3-4\"\u003e\n\u003ch5\u003e3-4\u003c/h5\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-maha-bhaya-shiankula-e-bhava-tarangini\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eМа̄я Дуратьяя \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгакті Сундар Ґовінда Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмаха̄-бгая шянкула\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;е бгава таранґінī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джанама-марана ма̄ла̄-дале\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніші-діші ґата̄ґаті\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кара тангі джīва-кула\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мохіта маха̄ма̄я бале\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;карабі кі мана абга̄ґія—\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгувана-мохана-ма̄я\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кемане ре утарабі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лабгібі кемане ка̄на̄ія?\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eніджа-рӯпевіта̄рі’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;трі-ґуна-джа̄ле пха̄нда рачі’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тангі ма̄хе ґаніка̄ пратіштха̄—\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eканака вара̄нґана̄\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;да̄нія а̄міша сама\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;санпітечхе ка̄ла-каре дгришта̄\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мана маджгу ва̄та авадга̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсоі даялу прабгу\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чарана сародже мана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дгана-тану, сабаху да̄на\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eянкара ма̄я\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тачху паде паранамі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;леха шярана хоі дīна\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсвапанеха на̄ бга̄віха\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄нка чарана віну\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дгарама юкаті самīчīна\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-ami-guru-dasa-nahi-anya\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eСварӯподбодгана Пробудження істинного «Я» \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгакті Сундар Ґовінда Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003ch4\u003eВперше опубліковано в «Шрі Ґаудія-даршані»:\u003c/h4\u003e\n\u003ch4\u003eтом 1, номер 4, вівторок, 15 листопада 1955\u003c/h4\u003e\n\u003ch4\u003e(коли йому було 27 років)\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄мі ґуру-да̄са — нахі анья\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ — слуга свого Ґуру, і ніхто інший.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄мі каріба бграмана чаудда-бгувана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсварӯпе саба̄я карі’ удбодгана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eха̄те ла’є яба премера нішяна\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдгара̄ба сварӯпа чіхна\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ мандруватиму чотирнадцятьма світами й пробуджуватиму в усіх істинне «Я». Я піду з прапором божественної любові в руках і допоможу кожному розпізнати символ своєї істинної природи.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄мі чха̄да̄ба сакале сарва-дгарма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкаріба чӯрна ґʼяна о карма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eрачіба вішяла бгакаті-хармʼя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґуру-да̄са нахі анья\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ спонукатиму кожного залишити усі види мирських обовʼязків. Я зруйную прагнення до звільнення через знання та прагнення до мирських насолод через діяльність. Я збудую величний храм відданості. Я — слуга свого Ґуру, і ніхто інший.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄мі бга̄нґіба чханда ла̄ґа̄ба дганда\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eва̄ча̄лера мукха каріба банда\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмритьюре дгарі да̄ніба шянда\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄хі капатата̄ дайнья\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ зламаю мирські звичаї та посію сумнів у серцях самовпевнених. Я змушу замовкнути балакучих. Схопивши смерть, я дам їй відсіч. Усе це я зроблю без краплі лицемірства, у глибокому смиренні слуги.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсеі маха̄бга̄ратера маха̄н парва\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eяха̄ра прака̄шє хаєчхе кхарва\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдекха̄ба та̄нга̄ра асīма ґарва\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкайтаве карі кхінна\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ відкрию безмежну славу Того, хто освітив Собою найбільшу главу «Махабгарати», і зітру будь-яке лукавство.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄мі ба̄джа̄ба джаґате віджая-данка̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eгуча̄ба сакала двандва-шянка̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбаха̄ба вішве бгакаті-ґанґа̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтуши’ харі лабгі пунья\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ загримлю у переможні барабани по всьому світу, розвію всі чвари й страх, і спрямую Ґанґу чистої відданості потоком крізь увесь Всесвіт. Так задовольнивши Господа, я отримаю найвищу благодать.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄мі а̄рʼяна̄рʼя млеччха саба̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eла̄ґа̄іба ба’ле кришна-сева̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчада̄іба сабе ґолокера на̄’я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпритхвī каріба шюнья\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ силою залучу всіх — шляхетних, ницих і диких — до служіння Крішні. Я спорожню Землю, пересадивши їх усіх на човен до Ґолоки.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄мі ча̄ла̄ба сакале ґуру-пада бале\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eва̄да̄ма туліба харі-бола бале\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмаха̄ма̄я-вінī чхалана̄ чхаліле\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкаріба чінна-бгінна\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ проведу їх усіх завдяки силі лотосових стоп мого Ґуру. Я підійму вітрила цього човна силою повторення Імені Харі. Якщо Махамайя явить якусь оману, я розітну її на шматки.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄мі чінмая-дга̄ме ча̄ла̄іба тарī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчатур-бгуджа хабе ята нара-на̄рī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eстха̄вара джанґама сабе лабгі харі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхабе дева дева ма̄нья\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ проведу човен до духовного світу, де всі чоловіки та жінки отримають божественну чотирируку форму. Усі рухомі й нерухомі істоти досягнуть Харі й стануть гідними поклоніння навіть для напівбогів.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсабе ека парічає дібе парічая\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eлабгібе сварӯпа амрита-мая\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпӯджібе шрī-харі дібе джая джая\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнеха̄рі’ ха-іба дганья\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eКожен побачить своє істинне «Я» й усвідомить свою безсмертну природу. Усі стануть поклонятися Шрі Харі, вигукуючи: \"Джай! Джай!\" І споглядаючи це, я стану дуже задоволеним.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄мі ґуру-да̄са нахі анья\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ — слуга свого Ґуру, і ніхто інший.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"first-lines\" id=\"first-lines\"\u003e\n\u003ch1\u003eІндекс\u003c/h1\u003e\n\u003ch2 class=\"first-line-group\"\u003eА\u003c/h2\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-avatara-sara-gora-avatara\"\u003eавата̄ра са̄ра ґора̄ авата̄ра\u003cspan class=\"page-num\"\u003e — 121\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-akrodha-paramananda\"\u003eакродга парама̄нанда\u003cspan class=\"page-num\"\u003e — 114\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-amara-jivana-sada-pape-rata\"\u003eа̄ма̄ра джīвана, сада̄ па̄пе рата\u003cspan class=\"page-num\"\u003e — 161\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-ami-guru-dasa-nahi-anya\"\u003eамі ґуру-даса нахі анья\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"0\"\u003e\u003ca href=\"#song-anadi-karama-phole\"\u003eана̄ді карама-пхоле\u003cspan class=\"page-num\"\u003e — 187\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"0\"\u003e\u003ca href=\"#song-anya-abhilasha-chadi-jniana-karma-parihari\"\u003eанья-абгіла̄ша чха̄ді ґʼяна карма паріхарі\u003cspan class=\"page-num\"\u003e — 177\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"0\"\u003e\u003ca href=\"#song-aparadha-phole-mama\"\u003eапара̄дга-пхоле мама\u003cspan class=\"page-num\"\u003e — 188\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"0\"\u003e\u003ca href=\"#song-aruna-basane-sonara-suraja\"\u003eарун
