" data-translated=\"0\"\u003e\u003ca href=\"#song-nava-nalina-ganjitam-kusuma-dala\"\u003eПранаті-Паньчакам\u003cspan class=\"page-num\"\u003e — 282\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"toc-item\" data-translated=\"0\"\u003e\u003ca href=\"#song-maha-bhaya-shiankula-e-bhava-tarangini\"\u003eМа̄я Дуратьяя\u003cspan class=\"page-num\"\u003e — 285\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"toc-item\" data-translated=\"1\"\u003e\u003ca href=\"#song-ami-guru-dasa-nahi-anya\"\u003eСварӯподбодгана\u003c/a\u003e\u003c/p\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eВступ\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-vande-ham-shri-guroh-shri-yuta-pada-kamalam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eВандана̄ \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eванде ’хам шрī-ґурох шрī-юта-пада-камалам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-ґурӯн вайшнава̄мш ча\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-рӯпам са̄ґраджа̄там саха-ґана-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;рагуна̄тха̄нвітам там са-джīвам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eса̄двайтам са̄вадгӯтам паріджана-сахітам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кришна-чайтанья-девам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-ра̄дга̄-кришна-па̄да̄н саха-ґана-лаліта̄-шрī-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вішякха̄нвіта̄мш ча\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eванде\u003c/i\u003e — вклоняюсь; \u003ci class=\"wbw__term\"\u003eхам\u003c/i\u003e — я; \u003ci class=\"wbw__term\"\u003eшрī\u003c/i\u003e — шановного; \u003ci class=\"wbw__term\"\u003eґурох\u003c/i\u003e — вчителя; \u003ci class=\"wbw__term\"\u003eшрī\u003c/i\u003e — славою; \u003ci class=\"wbw__term\"\u003eюта\u003c/i\u003e — прикрашеним; \u003ci class=\"wbw__term\"\u003eпада\u003c/i\u003e — стопам; \u003ci class=\"wbw__term\"\u003eкамалам\u003c/i\u003e — лотосам; \u003ci class=\"wbw__term\"\u003eшрī\u003c/i\u003e — шановним; \u003ci class=\"wbw__term\"\u003eґурӯн\u003c/i\u003e — вчителям; \u003ci class=\"wbw__term\"\u003eвайшнава̄мш\u003c/i\u003e — вайшнавам; \u003ci class=\"wbw__term\"\u003eча\u003c/i\u003e — і; \u003ci class=\"wbw__term\"\u003eшрī\u003c/i\u003e — Шрілі; \u003ci class=\"wbw__term\"\u003eрӯпам\u003c/i\u003e — Рупі (Ґосвамі); \u003ci class=\"wbw__term\"\u003eса̄ґраджа̄там\u003c/i\u003e — зі старшим братом (Санатані Ґосвамі); \u003ci class=\"wbw__term\"\u003eсаха\u003c/i\u003e — разом з; \u003ci class=\"wbw__term\"\u003eґана\u003c/i\u003e — супутниками; \u003ci class=\"wbw__term\"\u003eрагуна̄тха̄нвітам\u003c/i\u003e — Рагунатхою (Ґосвамі); \u003ci class=\"wbw__term\"\u003eтам\u003c/i\u003e — йому; \u003ci class=\"wbw__term\"\u003eса\u003c/i\u003e — з; \u003ci class=\"wbw__term\"\u003eджīвам\u003c/i\u003e — Джівою (Ґосвамі); \u003ci class=\"wbw__term\"\u003eса̄двайтам\u003c/i\u003e — з Адвайтою (Ачарʼєю); \u003ci class=\"wbw__term\"\u003eса̄вадгӯтам\u003c/i\u003e — з Авадгутом (Нітьянандою); \u003ci class=\"wbw__term\"\u003eпаріджана\u003c/i\u003e — (які є) оточенням; \u003ci class=\"wbw__term\"\u003eсахітам\u003c/i\u003e — (і) супроводжують; \u003ci class=\"wbw__term\"\u003eкришна\u003c/i\u003e — Крішна; \u003ci class=\"wbw__term\"\u003eчайтанья\u003c/i\u003e — Чайтанья (Махапрабгу); \u003ci class=\"wbw__term\"\u003eдевам\u003c/i\u003e — Дева; \u003ci class=\"wbw__term\"\u003eшрī\u003c/i\u003e — Шрі; \u003ci class=\"wbw__term\"\u003eра̄дга̄\u003c/i\u003e — Радги; \u003ci class=\"wbw__term\"\u003eкришна\u003c/i\u003e — Крішни; \u003ci class=\"wbw__term\"\u003eпа̄да̄н\u003c/i\u003e — стопам; \u003ci class=\"wbw__term\"\u003eсаха\u003c/i\u003e — разом з; \u003ci class=\"wbw__term\"\u003eґана\u003c/i\u003e — (їх) супутницями; \u003ci class=\"wbw__term\"\u003eлаліта̄\u003c/i\u003e — Лалітою; \u003ci class=\"wbw__term\"\u003eшрī\u003c/i\u003e — (і) Шрі; \u003ci class=\"wbw__term\"\u003eвішякха̄нвіта̄мш\u003c/i\u003e — Вішякхою; \u003ci class=\"wbw__term\"\u003eча\u003c/i\u003e — також.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eШріла Крішнадас Кавірадж молиться: «Спершу я складаю шанобливі поклони до лотосових стоп мого духовного вчителя, інших духовних вчителів, що приводять нові душі на шлях, та піднесених \u003ci\u003eвайшнавів\u003c/i\u003e. Далі я схиляюся до стоп моїх \u003ci\u003eшастра-ґуру\u003c/i\u003e: Шріли Рупи Ґосвамі та його старшого брата Шріли Санатани Ґосвамі, Шріли Рагунатха Даса Ґосвамі та Шріли Джіви Ґосвамі. На вищому рівні я складаю шанобливі поклони Шрі Чайтаньї Махапрабгу, який зʼявився разом зі Своїм оточенням і супутниками, а також разом із такими великими особистостями, як Шрі Нітьянанда Прабгу та Шрі Адвайта Ачарʼя. І на найвищому щаблі я складаю свої поклони до лотосових стоп Шрі Шрі Радги й Ґовінди та до всіх \u003ci\u003eґопі\u003c/i\u003e на чолі з Лалітою Деві та Вішякхою Деві».\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eом аґʼяна-тіміра̄ндгасья ґʼяна̄ньджана-шяла̄кая\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчакшур унмілітам єна тасмай шрī-ґураве намах\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eом\u003c/i\u003e — (ом); \u003ci class=\"wbw__term\"\u003eаґʼяна\u003c/i\u003e — (я) незнанням; \u003ci class=\"wbw__term\"\u003eтіміра̄ндгасья\u003c/i\u003e — темряви осліплений; \u003ci class=\"wbw__term\"\u003eґʼяна̄ньджана\u003c/i\u003e — знання очна мазь; \u003ci class=\"wbw__term\"\u003eшяла̄кая\u003c/i\u003e — (нанесена) паличкою; \u003ci class=\"wbw__term\"\u003eчакшур\u003c/i\u003e — (на) око; \u003ci class=\"wbw__term\"\u003eунмілітам\u003c/i\u003e — розплющене (стало); \u003ci class=\"wbw__term\"\u003eєна\u003c/i\u003e — кому (завдяки); \u003ci class=\"wbw__term\"\u003eтасмай\u003c/i\u003e — цьому; \u003ci class=\"wbw__term\"\u003eшрī\u003c/i\u003e — шанованому; \u003ci class=\"wbw__term\"\u003eґураве\u003c/i\u003e — вчителю; \u003ci class=\"wbw__term\"\u003eнамах\u003c/i\u003e — вклоняюсь.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ схиляюся до лотосових стоп Шрі Ґурудева. Моє бачення було затьмарено невіглаством, а він дарував мені прозріння, змастивши внутрішній зір цілющим бальзамом божественного зняння. Це знання - \u003ci\u003eсамбандга-ґʼяна\u003c/i\u003e, відкриває істине розуміння наших стосунків із навколишнім і задовольняє найглибші прагнення мого життя.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-acharya-varyam-gaura-dhama-nishtham\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрīла Бгакті Ранджан Мадгусӯдана Маха̄ра̄дж \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄ча̄рʼя-варʼям ґаура-дга̄ма-ніштхам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-бгакті-ракшака-шрīдгара-дева-прештхам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґовінда̄нурактам шрī-мадгусӯданам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнама̄мі нітьям шрī-бгакті-ранджанам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eа̄ча̄рʼя-варʼям\u003c/i\u003e – найкращий серед учителів; \u003ci class=\"wbw__term\"\u003eґаура-дга̄ма-ніштхам\u003c/i\u003e – той, хто має непохитну віру в обитель Шрі Ґаури; \u003ci class=\"wbw__term\"\u003eшрī-бгакті-ракшака-шрīдгара-дева\u003c/i\u003e – Шріла Бгакті Ракшака Шрідгара Дева Ґосвамі; \u003ci class=\"wbw__term\"\u003eпрештхам\u003c/i\u003e – улюблений, дорогий; \u003ci class=\"wbw__term\"\u003eґовінда̄нурактам\u003c/i\u003e – той, хто має \u003ci\u003eанураґу\u003c/i\u003e — глибоку любовну прихильність — до Шріли Бгакті Сундара Ґовінди Дева Ґосвамі або до Господа Шрі Ґовінди; \u003ci class=\"wbw__term\"\u003eнама̄мі нітьям шрī-бгакті-ранджанам\u003c/i\u003e – вічно складаю поклін Шріла Бгакті Ранджану Мадгусудану Махараджу.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЗ непохитною вірою в Шрі Ґаура-\u003ci\u003eдгаму\u003c/i\u003e (обитель Шрі Ґаури), він дуже дорогий Шрілі Бгакті Ракшаку Шрідгару Дев-Ґосвамі Махараджу і є найкращим із наставників. Він сповнений інтенсивною любовною привʼязаністю до служіння Ґовінді (Господу Шрі Ґовінді та Шрілі Бгакті Сундару Ґовінді Дев-Ґосвамі Махараджу... Ґовіндо, Ґовіндо!) Я вічно й повторно схиляюся перед Шрілою Бгакті Ранджаном Мадгусуданом Махараджем.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vande-vaikuntha-vritti-stham\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрīла Бгакті Бімал Авадгӯт Маха̄ра̄дж \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eванде вайкунтха-вритті-стхам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;парама-каруна̄спадам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвімалам авадгӯта̄кхʼям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґовінда̄нгарі-нішевая\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ схиляюся в поклонах до Шріли Авадгута Махараджа, адже він — саме милосердя Нітай-Ґаури. Усім своїм неосяжним розумом він досліджує нескінченні можливості (\u003ci\u003eвайкунтха вритті\u003c/i\u003e) для служіння та розповсюдження найвищої милості. Він є незвичайним (\u003ci\u003eбгактавадгута\u003c/i\u003e), проте беззаперечно чистим (\u003ci\u003eвімал\u003c/i\u003e) відданим, оскільки його присвята святому імені, лотосовим стопам Ґовінди (Крішни), а також своєму Ґуру, Шрілі Бгакті Сундару Ґовінді Дев-Ґосвамі — виняткова.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-goswaminam-sudhirakhyam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрīла Бгакті Судгīр Ґосва̄мī Маха̄ра̄дж \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґосва̄мінам судгīра̄кхʼям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґовінда-прештхам а̄шрає\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґаура-ґа̄тха̄-ратам нітьям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрīдгара-па̄да-севанам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ шукаю притулку в Шріли Бгакті Судгіра Ґосвамі Махараджа — улюбленця Ґовінди Крішни та Шріли Ґовінди Махараджа. Він цілковито відданий оспівуванню слави Ґауранґи Махапрабгу й прийняв вічний притулок у служінні лотосовим стопам Шріли Шрідгара Махараджа, одного з проявів Шрі Радги.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-pujya-sri-guru-varga-vandita\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрīла Бгакті Нірмал А̄ча̄рʼя Маха̄ра̄дж \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпӯджʼя шрī-ґуру-варґа-вандіта\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;маха̄-бга̄ва̄нвіта̄ях сада̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпаурва̄ парйя парампара̄ прачаліта\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пра̄джʼя прамӯртта̄ критех\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгакте нірмала-нірджгарасья нібгритам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;самракшакам са̄дарам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде шрī-ґурудевам а̄ната-шіра̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ча̄рйя-варйям ніджам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпреракам пра̄чʼя-па̄шча̄тья-шішʼяна̄м\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгакті-вартмані\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгакті-нірмалам-а̄ча̄рʼя-сва̄мінам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пранама̄мй ахам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gurvabhishta-supurakam-guru-ganair\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрīла Бгакті Сундар Ґовінда Дев-Ґосва̄мī Маха̄ра̄дж \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґурва̄бгīшта-супӯракам ґуру-ґанайр\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄шіша-самбгӯшитам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчінтьячінтья-самаста-веда-ніпунам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-рӯпа-пантха̄нуґам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґовінда̄бгідгам уджджвалам вара-танум\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгактй анвітам сундарам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде вішва-ґурунь ча дівʼя-бгаґават-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;премно хі бīджа-прадам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВін по-справжньому здійснює найзаповітніші прагнення свого Ґуру, прикрашений люблячими благословеннями своєї \u003ci\u003eґуру-варґи\u003c/i\u003e. Завдяки глибокому володінню як осяжним, так і неосяжним знанням, його мудрість висвітлює всю онтологічну повноту. Він є найстараннішим послідовником божественної цілі Шрі Рупи, а його славне імʼя — Шріла Бгакті Сундар Ґовінда. Його прекрасна постать ясна, чиста й сяюча, сповнена відданості і духовних смаків. Я вклоняюся йому як піднесеному всесвітньому Ґуру, наділеному здатністю дарувати насінину Божественної Любові.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-devam-divya-tanum-suchanda-vadanam-balarka-chelanchitam\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрīла Бгакті Ракшак Шрīдгар Дев-Ґосва̄мī Маха̄ра̄дж \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгакті Сундар Ґовінда Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдевам дівʼя-танум сучанда-ваданам-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ба̄ла̄рка-чела̄ньчітам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eса̄ндра̄нанда-пурам сад-ека-варанам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вайра̄ґʼя-відьямбудгім\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-сіддга̄нта-нідгім субгакті-ласітам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;са̄расвата̄на̄м варам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде там шюбгадам мад-ека-шяранам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ньясīшварам шрīдгарам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-siddhanta-sarasvatiti-vidito\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eБгаґава̄н Шрīла Бгактісіддга̄нта Сарасватī Тха̄кур \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгакті Ракшак Шрīдгар Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-сіддга̄нта-сарасватīті відіто\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґаудīя-ґурв-анває\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбга̄то бга̄нуріва прабга̄та-ґаґане\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;йо ґаура-санкīртанайх\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eма̄ява̄да-тімінґілодара-ґата̄н\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;уддгритья джīваніма̄н\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкришна-према-судга̄бдгі-ґа̄хана-сукхам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пра̄да̄т прабгум там бгадже\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eУ великій лінії \u003ci\u003eґаудія-вайшнавських\u003c/i\u003e вчителів він відомий як Шріла Бгактісіддганта Сарасваті. Він зʼявився, немов ясне сонце на ранковому небі, щоб врятувати всі душі, захоплені всепожиральною безособистісною філософією. Поширюючи вчення Господа Ґауранґи про оспівування Святого Імені, він дав усім можливість зануритися в океан любові до Господа Шрі Крішни, Верховної Особистості. О Шріло Бгактісіддганто, мій господарю, божественний наставнику, — біля Твоїх лотосових стоп я молюся, щоб служити Тобі вічно.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-namo-gaurakishoraya-bhaktavadhuta-murtaye\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрīла Ґаура Кішора Да̄с Ба̄ба̄джī Маха̄ра̄дж \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгакті Ракшак Шрīдгар Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнамо ґауракішора̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгакта̄вадгӯта мӯртає\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґаура̄нгрі падма-бгринґа̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄дга̄-бга̄ва-нішевіне\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ схиляюся перед нашим Ґуру, Шрілою Ґаура Кішором Дасом — чистим відданим, який стоїть вище суспільного укладу. Він подібний до бджоли, що вічно пʼє нектар біля лотосових стоп Шрі Ґауранґи, і в глибині свого серця безупинно служить Шріматі Радгарані.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vande-bhaktivinodam-shri-gaura-shiakti-svarupakam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрīла Бгакті Вінод Тха̄кур \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгакті Ракшак Шрīдгар Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eванде бгактівінодам шрī-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґаура-шякті-сварӯпакам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгакті-шястраґʼя-самра̄джам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄дга̄-раса-судга̄-нідгім\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ складаю свої поклони Шрі Тхакуру Бгактівіноду, втіленню божественної любові Махапрабгу. Він очолює всіх, хто розуміє істинне призначення священних писань, і є безмежним океаном відданості Шріматі Радгарані.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gaura-vrajashritashieshair-vaishnavair-vandya-vigraham\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрīла Джаґанна̄тх Да̄с Ба̄ба̄джī Маха̄ра̄дж \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгакті Ракшак Шрīдгар Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґаура-враджа̄шріта̄шєшайр\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вайшнавайр вандья-віґрахам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджаґанна̄тха-прабгум ванде\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;према̄бдгім вриддга-вайшнавам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВеликий, глибоко шанований Праотець чистого \u003ci\u003eбгакті\u003c/i\u003e, якого з любовʼю приймають усі \u003ci\u003eвайшнави\u003c/i\u003e і Навадвіпи, і Вриндавана, — я вклоняюся лотосовим стопам того великого Вайшнава Ґуру, океану любові, Шріли Джаґаннатха Прабгу.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vancha-kalpatarubhyas-cha\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eВа̄ньчха̄-калпатарубгʼяс’ ча \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eва̄ньчха̄-калпа-тарубгʼяс’ ча\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;крипа̄-сіндгубгʼя ева ча\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпатіта̄на̄м па̄ванебгйо\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вайшнавебгйо намо намах\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eва̄ньчха̄\u003c/i\u003e — бажань; \u003ci class=\"wbw__term\"\u003eкалпа\u003c/i\u003e — виконавцям; \u003ci class=\"wbw__term\"\u003eтарубгʼяс\u003c/i\u003e — деревам; \u003ci class=\"wbw__term\"\u003eча\u003c/i\u003e — і; \u003ci class=\"wbw__term\"\u003eкрипа̄\u003c/i\u003e — милості; \u003ci class=\"wbw__term\"\u003eсіндгубгʼя\u003c/i\u003e — океанам; \u003ci class=\"wbw__term\"\u003eева\u003c/i\u003e — воістину; \u003ci class=\"wbw__term\"\u003eча\u003c/i\u003e — і; \u003ci class=\"wbw__term\"\u003eпатіта̄на̄м\u003c/i\u003e — занепалих; \u003ci class=\"wbw__term\"\u003eпа̄ванебгйо\u003c/i\u003e — спасителям; \u003ci class=\"wbw__term\"\u003eвайшнавебгйо\u003c/i\u003e — вайшнавам; \u003ci class=\"wbw__term\"\u003eнамо\u003c/i\u003e — поклони; \u003ci class=\"wbw__term\"\u003eнамах\u003c/i\u003e — поклони.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ схиляюся до святих лотосових стоп чистих \u003ci\u003eвайшнавів\u003c/i\u003e, подібних до дерев бажань, що можуть здійснити всі прагнення відданих. Віддані Господа подібні до безмежного океану безпричинної милості, адже вони визволяють занепалі душі з матеріального існування. Знову і знову складаю їм свої шанобливі поклони.\u003cbr\u003e\n\u003ci\u003e(Шріла Рупа Ґосвамі)\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпаньча-таттва̄тмакам кришнам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгакта-рӯпа-сварӯпакам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгакта̄вата̄рам бгакта̄кхʼям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нама̄мі бгакта-шяктікам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eпаньча\u003c/i\u003e — п'яти; \u003ci class=\"wbw__term\"\u003eтаттва̄тмакам\u003c/i\u003e — сутностям; \u003ci class=\"wbw__term\"\u003eкришнам\u003c/i\u003e — Крішні (Шрі Ґауранґадеву); \u003ci class=\"wbw__term\"\u003eбгакта\u003c/i\u003e — (у) відданого; \u003ci class=\"wbw__term\"\u003eрӯпа\u003c/i\u003e — формі; \u003ci class=\"wbw__term\"\u003eсварӯпакам\u003c/i\u003e — (Його) власній подобі (Шрі Нітьянанді); \u003ci class=\"wbw__term\"\u003eбгакта̄вата̄рам\u003c/i\u003e — відданому аватару (Шрі Адвайті Прабгу); \u003ci class=\"wbw__term\"\u003eбгакта̄кхʼям\u003c/i\u003e — відомому, як відданий (Шрівасу Пандіту); \u003ci class=\"wbw__term\"\u003eнама̄мі\u003c/i\u003e — вклоняюсь; \u003ci class=\"wbw__term\"\u003eбгакта\u003c/i\u003e — відданності; \u003ci class=\"wbw__term\"\u003eшяктікам\u003c/i\u003e — енергії (Шрі Ґададгару).\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ складаю свої поклони Господу Крішні в Його пʼятиособистісному вияві, відомому як \u003ci\u003eпаньча-таттва\u003c/i\u003e. Я вшановую Шрі Ґауранґадева, який явився як відданий Господа, що смакує Його внутрішні духовні настрої. Далі я схиляюся перед Господом Нітьянандою Прабгу, який є тим же самим Господом і старшим братом Шрі Ґауранґи. Потім я віддаю шану великій особистості, Шрі Адвайті Прабгу, який є втіленням відданого Господа, а також вічному супутникау Господа Шрівасу Пандіту, який служать Йому в люблячих стосунках відданого служіння. І насамкінець я схиляюся до стоп тих відданих, у чиїх руках перебуває справжня сила чистої, нічим не затьмареної самовідданості: Шрі Рамананда Рая, Шрі Ґададгара Пандіта та Шрі Сварупа Дамодара.\u003cbr\u003e\n\u003ci\u003e(Шріла Крішнадас Кавірадж Ґосвамі)\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнамо маха̄-вада̄ньяя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кришна-према-прада̄я те\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкришна̄я кришна-чайтанья-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄мне ґаура-твіше намах\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eнамо\u003c/i\u003e — поклін; \u003ci class=\"wbw__term\"\u003eмаха̄\u003c/i\u003e — великому; \u003ci class=\"wbw__term\"\u003eвада̄ньяя\u003c/i\u003e — милостивому; \u003ci class=\"wbw__term\"\u003eкришна\u003c/i\u003e — (хто до) Крішни; \u003ci class=\"wbw__term\"\u003eпрема\u003c/i\u003e — любов; \u003ci class=\"wbw__term\"\u003eпрада̄я\u003c/i\u003e — дарує; \u003ci class=\"wbw__term\"\u003eте\u003c/i\u003e — Тобі; \u003ci class=\"wbw__term\"\u003eкришна̄я\u003c/i\u003e — Крішні; \u003ci class=\"wbw__term\"\u003eкришна\u003c/i\u003e — (який є) Крішна; \u003ci class=\"wbw__term\"\u003eчайтанья\u003c/i\u003e — Чайтанья; \u003ci class=\"wbw__term\"\u003eна̄мне\u003c/i\u003e — на імʼя; \u003ci class=\"wbw__term\"\u003eґаура\u003c/i\u003e — (який) золотисто; \u003ci class=\"wbw__term\"\u003eтвіше\u003c/i\u003e — сяє; \u003ci class=\"wbw__term\"\u003eнамах\u003c/i\u003e — поклони.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ складаю свої поклони Господу Ґауранзі, чиє божественне тіло сяє ніжним золотим відтінком і хто володіє якостями наймилостивішого втілення. Його духовні ігри щедро дарують усім чисту любов до Господа Крішни. Він - Сам Господь Крішна, відомий у часи Калі як Шрі Крішна Чайтанья.\u003cbr\u003e\n\u003ci\u003e(Шріла Рупа Ґосвамі)\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jayatam-suratau-pangor\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрī-Шрī-Ґуру-Ґаура̄нґа-Ра̄дга̄-Мадана-Моханджīу \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eKolkata, Sree Chaitanya Sāraswata Krishnanushilana Sangha\u003c/h3\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджаята̄м суратау панґор\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мама манда-матер ґатī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмат-сарвасва-пада̄мбгоджау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄дга̄-мадана-моханау\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-divyad-vrindaranya-kalpa-drumadhah\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрī-Шрī-Ґуру-Ґаура̄нґа-Ґа̄ндгарва̄-Ґовіндасундарджīу \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eNabadwīp, Śrī Chaitanya Sāraswat Maṭh\u003c/h3\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдīвʼяд-вринда̄ранья-калпа-друма̄дгах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрīмад-ратна̄ґа̄ра-сімга̄сана-стхау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī ґа̄ндгарва̄-шрīла-ґовінда-девау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;прештха̄лīбгіх севʼяма̄нау смара̄мі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shriman-rasa-rasarambhi\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрī-Шрī-Ґуру-Ґаура̄нґа-Ра̄дга̄-Ґопīна̄тхджīу \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eHāpāniyā, Śrī Chaitanya Sāraswat Ashram\u003c/h3\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрīма̄н ра̄са-раса̄рамбгī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вамші-вата-тата-стхітах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкаршан вену-сванайр ґопīр\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґопīна̄тхах шріє ’сту нах\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vrindayai-tulasi-devyai\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eВринда̄яй туласī-девʼяй \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвринда̄яй туласī-девʼяй\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пріяяй кешявасья ча\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкришна-бгакті-праде деві\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сатьяватьяй намо намах\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ вічно схиляюся перед Шрі Вриндадеві, Шріматі Туласі Махарані, найдорожчою улюбленицею Господа Кешяви. Смиренно вклоняюся Сатьяваті, яка може дарувати чисту відданість Господу Крішні.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eатха натва̄ мантра-ґурӯн\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґурӯн бга̄ґавата̄ртхада̄н\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвʼяса̄н джаґат-ґурӯн натва̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тато джаям удīраєт\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПотім я схиляюся перед усіма своїми духовними вчителями: перед \u003ci\u003eґуру\u003c/i\u003e, який дарував мені божественну \u003ci\u003eмантру\u003c/i\u003e, і перед усіма тими, хто відкривав мені глибокий зміст «Шрімад-Бгаґаватам». З шаною я складаю поклони Шрілі Вʼясадеву, духовному вчителю всього всесвіту, який дарує непереможні висновки «Шрімад-Бгаґаватам».\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджаях са-парікара шрī-шрī-ґуру-ґаура̄нґа-ґа̄ндгарва̄-ґовіндасундар-па̄дападма̄на̄м джаясту!\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eНехай святі лотосові стопи Шрі Ґурудева, Шрімана Махапрабгу та Шрі Шрі Ґандгарви-Ґовіндасундара, разом із Їхніми вічними супутниками здобудуть перемогу над усім!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-sakala-vaishnava-pade-mora-namaskara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eМолитви Вайшнавам \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсакала вайшнава-паде мора намаска̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eітхе кічху апара̄дга нахука а̄ма̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхоіячен хоібен прабгур джато бгакта джан\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвандана̄ корі’ а̄мі саба̄ра чарана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ з повагою схиляюся до лотосових стоп усіх \u003ci\u003eвайшнавів\u003c/i\u003e і смиренно благаю, щоб у моїй спробі догодити їм не було жодної зневаги. Усім \u003ci\u003eвайшнавам\u003c/i\u003e минулого і всім \u003ci\u003eвайшнавам\u003c/i\u003e майбутнього я складаю свої поклони до їхніх лотосових стоп.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-namah-om-vishnupadaya-krishna\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eПрана̄м Мантра \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eto Śrīla A.C Bhaktivedānta Swāmī Mahārāj Prabhupād\u003c/h3\u003e\n\u003ch4\u003eШрīла Бгакті Сундар Ґовінда Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнамах ом вішнупа̄дая кришна-прештха̄я бгӯтале\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсва̄мī шрī бгактіведа̄нта прабгупа̄да̄я те намах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґурваґʼям шірасі-дгритва̄ шяктьявешя сва-рӯпіне\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхаре-кришнеті мантрена па̄шчатья-пра̄чʼя-та̄ріне\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвішва̄ча̄рʼя прабарʼяя дівʼя ка̄рунья мӯртає\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī бга̄ґавата-ма̄дгурʼя-ґīта-ґʼяна прада̄їне\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґаура-шрī-рӯпа-сіддга̄нта-сарасватī нішевіне\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄дга̄-кришна-пада̄мбгоджа-бгринґа̄я ґураве намах\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shrimach-chaitanya-sarasvata-mathavara-udgita-kirtir\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eСлава Шрī Чайтанья Са̄расват Матху \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Б.Р. Шрīдгар Дев-Ґосва̄мī Маха̄ра̄дж while\u003c/h4\u003e\n\u003ch4\u003eresiding in a hut on the banks of the Ganges in 1941.\u003c/h4\u003e\n\u003ch4\u003eRendered into English by Śrīpād B.A. Sāgar Mahārāj from the Bengali translation by Śrīla B.S. Govinda Dev-Goswāmī Mahārāj.\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрīмач-чайтанья-са̄расвата-матхавара-удґīта-кīртір джая-шрīм\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбібграт самбга̄ті ґанґа̄-тата-ніката-навадвīпа-кола̄дрі-ра̄дже\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eятра шрī-ґаура-са̄расвата-мата-нірата̄-ґаура-ґа̄тха̄ ґринанті\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнітьям рӯпа̄нуґа шрī-критаматі-ґуру-ґаура̄нґа-ра̄дга̄-джіта̄шя\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-sa-parikara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eДжая Дгвані \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003e\"Кī Джая!\" прославлення\u003c/h3\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая са-парікара шрī-шрī-ґуру-ґаура̄нґа-ра̄дга̄-ґовіндасундар ґірідга̄рīджīу кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджая ом вішнупа̄да парамахамса-парівра̄джака̄ча̄рʼя-варʼя аштоттара-шята-шрī шрīмад бгакті сундар ґовінда дев-ґосва̄мī маха̄ра̄дж кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджая ом вішнупа̄да парамахамса-парівра̄джака̄ча̄рʼя-варʼя аштоттара-шята-шрī шрīмад бгакті ракшак шрīдгар дев-ґосва̄мī маха̄ра̄дж кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджая ом вішнупа̄да парамахамса-парівра̄джака̄ча̄рʼя-варʼя аштоттара-шята-шрī шрīмад бгакті сіддга̄нта сарасватī тха̄кур кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджая ом вішнупа̄да шрīла ґаура-кішора да̄с ба̄ба̄джī маха̄ра̄дж кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджая ом вішнупа̄да шрīла сач-чід-а̄нанда бгактівінода тха̄кур кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджая ом вішнупа̄да шрīла джаґанна̄тх да̄с ба̄ба̄джī маха̄ра̄дж кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī рӯпа̄нуґа ґуру-варґа кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнама̄ча̄рʼя шрīла харіда̄с тха̄кур кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eананта-котī вайшнава-вринда кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī баладева відьябгӯшана кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрīла вішвана̄тх чакравартī прабгу кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī нароттама-шьяма̄нанда-шрīніва̄са-а̄ча̄рʼя-прабгу кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрīла вринда̄ван да̄с тха̄кур кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрīла кришнада̄с кавіра̄дж кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсапаршада шрī нітьянанда прабгу кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсапаршада шрīман маха̄прабгу кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджая шрī-шрī ра̄дга̄-кришна ґопа-ґопī-ґопīна̄тх шьяма-кунда ра̄дга̄-кунда ґірі-ґовардган кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī лакшмī-вара̄хадева кī джая! (у нашому Навадвіп Матху)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшюддга бгакті вігна віна̄шяя шрī нрисімгадева кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгакта-правара прахла̄д маха̄ра̄дж кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтуласī маха̄ра̄нī кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґанґа̄-ямуна̄джī кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґрантхара̄джа шрīмад-бга̄ґаватам чайтанья-чаріта̄мрита кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвішва-вайшнава ра̄джа сабга̄ кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄кара матха-ра̄джа шрī чайтанья матх кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтадīя шякха-матх кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī чайтанья са̄расват матх кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвішва-бʼяпī тадīя шякха-матх кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрīдга̄м ма̄япур кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрīдга̄м набадвīп кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвринда̄ван дга̄м кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпурушоттам дга̄м кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбаладева-субгадра̄-джаґанна̄тхджī кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī ґовінда кунда кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī сада̄шіва ґанґадгараджīу кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсамавета вайшнава-мандала кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсамавета бгакта-вринда кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхаріна̄ма-санкīртана кī джая!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніта̄і-ґаура-према̄нанде харібол!\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-krishna-chaitanya-prabhu-nityananda\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eПаньча-таттва мантра \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-кришна-чайтанья прабгу нітьянанда\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-адвайта ґада̄дгара шрīва̄са̄ді-ґаура-бгакта-вринда\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВиспівуючи Харе Крішна \u003ci\u003eмаха-мантру\u003c/i\u003e існує ймовірність зневажливо поставитися до Святого Імені. Існує десять різновидів зневаг. Однак Паньча-таттва мантра усуває будь-яку зневагу. Шрі Чайтанья Махапрабгу — найвеликодушніше втілення Бога, адже Він не бере до уваги зневажливе ставлення грішних душ до Святого Імені. Тому для того, щоб отримати від оспівування \u003ci\u003eмаха-мантри\u003c/i\u003e найбільше благо, необхідно просити Шрі Чайтанью Махапрабгу та Його супутників — Паньча-таттву, стати нашим прихистком.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hare-krishna-hare-krishna-krishna-krishna-hare-hare\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eХаре Крішна маха̄мантра \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eПояснення Шрīли Шрīдгара Маха̄ра̄джа\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eхаре кришна харе кришна кришна кришна харе харе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхаре ра̄ма харе ра̄ма ра̄ма ра̄ма харе харе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВ Імені Рами, яке містить Харе Крішна \u003ci\u003eмантра\u003c/i\u003e, Ґаудія-вайшнави вбачають Радга-рамана Раму. Це означає: “Крішна, Який тішить (\u003ci\u003eраман\u003c/i\u003e) Шриматі Радгарані”. В нашому розумінні Харе Крішна \u003ci\u003eмантра\u003c/i\u003e — це виключно свідомість Крішни, а не свідомість Рами (Господа Рамачандри). Вищий ідеал Шрі Чайтаньї — це Сваям Бгаґаван, Крішна-\u003ci\u003eліла\u003c/i\u003e та Радга-Ґовінда-\u003ci\u003eліла\u003c/i\u003e.\u003cbr\u003e\nЗ огляду на це, в Харе Крішна \u003ci\u003eмантрі\u003c/i\u003e не йдеться про Рама-\u003ci\u003eлілу\u003c/i\u003e Айодгʼї. Вищий зміст Харе Крішна \u003ci\u003eмантри\u003c/i\u003e не має відношення до цього… Від розуміння внутрішньої суті \u003ci\u003eмантри\u003c/i\u003e залежить наш духовний успіх, а також це розуміння дозволить відданим дістатися до їх жаданого призначення.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hari-nama-mahamantra-sarva-mantra-sara\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eДашя-відга На̄ма̄пара̄дга \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eThe Ten Offences to the Holy Name\u003c/h3\u003e\n\u003ch4\u003eBengali poem composed by\u003c/h4\u003e\n\u003ch4\u003eШрīла Бгакті Сундар Ґовінда Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eхарі-на̄ма маха̄мантра сарва-мантра-са̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджа̄дера каруна̄бале джаґате прача̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсеі на̄ма-пара̄ян са̄дгу, маха̄джана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eта̄ха̄дера нінда̄ на̄ коріхо када̄чана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвраджендранандана кришна сарвешварешвара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмахешвара а̄ді та̄ра севана-татпара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄ма чінта̄мані кришна-чайтанья-сварӯпа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгеда-ґʼяна на̄ корібе лīла̄-ґуна-рӯпа\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘‘ґуру кришна-рӯпа хон шястрера прама̄не\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґуру-рӯпе кришна крипа̄ коре бга̄ґʼява̄не’’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсе ґуруте мартья-буддгі аваґʼяді тьяджі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eішта-ла̄бга кара, нірантара на̄ма бгаджі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшруті, шруті-ма̄та̄-саха са̄твата-пура̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-на̄ма-чарана-падма коре нīра̄джана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсеі шруті шястра джеба̄ карає ніндана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсе апарадгīра санґа корібе варджана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eна̄мера махіма̄ сарва-шястрете ва̄кха̄не\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eатістуті, хено кабгу на̄ бга̄віха мане\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eаґастья, ананта, брахма̄, шіва̄ді сатата\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдже на̄ма-махіма̄-ґа̄тха̄ санкīртана-рата\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсе на̄ма-махіма̄-сіндгу ке па̄ібе па̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eатістуті боле джеі—сеі дура̄ча̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкришна-на̄ма̄болі нітья ґолокера дгана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкалпіта, пра̄крита, бга̄ве—апара̄дгі-джана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eна̄ме сарва-па̄па-кшая сарва-шястре кая\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eса̄ра̄-діна па̄па корі сеі бгараса̄я—\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eемата дурбуддгі джа̄ра сеі апара̄дгі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eма̄я-праваньчіта, духкха бгуньдже ніравадгі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eатулья шрī-кришна-на̄ма пӯрна-раса-нідгі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eта̄ра сама на̄ бга̄віха шюбга-карма а̄ді\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eна̄ме шраддга̄-хіна-джана—відга̄та̄ ва̄ньчхіта\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eта̄ре на̄ма да̄не апара̄дга сунішчіта\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшюніяо кришна-на̄ма-ма̄ха̄тмʼя апа̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдже пріті-рахіта, сеі нара̄дгама чха̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eалланта̄ мамата̄ джа̄ра антаре ба̄хіре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшюддга кришна-на̄ма та̄ра кабгу на̄хі спхуре\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eеі дашя апара̄дга корія варджана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджена джана коре харіна̄ма санкīртана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eапӯрва шрī-кришна-према лабгʼя та̄ре хой\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄ма-прабгу та̄ра хриде нітья віласай\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-nija-pati-bhuja-danda-chchhatra-bhavam\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Шрī Ґовардгана-ва̄са-пра̄ртхана̄-дашякам \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eA Dwelling Near Śrī Govardhan\u003c/h3\u003e\n\u003ch4\u003eTen prayers for a dwelling near Śrī Govardhan composed by Śrīla Raghunāth Dās Goswāmī Prabhu\u003c/h4\u003e\n\u003ch4\u003eThe preferred prayer to Śrī Govardhan of Śrīla Bhakti Siddhānta Saraswatī Ṭhākur\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eніджа-паті-бгуджа-данда-ччхатра-бга̄вам прападья\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпратіхата-мада-дгриштодданда-девендра-ґарва\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eатула-притхула-шяйла-шрені-бгӯпа пріям ме\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніджа-ніката-ніва̄сам дехі ґовардгана твам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпрамада-мадана-лīла̄х кандаре кандаре те\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eрачаяті нава-юнор двандвам асмінн амандам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eіті кіла калана̄ртхам лаґнакас тад-двайор ме\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніджа-ніката-ніва̄сам дехі ґовардгана твам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eанупама-мані-ведī-ратна-сімга̄санорвī-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eруха-джгара-дара-са̄ну-дроні-сангешу ранґайх\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсаха бала-сакхібгіх санкхелаян сва-пріям ме\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніджа-ніката-ніва̄сам дехі ґовардгана твам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eраса-нідгі-нава-юнох са̄кшинīм да̄на-келер\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдьюті-парімала-віддга̄м шьяма-ведīм прака̄шья\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eрасіка-вара-кула̄на̄м модам а̄спха̄лаян ме\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніджа-ніката-ніва̄сам дехі ґовардгана твам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eхарі-даїтам апӯрвам ра̄дгіка̄-кундам а̄тма-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрія-сакхам іха кантхе нармана̄лінґʼя ґуптах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнава-юва-юґа-кхела̄с татра пашьян рахо ме\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніджа-ніката-ніва̄сам дехі ґовардгана твам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eстхала-джала-тала-шяшпайр бгӯрухач-чха̄яя ча\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпраті-падам анука̄лам ханта самвардгаян ґа̄х\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтрі-джаґаті ніджа-ґотрам са̄ртхакам кхʼяпаян ме\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніджа-ніката-ніва̄сам дехі ґовардгана твам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсура-паті-крита-дīрга-дрохато ґоштха-ракша̄м\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтава нава-ґриха-рӯпасьянтаре курватайва\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eага-бака-ріпуноччхайр датта-ма̄на друтам ме\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніджа-ніката-ніва̄сам дехі ґовардгана твам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґірі-нрипа харі-да̄са-шрені-варʼєті на̄ма̄-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмритам ідам удітам шрī-ра̄дгіка̄-вактра-чандра̄т\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвраджа-нава-тілакатве клипта ведайх спхутам ме\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніджа-ніката-ніва̄сам дехі ґовардгана твам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eніджа-джана-юта-ра̄дга̄-кришна-майтрī-раса̄кта-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвраджа-нара-пашю-пакши-вра̄та-саукхʼяйка-да̄тах\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eаґаніта-карунатва̄н ма̄м урīкритья та̄нтам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніджа-ніката-ніва̄сам дехі ґовардгана твам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнірупадгі-карунена шрī-шячī-нанданена\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтваї капаті-шятхо ’пі тват-прієна̄рпіто ’смі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eіті кхалу мама йоґʼяйоґʼята̄м та̄м аґрихнан\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніджа-ніката-ніва̄сам дехі ґовардгана твам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eрасада-дашякам асья шрīла-ґовардганасья\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкшиті-дгара-кула-бгартур ях праятна̄д адгīте\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eса сападі сукхаде ’смін ва̄сам а̄са̄дья са̄кша̄ч\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчхубгада-юґала-сева̄-ратнам а̄пноті тӯрнам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eРанкове А̄раті і програма\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-jaya-jaya-girirajer-arati-vishiala\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Ґовінда Кунда Ґупта-Ґовардган А̄раті \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгакті Сундар Ґовінда Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая джая ґіріра̄джер а̄раті вішяла\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī ґаура-мандала-ма̄джге бгувана-манґала\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава, слава величному \u003ci\u003eараті\u003c/i\u003e Шрі Ґіріраджа! Воно проводиться серед Шрі Ґаура-\u003ci\u003eмандали\u003c/i\u003e та приносить благо усьому Всесвіту!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eколадвīпе шобге ґупта-ґовардганарӯпа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвʼякта хоіла̄ шрī ґовінда кунде апарӯпа\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПрихований Ґовардган – розкішне убрання Коладвіпи! Тепер Він проявив свою виняткову красу в Шрі Ґовінда-\u003ci\u003eкунді\u003c/i\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eма̄латī-ма̄дгавī-куньджа кандаре кандаре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніґӯдга-нікуньджа-лīла̄ харі-манохаре\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТам, серед гаїв з квітів \u003ci\u003eмалаті\u003c/i\u003e та ліан \u003ci\u003eмадгаві\u003c/i\u003e, Господь Харі проводить Свої потаємні та захоплюючі ігри.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eапӯрва кундера шобга̄ джена судга̄бга̄нда\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсурендра-сурабгī-сева̄-саубга̄ґʼя-ма̄ртанда\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eНезрівнянна краса кунди подібна медовій благодаті. Господь Індра та божественна корова Сурабгі виконують своє служіння в яскравих променях благої удачі.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī бгакті-ракшака дева-ґосва̄мī шрīдгара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрака̄шіла̄ тава сева̄ дīпта манохара\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eШріла Бгакті Ракшак Шрідгар Дев-Ґосвамі Махарадж явив осяяне та чарівне віддане служіння Тобі.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī чайтанья-са̄расвата матха сушобгана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eятха̄ нітья сева̄ коре са̄расвата-ґана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eШрі Чайтанья Сарасват Матх – прекрасне місце, де віддані завжди зайняті служінням Тобі.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґосва̄мī шрī-рагуна̄тха да̄сере смарія\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнірантара сева̄ коре антармана̄ хоія\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПамʼятаючи про Шрі Рагхунатху Даса Ґосвамі, вони постійно зайняті служінням в настрої споглядання.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая ґупта-ґовардгана дівʼя-раса̄лой\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eрӯпа-рагуна̄тха̄нуґа-бгактера а̄шрой\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eУся слава прихованому Ґовардгану, осередку духовної \u003ci\u003eраси\u003c/i\u003e! Він – притулок відданих, які слідують за Шрі Рупою та Шрі Рагунатхом!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкулія-прака̄шя тава ачінтья-махіма̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдіва̄ніші бгакта-вринда коре парікрама̄\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСвоєю незбагненною славою та великодушністю Ти проявив Кулію (місце прощення всіх зневаг). Вдень та вночі сонми відданих обходять це місце.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсевʼя о севака-рӯпе нітья парака̄шя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eса̄нанде а̄раті декхе е адгама да̄са\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТи вічно проявляєш себе як Господь, якому поклоняються, і як Господь в образі відданого. Цей ниций слуга споглядає Твоє \u003ci\u003eараті\u003c/i\u003e з великою радістю в серці.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-jaya-girirajer-arotiko-shobha\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Шрī Ґіріра̄дж-Ґовардган А̄раті \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгакті Сундар Ґовінда Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая джая ґіріра̄джер а̄ротіко шобга̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-враджа-мандала ма̄джге джаґа мана лобга̄\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВся слава прекрасному \u003ci\u003eараті\u003c/i\u003e Шрі Ґіріраджа, що відбувається у Шрі Враджа-\u003ci\u003eмандалі\u003c/i\u003e та привертає увагу всіх жителів всесвіту.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпрамода-мадана-лīла шрī-ра̄дга̄-рамана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eятха̄ нітья-лīла̄ коре лоє сакхī-ґана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eГосподь Шрі Радга-Рамана (Крішна, Який дарує насолоду Своїй коханій Шріматі Радгарані) вічно грається у Свої радісні любовні забави у колі \u003ci\u003eсакхі\u003c/i\u003e — подруг Шріматі Радгарані.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eма̄латī-ма̄дгавī-куньджа кандаре кандаре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніґӯдга нікуньджа-лīла харі манохаре\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТут, серед квіткових гаїв \u003ci\u003eмалаті\u003c/i\u003e та ліан \u003ci\u003eмадгаві\u003c/i\u003e, відбуваються таємні ігри чарівного Господа Харі.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшьяма-кунда ра̄дга̄-кунда кусум саровара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eма̄наса ґанґа̄ да̄на-га̄тī джа̄ра абгʼянтара\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eУ цьому святому місці розташовані Шьяма-\u003ci\u003eкунда\u003c/i\u003e, Радга-\u003ci\u003eкунда\u003c/i\u003e, Кусум-Саровар, Манаса-Ґанґа та Дана-\u003ci\u003eгаті\u003c/i\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-ґовінда-кунда лīла̄стхалī на̄хі сīма̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдіва̄ніші-бгакта-вринда коре парікрама̄\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eРазом зі Шрі Ґовінда-\u003ci\u003eкундою\u003c/i\u003e ці святі місця божественних ігор безмежні. Вдень і вночі віддані обходять їх по колу, поклоняючись їм.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘шрīдгар-сва̄мī-сева̄шрам’ парама шобгана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eятха̄ нітья-сева̄ коре са̄расвата-ґана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТут стоїть надзвичайно прекрасний Шрідгар Свамі Севашрам, де віддані Шрі Чайтанья Сарасват Матху займаються своїм вічним служінням.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eабгінна шрī кришна ґʼяне бгаджіба̄ра торе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмаха̄прабгу самарпіла̄ рагуна̄тха коре\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eШріман Махапрабгу дарував Шрі Шрі Ґіріраджа Джіу Шрі Рагунатху Ґосвамі, щоб Шрі Дас Ґосвамі міг поклонятися Його Величності, знаючи, що Ґірірадж не відрізняється від Самого Крішни.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґосва̄мī шрī-рагуна̄тха да̄сере смарія\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнірантара сева̄ коре антармана̄ хоія\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВіддані Шрі Чайтанья Сарасват Матху поклоняються Шрі Шрі Ґіріраджу Джіу з глибокою відданістю, памʼятаючи Шрі Рагунатха Даса Ґосвамі.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая ґірі-ґовардгана дівʼя-раса̄лой\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eрӯпа-сана̄тана-джīва-рагуна̄тха̄шрой\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВся слава Шрі Ґірі Ґовардгану — обителі божественної \u003ci\u003eраси\u003c/i\u003e та притулку Шрі Рупи, Санатани, Джіви і Рагунатха Ґосвамі.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсурендра-мунīндра-шіва-шюка-маха̄джана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдекхена а̄раті-шобга̄ дурллабга-даршяна\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eРідкісну й дорогоцінну красу \u003ci\u003eараті\u003c/i\u003e Шрі Ґіріраджа Джіу споглядають Господь Індра, Нарада Муні, Господь Шіва, Шюкадева Ґосвамі та всі величні особистості.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсевʼя о севака-рӯпе нітья парака̄шя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eса̄нанде а̄раті декхе е адгама да̄са\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eШрі Шрі Ґірірадж Джіу вічно проявлений і як Господь, якому поклоняються, і як Господь, який служить. Цей занепалий слуга з великою радістю споглядає \u003ci\u003eараті\u003c/i\u003e Шрі Ґіріраджа Джіу.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-guru-maharaja-karuna-sagara\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Шрī Ніта̄і-Чайтанья-А̄раті \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгакті Сундар Ґовінда Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003ch4\u003efor the Āratis in our Jagannāth Puri Branch Temple\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая ґуру маха̄ра̄джа каруна̄-са̄ґара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī бгакті ракшака дева-ґосва̄мī шрīдгара\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпрака̄шіле нīла̄чале бгувана-манґала\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніта̄і-чайтанья-дева-сева̄ самуджджвала\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґора̄преме ма̄тояра̄ нітьянанда-рӯпа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eрасара̄джа маха̄бга̄ва чайтанья-сварӯпа\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкасіта-ка̄ньчана джіні шрī-анґа лабані\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдугуґале ванама̄ла̄ бга̄вера доланī\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмурачіта котіка̄ма рӯпара̄саранґе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмадгура нартана-бга̄ва вара̄бгая бганґе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкоті-чандра-бга̄нушобга̄ ратна-сімга̄сане\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрема нетре декхе маха̄-бга̄ґʼява̄на джане\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмриданґа мандіра̄ ба̄дже сушянкха-дгваніта\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшруті-маулі-ратнама̄ла̄-дīпа ніра̄джіта\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгувана-мохана дугу рӯпера а̄раті\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґупта-вринда̄ранья-ва̄сī декхе ніравадгі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī сварӯпа ра̄ма̄нанда рӯпа-сана̄тана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eрагуна̄тха харіда̄са ґада̄дгара дгана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eса̄рвабгаума ґопīна̄тха джīва̄нуґа-джана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдекхена а̄раті-шобга дурллабга-даршяна\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнадīя прака̄шє нітьянанда-ґауранідгі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпатіта-па̄вана-кшетре міла̄іла відгі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eавічінтья нітьянанда-чайтанья-прака̄шя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī ґуру-праса̄де декхе еі адгама да̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(шрī ґуру-праса̄де декхе шрī ґовінда да̄са)\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-jaya-gurudever-arati-ujjvala\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Ґуру А̄раті \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eПрославлення Ш́рīли Бгакті Сундара Ґовінди Дев-Ґосва̄мī Маха̄ра̄джа\u003c/h3\u003e\n\u003ch4\u003eШрīпа̄д Б. А. Парамахамса Маха̄ра̄дж\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая джая ґурудевер а̄раті уджджвала\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґовардгана-па̄да-пīтхе бгувана-манґала\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВся слава сяючому \u003ci\u003eараті\u003c/i\u003e Шрі Ґурудева, що відбувається біля підніжжя Ґовардгана і несе благо усьому світу.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī бгакті сундара дева прабгу шіромані\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґосва̄мī ґовінда джая а̄нандера кхані\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВся слава Шрі Бгакті Сундару Ґовінді Ґосвамі - нашому найвищому вчителю, джерелу духовного щастя.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄джа̄ну ламбіта бгуджа дівʼя калевара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eананта пратібга̄ бгара̄ дівʼя ґунадгара\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЙого витончені довгі руки досягають колін, а його тіло божественне й прекрасне. Він — нескінченний океан незбагненних геніальних якостей.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґаура-кришне джа̄ні тава абгінна сварӯпа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсамса̄ра таріте ебе шюддга-бгакта-рӯпа\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eМи вважаємо тебе тотожним до Крішни та Ґауранґи. Але зараз, щоб звільнити цей матеріальний світ, ти зійшов в образі чистого відданого.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eрӯпа̄нуґа-дга̄ра̄ тумі кара а̄локіта\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрабга̄кара сама прабга̄ бгувана-відіта\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТи прикрашаєш лінію послідовників Шріли Рупи Ґ
