g\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тава маджгу хобо кон ка̄дже\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмадгава! ха̄ма паріна̄м-ніра̄шя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтуху джаґа-та̄рана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дīна даямой\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;атає тоха̄рі вішояса̄\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄дга джанама ха̄ма\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нінде ґонʼяола\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джара̄ шішю кото-діна ґела\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнідгуване раманī\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;раса-ранґе ма̄тала\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тохе бгаджабо кон бела\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкото чатура̄нана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;марі марі джа̄ота\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на туя а̄ді аваса̄на̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтохе джанамі пуна\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тохе сама̄ота\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;са̄ґара лахарī сама̄на̄\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбганає відьяпаті\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шєша шямана бгая\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;туя віну ґаті на̄хі а̄ра̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄ді ана̄діка\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄тха каха̄осі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгава та̄рана-бга̄ра тоха̄ра̄\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hari-he-dayala-mora-jaya-radha-natha\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eДайнья О Прапатті \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eхарі хе даяла мора джая ра̄дга̄-на̄тха\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eба̄ро ба̄ро еі-ба̄ро лохо ніджа са̄тха\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбаху джоні бграмі на̄тха! лоіну шярана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніджа-ґуне крипа̄ кара адгама та̄рана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджаґата-ка̄рана тумі джаґата-джīвана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтома̄ чха̄да̄ ка̄ро на’хі хе ра̄дга̄-рамана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгувана-манґала тумі бгуванера паті\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтумі упекшиле на̄тха, кі хоібе ґаті\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбга̄вія декхіну еі джаґата-ма̄джга̄ре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтома̄ віна̄ кехо на̄хі е да̄се уддга̄ре\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-atma-samarpane-gela-abhimana\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eА̄тма-самарпане \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄тма-самарпане ґела̄ абгіма̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄хі карабу ніджа ракша̄-відга̄н\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтуя дгана джа̄ні’ туху ра̄кхобі, на̄тх!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпа̄лья ґодгана джа̄ні корі’ туя са̄тх\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eчара̄обі ма̄дгава! ямуна̄-тīре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбамші ба̄джа̄ото да̄кобі дгīре\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eага-бака ма̄рато ракша̄-відга̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкарабі сада̄ туху ґокула-ка̄на!\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eракша̄ карабі туху нішчой джа̄ні\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпа̄на карабу ха̄м джа̄муна-па̄ні\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eка̄лīя-докха карабі віна̄шя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшодгобі надī-джала, ба̄да̄обі а̄шя\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпіято да̄ва̄нала ра̄кхобі мой\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘ґопа̄ла’, ‘ґовінда’ на̄ма тава хой\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсура-паті-дурматі-на̄шя віча̄рі’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄кхобе варшане, ґірі-вара-дга̄рі!\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eчатур-а̄нана корабо джабо чорі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eракша̄ карабі меє, ґокула-харі!\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгакатівінода—туя ґокула-дган\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄кхобі кешява! корато джатан\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-kobe-hobe-bolo-se-dina-amar\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eКобе хо’бе боло \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кобе хо’бе боло се-діна а̄ма̄р\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(а̄ма̄р) апара̄дга гучі’,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шюддга на̄ме ручі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;крипа̄-боле хо’бе хридоє саньча̄р\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтрина̄дгіка хīна,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кобе нідже ма̄ні,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сахішнута̄-ґуна хридоєте а̄ні’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсакале ма̄нада,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄пані ама̄нī,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хоє а̄сва̄дібо на̄ма-раса-са̄р\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдгона джон а̄ра,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кобіта̄-сундарī,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;болібо на̄ ча̄хі дехо-сукха-карī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджанме-джанме да̄о,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;охе ґаурахарі!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ахайтукī бгакті чаране тома̄р\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(кобе) коріте шрī-кришна-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ма уча̄рана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пулакіта дехо ґадґада вачана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбайбарнья-бепатху\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хобе сангатана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нірантара нетре бо’бе ашру-дга̄р\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкобе навадвīпе,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сурадгунī-тате,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘ґаура-нітьянанда’ болі’ нішкапате\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄чія ґа̄ія,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;беда̄ібо чхуте,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ба̄тулера пра̄я чха̄дія віча̄р\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкобе нітьянанда,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;море корі’ дая,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чха̄да̄ібе мора вішоєра ма̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдія море ніджа-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чаранера чха̄я,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄мера ха̄тете дібе адгіка̄р\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкінібо, лутібо,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;харі-на̄ма-раса,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ма-расе ма̄ті’ хоібо вівашя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eрасера расіка-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чарана парашя,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;корія моджібо расе аніба̄р\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкобе джīве дая,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хоібе удоя,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ніджа-сукха бгулі’ судīна-хридоя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгакатівінода,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;корія біноя,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-а̄ґʼя-тохоло корібе прача̄р\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gopinath-mama-nivedana-shiuno\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eНіведана \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003ePart 1\u003c/h3\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мама ніведана шюно\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвішої дурджана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сада̄ ка̄ма-рата,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кічху на̄хі мора ґуна\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ма̄ра бгараса̄ тумі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтома̄ра чаране,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лоіну шярана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тома̄ра кінкара а̄мі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кемоне шодгіве море\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄ джа̄ні бгакаті,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;карме джадаматі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;подечхі самса̄ра горе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сакалі тома̄ра ма̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄хі мама бала,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґʼяна сунірмала,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сва̄дгīна нахе е ка̄я\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ніята чаране стха̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eма̄ґе е па̄мара,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ка̄ндія ка̄ндія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;карахе каруна̄ да̄на\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тумі то сакалі па̄ро\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдурджане та̄ріте,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тома̄ра шякаті,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ке а̄чхе па̄пīра а̄ро\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тумі крипа̄-па̄ра̄ба̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджīвера ка̄ране,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄сія прапаньче,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лīла̄ коіле субіста̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄мі кі дошера доши\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eасура сакала,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;па̄іло чарана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вінода тха̄кіло босі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gopinath-ghuchao-samsara-jvala\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eНіведана \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003ePart 2\u003c/h3\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;гуча̄о самса̄ра-джва̄ла̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eавідья-джа̄тана̄,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ро на̄хі сахе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джанама-марана-ма̄ла̄\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄мі то ка̄мера да̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвішоя-ва̄сана̄,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джа̄ґічхе хридоє,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпха̄ндічхе карама пха̄нса\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кобе ва̄ джа̄ґібо а̄мі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eка̄ма-рӯпа арі,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дӯре теяґібо,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хридоє спхурібе тумі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄мі то’ тома̄ра джон\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтома̄ре чха̄дія,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;самса̄ра бгаджіну,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгулія а̄пана-дгана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тумі то сакалі джа̄но\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄пана̄ра джане,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дандія екхона,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шрī-чаране дехо стха̄но\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;еі кі віча̄ра тава\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвімукха декхія,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чха̄да ніджа-джане,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на кара каруна̄-лаба\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄мі то мӯракха аті\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкісе бга̄ло хоя,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кабгу на̄ буджгіну,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄і хено мама ґаті\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тумі то пандіта-вара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмӯдгера манґала,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сада̄ анвешибе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;е да̄се на̄ бга̄ва пара\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gopinath-amara-upaya-nai\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eНіведана \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003ePart 3\u003c/h3\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ма̄ра упа̄я на̄і\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтумі крипа̄ корі,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ма̄ре лоіле,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;самса̄ре удга̄ра па̄і\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;подечхі ма̄яра пхере\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдгон, да̄ра̄, сута,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;гіречхе а̄ма̄ре,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ка̄мете рекхечхе джере\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мана дже па̄ґала мора\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄ ма̄не шясана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сада̄ ачетана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вішоє роєчхе бгора\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ха̄ра дже менечхі а̄мі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eонека джатана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хоіло біпхала,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;екхона бгараса̄ тумі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кемоне хоібе ґаті\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрабала індрія,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;боші-бгӯта мана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ чха̄де вішоя-раті\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хридоє босія мора\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eманаке шямія,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лохо ніджа па̄не,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;гучібе віпада гора\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ана̄тха декхія море\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтумі хришикешя,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хришика дамія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄ро’ хе самсриті-горе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґопīна̄тх,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґола̄я леґечхе пха̄нса\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкрипа̄-асі дгорі,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бандгана чхедія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;віноде карахо да̄са\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-rupa-manjari-pada-sei-mora-sampada\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī-Рӯпа-Маньджарī-пада \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Нароттам Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-рӯпа-маньджарī-пада,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сеі мора сампада,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сеі мора бгаджана-пӯджана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсеі мора пра̄на-дгана,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сеі мора а̄бгарана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сеі мора джīванера джīвана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсеі мора раса-нідгі,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сеі мора ва̄ньчха̄-сіддгі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сеі мора ведера дгарама\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсеі брата, сеі тапа,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сеі мора мантра-джапа,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сеі мора дгарама-карама\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eанукӯла хобе віддгі,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;се-паде хоібе сіддгі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ніракхібо е дуі наяне\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсе рӯпа-ма̄дгурī-ра̄ші,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пра̄на-кувалая-шяші,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;прапхулліта хобе ніші-діне\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтуя адаршяна-ахі,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґороле джа̄рало дехі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чіро-діна та̄піта джīвана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eха̄ ха̄ рӯпа кара дая,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дехо море пада-чха̄я,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нароттама лоіло шярана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch3\u003eКоментар Шріли Б.Р. Шрідгара Дев-Ґосвамі Махараджа\u003c/h3\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"translation\"\u003e\u003ci\u003eШрī-рӯпа-маньджарī-пада, сеі мора сампада, сеі мора бгаджана-пӯджана\u003c/i\u003e — моє усе — це святі стопи Шрі Рупи Ґосвамі. Є багато різних ступенів і положень у \u003ci\u003eрасах\u003c/i\u003e: \u003ci\u003eшанта\u003c/i\u003e, \u003ci\u003eдасья\u003c/i\u003e, \u003ci\u003eсакхʼя\u003c/i\u003e, \u003ci\u003eватсалья\u003c/i\u003e, \u003ci\u003eмадгура\u003c/i\u003e. У \u003ci\u003eмадгура-расі\u003c/i\u003e особливе місце займає група Шрі Радгарані. Далі йдуть численні ступені \u003ci\u003eсакхі\u003c/i\u003e. Потім є окрема група \u003ci\u003eманьджарі\u003c/i\u003e — молодших дівчаток, які мають особливу свободу: коли Радга і Ґовінда проводять час разом в усамітненому місці, \u003ci\u003eманьджарі\u003c/i\u003e все одно можуть туди підійти. Вони мають таку свободу служіння Їм. Якщо для служіння потрібні якісь речі, то \u003ci\u003eсакхі\u003c/i\u003e посилають туди \u003ci\u003eманьджарі\u003c/i\u003e. Самі \u003ci\u003eсакхі\u003c/i\u003e туди не наближаються. Таким чином \u003ci\u003eманьджарі\u003c/i\u003e мають найбільшу довіру.\u003cbr\u003e\nНайпотаємніше служіння Їм обом здійснюється саме через \u003ci\u003eманьджарі\u003c/i\u003e. На найвищому рівні вони мають право входу, і їхня провідниця — Рупа Маньджарі. Вона вважається старшою всієї групи молодших дівчаток, \u003ci\u003eманьджарі\u003c/i\u003e, тому в \u003ci\u003eмадгура-бгаджані\u003c/i\u003e Вона — все для нас. Так навчав нас Нароттам Тхакур. Для нас — і для прийдешніх поколінь — Вона є найвищим притулком.\u003cbr\u003e\n\u003ci\u003eСеі мора сампада\u003c/i\u003e — у Її стопах моє справжнє багатство. \u003ci\u003eСеі мора бгаджана-пӯджана\u003c/i\u003e — у Ній зосереджені моє служіння й поклоніння. \u003ci\u003eСеі мора пра̄на-дгана, сеі мора а̄бгарана\u003c/i\u003e — у Ній зосереджена найвища суть мого життя; і якщо в моєму житті є якісь прикраси, то це лише те, що приходить через Її милість. \u003ci\u003eСеі мора джīванера джīвана\u003c/i\u003e — справжнє життя мого життя (якщо в ньому є щось істинне) — це також Вона. Я існую лише для Її радості.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"translation\"\u003e\u003ci\u003eСеі мора раса-нідгі\u003c/i\u003e — якщо в моєму житті є хоч щось піднесене і бажане, то джерело всього цього — лише там. Скарбниця, джерело й витік усієї \u003ci\u003eраси\u003c/i\u003e — у Її лотосових стопах. \u003ci\u003eСеі мора ва̄ньчха̄-сіддгі\u003c/i\u003e — і якщо я очікую якихось інших звершень у житті, то й вони теж містяться в Її стопах. \u003ci\u003eСеі мора ведера дгарама\u003c/i\u003e — якщо Веди визначають для мене якийсь обовʼязок, я хочу, щоб цей обовʼязок здійснювався лише біля Її стоп.\u003cbr\u003e\n\u003ci\u003eСеі брата, сеі тапа\u003c/i\u003e — якщо ж у мене є якісь плоди обітниць чи покаянь, то й вони можуть бути знайдені тільки там; \u003ci\u003eсеі мора мантра-джапа\u003c/i\u003e — і безупинне повторення мантри в \u003ci\u003eджапі\u003c/i\u003e також знаходить завершення лише там: усе в моєму житті має один кінець, одну ціль — у різних фазах зійтися в лотосових стопах Рупи Маньджарі. Якщо Вона задоволена, тоді всі різноманітні види мого відданого служіння досягають звершення. \u003ci\u003eСеі мора дгарама-карама\u003c/i\u003e — і будь-яке моє уявлення про обовʼязок чи діяльність, у будь-якій фазі чи формі, має одне спільне завершення і збігається в одній точці — у святих лотосових стопах Рупи Маньджарі.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"translation\"\u003e\u003ci\u003eАнукӯла хобе віддгі, се-паде хоібе сіддгі\u003c/i\u003e — я лише молю Повелителя і Першопричину всіх подій цього світу: «Будь ласка, звʼяжи мене з Нею. О Всевишній Управителю, дозволь усім моїм прагненням здобути Її милість. \u003ci\u003eНіракхібо е дуі наяне\u003c/i\u003e — і нехай це буде настільки виразно й відчутно, ніби я побачив це на власні очі. Я не хочу, щоб це було туманно, абстрактно чи уявно. Я благаю про найбільш реальне переживання по милості Всевишнього Управителя». \u003ci\u003eСе рӯпа-ма̄дгурī-ра̄ші, пра̄на-кувалая-шяші\u003c/i\u003e — яка ж незбагненно висока краса у Її святих стопах! Я хочу стрибнути туди. Нехай моє серце стане лотосом.\u003cbr\u003e\nЄ два види лотосів: білий лотос — сонячний, а червоний — місячний. \u003ci\u003eКувалая\u003c/i\u003e — це їхнє поєднання. Сяйво Її тіла живитиме мене і вдень, і вночі — як життя мого життя, подібне до лотоса \u003ci\u003eкувалая\u003c/i\u003e. \u003ci\u003eКувалая\u003c/i\u003e живиться й підтримується сяйвом місяця; Її святі стопи — це Місяць, а моя життєва сила подібна до лотоса. Нехай сяйво Її краси живить найпотаємнішу глибину мого серця. \u003ci\u003eПрапхулліта хобе ніші-діне\u003c/i\u003e — і від цього сяйва лотос мого серця буде рости й танцювати.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"translation\"\u003e\u003ci\u003eТуя адаршяна-ахі\u003c/i\u003e — така моя молитва, але в якому я положенні? Моє положення протилежне, о моя Повелителько. Мій стан такий, що без споглядання Твого образу, о Твоя Милосте, моє серце згорає в попіл. Такий мій стан. \u003ci\u003eҐороле джа̄рало дехі\u003c/i\u003e — ніби отрута кобри, яка спричиняє нестерпний біль моєму серцю. Мене вкусила змія, і що це за змія? Це відсутність прямого звʼязку з Тобою, Твоя Милосте. Отрута цієї змії скувала моє серце, і я помираю. \u003ci\u003eЧіро-діна та̄піта джīвана\u003c/i\u003e — і це сталося не раптово: з давніх-давен я терплю цей біль розлуки з прекрасним, сповненим надії щасливим життям.\u003cbr\u003e\n\u003ci\u003eХа̄ ха̄ рӯпа кара дая, дехо море пада-чха̄я, нароттама лоіло шярана\u003c/i\u003e — але зараз я дійшов краю і востаннє благаю Твоєї милості; інакше я згину.\u003cbr\u003e\nЦей \u003ci\u003eбгаджан\u003c/i\u003e склав Нароттам Тхакур на славу Шріли Рупи Ґосвамі. Так він відкрив нам промінь світла з найвищої сфери життя \u003ci\u003eбгаджану\u003c/i\u003e. Ця \u003ci\u003eсампрадая\u003c/i\u003e зветься Рупануґа-сампрадая, і наша Ґуру-парампара та все, що з нею повʼязане, узгоджені з цим настроєм. Він написав багато пісень, і всі вони мають глибоку внутрішню основу та сповнені піднесеного духовного переживання і непохитної віри.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-durlabha-manava-janma-labhiya-samsare\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eДурлабга ма̄нава-джанма \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдурлабга ма̄нава-джанма лабгія самса̄ре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкришна на̄ бгаджіну духка кохібо ка̄ха̄ре?\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘самса̄р’ ‘самса̄р’, корі мічхе ґело ка̄л\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eла̄бга на̄ коіло кічху, гатіло джаньджа̄л\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкісера самса̄р еі чха̄яба̄джі пра̄й\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eіха̄те мамата̄ корі вритха̄ діна джа̄й\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eе дехо патана хо’ле кі робе а̄ма̄р?\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкехо сукха на̄хі дібе путра паріба̄р\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґардабгер мата а̄мі корі парішрам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eка̄ра ла̄ґі’ ето корі, на̄ гучіло бграм\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдіна джа̄й мічха̄ ка̄дже, нішя нідра̄-вашє\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄хі бга̄ві марана нікате а̄чхе босе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбга̄ло манда кха̄і, хері, парі, чінта̄-хīна\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄хі бга̄ві, е дехо чха̄дібо кон діна\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдехо-ґехо-калатра̄ді-чінта̄ абірата\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджа̄ґічхе хридоє мор буддгі корі хото\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eха̄й, ха̄й! на̄хі бга̄ві—анітья е саба\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджīвана біґоте котха̄ рохібе вайбгава?\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшмашяне шорīра мама подія рохібе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбіханґа-патанґа та̄й біха̄ра корібе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкуккур сриґа̄л соб а̄нандіта хо’є\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмахотсава корібе а̄ма̄р дехо ло’є\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдже дехер еі ґаті, та̄ра ануґата\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсамса̄р-вайбгава а̄ро бондгу-джон джата\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eатаева ма̄я-моха чха̄ді буддгіма̄н\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнітья-таттва кришна-бгакті коруна сандга̄н\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-anya-abhilasha-chadi-jniana-karma-parihari\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eАнья-абгіла̄ша чха̄ді \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Нароттам Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eанья-абгіла̄ша чха̄ді\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґʼяна карма паріхарі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ка̄я мане корібо бгаджана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eса̄дгу-санґе кришна-сева̄\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ пӯджібо девī-дева̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;еі бгакті парама-ка̄рана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмаха̄джанера джеі патха\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄’те хо’бе анурата\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пӯрва̄пара корія віча̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eса̄дгана-смарана-лīла̄\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;іха̄те на̄ кара хела̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ка̄я мане корія сӯса̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eасат-санґа сада̄ тьяґа\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чха̄да анья ґīта-ра̄ґа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кармī ґʼянī паріхарі дӯре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкевала бгаката-санґа\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;према-катха̄-раса-ранґа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лīла̄-катха̄ враджа-раса-пуре\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджоґī ньясī кармī ґʼянī\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;анья-дева-пӯджака дгʼянī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;іха-лока дӯре паріхарі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкарма дгарма духкха шока\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джеба̄ тха̄ке анья джоґа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чха̄ді’ бгаджа ґірівара-дга̄рī\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтīртха-джа̄тра̄ парішрама\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кевала-манера-бграма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сарва-сіддгі ґовінда-чарана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдридга-вішва̄са хриде дгорі\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мада-ма̄тсарʼя паріхарі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сада̄ кара ананья бгаджана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкришна-бгакта санґа корі\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кришна-бгакта санґа хері\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шраддга̄нвіта шравана-кīртана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eарчана вандана дгʼяна\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нава-бгакті маха̄-ґʼяна\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;еі бгакті парама-ка̄рана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eхрисīке ґовінда-сева̄\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ пӯджібо девī-дева̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;еі то’ ананья-бгакті-катха̄\u003c/strong\u00 trong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лобга са̄дгу-санґе харі-катха̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмоха ішта-ла̄бга-біне\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мада кришна-ґуна-ґа̄не\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ніджӯкта корібо джатха̄ татха̄\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eаньятха̄ сватантра ка̄ма\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;анартха̄ді джа̄ра дга̄ма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгакті-патхе сада̄ дея бганґа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкіба̄ ба̄ коріте па̄ре\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ка̄ма-кродга са̄дгакере\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джаді хой са̄дгу-джана̄ра санґа\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкродга ба̄ на̄ коре кіба̄\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кродга-тьяґа сада̄ діба̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лобга моха еі то’ катхана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчоя ріпӯ сада̄ хīна\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;корібо манер адгīна\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кришначандра корія смарана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄пані пала̄бе саба\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шюнія ґовінда раба\u003c/strong\u003e\u003cbr\u003e g\u003e\u003cbr\u003e\n\u003cstrong\u003eкрипая тава па̄да-панкаджа-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eстхіта-дгӯлі-садришям вічінтая\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eана̄ді карама-пхоле,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;поді бгава̄рнава-джоле,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;торіба̄ре на̄ декхі упа̄й,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eе-вішоя-хола̄холе,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;діва̄-ніші хія джволе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мон кобгу сукха на̄хі па̄й\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄шя-па̄шя-шята-шята\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;клешя дея абірата,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;правриті-ӯрміра та̄хе кхела̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eка̄ма-кродга-а̄ді чхой,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ба̄тапа̄де дей бгой,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;абаса̄на хоіло а̄сі бела̄\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґʼяна-карма—тха̄ґа дуі,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;море прата̄рія лоі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;авашєше пхеле сіндгу-джоле\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eе хено сомоє, бандгу,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тумі кришна крипа̄-сіндгу\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;крипа̄ корі’ толо море боле\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпатіта-кінкоре дгорі’,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;па̄да-падма-дгӯлі корі’,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дехо бгактівіноде а̄шрой\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄мі тава нітья-да̄с\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгулія ма̄яра па̄ш,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;баддга хо’є а̄чі даямой\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-aparadha-phole-mama\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрī Шікша̄штакам \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eSong 6\u003c/h3\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнаянам ґалад-ашру-дга̄рая\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eваданам ґадґада-руддгая ґіра̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпулакайр нічітам вапух када̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтава на̄ма-ґрахане бгавішʼяті\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eапара̄дга-пхоле мама\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чітта бгела ваджра сама\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;туя на̄ме на̄ лобге біка̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхата̄ш хоія харі\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тава на̄ма уча корі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бодо духкхе да̄кі ба̄ро ба̄ро\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдīна даямой каруна̄-ніда̄н\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбга̄ва-бінду деі ра̄кхохо пара̄н\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкобе туя на̄ма-уча̄ране мор\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнаяне джгарабо даро даро лор\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґада-ґада-свара кантхе упаджабо\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмукхе боло а̄дга а̄дга ба̄хіра̄бо\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпулаке бгарабо шорīра ха̄ма̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсведа-кампа-стамбга хобе ба̄ро ба̄ро\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбібарна-шорīре ха̄ра̄обу ґʼяна\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄ма-сама̄шрає дгаробу пара̄на\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e ass=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eка̄ндіте ка̄ндіте мора а̄нкхі-борішоя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбарша̄-дга̄ра̄ хено чакше хоіло удоя\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнімеша хоіло мора шята-джуґа-сам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґовінда-віраха а̄ра сохіте акшам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшюнья дгара̄-тала,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чаудіке декхіє,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пара̄на уда̄са хоя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкі корі, кі корі,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;стхіра на̄хі хоя,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джīвана на̄хіко роя\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвраджа-ва̄сі-ґана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мора пра̄на ра̄кхо\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;декха̄о шрī-ра̄дга̄-на̄тхе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгакатівінода-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мінаті ма̄нія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лаохе та̄ха̄ре са̄тхе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstron ection class=\"song\" id=\"song-sakhi-go-kemote-dhoribo-paran\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Шікша̄штакам \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eSong 7c\u003c/h3\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсакхі ґо кемоте дгорібо пара̄н\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнімеша хоіло джуґера сама̄н\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшра̄ванера дга̄ра̄,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄нкхі-барішой,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шюнья бгело дгара̄-тала\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґовінда-вірахе,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пра̄на на̄хі рохе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кемоне ба̄нчібо боло\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгакатівінода,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;астхіра хоія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пунах на̄ма̄шроя корі’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eда̄ке ра̄дга̄на̄тха,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дія дарашяна,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пра̄на ра̄кхо, нахе морі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-bondhu-gon-shiunoho-vachana-mora\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрī Шікша̄штакам \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eSong 8a\u003c/h3\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄шлішʼя ва̄ па̄да-рата̄м пінашту ма̄м\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eадаршяна̄н марма-хата̄м кароту ва̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eятха̄ татха̄ ва̄ відадга̄ту лампато\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмат-пра̄на-на̄тхас ту са ева на̄парах\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбондгу-ґон!\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шюнохо вачана мора\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбга̄вете бібгора, тха̄кіє джокхон,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;декха̄ дея чітта-чора\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбічакшана корі’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;декхіте ча̄хіле,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;хоя а̄нкхі-аґочара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпунах на̄хі декхі’,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ка̄ндає пара̄на,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;духкхера на̄ тха̄ке ора\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджаґатера бандгу сеі кобгу море лоя са̄тха\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eятха̄ татха̄ ра̄кху море а̄ма̄ра се пра̄нана̄тха\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдаршян-а̄нанда-да̄не,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сукха дей мора пра̄не,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;боле море праноя-вачан\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпунах адаршян дія,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;даґдга коре мора хія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пра̄не море ма̄ре пра̄на-дган\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджа̄хе та̄’ра сукха хой, сеі сукха мама\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніджа сукхе-духкхе мора сарвада̄і сама\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгакатівінода,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;самджоґе біджоґе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄хе джа̄не пра̄нешвара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eта̄’ра сукхе сукхī,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сеі пра̄на-на̄тха,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;се кобгу на̄ хоя паро\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-yoga-pithopari-sthita-ashta-sakhi-subeshtita\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Шікша̄штакам \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eSong 8b\u003c/h3\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eйоґа-пīтхопарі-стхіта,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ашта-сакхī-субештіта,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вринда̄раньє кадамба-ка̄нане\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄дга̄-саха вамші-дга̄рī, бішва-джана-чітта-ха̄рī,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пра̄на мора та̄нга̄ра чаране\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсакхī-а̄ґʼямата корі донга̄ра севана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпа̄лья-да̄сī сада̄ бга̄ві донга̄ра чарана\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкобгу крипа̄ корі,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мама хаста дгорі’,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мадгура вачана боле\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eта̄мбула лоія,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кха̄я дуі джоне,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ма̄ла̄ лоя кутӯхоле\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eадаршяна хоя кокхона кі чхоле\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄ декхія донге хія мора джволе\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджекха̄не секха̄не,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тха̄кука ду’ джане,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄мі то чарана-да̄сī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмілане а̄нанда,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вірахе джа̄тана̄,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сакала самма̄на ва̄сі\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eра̄дга̄-кришна пра̄на мор джīване маране\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eморе ра̄кхі’ ма̄рі’ сукхе тха̄кука ду’ джоне\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгакатівінода,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄на на̄хі джа̄не,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;поді’ ніджа-сакхī-па̄й\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄дгіка̄ра ґоне\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тха̄кія сатата,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джуґала-чарана ча̄й\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eПісні Шрīматī Ра̄дга̄ра̄нī\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-radhika-charana-padma-sakala-shreyera\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Ра̄дга̄штака \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eSong 1\u003c/h3\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eра̄дгіка̄-чарана-падма,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сакала шреєра садма,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джатане дже на̄хі а̄ра̄дгіло\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄дга̄-пада̄нкіта дга̄ма,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вринда̄вана джа̄р на̄ма,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄ха̄ дже на̄ а̄шроя коріло\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eра̄дгіка̄-бга̄ва-ґамбгīра,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чітта джеба̄ маха̄дгīра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґон-сонґа на̄ коіло джīване\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкемоне се шьяма̄нанда,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;раса-сіндгу-сна̄на̄нанда,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лобгібе буджгохо ек-мане\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eра̄дгіка̄ уджджвала-расера а̄ча̄рʼя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄дга̄-ма̄дгава-шюддга-према віча̄рʼя\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдже дгоріло ра̄дга̄-пада парама джатане\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсе па̄іло кришна-пада амӯлья-ратане\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eра̄дга̄-пада віна̄ кобгу кришна на̄хі міле\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄дга̄ра да̄сīр кришна сарва-веде боле\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eчодата дгона-джон,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;калатра-сута-міта,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чодата карама ґеян\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄дга̄-пада-панкаджа,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мадгурата севана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгакатівінода парама̄н\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-virajar-pare-shiuddha-paravyoma-dham\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Ра̄дга̄штака \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eSong 2\u003c/h3\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвіраджа̄р па̄ре шюддга-паравйома-дга̄м\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтад упарі шрī-ґокула-вринда̄ранья на̄м\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвринда̄вана чінта̄мані,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чід-а̄нанда-ратна-кхані,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чінмой апӯрва-дарашян\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтангі ма̄джге чаматка̄р,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кришна ванаспаті са̄р,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нīла-мані тама̄ла джемон\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eта̄хе ека сварна-маї,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лата̄ сарва-дга̄ма-джаї,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;утхіяче парама-па̄ванī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхла̄дінī-шяктір са̄р,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘маха̄бга̄ва’ на̄м джа̄р,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;трібгувана-мохана-мохінī\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eра̄дга̄-на̄ме парічіта,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тушия ґовінда-чіта,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;віра̄джає парама а̄нанде\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсеі лата̄-патра-пхул,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лаліта̄ді сакхī-кул,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;собе мілі’ врикше дридга ба̄ндге\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eлата̄ра парашє прапхулла тама̄л\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eлата̄ чха̄ді’ на̄хі рохе коно ка̄л\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтама̄ла чадія лата̄ на̄хі ба̄нче\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсе лата̄ мілан сада̄-ка̄ла джа̄че\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгакатівінода мілана донга̄р\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄ ча̄хе кокхона віна̄ кічху а̄р\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-radha-bhajane-jodi-moti-nahi-bhela\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Ра̄дга̄штака \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eSong 8\u003c/h3\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eра̄дга̄-бгаджане джоді моті на̄хі бгела̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкришна-бгаджана тава ака̄ране ґела̄\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄тапа-рохіта сӯрай на̄хі джа̄ні\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄дга̄-бірахіта ма̄дгав на̄хі ма̄ні\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкевала ма̄дгав пӯджає со аґʼянī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄дга̄ ана̄дара карай абгіма̄нī\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкобохі на̄хі карабі та̄нкор санґа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчітте іча̄сі джаді враджа-раса-ранґа\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eра̄дгіка̄-да̄сī джоді хой абгіма̄н\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшіграй мілай тава ґокула ка̄н\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбрахма̄, шіва, на̄рада, шруті, на̄ра̄янī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄дгіка̄-пада-раджа пӯджає ма̄ні\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eума̄, рама̄, сатья, шячī, чандра̄, рукмінī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄дга̄-авата̄р собе, —а̄мна̄я-ва̄нī\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eхено ра̄дга̄-парічарджʼя джа̄нкара дгана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгакатівінода та̄нра ма̄ґає чарана\u003c/strong\u003e div class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(джая) ґопī-джана-баллабга вамші-біха̄рī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмуралīдгара ґовардгана-дга̄рī\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-jaya-radha-krishna-jugala-milan\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Джуґала-а̄раті \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая джая ра̄дга̄-кришна джуґала-мілан\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄раті карає лаліта̄ді сакхī-ґон\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмадана-мохана рӯпа трі-бганґа-сундара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпīта̄мбара шікхі-пуччха-чӯда̄-манохара\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eлаліта-ма̄дгава-ба̄ме вришабга̄ну-канья\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнīла-басана̄ ґаурī рӯпе ґуне дганья\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eна̄на̄-бідга аланка̄ра коре джгаламала\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхарі-мано-бімохана вадана уджджвала\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвішякха̄ді сакхī-ґон на̄на̄ ра̄ґе ґа̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрія-нарма-сакхī джата ча̄ма̄ра дгула̄я\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-ра̄дга̄-ма̄дгава-пада-сарасіджа-а̄шє\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгакатівінода сакхī-паде сукхе бга̄се\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-radha-krishna-prana-mora-jugala-kishora\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eСакхі-вринде Віґʼяптіх \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003ePrayer to the Gopīs\u003c/h3\u003e\n\u003ch4\u003eШрīла Нароттам Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eра̄дга̄-кришна пра̄на мора джуґала-кішора\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджīване маране ґаті а̄ро на̄хі мора\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eка̄ліндīра кӯле келі-кадамбера бон\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eратана-бедіра упара боса̄бо ду’джон\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшьяма-ґаурī-анґе дібо чанданера ґандга\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eча̄мара дгула̄бо кобе хері мукха-ч
