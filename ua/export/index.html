 уста, вони у великому блаженстві відпочивають разом з Господом Баларамою.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджа̄мбула раса̄ла а̄не та̄мбӯла-машяла̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eта̄ха̄ кхеє кришна-чандра сукхе нідра̄ ґела̄\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eДвоє пастушків Джамбула й Расала приносять Крішні \u003ci\u003eпан\u003c/i\u003e, приготований з горіхів \u003ci\u003eбетелю\u003c/i\u003e, вишуканих прянощів і катеху. Зʼївши той \u003ci\u003eпан\u003c/i\u003e, Шрі Крішначандра щасливо засинає.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"14\"\u003e\n\u003ch5\u003e14\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвішяла̄кша шікхі-пуччха-ча̄мара дгула̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eапӯрва шяяя кришна сукхе нідра̄ джа̄я\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПоки Крішна щасливо відпочиває на прекрасному ложі, Його слуга Вішялакша охолоджує Його віялом з павичевих пірʼїн.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"15\"\u003e\n\u003ch5\u003e15\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджашоматī-а̄ґʼя пеє дганіштха̄-а̄ніто\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-кришна-праса̄да ра̄дга̄ бгуньдже хоє прīто\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eНа прохання матері Яшоди \u003ci\u003eґопі\u003c/i\u003e Дганіштха приносить Шріматі Радгарані рештки їжі, що лишилися на тарілці Крішни, і та з великим задоволенням їсть їх.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"16\"\u003e\n\u003ch5\u003e16\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eлаліта̄ді сакхī-ґана авашєша па̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмане мане сукхе ра̄дга̄-кришна-ґуна ґа̄я\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЛаліта Деві й інші \u003ci\u003eґопі\u003c/i\u003e отримують рештки і з великою радістю оспівують Радгарані й Крішну в своїх серцях.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"17\"\u003e\n\u003ch5\u003e17\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eхарі-лīла̄ ек-ма̄тра джа̄ха̄ра прамода\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгоґа̄раті ґа̄й тха̄кур бгакатівінода\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТхакур Бгактівінод, чиєю єдиною радістю є розваги Господа Харі, співає цю пісню Бхоґ Араті.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгаджа ґовінда ґовінда ґопа̄ла\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґірідга̄рī ґопīна̄тха нанда дулала\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгаджа ґовінда ґовінда ґопа̄ла\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнанда дулала джая джая шячī дулала\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшячī дулала джая джая ґаура ґопа̄ла\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-mahaprasade-govinde-nama-brahmani\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eМаха̄праса̄да \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмаха̄праса̄де ґовінде на̄ма брахмані вайшнаве\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсвалпа пӯнья вата̄м ра̄джан вішва̄со найва джа̄яте\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТой, хто не здобув достатнього запасу благочестивих вчинків, не може по-справжньому вшанувати Махапрасад, Господа Ґовінду, Святе Імʼя, \u003ci\u003eбрахманів\u003c/i\u003e та \u003ci\u003eвайшнавів\u003c/i\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-bhai-re-shorira-avidya-jal-jodendriya-tahe-kal\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Праса̄да-сева̄я Ґīті \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбга̄і-ре!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшорīра авідья-джа̄л,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джодендрія та̄хе ка̄л,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джīве пхеле вішая-са̄ґоре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eта̄’ра мадгʼє джіхва̄ аті,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лобгамой судурматі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;та̄’ке джета̄ котхіна самса̄ре\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкришна бодо даямой,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;коріба̄ре джіхва̄ джай,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сва-праса̄д-анна діло бга̄і\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсеі анна̄мрита па̄о,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄дга̄-кришна-ґуна ґа̄о,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;преме да̄ко чайтанья-ніта̄і\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(преме бгоре да̄каре)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(даял ніта̄і чайтанья боле, преме бгоре да̄каре)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(ніта̄і ґаура харібол)\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eВечірнє А̄раті\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-jaya-jaya-gaurachander-arotiko-shobha\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Ґаура-а̄раті \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e(кіба)\u003cstrong\u003e джая джая ґаура̄ча̄ндер а̄ротіко шобга̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джа̄хнавī-тата-ване джаґамана-лобга̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(джаґа джанер мана-лобга̄)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(ґаура̄нґер а̄роті шобга̄ джаґа джанер мана-лобга̄)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(ніта̄і ґаура харібол)\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава, слава прекрасному \u003ci\u003eараті\u003c/i\u003e Шрі Ґаурачандри, яке відбувається у гаю на березі Ґанґи, адже воно вабить серця душ усього світу!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e(кіба)\u003cstrong\u003e дакшине ніта̄іча̄нд ба̄ме ґада̄дгара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нікате адвайта шрīніва̄са чхатра-дгара\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПраворуч від Господа Ґаурачандри — Нітьянанда, ліворуч — Ґададгар, подалі — Адвайта, а Шрівас тримає парасольку.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e(кіба)\u003cstrong\u003e босіячхе ґаура̄ча̄нд ратна-сімга̄сане\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(ратна-сімга̄сана ало корере\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;босіячхен ґаура̄ча̄нд ратна-сімга̄сане)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄раті корена брахма̄ а̄ді-дева ґане\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(ґаура̄нґер а̄роті коре)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(брахма̄ а̄ді-дева ґане ґаура̄нґер а̄роті коре)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(ніта̄і ґаура харібол)\u003c/p\u003e\n\u003cp class=\"translation\"\u003eГосподь Ґаурачандра сидить на троні, всіяному коштовним камінням. Брахма разом зі своїми відданими та рештою напівбогів, шанує Його.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e(кіба)\u003cstrong\u003e нарахарі-а̄ді корі ча̄мара дгула̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;саньджая-мукунда-ва̄су-гоша-а̄ді ґа̄я\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eНарахарі так само, як і інші, овіює Господа \u003ci\u003eчамарою\u003c/i\u003e, а решта разом із Санджаєм, Мукундою, Васудевом Гошем співають.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e(кіба)\u003cstrong\u003e шянкха ба̄дже ганта̄ ба̄дже ба̄дже карата̄ла\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мадгура мриданґа ба̄дже парама раса̄ла\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(мадгур мадгур мадгур ба̄дже)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(ґаура̄нґер а̄роті ка̄ле мадгур мадгур мадгур ба̄дже)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(шянкха ба̄дже ганта̄ ба̄дже мадгур мадгур мадгур ба̄дже)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(мадгура мриданґа ба̄дже мадгур мадгур мадгур ба̄дже)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(ніта̄і ґаура харібол)\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСпів мушель, дзвоників, \u003ci\u003eкаратал\u003c/i\u003e та \u003ci\u003eмриданґ\u003c/i\u003e зливається у пʼянкий передзвін. То дивовижно солодкий \u003ci\u003eкіртан\u003c/i\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e(кіба)\u003cstrong\u003e баху-коті чандра джіні вадана уджджвала\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ґала-дешє бона-ма̄ла̄ коре джгаламала\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(джгалмол джгалмол джгалмол коре)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(ґаура ґоле бона пхулер ма̄ла̄ джгалмол джгалмол джгалмол коре)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(ніта̄і ґаура харібол)\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЛице Господа променіє мільйоном ясних місяців. А плетеничка з лісових квітів сяє на Його шиї.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e(кіба)\u003cstrong\u003e шіва-шюка-на̄рада преме ґада-ґада\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бгакатівінода декхе ґора̄ра сампада\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eШіва, Шюкадев та Нарада затинаються у нестямі від божественної любові. Такою Бгактівінодові постає слава Шрі Ґаурачанди.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(еі ба̄р а̄ма̄й дая кара)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(тха̄кура шрī бгактівінода еі ба̄р а̄ма̄й дая кара)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(тха̄кура шрī сарасватī еі ба̄р а̄ма̄й дая кара)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(патіт-па̄ван шрī ґурудев еі ба̄р а̄ма̄й дая кара)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(сапа̄ршада ґаурахарі еі ба̄р а̄ма̄й дая кара)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(ніта̄і ґаура харібол)\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЦього разу, будь ласка, будь прихильним до мене, о Шріла Бгактівінод Тхакур, о Шріла Сарасваті Тхакур, о Ґурудев — рятівник негідних! О Ґаурахарі, я звертаюсь до Тебе та до усіх Твоїх наближених, будь ласка, обдаруйте мене своєю милістю.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jayare-jayare-jaya-gaura-sarasvati\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Са̄расват-а̄раті \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгакті Ракшак Шрīдгар Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджаяре джаяре джая ґаура-сарасватī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгакатівінода нвая каруна̄ мураті\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eУся слава! Уся слава! Уся слава Шрілі Бгактісіддганті Сарасваті Тхакуру! Він є голосом Шрі Ґауранги та втіленням милості Шріли Бгактівінода Тхакура.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпрака̄шіле ґаура-сева̄ бгӯвана манґала\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгакатісіддга̄нта шюддга праґʼяна удджвала\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВін явив нам віддане служіння Господу Ґауранзі, яке приносить благо всьому світу. Він навчає чистій, піднесеній та світлій науці відданості.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eра̄дга̄-шьяма екатану дакше ґора̄ ра̄я\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eба̄ме ра̄дга мадгʼє сваям шьяма-ґопа джая\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВся слава Радгарані та Шьяму (Крішні), обʼєднаним в одному образі Шрі Ґауранґи, який знаходиться праворуч. Слава Шріматі Радгарані, що стоїть ліворуч! Слава Тому, хто стоїть посередині - Верховному Пастушку - Шрі Шьямасундару!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвраджа раса нава бга̄ве набадвīпе ра̄дже\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eуда̄ре мадгура ра̄ґа абгінава са̄дже\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСолодкі любовні почуття та ніжність Враджі (Вріндавану) поєднуються з великодушністю Набадвіпи та являють новий настрій виняткової краси.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eма̄дгурʼя кайвалья ра̄ґа враджера нірджа̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпра̄пті пара̄ка̄штха̄ та̄хе ґаура̄нґа віла̄са\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e\u003ci\u003eМадгура-раса\u003c/i\u003e (подружня любов) - це сутність Враджа-\u003ci\u003eдгами\u003c/i\u003e, а ігри Махапрабгу доводять її до найвищої довершеності.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eра̄дга̄ бга̄ва-ка̄нті анґікарі’ бга̄ло мате\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдакшине а̄сана раса ґаріма̄ декха̄те\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЩиро приймаючи серце та сяйво Шрі Радги, Шрі Ґауранґа займає Своє місце праворуч, щоб явити славу Своєї \u003ci\u003eраси\u003c/i\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eра̄дга̄-раса-тройо-сва̄да рахасья прояса\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eніракхі прапхулла ра̄дга̄ мукхе манда ха̄са\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСпоглядаючи як Крішна нишком намагається поласувати її потрійну \u003ci\u003eрасу\u003c/i\u003e, Радгарані сповнюється щастя та ніжно посміхається.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмадгʼє рахі вамшіраве гоше вамшідгара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄дга̄ра сампаде а̄мī ґаура̄нґа-сундара\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПосередині стоїть Вамшідгара і проголошує піснею Своєї флейти: \"Багатство Радгарані робить Мене Ґауранґа Сундаром\".\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмадабгīштха рӯпа ра̄дга̄ра хридоя мандіре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґаура̄нґа бгаджіле суштху спхӯрті па̄я та̄ре\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e\"Якщо ти служитимеш Шрі Ґауранзі, то Мій найбільш плеканий образ, що живе в храмі серця Радги, буде явлений тобі в повній мірі.\"\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнадīя прака̄шє маха̄прабгу ґаура-нідгі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпатіта па̄вана деве міла̄іла відгі\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПо Господньому провидінню, Верховний Спаситель грішних душ явився в Надії, як наймиліший серцю Шрі Ґауранґа Махапрабгу.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eе-рӯпа а̄раті брахма̄ шямбгу аґочара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґаура бгакта крипа̄ па̄тра ма̄тра сіддгі са̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЦе \u003ci\u003eараті\u003c/i\u003e невідоме для Господа Брахми та Господа Шіви. Але воно може відкритись тому, на кого проллється милість слуг Ґауранги.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī сварӯпа, ра̄ма̄нанда, рӯпа, сана̄тана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī рагу, джīва̄ді крипа̄я декхе бгакта-джана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВіддані споглядають це \u003ci\u003eараті\u003c/i\u003e по милості Шрі Сварупи Дамодара, Шрі Рамананди Рая, Шрі Рупи, Шрі Санатани, Шрі Рагунатхи, Шрі Джіви Ґосвамі та їх сподвижників.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджая ґуру-ґаура-ра̄дга̄-ґовінда-сундара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджая да̄о бгакта вринда нітья нірантара\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВся слава Шрі Ґуру, Ґауранзі, Радга-Ґовіндасундару! О віддані, завжди оспівуйте Їхню вічну славу!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-kobe-shri-chaitanya-more-koribena-daya\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eДайнья Пра̄ртхана̄ Ґīті \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкобе шрī чайтанья море-корібена дая\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкобе а̄мі па̄ібо вайшнава-пада-чха̄я\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкобе а̄мі чха̄дібо е вішоябгіма̄н\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкобе вішну-джане а̄мі корібо самма̄н\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґалавастра крита̄ньджалі вайшнава-нікате\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eданте трина корі да̄нда̄ібо нішкапате\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eка̄ндія ка̄ндія джа̄на̄ібо духкхаґра̄м\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсамса̄ра-анала хоіте ма̄ґібо вішра̄м\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшюнія а̄ма̄ра духкха вайшнава тха̄кура\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄ма̄’ ла̄ґі’ кришне а̄ведібена прачура\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвайшнавера а̄ведане кришна даямой\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eе хено па̄мара праті хобен садой\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвінодера ніведан вайшнава-чаране\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкрипа̄ корі санґе лохо еі акіньчане\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-namo-namah-tulasi-maharani\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрī Туласī-парікрама̄-ґīті \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Чандрашєкхара Каві\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнамо намах туласī маха̄ра̄нī,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвринде маха̄ра̄нī намо намах\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Туласі Махарані, О Вринда Деві, я вклоняюся тобі знову і знову.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнамо ре намо ре ма̄ія намо на̄ра̄яні\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Нараяні, я вклоняюся тобі знову і знову.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджа̄ко дарашє, парашє ага-на̄шя-хоі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмахіма̄ веда-пура̄не ба̄кха̄ні\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЛише від споглядання чи дотику до Тебе зникають усі гріхи. Веди та Пурани прославляють Тебе.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджа̄ко патра, маньджарī комала\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-паті-чарана-камале лапата̄ні\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдганья туласі, пӯрана тапа кіє,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī-шялаґра̄ма-маха̄-па̄тара̄нī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТвоє листя та мʼякі \u003ci\u003eманьджарі\u003c/i\u003e обвивають лотосові стопи Господа Нараяни. О Туласі, завдяки твоїм довершеним аскезам, ти стала шанованою супутницею Шрі Шялаґрама Шили.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдгӯпа, дīпа, найведья, а̄роті,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпхулана̄ кіє варакха̄ варакха̄ні\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчха̄ппа̄нна бгоґа, чхатрішя вʼяньджана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвіна̄ туласī прабгу ека на̄хі ма̄ні\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТи даруєш Свою милість кожному, хто пропонує Тобі пахощі, лампадки, їжу, поклоніння і квіти. Господь не приймає жодного з пʼятдесяти шести підношень зернових чи тридцяти шести підношень овочів, якщо їх пропонують без листя Туласі.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшіва-шюка-на̄рада, а̄ур брахма̄діко,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдгудата пхірата маха̄-муні ґʼянī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчандрашєкхара ма̄ія, тера̄ джашя ґа̄оє\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгакаті-да̄на дīджіє маха̄ра̄ні\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eГосподь Шива, Шюкадева Ґосвамі, Нарада Муні, усі напівбоги на чолі з Господом Брахмою, містики й великі \u003ci\u003eмуні\u003c/i\u003e - усі з повагою обходять тебе по колу. О Туласі Махарані, Чандрашєкхара оспівує твою славу. Будь ласка, подаруй йому скарб відданості.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-guru-charana-padma-kevala-bhakati\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Ґуру-вайшнава Ма̄ха̄тмʼя-ґīті \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Нароттам Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī ґуру чарана-падма, кевала-бгакаті-садма,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бандо муі са̄вадга̄на мате\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджа̄нга̄ра праса̄де бга̄і, е бгава торія джа̄і,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кришна-пра̄пті хоя джа̄нга̄ хоіте\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eшрī ґуру чарана-падма\u003c/i\u003e — лотосові стопи духовного вчителя; \u003ci class=\"wbw__term\"\u003eкевала\u003c/i\u003e — лише; \u003ci class=\"wbw__term\"\u003eбгакаті\u003c/i\u003e — чисте віддане служіння; \u003ci class=\"wbw__term\"\u003eсадма\u003c/i\u003e — оселя або джерело; \u003ci class=\"wbw__term\"\u003eбандо муі\u003c/i\u003e — я складаю поклін; \u003ci class=\"wbw__term\"\u003eса̄вадга̄на мате\u003c/i\u003e — з великою уважністю та пошаною; \u003ci class=\"wbw__term\"\u003eджа̄нга̄ра праса̄де\u003c/i\u003e — завдяки його милості; \u003ci class=\"wbw__term\"\u003eбга̄і\u003c/i\u003e — о, дорогі брати!; \u003ci class=\"wbw__term\"\u003eе бгава\u003c/i\u003e — це матеріальне існування; \u003ci class=\"wbw__term\"\u003eторія джа̄і\u003c/i\u003e — можна перейти через нього; \u003ci class=\"wbw__term\"\u003eкришна-пра̄пті\u003c/i\u003e — досягнення Кришни; \u003ci class=\"wbw__term\"\u003eхоя\u003c/i\u003e — стає можливим; \u003ci class=\"wbw__term\"\u003eджа̄нга̄ хоіте\u003c/i\u003e — завдяки йому.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСтопи-лотоси Духовного Вчителя - обитель чистого відданого служіння. Я схиляюсь до цих стоп-лотосів з особливою турботою та дуже уважно. Мій любий брате (мій любий ум)! Тільки милосердя Духовного Вчителя може вивести нас з цього світу та віддати милості Шрі Крішни.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґуру-мукха-падма-ва̄кʼя, чіттете корія айкʼя,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ро на̄ коріха мане а̄шя\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрī ґуру-чаране раті,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сеі се уттама-ґаті,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дже праса̄де пӯре сарва а̄шя\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eґуру-мукха-падма-ва̄кʼя\u003c/i\u003e — лотосові уста духовного вчителя, його слова; \u003ci class=\"wbw__term\"\u003eчіттете\u003c/i\u003e — у своєму серці; \u003ci class=\"wbw__term\"\u003eкорія айкʼя\u003c/i\u003e — зроби єдиними (з’єднайся з ними); \u003ci class=\"wbw__term\"\u003eа̄ро\u003c/i\u003e — будь-що інше; \u003ci class=\"wbw__term\"\u003eна̄\u003c/i\u003e — не; \u003ci class=\"wbw__term\"\u003eкоріха мане а̄шя\u003c/i\u003e — май у думках бажань; \u003ci class=\"wbw__term\"\u003eшрī ґуру-чаране раті\u003c/i\u003e — прихильність до лотосових стіп духовного вчителя; \u003ci class=\"wbw__term\"\u003eсеі се уттама-ґаті\u003c/i\u003e — це є найвища мета життя; \u003ci class=\"wbw__term\"\u003eдже праса̄де\u003c/i\u003e — завдяки його милості; \u003ci class=\"wbw__term\"\u003eпӯре сарва а̄шя\u003c/i\u003e — сповнюються всі прагнення.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПрийми усім серцем вчення з уст-лотосів Духовного Вчителя і не бажай нічого більшого. Привʼязаність до стоп-лотосів Духовного Вчителя - найкраще із духовних старань. Його милість виконує усі духовні бажання.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eчакшу-да̄на діла̄ джеі, джанме джанме прабгу сеі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дівʼя-ґʼяна хриде прока̄шіто\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрема-бгакті джа̄ха̄ хоіте,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;авідья віна̄шя джа̄те,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;веде ґа̄я джа̄нга̄ра чаріто\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eчакшу-да̄на\u003c/i\u003e — дар духовного зору; \u003ci class=\"wbw__term\"\u003eділа̄ джеі\u003c/i\u003e — той, хто його дав; \u003ci class=\"wbw__term\"\u003eджанме джанме\u003c/i\u003e — з народження в народження; \u003ci class=\"wbw__term\"\u003eпрабгу сеі\u003c/i\u003e — він є моїм Господом; \u003ci class=\"wbw__term\"\u003eдівʼя-ґʼяна\u003c/i\u003e — божественне знання; \u003ci class=\"wbw__term\"\u003eхриде прока̄шіто\u003c/i\u003e — що розкривається в серці; \u003ci class=\"wbw__term\"\u003eпрема-бгакті\u003c/i\u003e — любовне віддане служіння; \u003ci class=\"wbw__term\"\u003eджа̄ха̄ хоіте\u003c/i\u003e — завдяки якому; \u003ci class=\"wbw__term\"\u003eавідья віна̄шя джа̄те\u003c/i\u003e — неуцтво знищується; \u003ci class=\"wbw__term\"\u003eведе ґа̄я\u003c/i\u003e — у ведичних писаннях оспівується; \u003ci class=\"wbw__term\"\u003eджа̄нга̄ра чаріто\u003c/i\u003e — його діяння.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВін дав мені духовний зір, він - мій велитель життя за життям. Його милістю духовне одкровення приходить в серце, дарує любовну відданість та долає невігластво. Ведичні писання оспівують його якості.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī-ґуру каруна̄-сіндгу, адгама джана̄ра бандгу,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;локана̄тха локера джīвана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eха̄ ха̄ прабгу кара дая, дехо море пада-чха̄я,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ебе джашя гушук трібгувана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(е адгама лоіло шярана)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(туя паде лоіну шярана)\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eшрī-ґуру\u003c/i\u003e — о, духовний учителю!; \u003ci class=\"wbw__term\"\u003eкаруна̄-сіндгу\u003c/i\u003e — о, океане милосердя!; \u003ci class=\"wbw__term\"\u003eадгама-джана̄ра-бандгу\u003c/i\u003e — друже занепалих душ; \u003ci class=\"wbw__term\"\u003eлокана̄тха\u003c/i\u003e — о, Локана̄тха Госвамі (або володарю світів)!; \u003ci class=\"wbw__term\"\u003eлокера джīвана\u003c/i\u003e — життя всіх істот; \u003ci class=\"wbw__term\"\u003eха̄ ха̄ прабгу\u003c/i\u003e — о, мій Господи, змилуйся!; \u003ci class=\"wbw__term\"\u003eкара дая\u003c/i\u003e — будь милостивим; \u003ci class=\"wbw__term\"\u003eдехо море пада-чха̄я\u003c/i\u003e — даруй мені тінь твоїх лотосових стіп; \u003ci class=\"wbw__term\"\u003eебе джашя гушук трібгувана\u003c/i\u003e — нехай тепер слава твоя лунає по трьох світах; \u003ci class=\"wbw__term\"\u003eе адгама лоіло шярана\u003c/i\u003e — цей занепалий прийняв прихисток; \u003ci class=\"wbw__term\"\u003eтуя паде лоіну шярана\u003c/i\u003e — я прибіг до твоїх стіп як до свого прихистку.\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Духовний Вчитель, ти - океан милості та друг грішників, ти - вчитель кожного і наше життя. О володарю! Будь милостивим до мене і дай мені прихисток в тіні твоїх стоп-лотосів. Нехай же твоя слава лунає на всі три світи.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e(а̄мі)\u003cstrong\u003e \u003c/strong\u003e(шяранілам)\u003cbr\u003e\n(абгая шрī пада падме шяранілам)\u003cbr\u003e\n(а̄май)\u003cstrong\u003e \u003c/strong\u003e(дая кара хе)\u003cbr\u003e\n(патіт-па̄ван шрī ґурудев дая кара хе)\u003cbr\u003e\n(адгама патіта джене дая кара хе)\u003cbr\u003e\n(джай ґурудев)\u003c/p\u003e\n\u003cp class=\"wbw\"\u003e\u003ci class=\"wbw__term\"\u003eа̄мі\u003c/i\u003e — я; \u003ci class=\"wbw__term\"\u003eшяран-ніла̄м\u003c/i\u003e — приймаю прихисток; \u003ci class=\"wbw__term\"\u003eабгая шрī-пада-падме\u003c/i\u003e — у безпечних лотосових стопах; \u003ci class=\"wbw__term\"\u003eшяран-ніла̄м\u003c/i\u003e — я прийняв прихисток; \u003ci class=\"wbw__term\"\u003eа̄май\u003c/i\u003e — до мене; \u003ci class=\"wbw__term\"\u003eдая кара хе\u003c/i\u003e — будь милостивий, прошу; \u003ci class=\"wbw__term\"\u003eпатіт-па̄ван шрī-ґурудев\u003c/i\u003e — о, святійший Ґурудев, спасителю занепалих; \u003ci class=\"wbw__term\"\u003eдая кара хе\u003c/i\u003e — змилуйся, будь милостивим; \u003ci class=\"wbw__term\"\u003eадгама патіта джене\u003c/i\u003e — до таких низьких і занепалих, як я; \u003ci class=\"wbw__term\"\u003eдая кара хе\u003c/i\u003e — даруй милість; \u003ci class=\"wbw__term\"\u003eджай ґурудев\u003c/i\u003e — вся слава Ґурудеву!\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ здався твоїм безстрашним стопам-лотосам. Будь ласка, пролий свою милість. О Шрі Ґурудев, рятівник грішників, будь ласка, пролий і на мене свою милість. Ти порятунок найбільш грішних душ. Вся слава Шрі Ґурудеву!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-krishna-chaitanya-prabhu-daya-kara-more\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eСа̄варана-Шрī-Ґаура-па̄да-падме Пра̄ртхана̄ \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Нароттам Да̄с Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшрī кришна чайтанья прабгу дая кара море\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтома̄ віна̄ ке даялу джаґата ма̄джга̄ре\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eГосподи Шрі Крішно Чайтаньє Махапрабгу, молю, даруй мені Свою милість. В усьому творінні немає нікого милостивішого за Тебе.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпатіта-па̄вана-хету тава авата̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмо само патіта прабгу на̄ па̄ібе а̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТи зійшов у цей світ лише заради спасіння занепалих душ. О Господи, більш занепалої душі, ніж я, годі й шукати.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eха̄ ха̄ прабгу нітьянанда према̄нанда сукхī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкрипа̄-болокана кара а̄мі бодо духкхī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО мій Господи, о Господи Нітьянандо, Ти завжди сповнений радості Своєї любові, будь ласка, поглянь на мене Своїм милостивим поглядом, бо я дуже нещасний.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдая кара сīта̄-паті адвайта ґоса̄і\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтава крипа̄-боле па̄і чайтанья-ніта̄і\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eМилостиво даруй Свою ласку, Шрі Адвайто Ґосвамі, володарю Шріматі Сіти Тхакурані. Силою Твоєї милості ми отримаємо служіння Шрі Шрі Нітай-Чайтаньї.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eґаура премамоя тану пандіт ґада̄дгара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшрīніва̄са харіда̄са даяра са̄ґара\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПандіте Ґададгаро, втілення любові Шрі Ґаури. Шрівасе Пандіте, Харідасе Тхакуре, ви — живе втілення океану милості.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eха̄ ха̄ сварӯпа сана̄тана рӯпа рагуна̄тха\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгатта-джуґа шрī джīва ха̄ прабгу локана̄тха\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО мої повелителі, Шрі Сварупа Дамодар, Шрі Санатан, Шрі Рупа і Шрі Рагунатх, Шрі Рагунатх Бгатта і Шрі Ґопал Бгатта, о мій володарю, Шрі Локанатх Ґосвамі.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдая кара шрī-а̄ча̄рʼя прабгу шрīніва̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄мачандра-санґа ма̄ґе нароттама да̄са\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eМолю, даруй Свої благословення, мій владико Шрі Шрінівасе Ачарʼє. Нароттам Дас молить про те, щоб бути поряд зі Шрі Рамачандрою Чакраварті.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(дая кара прабгупа̄да шрī ґаура прака̄шя)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(тава джана крипа̄ ма̄ґе еі адгама да̄са)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eБудь ласка, даруй Свою милість, Шріло Прабгупаде Сарасваті Тхакуре, проявлення Шрі Ґаури. Цей занепалий слуга благає про милість Твоїх близьких супутників.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vaishnava-thakura-dayara-sagara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Вайшнава-махіма̄-ґīті \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгактівінод Тха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(охе) вайшнава тха̄кура, даяра са̄ґара,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;е да̄се каруна̄ корі\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдія пада-чха̄я, шодго хе а̄ма̄ре,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тома̄ра чарана дгорі\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО мій повелителю, о \u003ci\u003eвайшнаве\u003c/i\u003e, океане милості, будь милостивий до цього слуги. Даруй мені прохолоду тіні Твоїх святих стоп-лотосів і омий мене від усього нечистого. Я знову й знову міцно тримаюся Твоїх святих лотосових стоп.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eчоя беґа домі’,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чоя доша шодгі’,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чоя ґуна дехо’ да̄се\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчоя сат-санґа,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дехо’ хе а̄ма̄ре,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;босечхі санґера а̄шє\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПриборкай у мені шість спонукань, виправ шість вад і наділи цього слугу шістьма благими чеснотами. Прошу, даруй мені шість видів благого спілкування з відданими. Я сиджу біля Твоїх стоп, з глибоким прагненням до такого спілкування.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eека̄кī а̄ма̄ра,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄хі па̄я бала,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;харі-на̄ма-санкīртане\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтумі крипа̄ корі,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;шраддга̄-бінду дія,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дехо’ кришна-на̄ма-дгане\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eУ мене самого немає сили співати Святе Імʼя разом з іншими. Будь ласка, зглянься і пролий в моє серце хоча б краплю віри, даруючи мені скарб Імені Господа Крішни.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкришна се тома̄ра,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кришна діте па̄ро,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тома̄ра шякаті а̄чхе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄мі то ка̄нґа̄ла,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘кришна кришна’ болі,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дга̄і тава па̄чхе па̄чхе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eКрішна - твій, ти можеш дати Його, ти маєш силу зробити це. Я ж, позбавлений всього, кличу: «Крішна, Крішна!» — і відчайдушно біжу за Тобою.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(а̄мі) (дга̄і тава па̄чхе па̄чхе)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(кришна дгана па̄бара̄се дга̄і тава па̄чхе па̄чхе)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(тумі ділеоу діте па̄ро)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(кришна тома̄р хридоєр дган тумі ділеоу діте па̄ро)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(кришна дева̄р шякті дгара тумі ділеоу діте па̄ро)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ біжу за тобою у відчаї. Я біжу за тобою з надією отримати скарб Крішни. Якщо ти забажаєш, ти можеш дати Крішну іншим. Крішна - скарб твого серця. Ти маєш силу дати Крішну. Якщо ти забажаєш, ти можеш дати Крішну іншим.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch3\u003eПримітка до строфи 2\u003c/h3\u003e\n\u003cp class=\"translation\"\u003e\u003ci class=\"translation__term\"\u003eШість спонукань\u003c/i\u003e — це прагнення мови, ума, гніву, язика, шлунка та статевих органів.\u003cbr\u003e\n\u003ci class=\"translation__term\"\u003eШість вад:\u003c/i\u003e\u003cbr /\u003e1) схильність переїдати або накопичення грошей понад необхідного;\u003cbr /\u003e2) зайві зусилля заради матеріальних цілей;\u003cbr /\u003e3) пусті балачки на мирські теми;\u003cbr /\u003e4) надмірна привʼязаність до вказівок святого письма або, навпаки, зневага до них;\u003cbr /\u003e5) близьке спілкування з людьми, зануреними в матеріалістичний настрій;\u003cbr /\u003e6) прагнення мирської слави та досягнень.\u003cbr\u003e\n\u003ci class=\"translation__term\"\u003eШість благих чеснот:\u003c/i\u003e\u003cbr /\u003e1) натхнення в служінні;\u003cbr /\u003e2) терпіння та терпимість;\u003cbr /\u003e3) впевненість;\u003cbr /\u003e4) рішучість виконувати дії, сприятливі відданому служінню;\u003cbr /\u003e5) твердий намір відмовитися від спілкування з невідданими;\u003cbr /\u003e6) внутрішня дисципліна завжди слідувати по стопам попередніх \u003ci\u003eачарʼїв\u003c/i\u003e.\u003cbr\u003e\n\u003ci class=\"translation__term\"\u003eШість видів благого спілкування з відданими:\u003c/i\u003e\u003cbr /\u003e1) давати дари;\u003cbr /\u003e2) з вдячністю приймати дари;\u003cbr /\u003e3) відверто відкривати іншим своє серце;\u003cbr /\u003e4) із довірою запитувати про шлях відданого служіння;\u003cbr /\u003e5) приймати \u003ci\u003eпрасад\u003c/i\u003e;\u003cbr /\u003e6) з любовʼю пропонувати \u003ci\u003eпрасад\u003c/i\u003e іншим.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-sujanarvuda-radhita-pada-yugam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Шрī Прабгупа̄да-падма Ставаках \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eМолитва лотосовим стопам мого повелителя і вчителя Шріли Бгактісіддганти Сарасваті Тхакура Прабгупади\u003c/h3\u003e\n\u003ch4\u003eШрīла Бгакті Ракшак Шрīдгар Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсуджана̄рвуда-ра̄дгіта-па̄да-юґам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eюґа-дгарма-дгурандгара-па̄тра-варам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eварада̄бгая-да̄яка-пӯджʼя-падам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпранама̄мі сада̄ прабгупа̄да-падам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСтопи того, кому я співаю славу, прекрасні, наче лотоси, він утверджує дгарму епохи. Його стопи розвіюють страх і дарують благословення кожному. Вони варті найвищої пошани, їм вклоняється безліч піднесених душ. І я також, раз за разом, схиляюся до сяйва, яке походить від нігтів на святих стопах мого Божественного Вчителя.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбгаджанорджіта саджджана-санга-патім\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпатіта̄дгіка-ка̄рунікайка-ґатім\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґаті-ваньчіта-ваньчака̄чінтья-падам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпранама̄мі сада̄ прабгупа̄да-падам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВін очолює Вішва-Вайшнава-Раджа-Сабгу – громаду святих, сповнених відданості. Він – єдиний та надзвичайно милосердний притулок для занепалих. Незбагненна святість його стоп стає притулком навіть для лицемірів, адже обдурює їх обман. Я припадаю до його лотосових стоп, я знову і знову складаю поклони сяйву, що виходить від нігтів на святих стопах мого Божественного Вчителя.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eатікомала-ка̄ньчана-дīрга-танум\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтану-ніндіта-хема-мрина̄ла-мадам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмадана̄рвуда-вандіта-чандра-падам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпранама̄мі сада̄ прабгупа̄да-падам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПривабливість його стрункої золотавої постаті затьмарює пишну красу ніжних стебел лотосу. Його надзвичайно гарні місяцеподібні стопи шанують мільйони Купідонів. Я навічно припадаю до твоїх стоп, о Прабгупадо, я схиляюся перед сяйвом, яким променіють нігті на святих стопах мого Вчителя.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eніджа-севака-та̄рака-раньджі-відгум\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвідгута̄хіта-хункрита-сімга-варам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eварана̄ґата-ба̄лішя-шянда-падам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпранама̄мі сада̄ прабгупа̄да-падам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЙого, наче місяць зірки, оточують особисті слуги, чиї серця розквітають у духовній радості бути поруч. Рев його грізного голосу розганяє лихі душі, які протистоять відданості. А прості, беззлобні істоти досягають найвищої удачі, приймаючи притулок у його лотосових стопах. Я раз за разом схиляюся перед сяйвом, яким променіють кінчики нігтів на стопах мого господаря Прабгупади.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвіпулīкрита-вайбгава-ґаура-бгувам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбгуванешу вікīртіта-ґаура-даям\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдаянīя-ґана̄рпіта-ґаура-падам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпранама̄мі сада̄ прабгупа̄да-падам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВін являє величну, неосяжну красу Шрі Ґаура-дгами і розповсюджує по всьому всесвіту звістку про найвищу щедрість Шрі Ґауранґи. Він міцно встановлює Шрі Ґауру у серця тих, хто здатен прийняти його милість. Я невпинно схиляюсь в поклонах до сяйва, яким променіють нігті на святих стопах мого Господа.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eчіра-ґаура-джана̄шрая-вішва-ґурум\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eґуру-ґаура-кішорака-да̄сья-парам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпарама̄дрита-бгактівінода-падам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпранама̄мі сада̄ прабгупа̄да-падам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВін — вічний притулок і Всесвітній Ґуру для душ, що віддали себе Шрі Ґауранзі. Цілковито поглинутий служінням своєму Ґурудеву, Шрі Ґаура Кішору, він усім серцем шанує Шрі Бгактівінода Тхакура. Я складаю йому поклони, я без упину складаю поклони сяйву, що ллється з нігтів на святих стопах мого Повелителя.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eрагу-рӯпа-сана̄тана-кīрті-дгарам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдгаранī-тала-кīртіта-джīва-кавім\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкавіра̄джа-нароттама-сакхʼя-падам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпранама̄мі сада̄ прабгупа̄да-падам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЙого видатна особистість підняла прапор, що співає славу Шрі Рупі, Шрі Санатані і Шрі Рагунатху. Весь всесвіт шанує його як блискучого вченого, на зразок незрівнянного Шрі Джіви. Його знають як того, хто перебуває в сердечній єдності зі Шріла Крішнадасом Кавіраджем і Тхакуром Нароттамом. Я безупинно схиляюся перед сяйвом, що ллється з нігтів на святих стопах мого Божественного Вчителя.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкрипая харі-кīртана мӯрті-дгарам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдгаранī-бгара-ха̄рака-ґаура-джанам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджанака̄дгіка-ватсала-сніґдга-падам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпранама̄мі сада̄ прабгупа̄да-падам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВін — втілення Харі-\u003ci\u003eкіртану\u003c/i\u003e, адже він дарує свою милість кожному. Як супутник Шрі Ґаури, він звільняє Мати-Землю від тягаря зневаг, здійснених на ній. Його милостивість і прихильність до всіх істот перевершують любов батька до своїх дітей. Йому, скарбниці усіх цих якостей, я складаю поклони, я знову і знову схиляюся перед сяйвом, що ллється з нігтів на святих стопах мого Божественного Вчителя.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eшярана̄ґата-кінкара-калпа-тарум\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтару-дгік-крита дгīра вада̄нья варам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eварадендра-ґана̄рчіта-дівʼя-падам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпранама̄мі сада̄ прабгупа̄да-падам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eДля слуг, які цілковито віддали себе Йому, він — наче дерево бажань, адже він здійснює найсокровенніші прагнення їхніх сердець. Якостями терплячості та великодушності Йому поступаються навіть дерева. А видатні особистості, які самі здатні дарувати благословення, теж поклоняються Його лотосовим стопам. Я невпинно складаю поклони сяйву, що виходить від нігтів на святих стопах мого Божественного Вчителя.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпарахамса-варам парама̄ртха-патім\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпатітодгаране крита-вешя-ятім\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eяті-ра̄джа-ґанайх парісевʼя-падам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпранама̄мі сада̄ прабгупа̄да-падам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВін — коштовна окраса серед \u003ci\u003eпарамахамс\u003c/i\u003e, володар скарбу найвищої досконалості життя — Шрі Крішна-\u003ci\u003eпреми\u003c/i\u003e. Він прийняв одяг мандрівного відреченого \u003ci\u003eсанньясі\u003c/i\u003e лише для того, щоб визволити занепалі душі. Найпіднесеніші \u003ci\u003eтріданді-санньясі\u003c/i\u003e служать біля його лотосових стоп. Я складаю йому поклони, я безупинно схиляюся перед сяйвом, що ллється з нігтів на святих стопах мого Божественного Вчителя.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвришабга̄ну-сута̄-даїта̄нучарам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчарана̄шріта-рену-дгарас там ахам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмахад-адбгута-па̄вана-шякті-падам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпранама̄мі сада̄ прабгупа̄да-падам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВін — найдорожчий і найближчий послідовник Божественної Доньки Шрі Вришабгану, і я вважаю себе найщасливішим, коли беру на голову порох з його святих стоп. Я складаю поклони його непереможним, дивовижним святим стопам-лотосам, які мають силу очистити будь-кого. Я безупинно схиляюся перед сяйвом, що ллється з нігтів на святих стопах мого Божественного Вчителя.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eШрī Шрī Премадга̄ма-дева-стотрам\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-deva-siddha-mukta-yukta-bhakta-vrinda\" data-translated=\"0\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШрī Шрī Премадга̄ма-дева-стотрам \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШрīла Бгакті Ракшак Шрīдгар Дев-Ґосва̄мī Маха̄ра̄дж\u003c/h4\u003e\n\u003ch4\u003eEdited by Swāmī Bhakti Pāvan Janārdan\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдева-сіддга-мукта-юкта-бгакта-вринда-вандітам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпа̄па-та̄па-да̄ва-да̄ха-даґдга духкха-кхандітам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкришна-на̄ма-сīдгу-дга̄ма-дганья-да̄на-са̄ґарам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрема-дга̄ма-девам ева наумі ґаура-сундарам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсварна-коті-дарпана̄бга-деха-варна-ґауравам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпадма-па̄ріджа̄та-ґандга-вандіта̄нґа-саурабгам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкоті-ка̄ма-мӯрччхіта̄нгрі-рӯпа-ра̄са-ранґарам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрема-дга̄ма-девам ева наумі ґаура-сундарам\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e
