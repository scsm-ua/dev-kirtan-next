 Чайтаньї!\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"джая рӯпа сана̄тана бгатта рагуна̄тха\",\"шрī-джīва-ґопа̄ла-бгатта да̄са рагуна̄тха\"],\"translation\":[\"Вся слава Шрі Рупі Ґосвамі, Санатані Ґосвамі, Рагунатху Бгатта Ґосвамі! Слава Шрі Дживі Ґосвамі, Ґопалу Бгатта Ґосвамі, Рагунатху Дасу Ґосвамі!\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"еі чхой ґоса̄ір корі чарана вандана\",\"джа̄ха̄ хоіте бігна-на̄ш абгīшта пӯрана\"],\"translation\":[\"Стопам цих шести ґосвамі, я пропоную свої поклони. Це усуває всі перешкоди до відданості та сповнює всі духовні чаяння.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"еі чхой ґоса̄ір джа̄нра муі та̄нра да̄са\",\"та̄н-саба̄ра пада-рену мора паньча-ґра̄са\"],\"translation\":[\"Я слуга слуги цих шести ґосвамі. Пил з їх стоп - пʼять видів моєї їжі.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"та̄ндера чарана себі бгакта сане ва̄са\",\"джанаме джанаме мора еі абгіла̄ша\"],\"translation\":[\"Я бажаю життя за життям жити біля тих відданих, що служать стопам цих шести ґосвамі.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"еі чхой ґоса̄і джабе врадже коіла̄ ва̄са\",\"ра̄дга̄-кришна-нітья-лīла̄ коріла̄ прака̄шя\"],\"translation\":[\"Коли ці шість ґосвамі жили у Враджі, вони проявили та пояснили вічні ігри Радги та Крішни.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"а̄нанде боло харі бгаджа вринда̄вана\",\"шрī-ґуру-вайшнава-паде маджа̄ія мана\"],\"translation\":[\"Націливши ум на лотосові стопи Духовного Вчителя та святих Вайшнавів, з радістю співай імена Господа Харі та поклоняйся неосяжній дійсності Вриндавана.\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"шрī-ґуру-вайшнава-па̄да-падма корі а̄шя\",\"(харі) на̄ма-санкīртана кохе нароттама да̄са\"],\"translation\":[\"Уповаючи на лотосові стопи Шрі Ґуру та Вайшнавів, Нароттам Дас співає *санкіртану* Святого Імені.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Го
