(з’єднайся з ними)\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"а̄ро\",\"trans\":\"будь-що інше\",\"sep\":\" \"},{\"text\":\"на̄\",\"trans\":\"не\",\"sep\":\" \"},{\"text\":\"коріха мане а̄шя\",\"trans\":\"май у думках бажань\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"шрī ґуру-чаране раті\",\"trans\":\"прихильність до лотосових стіп духовного вчителя\",\"sep\":\",    \",\"error\":\"multi\"},{\"text\":\"сеі се уттама-ґаті\",\"trans\":\"це є найвища мета життя\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"дже праса̄де\",\"trans\":\"завдяки його милості\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"пӯре сарва а̄шя\",\"trans\":\"сповнюються всі прагнення\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"3\",\"text\":[\"чакшу-да̄на діла̄ джеі, джанме джанме прабгу сеі,\",\"    дівʼя-ґʼяна хриде прока̄шіто\",\"према-бгакті джа̄ха̄ хоіте,    авідья віна̄шя джа̄те,\",\"    веде ґа̄я джа̄нга̄ра чаріто\"],\"word_by_word\":[\"**чакшу-да̄на** — дар духовного зору; **діла̄ джеі** — той, хто його дав; **джанме джанме** — з народження в народження; **прабгу сеі** — він є моїм Господом; **дівʼя-ґʼяна** — божественне знання; **хриде прока̄шіто** — що розкривається в серці; **према-бгакті** — любовне віддане служіння; **джа̄ха̄ хоіте** — завдяки якому; **авідья віна̄шя джа̄те** — неуцтво знищується; **веде ґа̄я** — у ведичних писаннях оспівується; **джа̄нга̄ра чаріто** — його діяння.\"],\"translation\":[\"Він дав мені духовний зір, він - мій велитель життя за життям. Його милістю духовне одкровення приходить в серце, дарує любовну відданість та долає невігластво. Ведичні писання оспівують його якості.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word\":[[{\"text\":\"чакшу-да̄на\",\"trans\":\"дар духовного зору\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"діла̄ джеі\",\"trans\":\"той, хто його дав\",\"sep\":\", \",\"error\":\"multi\"},{\"text\":\"джанме джанме\",\"trans\":\"з народження в народження\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"прабгу сеі\",\"trans\":\"він є моїм Господом\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"дівʼя-ґʼяна\",\"trans\":\"божественне знання\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"хриде прока̄шіто\",\"trans\":\"що розкривається в серці\",\"sep\":\"\",\"error\":\"multi\"}],[{\"text\":\"према-бгакті\",\"trans\":\"любовне віддане служіння\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"джа̄ха̄ хоіте\",\"trans\":\"завдяки якому\",\"sep\":\",    \",\"error\":\"multi\"},{\"text\":\"авідья віна̄шя джа̄те\",\"trans\":\"неуцтво знищується\",\"sep\":\",\",\"error\":\"multi\"}],[{\"text\":\"веде ґа̄я\",\"trans\":\"у ведичних писаннях оспівується\",\"sep\":\" \",\"error\":\"multi\"},{\"text\":\"джа̄нга̄ра чаріто\",\"trans\":\"його діяння\",\"sep\":\"\",\"error\":\"multi\"}]]},{\"number\":\"4\",\"text\":[\"шрī-ґуру каруна̄-сіндгу, адгама джана̄ра бандгу,\",\"    локана̄тха локера джīвана\",\"ха̄ ха̄ прабгу кара дая, дехо море пада-чха̄я,\",\"    ебе джашя гушук трібгувана\",\"    (е адгама лоіло шярана)\",\"    (туя паде лоіну шярана)\"],\"word_by_word\":[\"**шрī-ґуру** — о, духовний учителю!; **каруна̄-сіндгу** — о, океане милосердя!; **адгама-джана̄ра-бандгу** — друже занепалих душ; **локана̄тха** — о, Локана̄тха Госвамі (або володарю світів)!; **локера джīвана** — життя всіх істот; **ха̄ ха̄ прабгу** — о, мій Господи, змилуйся!; **кара дая** — будь милостивим; **дехо море пада-чха̄я** — даруй мені тінь твоїх лотосових стіп; **ебе джашя гушук трібгувана** — нехай тепер слава твоя лунає по трьох світах; **е адгама лоіло шярана** — цей занепалий прийняв прихисток; **туя паде лоіну шярана** — я прибіг до твоїх стіп як до свого прихистку.\"],\"translation\":[\"О Духовний Вчитель, ти - океан милості та друг грішників, ти - вчитель кожного і наше життя. О володарю! Будь милостивим до мене і дай мені прихисток в тіні твоїх стоп-лотосів. Нехай же твоя слава лунає на всі три світи.\"],\"isLong\":false,\"isWbwInlineModeAvailable\":false,\"inline_word_by_word
