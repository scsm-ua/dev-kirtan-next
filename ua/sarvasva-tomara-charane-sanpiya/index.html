актівінод Тха̄кур\"],\"verses\":[{\"number\":\"1\",\"text\":[\"сарвасва тома̄ра,    чаране санпія,\",\"    подечхі тома̄ра горе\",\"тумі то’ тха̄кур,    тома̄ра куккур,\",\"    болія джа̄нахо море\"],\"translation\":[\"Усе, що я маю, складаю до Твоїх лотосових стоп, о Господи, я все віддаю Тобі. Я схиляюся перед Твоїм домом, Ти — господар цієї оселі, тож, будь ласка, прийми мене в якості свого пса.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"ба̄ндгія нікате,    а̄ма̄ре па̄лібе,\",\"    рохібо тома̄ра два̄ре\",\"пратīпа-джонере,    а̄сіте на̄ дібо,\",\"    ра̄кхібо ґодера па̄ре\"],\"translation\":[\"Прив’яжи та дбай про мене, а я стерегтиму Твій поріг. Я не допущу жодного неприятеля, ніякий злодій не ступить за межі навколишнього рову.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"тава ніджа-джана,    праса̄д севія,\",\"    уччхішта ра̄кхібе джа̄ха̄\",\"а̄ма̄ра бгоджана,    парама-а̄нанде,\",\"    праті-діна хобе та̄ха̄\"],\"translation\":[\"Те, що лишатиметься після того, як віддані шануватимуть Твій *прасад*, буде моєю їжею. Я з великою радістю частуватиму цими залишками.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"босія шюія,    тома̄ра чарана,\",\"    чінтібо сатата а̄мі\",\"на̄чіте на̄чіте,    нікате джа̄ібо,\",\"    джокхона да̄кібе тумі\"],\"translation\":[\"Байдуже, сидітиму я чи лежатиму, я завжди буду памʼятати і роздумувати про Твої лотосові стопи. Щойно Ти покличеш мене, я негайно прибіжу до Тебе й у захваті затанцюю.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"ніджера пошана,    кобгу на̄ бга̄вібо,\",\"    рохібо бга̄вера бгоре\",\"бгакатівінода,    тома̄ра па̄лака,\",\"    болія варана коре\"],\"translation\":[\"Я не бажаю дбати про себе, натомість я хочу піклуватися лише про свого господаря. Відтепер Бгактівінод приймає Тебе своїм єдиним покровителем.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":\"Шріла Б.Р. Шрідгар Дев-Ґосвамі Махарадж\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/sridhar-maharaj-and-g
