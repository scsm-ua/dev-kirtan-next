ber\":\"5\",\"text\":[\"джуґала-мӯрті,    декхія мора,\",\"    парама-а̄нанда хой\",\"праса̄да-сева̄    коріте хоя,\",\"    сакала прапаньча джай\"],\"translation\":[\"Коли я споглядаю незбагненні форми Божественної Пари, Шрі Шрі Радги-Крішни, я відчуваю найвище блаженство. Приймаючи *прасадам* Господа, я долаю всі омани матеріального світу.\"]},{\"number\":\"6\",\"text\":[\"дже-діна ґрихе,    бгаджана декхі,\",\"    ґрихете ґолока бга̄я\",\"чарана-сīдгу,    декхія ґанґа̄,\",\"    сукха на̄ сīма̄ па̄я\"],\"translation\":[\"Кожного разу, коли в моїй оселі відбувається поклоніння і служіння Господу Харі, для мене там постає Ґолока Вриндавана. Коли ж я споглядаю Ґанґу, ріку нектару, що витікає зі стоп-лотосів Господа, я відчуваю безмежну радість.\"]},{\"number\":\"7\",\"text\":[\"туласī декхі’,    джуда̄я пра̄на,\",\"    ма̄дгава-тошанī джа̄ні’\",\"ґаура-прія,    шяка-севане,\",\"    джīвана са̄ртхака ма̄ні\"],\"translation\":[\"Погляд на священне деревце Туласі заспокоює мою душу, бо я знаю, що Туласі тішить Самого Господа Крішну. Коли я шаную *шак* — страву з зеленого листя, що так до вподоби Господу Чайтаньї, я відчуваю, що моє життя наповнюється змістом.\"]},{\"number\":\"8\",\"text\":[\"бгакатівінода,    кришна-бгаджане,\",\"    анукӯла па̄я джа̄ха̄\",\"праті-дівасе,    парама-сукхе,\",\"    свīка̄ра карає та̄ха̄\"],\"translation\":[\"Усе, що приходить до Бгактівінода задля служіння Шрі Крішні, він щодня приймає як найбільшу радість.\"]}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.N. Acharya Maharaj\",\"ru\":\"Шрила Б.Н. Ачарья Махарадж\",\"ua\":\"Шріла Б.Н. Ачарʼя Махарадж\"},\"embed_url\":\"https://soundcloud.com/kostya-netrebenko/083-suddhabhakatacharanarenu-11\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1a:[\"$\",\"$L23\",null,{\"audio\":\"$19:props:song:resources:audio\",\"caption\":\"Слухати аудіо:\",\"language\":\"ua\"}]\n1b:[\"$\",\"$L24\",nul
