ожував і де чинив Свої забави мій Господь Ґаурасундар.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"мриданґа-ба̄дья,    шюніте мон,\",\"    абасара сада̄ джа̄че\",\"ґаура-біхіта,    кīртана шюні’,\",\"    а̄нанде хридоя на̄че\"],\"translation\":[\"Мій ум невпинно благає про можливість слухати звуки *мриданґи*. Коли я чую *кіртан*, таким, яким його заповідав Господь Ґаурачандра, моє серце пускається у радісний танок.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"джуґала-мӯрті,    декхія мора,\",\"    парама-а̄нанда хой\",\"праса̄да-сева̄    коріте хоя,\",\"    сакала прапаньча джай\"],\"translation\":[\"Коли я споглядаю незбагненні форми Божественної Пари, Шрі Шрі Радги-Крішни, я відчуваю найвище блаженство. Приймаючи *прасадам* Господа, я долаю всі омани матеріального світу.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"дже-діна ґрихе,    бгаджана декхі,\",\"    ґрихете ґолока бга̄я\",\"чарана-сīдгу,    декхія ґанґа̄,\",\"    сукха на̄ сīма̄ па̄я\"],\"translation\":[\"Кожного разу, коли в моїй оселі відбувається поклоніння і служіння Господу Харі, для мене там постає Ґолока Вриндавана. Коли ж я споглядаю Ґанґу, ріку нектару, що витікає зі стоп-лотосів Господа, я відчуваю безмежну радість.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"туласī декхі’,    джуда̄я пра̄на,\",\"    ма̄дгава-тошанī джа̄ні’\",\"ґаура-прія,    шяка-севане,\",\"    джīвана са̄ртхака ма̄ні\"],\"translation\":[\"Погляд на священне деревце Туласі заспокоює мою душу, бо я знаю, що Туласі тішить Самого Господа Крішну. Коли я шаную *шак* — страву з зеленого листя, що так до вподоби Господу Чайтаньї, я відчуваю, що моє життя наповнюється змістом.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"бгакатівінода,    кришна-бгаджане,\",\"    анукӯла па̄я джа̄ха̄\",\"праті-дівасе,    парама-сукхе,\",\"    свīка̄ра карає та̄ха̄\"],\"translation\":[\"Усе, що приходить до Бгактівінода задля служіння Шрі Крішні, він щодня приймає як найбільшу радість.\"],\"isLong\":false}],\"resources\":
