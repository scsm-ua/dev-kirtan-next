рī-ґовінда-кунда лīла̄стхалī на̄хі сīма̄\",\"діва̄ніші-бгакта-вринда коре парікрама̄\"],\"translation\":[\"Разом зі Шрі Ґовінда-*кундою* ці святі місця божественних ігор безмежні. Вдень і вночі віддані обходять їх по колу, поклоняючись їм.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"‘шрīдгар-сва̄мī-сева̄шрам’ парама шобгана\",\"ятха̄ нітья-сева̄ коре са̄расвата-ґана\"],\"translation\":[\"Тут стоїть надзвичайно прекрасний Шрідгар Свамі Севашрам, де віддані Шрі Чайтанья Сарасват Матху займаються своїм вічним служінням.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"абгінна шрī кришна ґʼяне бгаджіба̄ра торе\",\"маха̄прабгу самарпіла̄ рагуна̄тха коре\"],\"translation\":[\"Шріман Махапрабгу дарував Шрі Шрі Ґіріраджа Джіу Шрі Рагунатху Ґосвамі, щоб Шрі Дас Ґосвамі міг поклонятися Його Величності, знаючи, що Ґірірадж не відрізняється від Самого Крішни.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"ґосва̄мī шрī-рагуна̄тха да̄сере смарія\",\"нірантара сева̄ коре антармана̄ хоія\"],\"translation\":[\"Віддані Шрі Чайтанья Сарасват Матху поклоняються Шрі Шрі Ґіріраджу Джіу з глибокою відданістю, памʼятаючи Шрі Рагунатха Даса Ґосвамі.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"джая ґірі-ґовардгана дівʼя-раса̄лой\",\"рӯпа-сана̄тана-джīва-рагуна̄тха̄шрой\"],\"translation\":[\"Вся слава Шрі Ґірі Ґовардгану — обителі божественної *раси* та притулку Шрі Рупи, Санатани, Джіви і Рагунатха Ґосвамі.\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"сурендра-мунīндра-шіва-шюка-маха̄джана\",\"декхена а̄раті-шобга̄ дурллабга-даршяна\"],\"translation\":[\"Рідкісну й дорогоцінну красу *араті* Шрі Ґіріраджа Джіу споглядають Господь Індра, Нарада Муні, Господь Шіва, Шюкадева Ґосвамі та всі величні особистості.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"севʼя о севака-рӯпе нітья парака̄шя\",\"са̄нанде а̄раті декхе е адгама да̄са\"],\"translation\":[\"Шрі Шрі Ґірірадж Джіу вічно проявлений і як Господь, якому поклоняються, і як Господь, який служить. Цей занепалий слуга з великою радістю споглядає *араті* Шрі Ґіріраджа Джіу.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.R. Madhusudan Maharaj\",\"ru\":\"Шрила Б.Р. Мадхусудан Махарадж\",\"ua\":\"Шріла Б.Р. Мадгусудан Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/madhusudan-maharaj-day-programm-kisel\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"23:[\"$\",\"$L2c\",null,{\"audio\":\"$22:props:song:resources:audio\",\"caption\":\"Слухати аудіо:\",\"language\":\"ua\"}]\n24:[\"$\",\"$L2d\",null,{\"navMap\":{\"34\":{\"prev\":{\"path\":\"/ua/jaya-jaya-girirajer-arati-vishiala/\",\"title\":\"Шрī Ґовінда Кунда Ґупта-Ґовардган А̄раті\"},\"next\":{\"path\":\"/ua/jaya-guru-maharaja-karuna-sagara/\",\"title\":\"Шрī Шрī Ніта̄і-Чайтанья-А̄раті\"}}}}]\n2e:T114d,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"alternateName\":[\"Kirtan Guide\",\"Vaishnava Songbook\"],\"description\":\"A digital Vaishnava songbook and kirtan guide with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPage\",\"@id\":\"https://dev.kirtan.site/ua/jaya-jaya-girirajer-arotiko-shobha/\",\"url\":\"https://dev.kirtan.site/ua/jaya-jaya-girirajer-arotiko-shobha/\",\"name\":\"Шрī Шрī Ґіріра̄дж-Ґовардган А̄раті. Шрīла Бгакті Сундар Ґовінда Дев-Ґосва̄мī Маха̄ра̄дж\",\"inLanguage\":\"uk\",\"description\":\"Шрī Шрī Ґіріра̄дж-Ґовардган А̄раті — вайшнавська пісня з текстом, українським перекладом і послівним розбором. Автор — Шрīла Бгакті Сундар Ґовінда Дев-Ґос
