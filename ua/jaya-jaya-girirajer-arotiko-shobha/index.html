оє сакхī-ґана\"],\"translation\":[\"Господь Шрі Радга-Рамана (Крішна, Який дарує насолоду Своїй коханій Шріматі Радгарані) вічно грається у Свої радісні любовні забави у колі *сакхі* — подруг Шріматі Радгарані.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"ма̄латī-ма̄дгавī-куньджа кандаре кандаре\",\"ніґӯдга нікуньджа-лīла харі манохаре\"],\"translation\":[\"Тут, серед квіткових гаїв *малаті* та ліан *мадгаві*, відбуваються таємні ігри чарівного Господа Харі.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"шьяма-кунда ра̄дга̄-кунда кусум саровара\",\"ма̄наса ґанґа̄ да̄на-га̄тī джа̄ра абгʼянтара\"],\"translation\":[\"У цьому святому місці розташовані Шьяма-*кунда*, Радга-*кунда*, Кусум-Саровар, Манаса-Ґанґа та Дана-*гаті*.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"шрī-ґовінда-кунда лīла̄стхалī на̄хі сīма̄\",\"діва̄ніші-бгакта-вринда коре парікрама̄\"],\"translation\":[\"Разом зі Шрі Ґовінда-*кундою* ці святі місця божественних ігор безмежні. Вдень і вночі віддані обходять їх по колу, поклоняючись їм.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"‘шрīдгар-сва̄мī-сева̄шрам’ парама шобгана\",\"ятха̄ нітья-сева̄ коре са̄расвата-ґана\"],\"translation\":[\"Тут стоїть надзвичайно прекрасний Шрідгар Свамі Севашрам, де віддані Шрі Чайтанья Сарасват Матху займаються своїм вічним служінням.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"абгінна шрī кришна ґʼяне бгаджіба̄ра торе\",\"маха̄прабгу самарпіла̄ рагуна̄тха коре\"],\"translation\":[\"Шріман Махапрабгу дарував Шрі Шрі Ґіріраджа Джіу Шрі Рагунатху Ґосвамі, щоб Шрі Дас Ґосвамі міг поклонятися Його Величності, знаючи, що Ґірірадж не відрізняється від Самого Крішни.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"ґосва̄мī шрī-рагуна̄тха да̄сере смарія\",\"нірантара сева̄ коре антармана̄ хоія\"],\"translation\":[\"Віддані Шрі Чайтанья Сарасват Матху поклоняються Шрі Шрі Ґіріраджу Джіу з глибокою відданістю, памʼятаючи Шрі Рагунатха Даса Ґосвамі.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"джая ґірі-ґовардгана дівʼя-раса̄лой\",\"рӯпа-сана̄тана-джīва-рагуна̄тха̄шрой\"],\"translation\":[\"Вся слава Шрі Ґірі Ґовардгану — обителі божественної *раси* та притулку Шрі Рупи, Санатани, Джіви і Рагунатха Ґосвамі.\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"сурендра-мунīндра-шіва-шюка-маха̄джана\",\"декхена а̄раті-шобга̄ дурллабга-даршяна\"],\"translation\":[\"Рідкісну й дорогоцінну красу *араті* Шрі Ґіріраджа Джіу споглядають Господь Індра, Нарада Муні, Господь Шіва, Шюкадева Ґосвамі та всі величні особистості.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"севʼя о севака-рӯпе нітья парака̄шя\",\"са̄нанде а̄раті декхе е адгама да̄са\"],\"translation\":[\"Шрі Шрі Ґірірадж Джіу вічно проявлений і як Господь, якому поклоняються, і як Господь, який служить. Цей занепалий слуга з великою радістю споглядає *араті* Шрі Ґіріраджа Джіу.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":\"Шріла Б.Р. Мадгусудан Махарадж\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/madhusudan-maharaj-day-programm-kisel\",\"personSlug\":\"srila-b-r-madhusudan-maharaj\"},{\"title\":\"Манаса Крішна Прабгу\",\"embed_url\":\"https://soundcloud.com/huron/jaya-jaya-girirajer-arotiko\",\"personSlug\":\"manasa-krishna-prabhu\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false},\"telegraphUrl\":\"https://telegra.ph/SHrī-SHrī-Gіrіradzh--Govardgan-Aratі-01-02\"},\"head\":{\"canonical\":\"/ua/jaya-jaya-girirajer-arotiko-shobha/\",\"description\":\"Шрī Шрī Ґіріра̄дж-Ґовардган А̄раті — вайшнавська пісня з текстом, українським перекладом і послівним розбором. Автор — Шрīла Бгакті Сундар Ґовінда Дев-Ґосва̄мī Маха̄ра̄дж. Зі збірки «Ґаудія Ґітанджалі».\",\"title\":\"Шрī Шрī Ґіріра̄дж-Ґовардган А̄раті. Шрīла Бгакті Сундар Ґовінда Дев-Ґосва̄мī Маха̄ра̄дж | Kirtan Site\"},\"kind\":\"song\",\"route\":{\"kind\":\"item\",\"bookId\":\"ua\",\"slug\":\"jaya-jaya-girirajer-arotiko-shobha\"}}}]}]]}]\n"])</script></bo
