":\"$16\"}}],\"initial\":{\"build\":\"d12e86a@17/11/2026, 16:24:26\",\"data\":{\"book\":{\"title\":\"Ґаудія Ґітанджалі\",\"subtitle\":\"Вайшнавський пісенник українскою мовою\",\"slug\":\"ua\",\"sort_order\":6,\"language\":\"uk\",\"render\":{\"tg.contents.first_line\":false,\"tg.a-z.title.words\":4},\"songsCount\":71},\"descriptions\":[{\"title\":\"Kirtan Guide\",\"title_full_short\":\"Kīrtan Guide 12th Ed\",\"subtitle\":\"London, Twelfth Edition, 2026\",\"slug\":\"en\",\"sort_order\":1,\"shortcuts\":[{\"icon\":\"clock\",\"title\":\"The Daily Programme\",\"slug\":\"003-programme\"}],\"audio\":{\"filter\":{\"by_title\":[\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"Srila B.R. Sridhar Dev-Goswami Maharaj\",\"Nabadwip temple\",\"Kamal Krishna Prabhu\",\"Manasa Krishna Prabhu\"]}},\"songsCount\":194},{\"title\":\"Гаудия Гитанджали\",\"subtitle\":\"Cборник вайшнавских песен и молитв\",\"slug\":\"ru\",\"sort_order\":2,\"render\":{\"tg.contents.first_line\":false,\"tg.a-z.title.words\":3},\"songsCount\":178},{\"title\":\"Guía de Kīrtan\",\"subtitle\":\"Edición Detallada. Con traducción palabra por palabra y explicación de estilo\",\"slug\":\"es\",\"sort_order\":3,\"songsCount\":146},{\"title\":\"Gaudija Gītandžalī\",\"subtitle\":\"Vaišnavu dziesmas un lūgšanas\",\"slug\":\"lv\",\"sort_order\":5,\"songsCount\":91},\"$4:props:children:1:props:children:props:initial:data:book\",{\"title\":\"Kirtan Guide\",\"subtitle\":\"Chiang Mai English Edition, 2022\",\"slug\":\"en-2022\",\"sort_order\":7,\"hidden\":false,\"is_legacy\":{\"show_micro_thumbnail_on_main\":true},\"songsCount\":166}],\"nav\":{\"173\":{\"prev\":{\"path\":\"/ua/gopinath-amara-upaya-nai/\",\"title\":\"Ніведана 3\"},\"next\":{\"path\":\"/ua/durlabha-manava-janma-labhiya-samsare/\",\"title\":\"Дурлабга ма̄нава-джанма\"}}},\"song\":{\"meta\":{\"page\":173,\"translation\":\"auto\",\"first_line\":\"шрī-рӯпа-маньджарī-пада, сеі мора сампада\",\"version\":\"draft-v8\",\"translator\":\"nazar\"},\"title\":[\"Шрī-Рӯпа-Маньджарī-пада\"],\"author\":[\"Шрīла Нароттам Да̄с Тха̄кур\"],\"verses\":[{\"number\":\"1\",\"text\":[\"шрī-рӯпа-маньджарī-пада,    сеі мора сампада,\",\"    сеі мора бгаджана-пӯджана\",\"сеі мора пра̄на-дгана,    сеі мора а̄бгарана,\",\"    сеі мора джīванера джīвана\"],\"isLong\":false,\"translation\":\"$undefined\"},{\"number\":\"2\",\"text\":[\"сеі мора раса-нідгі,    сеі мора ва̄ньчха̄-сіддгі,\",\"    сеі мора ведера дгарама\",\"сеі брата, сеі тапа,    сеі мора мантра-джапа,\",\"    сеі мора дгарама-карама\"],\"isLong\":false,\"translation\":\"$undefined\"},{\"number\":\"3\",\"text\":[\"анукӯла хобе віддгі,    се-паде хоібе сіддгі,\",\"    ніракхібо е дуі наяне\",\"се рӯпа-ма̄дгурī-ра̄ші,    пра̄на-кувалая-шяші,\",\"    прапхулліта хобе ніші-діне\"],\"isLong\":false,\"translation\":\"$undefined\"},{\"number\":\"4\",\"text\":[\"туя адаршяна-ахі,    ґороле джа̄рало дехі,\",\"    чіро-діна та̄піта джīвана\",\"ха̄ ха̄ рӯпа кара дая,    дехо море пада-чха̄я,\",\"    нароттама лоіло шярана\"],\"isLong\":false,\"translation\":\"$undefined\"},{\"subtitle\":[\"Коментар Шріли Б.Р. Шрідгара Дев-Ґосвамі Махараджа\"],\"isLong\":false,\"translation\":\"$undefined\"},{\"number\":\"1\",\"translation\":[\"*Шрī-рӯпа-маньджарī-пада, сеі мора сампада, сеі мора бгаджана-пӯджана* — моє усе — це святі стопи Шрі Рупи Ґосвамі. Є багато різних ступенів і положень у *расах*: *шанта*, *дасья*, *сакхʼя*, *ватсалья*, *мадгура*. У *мадгура-расі* особливе місце займає група Шрі Радгарані. Далі йдуть численні ступені *сакхі*. Потім є окрема група *маньджарі* — молодших дівчаток, які мають особливу свободу: коли Радга і Ґовінда проводять час разом в усамітненому місці, *маньджарі* все одно можуть туди підійти. Вони мають таку свободу служіння Їм. Якщо для служіння потрібні якісь речі, то *сакхі* посилають туди *маньджарі*. Самі *сакхі* туди не наближаються. Таким чином *маньджарі* мають найбільшу довіру.\",\"Найпотаємніше служіння Їм обом здійснюється саме через *маньджарі*. На найвищому рівні вони мають право входу, і їхня провідниця — Рупа Маньджарі. Вона вважається старшою всієї групи молодших дівчаток, *маньджарі*, тому в *мадгура-бгаджані* Вона — все для нас. Так навчав нас Нароттам Тхакур. Для нас — і для прийдешніх поколінь — Вона є найвищим притулком.\",\"*Сеі мора сампада* — у Її стопах моє справжнє багатство. *Сеі мора бгаджана-пӯджана* — у Ній зосереджені моє служіння й поклоніння. *Сеі мора пра̄на-дгана, сеі мора а̄бгарана* — у Ній зосереджена найвища суть мого життя; і якщо в моєму житті є якісь прикраси, то це лише те, що приходить через Її милість. *Сеі мора джīванера джīвана* — справжнє життя мого життя (якщо в ньому є щось істинне) — це також Вона. Я існую лише для Її радості.\"],\"isLong\":false},{\"number\":\"2\",\"translation\":[\"*Сеі мора раса-нідгі* — якщо в моєму житті є хоч щось піднесене і бажане, то джерело всього цього — лише там. Скарбниця, джерело й витік усієї *раси* — у Її лотосових стопах. *Сеі мора ва̄ньчха̄-сіддгі* — і якщо я очікую якихось інших звершень у житті, то й вони теж містяться в Її стопах. *Сеі мора ведера дгарама* — якщо Веди визначають для мене якийсь обовʼязок, я хочу, щоб цей обовʼязок здійснювався лише біля Її стоп.\",\"*Сеі брата, сеі тапа* — якщо ж у мене є якісь плоди обітниць чи покаянь, то й вони можуть бути знайдені тільки там; *сеі мора мантра-джапа* — і безупинне повторення мантри в *джапі* також знаходить завершення лише там: усе в моєму житті має один кінець, одну ціль — у різних фазах зійтися в лотосових стопах Рупи Маньджарі. Якщо Вона задоволена, тоді всі різноманітні види мого відданого служіння досягають звершення. *Сеі мора дгарама-карама* — і будь-яке моє уявлення про обовʼязок чи діяльність, у будь-якій фазі чи формі, має одне спільне завершення і збігається в одній точці — у святих лотосових стопах Рупи Маньджарі.\"],\"isLong\":false},{\"number\":\"3\",\"translation\":[\"*Анукӯла хобе віддгі, се-паде хоібе сіддгі* — я лише молю Повелителя і Першопричину всіх подій цього світу: «Будь ласка, звʼяжи мене з Нею. О Всевишній Управителю, дозволь усім моїм прагненням здобути Її милість. *Ніракхібо е дуі наяне* — і нехай це буде настільки виразно й відчутно, ніби я побачив це на власні очі. Я не хочу, щоб це було туманно, абстрактно чи уявно. Я благаю про найбільш реальне переживання по милості Всевишнього Управителя». *Се рӯпа-ма̄дгурī-ра̄ші, пра̄на-кувалая-шяші* — яка ж незбагненно висока краса у Її святих стопах! Я хочу стрибнути туди. Нехай моє серце стане лотосом.\",\"Є два види лотосів: білий лотос — сонячний, а червоний — місячний. *Кувалая* — це їхнє поєднання. Сяйво Її тіла живитиме мене і вдень, і вночі — як життя мого життя, подібне до лотоса *кувалая*. *Кувалая* живиться й підтримується сяйвом місяця; Її святі стопи — це Місяць, а моя життєва сила подібна до лотоса. Нехай сяйво Її краси живить найпотаємнішу глибину мого серця. *Прапхулліта хобе ніші-діне* — і від цього сяйва лотос мого серця буде рости й танцювати.\"],\"isLong\":false},{\"number\":\"4\",\"translation\":[\"*Туя адаршяна-ахі* — така моя молитва, але в якому я положенні? Моє положення протилежне, о моя Повелителько. Мій стан такий, що без споглядання Твого образу, о Твоя Милосте, моє серце згорає в попіл. Такий мій стан. *Ґороле джа̄рало дехі* — ніби отрута кобри, яка спричиняє нестерпний біль моєму серцю. Мене вкусила змія, і що це за змія? Це відсутність прямого звʼязку з Тобою, Твоя Милосте. Отрута цієї змії скувала моє серце, і я помираю. *Чіро-діна та̄піта джīвана* — і це сталося не раптово: з давніх-давен я терплю цей біль розлуки з прекрасним, сповненим надії щасливим життям.\",\"*Ха̄ ха̄ рӯпа кара дая, дехо море пада-чха̄я, нароттама лоіло шярана* — але зараз я дійшов краю і востаннє благаю Твоєї милості; інакше я згину.\",\"Цей *бгаджан* склав Нароттам Тхакур на славу Шріли Рупи Ґосвамі. Так він відкрив нам промінь світла з найвищої сфери життя *бгаджану*. Ця *сампрадая* зветься Рупануґа-сампрадая, і наша Ґуру-парампара та все, що з нею повʼязане, узгоджені з цим настроєм. Він написав багато пісень, і всі вони мають глибоку внутрішню основу та сповнені піднесеного духовного переживання і непохитної віри.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-sri-rupa\",\"personSlug\":\"srila-b-s-govinda-dev-goswami-maharaj\"},{\"title\":\"Манаса Крішна Прабгу\",\"embed_url\":\"https://soundcloud.com/huron/sri-rupa-manjari-pada\",\"personSlug\":\"manasa-krishna-prabhu\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false},\"telegraphUrl\":\"https://telegra.ph/SHrī-Rӯpa-Mandzharī-pada-01-03\"},\"head\":{\"canonical\":\"/ua/shri-rupa-manjari-pada-sei-mora-sampada/\",\"description\":\"Шрī-Рӯпа-Маньджарī-пада — вайшнавська пісня з текстом, українським перекладом і послівним розбором. Автор — Шрīла Нароттам Да̄с Тха̄кур. Зі збірки «Ґаудія Ґітанджалі».\",\"title\":\"Шрī-Рӯпа-Маньджарī-пада. Шрīла Нароттам Да̄с Тха̄кур | Kirtan Site\"},\"kind\":\"song\",\"route\":{\"kind\":\"item\",\"bookId\":\"ua\",\"slug\":\"shri-rupa-manjari-pada-sei-mora-sampada\"}}}]}]]}]\n"])</script></body></html>
