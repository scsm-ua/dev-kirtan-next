ript>self.__next_f.push([1,"1b:[\"$\",\"$L23\",null,{\"bookId\":\"ua\",\"label\":\"Показувати вірші / переклад\",\"song\":{\"meta\":{\"page\":160,\"translation\":\"auto\",\"first_line\":\"а̄тма-ніведана, туя паде корі\",\"version\":\"draft-v8\",\"translator\":\"nazar\"},\"title\":[\"А̄тма-ніведана\"],\"author\":[\"Шрīла Бгактівінод Тха̄кур\"],\"verses\":[{\"number\":\"1\",\"text\":[\"а̄тма-ніведана,    туя паде корі,\",\"    хоіну парама сукхī\",\"духкха дӯре ґело,    чінта̄ на̄ рохіло,\",\"    чаудіке а̄нанда декхі\"],\"translation\":[\"Я відчув найвищу радість, коли вручив себе Твоїм святим лотосовим стопам. Смуток відступив, тривоги зникли. Тепер я бачу радість звідусіль.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"ашока-абгая,    амрита-а̄дга̄ра,\",\"    тома̄ра чарана-двая\",\"та̄ха̄те екхона,    вішра̄ма лобгія\",\"    чха̄діну бгавера бгая\"],\"translation\":[\"Твої дві стопи-лотоси — це осередок нектару безсмертя, де живуть вільними від страждань і страху. Тепер я знайшов там спокій і відкинув жах перед цим світом.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"тома̄ра самса̄ре,    корібо севана,\",\"    нахібо пхалера бга̄ґī\",\"тава сукха джа̄хе,    корібо джатана,\",\"    хо’є паде анура̄ґī\"],\"translation\":[\"Я служитиму в Твоєму домі й не шукатиму насолоди у плодах цього служіння. Я намагатимусь робити тільки те, що до вподоби Тобі, цілковито відданий Твоїм лотосовим стопам.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"тома̄ра сева̄я,    духкха хоя джато,\",\"    сео то’ парама сукха\",\"сева̄-сукха-духкха,    парама сампада\",\"    на̄шоє авідья-духкха\"],\"translation\":[\"Труднощі, які приходять у служінні, стануть для мене джерелом великої радості. У відданому служінні Тобі і радість, і страждання — однаково велике багатство. І те, й інше позбавляє від невігласних страждань.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"пӯрва ітіха̄са,    бгуліну сакала,\",\"    сева̄-сукха пе’є мане\",\"а̄мі то’ тома̄ра,    тумі то’ а̄ма̄ра,\",\"    кі ка̄джа апара дгане\"],\"translation\":[\"Я зовсім забув усе своє минуле, бо в моєму умі зʼявилася велика радість. Я безумовно належу Тобі, а Ти по-справжньому — мій. Навіщо ж мені інші скарби?\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"бгакатівінода,    а̄нанде дубія,\",\"    тома̄ра сева̄ра торе\",\"саба чешта̄ коре,    тава ічха̄-мата,\",\"    тха̄кія тома̄ра горе\"],\"translation\":[\"Бгактівінод, занурений в океан духовної радості, віддає всі свої сили служінню Тобі й живе в Твоєму домі так, як Ти того бажаєш.\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"$L24\",null,{\"navMap\":{\"160\":{\"prev\":{\"path\":\"/ua/hari-hari-biphole-janama-goyainu/\",\"title\":\"Ішта-деве Віґʼяпті\"},\"next\":{\"path\":\"/ua/amara-jivana-sada-pape-rata/\",\"title\":\"А̄ма̄ра джīвана\"}}}}]\n25:Tdcb,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"description\":\"A digital Vaishnava songbook with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPage\",\"@id\":\"https://dev.kirtan.site/ua/atma-nivedana-tuya-pade-kori/\",\"url\":\"https://dev.kirtan.site/ua/atma-nivedana-tuya-pade-kori/\",\"name\":\"А̄тма-ніведана. Шрīла Бгактівінод Тха̄кур\",\"inLanguage\":\"uk\",\"description\":\"А̄тма-ніведана — вайшнавська пісня з текстом, українським перекладом і послівним розбором. Автор — Шрīла Бгактівінод Тха̄кур. Зі збірки «Ґаудія Ґітанджалі».\",\"breadcrumb\":{\"@id\":\"https://dev.kirtan.site/ua/atma-nivedana-tuya-pade-kori/#b
