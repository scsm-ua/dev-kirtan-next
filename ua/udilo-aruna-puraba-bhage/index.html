унда, Мадгава, Джадава і Харі!\\\"\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"емона дурллабга ма̄нава-дехо,\",\"па̄ія кі кара бга̄ва на̄ кехо,\",\"ебе на̄ бгаджіле яшода̄-сута,\",\"    чараме подібе ла̄дже\"],\"translation\":[\"\\\"Здобувши таке рідкісне людське тіло, чи використовуєш ти належно цей цінний дар? Якщо ти не будеш служити сину Яшоди зараз, то зрештою на тебе чекає велике розчарування\\\".\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"удіта тапана хоіле аста,\",\"діна ґело-болі’ хоібе вʼяста,\",\"тобе кено ебе аласа хой,\",\"    на̄ бгаджа хридоя-ра̄дже\"],\"translation\":[\"“З кожним сходом і заходом сонця безповоротно минає день. Чому ж ти марно витрачаєш свій час? Чому не служиш Господу свого серця?”\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"джīвана анітья джа̄наха са̄р,\",\"та̄хе на̄на̄-відга віпада-бга̄р,\",\"на̄ма̄шроя корі’ джатане тумі,\",\"    тха̄каха а̄пана ка̄дже\"],\"translation\":[\"\\\"Знай, це життя тимчасове та сповнене страждань. Прийняти прихисток Святого Імені - твій єдиний обовʼязок.\\\"\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"кришна-на̄ма-судга̄ корія па̄н\",\"джуда̄о бгакатівінода-пра̄н,\",\"на̄ма віна̄ кічху на̄хіко а̄ро,\",\"    чаудда-бгувана-ма̄джге\"],\"translation\":[\"Пий чистий нектар Святого Імені Крішни і так вгамуй душу Тхакура Бгактівінода. В усіх чотирнадцяти світах немає нічого кращого від Імені Крішни.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"джīвера кальяна-са̄дгана-ка̄м,\",\"джаґате а̄сі’ е мадгура на̄м,\",\"авідья-тіміра-тапана-рӯпе,\",\"    хрид-ґаґане біра̄дже\"],\"translation\":[\"Щоб розсіяти темряву невігластва та благословити всі душі у цьому всесвіті, прекрасне Імʼя Крішни явилось як сяюче сонце.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-udilo-aruna-jiv\"},{\"title\":{\"en\":\"Srila B.B. Avadhu
