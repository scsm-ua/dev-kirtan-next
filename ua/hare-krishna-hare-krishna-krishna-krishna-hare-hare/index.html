̄ма харе харе\"],\"translation\":[\"В Імені Рами, яке містить Харе Крішна *мантра*, Ґаудія-вайшнави вбачають Радга-рамана Раму. Це означає: “Крішна, Який тішить (*раман*) Шриматі Радгарані”. В нашому розумінні Харе Крішна *мантра* — це виключно свідомість Крішни, а не свідомість Рами (Господа Рамачандри). Вищий ідеал Шрі Чайтаньї — це Сваям Бгаґаван, Крішна-*ліла* та Радга-Ґовінда-*ліла*.\",\"З огляду на це, в Харе Крішна *мантрі* не йдеться про Рама-*лілу* Айодгʼї. Вищий зміст Харе Крішна *мантри* не має відношення до цього… Від розуміння внутрішньої суті *мантри* залежить наш духовний успіх, а також це розуміння дозволить відданим дістатися до їх жаданого призначення.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/jayasri-sound/maha-mantra\"},{\"title\":{\"en\":\"Srila B.R. Sridhar Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.Р. Шридхар Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.Р. Шрідгар Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/scs-math-mexico-cpi/mahamantra-hare-krishna-srila-bhakti-rakshak-sridhar-deva-goswami-maharaj\"},{\"title\":{\"en\":\"Srila B.S. Goswami Maharaj\",\"ru\":\"Шрила Б.С. Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/goswami-maharaj-mahamantra\"},{\"title\":{\"en\":\"Caracas temple\",\"ru\":\"Храм г.Каракас\",\"ua\":\"Храм м.Каракас\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/shchsm-karakas-kirtan\"},{\"title\":{\"en\":\"Srila B.B. Avadhut Maharaj\",\"ru\":\"Шрила Б.Б. Авадхут Махарадж\",\"ua\":\"Шріла Б.Б. Авадгут Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/avadxut-maxaradzh-utrennee-3\"},{\"title\":{\"en\":\"Srila B.B. Avadhut Maharaj\",\"ru\":\"Шрила Б.Б. Авадхут Махарадж\",\"ua\":\"Шріла Б.Б. Авадгут Махарадж\"},\"embed_url\
