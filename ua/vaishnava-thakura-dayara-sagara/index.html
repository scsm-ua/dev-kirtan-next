"className\":\"SongHeader__author\",\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[false,[\"$\",\"a\",null,{\"href\":\"/ua/authors/\",\"rel\":\"author\",\"children\":\"Шрīла Бгактівінод Тха̄кур\"}]]}]]}]]]}]]\n"])</script><script>self.__next_f.push([1,"1d:[\"$\",\"$L26\",null,{\"bookId\":\"ua\",\"label\":\"Показувати вірші / переклад\",\"song\":{\"meta\":{\"page\":76,\"translation\":\"auto\",\"first_line\":\"(охе) вайшнава тха̄кура, даяра са̄ґара\",\"version\":\"draft-v8\",\"translator\":\"nazar\"},\"title\":[\"Шрī Вайшнава-махіма̄-ґīті\"],\"author\":[\"Шрīла Бгактівінод Тха̄кур\"],\"verses\":[{\"number\":\"1\",\"text\":[\"(охе) вайшнава тха̄кура, даяра са̄ґара,\",\"    е да̄се каруна̄ корі\",\"дія пада-чха̄я, шодго хе а̄ма̄ре,\",\"    тома̄ра чарана дгорі\"],\"translation\":[\"О мій повелителю, о *вайшнаве*, океане милості, будь милостивий до цього слуги. Даруй мені прохолоду тіні Твоїх святих стоп-лотосів і омий мене від усього нечистого. Я знову й знову міцно тримаюся Твоїх святих лотосових стоп.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"чоя беґа домі’,    чоя доша шодгі’,\",\"    чоя ґуна дехо’ да̄се\",\"чоя сат-санґа,    дехо’ хе а̄ма̄ре,\",\"    босечхі санґера а̄шє\"],\"translation\":[\"Приборкай у мені шість спонукань, виправ шість вад і наділи цього слугу шістьма благими чеснотами. Прошу, даруй мені шість видів благого спілкування з відданими. Я сиджу біля Твоїх стоп, з глибоким прагненням до такого спілкування.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"ека̄кī а̄ма̄ра,    на̄хі па̄я бала,\",\"    харі-на̄ма-санкīртане\",\"тумі крипа̄ корі,    шраддга̄-бінду дія,\",\"    дехо’ кришна-на̄ма-дгане\"],\"translation\":[\"У мене самого немає сили співати Святе Імʼя разом з іншими. Будь ласка, зглянься і пролий в моє серце хоча б краплю віри, даруючи мені скарб Імені Господа Крішни.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"кришна се тома̄ра,    кришна діте па̄ро,\",\"    тома̄ра шякаті а̄чхе\",\"а̄мі то ка̄нґа̄ла,    ‘кришна кришна’ болі,\",\"    дга̄і тава па̄чхе па̄чхе\"],\"translation\":[\"Крішна - твій, ти можеш дати Його, ти маєш силу зробити це. Я ж, позбавлений всього, кличу: «Крішна, Крішна!» — і відчайдушно біжу за Тобою.\"],\"isLong\":false},{\"text\":[\"(а̄мі) (дга̄і тава па̄чхе па̄чхе)\",\"(кришна дгана па̄бара̄се дга̄і тава па̄чхе па̄чхе)\",\"(тумі ділеоу діте па̄ро)\",\"(кришна тома̄р хридоєр дган тумі ділеоу діте па̄ро)\",\"(кришна дева̄р шякті дгара тумі ділеоу діте па̄ро)\"],\"translation\":[\"Я біжу за тобою у відчаї. Я біжу за тобою з надією отримати скарб Крішни. Якщо ти забажаєш, ти можеш дати Крішну іншим. Крішна - скарб твого серця. Ти маєш силу дати Крішну. Якщо ти забажаєш, ти можеш дати Крішну іншим.\"],\"isLong\":false},{\"subtitle\":[\"Примітка до строфи 2\"],\"translation\":[\"**Шість спонукань** — це прагнення мови, ума, гніву, язика, шлунка та статевих органів.\",\"**Шість вад:**\\\\\",\"1) схильність переїдати або накопичення грошей понад необхідного;\\\\\",\"2) зайві зусилля заради матеріальних цілей;\\\\\",\"3) пусті балачки на мирські теми;\\\\\",\"4) надмірна привʼязаність до вказівок святого письма або, навпаки, зневага до них;\\\\\",\"5) близьке спілкування з людьми, зануреними в матеріалістичний настрій;\\\\\",\"6) прагнення мирської слави та досягнень.\",\"**Шість благих чеснот:**\\\\\",\"1) натхнення в служінні;\\\\\",\"2) терпіння та терпимість;\\\\\",\"3) впевненість;\\\\\",\"4) рішучість виконувати дії, сприятливі відданому служінню;\\\\\",\"5) твердий намір відмовитися від спілкування з невідданими;\\\\\",\"6) внутрішня дисципліна завжди слідувати по стопам попередніх *ачарʼїв*.\",\"**Шість видів благого спілкування з відданими:**\\\\\",\"1) давати дари;\\\\\",\"2) з вдячністю приймати дари;\\\\\",\"3) відверто відкривати іншим своє серце;\\\\\",\"4) із довірою запитувати про шлях відданого служіння;\\\\\",\"5) приймати *прасад*;\\\\\",\"6) з любовʼю пропонувати *прасад* іншим.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila
