иносить благо всьому світу. Він навчає чистій, піднесеній та світлій науці відданості.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"ра̄дга̄-шьяма екатану дакше ґора̄ ра̄я\",\"ба̄ме ра̄дга мадгʼє сваям шьяма-ґопа джая\"],\"translation\":[\"Вся слава Радгарані та Шьяму (Крішні), обʼєднаним в одному образі Шрі Ґауранґи, який знаходиться праворуч. Слава Шріматі Радгарані, що стоїть ліворуч! Слава Тому, хто стоїть посередині - Верховному Пастушку - Шрі Шьямасундару!\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"враджа раса нава бга̄ве набадвīпе ра̄дже\",\"уда̄ре мадгура ра̄ґа абгінава са̄дже\"],\"translation\":[\"Солодкі любовні почуття та ніжність Враджі (Вріндавану) поєднуються з великодушністю Набадвіпи та являють новий настрій виняткової краси.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"ма̄дгурʼя кайвалья ра̄ґа враджера нірджа̄са\",\"пра̄пті пара̄ка̄штха̄ та̄хе ґаура̄нґа віла̄са\"],\"translation\":[\"*Мадгура-раса* (подружня любов) - це сутність Враджа-*дгами*, а ігри Махапрабгу доводять її до найвищої довершеності.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"ра̄дга̄ бга̄ва-ка̄нті анґікарі’ бга̄ло мате\",\"дакшине а̄сана раса ґаріма̄ декха̄те\"],\"translation\":[\"Щиро приймаючи серце та сяйво Шрі Радги, Шрі Ґауранґа займає Своє місце праворуч, щоб явити славу Своєї *раси*.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"ра̄дга̄-раса-тройо-сва̄да рахасья прояса\",\"ніракхі прапхулла ра̄дга̄ мукхе манда ха̄са\"],\"translation\":[\"Споглядаючи як Крішна нишком намагається поласувати її потрійну *расу*, Радгарані сповнюється щастя та ніжно посміхається.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"мадгʼє рахі вамшіраве гоше вамшідгара\",\"ра̄дга̄ра сампаде а̄мī ґаура̄нґа-сундара\"],\"translation\":[\"Посередині стоїть Вамшідгара і проголошує піснею Своєї флейти: \\\"Багатство Радгарані робить Мене Ґауранґа Сундаром\\\".\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"мадабгīштха рӯпа ра̄дга̄ра хридоя мандіре\",\"ґаура̄нґа бгаджіле суштху спхӯрті па̄я та̄ре\"],\"translation\":[\"\\\"Якщо ти служитимеш Шрі Ґауранзі, то Мій найбільш плеканий образ, що живе в храмі серця Радги, буде явлений тобі в повній мірі.\\\"\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"надīя прака̄шє маха̄прабгу ґаура-нідгі\",\"патіта па̄вана деве міла̄іла відгі\"],\"translation\":[\"По Господньому провидінню, Верховний Спаситель грішних душ явився в Надії, як наймиліший серцю Шрі Ґауранґа Махапрабгу.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"е-рӯпа а̄раті брахма̄ шямбгу аґочара\",\"ґаура бгакта крипа̄ па̄тра ма̄тра сіддгі са̄ра\"],\"translation\":[\"Це *араті* невідоме для Господа Брахми та Господа Шіви. Але воно може відкритись тому, на кого проллється милість слуг Ґауранги.\"],\"isLong\":false},{\"number\":\"12\",\"text\":[\"шрī сварӯпа, ра̄ма̄нанда, рӯпа, сана̄тана\",\"шрī рагу, джīва̄ді крипа̄я декхе бгакта-джана\"],\"translation\":[\"Віддані споглядають це *араті* по милості Шрі Сварупи Дамодара, Шрі Рамананди Рая, Шрі Рупи, Шрі Санатани, Шрі Рагунатхи, Шрі Джіви Ґосвамі та їх сподвижників.\"],\"isLong\":false},{\"number\":\"13\",\"text\":[\"джая ґуру-ґаура-ра̄дга̄-ґовінда-сундара\",\"джая да̄о бгакта вринда нітья нірантара\"],\"translation\":[\"Вся слава Шрі Ґуру, Ґауранзі, Радга-Ґовіндасундару! О віддані, завжди оспівуйте Їхню вічну славу!\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-kiba-jaya-jaya\"},{\"title\":{\"en\":\"Caracas temple\",\"ru\":\"Храм г.Каракас\",\"ua\":\"Храм м.Каракас\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/shchsm-karakas-gaura-arati-i\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"21:[\"$\",\"$L2a\",null,{\"audio\":\"$20:props:song:resources:audio\",\"caption\":\"Слухати ауд
