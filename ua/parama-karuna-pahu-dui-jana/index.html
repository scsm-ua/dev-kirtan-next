рі знемагають, а каміння починає танути, коли чують про Їхню славу.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"самса̄ре маджія,    рохілі подія,\",\"    се паде нахіло а̄шя\",\"а̄пана карама,    бгуньджа̄є шямана,\",\"    кохоє лочана-да̄са\"],\"translation\":[\"Мене поглинув кругообіг народжень і смертей, я впав на узбіччі життя без жодної надії опинитися в Їхньому товаристві. Так до мене прийшов повелитель смерті й примусив отримати плоди власних діянь, — співає Лочан Дас.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-parama-koruna\"},{\"title\":{\"en\":\"Srila B.N. Acharya Maharaj\",\"ru\":\"Шрила Б.Н. Ачарья Махарадж\",\"ua\":\"Шріла Б.Н. Ачарʼя Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/acharya-maharaj-paramakaruna\"},{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-parama-koruna\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1b:[\"$\",\"$L24\",null,{\"audio\":\"$1a:props:song:resources:audio\",\"caption\":\"Слухати аудіо:\",\"language\":\"ua\"}]\n1c:[\"$\",\"$L25\",null,{\"navMap\":{\"115\":{\"prev\":{\"path\":\"/ua/akrodha-paramananda/\",\"title\":\"Акродга парама̄нанда\"},\"next\":{\"path\":\"/ua/dayal-nitai-chaitanya-bole-nach-re/\",\"title\":\"Даял Ніта̄і Чайтанья\"}}}}]\n26:T12dc,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https:
