,[\"$\",\"a\",null,{\"href\":\"/ua/authors/\",\"rel\":\"author\",\"children\":\"Шрīла Бгакті Сундар Ґовінда Дев-Ґосва̄мī Маха̄ра̄дж\"}]]}]]}]]]}]]\n"])</script><script>self.__next_f.push([1,"22:[\"$\",\"$L2b\",null,{\"bookId\":\"ua\",\"label\":\"Показувати вірші / переклад\",\"song\":{\"meta\":{\"page\":72,\"translation\":\"auto\",\"first_line\":\"джая ‘ґуру-маха̄ра̄джа’ джаті-ра̄джешвара\",\"version\":\"draft-v8\",\"translator\":\"nazar\"},\"title\":[\"Шрī Ґуру А̄раті-стуті\"],\"author\":[\"Шрīла Бгакті Сундар Ґовінда Дев-Ґосва̄мī Маха̄ра̄дж\"],\"verses\":[{\"number\":\"1\",\"text\":[\"джая ‘ґуру-маха̄ра̄джа’ джаті-ра̄джешвара\",\"шрī-бгакті-ракшака дева-ґосва̄мī шрīдгара.\"],\"translation\":[\"Вся слава тобі, о Ґуру Махарадже, імператору серед царів-*санньясі* - славетний Шріла Бгакті Ракшак Дев-Ґосвамі Шрідгар.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"патіта-па̄вана-лīла̄ віста̄рі’ бгуване\",\"ніста̄ріла̄ дīна-хīна а̄па̄мара джане.\"],\"translation\":[\"Ти розгорнув у цьому світі Свої ігри як спаситель грішних душ. Ти визволив усіх стражденних, навіть тих, хто був у безнадійному становищі.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"тома̄ра каруна̄гана мураті херія\",\"преме бга̄ґʼява̄на джīва поде мурачія\"],\"translation\":[\"Коли удачливі душі споглядають твоє святе тіло, сповнене зосередженої милості, вони втрачають свідомість від хвилі божественної любові.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"судīрга супīбʼя дехо дівʼя-бга̄ва̄шрай\",\"дівʼя-ґʼяна дīпта-нетра дівʼя-джйотірмой.\"],\"translation\":[\"Твоя піднесена форма, наповнена божественним настроєм, є нектаром для наших очей. Ти сповнений духовного знання, і твої ясні очі сяють. Ти освітлюєш весь навколишній простір.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"суварна-сӯраджа-ка̄нті аруна-васана\",\"тілака, туласī-ма̄ла̄, чандана-бгӯшана.\"],\"translation\":[\"Вбраний у шафранові шати, прикрашений *тілакою* і намистом із *туласі*, сповнений аромату *сандалу*, ти подібний до золотого Сонця, що велично сяє.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"апӯрва шрī-анґа-шобга̄ коре джгаламала\",\"ауда̄рʼя-унната-бга̄ва ма̄дгурʼя-уджджвала.\"],\"translation\":[\"Неперевершена краса Твоєї святої форми засліплює сяйвом. Твоє милосердя, твоє шляхетне, благородне серце сяє, немов мʼяке світло місяця в солодкій любові.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"ачінтья-пратібга̄, сніґдга, ґамбгīра, уда̄ра\",\"джада-ґʼяна-ґірі-ваджра дівʼя-дīкша̄дга̄ра.\"],\"translation\":[\"Твій геніальний розум, глибока любов, велич і милосердність — наче грім, що руйнує мирське знання. Ти - глибоке джерело духовного багатства.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"ґаура-санкīртана-ра̄са-расера а̄шрай\",\"“даяла ніта̄і” на̄ме нітья премамой.\"],\"translation\":[\"У танку Золотого Господа ти занурюєшся в духовну радість. «Даял Нітай, Даял Нітай!» — ти завжди ніжно й палко вигукуєш це Імʼя.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"са̄нґопа̄нґе ґаура-дга̄ме нітья-парака̄шя\",\"ґупта-ґовардгане дівʼя-лīла̄ра-віла̄са.\"],\"translation\":[\"Своєю солодкою волею ти вічно перебуваєш у Навадвіп-*дгамі* поруч зі своїми супутниками. І там разом ви радісно проводите свої святі *ліли* на прихованому пагорбі Ґовардган.\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"ґаудīя-а̄ча̄рʼя-ґоштхī-ґаурава-бга̄джана\",\"ґаудīя-сіддга̄нтамані кантха-вібгушана.\"],\"translation\":[\"Ти є гідним носієм слави в зібранні *ґаудія-ачарʼїв*. Дорогоцінний камінь *ґаудія-сіддганти* почесно сяє на твоїх грудях.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"ґаура-сарасватī-спхӯрта сіддга̄нтера кхані\",\"а̄вішкрита ґа̄ятрīра артха-чінта̄мані.\"],\"translation\":[\"Ти — живе послання Шрі Ґаури, ти — скарбниця досконалих висновків. Ти відкрив внутрішнє значення Ґаятрі, яке, наче коштовний камінь *чінтамані*, сповнює всі найвищі прагнення.\"],\"isLong\":false},{\"number\":\"12\",\"text\":[\"ека-таттва варнанете нітья-нава-бга̄ва\",\"сусанґаті, са̄маньджасья, е саба прабга̄ва.\"],\"translation\":[\"Коли ти пояснюєш певну тему, вона щоразу розкривається в новому світлі. Правильний настрій і гармонія у всьому - твої невідʼємні духовні якості.\"],\"isLong\":false},{\"number\":\"13\",\"text\":[\"тома̄ра сатīртха-варґа сабе ека-мате\",\"рӯпа-сарасватī-дга̄ра̄ декхена тома̄те.\"],\"translation\":[\"Усі твої духовні брати одноголосно заявляють, що бачать у тобі продовження лінії вчення Рупи Ґосвамі та Сарасваті Тхакура.\"],\"isLong\":false},{\"number\":\"14\",\"text\":[\"туласī-ма̄ліка̄-хасте шрī-на̄ма-ґрахана\",\"декхі’ сакалера хой ‘прабгу’ уддīпана.\"],\"translation\":[\"Кожен, хто бачить, як ти повторюєш Святе Імʼя з вервицею *туласі* в руці, мимоволі згадує образ Сарасваті Тхакура.\"],\"isLong\":false},{\"number\":\"15\",\"text\":[\"котī-чандра-сушітала о пада бгараса̄\",\"ґа̄ндгарва̄-ґовінда-лīла̄мрита-ла̄бга-а̄шя.\"],\"translation\":[\"Твої стопи дарують прохолоду, наче десять мільйонів місяців, - у служіння їм я вкладаю всю свою віру. Одного дня, за твоєї милості, ми зможемо пити нектар ігор Радги-Ґовінди.\"],\"isLong\":false},{\"number\":\"16\",\"text\":[\"авічінтья-бгеда̄бгеда-сіддга̄нта-прака̄шя\",\"са̄нанде а̄раті стуті коре дīна-да̄са.\"],\"translation\":[\"О втілення довершених висновків про незбагненну єдність і відмінність! Я співаю цю молитву під час твого *араті* з радістю в серці, як твій смиренний слуга.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-sri-guru-arati\"},{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-jaya-guru\"},{\"title\":{\"en\":\"Srila B.K. Ashram Maharaj\",\"ru\":
