],\"subtitle\":[\"Песня 2\"],\"verses\":[{\"number\":\"1\",\"text\":[\"вираджа̄р па̄ре ш́уддха-паравйома-дха̄м\",\"тад упари ш́рӣ-гокула-вр̣нда̄ран̣йа на̄м\"],\"translation\":[\"Выше реки Вираджа простирается лучезарное духовное небо, а над этим царством Вайкунтхи находится божественная обитель, известная как Шри Голока Вриндавана.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"вр̣нда̄вана чинта̄ман̣и,    чид-а̄нанда-ратна-кхани,\",\"    чинмой апӯрва-дараш́ан\",\"та̐хи ма̄джхе чаматка̄р,    кр̣ш̣н̣а ванаспати са̄р,\",\"    нӣла-ман̣и тама̄ла джемон\"],\"translation\":[\"Земля Вриндавана состоит из духовных драгоценных камней. Она подобна залежам обладающих сознанием, пребывающих в блаженстве драгоценностей. Это трансцендентная, исполненная сознания обитель представляет собой удивительное и необычное зрелище! И самое удивительное здесь — присутствие Господа Кришны! Его сравнивают с деревом *тамал*, царем деревьев, цвет которого подобен цвету темного сапфира.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"та̄хе эка сварна-майӣ,    лата̄ сарва-дха̄ма-джайӣ,\",\"    утхийа̄чхе парама-па̄ванӣ\",\"хла̄динӣ-ш́актир са̄р,    ‘маха̄бха̄ва’ на̄м джа̄р,\",\"    трибхувана-мохана-мохинӣ\"],\"translation\":[\"Обвиваясь вокруг этого темного дерева, возникла прекрасная золотая лиана, завоевательница всех царств, очищающая все и вся. Ее зовут Махабхава, Она — сущность высшей, дающей наслаждение энергии *хладини*. Она пленяет Шри Кришну — Того, Кто сам очаровывает все три мира!\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"ра̄дха̄-на̄ме паричита,    туш̣ийа̄ говинда-чита,\",\"    вира̄джайе парама а̄нанде\",\"сеи лата̄-патра-пхул,    лалита̄ди сакхӣ-кул,\",\"    собе мили’ вр̣кш̣е др̣д̣ха ба̄ндхе\"],\"translation\":[\"Известная под именем Радха, Она вечно сияет в той обители, пребывая в великом экстазе. Она всегда заботится о том, как порадовать Говинду. Листья и цветы этой лианы — Ее подружки, возглавляемые Лалитой. Она и Ее подружки крепко оплетают это темное дерево.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"лата̄ра параш́е прапхулла тама̄л\",\"лата̄ чха̄д̣и’ на̄хи рохе коно ка̄л\"],\"translation\":[\"От прикосновения лианы дерево Тамал расцветает. Без объятий этой лианы Оно не может продолжать существование.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"тама̄ла чхад̣ийа̄ лата̄ на̄хи ба̄̐че\",\"се лата̄ милан сада̄-ка̄ла джа̄че\"],\"translation\":[\"У лианы никогда не возникает желания оставить дерево Тамал. Лиана всегда жаждет единения с Ним!\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"бхакативинода милана до̐ха̄р\",\"на̄ ча̄хе кокхона вина̄ кичху а̄р\"],\"translation\":[\"Никакого иного желания, кроме встречи этих Двоих, у Бхактивинода нет.\"],\"isLong\":false}],\"embeds\":[{\"title\":\"Шрила Шридхар Махарадж\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/sridhar-maharaj-and-govinda-1\",\"iframe_url\":\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fsridhar-maharaj-and-govinda-1\",\"embed_code\":\"\u003ciframe width=\\\"100%\\\" height=\\\"20\\\" scrolling=\\\"no\\\" frameborder=\\\"no\\\" allow=\\\"autoplay\\\" src=\\\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fsridhar-maharaj-and-govinda-1\\\"\u003e\u003c/iframe\u003e\"}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.R. Sridhar Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.Р. Шридхар Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.Р. Шрідгар Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/sridhar-maharaj-and-govinda-1\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1a:[\"$\",\"$L22\",null,{\"audio\":\"$19:props:song:resources:audio\",\"caption\":\"Слушать аудио:\",\"language\":\"ru\"}]\n1b:[\"$\",\"$L23\",null,{\"navMap\":{\"197\":{\"prev\":{\"path\":\"/ru/radhika-charana-padma-sakala-shreyera/\",\"title\":\"Шри Р
