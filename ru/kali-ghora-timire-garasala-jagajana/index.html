song\":{\"meta\":{\"page\":124,\"first_line\":\"кали-гхора тимире гарасала джагаджана\"},\"title\":[\"Кали-гхора тимире\"],\"author\":[\"Ш́рӣла Найана̄нанда Да̄с\"],\"verses\":[{\"number\":\"1\",\"text\":[\"кали-гхора тимире    гарасала джагаджана\",\"    дхарама карама баху-дӯра\",\"аса̄дхане чинта̄ман̣и    видхи мила̄ола а̄ни\",\"    гора̄ бод̣о дойа̄ла т̣ха̄кура\"],\"translation\":[\"Люди этого мира поглощены непроглядной тьмой века Кали и не склонны совершать благие поступки. Они безразличны к трансцендентному богатству, которое им предложил всемилостивый Господь Гаура.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"бха̄и ре бха̄и!    гора̄ гун̣а кохоне на джа̄йа\",\"кото ш́ата-а̄нана    кото чатур-а̄нана\",\"    борон̣ийа ора на̄хи па̄йа\"],\"translation\":[\"«Мой брат! Мой брат! Никто не рассказал тебе о славе Господа Гауры. Каково величие Господа Брахмы? Насколько велик Господь Шеша? Они не могут затмить величие Господа Гауры!»\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"чари веда ш̣ад̣-дара-    ш́ана кори адхйайана\",\"    се джади гаура̄н̇га на̄хи бхадже\",\"вр̣тха̄ та̄ра адхйайана    лочана вихӣна джана\",\"    дарпан̣е андхе киба̄ ка̄дже\"],\"translation\":[\"«Какая польза от четырех Вед и шести философских систем, если не поклоняться Господу Гауранге? Зачем их изучать? Какой прок от зеркала для слепого?»\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"веда видйа̄ дуи    кичхуи на̄ джа̄ната\",\"    се джади гаура̄н̇га джа̄не са̄ра\",\"найана̄нанда бхоне    сеи то сакали джа̄не\",\"    варва-сиддхи каратале та̄ра\"],\"translation\":[\"«Если кому-то известны два вида ведического знания, он все еще ничего не знает. Но если кто-то знает Господа Гаурангу, то он обладает самым большим знанием!» Наянананда говорит: «Такой человек знает все. Он обладает всеми совершенствами».\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шрі
