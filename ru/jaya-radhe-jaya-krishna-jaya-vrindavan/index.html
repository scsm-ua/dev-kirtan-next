l\":\"Показывать стихи / перевод\",\"song\":{\"meta\":{\"page\":206,\"first_line\":\"джайа ра̄дхе, джайа кр̣ш̣н̣а, джайа вр̣нда̄ван\"},\"title\":[\"Шри Враджа-дхама-махимамрта\"],\"author\":[\"Ш́рӣла Кришнада̄с Кавира̄дж Госва̄мӣ\"],\"verses\":[{\"number\":\"1\",\"text\":[\"джайа ра̄дхе, джайа кр̣ш̣н̣а, джайа вр̣нда̄ван\",\"ш́ри-говинда, гопӣна̄тха, мадана-мохан\"],\"translation\":[\"Слава Радхе, Кришне и божественному лесу Вриндавана! Слава трем главным Божествам Вриндавана: Шри Говинде, Гопинатху и Мадана-Мохану!\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"ш́йа̄ма-кун̣д̣а, ра̄дха̄-кун̣д̣а, гири говардхан\",\"ка̄линдӣ джамуна̄ джайа, джайа маха̄ван\"],\"translation\":[\"Слава Шьяма-кунде, Радха-кунде, холму Говардхану и реке Ямуне (Калинде)! Слава великому лесу, известному как Махаван, где Кришна и Баларама забавлялись в детстве!\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"кеш́ӣ-гха̄т̣а, бам̇ш́и-ват̣а, два̄даш́а ка̄нан\",\"джа̄̐ха̄ саба лӣла̄ коило ш́ри-нанда-нандан\"],\"translation\":[\"Слава Кеши-гхату, где Кришна убил демона Кеши! Слава дереву Вамши-вата, куда пришли *гопи*, плененные звуком флейты Кришны! Слава двенадцати лесам Враджи! Там сын Нанды, Шри Кришна, проводил Свои игры.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"ш́рӣ-нанда-джаш́ода̄ джайа, джайа гопа-ган̣\",\"ш́рӣда̄ма̄ди джайа, джайа дхену-ватса-ган̣\"],\"translation\":[\"Слава божественным отцу и матери Кришны, Нанде и Яшоде! Слава мальчикам-пастушкам, во главе со Шридамом, старшим братом Шримати Радхарани и Ананги Манджари! Слава коровам и телятам Враджи!\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"джайа вр̣ш̣амбха̄ну, джайа кӣртида̄ сундарӣ\",\"джайа паурн̣ама̄сӣ, джайа а̄бхӣра-на̄гарӣ\"],\"translation\":[\"Слава божественным отцу и матери Радхи, Вришабхану и прекрасной Киртиде! Слава Паурнамаси, матери Сандипани Муни, бабушке Мадхумангала и Нандимукхи, и возлюбленной ученице Деварши Нарады! Слава юным девушкам-пастушкам Враджи!\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"джайа джайа гопеш́вара вр̣нда̄вана-ма̄джх\",\"джайа джайа кр̣ш̣на-сакха̄ бат̣у двиджа-ра̄дж\"],\"translation\":[\"Слава, слава Гопишвару Шиве, который пребывает во Вриндаване, чтобы защитить святую Дхаму! Слава, слава забавному *брахману*, другу Кришны, Мадхумангалу!\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"джайа ра̄ма-гха̄т̣а, джайа рохин̣ӣ-нандан\",\"джайа джайа вр̣нда̄вана-ба̄сӣ джата джон\"],\"translation\":[\"Слава Рама-гхате, где Господь Баларама совершал Свой танец *раса! * Слава Господу Балараме, сыну Рохини! Слава, слава всем жителям Вриндавана!\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"джайа двиджа-патнӣ, джайа на̄га-конйа̄-гон̣\",\"бхактите джа̄̐ха̄ра̄ па̄ило говинда-чаран̣\"],\"translation\":[\"Слава женам гордых ведических *брахманов! * Слава женам змея Калия! Благодаря чистой преданности они обрели прибежище лотосоподобных стоп Господа Говинды.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"ш́рӣ-ра̄са-ман̣д̣ала джайа, джайа ра̄дха̄-ш́йа̄м\",\"джайа джайа ра̄са лӣла̄ сарва-манорам\"],\"translation\":[\"Слава тому месту, где совершался танец *раса* Шри Кришны! Слава Радхе и Шьяму! Слава, слава божественному танцу *раса*, прекраснейшей из всех игр Господа Кришны!\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"джайа джайоджвала-раса сарва-раса-са̄р\",\"паракийа̄-бха̄ве джа̄ха̄ браджете прача̄р\"],\"translation\":[\"Слава, слава вкусу супружеской любви, сладчайшей из всех *рас* и распространяющейся во Врадже Шри Кришной в форме божественной *паракия-бхавы* (внебрачных любовных отношений)!\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"ш́рӣ-джа̄хнава̄-па̄да-падма корийа̄ смаран̣\",\"дӣна кр̣ш̣нада̄са кохе на̄ма-сан̇кӣртан\"],\"translation\":[\"Всегда помня о лотосоподобных стопах супруги Господа Нитьянанды, Шри Джахнавы Деви, этот падший и недостойный слуга Кришны поет *санкиртану* Святого Имени!\"],\"isLong\":false}],\"embeds\":[{\"title\":\"Шрила Говинда Махарадж\",\"embed_url\":\"https://soundcloud.com/bhar
