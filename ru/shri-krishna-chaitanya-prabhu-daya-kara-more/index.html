 повелители Шри Сварупа Дамодар, Шри Санатана, Шри Рупа и Шри Рагхунатх, Шри Рагхунатх Бхатта и Шри Гопал Бхатта! Мой владыка Шри Локанатх Госвами!\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"дойа̄ коро ш́рӣ-а̄ча̄рйа прабху ш́рӣнива̄са\",\"ра̄мачандра-сан̇га ма̄ге нароттама да̄са\"],\"translation\":[\"Молю, одари своими благословениями, мой господин Шри Шринивас Ачарья! Нароттам молит о том, чтобы быть рядом со Шри Рамачандрой Чакраварти.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"(дойа̄ коро прабхупа̄да ш́ри гаура прака̄ш́а)\",\"(тава джана кр̣па̄ ма̄ге эи адхама да̄са)\"],\"translation\":[\"Молю, даруй свои благословения, Шрила Прабхупада Сарасвати Тхакур, проявление Шри Гауры! Я падший слуга и прошу о милости твоих спутников!\"],\"isLong\":false},{\"text\":[\"(джайа гаурахари)\",\"(нита̄и гаура харибол)\"],\"isLong\":false}],\"embeds\":[{\"title\":\"Шрила Говинда Махарадж\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-savarana-sri\",\"iframe_url\":\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fgovinda-maharaj-savarana-sri\",\"embed_code\":\"\u003ciframe width=\\\"100%\\\" height=\\\"20\\\" scrolling=\\\"no\\\" frameborder=\\\"no\\\" allow=\\\"autoplay\\\" src=\\\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fgovinda-maharaj-savarana-sri\\\"\u003e\u003c/iframe\u003e\"},{\"title\":\"Шрила Госвами Махарадж\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/goswami-maharaj-sri-krsna\",\"iframe_url\":\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fgoswami-maharaj-sri-krsna\",\"embed_code\":\"\u003ciframe width=\\\"100%\\\" height=\\\"20\\\" scrolling=\\\"no\\\" frameborder=\\\"no\\\" allow=\\\"autoplay\\\" src=\\\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fgoswami-maharaj-sri-krsna\\\"\u003e\u003c/iframe\u003e\"},{\"title\":\"Навадвип Дхам\",\"embed_url\":\"https://s
