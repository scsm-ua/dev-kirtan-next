",\"$L26\"]}]]}],\"$L27\"]}],\"$L28\",\"$L29\",\"$L2a\"]}]]}]\n"])</script><script>self.__next_f.push([1,"2b:I[7590,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-27f69c9fe0182b3b.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"default\"]\n2c:I[6402,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-27f69c9fe0182b3b.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"default\"]\n2d:I[5224,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-27f69c9fe0182b3b.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"default\"]\n2e:I[4423,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-27f69c9fe0182b3b.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"default\"]\n30:I[9181,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-27f69c9fe0182b3b.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"default\"]\n31:I[9508,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-27f69c9fe0182b3b.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"GoogleAnalytics\"]\n32:I[8550,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-27f69c9fe0182b3b.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"ServiceWorkerRegistration\"]\n33:I[3680,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-27f69c9fe0182b3b.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"default\"]\n1e:[\"$\",\"$L1d\",\"en-pe\",{\"description\":{\"title\":\"Pocket Kirtan Guide\",\"subtitle\":\"Nabadwip, 2013\",\"slug\":\"en-pe\",\"language\":\"en\",\"sort_order\":40,\"songsCount\":80},\"href\":\"/en-pe/hari-nama-mahamantra-sarva-mantra-sara/\",\"isActive\":false}]\n1f:[\"$\",\"$L1d\",\"lv\",{\"description\":{\"title\":\"Gaudija Gītandžalī\",\"subtitle\":\"Vaišnavu dziesmas un lūgšanas\",\"slug\":\"lv\",\"sort_order\":50,\"songsCount\":91},\"href\":\"/lv/hari-nama-mahamantra-sarva-mantra-sara/\",\"isActive\":false}]\n20:[\"$\",\"$L1d\",\"ua\",{\"description\":{\"title\":\"Ґаудія Ґітанджалі\",\"subtitle\":\"Вайшнавський пісенник українскою мовою\",\"slug\":\"ua\",\"sort_order\":60,\"language\":\"uk\",\"render\":{\"tg.contents.first_line\":false,\"tg.a-z.title.words\":4},\"songsCount\":69},\"href\":\"/ua/hari-nama-mahamantra-sarva-mantra-sara/\",\"isActive\":false}]\n21:[\"$\",\"$L2b\",null,{\"bookId\":\"ru\",\"telegraphUrl\":\"https://telegra.ph/Dasha-vidha-Namaparadha-02-22\"}]\n22:[\"$undefined\",[\"$\",\"section\",null,{\"className\":\"SongHeader\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"SongHeader__title\",\"children\":[[\"$\",\"div\",\"0\",{\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[false,\"Даша-видха Намапарадха\"]}]]}]]}],null,[[\"$\",\"div\",\"0\",{\"className\":\"SongHeader__subtitle\",\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[false,\"Десять оскорблений Святого Имени\"]}]]}]],[[\"$\",\"div\",\"0\",{\"className\":\"SongHeader__author\",\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[false,[\"$\",\"a\",null,{\"href\":\"/ru/authors/#section-Ш́рӣла Бхакти Сундар Говинда Дев-Госва̄мӣ Маха̄ра̄дж\",\"rel\":\"author\",\"children\":\"(бенгальское стихотворение, составленное Ш́рӣлой Бхакти Сундаром Говиндой Дев-Госва̄мӣ Маха̄ра̄джем)\"}]]}]]}]]]}]]\n"])</script><script>self.__next_f.push([1,"23:[\"$\",\"$L2c\",null,{\"bookId\":\"ru\",\"label\":\"Показывать стихи / перевод\",\"song\":{\"meta\":{\"page\":26,\"author\":\"Ш́рӣла Бхакти Сундар Говинда Дев-Госва̄мӣ Маха̄ра̄дж\",\"first_line\":\"хари-на̄ма маха̄мантра сарва-мантра-са̄ра\"},\"title\":[\"Даша-видха Намапарадха\"],\"author\":[\"(бенгальское стихотворение, составленное Ш́рӣлой Бхакти Сундаром Говиндой Дев-Госва̄мӣ Маха̄ра̄джем)\"],\"subtitle\":[\"Десять оскорблений Святого Имени\"],\"verses\":[{\"number\":\"1\",\"text\":[\"хари-на̄ма маха̄мантра сарва-мантра-са̄ра\",\"джа̄дера корун̣а̄бале джагате прача̄ра\",\"сеи на̄ма-пара̄йан̣ са̄дху, маха̄джана\",\"та̄ха̄дера нинда̄ на̄ корихо када̄чана\"],\"translation\":[\"Харе Кришна *маха-мантра*, лучшая из всех *мантр*. *Садху* в чьих сердцах Святое Имя являет Свои божественные игры (*нама-параяны*), распространяют ее силой своей милости. Эти *махаджаны* (великие души) очень дороги Господу и лищь они связывают нас с Его Святым Именем. Никогда не порицайте их и не отвергайте.\",\"(Первое оскорбление: оскорблять преданных Господа.)\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"враджендранандана кр̣ш̣н̣а сарвеш́вареш́вара\",\"махеш́вара а̄ди та̄ра севана-татпара\",\"на̄ма чинта̄ман̣и кр̣ш̣н̣а-чаитанйа-сварӯпа\",\"бхеда-джн̃а̄на на̄ корибе лӣла̄-гун̣а-рӯпа\"],\"translation\":[\"Враджендра-нандан Кришна — вместилище всех *рас*, вечно юный изначальный облик Всевышнего. Он с упоением наслаждается в Голока Вриндавана Дхаме всеми возможными духовными отношениями (*расами*). Он — всепривлекающий Бог всех Богов (Нараяны, Вишну и прочих), Господь всего и всех (Сарвешварешвара). Все экспансии Господа и все боги, во главе с Господом Шивой (Махешварой), вдохновенно и с великим рвением служат Ему, почитая Его высшим объектом своей преданности (*татпарой*).\",\"Святое Имя Господа — трансцендентный драгоценный камень, исполняющий желания. Оно неотлично от самого Господа Кришны (*на̄ма чинта̄ман̣и кр̣ш̣н̣а-чаитанйа-сварӯпа*), поэтому нельзя считать, что божественные игры, качества и облик Господа (*лӣла̄-гун̣а-рӯпа*) отличны от Его Святого Имени (ибо они являют себя в наших сердцах благодаря Его Святому Имени, что исполняет все наши желания).\",\"Иначе «*на̄ма чинта̄ман̣и кр̣ш̣н̣а-чаитанйа-сварӯпа…*» можно перевести так: Шри Кришна Чайтанья Махапрабху — исключительное явление Господа, неотличное от Святого Имени, Харе Кришна *маха-мантры*. Святое Имя способно исполнить все желания. Не следует думать, что есть разница между Святым Именем, что исполняет желания, самим Махапрабху, и Его формой, качествами и играми. В этих играх Он являет бесконечно упоительную божественную природу Святого Имени и исполняет желания каждого, лично даруя *прему* к Враджендра-нандане Кришне во всех возможных духовных взаимоотношениях (*мадхура-расе* и т. д.) через Свое Святое Имя, что исполняет желания.\",\"(Второе оскорбление: считать богов равными Всевышнему, а также считать Святое Имя, форму, качества и игры Господа отличными от Него.)\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"«гуру кр̣ш̣н̣а-рӯпа хон ш́а̄стрера прама̄н̣е\",\"гуру-рӯпе кр̣ш̣н̣а кр̣па̄ коре бха̄гйава̄не»\",\"се гуруте мартйа-буддхи аваджн̃а̄ди тйаджи\",\"иш̣т̣а-ла̄бха коро, нирантара на̄ма бхаджи\"],\"translation\":[\"Писания («Шри Чайтанья-чаритамрита», Ади-лила, 1.45; «Шримад-Бхагаватам», 11.17.27; и т. д.) утверждают, что Гурудев неотличен от самого Кришны. Представ Гурудевом, Кришна проливает Свою милость на удачливые души. Поэтому надо отвергнуть склонность, порожденную иллюзией, считать Гурудева простым смертным с мирскими устремлениями (*мартья-буддхи*), а также относиться с неуважением (*аваманья*), быть неверным, не повиноваться, презирать (*авагья*), завидовать (*асуя*) и прочее Гурудеву. Напротив, следует понять, что Гурудев – твой господин, о нем следует заботиться и служить ему. Он может исполнить все желания ученика достичь высшей цели (*ишта-лабха — кришна-премы*). С надеждой и верой беспрестанно служи Святому Имени.\",\"(Третье оскорбление: оскорблять Шри Гурудева.)\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"ш́рути, ш́рути-ма̄та̄-саха са̄твата-пура̄н̣а\",\"ш́рӣ-на̄ма-чаран̣а-падма коре нӣра̄джана\",\"сеи ш́рути ш́а̄стра джеба̄ коройе ниндана\",\"се апарадхӣра сан̇га корибе варджана\"],\"translation\":[\"Богоявленная Истина нисходит от Матери Гаятри и достигает своей кульминации в Маха-пуране, «Шримад-Бхагаватам». Эта Истина непрестанно поклоняется (дословно: предлагает *арати*) лотосоподобным стопам Шри Нама Прабху (Святого Имени) своим несущим откровение и просветление знанием о чистой преданности. Всякий, кто хулит любое из писаний богоявленной Истины, посвященных чистой преданности, путем ли прямого поношения, или распространяя противоречащие ей псевдоучения, — оскорбитель. Всегда избегайте его дурного общества.\",\"(Четвертое оскорбление: хулить на писания.)\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"на̄мера махима̄ сарва-ш́а̄стрете ва̄кха̄не\",\"атистути, хено кабху на̄ бха̄виха мане\",\"агастйа, ананта, брахма̄, ш́ива̄ди сатата\",\"дже на̄ма-махима̄-га̄тха̄ сан̇кӣрттана-рата\",\"се на̄ма-махима̄-синдху ке па̄ибе па̄ра\",\"атистути боле джеи — сеи дура̄ча̄ра\"],\"translation\":[\"Все богоявленные писания провозглашают славу Святого Имени. Такие прославления — вовсе не преувеличение (*атистути*). Агастья, Ананта, Брахма, Шива и все самые достойные, лучшие и сильнейшие вечно прославляют от всего сердца Святое Имя в *санкиртане*. Но кто же сможет исчерпать славу Святого Имени, что подобна безграничному океану? Каждый, кто посмел заявить, будто бы слава Святого Имени преувеличена (*атистути*), — грешник и негодяй, лишенный духовной удачи (*сукрити*).\",\"(Пятое оскорбление: считать славу Святого Имени преувеличением.)\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"кр̣ш̣н̣а-на̄ма̄болӣ нитйа голокера дхана\",\"калпита, пра̄кр̣та, бха̄ве — апара̄дхӣ-джана\"],\"translation\":[\"Святые имена Кришны — вечное богатство Голоки Вриндавана, высочайшего уровня духовного мира. Он полон совершенного экстаза, являет себя сам (*адхокшаджа*) и пребывает вне этого мира (*апракрита*). Всякий, кто считает святые имена Кришны плодом воображения (*калпита*) или творением этого мира (*пракрита*), — оскорбитель.\",\"(Шестое оскорбление: считать, что слава Святого Имени материальна или\",\"что она — плод воображения.)\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"на̄ме сарва-па̄па-кш̣айа сарва-ш́а̄стре кайа\",\"са̄ра̄-дина па̄па кори сеи бхараса̄йа —\",\"эмата дурбуддхи джа̄ра сеи апара̄дхӣ\",\"ма̄йа̄-праван̃чита, дух̣кха бхун̃дже ниравадхи\"],\"translation\":[\"Писания всесторонне подтверждают: Святое Имя может уничтожить\",\"всякий грех. Но заблудшие лицемеры (*дурбуддхи*) продолжают грешить\",\"всю жизнь, надеясь на искупительную силу Святого Имени. Они — оскор-\",\"бители, обманутые Майей (лишенные милости Святого Имени), и будут\",\"вечно страдать.\",\"(Седьмое оскорбление: грешить, полагаясь на силу своего, так называе-\",\"мого воспевания Святого Имени.)\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"атулйа ш́рӣ-кр̣ш̣н̣а-на̄ма пӯрн̣а-раса-нидхи\",\"та̄ра сама на̄ бха̄виха ш́убха-карма а̄ди\"],\"translation\":[\"Шри Кришна-Нам — бесподобная сокровищница расы (любви, экстаза, нектара, отношений с Богом и т. д.), неотличная от самого Господа. А Шри Кришна-Нама-*санкиртана* — это лучший способ служить Кришне и удовлетворить Его (т. е. принять то, что уготовано нам Господом). Поэтому повторение Шри Кришна-Нама нельзя считать равным или сравнимым с лишь относительно благими материальными *кармами*, такими как общепринятая религиозность (*дхарма*), соблюдение обетов (*врата*), отречение и покаяние (*тьяга*), религиозные ритуалы и жертвоприношения (*хута*), паломничество, благотворительность, патриотизм и т. д.\",\"(Восьмое оскорбление: считать воспевание Святого Имени равным\",\"благочестивой *карме*.)\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"на̄ме ш́раддха̄-хӣна-джана — видха̄та̄ ва̄н̃чита\",\"та̄ре на̄ма да̄не апара̄дха суниш́чхита\"],\"translation\":[\"Есть люди, кто обмануты провидением и потому лишены веры. Они враждебны к Святому Имени. Наставлять их в служении Святому Имени — конечно же, оскорбление.\",\"(Девятое оскорбление: стремление даровать Святое Имя неверующим.)\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"ш́унийа̄о кр̣ш̣н̣а-на̄ма-ма̄ха̄тмйа апа̄ра\",\"йе прӣти-рахита, сеи нара̄дхама чха̄ра\",\"аллан̇та̄ мамата̄ джа̄ра антаре ба̄хире\",\"ш́уддха кр̣ш̣н̣а-на̄ма та̄ра кабху на̄хи спхуре\"],\"translation\":[\"Тот, кто слышал о безграничной славе Кришна-Нама, но все же остается лишенным любви к Кришна-Наму, — чье сердце не тает от любви к Кришна-Наму, — закоренелая отчужденная падшая душа, нижайший из людей (*нарадхама чхара*). Чистое Святое Имя Кришны (*шуддха-Кришна-Нам*) не явит Себя такой личности, противящейся божественному влиянию Святого Имени, — личности, чьи мысли, слова и поступки внутренне и внешне связаны неисправимой привязанностью к мирской эгоистичной иллюзии «я, мне и мое» (*ахамта мамата*).\",\"(Десятое оскорбление: при воспевании Святого Имени сохранять свои\",\"материалистичные привязанности.)\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"эи даш́а апара̄дха корийа̄ варджана\",\"джена джана коре харина̄ма сан̇кӣрттана\",\"апӯрва ш́рӣ-кр̣ш̣н̣а-према лабхйа та̄ра хой\",\"на̄ма-прабху та̄ра хр̣де нитйа виласай\"],\"translation\":[\"Чистые души, поглощенные Хари-Нама-*санкиртаной*, избегая этих десяти оскорблений Святого Имени, вкушают чудотворный плод Шри Кришна-*премы*, ибо Шри Нам Прабху (личностное, властное и милосердное Святое Имя, неотличное от самого Господа) появляется в их сердцах и вечно являет Свои упоительные форму, качества и игры.\",\"По-другому этот стих можно понять так:\\\\\",\"Те чистые души, что участвуют в собственном процессе Хари-Нама-*санкиртаны* Махапрабху Шри Чайтаньядева, избегая этих десяти оскорблений, вкушают беспрецедентный плод Кришна-*премы*, распространяемый исключительно Махапрабху, ибо Он сам (Нама-Прабху) является в их сердцах и захватывает их Своей божественной упоительной игрой.\"],\"isLong\":false}],\"embeds\":[{\"title\":\"Шрила Мадхусудан Махарадж\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/madhusudan-maharaj-dasa-vidha-namaparadha\",\"iframe_url\":\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fmadhusudan-maharaj-dasa-vidha-namaparadha\",\"embed_code\":\"\u003ciframe width=\\\"100%\\\" height=\\\"20\\\" scrolling=\\\"no\\\" frameborder=\\\"no\\\" allow=\\\"autoplay\\\" src=\\\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fmadhusudan-maharaj-dasa-vidha-namaparadha\\\"\u003e\u003c/iframe\u003e\"}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.R. Madhusudan Maharaj\",\"ru\":\"Шрила Б.Р. Мадхусудан Махарадж\",\"ua\":\"Шріла Б.Р. Мадгусудан Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/madhusudan-maharaj-dasa-vidha-namaparadha\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"24:[\"$\",\"$L2d\",null,{\"audio\":\"$23:props:song:resources:audio\",\"caption\":\"Слушать аудио:\",\"language\":\"ru\"}]\n25:[\"$\",\"$L2e\",null,{\"navMap\":{\"26\":{\"prev\":{\"path\":\"/ru/hare-krishna-hare-krishna-krishna-krishna-hare-hare/\",\"title\":\"Харе Кршна маха-мантра\"},\"next\":{\"path\":\"/ru/jaya-jaya-girirajer-arati-vishiala/\",\"title\":\"Гупта Говардхан Арати\"}}}}]\n2f:T13fd,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"alternateName\":[\"Kirtan Guide\",\"Vaishnava Son
