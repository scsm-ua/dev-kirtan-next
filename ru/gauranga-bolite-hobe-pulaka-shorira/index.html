Long\":false},{\"number\":\"3\",\"text\":[\"биш̣ойа чха̄д̣ийа̄ кабе ш́уддха ха’бе мана\",\"кабе ха̄ма херабо ш́рӣ-вр̣нда̄вана\"],\"translation\":[\"Когда же мой ум полностью очистится, отвергнув мирские страсти? Когда я достигну Вриндаван Дхамы?\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"рӯпа-рагхуна̄тха-паде хоибе а̄кути\",\"кабе ха̄ма буджхабо се джугала-пирӣти\"],\"translation\":[\"Когда же у меня появится страстное желание следовать по стопам Шри Рупы и Шри Рагхунатха? Когда я пойму любовные деяния Божественной Четы?\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"рӯпа-рагхуна̄тха-паде раху мора а̄ш́а\",\"пра̄ртхана̄ коройе сада̄ нароттама-да̄са\"],\"translation\":[\"Единственное, к чему я стремлюсь, — достичь лотосоподобных стоп Шри Рупы и Шри Рагхунатхи! Нароттам Дас непрерывно обращается к ним с этой молитвой.\"],\"isLong\":false}],\"embeds\":[{\"title\":\"Каракас Дхам\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/shchsm-karakas-gauranga-bolite\",\"iframe_url\":\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fshchsm-karakas-gauranga-bolite\",\"embed_code\":\"\u003ciframe width=\\\"100%\\\" height=\\\"20\\\" scrolling=\\\"no\\\" frameborder=\\\"no\\\" allow=\\\"autoplay\\\" src=\\\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fshchsm-karakas-gauranga-bolite\\\"\u003e\u003c/iframe\u003e\"}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Caracas temple\",\"ru\":\"Храм г.Каракас\",\"ua\":\"Храм м.Каракас\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/shchsm-karakas-gauranga-bolite\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"$L25\",null,{\"audio\":\"$1b:props:song:resources:audio\",\"caption\":\"Слушать аудио:\",\"language\":\"ru\"}]\n1d:[\"$\",\"$L26\",null,{\"navMap\":{\"129\":{\"prev\":{\"path\":\"/ru/vimala-hemajin-t
