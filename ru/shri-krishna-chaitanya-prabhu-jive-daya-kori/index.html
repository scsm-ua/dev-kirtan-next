чтобы щедро раздать столь редкую божественную любовь, проповедуя исключительное самопредание, суть самой жизни преданных!\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"даинйа, а̄тманиведана, гоптр̣тве варан̣а\",\"‘аваш́йа ракш̣ибе кр̣ш̣н̣а’ — виш́ва̄са па̄лана\"],\"translation\":[\"Смирение, самоотдача, вручение себя воле Бога, поддержание веры в то, что Кришна непременно защитит.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"бхакти-анукӯла ма̄тра ка̄рджера свӣка̄ра\",\"бхакти-пратикӯла бха̄ва — варджана̄н̇гӣка̄ра\"],\"translation\":[\"Принятие деятельности, благоприятствующей развитию преданности Богу, и отвержение всего, что не благоприятствует ей.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"ш̣ад̣-ан̇га ш́аран̣а̄гати хаибе джа̄̐н̇ха̄ра\",\"та̄̐ха̄ра пра̄ртхана̄ ш́уне ш́рӣ-нандакума̄ра\"],\"translation\":[\"Молитвы тех, кто вручает себя Господу этими шестью способами, несомненно, будут услышаны божественным сыном Нанды!\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"рӯпа-сана̄тана-паде данте тр̣н̣а кори’\",\"бхакативинода под̣е дуи пада дхори’\"],\"translation\":[\"Зажав в зубах травинку и припадая к стопам Шри Рупы и Шри Санатаны, Шри Бхактивинод смиренно обнимает их святые лотосоподобные стопы.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"ка̄̐дийа̄ ка̄̐дийа̄ бале, а̄ми то’ адхама\",\"ш́икха̄йе ш́аран̣а̄гати корохе уттама\"],\"translation\":[\"Плача и рыдая, я обращаюсь к ним: «Я самый падший! Молю, научите меня самопреданию, научите меня чистой преданности!»\"],\"isLong\":false},{\"text\":[\"(джайа гаурахари)\",\"(нита̄и гаура харибол)\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"20:[\"$\",\"$L28\",null,{\"navMap\":{\"50\":{\"prev\":{\"path\":\"/ru/samsara-davanala-lidha-loka/\",\"title\":\"Шри Шри Гурваштака\"},\"next\":{\"path\":\"/ru/bhaja-re-bhaja-re-amar-mana-ati-manda/\",\"title\":\"Бхаджан
