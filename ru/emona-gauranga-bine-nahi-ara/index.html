на гаура̄н̇га бине на̄хи а̄ра\",\"хено авата̄ра    хабе ки хойечхе\",\"    хено према парачара\"],\"translation\":[\"Нет никого, кто мог бы сравниться с Господом Гаурангой! Низойдет ли когда-нибудь воплощение Бога, подобное Ему, и сможет ли проповедовать упоительную любовь к Богу так, как Он?\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"дурамати ати    патита па̄ш̣ан̣д̣ӣ\",\"    пра̄н̣е на̄ ма̄рило коре\",\"харина̄ма дийе    хр̣дойа ш́одхило\",\"    джачи гийа гхоре гхоре\"],\"translation\":[\"Он не сражался со злонамеренными богохульниками, а ходил от дома к дому, навещая людей, и просил их воспевать святые имена Господа Кришны. Он открывал им святые имена и очищал их сердца.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"бхава бирин̃чира    ва̄н̃чхито дже према\",\"    джагата пхелило д̣ха̄ли\",\"ка̄н̇га̄ле па̄ийа̄    кха̄-ило на̄чийе\",\"    ба̄джа̄ийе карата̄ли\"],\"translation\":[\"Он со всей щедростью раздавал миру редкий дар упоительной любви к Богу — дар, который даже Брахма и Шива обретают с большим трудом. Принимая этот дар, люди этого мира танцевали и хлопали в ладоши.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"ха̄сийе ка̄̐дийе    преме гад̣а̄гад̣и\",\"    пулаке бйа̄пило ан̇га\",\"чан̣д̣а̄ле бра̄хман̣е    коре кола̄кули\",\"    кобе ба̄ чхило э ран̇га\"],\"translation\":[\"Они смеялись и плакали. Охваченные экстазом, они катались по земле, а волосы на их телах становились дыбом. *Брахманы* обнимались с *чандалами*. Все переживали великое блаженство!\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"д̣а̄кийе ха̄̐кийе    кхол карата̄ле\",\"    га̄ийе дха̄ийе пхире\",\"декхийа̄ ш́амана    тара̄са па̄ийе\",\"    капа̄т̣а ха̄нило два̄ре\"],\"translation\":[\"Они громко воспевали святые имена, играя на *мридангах* и *караталах*. Люди пели и танцевали, становясь в круг. Увидев это, Ямарадж, повелитель смерти, в испуге побежал, стуча в двери людей, ища приюта.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"э тина бхувана    а̄нанде бхорило\",\"    ут̣хило ман̇гала сора\",\"кохе премананда    эмона гаура̄н̇га\",\"    рати на джанмило мора\"],\"translation\":[\"Повсюду царила радостная суматоха. Все три мира затопило блаженство. Премананда говорит: «Увы! Во мне не пробудилась любовь к Господу Гауранге».\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1b:[\"$\",\"$L23\",null,{\"navMap\":{\"126\":{\"prev\":{\"path\":\"/ru/jadi-gaura-na-hoto-tobe-ki-hoito/\",\"title\":\"Джади Гаура на хо’то\"},\"next\":{\"path\":\"/ru/ke-jabi-ke-jabi-bhai-bhava-sindhu-para/\",\"title\":\"Ке джаби ке джаби\"}}}}]\n24:Tdc9,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"description\":\"A digital Vaishnava songbook with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPage\",\"@id\":\"https://dev.kirtan.site/ru/emona-gauranga-bine-nahi-ara/\",\"url\":\"https://dev.kirtan.site/ru/emona-gauranga-bine-nahi-ara/\",\"name\":\"Эмона Гауранга бине нахи ара. Ш́рӣла Према̄нанда Да̄с\",\"inLanguage\":\"ru\",\"description\":\"Эмона Гауранга бине нахи ара — вайшнавская песня с текстом, русским переводом и пословным разбором. Автор — Ш́рӣла Према̄нанда Да̄с. Из сборника «Гаудия Гитанджали».\",\"breadcrumb\":{\"@id\":\"https://dev.kirtan.site/ru/emona-gauranga-bine-nahi-ara/#breadcrumb\"},\"mainEntity\":{\"@id\":\"https://dev.kirtan.site/ru/emona-gauranga-bine-nahi-ara/#composition\"},\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"}},{\"@type\":\"BreadcrumbList\",\"@id\":\"https://dev.kirtan.si
