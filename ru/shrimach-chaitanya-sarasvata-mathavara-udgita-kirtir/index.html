rt_order\":6,\"language\":\"uk\",\"render\":{\"tg.contents.first_line\":false,\"tg.a-z.title.words\":4},\"songsCount\":74},{\"title\":\"Kirtan Guide\",\"subtitle\":\"Chiang Mai English Edition, 2022\",\"slug\":\"en-2022\",\"sort_order\":7,\"hidden\":false,\"is_legacy\":{\"show_micro_thumbnail_on_main\":true},\"songsCount\":166}],\"nav\":{\"_\":{\"prev\":{\"path\":\"/ru/intro/\",\"title\":\"Введение\"},\"next\":{\"path\":\"/ru/gayatri-muralishta-kirtana-dhanam/\",\"title\":\"Лого Шри Чайтанья Сарасват Матха\"}}},\"song\":{\"meta\":{\"author\":\"Ш́рӣла Бхакти Ракш̣ак Ш́рӣдхар Дев-Госва̄мӣ Маха̄ра̄дж\",\"first_line\":\"ш́рӣмач-чаитанйа-са̄расвата-мат̣хавара-удгӣта-кӣртир\"},\"title\":[\"Слава Шри Чайтанья Сарасват Матха\"],\"author\":[\"Написано Шрилой Бхакти Ракшаком Шридхаром Дев-Госвами Махараджем в 1941 году, в то время, когда он жил в хижине на берегу Ганги.\"],\"verses\":[{\"text\":[\"ш́рӣмач-чаитанйа-са̄расвата-мат̣хавара-\",\"    удгӣта-кӣртир джайа-ш́рӣм\",\"бибхрат самбха̄ти ган̇га̄-тат̣а-никата-\",\"    навадвӣпа-кола̄дри-ра̄дже\",\"йатра ш́рӣ-гаура-са̄расвата-мата-нирата̄-\",\"    гаура-га̄тха̄-гр̣н̣анти\",\"нитйам̇ рӯпа̄нуга ш́рӣ-кр̣тамати-\",\"    гуру-гаура̄н̇га-ра̄дха̄-джита̄ш́а̄\"],\"translation\":[\"В священной обители, состоящей из трансцендентных философских камней, в Шри Навадвип Дхаме, которая является абсолютно неотличной от Шри Вриндавана, на земле Коладвипы, чьей внутренней сущностью является царь гор Шри Говардхан, возле очаровательных берегов священной реки Бхагиратхи, освобождающей все падшие души, возвышается этот величественный и прославленный царь всех храмов — Шри Чайтанья Сарасват Матх!\",\"В этом прекрасном месте преданные, всецело посвятившие себя Богу, вечно погружены в исполненное любви служение божественному повелителю — Золотому Господу Гауранге, Господу Шри Говиндасундару с Его супругой Шримати Гандхарвой и всем Их возлюбленным спутникам. Послание Шри Гауры — сама жизнь этих преданных!\",\"С сердцами, исполненными благой надежды на обретение милости Господа, с великой верой следуя учению Шри Шри Рупы и Рагхунатхи, которые являются хранителями бесконечной сокровищницы чистой и сладостной божественной любви, эти полностью предавшиеся души постоянно воспевают бесконечную славу трансцендентного Имени и качеств наиболее великодушного изначального Верховного Господа Шри Гаурасундара!\",\"Приняв прибежище под успокоительной и полной любви сенью Шри Чайтанья Сарасват Матха, все живые существа обретают благословение и от всего сердца песнями возвещают миру о его безграничной славе. Высоко поднимая знамя божественных благословений, Шри Чайтанья Сарасват Матх ослепительно ярко сверкает во всем своем несравненном величии!\"],\"isLong\":false}],\"resources\":{\"image\":{\"src\":\"/images/resources/en/13.jpg\",\"type\":\"image/jpeg\",\"width\":765,\"height\":1313,\"length\":165151}},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false},\"telegraphUrl\":\"https://telegra.ph/Slava-SHri-CHajtanya-Sarasvat-Matha-02-22\"},\"head\":{\"canonical\":\"/ru/shrimach-chaitanya-sarasvata-mathavara-udgita-kirtir/\",\"description\":\"Слава Шри Чайтанья Сарасват Матха — вайшнавская песня с текстом, русским переводом и пословным разбором. Автор — Ш́рӣла Бхакти Ракш̣ак Ш́рӣдхар Дев-Госва̄мӣ Маха̄ра̄дж. Из сборника «Гаудия Гитанджали».\",\"title\":\"Слава Шри Чайтанья Сарасват Матха. Написано Шрилой Бхакти Ракшаком Шридхаром Дев-Госвами Махараджем в 1941 году, в то время, когда он жил в хижине на берегу Ганги. | Kirtan Site\"},\"kind\":\"song\",\"route\":{\"kind\":\"item\",\"bookId\":\"ru\",\"slug\":\"shrimach-chaitanya-sarasvata-mathavara-udgita-kirtir\"}}}]}]]}]\n"])</script></body></html>
