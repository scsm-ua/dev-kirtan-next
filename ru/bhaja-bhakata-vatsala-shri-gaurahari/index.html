 со старшим братом Кришны, Шри Баладевой.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"ш́укта̄-ш́а̄ка̄ди бха̄джи на̄лита̄ куш̣ма̄н̣д̣а\",\"д̣а̄ли д̣а̄лна̄ дугдха-тумбӣ дадхи моча̄-гхан̣т̣а\"],\"translation\":[\"Их ждут разнообразные угощения: *шукту* и зелень сменяют аппетитные жареные блюда и салат из зеленых листьев *джута*. Затем следуют тыква, фрукты, маленькие квадратные лепешки из чечевицы со сгущенным молоком, йогурт, молочные каши и овощные блюда из цветов бананового дерева.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"мудга-бод̣а̄ ма̄ш̣а-бод̣а̄ рот̣ика̄ гхр̣та̄нна\",\"ш́аш̣кулӣ пиш̣т̣ака кш̣ӣр пули па̄йаса̄нна\"],\"translation\":[\"Им подают квадратные пирожки из *мунг-дала* и *урад-дала*, *чапати* и рис с *гхи*. Потом следуют сладости, приготовленные из молока, сахара и кунжута, а также рисовые лепешки, топленое молоко, печенье, вымоченное в молоке, и сладкий рис.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"карпӯра амр̣та — келӣ рамбха̄ кш̣ӣра-са̄ра\",\"амр̣та раса̄ла̄, амла два̄даш́а прака̄ра\"],\"translation\":[\"Сладкий рис по вкусу подобен нектару потому, что в него добавлена камфара. Им подают бананы и ароматный, вкусный сыр, двенадцать видов кисломолочных продуктов, приготовленных с тамариндом, лаймом, лимоном, апельсином и гранатом.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"лучи чини сарпурӣ ла̄д̣д̣у раса̄балӣ\",\"бходжана корена кр̣ш̣н̣а хо’йе кутӯхали\"],\"translation\":[\"Эти блюда сменяют *пури* из белой муки с сахаром, *пури* со взбитыми сливками, *ладду* и пирожки из *дала*, сваренные в сладком рисе. Кришна с наслаждением вкушает эти угощения.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"ра̄дхика̄ра пакка анна вивидха бйан̃джана\",\"парама а̄нанде кр̣ш̣н̣а корена бходжана\"],\"translation\":[\"С великим удовольствием Кришна ест рис, овощи с карри, сладости и печенье, приготовленные Шримати Радхарани.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"чхоле-боле ла̄д̣д̣у кха̄й ш́рӣ-мадхуман̇гала\",\"багала ба̄джа̄й а̄ра дейа хари-боло\"],\"translation\":[\"Забавный друг Кришны *брахман* Мадхумангал, обожающий *ладду*, стремится заполучить его всеми правдами и неправдами. Он ест *ладду* и кричит: «Харибол! Харибол!», а потом издает смешные звуки, хлопая руками у себя подмышками.\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"ра̄дхика̄ди ган̣е хери’ найанера коне\",\"тр̣пта хо’йе кха̄й кр̣ш̣н̣а джаш́ода̄-бхаване\"],\"translation\":[\"Незаметно подглядывая за Радхарани и Ее подружками *гопи*, Кришна с удовольствием обедает в доме матери Яшоды.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"бходжана̄нте пийе кр̣ш̣н̣а суба̄сита ба̄ри\",\"сабе мукха пракш̣а̄лой хо’йе са̄ри са̄ри\"],\"translation\":[\"После обеда Кришна пьет ароматную розовую воду. Затем все мальчики по очереди полощут рот.\"],\"isLong\":false},{\"number\":\"12\",\"text\":[\"хаста-мукха пракш̣а̄лийа̄ джата сакха̄-ган̣е\",\"а̄нанде биш́ра̄ма коре баладева-сане\"],\"translation\":[\"Омыв руки и рты, мальчики вместе с Господом Баларамой в блаженном настроении идут отдыхать.\"],\"isLong\":false},{\"number\":\"13\",\"text\":[\"джа̄мбула раса̄ла а̄не та̄мбӯла-маса̄ла̄\",\"та̄ха̄ кхейе кр̣ш̣н̣а-чандра сукхе нидра̄ гела̄\"],\"translation\":[\"Потом два пастушка, Джамбула и Расала, приносят Кришне *пан* из орехов бетеля, изысканных специй и *катечу*. Отведав *пана*, Кришначандра счастливо отправляется почивать.\"],\"isLong\":false},{\"number\":\"14\",\"text\":[\"виш́а̄ла̄кш̣а ш́икхи-пуччха-ча̄мара д̣хула̄йа\",\"апӯрва ш́айа̄йа кр̣ш̣н̣а сукхе нидра̄ джа̄йа\"],\"translation\":[\"Когда Кришна блаженно спит на роскошной постели, Его слуга Вишалакша обмахивает Его опахалом из павлиньих перьев.\"],\"isLong\":false},{\"number\":\"15\",\"text\":[\"джаш́оматӣ-а̄джн̃а̄ пейе дханиш̣т̣ха̄-а̄нито\",\"ш́рӣ-кр̣ш̣н̣а-праса̄да ра̄дха̄ бхун̃дже хойе прӣто\"],\"translation\":[\"По просьбе матери Яшоды *гопи* Дхаништха приносит Шримати Радхарани тарелку с остатками еды Кришны, и Та принимает их с великим наслаждением.\"],\"isLong\":false},{\"number\":\"16\",\"text\":[\"лалита̄ди сакхӣ-ган̣а аваш́еш̣а па̄йа\",\"мане мане сукхе ра̄дха̄-кр̣ш̣н̣а-гун̣а га̄йа\"],\"translation\":[\"Остатки пищи Кришны достаются Лалите Деви и другим *гопи*, которые в своих сердцах в великой радости прославляют Радхарани и Кришну.\"],\"isLong\":false},{\"number\":\"17\",\"text\":[\"хари-лӣла̄ эк-ма̄тра джа̄ха̄ра прамода\",\"бхога̄рати га̄й т̣ха̄кура бхакативинода\"],\"translation\":[\"Тхакур Бхактивинод, чья единственная радость — игры Господа Хари, поет эту песню «Бхога-арати».\"],\"isLong\":false},{\"text\":[\"бхаджа говинда говинда гопа̄ла\",\"гиридха̄ри гопӣна̄тха нанда дулала\",\"бхаджа говинда говинда гопа̄ла\",\"нанда дулала джайа джайа ш́ачи дулала\",\"ш́ачи дулала джайа джайа гаура гопа̄ла\"],\"isLong\":false}],\"embeds\":[{\"title\":\"Шрила Говинда Махарадж\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-sri-bhoga\",\"iframe_url\":\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fgovinda-maharaj-sri-bhoga\",\"embed_code\":\"\u003ciframe width=\\\"100%\\\" height=\\\"20\\\" scrolling=\\\"no\\\" frameborder=\\\"no\\\" allow=\\\"autoplay\\\" src=\\\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fgovinda-maharaj-sri-bhoga\\\"\u003e\u003c/iframe\u003e\"},{\"title\":\"Навадвип Дхам\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-bhaja-bhakata\",\"iframe_url\":\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fnavadwip-scsm-bhaja-bhakata\",\"embed_code\":\"\u003ciframe width=\\\"100%\\\" height=\\\"20\\\" scrolling=\\\"no\\\" frameborder=\\\"no\\\" allow=\\\"autoplay\\\" src=\\\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fnavadwip-scsm-bhaja-bhakata\\\"\u003e\u003c/iframe\u003e\"},{\"title\":\"Каракас Дхам\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/shchsm-karakas-bxadzha-bxakata\",\"iframe_url\":\"https://
