а̄й\"},\"title\":[\"Шри Кршнера Вимсоттара-шата-нама\"],\"author\":[\"Ш́рӣла Бхактивинод Т̣ха̄кур\"],\"verses\":[{\"text\":[\"нагаре нагаре гора̄ га̄й\"],\"translation\":[\"Идя от деревни к деревне, Гаурасундар воспевает имена Шри Кришны.\"],\"isLong\":false},{\"number\":\"1\",\"text\":[\"джаш́оматӣ-станйа-па̄йӣ ш́рӣ-нанда-нандана\",\"индра-нӣла-ман̣и браджа-джанера джӣвана\"],\"translation\":[\"Кришна — младенец, вскормленный матерью Яшодой. Он сын Махараджа Нанды. Его тело темно-синего цвета подобно камню *индра-нила*. Он — жизнь обитателей Враджи.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"ш́рӣ гокула ниш́а̄чарӣ-пӯтана̄ гха̄тана\",\"душ̣т̣а-тр̣н̣а̄варта-ханта̄ ш́акат̣а-бхан̃джана\"],\"translation\":[\"Кришна убил Путану, ведьму Гокулы. Он сломал телегу, в которой прятался демон Шакатасура. Он сразил злого демона Тринаварту.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"наванӣта-чора дадхи-харан̣а-куш́ала\",\"джамала-арджуна-бхан̃джӣ говинда гопа̄ла\"],\"translation\":[\"Он непревзойденный воришка масла и йогурта, Он сломал деревья Ямала и Арджуна. Он — пастушок, дарующий счастье коровам, земле и чувствам.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"да̄модара вр̣нда̄вана-го-ватса-ра̄кха̄ла\",\"ватса̄сура̄нтака хари ниджа-джана-па̄ла\"],\"translation\":[\"Он такой проказник, что мать связывает Его веревкой, чтобы не шалил. Поэтому Он известен как Дамодар. Он пасет коров и телят. Он Тот, Кто победил демона Ватсасуру, Он устраняет все беды и защищает Своих преданных.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"бака-ш́атру агха-ханта̄ брахма-вимохана\",\"дхенука-на̄ш́ана кр̣ш̣н̣а ка̄лӣйа-дамана\"],\"translation\":[\"Кришна — враг демона Бакасуры, Он убил Агхасуру, сбил с толку Господа Брахму, победил Дхенукасуру и покорил змея Калию. Он всепривлекающий, Его тело цвета яркого грозового облака.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"пӣта̄мбара ш́икхи-пиччха-дха̄рӣ вен̣у-дхара\",\"бха̄н̣д̣ӣра-ка̄нана-лӣла да̄ва̄нала-хара\"],\"translation\":[\"Господь Кришна одет в желтую шелковую одежду, а на голове Он носит перо павлина. Он играет на флейте, проводит Свои игры в лесу Бхандира и поглощает лесной пожар, чтобы спасти жителей Враджи.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"нат̣абара гуха̄чара ш́арата-биха̄рӣ\",\"валлабӣ-валлабха дева гопӣ-вастра-ха̄рӣ\"],\"translation\":[\"Кришна, лучший из танцоров, бродит по рощам холма Говардхан. Осенью Он наслаждается разнообразными любовными играми. Он, возлюбленный юных пастушек, похищает их одежды, и Он — Верховный Владыка всего сущего.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"йаджн̃а-патнӣ-гон̣-прати корун̣а̄ра синдху\",\"говардхана-дхр̣к ма̄дхава браджа-ба̄си-бандху\"],\"translation\":[\"Кришна — океан милости для жен *брахманов*, проводивших жертвоприношения. Он поднял холм Говардхан. Он супруг богини удачи Лакшми и самый дорогой друг жителей Враджи.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"индра-дарпа-ха̄рӣ нанда-ракш̣ита̄ мукунда\",\"ш́рӣ-гопӣ-валлабха ра̄са-крӣд̣а пӯрн̣а̄нанда\"],\"translation\":[\"Он сокрушил гордость Индры и защитил Своего отца, Нанду Махараджа. Дарующий освобождение, Он — возлюбленный юных пастушек Враджи, наслаждающийся танцем *раса*. Он источник наслаждения!\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"ш́рӣ-ра̄дха̄-валлабха ра̄дха̄-ма̄дхава сундара\",\"лалита̄-виш́а̄кха̄-а̄ди сакхӣ-пра̄н̣еш́вара\"],\"translation\":[\"Он возлюбленный Шримати Радхарани, сама весна Ее жизни! Он владыка жизни всех *гопи* Вриндавана, во главе с Лалитой и Вишакхой.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"нава-джаладхара-ка̄нти мадана-мохана\",\"вана-ма̄лӣ смера-мукха гопӣ-пра̄н̣адхана\"],\"translation\":[\"Кришна прекрасен, словно дождевое облако в осеннем небе. Украшенный гирляндой из свежих лесных цветов, Он смущает самого Купидона. Его лицо, словно распустившийся лотос ласковых улыбок и смеха! Он богатство жизни девушек Враджи.\"],\"isLong\":false},{\"number\":\"12\",\"text\":[\"три-бхан̇гӣ муралӣ-дхара джа̄муна̄-на̄гара\",\"ра̄дха̄-кун̣д̣а-ран̇га-нета̄ расера са̄гара\"],\"translation\":[\"Его тело, изогнутое в трех местах, прекрасно! Он держит флейту, называемую Мурали. Он возлюбленный реки Ямуны. Он владыка всех любовных игр у Радха-кунды, Он — океан вкусов преданности.\"],\"isLong\":false},{\"number\":\"13\",\"text\":[\"чандра̄валӣ-пра̄н̣ана̄тха каутука̄бхила̄ш̣ӣ\",\"ра̄дха̄-ма̄на-сулампат̣а милана-прайа̄сӣ\"],\"translation\":[\"Кришна — хозяин жизни Чандравали, Он любит шутить и играть. Он жаждет вкушать *расу* нечаянного огорчения Своей возлюбленной Радхики и всегда ищет встречи с Ней.\"],\"isLong\":false},{\"number\":\"14\",\"text\":[\"ма̄наса-ган̇га̄ра да̄нӣ прасӯна-таскара\",\"гопӣ-саха хат̣ха-ка̄рӣ браджа-ванеш́вара\"],\"translation\":[\"Он подарил жителям Вриндавана озеро Манаса Ганга. Этот воришка распустившихся цветов озорничает с девушками Вриндавана, не придавая значения социальным ограничениям, потому что Он — хозяин лесов Враджа-мандалы.\"],\"isLong\":false},{\"number\":\"15\",\"text\":[\"гокула-сампада гопа-дух̣кха-нива̄ран̣а\",\"дурмада-дамана бхакта-санта̄па-харан̣а\"],\"translation\":[\"Он богатство Гокулы, Он защищает от всех несчастий пастухов и пастушков. Он освобождает от глупой гордости Своих преданных и избавляет их от горя.\"],\"isLong\":false},{\"number\":\"16\",\"text\":[\"сударш́ана-мочана ш́рӣ-ш́ан̇кхачӯд̣а̄нтака\",\"ра̄ма̄нуджа ш́йа̄ма-ча̄̐да муралӣ-ба̄дака\"],\"translation\":[\"Кришна бросает украдкой взгляды на *гопи*. Он побеждает Шанкхачуду. Он, играющий на флейте, — младший брат Господа Баларамы, прекрасная темная луна Вриндавана.\"],\"isLong\":false},{\"number\":\"17\",\"text\":[\"гопӣ-гӣта-ш́рота̄ мадхусӯдана мура̄ри\",\"ариш̣т̣а-гха̄така ра̄дха̄-кун̣д̣а̄ди-биха̄рӣ\"],\"translation\":[\"Он слушает песни *гопи* и побеждает демона Мадху. Он враг демона Муры и победитель Ариштасуры. Он наслаждается любовными играми на берегах Радха-кунды и во Врадже.\"],\"isLong\":false},{\"number\":\"18\",\"text\":[\"вйома̄нтака падма-нетра кеш́и-нисӯдана\",\"ран̇га-крӣд̣а кам̇са-ханта̄ маллу-прахаран̣а\"],\"translation\":[\"Кришна сразил демона Вьомасуру. Лотосоокий и озорной, Он победил демона Кеши, царя Камсу, а также Чхануру и Муштику, борцов Камсы.\"],\"isLong\":false},{\"number\":\"19\",\"text\":[\"васудева-сута вр̣ш̣н̣и-вам̇ш́а-кӣрти-дхваджа\",\"дӣнана̄тха матхуреш́а девакӣ-гарбха-джа\"],\"translation\":[\"Он любимый сын Васудевы и олицетворение славы династии Вришни. Господь падших душ, Шри Кришна — владыка Матхуры. Он является, чтобы родиться из чрева Деваки.\"],\"isLong\":false},{\"number\":\"20\",\"text\":[\"кубджа̄-кр̣па̄мойа виш̣н̣у ш́аури на̄ра̄йан̣а\",\"два̄ракеш́а наракагхна ш́рӣ-джадунандана\"],\"translation\":[\"Кришна преисполнен милости к горбунье Кубдже. Он поддерживает все творение. Он сын Васудевы, прибежище всех душ, Господь Двараки. Он любимый потомок династии Яду, победивший Наракасуру.\"],\"isLong\":false},{\"number\":\"21\",\"text\":[\"ш́рӣ-рукмин̣ӣ-ка̄нта сатйа̄-пати сура-па̄ла\",\"па̄н̣д̣ава-ба̄ндхава ш́иш́упа̄ла̄дира ка̄ла\"],\"translation\":[\"Он возлюбленный Рукмини, супруг Сатьи, защитник святых, возлюбленный друг и родственник пяти Пандавов, а также причина смерти Шишупалы и других демонических царей.\"],\"isLong\":false},{\"number\":\"22\",\"text\":[\"джагадӣш́а джана̄рдана кеш́ава̄рта-тра̄н̣а\",\"сарва-авата̄ра-бӣджа виш́вера нида̄на\"],\"translation\":[\"Кришна — Господь Вселенной, поддерживает все живые существа. Его волосы прекрасны! Он избавляет от всех страданий, Он источник Вселенной и всех воплощений.\"],\"isLong\":false},{\"number\":\"23\",\"text\":[\"ма̄йеш́вара йогеш́вара бра̄хма-теджа̄-дха̄ра\",\"сарва̄тма̄ра а̄тма̄ прабху пракр̣тира па̄ра\"],\"translation\":[\"Он Господин *майи*, великий мистик, обладатель духовных сил *брахманов*, Господь, владыка и Душа всех душ. Он — противоположный берег пучины материальной природы.\"],\"isLong\":false},{\"number\":\"24\",\"text\":[\"патита-па̄вана джаганна̄тха сарвеш́вара\",\"вр̣нда̄вана-чандра сарва-расера а̄кара\"],\"translation\":[\"Господь Кришна очищает падшие души, Он — Господь Вселенной и всех живых существ, луна Вриндавана и источник всех *рас*.\"],\"isLong\":false},{\"number\":\"25\",\"text\":[\"нагаре нагаре гора̄ га̄й\",\"бхакативинода тачху па̄й\"],\"translation\":[\"Господь Чайтанья воспевает эти имена Кришны, идя от деревни к деревне. Тхакур Бхактивинод припадает к Его лотосоподобным стопам!\"],\"isLong\":false}],\"embeds\":[{\"title\":\"Шрила Госвами Махарадж\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/goswami-maharaj-jasomati\",\"iframe_url\":\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fgoswami-maharaj-jasomati\",\"embed_code\":\"\u003ciframe width=\\\"100%\\\" height=\\\"20\\\" scrolling=\\\"no\\\" frameborder=\\\"no\\\" allow=\\\"autoplay\\\" src=\\\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fgoswami-maharaj-jasomati\\\"\u003e\u003c/iframe\u003e\"}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Goswami Maharaj\",\"ru\":\"Шрила Б.С. Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/goswami-maharaj-jasomati\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"18:[\"$\",\"$L20\",null,{\"audio\":\"$17:props:song:resources:audio\",\"caption\":\"Слушать аудио:\",\"language\":\"ru\"}]\n19:[\"$\",\"$L21\",null,{\"navMap\":{\"234\":{\"prev\":{\"path\":\"/ru/nadiya-nagare-nitai-neche-neche-gay-re/\",\"title\":\"Шриман Махапрабхур шата-нама\"},\"next\":{\"path\":\"/ru/shri-hari-vasare-hari-kirtana-vidhana/\",\"title\":\"Шри Хари-васара-гити\"}}}}]\n22:Te77,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Ch
