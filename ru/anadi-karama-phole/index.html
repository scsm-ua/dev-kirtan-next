д\",\"song\":{\"meta\":{\"page\":187,\"first_line\":\"ана̄ди карама-пхоле, под̣и бхава̄рн̣ава-джоле\"},\"title\":[\"Пятый стих «Шри Шикшаштакам»\"],\"author\":[\"Ш́рӣла Бхактивинод Т̣ха̄кур\"],\"subtitle\":[\"Песня пятая\"],\"verses\":[{\"text\":[\"айи нанда-тануджа кин̇карам̇\",\"патитам̇ ма̄м̇ виш̣аме бхава̄мбудхау\",\"кр̣пайа̄ тава па̄да-пан̇каджа\",\"стхита-дхӯлӣ-садр̣ш́ам̇ вичинтайа\"],\"translation\":[\"О сын Нанды Махараджа, я Твой вечный слуга, но из-за своей *кармы* я тону в пучине рождений и смертей. Молю, прими эту падшую душу, пусть я стану пылинкой у Твоих святых лотосоподобных стоп!\",\"*Разъяснение стиха в книге: [Золотой вулкан божественной любви \u003e Часть II. Шикшаштака \u003e Владыка царства любви](https://saraswati.pro/books/zolotoy_vulkan_bozhestvennoy_lyubvi/chast_ii_shikshashtaka_nastavleniya_shri_chaytani_makhaprabkhu/vladyka-tsarstva-lyubvi/).*\"],\"isLong\":false},{\"number\":\"1\",\"text\":[\"ана̄ди карама-пхоле,    под̣и бхава̄рн̣ава-джоле,\",\"    ториба̄ре на декхи упа̄й,\",\"э-виш̣ойа-хала̄холе,    дива̄-ниш́и хийа̄ джволе,\",\"    мон кобху сукха на̄хи па̄й\"],\"translation\":[\"Моя греховная деятельность, не имеющая начала, погрузила меня в полную опасностей бездну материального существования. Мне нет спасения! День и ночь мое сердце жжет яд пороков мирских занятий, и я не могу быть по-настоящему счастлив.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"а̄ш́а̄-па̄ш́а-ш́ата-ш́ата    клеш́а дейа абирата,\",\"    прабр̣тти-ӯрмира та̄хе кхела̄\",\"ка̄ма-кродха-а̄ди чхой,    ба̄т̣апа̄д̣е дей бхой,\",\"    абаса̄на хоило а̄си бела̄\"],\"translation\":[\"Я порабощен сотнями сотен желаний, что ведут к безграничному горю и кидают меня из стороны в сторону на волнах пучины все возрастающего материализма. Похоть, гнев, жадность, гордость, иллюзия и зависть, словно шесть разбойников с большой дороги, нагоняют на меня страх. Так заканчивается моя жизнь.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"джн̃а̄на-карма — т̣ха̄га дуи,    море прата̄рийа̄ лои,\",\"    абаш́еш̣е пхеле синдху-джоле\",\"э хено сомойе, бандху,    туми кр̣ш̣н̣а кр̣па̄-синдху\",\"    кр̣па̄ кори’ толо море боле\"],\"translation\":[\"Два грабителя обманули меня и сбили с пути, а затем швырнули в бездну страданий: интеллектуальное знание и деятельность ради собственной выгоды. Теперь, дорогой Кришна, Ты мой единственный спаситель! Ты — океан милости! Молю, будь добр ко мне и вызволи меня!\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"патита-кин̇коре дхори’,    па̄да-падма-дхӯли кори’,\",\"    дехо бхактивиноде а̄ш́рой\",\"а̄ми таба нитйа-да̄с    бхулийа̄ ма̄йа̄ра па̄ш́,\",\"    баддха хо’йе а̄чхи дойа̄мой\"],\"translation\":[\"Я Твой вечный слуга, о милостивый Господь! С незапамятных времен позабыв об этом, теперь я опутан паутиной иллюзии. Прими Своего падшего слугу, даруй ему место в пыли Своих лотосоподобных стоп. Дай Свое прибежище покорному Бхактивиноду!\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.N. Acharya Maharaj\",\"ru\":\"Шрила Б.Н. Ачарья Махарадж\",\"ua\":\"Шріла Б.Н. Ачарʼя Махарадж\"},\"embed_url\":\"https://soundcloud.com/kostya-netrebenko/104-srisrisiksastakam5-3\"},{\"title\":{\"en\":\"Bhakti Lalita Devi\",\"ru\":\"Бхакти Лалита Деви\",\"ua\":\"Бгакті Лаліта Деві\"},\"embed_url\":\"https://soundcloud.com/bhakti-lalita-devi/anadi-karama-phole\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"$L25\",null,{\"audio\":\"$1b:props:song:resources:audio\",\"caption\":\"Слушать аудио:\",\"language\":\"ru\"}]\n1d:[\"$\",\"$L26\",null,{\"navMap\":{\"187\":{\"prev\":{\"path\":\"/ru/prabhu-tava-pada-juge-mora-nivedana/\",\"title\":\"4. Прабху тава пада\"},\"next\":{\"path\":\"/ru/aparadha-phole-mama/\",\"title\":\"6. Апара̄дха-пхоле мама\"}}}}]\n27:T10ee,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\
