томāра нитйа-четана\",\"парамāнанда-майа\",\"хāд̣a-мāм̇сера тхали ки какхано\",\"тāхāра адхāра хайа?\"],\"translation\":[\"«Ваше истинное „я“ вечно, сознательно и в высшей степени блаженно. Как вообще может этот мешок мяса и костей быть подходящим для него местом?»\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"деха парибāра сонāра сам̇сāра\",\"рабе нāко чира-дина\",\"саба чхед̣е тор йете хабе оре\",\"табе кена мати-хӣна —\"],\"translation\":[\"«Ваше тело, семья и „прекрасная“ семейная жизнь не будут с вами вечно. В конце концов вам придется оставить все это и двигаться дальше. Эй! Почему вы не помните об этом?»\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"ш́удху гхума-гхоре, свапанера бхаре\",\"āмāрa āмāрa кари —\",\"вр̣тхā джад̣а расе кāт̣āича ка̄ла\",\"мāйā пиш́āчире бари’3\"],\"translation\":[\"«Вы лишь проводите время в вялой сонливости, заявляя: „Мое! Мое!“, поглощенные тщетными мирскими удовольствиями, плененные ведьмой-Майей».\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"кāнтā ке тора? прейасӣра рӯпе\",\"вāгхинӣ ш́ийаре джāге\",\"путра ке тора? ракта ш́уш̣ичхе\",\"‘бāбā’ бали анурāге\"],\"translation\":[\"«Кто такая ваша жена? Она тигрица в образе возлюбленной, не смыкающая глаз у вашей головы. Кто такой ваш сын? Он с любовью называет вас отцом, но попросту высасывает вашу кровь».\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"бāндхава нахе дасйу дāнава\",\"саба удйама лут̣е’ —\",\"них̣сва коречхе хāйa ван̃чита!\",\"табу ки ре чокха пхот̣е\"],\"translation\":[\"«Они вам не доброжелатели. Они воры и демоны, укравшие всю вашу силу и оставившие вас опустошенным. Увы! Вас обманули. И все равно вы не открываете своих глаз!»\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"ката гхумāиби пиш́āчира коле\",\"моха тамасāра гхоре\",\"чира-джанамера бандху ре тора\",\"бхикхāрӣра веш́е дваре —\"],\"translation\":[\"«Как долго вы будете спать на коленях ведьмы-Майи, околдованные ее темной иллюзией? Сейчас у вашей двери в одеянии нищего (стоит) ваш вечный друг».\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"аи д̣āке ш́он āкула парāн̣е —\",\"āйа — деш́e пхире āйa\",\"гхӯмāбāра āра нāхи рe самaйa\",\"крaмaш́ах̣-и белā йāйa\"],\"translation\":[\"«„Послушай, — взывает он с горячим сердцем. — Вернись, вернись на свою родину! Больше нет времени спать. Время мало-помалу уходит“».\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"э бхава сāгара хa’тe хабе пāрa\",\"акӯла пāтхāра-майа\",\"йемани таран̣ӣ хок табу, а̄ми\",\"кāн̣д̣а̄рӣ — нāхи бхайа\"],\"translation\":[\"«„Мы должны пересечь бескрайнюю ширь этого океана материального бытия. Позволь своему кораблю (телу) отправиться в плавание, и будь что будет. Как бы то ни было, я твой капитан. Не бойся“».\"],\"isLong\":false},{\"number\":\"11,12\",\"text\":[\"ш́ока бхайа тāпa видӯрита кари\",\"праджн̃āнāлока дийā\",\"карма-джн̃āнера моха винāш́ийā\",\"ракхиба сварӯпе нийā —\",\"пӯрн̣āнанда чинмайа-дхāме,\",\"лабхибе āпана дхана\",\"гандхе йāхāра саджджана-ган̣а\",\"мугдха-пāгала хана\"],\"translation\":[\"«„Светом трансцендентного знания я рассею все твои горестные жалобы, страхи и страдания. Я прекращу иллюзорную погоню за мирскими наслаждениями и освобождением. Я укреплю тебя в твоем подлинном ‘я’ и возьму тебя в высшей степени упоительную духовную обитель. Там ты осознаешь свое собственное, принадлежащее тебе от природы богатство, аромат которого изумляет и сводит с ума *садху“»*.\"],\"isLong\":false},{\"number\":\"13\",\"text\":[\"кр̣ш̣н̣а-чаран̣а камалера мадху\",\"ниравадхи пāна кари\",\"āнанде начибе сваджанера сане\",\"мукхе бали хари хари\"],\"translation\":[\"«„Там ты беспрестанно будешь пить мед лотосоподобных стоп Шри Кришны и в обществе твоих настоящих друзей будешь восторженно танцевать, взывая: ‘Хари! Хари!’“»\",\"Стихотворение, представляющее журнал «Шри Гаудия Даршан», первоначально опубликованное в самом первом его выпуске (воскресенье, 14 августа 1955 года).\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}],false]]}]}],\"$L16\",\"$L17\"]}]]}],\"$L18\"]}],\"$L19\",\"$L1a\",\"$L1b\"]}]]}]\n"])</script><script>self.__next_f.push([1,"1c:I[4423,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-72e407737b4e2196.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"default\"]\n1e:I[9181,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-72e407737b4e2196.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"default\"]\n1f:I[9508,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-72e407737b4e2196.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"GoogleAnalytics\"]\n20:I[8550,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-72e407737b4e2196.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"ServiceWorkerRegistration\"]\n21:I[3680,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-72e407737b4e2196.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"default\"]\n16:[\"$\",\"$L1c\",null,{\"navMap\":{\"_\":{\"prev\":{\"path\":\"/ru/karttiki-navami-krishna-shiubhankari/\",\"title\":\"Вирачандра-прашаштих\"},\"next\":{\"path\":\"/ru/ye-dina-udile-tumi-darshan/\",\"title\":\"Шри Гаудийа Даршан Прашасти\"}}}}]\n1d:Tae1,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"h
