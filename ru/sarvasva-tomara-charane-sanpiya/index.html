̄ра чаран̣а,\",\"    чинтибо сатата а̄ми\",\"на̄чите на̄чите,    никат̣е джа̄ибо,\",\"    джокхона д̣а̄кибе туми\"],\"translation\":[\"Сидя или лежа, я буду всегда сосредоточен на Твоих лотосоподобных стопах. Едва Ты позовешь меня, я немедленно прибегу к Тебе и стану в восторге танцевать.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"ниджера пош̣ан̣а,    кобху на̄ бха̄вибо,\",\"    рохибо бха̄вера бхоре\",\"бхакативинода,    тома̄ра па̄лака,\",\"    болийа̄ варан̣а коре\"],\"translation\":[\"Поглощенный любовной заботой о хозяине, я не стану заботиться о своем теле. Бхактивинод принимает Тебя своим единственным покровителем.\"],\"isLong\":false}],\"embeds\":[{\"title\":\"Шрила Шридхар Махарадж\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/sridhar-maharaj-and-govinda-4\",\"iframe_url\":\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fsridhar-maharaj-and-govinda-4\",\"embed_code\":\"\u003ciframe width=\\\"100%\\\" height=\\\"20\\\" scrolling=\\\"no\\\" frameborder=\\\"no\\\" allow=\\\"autoplay\\\" src=\\\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fsridhar-maharaj-and-govinda-4\\\"\u003e\u003c/iframe\u003e\"},{\"title\":\"Сударшан Прабху\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/sudarshan-prabhu-sarvasva\",\"iframe_url\":\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fsudarshan-prabhu-sarvasva\",\"embed_code\":\"\u003ciframe width=\\\"100%\\\" height=\\\"20\\\" scrolling=\\\"no\\\" frameborder=\\\"no\\\" allow=\\\"autoplay\\\" src=\\\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fsudarshan-prabhu-sarvasva\\\"\u003e\u003c/iframe\u003e\"}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.R. Sridhar Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.Р. Шридхар Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.Р. Шрідгар Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/sridhar
