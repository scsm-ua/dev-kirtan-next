xt\":[\"ш́ачӣ-сута гаурахари нима̄и-сундара\",\"ра̄дха̄-бха̄ва-ка̄нти-а̄чха̄дито нат̣абара\"],\"translation\":[\"Он — любимый сын Шачи-маты и Господь Хари, принявший облик цвета золота. Он родился под деревом *ним*, и Его называют Нимай-сундар (прекрасный Нимай). Он принял настроение и сияние Шримати Радхарани. Он самый изысканный танцор.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"на̄ма̄нанда чапала ба̄лака ма̄тр̣-бхакта\",\"брахма̄н̣д̣а-бадана таркӣ каутука̄нуракта\"],\"translation\":[\"Господь Чайтанья погружается в экстаз, когда слышит Святое Имя Хари. Мальчиком Он был шустрым и проворным, послушным Своей матери, великим ученым и шутником. У Него во рту помещаются миллионы миров.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"видйа̄ртхи-уд̣упа чаура-двайера мохана\",\"таиртхика-сарвасва гра̄мйа-ба̄лика̄-крӣд̣ана\"],\"translation\":[\"Когда Он был ребенком, Он ввел в заблуждение двух воров, которые хотели снять с Него драгоценности. Он играл и шутил с деревенскими девушками Надии. Он луна среди ученых, в знании писаний Он превосходит всех философов.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"лакш̣мӣ-прати боро-да̄та̄ удхата ба̄лака\",\"ш́рӣ-ш́ачӣра пати-путра-ш́ока-ниба̄рака\"],\"translation\":[\"Господь Чайтанья дарует благословения Лакшми-прии (Своей первой супруге). Он Господь, любимый сын и утешение Шачи-маты, ее шаловливый ребенок.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"лакш̣мӣ-пати пӯрва-деш́а-сарва-клеш́а-хара\",\"дигвиджайи-дарпа-ха̄рӣ виш̣н̣у-прийеш́вара\"],\"translation\":[\"Он Господь и супруг Лакшми-прии. Движением *санкиртаны*, которое Он основал, Он устранил все несчастья в Восточной Бенгалии. Победив *пандита* Кешаву Кашмири, Он избавил его от гордыни. Он Господь Вишну-прии (Своей второй супруги).\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"а̄рйа-дхарма-па̄ла питр̣-гайа̄ пин̣д̣а-да̄та̄\",\"пурӣ-ш́иш̣йа мадхва̄ча̄рйа-сампрада̄йа-па̄та̄\"],\"translation\":[\"Он защищал и оберегал *санатана-дхарму*, а после ухода отца, Джаганнатхи Мишры, совершил в Гайе поминальный обряд. Он стал учеником Ишвары Пури, и Он — защитник Мадхвачарья-сампрадаи.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"кр̣ш̣н̣а-на̄монматта кр̣ш̣н̣а-таттва-адхйа̄пака\",\"на̄ма-сан̇кӣртана-джуга-дхарма-правартака\"],\"translation\":[\"Господь Чайтанья буквально опьянел и обезумел от Святого Имени Кришны. Он стал проповедовать славу Кришны и основал религию эпохи, *харинама-санкиртану*.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"адваита-ба̄ндхава ш́рӣнива̄са-гр̣ха-дхон\",\"нитйа̄нанда-пра̄н̣а гада̄дхарера джӣван\"],\"translation\":[\"Он был другом Адвайты Ачарьи, сокровищем дома Шриваса Тхакура, жизнью и душой Нитьянанды Прабху и источником самой жизни для Гададхара Пандита.\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"антадвӣпа-ш́аш́адхара сӣманта-биджой\",\"годрума-биха̄рӣ мадхйадвӣпа-лӣла̄ш́рой\"],\"translation\":[\"Шри Гауранга Махапрабху — луна Антардвипа и торжество Симантадвипа. Его можно встретить на острове Годрума, Он — прибежище игр в Мадхьядвипе.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"коладвӣпа-пати р̣тудвӣпа-махеш́вара\",\"джахну-модадрума-рудрадвӣпера ӣш́вара\"],\"translation\":[\"Шри Чайтанья — Властитель Коладвипа, Ритудвипа, Джахнудвипа, Модадрумадвипа и Рудрадвипа.\"],\"isLong\":false},{\"number\":\"12\",\"text\":[\"навакхан̣д̣а-ран̇гана̄тха джа̄хнавӣ-джӣвана\",\"джага̄и-ма̄дха̄и-а̄ди дурбр̣тта та̄ран̣а\"],\"translation\":[\"Он Господь Навадвипа, арены Его удивительных игр. Он — жизнь Ганги. Он Тот, Кто спасает даже мошенников и негодяев, таких как Джагай и Мадхай.\"],\"isLong\":false},{\"number\":\"13\",\"text\":[\"нагара-кӣртана-сим̇ха ка̄джӣ-удха̄ран̣а\",\"ш́уддха-на̄ма-прача̄рака бхакта̄рти-харан̣а\"],\"translation\":[\"Шри Чайтанья Махапрабху — лев *киртана*. Он спас Чханда Кази . Он проповедовал чистое Святое Имя и избавлял от несчастий Своих преданных.\"],\"isLong\":false},{\"number\":\"14\",\"text\":[\"на̄ра̄йан̣ӣ-кр̣па̄-синдху джӣвера нийанта̄\",\"адхама-пад̣ӯйа̄-дан̣д̣ӣ бхакта-дош̣а-ханта̄\"],\"translation\":[\"Он — океан милости для Нараяни. Он — властитель всех душ. Он Тот, Кто наказал ученика, который осудил Его за то, что Он воспевал * «Гопи, гопи!» * Он уничтожает грехи Своих преданных.\"],\"isLong\":false},{\"number\":\"15\",\"text\":[\"ш́рӣ-кр̣ш̣н̣а-чаитанйа-чандра бха̄ратӣ-та̄ран̣а\",\"парибра̄джа-ш́ироман̣и уткала-па̄вана\"],\"translation\":[\"При посвящении в *санньясу* Он получил имя Шри Кришна Чайтанья. Он прекрасен, словно луна. Он освободил Кешаву Бхарати. Он — жемчужина среди странствующих *санньяси *и спаситель Ориссы.\"],\"isLong\":false},{\"number\":\"16\",\"text\":[\"амбу-лин̇га-бхуванеш́а-капотеш́а-пати\",\"кш̣ӣра-чора-гопа̄ла-дарш́ана-сукхӣ джатӣ\"],\"translation\":[\"Господь Чайтанья — властелин Господа Шивы, известного как Амбу-линга, Бхуванешвара и Капотешвара в трех разных *шайва-тиртхах*, которые посетил Шри Чайтанья на Своем пути в Джаганнатха Пури. Будучи *санньяси*, Он радовался, когда созерцал Кшира-чхора Гопинатха и Сакши Гопала.\"],\"isLong\":false},{\"number\":\"17\",\"text\":[\"нирдан̣д̣и-саннйа̄сӣ са̄рвабхаума-кр̣па̄мой\",\"сва̄нанда-а̄сва̄да̄на̄нандӣ сарва-сукха̄ш́рой\"],\"translation\":[\"Он стал *санньяси* без *данды* (посоха), поскольку ее разбил Господь Нитьянанда и бросил в реку Бхарги. Он очень милостив к Сарвабхауме Бхаттачарье. Он в восторге от вкушения блаженства Самого Себя в облике Кришны, Он — обитель всего счастья.\"],\"isLong\":false},{\"number\":\"18\",\"text\":[\"пурат̣а-сундара ва̄судева-тра̄н̣а-карта̄\",\"ра̄ма̄нанда-сакха̄ бхат̣т̣а-кула-клеш́а-харта̄\"],\"translation\":[\"Господь Чайтанья великолепен и сияет, словно расплавленное золото. Он спас прокаженного Васудева. Он — друг Рамананды Рая, Он Тот, Кто избавил от несчастья семью Вьенкаты Бхатты.\"],\"isLong\":false},{\"number\":\"19\",\"text\":[\"бауддха-джаина-ма̄йа̄ва̄ди-кутарка-кхан̣д̣ана\",\"дакш̣ин̣а-па̄вана бхакти-грантха-удха̄ран̣а\"],\"translation\":[\"Он опроверг атеистические доводы буддистов, джайнов и *майявади*. Он — спаситель Южной Индии, Он открыл миру писания о величайшей преданности: «Кришна-карнамриту» и «Брахма-самхиту».\"],\"isLong\":false},{\"number\":\"20\",\"text\":[\"а̄ла̄ла-дарш́ана̄нандӣ ратха̄гра-нартака\",\"гаджапати-тра̄н̣а дева̄нанда-удха̄рака\"],\"translation\":[\"Шри Чайтанья впал в экстаз при виде Аланатха. Он танцевал перед колесницей Джаганнатха на Ратха-ятре, Он освободил Гаджапати Пратапарудру, Он стал спасителем Девананды Пандита.\"],\"isLong\":false},{\"number\":\"21\",\"text\":[\"кулийа̄-прака̄ш́е душ̣т̣а пад̣уйа̄ра тра̄н̣а\",\"рӯпа-сана̄тана-бандху сарва-джӣва-пра̄н̣а\"],\"translation\":[\"Своим появлением в Кулии Он спас общину погрязших в пороке студентов. Он — друг Рупы и Санатаны и жизнь всех душ.\"],\"isLong\":false},{\"number\":\"22\",\"text\":[\"вр̣нда̄вана̄нанда-мӯрти балабхадра-сан̇гӣ\",\"джавана-удха̄рӣ бхат̣т̣а-валлабхера ран̇гӣ\"],\"translation\":[\"Шри Гауранга — олицетворение блаженства в трансцендентном царстве Вриндавана. Он — спутник и друг Балабхадры Бхаттачарьи. По дороге из Вриндавана Он открыл истину многим мусульманам. Он очень любит Валлабхачарью.\"],\"isLong\":false},{\"number\":\"23\",\"text\":[\"ка̄ш́ӣба̄си-саннйа̄сӣ-удха̄рӣ према-да̄та̄\",\"маркат̣а-ваира̄гӣ-дан̣д̣ӣ а̄-чан̣д̣а̄ла-тра̄та̄\"],\"translation\":[\"Он спас *санньяси-майявади* из Каши, Он одаривает любовью к Богу. Для поддержания строгого стандарта поведения *санньяси* Он наказал великого преданного Чхота Харидаса за то, что тот попросил рис у Мадхави Деви. Шри Чайтанья — спаситель всех, включая представителей нижайшего класса людей.\"],\"isLong\":false},{\"number\":\"24\",\"text\":[\"бхактера-гаурава-ка̄рӣ бхакта-пра̄н̣а-дхана\",\"харида̄са-рагхуна̄тх-сварӯпа-джӣвана\"],\"translation\":[\"Шри Чайтанья прославляет Своих преданных, являясь величайшим сокровищем их жизни. Он — жизнь таких величайших преданных, как Харидас Тхакур, Рагхунатх Дас Госвами и Сварупа Дамодар.\"],\"isLong\":false},{\"number\":\"25\",\"text\":[\"надийа̄-нагаре нита̄и нече нече га̄й ре\",\"бхакативинода та̄̐ра под̣е ра̄н̇га̄-па̄й ре\"],\"translation\":[\"В городах и деревнях Надии Господь Нитьянанда воспевает, танцуя в экстазе, божественные имена. Тхакур Бхактивинод в восторге припадает к Его подобным розовым лотосам стопам.\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1a:[\"$\",\"$L22\",null,{\"navMap\":{\"230\":{\"prev\":{\"path\":\"/ru/namamishvaram-sachchidananda-rupam/\",\"title\":\"Шри Шри Дамодараштакам\"},\"next\":{\"path\":\"/ru/nagare-nagare-gora-gay/\",\"title\":\"Шри Кршнера Вимсоттара-шата-нама\"}}}}]\n23:Td79,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"description\":\"A digital Vaishnava songbook with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPage\",\"@id\":\"https://dev.kirtan.site/ru/nadiya-nagare-nitai-neche-neche-gay-re/\",\"url\":\"https://dev.kirtan.site/ru/nadiya-nagare-nitai-neche-neche-gay-re/\",\"name\":\"Шриман Махапрабхур шата-нама. Ш́рӣла Бхактивинод Т̣ха̄кур\",\"inLanguage\":\"ru\",\"description\":\"Шриман Махапрабхур шата-нама — вайшнавская песня с текстом, русским переводом и пословным разбором. Автор — Ш́рӣла Бхактивинод Т̣ха̄кур. Из сборника «Гаудия Гитанджали».\",\"breadcrumb\":{\"@id\":\"https://dev.kirtan.site/ru/nadiya-nagare-nitai-neche-neche-gay-re/#breadcrumb\"},\"mainEntity\":{\"@id\":\"https://dev.kirtan.site/ru/nadiya-nagare-nitai-neche-neche-gay-re/#composition\"},\"isPartOf\":{\"@id\":\"https:/
