\",\"ш́рӣ-ра̄дха̄-кр̣ш̣н̣а-па̄да̄н саха-ган̣а-лалита̄-\",\"    ш́рӣ-виш́а̄кха̄нвита̄м̇ш́ ча\"],\"word_by_word\":[\"**ванде** — поклоняюсь; **хам̇** — я; **ш́рӣ** — почтенного; **гурох̣** — учителя; **ш́рӣ** — славой; **йута** — украшенным; **пада** — стопам; **камалам̇** — лотосоподобным; **ш́рӣ** — почтенным; **гурӯн** — учителям; **ваиш̣н̣ава̄м̇ш́** — вайшнавам; **ча** — и; **ш́рӣ** — Шриле; **рӯпам̇** — Рупе (Госвами); **са̄граджа̄там̇** — со старшим братом (Санатаной Госвами); **саха** — вместе с; **ган̣а** — спутниками; **рагхуна̄тха̄нвитам̇** — с Рагхунатхой (Госвами); **там̇** — ему; **са** — с; **джӣвам** — Дживой (Госвами); **са̄дваитам̇** — с Адвайтой (Ачарьей); **са̄вадхӯтам̇** — с Авадхутом (Нитьянандой); **париджана** — (они) окружение; **сахитам̇** — сопровождающее; **кр̣ш̣н̣а** — Кришна; **чаитанйа** — Чайтанью (Махапрабху); **девам̇** — Господа; **ш́рӣ** — Шри; **ра̄дха̄** — Радхи; **кр̣ш̣н̣а** — Кришны; **па̄да̄н** — стопам; **саха** — вместе с; **ган̣а** — (их) спутницами; **лалита̄** — Лалитой; **ш́рӣ** — (и) Шри; **виш́а̄кха̄нвита̄м̇ш́** — Вишакхой; **ча** — также.\"],\"translation\":[\"(Шрила Кришнадас Кавирадж Госвами молится): «Я в смирении склоняюсь к лотосоподобным стопам моего духовного учителя, всех духовных наставников и вайшнавов. Я почтительно склоняюсь перед своими *шастра-гуру*: Шрилой Рупой Госвами и его старшим братом Шрилой Санатаной Госвами, а также перед Шрилой Рагхунатхом Дасом Госвами и Шрилой Дживой Госвами. Я выражаю почтение тем, кто еще более возвышен: Шри Чайтанье Махапрабху, нисшедшему со Своими атрибутами и спутниками — такими великими личностями, как Шри Нитьянанда Прабху и Шри Адвайта Ачарья. С великим благоговением я склоняюсь к лотосоподобным стопам Шри Шри Радхи-Говинды и всех *гопи*, возглавляемых Лалитой Деви и Вишакхой Деви».\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"ванде\",\"trans\":\"поклоняюсь\",\"sep\":\" \"},{\"text\":\"‘хам̇\",\"trans\":\"я\",\"sep\":\" \"},{\"text\":\"ш́рӣ\",\"trans\":\"почтенного\",\"sep\":\"-\"},{\"text\":\"гурох̣\",\"trans\":\"учителя\",\"sep\":\" \"},{\"text\":\"ш́рӣ\",\"trans\":\"славой\",\"sep\":\"-\"},{\"text\":\"йута\",\"trans\":\"украшенным\",\"sep\":\"-\"},{\"text\":\"пада\",\"trans\":\"стопам\",\"sep\":\"-\"},{\"text\":\"камалам̇\",\"trans\":\"лотосоподобным\",\"sep\":\"\"}],[{\"text\":\"ш́рӣ\",\"trans\":\"почтенным\",\"sep\":\"-\"},{\"text\":\"гурӯн\",\"trans\":\"учителям\",\"sep\":\" \"},{\"text\":\"ваиш̣н̣ава̄м̇ш́\",\"trans\":\"вайшнавам\",\"sep\":\" \"},{\"text\":\"ча\",\"trans\":\"и\",\"sep\":\"\"}],[{\"text\":\"ш́рӣ\",\"trans\":\"Шриле\",\"sep\":\"-\"},{\"text\":\"рӯпам̇\",\"trans\":\"Рупе (Госвами)\",\"sep\":\" \"},{\"text\":\"са̄граджа̄там̇\",\"trans\":\"со старшим братом (Санатаной Госвами)\",\"sep\":\" \"},{\"text\":\"саха\",\"trans\":\"вместе с\",\"sep\":\"-\"},{\"text\":\"ган̣а\",\"trans\":\"спутниками\",\"sep\":\"-\"}],[{\"text\":\"рагхуна̄тха̄нвитам̇\",\"trans\":\"с Рагхунатхой (Госвами)\",\"sep\":\"-\"},{\"text\":\"там̇\",\"trans\":\"ему\",\"sep\":\" \"},{\"text\":\"са\",\"trans\":\"с\",\"sep\":\"-\"},{\"text\":\"джӣвам\",\"trans\":\"Дживой (Госвами)\",\"sep\":\"\"}],[{\"text\":\"са̄дваитам̇\",\"trans\":\"с Адвайтой (Ачарьей)\",\"sep\":\" \"},{\"text\":\"са̄вадхӯтам̇\",\"trans\":\"с Авадхутом (Нитьянандой)\",\"sep\":\" \"},{\"text\":\"париджана\",\"trans\":\"(они) окружение\",\"sep\":\"-\"},{\"text\":\"сахитам̇\",\"trans\":\"сопровождающее\",\"sep\":\"\"}],[{\"text\":\"кр̣ш̣н̣а\",\"trans\":\"Кришна\",\"sep\":\"-\"},{\"text\":\"чаитанйа\",\"trans\":\"Чайтанью (Махапрабху)\",\"sep\":\"-\"},{\"text\":\"девам̇\",\"trans\":\"Господа\",\"sep\":\"\"}],[{\"text\":\"ш́рӣ\",\"trans\":\"Шри\",\"sep\":\"-\"},{\"text\":\"ра̄дха̄\",\"trans\":\"Радхи\",\"sep\":\"-\"},{\"text\":\"кр̣ш̣н̣а\",\"trans\":\"Кришны\",\"sep\":\"-\"},{\"text\":\"па̄да̄н\",\"trans\":\"стопам\",\"sep\":\" \"},{\"text\":\"саха\",\"trans\":\"вместе с\",\"sep\":\"-\"},{\"text\":\"ган̣а\",\"trans\":\"(их) спутницами\",\"sep\":\"-\"},{\"text\":\"лалита̄\",\"trans\":\"Лалитой\",\"sep\":\"-\"}],[{\"text\":\"ш́рӣ\",\"trans\":\"(и) Шри\",\"sep\":\"-\"},{\"text\":\"виш́а̄кха̄нвита̄м̇ш́\",\"trans\":\"Вишакхой\",\"sep\":\" \"},{\"text\":\"ча\",\"trans\":\"также\",\"sep\":\"\"}]]},{\"subtitle\":[\"Молитва Шри Гуру\"],\"text\":[\"ом̇ аджн̃а̄на-тимира̄ндхасйа джн̃а̄на̄н̃джана-ш́ала̄кайа̄\",\"чакш̣ур унмилитам̇ йена тасмаи ш́рӣ-гураве намах̣\"],\"word_by_word\":[\"**ом̇** — (ом); **аджн̃а̄на** — невежества; **тимира̄ндхасйа** — тьмой ослеплённый; **джн̃а̄на̄н̃джана** — знания глазная мазь; **ш́ала̄кайа̄** — (нанесённая) палочкой; **чакш̣ур** — (на) глаза; **унмилитам̇** — (и они) открытылись; **йена** — (благодаря) кому; **тасмаи** — тому; **ш́рӣ** — почтенному; **гураве** — учителю; **намах̣** — поклоняюсь.\"],\"translation\":[\"Умастив мои глаза целительным бальзамом *самбандха-гьяны*, правильного восприятия окружающего мира, духовный учитель пробудил мое внутреннее видение и вывел меня из тьмы невежества, подарив надежду. В глубоком почтении я склоняюсь перед Шри Гурудевом.\"],\"isLong\":true,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"ом̇\",\"trans\":\"(ом)\",\"sep\":\" \"},{\"text\":\"аджн̃а̄на\",\"trans\":\"невежества\",\"sep\":\"-\"},{\"text\":\"тимира̄ндхасйа\",\"trans\":\"тьмой ослеплённый\",\"sep\":\" \"},{\"text\":\"джн̃а̄на̄н̃джана\",\"trans\":\"знания глазная мазь\",\"sep\":\"-\"},{\"text\":\"ш́ала̄кайа̄\",\"trans\":\"(нанесённая) палочкой\",\"sep\":\"\"}],[{\"text\":\"чакш̣ур\",\"trans\":\"(на) глаза\",\"sep\":\" \"},{\"text\":\"унмилитам̇\",\"trans\":\"(и они) открытылись\",\"sep\":\" \"},{\"text\":\"йена\",\"trans\":\"(благодаря) кому\",\"sep\":\" \"},{\"text\":\"тасмаи\",\"trans\":\"тому\",\"sep\":\" \"},{\"text\":\"ш́рӣ\",\"trans\":\"почтенному\",\"sep\":\"-\"},{\"text\":\"гураве\",\"trans\":\"учителю\",\"sep\":\" \"},{\"text\":\"намах̣\",\"trans\":\"поклоняюсь\",\"sep\":\"\"}]]},{\"subtitle\":[\"Шрила Бхакти Сундар Говинда Дев-Госвами Махарадж\"],\"translation\":[\"![Шрила Бхакти Сундар Говинда Дев-Госвами Махарадж](/images/resources/en/3.jpg =454x525)\"],\"isLong\":false},{\"text\":[\"гурвва̄бхӣш̣т̣а-супӯракам̇ гуру-ган̣аир\",\"    а̄ш́ӣш̣а-самбхӯш̣итам̇\",\"чинтйа̄чинтйа-самаста-веда-нипун̣ам̇\",\"    ш́рӣ-рӯпа-пантха̄нугам\",\"говинда̄бхидхам уджвалам̇ вара-танум̇\",\"    бхактй анвитам̇ сундарам̇\",\"ванде виш́ва-гурун̃ ча дивйа-бхагават-\",\"    премн̣о хи бӣджа-прадам\"],\"translation\":[\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;*(Ш́рӣла Бхакти Ракш̣ак Ш́рӣдхар Дев-Госва̄мӣ Маха̄ра̄дж)*\",\"С величайшим почтением я склоняюсь перед тем, кто украшен благословениями всей *гуру-варги* и исполняет самые сокровенные желания своего Гуру. Он знаток как постижимых, так и непостижимых истин. Выдающийся последователь божественного учения Шри Рупы, он известен как Шри Бхакти Сундар Говинда. Его сияющий облик излучает преданность Господу. Он явился из высшего мира и прославился в этом мире как истинный духовный учитель, способный даровать семя божественной любви.\"],\"isLong\":false},{\"subtitle\":[\"Шрила Бхакти Ракшак Шридхар Дев-Госвами Махрадж\"],\"translation\":[\"![Шрила Бхакти Ракшак Шридхар Дев-Госвами Махрадж](/images/resources/en/4.jpg =454x525)\"],\"isLong\":false},{\"text\":[\"девам̇ дивйа-танум̇ сучанда-ваданам̇-\",\"    ба̄ла̄рка-чела̄н̃читам̇\",\"са̄ндра̄нанда-пурам̇ сад-эка-варанам̇\",\"    ваира̄гйа-видйа̄мбудхим\",\"ш́рӣ-сиддха̄нта-нидхим̇ субхакти-ласитам̇\",\"    са̄расвата̄на̄м варам̇\",\"ванде там̇ ш́убхадам̇ мад-эка-ш́аран̣ам̇\",\"    нйа̄сӣш́варам̇ ш́рӣдхарам\"],\"translation\":[\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;*(Ш́рӣла Бхакти Сундар Говинда Дев-Госва̄мӣ Маха̄ра̄дж)*\",\"Я с благоговением припадаю к стопам Шрилы Шридхара-Дева, который очаровывает всех сладостными песнями преданности. Облаченный в одежды цвета восходящего солнца, он — святой, почитаемый преданными Господа. Он — океан духовного знания, образец отречения от мирского и хранитель совершенных истин. Он — воплощение любви и преданности Богу, дарующий высшую удачу, и сокровищница духовного экстаза. Он величайший из последователей Шрилы Бхактисиддханты, предводитель санньяси, мой владыка и учитель, мое единственное прибежище! С любовью я склоняюсь к лотосоподобным стопам Шрилы Шридхара-Дева.\"],\"isLong\":false},{\"subtitle\":[\"Бхагаван Шрила Бхактисиддханта Сарасвати\"],\"translation\":[\"![Бхагаван Шрила Бхактисиддханта Сарасвати](/images/resources/en/5.jpg =454x543)\"],\"isLong\":false},{\"text\":[\"ш́рӣ-сиддха̄нта-сарасватӣти видито\",\"    гауд̣ӣйа-гурв-анвайе\",\"бхато бха̄нурива прабха̄та-гагане\",\"    йо гаура-сам̇кӣрттанаих̣\",\"ма̄йа̄ва̄да-тимин̇гилодара-гата̄н\",\"    уддхр̣тйа джӣванима̄н\",\"кр̣ш̣н̣а-према-судха̄бдхи-га̄хан̣а-сукхам̇\",\"    пра̄да̄т прабхум̇ там̇ бхадже\"],\"translation\":[\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;*(Ш́рӣла Бхакти Ракш̣ак Ш́рӣдхар Дев-Госва̄мӣ Маха̄ра̄дж)*\",\"Среди великих учителей Гаудия-вайшнавов он известен как Шрила Бхактисиддханта Сарасвати. Словно сияющее солнце, взошедшее на небосклоне, он явился, чтобы спасти души, поглощенные всепожирающей философией имперсонализма. Проповедуя учение Господа Гауранги о воспевании Святого Имени Господа Кришны, он даровал шанс погрузиться в океан любви к Шри Кришне, Высшей Личности. Шрила Бхактисиддханта — мой господин и божественный учитель. У его лотосоподобных стоп я молю о вечном служении ему!\"],\"isLong\":false},{\"subtitle\":[\"Шрила Гауракишор Дас Бабаджи Махарадж\"],\"translation\":[\"![Шрила Гауракишор Дас Бабаджи Махарадж](/images/resources/en/6.jpg =454x543)\"],\"isLong\":false},{\"text\":[\"намо гауракиш́ора̄йа\",\"    бхакта̄вадхӯта мӯртайе\",\"гаура̄н̇гхри падма-бхр̣н̇га̄йа\",\"    ра̄дха̄-бха̄ва-ниш̣евине\"],\"translation\":[\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;*(Ш́рӣла Бхакти Ракш̣ак Ш́рӣдхар Дев-Госва̄мӣ Маха̄ра̄дж)*\",\"Я склоняюсь перед нашим Гуру, Шрилой Гауракишором Дасом, чистым преданным, стоящим выше всяких социальных условностей. Он подобен пчеле у лотосоподобных стоп Шри Гауранги и в своем сердце вечно служит Шри Радхе.\"],\"isLong\":false},{\"subtitle\":[\"Шрила Бхактивинод Тхакур\"],\"translation\":[\"![Шрила Бхактивинод Тхакур](/images/resources/en/7.jpg =454x543)\"],\"isLong\":false},{\"text\":[\"ванде бхактивинодам̇ ш́рӣ-\",\"    гаура-ш́акти-сварӯпакам\",\"бхакти-ш́а̄страджн̃а-самра̄джам̇\",\"    ра̄дха̄-раса-судха̄-нидхим\"],\"translation\":[\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;*(Ш́рӣла Бхакти Ракш̣ак Ш́рӣдхар Дев-Госва̄мӣ Маха̄ра̄дж)*\",\"Я преклоняюсь перед Шри Тхакуром Бхактивинодом, воплощением божественной любви Махапрабху. Он царь среди знатоков сокровенного смысла священных писаний и океан преданности Шри Радхе.\"],\"isLong\":false},{\"subtitle\":[\"Шрила Джаганнатх Дас Бабаджи Махарадж\"],\"translation\":[\"![Шрила Джаганнатх Дас Бабаджи Махарадж](/images/resources/en/8.jpg =454x543)\"],\"isLong\":false},{\"text\":[\"гаура-враджа̄ш́рита̄ш́еш̣аир\",\"    ваиш̣н̣аваир вандйа-виграхам\",\"джаганна̄тха-прабхум̇ ванде\",\"    према̄бдхим̇ вр̣ддха-ваиш̣н̣авам\"],\"translation\":[\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;*(Ш́рӣла Бхакти Ракш̣ак Ш́рӣдхар Дев-Госва̄мӣ Маха̄ра̄дж)*\",\"Я поклоняюсь стопам великого учителя всех вайшнавов, признанного патриарха чистой преданности, любимого всеми вайшнавами Навадвипы и Вриндавана, — океану любви, Шриле Джаганнатхе Прабху.\"],\"isLong\":false},{\"subtitle\":[\"Молитва вайшнавам\"],\"text\":[\"ва̄н̃чха̄-калпа-тарубхйаш́’ ча\",\"    кр̣па̄-синдхубхйа эва ча\",\"патита̄на̄м̇ па̄ванебхйо\",\"    ваиш̣н̣авебхйо намо намах̣\"],\"word_by_word\":[\"**ва̄н̃чха̄** — желания; **калпа** — исполняющим; **тарубхйаш́** — деревьям; **ча** — и; **кр̣па̄** — милости; **синдхубхйа** — океанам; **эва** — воистину; **ча** — и; **патита̄на̄м̇** — падших; **па̄ванебхйо** — спасителям; **ваиш̣н̣авебхйо** — вайшнавам; **намо** — поклоны; **намах̣** — поклоны.\"],\"translation\":[\"В благоговении я склоняюсь к святым стопам великих вайшнавов, которые, подобно деревьям желаний, способны удовлетворить все желания преданных Господа. Их можно сравнить с безбрежным океаном беспричинной милости, поскольку они спасают от страданий мирского существования падшие души. Я выражаю им свое глубокое почтение.\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;*(Ш́рӣла Рӯпа Госва̄мӣ)*\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"ва̄н̃чха̄\",\"trans\":\"желания\",\"sep\":\"-\"},{\"text\":\"калпа\",\"trans\":\"исполняющим\",\"sep\":\"-\"},{\"text\":\"тарубхйаш́\",\"trans\":\"деревьям\",\"sep\":\"’ \"},{\"text\":\"ча\",\"trans\":\"и\",\"sep\":\"\"}],[{\"text\":\"кр̣па̄\",\"trans\":\"милости\",\"sep\":\"-\"},{\"text\":\"синдхубхйа\",\"trans\":\"океанам\",\"sep\":\" \"},{\"text\":\"эва\",\"trans\":\"воистину\",\"sep\":\" \"},{\"text\":\"ча\",\"trans\":\"и\",\"sep\":\"\"}],[{\"text\":\"патита̄на̄м̇\",\"trans\":\"падших\",\"sep\":\" \"},{\"text\":\"па̄ванебхйо\",\"trans\":\"спасителям\",\"sep\":\"\"}],[{\"text\":\"ваиш̣н̣авебхйо\",\"trans\":\"вайшнавам\",\"sep\":\" \"},{\"text\":\"намо\",\"trans\":\"поклоны\",\"sep\":\" \"},{\"text\":\"намах̣\",\"trans\":\"поклоны\",\"sep\":\"\"}]]},{\"subtitle\":[\"Молитва Панча-таттве\"],\"text\":[\"пан̃ча-таттва̄тмакам̇ кр̣ш̣н̣ам̇\",\"    бхакта-рӯпа-сварӯпакам\",\"бхакта̄вата̄рам̇ бхакта̄кхйам̇\",\"    нама̄ми бхакта-ш́актикам\"],\"word_by_word\":[\"**пан̃ча** — пяти; **таттва̄тмакам̇** — сущностям; **кр̣ш̣н̣ам̇** — Кришне (Шри Гаурангадеву); **бхакта** — (в) преданного; **рӯпа** — форме; **сварӯпакам** — (Его) собственной форме (Шри Нитьянанде); **бхакта̄вата̄рам̇** — преданному аватару (Шри Адвайте Прабху); **бхакта̄кхйам̇** — известному как преданный (Шривасу Пандиту); **нама̄ми** — поклоняюсь; **бхакта** — преданных; **ш́актикам** — энергии (Шри Гададхару).\"],\"translation\":[\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;*(«Шри Чайтанья-чаритамрита»: Ади-лила, 1.14)*\",\"Я почтительно склоняюсь перед Господом Кришной в Его пяти аспектах, известных как Панча-таттва. Я почитаю Шри Гаурангадева, который приходит в этот мир как преданный Господа, наслаждающийся Своей собственной вечной сладостью. Я преклоняюсь перед Господом Нитьянандой Прабху. Он неотличен от Шри Гауранги и одновременно — Его старший брат. Я выражаю почтение великому Шри Адвайте Прабху, воплощению преданного Господа, и вечным спутникам Господа, таким как Шривас Пандит, что служат Богу в преданности, основанной на любви. Я почтительно припадаю к стопам преданных, хранящих подлинное могущество абсолютного самопредания: Шри Рамананды Рая, Шри Гададхара Пандита и Шри Сварупы Дамодара.\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;*(Ш́рӣла Кришнада̄с Кавира̄дж Госва̄мӣ)*\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"пан̃ча\",\"trans\":\"пяти\",\"sep\":\"-\"},{\"text\":\"таттва̄тмакам̇\",\"trans\":\"сущностям\",\"sep\":\" \"},{\"text\":\"кр̣ш̣н̣ам̇\",\"trans\":\"Кришне (Шри Гаурангадеву)\",\"sep\":\"\"}],[{\"text\":\"бхакта\",\"trans\":\"(в) преданного\",\"sep\":\"-\"},{\"text\":\"рӯпа\",\"trans\":\"форме\",\"sep\":\"-\"},{\"text\":\"сварӯпакам\",\"trans\":\"(Его) собственной форме (Шри Нитьянанде)\",\"sep\":\"\"}],[{\"text\":\"бхакта̄вата̄рам̇\",\"trans\":\"преданному аватару (Шри Адвайте Прабху)\",\"sep\":\" \"},{\"text\":\"бхакта̄кхйам̇\",\"trans\":\"известному как преданный (Шривасу Пандиту)\",\"sep\":\"\"}],[{\"text\":\"нама̄ми\",\"trans\":\"поклоняюсь\",\"sep\":\" \"},{\"text\":\"бхакта\",\"trans\":\"преданных\",\"sep\":\"-\"},{\"text\":\"ш́актикам\",\"trans\":\"энергии (Шри Гададхару)\",\"sep\":\"\"}]]},{\"subtitle\":[\"Молитва Господу Гауранге\"],\"text\":[\"намо маха̄-вада̄нйа̄йа\",\"    кр̣ш̣н̣а-према-прада̄йа те\",\"кр̣ш̣н̣а̄йа кр̣ш̣н̣а-чаитанйа-\",\"    на̄мне гаура-твиш̣е намах̣\"],\"word_by_word\":[\"**намо** — поклон; **маха̄** — великому; **вада̄нйа̄йа** — милостивому; **кр̣ш̣н̣а** — (к) Кришне; **према** — любовь; **прада̄йа** — дарующему; **те** — Тебе; **кр̣ш̣н̣а̄йа** — Кришне; **кр̣ш̣н̣а** — (который есть) Кришна; **чаитанйа** — Чайтанья; **на̄мне** — по имени; **гаура** — золотым (цветом); **твиш̣е** — сияющему; **намах̣** — поклоны.\"],\"translation\":[\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;*(«Шри Чайтанья-чаритамрита»: Мадхья-лила, 19.53)*\",\"Я склоняюсь перед Господом Гаурангой, чей божественный облик излучает золотое сияние, кто обладает качествами самого милостивого воплощения Бога. Его духовные игры щедро даруют каждому чистую любовь к Господу Кришне. Он не кто иной, как сам Шри Кришна, известный в век Кали под именем Шри Кришны Чайтаньи.\\\\\",\"\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;*(Ш́рӣла Рӯпа Госва̄мӣ)*\"],\"isLong\":false,\"isWbwInlineModeAvailable\":true,\"inline_word_by_word\":[[{\"text\":\"намо\",\"trans\":\"поклон\",\"sep\":\" \"},{\"text\":\"маха̄\",\"trans\":\"великому\",\"sep\":\"-\"},{\"text\":\"вада̄нйа̄йа\",\"trans\":\"милостивому\",\"sep\":\"\"}],[{\"text\":\"кр̣ш̣н̣а\",\"trans\":\"(к) Кришне\",\"sep\":\"-\"},{\"text\":\"према\",\"trans\":\"любовь\",\"sep\":\"-\"},{\"text\":\"прада̄йа\",\"trans\":\"дарующему\",\"sep\":\" \"},{\"text\":\"те\",\"trans\":\"Тебе\",\"sep\":\"\"}],[{\"text\":\"кр̣ш̣н̣а̄йа\",\"trans\":\"Кришне\",\"sep\":\" \"},{\"text\":\"кр̣ш̣н̣а\",\"trans\":\"(который есть) Кришна\",\"sep\":\"-\"},{\"text\":\"чаитанйа\",\"trans\":\"Чайтанья\",\"sep\":\"-\"}],[{\"text\":\"на̄мне\",\"trans\":\"по имени\",\"sep\":\" \"},{\"text\":\"гаура\",\"trans\":\"золотым (цветом)\",\"sep\":\"-\"},{\"text\":\"твиш̣е\",\"trans\":\"сияющему\",\"sep\":\" \"},{\"text\":\"намах̣\",\"trans\":\"поклоны\",\"sep\":\"\"}]]},{\"subtitle\":[\"Туласи-пранама-мантра\"],\"text\":[\"вр̣нда̄йаи туласӣ-девйаи\",\"    прийа̄йаи кеш́авасйа ча\",\"кр̣ш̣н̣а-бхакти-праде деви\",\"    сатйаватйаи намо намах̣\"],\"translation\":[\"Я вечно преклоняюсь перед Шри Вриндой Деви, Шримати Туласи Махарани, которую нежно любит сам Господь Кешава! Я простираюсь перед Сатьявати, дарующей чистую преданность Господу Кришне!\"],\"isLong\":false},{\"subtitle\":[\"Пранама-мантра духовным учителям\"],\"text\":[\"атха натва̄ мантра-гурӯн\",\"    гурӯн бха̄гавата̄ртхада̄н\",\"вйа̄са̄н джагат-гурӯн натва̄\",\"    тато джайо удӣрайет\"],\"translation\":[\"Я вновь склоняюсь перед своими духовными учителями: перед Гуру, который посвятил меня в божественную *мантру*, и перед всеми, кто раскрывает сокровенный смысл «Шримад-Бхагаватам». Я в почтении склоняюсь перед Шрилой Вьясадевой, духовным учителем Вселенной, давшим исчерпывающие объяснения «Шримад-Бхагаватам».\"],\"isLong\":false},{\"subtitle\":[\"Пранама-мантра Господу и Его спутникам\"],\"text\":[\"джайах̣ са-парикара ш́рӣ-ш́рӣ-гуру-гаура̄н̇га-\",\"га̄ндхарва̄-говинда-сундара-па̄дападма̄на̄м̇ джайасту\"],\"translation\":[\"Пусть лотосоподобные стопы Шри Гурудева, Шримана Махапрабху, Шри Шри Гандхарва-Говиндасундара и Их вечных спутников восторжествуют в наших сердцах!\"],\"isLong\":false}],\"hasWbw\":true,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":true}}],false]]}]}],\"$L16\",\"$L17\"]}]]}],\"$L18\"]}],\"$L19\",\"$L1a\",\"$L1b\"]}]]}]\n"])</script><script>self.__next_f.push([1,"1c:I[4423,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-fc5ceed14602676c.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-65410376f01b9cc7.js\"],\"default\"]\n1e:I[9181,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-fc5ceed14602676c.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-65410376f01b9cc7.js\"],\"default\"]\n1f:I[9508,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-fc5ceed14602676c.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-65410376f01b9cc7.js\"],\"GoogleAnalytics\"]\n20:I[8550,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\"
