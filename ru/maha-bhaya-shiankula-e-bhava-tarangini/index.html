Душа *(джива)*, исполненная ужасного трепета *(маха-бхайи)*, уносима прочь волнами пучины материального бытия. Так, в череде рождений и смертей, скитаясь во тьме иллюзорного мира, она скована могуществом Маха-майи.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"    караби ки мана абха̄гийа̄ —\",\"бхувана-мохана-ма̄йа̄    кемане ре утараби\",\"    лабхини кемане ка̄на̄ийа̄?\"],\"translation\":[\"О ум! Можешь ли ты избавить меня от великого несчастья? Маха-майя приводит в замешательство всю вселенную — так сможешь ли ты когда-нибудь преодолеть ее? Как ты достигнешь Канай-лала — юного Кришны Голоки Вриндавана?\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"ниджа-рӯпевита̄ри’    три-гун̣а-джа̄ле пха̄̐да рачи’\",\"    та̄̐хи ма̄хе ган̣ика̄ пратиш̣т̣ха̄ —\",\"канака вара̄н̇гана̄    да̄нийа̄ а̄миш̣а сама\",\"    сa̐питечхе ка̄ла-каре дхр̣ш̣т̣а̄\"],\"translation\":[\"Обусловленный, ты пытаешься вырваться из паутины, сотканной из трех состояний материальной природы, которая набросила на тебя петлю. Ты обращался с Майей, как с проституткой. Она же скармливала тебе *канак, камини* и *пратиштху* как мясо, и ты погрузился во тьму высокомерия.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"    мана маджху ва̄та авадха̄на\",\"сои дайа̄лу прабху    чаран̣а сародже манна\",\"    дхана-тану, сабаху̐ да̄на\"],\"translation\":[\"Мой ум, ты непостоянен, словно ветер. Ты сможешь обрести подлинное богатство у лотосоподобных стоп всемилостивого Господа, поэтому полностью предайся им.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"йа̐кара ма̄йа̄    тачху паде паран̣ами\",\"    леха ш́аран̣а хои дӣна\",\"свапанеха на̄ бха̄виха    та̐ка чаран̣а вину\",\"    дхарама йукати самӣчӣна\"],\"translation\":[\"Предложи себя лотосоподобным стопам Господа, хозяина и повелителя Майи, со всем смирением приняв в них прибежище. Даже не мечтай, что без предания Его лотосоподобным стопам ты сможешь должным образом приспособиться к окружающему миру или практиковать духовную жизнь *(дхарму)*.\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false},\"telegraphUrl\":\"https://telegra.ph/Maja-Duratjaja-02-22\"},\"head\":{\"canonical\":\"/ru/maha-bhaya-shiankula-e-bhava-tarangini/\",\"description\":\"Майа Дуратйайа — вайшнавская песня с текстом, русским переводом и пословным разбором. Автор — Ш́рӣла Бхакти Сундар Говинда Дев-Госва̄мӣ Маха̄ра̄дж. Из сборника «Гаудия Гитанджали».\",\"title\":\"Майа Дуратйайа. Ш́рӣла Бхакти Сундар Говинда Дев-Госва̄мӣ Маха̄ра̄дж | Kirtan Site\"},\"kind\":\"song\",\"route\":{\"kind\":\"item\",\"bookId\":\"ru\",\"slug\":\"maha-bhaya-shiankula-e-bhava-tarangini\"}}}]}]]}]\n"])</script></body></html>
