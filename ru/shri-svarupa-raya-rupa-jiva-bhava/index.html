который покинул мир в 1910 году эры Шака (в 1988 году н. э.).\"],\"isLong\":false},{\"text\":[\"канака суручи ра̄нгам̇ сундарам̇ саумйа-мӯртим̇\",\"вибудха-кула-варен̣йам̇ ш́рӣ-гурум̇ сиддхи-пӯртим\",\"тарун̣а-тапана-ва̄сам̇ бхактидан̃ чид-вила̄сам̇\",\"бхаджа бхаджа ту мано ре ш́рӣдхарам̇ ш́амбидха̄нам\"],\"translation\":[\"Мой дорогой ум, молю, вечно поклоняйся Шриле Бхакти Ракшаку Шридхару Дев-Госвами Махараджу, который проявил свой облик Шри Гурудева; который заботливо хранит; чей очаровательный золотистый облик, облаченный в сияющие шафрановые одежды, исполнен сладости и безмятежности; чье богатство — в безграничной преданности; который высокообразован и является самым выдающимся среди последователей Шрилы Сарасвати Тхакура.\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"21:[\"$\",\"$L29\",null,{\"navMap\":{\"274\":{\"prev\":{\"path\":\"/ru/mishra-suta-vishvambhara-navadvipa-vasa/\",\"title\":\"Саннйаса Шри Нимайа\"},\"next\":{\"path\":\"/ru/naumi-shri-gurupadabjam/\",\"title\":\"Пранати-дашакам\"}}}}]\n2a:Tf64,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"description\":\"A digital Vaishnava songbook with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPage\",\"@id\":\"https://dev.kirtan.site/ru/shri-svarupa-raya-rupa-jiva-bhava/\",\"url\":\"https://dev.kirtan.site/ru/shri-svarupa-raya-rupa-jiva-bhava/\",\"name\":\"Пранам-мантры Шриле Бхакти Ракшаку Шридхару Дев-Госвами Махараджу. Ш́рӣла Бхакти Сундар Говинда Дев-Госва̄мӣ Ма
