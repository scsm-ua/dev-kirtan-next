translation\":[\"Кришна принадлежит тебе, ты можешь открыть Его другим, ты наделен такой силой! Я как безумный зову: «Кришна, Кришна!», и бегу за тобой в отчаянии.\"],\"isLong\":false},{\"text\":[\"(а̄ми) (дха̄и тава па̄чхе па̄чхе)\",\"(кр̣ш̣н̣а дхана па̄бара̄се дха̄и тава па̄чхе па̄чхе)\",\"(туми дилеоу дите па̄ро)\",\"(кр̣ш̣н̣а тома̄р хр̣дойер дхан туми дилеоу дите па̄ро)\",\"(кр̣ш̣н̣а дева̄р ш́акти дхара туми дилеоу дите па̄ро)\"],\"translation\":[\"*Примечание к стиху 2:*\",\"Шесть побуждений: речь, ум, гнев, язык, желудок и гениталии.\",\"Шесть недостатков: переедание или накопление сбережений в количестве большем необходимого; чрезмерные усилия ради достижения мирских целей; праздные разговоры на мирские темы; излишнее внимание к соблюдению указаний священных писаний или, наоборот, пренебрежение ими; общение с материалистически настроенными людьми; страстная жажда мирских достижений.\",\"Шесть достоинств: энтузиазм; терпение; уверенность; решимость, необходимая для совершения благоприятных для служения с преданностью действий; решимость избегать общения с непреданными; послушание, необходимое для того, чтобы всегда следовать по стопам *ачарьев*.\",\"Шесть видов святого общения: предлагать дары из милосердия, принимать пожертвования, доверять свои мысли другим, слушать о сокровенном от других, принимать *прасадам* и предлагать *прасадам*.\"],\"isLong\":false}],\"embeds\":[{\"title\":\"Шрила Ачарья Махарадж\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/acharya-maharaj-ohe-vaishnava\",\"iframe_url\":\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Facharya-maharaj-ohe-vaishnava\",\"embed_code\":\"\u003ciframe width=\\\"100%\\\" height=\\\"20\\\" scrolling=\\\"no\\\" frameborder=\\\"no\\\" allow=\\\"autoplay\\\" src=\\\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Facharya-maharaj-ohe-vaishnava\\\"\u003e\u003c/iframe\u003e\"},{\"title\":\"Навадвип Дхам\",\"embed_url\":\"https://s
