translation\":[\"О Верховный Господь, уничтоживший демонического змея Калию! О Господь, Ты — возлюбленный всех живых существ и солнце в плеяде династии Яду. Слава! Слава Господу Хари!\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"мадху-мура-нарака-вина̄ш́ана гаруд̣а̄сана хе\",\"сура-кула-кели-нида̄на джайа джайа дева харе\"],\"translation\":[\"О Господь, повергнувший демонов Мадху, Мура и Нарака! Восседающий на Гаруде, Ты — источник радости небожителей. Слава Господу Хари!\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"амала-камала-дала-лочана бхава-мочана хе\",\"трибхувана-бхувана-нидха̄на джайа джайа дева харе\"],\"translation\":[\"О Господь, Твои глаза подобны лепесткам лотоса, Ты разрушаешь темницу материального мира. Ты хранитель трех миров. Слава Господу Хари!\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"джанака-сута̄-кр̣та-бхӯш̣ан̣а джита-дӯш̣ан̣а хе\",\"самара-ш́амита-даш́а-кан̣т̣ха джайа джайа дева харе\"],\"translation\":[\"О Господь, будучи жемчужиной среди сыновей Джанаки, Ты победил всех *асуров*, Ты сокрушил величайшего *асура*, десятиглавого Равану. Слава Господу Хари!\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"абхинава-джала-дхара-сундара дхр̣та-мандара хе\",\"ш́рӣ-мукха-чандра-чакора джайа джайа дева харе\"],\"translation\":[\"О Верховный Господь, державший холм Говардхан! Цвет Твоей кожи подобен цвету свежего дождевого облака, а Шри Радхарани подобна птице *чакора*, которая поддерживает свое существование, питаясь светом Твоего луноподобного лика. Слава! Слава Господу Хари!\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"тава чаран̣ам̇ пран̣ата̄ вайам ити бха̄вайа хе\",\"куру куш́алам̇ пран̣атеш̣у джайа джайа дева харе\"],\"translation\":[\"О Господь, я предлагаю свои смиренные поклоны Твоим лотосоподобным стопам. Пожалуйста, благослови меня Своей безграничной милостью. Слава! Слава Господу Шри Хари!\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"ш́рӣ-джайадева-кавер идам̇ куруте мудам хе\",\"ман̇галам уджвала-гӣтам̇ джайа джайа дева харе\"],\"translation\":[\"Поэт Шри Джаядев предлагает эту песню преданности и желает блистающей удачи Тебе. Слава! Слава Господу Шри Хари!\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":\"Бхакти Лалита Деви\",\"embed_url\":\"https://soundcloud.com/bhakti-lalita-devi/sri-mangala-gitam\",\"personSlug\":\"bhakti-lalita-devi\"},{\"title\":\"Сударшан Прабху\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/sudarshan-prabhu-srita-kamala\",\"personSlug\":\"sudarshan-prabhu\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"18:[\"$\",\"$L21\",null,{\"audio\":\"$17:props:song:resources:audio\",\"bookId\":\"ru\",\"caption\":\"Слушать аудио:\",\"songTitle\":\"Шрита Камала\"}]\n19:[\"$\",\"$L22\",null,{\"navMap\":{\"211\":{\"prev\":{\"path\":\"/ru/jaya-yashoda-nandana-krishna-gopala-govinda/\",\"title\":\"Джайа Джашода-Нандана Кршна\"},\"next\":{\"path\":\"/ru/jaya-shrila-maharaja-charanaravinda/\",\"title\":\"Ачарйа-чарана-вандана\"}}}}]\n23:Tf84,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"alternateName\":[\"Kirtan Guide\",\"Vaishnava Songbook\"],\"description\":\"A digital Vaishnava songbook and kirtan guide with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPage\",\"@id\":\"https://dev.kirtan.site/ru/shrita-kamala-kuchha-mandala-dhrita/\",\"url\":\"https://dev.kirtan.site/ru/shrita-kamala-kuchha-mandala-dhrita/\",\"name\":\"Шрита Камала. Ш́рӣла Джайадев Госва̄мӣ\",\"inLanguage\":\"ru\",\"description\":\"Шрита Камала
