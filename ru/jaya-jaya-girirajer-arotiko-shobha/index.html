̄ на̄хи сӣма̄\",\"дива̄ниш́и-бхакта-вр̣нда коре парикрама̄\"],\"translation\":[\"Вместе со Шри Говинда-кундой эти святые места безграничны. Днем и ночью преданные обходят их!\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"‘ш́рӣдхар-сва̄мӣ-сева̄ш́рам’ парама ш́обхана\",\"джатха̄ нитйа-сева̄ коре са̄расвата-ган̣а\"],\"translation\":[\"Здесь располагается невероятно красивый Шридхар Свами Сева-ашрам, где служат преданные Шри Чайтанья Сарасват Матха.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"абхинна ш́рӣ кр̣ш̣н̣а джн̃а̄не бхаджиба̄ра торе\",\"маха̄прабху самарпила̄ рагхуна̄тха коре\"],\"translation\":[\"Шриман Махапрабху даровал Шри Шри Гирираджа-джиу Шри Рагхунатху Госвами, чтобы Шри Дас Госвами мог поклоняться Его Святейшеству, зная, что Он неотличен от Господа Кришны!\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"госва̄мӣ ш́рӣ-рагхуна̄тха да̄сере смарийа̄\",\"нирантара сева̄ коре антармана̄ хоийа̄\"],\"translation\":[\"Преданные Шри Чайтанья Сарасват Матха поклоняются Шри Шри Гирираджа-джиу, глубоко погруженные в настроение преданности и помнящие о Шри Рагхунатхе Дасе Госвами!\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"джайа гири-говардхана дивйа-раса̄лой\",\"рӯпа-сана̄тана-джӣва-рагхуна̄тха̄ш́рой\"],\"translation\":[\"Вся слава Шри Гири Говардхану — обители Шри Рупы, Санатаны, Дживы и Рагхунатха Госвами!\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"сурендра-мунӣндра-ш́ива-ш́ука-маха̄джана\",\"декхена а̄рати-ш́обха̄ дурлабха-дарш́анна\"],\"translation\":[\"Редкую и бесценную красоту *арати* Шри Гирираджа-джиу видят Господь Индра, Нарада Муни, Господь Шива, Шукадев Госвами и все великие личности!\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"севйа о севака-рӯпе нитйа парака̄ш́а\",\"са̄нанде а̄рати декхе э адхама да̄са\"],\"translation\":[\"Шри Шри Гирираджа-джиу вечно проявлен и как Господь, которому поклоняются, и как Господь-слуга. Падший слуга в восторге созерцает *арати* Шри Гирираджа-джиу!\"],\"isLong\":false},{\"tex
