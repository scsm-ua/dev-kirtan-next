ssName\":\"SongbookList\",\"children\":[[\"$\",\"$L13\",\"ru\",{\"description\":{\"title\":\"Гаудия Гитанджали\",\"subtitle\":\"Cборник вайшнавских песен и молитв\",\"slug\":\"ru\",\"sort_order\":20,\"render\":{\"tg.contents.first_line\":false,\"tg.a-z.title.words\":3},\"songsCount\":177},\"href\":\"/ru/ore-mana-bhalo-nahi-lage-e-somsara/\",\"isActive\":true}]]}]}],[\"$\",\"$L14\",null,{\"bookId\":\"ru\",\"telegraphUrl\":\"https://telegra.ph/Ore-mana-bhalo-nahi-lagi-eh-somsara-02-22\"}]]}]]}],[\"$undefined\",[\"$\",\"section\",null,{\"className\":\"SongHeader\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"SongHeader__title\",\"children\":[[\"$\",\"div\",\"0\",{\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[false,\"Оре мана бхало нахи лаги э сомсара\"]}]]}]]}],null,[],[[\"$\",\"div\",\"0\",{\"className\":\"SongHeader__author\",\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[false,[\"$\",\"a\",null,{\"href\":\"/ru/authors/\",\"rel\":\"author\",\"children\":\"Ш́рӣла Бхактивинод Т̣ха̄кур\"}]]}]]}]]]}]]]}],[[\"$\",\"$L15\",null,{\"bookId\":\"ru\",\"label\":\"Показывать стихи / перевод\",\"song\":{\"meta\":{\"first_line\":\"оре мана бха̄ло на̄хи ла̄ге э сом̇са̄ра\"},\"title\":[\"Оре мана бхало нахи лаги э сомсара\"],\"author\":[\"Ш́рӣла Бхактивинод Т̣ха̄кур\"],\"verses\":[{\"number\":\"1\",\"text\":[\"оре мана бха̄ло на̄хи ла̄ге э сом̇са̄ра\",\"джанама-маран̣а-джара̄ дже сом̇са̄ре а̄чхе бхара̄\",\"та̄хе киба а̄чхе боло’ са̄ра\"],\"translation\":[\"Послушай, мой дорогой ум. Мне совершенно не нравится этот материальный мир. Это не более чем место, исполненное страданий, вызванных рождением, болезнями, старостью и смертью. Ответь мне теперь, разве можно найти в этом мире что-то хорошее, помимо страданий?\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"дхана-джана-париба̄ра кехо на̄хе кабху ка̄’ра\",\"ка̄ле митра ака̄ле апара\",\"джа̄ха̄ ра̄кхиба̄ре ча̄ита̄ха̄ на̄хе тха̄ке бха̄и\",\"анитйа самаста бинаш́вара\"],\"translation\":[\"Богатство, последователи и родственники никогда в действительности не могут кому-либо принадлежать. Те, кто окружает тебя сегодня, завтра тебя покинут. Все эти отношения, которые ты хотел бы сохранить, не продлятся долго, мой дорогой ум. О брат, будь уверен в том, что эти временные связи скоротечны.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"а̄йу ати алпа-дина краме та̄ха̄ хойа кхӣн̣а\",\"ш́аманера никат̣а дарш́ана\",\"рога-ш́ока аниба̄ра читта коре’ чха̄ракха̄ра\",\"ба̄ндхаба-биджога дургхат̣ана\"],\"translation\":[\"Продолжительность жизни обитателя этого мира крайне мала, и даже отпущенный срок сокращается с каждым мгновением — до тех пор, пока взору человека не явится Ямарадж, поджидающий поблизости. Страдая от непрекращающихся болезней и горестей, человек скорбит, и от этого его сознание деградирует все больше и больше. В конце концов он встречает свой смертный час и в очередной раз переживает боль разлуки с родными и близкими.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"бха̄ло ко’ре декхо бха̄и амиш́ра а̄нанда на̄и\",\"дже а̄чхе се дух̣кхера ка̄ран̣а\",\"се сукхера торе табе кено ма̄йа̄-да̄са хабе\",\"хараибе парама̄ртха-дхана\"],\"translation\":[\"Просто открой глаза, мой дорогой брат. Не стремись к так называемому мирскому счастью, ибо оно, будучи смесью боли и радости, на самом деле служит источником всех твоих бед. Если дело обстоит так, как я говорю, то почему же ты стал рабом *майи* лишь ради этого жалкого так называемого счастья? Понимаешь ли ты, что наделал? Попадая в рабство *майи*, ты только обкрадываешь себя, ибо лишаешься своего вечного сокровища — достижения высшей цели жизни.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"итиха̄са-а̄лочане бхебе декхо’ ниджа мане\",\"кото а̄сурика дура̄ш́ойа\",\"индрийа-тарпан̣а са̄ра кори’ кото дура̄ча̄ра\",\"ш́еш̣е лабхе маран̣а ниш́чойа\"],\"translation\":[\"Просто остановись и поразмысли, припоминая историю своей жизни: вспомни, жертвой сколь многих демонических наклонностей ты был. В поисках крохи чувственного наслаждения, сколько тяжких грехов ты совершил? А теперь взгляни на результат этой долгой погони за счастьем, он один — твоя неотвратимая смерть.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"маран̣а-самайа та̄’ра упа̄йа хоийа̄ ха̄ра\",\"анута̄па-аналеджва̄лило\",\"куккура̄ди паш́у-пра̄йа джӣбана ка̄т̣а̄йа ха̄йа\",\"парама̄ртха кабху на̄ чинтило\"],\"translation\":[\"Увы! Ни разу не задумавшись над смыслом или целью человеческой жизни, такой человек впустую проводит жизнь, подобно собаке или свинье. Когда же за ним приходит смерть, он, лишенный всякой надежды на спасение, горько стенает, сжигаемый огнем раскаяния.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"эмона биш̣айе мана кено тха̄ко ачетана\",\"чха̄д̣о чха̄д̣о биш̣айера а̄ш́а̄\",\"ш́рӣ-гуру-чаран̣а̄ш́ройакоро’ сабе бха̄ба джойа\",\"э да̄сера сеи то’ бха̄раса̄\"],\"translation\":[\"Мой дорогой ум, так скажи мне, почему ты не желаешь очнуться, а по-прежнему поглощен этим временным и бесполезным занятием — услаждением чувств? Я хочу, чтобы ты отказался от него прямо сейчас и оставил все надежды на подобные наслаждения в будущем. Этот смиренный слуга надеется, что ты сумеешь превозмочь невзгоды материального бытия, если примешь пристанище у лотосоподобных стоп Шри Гуру, духовного учителя и твоего самого большого доброжелателя.\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}],false]]}]}],\"$L16\",\"$L17\"]}]]}],\"$L18\"]}],\"$L19\",\"$L1a\",\"$L1b\"]}]]}]\n"])</script><script>self.__next_f.push([1,"1c:I[4423,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-0d575d94bced837d.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"default\"]\n1e:I[9181,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-0d575d94bced837d.js\"
