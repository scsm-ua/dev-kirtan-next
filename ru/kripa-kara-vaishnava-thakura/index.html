райага̄мӣ\"],\"translation\":[\"Если по ошибке возомню, что я вайшнав, то стану добиваться почтения со стороны других. А если мое сердце осквернится жаждой славы и почитания, тогда непременно я навеки отправлюсь в ад.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"томара кин̇кора,    а̄пане джа̄нибо,\",\"    ‘гуру’-абхима̄н тйаджи’\",\"тома̄ра уччхиш̣т̣ха,    пададжала-рен̣у,\",\"    сада̄ ниш̣капат̣е бхаджи\"],\"translation\":[\"Отказавшись от ложного представления, что я Гуру, пойму, что на деле я твой покорный слуга. Я с искренней почтительностью принимаю остатки твоей пищи, о вайшнав, а также воду, что смыла священную пыль с твоих стоп.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"‘нидже среш̣т̣ха джа̄ни’, уччхиш̣т̣ха̄ди да̄не,\",\"    ха’бе абхима̄н бха̄р\",\"та̄и ш́иш̣йа тава,    тха̄кийа̄ сарвада̄,\",\"    на̄ лоибо пӯджа̄ ка̄’ра\"],\"translation\":[\"Если я буду делиться с другими остатками своей пищи, то поставлю себя в положение старшего и возгоржусь. Поэтому, всегда оставаясь преданным тебе учеником, я не стану принимать почтения со стороны других.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"ама̄нӣ ма̄нада,    хоиле кӣрттане\",\"    адхика̄р дибе туми\",\"тома̄ра чаран̣е,    ниш̣капат̣е а̄ми,\",\"    ка̄̐дийа̄ лут̣ибо бхӯми\"],\"translation\":[\"Если ты одаришь меня способностью воспевать Святое Имя, я буду оказывать почтение другим и не принимать почтения к себе. Я буду искренне рыдать в упоении, катаясь по земле у твоих лотосоподобных стоп.\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"19:[\"$\",\"$L21\",null,{\"navMap\":{\"137\":{\"prev\":{\"path\":\"/ru/ei-vara-karuna-kara-vaishnava-gosani/\",\"title\":\"Ваишнава Виджнапти\"},\"next\":{\"path\":\"/ru/narada-muni-bajaya-vina/\",\"title\":\"Шри Намаштакам 8\"}}}}]\n22:Td2b,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schem
