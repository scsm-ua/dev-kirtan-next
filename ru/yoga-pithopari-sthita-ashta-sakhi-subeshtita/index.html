\u003e Единение в любви](https://saraswati.pro/books/zolotoy_vulkan_bozhestvennoy_lyubvi/chast_ii_shikshashtaka_nastavleniya_shri_chaytani_makhaprabkhu/edinenie-v-lyubvi/).*\"],\"isLong\":false},{\"number\":\"1\",\"text\":[\"йога-пӣт̣хопари-стхита,    аш̣т̣а-сакхӣ-субеш̣т̣ита,\",\"    фвр̣нда̄ран̣йе кадамба-ка̄нане\",\"ра̄дха̄-саха вам̇ш́ӣ-дха̄рӣ,    виш́ва-джана-читта-ха̄рӣ,\",\"    пра̄н̣а мора та̄̐ха̄ра чаран̣е\"],\"translation\":[\"В *йога-питхе*, окруженный *ашта-сакхи*, в лесу Вриндавана среди деревьев *кадамба *Господь Кришна восседает рядом со Шри Радхой. Он держит флейту и дарит восторг всем душам во Вселенной. Я припадаю к Его стопам и полностью предаюсь Ему!\"],\"isLong\":true},{\"number\":\"2\",\"text\":[\"сакхӣ-а̄джн̃а̄мата кори до̐ха̄ра севана\",\"па̄лйа-да̄сӣ сада̄ бха̄ви до̐ха̄ра чаран̣а\"],\"translation\":[\"Следуя наставлениям *сакхи*, я погружен в служение святой Чете, Шри Радхе и Шри Кришне, всегда считая себя подневольным слугой Их лотосоподобных стоп.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"кобху кр̣па̄ кори,    мама хаста дхори’,\",\"    мадхура вачана боле\",\"та̄мбула лоийа̄,    кха̄йа дуи джоне,\",\"    ма̄ла̄ лойа кутӯхоле\"],\"translation\":[\"Иногда по Своей доброте Они берут меня за руку и с нежностью обращаются ко мне. Они вкушают приготовленные мной орехи бетеля и с величайшей радостью принимают от меня гирлянду.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"адарш́ана хойа какхона ки чхоле\",\"на̄ декхийа̄ до̐хе хийа̄ море джволе\"],\"translation\":[\"А затем Они снова исчезают. Когда я не вижу Радху и Кришну, мое сердце разрывается от страданий!\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"джекха̄не секха̄не,    тха̄кука ду’ джане,\",\"    а̄ми то чаран̣а-да̄сӣ\",\"милане а̄нанда,    вирахе джа̄тана̄,\",\"    сакала сама̄на ба̄си\"],\"translation\":[\"Где бы Они ни находились, я слуга Их лотосоподобных стоп. Испытывая счастье при встрече и агонию в разлуке, я остаюсь Их вечным слугой.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"ра̄дха̄-кр̣ш̣н̣а пра̄н̣а мор джӣване маран̣е\",\"море ра̄кхи’ ма̄ри’ сукхе тха̄кука ду’ джоне\"],\"translation\":[\"Радха и Кришна — моя жизнь и душа, в жизни и в смерти! Защитят ли Они меня или заберут мою презренную жизнь, лишь бы Они были счастливы!\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"бхакативинода,    а̄на на̄хи джа̄не,\",\"    под̣и’ ниджа-сакхӣ-па̄й\",\"ра̄дхика̄ра гон̣е,    тха̄кийа̄ сатата,\",\"    джугала-чаран̣а ча̄й\"],\"translation\":[\"Бхактивинод не знает ничего, кроме Них. Припадая к стопам *сакхи*, Бхактивинод молит остаться среди доверенных служанок Шри Радхи. Лотосоподобные стопы Шри Радхи и Шри Кришны — вечное сокровище Бхактивинода!\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":true,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"21:[\"$\",\"$L29\",null,{\"navMap\":{\"192\":{\"prev\":{\"path\":\"/ru/bondhu-gon-shiunoho-vachana-mora/\",\"title\":\"8a. Бондху-гон̣! ш́уноха\"},\"next\":{\"path\":\"/ru/radhika-charana-padma-sakala-shreyera/\",\"title\":\"Шри Радхаштака 1\"}}}}]\n2a:Tf50,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"description\":\"A digital Vaishnava songbook with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPage\",\"@id\":\"https://dev.kirtan.site/ru/yoga-pithopari-sthita-ashta-sakhi-subeshtita/\",\"url\":\"https://dev.kirtan.site/ru/yoga-pithopari-sthita-ashta-sakhi-subeshtita/\",\"name\":\"Восьмой стих Б «Шри Шикшаштакам». Ш́рӣла Бхактивинод Т̣ха̄кур. Песня восьмая (б)\",\"inLanguage\":\"ru\",\"d
