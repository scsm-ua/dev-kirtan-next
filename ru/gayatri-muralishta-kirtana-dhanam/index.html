е Ом, исходящем из флейты Кришны, и значение этого звука — *га̄йатрӣ муралӣш̣т̣а-кӣртана-дханам̇ ра̄дха̄падам̇ дхӣмахи*. Из флейты Кришны не исходит никаких иных звуков, кроме прославления Шримати Радхарани, и это подлинный смысл и суть Гаятри-мантры.\",\"Солнечные лучи дают жизнь лотосу и питают его, но без воды лотос просто сгорит под лучами солнца.\",\"Флейта — символ Шри Чайтанья Сарасват Матха, который впервые избрал ее своим символом. Однако сейчас многие, вслед за Шри Чайтанья Сарасват Матхом, сделали это. Какова песнь этой флейты? Это прославление Шримати Радхарани Самим Шри Кришной, и это запечатлено в лого Шри Чайтанья Сарасват Матха!\"],\"isLong\":true}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":true,\"fullInlineWbw\":false}}],false]]}]}],\"$L16\",\"$L17\"]}]]}],\"$L18\"]}],\"$L19\",\"$L1a\",\"$L1b\"]}]]}]\n"])</script><script>self.__next_f.push([1,"1c:I[4423,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-0d575d94bced837d.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"default\"]\n1e:I[9181,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-0d575d94bced837d.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"default\"]\n1f:I[9508,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-0d575d94bced837d.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"GoogleAnalytics\"]\n20:I[8550,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-0d575d94bced837d.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"ServiceWorkerRegistration\"]\n21
