реальность Своей собственной удивительной красоты и сладости, Он опьянен нескончаемой раздачей Своего Святого Имени. Служи этому Господу Гаурахари, поклоняйся Ему!\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"удита̄кхила-гаурава-гауд̣апурам̇\",\"пурат̣оджвала-ман̇гала-мӯрта-расам\",\"расанотсава-кӣртана-кр̣ш̣н̣а-харим̇\",\"бхаджа гаурахарим̇ бхаджа гаурахарим\"],\"translation\":[\"Он явил славу Шри Навадвип Дхамы, низойдя в Своей сияющей золотом и благословляющей всех форме божественного упоения. Он вечно поглощен *кришна-киртаном*, который является торжеством для языка. Служи этому Господу Гаурахари, поклоняйся Ему!\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"ниджа-па̄рш̣ада-дарш́ана-датта-ш́убхам̇\",\"ш́убха-на̄ма-судха̄-кр̣та-матта-джанам\",\"джаната̄гха-хара-стхита-читта-дарим\",\"бхаджа гаурахарим̇ бхаджа гаурахарим\"],\"translation\":[\"Он преподнес миру дарующий духовное благо *даршан* Своих вечных спутников. (Или: Он преподнес Свой дарующий духовное благо *даршан* Своим вечным спутникам.) Он свел с ума множество людей нектаром Своего Имени, одаривающего всех духовным благом, тем самым одолев все грехи в глубинах их сердец. Служи этому Господу Гаурахари, поклоняйся Ему!\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"дадатам̇ сататам̇ ниджа-на̄ма-дханам̇\",\"дхана-ма̄на на ваи ванита̄м̇ кавита̄м\",\"витаран враджа-бхактим-адатта-чарӣм̇\",\"бхаджа гаурахарим̇ бхаджа гаурахарим\"],\"translation\":[\"Он непрестанно раздавал духовную удачу Своего божественного Имени. Он не считал плодотворными пути стремления к мирскому благосостоянию, порочным материалистичным желаниям или великим материалистичным мечтам, воспетым в поэзии. Он сделал широкодоступной пятую цель жизни, которая никогда прежде не была дарована миру, — божественную любовь к Кришне, царящую в изначальной божественной обители Господа, Голоке Вриндавана. Служи этому Господу Гаурахари, поклоняйся Ему!\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"патита̄дхама-дӣна-дайа̄дра-хр̣дам̇\",\"хр̣дайа̄ш́рита-йа̄чака-веш́а-кр̣там\",\"кр̣та-веш̣а-йати-ш́рита-нӣла-гирим̇\",\"бхаджа гаурахарим̇ бхаджа гаурахарим\"],\"translation\":[\"Он великий благодетель, Чье сердце растоплено состраданием к падшим. Движимый этим чувством, Он принял одежды нищего (отреченный уклад жизни, *санньясу)*. Облачившись в это одеяние, он обрел прибежище в Нилачале (Джаганнатха Пури). Служи этому Господу Гаурахари, поклоняйся Ему!\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"ш́рути-кӣртита-пӯруш̣а-рукш̣ма-ручим̇\",\"ручи-ра̄га-ниш̣еван̣а-да̄на-парам\",\"парама̄ртха-пура̄н̣а-вигӣта-харим̇\",\"бхаджа гаурахарим̇ бхаджа гаурахарим\"],\"translation\":[\"Его ослепительная золотая Личность воспета писаниями и святыми. Он величайший даритель спонтанного любовного божественного служения (чистых трансцендентных привязанности к Господу и служения Ему, свободных от всего мирского). Он Господь, Чья слава воспевается везде в писаниях, описывающих трансцендентное знание (Пураны). (Или: Он Господь, удаляющий все кажущиеся противоречия, которые можно обнаружить в откровениях трансцендентного знания Пуран.) Служи этому Господу Гаурахари, поклоняйся Ему!\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"баху-нартана-кӣртана-матта-карам\",\"карата̄ла-мр̣дан̇га-вибхан̇га-парам!\",\"парама̄дара-па̄мара-ш́антипурӣм̇\",\"бхаджа гаурахарим̇ бхаджа гаурахарим\"],\"translation\":[\"Выказав огромную любовь и честь падшим душам, Он в величественном безумном танце пел под аккомпанемент прекрасных звуков *каратал* и *мриданги*. Он великая обитель божественного умиротворения и утешения для всех и каждого. Служи этому Господу Гаурахари, поклоняйся Ему!\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1b:[\"$\",\"$L22\",null,{\"navMap\":{\"283\":{\"prev\":{\"path\":\"/ru/nava-nalina-ganjitam-kusuma-dala/\",\"title\":\"Пранати-Панчакам\"},\"next\":{\"path\":\"/
