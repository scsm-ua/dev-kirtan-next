ита̄и бине бха̄и,    ра̄дха̄-кр̣ш̣н̣а па̄ите-на̄и,\",\"    др̣дха кори’ дхаро нита̄ира па̄йа\"],\"translation\":[\"Святые лотосоподобные стопы Нитьянанды Прабху сияют подобно десяти миллионам лун, в сени которых весь мир обретает успокоение. Брат, без Нитьянанды никто не сможет достичь Радхи и Кришны, поэтому со всей решимостью держись Его лотосоподобных стоп!\"],\"isLong\":true},{\"number\":\"2\",\"text\":[\"се самбандха на̄хи джа̄ра,    бр̣тха̄ джанма гело та̄ра,\",\"    сеи паш́у бод̣о дура̄ча̄ра\",\"нита̄и на̄ болило мукхе,    маджило сам̇са̄ра-сукхе,\",\"    видйа̄-куле ки корибо та̄ра\"],\"translation\":[\"Тот, кто не связан с Ним, прожил свою жизнь напрасно — он подобен несчастному животному! Тот, чьи уста никогда не произносили «Нитай», пленен мирскими соблазнами. Как же может его спасти благородное происхождение?\"],\"isLong\":true},{\"number\":\"3\",\"text\":[\"ахан̇ка̄ре матта хаийа̄,    нита̄и-пада па̄сарийа̄,\",\"    асатйере сатйа кори ма̄ни\",\"нита̄ийер корун̣а̄ хабе,    брадже ра̄дха̄-кр̣ш̣н̣а па̄бе,\",\"    дхаро нита̄ийера чаран̣ ду’кха̄ни\"],\"translation\":[\"Обезумев от гордости и позабыв о лотосоподобных стопах Нитьянанды Прабху, я принимаю ложь за истину. Но если Нитьянанда Прабху одарит тебя Своей милостью, ты встретишь Радху и Кришну во Врадже. Обними же лотосоподобные стопы Нитьянанды!\"],\"isLong\":true},{\"number\":\"4\",\"text\":[\"нита̄ийер чаран̣а сатйа,    та̄̐ха̄ра севака нитйа,\",\"    нита̄и-пада сада̄ коро а̄ш́а\",\"нароттама бод̣о дух̣кхӣ,    нита̄и море коро сукхӣ\",\"    ра̄кхо ра̄н̇га̄-чаран̣ера па̄ш́а\"],\"translation\":[\"Лотосоподобные стопы Нитьянанды — истина, а слуги Его вечны. Всегда стремись обрести прибежище у Его стоп! Нароттам очень несчастен. О Нитай, сделай меня счастливым! Молю, позволь мне всегда быть у Твоих прекрасных лотосоподобных стоп!\"],\"isLong\":false}],\"embeds\":[{\"title\":\"Шрила Говинда Махарадж\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-nitai-pada-1\",\"iframe_url\":\
