те со всеми Своими преданными и рынок Святого Имени появился здесь, в Годруме.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"надӣйа̄ бхрамите гора̄ эло на̄мер ха̄т̣e\",\"гаура эло ха̄т̣е, сан̇гe нита̄и эло ха̄т̣e\"],\"translation\":[\"Странствуя по всей земле Надии, Господь Гаура пришел на рынок Святого Имени. Господь Гаура явился на этот рынок вместе с Нитаем.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"на̄чe ма̄тoйа̄ра̄ нита̄и годрумера ма̄т̣хe\",\"джагат ма̄та̄й нита̄и премера ма̄лaса̄т̣e\"],\"translation\":[\"Господь Нитьянанда, обезумевший от восторга, танцует на лугах Годрумы. Он охвачен упоительной любовью к Богу. Движения Его могучих рук подобны движениям рук борца, бросающего вызов сопернику, — так Он погружает вселенную в экстаз.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"(тора̄ декхе’ джа̄’ рe)\",\"адваита̄ди бхакта-вр̣нда на̄чe гха̄т̣е гха̄т̣е\",\"пала̄йa дурантa кали пoд̣ийа̄ бибхра̄т̣e\"],\"translation\":[\"(О, пожалуйста, отправляйтесь все на это посмотреть!) Возглавляемые Адвайтой Ачарьей вайшнавы танцуют на берегах Ганги, от одного *гхата* омовения до другого. При виде этого грешное олицетворение Кали оказывается в большой опасности и потому спасается бегством, чтобы сохранить себе жизнь.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"ки сукхе бха̄сило джӣвa гора̄ча̄ндер на̄т̣e\",\"декхийа̄ ш́унийа̄ па̄ш̣анд̣ӣр бука пха̄т̣e\"],\"translation\":[\"Что это за неописуемое счастье, в котором утопали все живые существа во время танца Господа Гаурачандры?! Когда безбожники видят подобные игры и слышат о них, их сердца разбиваются.\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1a:[\"$\",\"$L21\",null,{\"navMap\":{\"251\":{\"prev\":{\"path\":\"/ru/radha-krishna-bol-bol-bolo-re-sobai/\",\"title\":\"Шри Нагара-киртана (песнь 4)\"},\"next\":{\"path\":\"/ru/yadi-te-hari-pada-saroja-sudha/\",\"tit
