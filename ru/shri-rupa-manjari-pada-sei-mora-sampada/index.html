rkerRegistration\"]\n2a:I[3680,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-72e407737b4e2196.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"default\"]\n18:[\"$\",\"$L22\",null,{\"bookId\":\"ru\",\"telegraphUrl\":\"https://telegra.ph/SHri-Rupa-Mandzhari-pada-02-22\"}]\n19:[\"$undefined\",[\"$\",\"section\",null,{\"className\":\"SongHeader\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"SongHeader__title\",\"children\":[[\"$\",\"div\",\"0\",{\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[false,\"Шри-Рупа-Манджари-пада\"]}]]}]]}],null,[],[[\"$\",\"div\",\"0\",{\"className\":\"SongHeader__author\",\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[false,[\"$\",\"a\",null,{\"href\":\"/ru/authors/\",\"rel\":\"author\",\"children\":\"Ш́рӣла Нароттам Да̄с Т̣ха̄кур\"}]]}]]}]]]}]]\n"])</script><script>self.__next_f.push([1,"1a:[\"$\",\"$L23\",null,{\"bookId\":\"ru\",\"label\":\"Показывать стихи / перевод\",\"song\":{\"meta\":{\"page\":173,\"first_line\":\"ш́рӣ-рӯпа-ман̃джарӣ-пада, сеи мора сампада\"},\"title\":[\"Шри-Рупа-Манджари-пада\"],\"author\":[\"Ш́рӣла Нароттам Да̄с Т̣ха̄кур\"],\"verses\":[{\"text\":[\"ш́рӣ-рӯпа-ман̃джарӣ-пада, сеи мора сампада,\",\"    сеи мора бхаджана-пӯджана\",\"сеи мора пра̄н̣а-дхана, сеи мора а̄бхаран̣а,\",\"    сеи мора джӣванера джӣвана\",\"\",\"сеи мора раса-нидхи, сеи мора ва̄н̃чха̄-сидхи,\",\"    сеи мора ведера дхарама\",\"сеи брата, сеи тапа, сеи мора мантра-джапа,\",\"    сеи мора дхарама-карама\",\"\",\"анукӯла хобе виддхи, се-паде хоибе сидхи,\",\"    ниракхибо э дуи найане\",\"се рӯпа-ма̄дхурӣ-ра̄ш́и, пра̄н̣а-кувалайа-ш́аш́ӣ,\",\"    прапхуллита хобе ниш́и-дине\",\"\",\"туйа̄ адарш́ана-ахи, гороле джа̄рало дехӣ\",\"    чиро-дина та̄пита джӣвана\",\"ха̄ ха̄ рӯпа коро дойа̄, дехо море пада-чха̄йа̄,\",\"    нароттама лоило ш́аран̣а\"],\"isLong\":false},{\"subtitle\":[\"Комментарий Шрилы Б. Р. Шридхара Дев-Госвами Махараджа:\"],\"isLong\":false},{\"number\":\"1\",\"translation\":[\"*Ш́рӣ-рӯпа-ман̃джарӣ-пада, сеи мора сампада, сеи мора бхаджана-пӯджана:* святые стопы Шри Рупы Госвами — все для меня!\",\"Необходимо понять, что существует много уровней и видов *расы: шанта, дасья, сакхья, ватсалья, мадхура. * И в *мадхура-расе* группа Радхарани особенная. Также и среди *сакхи* существует иерархия. Есть группа *манджари, * юных девушек, — их положение уникально. Когда Радха и Говинда встречаются, только *манджари* могут служить Им.\",\"*Манджари* имеют такую привилегию. Если что-то необходимо для служения, *сакхи* отправляют туда *манджари*. *Сакхи* не приближаются к Радхе и Кришне. А *манджари* пользуются наибольшим доверием. *Манджари* исполняют самое сокровенное служение Божественной Чете. Им открыт доступ к высочайшему уровню, и их возглавляет Рупа Манджари. Она руководит юными девушками, *манджари*, и в *мадхура-бхаджане* она — все и вся. Об этом нам поведал Нароттам Тхакур. Для нас и для юных *манджари* она — наивысшее прибежище.\",\"*Сеи мора сампада:* мое богатство заключено в ее стопах. *Сеи мора бхаджана-пӯджана:* я поклоняюсь и служу ей. *Сеи мора пра̄н̣а-дхана, сеи мора а̄бхаран̣а: * она суть и истинное богатство моей жизни. Украшение моей жизни, если оно у меня есть, — ее милость. *Сеи мора джӣванера джӣвана: * сама суть моей жизни, несомненно, она. Я существую для ее удовольствия.\"],\"isLong\":false},{\"number\":\"2\",\"translation\":[\"*Сеи мора раса-нидхи:* если есть желанный источник экстаза, то он в ней. Источник всей *расы* — в ее стопах. *Сеи мора ва̄н̃чха̄-сидхи: * любое совершенство жизни, которого я желаю, — заключено в ее стопах. *Сеи мора ведера дхарама: * если Веды рекомендуют исполнять какой-то долг, я желаю, чтобы этим долгом стало пребывание у ее стоп.\",\"*Сеи брата, сеи тапа:* все благочестие, которое можно накопить покаянием и исполнением обетов, покоится в ней. *Сеи мора мантра-джапа: * непрестанная молитва — это она. Для меня все устремлено к одной цели, все мои побуждения устремляются к стопам Рупы Манджари. Если она удовлетворена, то вся моя духовная жизнь обретает успех. *Сеи мора дхарама-карама: * мои представления о долге и деятельности всех видов и на всех уровнях устремлены к единой цели и сходятся там — в святых стопах Рупы Манджари.\"],\"isLong\":false},{\"number\":\"3\",\"translation\":[\"*Анукӯла хабе виддхи, се-паде хоибе сиддхи:* моя единственная молитва Владыке этого мира: «Молю Тебя, свяжи меня с ней! О Абсолютный Повелитель, услышь мою молитву — пусть моей целью станет ее благосклонность! *Ниракхибо э дуи найане: * это настолько глубоко и реально, как если бы я видел это своими глазами. Я желаю только подлинного постижения — да будет на то милость Абсолютного Повелителя! — а не чего-то смутного, абстрактного или воображаемого». *Се рӯпа-ма̄дхурӣ-ра̄ш́и, пра̄н̣а-кувалайа-ш́аш́ӣ: * какая непостижимая красота заключена в ее святых стопах! Я хочу окунуться в нее. Пусть мое сердце станет лотосом!\",\"Существует два вида лотосов: белый лотос, происходящий от солнца, и красный — от луны. *Кувалая* — это их объединение. Сияние ее тела будет питать меня днем и ночью, словно источник самой моей жизни, сравнимый с *кувалаей. * (*Кувалая* живет благодаря сиянию лунного света.) Ее святые стопы — луна, тогда как моя жизненная сила подобна лотосу. Пусть же сияние ее красоты поддерживает и питает глубины моего сердца. *Прапхуллита хобе ниш́и-дине: * лотос моего сердца будет расти, осеняемый этими лучами, и расцветать.\"],\"isLong\":false},{\"number\":\"4\",\"translation\":[\"*Туйа̄ адарш́ана-ахи:* такова моя молитва, но каково мое нынешнее положение? Оно ужасно, моя госпожа! Если я не увижу тебя, Твоя Светлость, мое сердце сгорит дотла! Вот каково мое нынешнее положение. *Гороле джа̄рало дехӣ:* это напоминает яд кобры, который причиняет боль моему сердцу. Меня ужалила змея, но что это за змея? Это невозможность непосредственного общения с тобой, Твоя Светлость. Змеиный яд леденит мое сердце, и я умираю. *Чхиро-дина та̄пита джӣвана: * это произошло не сразу, но я всегда страдал от боли разлуки со столь прекрасной и исполненной надежды и совершенства жизнью.\",\"*Ха̄ ха̄ рӯпа коро дойа̄, дехо море пада-чха̄йа̄, нароттама лоило ш́аран̣а:* сейчас я дошел до крайней точки отчаяния и в последний раз молю о твоей благосклонности, в противном случае мне не жить!\",\"Эту молитву написал Нароттам Тхакур в прославление Шрилы Рупы Госвами. Так он явил нам свет высочайшего уровня жизни в *бхаджане. * Наша *сампрадая* носит название *Рупануга-сампрадаи*, и наставления нашей *гуру-парампары* согласуются с этими истинами. Нароттам Тхакур написал много песен. Все они боговдохновенны, упоительны и исполнены глубокой веры.\"],\"isLong\":false}],\"embeds\":[{\"title\":\"Шрила Говинда Махарадж\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-sri-rupa\",\"iframe_url\":\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fgovinda-maharaj-sri-rupa\",\"embed_code\":\"\u003ciframe width=\\\"100%\\\" height=\\\"20\\\" scrolling=\\\"no\\\" frameborder=\\\"no\\\" allow=\\\"autoplay\\\" src=\\\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fgovinda-maharaj-sri-rupa\\\"\u003e\u003c/iframe\u003e\"}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-sri-rupa\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1b:[\"$\",\"$L24\",null,{\"audio\":\"$1a:props:song:resources:audio\",\"caption\":\"Слушать аудио:\",\"language\":\"ru\"}]\n1c:[\"$\",\"$L25\",null,{\"navMap\":{\"173\":{\"prev\":{\"path\":\"/ru/gopinath-amara-upaya-nai/\",\"title\":\"Ниведана (часть 3)\"},\"next\":{
