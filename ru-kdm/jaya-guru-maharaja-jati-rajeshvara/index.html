:false},{\"number\":\"4\",\"text\":[\"судӣргха супӣбйа дехо дивйа-бха̄ва̄ш́рай\",\"дивйа-джн̃а̄на дӣпта-нетра дивйа-джйотирмой\"],\"translation\":[\"Твой царственный облик в ореоле божественных чувств — отрада для наших глаз. Твой взор исполнен божественной мудрости, а твое сияние распространяется по всему мирозданию.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"суварн̣а-сӯраджа-ка̄нти арун̣а-васана\",\"тилака, туласӣ-ма̄ла̄, чандана-бхӯш̣ан̣а\"],\"translation\":[\"Облаченный в шафрановые одежды, украшенный *тилакой* и бусами из *туласи* и умащенный ароматной сандаловой пастой, ты сияешь словно солнце.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"апӯрва ш́рӣ-ан̃га-ш́обха̄ каре джхаламала\",\"ауда̄рйа-унната-бха̄ва ма̄дхурйа уджвала\"],\"translation\":[\"Твой святой облик исполнен ослепительной красоты. Великодушие твоего благородного сердца проливает на всех, подобно луне, свет божественной любви.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"ачинтйа-пратибха̄, снигдха, гамбхӣра, уда̄ра\",\"джад̣а-джн̃а̄на-гири-ваджра дивйа-дикш̣а̄дха̄ра\"],\"translation\":[\"Твои непостижимые талант, любовь, величие и милосердие низвергают мирское знание, открывая божественную реальность.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"гаура-сан̇кӣрттана-ра̄са-расера а̄ш́рай\",\"«дойа̄ла нита̄и» на̄ме нитйа премамой\"],\"translation\":[\"Найдя прибежище в *санкиртане*, прославлении Золотого Господа Гауранги, ты восклицаешь в экстазе, преисполненный любви: *«Доял Нитай, доял Нитай!»*\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"са̄н̇гопа̄н̇ге гаура-дха̄ме нитйа-парака̄ш́а\",\"гупта-говардхане дивйа-лӣла̄ра-вила̄са\"],\"translation\":[\"Вечно пребывая со своими спутниками в Навадвип Дхаме по своей сладостной воле, ты наслаждаешься своими возвышенными играми на Гупта-Говардхане (скрытом холме Говардхан).\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"гауд̣ӣйа-а̄ча̄рйа-гош̣т̣хӣ-гаурава-бха̄джана\",\"гоуд̣ӣйа-сиддха̄нтаман̣и кан̣т̣ха-вибхуш̣ан̣а\"],\"translation\":[\"Ты по достоинству занимаешь столь возвышенное положение среди *гаудия-ачарьев*. Ты подобен жемчужине в сокровищнице *гаудия-сиддханты*.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"гаура-сарасватӣ-спхӯрта сиддха̄нтера кхани\",\"а̄виш̣кр̣та га̄йатрӣра артха-чинта̄ман̣и\"],\"translation\":[\"Ты — олицетворение послания Шри Гауры, источник совершенных заключений. Ты явил внутренний смысл Гаятри — философского камня, исполняющего все желания.\"],\"isLong\":false},{\"number\":\"12\",\"text\":[\"эка-таттва варн̣анете нитйа-нава-бха̄ва\",\"сусан̇гати, са̄ман̃джасйа, э саба прабха̄ва\"],\"translation\":[\"Когда бы ты ни говорил, сосредотачиваясь на какой-то одной теме, ты всегда освещаешь ее с новой стороны. Твое духовное могущество состоит в совершенном понимании того, как занять правильное положение и находиться в гармонии с окружающим.\"],\"isLong\":false},{\"number\":\"13\",\"text\":[\"тома̄ра сатӣртха-варга сабе эка-мате\",\"рӯпа-сарасватӣ-дха̄ра̄ декхена тома̄те\"],\"translation\":[\"Все твои духовные братья единодушно заявляют, что видят в тебе воплощение учения Рупы Госвами и Сарасвати Тхакура.\"],\"isLong\":false},{\"number\":\"14\",\"text\":[\"туласӣ-ма̄лика̄-хасте ш́рӣ-на̄ма̄-грахана\",\"декхи’ сакалера хой ‘прабху’ уддӣпана\"],\"translation\":[\"При виде того, как ты воспеваешь Святое Имя, перебирая четки из *туласи*, каждый вспоминает о Сарасвати Тхакуре.\"],\"isLong\":false},{\"number\":\"15\",\"text\":[\"кот̣ӣ-чандра-суш́итала о пада бхараса̄\",\"га̄ндха̄рва̄-говинда-лӣла̄мр̣та-ла̄бха-а̄ш́а̄\"],\"translation\":[\"Служение твоим стопам, сияющим словно десять миллионов лун, поддерживает мою веру. По твоей милости мы однажды отведаем нектар игр Шри Шри Радха-Говинды!\"],\"isLong\":false},{\"number\":\"16\",\"text\":[\"авичинтйа-бхеда̄бхеда-сиддханта-прака̄ш́а\",\"са̄нанде а̄рати стути каре дӣна-да̄са\"],\"translation\":[\"Олицетворение Прекрасной Реальности, явленной Шри Чайтаньей Махапрабху! Твой покорный слуга радостно поет эту молитву, посв
