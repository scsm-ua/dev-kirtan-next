"ш́рӣ-чаитанйа нитйа̄нанда ш́рӣ адваита-чандра\",\"гада̄дхара ш́рӣва̄са̄ди гаура-бхакта-вр̣нда\"],\"translation\":[\"Слава Шри Чайтанье Махапрабху и Нитьянанде Прабху! Слава луноподобному Шри Адвайте Ачарье! Слава Шри Гададхару Пандиту и всем преданным Шри Чайтаньи, возглавляемым Шривасом Тхакуром!\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"джайа рӯпа сана̄тана бхат̣т̣а рагхуна̄тха\",\"ш́рӣ-джӣва-гопа̄ла-бхат̣т̣а да̄са рагхуна̄тха\"],\"translation\":[\"Слава Шри Рупе Госвами, Санатане Госвами, Рагхунатху Бхатте Госвами, Шри Дживе Госвами, Гопале Бхатте Госвами и Рагхунатху Дасу Госвами!\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"эи чхой госа̄ир кори чаран̣а вандана\",\"джа̄ха̄ хоите бигхна-на̄ш́ абхӣш̣т̣а пӯрана\"],\"translation\":[\"Я склоняюсь перед шестью Госвами Вриндавана. Поклонение им устраняет все препятствия на пути преданности и исполняет все духовные желания.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"эи чхой госа̄ир джа̄̐ра му̐и та̄̐ра да̄са\",\"та̄̐-саба̄ра пада-рен̣у мора пан̃ча-гра̄са\"],\"translation\":[\"Я слуга того, кто служит шести Госвами. Пыль с их святых стоп — пять видов моей пищи.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"та̄̐дера чаран̣а себи бхакта сане ба̄са\",\"джанаме джанаме мора эи абхила̄ш̣а\"],\"translation\":[\"Я лишь желаю в каждом рождении быть рядом с преданными, что служат лотосоподобным стопам шести Госвами.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"эи чхой госа̄и джабе брадже коила̄ ба̄са\",\"ра̄дха̄-кр̣ш̣н̣а-нитйа-лӣла̄ корила̄ прака̄ш́а\"],\"translation\":[\"Когда эти Госвами жили во Врадже, они раскрыли и объяснили вечные игры Шри Радхи и Шри Кришны.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"а̄нанде боло хари бхаджа вр̣нда̄вана\",\"ш́рӣ-гуру-ваиш̣н̣ава-паде маджа̄ийа̄ мана\"],\"translation\":[\"Сосредоточив ум на божественных стопах духовного учителя и святых вайшнавов, воспевайте в упоении имена Господа Хари и поклоняйтесь трансцендентному миру Вриндавана!\"],\"isLong\":f
