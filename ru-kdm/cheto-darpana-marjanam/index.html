slation\":[\"Не в силах совладать с нахлынувшими чувствами, Махапрабху терял власть над Собой, речь Его обращалась в беспорядочные стихотворные обрывки. Прежде Он изрёк Своё Восьмистишье в назидание людям, нынче же Сам с упоением внимал Собственному слову. В человеке, который внемлет Господнему Напутственному Восьмистишью, естественно пробуждается любовная преданность Кришне, прирастающая день ото дня.\",\"*ШРИ ЧАЙТАНЬЯ-ЧАРИТАМРИТА. АНТЬЯ-ЛИЛА. 20.63-65*\"],\"isLong\":false},{\"subtitle\":[\"Понедельник\"],\"isLong\":false},{\"number\":\"1\",\"text\":[\"чето-дарпан̣а-ма̄рджанам̇\",\"    бхава-маха̄-да̄ва̄гни-нирва̄пан̣ам̇\",\"ш́рейах̣-каирава-чандрика̄-\",\"    витаран̣ам̇ видйа̄-вадху-джӣванам̇\",\"а̄нанда̄мбудхи-варддханам̇\",\"    прати-падам̇ пӯрн̣а̄мр̣та̄сва̄данам̇\",\"сарва̄тма-снапанам̇ парам̇\",\"    виджайате ш́рӣ-кр̣ш̣н̣а-сан̇кӣрттанам\"],\"translation\":[\"Господне Имя проясняет зеркало сознания и гасит пламя суетных страстей. Оно как полная луна, в чьём нежном свете распускается удачи белый лотос. Оно дарует знание, вселяет жизнь, невестою подводит к Богу. Оно бросает в бесконечно ширящийся океан блаженства. Оно к устам подносит чашу, полную сладчайшего нектара, омывает душу чистою, живительной водой. Так пусть над миром шествует с победою Святых Имён Господних воспеванье!\"],\"isLong\":false},{\"subtitle\":[\"Вторник\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"на̄мна̄м ака̄ри бахудха̄ ниджа-сарва-ш́актис\",\"татра̄рпита̄ нийамитах̣ смаран̣е на ка̄лах̣\",\"эта̄др̣ш́и тава кр̣па̄ бхагаван мама̄пи\",\"дурдайвам ӣдр̣ш́ам иха̄джани на̄нура̄гах̣\"],\"translation\":[\"О Господи, явился миру Ты в различных Именах, и каждое Ты наделил Своею полной властью. Для их памятования нет строгих правил и обрядов нет. Любой в каком угодно месте и в любое время может Твоё Имя призывать. Но Я настолько низок и настолько обделён удачею, что сладости не чувствую Твоих Имён и к ним влеченья не питаю.\"],\"isLong\":false},{\"subtitle\":[\"Среда\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"тр̣на̄д апи сунӣчена,\",\"тарор ива сахиш̣н̣уна̄\",\"ама̄нина̄ ма̄надена,\",\"кӣрттанӣйах̣ сада̄ харих̣\"],\"translation\":[\"Лишь тот, кто в сердце собственном смиреннее травинки, древа терпеливей кто, кто душу почитает всякую и сам лишён тщеславья, способен непрестанно Имя Божие святое воспевать.\"],\"isLong\":false},{\"subtitle\":[\"Четверг\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"на дханам̇ на джанам̇ на сундарӣм̇\",\"кавита̄м̇ ва̄ джагад-ӣш́а ка̄майе\",\"мама джанмани джанманӣш́варе\",\"бхавата̄д бхактир ахаитукӣ твайи\"],\"translation\":[\"Владыка мира! Я не желаю благ земных, толпы восторженных поклонников, красавиц нежных и влюблённых, Мне таланты не нужны и дарованья на поприще искусства. Всё, о чем мечтаю Я, ― из жизни в жизнь служить Тебе рабом покорным и смиренным.\"],\"isLong\":false},{\"subtitle\":[\"Пятница\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"айи нанда-тануджа кин̇карам̇\",\"патитам̇ ма̄м̇ виш̣аме бхава̄мбудхау\",\"кр̣пайа̄ тава па̄да-пан̇каджа\",\"стхита-дхӯлӣ-садр̣ш́ам̇ вичинтайа\"],\"translation\":[\"О милосердный Сын Яшоды! Даруй убежище у стоп Твоих былинке малой, что с незапамятных времён была низвергнута во мрачную пучину наважденья!\"],\"isLong\":false},{\"subtitle\":[\"Суббота\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"найанам̇ галад-аш́ру-дха̄райа̄\",\"ваданам̇ гадгада-руддхайа̄ гира̄\",\"пулакаир ничитам̇ вапух̣ када̄\",\"тава на̄ма грахан̣е бхавиш̣йати\"],\"translation\":[\"О Господи, приблизь тот день, когда при воспевании Имён Твоих из глаз Моих ручьём прольются слёзы! Когда Мой голос задрожит, дыхание прервётся, и волосы поднимутся на теле!\"],\"isLong\":false},{\"subtitle\":[\"Воскресенье\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"йуга̄йитам̇ нимеш̣ен̣а\",\"чакш̣уш̣а̄ пра̄вр̣ш̣а̄йитам̇\",\"ш́ӯнйа̄итам̇ джагат сарвам̇\",\"говинда-вирахен̣а ме\"],\"translation\":[\"Говинда, о Владыка чувств Моих! С Тобой в разлуке Мне мгновенье кажется столетием. Из глаз Моих ручьём струятся слёзы. Обращается в пустыню мир.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"а̄ш́лиш̣йа ва̄ па̄да-рата̄м̇ пинаш̣т̣у ма̄м\",\"адарш́ана̄н марма-хата̄м̇ кароту ва̄\",\"йатха̄ татха̄ ва̄ видатха̄ту лампат̣о\",\"мат-пра̄н̣а-на̄тхас ту са эва напа̄рах̣\"],\"translation\":[\"Он волен заключить рабу Свою в объятья, волен в грязь Её втоптать. Он волен сердце Ей разбить, укрывшись прочь от любящих очей. Повеса, Сердцеед беспечный и беспутный Прожигатель жизни ― Он Мне один лишь мил. Ему Я отдана навеки.\"],\"isLong\":false}],\"embeds\":[{\"title\":\"Шрила Авадхут Махарадж\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/avadxut-maxaradzh-1\",\"iframe_url\":\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Favadxut-maxaradzh-1\",\"embed_code\":\"\u003ciframe width=\\\"100%\\\" height=\\\"20\\\" scrolling=\\\"no\\\" frameborder=\\\"no\\\" allow=\\\"autoplay\\\" src=\\\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Favadxut-maxaradzh-1\\\"\u003e\u003c/iframe\u003e\"}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.B. Avadhut Maharaj\",\"ru\":\"Шрила Б.Б. Авадхут Махарадж\",\"ua\":\"Шріла Б.Б. Авадгут Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/avadxut-maxaradzh-1\"},{\"title\":{\"en\":\"Bhakti Lalita Devi\",\"ru\":\"Бхакти Лалита Деви\",\"ua\":\"Бгакті Лаліта Деві\"},\"embed_url\":\"https://soundcloud.com/bhakti-lalita-devi/siksastakam-sanskrit-verses\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"17:[\"$\",\"$L1f\",null,{\"audio\":\"$16:props:song:resources:audio\",\"caption\":\"Слушать аудио:\",\"language\":\"ru\"}]\n18:[\"$\",\"$L20\",null,{\"navMap\":{\"182\":{\"prev\":{\"path\":\"/ru-kdm/hare-krishna-hare-krishna-krishna-krishna-hare-hare/\",\"title\":\"Харе Кршна маха-мантра\"},\"next\":{\"path\":\"/ru-kdm/hari-haraye-namah-krishna
