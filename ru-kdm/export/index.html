e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтр̣на̄д апи сунӣчена,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтарор ива сахиш̣н̣уна̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eама̄нина̄ ма̄надена,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкӣрттанӣйах̣ сада̄ харих̣\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЛишь тот, кто в сердце собственном смиреннее травинки, древа терпеливей кто, кто душу почитает всякую и сам лишён тщеславья, способен непрестанно Имя Божие святое воспевать.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse-subtitle\"\u003eЧетверг\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eна дханам̇ на джанам̇ на сундарӣм̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкавита̄м̇ ва̄ джагад-ӣш́а ка̄майе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмама джанмани джанманӣш́варе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбхавата̄д бхактир ахаитукӣ твайи\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВладыка мира! Я не желаю благ земных, толпы восторженных поклонников, красавиц нежных и влюблённых, Мне таланты не нужны и дарованья на поприще искусства. Всё, о чем мечтаю Я, ― из жизни в жизнь служить Тебе рабом покорным и смиренным.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse-subtitle\"\u003eПятница\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eайи нанда-тануджа кин̇карам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпатитам̇ ма̄м̇ виш̣аме бхава̄мбудхау\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкр̣пайа̄ тава па̄да-пан̇каджа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eстхита-дхӯлӣ-садр̣ш́ам̇ вичинтайа\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО милосердный Сын Яшоды! Даруй убежище у стоп Твоих былинке малой, что с незапамятных времён была низвергнута во мрачную пучину наважденья!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse-subtitle\"\u003eСуббота\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнайанам̇ галад-аш́ру-дха̄райа̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eваданам̇ гадгада-руддхайа̄ гира̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпулакаир ничитам̇ вапух̣ када̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтава на̄ма грахан̣е бхавиш̣йати\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Господи, приблизь тот день, когда при воспевании Имён Твоих из глаз Моих ручьём прольются слёзы! Когда Мой голос задрожит, дыхание прервётся, и волосы поднимутся на теле!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse-subtitle\"\u003eВоскресенье\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eйуга̄йитам̇ нимеш̣ен̣а\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчакш̣уш̣а̄ пра̄вр̣ш̣а̄йитам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eш́ӯнйа̄итам̇ джагат сарвам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eговинда-вирахен̣а ме\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eГовинда, о Владыка чувств Моих! С Тобой в разлуке Мне мгновенье кажется столетием. Из глаз Моих ручьём струятся слёзы. Обращается в пустыню мир.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄ш́лиш̣йа ва̄ па̄да-рата̄м̇ пинаш̣т̣у ма̄м\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eадарш́ана̄н марма-хата̄м̇ кароту ва̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eйатха̄ татха̄ ва̄ видатха̄ту лампат̣о\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмат-пра̄н̣а-на̄тхас ту са эва напа̄рах̣\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eОн волен заключить рабу Свою в объятья, волен в грязь Её втоптать. Он волен сердце Ей разбить, укрывшись прочь от любящих очей. Повеса, Сердцеед беспечный и беспутный Прожигатель жизни ― Он Мне один лишь мил. Ему Я отдана навеки.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hari-haraye-namah-krishna-yadavaya-namah\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eНама-санкиртан \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШ́рӣла Нароттам Да̄с Т̣ха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eхари харайе намах̣ кр̣ш̣н̣а джа̄дава̄йа намах̣\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджа̄дава̄йа ма̄дхава̄йа кеш́ава̄йа намах̣\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eГосподь Хари, Господь Кришна, я склоняюсь перед Тобой, известным как Ядава, Хари, Мадхава и Кешава!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eгопа̄ла говинда ра̄м ш́рӣ мадхусӯдана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eгиридха̄рӣ гопӣна̄тха мадана-мохана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eГопал, Говинда, Рама, Шри Мадхусудана, Гиридхари, Гопинатх, Мадана-мохан!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eш́рӣ-чаитанйа нитйа̄нанда ш́рӣ адваита-чандра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eгада̄дхара ш́рӣва̄са̄ди гаура-бхакта-вр̣нда\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава Шри Чайтанье Махапрабху и Нитьянанде Прабху! Слава луноподобному Шри Адвайте Ачарье! Слава Шри Гададхару Пандиту и всем преданным Шри Чайтаньи, возглавляемым Шривасом Тхакуром!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджайа рӯпа сана̄тана бхат̣т̣а рагхуна̄тха\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eш́рӣ-джӣва-гопа̄ла-бхат̣т̣а да̄са рагхуна̄тха\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава Шри Рупе Госвами, Санатане Госвами, Рагхунатху Бхатте Госвами, Шри Дживе Госвами, Гопале Бхатте Госвами и Рагхунатху Дасу Госвами!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eэи чхой госа̄ир кори чаран̣а вандана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджа̄ха̄ хоите бигхна-на̄ш́ абхӣш̣т̣а пӯрана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ склоняюсь перед шестью Госвами Вриндавана. Поклонение им устраняет все препятствия на пути преданности и исполняет все духовные желания.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eэи чхой госа̄ир джа̄̐ра му̐и та̄̐ра да̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eта̄̐-саба̄ра пада-рен̣у мора пан̃ча-гра̄са\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ слуга того, кто служит шести Госвами. Пыль с их святых стоп — пять видов моей пищи.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eта̄̐дера чаран̣а себи бхакта сане ба̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджанаме джанаме мора эи абхила̄ш̣а\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ лишь желаю в каждом рождении быть рядом с преданными, что служат лотосоподобным стопам шести Госвами.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eэи чхой госа̄и джабе брадже коила̄ ба̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eра̄дха̄-кр̣ш̣н̣а-нитйа-лӣла̄ корила̄ прака̄ш́а\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eКогда эти Госвами жили во Врадже, они раскрыли и объяснили вечные игры Шри Радхи и Шри Кришны.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄нанде боло хари бхаджа вр̣нда̄вана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eш́рӣ-гуру-ваиш̣н̣ава-паде маджа̄ийа̄ мана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСосредоточив ум на божественных стопах духовного учителя и святых вайшнавов, воспевайте в упоении имена Господа Хари и поклоняйтесь трансцендентному миру Вриндавана!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eш́рӣ-гуру-ваиш̣н̣ава-па̄да-падма кори а̄ш́а\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(хари) на̄ма-сан̇кӣрттана кохе нароттама да̄са\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЖелая обрести прибежище лотосоподобных стоп Шри Гуру и вайшнавов, Нароттам Дас поет \u003ci\u003eсанкиртану\u003c/i\u003e Святого Имени!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"first-lines\" id=\"first-lines\"\u003e\n\u003ch1\u003eИндекс\u003c/h1\u003e\n\u003ch2 class=\"first-line-group\"\u003eВ\u003c/h2\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-vande-ham-shri-guroh-shri-yuta-pada-kamalam\"\u003eванде ‘хам̇ ш́рӣ-гурох̣ ш́рӣ-йута-пада-камалам̇\u003cspan class=\"page-num\"\u003e — 11\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-vande-bhaktivinodam-shri-gaura-shiakti-svarupakam\"\u003eванде бхактивинодам̇ ш́рӣ-гаура-ш́акти-сварӯпакам\u003cspan class=\"page-num\"\u003e — 17\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-vancha-kalpatarubhyas-cha\"\u003eва̄н̃чха̄-калпатарубхйаш́’ ча кр̣па̄-синдхубхйа эва ча\u003cspan class=\"page-num\"\u003e — 19\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-vrindayai-tulasi-devyai\"\u003eвр̣нда̄йаи туласӣ-девйаи\u003cspan class=\"page-num\"\u003e — 21\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch2 class=\"first-line-group\"\u003eГ\u003c/h2\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-gaura-vrajashritashieshair-vaishnavair-vandya-vigraham\"\u003eгаура-враджа̄ш́рита̄ш́еш̣аир ваиш̣н̣аваир вандйа-виграхам\u003cspan class=\"page-num\"\u003e — 18\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-gurvabhishta-supurakam-guru-ganair\"\u003eгурвва̄бхӣш̣т̣а-супӯракам̇ гуру-ган̣аир\u003cspan class=\"page-num\"\u003e — 13\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-gurudeva-kripa-bindu-diya-kara-ei-dase\"\u003eгурудев! кр̣па̄-би
