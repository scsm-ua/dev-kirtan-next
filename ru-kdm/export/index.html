toc-item\" data-translated=\"1\"\u003e\u003ca href=\"#song-gaura-vrajashritashieshair-vaishnavair-vandya-vigraham\"\u003eШрила Джаганнатх Дас Бабаджи Махарадж\u003cspan class=\"page-num\"\u003e — 18\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"toc-item\" data-translated=\"1\"\u003e\u003ca href=\"#song-vancha-kalpatarubhyas-cha\"\u003eМолитвы, обращенные к вайшнавам\u003cspan class=\"page-num\"\u003e — 19\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"toc-item\" data-translated=\"1\"\u003e\u003ca href=\"#song-shri-krishna-chaitanya-prabhu-nityananda\"\u003eПанча-таттва мантра\u003cspan class=\"page-num\"\u003e — 24\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"toc-item\" data-translated=\"1\"\u003e\u003ca href=\"#song-hare-krishna-hare-krishna-krishna-krishna-hare-hare\"\u003eХаре Кршна маха-мантра\u003cspan class=\"page-num\"\u003e — 24\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch2 class=\"toc-item-group\"\u003e⸻\u003c/h2\u003e\n\u003cp class=\"toc-item\" data-translated=\"1\"\u003e\u003ca href=\"#song-cheto-darpana-marjanam\"\u003eШри Шикшаштакам\u003cspan class=\"page-num\"\u003e — 182\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"toc-item\" data-translated=\"1\"\u003e\u003ca href=\"#song-hari-haraye-namah-krishna-yadavaya-namah\"\u003eНама-санкиртан\u003cspan class=\"page-num\"\u003e — 55\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"toc-item\" data-translated=\"1\"\u003e\u003ca href=\"#song-jaya-sa-parikara\"\u003eДжайа Дхвани\u003cspan class=\"page-num\"\u003e — 22\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eАрати\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-jaya-jaya-gurudever-arati-ujjvala\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШри Гуру Арати \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003e(прославление Шрилы Бхакти Сундара Говинды Дев-Госвами Махараджа)\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджайа джайа гурудевер а̄рати уджвала\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eговардхана-па̄да-пӣтхе бхувана-ман̇гала\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава лучезарному \u003ci\u003eарати\u003c/i\u003e Шри Гурудева, проходящему у подножия холма Говардхан на благо всего мира!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eш́рӣ бхакти сундара дева прабху ш́ироман̣и\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eгосва̄мӣ говинда джайа а̄нандера кхани\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава Шри Бхакти Сундару Говинде Госвами, нашему духовному учителю, неиссякаемому источнику радости!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eа̄джа̄ну ламбита бхуджа дивйа калевара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eананта пратибха̄ бхара̄ дивйа гун̣адхара\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЕго грациозные длинные руки достигают колен, а тело прекрасно и трансцендентно. Он — океан безграничной гениальности и трансцендентных качеств.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eгаура-кр̣ш̣н̣е джа̄ни тава абхинна сварӯпа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсам̇са̄ра тарите эбе ш́уддха-бхакта-рӯпа\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eГурудев, ты неотличен от Кришны и Гауранги, но ради спасения этого бренного мира ты принял облик чистого преданного.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eрӯпа̄нуга-дха̄ра̄ туми кара а̄локита\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрабха̄кара сама прабха̄ бхувана-видита\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТы освещаешь духовную линию последователей Шрилы Рупы Госвами. Твое сияние, подобно солнцу, освещает весь мир!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eш́уддха бхакти прача̄рите тома̄ сама на̄и\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eакалан̇ка инду джена дайа̄ла нита̄и\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВ проповеди чистой любви к Богу тебе нет равных. Ты подобен безупречной луне и так же милостив, как Господь Нитьянанда.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eулласита виш́вава̄сӣ лабхе према-дхана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄нанде на̄чийа̄ га̄хе тава гун̣аган̣а\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eКогда ликующие обитатели мироздания обретают сокровище любви к Кришне, они танцуют и прославляют тебя.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eстха̄пила̄ а̄ш́рама баху джагата ма̄джха̄ре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпа̄рамахам̇са-дхарма-джн̃а̄на ш́икш̣а̄ра прача̄ре\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЧтобы научить высшему знанию и проповедовать его людям, ты основал по всему миру много \u003ci\u003eашрамов\u003c/i\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eчинтйа̄чинтйа веда-джн̃а̄не туми а̄дхика̄рӣ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсакала сам̇ш́айа четва̄ сусиддха̄нтадха̄рӣ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТы знаток всех Вед — как постижимых, так и непостижимых. Ты — хранитель безупречных истин, устраняющих все сомнения.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтома̄ра махима̄ га̄хе голока ман̣д̣але\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнитйа-сиддха парикаре тава лӣла̄стхале\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТвои вечно освобожденные слуги прославляют тебя в духовном мире Голоки, обители твоих игр.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпатита па̄вана туми дойа̄ра самӣра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсарва-ка̄рйе сунипун̣а сатйа-сугамбхӣра\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eИсполненный милосердия, ты спасаешь падшие души. Ты искусен в любом служении, ты правдив и серьезен.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eапурва лекханӣ дха̄ра̄ прага̄д̣ха па̄н̣д̣итйа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсада̄ хасйа миш̣т̣а бха̄ш́ӣ суш́ила кавитва\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТвои прекрасные, несравненные произведения отражают глубину учености. Ты всегда улыбаешься и говоришь приятные слова, подтверждающие поэтический дар, который способен принести отрадное успокоение сердцу.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eса̄дху-сан̇ге сада̄нандӣ сарала винайӣ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсабха̄-мадхйе вакта̄ ш́реш̣т̣ха сарватра виджайӣ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТы всегда прямодушен и смиренен, всегда счастлив в общении с преданными. Среди проповедников ты лучший оратор, и, что бы ты ни делал, ты всегда преуспеваешь.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"14\"\u003e\n\u003ch5\u003e14\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eгауд̣ӣйа гагане туми а̄ча̄рйа-бха̄скара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнирантара сева̄прийа миш̣т̣а кан̣т̣хасвара\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВ высотах мира гаудия-вайшнавов ты патриарх, сияющий словно солнце. Ты служишь с неизменной радостью и вдохновляешь других на служение.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"15\"\u003e\n\u003ch5\u003e15\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтома̄ра корун̣а̄ ма̄ге трика̄ла вила̄се\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eга̄ндхарвика̄-гиридха̄рӣ сева̄-матра а̄ш́е\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВ прошлом, настоящем и будущем мы молим о твоей милости! Лишь по твоей милости мы сможем обрести служение в преданности Шри Шри Гандхарвике-Гиридхари.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"16\"\u003e\n\u003ch5\u003e16\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкр̣па̄ коро охе прабху ш́рӣ-гаура-прака̄ш́а\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄рати коройе сада̄ э адхама да̄са\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО мой владыка, проявление милости Шри Гауранги, пожалуйста, будь милостив ко мне! Твой ничтожный слуга молит об этом, поклоняясь тебе.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-guru-maharaja-jati-rajeshvara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШри Гуру Арати-стути \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШ́рӣла Бхакти Сундар Говинда Дев-Госва̄мӣ Маха̄ра̄дж\u003c/h4\u003e\n\u003ch4\u003e(прославление Шрилы Бхакти Ракшака Шридхара Дев-Госвами Махараджа)\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджайа ‘гуру-маха̄ра̄джа’ джати-ра̄джеш́вара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eш́рӣ-бхакти-ракш̣ака дева-госва̄мӣ ш́рӣдхара\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава тебе, Гуру Махарадж, повелитель \u003ci\u003eсанньяси\u003c/i\u003e, Шрила Бхакти Ракшак Дев-Госвами Шридхар!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпатита-па̄вана-лӣла̄ виста̄ри’ бхуване\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eниста̄рила̄ дӣна-хӣна а̄па̄мара джане\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯвив свои игры этому миру и придя как спаситель падших, ты вызволил все страдающие души, даже самые недостойные.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтома̄ра корун̣а̄гхана мурати херийа̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпреме бха̄гйава̄на джӣва под̣е мурачхийа̄\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eИ, видя твой святой облик воплощенной милости, удачливые души погружаются в экстаз божественной любви.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсудӣргха супӣбйа дехо дивйа-бха̄ва̄ш́рай\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдивйа-джн̃а̄на дӣпта-нетра дивйа-джйотирмой\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТвой царственный облик в ореоле божественных чувств — отрада для наших глаз. Твой взор исполнен божественной мудрости, а твое сияние распространяется по всему мирозданию.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсуварн̣а-сӯраджа-ка̄нти арун̣а-васана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтилака, туласӣ-ма̄ла̄, чандана-бхӯш̣ан̣а\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eОблаченный в шафрановые одежды, украшенный \u003ci\u003eтилакой\u003c/i\u003e и бусами из \u003ci\u003eтуласи\u003c/i\u003e и умащенный ароматной сандаловой пастой, ты сияешь словно солнце.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eапӯрва ш́рӣ-ан̃га-ш́обха̄ каре джхаламала\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eауда̄рйа-унната-бха̄ва ма̄дхурйа уджвала\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТвой святой облик исполнен ослепительной красоты. Великодушие твоего благородного сердца проливает на всех, подобно луне, свет божественной любви.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eачинтйа-пратибха̄, снигдха, гамбхӣра, уда̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджад̣а-джн̃а̄на-гири-ваджра дивйа-дикш̣а̄дха̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТвои непостижимые талант, любовь, величие и милосердие низвергают мирское знание, открывая божественную реальность.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eгаура-сан̇кӣрттана-ра̄са-расера а̄ш́рай\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e«дойа̄ла нита̄и» на̄ме нитйа премамой\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eНайдя прибежище в \u003ci\u003eсанкиртане\u003c/i\u003e, прославлении Золотого Господа Гауранги, ты восклицаешь в экстазе, преисполненный любви: \u003ci\u003e«Доял Нитай, доял Нитай!»\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eса̄н̇гопа̄н̇ге гаура-дха̄ме нитйа-парака̄ш́а\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eгупта-говардхане дивйа-лӣла̄ра-вила̄са\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВечно пребывая со своими спутниками в Навадвип Дхаме по своей сладостной воле, ты наслаждаешься своими возвышенными играми на Гупта-Говардхане (скрытом холме Говардхан).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eгауд̣ӣйа-а̄ча̄рйа-гош̣т̣хӣ-гаурава-бха̄джана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eгоуд̣ӣйа-сиддха̄нтаман̣и кан̣т̣ха-вибхуш̣ан̣а\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТы по достоинству занимаешь столь возвышенное положение среди \u003ci\u003eгаудия-ачарьев\u003c/i\u003e. Ты подобен жемчужине в сокровищнице \u003ci\u003eгаудия-сиддханты\u003c/i\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eгаура-сарасватӣ-спхӯрта сиддха̄нтера кхани\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄виш̣кр̣та га̄йатрӣра артха-чинта̄ман̣и\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТы — олицетворение послания Шри Гауры, источник совершенных заключений. Ты явил внутренний смысл Гаятри — философского камня, исполняющего все желания.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eэка-таттва варн̣анете нитйа-нава-бха̄ва\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсусан̇гати, са̄ман̃джасйа, э саба прабха̄ва\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eКогда бы ты ни говорил, сосредотачиваясь на какой-то одной теме, ты всегда освещаешь ее с новой стороны. Твое духовное могущество состоит в совершенном понимании того, как занять правильное положение и находиться в гармонии с окружающим.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтома̄ра сатӣртха-варга сабе эка-мате\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eрӯпа-сарасватӣ-дха̄ра̄ декхена тома̄те\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВсе твои духовные братья единодушно заявляют, что видят в тебе воплощение учения Рупы Госвами и Сарасвати Тхакура.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"14\"\u003e\n\u003ch5\u003e14\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтуласӣ-ма̄лика̄-хасте ш́рӣ-на̄ма̄-грахана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдекхи’ сакалера хой ‘прабху’ уддӣпана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПри виде того, как ты воспеваешь Святое Имя, перебирая четки из \u003ci\u003eтуласи\u003c/i\u003e, каждый вспоминает о Сарасвати Тхакуре.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"15\"\u003e\n\u003ch5\u003e15\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкот̣ӣ-чандра-суш́итала о пада бхараса̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eга̄ндха̄рва̄-говинда-лӣла̄мр̣та-ла̄бха-а̄ш́а̄\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлужение твоим стопам, сияющим словно десять миллионов лун, поддерживает мою веру. По твоей милости мы однажды отведаем нектар игр Шри Шри Радха-Говинды!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"16\"\u003e\n\u003ch5\u003e16\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eавичинтйа-бхеда̄бхеда-сиддханта-прака̄ш́а\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eса̄нанде а̄рати стути каре дӣна-да̄са\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eОлицетворение Прекрасной Реальности, явленной Шри Чайтаньей Махапрабху! Твой покорный слуга радостно поет эту молитву, посвящая ее тебе.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-guru-maharaja-karuna-sagara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШри Шри Нитаи-Чаитанйа-Арати \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШ́рӣла Бхакти Сундар Говинда Дев-Госва̄мӣ Маха̄ра̄дж\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджайа гуру маха̄ра̄джа корун̣а̄-са̄гара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eш́рӣ бхакти ракш̣ака дева-госва̄мӣ ш́рӣдхара\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава Шриле Гуру Махараджу, Шриле Бхакти Ракшаку Шридхару Дев-Госвами Махараджу, который подобен океану милосердия!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпрака̄ш́иле нӣла̄чале бхувана-ман̇гала\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнита̄и-чаитанйа-дева-сева̄ самуджвала\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПо его милости в Пури Дхаме проявился Шри Шри Нитай-Чайтаньядев, даровав благо всему миру.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eгора̄преме ма̄тойа̄ра̄ нитйа̄нанда-рӯпа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eрасара̄джа маха̄бха̄ва чаитанйа-сварӯпа\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eШри Нитьянанда Прабху танцует, опьяненный экстазом божественной любви к Шри Гауре, Который является самим Раса-раджем Шри Кришной, принявшим сердце и сияние Махабхавы, Шримати Радхарани.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкасита-ка̄н̃чана джини ш́рӣ-ан̇га лабан̣и\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eду̐ху̐гале ванама̄ла̄ бха̄вера доланӣ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eОба Господа ярко сияют, словно чистое золото, а Их шеи украшены гирляндами из прекрасных лесных цветов.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмурачхита кот̣ика̄ма рӯпара̄саран̇ге\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмадхура нартана-бха̄ва вара̄бхайа бхан̇ге\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eМиллионы купидонов падают без сознания у божественных стоп Их Святейшеств, взирая на красоту Тех, Чьи божественные фигуры раскачиваются в ритме танца. Они танцуют, побеждая сердце каждого и проливая милость на обусловленные души.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкоти-чандра-бха̄нуш́обха̄ ратна-сим̇ха̄сане\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпрема нетре декхе маха̄-бха̄гйава̄на джане\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСияя, словно миллионы лун, Они возвышаются на Своем троне, украшенном драгоценными камнями. Удачливы те преданные души, что из своей любви и привязанности могут видеть Их божественные образы.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмр̣дан̇га мандира̄ ба̄дже суш́ан̇кха-дхванита\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eш́рути-маули-ратнама̄ла̄-дӣпа нира̄джита\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВ храме во время \u003ci\u003eарати\u003c/i\u003e восхитительно звучат \u003ci\u003eмриданги\u003c/i\u003e, раздаются звуки раковины и предлагаются лампады из \u003ci\u003eгхи\u003c/i\u003e. Различные части Вед приняли образ каждого огонька как светильника \u003ci\u003eбхакти-йоги\u003c/i\u003e и поклоняются Их Святейшествам во время \u003ci\u003eарати\u003c/i\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбхувана-мохана ду̐ху̐ рӯпера а̄рати\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eгупта-вр̣нда̄ран̣йа-ва̄сӣ декхе ниравадхи\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЭто \u003ci\u003eарати\u003c/i\u003e могут видеть только жители Навадвип Дхамы и дорогие спутники Шри Чайтаньи. Любой, кто станет его свидетелем, будет очарован!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eш́рӣ сварӯпа ра̄ма̄нанда рӯпа-сана̄тана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eрагхуна̄тха харида̄са гада̄дхара дхана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eДорогие спутники Шри Чайтаньи: Шри Сварупа Дамодар, Рамананда Рай, Рупа Госвами, Санатана Госвами, Рагхунатх Дас Госвами, Харидас Тхакур и Гададхар Пандит участвуют в этом \u003ci\u003eарати\u003c/i\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eса̄рвабхаума гопӣна̄тха джӣва̄нуга-джана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдекхена а̄рати-ш́обха дурлабха-дарш́ана\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСарвабхаума Бхаттачарья, Гопинатх Ачарья и последователи \u003ci\u003eсампрадаи\u003c/i\u003e Дживы Госвами наблюдают \u003ci\u003eарати\u003c/i\u003e, которое не могут видеть другие.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнадӣйа̄ прака̄ш́е нитйа̄нанда-гауранидхи\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпатита-па̄вана-кш̣етре мила̄ила видхи\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eШри Нитьянанда и Шри Гаура Махапрабху вечно пребывают в Навадвип Дхаме, в Надии. Но теперь Их божественные образы проявлены и в Пури Дхаме по милости нашего, способного изменять судьбу, Шри Гурудева.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eавичинтйа нитйананда-чаитанйа-прака̄ш́а\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eш́рӣ гуру-праса̄де декхе эи адхама да̄са\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(ш́рӣ гуру-праса̄де декхе ш́рӣ говинда да̄са)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eНепостижимым образом проявились Шри Шри Нитай-Чайтанья, и, по милости Шри Гурудева, эта падшая душа видит Их \u003ci\u003eарати\u003c/i\u003e и присоединяется к \u003ci\u003eсанкиртане! \u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-kali-kukkura-kadana-jadi-chao-he\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eПрабхати Гити \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШ́рӣла Бхактивинод Т̣ха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кали-куккура-кадана джади ча̄о хе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкалийуга-па̄вана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кали-бхайа-на̄ш́ана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ш́рӣ ш́ачӣ-нандана га̄о хе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eУм, ты подобен жалкой собаке века Кали! Если ты жаждешь избавления от жуткого страха, которым пронизан этот темный век, то воспевай Святое Имя сына Шачи — спасителя каждого.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eгада̄дхара-ма̄дана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нита̄и-эра пра̄н̣адхана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;адваитера прапӯджита гора̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнимаи виш́вамбхара\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ш́рӣнива̄са-ӣш́вара,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бхаката самӯха-читачора̄\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eОн — трансцендентный купидон Гададхары, сама жизнь и душа Нитьянанды Прабху и почитаемый господин Шри Адвайты Ачарьи! Он известен как Нимай, потому что родился под деревом \u003ci\u003eним\u003c/i\u003e; как Вишвамбхара, так как Он — опора Вселенной. Он — господин Шриваса Тхакура. Он похищает сердца всех предавшихся Ему душ.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнадӣйа̄-ш́аш́адхара\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ма̄йа̄пура-ӣш́вара,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄ма-прабартана-ш́ӯра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eгр̣хӣджана-ш́икш̣ака\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нйа̄сикула-на̄йака,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ма̄дхава-ра̄дха̄бха̄ва пӯра\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eОн — луна Надии, Господь Маяпура и великодушный спаситель! Он открыл всем славу воспевания Святого Имени Кришны. Он — наставник семейных людей и предводитель \u003ci\u003eсанньяси\u003c/i\u003e. Шри Чайтанья Махапрабху — это Кришна, преисполненный упоительным чувством любви Радхарани!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eса̄рвабхаума-ш́одхана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;гаджапати-та̄ран̣а,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄ма̄нанда-пош̣ан̣а-вӣра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eрӯпа̄нанда-вардхана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сана̄тана па̄лана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;харида̄са-модана-дхӣра\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eОн очистил Сарвабхауму Бхаттачарью и спас Пратапарудру Махараджа, великого царя Ориссы. Он — герой и защитник Рамананды Рая. Он источник постоянно возрастающего счастья, приводящий в восторг благоразумного Харидаса Тхакура.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбраджа раса-бха̄вана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;душ̣т̣амата-ш́а̄тана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;капат̣ӣ-вигха̄тана-ка̄ма\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eш́уддха бхакта-па̄лана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ш́уш̣ка джн̃а̄на-та̄д̣ана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;чхоло бхакти-дӯш̣ан̣а-ра̄ма\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eШри Кришна Чайтанья поглощен сладостью Вриндавана! Он очищает ум от грязных мыслей, сводя на нет похоть и обман. Он изгоняет сухое эмпирическое знание, затмевающее красоту безраздельной преданности Богу. Он защищает, поддерживает и неустанно опекает всецело предавшиеся Ему души.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jashomati-nandana-vraja-vara-nagara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШри Нама-киртан \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШ́рӣла Бхактивинод Т̣ха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджаш́оматӣ-нандана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;браджа-баро на̄гара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;гокула-ран̃джана ка̄на\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eгопӣ-пара̄н̣а-дхана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;мадана манохара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ка̄лӣйа-дамана-видха̄на\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eШри Кришна — любимый сын матери Яшоды, трансцендентный возлюбленный земли Враджа! Он Тот, Кто приводит в восхищение Гокулу! Одно из Его имен — Кана. Он жизнь и душа \u003ci\u003eгопи\u003c/i\u003e. Он очаровывает самого Купидона и побеждает змея Калию!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;амала харина̄м амийа-вила̄са̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eвипина-пурандара\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;навӣна на̄гара-бара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бам̇ш́ӣ-бадана сува̄са̄\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСвятые имена Кришны безупречны, исполнены сладости и красоты! Кришна — царь лесов Вриндавана! Он вечно юн и великолепен! Он — достойнейший из всех возлюбленных! Он играет сладостные мелодии на Своей флейте.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбраджа-джана-па̄лана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;асура-кула-на̄ш́ана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нанда-годхана ра̄кхойа̄ла̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eговинда ма̄дхава\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;наванӣта-таш̣кара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сундара нанда-гопа̄ла̄\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eКришна заботится о жителях Вриндавана и побеждает демонов. Он пасет коров и известен как Говинда — Тот, Кто приносит радость коровам и удовлетворяет чувства! Он известен как Мадхава, супруг богини удачи. Кришна, прекрасный пастушок, сын Нанды Махараджа, очень любит воровать масло у \u003ci\u003eгопи\u003c/i\u003e!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджа̄муна-тат̣а-чара\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;гопӣ-басана-хара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄са-расика кр̣па̄мойа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eш́рӣ-ра̄дха̄-валлабха\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;вр̣нда̄вана-нат̣абара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бхакативинода-а̄ш̣райа\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eГуляя по берегам реки Ямуны, Кришна похищает одежды купающихся юных \u003ci\u003eгопи\u003c/i\u003e. Он наслаждается сладостью танца \u003ci\u003eрасы\u003c/i\u003e. Он очень милостив! Кришна — единственный возлюбленный Шримати Радхарани! Он самый лучший танцор Вриндавана и высочайшее прибежище Шрилы Бхактивинода Тхакура!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-shiachinandana-sura-muni-vandana\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eШри Шачинандана-вандана \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШ́рӣла Бхакти Ракш̣ак Ш́рӣдхар Дев-Госва̄мӣ Маха̄ра̄дж\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджайа ш́ачӣнандана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сура-муни-вандана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бхава-бхайа-кхан̣д̣ана джайо хе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджайа хари-кӣрттана\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нартана̄ вартана\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;калимала-картана джайо хе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава Шри Кришне Чайтанье Махапрабху, сыну Шачидеви! Его прославляют великие мудрецы и небожители — благодаря этому страх повторяющихся рождений и смертей полностью исчезает! Слава \u003ci\u003eкиртану\u003c/i\u003e Святого Имени Кришны, ибо когда с преданностью воспевают Его Имя и танцуют в экстазе, вся грязь века Кали исчезает!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнайана-пурандара\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;виш́варӯпа снехадхара\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;виш́вамбхара виш́вера калйа̄н̣а\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджайа лакш̣мӣ-виш̣н̣уприйа̄ виш́вамбхара прийахийа̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джайа прийа кин̇кара ӣш́а̄на\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eКрасота Шри Чайтаньи очаровывает всех! Он — Господь, окруженный любовью всех живых существ, и дорогой брат Вишварупы! Он одаривает каждого наивысшим благом, заполняя всю Вселенную нектаром любви к Богу, спасая все живые существа! Слава Лакшмиприе и Вишнуприе Деви, которые очень дороги Шри Нимаю Пандиту! Слава слуге их семьи Ишану!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eш́рӣ сӣта̄-адваита-ра̄й\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ма̄линӣ-ш́рӣва̄са джай\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джай чандраш́екхара а̄ча̄рйа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджай нитйа̄нанда ра̄й\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;гада̄дхара джай джай\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джайа харида̄с на̄ма̄ча̄рйа\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава Сите Тхакурани и Шри Адвайте Ачарье! Слава Малини Деви и Шривасу Тхакуру, слава Чандрашекхару Ачарье! Слава Шриле Нитьянанде Прабху, Шриле Гададхару Пандиту и Шриле Харидасу Тхакуру, \u003ci\u003eнамачарье\u003c/i\u003e!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмура̄ри мукунда джай\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;преманидхи маха̄ш́айа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;джайа йата прабху па̄риш̣ад\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванди сава̄ка̄ра па̄йа\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;адхамере кр̣па̄ хой\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бхакти сапа̄рш̣ада-прабхупа̄д\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСлава Мурари Гупте, слава Мукунде Датте! Слава вечным спутникам Шри Чайтаньи Махапрабху! Воспевая славу Шрилы Прабхупады и всех великих душ, вечных спутников Шри Чайтаньи Махапрабху, даже самый недостойный может обрести наивысшее сокровище любви!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-sa-parikara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eДжайа Дхвани \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eш́рӣ ш́рӣ гаура-нитай ки джайа!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(ш́рӣ панча-таттва ки джайа!)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджайа ш́рӣ ш̣рӣмад бхакти сундар говинда дев-госва̄мӣ маха̄ра̄дж кӣ джайа!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджайа ш́рӣ ш̣рӣмад бхакти ракш̣ак ш́рӣдхар дев-госва̄мӣ маха̄ра̄дж кӣ джайа!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджайа ш́рӣ ш̣рӣмад бхакти сиддха̄нта сарасватӣ т̣ха̄кур кӣ джайа!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджайа ш́рӣла гаура-киш́ора да̄с ба̄ба̄джӣ маха̄ра̄дж кӣ джайа!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджайа ш́рӣла сач-чид-а̄нанда бхактивинода т̣ха̄кур кӣ джайа!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджайа ш́рӣла джаганна̄тх да̄с ба̄ба̄джӣ маха̄ра̄дж кӣ джайа!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eш́рӣ рӯпа̄нуга гуру-варга кӣ джайа!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eш́рӣ бхакта-врнда кӣ джайа!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eинтернет бхакта-врнда кӣ джайа!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсанньяса бхакта-врнда кӣ джайа!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eшримад бхагаватам кӣ джайа!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eш́рӣ чаитанйа са̄расват мат̣х кӣ джайа!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(ш́рӣ чаитанйа са̄расват мат̣х нидерхаймбах кӣ джайа!)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхарина̄ма-сан̇кӣрттана кӣ джайа!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eнита̄и-гаура-према̄нанде харибол!\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vrindayai-tulasi-devyai\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eТуласи-пранама-мантра \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eвр̣нда̄йаи туласӣ-девйаи\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;прийа̄йаи кеш́авасйа ча\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкр̣ш̣н̣а-бхакти-праде деви\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;сатйаватйаи намо намах̣\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ вечно преклоняюсь перед Шри Вриндой Деви, Шримати Туласи Махарани, которую нежно любит сам Господь Кешава! Я простираюсь перед Сатьявати, дарующей чистую преданность Господу Кришне!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gurudeva-kripa-bindu-diya-kara-ei-dase\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eГурудев \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШ́рӣла Бхактивинод Т̣ха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eгурудев!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкр̣па̄-бинду дийа̄\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;коро’ эи да̄се,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тр̣н̣а̄пекш̣а̄ ати дӣна\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсакала-сахане\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;боло дийа̄ коро,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ниджа-ма̄не спр̣ха̄-хӣна\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eГурудев, даруй мне, твоему слуге, хотя бы каплю своей милости. Я незначительнее травинки. Молю тебя, помоги мне и дай сил! Пусть я, подобно тебе, освобожусь от всех эгоистических желаний и устремлений.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eсакале самма̄н\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;корите ш́акати,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;дехо на̄тха! джатха̄ джатха\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтобе то’ га̄ибо\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;харина̄ма-сукхе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;апара̄дха хобе хото\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eНаучи меня оказывать должное почтение всем. Тогда, благодаря воспеванию Святого Имени, все мои оскорбления будут полностью уничтожены.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкобе хено кр̣па̄\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;лобхийа̄ э джана,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кр̣та̄ртха хоибе, на̄тха!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eш́акти-буддхи-хӣн\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ми ати дӣн,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;коро море а̄тма-са̄тха\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО мой владыка! Когда же твоя милость низойдет на того, кто лишен разума, очень слаб и беспомощен. Молю, позволь мне быть с тобой!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджйогйата̄-вича̄ре\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кичхӯ на̄хи па̄и,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;тома̄ра коруна̄-са̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкоруна̄ на̄ хоиле\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ка̄̐дийа̄ ка̄̐дийа̄,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пра̄н̣а на̄ ра̄кхибо а̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЕсли ты внимательно посмотришь на меня, то не найдешь и следа хороших качеств. Твоя милость для меня — все! Если ты не будешь милостив ко мне, мне останется только горько оплакивать свою судьбу, и сама мысль о поддержании жизни станет мне ненавистна.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-udilo-aruna-puraba-bhage\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eАрунодойа-киртан \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003e Часть 1\u003c/h3\u003e\n\u003ch4\u003eШ́рӣла Бхактивинод Т̣ха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eудило арун̣а пӯраба-бха̄ге,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдвиджа-ман̣и гора̄ амони джа̄ге,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбхаката-самӯха лоийа̄ са̄тхе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eгела̄ нагара-бра̄дже\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПеред самым восходом солнца, когда небо на востоке начинает алеть, Шри Гаурахари, жемчужина среди дваждырожденных, пробуждается ото сна. Вместе со Своими преданными Он начинает \u003ci\u003eкиртан\u003c/i\u003e, странствуя по городам и деревням.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘татхаи татхаи’ ба̄джало кхол,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eгхана гхана та̄хе джха̄н̇джера рол,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпреме д̣хала д̣хала сона̄ра ан̇га,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчаран̣е нӯпура ба̄дже\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e\u003ci\u003eМриданги\u003c/i\u003e выбивают «\u003ci\u003eтатхаи татхаи\u003c/i\u003e» в ритм звенящим \u003ci\u003eкараталам\u003c/i\u003e, а золотистое тело Господа трепещет в экстазе, и позванивают Его ножные колокольчики.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eмукунда ма̄дхава джа̄дава хари,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eболоре болоре вадана бхори’,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eмичхе нида-баш́е гело ре ра̄ти,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдиваса ш́орӣра са̄дже\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eМахапрабху взывает к спящим людям: «Не тратьте ночи на бесполезный сон, а дни на украшение тела! Взывайте к именам Мукунды, Мадхавы, Ядавы и Хари!»\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eэмана дурлабха ма̄нава-дехо,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпа̄ийа̄ ки коро бха̄ва на̄ кехо,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eэбэ на̄ бхаджиле джаш́ода̄-сута,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчараме под̣ибе ла̄дже\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e«Вы обрели столь редкое человеческое рождение! Но что вы делаете? Дорожите ли вы этим даром? Если вы не будете поклоняться любимому сыну матери Яшоды, великое горе будет ждать вас в момент смерти».\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eудита тапана хоиле аста,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдина гело-боли’ хоибе бйаста,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтабе кено эбэ аласа хой,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄ бхаджа хр̣дойа-ра̄дже\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e«С каждым восходом и заходом солнца проходит день, и его уже не вернуть. Почему же вы так ленивы и отказываетесь служить Господу своего сердца?»\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджӣвана анитйа джа̄наха са̄р,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eта̄хе на̄на̄-видха випада-бха̄р,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄ма̄ш́райа кори’ джатане туми,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтха̄каха а̄пана ка̄дже\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e«Вы знаете, что жизнь исполнена страданий! Примите прибежище у Святого Имени — пусть призыв к Нему станет единственным вашим занятием».\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eкр̣ш̣н̣а-на̄ма-судха̄ корийа̄ па̄н\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджуд̣а̄о бхакативинода-пра̄н̣,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eна̄ма бина̄ кичхӯ на̄хико а̄ро,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчаудда-бхувана-ма̄джхе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВкусите чистый нектар Святого Имени Кришны и доставьте этим радость душе Тхакура Бхактивинода. Нет ничего, к чему стоило бы стремиться во всех четырнадцати мирах, кроме Святого Имени!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджӣвера калйа̄н̣а-са̄дхана-ка̄м,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджагате а̄си’ э мадхура на̄м,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eавидйа̄-тимира-тапана-рӯпе,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхр̣д-гагане бира̄дже\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЧтобы рассеять тьму невежества и благословить все души Вселенной, прекрасное Имя Кришны взошло, словно сияющее солнце!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jiv-jago-jiv-jago-gaurachanda-bole\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eАрунодойа-киртан \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003e Часть 2\u003c/h3\u003e\n\u003ch4\u003eШ́рӣла Бхактивинод Т̣ха̄кур\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eджӣв джа̄го, джӣв джа̄го, гаурача̄н̇да боле\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкота нидра̄ джа̄о ма̄йа̄-пиш́а̄чӣра коле\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eГосподь Гауранга взывает: «Проснитесь, спящие души! Проснитесь, спящие души! Вы так долго спали на коленях у ведьмы Майи!»\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбхаджибо болийа̄ эсэ сам̇са̄ра-бхитаре\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбхулийа̄ рохиле туми авидйа̄ра бхоре\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e«Вы пришли в этот мир со словами: „Мой Господь, поверь, я буду поклоняться Тебе“, но, забыв об этом обещании, вы погрузились во тьму невежества».\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eтома̄ре лоите а̄ми хоину авата̄ра\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄ми бина̄ бандху а̄ра ке а̄чхе тома̄ра\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e«Я снизошел, чтобы спасти вас! Есть ли у вас друг, кроме Меня?»\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eэнэчхи ауш̣адхи ма̄йа̄ на̄ш́иба̄ро ла̄ги’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхари-на̄ма маха̄-мантра лао туми ма̄ги’\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e«Я принес способ избавления от иллюзии (\u003ci\u003eмайи\u003c/i\u003e). Молитесь же об этой \u003ci\u003eхаринама-маха-мантре\u003c/i\u003e и примите ее!»\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eбхакативинода прабху-чаран̣е под̣ийа̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсэи хари-на̄ма-мантра лоило ма̄гийа̄\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eТхакур Бхактивинод припал к лотосоподобным стопам Господа Гауранги и, моля о Святом Имени, получил \u003ci\u003eмаха-мантру\u003c/i\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eВандана\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-vande-ham-shri-guroh-shri-yuta-pada-kamalam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eВандана \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eванде ‘хам̇ ш́рӣ-гурох̣ ш́рӣ-йута-пада-камалам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ш́рӣ-гурӯн ваиш̣н̣ава̄м̇ш́ ча\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eш́рӣ-рӯпам̇ са̄граджа̄там̇ саха-ган̣а-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;рагхуна̄тха̄нвитам̇там̇ са-джӣвам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eса̄дваитам̇ са̄вадхӯтам̇ париджана-сахитам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кр̣ш̣н̣а-чаитанйа-девам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eш́рӣ-ра̄дха̄-кр̣ш̣н̣а-па̄да̄н саха-ган̣а-лалита̄-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ш́рӣ-виш́а̄кха̄нвита̄м̇ш́ ча\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e(Шрила Кришнадас Кавирадж Госвами молится): «Я со смирением склоняюсь к лотосоподобным стопам моего духовного учителя, всех духовных наставников и вайшнавов. Я почтительно склоняюсь перед своими \u003ci\u003eшастра-гуру\u003c/i\u003e: Шрилой Рупой Госвами и его старшим братом Шрилой Санатаной Госвами, а также перед Шрилой Рагхунатхом Дасом Госвами и Шрилой Дживой Госвами. Я выражаю почтение тем, кто еще более возвышен: Шри Чайтанье Махапрабху, пришедшему со Своими атрибутами и спутниками, такими великими личностями, как Шри Нитьянанда Прабху и Шри Адвайта Ачарья. С великим благоговением я склоняюсь к лотосоподобным стопам Шри Шри Радхи-Говинды и всех \u003ci\u003eгопи\u003c/i\u003e, возглавляемых Лалитой Деви и Вишакхой Деви».\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eом̇ аджн̃а̄на-тимира̄ндхасйа джн̃а̄на̄н̃джана-ш́ала̄кайа̄\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчакш̣ур унмилитам̇ йена тасмаи ш́рӣ-гураве намах̣\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eУмастив мои глаза целительным бальзамом \u003ci\u003eсамбандха-гьяны\u003c/i\u003e, правильного восприятия окружающего мира, духовный учитель пробудил мое внутреннее видение и вывел меня из тьмы невежества, подарив надежду. В глубоком почтении я склоняюсь перед Шри Гурудевом.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gurvabhishta-supurakam-guru-ganair\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрила Бхакти Сундар Говинда Дев-Госвами Махарадж \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eгурвва̄бхӣш̣т̣а-супӯракам̇ гуру-ган̣аир\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;а̄ш́ӣш̣а-самбхӯш̣итам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eчинтйа̄чинтйа-самаста-веда-нипун̣ам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ш́рӣ-рӯпа-пантха̄нугам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eговинда̄бхидхам уджвалам̇ вара-танум̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бхактй анвитам̇ сундарам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде виш́ва-гурун̃ ча дивйа-бхагават-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;премн̣о хи бӣджа-прадам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eС величайшим почтением я склоняюсь перед тем, кто украшен благословениями всей \u003ci\u003eгуру-варги\u003c/i\u003e и исполняет самые сокровенные желания своего Гуру. Он знаток как постижимых, так и непостижимых истин. Выдающийся последователь божественного учения Шри Рупы, он известен как Шри Бхакти Сундар Говинда. Его сияющий облик излучает преданность Господу. Он явился из высшего мира и прославился в этом мире как истинный духовный учитель, способный даровать семя божественной любви.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-devam-divya-tanum-suchanda-vadanam-balarka-chelanchitam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрила Бхакти Ракшак Шридхар Дев-Госвами Махрадж \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003e(составлено Шрилой Бхакти Сундаром Говиндой Дев-Госвами Махараджем)\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eдевам̇ дивйа-танум̇ сучанда-ваданам̇-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ба̄ла̄рка-чела̄н̃читам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eса̄ндра̄нанда-пурам̇ сад-эка-варанам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ваира̄гйа-видйа̄мбудхим\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eш́рӣ-сиддха̄нта-нидхим̇ субхакти-ласитам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;са̄расвата̄на̄м варам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eванде там̇ ш́убхадам̇ мад-эка-ш́аран̣ам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нйа̄сӣш́варам̇ ш́рӣдхарам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ с благоговением припадаю к стопам Шрилы Шридхара-Дева, который очаровывает всех сладостными песнями преданности. Облаченный в одежды цвета восходящего солнца, он — святой, почитаемый преданными Господа. Он — океан духовного знания, образец отречения от мирского и хранитель совершенных истин. Он — воплощение любви и преданности Богу, дарующий высшую удачу, и сокровищница духовного экстаза. Он величайший из последователей Шрилы Бхактисиддханты, предводитель санньяси, мой владыка и учитель, мое единственное прибежище! С любовью я склоняюсь к лотосоподобным стопам Шрилы Шридхара-Дева.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-siddhanta-sarasvatiti-vidito\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eБхагаван Шрила Бхактисиддханта Сарасвати \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003e(составлено Шрилой Бхакти Ракшаком Шридхаром Дев-Госвами Махараджем)\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eш́рӣ-сиддха̄нта-сарасватӣти видито\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;гауд̣ӣйа-гурв-анвайе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбхато бха̄нурива прабха̄та-гагане\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;йо гаура-сам̇кӣрттанаих̣\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eма̄йа̄ва̄да-тимин̇гилодара-гата̄н\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;уддхр̣тйа джӣванима̄н\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкр̣ш̣н̣а-према-судха̄бдхи-га̄хан̣а-сукхам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;пра̄да̄т прабхум̇ там̇ бхадже\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eСреди великих учителей Гаудия-вайшнавов он известен как Шрила Бхактисиддханта Сарасвати. Словно сияющее солнце, взошедшее на небосклоне, он явился, чтобы спасти души, поглощенные всепожирающей философией имперсонализма. Проповедуя учение Господа Гауранги о воспевании Святого Имени Господа Кришны, он даровал шанс погрузиться в океан любви к Шри Кришне, Высшей Личности. Шрила Бхактисиддханта — мой господин и божественный учитель. У его лотосоподобных стоп я молю о вечном служении ему!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-namo-gaurakishoraya-bhaktavadhuta-murtaye\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрила Гауракишор Дас Бабаджи Махарадж \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003e(составлено Шрилой Бхакти Ракшаком Шридхаром Дев-Госвами Махараджем)\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнамо гауракиш́ора̄йа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бхакта̄вадхӯта мӯртайе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eгаура̄н̇гхри падма-бхр̣н̇га̄йа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄дха̄-бха̄ва-ниш̣евине\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ склоняюсь перед нашим Гуру, Шрилой Гауракишором Дасом, чистым преданным, стоящим выше всяких социальных условностей. Он подобен пчеле у лотосоподобных стоп Шри Гауранги и в своем сердце вечно служит Шри Радхе.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vande-bhaktivinodam-shri-gaura-shiakti-svarupakam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрила Бхактивинод Тхакур \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003e(составлено Шрилой Бхакти Ракшаком Шридхаром Дев-Госвами Махараджем)\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eванде бхактивинодам̇ ш́рӣ-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;гаура-ш́акти-сварӯпакам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбхакти-ш́а̄страджн̃а-самра̄джам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ра̄дха̄-раса-судха̄-нидхим\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ преклоняюсь перед Шри Тхакуром Бхактивинодом, воплощением божественной любви Махапрабху. Он царь среди знатоков сокровенного смысла священных писаний и океан преданности Шри Радхе.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gaura-vrajashritashieshair-vaishnavair-vandya-vigraham\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШрила Джаганнатх Дас Бабаджи Махарадж \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003e(составлено Шрилой Бхакти Ракшаком Шридхаром Дев-Госвами Махараджем)\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eгаура-враджа̄ш́рита̄ш́еш̣аир\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ваиш̣н̣аваир вандйа-виграхам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eджаганна̄тха-прабхум̇ ванде\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;према̄бдхим̇ вр̣ддха-ваиш̣н̣авам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ поклоняюсь стопам великого учителя всех вайшнавов, признанного патриарха чистой преданности, любимого всеми вайшнавами Навадвипы и Вриндавана, океану любви, Шриле Джаганнатхе Прабху.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vancha-kalpatarubhyas-cha\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eМолитвы, обращенные к вайшнавам \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eва̄н̃чха̄-калпатарубхйаш́’ ча\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кр̣па̄-синдхубхйа эва ча\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eпатита̄на̄м̇ па̄ванебхйо\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ваиш̣н̣авебхйо намо намах̣\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eВ благоговении я склоняюсь к святым стопам великих вайшнавов, которые, подобно деревьям желаний, могут удовлетворить все желания преданных Господа. Их можно сравнить с безбрежным океаном беспричинной милости, поскольку они спасают от страданий мирского существования падшие души. Я выражаю им свое глубокое почтение.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eпан̃ча-таттва̄тмакам̇ кр̣ш̣н̣ам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бхакта-рӯпа-сварӯпакам\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eбхакта̄вата̄рам̇ бхакта̄кхйам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;нама̄ми бхакта-ш́актикам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ почтительно склоняюсь перед Господом Кришной в Его пяти аспектах, известных как Панча-таттва. Я почитаю Шри Гаурангадева, который приходит в этот мир как преданный Господа, наслаждающийся Своей собственной вечной сладостью. Я преклоняюсь перед Господом Нитьянандой Прабху, который неотличен от Своего старшего брата Шри Гауранги. Я выражаю почтение великому Шри Адвайте Прабху, воплощению преданного Господа, и вечным спутникам Господа, таким как Шривас Пандит, служащим Господу из преданности, основанной на любви. Я почтительно припадаю к стопам преданных, хранящих подлинное могущество абсолютного самопредания: Шри Рамананды Рая, Шри Гададхара Пандита и Шри Сварупы Дамодара.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eнамо маха̄-вада̄нйа̄йа\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;кр̣ш̣н̣а-према-прада̄йа те\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eкр̣ш̣н̣а̄йа кр̣ш̣н̣а-чаитанйа-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;на̄мне гаура-твиш̣е намах̣\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eЯ склоняюсь перед Господом Гаурангой, чей божественный облик излучает золотое сияние, кто обладает качествами самого милостивого воплощения Бога. Его духовные игры щедро даруют каждому чистую любовь к Господу Кришне. Он не кто иной, как сам Шри Кришна, известный в век Кали под именем Шри Кришны Чайтаньи.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-krishna-chaitanya-prabhu-nityananda\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eПанча-таттва мантра \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eш́рӣ-кр̣ш̣н̣а-чаитанйа прабху нитйа̄нанда\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eш́рӣ-адваита гада̄дхара ш́рӣва̄са̄ди-гаура-бхакта-вр̣нда\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eПри воспевании Харе Кришна \u003ci\u003eмаха-мантры\u003c/i\u003e можно нанести десять оскорблений Святому Имени, но они не принимаются во внимание при воспевании Панча-таттва \u003ci\u003eмантры\u003c/i\u003e. Шри Чайтанья Махапрабху — самое великодушное воплощение Бога, поскольку Он не принимает оскорбления падших душ. Поэтому, чтобы обрести полное благо при воспевании \u003ci\u003eмаха-мантры\u003c/i\u003e, следует прежде принять прибежище у Шри Чайтаньи Махапрабху и Его спутников, Панча-таттвы, дарующих Харе Кришна \u003ci\u003eмаха-мантру\u003c/i\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hare-krishna-hare-krishna-krishna-krishna-hare-hare\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eХаре Кршна маха-мантра \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eОбъяснение Шрилы Бхакти Ракшака Шридхара Дев-Госвами Махараджа из книги «Любовный поиск потерянного слуги»\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eхаре кр̣ш̣н̣а харе кр̣ш̣н̣а кр̣ш̣н̣а кр̣ш̣н̣а харе харе\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eхаре ра̄ма харе ра̄ма ра̄ма ра̄ма харе харе\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eИменем «Рама» в Харе Кришна \u003ci\u003eмаха-мантре\u003c/i\u003e гаудия-вайшнавы обращаются к Радха-рамана Раме. Радха-рамана Рама означает: «Кришна, дарующий наслаждение (\u003ci\u003eраман\u003c/i\u003e) Шримати Радхарани». В нашем понимании Харе Кришна \u003ci\u003eмаха-мантра\u003c/i\u003e преисполнена Кришна-сознанием, а не Рама-сознанием. Наивысшая концепция Шри Чайтаньи Махапрабху — это Сваям Бхагаван, \u003ci\u003eкришна-лила, радха-говинда-лила\u003c/i\u003e. Это истинная цель нисшествия и всех наставлений Шри Кришны Чайтаньи Махапрабху.\u003cbr\u003e\nИз этого следует то, что в Харе Кришна \u003ci\u003eмаха-мантре\u003c/i\u003e нет упоминания о \u003ci\u003eрама-лиле\u003c/i\u003e Айодхьи. В наивысшей концепции Харе Кришна \u003ci\u003eмаха-мантры\u003c/i\u003e нет никакой связи с этим… Понимание внутренней сути \u003ci\u003eмантры\u003c/i\u003e ответственно за наш духовный прогресс… Это внутреннее понимание будет вести искреннюю душу к ее подлинному предназначению.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003e⸻\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-cheto-darpana-marjanam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eШри Шикшаштакам \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eШ́ри Чайтанья Маха̄прабху\u003c/h4\u003e\n\u003cp class=\"translation\"\u003eНе в силах совладать с нахлынувшими чувствами, Махапрабху терял власть над Собой, речь Его обращалась в беспорядочные стихотворные обрывки. Прежде Он изрёк Своё Восьмистишье в назидание людям, нынче же Сам с упоением внимал Собственному слову. В человеке, который внемлет Господнему Напутственному Восьмистишью, естественно пробуждается любовная преданность Кришне, прирастающая день ото дня.\u003cbr\u003e\n\u003ci\u003eШРИ ЧАЙТАНЬЯ-ЧАРИТАМРИТА. АНТЬЯ-ЛИЛА. 20.63-65\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse-subtitle\"\u003eПонедельник\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eчето-дарпан̣а-ма̄рджанам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;бхава-маха̄-да̄ва̄гни-нирва̄пан̣ам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eш́рейах̣-каирава-чандрика̄-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;витаран̣ам̇ видйа̄-вадху-джӣванам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eа̄нанда̄мбудхи-варддханам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;прати-падам̇ пӯрн̣а̄мр̣та̄сва̄данам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eсарва̄тма-снапанам̇ парам̇\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;виджайате ш́рӣ-кр̣ш̣н̣а-сан̇кӣрттанам\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eГосподне Имя проясняет зеркало сознания и гасит пламя суетных страстей. Оно как полная луна, в чьём нежном свете распускается удачи белый лотос. Оно дарует знание, вселяет жизнь, невестою подводит к Богу. Оно бросает в бесконечно ширящийся океан блаженства. Оно к устам подносит чашу, полную сладчайшего нектара, омывает душу чистою, живительной водой. Так пусть над миром шествует с победою Святых Имён Господних воспеванье!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse-subtitle\"\u003eВторник\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eна̄мна̄м ака̄ри бахудха̄ ниджа-сарва-ш́актис\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eтатра̄рпита̄ нийамитах̣ смаран̣е на ка̄лах̣\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eэта̄др̣ш́и тава кр̣па̄ бхагаван мама̄пи\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eдурдайвам ӣдр̣ш́ам иха̄джани на̄нура̄гах̣\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eО Господи, явился миру Ты в различных Именах, и каждое Ты наделил Своею полной властью. Для их памятования нет строгих правил и обрядов нет. Любой в каком угодно месте и в любое время может Твоё Имя призывать. Но Я настолько низок и настолько обделён удачею, что сладости не чувствую Твоих Имён и к ним влеченья не питаю.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse-subtitle\"\u003eСреда\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003
