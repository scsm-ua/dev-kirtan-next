ада̄дхара джай джай\",\"    джайа харида̄с на̄ма̄ча̄рйа\"],\"translation\":[\"Слава Сите Тхакурани и Шри Адвайте Ачарье! Слава Малини Деви и Шривасу Тхакуру, слава Чандрашекхару Ачарье! Слава Шриле Нитьянанде Прабху, Шриле Гададхару Пандиту и Шриле Харидасу Тхакуру, *намачарье*!\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"мура̄ри мукунда джай    преманидхи маха̄ш́айа\",\"    джайа йата прабху па̄риш̣ад\",\"ванди сава̄ка̄ра па̄йа    адхамере кр̣па̄ хой\",\"    бхакти сапа̄рш̣ада-прабхупа̄д\"],\"translation\":[\"Слава Мурари Гупте, слава Мукунде Датте! Слава вечным спутникам Шри Чайтаньи Махапрабху! Воспевая славу Шрилы Прабхупады и всех великих душ, вечных спутников Шри Чайтаньи Махапрабху, даже самый недостойный может обрести наивысшее сокровище любви!\"],\"isLong\":false}],\"embeds\":[{\"title\":\"Каракас Дхам\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/shchsm-karakas-dzhaya\",\"iframe_url\":\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fshchsm-karakas-dzhaya\",\"embed_code\":\"\u003ciframe width=\\\"100%\\\" height=\\\"20\\\" scrolling=\\\"no\\\" frameborder=\\\"no\\\" allow=\\\"autoplay\\\" src=\\\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fshchsm-karakas-dzhaya\\\"\u003e\u003c/iframe\u003e\"},{\"title\":\"Шрила Мадхусудан Махарадж\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/madhusudan-maharaj-day-programm-kisel\",\"iframe_url\":\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fmadhusudan-maharaj-day-programm-kisel\",\"embed_code\":\"\u003ciframe width=\\\"100%\\\" height=\\\"20\\\" scrolling=\\\"no\\\" frameborder=\\\"no\\\" allow=\\\"autoplay\\\" src=\\\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbharatimaharaj%2Fmadhusudan-maharaj-day-programm-kisel\\\"\u003e\u003c/iframe\u003e\"},{\"title\":\"Шрила Авадхут Махарадж\",\"embed_url\":\"https://soundcloud.com/bharatimaharaj/avadxut-maxaradzh
