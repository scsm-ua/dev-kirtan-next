ūtnes – gan cienīgas, gan necienīgas, kuras cieš šīs materiālās pasaules ugunī, viņš lej savas līdzcietības straumes un tādējādi līdzinās lietus mākonim!\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"mahāprabhoḥ kīrtana-nṛtya-gīta-\",\"vāditra-mādyan-manaso rasena\",\"romāñcha-kampāśru-taraṅga-bhājo\",\"vande guroḥ śrī-charaṇāravindam\"],\"translation\":[\"Es pielūdzu garīgā skolotāja lotosam līdzīgās pēdas! Viņa sirds ir neprātīga no mīlestības nektāra uz Šrīmānu Mahāprabhu kopīgi dziedot Svēto Vārdu! Kad viņš, spēlējot kholu vai karatālas, dejo un dzied, viņa ķermenis laimē trīc un no viņa acīm plūst asaru straumes.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"śrī-vigrahārādhana-nitya-nānā-\",\"śṛṅgāra-tan-mandira-mārjanādau\",\"yuktasya bhaktāṁś cha niyuñjato ’pi\",\"vande guroḥ śrī-charaṇāravindam\"],\"translation\":[\"Es pielūdzu garīgā skolotāja lotosam līdzīgās pēdas! Viņš ir aizņemts dažādos garīgas kalpošanas veidos, tādos kā Dievību ģērbšana un Kunga svētā tempļa tīrīšana; līdzīgos veidos viņš iesaista kalpošanā arī citus *bhaktas*.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"chatur-vidha-śrī-bhagavat-prasāda\",\"svādv-anna-tṛptān hari-bhakta-saṅghān\",\"kṛtvaiva tṛptiṁ bhajataḥ sadaiva\",\"vande guroḥ śrī-charaṇāravindam\"],\"translation\":[\"Es pielūdzu garīgā skolotāja lotosam līdzīgās pēdas! Viņš dāvā Šrī Krišnas *bhaktām* četru veidu nektāra *prasādu* (kuru košļā, sūkā, laiza un dzer). Pateicoties tam, pasaulīgais valdzinājums nobāl un mostas slāpes pēc garīgas mīlestības! Kad viņš redz, kā *bhaktas* bauda *prasādu*, viņa sirds piepildās ar prieku!\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"śrī-rādhikā-mādhavayor apara\",\"mādhurya-līlā-guṇa-rūpa-nāmnām\",\"prati-kṣaṇāsvādana-lolupasya\",\"vande guroḥ śrī-charaṇaravindam\"],\"translation\":[\"Es pielūdzu garīgā skolotāja lotosam līdzīgās pēdas! Viņa sirds neremdināmi slāpst pēc Šrī Šrī Rādha-Mādhavas Svētā Vārda, veidola, īpašībām un ar dievišķo mīlestību pārpildīto rotaļu saldās garšas nektāra!\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"nikuñja-yūno rati-keli-siddhyair\",\"yā yālibhir yuktir apekṣaṇīyā\",\"tatrāti-dākṣyād ati-vallabhasya\",\"vande guroḥ śrī-charaṇāravindam\"],\"translation\":[\"Es pielūdzu garīgā skolotāja lotosam līdzīgās pēdas! Viņš ir bezgalīgi dārgs Dievišķajam Pārim, kurš rotaļājas Vradžas birzīs! Viņš pārzina visu, ko dara *sakhī*, lai apkalpotu Dievišķā Pāra mīlas rotaļas.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"sākṣād-dharitvena samasta-śāstrair\",\"uktas tathā bhāvyata eva sadbhiḥ\",\"kintu prabhor yaḥ priya eva tasya\",\"vande guroḥ śrī-charaṇāravindam\"],\"translation\":[\"Es pielūdzu garīgā skolotāja lotosam līdzīgās pēdas! Neaptveramā veidā viņš vienlaicīgi ir atšķirams un neatšķirams no Visaugstā! Visi svētie Raksti slavē viņu kā neatšķiramu no Visaugstā Kunga Šrī Harī, un to atzīst arī realizētas dvēseles un svētie. Tajā pašā laikā viņu visvairāk mīl arī pats Kungs!\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"yasya prasādād bhagavat-prasādo\",\"yasyāprasādāt na gatiḥ kuto ’pi\",\"dhyayaṁ stuvaṁs tasya yaśas tri-sandhyaṁ\",\"vande guroḥ śrī-charaṇaravindam\"],\"translation\":[\"Es pielūdzu garīgā skolotāja lotosam līdzīgās pēdas, vienmēr slavējot viņu un domājot par viņu – rītā, dienā un vakarā! Tikai pateicoties viņa žēlsirdībai var iegūt Kunga žēlastību! Ja viņš ir neapmierināts ar kādu, tam nelaimīgajam vairs nerast patvērumu nekur!\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"śrīmad guroraṣṭakam etad uchair\",\"brāhme muhūrte paṭhati prayātnāt\",\"yas tena vṛndāvana-nātha-sākṣāt-\",\"sevaiva labhyā januṣo ’nta eva\"],\"translation\":[\"Tas, kurš ar tīru sirdi dzied šīs astoņas lūgšanas garīgajam skolotājam *brahma-muhurtā* (deviņdesmit sešas minūtes pirms saules lēkta), varēs kalpot Vrindāvanas Valdniekam!\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.K. Ashram Maharaj\",\"ru\":\"Шрила Б.К. Ашрам Махарадж\",\"ua\":\"Шріла Б.К. Ашрам Махарадж\"},\"embed_url\":\"https://soundcloud.com/scsmathcolombia/8-sri-sri-gurvvastakam\"},{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-samsara-davanala\"},{\"title\":{\"en\":\"Bhakti Lalita Devi\",\"ru\":\"Бхакти Лалита Деви\",\"ua\":\"Бгакті Лаліта Деві\"},\"embed_url\":\"https://soundcloud.com/bhakti-lalita-devi/bhakti-lalita-devi-sri-sri-gurvvashtakam-samsara-davanala-lidha-loka\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1e:[\"$\",\"$L27\",null,{\"audio\":\"$1d:props:song:resources:audio\",\"caption\":\"Klausies audio:\",\"language\":\"lv\"}]\n1f:[\"$\",\"$L28\",null,{\"navMap\":{\"48\":{\"prev\":{\"path\":\"/lv/jiv-jago-jiv-jago-gaurachanda-bole/\",\"title\":\"Aruṇodoya-kīrtan 2\"},\"next\":{\"path\":\"/lv/shri-krishna-chaitanya-prabhu-jive-daya-kori/\",\"title\":\"Śaraṇāgati – labvēlīgs aicinājums\"}}}}]\n29:T11c2,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"description\":\"A digital Vaishnava songbook with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPage\",\"@id\":\"https://dev.kirtan.site/lv/samsara-davanala-lidha-loka/\",\"url\":\"https://dev.kirtan.site/lv/samsara-davanala-lidha-loka/\",\"name\":\"Śrī Śrī Gurvāṣṭaka. Šrīla Višvanāths Čakravartī Thākurs\",\"inLanguage\":\"lv\",\"description\":\"Śrī Śrī Gurvāṣṭaka — vaišnavu dziesma ar vārdiem, tulkojumu latviešu valodā un skaidrojumu vārdu pa vārdam. Autors — Šrīla
