26nbsp;dayāra sāgara,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;e dāse karuṇā kori\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ediyā pada-chāyā,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śodho he āmāre,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra charaṇa dhori\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, mans kungs, ak, Vaišnav, žēlastības okeān, lūdzu, esi žēlsirdīgs pret šo kalpu! Dāvā man pajumti savu lotosam līdzīgo pēdu ēnā, attīri mani! Izmisumā es apķeru tavas svētās pēdas!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echoya bega domi’,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;choya doṣa śodhi’,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;choya guṇa deho’ dāse\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echoya sat-saṅga,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;deho’ he āmāre,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bosechi saṅgera āśe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePakļauj sešus dzinuļus, novērs sešus trūkumus, dāvā sešas labvēlīgas īpašības savam kalpam! Lūdzu, dāvā man sešus svētas saskarsmes veidus. Es klanos pie tavām pēdām cerībā ienākt \u003ci\u003ebhaktu\u003c/i\u003e ģimenē (sk. piezīmi).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eekākī āmāra,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāhi pāya bala,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hari-nāma-saṅkīrtane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etumi kṛpā kori,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śraddhā-bindu diyā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;deho’ kṛṣṇa-nāma-dhane\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePats saviem spēkiem es nespēju kopā ar citiem dziedāt Svēto Vārdu! Lūdzu, ieliec manā sirdī pilienu ticības, dāvā man Krišnas Svētā Vārda dārgumus!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛṣṇa se tomāra,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛṣṇa dite pāro,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra śakati āche\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāmi to kāṅgāla,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘kṛṣṇa kṛṣṇa’ boli,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dhāi tava pāche pāche\u003c/strong\u003e\u003cbr\u003e\n\u003cbr\u003e\n(āmi)\u003cstrong\u003e \u003c/strong\u003e(dhāi tava pāche pāche)\u003cbr\u003e\n(kṛṣṇa dhana pābarāse dhāi tava pāche pāche)\u003cbr\u003e\n(tumi dileou dite pāro)\u003cbr\u003e\n(kṛṣṇa tomār hṛdoyer dhan tumi dileou dite pāro)\u003cbr\u003e\n(kṛṣṇa devār śakti dhara tumi dileou dite pāro)\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKrišna pieder tev, tu vari Viņu atklāt citiem, tev piemīt tāds spēks! Kā neprātīgs es saucu: “Krišna, Krišna!” un izmisis skrienu tev pakaļ.\u003cbr\u003e\n\u003ci class=\"translation__term\"\u003ePiezīme pie 2. vārsmas:\u003c/i\u003e\u003cbr\u003e\nSeši dzinuļi: runa, prāts, dusmas, mēle, kuņģis un ģenitālijas.\u003cbr\u003e\nSeši trūkumi: pārēšanās vai pārmērīgu iekrājumu veidošana; pārmērīgas pūles pasaulīgu mērķu sasniegšanai; saviesīgas sarunas par pasaulīgām tēmām; pārlieka uzmanība Rakstu norādījumu ievērošanā, kā arī tieši pretēji – nolaidīga attieksme pret Rakstu norādījumiem; saskarsme ar materiāli noskaņotiem cilvēkiem; kaislīga tieksme pēc pasaulīgiem sasniegumiem.\u003cbr\u003e\nSešas labvēlīgas īpašības: entuziasms, pacietība, pārliecība, apņēmība, kas nepieciešama, lai veiktu kalpošanai labvēlīgas darbības, apņēmība atteikties no materiāli noskaņotu cilvēku sabiedrības, paklausība, kas nepieciešama, lai vienmēr sekotu \u003ci\u003eāčārju\u003c/i\u003e pēdām.\u003cbr\u003e\nSeši svētas saskarsmes veidi: piedāvāt labdarības dāvanas, pieņemt ziedojumus, uzticēt savas personīgās domas citiem, uzklausīt citu personīgās domas, pieņemt \u003ci\u003eprasādu\u003c/i\u003e un piedāvāt \u003ci\u003eprasādu\u003c/i\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eŚrī Śrī Premadhāma-deva-stotram\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-deva-siddha-mukta-yukta-bhakta-vrinda\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śrī Premadhāma-deva-stotram \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eSestdiena\u003c/h3\u003e\n\u003ch4\u003eŠrīla Bhakti Rakšak Šrīdhārs Dēv-Gosvāmī Mahārādža\u003c/h4\u003e\n\u003ch4\u003eSvāmī Bhakti Pavan Džanardana redakcija\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edeva-siddha-mukta-yukta-bhakta-vṛnda-vanditaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epāpa-tāpa-dāva-dāha-dagdha duḥkha-khaṇḍitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-nāma-sīdhu-dhāma-dhanya-dāna-sāgaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDebesu iemītnieki, pilnīgās dvēseles, atbrīvošanas tīkotāji, mistiskie jogi un augstie Absolūtās Patiesības – Šrī Krišnas, kalpi, vienmēr slavē Šrī Gaurasundaru. Šrīla Rūpa Gosvāmī savā “Šrī Čaitanjaštakam” min šādu vārsmu:\u003cbr\u003e\n\u003ci\u003esadopāsyaḥ śrīmān dhṛta-manuja-kāyaiḥ praṇayitāṁ\u003c/i\u003e\u003cbr /\u003e\u003ci\u003evahadbhir gīr-vāṇair giriśa-parameṣṭhi-prabhṛtibhiḥ\u003c/i\u003e\u003cbr\u003e\n“Debesu iemītnieki, ar Kungu Šivu un Kungu Brahmu priekšgalā, tērpušies vienkāršu cilvēku drānās, piedalījās Šrī Čaitanjadēva rotaļās, lai patiesā maigumā mūžīgi pielūgtu Viņu”. Šrī Čaitanjadēvs ir plašā tīra nektāra okeāna iemiesojums, kurš rod savu sākumu Svētajā Kunga Krišnas Vārdā, kas ir nekas cits kā tīrs paša Šrī Gaurangas Vārds. Šrī Čaitanjadēvu salīdzina ar dižo piena okeānu, kuru kuļot izdalījās nektārs. Nektārs, kuru izplata Mahāprabhu, ir svētie Kunga Krišnas Vārdi. Tie novērš tādas materiālās esības likstas kā prom no Kunga vedošs grēcīgas rīcības radīts nemiers un trīskāršas ciešanas, kuras tikai pastiprina meža ugunsgrēku, kurā deg juteklisko baudu un atbrīvošanas meklētāji un mistiskie jogi. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esvarṇa-koṭi-darpaṇābha-deha-varṇa-gauravaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epadma-pārijāta-gandha-vanditāṅga-saurabham\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekoṭi-kāma-mūrchitāṅghri-rūpa-rāsa-raṅgaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Gaurasundara dievišķā ķermeņa apburošais mirdzums līdzinās miljons žilbinošu zelta spoguļu mirdzumam. Pati lotosa un paridžāta smarža velta pazemīgas lūgšanas saldajam aromātam, kurš nāk no brīnišķīgā Šrī Čaitanjas Mahāprabhu ķermeņa. Miljoni un miljoni kupidonu zaudē samaņu pie graciozā Šrī Čaitanjadēva ķermeņa pēdām. Kupidonus satriec tas, ka viņu visā Visumā zināmā mirdzošā skaistuma slava ir nobālējusi. Šrī Gaurasundars izpilda savu priecīgo deju un Viņa dievišķais ķermenis graciozi kustas. Plūstoši, līdzīgi ūdens straumei, Kunga rokas un kājas kustas vienā ritmā ar dažādo kalpošanas jūtu apburošajiem toņiem – \u003ci\u003ebhāvām\u003c/i\u003e, kuras valda pār Viņu. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprema-nāma-dāna-janya-pañcha-tattvakātmakaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esāṅga-divya-pārṣadāstra-vaibhavāvatārakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśyāma-gaura-nāma-gāna-nṛtya-matta-nāgaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eParādoties piecos \u003ci\u003epanča-tattvas\u003c/i\u003e aspektos, Šrī Gaurangadēvs spēja visiem izdalīt saldos Kunga Krišnas vārdus, kurus dziedot var sasniegt augstāko dzīves pilnību: tīru mīlestību uz Absolūto Patiesību, Šrī Krišnu – piekto un augstāko mērķi. (“Piektais mērķis” apzīmē aiz tās pilnības robežām esošu mērķi, kuru sasniedz caur reliģiju, bagātību, jutekliskām baudām un atbrīvošanos.) Kungs personīgi iemiesojās uz Zemes kopā ar savām ekspansijām, tādām kā Nitjānanda Prabhū un Advaita Āčārja, un tuviem pavadoņiem, tādiem kā Gadadhārs Pandits un Šrīvāss Thākurs. Kungs nāk bruņojies ar Krišnas Svēto Vārdu! Dejojot dziļākajā tīras mīlestības sajūsmā, Kungs Gaurangadēvs, kurš ir neviens cits kā Šjāmasundars, dziedāja savus Paša vārdus kā parasts Nādijas apgabala iedzīvotājs.  Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśānti-puryadhīśa-kaly-adharma-duḥkha-duḥsahaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejīva-duḥkha-hāna-bhakta-saukhyadāna-vigraham\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekaly-aghaugha-nāśa-kṛṣṇa-nāma-sīdhu-sañcharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Gauradēvs atnāca Dievības veidolā, lai pārtrauktu dzīvo būtņu ciešanas un nestu laimi saviem bhaktām. Kungs iemiesojās pateicoties Šantipūras ciema vecākā, Šrī Advaita Āčārjas, lūgšanai, jo vairs nespēja izturēt Šrī Advaita Āčārjas bēdas par viņa atšķirtību no Kunga. Šrī Advaita Āčārja raudāja par šo laikmetu, kuru pārņēmusi bezdievība. Lai apturētu Kali-\u003ci\u003ejūgas\u003c/i\u003e netikumīgās darbības, Kungs dāsni dalījās ar Kunga Krišnas Svēto Vārdu saldo nektāru. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edvīpa-navya-gāṅga-baṅga-janma-karma-darśitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrīnivāsa-vāsa-dhanya-nāma-rāsa-harṣitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-haripriyeśa-pūjyadhī-śachī-purandaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Gaurasundars nāca šajā pasaulē Rietumbengālijā, svētā vietā, kura atrodas Gangas krastā un ir pazīstama kā Navadvīpa. Navadvīpas svētajā mītnē Šrī Gaura spēlēja mājsaimnieka lomu, ar to svētot brīnišķīgo pagalmu, kas ieskāva Šrinivāsa Pandita mājvietu. Ar savām naksnīgajām Svētā Vārda kopīgas dziedāšanas rotaļām dziļākajās pašatdeves garšās, viņš sagādāja prieku saviem dārgākajiem pavadoņiem. Pret māti Šačidēvī un tēvu Džagannāthu Mišru dziļu mīlestību izjūtošais Gaurasundars bija Lakšmiprījas Dēvī un Višnuprījas Dēvī visas dzīves kungs. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-śachī-dulāla-bālya-bāla-saṅga-chañchalaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eākumāra-sarva-śāstra-dakṣa-tarka-maṅgalam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echāttra-saṅga-raṅga-digjigīṣu-darpa-saṁharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Gaurangadēvs, Šačidēvī dēls, darīja savas jautrās bērnu dienu nerātnības vispalaidnīgāko zēnu sabiedrībā. (Nīmajs bija līdzīgs mazajam Krišnam, Jašodas dēlam.) Nīmaja palaidnības bija patīkamas ne tikai Viņam, tās priecēja arī visu viņa bhaktu sirdis.\u003cbr\u003e\nPusaudža gados Kungs sasniedza nepārspētu meistarību Svēto rakstu slēdzienu pārzināšanā. Bruņojies ar neuzvaramu loģiku, Kungs Višvambhāra meistarīgi izveidoja visiem labvēlīgo \u003ci\u003ešuddha-bhakti\u003c/i\u003e mācību – mācību par pilnīgu sevis veltīšanu Brīnišķīgajai Absolūtajai Patiesībai, Kungam Krišnam, tādā veidā sagraujot sausās loģikas sistēmu, kuru tajā laikā studēja lepnie loģikas eksperti, kļuvuši par teju ateistiskiem zinātniekiem. Vēlāk, jaunības gados, Gangas krastā Kungs, saviem gramatiku apgūstošajiem skolniekiem klātesot, satrieca tā laika pazīstamākā sanskrita pazinēja, Digvidžāja Pandita, lepnumu. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evarya-pātra-sārameya-sarpa-saṅga-khelanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eskandha-vāhi-chaura-tīrtha-vipra-chitra-līlanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-nāma-mātra-bālya-kopa-śānti-saukaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBērnības rotaļu laikā Nīmajs mēdza sēdēt izmestu māla podu vidū, kuros iepriekš tika gatavots ēdiens Kungam Višnu, kā arī spēlēties ar netīriem dzīvniekiem, tādiem kā suņi, bet vienu reizi viņš apgūlās uz kobras tā it kā viņa būtu Ananta Šēša. Kādu reizi Nīmaju nolaupīja divi zagļi, kuri kāroja nozagt rotājumus no Viņa brīnišķīgā ķermeņa. Viens no viņiem uzsēdināja mazo Nīmaju sev uz pleciem un viņi metās bēgt. Tomēr, esot Kunga enerģijas – Jogamajas, ietekmē, viņi negaidīti attapās pie Nīmaja mājas.\u003cbr\u003e\nVēlāk Džagannātha Mišras mājā viesojās pazīstams mūks-\u003ci\u003ebrahmans\u003c/i\u003e. Kad viņš piedāvāja Kungam Gopalam sevis pagatavoto maltīti, Nīmajs pieņēma piedāvāto, to apēdot. Mūks atkārtoti pagatavoja un piedāvāja ēdienu Kungam. Trīs reizes pieņēmis \u003ci\u003ebrahmana\u003c/i\u003e piedāvāto ēdienu, Kungs parādīja Sevi \u003ci\u003ebrahmanam\u003c/i\u003e savā četrrokotajā veidolā.\u003cbr\u003e\nAllaž, kad mazulis Nīmajs dusmojās vai raudāja, tikai Kunga Krišnas Svēto Vārdu dziedāšana viņu mierināja. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esnāna-gāṅga-vāri-bāla-saṅga-raṅga-khelanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebālikādi-pārihāsya-bhaṅgi-bālya-līlanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekūṭa-tarka-chāttra-śikṣakādi-vāda-tatparaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBērnībā Nīmajs ar saviem skolas biedriem rīkoja jautras rotaļas Gangā. Dažkārt Nīmajs ķircināja meitenes, kuras bija atnākušas Gangā nopeldēties. Un šis pats zēns bieži vien arī demonstrēja spēcīgus argumentus un pretargumentus skolas biedriem un pasniedzējiem. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī nimāi-paṇḍiteti-nāma-deśa-vanditaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enavya-tarka-dakṣa-lakṣa-dambhi-dambha-khaṇḍitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esthāpitārtha-khaṇḍa-khaṇḍa-khaṇḍitārtha-sambharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eJaunekļa vecumā Kungs kļuva plaši un tālu pazīstams kā lielākais zinātnieks, Nīmajs Pandits. Kungs iznīcināja tūkstošu pašapmierinātu, augstprātīgu zinātnieku-loģiķu nepamatoto lepnumu. Kungs atņēma viņiem runas spējas, satriecot un atspēkojot viņu izvirzītos apgalvojumus, pēcāk kritizējot savu paša viedokli un no jauna pamatojot viņu iepriekš jau noraidītos argumentus. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśloka-gāṅga-vandanārtha-digjigīṣu-bhāṣitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evyatyalaṅkṛtādi-doṣa-tarkitārtha-dūṣitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhvasta-yukti-ruddha-buddhi-datta-dhīmadādaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePēc tam, kad dižais sanskrita pazinējs Kēšava Kašmirī ar sava intelekta palīdzību bija guvis uzvaru visās desmit pasaules malās, Gangas krastā viņš stājās Šrī Čaitanjas Mahāprabhu priekšā. Izpildot Kunga lūgumu, viņš turpat, bez gatavošanās, sacerēja un nodeklamēja daudzas brīnišķīgas lūgšanas svētās Gangas slavai. Šrī Gaurangadēvs norādīja uz dažām retoriskām kļūdām viņa sacerējumos un ar to zinātnieku ļoti pārsteidza. Kēšava Kašmirī savai aizstāvībai prasmīgi izvirzīja daudzus loģiskus argumentus, taču beigu beigās cieta sakāvi. Kad tika atklāta Kēšavas Kašmirī nekompetence un viņa prāts bija pilnīgā mulsumā, Kungs Gauranga žēlsirdīgi izrādīja viņam cieņu kā dižam zinātniekam, lai novērstu izsmieklu no klātesošo Kunga skolnieku puses. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-sutra-vritti-tippanishta-sukshma-vachanadbhutam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch2\u003eŚrī Śrī Premadhāma-deva-stotram \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eSvētdiena\u003c/h3\u003e\n\u003ch4\u003eŠrīla Bhakti Rakšak Šrīdhārs Dēv-Gosvāmī Mahārādža\u003c/h4\u003e\n\u003ch4\u003eSvāmī Bhakti Pavan Džanardana redakcija\u003c/h4\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esūtra-vṛtti-ṭippanīṣṭa-sūkṣma-vāchanādbhutaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhātu-mātra-kṛṣṇa-śakti-sarva-viśva-sambhṛtam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eruddha-buddhi-paṇḍitaugha-nānya-yukti-nirdharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSmalki izskaidrojot sanskrita gramatikā un loģikas zinātnē izmantotos aforismus, Šrī Gaurasundars atklāja to acīmredzamās un arī smalkās, teju neatšķiramās nozīmes. Brīnišķīgais veids, kādā Kungs skaidroja \u003ci\u003esūtru\u003c/i\u003e iekšējo nozīmi, ļoti pārsteidza zinātniekus! Kungs parādīja, ka septiņi tūkstoši sanskrita gramatikas pamata skaņu sasniedz sava izteiksmīguma augstāko punktu, kad tās tiek uztvertas kā Krišnam piemītošas enerģijas. Visi zinātnieki bija galēji pārsteigti, bet Kunga Gaurangas intriģējošie skaidrojumi burtiski savaldzināja viņu varenos prātus. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛṣṇa-dṛṣṭi-pāta-hetu-śabdakārtha-yojanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esphoṭa-vāda-śṛṅkhalaika-bhitti-kṛṣṇa-vīkṣaṇam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esthūla-sūkṣma-mūla-lakṣya-kṛṣṇa-saukhya-sambharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Gaurasundars pierādīja, ka Visaugstā saldā griba un Viņa svētīgais skatiens ir pirmcēlonis, kurš nosaka katru skaņu pavadošo nozīmi. Kunga griba ir pamatā esošais faktors, kurš nosaka skaņu kārtību un harmonizē skaņas un to nozīmes, nevis vadošo gramatikas pazinēju pasaulīgā piepūle. Ar tādiem viedajiem kā Panīnī priekšgalā, viņi cenšas sasaistīt skaņas ar vārdu nozīmi. Tas notiek tikai tādēļ, ka visa kustīgā un nekustīgā galējais mērķis ir sagādāt prieku Visaugstajam, tādējādi vairojot Viņa apburošās rotaļas. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprema-raṅga-pāṭha-bhaṅga-chāttra-kāku-kātaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echāttra-saṅga-hasta-tāla-kīrtanādya-sañcharam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-nāma-sīdhu-sindhu-magna-dik-charācharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePēc atgriešanās no Gajas, Kungs atsāka pasniegt saviem skolniekiem sanskritu. Tomēr, kad no tīrās mīlestības radušās jūtas sāka valdīt pār Viņu, Kungs nespēja turpināt nodarbības. Nīmajam tuvie skolnieki, zaudējuši iespēju mācīties pie Viņa, nopēla sevi par neveiksminiekiem. Sērojot viņi pazemīgi izteica uzslavas Viņa neatkārtojamajam talantam. Kaut arī Kungs skuma jūtot līdzi saviem skolniekiem, Viņš rīkojās kā viņu mūžīgais labvēlis, kad dziedot \u003ci\u003e“haraie namah krishna”\u003c/i\u003e sāka priekpilni slavēt Kungu Krišnu, un viņa skolnieki sāka vienotībā sist plaukstas. Sekojot viņiem, kustīgās un nekustīgās dzīvās radības visās desmit pasaules malās gremdējās dižā, saldā garīgas kalpošanas okeāna bangojošajos viļņos. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"14\"\u003e\n\u003ch5\u003e14\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eārya-dharma-pāla-labdha-dīkṣa-kṛṣṇa-kīrtanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elakṣa-lakṣa-bhakta-gīta-vādya-divya-nartanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edharma-karma-nāśa-dasyu-duṣṭa-duṣkṛtodharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Gaurasundars cienīja vēdiskos principus, Viņš pilnībā pieņēma sava garīgā skolotāja patvērumu; tas apzīmēja Svēto Vārdu kopīgās dziedāšanas kustības sākumu. Kungs bez apstājas dziedāja un dalīja visiem Kunga Krišnas Svētos Vārdus laimīgi dejojot tūkstošu bhaktu sabiedrībā. Viņš atbrīvoja dižākos dēmonus, tādus kā Džagajs un Madhajs, kā arī citus bezdievjus, kuri iznīcināja reliģijas principus un likumus, kas regulē sabiedrisko un garīgo kārtību. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"15\"\u003e\n\u003ch5\u003e15\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emlecha-rāja-nāma-bādha-bhakta-bhīti-bhañjanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elakṣa-lakṣa-dīpa-naiśa-koṭi-kaṇṭha-kīrtanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-mṛdaṅga-tāla-vādya-nṛtya-kāji-nistaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKādu dienu dižais pilsētas tiesnesis, musulmanis Čhands Kāzī, aizliedza bhahtām dziedāt Kunga Svētos Vārdus. Atbildot uz aizliegumu, Kungs Čaitanjadēvs kliedēja bhaktu bailes aiz sevis vezdams naksnīgu \u003ci\u003esankirtana\u003c/i\u003e gājienu ar degošām lāpām un gaismām. Tūkstošiem cilvēku pievienojās, un viņus ieskāva ekstāzes viļņi, kurus radījušas Kunga Gauranga Sundara deja un mridangu un karatālu saldā melodija, kas skanēja it visur. To redzot, ietekmīgais musulmanis attīrījās, un Kungs viņu apskāva kā savu bhaktu. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"16\"\u003e\n\u003ch5\u003e16\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003elakṣa-lochanāśru-varṣa-harṣa-keśa-kartanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekoṭi-kaṇṭha-kṛṣṇa-kīrtanāḍhya-daṇḍa-dhāraṇam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enyāsi-veśa-sarva-deśa-hā-hutāśa-kātaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLaikā, kad tika griezti nost Viņa brīnišķīgie mati, Viņš līksmoja, bet no tūkstošiem acu straumēm lija asaras. Tūkstošiem balsu slavēja Kungu Krišnu un Šrī Krišna Čaitanja pieņēma atsacīšanās \u003ci\u003edandu\u003c/i\u003e (\u003ci\u003esannjāsas\u003c/i\u003e nūju). Kopš tā laika lai kur Viņš ietu, visi, kas redzēja Viņu sannjāsī drānās, sērās raudāja. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"17\"\u003e\n\u003ch5\u003e17\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-yatīsa-bhakta-veśa-rāḍhadeśa-chāraṇaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-chaitanyākhya-kṛṣṇa-nāma-jīva-tāraṇam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhāva-vibhramātma-matta-dhāvamāna-bhū-dharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTikko apģērbis safrāna krāsas drānas, \u003ci\u003esannjāsī\u003c/i\u003e valdnieks Šrī Krišna Čaitanja apgāja visu Rietumbengāliju, ar savu lotosam līdzīgo pēdu pieskārieniem attīrot zemi. Pieņemot jauno vārdu “Šrī Krišna Čaitanja”, Kungs glāba dzīvās būtnes, dāvājot tām Krišnas Svētos Vārdus. Apskurbis dziļāko kalpošanas jūtu ekstātiskajos pārdzīvojumos, Viņš parādījās līdzīgi kustīgam zelta kalnam. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"18\"\u003e\n\u003ch5\u003e18\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-gadādharādi-nityānanda-saṅga-vardhanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eadvayākhya-bhakta-mukhya-vāñchitārtha-sādhanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṣetra-vāsa-sābhilāṣa-mātṛ-toṣa-tatparaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTurpinot sniegt visiem labklājību, Kunga Čaitanjas bhaktu loks papildinājās ar tādām dižām personībām kā Šrī Gadadhārs Pandits, Kungs Nitjānanda un citi. Kad Kungs Čaitanja iemiesojās uz Zemes, viņš tādējādi piepildīja diženākā \u003ci\u003emaha-bhagavata\u003c/i\u003e bhaktas Šrī Advaita Āčārjas vēlēšanos. Visaugstais piekrita dzīvot Džagannātha Purī tikai tādēļ, lai sagādātu prieku Savai mātei Šačidēvī. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"19\"\u003e\n\u003ch5\u003e19\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enyāsi-rāja-nīla-śaila-vāsa-sārvabhaumapaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edākṣiṇātya-tīrtha-jāta-bhakta-kalpa-pādapam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erāma-megha-rāga-bhakti-vṛṣṭi-śakti-sañcharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNonākot svētceļojumu vietā, svētajā Šrī Nīlačalū, Šrī Čaitanjadēvs, valdnieks to vidū, kuri atteikušies no visa pasaulīgā, glāba ietekmīgāko tā laika zinātnieku, kurš bija atzīts visā Indijā. Šrī Vasudēvs Sarvabhauma, visa Vedantas mācības un simboliskās loģikas pastāvēšanas laika izcilākais intelektuālis, tapa Kunga izglābts no Šankarāčārjas impersonālās teorijas muklāja. Pēc tam Kungs ceļoja pa Dienvidindiju, kur sastapa dažādu filosofisko mācību sekotājus. Lai kur Viņš būtu, Viņš piepildīja bhaktu gaidas vislabākajā veidā, jo Kungs bija līdzīgs vēlmju kokam. Godavārī upes krastos Kungs satika blīvam pašatdeves mākonim līdzīgo Šrī Rāmanandu Raju un uzdeva viņam liet pār apkārtējiem saldo \u003ci\u003erasas\u003c/i\u003e lietu, kurš rodas spontānās un bezgalīgās kalpošanas vietā, Vradžā. Šrī Rāmananda Rajs atbildēja uz žēlsirdīgā Kunga jautājumiem, kuri atver visu mācību būtību. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"20\"\u003e\n\u003ch5\u003e20\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprema-dhāma-divya-dīrgha-deha-deva-nanditaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehema-kañja-puñja-nindi-kānti-chandra-vanditam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma-gāna-nṛtya-navya-divya-bhāva-mandiraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Gaurangadēva dievišķais veidols bezgalīgi priecē debesu iemītniekus visā plašajā Visumā, jo Viņš ir apburošs tīras mīlestības iemiesojums. No Viņa ķermeņa nākošā mirdzošā gaisma aizēno miljons zelta lotosus, iekarojot tādas starojošas personības kā Čandradēva mīlestību. Šrī Gauranga ir visu garīgo rotaļu avots, jo Viņš ir mūžam svaigo un mainīgo \u003ci\u003esattvika-bhāva\u003c/i\u003e noskaņojumu iemiesojums. Šie noskaņojumi izpaužas Viņa prieka pilnajā kopīgajā Kunga Krišnas Svēto Vārdu slavas dziesmu dejā. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-dhvasta-sarvvabhauma-vada-navya-tarka-shiankaram\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"21\"\u003e\n\u003ch2\u003eŚrī Śrī Premadhāma-deva-stotram \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003ePirmdiena\u003c/h3\u003e\n\u003ch4\u003eŠrīla Bhakti Rakšak Šrīdhārs Dēv-Gosvāmī Mahārādža\u003c/h4\u003e\n\u003ch4\u003eSvāmī Bhakti Pavan Džanardana redakcija\u003c/h4\u003e\n\u003ch5\u003e21\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edhvasta-sārvabhauma-vāda-navya-tarka-śāṅkaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhvasta-tad-vivarta-vāda-dānavīya-ḍambaram\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edarśitārtha-sarva-śāstra-kṛṣṇa-bhakti-mandiraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDižais zinātnieks Sarvabhauma lika lietā visus spēkus cenšoties nostiprināt impersonālo Šankarāčārjas mācību, kura ir pretrunā ar slēdzieniem par tīru garīgu kalpošanu. Sarvabhauma izmantoja visviltīgākos vārdu žonglēšanas mākslas paņēmienus. Viņš kropļoja vārdu nozīmes, noraidot Kunga argumentus un apgalvojumus, un pat necentās pierādīt savu redzējumu, tajā pašā laikā mēģinot atrast vājās vietas Kunga argumentos. Tomēr Šrī Čaitanja, kura brīnišķīgais ķermenis bija tērpts jaunās, mirdzošās mūka drānās, balstoties uz Vēdiskajiem rakstiem un izvirzot secīgus argumentus, viegli atvairīja un satrieca zinātnieka ateistiskos skaidrojumus. Kungs pasludināja, ka Šankarāčārjas mācību praktizē augšupejošās izziņas metodes sekotāji, kuri kāro pēc ārišķīgas apbrīnas. Šādu reliģiju rada ateistisks intelekts un tā balstās bezdievībā. Kungs Gaurasundars noliedza neizpaustajam materiālās dabas aspektam piedēvēto nozīmi, kad pierādīja, ka augstākā realitāte ir Vēdās aprakstītā Dievkunga Personības garīgā daudzveidība.\u003cbr\u003e\nTam piemērs ir Kunga sniegtais Upanišādu vārsmas skaidrojums:\u003cbr\u003e\n\u003ci\u003eapāṇipādo javano grahitā\u003c/i\u003e\u003cbr /\u003e\u003ci\u003epaśyatyachakṣuḥ sa śṛṇotyakarṇaḥ\u003c/i\u003e\u003cbr\u003e\n“Kungam nav ne roku, ne kāju, tomēr Viņš var staigāt un pieskarties. Kungam nav ne acu, ne ausu, tomēr Viņš redz un dzird.”\u003cbr\u003e\nKungs Gaurasundars skaidroja arī dižākā no visiem pazīstamajiem rakstiem “Šrīmad-Bhāgavatam” \u003ci\u003eatmarāma\u003c/i\u003e vārsmu. Viņš parādīja, ka Vēdas, Purāni, Vēdanta un citi eksistējošie raksti ir līdzīgi diženam templim, kur mūžam tiek slavētas Visaugstā pārsteidzošās rotaļas, un tie apliecina, ka viss šajā pasaulē ir mūžīgās daudzveidības atspulgs, kurš ņem savu sākumu garīgajā pasaulē. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"22\"\u003e\n\u003ch5\u003e22\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛṣṇa-kṛṣṇa-kṛṣṇa-kṛṣṇa-kṛṣṇa-nāma-kīrtanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erāma-rāma-gāna-ramya-divya chanda-nartanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyatra-tatra-kṛṣṇa-nāma-dāna-loka-nistaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVelāk, vēloties glābt kritušas dvēseles, Visaugstais devās svētceļojumā pa Dienvidindijas svētajām vietām. Brīnišķīgā jaunā mūka tēlā Viņš dalīja Kunga saldos Vārdus dziedot: “Krišna Krišna Krišna Krišna Krišna Krišna Krišna he!” Sava svētceļojuma laikā Viņš apmeklēja tempļus un mājsaimnieku dzīves vietas. Neiedomājamas dievišķas iedvesmas apgarots, Kungs dziedāja “Rāma! Rāma!” un prieka pilns dejoja. Neatkarīgi no laika un cilvēku kvalifikācijas, Kungs glāba visus, kurus satika, iedvesmojot viņus dziedāt Krišnas Svētos Vārdus. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"23\"\u003e\n\u003ch5\u003e23\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egodavarya-vāma-tīra-rāmānanda-saṁvadaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejñāna-karma-mukta-marma-rāga-bhakti-sampadam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epārakīya-kānta-kṛṣṇa-bhāva-sevanākaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIzcilā saruna, kura norisinājās starp Kungu Gaurasundaru un Rāmanandu Raju, ir pazīstama kā “Rāmananda-samvada” un tā ir aprakstīta “Šrī Čaitanja-čaritamritā”. Viņu saruna parādīja, ka augstākais kalpošanas veids ir tīra mīlestība uz Dievu sirdī, kura brīva no savtīgām tieksmēm un aprēķina. Tāpat viņi secināja, ka Kungs Krišna, kurš parādījās kā Nanda Mahārādža dēls, ir vienīgais, kurš bauda \u003ci\u003eparakīja-rasā\u003c/i\u003e ietverto saldo garšu. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"24\"\u003e\n\u003ch5\u003e24\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edāsya-sakhya-vātsya-kānta-sevanottarottaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśreṣṭha-pārakīya-radhikāṅghri-bhakti-sundaram\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-vraja-sva-siddha-divya-kāma-kṛṣṇa-tatparaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Čaitanjadēvs parādīja, ka pastāv dažādi savstarpēju attiecību veidi ar Kungu Krišnu. Tie sākas ar kalpa stāvokli un attīstās pāraugot draudzībā un vecāku mīlestībā, sasniegdami savu apogeju laulāto attiecībās. Taču īstenais burvības un skaistuma iemiesojums slēpjas un gaida Nanda Mahārādža dēlu Vrindāvanas meža audzēs. Tā ir kalpošana Šrīmatī Rādharānī laulāto mīlestības noskaņojumā, kas pazīstama kā \u003ci\u003eparakīja\u003c/i\u003e. Šis garīgo attiecību veids ir iemiesots Šrī Gaurangadēvā. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"25\"\u003e\n\u003ch5\u003e25\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśānta-mukta-bhṛtya-tṛpta-mitra-matta-darśitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esnigdha-mugdha-śiṣṭa-miṣṭa-suṣṭha-kuṇṭha-harṣitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etantra-mukta-vāmya-rāga-sarva-sevanottaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs Gaurangadēvs skaidroja, ka no attāluma kalpojošais izjūt laimi, kuru sniedz brīvība no pasaulīgām ciešanām, savukārt kalpa lomā kalpojošais izgaršo apmierinājuma prieku. Kalpojošo drauga lomā pārpilda laime, kuru rada tuva pieķeršanās, kamēr kalpojošais vecāku noskaņojumā ir brīvs no jebkāda mājiena uz aprēķinu, tādējādi pārdzīvodams vēl dziļāku un jūsmīgāku pieķeršanos. Pēc tam Kungs Čaitanja atklāja, ka kalpojošais laulāto mīlestības līmenī, kura pazīstama kā \u003ci\u003esvakīja\u003c/i\u003e, bauda šo attiecību saldo garšu tikai daļēji, jo tajā mīt garīgās etiķetes ēna. Taču, kad laulāto attiecības iziet aiz rakstos ietverto ierobežojumu rāmjiem, parādās \u003ci\u003evāmjas\u003c/i\u003e noskaņojums – augstākā dievišķās laimes izpausme kalpošanā Kungam, kura piešķir (attiecībām) spontanitāti un brīvību. Šrī Gaurangadēvs darīja pieejamus šādus augstus ideālus. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-prēmas iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"26\"\u003e\n\u003ch5\u003e26\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eātma-navya-tattva-divya-rāya-bhāgya-darśitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśyāma-gopa-rādhikāpta-kokta-gupta-cheṣṭitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emūrchitāṅghri-rāmarāya-bodhitātma-kiṅkaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSavu mūžam svaigo Navadvīpas rotaļu būtību Šrī Čaitanja atklāja Rāmanandam Rajam, tam, kurš nav no šīs pasaules! Kungs Čaitanja atklāja sevi ganuzēna Šjāmasundara veidolā, tērptu Šri Radhas noskaņojumā un mirdzumā, un rotātu tīrā kalpošanā. Kad Ramananda Rajs uz mirkli ieraudzīja Kunga neatkārtojamo skaistumu, viņš nokrita bezsamaņā pie Kunga maigajām, lotosam līdzīgajām pēdām. Šri Gaurangadevs atgrieza sava bhaktas samaņu. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"27\"\u003e\n\u003ch5\u003e27\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enaṣṭa-kuṣṭha-kūrma-vipra-rūpa-bhakti-toṣaṇaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erāma-dāsa-vipra-moha-mukta-bhakta-poṣaṇam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekāla-kṛṣṇa-dāsa-mukta-bhaṭṭathāri-piñjaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKurmakšetrā, netālu no Džagannātha Purī, Kungs Gaurasundars apskāva \u003ci\u003ebrahmanu\u003c/i\u003e vārdā Vasudēvs, kuru bija pārņēmusi lepra. Pateicoties Kunga žēlastībai \u003ci\u003ebrahmans\u003c/i\u003e atveseļojās – viņš ieguva ķermeņa skaistumu un prāta apmierinājumu. Pēc tam Kungs Gauranga atbrīvoja dienvindindiešu \u003ci\u003ebrahmanu\u003c/i\u003e pazīstamu kā Rāmadāsa. Kungs viņu atbrīvoja no maldiem par to, ka dēmona pieskāriens atņēma Sītas Dēvī šķīstību. Par pierādījumu tam, ka Absolūtā Patiesība ir garīga un plešas aiz materiālās uztveres robežām, Kungs citēja “Kurma-purānu”. Tā, mācot tīru kalpošanu, Kungs rūpējās par saviem bhaktām. Malābaras provincē Visaugstais izglāba Kāla Krišna Dāsu no viltus mūku un netikumīgu klaidoņu kopienas biedriem, sauktiem par \u003ci\u003ebhattathārī\u003c/i\u003e. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"28\"\u003e\n\u003ch5\u003e28\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eraṅganātha-bhaṭṭa-bhakti-tuṣṭa-bhaṅgi-bhāṣaṇaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elakṣmya-gamya-kṛṣṇa-rāsa-gopikaika-poṣaṇam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elakṣmya-bhīṣṭa-kṛṣṇa-śīrṣa-sādhya-sādhanākaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKādu reizi Kungs viesojās Rangakšetrā, Kaverī upes krastos Dienvidindijā, galvenajā to vaišnavu lūgšanu vietā, kuri pielūdz Šrī Šrī Lakšmī-Narājanu un saskata Viņos augstāko kalpošanas objektu. Kad Kungs apciemoja Šrī Gopala Bhattas tēvu, Šrī Venkata Bhattu, Viņš bija pilnībā apmierināts ar viņa ģimenē valdošo kalpošanas noskaņojumu. Kungs viltīgi pasmaidīja un paskaidroja viņiem, ka, pat pēc ilgstošām askēzēm, Šrī Lakšmīdēvī nevar ieiet Kunga Krišnas \u003ci\u003erasa-līlā\u003c/i\u003e, jo vienīgi ganumeitenes gopijas var būt par šo rotaļu cēloni. Tādēļ ganuzēns Krišna ir Lakšmīdēvī sirdi vilinošais Kunga Narājanas formas pirmavots, Augstākā Patiesība un visu garīgo kalpošanas prakšu galvenais mērķis. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"29\"\u003e\n\u003ch5\u003e29\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebrahma-saṁhitākhya-kṛṣṇa-bhakti-śāstra-dāyakaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-karṇa-sīdhu-nāma-kṛṣṇa-kāvya-gāyakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-pratāparudra-rāja-śīrṣa-sevya-mandiraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCeļojot pa Dienvidindiju, Kungs uzgāja sen nozaudēto darbu “Šrī Brahma-samhitu”, kurš bija pilns ar secinājumiem par garīgu kalpošanu Dievam, un stādīja to saviem bhaktām priekšā. Pārpildīts ar dziļām, ekstātiskām tīras garīgas kalpošanas jūtām, Kungs saldi dziedāja apburošas izcilā Dienvidindijas dzejnieka Šrī Bilvamangala Thākura darba “Šrī Krišna-karnamrita” vārsmas, kuras veltītas brīnišķīgo Vradžas rotaļu slavēšanai. Kunga Čaitanjas maigās pēdas skāra dižā, pašatdeves piepildītā,  valdnieka Pratāparudras galvu. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"30\"\u003e\n\u003ch5\u003e30\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-rathāgra-bhakta-gīta-divya-nartanādbhutaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyātri-pātra-mitra-rudrarāja-hṛchamatkṛtam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eguṇḍichāgamādi-tattva-rūpa-kāvya-sañcharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNeskaitāmu, Kunga Svēto Vārdu kopīgā dziedāšanā vienojušos bhaktu ieskauts, Kungs Gaurangasundars izpildīja savu dievišķi skaisto deju Ratha-jātras pajūga priekšā. Kunga personība visaptveroši aizrāva Mahārādža Pratāparudras, visu klātesošo svētceļnieku un citu valdnieka tuvo draugu, sirdis. Kungs atklāja Kunga Džagannātha ratos veiktā ceļojuma uz Gundiča templi iekšējo nozīmi citējot Šrīlas Rūpas Gosvāmī vārsmu:\u003cbr\u003e\n\u003ci\u003epriyaḥ so ’yam kṛṣṇaḥ saha-chari kuru-kṣetra-militas\u003c/i\u003e\u003cbr /\u003e\u003ci\u003etathāhaṁ sā rādhā tad idam ubhayoḥ saṅgama sukham\u003c/i\u003e\u003cbr /\u003e\u003ci\u003etathāpy antaḥ-khelan-madhura-muralī-pañchama-juṣe\u003c/i\u003e\u003cbr /\u003e\u003ci\u003emano me kālindī-pulina-vipināya spṛhayati\u003c/i\u003e\u003cbr\u003e\n“Mana dārgā draudzene, šeit Kurukšetrā, es beidzot atkal satiku savu mīļoto Krišnu! Es – tā pati Rādharānī, un Viņš – Tas pats Krišna! Mūsu satikšanās ir prieka pilna, taču es vēlos atgriezties Kālindī krastos. Tur, zem Vrindāvanas meža kokiem, es varētu klausīties Viņa piekto noti spēlējošās flautas saldo melodiju!” Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-prema-mugdha-rudra-raja-shiaurya-virya-vikramam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"31\"\u003e\n\u003ch2\u003eŚrī Śrī Premadhāma-deva-stotram \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eOtrdiena\u003c/h3\u003e\n\u003ch4\u003eŠrīla Bhakti Rakšak Šrīdhārs Dēv-Gosvāmī Mahārādža\u003c/h4\u003e\n\u003ch4\u003eSvāmī Bhakti Pavan Džanardana redakcija\u003c/h4\u003e\n\u003ch5\u003e31\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprema-mugdha-rudra-rāja-śaurya-vīrya-vikramaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprārthitāṅghri-varjitānya-sarva-dharma-saṅgamam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eluṇṭhita-pratāpa-śīrṣa-pāda-dhūli-dhūsaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKad Ziemeļindija atradās musulmaņu varā, Orissas neatkarīgās valsts dižais valdnieks Prataparūdra, bija pārsteigts un pilnībā pārņemts ar tīro mīlestību uz Dievu, kura caurstrāvoja drošsirdīgo un augstsirdīgo Kungu Čaitanju. Viņš atraidīja visus savus iepriekšējos sakarus ar reliģiskām tradīcijām un savu kareivīgo valdnieka dabu un, pārpildīts ar pašaizliedzību, metās pie Šrī Čaitanjadēva lotosam līdzīgajām pēdām. Tad žēlsirdīgais Kungs apklāja sevi Kunga pilnībā veltījušā karaļa galvu ar svētajiem putekļiem no savām maigajām, lotosu pēdām. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"32\"\u003e\n\u003ch5\u003e32\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edākṣiṇātya-suprasiddha-paṇḍitaugha-pūjitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśreṣṭha-rāja-rājapātra-śīrṣa-bhakti-bhūṣitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edeśa-mātṛ-śeṣa-darśanārthi-gauḍa-gocharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVisaugsto godāja pazīstamu Dienvidindijas zinātnieku aprindās. Diženākie valdnieki un viņu ministri uzlūkoja Kungu ar dziļu ticību un izrādīja Viņam visu savu cieņu. Saskaņā ar standartiem, pieņemtiem mācekļu pēctecībā, Kungs atnāca uz Rietumbengāliju, lai redzētu svēto Gangu. It kā tā būtu pēdējā reize, Viņš apciemoja savas dzimšanas vietu un atnāca satikt māti Šačīdēvī. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"33\"\u003e\n\u003ch5\u003e33\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaura-garvi-sarva-gauḍa-gauravārtha-sajjitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśāstra-śastra-dakṣa-duṣṭa-nāstikādi-lajjitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emuhyamāna-mātṛkādi-deha-jīva-sañcharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKunga ceļojuma laikā Viņa slava pārpludināja visu Bengāliju! Tādēļ, kad pēc pieciem gadiem pēc \u003ci\u003esannjāsas\u003c/i\u003e pieņemšanas Viņš atgriezās Navadvīpā, bengālieši, lepni par Kungu Gaurangu, apgarotībā viņu slavēja! Kad augstprātīgie zinātnieki-bezdievji kļuva par lieciniekiem tam, kā vienkāršie cilvēki no visiem sabiedrības slāņiem izrādīja tik nesatricināmu ticību Kungam, viņi izjuta kaunu par savu zemo dabu. Kad māte Šačī un citi Viņa ģimenes locekļi, kuri dzisa atšķirtībā no Kunga, atkal ieraudzīja Šrī Čaitanjadēvu, viņos atgriezās dzīvība. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"34\"\u003e\n\u003ch5\u003e34\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enyāsa-pañcha-varṣa-pūrṇa-janma-bhūmi-darśanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekoṭi-koṭi-loka-lubdha-mugdha-dṛṣṭi-karṣaṇam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekoṭi-kaṇṭha-kṛṣṇa-nāma-ghoṣa-bheditāmbaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAtgriežoties savā dzimtajā vietā pēc pieciem gariem \u003ci\u003esannjāsas\u003c/i\u003e gadiem, Visaugsto sagaidīja tūkstoši jaunu un vecu ļaužu. Viņu acis kāroja redzēt Kungu, kurš bija aizskāris pašus viņu sirds dziļumus. Kunga klātbūtne iedvesmoja cilvēkus nemitīgi slavēt Kunga Harī Vārdus, un no tā radies dārdošais troksnis izplatījās visos virzienos tālu aiz debesu robežām. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"35\"\u003e\n\u003ch5\u003e35\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eārta-bhakta-śoka-śānti-tāpi-pāpi-pāvanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elakṣa-koṭi-loka-saṅga-kṛṣṇa-dhāma-dhāvanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erāma-keli-sāgrajāta-rūpa-karṣaṇādaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Gaurangadēvs atviegloja nemieru, kuru bhaktas izjuta ilgajā atšķirtībā no Viņa, un piedeva daudziem nemiera plosītiem grēciniekiem un apvainotājiem, tādiem kā Gopalam Čapalam un citiem. Pēc tam, pa Gangas krastu, Kungs devās uz Vrindāvanu. Milzīgi ļaužu pūļi sekoja Viņam līdz Bengālijas galvaspilsētai, tobrīd zināmai kā Rāmakēlī. Rāmakēlī Kungu piesaistīja divi Viņa mūžīgie pavadoņi, kuri tajā laikā bija ministri musulmaņu valdībā. Bija manāms, ka Kungs izjūt dziļu maigumu un mīlestību pret Šrī Rūpu Gosvāmī un viņa vecāko brāli Šrī Sanātanu Gosvāmī. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"36\"\u003e\n\u003ch5\u003e36\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evyāghra-vāraṇaina-vanya-jantu-kṛṣṇa-gāyakaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-nṛtya-bhāva-matta-jhāḍakhaṇḍa-nāyakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edurga-vanya-mārga-bhaṭṭa-mātra-saṅga-saukaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePēc Rāmakēlī Kungs turpināja ceļu uz Džagannātha Purī. Atstājot Purī Dhāmu, Kungs šķērsoja Džhadakhanda mežu, kurš atradās ceļā uz Vrindāvanu. Tur Viņš iedvesmoja tādus meža zvērus kā tīģerus, briežus un ziloņus kopīgai Kunga Krišnas Svēto Vārdu dziedāšanai. Apskurbuši no saldajiem Dieva Vārdiem, zvēri sajūsmā kopīgi dejoja Dievam, kurš pats bija dziļākās kalpošanas ekstāzes pārņemts! Visaugstais piedzīvoja dziļas atklāsmes, kad kopā ar Balabhadru Bhattāčārju brida cauri neizejamām Džhadakhanda meža takām. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"37\"\u003e\n\u003ch5\u003e37\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egāṅga-yāmunādi-bindu-mādhavādi-mānanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emāthurārta-chitta-yāmunāgra-bhāga-dhāvanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esmārita-vrajāti-tīvra-vipralambha-kātaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs Gaurasundars izrādīja lielu cieņu Dievībām Gangas krastā, Kāšī un Bindu Mādhavā, Gangas un Jamūnas sateces vietā Prajagā. Sekojot Jamūnas straumei, Kungs skrēja gar krastu, saviļņojumā tiecoties pretī svētās vietas, kura pazīstama kā Mathura, mirdzumam. Kad dievišķās domas par Vrindāvanas notikumiem pārņēma Viņa atmiņu, izsaucot neciešamas atšķirtības jūtas, Kungs Gaurasundars zaudēja samaņu. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"38\"\u003e\n\u003ch5\u003e38\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emādhavendra-vipralambha-māthureṣṭa-mānanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-dṛṣṭakāma-pūrva-kuñja-kānanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egokulādi-goṣṭha-gopa-gopikā-priyaṅkaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs Čaitanja paziņoja, ka dziļais atšķirtības noskaņojums, kuru spēja piedzīvot Mādhavendra Purī, ir tīras Dieva pielūgsmes augstākā robeža un vēlamais mērķis. Tas aprakstīts sekojošā brīnišķīgā vārsmā, kuru pirmo reizi izteica Šrīmatī Rādharānī:\u003cbr\u003e\n\u003ci\u003eayi dīna-dayārdra nātha he\u003c/i\u003e\u003cbr /\u003e\u003ci\u003emathurā-nātha kadāvalokyase\u003c/i\u003e\u003cbr /\u003e\u003ci\u003ehṛdayaṁ tvad-aloka-kātaraṁ\u003c/i\u003e\u003cbr /\u003e\u003ci\u003edayita bhrāmyati kiṁ karomy aham\u003c/i\u003e\u003cbr\u003e\n“Mans Kungs! Visžēlsirdīgākais Valdniek! Mathuras pavēlniek! Kad gan es atkal redzēšu Tevi? Atšķirtībā mana saviļņotā sirds sitas nevienmērīgi! Mīļotais, ko man tagad darīt?” Pēc tam, kad Kungs bija ienācis Vradžā, kur norisinājās Viņa tīrās mīlestības rotaļas, Viņš sajuta sirdi pārpildāmies ar sajūsmu. Kungu savaldzināja brīnišķīgie dārzi un audzes, kuras kalpojušas par Viņa garīgo rotaļu vietu iepriekšējā laikmetā. Ceļojot pa divpadsmit Vrindāvanas mežiem, Kungs izpauda visu Savu attiecību daudzveidību ar ganu zēniem un meitenēm. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"39\"\u003e\n\u003ch5\u003e39\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprema-guñjanāli-puñja-puṣpa-puñja-rañjitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egīta-nṛtya-dakṣa-pakṣi-vṛkṣa-lakṣa-vanditam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ego-vṛṣādi-nāda-dīpta-pūrva-moda-meduraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePastaigājoties pa Vrindāvanu, Kungu priekpilni sveicināja dūcošas kamenes, kuras apļoja virs izplaukušiem ziediem un sarunājās par tīru mīlestību. Koku miljoni draudzīgi izrādīja savu cieņu Kungam, un tiem pievienojās daudzums sajūsmas pilnu putnu, kuri prasmīgi dziedāja un dejoja. Kungu pārpildīja tīras mīlestības jūtas un pārdzīvojumi, kad Viņš atcerējās, kā iepriekšējās rotaļās Viņu maigi sauca svētās Vrindāvanas govis, telēni un buļļi. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"40\"\u003e\n\u003ch5\u003e40\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprema-buddha-ruddha-buddhi-matta-nṛtya-kīrtanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eplāvitāśru-kāñchanāṅga-vāsa-chāturaṅganam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-kṛṣṇa-rāva-bhāva-hāsya-lāsya-bhāsvaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTīras mīlestības viļņa pilnīgi satriekts, Kungs Gaurasundars ekstāzē dejoja un dziedāja Krišnas Svētos Vārdus! Bagātīgas asaru straumes lija no Viņa brīnišķīgajām acīm pāri milzīgajam, zeltītajam, starojošajam ķermenim, pāri Viņa mirdzošajam apģērbam, kurš atgādināja sauli, un tālāk pa zemi, izplūstot visos četros virzienos! Kunga rotaļu prieks ekstātiski pieauga! Neprāta stāvoklī Kungs nepareizi izrunāja Krišnas Svētos Vārdus un smejoties kauca, iegrimis dziļo pārdzīvojumu sajūsmā. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-prema-mugdha-nritya-kirtanakularitantikam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"41\"\u003e\n\u003ch2\u003eŚrī Śrī Premadhāma-deva-stotram \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eTrešdiena\u003c/h3\u003e\n\u003ch4\u003eŠrīla Bhakti Rakšak Šrīdhārs Dēv-Gosvāmī Mahārādža\u003c/h4\u003e\n\u003ch4\u003eSvāmī Bhakti Pavan Džanardana redakcija\u003c/h4\u003e\n\u003ch5\u003e41\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprema-mugdha-nṛtya-kīrtanākulāriṭāntikaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esnāna-dhanya-vāri-dhānya-bhūmi-kuṇḍa-deśakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-kuṇḍa-rādhikākhya-śāstra-vandanādaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAr tīras mīlestības sajauktu prātu Kungs Gaurasundars, saviļņojumā un ekstāzē dejojot, pietuvojās svētajai Rādha-\u003ci\u003ekundas\u003c/i\u003e vietai, kurā tolaik vēl bija apslēpta. Kungs nekavējoties pieņēma apmazgāšanos šajā applūdušajā rīsa laukā, svētot šos ūdeņus, un paziņoja, ka šī ir Rādha-\u003ci\u003ekunda\u003c/i\u003e. Dziļā pazemībā Kungs uzmanīgi citēja vārsmas no rakstiem, kurās Rādha-\u003ci\u003ekunda\u003c/i\u003e tiek aprakstīta kā dievišķs tīras mīlestības iemiesojums.\u003cbr\u003e\n\u003ci\u003eyathā rādhā priyā viṣṇos\u003c/i\u003e\u003cbr /\u003e\u003ci\u003etasyāḥ kuṇḍaṁ priyaṁ tathā\u003c/i\u003e\u003cbr /\u003e\u003ci\u003esarva gopīṣu saivaikā\u003c/i\u003e\u003cbr /\u003e\u003ci\u003eviṣṇor-atyanta vallabhā\u003c/i\u003e\u003cbr\u003e\n“Šrī Rādha ir ļoti dārga Šrī Krišnam, tāpat Viņam dārgs ir arī Viņas dievišķais dīķis, Šrī Rādha-\u003ci\u003ekunda\u003c/i\u003e. No visām ganumeitenēm Viņa ir Kunga Krišnas visdārgākā pavadone.” Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"42\"\u003e\n\u003ch5\u003e42\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etintiḍī-talastha-yāmunormi-bhāvanāplutaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enirjanaika-rādhikātma-bhāva-vaibhavāvṛtam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśyāma-rādhikāpta-gaura-tattva-bhittikākaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eApmeklējot dažādas vietas Vrindāvanā, kur Šrī Krišna baudīja savas rotaļas, Kungs ieraudzīja slaveno tamarinda koku, kurš šajā vietā stāvējis jau kopš \u003ci\u003eDvapara-jugas\u003c/i\u003e. Kad Kungs sēdēja zem koka, skats uz Jamūnas dejojošajiem viļņiem atmodināja Viņā atmiņas par Viņa un ganumeiteņu slepenajām rotaļām ūdenī. Savas sirds dziļumos Kungs bija pilnībā pārņemts ar saldo Šrī Rādhas noskaņojuma garšu. Kungs juta, ka pats Viņš arī ir šis saldums! Šis pārdzīvojums valdīja pār Viņu, un pati dzīve slīdēja no Viņa prom. Uz šo vietu norāda kā uz Gaura-\u003ci\u003etattvas\u003c/i\u003e norises vietu, jo tieši šeit Kungs Šjāmasundars iegrima dievišķajā Šrīmatī Rādharānī noskaņojumā. Šajā vietā mūžam mīt Šrī Čaitanja Mahāprabhu, kurš pats ir visa avots! Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"43\"\u003e\n\u003ch5\u003e43\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśārikā-śukokti-kautukāḍhya-lāsya-lāpitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhikā-vyatīta-kāmadeva-kāma-mohitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-vaśya-kṛṣṇa-bhāva-bhakta-hṛch-chamatkaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs Gauranga minēja sarunu, kura norisinājās starp papagaili un viņa draudzeni. Sarunā aprakstīts, kā Kungs Krišna, transcendentālais Kupidons, nokļuva ilūzijas ietekmē dziļo atšķirtības jūtu dēļ no Šrī Rādhas.\u003cbr\u003e\n\u003ci\u003erādhā-saṅge yadā bhāti\u003c/i\u003e\u003cbr /\u003e\u003ci\u003etadā ‘madana-mohanaḥ’\u003c/i\u003e\u003cbr /\u003e\u003ci\u003eayathā viśva-moho ’pi\u003c/i\u003e\u003cbr /\u003e\u003ci\u003esvayaṁ ‘madana-mohitaḥ’\u003c/i\u003e\u003cbr\u003e\nPapagaiļa draudzene teica: “Kad Kungs Krišna atrodas blakus Rādharānī, pats Kupidons tiek apburts! Taču, kad Viņš ir viens, mīlas pārdzīvojumi nobur Viņu pašu, neskatoties uz to, ka Viņš ir tas, kurš apbur visu Visumu.” Tā Kungs Gauranga apbūra bhaktu sirdis parādot, ka Šrī Krišnas valdzinājums un saldums, nešaubīgi, slēpjas tajā, ka Viņu var iekarot ar tīru mīlestību. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"44\"\u003e\n\u003ch5\u003e44\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-prayāga-dhāma-rūpa-rāga-bhakti-sañcharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-sanātanādi-kāśi-bhakti-śikṣaṇādaram\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaiṣṇavānurodha-bheda-nirviśeṣa-pañjaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSvētās Prajagas apmazgāšanās vietā, kas pazīstama kā Dašašvamedha-ghāta, Kungs Gauranga mācīja Šrīlu Rūpu Gosvāmī, ka augstākais kalpošanas prakses mērķis ir izgaršot Šrī Vrindāvanas saldumu. Kungs uzdeva viņam šo saldo garšu plaši jo plaši sludināt. Pēc tam, Kašī, Kungs smalki skaidroja Šrīlam Sanātanam Gosvāmī daudzus ar tīru pašatdevi saistītus jautājumus, tādus kā zināšanas par pareizu apkārtējās pasaules uztveri, šo zināšanu pielietošanas veidus un mīlestības uz Dievu sasniegšanas augstāko mērķi. Tāpat, pēc Mahāraštras \u003ci\u003ebrahmana\u003c/i\u003e, Tapana Mišras un citu bhaktu īpaša lūguma, Kungs satrieca tumsonīgos \u003ci\u003emajavādī\u003c/i\u003e mācības sekotājus Varanasī. Tur Kungs Gauranga publiskā sapulcē personīgi tikās ar impersonālistiem un norādīja, ka viņu praktizētā sevis pielūgsme galu galā balstās skaudībā un aprobežotā uztverē. Tā Kungs pamatoja, ka patiesa neatkarība piemīt vienīgi tiem, kas pielūdz Dieva Augstāko Personību. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"45\"\u003e\n\u003ch5\u003e45\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enyāsi-lakṣa-nāyaka-prakāśānanda-tārakaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enyāsi-rāśi-kāśi-vāsi-kṛṣṇa-nāma-pārakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evyāsa-nāradādi-datta-vedadhī-dhurandharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePrajagā, pa ceļam no Vrindāvanas uz Džagannātha Purī, Kungs tikās ar Šrī Rūpu Gosvāmī un sniedza viņam savas mācības. Pēc tam Kungs Gauranga nonāca Varanasī, kur tikās ar Prakašānandu Sarasvatī, kurš bija miljonu impersonālistu – Šanakarāčārjas sekotāju, līderis. Mīlestības pilnā Kunga Gaurangas sabiedrība izglāba Prakašānandu Sarasvatī no dziļās Šankarāčārjas pārveidošanās teorijas bedres. Kunga sabiedrība savaldzināja \u003ci\u003esannjāsī\u003c/i\u003e un Kašī iedzīvotājus un iesaistīja viņus Kunga Krišnas Svēto Vārdu slavēšanā. Šrī Čaitanjadēvs bija neparasts pārvedējs, kurš padarīja par iespējamu materiālās pasaules aizas šķērsošanu. Viņš līdzinājās kuģim, kurš sevī nes visu Svēto Rakstu slēdzienu nektāru, kas nodots mācekļu pēctecības ietvaros no viedā Nāradas Šrīlam Vjāsadēvam. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"46\"\u003e\n\u003ch5\u003e46\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebrahma-sūtra-bhāṣya-kṛṣṇa-nāradopadeśakaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśloka-turya-bhāṣaṇānta-kṛṣṇa-samprakāśakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśabda-vartanānta-hetu-nāma-jīva-nistaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKamēr Kungs Čaitanja bija Kašī, milzīgā no pasaulīgā dzīvesveida atsacījušos impersonālistu sapulcē Viņš mācīja, ka “Šrīmad-Bhāgavatam”, kā tas tiek nodots mācekļu pēctecībā, kas sākusies ar Kungu Krišnu, Nāradu un turpinājusies līdz Šrīlam Vjāsadēvam, ir uz faktiem balstīts Vēdanta-sūtru slēdzienu komentārs. Tāpat Šrī Gauranga izskaidroja četras fundamentālās “Šrīmad-Bhāgavatam” vārsmas un pasludināja, ka Kungs Krišna ir Visuma kārtības sākotnējais likums un Augstākā Realitāte, kas mīt taipus duālajam. Kungs Čaitanja pasludināja, ka, saskaņā ar vēdisko aforismu \u003ci\u003e“anāvṛttiḥ śabdāt anāvṛttiḥ śabdāt”\u003c/i\u003e, ar apziņu apveltīta skaņa savā augstākajā izpausmē ir Kunga Krišnas Svētais Vārds, kas ir spējīgs dāvāt lielāko labumu un atbrīvot dvēseli no esības nebrīvā stāvokļa. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"47\"\u003e\n\u003ch5\u003e47\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eātma-rāma-vāchanādi-nirviśeṣa-khaṇḍanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrauta-vākya-sārthakaika-chidvilāsa-maṇḍanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edivya-kṛṣṇa-vigrahādi-gauṇa-buddhi-dhikkaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSniedzot sešdesmit vienu skaidrojumu pazīstamajai ātmarāma vārsmai no “Šrīmad-Bhāgavatam”, Kungs Gauranga pilnībā satrieca impersonālistu mācību, kuru izplatīja Šankarāčārja. Citējot daudzas vārsmas no Upanišādām, tādas kā \u003ci\u003e“apāṇi-pādo javano grahītā paśyaty acakṣuḥ sa śṛnoty akarṇaḥ”\u003c/i\u003e, Kungs atklāja Absolūtās Patiesības garīgo rotaļu valdzinoši saldo dabu. Kungs Čaitanja atzina par naidīgiem impersonālistu priekšstatus par to, ka Kunga Krišnas transcendentālais veidols, vārds, īpašības un rotaļas, kā arī Viņa izpausme Dievību formā, ir tikai \u003ci\u003emajas\u003c/i\u003e iluzorās enerģijas iedomāta pārvērtība. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"48\"\u003e\n\u003ch5\u003e48\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebrahma-pāramātmya-lakṣaṇādvayaika-vāchanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-vraja-svasiddha-nanda-līla-nanda-nandanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-rasa-svarūpa-rāsa-līla-gopa-sundaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAtsaucoties uz vārsmu \u003ci\u003e“brahmeti paramātmeti bhagavān iti śabdyate”\u003c/i\u003e no “Šrīmad-Bhāgavatam”, Kungs Gauranga harmonizēja priekšstatu par esības viendabīgo aspektu – Brahmanu (kas ir impersonālistu galējais mērķis), un priekšstatu par esības aspektu, kurš caurvij visu – \u003ci\u003eParamātmu\u003c/i\u003e (kas ir pie pilnības tiecošos mistiķu galējais mērķis). Kungs kliedēja pretrunas šo abu patiesību vidū parādot, ka tās ir daļa no par tām abām pārākā, no dualitātes brīvā Absolūtās Patiesības koncepta – \u003ci\u003eBhagavāna\u003c/i\u003e, pirmatnējā esības principa. Sludinot šo patiesību par Visaugstā garīgo rotaļu prieku dāvājošo slepeno dabu, Kungs Gauranga norādīja uz Vrādžas, kas atrodas virs Vaikunthas planētām, dievišķo dabu.\u003cbr\u003e\n\u003ci\u003evaikuṇṭhāj janito varā madhu-purī tatrāpi rāsotsavād\u003c/i\u003e\u003cbr /\u003e\u003ci\u003evṛndāraṇyam udāra-pāṇi-ramaṇāt tatrāpi govardhanaḥ\u003c/i\u003e\u003cbr /\u003e\u003ci\u003erādhā-kuṇḍam ihāpi gokula-pateḥ premāmṛtāplāvanāt\u003c/i\u003e\u003cbr /\u003e\u003ci\u003euryād asya virājato giri-taṭe sevāṁ vivekī na kaḥ\u003c/i\u003e\u003cbr\u003e\n“Augstāk par garīgo karaļvalsti Vaikunthu atrodas Mathura – Krišnas sākotnējā atnākšanas vieta. Augstāk par Mathuru – Vrindāvanas mežs, kur Krišna baudīja \u003ci\u003erāsas\u003c/i\u003e deju. Par to pārāks ir Govardhana kalns, kurš bija vēl slepenāku dievišķo rotaļu norises vieta. Bet Rādha-\u003ci\u003ekunda\u003c/i\u003e, kas atrodas Govardhana kalna pakājē, aizņem augstāko vietu, jo tā ir augstākās kārtas dievišķās mīlestības nektāra pārpildīta. Kurš gan netieksies pēc dievišķās kalpošanas Šrīmatī Rādharānī pie Rādha-\u003ci\u003ekundas\u003c/i\u003e zinot par šo kalpošanas zinātni?” Sākumā Kungs Gauranga atklāja tīras, mīlošas garīgas kalpošanas dabu, kurā vecāku mīlestības noskaņojumā tiek kalpots Mahārādža Nandas dēlam. Taču pēc tam, iedziļinoties garīgas pašatdeves saldajās garšās, Kungs Gauranga skaidroja, ka augstākais Visaugstā personības aspekts ir Šrī Gopīdžanavallabha, kura dievišķais tēls ir bezgalīgs un satur sevī visas primārās un sekundārās tīrā kalpošanā izjūtamās garšas. Tāpat Šrī Gauranga lika noprast, ka priecējošās un valdzinošās \u003ci\u003erāsa-līlas\u003c/i\u003e rotaļas ir pati visu apzinošā realitāte, kas nav nekas cits kā Šrīmatī Rādharānī personīgā enerģija. Tādas transcendentālas rotaļas tiek spēlētas pārākajā par visu iedomājamo, neaptveramajā garīgajā pasaulē, un ir garīgās esības, labvēlības un skaistuma augstākā ideja. Kungs Gauranga uzvedināja uz domu, ka tas ir augstākais visu dzīvo būtņu tiekšanās objekts! Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"49\"\u003e\n\u003ch5\u003e49\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erādhikā-vinoda-mātra-tattva-lakṣaṇānvayaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esādhu-saṅga-kṛṣṇa-nāma-sādhanaika-niśchayam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-sevanaika-mātra-sādhya-kṛṣṇa-tatparaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTā Kungs Gauranga mācīja, ka visu rakstos ietverto slēdzienu, kurus dažādi gudrie ar skaņas palīdzību pilnīgā veidā nodeva tālāk, augstākā izpausme ir iemiesota Šrī Rādhavinodā, kurš ietver sevī pareizu apkārtējās pasaules uztveri. Veids, ar kura palīdzību var sasniegt Kungu Krišnu, ir Viņa Svēto Vārdu dziedāšana tīru bhaktu sabiedrībā, tajā pašā laikā augstākais tīras mīlestības mērķis ir kalpošana Kungam Krišnam, kurš ir tik ļoti dārgs Vrindāvanas ganumeitenēm. Kungs Gaurangadēvs mācīja šos svarīgākos garīgos slēdzienus sanākušajiem zinātniekiem. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"50\"\u003e\n\u003ch5\u003e50\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eātma-rāma-vāchanaika-ṣaṣṭikārtha-darśitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erudra-saṁkhya-śabda-jāta-yad-yad-artha-sambhṛtam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esarva-sarva-yukta-tat-tad-artha-bhuridākaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs Gaurasundars sešdesmit vienā veidā skaidroja Šrīlam Sanātanam Gosvāmī un pēc tam arī Prakašānandam Sarasvatī slaveno “Šrimad-Bhāgavatam” vārsmu:\u003cbr\u003e\n\u003ci\u003eātmārāmaś cha munayo\u003c/i\u003e\u003cbr /\u003e\u003ci\u003enirgranthā apy urukrame\u003c/i\u003e\u003cbr /\u003e\u003ci\u003ekurvanty ahaitukīṁ bhaktim\u003c/i\u003e\u003cbr /\u003e\u003ci\u003eitthaṁ-bhūta guṇo hariḥ\u003c/i\u003e\u003cbr\u003e\n“Pat atbrīvotās dvēseles, kuras smeļ pilnīgu apmierinātību sevī, izjūt nepārvaramu tiekšanos pie pārākajā veidā izcilajām Krišnas īpašībām un velta sevi pilnībā Viņam vienam.” Kungs atsevišķi izskatīja katru no vienpadsmit vārsmas vārdiem un atklāja, ka katrs no tiem ir milzīga neierobežotu dārgumu glabātuve un katrs no tiem apstiprina slēdzienus par tīru \u003ci\u003ebhakti\u003c/i\u003e. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-sanatananu-rupa-jiva-sampradayakam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"51\"\u003e\n\u003ch2\u003eŚrī Śrī Premadhāma-deva-stotram \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eCeturtdiena\u003c/h3\u003e\n\u003ch4\u003eŠrīla Bhakti Rakšak Šrīdhārs Dēv-Gosvāmī Mahārādža\u003c/h4\u003e\n\u003ch4\u003eSvāmī Bhakti Pavan Džanardana redakcija\u003c/h4\u003e\n\u003ch5\u003e51\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī sanātanānu-rūpa-jīva-sampradāyakaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elupta-tīrtha-śuddha-bhakti-śāstra-suprachārakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enīla-śaila-nātha-pīṭha-naija-kārya-saukaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIedvesmodams Šrīlu Sanātanu Gosvāmī, viņa jaunāko brāli Šrīlu Rūpu Gosvāmī un Šrīlu Džīvu Gosvāmī, Kungs Gaurasundars dibināja savu mācekļu pēctecību. Kungs vēlēja viņiem atklāt aizmirstas svētceļojumu vietas un sarakstīt grāmatas par tīru garīgu kalpošanu, kuras aprakstītu garīgu prakšu un spontānas mīlestības pielietojuma metodes. Tāpat Kungs Gauranga ar mīlestību parādīja savu dievišķo
