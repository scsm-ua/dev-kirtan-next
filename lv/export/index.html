 personību Šrī Džagannāthadēva kalpotājiem Nīlačalā (Šrī Purī Dhamā). Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"52\"\u003e\n\u003ch5\u003e52\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etyāga-bāhya-bhoga-buddhi-tīvra-daṇḍa-nindanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erāya-śuddha-kṛṣṇa-kāma-sevanābhi-nandanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erāya-rāga-sevanokta-bhāgya-koṭi-duṣkaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs Gaurasundars stingri nosodīja tos, kuri tērpās \u003ci\u003esannjāsī\u003c/i\u003e drānās, taču tajā pašā laikā līdzīgi pērtiķiem sirds dziļumos loloja vēlmes pēc jutekliskām baudām. Tajā pašā laikā Viņš izrādīja cieņu tādam dižam bhaktam kā Rāmanānda Rajam par viņa centību kalpošanā, Kunga Džagannātha priekam mācot jaunām meitenēm dramatiskās dejas. Uzskatot, ka Rāmanāndas kalpošana atrodas spontānās kalpošanas līmenī, Kungs pasludināja, ka tāds kalpošanas līmenis ir milzu veiksme, iegūstama tikai pēc miljoniem dzīvju. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"53\"\u003e\n\u003ch5\u003e53\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-prayāga-bhaṭṭa-vallabhaika-niṣṭha-sevanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enīla-śaila-bhaṭṭa-datta-rāga-mārga-rādhanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī gadādharārpitādhikāra-mantra-mādhuraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSlavens \u003ci\u003ešuddhadvaitas\u003c/i\u003e Višnusvāmī mācekļu pēctecības garīgais skolotājs Šrī Vallabha Bhatta dzīvoja Adhaila ciemā svētajā Prajagā un ar nesatricināmu uzticību savā mājā kalpoja Kungam Gaurangadēvam. Vēlāk, Džagannātha Purī, Kungs Gauranga ļāva Vallabha Bhattam izjust to saldo pieķeršanos, ko izjūt vecāki uz mazulīti Krišnu. Kungs nokārtoja, lai Šrī Gadadhārs Pandits iemāca viņam kalpošanai nepieciešamās mantras. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"54\"\u003e\n\u003ch5\u003e54\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-svarūpa-rāya-saṅga-gāmbhirāntya-līlanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edvādaśābda-vahni-garbha-vipralambha-śīlanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhikādhirūḍha-bhāva-kānti-kṛṣṇa-kuñjaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIegrimis dziļi sava skaistuma un saldās garšas patiesajā būtībā, Kungs Govinda nolaupīja Rādharānī noskaņojumu un, tērpies Viņas dzirkstošajā mirdzumā, atnāca kā Šrī Čaitanja Mahāprabhu. Pēdējos divpadsmit savu izpausto rotaļu gadus Viņš bija vienotības un atšķirtības jūtu pārņemts un dalījās ar savas sirds slepenajiem pārdzīvojumiem vienīgi ar Saviem uzticamākajiem bhaktām, tādiem kā Svarūpa Damodārs un Rāmanānda Rajs: \u003ci\u003ebāhire viṣajvālā hoy, antare ānandamoy\u003c/i\u003e.\u003cbr\u003e\n“Dievišķās mīlestības uz Krišnu pārsteidzošā īpatnība ir tajā, ka ārēji tā darbojas kā karsta lava, taču iekšēji līdzinās saldam nektāram, kas piepilda sirdi ar lielāko prieku.” Vulkāna izvirdumiem līdzīgās ekstāzes plūsmas tecēja no Šrī Gaurangas sirds, kas kvēloja atšķirtībā no Krišnas. Zeltītais Kungs, kurš izskatījās pēc apskurbuša ziloņa, bija neviens cits kā Kungs Govinda! Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"55\"\u003e\n\u003ch5\u003e55\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-svarūpa-kaṇṭha-lagna-māthura-pralāpakaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhikānu-vedanārta-tīvra-vipralambhakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esvapnavat-samādhi-dṛṣṭa-divya-varṇanāturaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Gaurangadēvs, apķēries Šrī Svarūpam Damodāram ap kaklu, sāka sērīgi citēt lūgšanas, kuras atšķirtības ilgās teica Šrīmatī Rādharānī, kad Kungs Krišna aizbrauca no Vrindāvanas uz Mathuru. Kungs nepārstājoši izgaršoja Šrīmatī Rādharānī noskaņojumu, kura neizsakāmi cieta no kvēlojošās uguns, ko raisīja atšķirtība no Kunga Krišnas. Ar sāpēm sirdī Kungs aprakstīja dievišķā transa laikā atnākušās atklāsmes. Parastam cilvēkam šīs atklāsmes šķiet vien kā sapņi vai iedomas. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"56\"\u003e\n\u003ch5\u003e56\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esātvikādi-bhāva-chihna-deha-divya-sauṣṭhavaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekūrma-dharma-bhinna-sandhi-gātra-puṣpa-pelavam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehrasva-dīrgha-padma-gandha-rakta-pīta-pāṇḍuraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAstoņas pašatdeves pazīmes rotāja  un pastiprināja Kunga mirdzošā ķermeņa skaistumu. Dažkārt Viņš kļuva līdzīgs bruņurupucim, kurš ievilcis locekļus bruņās, dažkārt Viņa ķermenis kļuva garš un viņa locītavas izgāja no savām vietām. Dažkārt Kunga Gaurasundara ķermenis bija maigs un smaržoja pēc lotosa. Dažkārt tas kļuva sarkans vai žilbinoši balts kā jasmīna zieds. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"57\"\u003e\n\u003ch5\u003e57\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etīvra-vipralambha-mugdha-mandirāgra-dhāvitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekūrma-rūpa-divya-gandha-lubdha-dhenu-veṣṭitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evarṇitāli-kūla-kṛṣṇa-keli-śaila-kandaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSēru satriekts un ilgu pārpildīts, Kungs Čaitanja skrēja pie Kunga Džagannātha tempļa lauvu vārtiem, taču dažus mirkļus vēlāk Kungs krita pie zemes. Pārdzīvodams dziļu šķiršanos, Viņš parādījās bruņurupuča Kurmadēva veidolā, un no Viņa samaņu zaudējušā ķermeņa nāca saldākais aromāts. Tas pievilināja templī mītošās telangi govis, kuras sapulcējās Viņam apkārt. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"58\"\u003e\n\u003ch5\u003e58\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eindu-sindhu-nṛtya-dīpta-kṛṣṇa-keli-mohitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eūrmi-śīrṣa-supta-deha-vāta-raṅga-vāhitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyāmunāli-kṛṣṇa-keli-magna-saukhya-sāgaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKādā Mēness apspīdētā naktī Kungs Gaurangadēvs, baudot Kunga Krišnas rotaļu saldo garšu, pastaigājās ar saviem pavadoņiem gar okeāna krastu. Piepeši Kungs ieraudzīja Mēness atspulgu, kas dejoja pa krastu apskalojošiem viļņiem. Negaidīti atmiņas par Šrī Krišnas rotaļām Jamūnā sāka valdīt pār Kungu un Viņš, zaudējis samaņu, nokrita. Pēc tam, bhaktām nemanot, Kunga Gaurangas ķermenis kļuva viegls kā sausa koka gabals un, vēja dieva aiznests, dievišķā transā aizpeldēja pāri okeāna viļņu bangām. Apcerot Kunga Krišnas rotaļas ar saviem uzticamākajiem pavadoņiem, Kungs iegrima dziļajā dievišķās ekstāzes okeānā. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"59\"\u003e\n\u003ch5\u003e59\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erātri-śeṣa-saumya-veśa-śāyitārdra-saikataṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhinna-sandhi-dīrgha-deha-pelavāti-daivatam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrānta-bhakta-chakratīrtha-hṛṣṭa-dṛṣṭi-gocharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eRīta pusē, pēc visu nakti ilgušajiem meklējumiem, bezspēcīgie bhaktas beidzot atrada Viņu Čakratirthas tuvumā, kur Viņa izstieptais ķermenis gulēja mitrajās smiltīs. Bhaktu acis piepildīja prieks, kad viņi ieraudzīja sava Kunga maigo un mierpilno ķermeni. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"60\"\u003e\n\u003ch5\u003e60\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eārta-bhakta-kaṇṭha-kṛṣṇa-nāma-karṇa-hṛdgataṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elagna-sandhi-suṣṭhu-deha-sarva-pūrva-sammatam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eardha-bāhya-bhāva-kṛṣṇa-keli-varṇanāturaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSatrauktie bhaktas sāka skaļi dziedāt Kunga Krišnas Svētos Vārdus un šī dievišķā skaņa iekļuva Kunga ausīs skardama Viņa sirds dziļumus. Kunga izmežģītās locītavas nekavējoties atgriezās savās vietās un Viņš atkal pieņēma to brīnišķīgo veidolu, kuru bija pieradušas baudīt bhaktu acis. Daļējas apziņas stāvoklī, pārdzīvodams dziļas atšķirtības ilgas,  Kungs sāka aprakstīt to, ko bija redzējis, kamēr bija gremdējies dievišķajā transā. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-yamunambu-krishna-radhikali-keli-mandalam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"61\"\u003e\n\u003ch2\u003eŚrī Śrī Premadhāma-deva-stotram \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003ePiektdiena\u003c/h3\u003e\n\u003ch4\u003eŠrīla Bhakti Rakšak Šrīdhārs Dēv-Gosvāmī Mahārādža\u003c/h4\u003e\n\u003ch4\u003eSvāmī Bhakti Pavan Džanardana redakcija\u003c/h4\u003e\n\u003ch5\u003e61\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyāmunāmbu-kṛṣṇa-rādhikāli-keli-maṇḍalaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evyakta-gupta-dṛpta-tṛpta-bhaṅgi-mādanākulam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egūḍha-divya-marma-moda-mūrchanā-chamatkaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVrindāvanā, Jamūnas svētajos ūdeņos, Šrī Šrī Rādha Govinda kopā ar savām visdārgākajām draudzenēm ganumeitenēm nododas valdzinošām izklaidēm. Dažkārt šīs dievišķās rotaļas ir atklātas, dažkārt slēptas, dažkārt tās nonāk pretrunās, bet dažkārt tās ir harmonijā... Tā Kunga rotaļas izpaužas daudzveidīgos žestos, kurus izsauc dažādas dievišķās vēlmes. Šrī Čaitanja Mahāprabhu izplatīja slepeno garīgo dārgumu maigo melodiju, kura izbrīnīja visu Visumu. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"62\"\u003e\n\u003ch5\u003e62\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eāsya-gharṣaṇādi-chāṭakādri-sindhu-līlanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakta-marma-bhedi-tīvra-duḥkha-saukya-khelanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eatyachintya-divya-vaibhavāśritaika-śaṅkaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTikko kā Kungs palūkojās uz Čataka kalnu, Viņu pārņēma neciešamas atšķirtības ilgu jūtas, kas pamudināja Viņu uz dziļas pielūgsmes izpausmēm. Kungs sāka trīties ar savu brīnišķīgo seju pret zemi. Kad Kungs Gauranga atcerējās Kunga Krišnas izklaides uz ūdens, Viņš leca okeānā un izpauda dievišķas pazīmes, kuras piemīt no tīras mīlestības apskurbušajiem. Šī Kunga rīcība piepildīja bhaktu sirdis ar dižā dievišķas mīlestības okeāna viļņiem. Šie viļņi nesa pie bhaktu sirds krastiem kā transcendentālu trauksmi, tā arī transcendentālu prieku. Šāda neiedomājama labvēlība tika dāvāta tikai uzticīgākajiem Kunga pavadoņiem. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"63\"\u003e\n\u003ch5\u003e63\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrotra-netra-gatyatīta-bodha-rodhitādbhutaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-labhya-bhāva-siddha-chetanā-chamatkṛtam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebrahma-śambhu-veda-tantra-mṛgya-satya-sundaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Čaitanja Mahāprabhu ne tikai atrodas aiz materiālās redzes un skaņas robežām, bet arī aptur visus intelektuālos centienus viņu iepazīt. Vienmēr atrodoties tīras mīlestības uz Dievu stāvoklī, Viņš paliek noslēpums un izbrīna pat tās dzīvās būtnes, kuras nostiprinājušās savas garīgās dabas izpratnē. Kunga Brahmas atklātās Vēdas un Kunga Šivas tantriskie raksti ir Šrī Gaurasundara, Brīnišķīgās Realitātes, meklējumos! Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"64\"\u003e\n\u003ch5\u003e64\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evipra-śūdra-vijña-mūrkha-yāvanādi-nāmadaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evitta-vikramocha-nīcha-sajjanaika-sampadam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003estrī-pumādi-nirvivāda-sārvavādikoddharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDāsni dalot Kunga Krišnas Svēto Vārdu, Šrī Gaurangadēvs attīrīja erudītākos intelektuāļus, strādniekus, analfabētus un pat zemāko sabiedrības slāņu pārstāvjus. Kungs iemiesoja sevī katras patiesas un cēlas dvēseles dižāko bagātību, kā pārtikušas, tā arī trūcīgas, kā ar aristokrātisku, tā arī ar zemu dzimšanu. Tādēļ Kungu Čaitanju godā un slavē kā visu dzīvo būtņu glābēju – kā vīriešu, tā arī sieviešu, kā materiālajā, tā arī garīgajā pasaulē. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"65\"\u003e\n\u003ch5\u003e65\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esindhu-śūnya-veda-chandra-śāka-kumbha-pūrṇimā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esāndhya-chāndrakoparāga-jāta-gaura-chandramā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esnāna-dāna-kṛṣṇa-nāma-saṅga-tat-parātparaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLīdzīgs zelta mēnesim, Šrī Gauračandra parādījās Šakabdas 1407. gada (mūsu ēras 1486. gads) marta mēnesī, Mēness aptumsuma laikā, pilnmēness vakarā. Laikā kad Absolūtā Patiesība, Šrī Gaurangadēvs, Šačīdēvī brīnišķīgajā pagalmā nāca šajā pasaulē, Majapuras iedzīvotāji pieņēma apmazgāšanos svētajā Gangā, kopīgi dziedādami Harī Svētos Vārdus un piedāvādami Kungam dažādas dārglietas. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"66\"\u003e\n\u003ch5\u003e66\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eātma-siddha-sāvalīla-pūrṇa-saukhya-lakṣaṇaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esvānubhāva-matta-nṛtya-kīrtanātma-vaṇṭanam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eadvayaika-lakṣya-pūrṇa-tattva-tat-parātparaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLūk, visu uzvarošs secinājums: Sākotnējai Realitātei ir jābūt arī augstākajai \u003ci\u003eānandas\u003c/i\u003e formai, ekstāzei! Šrī Čaitanja Mahāprabhu ir Krišna, pati ekstāze, kura bauda savu saldo garšu un ekstātiskā sajūsmā dejo! Viņa paša Svētais Vārds ir Viņa dejā izpaustās ekstāzes cēlonis, un Svētais Vārds ir Viņa dziesmā izpaustās ekstāzes sekas. Cēlonis ir sekas! Cēlonis rada ekstāzes enerģiju, kura liek Viņam dejot, bet Viņa dziedāšana izplata šo ekstāzi citiem. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"67\"\u003e\n\u003ch5\u003e67\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-purīśvarānukampi-labdha-dīkṣa-daivataṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeśavākhya-bhāratī-sakāśa-keśa-rakṣitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emādhavānudhī-kiśora-kṛṣṇa-sevanādaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Išvara Purī ieguva milzu veiksmi, kad Kungs Gauranga izrādīja savu bezcēloņa žēlsirdību, pieņemot no viņa iniciāciju. Šrī Kēšava Bharatī bija svētīts līdzīgā veidā ar to, ka viņa klātbūtnē Kungs Gauranga nogrieza savus brīnišķīgi vijīgos matus un pieņēma no viņa \u003ci\u003esannjāsī\u003c/i\u003e drānas. Kungs Čaitanja izrādīja nedalāmu uzmanību Šrī Mādhavendram Purī, pasludinot, ka viņa laulāto mīlestībā izpaustā uzticīgā kalpošana Šrī Krišnam \u003ci\u003ekišora\u003c/i\u003e formā, ir augstākā \u003ci\u003ebhakti\u003c/i\u003e izpausme. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"68\"\u003e\n\u003ch5\u003e68\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esindhu-bindu-veda-chandra-śāka-phālgunoditaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enyāsa-soma-netra-veda-chandra-śāka-bodhitam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evāṇa-vāṇa-veda-chandra-śāka-lochanāntaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Gaurangadēvs ir manas pielūgsmes objekts! Viņš uzausa līdzīgi zelta mēnesim Šrī Majapurā Šakabdas 1407. gadā, savukārt Šakabdas 1431. gadā tērpās \u003ci\u003esannjāsī\u003c/i\u003e drēbēs, lai svētītu visu materiālo Visumu. Viņš pazuda no šīs pasaules cilvēku redzesloka Šakabdas 1455. gadā. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"69\"\u003e\n\u003ch5\u003e69\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-svarūpa-rāya-saṅga-harṣa-śeṣa-ghoṣaṇaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśikṣaṇāṣṭakākhya-kṛṣṇa-kīrtanaika-poṣaṇam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-nāma-mātra-viśva-jīvanaika-sambharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAr lielu prieku Šrī Gauranga Sundars pavēstīja saviem dārgākajiem pavadoņiem, Šrī Svarūpam Damodāram un Rāmanānda Rajam, ka kopīga Kunga Krišnas Svēto Vārdu dziedāšana dāvā Kali laikmeta dzīvajām būtnēm visaugstāko svētību:\u003cbr\u003e\n\u003ci\u003eharṣe prabhu kohena, “śuno svarūpa-rāma-rāya\u003c/i\u003e\u003cbr /\u003e\u003ci\u003enāma saṅkīrttana kalau, parama upāya”\u003c/i\u003e\u003cbr\u003e\nSavā slavenajā darbā “Šrī Šikšāštakam” Kungs Gauranga nostiprināja Šrī Krišnas Svēto Vārdu dziedāšana dāvā dzīvām būtnēm augstāko labumu. Tāpat Visaugstais mācīja, ka Šrī Krišnas Svēto Vārdu dziedāšana, kas izpildīta tīrā mīlestībā uz Dievu, pilnīgā veidā uztur visas dzīvās būtnes Visumā un dod viņām pilnīgu apmierinājumu. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"70\"\u003e\n\u003ch5\u003e70\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprema hema-deva dehi-dāsareṣa manyatāṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṣamyatāṁ mahāparādha-rāśireṣa-gaṇyatām\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erūpa-kiṅkareṣu rāmānanda-dāsa-sambharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-dhāma-devam eva naumi gaura-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, mans Zelta Kungs! (\u003ci\u003eSuvarṇa-varṇa hemāṅga\u003c/i\u003e) Jel dāvā man augstsirdīgi savas dievišķās mīlestības dārgumus! Lūdzu Tevi, velti šai kritušajai dvēselei mazliet uzmanības un piedod viņas neskaitāmos apvainojumus! Daudzi Šrī Rūpas kalpi ir tik dārgi Tev! Es kvēli alkstu vien to, lai Tu uzskatītu mani par vienu no tādiem kalpiem! Gaurasundar! Tu esi mans vienīgais aizstāvis un manas – Rāmanānda Dāsa, labvēlīgas veiksmes iemiesojums. Es cieņpilni klanos brīnumskaistā Zeltītā Kunga, Gauranga Sundara – dievišķā Krišna-\u003ci\u003eprēmas\u003c/i\u003e iemiesojuma, priekšā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"71\"\u003e\n\u003ch5\u003e71\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esaśraddhaḥ sapta-daśakaṁ prema-dhāmeti-nāmakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003estavaṁ ko ’pi paṭhan gauraṁ rādhā-śyāma-mayaṁ vrajet\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKatram, kurš ar ticību lasa šo darbu, sastāvošu no septiņdesmit lūgšanām, pazīstamu kā “Premadhāma-deva-stotram”, tiks dāvāta iespēja kalpot brīnišķīgajam Zeltītajam Kungam, Gauranga Sundaram, kurš ir neviens cits kā pats Šjāmasundars, klāts ar Šrīmatī Rādharānī sirdi un mirdzumu (\u003ci\u003ebhāvu\u003c/i\u003e un \u003ci\u003ekantī\u003c/i\u003e).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"72\"\u003e\n\u003ch5\u003e72\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epañchame śata-gaurābde śrī-siddhānta-sarasvatī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrīdharaḥ ko ’pi tach chiṣyas tridaṇḍī-nauti-sundaram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠīs lūgšanas piektajā gadsimtā pēc Šrī Čaitanjas Mahāprabhu atnākšanas sastādīja Šrī Sarasvatī Thākura sannjāsī-skolnieks vārdā Šrīdhārs (Šrīla Bhakti Rakšak Šrīdhārs Dēv-Gosvāmī Mahārādža).\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eDziesmas Nitjānandam Prabhū\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-nitai-pada-kamala-koti-chandra-sushitala\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eManaḥ-Śikṣā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Narottams Dāsa Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enitāi-pada-kamala,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;koṭī-chandra-suśītala,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;je chāyāya jagata juḍāy\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eheno nitāi bine bhāi,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rādhā-kṛṣṇa pāite nāi,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dṛḍha kori dharo nitāira pāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNitjānandas Prabhū svētās, lotosam līdzīgās pēdas mirdz līdzīgi desmit miljoniem mēnešu, kuru ēnā visa pasaule gūst nomierinošu atvieglojumu! Brāl, bez Nitjānandas neviens nevarēs piekļūt Rādhai un Krišnam, tādēļ ar pilnu apņēmību turies pie Viņa lotosam līdzīgajām pēdām!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ese sambandha nāhi jāra,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vṛthā janma gelo tāra,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sei paśu boḍo durāchāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enitāi nā bolilo mukhe,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;majilo saṁsāra-sukhe,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vidyā-kule ki koribe tāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTas, kuram nav saiknes ar Viņu, ir nodzīvojis savu dzīvi veltīgi – viņš līdzinās nelaimīgam dzīvniekam! Tas, kura lūpas nekad nav izteikušas “Nītaj”, ir pasaulīgo baudu varā. Kā gan viņa aristokrātiskās saknes var viņu glābt?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eahaṅkāre matta hoiyā, nitāi-pada pāsariyā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;asatyere satya kori māni\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enitāiyer karuṇā habe, vraje rādhā-kṛṣṇa pābe,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dharo nitāiyer charaṇ du’ khāni\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNeprātīgs un aizmirsis par Nitjānandas Prabhū lotosam līdzīgajām pēdām, es pieņemu melus par patiesību! Taču, ja Nitjānanda Prabhū dāvās tev savu žēlsirdību, tu satiksi Rādhu un Krišnu Vradžā! Jel apskauj Nitjānandas lotosam līdzīgās pēdas!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enitāiyer charaṇa satya, tā̐hāra sevaka nitya,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nitāi-pada sadā kara āśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enarottama boḍo duḥkhī, nitāi more kara sukhī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rākho rāṅgā-charaṇera pāśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNitjānandas lotosam līdzīgās pēdas ir Patiesība, un Viņa kalpi ir mūžīgi. Vienmēr tiecies pieņemt patvērumu pie Viņa pēdām! Narottams dāsa ir ļoti nelaimīgs! Ak, Nītaj, padari mani laimīgu! Lūdzos.. ļauj man vienmēr atrasties pie Tavām brīnišķīgajām, lotosam līdzīgajām pēdām!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-sujanarvuda-radhita-pada-yugam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śrī Prabhupāda-padma Stavakaḥ \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eLūgšana mana kunga un skolotāja Šrīlas Bhaktisiddhanta Sarasvatī Thākura Prabhupādas lotosam līdzīgajām pēdām\u003c/h3\u003e\n\u003ch4\u003eŠrīla Bhakti Rakšak Šrīdhārs Dēv-Gosvāmī Mahārādža\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esujanārvuda-rādhita-pāda-yugaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyuga-dharma-dhurandhara-pātra-varam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaradābhaya-dāyaka-pūjya-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eViņa lotosam līdzīgajām pēdām uzticīgi kalpo daudzas augstas, dievbijīgas dvēseles. Viņš pasludināja šī laikmeta reliģiju (Šrī Harināma-sankirtānu). Viņš ir Višva-Vaišnava-Rādža-Sabhī – Visuma tīro bhaktu, patieso valdnieku un visas pasaules vadoņu sabiedrības monarhs. Viņš piepildīja to personību kvēlākās vēlēšanās, kuras kliedē visu dvēseļu bailes. Es krītu pie šīs dižās, visu godājamās dvēseles lotosam līdzīgajām pēdām, atkal un atkal es klanos starojumam, kas nāk no mana Kunga lotosam līdzīgajām pēdām.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhajanorjita sajjana-saṅgha-patiṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epatitādhika-kāruṇikaika-gatim\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egati-vañchita-vañchakāchintya-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eViņš ir to veiksmīgo dvēseļu, kuras svētītas ar tīras garīgas kalpošanas dārgumiem, vadonis. Viņš ir neparasti žēlsirdīgs pret kritušām dvēselēm, viņš ir šo dvēseļu vienīgais patvērums, un viņa neaptveramās, svētās pēdas kļūst par krāpnieku patvērumu, maldinot tos. Es krītu pie viņa lotosam līdzīgajām pēdām, atkal un atkal es klanos starojumam, kas nāk no mana Kunga lotosam līdzīgajām pēdām.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eatikomala-kāñchana-dīrgha-tanuṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etanu-nindita-hema-mṛṇāla-madam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emadanārvuda-vandita-chandra-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs klanos viņa dievišķajam, valdzinošajam un vienlaicīgi cēlajam zeltītajam veidolam. Viņa mirdzums aizēno lotosa zelta stiebru neprātīgo ekstāzi. Mana godājamā dievišķā skolotāja lotosam līdzīgo pēdu pirkstu mēneši, kuriem godu izrāda desmitiem tūkstoši kupidonu, satriec ar savu skaistumu! Atkal un atkal es klanos starojumam, kas nāk no mana Kunga lotosam līdzīgajām pēdām.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enija-sevaka-tāraka-rañji-vidhuṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evidhutāhita-huṅkṛta-siṁha-varam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaraṇāgata-bāliśa-śanda-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLīdzīgi Mēnesim, kura mirdzumu apjūsmo zvaigznes, viņu ieskauj viņam tuvi kalpi, kuru sirdis, saskaņā ar viņa gribu, atplaukst dievišķā ekstāzē. Ļaunprātīgi bezdievji panikā bēg, kad dzird viņa pērkona dārdiem līdzīgos rēcienus, bet nevainīgas dvēseles tiek apveltītas ar augstāko garīgo veiksmi, pieņemot patvērumu pie viņa lotosam līdzīgajām pēdām. Cieņpilnā pazemībā es klanos viņa priekšā. Atkal un atkal es klanos starojumam, kas nāk no mana Kunga lotosam līdzīgajām pēdām.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evipulīkṛta-vaibhava-gaura-bhuvaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhuvaneṣu vikīrtita-gaura-dayam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edayanīya-gaṇārpita-gaura-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eViņš atklāja Šrī Gaura Dhāmas bezgalīgi diženo skaistumu. Visā Visumā viņš izplatīja vēsti par Šrī Gaurangas vareno žēlsirdību. Cienīgo sirdīs, kuri pieņem viņa žēlastību, viņš uz mūžiem nostriprina Šrī Gauras lotosam līdzīgās pēdas. Cieņpilnā pazemībā es klanos viņa priekšā. Atkal un atkal es klanos starojumam, kas nāk no mana Kunga lotosam līdzīgajām pēdām.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echira-gaura-janāśraya-viśva-guruṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eguru-gaura-kiśoraka-dāsya-param\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eparamādṛta-bhaktivinoda-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eViņš ir Šrī Gaurangam veltījušos dvēseļu mūžīgais patvērums un Visuma Guru. Pārņemts ar kalpošanu savam Gurudēvam, Šrī Gaurakišoram, viņš no visas sirds godā Šrī Bhaktivinodu Thākuru. Cieņpilnā pazemībā es klanos viņa priekšā. Atkal un atkal es klanos starojumam, kas nāk no mana Kunga lotosam līdzīgajām pēdām.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eraghu-rūpa-sanātana-kīrti-dharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edharaṇī-tala-kīrtita-jīva-kavim\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekavirāja-narottama-sakhya-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eViņš ir pazīstams ar to, ka pacēla Šrī Rūpas, Šrī Sanātanas un Šrī Raghunātha slavas karogu. Visā pasaulē viņu slavē kā neatšķiramu no varenā un erudītā Šrīlas Džīvas. Viņš ir zināms kā tas, kuram piemīt sirds vienotība ar Šrīlu Krišnadāsu Kavirādžu un Thākuru Narottamu. Cieņpilnā pazemībā es klanos viņa priekšā. Atkal un atkal es klanos starojumam, kas nāk no mana Kunga lotosam līdzīgajām pēdām.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛpayā hari-kīrtana mūrti-dharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edharaṇī-bhara-hāraka-gaura-janam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejanakādhika-vatsala-snigdha-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDāvājot žēlastību visām dvēselēm, viņš ir Harī-kirtana iemiesojums. Kā Šrī Gauras pavadonis viņš atbrīvo māti Zemi no nastas, kuru rada pret Zemi veiktie apvainojumi. Viņš ir tik žēlsirdīgs, ka viņa mīlestība pret visām dzīvām būtnēm pārsniedz pat vecāku mīlestību. Cieņpilnā pazemībā es klanos viņa priekšā. Atkal un atkal es klanos starojumam, kas nāk no mana Kunga lotosam līdzīgajām pēdām.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśaraṇāgata-kiṅkara-kalpa-taruṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etaru-dhik-kṛta dhīra vadānya varam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaradendra-gaṇārchita-divya-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLīdzīgi vēlmju kokam viņš piepilda savu uzticīgo kalpu sirdīs mītošās vēlēšanās. Taču pat šis salīdzinājums nevar visā pilnībā aprakstīt viņa augstsirdību un pacietību. Dižas personības, kuras dāvā svētību citiem, kalpo viņa lotosam līdzīgajām pēdām. Cieņpilnā pazemībā es klanos viņa priekšā. Atkal un atkal es klanos starojumam, kas nāk no mana Kunga lotosam līdzīgajām pēdām.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eparahaṁsa-varaṁ paramārtha-patiṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epatitodharaṇe kṛta-veśa-yatim\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyati-rāja-gaṇaiḥ parisevya-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLielākais dārgakmens paramahamsu vidū, dzīves augstākās pilnības, Šrī Krišna-prēmas,  dārgumu valdnieks – vien, lai glābtu kritušas dvēseles, viņš pieņēma nabadzīga sannjāsī veidolu. Dižākie tridandi-sannjāsī kalpo viņa lotosam līdzīgajām pēdām. Cieņpilnā pazemībā es klanos viņa priekšā. Atkal un atkal es klanos starojumam, kas nāk no mana Kunga lotosam līdzīgajām pēdām.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evṛṣabhānu-sutā-dayitānucharaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echaraṇāśrita-reṇu-dharas tam aham\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emahad-adbhuta-pāvana-śakti-padaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epraṇamāmi sadā prabhupāda-padam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eViņš ir Šrī Vrišabhanū dievišķās meitas tuvākais un dārgākais pavadonis, un es esmu neiedomājami veiksmīgs, jo putekļi no viņa svētajām kājām ir skāruši manu galvu. Es klanos pie viņa varenajām, lotosam līdzīgajām pēdām, kurām piemīt brīnumains attīrīšanas spēks! Atkal un atkal es klanos starojumam, kas nāk no mana Kunga lotosam līdzīgajām pēdām.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-nitai-gunamani-amara-nitai-gunamani\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eNitāi guṇamaṇi āmāra \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Ločans Dāsa Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enitāi guṇamaṇi āmāra nitāi guṇamaṇi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāniyā premera vanyā bhāsāla abanī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, mans Kungs Nitjānanda, tikumības dārgakmens! Nītajs, visu labvēlīgo īpašību pērle, pārpludināja pasauli ar ekstātisku mīlestību uz Dievu!.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epremavanyā loye nitāi āila gāuḍa deśe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eḍubilo bhakata-gaṇa dīnahīna bhāse\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIzpildot Kunga Čaitanjas vēlmi, Kungs Nitjānanda vērsa šo visu sagraujošo straumi uz Bengāliju! Ekstāzes okeāna straume paķēra līdzi bhaktas, taču neveiksmīgus bezdievjus tā neskāra.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edīnahīna patita pāmara nāhi bāche\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebrahmāra durlabha prema sabākāre jāce\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGrēcīgie, zemu kritušie un nelaimīgie negribēja dievišķo mīlestību, bet mans Kungs Nītajs lūdzās, lai viņi pieņem šo dievišķās mīlestības augstāko formu, kuru iegūt ir grūti pat Brahmam.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eābaddha karuṇā-sindhu kāṭiyā muhāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eghore ghore bule prema-amiyāra bāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIepriekš žēlsirdības okeāns nebija pieejams, taču Kungs Nītajs izbūvēja kanālu, lai dižā ekstātiskās mīlestības straume varētu appludināt māju pēc mājas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003elochan bole heno nitāi jebā nā bhajilo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejāniyā śuniyā sei ātmaghātī hoilo\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLočans dāsa saka: “Tas, kurš nepielūdz Kungu Nītaju un nepieņem velti, kuru Viņš dāvā, veic apzinātu pašnāvību!”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-dayal-nitai-chaitanya-bole-nach-re\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eDayāl Nitāi Chaitanya \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘dayāl nitāi chaitanya’ bo’le nāch re āmār man\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāch re āmār man, nāch re āmār man\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eJel dejo, mans prāts! Jel dejo, mans prāts! Ak, mans prāts, es lūdzu tevi – dejo dziedot “Dojal Nītaj Čaitanja!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e(emon dayāl to nāi he, mār kheye prema dey)\u003cbr\u003e\n(tabe)\u003cstrong\u003e aparādha dūre jābe, pābe prema-dhan\u003c/strong\u003e\u003cbr\u003e\n(aparādhera-vichāra to nāi he)\u003cbr\u003e\n\u003cstrong\u003etakhon kṛṣṇa-nāme ruchi habe, ghuchibe bandhan\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTāda žēlsirdība, kāda piemīt Nitjānandam Prabhū, nav sastopama nekur citur! Džagajs un Madhajs nodarīja Viņam sāpes, taču, neskatoties uz to, Kungs Nitjānanda dāvāja viņiem dievišķo mīlestību.\u003cbr\u003e\nKad arī tu atbrīvosies no apvainojumiem, iegūsi mīlestību uz Dievu. Atkārtojot Čaitanjas un Nitjānandas Vārdus, apvainojumi netiek ņemti vērā! Izgaršojis kaut reizi Krišnas Svētā Vārda saldo garšu, tu atbrīvosies no verdzības šai pasaulei.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e(anurāg to habe he)\u003cbr\u003e\n\u003cstrong\u003etokhon anāyāse saphal habe jīvera jīvan\u003c/strong\u003e\u003cbr\u003e\n(kṛṣṇa-rati vinā jīvan to miche he)\u003cbr\u003e\n\u003cstrong\u003eśeṣe vṛndāvane rādhā-śyāmer pābe daraśan\u003c/strong\u003e\u003cbr\u003e\n(gaura-kṛpā hole he)\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKad parādās pieķeršanās Krišnas Svētajam Vārdam, dzīvas būtnes dzīve piepildās ar patiesu laimi! Bez pieķeršanās Krišnam, dzīve ir tukša un veltīga. Ja Kunga Gauras žēlsirdība būs klātesoša, dzīves noslēgumā tu varēsi skatīt brīnišķīgos Rādhas un Šjāma tēlus Vrindavanā!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eKungam Čaitanjam veltītas dziesmas\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-avatara-sara-gora-avatara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eAvatāra Sāra \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Ločans Dāsa Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eavatāra sāra\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gorā avatāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;keno nā bhajili tā̐re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekori nīre vāsa gelo nā piyāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āpana karama phere\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Gauras iemiesojums pārspēj visus Dieva iemiesojumus! Kādēļ gan es neesmu Viņu pielūdzis? Atgriežoties pie darbības tās augļu dēļ, es it kā atteicu sev slāpju remdēšanu, kamēr visapkārt bija pieejams ūdens.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekaṇṭa-kera taru\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadāi sebili (mana)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;amṛta pā’bāra āśe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema-kalpataru\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī gaurāṅga āmāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāhāre bhabili biṣe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs gremoju pasaulīgās dzīves koka dzeloņus un riju asinis, kas piepildīja manu muti, uzskatīdams tās par nektāru. Taču, kad man piedāvāja Kunga Gaurangas reibinošās mīlestības vēlmju koka augļus, es tos atraidīju, domājot, ka tā ir inde.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esaura-bhera āśe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;palāśa śuṅkili (mana)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāsāte paśilo kīṭa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘ikṣu-daṇḍa’ bhāvi’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kāṭha chuṣili (mana)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kemone pāibi miṭha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVēloties baudīt saldu aromātu, es ostīju to, kas, kā man šķita, bija aromātisks zieds. Diemžēl no šī zieda, līdzīgi palaša ziedam, aromāts nenāca. Aromāta vietā no zieda izlidoja kukainis, kurš ielidoja man degunā un iedzēla man. Es tiecos baudīt pasaulīgo dzīvi, maldīgi pieņemot, ka tā ir salda kā cukura standziņas sula! Taču nektāra vietā es košļāju sausu koku. Tā visi mani centieni baudīt izrādījās veltīgi.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘hāra’ boliyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;golāya parili (mana)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śamana kiṅkora sāpa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘śītala’ boliyā\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āguna pohāli (mana)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pāili bajara-tāpa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAtzinis savu sakāvi, nomocīts un iztukšots, es gaidu nāves čūsku. Materiālās dzīves uguni esmu pieņēmis par nomierinošu vēsumu, taču esmu iepazinis vienīgi dziļas ciešanas, gluži kā zibens sasperts!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esaṁsāra bhajili\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-gaurāṅga bhulili\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā śunili sādhura kathā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eiha-parakāla\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dukāla khoyāli (mana)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;khāili āpana māthā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIegrimis pasaulīgo raižu bezdibenī, es aizmirsu par Kungu Gaurangu un nesekoju svēto norādījumiem! Tagad, savu dienu nogalē, es saprotu, ka mirstu jau otru reizi, jo, izdabājot savām materiālajām vēlmēm, esmu pavadījis tukšu dzīvi un tādējādi nomiris vēl dzīvam esot!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gay-gora-madhur-svare\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Nāma \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gāy gorā madhur svare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehare kṛṣṇa hare kṛṣṇa, kṛṣṇa kṛṣṇa hare hare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehare rāma hare rāma, rāma rāma hare hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs Gaurasundars saldā balsī dzied: “Harē Krišna, Harē Krišna, Krišna Krišna, Harē Harē, Harē Rāma, Harē Rāma, Rāma Rāma, Harē Harē”.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egṛhe thāko, vane thāko, sadā ‘hari’ bole’ ḍāko,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esukhe duḥkhe bhulo nāko, vadane harinām kara re\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNav nozīmes, vai esi mājsaimnieks vai, atsacījies no pasaules, dzīvo vienatnē – vienmēr dziedi Kunga Svēto Vārdu! Laimē un nelaimē neaizmirsti piesaukt Svēto Vārdu, piepildot savas lūpas ar Harīnāmas nektāru.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emāyā-jāle baddha ho’ye, ācho miche kāja lo’ye,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eekhona o chetana peye, rādhā-mādhava-nām bolo re\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSapinies \u003ci\u003emajas\u003c/i\u003e tīklos, tu esi kļuvis par ilūzijas vergu un esi veltīgi vergojis. Taču tagad, kad esi ieguvis cilvēcisko dzimšanu un apziņu, jel dziedi Rādhas-Mādhavas Vārdus!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejīvana hoilo śeṣa, nā bhajile hṛṣīkeśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhaktivinod-upadeśa, ekbār nām-rase māto re\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTava dzīve nešaubīgi drīz beigsies, taču tu neesi pielūdzis Hrišīkēšu, jutekļu (maņu) Valdnieku. Bhaktivinoda lūdz tevi: pagaršo kaut reizi \u003ci\u003enāma-rasu\u003c/i\u003e, Svētā Vārda nektāru!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-ke-jabi-ke-jabi-bhai-bhava-sindhu-para\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eKe jabi ke jabi \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Ločans Dāsa Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eke jabi ke jabi bhāi bhava-sindhu pāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhanya kali-yuge re chaitanya avatāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, kurš gan dosies, brāl, kurš gan dosies šķērsot materiālās esības bezdibeni? Šī Kali laikmeta dārgums un veiksme – Kunga Čaitanjas atnākšana.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eāmāra gaurāṅgera ghāṭe ujānakheyā boy\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekaḍipāti nāhi lāge amani pāra hoy\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMans Kungs Gauranga stāv piestātnē, gatavs pārvest visus pāri materiālajai esībai. Kungs nekavējoties pieņem viņus, neprasot nekādu samaksu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eharināmera tarīkhāni śrī-guru-kāṇḍārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaṅkīrtana-keroyāla du’bahu pasāri\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKunga Svētie Vārdi ir prāmis, garīgais skolotājs ir kapteinis. Airi – tās ir sankirtanā paceltas rokas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esarva-jīva uddhāra hoilo premera bātāse\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elochana paḍiyā roilo karamera doṣe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLabvēlīgais vējš ir dievišķā mīlestība uz Kungu Krišnu. Visas dvēseles tapa glābtas uz šī kuģa, vienīgi Ločans Dāsa, savu paša ļauno darbu dēļ, palika šeit.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eCitas dziesmas\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-thakura-vaishnava-pada-avanira\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eṬhākura-vaiṣṇava-pada \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Narottams Dāsa Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eṭhākura-vaiṣṇava-pada,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;avanīra susampada,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śuno bhāi! hoiya eka mana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāśroya loiyā bhaje,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāre kṛṣṇa nāhi tyaje\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āro saba more akāraṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBrāl, uzklausi manus vārdus uzmanīgi: lotosam līdzīgās Vaišnavu pēdas ir lielākā bagātība šajā pasaulē! Pieņem patvērumu pie Vaišnaviem un godā viņus. Krišna nekad neatraidīs to, kurš pielūdz Viņu šādā veidā. Pārējiem lemta veltīga nāve.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evaiṣṇava-charaṇa-jol,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prema-bhakti dite bol,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āro keho nahe balavanta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaiṣṇava-charaṇa-renu,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mastake bhūṣaṇa vinu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āra nāhi bhūṣaṇera anta\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŪdens, ar kuru tika mazgātas lotosam līdzīgās Vaišnavu pēdas, dāvā tīru mīlestību uz Dievu un uzticīgu garīgu kalpošanu. Nav labāka veida, kā iegūt dievišķo mīlestību! Es beru sev uz galvas putekļus no lotosam līdzīgajām Vaišnavu pēdām. Citi rotājumi man nav vajadzīgi!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etīrthajol-pavitra-guṇe,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;likhiyāche purāṇe,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;se saba bhaktira pravañchana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaiṣṇavera pādadoka,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sama nahe ei saba,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jāte hoya vāñchito pūraṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePurānas apdzied svētvietās esošā ūdens attīrošo spēku, taču tas nav nekas vairāk kā maldi! Patiesībā nekam nepiemīt lielāks attīrīšanas spēks, kā ūdenim, ar kuru tika mazgātas Vaišnavu pēdas. Tas piepilda visas vēlēšanās!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evaiṣṇava-saṅgete mana, ānandita anukṣaṇa,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadā hoy kṛṣṇa-parasaṅga\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edīna narottama kā̐de, hiyā dhairja nāhi bāndhe,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mora dośā keno hoilo bhaṅga\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMirkli pēc mirkļa mans prāts smeļ nebeidzamu prieku Vaišnavu sabiedrībā. Es vienmēr meklēju Kunga Krišnas bhaktu sabiedrību. Garīgais ubags Narottams Dāsa raud: “Es vairs nevaldu pār sevi. Kā gan es varēju krist tik zemu, ka Vaišnavi mani atraida?”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-je-anilo-prema-dhana-karuna-prachura\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eViraha-gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Narottams Dāsa Thākurs\u003c/h4\u003e\n\u003ch4\u003eTiek dziedāta Šrīmana Mahāprabhu pavadoņu aiziešanas dienās\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eje ānilo prema-dhana karuṇā prachura\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eheno prabhu kothā gelā āchārya-ṭhākura\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKur gan var atrast to, kurš atklāj prema-bhakti dārgumus un kurš pats ir līdzcietības pilns, – to, kurš līdzinās Šrī Āčārjam Thākuram (Šrīnivāsam Āčārjam)?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekā̐hā mora svarūp rūpa kā̐hā sanātana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekā̐hā dāsa raghunātha patita-pāvana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKur gan ir kritušo dvēseļu glābēji? Kur ir Svarūpa Damodārs? Kur ir Rūpa Gosvāmī un Sanātana Gosvāmī? Kur var atrast Raghunāthu Dāsu?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekā̐hā mora bhaṭṭa-juga kā̐hā kavirāja\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eeka-kāle kothā gelā gaurā naṭa-rāja\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKur gan ir mani Raghunāths Bhatta un Gopals Bhatta Gosvāmī? Kur tagad ir Šrī Krišnadāsa Kavirādžs? Viņi ir aizgājuši visi reizē, lai būtu kopā ar Kungu Gaurangu, lielisko dejotāju!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epāṣāṇe kuṭibo māthā anale paśibo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaurāṅga guṇera nidhi kothā gele pābo\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEsmu gatavs pārsist savu galvu pret akmeni, lai tikai atrastos blakus Kungam Čaitanjam kopā ar viņiem!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ese-saba saṅgīra saṅge je koilo vilāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ese-saṅga nā pāyā kānde narottama dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eViņi visi ir aizgājuši, lai gremdētos savās rotaļās. Narottams Dāsa Thākurs sauc: “Man atliek vienīgi apraudāt savu rūgto likteni, jo nevaru būt viņu sabiedrībā!”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-ei-vara-karuna-kara-vaishnava-gosani\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eVaiṣṇava Vijñāpti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Narottams Dāsa Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eei-vāra karuṇā kara vaiṣṇava gosāñi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epatita-pāvana tomā vine keha nāi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, svētais Vaišnav! Lūdzu tevi, vismaz šoreiz esi žēlsirdīgs pret mani! Tu esi kritušo glābējs! Nav neviena cita, uz ko man likt cerības, izņemot tevi.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekāhāra nikaṭe gele pāpa dūre yāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eemana dayāla prabhu kevā kothā pāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePat vienkārši atrodoties tavā klātbūtnē visi grēki izdziest. Kur gan vēl lai rod šādu labsirdību?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaṅgāra paraśa haile paśchāte pāvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edarśane pavitra kara ei tomāra guṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePat esot zemākajam no cilvēkiem, ar vienu pieskārienu svētās Gangas ūdenim, var iegūt atbrīvošanu. Taču tavas īpašības ir tādas, ka ar vienkāršu tevis uzlūkošanu, var sasniegt to pašu!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari-sthāne aparādhe tāre harināma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomā-sthāne aparādhe nāhika eḍāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eJa kāds izdara apvainojumu Kunga Harī svētajām pēdām, viņam var tikt piedots, ja viņš skandē Viņa Svēto Vārdu. Taču, ja kāds apvaino tevi, viņam nav glābiņa!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra hṛdaye sadā govinda-viśrāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egovinda kahena mama vaiṣṇava parāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTavā sirdī vienmēr mīt Kungs Govinda. Pats Šrī Govinda saka: “Mani bhaktas ir Mana dzīvība un dvēsele!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprati janme kari āśā charaṇera dhuli\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enarottame kara dayā āpanāra vali\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs ceru, ka katrā dzīvē saskaršos ar putekļiem no tavām lotosam līdzīgajām pēdām. Šrī Narottams lūdzas: “Ak, svētais Vaišnav, lūdzu, esi žēlsirdīgs pret mani!”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-kripa-kara-vaishnava-thakura\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003ePrārthanā Lalasāmayi \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛpa kara’ vaiṣṇava ṭhākura\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esambandha jāniyā,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhajite bhajite,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;abhimān hau dūra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLūdzu tevi, dāvā tūlīt man savu žēlastību, godātais tīrais bhakta! Vaišnava Thākur! Tikai tad, ar pastāvīgu pielūgšanu un atcerēšanos par manu patieso mūžīgo stāvokli, mans viltus ego izšķīdīs.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘ami to’ vaiṣṇava’ e buddhi hoile,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;amānī nā ho’bo āmi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epratiṣṭhāśā āsi’,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hṛdoya dūṣibe,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hoibo nirayagāmī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eJa es maldīgi domāšu, ka esmu Vaišnavs, es sākšu vēlēties saņemt no apkārtējiem cieņu. Ja manu sirdi piesārņos slāpes pēc slavas un cieņas, man nešaubīgi būs jādodas uz mūžīgu elli.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra kiṅkora,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āpane jānibo,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘guru’-abhimān tyaji’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomāra uchiṣṭha,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;padajala-reṇu,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadā niṣkapaṭe bhaji\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAtsacīšanās no maldīgā priekšstata, ka esmu ‘guru’, man ļaus atklāt, ka esmu tavs pazemīgais kalps. Ar patiesu cieņu es pieņemu tava ēdiena paliekas, ak, Vaišnav. Tāpat es pielūdzu arī ūdeni, kurš mazgājis svētos putekļus no tavām lotosa pēdām.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘nije sreṣṭha’ jāni’,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;uchiṣṭhādi dāne,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ha’be abhimān bhār\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etāi śiṣya tava,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;thākiyā sarvadā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā loibo pūjā kā’ra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eJa es dalīšu citiem sava ēdiena paliekas, sākšu uzskatīt, ka es ieņemu augstāku stāvokli, un viltus lepnums mani apgrūtinās ar savu smagumu. Tādēļ, vienmēr paliekot tavam uzticīgajam skolniekam, es nepieņemšu pielūgsmi ne no viena cita.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eamānī mānada,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hoile kīrtane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;adhikār dibe tumi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomāra charaṇe,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;niṣkapaṭe āmi,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kā̐diyā luṭibo bhūmi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eJa tu dāvāsi man spēju dziedāt Svēto Vārdu, es izrādīšu cieņu citiem un necerēšu sagaidīt cieņu pret sevi. Ekstāzē es patiesi raudāšu, vārtoties pa zemi pie tavām lotosam līdzīgajām pēdām.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-narada-muni-bajaya-vina\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Nāmāṣṭakam 8 \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enārada muni,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bājāya vīṇā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘rādhikā-ramaṇa’-nāme\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma amani,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;udita hoya,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhakata-gīta-sāme\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKad dižā atbrīvotā dvēsele Nārada Munī spēlē savu vīnu, Rādhikas-Rāmana Svētais Vārds nekavējoši izpauž sevi Kunga bhaktu vidū, kad tie dzied kīrtanu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eamiya-dhārā,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bariṣe ghana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śravana-jugale giyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakata-jana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;saghane nāche,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhoriyā āpana hiyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLīdzīgi lietus mākonim, Svētais Vārds lej nektāra straumes viņu ausīs. Bhaktas, ekstāzes pārņemti un iedvesmoti, no visas sirds dejo.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emādhurī-pūra,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āsabo paśi’,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mātāya jagata-jane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeho vā kā̐de,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;keho vā nāche,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;keho māte mane mane\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVisas dzīvās būtnes, kas mīt Visumā, kļūst neprātīgas, nonākot zem šī ekstātiskā dievišķi saldās garšas lietus. Vieni raud, otri dejo, vēl citi kļūst pilnībā apskurbuši.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epañcha-vadana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nārade dhori’,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;premera saghana rol\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekamalāsana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāchiyā bole,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘bolo bolo hari bolo’\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs Šiva ar piecām sejām, ekstāzes priekā atkal un atkal skaļi kliedzot, skauj Nāradu Munī. Tikmēr Kungs Brahma ekstāzē dejo un dzied: “Sauciet visi “Harībol! Harībol!””\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esahasrānana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;parama-sukhe,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;‘hari hari’ boli gāy\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma-prabhāve,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mātilo viśva,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāma-rasa sabe pāy\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMilzīgā sajūsmā Ananta Šēša ar tūkstoš sejām dzied un sauc: “Harī! Harī!” Pateicoties šī vārda transcendentālo vibrāciju spēkam, Visums ir gremdējies neprātīgā ekstāzē un visi malko Svētā Vārda saldo garšu!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-kṛṣṇa-nāma,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rasane sphuri’,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pūrā’o āmāra āśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-rūpa-pade,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jāchaye ihā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhakativinoda-dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDejodams uz visu mēlēm, Šrī Krišnas Svētais Vārds piepildīja visas manas vēlēšanās! Tādēļ Kunga pazemīgais kalps Bhaktivinoda lūdzas pie Šrī Rūpas Gosvāmī pēdām, lai Harīnāma – Svētā Vārda dziedāšana šādā veidā turpinātos mūžam!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-krishnotkirtana-gana-nartana-parau\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śrī Ṣaḍ-Gosvāmy-aṣṭakam \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Šrīnivāss Āčārja\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛṣṇotkīrtana-gāna-nartana-parau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;premāmṛtāmbho-nidhī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhīrādhīra-janapriyau priya-karau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nirmatsarau pūjitau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-chaitanya-kṛpā-bharau bhuvi bhuvo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhārāvahantārakau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande rūpa-sanātanau raghu-yugau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-jīva-gopālakau\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCieņas pilns es klanos sešiem Gosvāmī, pazīstamiem kā Šrī Rūpa Gosvāmī, Šrī Sanātana Gosvāmī, Šrī Raghunāths Bhatta Gosvāmī, Šrī Raghunāths Dāsa Gosvāmī, Šrī Džīva Gosvāmī un Šrī Gopāls Bhatta Gosvāmī, kuri ir pastāvīgi gremdējušies dejā un Kunga Krišnas Svēto Vārdu dziedāšanā. Viņi līdzinās mīlestības uz Dievu okeānam. Viņus ciena gan cēli ļaudis, gan bezgoži, jo viņi nevienu neapskauž. Lai ko viņi darītu, tas sagādā prieku ikvienam! Pats Kungs Čaitanja apdāvinājis viņus ar visām svētībām. Sludinot viņi glābj nebrīvās dvēseles visā Visumā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enānā-śāstra-vichāraṇaika-nipuṇau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sad-dharma-saṁsthāpakau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elokānāṁ hita-kāriṇau tri-bhuvane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mānyau śaraṇyākarau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhā-kṛṣṇa-padāravinda-bhajanā-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nandena mattālikau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande rūpa-sanātanau raghu-yugau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-jīva-gopālakau\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCieņas pilns es klanos sešiem Gosvāmī, pazīstamiem kā Šrī Rūpa Gosvāmī, Šrī Sanātana Gosvāmī, Šrī Raghunāths Bhatta Gosvāmī, Šrī Raghunāths Dāsa Gosvāmī, Šrī Džīva Gosvāmī un Šrī Gopāls Bhatta Gosvāmī, kuri ir visdziļākajā veidā izstudējuši Dieva atklātos Rakstus, lai cilvēces labklājībai nostiprinātu mūžīgās reliģijas principus. Viņus slavē visās trīs pasaulēs, viņu patvērums nepieciešam
