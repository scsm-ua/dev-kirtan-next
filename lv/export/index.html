gāndharvā-govinda-līlāmṛta-lābha-āśā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKalpošana tavām pēdām, kuru mirdzums līdzinās desmit miljoniem mēnešu, uztur manu ticību. Pateicoties tavai žēlsirdībai, kādu dienu mēs malkosim Šrī Šrī Rādhas-Govindas rotaļu nektāru!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"16\"\u003e\n\u003ch5\u003e16\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eavichintya-bhedābheda-siddhānta-prakāśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esānande ārati stuti kore dīna-dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Čaitanjas Mahāprabhu atklātās Brīnišķīgās Realitātes iemiesojums! Tavs pazemīgais kalps ar prieku dzied šo lūgšanu un velta to tev!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-kali-kukkura-kadana-jadi-chao-he\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003ePrabhāti Gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kali-kukkura-kadana jadi chāo he\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekaliyuga-pāvana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kali-bhaya-nāśana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī śachī-nandana gāo he\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, mans prāts, tu līdzinies nožēlojamam Kalī laikmeta sunim! Ja tu alksti atbrīvošanu no tām briesmīgajām bailēm, kuras caurvij šo tumšo laikmetu, dziedi Šačī dēla Svēto Vārdu – jo Viņš ir glābējs!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egadādhara-mādana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nitāi-era prāṇadhana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;advaitera prapūjita gorā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enimai viśvambhara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrīnivāsa-īśvara,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhakata samūha-chitachorā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eViņš ir Gadādharas transcendentālais kupidons, pati Nitjānandas Prabhū dzīvība un dvēsele, un Šrī Advaitas Āčārjas pielūgtais Kungs! Viņš ir pazīstams kā Nīmais, jo ir dzimis zem nīma koka; Višvambhara, jo Viņš ir Visuma uzturētājs; Viņš ir Šrīvas Thākura Kungs! Viņš nolaupa visu viņam veltījušos dvēseļu sirdis!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enadīyā-śaśadhara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;māyāpura-īśvara,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāma-prabartana-śūra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egṛhījana-śikṣaka\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nyāsikula-nāyaka,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mādhava-rādhābhāva pūra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eViņš ir Nādijas mēness, Majāpuras Kungs un augstsirdīgais glābējs! Viņš atklāja visiem Krišnas Svētā Vārda dziedāšanas slavu. Viņš ir mājsaimnieku skolotājs un \u003ci\u003esannjāsī\u003c/i\u003e virspavēlnieks. Šrī Čaitanja Mahāprabhu – tas ir Krišna, Rādharānī ekstātiskās mīlas jūtu pārpilns.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esārvabhauma-śodhana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gajapati-tāraṇa,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rāmānanda-poṣaṇa-vīra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erūpānanda-vardhana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sanātana pālana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;haridāsa-modana-dhīra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eViņš attīrīja Sarvabhauma Bhattāčārju un izglāba Prataparūdru Mahārādžu, vareno Orissas valdnieku. Viņš ir Rāmanānda Raja varonis un aizstāvis. Viņš ir Šrīlas Rūpas Gosvāmī vienmēr pieaugošās laimes avots un Šrīlas Sanātanas Gosvāmī sargātājs. Par Viņu jūsmo apdomīgais Haridāsa Thākurs.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evraja rasa-bhāvana duṣṭamata-śātana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kapaṭī-vighātana-kāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśuddha bhakta-pālana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śuṣka jñāna-tāḍana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;cholo bhakti-dūṣaṇa-rāma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVrindāvanas maigā, saldā garša ir pilnībā pārņēmusi Šrī Krišnu Čaitanju. Šī saldā garša attīra prātu no netīrām domām, iznīcinot iekāri un maldus. Tā aizdzen sausas empīriskas zināšanas, kuras aizsedz skaistumu, kas piemīt nedalītai garīgai kalpošanai Dievam! Viņš aizstāv, balsta un nepagurstoši sargā sev pilnībā nodevušās dvēseles!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jashomati-nandana-vraja-vara-nagara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Nām-kīrtan \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaśomatī-nandana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vraja-vara nāgara,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gokula-rañjana kāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egopī-parāṇa-dhana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;madana manohara,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kālīya-damana-vidhāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Krišna ir mātes Jašodas mīļais dēls un Vrādžas zemes transcendentālais mīļotais. Viņu sajūsmā apbrīno visa Gokula! Viens no Viņa vārdiem ir Kāna. Viņš ir \u003ci\u003egopiju\u003c/i\u003e dzīvība un dvēsele. Viņš valdzina pašu Kupidonu un uzvar čūsku Kāliju.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;amala harinām amiya-vilāsā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evipina-purandara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;navīna nāgara-bora,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vaṁśī-badana suvāsā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKrišnas Svētie Vārdi ir nevainojami tīri, tie ir saldas garšas un skaistuma pilni. Krišna ir Vrindāvanas mežu karalis. Viņš ir vienmēr jauns un krāšņs, Viņš ir labākais no visiem mīļotajiem. Uz savas flautas Viņš spēlē saldākās melodijas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evraja-jana-pālana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;asura-kula-nāśana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nanda-godhana rākhoyālā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egovinda mādhava\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;navanīta-taṣkara,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sundara nanda-gopālā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKrišna pasargā visus Vrindāvanas mežu iemītniekus un uzvar dēmonus. Viņš gana govis un ir pazīstams kā Govinda – tas, kurš priecē gan govis, gan maņas. Viņš ir Mādhava, veiksmes dievietes vīrs. Krišna ir brīnišķais ganuzēns, Nanda Mahārādža dēls, kurš ļoti mīl zagt sviestu!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyamunā-taṭa-chara\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopī-basana-hara,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rāsa-rasika kṛpāmoya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-rādhā-vallabha\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vṛndāvana-naṭabara,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhakativinod-āśraya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePastaigājoties pa Jamūnas upes krastiem, Krišna nolaupa peldošos \u003ci\u003egopiju\u003c/i\u003e drēbes. Viņš izbauda rāsas dejas saldo garšu! Viņš ir visžēlsirdīgākais! Viņš ir vienīgais Šrīmatī Rādharanī mīļotais. Krišna ir Vrindāvanas lieliskākais dejotājs un Šrīlas Bhaktivinoda Thākura augstākais patvērums!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-udilo-aruna-puraba-bhage\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eAruṇodoya-kīrtan \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eI daļa\u003c/h3\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eudilo aruṇa pūraba-bhāge,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edvija-maṇi gorā amani jāge,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakata-samūha loiyā sāthe,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egelā nagara-brāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePirms pašas saules ausmas, kad debesis austrumos sāk sārtoties, Šrī Gauraharī, dārgakmens divreiz dzimušo vidū, mostas no miega. Kopā ar saviem bhaktām viņš uzsāk \u003ci\u003ekīrtanu\u003c/i\u003e, apstaigājot pilsētas un ciemus.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘tāthai tāthai’ bājalo khol,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eghana ghana tāhe jhāṅjera rol,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epreme ḍhala ḍhala sonāra aṅga,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echaraṇe nūpura bāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMridangas spēlē “tāthai tāthai” karatalu ritmā, Kunga zeltītais ķermenis dreb ekstāzē un Viņa kāju zvaniņi skan.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emukunda mādhava jādava hari,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebolore bolore vadana bhori’,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emiche nida-baśe gelo re rāti,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edivasa śorīra sāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMahāprabhu sauc guļošajiem ļaudīm: “Neizniekojiet naktis bezjēdzīgajam miegam un dienas savu ķermeņu rotāšanai! Sauciet skaļi vārdus Mukunda, Mādhava, Jādava un Harī!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eemona durllabha mānava-deho,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epāiyā ki koro bhāva nā keho,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eebe nā bhajile jaśodā-suta,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echarame poḍibe lāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Jūs esat ieguvuši tik ļoti reto dzimšanu par cilvēku! Taču ko gan jūs darāt? Vai jūs nemaz nenovērtējat šo reto dāvanu? Ja jūs nepielūgsiet mātes Jašodas mīļoto dēlu, milzu nelaime sagaidīs jūs nāves brīdī!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eudita tapana hoile asta,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edina gelo-boli’ hoibe byasta,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etobe keno ebe alasa hoy,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enā bhaja hṛdoya-rāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Ar katru saules ausmu un rietu paiet diena – to vairs neatgriezt! Tad kādēļ jūs esat tik slinki un atsakāties kalpot savas sirds Kungam?”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejīvana anitya jānaha sār,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etāhe nānā-vidha vipada-bhār,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāmāśroya kori’ jatane tumi,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ethākaha āpana kāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Jūs zināt, ka dzīve ir pilna ciešanu! Pieņemiet patvērumu Svētajā Vārdā – lai tiekšanās pie Tā kļūst par jūsu vienīgo nodarbi!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛṣṇa-nāma-sudhā koriyā pān\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejuḍāo bhakativinoda-prāṇ,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma binā kichu nāhiko āro,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echaudda-bhuvana-mājhe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Iemalkojiet Krišnas Svētā Vārda tīro nektāru un priecējiet ar to Thākura Bhaktivinoda dvēseli! Visās četrpadsmit pasaulēs nav nekā, pie kā būtu jātiecas, kā vienīgi pie Svētā Vārda!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejīvera kalyāṇa-sādhana-kām,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejagate āsi’ e madhura nām,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eavidyā-timira-tapana-rūpe,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehṛd-gagane birāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLai kliedētu neziņas tumsu un svētītu dvēseles visā Visumā, brīnišķais Krišnas Vārds uzausa līdzīgi mirdzošai saulei!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jiv-jago-jiv-jago-gaurachanda-bole\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eAruṇodoya-kīrttan \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eII daļa\u003c/h3\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejīv jāgo, jīv jāgo, gaurāchā̐da bole\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekota nidrā jāo māyā-piśāchīra kole\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs Gauranga sauc: “Mostieties, guļošās dvēseles! Mostieties, guļošās dvēseles! Jau tik ilgi jūs esat gulējušas raganas Majas klēpī!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhajibo boliyā ese saṁsāra-bhitore\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhuliyā rohile tumi avidyāra bhore\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Jūs esat nākušas šajā pasaulē ar vārdiem “Mans Kungs, tici man, es Tevi pielūgšu!” taču, šo solījumu aizmirsušas, jūs iegrimāt tumsonībā!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāre loite āmi hoinu avatāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāmi vinā bandhu āra ke āche tomāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Esmu nolaidies pie jums vienīgi, lai glābtu jūs! Vai jums ir kāds cits draugs, izņemot Mani?”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eenechi auṣadhi māyā nāśibāro lāgi’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehari-nāma mahā-mantra lao tumi māgi’\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Esmu atnesis līdzekli, kas atbrīvos jūs no majas ilūzijas. Jel lūdzietes pēc Harīnāma-mahā-mantras un pieņemiet to!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakativinoda prabhura-charaṇe poḍiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esei hari-nāma-mantra loilo māgiyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eThākurs Bhaktivinoda - krītot pie lotosam līdzīgajām Kunga Gaurangas pēdām un lūdzot Svēto Vārdu, saņēma mahā-mantru.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-samsara-davanala-lidha-loka\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śrī Gurvāṣṭaka \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Višvanāths Čakravartī Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esaṁsāra-dāvānala-līḍha-loka-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etrāṇāya kāruṇya-ghanāghanatvam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprāptasya kalyāṇa-guṇārṇavasya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇāravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs pielūdzu garīgā skolotāja, labvēlīgu īpašību okeāna, lotosam līdzīgās pēdas! Lai glābtu visas dzīvas būtnes – gan cienīgas, gan necienīgas, kuras cieš šīs materiālās pasaules ugunī, viņš lej savas līdzcietības straumes un tādējādi līdzinās lietus mākonim!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emahāprabhoḥ kīrtana-nṛtya-gīta-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evāditra-mādyan-manaso rasena\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eromāñcha-kampāśru-taraṅga-bhājo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇāravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs pielūdzu garīgā skolotāja lotosam līdzīgās pēdas! Viņa sirds ir neprātīga no mīlestības nektāra uz Šrīmānu Mahāprabhu kopīgi dziedot Svēto Vārdu! Kad viņš, spēlējot kholu vai karatālas, dejo un dzied, viņa ķermenis laimē trīc un no viņa acīm plūst asaru straumes.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-vigrahārādhana-nitya-nānā-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśṛṅgāra-tan-mandira-mārjanādau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyuktasya bhaktāṁś cha niyuñjato ’pi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇāravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs pielūdzu garīgā skolotāja lotosam līdzīgās pēdas! Viņš ir aizņemts dažādos garīgas kalpošanas veidos, tādos kā Dievību ģērbšana un Kunga svētā tempļa tīrīšana; līdzīgos veidos viņš iesaista kalpošanā arī citus \u003ci\u003ebhaktas\u003c/i\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echatur-vidha-śrī-bhagavat-prasāda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esvādv-anna-tṛptān hari-bhakta-saṅghān\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛtvaiva tṛptiṁ bhajataḥ sadaiva\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇāravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs pielūdzu garīgā skolotāja lotosam līdzīgās pēdas! Viņš dāvā Šrī Krišnas \u003ci\u003ebhaktām\u003c/i\u003e četru veidu nektāra \u003ci\u003eprasādu\u003c/i\u003e (kuru košļā, sūkā, laiza un dzer). Pateicoties tam, pasaulīgais valdzinājums nobāl un mostas slāpes pēc garīgas mīlestības! Kad viņš redz, kā \u003ci\u003ebhaktas\u003c/i\u003e bauda \u003ci\u003eprasādu\u003c/i\u003e, viņa sirds piepildās ar prieku!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-rādhikā-mādhavayor apara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emādhurya-līlā-guṇa-rūpa-nāmnām\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprati-kṣaṇāsvādana-lolupasya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇaravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs pielūdzu garīgā skolotāja lotosam līdzīgās pēdas! Viņa sirds neremdināmi slāpst pēc Šrī Šrī Rādha-Mādhavas Svētā Vārda, veidola, īpašībām un ar dievišķo mīlestību pārpildīto rotaļu saldās garšas nektāra!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enikuñja-yūno rati-keli-siddhyair\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyā yālibhir yuktir apekṣaṇīyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etatrāti-dākṣyād ati-vallabhasya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇāravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs pielūdzu garīgā skolotāja lotosam līdzīgās pēdas! Viņš ir bezgalīgi dārgs Dievišķajam Pārim, kurš rotaļājas Vradžas birzīs! Viņš pārzina visu, ko dara \u003ci\u003esakhī\u003c/i\u003e, lai apkalpotu Dievišķā Pāra mīlas rotaļas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esākṣād-dharitvena samasta-śāstrair\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003euktas tathā bhāvyata eva sadbhiḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekintu prabhor yaḥ priya eva tasya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇāravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs pielūdzu garīgā skolotāja lotosam līdzīgās pēdas! Neaptveramā veidā viņš vienlaicīgi ir atšķirams un neatšķirams no Visaugstā! Visi svētie Raksti slavē viņu kā neatšķiramu no Visaugstā Kunga Šrī Harī, un to atzīst arī realizētas dvēseles un svētie. Tajā pašā laikā viņu visvairāk mīl arī pats Kungs!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyasya prasādād bhagavat-prasādo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyasyāprasādāt na gatiḥ kuto ’pi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhyayaṁ stuvaṁs tasya yaśas tri-sandhyaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande guroḥ śrī-charaṇaravindam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs pielūdzu garīgā skolotāja lotosam līdzīgās pēdas, vienmēr slavējot viņu un domājot par viņu – rītā, dienā un vakarā! Tikai pateicoties viņa žēlsirdībai var iegūt Kunga žēlastību! Ja viņš ir neapmierināts ar kādu, tam nelaimīgajam vairs nerast patvērumu nekur!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrīmad guroraṣṭakam etad uchair\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebrāhme muhūrte paṭhati prayātnāt\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyas tena vṛndāvana-nātha-sākṣāt-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esevaiva labhyā januṣo ’nta eva\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTas, kurš ar tīru sirdi dzied šīs astoņas lūgšanas garīgajam skolotājam \u003ci\u003ebrahma-muhurtā\u003c/i\u003e (deviņdesmit sešas minūtes pirms saules lēkta), varēs kalpot Vrindāvanas Valdniekam!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-krishna-chaitanya-prabhu-jive-daya-kori\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚaraṇāgati - labvēlīgs aicinājums \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-kṛṣṇa-chaitanya prabhu jīve dayā kori’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esvapārṣada svīya dhāma saha avatari\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs Šrī Krišna Čaitanja, žēlsirdīgs pret dvēselēm, kopā ar saviem pavadoņiem un mājvietu tu nolaidies šajā pasaulē.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eatyanta durlabha prema koribāre dāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśikhāya saraṇāgati bhakatera prāṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTu atnāci, lai dāsni dāvātu tik reto dievišķo mīlestību, sludinot nedalītu pašatdevi, bhaktu dzīves pašu būtību.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edainya, ātmanivedana, goptṛtve varaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘avaśya rakṣibe kṛṣṇa’—viśvāsa pālana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePazemība, pašatdeve, sevis atdošana Dieva gribai, “Krišna mani noteikti pasargās” – šādas ticības uzturēšana.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakti-anukūla mātra kārjera svīkāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakti-pratikūla bhāva—varjanāṅgīkāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKalpošanai labvēlīgas darbības pieņemšana un nelabvēlīgas – noraidīšana.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eṣaḍ-aṅga śaraṇāgati hoibe jā̐hāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etā̐hāra prārthanā śune śrī-nandakumāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTo lūgšanas, kuri sniedz sevi Dievam šajos sešos veidos, nešaubīgi tiks Nandas dēla sadzirdētas!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erūpa-sanātana-pade dante tṛṇa kori’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakativinoda poḍe dui pada dhori’\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSaspiežot zobos zāles stiebriņu un krītot pie Šrī Rūpas un Šrī Sanātanas pēdām, Šrī Bhaktivinoda pazemīgi apskauj viņu svētās, lotosam līdzīgās pēdas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekā̐diyā kā̐diyā bole, āmi to’ adhama\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśikhāye śaraṇāgati karahe uttama\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eRaudot, lejot asaras, es vēršos pie viņiem: “Es esmu pats kritušākais! Lūdzu, māciet man pašatdevi, māciet man tīru kalpošanu!”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vibhavari-shiesha-aloka-praveshia\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eVibhāvarī Śeṣa \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evibhāvarī śeṣa,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āloka-praveśa,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nidrā chāḍi’ uṭho jīva\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebolo hari hari,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mukunda murāri,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rāma kṛṣṇa hayagrīva\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNakts tuvojas izskaņai un saule jau sāk aust. Mosties, ak, dvēsele, nav laika gulēt! Dziedi Kunga Harī atbrīvošanu dāvājošos Svētos Vārdus! Tā Vārdus, kurš ir dēmona Mura ienaidnieks, Augstākais Baudītājs, Visupievilcīgais, tā Vārdus, kurš nāca kā iemiesojums ar zirga galvu – Hajagrīva.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enṛsiṁha vāmana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-madhusūdana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vrajendra-nandana śyāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epūtanā-ghātana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kaiṭabha-śātana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jaya dāśarathi-rāma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs Harī iemiesojās kā pus-cilvēks, pus-lauva, Nrisimha. Viņš nāca kā pundur-\u003ci\u003ebrahmanis\u003c/i\u003e vārdā Upendra, kurš uzvarēja dēmonu Madhu. Viņš ir Vradžas karaļa, Mahārādža Nandas, mīļotais dēls, un Viņa ķermenis ir tumšā krāsā. Viņš uzvarēja raganu Putānu un iznīcināja dēmonu Kaitabhu. Visa slava Kungam Harī, kurš nāca kā Kungs Rāma, karaļa Dāšatrī dēls!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyaśodā dulāla,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;govinda-gopāla,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vṛndāvana purandara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egopī-priya-jana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rādhikā-ramaṇa,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhuvana-sundara-vara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eViņš ir Mātes Jašodas mīļais dēls. Viņš sagādā prieku govīm, zemei un garīgajām maņām. Viņš ir govju aizstāvis, Viņš ir Vrindāvanas meža valdnieks, \u003ci\u003egopīju\u003c/i\u003e un Rādhikas mīļotais, Viņš ir visbrīnišķīgākais visā Visumā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erāvāṇāntakara,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mākhona-taskara,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopī-jana-vastra-hārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evrajera rākhāla,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopa-vṛnda-pāla,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chitta-hārī baṁśī-dhārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eRāmačandras tēlā Viņš uzvarēja dēmonisko valdnieku Rāvanu. Kad viņš nāca kā Krišna, Viņš zaga no vecākajām \u003ci\u003egopījām\u003c/i\u003e sviestu un no jaunākajām \u003ci\u003egopījām\u003c/i\u003e – drēbes, kamēr viņas peldējās Jamūnā. Viņš ir Vradžas ganuzēns un visu ganuzēnu aizstāvis. Viņš laupa sirdis un nekad nešķiras no flautas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejogīndra-bandana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-nanda-nandana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vraja-jana-bhaya-hārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enavīna nīrada,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rūpa manohara,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mohana-vaṁśī-bihārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungu Krišnu, Nandas dēlu, pielūdz labākie no jogiem. Viņš kliedē visu Vradžas iemītnieku bailes. Viņa apburošais ķermenis ir svaiga negaisa mākoņa krāsā. Pastaigājoties un spēlējot savu flautu, Viņš ir neparasti pievilcīgs!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyaśodā-nandana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kaṁsa-nisūdana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nikuñja-rāsa-vilāsī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekadamba-kānana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rāsa-parāyaṇa,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vṛndā-vipina-nivāsī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eViņš ir Jašodas dēls un valdnieku Kamsas uzvarētājs. Viņš griežas Rāsas dejā Vrindāvanas birzīs. Aizrāvies ar šo deju zem kadambas koku lapotnēm, Krišna izklaidējas Vrindāvanas mežā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eānanda-vardhana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prema-niketana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;phula-śara-jojaka kāma\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egopāṅgaṇāgaṇa,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chitta-vinodana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;samasta-guṇa-gaṇa-dhāma\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eViņš dāvā laimi saviem \u003ci\u003ebhaktām\u003c/i\u003e. Krišna ir neizsīkstošs mīlestības avots. Viņš transcendentāls Kupidons, kurš ar savām ziedu bultām tēmē uz \u003ci\u003egopīju\u003c/i\u003e sirdīm, lai iekvēlinātu tajās slāpes pēc mīlestības. Viņš ir \u003ci\u003egopīju\u003c/i\u003e siržu prieks un visu pārsteidzošo īpašību mājvieta.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejāmuna-jīvana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;keli-parāyaṇa,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mānasa-chandra-chakora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma-sudhā-rasa,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gāo kṛṣṇa-jaśa,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rākho vachana mana mora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs Krišna ir Jamūnas upes dzīvība. Viņš ir vienmēr mīlas rotaļu pārņemts. Viņš ir kā mirdzošs mēness \u003ci\u003egopījām\u003c/i\u003e, kuras, līdzīgi putniem čakora, dzīvo pateicoties Mēness gaismai. Mans prāts, ak, ieklausies šajos vārdos un slavē Šrī Krišnu, dziedot Viņa Svētos Vārdus, kuri ir nektāra saldās garšas piepildīti!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-thakura-vaishnava-gana-kori-ei-nivedana\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eṬhākura-vaiṣṇava-gaṇa \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Narottams Dāsa Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eṭhākura vaiṣṇava-gaṇa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kori ei nivedana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mo boḍo adhama durāchāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edāruṇa-saṁsāra-nidhi\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāhe ḍhūbailo vidhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;keśe dhori more kara para\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSvētie Vaišnavi, kaut arī esmu kritis bezgodis, es vēršos pie jums ar lūgumu! Liktenis ir iemetis mani šajā biedējošajā atkārtojošos dzimšanu un nāvju bezdibenī! Lūdzu jūs, glābiet mani no šī bezdibeņa, izvelciet mani aiz matiem!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evidhi boḍo valavān\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;na śune dharama-jñāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadāi karama-pāśe bāndhe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enā dekhi tāraṇa leśa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jata dekhi saba kleśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;anātha kātare te̐i kānde\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMans liktenis ir tik varens, ka nespēju sadzirdēt garīgās dzīves zināšanas un vienmēr esmu sapinies \u003ci\u003ekarmas\u003c/i\u003e pavedienos. Es nespēju ieraudzīt ceļu uz glābšanu! Manu acu priekšā ir vienīgi ciešanu pasaule! Bezspēcīgs un sēru salauzts, es raudu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekāma krodha lobha moha\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mada abhimāna saha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āpana āpana sthāne ṭāne\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eaichāna āmāra mana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;phire jena andha jana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;supatha vipatha nāhi jāne\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs līdzinos aklajam, kurš nespēj atšķirt, kur ir patiesība, bet kur – maldi! Iekāre, naids, skopums, ilūzija, neprāts un lepnums bez žēlastības mētā mani šurpu turpu!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ena loinu sat mata\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;asate majilo chita\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tuyā pāye na korinu āśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enarottama dāse koy\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dekhi śuni lage bhay\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tarāiyā loho nija pāśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eManu prātu pievilināja īslaicīgs maņu apmierinājums un es neapzinājos patieso savas dzīves mērķi, tādēļ pat necentos krist pie Tavām lotosam līdzīgajām pēdām, ak, Kungs! Narottams Dāsa lūdzas: “Tagad, kad es varu redzēt un dzirdēt Vaišnavus, esmu atbrīvojies no visām bailēm.”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hari-haraye-namah-krishna-yadavaya-namah\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eNāma-Saṅkīrttan \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Narottams Dāsa Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari haraye namaḥ kṛṣṇa yādavāya namaḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyādavāya mādhavāya keśavāya namaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, Kungs Harī, Kungs Krišna, es klanos Tavā priekšā, Tevi zina kā Jādavu, Harī, Mādhavu un Kēšavu!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egopāla govinda rāma śrī madhusūdana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egiridhārī gopīnātha madana-mohana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, Gopal, Govinda, Rāma, Šrī Madhūsudana, Girīdharī, Gopinath, Mādana-mohan!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-chaitanya nityānanda śrī advaita-chandra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egadādhara śrīvāsādi gaura-bhakta-vṛnda\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVisa slava Šrī Čaitanjam Mahāprabhu un Nitjānandam Prabhū! Visa slava Mēnesim līdzīgajam Šrī Advaitam Āčārjam! Visa slava Šrī Gadādhāram Panditam un visiem Šrī Čaitanjas bhaktām ar Šrīvāsu Thākuru priekšgalā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya rūpa sanātana bhaṭṭa raghunātha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-jīva-gopāla-bhaṭṭa dāsa raghunātha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVisa slava Šrī Rūpam Gosvāmī, Sanātanam Gosvāmī, Raghunātham Bhattam Gosvāmī, Šrī Džīvam Gosvāmī, Gopālam Bhattam Gosvāmī un Raghunātham Dāsam Gosvāmī!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eei choy gosāir kori charaṇa vandana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejāhā hoite bighna-nāś abhīṣṭa pūraṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs klanos sešu Vrindāvanas Gosvāmī priekšā! Klanoties viņiem, visi garīgas kalpošanas ceļā esošie šķēršļi tiek iznīcināti un visas garīgās vēlēšanās piepildās!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eei choy gosāir jā̐ra mu̐i tā̐ra dāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etā̐-sabāra pada-reṇu mora pañcha-grāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs kalpoju tam, kurš kalpo Gosvāmī. Putekļi no viņu svētajām pēdām ir pieci mana ēdiena veidi.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etā̐dera charaṇa sebi bhakta sane vāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaname janame mora ei abhilāṣa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠāda ir mana vēlēšanās – lai dzimšanu pēc dzimšanas es dzīvotu tādu bhaktu sabiedrībā, kuri kalpo sešu Gosvāmī lotosam līdzīgajām pēdām!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eei choy gosāi jabe vraje koilā vāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhā-kṛṣṇa-nitya-līlā korilā prakāśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKad šie Gosvāmī dzīvoja Vradžā, viņi atklāja un skaidroja Šrī Rādhas un Šrī Krišnas mūžīgās rotaļas!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eānande bolo hari bhaja vṛndāvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-guru-vaiṣṇava-pade majāiyā mana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDomājot par garīgā skolotāja un svēto Vaišnavu dievišķajām pēdām, dziediet ekstāzē Kunga Harī vārdus un pielūdziet Vrindāvanas transcendentālo pasauli!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-guru-vaiṣṇava-pāda-padma kori āśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(hari) nāma-saṅkīrtana kohe narottama dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVēloties gūt Šrī Guru un Vaišnavu lotosam līdzīgo pēdu patvērumu, Narottams Dāsa dzied Svētā Vārda sankirtanu - Svētā Vārda slavu!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eDienas dziesmas\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-mahaprasade-govinde-nama-brahmani\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eMahāprasāda \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emahāprasāde govinde nāma brahmaṇi vaiṣṇave\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esvalpa pūṇya vatāṁ rājan viśvāso naiva jāyate\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTie, kam nav pietiekošu  garīgās tikumības uzkrājumu, nevarēs godāt \u003ci\u003emahāprasādu\u003c/i\u003e, Kungu Govindu, Kunga Svēto Vārdu un Vaišnavus.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eVakara dziesmas\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-jaya-jaya-gaurachander-arotiko-shobha\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī Gaura-ārati \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e(kiba)\u003cstrong\u003e jaya jaya gorācāńder āratiko śobhā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jāhnavī-taṭa-vane jaga-mana-lobhā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(jaga janer mana-lobhā)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(gaurāṅger āroti śobhā jaga janer mana-lobhā)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(nitāi gaura haribol)\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVisa slava, visa slava brīnišķajai Kunga Gauračandras pielūgšanas ceremonijai! Tā noris birzī, Džāhnavī (Gangas) upes krastā, un pievilina visas dzīvās būtnes Visumā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e(kiba)\u003cstrong\u003e dakṣiṇe nitāichā̐d bāme gadādhara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nikaṭe advaita śrīnivāsa chatra-dhara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePa labi no Kunga Gauračandras ir Kungs Nitjānanda, bet pa kreisi no Viņa – Šrī Gadādhāra. Blakus stāv Šrī Advaita, bet Šrīvāss Thākurs tur lietussargu virs Kunga galvas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e(kiba)\u003cstrong\u003e bosiyāche gaurāchā̐d ratna-siṁhāsane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(ratna-simhāsana alo korere\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bosiyāchen gaurāchā̐d ratna-siṁhāsane)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ārati korena brahmā ādi-deva gaṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(gaurāṅger āroti kore)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(brahmā ādi-deva gaṇe gaurāṅger āroti kore)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(gaurāṅgera bhakta sane gaurāṅger āroti kore)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(nitāi gaura haribol)\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs Čaitanja sēž ar dārglietām rotātā tronī, bet debesu iemītnieki, ar Kungu Brahmu priekšgalā, izpilda pielūgšanas ceremoniju, āratī.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e(kiba)\u003cstrong\u003e narahari-ādi kori chāmara ḍhulāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sañjaya-mukunda-vāsu-ghoṣa-ādi gāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(gaura guṇa gāna kore)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(sañjaya mukunda vāsu-ghoṣa gaura guṇa gāna kore)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(nitāi gaura haribol)\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNarāharī Sarakārs un citi Kunga Čaitanjas pavadoņi vēdina Viņu ar spalvu vēdekli. Citi Viņa bhaktas, ar Sandžaju Panditu, Mukundu Datu un Vāsu Ghošu priekšgalā, dzied saldu kirtanu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e(kiba)\u003cstrong\u003e śaṅkha bāje ghaṇṭā bāje bāje karatāla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;madhura mṛdaṅga bāje parama rasāla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(madhur madhur madhur bāje)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(gaurāṅger āroti kāle madhur madhur madhur bāje)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(śaṅkha bāje ghaṇṭā bāje madhur madhur madhur bāje)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(madhura mṛdanga bāje madhur madhur madhur bāje)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(nitāi gaura haribol)\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSkan gliemežnīcas, zvaniņi un karatālas, melodiski spēlē mridangas. Kirtana mūzika ir ārkārtīgi salda un ausij tīkama.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e(kiba)\u003cstrong\u003e bahu-koṭi chandra jini vadana ujjvala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gala-deśe bona-mālā kore jhalamala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(jhalmol jhalmol jhalmol kore)\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;(gaura gole bona phuler mālā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jhalmol jhalmol jhalmol kore)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/strong\u003e(nitāi gaura haribol)\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKunga Čaitanjas sejas mirdzums pārspēj miljons mēnešu spožumu, un viņa kaklā mirdz meža ziedu vītne.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e(kiba)\u003cstrong\u003e śiva-śuka-nārada preme gada-gada\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhakativinoda dekhe gorāra sampada\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs Šiva, Šukadēva Gosvāmī un Nārada Mūnī – visi viņi ir klātesoši ceremonijā un viņu balsis dreb dievišķās mīlestības skurbumā. Tā Bhaktivinoda redz izslavēto Kunga Gauračandras pielūgšanu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e(ei bār āmāy doyā koro)\u003cbr\u003e\n(ṭhākura śrī bhaktivinoda ei bār āmāy doyā koro)\u003cbr\u003e\n(ṭhākura śrī sarasvatī ei bār āmāy doyā koro)\u003cbr\u003e\n(patit-pāvan śrī gurudev ei bār āmāy doyā koro)\u003cbr\u003e\n(sapārṣada gaurahari ei bār āmāy doyā koro)\u003cbr\u003e\n(nitāi gaura haribol)\u003c/p\u003e\n\u003cp class=\"translation\"\u003eApveltiet mani ar savu žēlsirdību! Šrī Bhaktivinoda, Šrī Sarasvatī Thākur, Gurudēv – kritušo glābēj! Kungs Gauraharī ar saviem pavadoņiem, lūdzu, dāvājiet man savu žēlsirdību.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jayare-jayare-jaya-gaura-sarasvati\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Sāraswat-ārati \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhakti Rakšak Šrīdhārs Dēv-Gosvāmī Mahārādža\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejayare jayare jaya gaura-sarasvatī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakativinoda nvaya koruṇā murati\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVisa slava! Visa slava! Visa slava Šrīlam Bhaktisiddhāntam Sarasvatī Thākuram, kurš ir tuvs Šrīlam Bhaktivinodam Thākuram, un ir Šrī Gaurangas tīrās žēlsirdības iemiesojums!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprakāśile gaura-sevā bhūvana maṅgala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakatisiddhānta śuddha prajñāna ujjvala\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTu no jauna atklāji kalpošanu sevi veltot Kungam Gaurangam, un tā ir lielākā svētība Visumam. Tavas filosofiskās atklāsmes ir piepildītas ar nedalāmu uzticību Kungam un mirdz absolūtā zināšanā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erādhā-śyāma ekatanu dakṣe gorā rāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebāme rādha madhye svayaṁ śyāma-gopa jaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVisa slava Šrī Rādhai un Šjāmam (Krišnam), apvienotiem vienā ķermenī, Šrī Gaurangā, kurš ir labajā pusē! Slava Šrīmatī  Rādharānī, stāvošai kreisajā pusē! Slava Tam, kurš stāv vidū un kurš ir neviens cits kā Visaugstais Ganuzēns – Šrī Šjāmasundars.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebraja rasa nava bhāve nabadvīpe rāje\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eudāre madhura rāga abhinava sāje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVradžas (Vrindāvanas) garša jaunā noskaņojumā ir klātesoša Navadvipā. Kad šīs saldās mīlestības jūtas savienojas ar augstsirdību, tās kļūst neatkārtojami brīnišķīgas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emādhuryya kaivalya rāga brajera nirjāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprāpti parākāṣṭhā tāhe gaurāṅga vilāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMādhurja-rasa (dievišķā laulāto mīlestība) ir Vradža-dhāmas būtība, bet Šrīmāna Mahāprabhu rotaļas uznes to līdz augstākajai pilnībai.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erādhā bhāva-kānti aṅgikari’ bhālo mate\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edakṣiṇe āsana rasa garimā dekhāte\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAugstsirdīgi pieņemot Šrīmatī Rādharānī noskaņojumu un skaistumu, lai darītu redzamu sava stāvokļa slavu, viņš ieņem savu vietu labajā pusē.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erādhā-rasa-troyo-svāda rahasya proyāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enirakhi praphulla rādhā mukhe manda hāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eRedzot Krišnas rotaļīgo vēlmi iepazīt Viņas mīlestības slavu un izgaršojot Viņa brīnumaini saldo garšu, kuru, pateicoties savām transcendentālajām īpašībām, var baudīt tikai Viņa un vienlaikus pārdzīvojot laimi no Krišnas saldās mīlestības pret Viņu, Šrīmatī Rādharānī ir laimīga un savā sejā slēpj smaidu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emadhye rahi vaṁśīrave ghoṣe vaṁśīdhara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhāra sampade āmī gaurāṅga-sundara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCentrā stāvošais Vamšidhāra (Flautu Spēlējošais) prāto: “Savas Rādharānī slavā tērpts, es topu par Gaurangu Sundaru!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emadabhīṣṭha rūpa rādhāra hṛdoya mandire\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaurāṅga bhajile suṣṭhu sphūrti pāya tāre\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Mans lolotākais veidols glabājas Šrīmatī Rādharānī sirds templī. Un šī augstākā Manis izpausme var tikt sasniegta tikai pielūdzot Gaurangu.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enadīyā prakāśe Mahaprabhu gaura-nidhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epatita pāvana deve milāila vidhi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAr Kunga dievišķo gribu Visaugstais — kritušo dvēseļu glābējs, ieradās Nādijā kā visu mīļotais Šrī Gauranga Mahāprabhu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ee-rūpa ārati brahmā śambhu agochara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaura bhakta kṛpā pātra mātra siddhi sāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠāda Mahāprabhu pielūgšana ir ārpus Kunga Brahmas un Kunga Šambhī (Šivas) redzes iespējām. Tikai saņemot Kunga Gaurangas bhaktu žēlastību, var sasniegt šādu pilnību.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī svarūpa, rāmānanda, rūpa, sanātana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī raghu, jīvādi kṛpāya dekhe bhakta-jana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTikai pateicoties Šrī Svarūpa Damodāra, Šrī Rāmanānda Rāja, Šrī Rūpas, Šrī Sanātanas, Šrī Raghunātha, Šrī Džīvas Gosvāmī un viņu tuvāko biedru žēlastību, bhakta iegūst šādas redzes spējas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya guru-gaura-rādhā-govinda-sundara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaya dāo bhakta vṛnda nitya nirantara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVisa slava Šrī Guru, Kungam Gaurangam, Šrī Rādhai un brīnišķajam Kungam Govindam! Bhaktas, vienmēr un visur dziediet par Viņu slavu!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gurudeva-kripa-bindu-diya-kara-ei-dase\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eGurudeva \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egurudeva!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛpā-bindu diyā, koro’ ei dāse,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etṛṇāpekṣā ati dīna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esakala-sahane, bolo diyā koro,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enija-māne spṛhā-hīna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGurudēv, ak, dāvā man, tavam kalpam, kaut pilienu savas žēlastības. Es esmu zemāks par zāles stiebru! Es tevi lūdzu, palīdzi man un dod man spēku. Lai es, līdzīgi tev, atbrīvotos no visām savām savtīgajām vēlmēm un tieksmēm!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esakale sammān, korite śakati,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edeho nātha! jathā jatha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etobe to’ gāibo, harināma-sukhe,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eaparādha hobe hoto\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIemāci mani izrādīt katram piedienīgu cieņu! Tad, pateicoties Svētā Vārda dziedāšanai, visi mani apvainojumi tiks pilnībā iznīcināti!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekobe heno kṛpā, lobhiyā e jana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛtārtha hoibe, nātha!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśakti-buddhi-hīn, āmi ati dīn,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekoro more ātma-sātha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, mans valdniek! Kad gan tava žēlastība nāks pār to, kurš ir zaudējis prātu, kurš ir ļoti vājš un bezpalīdzīgs. Lūdzu, ļauj man būt tev blakus!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejogyatā-vichāre, kichu nāhi pāi,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomāra koruṇā-sāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekoruṇā nā hoile, kā̐diyā kā̐diyā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprāṇa nā rākhibo āra\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-namo-namah-tulasi-maharani\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī Tulasī-parikramā-gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Čandrašekhars Kavī\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enamo namaḥ tulasī mahārāṇī,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evṛnde mahārāṇī namo namaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTulasī Mahārānī, Vrinda Dēvī, es klanos tavā priekšā atkal un atkal!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enamo re namo re māiyā namo nārāyaṇi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, Narājanī, es klanos tavā priekšā atkal un atkal!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejāko daraśe, paraśe agha-nāśa-hoi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emahimā veda-purāṇe bākhāni\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePietiek uzlūkot tevi vai tev pieskarties, lai visi grēki zustu. Vēdas un Purānas tevi slavē!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejāko patra, mañjarī komala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-pati-charaṇa-kamale lapaṭāni\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhanya tulasi, pūraṇa tapa kiye,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-śālagrama-mahā-pāṭarāṇī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTavas lapas un mīkstie ziedi — mandžārī apvij Kunga Narājanas lotosam līdzīgās pēdas. Ak, Tulasī, pateicoties tavām askēzēm, tu esi kļuvusi par Šrī Šalagrāma-Šīlas godājamo sievu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edhūpa, dīpa, naivedya, āroti,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ephulanā kiye varakhā varakhāni\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echāppānna bhoga, chatriśa byañjana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebinā tulasī prabhu eka nāhi māni\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTu lej žēlsirdību pāri visiem, kas piedāvā tev vīraku, uguni, ēdienu, ziedus, pielūgsmi. Kungs nepieņem nevienu no piecdesmit sešiem dažādiem mielastiem vai trīsdesmit sešiem piedāvātajiem karijiem, ja tie tiek piedāvāti bez tulasī lapām.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśiva-śuka-nārada, āur brahmādiko,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eḍhuḍata phirata mahā-muni jñānī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echandraśekhara māiyā, terā jaśa gāoye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakati-dāna dījiye mahārāṇi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs Šiva, Šukadēvs Gosvāmī, Nārada Mūnī, visi debesu iemītnieki ar Kungu Brahmu priekšgalā, mistiķi un diženie mūnī cieņpilni apiet apkārt tev. Ak, Tulasī Mahārānī, tā tevi slavē Čandrašekhars! Dāvā viņam šo velti — sevis pilnīgu veltīšanu Dievam!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-guru-charana-padma-kevala-bhakati\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Guru-vaiṣṇava Māhātmya-gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Narottams Dāsa Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī guru charaṇa-padma, \tkevala-bhakati-sadma,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebando mui sāvadhāna mate\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejā̐hāra prasāde bhāi,\t\te bhava toriyā jāi,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-prāpti hoya jā̐hā hoite\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLotosam līdzīgās garīgā skolotāja pēdas ir vieta, kur mīt tīra garīga kalpošana. Es klanos pie viņa lotosam līdzīgajām pēdām ar rūpēm un uzmanību. Mans dārgais brāli (mans dārgais prāts)! Vienīgi pateicoties garīgā skolotāja žēlsirdībai mēs varēsim šķērsot šo materiālo pasauli.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eguru-mukha-padma-vākya, chittete koriyā aikya,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāro nā koriha mane āśā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī guru-charaṇe rati, sei se uttama-gati,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eje prasāde pūre sarvva āśā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePieņem ar visu sirdi mācības, kuras nāk no garīgā skolotāja lotosam līdzīgajām lūpām, un netiecies ne pēc kā cita. Pieķeršanās Guru pēdām ir labākais garīgās izaugsmes veids. Pateicoties savai beziemesla žēlsirdībai, viņš veldzē slāpes pēc garīgas pilnības!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;chakṣu-dāna dilā jei, \tjanme janme prabhu sei,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;divya-jñāna hṛde prokāśito\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;prema-bhakti jāhā hoite, \tavidyā vināśa jāte,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;vede gāya jā̐hāra charito\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTu esi mans kungs no dzīves dzīvē; tas, kurš dāvājis man transcendentālu redzi. Pateicoties tavai žēlsirdībai, manā sirdī sevi izpaudušas dievišķas zināšanas, kas dāvā uzticību un mīlestību un uzvar tumsonību. Vēdiskie Raksti slavē tavas īpašības.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;śrī-guru koruṇā-sindhu, \tadhama janāra bandhu,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;lokanātha lokera jīvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;hā hā prabhu koro doyā, \tdeho more pada-chāyā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;ebe jaśa ghuṣuk tribhuvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;(e adhama loilo śaraṇa)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;(tuyā pade loinu śaraṇa)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, garīgais skolotāj, žēlsirdības okeān un kritušo dvēseļu draugs! Tu esi katra skolotājs un mūsu visu dzīve! Mans valdniek, esi žēlīgs pret mani un ļauj man rast patvērumu tavu lotosam līdzīgo pēdu ēnā! Lai tava slava izplatās visās trīs pasaulēs!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(āmi) (śaraṇilam)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(abhaya śrī pada padme śaraṇilam)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(āmay) (doyā koro he)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(patit-pāvan śrī gurudev doyā koro he)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(adhama patita jene doyā koro he)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(jay gurudev)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEsmu nodevis sevi tavām lotosam līdzīgajām pēdām! Lūdzu, esi žēlsirdīgs pret mani, Šrī Gurudēv, kritušo glābēj, lūdzu, dāvā man savu žēlsirdību! Tu esi kritušo dvēseļu glābējs! Slava tev, Šrī Gurudēv!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-krishna-chaitanya-prabhu-daya-kara-more\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eSāvaraṇa-Śrī-Gaura-pāda-padme Prārthanā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Narottams Dāsa Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī kṛṣṇa chaitanya prabhu dayā kara more\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomā vinā ke dayālu jagata mājhāre\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs Šrī Krišna Čaitanja, lūdzu Tevi, dāvā man Savu žēlastību! Visā, kas radīts, nav neviena žēlastīgāka par Tevi!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epatita-pāvana-hetu tava avatāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emo samo patita prabhu nā pāibe āra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTu nāci vienīgi, lai glābtu kritušas dvēseles. Ak, Kungs, kritušāku par mani, Tu neatradīsi nekur!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehā hā prabhu nityānanda premānanda sukhī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛpā-bolokana kara āmi boḍo duḥkhī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs Nitjānanda, vienmēr dievišķās mīlestības ekstāzē, lūdzu, paver savu žēlsirdīgo skatienu uz mani, jo esmu dziļi nelaimīgs!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edayā kara sītā-pati advaita gosāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava kṛpā-bole pāi chaitanya-nitāi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDāvā savu žēlastību, Šrī Advaita Gosvāmī, Šrīmatī Sitas Thākurānī kungs! Pateicoties Tavas žēlastības spēkam, var iegūt kalpošanu Šrī Šrī Nitai-Čaitanjam.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaura premamoya tanu paṇḍit gadādhara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrīnivāsa haridāsa dayāra sāgara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Gauras mīlestības iemiesojums – Pandit Gadādhāra! Šrīvas Pandit, Haridās Thākur, jūs esat līdzcietības okeāna iemiesojums!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehā hā svarūpa sanātana rūpa raghunātha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhaṭṭa-juga śrī jīva hā prabhu lokanātha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, mani pavēlnieki Šrī Svarūpa Damodāra, Šrī Sanātana, Šrī Rūpa un Šrī Raghunātha, Šrī Raghunātha Bhatta un Šrī Gopal Bhatta! Mans valdniek, Šrī Lokhanāth Gosvāmī!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edayā kara śrī-āchārya prabhu śrīnivāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erāmachandra-saṅga māge narottama dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLūdzu, dāvā man savas svētības, mans kungs Šrī Šrinivās Āčārja! Narottāma lūdz par to, lai būtu kopā ar Šrī Rāmačandru Čakravartī.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(dayā kara prabhupāda śrī gaura prakāśa)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(tava jana kṛpā māge ei adhama dāsa)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLūdzu, dāvā man savas svētības, Šrīla Prabhupāda Sarasvatī Thākur, Šrī Gauras izpausme! Esmu kritis kalps un lūdzu tavu pavadoņu žēlastību!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vaishnava-thakura-dayara-sagara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Vaiṣṇava-mahimā-gīti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e(ohe)\u003cstrong\u003e vaiṣṇava ṭhākura,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u00
