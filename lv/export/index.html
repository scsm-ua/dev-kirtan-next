class=\"page-num\"\u003e — 192\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eVandana\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-vande-ham-shri-guroh-shri-yuta-pada-kamalam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eVandana \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evande ’haṁ śrī-guroḥ śrī-yuta-pada-kamalaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-gurūn vaiṣṇavāṁś cha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-rūpaṁ sāgrajātaṁ saha-gaṇa-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;raghunāthānvitaṁ taṁ sa-jīvam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esādvaitaṁ sāvadhūtaṁ parijana-sahitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛṣṇa-chaitanya-devaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-rādhā-kṛṣṇa-pādān saha-gaṇa-lalitā-śrī-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;viśākhānvitāṁś cha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrīla Krišnadāsa Kavirādža lūdzas: “Pazemīgi es klanos pie lotosam līdzīgajām mana iniciējošā garīgā skolotāja,  citu sludinošo garīgo skolotāju un Vaišnavu pēdām. Cieņas pilns es klanos savu šāstra guru priekšā: Šrīlas Rūpas Gosvāmī un viņa vecākā brāļa Šrīlas Sanātanas Gosvāmī, kā arī Šrīlas Raghunātha dāsa Gosvāmī un Šrīlas Džīvas Gosvāmī, priekšā. Es izrādu cieņu tiem, kas atrodas vēl augstāk – Šrī Čaitanjam Mahāprabhu, kurš nācis pie mums ar saviem atribūtiem un pavadoņiem, tādām diženām personībām kā Šrī Nitjānanda Prabhū and Šrī Advaita Āčārja. Visaugstākajā līmenī es klanos pie Šrī Šrī Rādhas un Govindas lotosu pēdām, kā arī pie visu gopiju lotosu pēdām, ar Lalitu Devī and Višakhu Devī priekšgalā!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eoṁ ajñāna-timirāndhasya jñānāñjana-śalākayā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echakṣur unmilitaṁ yena tasmai śrī-gurave namaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePielietojot dziedējošās zināšanas par saikni ar Dievu – apkārtējās pasaules pareizas uztveres ziedi, mans garīgais skolotājs atmodināja manu iekšējo redzi. Tādējādi viņš izglāba mani no neziņas tumsas un dāvāja cerību. Cieņas pilns es klanos Šrī Gurudēva priekšā.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vande-vaikuntha-vritti-stham\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŠrīla Bhakti Bimal Avadhūts Mahārādža \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evande vaikuṇṭha-vṛtti-stham\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;parama-karuṇāspadam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evimalam avadhūtākhyaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;govindāṅghari-niṣevayā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs klanos Šrīlas Bhakti Bimal Avadhūta priekšā, kurš ir Nitai-Gauras līdzcietības iemiesojums. Ar savu dižo saprātu viņš meklē neskaitāmus veidus (\u003ci\u003evaikuntha-vritti\u003c/i\u003e) kalpot Viņiem un dalīt citiem Viņu augstāko žēlastību. Viņš ir neparasts bhakta (\u003ci\u003ebhaktavadhūta\u003c/i\u003e), viņš ir tīrs (\u003ci\u003ebimal\u003c/i\u003e), jo velta sevi tikai un vienīgi kalpošanai Govindas (Krišnas) un sava guru Šrīlas Bhakti Sundar Govindas Dev-Gosvāmī Mahārādžas lotosam līdzīgajām pēdām.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-goswaminam-sudhirakhyam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŠrīla Bhakti Sudhīrs Gosvāmī Mahārādža \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egoswāminaṁ sudhīrākhyaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;govinda-preṣṭham āśraye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaura-gāthā-rataṁ nityaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrīdhara-pāda-sevanam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs pieņemu patvērumu pie Šrīlas Bhakti Sudhīra Gosvāmī Mahārādžas, Govindas (Krišnas) un Šrīlas Govinda Mahārādžas favorīta, jo viņš ir atkarīgs no nebeidzamas Gaurangas Mahāprabhu slavināšanas un ir pieņēmis mūžīgu patvērumu kalpošanā Šrīlas Šrīdhāra Mahārādžas (Šrī Rādhas otrā “es”) lotosam līdzīgajām pēdām.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-pujya-sri-guru-varga-vandita\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŠrīla Bhakti Nirmal Āčārja Mahārādža \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epūjya śrī-guru-varga-vandita\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mahā-bhāvānvitāyāḥ sadā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epaurvā paryya paramparā prachalita\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prājya pramūrttā kṛteḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakte nirmala-nirjharasya nibhṛtaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;saṁrakṣakaṁ sādaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande śrī-gurudevam ānata-śirā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āchāryya-varyyaṁ nijam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs noliecu galvu mūžībā klanoties Gurudēva – labākā no āčārjām, Šrīlas Bhakti Nirmal Āčārja Mahārādžas, priekšā. Viņš ir uzticams un modrs tīras garīgas kalpošanas straumes sargs. Šī straume plūst no mūsu slavētās Šrī Rūpanūga Guru-vargas viņu pašaizliedzīgajā sevis veltīšanā Mahābhāvai, Šrīmatī Rādharānī.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gurvabhishta-supurakam-guru-ganair\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŠrīla Bhakti Sundar Govinda Dēv-Gosvāmī Mahārādža \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egurvābhīṣṭa-supūrakaṁ guru-gaṇair\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āśīṣa-saṁbhūṣitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echintyāchintya-samasta-veda-nipuṇaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-rūpa-panthānugam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egovindābhidham ujjvalaṁ vara-tanuṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhakty anvitaṁ sundaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande viśva-guruñ cha divya-bhagavat-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;premṇo hi bīja-pradam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAr lielāko cieņu es klanos tā priekšā, kuru rotā visas Guru-vargas svētības un kurš piepilda sava guru visslēptākās vēlēšanās. Viņš ir visu patiesību zintnieks – gan tveramo, gan netveramo. Izcils Šrī Rūpas dievišķās mācības sekotājs, viņš ir pazīstams kā Šrī Bhakti Sundar Govinda. Viņa mirdzošais tēls izstaro Krišna-bhakti. Viņš ir nācis no augstākās pasaules un šajā pasaulē ticis slavēts kā patiess garīgais skolotājs, spējīgs dāvāt Dievišķās Mīlestības sēklas.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-devam-divya-tanum-suchanda-vadanam-balarka-chelanchitam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŠrīla Bhakti Rakšak Šrīdhārs Dēv-Gosvāmī Mahārādža \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhakti Sundar Govinda Dēv-Gosvāmī Mahārādža\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edevaṁ divya-tanuṁ suchanda-vadanaṁ-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bālārka-chelāñchitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esāndrānanda-puraṁ sad-eka-varanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vairāgya-vidyāmbudhim\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-siddhānta-nidhiṁ subhakti-lasitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sārasvatānām varaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande taṁ śubhadaṁ mad-eka-śaraṇaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nyāsīśvaraṁ śrīdharam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs krītu pie Šrīlas Šrīdhār-Dēva pēdām. Viņš apbur visus ar savām saldā nektāra dziesmām. Tērpts austošas saules krāsas drānās, viņš ir svēts un Kunga uzticīgo bhaktu slavēts. Viņš ir garīgo zinību okeāns, atteikšanās no pasaulīgā paraugs un pašu pilnīgāko zināšanu glabātājs. Viņš iemieso mīlestību un kalpošanu Dievam, viņš dāvā augstāko veiksmi un ir garīgās ekstāzes dārgumu lāde. Viņš ir izcilākais Šrīlas Bhaktisiddhāntas sekotājs, sannjasī vadonis, mans valdnieks un skolotājs, mans vienīgais patvērums! Ar mīlestību es klanos pie Šrīlas Šrīdhār-Dēva lotosa ziedam līdzīgajām pēdām!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-siddhanta-sarasvatiti-vidito\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eBhagavāns Šrīla Bhaktisiddhānta Sarasvatī \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhakti Rakšak Šrīdhārs Dēv-Gosvāmī Mahārādža\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-siddhānta-sarasvatīti vidito\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gauḍīya-gurv-anvaye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhāto bhānuriva prabhāta-gagane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;yo gaura-saṅkīrtanaiḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emāyāvāda-timiṅgilodara-gatān\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;uddhṛtya jīvanimān\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-prema-sudhābdhi-gāhana-sukhaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prādāt prabhuṁ taṁ bhaje\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIzcilāko Gaudija-vaišnava skolotāju vidū viņš ir pazīstams kā Šrīla Bhaktisiddhānta Sarasvatī. Kā ausmā mirdzoša saule viņš nāca, lai glābtu dvēseles, kuras sagrābusi visu aprijošā impersonālisma filosofija. Sludinot Kunga Gaurangas mācību par Kunga Krišnas Svētā Vārda dziedāšanu, viņš dāvājis iespēju grimt Šrī Krišnas, Augstākās Personības mīlestības okeānā. Šrīla Bhaktisiddhānta – mans kungs un dievišķais skolotājs. Pie viņa lotosam līdzīgajām pēdām es lūdzu mūžīgu kalpošanu viņam!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-namo-gaurakishoraya-bhaktavadhuta-murtaye\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŠrīla Gaura Kišora Dāsa Bābadžī Mahārādža \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhakti Rakšak Šrīdhārs Dēv-Gosvāmī Mahārādža\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enamo gaurakiśorāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhaktāvadhūta mūrtaye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egaurāṅghri padma-bhṛṅgāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rādhā-bhāva-niṣeviṇe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs klanos mūsu guru Šrīlas Gaura Kišora Dāsa priekšā, kurš ir tīrs bhakta un stāv augstāk par visiem sociālajiem iedalījumiem. Viņš līdzinās bitei Šrī Gaurangas pēdu lotosā un savā sirdī vienmēr kalpo Šrī Rādhai.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vande-bhaktivinodam-shri-gaura-shiakti-svarupakam\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŠrīla Bhaktivinoda Thākurs \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhakti Rakšak Šrīdhārs Dēv-Gosvāmī Mahārādža\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vande bhaktivinodaṁ śrī-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gaura-śakti-svarūpakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhakti-śāstrajña-samrājaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rādhā-rasa-sudhā-nidhim\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs klanos Šrī Thākura Bhaktivinodas priekšā, kurš ir Mahāprabhu dievišķās mīlestības iemiesojums. Viņš ir karalis Svēto Rakstu slēptās būtības pazinēju vidū. Viņš ir Šrī Rādhas garīgās kalpošanas okeāns.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gaura-vrajashritashieshair-vaishnavair-vandya-vigraham\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŠrīla Džagannātha Dāsa Bābadžī Mahārādža \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhakti Rakšak Šrīdhārs Dēv-Gosvāmī Mahārādža\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaura-vrajāśritāśeṣair\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vaiṣṇavair vandya-vigraham\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejagannātha-prabhuṁ vande\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;premābdhiṁ vṛddha-vaiṣṇavam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs pielūdzu dižā visu Vaišnavu skolotāja pēdas, kurš ir atzīts tīras garīgas kalpošanas patriarhs, visu Navadvīpas un Vrindāvanas Vaišnavu mīļotais mīlestības okeāns, Šrīla Džagannātha Prabhū.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vancha-kalpatarubhyas-cha\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eVāñchā-kalpatarubhyas’ cha \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evāñchā-kalpatarubhyas’ cha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛpā-sindhubhya eva cha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epatitānāṁ pāvanebhyo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vaiṣṇavebhyo namo namaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCieņpilns es klanos pie dižo Vaišnavu svētajām pēdām. Viņi, līdzīgi vēlmju kokiem, ir spējīgi piepildīt visas Kunga bhaktu vēlēšanās. Viņus var salīdzināt ar bezgalīgiem bez iemesla dāvātas žēlsirdības okeāniem, jo viņi glābj no pasaulīgajām ciešanām kritušas dvēseles. Es izsaku viņiem savu visdziļāko cieņu.\u003cbr\u003e\n\u003ci\u003e(Šrīla Rūpa Gosvāmī)\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epañcha-tattvātmakaṁ kṛṣṇaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhakta-rūpa-svarūpakam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhaktāvatāraṁ bhaktākhyaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;namāmi bhakta-śaktikam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs cieņpilni klanos Kungam Krišnam viņa piecos aspektos, pazīstamos kā Panča-tattva. Es godāju Šrī Gaurangadēvu, kurš nācis šajā pasaulē kā Kunga bhakta, baudot Sevis Paša mūžīgo saldumu. Es klanos Kunga Nitjānandas Prabhū priekšā. Viņš nav atšķirams no Šrī Gaurangas un vienlaicīgi ir viņa vecākais brālis. Es izsaku cieņu dižajam Šrī Advaitam Prabhū, bhakti iemiesojumam, un mūžīgajiem Kunga pavadoņiem, tādiem kā Šrīvass Pandits, jo viņi mīloši kalpo Dievam. Es cieņpilni krītu pie to bhaktu pēdām, kuri savās rokās tur patiesu pilnīgas garīgas pašatdeves spēku: Šrī Rāmānanda Rāja, Šrī Gadādhara Pandits un Šrī Svarūpa Damodāra.\u003cbr\u003e\n\u003ci\u003e(Šrīla Krišnadāsa Kavirādžs Gosvāmī)\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enamo mahā-vadānyāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛṣṇa-prema-pradāya te\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇāya kṛṣṇa-chaitanya-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāmne gaura-tviṣe namaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs klanos Kunga Gaurangas priekšā, kura dievišķais tēls mirdz zelta staros un kuram piemīt visžēlsirdīgākā Dieva iemiesojuma īpašības. Viņa garīgās rotaļas katram dāsni dāvā tīru mīlestību uz Kungu Krišnu. Viņš nav neviens cits kā pats Šrī Krišna, pazīstams Kalī laikmetā kā Šrī Krišna Čaitanja.\u003cbr\u003e\n\u003ci\u003e(Šrīla Rūpa Gosvāmī)\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jayatam-suratau-pangor\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī-Śrī-Guru-Gaurāṅga-Rādhā-Madana-Mohanjīu \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eKolkata, Sree Chaitanya Sāraswata Krishnanushilana Sangha\u003c/h3\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejayatāṁ suratau paṅgor\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mama manda-mater gatī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emat-sarvasva-padāmbhojau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rādhā-madana-mohanau\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, Šrī Šrī Rādha-Madana-Mohan, es esmu bezpalīdzīgs kroplis! Mans vājais prāts ir piekalts pretīgajiem maņu apmierināšanas objektiem. Es lūdzu Jūs, apveltiet mani ar patiesu pieķeršanos manas dzīves nenovērtējamajai bagātībai – Jūsu lotosam līdzīgajām pēdām. Un lai Jūsu svētību, tik līdzcietīgu un mīlošu, vienmēr un visur pavada uzvara!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-divyad-vrindaranya-kalpa-drumadhah\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŠrī-Šrī-Guru-Gauranga-Gandharva-Govindasundardži \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eNavadvīpa, Šrī Čaitanja Sarasvat Maths\u003c/h3\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edīvyad-vṛndāraṇya-kalpa-drumādhaḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrīmad-ratnāgāra-siṁhāsana-sthau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī gāndharvā-śrīla-govinda-devau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;preṣṭhālībhiḥ sevyamānau smarāmi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs pastāvīgi domāju par Dievišķo Pāri, Šrī Šrī Gandharva-Govinda, kuri sēž brīnišķīgā, dimantiem rotātā tronī izslavētajā Vradžas mežā zem visus prātus pievelkošā vēlmju koka. Viņi sēž pašaizliedzīgo kalpotāju – Šrī Lalitas Devi un Šrī Rūpas Mandžārī kompānijā, kā arī citu tuvu pavadoņu, tādu kā prijanarma-sakhī, sabiedrībā.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shriman-rasa-rasarambhi\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī-Śrī-Guru-Gaurāṅga-Rādhā-Gopīnāthjīu \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eHāpāniyā, Śrī Chaitanya Sāraswat Ashram\u003c/h3\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrīmān rāsa-rasārambhī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vaṁśī-vaṭa-taṭa-sthitaḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekarṣan veṇu-svanair gopīr\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gopīnāthaḥ śriye ’stu naḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Gopinātha, kurš dāvā garīgas kalpošanas garšu, stāv Jamūnas upes krastā vietā, kura pazīstama kā Vamšīvata. Uz šo vietu viņa flautas saldās skaņas vilina Vradža-dhāmas ganumeiteņu sirdis. Apburošais Kungs, atver mums savus labvēlīgos apskāvienus!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-vrindayai-tulasi-devyai\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eVṛndāyai tulasī-devyai \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evṛndāyai tulasī-devyai\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;priyāyai keśavasya cha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-bhakti-prade devi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;satyavatyai namo namaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs mūžam klanos Šrī Vrindadevī, Šrīmatī Tulasī Mahārānī, priekšā. Viņu maigi mīl pats Kungs Kešava. Es klanos Satjavatī priekšā, kura dāvā tīru kalpošanu Kungam Krišnam!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eatha natvā mantra-gurūn\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gurūn bhāgavatārthadān\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evyāsān jagat-gurūn natvā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tato jayam udīrayet\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs atkal un atkal klanos savu garīgo skolotāju priekšā – Guru, kurš iesvētīja mani dievišķajā mantrā, un visu to priekšā klanos es, kuri atklāj slēpto “Šrīmad-Bhagavatam” nozīmi. Cieņas pilns es klanos Šrī Vjāsadēva, Visuma garīgā skolotāja, priekšā, kurš devis izsmeļošus “Šrīmad-Bhāgavatam” skaidrojumus.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejayaḥ sa-parikara śrī-śrī-guru-gaurāṅga-gāndharvā-govindasundar-pādapadmānāṁ jayastu!\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLai Šrī Gurudēva, Šrīmāna Mahāprabhu un Šrī Šrī Gandharva-Govindasundara, kā arī viņu mūžīgo pavadoņu lotosam līdzīgās pēdas uzgavilē mūsu sirdīs!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-sakala-vaishnava-pade-mora-namaskara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eLūgšana Vaišnaviem \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esakala vaiṣṇava-pade mora namaskāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eithe kichu aparādha nahuka āmāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehoiyachen hoiben prabhur jato bhakta jan\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evandanā kori’ āmi sabāra charaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs cieņpilni klanos pie visu Vaišnavu lotosam līdzīgajām pēdām, lūdzot par to, lai manus centienus kalpot viņiem neskartu apvainojumu ēna. Ar cieņu es klanos pie visu esošo un topošo Vaišnavu lotosam līdzīgajām pēdām.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-krishna-chaitanya-prabhu-nityananda\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003ePañcha-tattva mantra \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-kṛṣṇa-chaitanya prabhu nityānanda\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-advaita gadādhara śrīvāsādi-gaura-bhakta-vṛnda\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDziedot Harē Krišna mahā-mantru, Svēto Vārdu ir iespējams apvainot desmit veidos, bet apvainojumi netiek ņemti vērā dziedot Panča-tattva mantru. Šrī Čaitanja Mahāprabhu ir visaugstsirdīgākais Dieva iemiesojums, jo Viņš nepieņem kritušo dvēseļu apvainojumus. Tādēļ, lai gūtu pilnīgu labumu no mahā-mantras dziedāšanas, mums vispirms jāpieņem patvērums pie Šrī Čaitanjas Mahāprabhu un viņa Harē Krišna mahā-mantru dāvājošiem pavadoņiem – Panča-tattvas.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hare-krishna-hare-krishna-krishna-krishna-hare-hare\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eHarē Krišna mahā-mantra \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīlas Šrīdhāra Mahārādžas komentārs\u003c/h4\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehare kṛṣṇa hare kṛṣṇa kṛṣṇa kṛṣṇa hare hare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehare rāma hare rāma rāma rāma hare hare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGaudija-vaišnavi Rāmas Vārdā, kuru satur Harē Krišna mantra, saskata Rādha-rāmana Rāmu. Tas nozīmē: “Krišna, kurš dāvā prieku (\u003ci\u003eraman\u003c/i\u003e) Šrīmatī Rādharanī”. Mūsu izpratnē Harē Krišna mantra satur tikai un vienīgi Krišnas apziņu un nevis Rāmas (Kunga Rāmačandras) apziņu. Šrī Čaitanjas augstākais ideāls ir vienīgi \u003ci\u003eSvajam Bhagavāns\u003c/i\u003e, \u003ci\u003eKrišna-līla\u003c/i\u003e, \u003ci\u003eRādha-Govinda-līla\u003c/i\u003e. Tāds ir patiesais Šrī Čaitanjas Mahāprabhu atnākšanas un mācības mērķis. No šāda skatupunkta Harē Krišna mantrā netiek pieminēta Ajodhjas \u003ci\u003eRāma-līla\u003c/i\u003e. Augstākā Harē Krišna mantras nozīme nav saistīta ar to... No mantras iekšējās nozīmes izpratnes ir atkarīgi mūsu garīgie panākumi... Iekšēja izpratne virzīs bhaktas pretī viņu mērķim.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hari-nama-mahamantra-sarva-mantra-sara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eDaśa-vidha Nāmāparādha \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eDesmit Svētā Vārda apvainojumi\u003c/h3\u003e\n\u003ch4\u003e(bengāļu poēma, kuru sastādīja Šrīla Bhakti Sundar Govinda Dēv-Gosvāmī Mahārādža)\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari-nāma mahāmantra sarva-mantra-sāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejādera karuṇābale jagate prachāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esei nāma-parāyaṇ sādhu, mahājana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etāhādera nindā nā koriho kadāchana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eHarē Krišna mahā-mantra ir vislabākā no visām mantrām. \u003ci\u003eSādhū\u003c/i\u003e, kuru sirdīs Svētais Vārds izpauž savas dievišķās rotaļas (\u003ci\u003enāma-parājanas\u003c/i\u003e), izplata to ar savas žēlsirdības spēku. Šie \u003ci\u003emahādžāni\u003c/i\u003e (dižās dvēseles) Kungam ir ļoti dārgi un vienīgi viņi saista mūs ar Viņa Svēto Vārdu. Nekad nekritizējiet un neatraidiet viņus.\u003cbr\u003e\nPirmais apvainojums: apvainot Kunga bhaktas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evrajendranandana kṛṣṇa sarveśvareśvara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emaheśvara ādi tāra sevana-tatpara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma chintāmaṇi kṛṣṇa-chaitanya-svarūpa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebheda-jñāna nā koribe līlā-guṇa-rūpa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVradžendra-nandana Krišna ir visu \u003ci\u003erasu\u003c/i\u003e ietvars un mūžam jaunais sākotnējais Visaugstais Kungs. Golokas Vrindāvana-dhamā Viņš ekstātiski bauda visas iespējamās garīgās attiecības (\u003ci\u003erasas\u003c/i\u003e). Viņš ir visupievilcīgais visu Dievu Dievs (Narājanas, Višnu un citu), visa un visu Kungs (\u003ci\u003eSarvešvarešvara\u003c/i\u003e). Visas Dieva ekspansijas un visi padievi ar Kungu Šivu (Mahešvaru) priekšgalā patiesi un iedvesmoti kalpo viņam, godājot Viņu par garīgas kalpošanas (\u003ci\u003etatparas\u003c/i\u003e) augstāko objektu.\u003cbr\u003e\nKunga Svētais Vārds ir transcendentāls dārgakmens, kas piepilda mūsu vēlēšanās. Tas nav atšķirams no paša Kunga Krišnas (\u003ci\u003eNāma chintāmaṇi Kṛṣṇa-Chaitanya-svarūpa\u003c/i\u003e), tādēļ nedrīkst uzskatīt, ka Kunga veidols, īpašības un dievišķās rotaļas (\u003ci\u003elīlā-guṇa-rūpa\u003c/i\u003e) ir atšķiramas no Viņa Svētā Vārda (jo tās izpaužas mūsu sirdīs pateicoties Viņa Svētajam Vārdam, kurš piepilda visas mūsu vēlēšanās).\u003cbr\u003e\nVēl citādi “\u003ci\u003eNāma chintāmaṇi Kṛṣṇa-Chaitanya-svarūpa...\u003c/i\u003e” var tulkot šādi: Šrī Krišna Čaitanja Mahāprabhu ir visizcilākā, no Svētā Vārda – Harē Krišna mahā-mantras, neatšķirama Kunga forma. Svētais Vārds spēj piepildīt visas vēlēšanās. Nedrīkst domāt, ka ir atšķirība starp Svēto Vārdu, kurš piepilda vēlēšanās, pašu Mahāprabhu un viņa formu, īpašībām un rotaļām. Šajās rotaļās Viņš parāda Svētā Vārda bezgalīgi ekstātisko dievišķo dabu un piepilda ikviena vēlēšanās, personīgi dāvājot Vradžendra-nandana Krišnas \u003ci\u003eprēmu\u003c/i\u003e visās iespējamās garīgajās attiecībās (\u003ci\u003emadhura-rasā\u003c/i\u003e utt.) caur savu Svēto Vārdu, kurš piepilda visas vēlēšanās.\u003cbr\u003e\nOtrais apvainojums: uzskatīt padievus vienlīdzīgus Visaugstajam, kā arī uzskatīt Kunga Svēto Vārdu, formu, īpašības un rotaļas par atšķirīgiem no viņa.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e“guru kṛṣṇa-rūpa hon śāstrera pramāṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eguru-rūpe kṛṣṇa kṛpā kore bhāgyavāne”\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ese gurute martya-buddhi avajñādi tyaji\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eiṣṭa-lābha kara, nirantara nāma bhaji\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eRakstos (“Šrī Čaitanja-čaritamrita”, Ādi-līla, 1.45; “Šrīmad-Bhāgavatam”, 11.17.27; u.c.) minēts, ka Gurudēvs nav atšķirams no paša Krišnas. Gurudēva formā Krišna lej savu žēlastību pār dvēselēm, kam atklājusies garīga veiksme. Tādēļ nepieciešams atraidīt ilūzijas radīto noslieci uzskatīt Gurudēvu par vienkāršu mirstīgo ar pasaulīgām tieksmēm (\u003ci\u003emrtja-buddhi\u003c/i\u003e), kā arī attiekties pret Gurudēvu ar necieņu (\u003ci\u003eavamanja\u003c/i\u003e), būt viņam neuzticīgam, nepakļauties, ienīst (\u003ci\u003eavagja\u003c/i\u003e) un apskaust (\u003ci\u003easuja\u003c/i\u003e) Gurudēvu. Jādara tieši pretējais, rūpējoties par Gurudēvu un kalpojot viņam. Viņš spēj piepildīt visas sava skolnieka vēlēšanās sasniegt augstāko mērķi – \u003ci\u003eKrišna-prēmu\u003c/i\u003e. Ar cerību un ticību nepārstājoši kalpo Svētajam Vārdam.\u003cbr\u003e\nTrešais apvainojums: apvainot Šrī Gurudēvu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśruti, śruti-mātā-saha sātvata-purāṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-nāma-charaṇa-padma kore nīrājana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esei śruti śāstra jebā karaye nindana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ese aparadhīra saṅga koribe varjana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDiev-atklātā patiesība tika nodota no Mātes Gajatrī un sasniedza savu kulmināciju Mahā-purānā – “Šrīmad-Bhāgavatam”. Šī patiesība nepārstājoši pielūdz (burtiski: piedāvā \u003ci\u003eāratī\u003c/i\u003e) Šrī Nāma Prabhū (Svētā Vārda) lotosam līdzīgās pēdas ar savām atklāsmi un apgaismību nesošajām zinībām par tīru \u003ci\u003ebhakti\u003c/i\u003e. Katrs, kurš zaimo jebkuru no Dieva atklātās patiesības rakstiem, kas veltīti tīrai garīgai kalpošanai – vai nu tieši zākājot vai izplatot tiem pretrunīgas pseido-mācības, ir apvainotājs. Vienmēr izvairies no šāda cilvēka nelabvēlīgās sabiedrības.\u003cbr\u003e\nCeturtais apvainojums: zaimot Svētos Rakstus.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enāmera mahimā sarva-śāstrete vākhāne\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eatistuti, heno kabhu nā bhāviha mane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eagastya, ananta, brahmā, śivādi satata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eje nāma-mahimā-gāthā saṅkīrtana-rata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ese nāma-mahimā-sindhu ke pāibe pāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eatistuti bole jei—sei durāchāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVisi Diev-atklātie raksti sludina Svētā Vārda slavu. Šādi slavinājumi nebūt nav pārspīlējums (\u003ci\u003eatistuti\u003c/i\u003e). Agastja, Ananta, Brahma, Šiva un visas cienīgākās, labākās un spēcīgākās personības no visas sirds mūžam \u003ci\u003esankirtanā\u003c/i\u003e slavē Svēto Vārdu. Kurš gan spēj izsmelt Svētā Vārda slavu, kas līdzinās bezgalīgam okeānam? Katrs, kurš uzdrīkstējies gānīties, ka Svētā Vārda slava ir pārspīlējums (\u003ci\u003eatistuti\u003c/i\u003e), ir grēcinieks un garīgo veiksmi (\u003ci\u003esukritī\u003c/i\u003e) zaudējis nelietis.\u003cbr\u003e\nPiektais apvainojums: uzskatīt Svētā Vārda slavu par pārspīlējumu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛṣṇa-nāmāboli nitya golokera dhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekalpita, prākṛta, bhāve—aparādhi-jana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKrišnas Svētie Vārdi ir Goloka Vrindāvanas, augstākā garīgās pasaules līmeņa, mūžīgās bagātības. Garīgā pasaule ir piepildīta ar absolūtu ekstāzi, tā izpauž sevi pati (\u003ci\u003eadhokšadža\u003c/i\u003e) un atrodas ārpus šīs materiālās pasaules (\u003ci\u003eaprākrita\u003c/i\u003e). Katrs, kurš uzskata Krišnas Svētos Vārdus par fantāzijas augļiem (\u003ci\u003ekalpita\u003c/i\u003e) vai šai pasaulei piederīgiem (\u003ci\u003eprākrita\u003c/i\u003e), ir apvainotājs.\u003cbr\u003e\nSestais apvainojums: uzskatīt, ka Svētā Vārda slava ir materiāla vai ka tā ir iedomāta.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enāme sarva-pāpa-kṣaya sarva-śāstre kaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esārā-dina pāpa kori sei bharasāya—\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eemata durbuddhi jāra sei aparādhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emāyā-pravañchita, duḥkha bhuñje niravadhi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eRaksti vispusīgi apliecina: Svētais Vārds spēj iznīcināt visus grēkus. Taču liekuļi (\u003ci\u003edurbuddhi\u003c/i\u003e) turpina visu dzīvi grēkot, cerot uz Svētā Vārda atpestījošo spēku. Viņi ir apvainotāji, kurus apmānījusi maja (kuri zaudējuši Svētā Vārda žēlastību), viņi cietīs mūžīgi.\u003cbr\u003e\nSeptītais apvainojums: grēkot paļaujoties uz Svēto Vārdu savu tā saucamo dziedāšanu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eatulya śrī-kṛṣṇa-nāma pūrṇa-rasa-nidhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etāra sama nā bhāviha śubha-karma ādi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Krišna-Nāma ir neatkārtojama \u003ci\u003erasas\u003c/i\u003e (mīlestības, ekstāzes, nektāra, attiecību ar Dievu utt.) dārgumu lāde, kas nav atšķirama no paša Kunga. Šrī Krišna-Nāma \u003ci\u003esankirtana\u003c/i\u003e ir labākais veids, kā kalpot Krišnam un apmierināt Viņu (t. i. pieņemt to, ko Dievs mums ir paredzējis). Tādēļ Šrī Krišna-Nāma atkārtošanu nevar uzskatīt par vienlīdzīgu vai salīdzināmu ar tikai nosacīti labvēlīgām materiālajām karmām, tādām kā vispārpieņemta reliģiozitāte (\u003ci\u003edharma\u003c/i\u003e), zvērestu ievērošana (\u003ci\u003evrata\u003c/i\u003e), atsacīšanās un nožēla (\u003ci\u003etjaga\u003c/i\u003e), reliģiozi rituāli un upurēšana (\u003ci\u003ehuta\u003c/i\u003e), došanās svētceļojumos, labdarība, patriotisms utt.\u003cbr\u003e\nAstotais apvainojums: uzskatīt Svētā Vārda dziedāšanu par līdzvērtīgu dievbijīgai karmai.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enāme śraddhā-hina-jana—vidhātā vāñchita\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etāre nāma dāne aparādha suniśchita\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIr cilvēki, kuri ir Dieva augstākās gribas apmānīti un tādēļ zaudējuši ticību. Viņi ir naidīgi pret Svēto Vārdu. Sniegt viņiem norādes kalpošanai Svētajam Vārdam viennozīmīgi ir apvainojums.\u003cbr\u003e\nDevītais apvainojums: tiekšanās dāvāt Svēto Vārdu neticīgajiem.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśuniyāo kṛṣṇa-nāma-māhātmya apāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eje priti-rahita, sei narādhama chāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eallaṅtā mamatā jāra antare bāhire\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśuddha kṛṣṇa-nāma tāra kabhu nāhi sphure\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTas, kurš dzird par Krišna-Nāma neierobežoto slavu, taču neizjūt mīlestību pret Dieva Svēto Vārdu – kura sirds nekūst no mīlestības pret to – ir nelabojami atsvešinājusies, kritusi dvēsele, zemākais no cilvēkiem (\u003ci\u003enarādhama čhāra\u003c/i\u003e). Krišnas tīrais Svētais Vārds (\u003ci\u003ešuddha-Krišna-Nām\u003c/i\u003e) neizpaudīs sevi tādam cilvēkam, kura domas, vārdi un rīcība ārēji un iekšēji ir saistīti ar nelabojamu pieķeršanos egoistiskajai pasaulīgajai ilūzijai “es, man un mans” (\u003ci\u003eahamta mamata\u003c/i\u003e).\u003cbr\u003e\nDesmitais apvainojums: dziedot Svēto Vārdu saglabāt savas materiālās pieķeršanās.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eei daśa aparādha koriyā varjana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejena jana kore harināma saṅkīrtana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eapūrva śrī-kṛṣṇa-prema labhya tāre hoy\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma-prabhu tāra hṛde nitya vilasay\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTās tīrās dvēseles, kas ir pārņemtas ar Harī-Nāma \u003ci\u003esankirtanu\u003c/i\u003e, izvairoties no šiem desmit Svētā Vārda apvainojumiem, izgaršo Šrī Krišnas \u003ci\u003eprēmas\u003c/i\u003e brīnumaino augli, jo Šrī Nāma Prabhū (personiskais, patvarīgais un žēlsirdīgais Svētais Vārds, neatšķirams no paša Kunga) parādās viņu sirdīs un mūžam pauž tajā savu ekstātisko formu, īpašības un rotaļas.\u003cbr\u003e\nVēl citādi šo vārsmu var tulkot šādi: Tās tīrās dvēseles, kuras piedalās personīgā Mahāprabhu Šrī Čaitanjadēva Harī-Nāma \u003ci\u003esankirtanā\u003c/i\u003e, izvairoties no šiem desmit apvainojumiem, izgaršo Krišna-prēmas neatkārtojamo augli, kuru brīvi izplata vienīgi Mahāprabhu, jo Viņš pats (Nāma Prabhū) ir viņu sirdīs un ar savu dievišķi ekstātisko rotaļu viņus aizrauj.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eRīta dziesmas\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-jaya-jaya-girirajer-arati-vishiala\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eGupta Govardhana Āratī \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhakti Sundar Govinda Dēv-Gosvāmī Mahārādža\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya jaya girirājer ārati viśāla\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī gaura-maṇḍala-mājhe bhuvana-maṅgala\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVisa slava krāšņajam Šrī Girirādža āratī! Tas norisinās Šrī Gaura-Mandalas vidū, nesot svētību visam Visumam!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekoladvīpe śobhe gupta-govardhanarūpa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evyakta hoilā śrī govinda kuṇḍe aparūpa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eApslēptais Govardhans grezni rotā Koladvīpu. Tagad tas ir izpaudis savu vienreizējo skaistumu Šrī Govinda-kundā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emālatī-mādhavī-kuñja kandare kandare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enigūḍha-nikuñja-līlā hari-manohare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTur, \u003ci\u003emālatī\u003c/i\u003e un \u003ci\u003emādhavī\u003c/i\u003e ziedu audzēs, Kungs Harī bauda savas slepenās, valdzinošās rotaļas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eapūrva kuṇḍera śobhā jena sudhābhāṇḍa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esurendra-surabhī-sevā-saubhāgya-mārtaṇḍa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKundas nesalīdzināmais skaistums ir kā aromātisks medus. Kungs Indra un dievišķā govs Surabhī spožajos labvēlīgas veiksmes staros veic savu kalpošanu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī bhakti-rakṣaka deva-gosvāmī śrīdhara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprakāśilā tava sevā dīpta manohara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrīla Bhakti Rakšaks Šrīdhārs Dēv-Gosvāmī Mahārādža dāvā savu spožo un burvīgo garīgo kalpošanu uzticībā Tev.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī chaitanya-sārasvata maṭha suśobhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyathā nitya sevā kore sārasvata-gaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Čaitanja Sarasvat Maths ir ļoti skaista vieta, kur Matha bhaktas vienmēr atrodas iekšējā garīgas kalpošanas noskaņojumā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egosvāmī śrī-raghunātha dāsere smariyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enirantara sevā kore antarmaṇā hoiyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAtceroties Šrī Raghunāthu Dāsu Gosvāmī, viņi kalpo, iegrimuši apcerīgā noskaņojumā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya gupta-govardhana divya-rasāloy\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erūpa-raghunāthānuga-bhaktera āśroy\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVisa slava apslēptajam Govardhanam, transcendentālās rasas rezervuāram! Tas ir Šrī Rūpas un Šrī Raghunātha pēdās sekojošo bhaktu patvērums.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekuliyā-prakāśa tava achintya-mahimā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edivāniśi bhakta-vṛnda kore parikramā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAr savu neizmērojamo slavu un augstsirdību Tu parādīji Kuliju (vietu, kur tiek piedoti visi apvainojumi). Dienu un nakti bhaktas te veic parikramu — apstaigā šo vietu garīgas kalpošanas noskaņojumā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esevya o sevaka-rūpe nitya parakāśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esānande ārati dekhe e adhama dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMūžam Tu sevi izpaud kā Kungu, kuru pielūdz, un kā Kungu, kurš kalpo. Kritušais kalps redz tavu āratī un izjūt milzīgu prieku!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-jaya-girirajer-arotiko-shobha\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śrī Girirāj-Govardhan Ārati \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhakti Sundar Govinda Dēv-Gosvāmī Mahārādža\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya jaya girirājer ārotiko śobhā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-vraja-maṇḍala mājhe jaga mana lobhā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVisa slava brīnišķīgajam Šrī Girirādža \u003ci\u003eāratī\u003c/i\u003e, kurš norisinās Šrī Vrādža-\u003ci\u003emandalā\u003c/i\u003e. Šis \u003ci\u003eāratī\u003c/i\u003e pievilina visas dzīvās būtnes Visumā!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epramoda-madana-līla śrī-rādhā-ramaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyathā nitya-līlā kore loye sakhī-gaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs Rādha-Ramana (Krišna, kurš sagādā baudu savai mīļotajai Rādharānī) vienmēr šajā vietā vada savas priekpilnās mīlas rotaļas Šrīmatī Rādharānī \u003ci\u003esakhī\u003c/i\u003e (draudzeņu) sabiedrībā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emālatī-mādhavī-kuñja kandare kandare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enigūḍha nikuñja-līla hari manohare\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠeit, \u003ci\u003emālatī\u003c/i\u003e ziedu un \u003ci\u003emādhavī\u003c/i\u003e liānu audzēs, norisinās brīnišķīgā Kunga Harī slepenās rotaļas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśyāma-kuṇḍa rādhā-kuṇḍa kusum sarovara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emānasa gaṅgā dāna-ghāṭī jāra abhyantara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠeit atrodas Šjāma-\u003ci\u003ekunda\u003c/i\u003e, Rādha-\u003ci\u003ekunda\u003c/i\u003e, Kusum Sarovārs, Mānasa Ganga un Dāna-ghatī.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-govinda-kuṇḍa līlāsthalī nāhi sīmā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edivāniśi-bhakta-vṛnda kore parikramā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKopā ar Šrī Govinda-\u003ci\u003ekundu\u003c/i\u003e, šīs svētās dievišķo rotaļu vietas ir bezgalīgas. Dienu un nakti bhaktas pielūgsmē tās apstaigā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘śrīdhar-svāmī-sevāśram’ parama śobhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyathā nitya-sevā kore sārasvata-gaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠeit atrodas neiedomājami skaistais Šrīdhāra Svāmī sēva-\u003ci\u003eašrams\u003c/i\u003e, kur kalpo Šrī Čaitanja Sarasvat Matha bhaktas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eabhinna śrī kṛṣṇa jñāne bhajibāra tore\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emahāprabhu samarpilā raghunātha kore\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrīmans Mahāprabhu dāvāja Šrī Raghunātham Gosvāmī Šrī Šrī Girirādžu-džiu, lai Šrī Dāsa Gosvāmī varētu pielūgt Šrī Girirādžu zinot, ka Viņš nav atšķirams no Kunga Krišnas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egosvāmī śrī-raghunātha dāsere smariyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enirantara sevā kore antarmanā hoiyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Čaitanja Sarasvat Matha \u003ci\u003ebhaktas\u003c/i\u003e pielūdz Šrī Šrī Girirādžu-džiu dziļā garīgas kalpošanas noskaņojumā un vienmēr atceras Šrī Raghunāthu Dāsu Gosvāmī.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya giri-govardhana divya-rasāloy\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erūpa-sanātana-jīva-raghunāthāśroy\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVisa slava Šrī Giri Govardhānam, kur mīt dievišķā rasa un kurā patvērumu raduši Šrī Rūpa, Sanātana, Džīva un Raghunātha Gosvāmī!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esurendra-munīndra-śiva-śuka-mahājana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edekhena ārati-śobhā durllabha-darśana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Girirādža-džiu \u003ci\u003eāratī\u003c/i\u003e reto un nenovērtējamo skaistumu vēro kungs Indra, Nārada Munī, kungs Šiva, Šukadēva Gosvāmī un visas izcilās personības!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esevya o sevaka-rūpe nitya parakāśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esānande ārati dekhe e adhama dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Šrī Girirādža-džiu mūžam pauž sevi kā Kungu, kuru pielūdz, un kā Kungu, kurš kalpo. Kritušais kalps sajūsmā vēro Šrī Girirādža-džiu \u003ci\u003eāratī\u003c/i\u003e!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-guru-maharaja-karuna-sagara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śrī Nitāi-Chaitanya-Ārati \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhakti Sundar Govinda Dēv-Gosvāmī Mahārādža\u003c/h4\u003e\n\u003ch4\u003eDzied *āratī* laikā Šrī Čaitanja Sarasvat Matha templī Džagannātha Purī\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya guru mahārāja karuṇā-sāgara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī bhakti rakṣaka deva-gosvāmī śrīdhara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVisa slava Šrīlam Guru Mahārādžam, Šrīlam Bhakti Rakšak Šrīdhāram Dēv-Gosvāmī Mahārādžam, kurš līdzinās žēlsirdības okeānam!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprakāśile nīlāchale bhuvana-maṅgala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enitāi-chaitanya-deva-sevā samujjvala\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePateicoties viņa žēlsirdībai, Šrī Šrī Nitai-Čaitanjadēvs izpauda sevi Purī-dhāmā, dāvājot svētību visai pasaulei.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egorāpreme mātoyārā nityānanda-rūpa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erasarāja mahābhāva chaitanya-svarūpa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Nitjānanda Prabhū dejo, noreibis dievišķās mīlestības ekstāzē uz Šrī Gauru, kurš ir pats Rasarādža Šrī Krišna, pieņēmis Mahābhāvas, Šrīmatī Rādharānī, sirdi un starojumu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekasita-kāñchana jini śrī-aṅga labaṇi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edu̐hu̐gale vanamālā bhāvera dolanī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAbi Kungi, līdzīgi tīram zeltam, spoži mirdz, un Viņu kaklus rotā brīnišķīgu meža ziedu virtenes.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emurachita koṭikāma rūparāsaraṅge\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emadhura nartana-bhāva varābhaya bhaṅge\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMiljoni kupidonu krīt bez samaņas pie dievišķajām Viņu Svētību pēdām lūkojoties uz Viņu skaistumu. Viņu dievišķās figūras rotaļīgi šūpojas dejas ritmā! Viņi dejo aizskarot katru sirdi un lejot žēlsirdību pār nebrīvām dvēselēm.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekoṭi-chandra-bhānuśobhā ratna-siṁhāsane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprema netre dekhe mahā-bhāgyavāna jane\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eStarojot līdzīgi miljonam mēnešu, Viņi stāv savā dārgakmeņiem rotātajā tronī. Veiksmīgas ir to bhaktu dvēseles, kuras, pateicoties savai mīlestībai, var skatīt Viņu dievišķos tēlus!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emṛdaṅga mandirā bāje suśaṅkha-dhvanita\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśruti-mauli-ratnamālā-dīpa nirājita\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e\u003ci\u003eĀratī\u003c/i\u003e laikā templī jūsmīgi skan mridangas un gliemežvāki un tiek piedāvātas lampādas ar ghī sviestu. Dažādas Vēdu daļas bhakti-jogā ir pieņēmušas katras uguntiņas veidolu un āratī laikā pielūdz Viņu Svētības.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhuvana-mohana du̐hu̐ rūpera ārati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egupta-vṛndāraṇya-vāsī dekhe niravadhi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠādu \u003ci\u003eāratī\u003c/i\u003e var redzēt tikai Navadvīpas Dhāmas iedzīvotāji un Šrī Čaitanjas dārgie pavadoņi. Katrs, kurš kļūs par tā liecinieku, tiks savaldzināts!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī svarūpa rāmānanda rūpa-sanātana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eraghunātha haridāsa gadādhara dhana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Čaitanjas dārgie pavadoņi: Šrī Svarūpa Damodārs, Rāmananda Rajs, Rūpa Gosvāmī, Sanātana Gosvāmī, Raghunāths Dāsa Gosvāmī, Haridāsa Thākurs un Gadadhārs Pandits, piedalās šajā \u003ci\u003eāratī\u003c/i\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esārvabhauma gopīnātha jīvānuga-jana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edekhena ārati-śobha durllabha-darśana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSarvabhauma Bhattāčārjas, Gopinātha Āčārjas un Džīvas Gosvāmī \u003ci\u003esampradājas\u003c/i\u003e sekotāji vēro \u003ci\u003eāratī\u003c/i\u003e, kurš citiem nav redzams.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enadīyā prakāśe nityānanda-gauranidhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epatita-pāvana-kṣetre milāila vidhi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠrī Nitjānanda un Šrī Gaura Mahāprabhu mūžīgi mīt Navadvīpas Dhāmā, Nādijā. Taču tagad, pateicoties mūsu likteņus mainošā Šrī Gurudēva žēlsirdībai, Viņu dievišķās formas ir izpaudušas sevi arī Purī-dhāmā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eavichintya nityānanda-chaitanya-prakāśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī guru-prasāde dekhe ei adhama dāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e(śrī guru-prasāde dekhe śrī govinda dāsa)\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNeizprotamā kārtā Šrī Šrī Nitai-Čaitanja ir izpauduši sevi un, pateicoties Šrī Gurudēva žēlsirdībai, šī kritusī dvēsele redz Viņu \u003ci\u003eāratī\u003c/i\u003e un piedalās \u003ci\u003esankirtanā\u003c/i\u003e!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-jaya-gurudever-arati-ujjvala\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Guru Ārati \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch3\u003eŠrīlas Bhakti Sundar Govinda Dēv-Gosvāmī Mahārādža slavināšana\u003c/h3\u003e\n\u003ch4\u003eŠrīpāds B.A. Paramahamsa Mahārādža\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;jaya jaya gurudever ārati ujjvala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;govardhana-pāda-pīthe bhuvana-maṅgala\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVisa slava mirdzošajai Šrī Gurudēva āratī ceremonijai, kura visas pasaules svētībai norisinās Govardhāna kalna pakājē.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e\u0026nbsp;śrī bhakti sundara deva prabhu śiromaṇi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;Gosvami govinda jaya ānandera khani\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVisa slava Šrī Bhakti Sundaram Govindam Gosvāmī, mūsu garīgajam skolotājam, neizsīkstošajam prieka avotam!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eājānu lambita bhuja divya kalevara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eananta pratibhā bharā divya guṇadhara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eViņa graciozās, garās rokas skar viņa ceļgalus, bet ķermenis ir brīnišķīgs un transcendentāls. Viņš ir bezgalīgs ģeniālu un transcendentālu īpašību okeāns.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaura-kṛṣṇe jāni tava abhinna svarūpa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaṁsāra tarite ebe śuddha-bhakta-rūpa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGurudēv, tu esi neatšķirams no Krišnas un Gaurangas, taču, lai glābtu šo mirstīgo pasauli, tu esi pieņēmis tīra garīga kalpotāja veidolu!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erūpānuga-dhārā tumi koro ālokita\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprabhākara sama prabhā bhuvana-vidita\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTu apmirdzi Šrīlas Rūpas Gosvāmī garīgo sekotāju līniju! Tavs spožums līdzinās saulei un apmirdz visu pasauli!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśuddha bhakti prachārite tomā sama nāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eakalaṅka indu jena dayāla nitāi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTīras mīlestības uz Dievu sludināšanā tev nav līdzvērtīgu! Tu līdzinies nevainojamam mēnesim un esi tik pat žēlsirdīgs kā Kungs Nitjānanda!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eullasita viśvavāsī labhe prema-dhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eānande nāchiyā gāhe tava guṇagaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKad līksmojošie Visuma iemītnieki iegūst Krišnas mīlestības dārgumus, viņi dejo un dzied, veltot tev slavinājumus!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esthāpilā āśrama bahu jagata mājhāre\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epāramahaṁsa-dharma-jñāna śikṣāra prachāre\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLai mācītu augstākās zināšanas un sludinātu tās ļaudīm, tu visā pasaulē esi ierīkojis daudzus ašramus.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehintyāchintya veda-jñāne tumi ādhikārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eakala saṁśaya chettvā susiddhāntadhārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTu esi visu Vēdu zintnieks – gan izprotamo, gan neizprotamo! Tu sevī glabā visas šaubas novērsošas, nevainojamas garīgas atziņas un patiesības!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eomāra mahimā gāhe goloka maṇḍale\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eitya-siddha parikare tava līlāsthale\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTevis uz mūžiem atbrīvotie kalpi slavina tevi Golokas garīgajā pasaulē, tavu rotaļu valstībā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eatita pāvana tumi doyāra samīra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003earvva-kārye sunipuṇa satya-sugambhīra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŽēlastības pilns tu glāb kritušas dvēseles. Tu esi visu kalpošanas veidu lietpratējs, tu sakņojies patiesībā un nopietnībā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epurvva lekhanī dhārā pragāḍha pāṇḍitya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eadā hāsya miṣṭa bhāśī suśila kavitva\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTavi brīnišķie, neatkārtojamie rakstītie darbi atspoguļo tavu zinību dziļumu. Tu vienmēr smaidi un tava runa ir salda, tā apstiprina tavas dzejiskās dotības, kuras nes mierinājumu sirdij.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eādhu-saṅge sadānandī sarala vinayī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eabhā-madhye vaktā śreṣṭha sarvatra vijayī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTu esi pazemīgs un tava runa ir vienkārša uztverei, bhaktu sabiedrībā tu vienmēr esi laimīgs. Garīgās pulcēšanās tu vienmēr esi labākais runātājs un visā, ko tu dari, tu vienmēr gūsti panākumus!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"14\"\u003e\n\u003ch5\u003e14\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egauḍīya gagane tumi āchāryya-bhāskara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enirantara sevāpriya miṣṭa kaṇṭhasvara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGaudija Vaišnavu debesjumā tu esi patriarhs, mirdzošs kā saule. Tu kalpo ar nemainīgu prieku un iedvesmo kalpošanai citus.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"15\"\u003e\n\u003ch5\u003e15\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra koruṇā māge trikāla vilāse\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egāndharvvikā-giridhārī sevā-mātra āśe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePagātnē, tagadnē un nākotnē – mūžīgi, mēs lūdzam tavu žēlastību! Vienīgi ar tavu žēlastību mēs varēsim iegūt kalpošanu pilnīgā pašatdevē Šrī Šrī Gandhārvika-Giridhārī!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"16\"\u003e\n\u003ch5\u003e16\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛpā koro ohe prabhu śri-gaura-prakāśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eārati koroye sadā e adhama dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, mans valdniek, Šrī Gaurangas žēlastības izpausme, lūdzu, esi žēlastīgs pret mani! Šādi, tevi pielūdzot, vienmēr lūdzas tavs nenozīmīgais kalps!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-jaya-guru-maharaja-jati-rajeshvara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Guru Ārati-stuti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhakti Sundar Govinda Dēv-Gosvāmī Mahārādža\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejaya ‘guru-mahārāja’ jati-rājeśvara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-bhakti-rakṣaka deva-gosvāmī śrīdhara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVisa slava tev, Guru Mahārādža, \u003ci\u003esannjasī\u003c/i\u003e pavēlniek, Šrīla Bhakti Rakšak Dēv-Gosvāmī Šrīdhār!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epatita-pāvana-līlā vistāri’ bhuvane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enistārilā dīna-hīna āpāmara jane\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠai pasaulei tu paudi savas rotaļas, atnākot kā kritušo dvēseļu pestītājam. Tu glābi visas ciešanu pārņemtās dvēseles, pat visnecienīgākās.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra karuṇāghana murati heriyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epreme bhāgyavāna jīva poḍe murachiyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSkatot tavu svēto veidolu, kurš iemieso dievišķu žēlsirdību, īpaši vaiksmīgas dvēseles gūst iespēju gremdēties dievišķas mīlestības ekstāzē.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esudīrgha supībya deho divya-bhāvāśray\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edivya-jñāna dīpta-netra divya-jyotirmoy\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTavs cēlais veidols dievišķo jūtu oreolā priecē mūsu acis! Tavs skatiens ir dievišķa vieduma pilns un mirdzums, kuru tu izstaro, izplatās pa visu Visumu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esuvarṇa-sūraja-kānti aruṇa-vasana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etilaka, tulasī-mālā, chandana-bhūṣaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTērpies safrāna drānās, rotāts ar \u003ci\u003etīlakām\u003c/i\u003e un krellēm no tulasī, iesvaidīts ar aromātisku sandalkoka pastu, tu mirdzi līdzīgs Saulei!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eapūrva śrī-aṅga-śobhā kore jhalamala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eaudārya-unnata-bhāva mādhurya-ujjvala\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTavs neatkārtojamais svētais tēls ir žilbinoši skaists! Tava labvēlība, līdzīga Mēness gaismai, lej pāri visiem dievišķās mīlestības gaismu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eachintya-pratibhā, snigdha, gambhīra, udāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejaḍa-jñāna-giri-vajra divya-dīkṣādhāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTavs neaptveramais talants, mīlestība, diženums un žēlsirdība sagrauj pasaulīgās zināšanas un atklāj dievišķo realitāti.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaura-saṅkīrtana-rāsa-rasera āśray\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e“dayāla nitāi” nāme nitya premamoy\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eRodot patvērumu \u003ci\u003esankirtanā\u003c/i\u003e un slavējot Zeltīto Kungu Gaurangu, ekstāzē, mīlestības pārpilns tu sauc: “Dojal Nitaj, Dojal Nitaj!”.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esāṅgopāṅge gaura-dhāme nitya-parakāśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egupta-govardhane divya-līlāra-vilāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAr saviem pavadoņiem mūžam mītot Navadvīpas Dhamā, pēc savas vēlēšanās, tu baudi savas augstās rotaļas Gupta-Govardhanā (slēptajā Govardhana kalnā).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egauḍīya-āchārya-goṣṭhī-gaurava-bhājana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egauḍīya-siddhāntamaṇi kaṇṭha-vibhuṣaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTu pelnīti aizņem tik augstu stāvokli Gaudija-\u003ci\u003eāčārju\u003c/i\u003e vidū! Tu līdzinies pērlei Gaudija-\u003ci\u003esiddhantas\u003c/i\u003e dārgumu lādē.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egaura-sarasvatī-sphūrta siddhāntera khani\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāviṣkṛta gāyatrīra artha-chintāmaṇi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTu esi pats Šrī Gauras vēstījuma iemiesojums, pilnīgu slēdzienu avots. Tu atklāji Gājatrī – visas vēlēšanās piepildošā filosofu akmens, iekšējo nozīmi!.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eeka-tattva varṇanete nitya-nava-bhāva\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esusaṅgati, sāmañjasya, e saba prabhāva\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKad tu runā par kādu tēmu, tu vienmēr atklāj to jaunā gaismā! Tava garīgā varenība ir tavā pilnīgajā izpratnē par to, kā ieņemt pareizo stāvokli un atrasties harmonijā ar apkārtējo.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra satīrtha-varga sabe eka-mate\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erūpa-sarasvatī-dhārā dekhena tomāte\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVisi tavi garīgie brāļi vienbalsīgi sludina, ka redz tevī Rūpas Gosvāmī un Sarasvatī Thākura mācības iemiesojumu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"14\"\u003e\n\u003ch5\u003e14\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etulasī-mālikā-haste śrī-nāma-grahaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edekhi’ sakalera hoy ‘prabhu’ uddīpana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSkatot, kā tu sauc Svēto Vārdu ar tulasī krellēm rokās, visi atminas Sarasvatī Thākuru.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"15\"\u003e\n\u003ch5\u003e15\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekoṭī-chandra-suśītala o pada bharasā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e
