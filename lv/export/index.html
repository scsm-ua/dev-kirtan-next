3e\n\u003cp class=\"translation\"\u003e“Visa slava Krišnas Svētā Vārda dziedāšanai! Tā atdzīvina Bhaktivinodas dvēseli. Svētā Vārda dziedāšana ir mīlestības uz Dievu dārgumu lāde.”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-tuhu-daya-sagara-tarayite-prani\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam 2 \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003cp class=\"translation\"\u003eOtrais Šrī Šikšāštakam pants ir šāds:\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enāmnām akāri bahudhā nija-sarva-śaktis\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etatrārpitā niyamitaḥ smaraṇe na kālaḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eetādṛśī tava kṛpā bhagavan mamāpi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edurdaivam īdṛśam ihājani nānurāgaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Kungs, tavs Svētais Vārds dāvā labvēlību visiem un ikvienam. Tev ir neskaitāmi vārdi, tādi kā Krišna un Govinda, kuros tu sevi izpaud. Savos vārdos Tu esi ielicis visu savu transcendentālo spēku. Lai dziedātu tavus vārdus nav jāievēro nekādi īpaši nosacījumi attiecībā uz vietu un laiku. Pateicoties savai beziemesla žēlsirdībai, Tu esi nonācis šajā pasaulē dievišķas skaņas formā, taču, man par lielu nelaimi, tavs Svētais Vārds mani nesaista.”\u003cbr\u003e\n\u003ci\u003ePaskaidrojums grāmatā: \u003ca href=\"https://krishnasearch.com/#/book/en-GoldenVolcanoofDivineLove?c=13\u0026p=10\" target=\"_blank\"\u003eThe Golden Volcano of Divine Love. Part II Śikṣāṣṭakam: Unlimited Names of God\u003c/a\u003e.\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etuhu̐ dayā-sāgara tārayite prāṇī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma aneka tuyā śikhāoli āni\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, Kungs! Tu esi žēlsirdības okeāns. Lai glābtu kritušas dvēseles, Tu atnesi mācību par savu neskaitāmo Svēto Vārdu slavu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esakala śakati dei nāme tohārā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egrahaṇe rākholi nāhi kāla-vichārā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTu piešķīri visu savu varenību Svētajam Vārdam! Nav nekādu priekšrakstu, kas noteiktu piemērotu vietu un laiku Svētā Vārda dziedāšanai.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-nāma-chintāmaṇi tohāri samānā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebiśve bilāoli karuṇā-nidānā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSvētais Vārds ir \u003ci\u003ečintāmanī\u003c/i\u003e, dievišķais filosofu akmens, kurš nav atšķirams no tevis! Pateicoties savai žēlsirdībai pret visām dvēselēm, Tu izplatīji savu Svēto Vārdu pa visu Visumu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etuyā dayā aichana parama udārā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eatiśoya manda nātha! bhāga hāmārā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTāda ir tava želsirdība, ak, Kungs. Tu esi bezgalīgi labsirdīgs. Taču, ak, Kungs, es esmu augstākajā mērā nožēlojams un nelaimīgs.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enāhi janamalo nāme anurāga mora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhaktivinoda-chitta duḥkhe bibhora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eManī nekad nav bijis ne kripatiņas pieķeršanās tavam Svētajam Vārdam. Tādēļ Bhaktivinoda sirds ir skumju pilna.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-krishna-kirtane-jodi-manasa-tohara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam 3 \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003cp class=\"translation\"\u003eTrešais Šrī Šikšāštakam pants ir šāds:\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etṛṇād api sunīchena\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etaror iva sahiṣṇunā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eamāninā mānadena\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekīrtanīyaḥ sadā hariḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTas, kurš ir pazemīgāks par zāli, kurš kā koks visu pieņemoši pacieš, ciena citus un negaida cieņu ne no viena, tam piemīt visas īpašības, lai vienmēr slavētu Krišnas Svēto Vārdu.\u003cbr\u003e\n\u003ci\u003ePaskaidrojums grāmatā: \u003ca href=\"https://krishnasearch.com/#/book/en-GoldenVolcanoofDivineLove?c=14\u0026p=8\" target=\"_blank\"\u003eThe Golden Volcano of Divine Love. Part II Śikṣāṣṭakam: Humbler Than a Blade of Grass\u003c/a\u003e.\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-kṛṣṇa-kīrtane jodi mānasa tohāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eparama jatane tā̐hi lobho adhikāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eJa tavs prāts vienmēr būs gremdējies Svētā Vārda atkārtošanā, tu iegūsi patiesai tā dziedāšanai nepieciešamās īpašības.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eṭṛṇādhika hīna, dīna, akiñchana chāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāpane mānobi sadā chāḍi’ ahaṅkāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBūdams pazemīgāks par zāles stiebru, uzskatīdams sevi par necienīgu un nožēlojamu, atmet savu viltus ego.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evṛkṣa-sama kṣamā-guṇa karabi sādhana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epratihiṁsā tyaji anye karabi pālana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEsi kā koks, kas visu atnākošo pieņemoši panes. Esi iecietīgs, piedod un aizmirsti, atsakies no varmācības. Rūpējies par citiem un aizsargā viņus.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejīvana-nirvāhe āne udvega nā dibe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epara-upakāre nija-sukha pāsaribe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDzīvo, nesagādājot raizes apkārtējiem. Dari labu, nedomājot par savu labklājību vai laimi.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehoile-o sarva-guṇe guṇī mahāśoya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epratiṣṭhāśā chāḍi kara amānī hṛdoya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCēlai dvēselei, kurai piemīt visas šīs īpašības, nevajadzētu lepoties ar savu svētumu, bet gan, atraidot uzslavas un cieņas apliecinājumus, tai vajadzētu vienmēr palikt pazemīgai.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekṛṣṇa-adhiṣṭhān sarva-jīve jāni sadā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekarabi sammāna sobe ādare sarvadā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eZinot, ka Krišna mīt katras dzīvas būtnes sirdī, tev citiem vienmēr jāizrāda piedienīga cieņa un gods.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edoinya, dayā, anye mān, pratiṣṭhā-varjan\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echāri guṇe guṇī hoi karaho kīrtan\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePazemība, žēlsirdība, cieņa pret citiem, atteikšanās no uzslavām un stāvokļa sabiedrībā — tās ir četras īpašības, kuras nepieciešamas \u003ci\u003ekīrtanam\u003c/i\u003e - Svētā Vārda atkārtošanai.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakativinoda kā̐di bole prabhu-pāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eheno adhikāra kobe dibe he āmāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBhaktivinoda, raudot pie Kunga lotosam līdzīgajām pēdām, lūdzas: “Mans Kungs, ak, kad gan Tu dāvāsi man īpašības, kuras nepieciešamas \u003ci\u003eKrišna-kīrtanam\u003c/i\u003e?”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-prabhu-tava-pada-juge-mora-nivedana\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam 4 \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003cp class=\"translation\"\u003eCeturtais Šrī Šikšāštakam pants ir šāds:\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ena dhanaṁ na janaṁ na sundarīṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekavitāṁ vā jagad-īśa kāmaye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emama janmani janmanīśvare\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhavatād bhaktir ahaitukī tvayi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Kungs, es netiecos pēc dārgumu uzkrāšanas, sekotājiem, skaistām sievietēm un pat ne pēc glābšanas. Mana vienīgā lūgšana ir par nebeidzamu kalpošanu uzticībā Tev, dzīvi pēc dzīves.”\u003cbr\u003e\n\u003ci\u003ePaskaidrojums grāmatā: \u003ca href=\"https://krishnasearch.com/#/book/en-GoldenVolcanoofDivineLove?c=15\u0026p=8\" target=\"_blank\"\u003eThe Golden Volcano of Divine Love. Part II Śikṣāṣṭakam: Unalloyed Devotion\u003c/a\u003e.\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eprabhu tava pada-juge mora nivedana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāhi māgi deho-sukha, vidyā dhana, jana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs, pazemībā un paklausībā es krītu pie tavām lotosam līdzīgajām pēdām. Es nelūdzu tev jutekliskas baudas, zināšanas, bagātību vai pēcnācējus.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enāhi māgi svarga, āro mokṣa nāhi māgi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enā kori prārthanā kono vibhūtira lāgi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs nelūdzu dzīvi uz paradīzes planētām, man nevajag atbrīvošanu no šīs materiālās esības. Es nelūdzu arī mistiskas spējas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enija-karma-guṇa-doṣe je je janma pāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejanme janme jeno tava nāma-guṇa gāi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLai arī kāda dzimšana man būtu jāpieņem atbilstoši manai pagātnes rīcībai, es lūdzos, lai Tu vienīgi ļauj man dzīvi pēc dzīves dziedāt tavu Svēto Vārdu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eei mātra āśā mama tomāra charaṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eahaitukī bhakti hṛde jāge anukṣaṇe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠāda ir mana vienīgā cerība, mana kvēlākā vēlēšanās, mana lūgšana, vēršanās pie tavām lotosa pēdām — lai  garīgas kalpošanas straume nepārstājoši atmostas manā sirdī un plūst pie tevis.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebiṣoye je prīti ebe āchoye āmāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esei-mata prīti hauk charaṇe tomāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLai es iemīlu tavas lotosam līdzīgās pēdas tik pat ļoti, cik ļoti es šobrīd mīlu jutekliskās baudas. Pārvirzi manu pieķeršanos no jutekļu objektiem uz tavām lotosa pēdām.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evipade sampade tāhā thākuka samabhāve\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edine dine bṛddhi hauk nāmera prabhāve\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLai veiksmē, laimē vai bēdās es vienmēr palieku nosvērts. Lai Svētā Vārda ietekmē mana pieķeršanās tev aug dienu no dienas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epaśu-pakṣī hoye thāki svarge bā niroye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava bhakti rahu bhaktivinoda-hṛdoye\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLai es kļūstu par putnu vai zvēru, lai dzīvoju paradīzē vai ellē, bet ļauj pazemīgajam Bhaktivinodam savas sirds dziļumos vienmēr lolot mīlošu garīgu kalpošanu tev.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-anadi-karama-phole\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam 5 \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003cp class=\"translation\"\u003ePiektais Šrī Šikšāštakam pants ir šāds:\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eayi nanda-tanuja kiṅkaraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epatitaṁ māṁ viṣame bhavāmbudhau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛpayā tava pāda-paṅkaja-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esthita-dhūli-sadṛśaṁ vichintaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Ak, Mahārādža Nandas dēls, es esmu tavs mūžīgais kalps, taču savas karmas dēļ esmu iekritis šajā dzimšanu un miršanu bezdibenī. Lūdzu, pieņem šo kritušo dvēseli, lai es kļūstu par putekli pie tavām lotosu pēdām.”\u003cbr\u003e\n\u003ci\u003ePaskaidrojums grāmatā: \u003ca href=\"https://krishnasearch.com/#/book/en-GoldenVolcanoofDivineLove?c=16\u0026p=8\" target=\"_blank\"\u003eThe Golden Volcano of Divine Love. Part II Śikṣāṣṭakam: King of the Land of Love\u003c/a\u003e.\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eanādi karama-phole,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;poḍi bhavārṇava-jole,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;toribāre nā dekhi upāy,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ee-viṣoya-holāhole,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;divā-niśi hiyā jvole,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mon kobhu sukha nāhi pāy\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eManas savtīgās darbības, kurām nav sākuma, ir ievilkušas mani materiālās esības briesmu pilnajā bezdibenī. Man nav glābiņa! Dienu un nakti manu sirdi dedzina pasaulīgo nodarbju inde, tādēļ mans prāts nekad nespēj būt patiesi laimīgs.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eāśā-pāśa-śata-śata\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kleśa deya abirata,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pravṛti-ūrmira tāhe khelā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekāma-krodha-ādi choy,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bāṭapāḍe dey bhoy,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;abasāna hoilo āsi belā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNeskaitāmi simti vēlmju ir pārņēmušas mani, tās ieved mani nebeidzamās bēdās un mētā mani turpu šurpu pa vienmēr augošā materiālisma kāres viļņiem. Iekāre, dusmas, skopums, lepnība, ilūzija un skaudība uzdzen man bailes līdzīgi sešiem lielceļa laupītājiem. Šādi mana dzīve tuvojas noslēgumam.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejñāna-karma—ṭhāga dui,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;more pratāriyā loi,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;avaśeṣe phele sindhu-jole\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ee heno somoye, bandhu,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tumi kṛṣṇa kṛpā-sindhu\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛpā kori’ tolo more bole\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDivi laupītāji — intelektuālas zināšanas un savtīgas darbības,  ir noveduši mani no ceļa un iemetuši ciešanu bezdibenī. Šobrīd, dārgais Krišna, Tu esi mans vienīgais glābiņš. Tu esi žēlastības okeāns. Lūdzu tevi, esi labsirdīgs un glāb mani.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epatita-kiṅkore dhori’,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pāda-padma-dhūli kori’,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;deho bhaktivinode āśroy\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāmi tava nitya-dās\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhuliyā māyāra pāś,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;baddha ho’ye āchi dayāmoy\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEsmu tavs mūžīgais kalps, ak, žēlsirdīgais Kungs. Kopš neatminamiem laikiem aizmirsis par to, tagad esmu sapinies ilūzijas tīklos. Pieņem savu kritušo kalpu, dāvā viņam vietu tavu lotosa pēdu putekļos. Dod savu pajumti pazemīgajam Bhaktivinodam.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-aparadha-phole-mama\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam 6 \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"translation\"\u003eSestais Šrī Šikšāštakam pants ir šāds:\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enayanaṁ galad-aśru-dhārayā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evadanaṁ gadgada-ruddhayā girā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epulakair nichitaṁ vapuḥ kadā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava nāma-grahaṇe bhaviṣyati\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Kungs, kad gan no manām acīm sāks plūst nebeidzamas asaru straumes un balss sāks trīcēt ekstāzē? Kad gan mati uz mana ķermeņa sacelsies stāvus dziedot tavu Svēto Vārdu?”\u003cbr\u003e\n\u003ci\u003ePaskaidrojums grāmatā: \u003ca href=\"https://krishnasearch.com/#/book/en-GoldenVolcanoofDivineLove?c=17\u0026p=8\" target=\"_blank\"\u003eThe Golden Volcano of Divine Love. Part II Śikṣāṣṭakam: Hankering for Perfection\u003c/a\u003e.\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eaparādha-phole mama\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chitta bhela vajra sama\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tuyā nāme nā lobhe bikāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehatāś hoiya hari\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tava nāma ucha kori\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;boḍo duḥkhe ḍāki bāro bāro\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, Kungs Harī, iepriekšējās dzīvēs veikto apvainojumu dēļ, mana sirds ir kļuvusi nežēlīga kā zibens spēriens. Es nejūtu neko dziedot tavus Svētos Vārdus. Vīlies un izmisis, lielā nelaimē es atkal un atkal skaļi saucu tavu Vārdu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edīna dayāmoy karuṇā-nidān\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhāva-bindu dei rākhoho parāṇ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs, Tu esi līdzcietīgs pret kritušām dvēselēm, žēlsirdība ņem savu sākumu tevī. Lūdzu, dāvā man pilienu dievišķas ekstāzes un glāb manu dzīvi.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekobe tuyā nāma-uchāraṇe mor\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enayane jharabo daro daro lor\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, kad gan nebeidzamas asaru straumes sāks tecēt no manām acīm, ekstāzē dziedot tavu Vārdu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egada-gada-svara kaṇṭhe upajabo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emukhe bolo ādha ādha bāhirābo\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, kad gan aprausies mana balss, bet runa kļūs nesakarīga un neskaidra no dievišķiem pārdzīvojumiem?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epulake bharabo śorīra hāmāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esveda-kampa-stambha hobe bāro bāro\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, kad gan mati uz mana ķermeņa sacelsies stāvus no apdullinošas ekstāzes? Kad mani pārņems drudzis un no dievišķās mīlestības pārdzīvojumiem sāks līt sviedri? Kad gan visas šīs ekstāzes pazīmes pārņems mani?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebibarṇa-śorīre hārāobu̐ jñāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma-samāśraye dharobu parāṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, kad gan mans ķermenis ekstāzē nobālēs? Kad es zaudēšu samaņu? Un kad gan beidzot visa mana dzīve būs Svētā Vārda patvērumā?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emilabo hāmār kiye aiche dina\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eroye bhakativinoda mati hīna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBhaktivinoda, zaudējis saprātu raudot sauc: “Kad gan pienāks šī ilgi gaidītā diena?”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gaite-gaite-nama-ki-doshia-hoilo\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam 7a \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003cp class=\"translation\"\u003eSeptītais Šrī Šikšāštakam pants ir šāds:\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyugāyitaṁ nimeṣeṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003echakṣuṣā prāvṛṣāyitaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśūnyāyitaṁ jagat sarvaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egovinda-viraheṇa me\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Govinda, bez tevis pasaule ir tukša! Asaras nebeidzamām straumēm plūst no manām acīm un katrs mirklis līdzinās bezgalībai!”\u003cbr\u003e\n\u003ci\u003ePaskaidrojums grāmatā: \u003ca href=\"https://krishnasearch.com/#/book/en-GoldenVolcanoofDivineLove?c=18\u0026p=8\" target=\"_blank\"\u003eThe Golden Volcano of Divine Love. Part II Śikṣāṣṭakam: Forever Without You\u003c/a\u003e.\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egāite gāite nāma ki dośā hoilo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘kṛṣṇa-nitya-dāsa mui’ hṛdoye sphurilo\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePie kā esmu nonācis atkal un atkal dziedot Svēto Vārdu? Savā sirdī esmu atklājis: “Es esmu Krišnas mūžīgais kalps!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejānilām māyā-pāśe e jaḍa-jagate\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egovinda-virahe duḥkha pāi nānā-mate\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs atskārtu, ka esmu šajā pelēkajā materiālajā Visumā majas virvju sasiets un neizturami ciešu atšķirtībā no Kunga Govindas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eāro je saṁsāra mora nāhi lāge bhālo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekā̐hā jāi kṛṣṇa heri e chintā biśālo\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNekas šajā dzimšanu un nāvju pasaulē man īpaši nepatīk. Kur gan man doties, lai ieraudzītu Krišnu? Šīs ir manas lielākās raizes.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekā̐dite kā̐dite mora ā̐khi-boriṣoya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebarṣā-dhārā heno chakṣe hoilo udoya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs neapturami raudu. Gluži kā lietus musonu periodā, man no acīm plūst asaras.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enimeṣa hoilo mora śata-juga-sam\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egovinda-viraha āra sohite akṣam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTagad viens mirklis man ir kā simts mūžības. Atšķirtība no Kunga Govindas man vairs nav izturama.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśūnya dharā-tala,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chaudike dekhiye,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;parāṇa udāsa hoya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eki kori, ki kori,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sthira nāhi hoya,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jīvana nāhiko roya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePasaule ir tukša. Es lūkojos uz visām pusēm, taču visapkārt ir vien tukšums. Mana dzīve ir tukša, prāts ir vienaldzīgs. Nekas nerada manī prieku. Esmu salauzts un vientuļš, dzīve ir zaudējusi jēgu. Ko man iesākt? Esmu zaudējis mieru un nespēju vairs turpināt šo dzīvi.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evraja-vāsi-gaṇa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mora prāṇa rākho\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dekhāo śrī-rādhā-nāthe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakativinoda-\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;minati māniyā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;laohe tāhāre sāthe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVrindāvanas iedzīvotāji, glābiet jel mani — parādiet man Rādhanāthu, Šrī Rādhas Kungu! Kungs, sadzirdi šo pazemīgo Bhaktivinoda lūgšanu, dāvā man savu sabiedrību un paņem mani sev līdzi.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī kṛṣṇa-viraha āro sohite nā pāri\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eparāṇa chāḍite āro din dui chāri\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNespējot ilgāk paciest atšķirtību no mana Kunga, esmu gatavs atvadīties no dzīves kaut pēc dažām dienām.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gaite-govinda-nam-upajilo-bhava-gram\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam 7b \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egāite ‘govinda’-nām,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;upajilo bhāva-grām,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dekhilām yamunāra kūle\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evṛṣabhānu-sutā-saṅge,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śyāma-naṭa-boro-raṅge,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bā̐śarī bājāya nīpo-mūle\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKad es dziedāju Govindas Vārdu, manī sacēlās ekstātisku pārdzīvojumu vētra. Jamūnas upes krastā es ieraudzīju Sundar-šjāmu, labāko no dejotājiem, ar Šrī Rādhu, karaļa Vrišabhanū meitu. Aizrāvies mīlestībā uz Šrī Rādhu, viņš spēlēja savu flautu blakus dīķim zem kadambas koka, kurš dāvāja ēnu dievišķajam pārim.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edekhiyā jugala-dhana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;asthira hoilo mana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jñāna hārā hoilu̐ tokhon\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekoto-kṣane nāhi jāni,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jñāna-labha hoilo māni,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āro nāhi bhelo daraśan\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eVērojot šo skatu es sastingu. Es zaudēju maņas! Es noģību, zaudējot laika izjūtu. Taču, kad es pamodos, Dievišķais Pāris jau bija zudis. Vradža, kuru redzēju, bija zudusi.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-sakhi-go-kemote-dhoribo-paran\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam 7c \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esakhi go kemote dhoribo parāṇ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enimeṣa hoilo jugera samān\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMana dārgā draudzene! Kā gan es varu turpināt dzīvot? Ikviens mirklis līdzinās veselai mūžībai.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrāvaṇera dhārā,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ā̐khi-bariṣoy,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śūnya bhelo dharā-tala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egovinda-virahe,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prāṇa nāhi rohe,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kemone bā̐chibo bolo\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAsaras no manām acīm tek un līdzinās Šrāvana mēneša lietus straumēm. Visa pasaule ir kļuvusi tukša. Es vairs nespēju dzīvot atšķirtībā no Govindas. Lūdzu, pasaki — kā lai dzīvoju tālāk?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakativinoda,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;asthira hoiyā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;punaḥ nāmāśroya kori’\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eḍāke rādhānātha,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;diyā daraśana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prāṇa rākho, nahe mori\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eZaudējis mieru, Bhaktivinoda atkal meklē Svētā Vārda patvērumu un sauc: “Rādhas Kungs! Dāvā man saskarsmi ar sevi un glāb mani. Vienīgi pateicoties tavai žēlsirdībai es neiešu bojā.”\u003cbr\u003e\nPiezīme pie pirmā panta: \u003ci\u003eŠrīla Šrīdhārs Mahārādža ieteica nedziedāt \"sakhi go\", bet gan \"bandhu he\".\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-bondhu-gon-shiunoho-vachana-mora\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam 8a \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003cp class=\"translation\"\u003eAstotais Šrī Šikšāštakam pants ir šāds:\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eāśliṣya vā pāda-ratāṁ pinaṣṭu mām\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eadarśanān marma-hatāṁ karotu vā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyathā tathā vā vidadhātu lampaṭo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emat-prāṇa-nāthas tu sa eva nāparaḥ\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Krišna var mani mīloši apskaut vai mīdīt ar savām kājām. Viņš var salauzt manu sirdi, slēpjoties no manis. Viņš var darīt ar mani visu, ko vien vēlas, un tomēr viņš vienmēr būs visas manas dzīves vienīgais Kungs.”\u003cbr\u003e\n\u003ci\u003ePaskaidrojums grāmatā: \u003ca href=\"https://krishnasearch.com/#/book/en-GoldenVolcanoofDivineLove?c=19\u0026p=8\" target=\"_blank\"\u003eThe Golden Volcano of Divine Love. Part II Śikṣāṣṭakam: Union in Separation\u003c/a\u003e.\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebondhu-goṇ!\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śunoho vachana mora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhāvete bibhora, thākiye jokhon,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dekhā deya chitta-chora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMani draugi! Uzklausiet manus vārdus. Mani pārpilda garīgas kalpošanas jūtu ekstāze, kad es redzu šo zaglēnu, kurš nolaupījis manu sirdi.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebichakṣaṇa kori’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dekhite chāhile,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hoya ā̐khi-agochara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epunaḥ nāhi dekhi’,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kā̐daye parāṇa,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;duḥkhera nā thāke ora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTaču, kad es vēlos viņu saskatīt labāk, viņš pazūd un kļūst neaizsniedzams. Bet, kad es viņu neredzu, mana dvēsele sēro un bēdām nav gala.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejagatera bandhu sei kobhu more loya sātha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eyathā tathā rākhu more āmāra se prāṇanātha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDažkārt Krišna, visuma draugs, pieņem mani kā vienu no sev tuvajiem, bet dažkārt viņš nepievērš man nekādu uzmanību. Taču, lai kā viņš arī attiektos pret mani, viņš vienmēr ir un paliek manas dzīves vienīgais Kungs.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edarśan-ānanda-dāne,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sukha dey mora prāṇe,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bole more praṇoya-vachan\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epunaḥ adarśan diyā,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dagdha kore mora hiyā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prāṇe more māre prāṇa-dhan\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKad viņš dāvā man savu svētlaimīgo sabiedrību, tā piepilda ar laimi visu manu dvēseli. Es piedzīvoju ekstāzi, kad viņš ļauj sevi redzēt un uzrunā mani ar maigumu. Pēc tam viņš atkal pazūd! Slēpjoties no manis, viņš dedzina manu sirdi atšķirtības jūtu ugunī.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejāhe tā’ra sukha hoy, sei sukha mama\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enija sukhe-duḥkhe mora sarvadāi sama\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTaču, neskatoties uz neciešamajām mokām, viņš ir visas manas dzīves Kungs. Viss, kas dara viņu laimīgu, dara laimīgu arī mani. Tādēļ es neredzu atšķirību starp savu laimi un ciešanām.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakativinoda,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;saṁjoge bijoge,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāhe jāne prāṇeśvara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etā’ra sukhe sukhī,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sei prāṇa-nātha,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;se kobhu nā hoya paro\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠādi, gan satiekot Krišnu, gan esot atšķirtībā no viņa, Bhaktivinoda zina, ka Krišna ir vienīgais viņa dvēseles Kungs. Krišnas laime ir mana laime. Viņš ir visas manas dzīves Kungs! Man nav neviena cita Kunga, kā vienīgi viņš.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-yoga-pithopari-sthita-ashta-sakhi-subeshtita\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam 8b \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eyoga-pīṭhopari-sthita,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;aṣṭa-sakhī-subeṣṭita,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vṛndāraṇye kadamba-kānane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhā-saha vaṁśī-dhārī, biśva-jana-chitta-hārī,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prāṇa mora tā̐hāra charaṇe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e\u003ci\u003eJoga-pithā, ašta-sakhī\u003c/i\u003e — astoņu \u003ci\u003esakhī\u003c/i\u003e, ieskauts, Kungs Krišna sēž ar Šrī Rādhu Vrindāvanas meža \u003ci\u003ekadambas\u003c/i\u003e koku audzē. Viņš tur flautu un dāvā sajūsmu dvēselēm visā visumā. Es krītu pie viņa pēdām un pilnībā nododu sevi viņam.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esakhī-ājñāmata kori do̐hāra sevana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epālya-dāsī sadā bhāvi do̐hāra charaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSekojot \u003ci\u003esakhī\u003c/i\u003e norādījumam, esmu nodarbināts kalpošanā svētajam pārim, Šrī Šrī Rādhai un Krišnam, vienmēr uzskatot sevi par viņu lotosa pēdu kalpu, kas pilnībā atkarīgs no viņiem.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekobhu kṛpā kori,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mama hasta dhori’,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;madhura vachana bole\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etāmbula loiyā,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;khāya dui jone,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mālā loya kutūhole\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDažkārt savā labestībā viņi ņem mani aiz rokas un uzrunā mani maigiem, saldiem vārdiem. Viņi ēd manis gatavotos beteles riekstus un ar lielu prieku pieņem no manis ziedu virteni.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eadarśana hoya kokhona ki chole\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enā dekhiyā do̐he hiyā mora jvole\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePēc tam viņi atkal pazūd! Kad es neredzu Rādhu un Krišnu, mana sirds deg agonijas liesmās.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejekhāne sekhāne,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;thākuka du’ jane,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āmi to charaṇa-dāsī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emilane ānanda,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;virahe jātanā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sakala sammāna vāsi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLai kur viņi būtu, es esmu viņu lotosam līdzīgo pēdu kalps. Gan piedzīvojot tikšanās laimi, gan esot atšķirtības agonijā, es esmu un palieku viņu mūžīgais kalps.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erādhā-kṛṣṇa prāṇa mor jīvane maraṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emore rākhi’ māri’ sukhe thākuka du’ jone\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eRādha un Krišna ir mana dzīvība un dvēsele, gan dzīvē, gan nāvē. Lai viņi dara ar mani, ko vēlas — sargā vai pazudina, lai tikai viņi abi ir laimīgi.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakativinoda,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āna nāhi jāne,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;poḍi’ nija-sakhī-pāy\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhikāra goṇe\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;thākiyā satata,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jugala-charaṇa chāy\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBhaktivinoda nezina neko, kā tikai viņus. Krītot pie \u003ci\u003esakhī\u003c/i\u003e pēdām, Bhaktivinoda lūdzas par palikšanu Šrī Rādhas uzticamāko kalpoņu vidū. Šrī Rādhas un Šrī Krišnas lotosa pēdas ir Bhaktivinoda mūžīgā vēlēšanās.\u003cbr\u003e\nPiezīme pie dziesmas 8b: \u003ci\u003eŠrīla Šrīdhārs Mahārādža ieteica nedziedāt šo dziesmu, jo tā ir \"pārāk augsta\".\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"first-lines\" id=\"first-lines\"\u003e\n\u003ch1\u003eIndekss\u003c/h1\u003e\n\u003ch2 class=\"first-line-group\"\u003eA\u003c/h2\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-anadi-karama-phole\"\u003eanādi karama-phole\u003cspan class=\"page-num\"\u003e — 187\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-aparadha-phole-mama\"\u003eaparādha-phole mama\u003cspan class=\"page-num\"\u003e — 188\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-avatara-sara-gora-avatara\"\u003eavatāra sāra gorā avatāra\u003cspan class=\"page-num\"\u003e — 121\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch2 class=\"first-line-group\"\u003eĀ\u003c/h2\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-atma-nivedana-tuya-pade-kori\"\u003eātma-nivedana, tuyā pade kori\u003cspan class=\"page-num\"\u003e — 160\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch2 class=\"first-line-group\"\u003eB\u003c/h2\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\"#song-bhajahu-re-mana-shri-nanda-nandana\"\u003ebhajahu̐ re mana śrī-nanda-nandana\u003cspan class=\"page-num\"\u003e — 146\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"first-line\" data-translated=\"1\"\u003e\u003ca href=\
