s ikvienam, jo viņi ir gopīju noskaņojuma pārņemti un vienmēr aizņemti mīlošā kalpošanā Rādhai un Krišnam.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-gaurāṅga-guṇānuvarṇana-vidhau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śraddhā-samṛddhy-anvitau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epāpottāpa-nikṛntanau tanu-bhṛtāṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;govinda-gānāmṛtaiḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eānandāmbudhi-vardhanaika-nipuṇau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kaivalya-nistārakau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande rūpa-sanātanau raghu-yugau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-jīva-gopālakau\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCieņas pilns es klanos sešiem Gosvāmī, pazīstamiem kā Šrī Rūpa Gosvāmī, Šrī Sanātana Gosvāmī, Šrī Raghunāths Bhatta Gosvāmī, Šrī Raghunāths Dāsa Gosvāmī, Šrī Džīva Gosvāmī un Šrī Gopāls Bhatta Gosvāmī, kuri patiesi izprata Kungu Čaitanju un tādēļ bija tik prasmīgi aprakstot Viņa dievišķās īpašības. Pludinot visām nebrīvajām dvēselēm pāri dziesmu straumes par Govindu, viņi spēj tās attīrīt no grēcīgas rīcības sekām. Tā viņi paplašina transcendentālās svētlaimes okeāna robežas un glābj dzīvās būtnes no visu aprijošās bezpersoniskās atbrīvošanas rīkles.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etyaktvā tūrṇam aśeṣa-maṇḍala-pati-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śreṇīṁ sadā tucha-vat\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhūtvā dīna-gaṇeśakau karuṇayā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kaupīna-kanthāśritau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egopī-bhāva-rasāmṛtābdhi-laharī-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kallola-magnau muhur\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande rūpa-sanātanau raghu-yugau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-jīva-gopālakau\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCieņas pilns es klanos sešiem Gosvāmī, pazīstamiem kā Šrī Rūpa Gosvāmī, Šrī Sanātana Gosvāmī, Šrī Raghunāths Bhatta Gosvāmī, Šrī Raghunāths Dāsa Gosvāmī, Šrī Džīva Gosvāmī un Šrī Gopāls Bhatta Gosvāmī, kuri atteicās no aristokrātiskas sabiedrības kā no kaut kā nevērtīga. Lai glābtu nelaimīgas, nebrīvas dvēseles, viņi kļuva par ubagiem, atstājot sev vienīgi gurnu apsējus. Viņi vienmēr ir ekstātiski gremdējušies gopīju mīlestības (uz Krišnu) okeānā. Atkal un atkal viņi pieņem apmazgāšanos šī okeāna ūdeņos.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekūjat-kokila-haṁsa-sārasa-gaṇā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kīrṇe mayūrākule\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enānā-ratna-nibaddha-mūla-viṭapa-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-yukta-vṛndāvane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhā-kṛṣṇam ahar-niśaṁ prabhajatau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jīvārthadau yau mudā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande rūpa-sanātanau raghu-yugau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-jīva-gopālakau\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCieņas pilns es klanos sešiem Gosvāmī, pazīstamiem kā Šrī Rūpa Gosvāmī, Šrī Sanātana Gosvāmī, Šrī Raghunāths Bhatta Gosvāmī, Šrī Raghunāths Dāsa Gosvāmī, Šrī Džīva Gosvāmī un Šrī Gopāls Bhatta Gosvāmī, kuri vienmēr ir aizņemti Rādha-Krišnas pielūgsmē transcendentālajā vietā Vrindāvanā. Tur brīnišķīgi, ziedoši koki ir kā nosēti ar augļiem, bet zem to saknēm ir apslēpti visi iedomājamie dārgakmeņi. Šiem Gosvāmī piemīt absolūtas spējas dāvāt dzīvām radībām patiesā dzīves mērķa dižāko svētību.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esaṅkhyā-pūrvaka-nāma-gāna-natibhiḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kālāvasānī-kṛtau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enidrāhāra-vihārakādi-vijitau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chātyanta-dīnau cha yau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhā-kṛṣṇa-guṇa-smṛter madhurimā-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nandena sammohitau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande rūpa-sanātanau raghu-yugau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-jīva-gopālakau\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCieņas pilns es klanos sešiem Gosvāmī, pazīstamiem kā Šrī Rūpa Gosvāmī, Šrī Sanātana Gosvāmī, Šrī Raghunāths Bhatta Gosvāmī, Šrī Raghunāths Dāsa Gosvāmī, Šrī Džīva Gosvāmī un Šrī Gopāls Bhatta Gosvāmī, kuri dzied Kunga Svētos Vārdus un pielūdz Viņu. Ikvienu savu nenovērtējamo dzīvju mirkli viņi ir veltījuši kalpošanai Kungam, pārvarot nepieciešamību ēst un gulēt. Viņi vienmēr ir rāmi un pazemīgi, pastāvīgi atcerēdamies Kunga transcendentālās īpašības.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003erādhā-kuṇḍa-taṭe kalinda-tanayā-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tīre cha vaṁśīvaṭe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epremonmāda-vaśād aśeṣa-daśayā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;grastau pramattau sadā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egāyantau cha kadā harer guṇa-varaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhāvābhibhūtau mudā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande rūpa-sanātanau raghu-yugau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-jīva-gopālakau\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCieņas pilns es klanos sešiem Gosvāmī, pazīstamiem kā Šrī Rūpa Gosvāmī, Šrī Sanātana Gosvāmī, Šrī Raghunāths Bhatta Gosvāmī, Šrī Raghunāths Dāsa Gosvāmī, Šrī Džīva Gosvāmī un Šrī Gopāls Bhatta Gosvāmī, kuri dažkārt parādījās Rādha-kundas vai Jamūnas krastos, bet dažkārt Vamšīvatā. Mīlestības ekstāzes pret Krišnu pārņemti, viņi izturējās kā zaudējuši prātu, bet viņu ķermeņos izpaudās dažādas garīgās svētlaimes pazīmes. Viņi bija gremdējušies Krišnas apziņas ekstāzē!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehe rādhe vraja-devīke cha lalite\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;he nanda-sūno kutaḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-govardhana-kalpa-pādapa-tale\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kālindī-vanye kutaḥ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eghoṣantāv iti sarvato vraja-pure\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;khedair mahā-vihvalau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evande rūpa-sanātanau raghu-yugau\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-jīva-gopālakau\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eCieņas pilns es klanos sešiem Gosvāmī, pazīstamiem kā Šrī Rūpa Gosvāmī, Šrī Sanātana Gosvāmī, Šrī Raghunāths Bhatta Gosvāmī, Šrī Raghunāths Dāsa Gosvāmī, Šrī Džīva Gosvāmī un Šrī Gopāls Bhatta Gosvāmī, kuri pa visu Vrindāvanu skaļi sauca: “Ak, Rādharānī, Vrindāvanas karaliene! Ak, Lalīta! Ak, Nanda Māhārādžas dēls! Kur jūs šobrīd esat? Varbūt jūs pastaigājaties pa Govardhāna kalnu vai atpūšaties koku ēnā Jamūnas krastā? Kur gan jūs esat?” Šādā noskaņojumā viņi kalpo Krišnam.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-ohe-harinam-tava-mahima-apara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŠrī Nāmaštakam 7 \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eohe harinām, tava mahimā apāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava pade nati āmi kori bāro bāro\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, Svētais Vārds! Tava slava ir bezgalīga! Es klanos pie Tavām lotosam līdzīgajām pēdām atkal un atkal!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egokuler mahotsava ānanda-sāgara\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomāra charaṇe poḍi hoiyā kātara\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGokulas varenais triumfs! Svētlaimes okeāns! Es krītu pie Tavām kājām, jo mana sirds cieš un es pastāvīgi saskaros ar grūtībām.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etumi kṛṣṇa, pūrṇa-vapu, rasera nidāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava pade poḍi tava guṇa kori gāna\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTu esi Kungs Krišna, Tavs dievišķais veidols ir pati pilnība! Tu esi visu transcendentālo garšu avots! Krītot pie Tavām lotosu pēdām, es  dziedu par Tavām dievišķajām īpašībām.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eje kore tomār pade ekānta āśroya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etā’ra ārti-rāśi nāśa karaho niśchoya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTu neapšaubāmi kliedē visas to cilvēku daudzās nelaimes, kuri pieņem par savu vienīgo patvērumu Tavas svētās pēdas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esarva aparādha tumi nāśa kara tā’ra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāma-aparādhāvadhi nāśaho tāhāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTu iznīcini visus viņu apvainojumus, pat nāma-aparādhas (desmit apvainojumiem dziedot Svēto Vārdu).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esarva-doṣa dhauta kori’ tāhāra hṛdoya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esiṁhāsane baiso tumi parama āśroya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAttīrīdams viņus no visiem sārņiem, Tu ieņem karaļa vietu viņu sirds troņos un kļūsti par viņu augstāko un vienīgo valdnieku.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eati-ramya chid-ghana-ānanda-mūrtimān\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e‘raso vai saḥ’ boli’ veda kore tuyā gān\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTu esi apbrīnojams un brīnišķīgi skaists, pilnīgu zināšanu un ekstātiskas svētlaimes iemiesojums! Vēdas dzied par Tevi: “Dieva Augstākā personība patiesi ir visu transcendentālo garšu iemiesojums!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhaktivinoda rūpa-gosvāmī-charaṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emāgaye sarvadā nāma-sphūrti sarva-kṣane\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKatru savas dzīves mirkli Bhaktivinoda nepārstājoši lūdzas pie Šrīlas Rūpas Gosvāmī lotosam līdzīgajām pēdām par to, lai Svētais Vārds tam atklāj sevi skaidri un tieši!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-ki-rupe-paibo-seva-mui-durachara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eKi-rūpe pāibo sevā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Narottams Dāsa Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eki-rūpe pāibo sevā mui durāchāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśrī-guru-vaiṣṇave rati na hoilo āmāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eManī nav nekādas patiesas pieķeršanās ne Vaišnaviem, ne manam garīgajam skolotājam. Ak, kā gan tādam nelietim kā man panākt sevī nesavtīgu kalpošanu?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eaśeṣa māyāte mana magana hoilo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003evaiṣṇavete leśa-mātra rati nā janmilo\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMans prāts nepārstājoši slīkst ilūzijā. Manī nav ne kripatiņas vēlmes veltīt sevi Vaišnaviem.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebiṣoye bhuliya andha hoinu divā-niśi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egole phā̐sa dite phere māyā se piśāchī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGremdējoties pastāvīgās domās par savu jutekļu objektiem, esmu kļuvis akls. Līdzīgi bendei ragana Majadēvī ir savilkusi cilpu ap manu kaklu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emāyāre koriyā jaya chāḍāna na jāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esādhu-kṛpā vinā āro nahiko upāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePat ja es spētu izārstēt savu aklumu un uzvarēt maju šīs bendes veidolā, es nevaru atbrīvoties no materiālās ilūzijas bez svēto Vaišnavu žēlastības.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eadoṣa daraśi-prabhu patita-uddhāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eei-bāro narottame karaho nistāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, grēciniekus attīrošais valdniek, kritušo glābēj, tu neievēro citu grēkus. Lūdzu, glāb Narottamu Dāsu!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-bhajahu-re-mana-shri-nanda-nandana\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eBhajahu̐ Re Mana \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Govinda Dāsa Kavirādžs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhajahu̐ re mana\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-nanda-nandana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;abhaya-charaṇāravinda re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edūrlabha mānava\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;janama sat-saṅge\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;taroho e bhava-sindhu re\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMans prāts, vienkārši pielūdz lotosam līdzīgās Nandas dēla pēdas, kuras dāvā cilvēkam bezbailību! Saņēmis tik reto dzimšanu cilvēka ķermenī, jel saskaries ar svētajiem un tu šķērsosi materiālās esības bezdibeni.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśīta ātapa\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bāta bariṣaṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;e dina jāminī jāgi re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebiphale sevinu\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kṛpaṇa durajana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chapala sukha-laba lāgi’ re\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDienu un nakti, nezinot mieru, es ciešu karstumā un aukstumā, vējā un lietū. Iedomātas laimes kripatiņas dēļ es bezjēdzīgi kalpoju netikumīgiem un skopiem cilvēkiem.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ee dhana, jauvana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;putra, parijana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ithe ki āche paratīti re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekamala-dala-jala,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jīvana ṭalamala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhajahu̐ hari-pada niti re\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKā gan var cerēt, ka materiālā labklājība, jaunība, bērni un citi tuvinieki sniegs patiesu laimi? Šī dzīve ir tik nepastāvīga kā ūdens piliens uz lotosa ziedlapas. Tāpēc vienmēr kalpo un pielūdz Kunga Harī dievišķās pēdas!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśravaṇa, kīrtana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;smaraṇa, vandana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pāda-sevana, dāsya re\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003epūjana, sakhī-jana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ātma-nivedana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;govinda-dāsa-abhilāṣa re\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGovinda Dāsa lielākais sapnis un vēlme ir veltīt sevi deviņiem bhakti-jogas veidiem: klausīties par Kunga Harī slavu, dziedāt un stāstīt citiem par šo slavu, pastāvīgi atcerēties Kungu un piedāvāt Viņam lūgšanas, kalpot Viņa lotosam līdzīgajām pēdām, veltīt sevi Kungam kalpa lomā, pielūgt Viņu ar ziediem, vīraku un citām veltēm, kalpot Kungam drauga lomā un pilnībā  atdot sevi Kunga rokās.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-manasa-deho-geho-jo-kichu-mora\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eMānasa Deho Geho \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emānasa, deho, geho, jo kichū mora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003earpilu̐ tuyā pade, nanda-kiśora!\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePrātu, ķermeni, ģimeni; visu, kas man pieder, esmu nolicis pie Tavām lotosam līdzīgajām pēdām, ak, jauneklīgais Nandas dēls!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esampade vipade, jīvane-maraṇe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edāy mama gelā, tuyā o-pada varaṇe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eLaime un nelaime, dzīvība un nāve – nekādas grūtības vairs nesagādā man raizes, jo esmu izvēlējies Tavas lotosam līdzīgās pēdas par savu vienīgo patvērumu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emārobi rākhobi—jo ichā tohārā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enitya-dāsa prati tuyā adhikārā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTavā varā ir lemt, atņemt man dzīvību vai pasargāt no nelaimēm, jo Tu esi Kungs, bet es – Tavs mūžīgais kalps.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejanmāobi moye ichā jadi tora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakta-gṛhe jani janma hau mora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eJa Tu vēlēsies, lai es piedzimstu no jauna, tad lai tas notiek Vaišnava mājā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekīṭa-janma hau yathā tuyā dāsa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebahir-mukha brahma-janme nāhi āśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEsmu gatavs piedzimt kaut vai par tārpu, lai tikai paliktu Tavs bhakta. Es negribu būt pat Kungs Brahma, ja tādējādi es nevēlēšos veltīt sevi Tev.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhukti-mukti-spṛhā bihīna je bhakta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elabhaite tā̐ka saṅga anurakta\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs ilgojos pēc tāda Vaišnava sabiedrības, kurš ir pilnībā brīvs no slāpēm pēc pasaulīgām baudām vai tieksmes panākt muktī - atbrīvošanos.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejanaka, jananī, doyita, tanoy\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprabhu, guru, pati—tuhu̐ sarva-moy\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTēvs, māte, mīļotais, dēls, Kungs, skolotājs un vīrs – Tu man esi viss!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakativinoda kohe, śuno kāna!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003erādhā-nātha! tuhu̐ hāmāra parāṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBhaktivinoda saka: “Krišna, sadzirdi jel mani! Ak, Rādhas pavēlniek, Tu esi mana dzīvība un dvēsele!”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-e-ghora-samsare-podiya-manava\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eE ghora saṁsāre \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eKālīdāsa\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ee ghora saṁsāre,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;poḍiyā mānava\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;na pāya duḥkhera śeṣa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esādhu-saṅga kori,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hari bhaje yadi,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tobe anta hoy kleśa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTie, kas nonākuši šajā materiālajā dzimšanu un miršanu pasaulē, bezgalīgi cieš. Tomēr, ja viņi atrodas bhaktu sabiedrībā un pielūdz Kungu Harī, visas viņu bēdas un ciešanas zūd.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebiṣoya anale,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jvaliche hṛdaya,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;anale boḍe anala\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eaparādha chāḍi’\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;loy kṛṣṇa-nāma,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;anale paḍaye jola\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSirds kvēlo juteklisko baudu ugunī, un šī liesma aug lielāka un lielāka. Izvairoties no apvainojumiem, dziedi Kunga Krišnas Svētos Vārdus, jo tas ir ūdens, kas spēj dzēst šo uguni.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enitāi chaitanya,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;charaṇa-kamale,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āśroya loilo jei\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekālidās bole\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;jīvane maraṇe,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āmāra āśroya sei\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKālīdāsa saka: “Tas, kurš ir pieņēmis Kunga Čaitanjas un Kunga Nitjānandas lotosam līdzīgo pēdu patvērumu, pats kļūst par manu patvērumu dzīvē un nāvē.”\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-emona-durmati-samsara-bhitore\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eDainyātmikā \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e(prabhu he!)\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eemona durmati,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;saṁsāra bhitore,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;poḍiyā āchinu āmi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava nija-jana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kono mahājane,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pāṭhāiyā dile tumi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMans netīrais prāts iemeta mani šajā pasaulē, ak, Kungs, taču viens no Taviem tīrajiem, īstenajiem bhaktām nāca, lai mani glābtu!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edoyā kori more,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;patita dekhiyā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kohilo āmāre giyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eohe dīna-jon,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śuno bhālo kathā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ullasita ho’be hiyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eIeraugot mani, tik kritušu un nožēlojamu, viņš apžēlojās par mani un pienāca pie manis sacīdams: “Nabaga dvēsele, uzklausi šo labo vēsti, tā iepriecinās tavu sirdi”.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāre tārite,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;śrī-kṛṣṇa-chaitanya,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nabadvīpe avatār\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomā heno koto,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;dīna hīna jone,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;korilena bhava-pār\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Lai glābtu tevi, Šrī Krišna Čaitanja parādijās Navadvīpas zemē. Viņš palīdzēja daudzām tev līdzīgām nelaimīgām dvēselēm droši šķērsot materiālās esības bezdibeni.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003evedera pratijñā,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rākhibāra tore,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;rukma-varṇa vipra-suta\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emahāprabhu nāme,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nadīyā mātāya,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;soṅge bhāi avadhūta\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Lai piepildītu Vēdās solīto, brahmana dēls vārdā Mahāprabhu, kura ķermenis laistās zeltā, atnāca kopā ar savu brāli avadhūtu Nitjānandu. Kopīgi viņi pārpludināja Nādiju ar dievišķo ekstāzi.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enanda suta jini,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chaitanya gosāi,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nija-nāma kori’ dāna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etārilo jagat,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tumi-o jāiyā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;loho nija-paritrāṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Šrī Čaitanja, pats Krišna, glāba šo pasauli, dāvājot tai savu Svēto Vārdu. Ej un iegūsti šo atbrīvi arī tu!”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ese kathā śuniyā,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āsiyāchi, nātha!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra charaṇa-tole\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebhakativinoda,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kā̐diyā kā̐diyā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āpana-kāhinī bole\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, Kungs, dzirdot šos vārdus, Bhaktivinoda raud, lūdzas pēc Tavu lotosam līdzīgo pēdu dzīvinošās ēnas un stāsta savas dzīves stāstu.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-ki-jani-ki-bale-tomara-dhamete\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eGoptṛtve Varaṇa \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eki jāni ki bale,\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra dhāmete,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hoinu śaraṇāgata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etumi dayāmoy,\u0026nbsp;\u0026nbsp;\u0026nbsp;patita-pāvana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;patita-tāraṇe rata\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAr kādu zināšanu, ar kāda spēka palīdzību tāds kā es varēja gūt patvērumu Tevī? Nešaubīgi, tas varēja notikt tikai pateicoties Tavai žēlastībai, jo Tu vienmēr tiecies attīrīt un glābt kritušas, nelaimīgas dvēseles.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebharasā āmāra,\u0026nbsp;\u0026nbsp;\u0026nbsp;ei mātra nāth!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tumi to’ karuṇāmoya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava dayā pātra,\u0026nbsp;\u0026nbsp;\u0026nbsp;nāhi mora sama,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;avaśya ghuchāre bhaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTu esi līdzcietības un žēlastības avots un mana vienīgā cerība! Nav neviena cita, kam Tava žēlastība būtu nepieciešama vairāk, nekā man! Tu neapšaubāmi kliedēsi visas manas bailes.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eāmāre tārite,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kāhāro śakati,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;avanī-bhitore nāhi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edayāla ṭhākura!\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ghoṣaṇā tomāra,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;adhama pāmare trāhi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eNevienam citam nav pa spēkam mani glābt! Ak, žēlsirdīgais Kungs, piepildi savu solījumu, lūdzu, glāb šo nožēlojamo un nelaimīgo grēcinieku!\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esakala chāḍiyā,\u0026nbsp;\u0026nbsp;\u0026nbsp;āsiyāchi āmi,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra charaṇe nātha!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāmi nitya-dāsa,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tumi pālayitā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tumi goptā, jagannātha!\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEsmu atteicies no visa un atnācis pie Tavām lotosam līdzīgajām pēdām. Visuma Valdniek, es esmu Tavs mūžīgais kalps, bet Tu – mans patvērums, mans sargātājs.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra sakala,\u0026nbsp;\u0026nbsp;āmi mātra dāsa,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āmāra tāribe tumi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomāra charaṇa, korinu varaṇa,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āmāra nahi to’ āmi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eViss pieder Tev! Es esmu vien kalps, kas pārliecināts par to, ka Tu mani glābsi. Esmu nolēmis, ka Tavas lotosam līdzīgās pēdas ir mans vienīgais patvērums. Es vairs nepiederu sev.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakativinoda,\u0026nbsp;\u0026nbsp;kā̐diya śaraṇa,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;lo’yeche tomāra pāya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekhomi aparādha,\u0026nbsp;\u0026nbsp;nāme ruchi diyā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;pālana karahe tāya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eRaudādams Bhaktivinoda pieņem Tavu pēdu patvērumu. Piedod viņa apvainojumus, ļauj viņam izgaršot Tavu Svēto Vārdu un balsti viņu!\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-atma-nivedana-tuya-pade-kori\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eĀtma-nivedana \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eātma-nivedana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tuyā pade kori,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hoinu parama sukhī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eduḥkha dūre gelo,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chintā nā rohilo,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chaudike ānanda dekhi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePilnībā veltījies Tavām svētajām pēdām, esmu kļuvis bezgalīgi laimīgs. Visas skumjas izgaisušas, nav vairāk vietas raizēm. Lai kur es raudzītos, es redzu tikai prieku.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eaśoka-abhaya,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;amṛta-ādhāra,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra charaṇa-dvaya\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etāhāte ekhona,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;viśrāma lobhiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chāḍinu bhavera bhaya\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTavas lotosam līdzīgās pēdas ir divi mūžīgas dzīves nektāra okeāni, kuros varu dzīvot nepazīstot bailes un skumjas. Esmu tajos radis mieru, atstājot aiz muguras materiālās esības briesmas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra saṁsāre,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;koribo sevana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nahibo phalera bhāgī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava sukha jāhe,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;koribo jatana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ho’ye pade anurāgī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePilnībā veltījies Tavām lotosam līdzīgajām pēdām, es kalpošu Tavā mājā un nekārošu baudīt savas kalpošanas augļus; tieši pretēji, es tiekšos visos iespējamos veidos Tevi iepriecināt.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etomāra sevāya,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;duḥkha hoya jato,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;seo to’ parama sukha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esevā-sukha-duḥkha,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;parama sampada\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nāśoye avidyā-duḥkha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eGrūtības, ar kurām saskaršos kalpošanā Tev, kļūs par lielas laimes cēloni, jo uzticīgā kalpošanā Tev prieki un bēdas ir vienlīdz lielas bagātības. Tie iznīcina ciešanas, kuras rada tumsonība.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epūrva itihāsa,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhulinu sakala,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sevā-sukha pe’ye mane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eāmi to’ tomāra,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tumi to’ āmāra,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ki kāja apara dhane\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eJūtot šo milzu prieku, kas piepilda manu prātu, esmu pilnībā aizmirsis savu pagātni. Bez šaubām, es pilnībā piederu Tev, bet Tu – viennozīmīgi, man. Kāda gan bagātība man vēl var būt nepieciešama?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakativinoda,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ānande ḍubiyā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tomāra sevāra tore\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaba cheṣṭā kore,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tava ichā-mata,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;thākiyā tomāra ghore\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBhaktivinoda, iegrimis svētlaimes okeānā, dzīvo Tavā mājā, visus savus spēkus veltot kalpošanai Tev un Tavu vēlmju piepildīšanai.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-tumi-sarveshvareshvara-vrajendra-kumara\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eTumi sarveśvareśvara \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etumi sarveśvareśvara, vrajendra-kumāra!\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomāra ichāya viśve sṛjana saṁhāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, jauneklīgais Vradžas karali, Tu esi visu valdnieku valdnieks! Visuma radīšana un iznīcināšana notiek tikai saskaņā ar Tavu gribu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etava ichā-mato brahmā korena sṛjana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava ichā-mato viṣṇu korena pālana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSaskaņā ar Tavu gribu Kungs Brahma rada un saskaņā ar Tavu gribu Kungs Višnu uztur.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etava ichā-mate śiva korena saṁhāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava ichā-mate māyā sṛje kārāgāra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSaskaņā ar Tavu gribu Kungs Šiva iznīcina, saskaņā ar Tavu gribu maja būvē šīs pasaules cietumu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etava ichā-mate jīver janama-maraṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esamṛddhi-nipāta duḥkha sukha-saṅghaṭana\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSaskaņā ar Tavu gribu dzīvas būtnes dzimst un mirst, saskaņā ar Tavu gribu tās piedzīvo uzplaukumu un postu, laimi un nelaimi.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003emiche māyā-baddha jīva āśā-pāśe phire\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etava ichā vinā kichu korite nā pāre\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eSīka dvēsele, majas paverdzināta, veltīgi cīnās pasaulīgo vēlmju važās. Bez Tava atbalsta dvēsele nespēj izdarīt pilnīgi neko.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etumi to’ rakṣaka āro pālaka āmāra\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomāra charaṇa vinā āśā nāhi āra\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTu esi vienīgais, kas mani sargā un uztur. Bez Tavām lotosam līdzīgajām pēdām man nav, uz ko cerēt.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003enija-bala-cheṣṭa-prati bharasā chāḍiyā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomāra ichāya āchi nirbhara koriyā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eEs vairs nepaļaujos uz saviem spēkiem. Esmu pilnībā atkarīgs tikai no Tavas gribas.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakativinoda ati dīna akiñchana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomāra ichāya tā’ra jīvana maraṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eBhaktivinoda lepnība ir sagrauta. Tagad viņš dzīvos vai mirs tikai saskaņā ar Tavu gribu.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-gopinath-amara-upaya-nai\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eNivedana 3. daļa \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egopīnāth,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āmāra upāya nāi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etumi kṛpā kori,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;āmāre loile,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;saṁsāre udhāra pāi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, Gopināth, man nav nekādu izredžu. Taču, ja Tu pieņemsi mani un dāvāsi man savu žēlastību, es tikšu glābts no šīs materiālās pasaules.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egopīnāth,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;poḍechi māyāra phere\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003edhon, dārā, suta,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ghireche āmāre,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kāmete rekheche jere\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, Gopināth, es esmu kļuvis par materiālās ilūzijas upuri. Man ir bagātība, sieva un dēli, taču mana ir pārņēmusi materiālā iekāre.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egopīnāth,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;mana je pāgala mora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enā māne śāsana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sadā achetana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;viṣoye royeche bhora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, Gopināth, esmu kļuvis neprātīgs un jebkura autoritāte manam prātam ir vienaldzīga. Tas ir iegrimis dziļā  miegā un pasaulīgo rūpju tumšajā bedrē.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egopīnāth,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hāra je menechi āmi\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eoneka jatana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hoilo biphala,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ekhona bharasā tumi\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, Gopināth, es pieņemu savu sakāvi. Visi mani centieni ir bijuši veltīgi. Tagad Tu esi mana vienīgā cerība.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egopīnāth,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;kemone hoibe gati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eprabala indriya,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bośī-bhūta mana,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nā chāḍe viṣoya-rati\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, Gopināth, kas gan notiks ar mani? Manas maņas ir ļoti spēcīgas. Tās kontrolē manu prātu un nevēlas atteikties no visa materiālā, kam tās ir pieķērušās.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egopīnāth,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hṛdoye bosiyā mora\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emanake śamiyā,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;loho nija pāne,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;ghuchibe vipada ghora\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, Gopināth, jel apmeties manā sirdī. Apklusini manu prātu un paņem mani pie sevis. Lūdzu, atbrīvo mani no visām šīm briesmām.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egopīnāth,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;anātha dekhiyā more\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etumi hṛṣīkeśa,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;hṛṣīka damiyā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;tāro’ he saṁsṛti-ghore\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, Gopināth, Tu esi Hrišīkēša – jutekļu valdnieks. Tu redzi, ka esmu bezpalīdzīgs. Lūdzos Tevi, kļūsti par manu maņu saimnieku un glāb mani no šīs tumšās un briesmu pilnās pasaulīgās eksistences.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egopīnāth,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;golāya legeche phā̐sa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛpā-asi dhori,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bandhana chediyā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vinode karaho dāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, Gopināth, materiālisma cilpa ir savilkusies cieši ap manu kaklu. Pārcērt šīs važas ar savas žēlastības zobenu un padari Bhaktivinodu par savu kalpu.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-durlabha-manava-janma-labhiya-samsare\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eDurlabha mānava-janma \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Bhaktivinoda Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edurlabha mānava-janma labhiyā saṁsāre\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa nā bhajinu duḥka kohibo kāhāre?\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eDzimšana cilvēka ķermenī sniedz tik reto iespēju sasniegt garīgo pilnību. Taču man atliek vienīgi sērot, jo, saņēmis šādu iespēju, esmu to palaidis garām tā arī nekad nepielūgdams Kungu Krišnu. Ak, kam gan es pastāstu šo bēdu stāstu?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003e‘saṁsār’ ‘saṁsār’, kori miche gelo kāl\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003elābha nā koilo kichu, ghaṭilo jañjāl\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eApprecējies un sapinies materiālistiskajā ģimenes dzīves virpulī, esmu visu savu laiku šķiedis velti. Neesmu ieguvis pilnīgi neko pastāvīgu un piedzīvoju vienīgi nepatikšanas un raizes.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekisera saṁsār ei chāyābāji prāy\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eihāte mamatā kori vṛthā dina jāy\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKas gan šī ir par pasauli? Tā līdzinās burvju mākslinieka ilūzijai. Kā burvju gaismekļu izrāde, kuru redzēju karnevālā, kur daudzas ēnas un optiskās ilūzijas dejo manu acu priekšā. Būdams pieķēries līdzīgai mirāžai, es uzskatu šīs pasaules īslaicīgās ilūzijas par “manām”, “man piederošām”. Šādi diena pēc dienas velti pazūd.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ee deho patana ho’le ki robe āmār?\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekeho sukha nāhi dibe putra paribār\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKas gan paliks mans, kad šis ķermenis kritīs miris pie zemes? Ne dēli, ne citi tuvākie cilvēki nespēs sniegt man ne kripatiņu laimes.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003egardabher mata āmi kori pariśram\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekāra lāgi’ eto kori, nā ghuchilo bhram\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKatru dienu es strādāju kā ēzelis, taču tagad es prātoju – kā labā es tik smagi pūlos? Es atrodos tik daudzu ilūziju varā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edina jāy michā kāje, niśā nidrā-vaśe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāhi bhāvi maraṇa nikaṭe āche bose\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKatru savu dienu es izšķiežu būdams aizņemts bezjēdzīgās, nenozīmīgās nodarbēs, bet manas naktis paiet miega varā. Un divdesmit četru stundu laikā es ne reizi neaizdomājos, ka nāve vienmēr ir tepat blakus.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhālo manda khāi, heri, pari, chintā-hīna\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enāhi bhāvi, e deho chāḍibo kon dina\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eMana dzīve ir bezrūpīga. Es ēdu, eju, kur vien vēlos, valkāju skaistas drēbes, taču neaizdomājos par to, ka kādu dienu man vajadzēs šo ķermeni atstāt.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003edeho-geho-kalatrādi-chintā abirata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejāgiche hṛdoye mor buddhi kori hoto\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003ePastāvīgas domas par manu ķermeni, mājām, sievu, pienākumiem sabiedrībā un citām lietām satrauc manu sirdi. Šīs raizes nodara man ciešanas un grauj manu saprātu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"9\"\u003e\n\u003ch5\u003e9\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehāy, hāy! nāhi bhāvi—anitya e saba\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ejīvana bigote kothā rohibe vaibhava?\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk vai, ak vai! Kādā nožēlojamā situācijā esmu nonācis. Esmu iegrimis šajās problēmās, taču nemaz neaizdomājos par to, ka viss šis ir īslaicīgs un zudīs pavisam drīz. Kas gan notiks ar manām materiālajām bagātībām pēc manas nāves?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"10\"\u003e\n\u003ch5\u003e10\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśmaśāne śorīra mama poḍiyā rohibe\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebihaṅga-pataṅga tāy bihāra koribe\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKad manu ķermeni iemetīs kremācijas laukuma bedrē, tas tur vienkārši nekustīgi gulēs. Vārnas, maitasputni, skudras un tārpi sapulcēsies un dzīros uz tā.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"11\"\u003e\n\u003ch5\u003e11\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ekukkur sṛgāl sob ānandita ho’ye\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003emahotsava koribe āmār deho lo’ye\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKlaiņojoši suņi un šakāļi līksmos. Tie rīkos uz mana ķermeņa svētkus un dzīres.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"12\"\u003e\n\u003ch5\u003e12\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eje deher ei gati, tāra anugata\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esaṁsār-vaibhava āro bondhu-jon jata\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTāds ir šī materiālā ķermeņa liktenis. Un pārsteidzošākais ir tas, ka visus manus pasaulīgos sasniegumus, manu māju, ģimeni un draugus, sagaida tāds pats liktenis.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"13\"\u003e\n\u003ch5\u003e13\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eataeva māyā-moha chāḍi buddhimān\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enitya-tattva kṛṣṇa-bhakti koruna sandhān\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTādēļ es lūdzu katru, kam piemīt saprāts: atraidi šos iluzoros vilinājumus, kurus radījusi maja. Meklē to, kas ir mūžīgs - garīgu kalpošanu Kungam Krišnam.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-hari-he-dayala-mora-jaya-radha-natha\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eDainya O Prapatti \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehari he dayāla mora jaya rādhā-nātha\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ebāro bāro ei-bāro loho nija sātha\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, Harī! Visužēlīgais Kungs. Visa slava tev, Rādhas Kungs! Esmu ilgi no tevis izvairījies, taču tagad lūdzos - pieņem mani kā savu īpašumu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebahu joni bhrami nātha! loinu śaraṇa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003enija-guṇe kṛpā kara adhama tāraṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs, pēc daudzām jo daudzām dzimšanām esmu pieņēmis patvērumu tevī. Esi žēlsirdīgs pret mani un ar savu dievišķo spēku atbrīvo šo nelaimīgo dvēseli.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ejagata-kāraṇa tumi jagata-jīvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomā chāḍā kāro na’hi he rādhā-ramaṇa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eAk, Rādhas mīļotais, Tu esi Visuma pirmavots un dzīvība. Nekas nepastāv ārpus tevis.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhuvana-maṅgala tumi bhuvanera pati\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etumi upekṣile nātha, ki hoibe gati\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eTu nes svētību visai pasaulei. Tu esi arī visu pasauļu saimnieks. Kungs, kur gan man rast patvērumu, ja Tu mani atraidīsi?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhāviyā dekhinu ei jagata-mājhāre\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003etomā vinā keho nāhi e dāse uddhāre\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eŠajā pasaulē nav neviena, kas varētu glābt šo kritušo kalpu – tikai Tu.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"song\" id=\"song-shri-rupa-manjari-pada-sei-mora-sampada\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch2\u003eŚrī-Rūpa-Mañjarī-pada \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003ch4\u003eŠrīla Narottams Dāsa Thākurs\u003c/h4\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśrī-rūpa-mañjarī-pada,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sei mora sampada,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sei mora bhajana-pūjana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esei mora prāṇa-dhana,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sei mora ābharaṇa,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sei mora jīvanera jīvana\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003esei mora rasa-nidhi,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sei mora vāñchā-siddhi,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sei mora vedera dharama\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esei brata, sei tapa,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sei mora mantra-japa,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;sei mora dharama-karama\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eanukūla hobe viddhi,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;se-pade hoibe siddhi,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;nirakhibo e dui nayane\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ese rūpa-mādhurī-rāśi,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prāṇa-kuvalaya-śaśī,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;praphullita hobe niśi-dine\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003etuyā adarśana-ahi,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;gorole jāralo dehi,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;chiro-dina tāpita jīvana\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ehā hā rūpa kara dayā,\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;deho more pada-chāyā,\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;narottama loilo śaraṇa\u003c/strong\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse-subtitle\"\u003eŠrīlas Bhakti Rakšaka Šrīdhāra Mahrārādžas komentārs:\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"translation\"\u003e\u003ci\u003eŚrī-rūpa-mañjarī-pada, sei mora sampada, sei mora bhajana-pūjana\u003c/i\u003e – Šrī Rūpas Gosvāmī svētās pēdas man ir viss!\u003cbr\u003e\nIr jāsaprot, ka pastāv daudzi \u003ci\u003erasas\u003c/i\u003e līmeņi un veidi: \u003ci\u003ešānta, dāsja, sakhja, vātsalja, madhura\u003c/i\u003e. Un \u003ci\u003emadhura rasā\u003c/i\u003e Rādharanī grupa ir īpaša. Tāpat arī \u003ci\u003esakhī\u003c/i\u003e vidū pastāv hierarhija. Ir \u003ci\u003emandžarī\u003c/i\u003e, jaunu meiteņu, grupa. Viņām ir lielāka brīvība tuvoties Dievišķajam Pārim: kad Rādha un Govinda ir tikai viens otra sabiedrībā, \u003ci\u003emandžarī\u003c/i\u003e joprojām var viņiem tuvoties. \u003ci\u003eMandžarī\u003c/i\u003e ir šāda privilēģija. Ja kalpošanai kaut kas ir nepieciešams, \u003ci\u003esakhī\u003c/i\u003e sūta uz šo vietu \u003ci\u003emandžarī\u003c/i\u003e. Sakhī netuvojas Rādhai un Krišnam. Vislielāko uzticību bauda \u003ci\u003emandžarī\u003c/i\u003e.\u003cbr\u003e\n\u003ci\u003eMandžarī\u003c/i\u003e veic visslepenāko kalpošanu Dievišķajam Pārim un šajā augstākajā stāvoklī viņām ir brīva pieeja. Viņas vada Rūpa Mandžarī, kura \u003ci\u003emadhura-bhadžanā\u003c/i\u003e ir burtiski viss. To mums māca Narottams Thākurs. Mums un jaunajām \u003ci\u003emandžarī\u003c/i\u003e viņa ir augstākais patvērums.\u003cbr\u003e\n\u003ci\u003eSei mora sampada\u003c/i\u003e – mana bagātība slēpjas viņas pēdās. \u003ci\u003eSei mora bhajana-pūjana\u003c/i\u003e – es pielūdzu viņu un kalpoju viņai. \u003ci\u003eSei mora prāṇa-dhana, sei mora ābharaṇa\u003c/i\u003e – viņa ir manas dzīves jēga un patiesā bagātība. Manas dzīves rotājums, ja man tāds ir, ir viņas žēlastība. \u003ci\u003eSei mora jīvanera jīvana\u003c/i\u003e – manas dzīvības dzīvība, nešaubīgi, ir viņa. Es eksistēju viņas priekam.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"translation\"\u003e\u003ci\u003eSei mora rasa-nidhi\u003c/i\u003e – ja kārotais ekstāzes avots eksistē, tad tas ir viņā. Visu \u003ci\u003erasu\u003c/i\u003e avots ir viņas pēdās.  \u003ci\u003eSei mora vāñchā-siddhi\u003c/i\u003e – jebkāds dzīves piepildījums, ko vien es varētu vēlēties, ir viņas pēdās. \u003ci\u003eSei mora vedera dharama\u003c/i\u003e – ja Vēdas man iesaka veikt kādu pienākumu, es vēlos, lai šis pienākums ir pie viņas pēdām.\u003cbr\u003e\n\u003ci\u003eSei brata, sei tapa\u003c/i\u003e – ja vien ir iespējams uzkrāt dievbijību, kas rodas nožēlojot grēkus un stingri pildot zvērestus, tā visa ir viņā. \u003ci\u003eSei mora mantra-japa\u003c/i\u003e – nepārtraukta lūgšanu atkārtošana \u003ci\u003edžapā\u003c/i\u003e – tā noved pie viņas. Manā dzīvē viss tiecas uz vienu mērķi, viss ved pie Rūpas Mandžarī pēdām. Ja viņa ir apmierināta, tad visu manu garīgo dzīvi var uzskatīt par veiksmīgu. \u003ci\u003eSei mor dharama-karama\u003c/i\u003e – visi mani priekšstati par pienākumu un visu veidu darbību visos līmeņos tiecas uz vienu mērķi un satiekas tur – pie Rūpas Mandžarī svētajām pēdām.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"translation\"\u003e\u003ci\u003eAnukūla habe viddhi, se-pade hoibe siddhi\u003c/i\u003e – mana vienīgā lūgšana šīs pasaules valdniekam ir: “Lūdzu Tevi, ļauj man ar viņu saskarties! Ak, Absolūtais Pavēlniek, jel sadzirdi manu lūgšanu par to, lai par manu mērķi kļūst viņas labvēlība! \u003ci\u003eNirakhibo e dui nayane\u003c/i\u003e – tas būs tik dziļi un reāli, it kā es to redzētu savām acīm. Es vēlos vienīgi patiesu atklāsmi, nevis kaut ko neskaidru, abstraktu vai iedomātu, – lai notiek tā pateicoties Absolūtā Pavēlnieka žēlastībai!” \u003ci\u003eSe rūpa-mādhurī-rāśi, prāṇa-kuvalaya-śaśī\u003c/i\u003e – kāds neaptverams skaistums ir ietverts viņas svētajās pēdās! Es vēlos ielēkt tur. Lai mana sirds kļūst par lotosu.\u003cbr\u003e\nPastāv divu veidu lotosi: baltais, kas nācis no saules, un sarkanais, kas nācis no mēness. \u003ci\u003eKuvalaja\u003c/i\u003e ir abu apvienojums. Viņas ķermeņa mirdzums kā manas dzīves dzīvības avots dienā un naktī baros mani līdzīgi kā \u003ci\u003ekuvalaju\u003c/i\u003e (\u003ci\u003ekuvalaja\u003c/i\u003e dzīvo un barojas pateicoties mēness gaismai). Viņas svētās pēdas ir mēness, kamēr mans dzīvības spēks līdzinās lotosam. Lai viņas skaistuma spožums uztur un baro manas sirds dzīles! \u003ci\u003ePraphullita hobe niśi-dine\u003c/i\u003e – manas sirds lotoss, šīs gaismas apmirdzēts, plauks un ziedēs.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"translation\"\u003e\u003ci\u003eTuyā adarśana-ahi\u003c/i\u003e – tāda ir mana lūgšana, bet kāds gan ir mans pašreizējais stāvoklis? Tas ir briesmīgs, mana kundze! Ja es tevi neredzēšu, tava žēlastība, mana sirds sadegs līdz pelniem! Lūk, šāds ir mans pašreizējais stāvoklis! \u003ci\u003eGorole jāralo dehī\u003c/i\u003e – tas atgādina kobras indi, kura nodara sāpes manai sirdij. Man ir iedzēlusi čūska, bet kas gan tā ir par čūsku? Man nav pieejama saskarsme ar tevi, tava žēlastība! Čūskas inde saldē manu sirdi un es mirstu. \u003ci\u003eChiro-dina tāpita jīvana\u003c/i\u003e – tas nenotika piepeši, es vienmēr esmu cietis dēļ atšķirtības no tik brīnišķīgas, cerību pilnas un piepildītas dzīves.\u003cbr\u003e\n\u003ci\u003eHā hā rūpa koro doyā, deho more pada-chāyā, narottama loilo śaraṇa\u003c/i\u003e – šobrīd esmu sasniedzis izmisuma galējo robežu un pēdējo reizi lūdzu tavu labvēlību, jo pretējā gadījumā esmu pagalam!\u003cbr\u003e\nŠādu lūgšanu uzrakstīja Narottams Thākurs slavinot Šrīlu Rūpu Gosvāmī. Šādi viņš mums ļāva ieskatīties augstākā līmeņa \u003ci\u003ebhadžana\u003c/i\u003e dzīvē. Mūsu \u003ci\u003esampradaja\u003c/i\u003e nes \u003ci\u003eRūpanūga-sampradajas\u003c/i\u003e vārdu, un mūsu \u003ci\u003eguru-paramparas\u003c/i\u003e mācības tiek saskaņotas ar šīm atklāsmēm. Narottams Thākurs uzrakstīja daudzas dziesmas. Tās visas ir Dieva iedvesmotas, ekstātiskas un dziļas ticības pilnas.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection class=\"category\"\u003e\n\u003ch1\u003eŠrī Šikšāštakam\u003c/h1\u003e\n\u003csection class=\"song\" id=\"song-pita-varana-kali-pavana-gora\" data-translated=\"1\"\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003ch2\u003eŚrī Śikṣāṣṭakam 1 \u003cspan class=\"nav-links\"\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#toc\"\u003e↑\u003c/a\u003e\u0026nbsp;\u0026nbsp;\u003ca href=\"#first-lines\"\u003e↓\u003c/a\u003e\u003c/span\u003e\u003c/h2\u003e\n\u003cp class=\"translation\"\u003ePirmais Šrī Šikšāštakam pants ir šāds:\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"\"\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echeto-darpaṇa-mārjanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;bhava-mahā-dāvāgni-nirvāpaṇaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eśreyaḥ-kairava-chandrikā-\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vitaraṇaṁ vidyā-vadhu-jīvanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eānandāmbudhi-vardhanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;prati-padaṁ pūrṇāmṛtāsvādanaṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003esarvātma-snapanaṁ paraṁ\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;vijayate śrī-kṛṣṇa-saṅkīrtanam\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKrišnas Svētais Vārds attīra sirds spoguli un dzēš ciešanu uguni dzimšanu un miršanu mežā! Kā vēsajos mēness staros uzplaukst nakts lotoss, tā Svētā Vārda nektārā uzplaukst sirds.\u003cbr\u003e\nTad dvēsele mostas un apzinās savu īsteno iekšējo bagātību – dzīvi mīlestībā ar Krišnu! Malkojot šo nektāru, dvēsele gremdējas pieaugošas svētlaimes okeānā.\u003cbr\u003e\nIkviena sirdī mītoša vēlēšanās, kāda vien iedomājama, tiek atbildēta un attīrīta. Tad dvēsele pilnībā nodod sevi Krišnas Svētā Vārda viļņiem, kas dvēseli attīra pilnībā.\u003cbr\u003e\n\u003ci\u003ePaskaidrojums grāmatā: \u003ca href=\"https://krishnasearch.com/#/book/en-GoldenVolcanoofDivineLove?c=12\u0026p=12\" target=\"_blank\"\u003eThe Golden Volcano of Divine Love. Part II Śikṣāṣṭakam: The Holy Name of Kṛṣṇa\u003c/a\u003e\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"1\"\u003e\n\u003ch5\u003e1\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epīta-varaṇa kali-pāvana gorā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003egāoyāi aichana bhāva-bibhorā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003eKungs Gauranga, kura ķermenis ir zelta krāsā, ir kritušo dvēseļu glābējs \u003ci\u003eKali-jugā\u003c/i\u003e! Pārdzīvojot garīgu svētlaimi, viņš dzied šo dziesmu.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"2\"\u003e\n\u003ch5\u003e2\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003echitta-darpaṇa-parimārjana-kārī\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-kīrtana jaya chitta-bihārī\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Visa slava Krišnas Svētā Vārda dziedāšanai! Tā pilnībā notīra sirds spoguli un sajūsmina dvēseli.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"3\"\u003e\n\u003ch5\u003e3\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ehelā-bhava-dāva-nirvāpaṇa-vṛtti\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-kīrtana jaya kleśa-nivṛtti\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Visa slava Krišnas Svētā Vārda dziedāšanai! Tā dzēš materiālās esības uguni un atbrīvo no visām ciešanām un raizēm.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"4\"\u003e\n\u003ch5\u003e4\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eśreyaḥ-kumuda-bidhu-jyotsnā-prakāśa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-kīrtana jaya bhakti-vilāsa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Visa slava Krišnas Svētā Vārda dziedāšanai! Tā parādās sirdī līdzīgi mēnesim, kas lej dzīvinošu gaismu, pateicoties kurai plaukst un zied dvēseles labās veiksmes baltais lotoss. \u003ci\u003eKrišna-kīrtans\u003c/i\u003e ir \u003ci\u003ebhakti-vilasa\u003c/i\u003e — garīgas kalpošanas brīnišķīgā rotaļa.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"5\"\u003e\n\u003ch5\u003e5\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eviśuddha-vidyā-vadhu jīvana-rūpa\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-kīrtana jaya siddha-svarūpa\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Visa slava Krišnas Svētā Vārda dziedāšanai! Tā atklāj dvēseles īsteno dabu attiecībās ar Kungu līdz pat dievišķai laulībai. Svētā Vārda dziedāšana ir pati dzīves pilnība”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"6\"\u003e\n\u003ch5\u003e6\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003eānanda-payo-nidhi-vardhana-kīrti\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-kīrtana jaya plābana-mūrti\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Visa slava Krišnas Svētā Vārda dziedāšanai! \u003ci\u003eKrišna-kīrtans\u003c/i\u003e liek ekstātiskas svētlaimes okeānam plūst pāri malām. Tā ir nebeidzama garīgās mīlestības plūsma.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"7\"\u003e\n\u003ch5\u003e7\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003epade pade pījuṣa-svāda-pradātā\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-kīrtana jaya prema-bidhātā\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"translation\"\u003e“Visa slava Krišnas Svētā Vārda dziedāšanai! \u003ci\u003eKrišna-kirtans\u003c/i\u003e ik uz soļa sniedz nektāra garšu, bet noslēgumā apdāvina ar ekstātisku mīlestību uz Dievu.”\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"verse-block\" data-number=\"8\"\u003e\n\u003ch5\u003e8\u003c/h5\u003e\n\u003cp class=\"verse\"\u003e\u003cstrong\u003ebhakativinoda-svātma-snapana-vidhān\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003ekṛṣṇa-kīrtana jaya prema-nidān\u003c/strong\u003e\u003c/p\u00
