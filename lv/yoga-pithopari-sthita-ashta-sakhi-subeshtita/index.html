kutūhole\"],\"translation\":[\"Dažkārt savā labestībā viņi ņem mani aiz rokas un uzrunā mani maigiem, saldiem vārdiem. Viņi ēd manis gatavotos beteles riekstus un ar lielu prieku pieņem no manis ziedu virteni.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"adarśana hoya kokhona ki chole\",\"nā dekhiyā do̐he hiyā mora jvole\"],\"translation\":[\"Pēc tam viņi atkal pazūd! Kad es neredzu Rādhu un Krišnu, mana sirds deg agonijas liesmās.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"jekhāne sekhāne,    thākuka du’ jane,\",\"    āmi to charaṇa-dāsī\",\"milane ānanda,    virahe jātanā,\",\"    sakala sammāna vāsi\"],\"translation\":[\"Lai kur viņi būtu, es esmu viņu lotosam līdzīgo pēdu kalps. Gan piedzīvojot tikšanās laimi, gan esot atšķirtības agonijā, es esmu un palieku viņu mūžīgais kalps.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"rādhā-kṛṣṇa prāṇa mor jīvane maraṇe\",\"more rākhi’ māri’ sukhe thākuka du’ jone\"],\"translation\":[\"Rādha un Krišna ir mana dzīvība un dvēsele, gan dzīvē, gan nāvē. Lai viņi dara ar mani, ko vēlas — sargā vai pazudina, lai tikai viņi abi ir laimīgi.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"bhakativinoda,    āna nāhi jāne,\",\"    poḍi’ nija-sakhī-pāy\",\"rādhikāra goṇe    thākiyā satata,\",\"    jugala-charaṇa chāy\"],\"translation\":[\"Bhaktivinoda nezina neko, kā tikai viņus. Krītot pie *sakhī* pēdām, Bhaktivinoda lūdzas par palikšanu Šrī Rādhas uzticamāko kalpoņu vidū. Šrī Rādhas un Šrī Krišnas lotosa pēdas ir Bhaktivinoda mūžīgā vēlēšanās.\",\"Piezīme pie dziesmas 8b: *Šrīla Šrīdhārs Mahārādža ieteica nedziedāt šo dziesmu, jo tā ir \\\"pārāk augsta\\\".*\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"20:[\"$\",\"$L28\",null,{\"navMap\":{\"192\":{\"prev\":{\"path\":\"/lv/bondhu-gon-shiunoho-vachana-mora/\",\"title\":\"8a. Bondhu-goṇ! śunoho\"},\"next\":{\"path\":\"/lv/m
