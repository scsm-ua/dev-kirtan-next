amala, koṭī-chandra-suśītala\"},\"title\":[\"Manaḥ-Śikṣā\"],\"author\":[\"Šrīla Narottams Dāsa Thākurs\"],\"verses\":[{\"number\":\"1\",\"text\":[\"nitāi-pada-kamala,    koṭī-chandra-suśītala,\",\"    je chāyāya jagata juḍāy\",\"heno nitāi bine bhāi,    rādhā-kṛṣṇa pāite nāi,\",\"    dṛḍha kori dharo nitāira pāya\"],\"translation\":[\"Nitjānandas Prabhū svētās, lotosam līdzīgās pēdas mirdz līdzīgi desmit miljoniem mēnešu, kuru ēnā visa pasaule gūst nomierinošu atvieglojumu! Brāl, bez Nitjānandas neviens nevarēs piekļūt Rādhai un Krišnam, tādēļ ar pilnu apņēmību turies pie Viņa lotosam līdzīgajām pēdām!\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"se sambandha nāhi jāra,    vṛthā janma gelo tāra,\",\"    sei paśu boḍo durāchāra\",\"nitāi nā bolilo mukhe,    majilo saṁsāra-sukhe,\",\"    vidyā-kule ki koribe tāra\"],\"translation\":[\"Tas, kuram nav saiknes ar Viņu, ir nodzīvojis savu dzīvi veltīgi – viņš līdzinās nelaimīgam dzīvniekam! Tas, kura lūpas nekad nav izteikušas “Nītaj”, ir pasaulīgo baudu varā. Kā gan viņa aristokrātiskās saknes var viņu glābt?\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"ahaṅkāre matta hoiyā, nitāi-pada pāsariyā,\",\"    asatyere satya kori māni\",\"nitāiyer karuṇā habe, vraje rādhā-kṛṣṇa pābe,\",\"    dharo nitāiyer charaṇ du’ khāni\"],\"translation\":[\"Neprātīgs un aizmirsis par Nitjānandas Prabhū lotosam līdzīgajām pēdām, es pieņemu melus par patiesību! Taču, ja Nitjānanda Prabhū dāvās tev savu žēlsirdību, tu satiksi Rādhu un Krišnu Vradžā! Jel apskauj Nitjānandas lotosam līdzīgās pēdas!\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"nitāiyer charaṇa satya, tā̐hāra sevaka nitya,\",\"    nitāi-pada sadā kara āśa\",\"narottama boḍo duḥkhī, nitāi more kara sukhī\",\"    rākho rāṅgā-charaṇera pāśa\"],\"translation\":[\"Nitjānandas lotosam līdzīgās pēdas ir Patiesība, un Viņa kalpi ir mūžīgi. Vienmēr tiecies pieņemt patvērumu pie Viņa pēdām! Narottams dāsa ir ļoti nelaimīgs! Ak, Nītaj, padari mani laimīgu! Lūdzos.. ļauj man vienmēr atrasties pie Tavām brīnišķīgajām, lotosam līdzīgajām pēdām!\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-nitai-pada\"},{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-nitai-pada-1\"},{\"title\":{\"en\":\"Srila B.N. Acharya Maharaj\",\"ru\":\"Шрила Б.Н. Ачарья Махарадж\",\"ua\":\"Шріла Б.Н. Ачарʼя Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/acharya-maharaj-nitay-pada\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"20:[\"$\",\"$L29\",null,{\"audio\":\"$1f:props:song:resources:audio\",\"caption\":\"Klausies audio:\",\"language\":\"lv\"}]\n21:[\"$\",\"$L2a\",null,{\"navMap\":{\"111\":{\"prev\":{\"path\":\"/lv/yamunambu-krishna-radhikali-keli-mandalam/\",\"title\":\"61-72. Piektdiena\"},\"next\":{\"path\":\"/lv/sujanarvuda-radhita-pada-yugam/\",\"title\":\"Śrī Śrī Prabhupāda-padma Stavakaḥ\"}}}}]\n2b:T1231,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"alternateName\":[\"Kirtan Guide\",\"Vaishnava Songbook\"],\"description\":\"A digital Vaishnava songbook and kirtan guide with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}
