\"tuyā adarśana-ahi,    gorole jāralo dehi,\",\"    chiro-dina tāpita jīvana\",\"hā hā rūpa kara dayā,    deho more pada-chāyā,\",\"    narottama loilo śaraṇa\"],\"isLong\":false},{\"subtitle\":[\"Šrīlas Bhakti Rakšaka Šrīdhāra Mahrārādžas komentārs:\"],\"isLong\":false},{\"number\":\"1\",\"translation\":[\"*Śrī-rūpa-mañjarī-pada, sei mora sampada, sei mora bhajana-pūjana* – Šrī Rūpas Gosvāmī svētās pēdas man ir viss!\",\"Ir jāsaprot, ka pastāv daudzi *rasas* līmeņi un veidi: *šānta, dāsja, sakhja, vātsalja, madhura*. Un *madhura rasā* Rādharanī grupa ir īpaša. Tāpat arī *sakhī* vidū pastāv hierarhija. Ir *mandžarī*, jaunu meiteņu, grupa. Viņām ir lielāka brīvība tuvoties Dievišķajam Pārim: kad Rādha un Govinda ir tikai viens otra sabiedrībā, *mandžarī* joprojām var viņiem tuvoties. *Mandžarī* ir šāda privilēģija. Ja kalpošanai kaut kas ir nepieciešams, *sakhī* sūta uz šo vietu *mandžarī*. Sakhī netuvojas Rādhai un Krišnam. Vislielāko uzticību bauda *mandžarī*.\",\"*Mandžarī* veic visslepenāko kalpošanu Dievišķajam Pārim un šajā augstākajā stāvoklī viņām ir brīva pieeja. Viņas vada Rūpa Mandžarī, kura *madhura-bhadžanā* ir burtiski viss. To mums māca Narottams Thākurs. Mums un jaunajām *mandžarī* viņa ir augstākais patvērums.\",\"*Sei mora sampada* – mana bagātība slēpjas viņas pēdās. *Sei mora bhajana-pūjana* – es pielūdzu viņu un kalpoju viņai. *Sei mora prāṇa-dhana, sei mora ābharaṇa* – viņa ir manas dzīves jēga un patiesā bagātība. Manas dzīves rotājums, ja man tāds ir, ir viņas žēlastība. *Sei mora jīvanera jīvana* – manas dzīvības dzīvība, nešaubīgi, ir viņa. Es eksistēju viņas priekam.\"],\"isLong\":false},{\"number\":\"2\",\"translation\":[\"*Sei mora rasa-nidhi* – ja kārotais ekstāzes avots eksistē, tad tas ir viņā. Visu *rasu* avots ir viņas pēdās.  *Sei mora vāñchā-siddhi* – jebkāds dzīves piepildījums, ko vien es varētu vēlēties, ir viņas pēdās. *Sei mora vedera dharama* – ja Vēdas man iesaka veikt kādu pienākumu, es vēlos, lai šis pienākums ir pie viņas pēdām.\",\"*Sei brata, sei tapa* – ja vien ir iespējams uzkrāt dievbijību, kas rodas nožēlojot grēkus un stingri pildot zvērestus, tā visa ir viņā. *Sei mora mantra-japa* – nepārtraukta lūgšanu atkārtošana *džapā* – tā noved pie viņas. Manā dzīvē viss tiecas uz vienu mērķi, viss ved pie Rūpas Mandžarī pēdām. Ja viņa ir apmierināta, tad visu manu garīgo dzīvi var uzskatīt par veiksmīgu. *Sei mor dharama-karama* – visi mani priekšstati par pienākumu un visu veidu darbību visos līmeņos tiecas uz vienu mērķi un satiekas tur – pie Rūpas Mandžarī svētajām pēdām.\"],\"isLong\":false},{\"number\":\"3\",\"translation\":[\"*Anukūla habe viddhi, se-pade hoibe siddhi* – mana vienīgā lūgšana šīs pasaules valdniekam ir: “Lūdzu Tevi, ļauj man ar viņu saskarties! Ak, Absolūtais Pavēlniek, jel sadzirdi manu lūgšanu par to, lai par manu mērķi kļūst viņas labvēlība! *Nirakhibo e dui nayane* – tas būs tik dziļi un reāli, it kā es to redzētu savām acīm. Es vēlos vienīgi patiesu atklāsmi, nevis kaut ko neskaidru, abstraktu vai iedomātu, – lai notiek tā pateicoties Absolūtā Pavēlnieka žēlastībai!” *Se rūpa-mādhurī-rāśi, prāṇa-kuvalaya-śaśī* – kāds neaptverams skaistums ir ietverts viņas svētajās pēdās! Es vēlos ielēkt tur. Lai mana sirds kļūst par lotosu.\",\"Pastāv divu veidu lotosi: baltais, kas nācis no saules, un sarkanais, kas nācis no mēness. *Kuvalaja* ir abu apvienojums. Viņas ķermeņa mirdzums kā manas dzīves dzīvības avots dienā un naktī baros mani līdzīgi kā *kuvalaju* (*kuvalaja* dzīvo un barojas pateicoties mēness gaismai). Viņas svētās pēdas ir mēness, kamēr mans dzīvības spēks līdzinās lotosam. Lai viņas skaistuma spožums uztur un baro manas sirds dzīles! *Praphullita hobe niśi-dine* – manas sirds lotoss, šīs gaismas apmirdzēts, plauks un ziedēs.\"],\"isLong\":false},{\"number\":\"4\",\"translation\":[\"*Tuyā adarśana-ahi* – tāda ir mana lūgšana, bet kāds gan ir mans pašreizējais stāvoklis? Tas ir briesmīgs, mana kundze! Ja es tevi neredzēšu, tava žēlastība, mana sirds sadegs līdz pelniem! Lūk, šāds ir mans pašreizējais stāvoklis! *Gorole jāralo dehī* – tas atgādina kobras indi, kura nodara sāpes manai sirdij. Man ir iedzēlusi čūska, bet kas gan tā ir par čūsku? Man nav pieejama saskarsme ar tevi, tava žēlastība! Čūskas inde saldē manu sirdi un es mirstu. *Chiro-dina tāpita jīvana* – tas nenotika piepeši, es vienmēr esmu cietis dēļ atšķirtības no tik brīnišķīgas, cerību pilnas un piepildītas dzīves.\",\"*Hā hā rūpa koro doyā, deho more pada-chāyā, narottama loilo śaraṇa* – šobrīd esmu sasniedzis izmisuma galējo robežu un pēdējo reizi lūdzu tavu labvēlību, jo pretējā gadījumā esmu pagalam!\",\"Šādu lūgšanu uzrakstīja Narottams Thākurs slavinot Šrīlu Rūpu Gosvāmī. Šādi viņš mums ļāva ieskatīties augstākā līmeņa *bhadžana* dzīvē. Mūsu *sampradaja* nes *Rūpanūga-sampradajas* vārdu, un mūsu *guru-paramparas* mācības tiek saskaņotas ar šīm atklāsmēm. Narottams Thākurs uzrakstīja daudzas dziesmas. Tās visas ir Dieva iedvesmotas, ekstātiskas un dziļas ticības pilnas.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-sri-rupa\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"$L25\",null,{\"audio\":\"$1b:props:song:resources:audio\",\"caption\":\"Klausies audio:\",\"language\":\"lv\"}]\n1d:[\"$\",\"$L26\",null,{\"navMap\":{\"173\":{\"prev\":{\"path\":\"/lv/hari-he-dayala-mora-jaya-radha-natha/\",\"title\":\"Dainya O Prapatti\"},\"next\":{\"path\":\"/lv/pita-varana-kali-pavana-gora/\",\"title\":\"1. Pita-varaṇa kali\"}}}}]\n27:Te0a,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organi
