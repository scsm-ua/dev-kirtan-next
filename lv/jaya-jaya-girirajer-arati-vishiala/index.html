[\"Kundas nesalīdzināmais skaistums ir kā aromātisks medus. Kungs Indra un dievišķā govs Surabhī spožajos labvēlīgas veiksmes staros veic savu kalpošanu.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"śrī bhakti-rakṣaka deva-gosvāmī śrīdhara\",\"prakāśilā tava sevā dīpta manohara\"],\"translation\":[\"Šrīla Bhakti Rakšaks Šrīdhārs Dēv-Gosvāmī Mahārādža dāvā savu spožo un burvīgo garīgo kalpošanu uzticībā Tev.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"śrī chaitanya-sārasvata maṭha suśobhana\",\"yathā nitya sevā kore sārasvata-gaṇa\"],\"translation\":[\"Šrī Čaitanja Sarasvat Maths ir ļoti skaista vieta, kur Matha bhaktas vienmēr atrodas iekšējā garīgas kalpošanas noskaņojumā.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"gosvāmī śrī-raghunātha dāsere smariyā\",\"nirantara sevā kore antarmaṇā hoiyā\"],\"translation\":[\"Atceroties Šrī Raghunāthu Dāsu Gosvāmī, viņi kalpo, iegrimuši apcerīgā noskaņojumā.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"jaya gupta-govardhana divya-rasāloy\",\"rūpa-raghunāthānuga-bhaktera āśroy\"],\"translation\":[\"Visa slava apslēptajam Govardhanam, transcendentālās rasas rezervuāram! Tas ir Šrī Rūpas un Šrī Raghunātha pēdās sekojošo bhaktu patvērums.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"kuliyā-prakāśa tava achintya-mahimā\",\"divāniśi bhakta-vṛnda kore parikramā\"],\"translation\":[\"Ar savu neizmērojamo slavu un augstsirdību Tu parādīji Kuliju (vietu, kur tiek piedoti visi apvainojumi). Dienu un nakti bhaktas te veic parikramu — apstaigā šo vietu garīgas kalpošanas noskaņojumā.\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"sevya o sevaka-rūpe nitya parakāśa\",\"sānande ārati dekhe e adhama dāsa\"],\"translation\":[\"Mūžam Tu sevi izpaud kā Kungu, kuru pielūdz, un kā Kungu, kurš kalpo. Kritušais kalps redz tavu āratī un izjūt milzīgu prieku!\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><
