 ho’bo āmi\",\"pratiṣṭhāśā āsi’,    hṛdoya dūṣibe,\",\"    hoibo nirayagāmī\"],\"translation\":[\"Ja es maldīgi domāšu, ka esmu Vaišnavs, es sākšu vēlēties saņemt no apkārtējiem cieņu. Ja manu sirdi piesārņos slāpes pēc slavas un cieņas, man nešaubīgi būs jādodas uz mūžīgu elli.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"tomāra kiṅkora,    āpane jānibo,\",\"    ‘guru’-abhimān tyaji’\",\"tomāra uchiṣṭha,    padajala-reṇu,\",\"    sadā niṣkapaṭe bhaji\"],\"translation\":[\"Atsacīšanās no maldīgā priekšstata, ka esmu ‘guru’, man ļaus atklāt, ka esmu tavs pazemīgais kalps. Ar patiesu cieņu es pieņemu tava ēdiena paliekas, ak, Vaišnav. Tāpat es pielūdzu arī ūdeni, kurš mazgājis svētos putekļus no tavām lotosa pēdām.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"‘nije sreṣṭha’ jāni’,    uchiṣṭhādi dāne,\",\"    ha’be abhimān bhār\",\"tāi śiṣya tava,    thākiyā sarvadā,\",\"    nā loibo pūjā kā’ra\"],\"translation\":[\"Ja es dalīšu citiem sava ēdiena paliekas, sākšu uzskatīt, ka es ieņemu augstāku stāvokli, un viltus lepnums mani apgrūtinās ar savu smagumu. Tādēļ, vienmēr paliekot tavam uzticīgajam skolniekam, es nepieņemšu pielūgsmi ne no viena cita.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"amānī mānada,    hoile kīrtane\",\"    adhikār dibe tumi\",\"tomāra charaṇe,    niṣkapaṭe āmi,\",\"    kā̐diyā luṭibo bhūmi\"],\"translation\":[\"Ja tu dāvāsi man spēju dziedāt Svēto Vārdu, es izrādīšu cieņu citiem un necerēšu sagaidīt cieņu pret sevi. Ekstāzē es patiesi raudāšu, vārtoties pa zemi pie tavām lotosam līdzīgajām pēdām.\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1a:[\"$\",\"$L22\",null,{\"navMap\":{\"137\":{\"prev\":{\"path\":\"/lv/ei-vara-karuna-kara-vaishnava-gosani/\",\"title\":\"Vaiṣṇava Vijñāpti\"},\"next\":{\"path\":\"/lv/narada-muni-bajaya-vina/\",\"title\":\"Śrī Nāmāṣṭakam 8\"}}}}]\n23:Tbcf,"])</scri
