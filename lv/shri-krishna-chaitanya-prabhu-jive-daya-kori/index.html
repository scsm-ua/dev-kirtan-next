:[\"atyanta durlabha prema koribāre dāna\",\"śikhāya saraṇāgati bhakatera prāṇa\"],\"translation\":[\"Tu atnāci, lai dāsni dāvātu tik reto dievišķo mīlestību, sludinot nedalītu pašatdevi, bhaktu dzīves pašu būtību.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"dainya, ātmanivedana, goptṛtve varaṇa\",\"‘avaśya rakṣibe kṛṣṇa’—viśvāsa pālana\"],\"translation\":[\"Pazemība, pašatdeve, sevis atdošana Dieva gribai, “Krišna mani noteikti pasargās” – šādas ticības uzturēšana.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"bhakti-anukūla mātra kārjera svīkāra\",\"bhakti-pratikūla bhāva—varjanāṅgīkāra\"],\"translation\":[\"Kalpošanai labvēlīgas darbības pieņemšana un nelabvēlīgas – noraidīšana.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"ṣaḍ-aṅga śaraṇāgati hoibe jā̐hāra\",\"tā̐hāra prārthanā śune śrī-nandakumāra\"],\"translation\":[\"To lūgšanas, kuri sniedz sevi Dievam šajos sešos veidos, nešaubīgi tiks Nandas dēla sadzirdētas!\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"rūpa-sanātana-pade dante tṛṇa kori’\",\"bhakativinoda poḍe dui pada dhori’\"],\"translation\":[\"Saspiežot zobos zāles stiebriņu un krītot pie Šrī Rūpas un Šrī Sanātanas pēdām, Šrī Bhaktivinoda pazemīgi apskauj viņu svētās, lotosam līdzīgās pēdas.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"kā̐diyā kā̐diyā bole, āmi to’ adhama\",\"śikhāye śaraṇāgati karahe uttama\"],\"translation\":[\"Raudot, lejot asaras, es vēršos pie viņiem: “Es esmu pats kritušākais! Lūdzu, māciet man pašatdevi, māciet man tīru kalpošanu!”\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"23:[\"$\",\"$L2b\",null,{\"navMap\":{\"50\":{\"prev\":{\"path\":\"/lv/samsara-davanala-lidha-loka/\",\"title\":\"Śrī Śrī Gurvāṣṭaka\"},\"next\":{\"path\":\"/lv/vibhavari-shiesha-aloka-praveshia/\",\"title\":\"Vibhāvarī Śeṣa\"}}}}]\n2c:Te1f,"])</script><script>self.__next_f.push([1,"{\"@c
