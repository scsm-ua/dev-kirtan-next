ildītu Vēdās solīto, brahmana dēls vārdā Mahāprabhu, kura ķermenis laistās zeltā, atnāca kopā ar savu brāli avadhūtu Nitjānandu. Kopīgi viņi pārpludināja Nādiju ar dievišķo ekstāzi.”\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"nanda suta jini,    chaitanya gosāi,\",\"    nija-nāma kori’ dāna\",\"tārilo jagat,    tumi-o jāiyā,\",\"    loho nija-paritrāṇa\"],\"translation\":[\"“Šrī Čaitanja, pats Krišna, glāba šo pasauli, dāvājot tai savu Svēto Vārdu. Ej un iegūsti šo atbrīvi arī tu!”\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"se kathā śuniyā,    āsiyāchi, nātha!\",\"    tomāra charaṇa-tole\",\"bhakativinoda,    kā̐diyā kā̐diyā,\",\"    āpana-kāhinī bole\"],\"translation\":[\"Ak, Kungs, dzirdot šos vārdus, Bhaktivinoda raud, lūdzas pēc Tavu lotosam līdzīgo pēdu dzīvinošās ēnas un stāsta savas dzīves stāstu.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.R. Sridhar Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.Р. Шридхар Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.Р. Шрідгар Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/sridhar-maharaj-and-govinda-7\"},{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-emona-durmati\"},{\"title\":{\"en\":\"Srila B.N. Acharya Maharaj\",\"ru\":\"Шрила Б.Н. Ачарья Махарадж\",\"ua\":\"Шріла Б.Н. Ачарʼя Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/acharya-maharaj-emona-durmati\"},{\"title\":{\"en\":\"Srila B.S. Goswami Maharaj\",\"ru\":\"Шрила Б.С. Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/goswami-maharaj-emona-durmati\"},{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-emona-durmati\"},{\
