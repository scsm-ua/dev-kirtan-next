ira upara bosābo du’jon\"],\"translation\":[\"Es novietošu Dievišķo Pāri uz dārgakmeņiem rotāta troņa maigā kadambas koku birzī Jamunas upes krastā.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"śyāma-gaurī-aṅge dibo chandanera gandha\",\"chāmara ḍhulābo kobe heri mukha-chandra\"],\"translation\":[\"Ak, kad gan es varēšu uzlikt aromātisko sandalkoka pastu uz Kunga Šjāmasundara un Šrīmatī Rādharānī ķermeņiem? Kad gan es varēšu viņus vēdināt ar *čāmaras* vēdekli? Kad varēšu skatīt viņu mēnesim līdzīgās sejas?\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"gāṅthiyā mālātir mālā dibo doṅhara gole\",\"adhare tuliyā dibo karpūra-tāmbule\"],\"translation\":[\"Ak, kad gan es varēšu vērt malatī  ziedu vītnes un likt tās Dievišķajam Pārim kaklā? Kad gan es varēšu cienāt viņus ar betela riekstiem, samaisītiem ar kamparu?\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"lalitā visākhā-ādi jata sakhī-vṛnda\",\"ājñāya koribo sevā charaṇāravinda\"],\"translation\":[\"Ak, kad gan, sekojot Lalitas, Višākhas un citu gopīju norādījumiem, es varēšu kalpot Dievišķā Pāra lotosu pēdām?\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"śrī-kṛṣṇa-chaitanya-prabhur dāser anudāsa\",\"sevā abhilāṣa kore narottama-dāsa\"],\"translation\":[\"Narottams Dāsa, Šrī Krišnas Čaitanjas Mahāprabhū kalpa kalps, ilgojas pēc kalpošanas Dievišķajam Pārim.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/krsnachaitanya-das/34-radha-krsna-prana-mora-yugala-kisora-6\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"$L25\",null,{\"audio\":\"$1b:props:song:resources:audio\",\"caption\":\"Klausies audio:\",\"language\":\"lv\"}]\n1d:[\"$\",\"$L26\",null,{\"navMap\":{\"205\
