t atbrīvošanu. Taču tavas īpašības ir tādas, ka ar vienkāršu tevis uzlūkošanu, var sasniegt to pašu!\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"hari-sthāne aparādhe tāre harināma\",\"tomā-sthāne aparādhe nāhika eḍāna\"],\"translation\":[\"Ja kāds izdara apvainojumu Kunga Harī svētajām pēdām, viņam var tikt piedots, ja viņš skandē Viņa Svēto Vārdu. Taču, ja kāds apvaino tevi, viņam nav glābiņa!\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"tomāra hṛdaye sadā govinda-viśrāma\",\"govinda kahena mama vaiṣṇava parāna\"],\"translation\":[\"Tavā sirdī vienmēr mīt Kungs Govinda. Pats Šrī Govinda saka: “Mani bhaktas ir Mana dzīvība un dvēsele!”\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"prati janme kari āśā charaṇera dhuli\",\"narottame kara dayā āpanāra vali\"],\"translation\":[\"Es ceru, ka katrā dzīvē saskaršos ar putekļiem no tavām lotosam līdzīgajām pēdām. Šrī Narottams lūdzas: “Ak, svētais Vaišnav, lūdzu, esi žēlsirdīgs pret mani!”\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-ei-baro-koruna\"},{\"title\":{\"en\":\"Srila B.R. Madhusudan Maharaj\",\"ru\":\"Шрила Б.Р. Мадхусудан Махарадж\",\"ua\":\"Шріла Б.Р. Мадгусудан Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/madhusudan-maharaj-vaishnava\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"20:[\"$\",\"$L29\",null,{\"audio\":\"$1f:props:song:resources:audio\",\"caption\":\"Klausies audio:\",\"language\":\"lv\"}]\n21:[\"$\",\"$L2a\",null,{\"navMap\":{\"136\":{\"prev\":{\"path\":\"/lv/je-anilo-prema-dhana-karuna-prachura/\",\"title\":\"Viraha-gīti\"},\"next\":{\"path\":\"/lv/kripa-kara-vaishnava-thakura/\",\"title\":\"Prārthanā L
