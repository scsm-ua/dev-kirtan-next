e\":\"SongHeader__author\",\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[false,[\"$\",\"a\",null,{\"href\":\"/lv/authors/\",\"rel\":\"author\",\"children\":\"Šrīla Bhakti Sundar Govinda Dēv-Gosvāmī Mahārādža\"}]]}]]}]]]}]]\n"])</script><script>self.__next_f.push([1,"22:[\"$\",\"$L2b\",null,{\"bookId\":\"lv\",\"label\":\"Parādīt tulkojumu\",\"song\":{\"meta\":{\"page\":46,\"first_line\":\"jaya ‘guru-mahārāja’ jati-rājeśvara\"},\"title\":[\"Śrī Guru Ārati-stuti\"],\"author\":[\"Šrīla Bhakti Sundar Govinda Dēv-Gosvāmī Mahārādža\"],\"verses\":[{\"number\":\"1\",\"text\":[\"jaya ‘guru-mahārāja’ jati-rājeśvara\",\"śrī-bhakti-rakṣaka deva-gosvāmī śrīdhara\"],\"translation\":[\"Visa slava tev, Guru Mahārādža, *sannjasī* pavēlniek, Šrīla Bhakti Rakšak Dēv-Gosvāmī Šrīdhār!\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"patita-pāvana-līlā vistāri’ bhuvane\",\"nistārilā dīna-hīna āpāmara jane\"],\"translation\":[\"Šai pasaulei tu paudi savas rotaļas, atnākot kā kritušo dvēseļu pestītājam. Tu glābi visas ciešanu pārņemtās dvēseles, pat visnecienīgākās.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"tomāra karuṇāghana murati heriyā\",\"preme bhāgyavāna jīva poḍe murachiyā\"],\"translation\":[\"Skatot tavu svēto veidolu, kurš iemieso dievišķu žēlsirdību, īpaši vaiksmīgas dvēseles gūst iespēju gremdēties dievišķas mīlestības ekstāzē.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"sudīrgha supībya deho divya-bhāvāśray\",\"divya-jñāna dīpta-netra divya-jyotirmoy\"],\"translation\":[\"Tavs cēlais veidols dievišķo jūtu oreolā priecē mūsu acis! Tavs skatiens ir dievišķa vieduma pilns un mirdzums, kuru tu izstaro, izplatās pa visu Visumu.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"suvarṇa-sūraja-kānti aruṇa-vasana\",\"tilaka, tulasī-mālā, chandana-bhūṣaṇa\"],\"translation\":[\"Tērpies safrāna drānās, rotāts ar *tīlakām* un krellēm no tulasī, iesvaidīts ar aromātisku sandalkoka pastu, tu mirdzi līdzīgs Saulei!\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"apūrva śrī-aṅga-śobhā kore jhalamala\",\"audārya-unnata-bhāva mādhurya-ujjvala\"],\"translation\":[\"Tavs neatkārtojamais svētais tēls ir žilbinoši skaists! Tava labvēlība, līdzīga Mēness gaismai, lej pāri visiem dievišķās mīlestības gaismu.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"achintya-pratibhā, snigdha, gambhīra, udāra\",\"jaḍa-jñāna-giri-vajra divya-dīkṣādhāra\"],\"translation\":[\"Tavs neaptveramais talants, mīlestība, diženums un žēlsirdība sagrauj pasaulīgās zināšanas un atklāj dievišķo realitāti.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"gaura-saṅkīrtana-rāsa-rasera āśray\",\"“dayāla nitāi” nāme nitya premamoy\"],\"translation\":[\"Rodot patvērumu *sankirtanā* un slavējot Zeltīto Kungu Gaurangu, ekstāzē, mīlestības pārpilns tu sauc: “Dojal Nitaj, Dojal Nitaj!”.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"sāṅgopāṅge gaura-dhāme nitya-parakāśa\",\"gupta-govardhane divya-līlāra-vilāsa\"],\"translation\":[\"Ar saviem pavadoņiem mūžam mītot Navadvīpas Dhamā, pēc savas vēlēšanās, tu baudi savas augstās rotaļas Gupta-Govardhanā (slēptajā Govardhana kalnā).\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"gauḍīya-āchārya-goṣṭhī-gaurava-bhājana\",\"gauḍīya-siddhāntamaṇi kaṇṭha-vibhuṣaṇa\"],\"translation\":[\"Tu pelnīti aizņem tik augstu stāvokli Gaudija-*āčārju* vidū! Tu līdzinies pērlei Gaudija-*siddhantas* dārgumu lādē.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"gaura-sarasvatī-sphūrta siddhāntera khani\",\"āviṣkṛta gāyatrīra artha-chintāmaṇi\"],\"translation\":[\"Tu esi pats Šrī Gauras vēstījuma iemiesojums, pilnīgu slēdzienu avots. Tu atklāji Gājatrī – visas vēlēšanās piepildošā filosofu akmens, iekšējo nozīmi!.\"],\"isLong\":false},{\"number\":\"12\",\"text\":[\"eka-tattva varṇanete nitya-nava-bhāva\",\"susaṅgati, sāmañjasya, e saba prabhāva\"],\"translation\":[\"Kad tu runā par kādu tēmu, tu vienmēr atklāj to jaunā gaismā! Tava garīgā varenība ir tavā pilnīgajā izpratnē par to, kā ieņemt pareizo stāvokli un atrasties harmonijā ar apkārtējo.\"],\"isLong\":false},{\"number\":\"13\",\"text\":[\"tomāra satīrtha-varga sabe eka-mate\",\"rūpa-sarasvatī-dhārā dekhena tomāte\"],\"translation\":[\"Visi tavi garīgie brāļi vienbalsīgi sludina, ka redz tevī Rūpas Gosvāmī un Sarasvatī Thākura mācības iemiesojumu.\"],\"isLong\":false},{\"number\":\"14\",\"text\":[\"tulasī-mālikā-haste śrī-nāma-grahaṇa\",\"dekhi’ sakalera hoy ‘prabhu’ uddīpana\"],\"translation\":[\"Skatot, kā tu sauc Svēto Vārdu ar tulasī krellēm rokās, visi atminas Sarasvatī Thākuru.\"],\"isLong\":false},{\"number\":\"15\",\"text\":[\"koṭī-chandra-suśītala o pada bharasā\",\"gāndharvā-govinda-līlāmṛta-lābha-āśā\"],\"translation\":[\"Kalpošana tavām pēdām, kuru mirdzums līdzinās desmit miljoniem mēnešu, uztur manu ticību. Pateicoties tavai žēlsirdībai, kādu dienu mēs malkosim Šrī Šrī Rādhas-Govindas rotaļu nektāru!\"],\"isLong\":false},{\"number\":\"16\",\"text\":[\"avichintya-bhedābheda-siddhānta-prakāśa\",\"sānande ārati stuti kore dīna-dāsa\"],\"translation\":[\"Šrī Čaitanjas Mahāprabhu atklātās Brīnišķīgās Realitātes iemiesojums! Tavs pazemīgais kalps ar prieku dzied šo lūgšanu un velta to tev!\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-sri-guru-arati\"},{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-jaya-guru\"},{\"title\":{\"en\":\"Srila B.K. Ashram Maharaj\",\"ru\":\"Шрила Б.К. Ашрам Махарадж\",\"ua\":\"Шріла Б.К. Ашрам Махарадж\"},\"embed_url\":\"https://soundcloud.com/scsmathcolombia/4-sri-guru-arati-stuti\"},{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},
