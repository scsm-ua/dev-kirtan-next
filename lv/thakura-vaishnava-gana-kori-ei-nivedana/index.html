"])</script><script>self.__next_f.push([1,"20:[\"$\",\"$L29\",null,{\"bookId\":\"lv\",\"label\":\"Parādīt tulkojumu\",\"song\":{\"meta\":{\"page\":\"134/1\",\"first_line\":\"ṭhākura vaiṣṇava-gaṇa kori ei nivedana\"},\"title\":[\"Ṭhākura-vaiṣṇava-gaṇa\"],\"author\":[\"Šrīla Narottams Dāsa Thākurs\"],\"verses\":[{\"number\":\"1\",\"text\":[\"ṭhākura vaiṣṇava-gaṇa    kori ei nivedana\",\"    mo boḍo adhama durāchāra\",\"dāruṇa-saṁsāra-nidhi    tāhe ḍhūbailo vidhi\",\"    keśe dhori more kara para\"],\"translation\":[\"Svētie Vaišnavi, kaut arī esmu kritis bezgodis, es vēršos pie jums ar lūgumu! Liktenis ir iemetis mani šajā biedējošajā atkārtojošos dzimšanu un nāvju bezdibenī! Lūdzu jūs, glābiet mani no šī bezdibeņa, izvelciet mani aiz matiem!\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"vidhi boḍo valavān    na śune dharama-jñāna\",\"    sadāi karama-pāśe bāndhe\",\"nā dekhi tāraṇa leśa    jata dekhi saba kleśa\",\"    anātha kātare te̐i kānde\"],\"translation\":[\"Mans liktenis ir tik varens, ka nespēju sadzirdēt garīgās dzīves zināšanas un vienmēr esmu sapinies *karmas* pavedienos. Es nespēju ieraudzīt ceļu uz glābšanu! Manu acu priekšā ir vienīgi ciešanu pasaule! Bezspēcīgs un sēru salauzts, es raudu.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"kāma krodha lobha moha    mada abhimāna saha\",\"    āpana āpana sthāne ṭāne\",\"aichāna āmāra mana    phire jena andha jana\",\"    supatha vipatha nāhi jāne\"],\"translation\":[\"Es līdzinos aklajam, kurš nespēj atšķirt, kur ir patiesība, bet kur – maldi! Iekāre, naids, skopums, ilūzija, neprāts un lepnums bez žēlastības mētā mani šurpu turpu!\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"na loinu sat mata    asate majilo chita\",\"    tuyā pāye na korinu āśa\",\"narottama dāse koy    dekhi śuni lage bhay\",\"    tarāiyā loho nija pāśa\"],\"translation\":[\"Manu prātu pievilināja īslaicīgs maņu apmierinājums un es neapzinājos patieso savas dzīves mērķi, tādēļ pat necentos krist pie Tavām lotosam līdzīgajām pēdām, ak, Kungs! Narottams Dāsa lūdzas: “Tagad, kad es varu redzēt un dzirdēt Vaišnavus, esmu atbrīvojies no visām bailēm.”\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.K. Ashram Maharaj\",\"ru\":\"Шрила Б.К. Ашрам Махарадж\",\"ua\":\"Шріла Б.К. Ашрам Махарадж\"},\"embed_url\":\"https://soundcloud.com/scsmathcolombia/10-thakura-vaisnava-gana\"},{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-thakura-vaisnava\"},{\"title\":{\"en\":\"Bhakti Lalita Devi\",\"ru\":\"Бхакти Лалита Деви\",\"ua\":\"Бгакті Лаліта Деві\"},\"embed_url\":\"https://soundcloud.com/bhakti-lalita-devi/bhakti-lalita-devi-thakura-vaishnava-gana\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"21:[\"$\",\"$L2a\",null,{\"audio\":\"$20:props:song:resources:audio\",\"caption\":\"Klausies audio:\",\"language\":\"lv\"}]\n22:[\"$\",\"$L2b\",null,{\"navMap\":{\"134/1\":{\"prev\":{\"path\":\"/lv/vibhavari-shiesha-aloka-praveshia/\",\"title\":\"Vibhāvarī Śeṣa\"},\"next\":{\"path\":\"/lv/hari-haraye-namah-krishna-yadavaya-namah/\",\"title\":\"Nāma-Saṅkīrttan\"}}}}]\n2c:T1287,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"alternateName\":[\"Kirtan Guide\",\"Vaishnava Songbook\"],\"description\":\"A digital Vaishnava songbook and kirtan guide with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPage\",\"@id\":\"https://dev.kirtan.site/lv/thakura-v
