alse,[\"$\",\"a\",null,{\"href\":\"/lv/authors/\",\"rel\":\"author\",\"children\":\"Šrīla Bhaktivinoda Thākurs\"}]]}]]}]]]}]]\n"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"$L25\",null,{\"bookId\":\"lv\",\"label\":\"Parādīt tulkojumu\",\"song\":{\"meta\":{\"page\":189,\"first_line\":\"gāite gāite nāma ki dośā hoilo\"},\"title\":[\"Śrī Śikṣāṣṭakam 7a\"],\"author\":[\"Šrīla Bhaktivinoda Thākurs\"],\"verses\":[{\"translation\":[\"Septītais Šrī Šikšāštakam pants ir šāds:\"],\"isLong\":false},{\"text\":[\"yugāyitaṁ nimeṣeṇa\",\"chakṣuṣā prāvṛṣāyitaṁ\",\"śūnyāyitaṁ jagat sarvaṁ\",\"govinda-viraheṇa me\"],\"translation\":[\"“Govinda, bez tevis pasaule ir tukša! Asaras nebeidzamām straumēm plūst no manām acīm un katrs mirklis līdzinās bezgalībai!”\",\"*Paskaidrojums grāmatā: [The Golden Volcano of Divine Love. Part II Śikṣāṣṭakam: Forever Without You](https://krishnasearch.com/#/book/en-GoldenVolcanoofDivineLove?c=18\u0026p=8).*\"],\"isLong\":false},{\"number\":\"1\",\"text\":[\"gāite gāite nāma ki dośā hoilo\",\"‘kṛṣṇa-nitya-dāsa mui’ hṛdoye sphurilo\"],\"translation\":[\"Pie kā esmu nonācis atkal un atkal dziedot Svēto Vārdu? Savā sirdī esmu atklājis: “Es esmu Krišnas mūžīgais kalps!”\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"jānilām māyā-pāśe e jaḍa-jagate\",\"govinda-virahe duḥkha pāi nānā-mate\"],\"translation\":[\"Es atskārtu, ka esmu šajā pelēkajā materiālajā Visumā majas virvju sasiets un neizturami ciešu atšķirtībā no Kunga Govindas.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"āro je saṁsāra mora nāhi lāge bhālo\",\"kā̐hā jāi kṛṣṇa heri e chintā biśālo\"],\"translation\":[\"Nekas šajā dzimšanu un nāvju pasaulē man īpaši nepatīk. Kur gan man doties, lai ieraudzītu Krišnu? Šīs ir manas lielākās raizes.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"kā̐dite kā̐dite mora ā̐khi-boriṣoya\",\"barṣā-dhārā heno chakṣe hoilo udoya\"],\"translation\":[\"Es neapturami raudu. Gluži kā lietus musonu periodā, man no acīm plūst asaras.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"nimeṣa hoilo mora śata-juga-sam\",\"govinda-viraha āra sohite akṣam\"],\"translation\":[\"Tagad viens mirklis man ir kā simts mūžības. Atšķirtība no Kunga Govindas man vairs nav izturama.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"śūnya dharā-tala,    chaudike dekhiye,\",\"    parāṇa udāsa hoya\",\"ki kori, ki kori,    sthira nāhi hoya,\",\"    jīvana nāhiko roya\"],\"translation\":[\"Pasaule ir tukša. Es lūkojos uz visām pusēm, taču visapkārt ir vien tukšums. Mana dzīve ir tukša, prāts ir vienaldzīgs. Nekas nerada manī prieku. Esmu salauzts un vientuļš, dzīve ir zaudējusi jēgu. Ko man iesākt? Esmu zaudējis mieru un nespēju vairs turpināt šo dzīvi.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"vraja-vāsi-gaṇa    mora prāṇa rākho\",\"    dekhāo śrī-rādhā-nāthe\",\"bhakativinoda-    minati māniyā,\",\"    laohe tāhāre sāthe\"],\"translation\":[\"Vrindāvanas iedzīvotāji, glābiet jel mani — parādiet man Rādhanāthu, Šrī Rādhas Kungu! Kungs, sadzirdi šo pazemīgo Bhaktivinoda lūgšanu, dāvā man savu sabiedrību un paņem mani sev līdzi.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"śrī kṛṣṇa-viraha āro sohite nā pāri\",\"parāṇa chāḍite āro din dui chāri\"],\"translation\":[\"Nespējot ilgāk paciest atšķirtību no mana Kunga, esmu gatavs atvadīties no dzīves kaut pēc dažām dienām.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Bhakti Lalita Devi\",\"ru\":\"Бхакти Лалита Деви\",\"ua\":\"Бгакті Лаліта Деві\"},\"embed_url\":\"https://soundcloud.com/bhakti-lalita-devi/gaite-gaite-nama-ki-dasa-hoilo\"},{\"title\":{\"en\":\"Srila B.N. Acharya Maharaj\",\"ru\":\"Шрила Б.Н. Ачарья Махарадж\",\"ua\":\"Шріла Б.Н. Ачарʼя Махарадж\"},\"embed_url\":\"https://soundcloud.com/kostya-netrebenko/106-srisrisiksastakam7-2\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1d:[\"$\",\"$L26\",null,{\"audio\":
