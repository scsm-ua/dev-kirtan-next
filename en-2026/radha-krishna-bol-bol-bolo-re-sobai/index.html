“Rādhā-Kṛṣṇa!” Everyone chant!\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"(rādhā) kṛṣṇa bala, saṅge chala,\",\"                ei-mātra bhikhā chāi\",\"        (jāy) sakala bipada bhaktivinoda,\",\"                bolena jakhana o-nāma gāi\"],\"translation\":[\"Simply chant “Rādhā-Kṛṣṇa!” and join with us. Those are the only alms we beg. Chant, chant “Rādhā-Kṛṣṇa!” Everyone chant! “All dangers will be gone when that Name is chanted,” says Bhakti Vinod Ṭhākur. Chant, chant “Rādhā-Kṛṣṇa!” Everyone chant!\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"18:[\"$\",\"$L1f\",null,{\"navMap\":{\"149\":{\"prev\":{\"path\":\"/en-2026/yadi-te-hari-pada-saroja-sudha/\",\"title\":\"Śrī Godruma-chandra-bhajanopadeśa\"},\"next\":{\"path\":\"/en-2026/hari-bole-modera-gaura-elo/\",\"title\":\"Śrī Nagara Kīrtana 8\"}}}}]\n20:Tbcd,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"description\":\"A digital Vaishnava songbook with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPage\",\"@id\":\"https://dev.kirtan.site/en-2026/radha-krishna-bol-bol-bolo-re-sobai/\",\"url\":\"https://dev.kirtan.site/en-2026/radha-krishna-bol-bol-bolo-re-sobai/\",\"name\":\"Śrī Nagara Kīrtana 4. by Śrīla Bhakti Vinod Ṭhākur. Śrī Nāma from Gītāvalī\",\"inLanguage\":\"en\",\"description\":\"Śrī Nagara Kīrtana 4 — a Vaiṣṇava song by Śrīla Bhakti Vinod Ṭhākur with lyrics, English translation and word-by-word meaning. From Kirtan Guide.\",\"breadcrumb\":{\"@id\":\"https://d
