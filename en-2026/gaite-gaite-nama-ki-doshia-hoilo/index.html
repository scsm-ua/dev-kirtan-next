":[false,[\"$\",\"a\",null,{\"href\":\"/en-2026/authors#section-Śrīla Bhakti Vinod Ṭhākur\",\"children\":\"by Śrī Chaitanya Mahāprabhu in Sanskrit\"}]]}]]}]]]}]]\n"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"$L24\",null,{\"bookId\":\"en-2026\",\"label\":\"Show verses / translation\",\"song\":{\"meta\":{\"page\":202,\"author\":\"Śrīla Bhakti Vinod Ṭhākur\",\"first_line\":\"gāite gāite nāma ki daśā ha-ila\",\"alt_first_lines\":[\"Śrī Śikṣāṣṭakam – Verse 7 (a)\",\"yugāyitaṁ nimeṣeṇa chakṣuṣā prāvṛṣāyitam\"]},\"title\":[\"Śrī Śikṣāṣṭakam\"],\"author\":[\"by Śrī Chaitanya Mahāprabhu in Sanskrit\"],\"subtitle\":[\"Verse Seven\"],\"verses\":[{\"text\":[\"yugāyitaṁ nimeṣeṇa chakṣuṣā prāvṛṣāyitam\",\"śūnyāyitaṁ jagat sarvaṁ govinda-viraheṇa me\"],\"translation\":[\"“O Govinda! Without You, the world is empty. Tears are flooding my eyes like rain, and a moment seems like forever.”\",\"---\",\"*Corresponding Bengali composition by Śrīla Bhakti Vinod Ṭhākur:*\"],\"isLong\":false},{\"number\":\"1\",\"text\":[\"gāite gāite nāma ki daśā ha-ila\",\"“kṛṣṇa-nitya-dāsa mui” hṛdaye sphurila\"],\"translation\":[\"Chanting the Name again and again, what was my condition? Within my heart I realised, “I am an eternal servant of Kṛṣṇa.”\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"jānilāma māyā-pāśe e jaḍa jagate\",\"govinda-virahe duḥkha pāi nānā-mate\"],\"translation\":[\"I realised that I was bound by Māyā’s ropes in this dull mundane universe, and I simply experience misery in various ways due to separation from Lord Govinda.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"āra ye saṁsāra mora nāhi lāge bhāla\",\"kā̐hā yāi’ kṛṣṇa heri e chintā viśāla\"],\"translation\":[\"And I don’t much like this world of birth and death. Where shall I go to see Kṛṣṇa? This was my biggest worry.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"kā̐dite kā̐dite mora ā̐khi variṣaya\",\"varṣā-dhārā hena chakṣe ha-ila udaya\"],\"translation\":[\"I began weeping and weeping; my tears fell. Torrents of rain poured from my eyes just like the rains of the monsoon season.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"nimeṣa ha-ila mora śata yuga-sama\",\"govinda-viraha āra sahite akṣama\"],\"translation\":[\"Now, a moment for me is like a hundred ages. I cannot bear this separation from Lord Govinda.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"śūnya dharā-tala    chaudike dekhiye\",\"    parāṇa udāsa haya\",\"ki kari ki kari    sthira nāhi haya\",\"    jīvana nāhika raya\"],\"translation\":[\"The world is empty; as I survey the four directions, the entire surface of the world is void. My life is empty, my mind is listless; I am indifferent and apathetic towards everything. Depressed, melancholy and forlorn, my life has no meaning now. What do I do now? I cannot remain steady. I can no longer maintain my life.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"vraja-vāsi-gaṇa    mora prāṇa rākha\",\"    dekhāo śrī-rādhā-nāthe\",\"bhakati-vinoda-    minati māniyā\",\"    laohe tāhāre sāthe\"],\"translation\":[\"O residents of Vṛndāvan, save my life and show me Rādhānāth, the Lord of Śrī Rādhā. Considering this humble prayer of Bhakti Vinod, please give him Your association and take him with You.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"śrī-kṛṣṇa-viraha āra sahite nā pāri\",\"parāṇa chhāḍite āra dina dui chāri\"],\"translation\":[\"I am unable to further tolerate this separation from my Lord Kṛṣṇa and am ready to give up my life within a few days (lit. two or four days).\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1d:[\"$\",\"$L25\",null,{\"navMap\":{\"202\":{\"prev\":{\"path\":\"/en-2026/matala-hari-jana-kirtana-range/\",\"title\":\"– Honouring Rāga-mārg From Afar\"},\"next\":{\"path\":\"/en-2026/gaite-govinda-nam-upajilo-bhava-gram/\",\"title\":\"7b. Gāite ‘govinda’–nām\"}}}}]\n26:T430,{\"@
