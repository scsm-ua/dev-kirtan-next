w verses / translation\",\"song\":{\"meta\":{\"page\":239,\"author\":\"Śrīla Bhakti Vinod Ṭhākur\",\"first_line\":\"nagare nagare gorā gāya\"},\"title\":[\"Śrī Kṛṣṇera Viṁśottara-śata-nāma\"],\"author\":[\"by Śrīla Bhakti Vinod Ṭhākur\"],\"subtitle\":[\"One Hundred and Twenty Names of Śrī Kṛṣṇa\"],\"verses\":[{\"text\":[\"nagare nagare gorā gāya\"],\"translation\":[\"From village to village, Śrī Gaurāṅga sings!\"]},{\"number\":\"1\",\"text\":[\"yaśomatī-stanya-pāyī śrī-nanda-nandana\",\"indra-nīla-maṇi vraja-janera jīvana\"],\"translation\":[\"(1) O drinker of Mother Yaśodā’s breastmilk, (2) O son of Śrī Nanda,\\\\\",\"(3) O sapphire jewel, (4) O life of the people of Vraja!\"]},{\"number\":\"2\",\"text\":[\"śrī-gokula-niśācharī-pūtanā-ghātana\",\"duṣṭa-tṛṇāvarta-hantā śakaṭa-bhañjana\"],\"translation\":[\"(5) O killer of the witch Pūtanā in Śrī Gokula,\\\\\",\"(6) O destroyer of the wicked Tṛṇāvarta, (7) O dispeller of Śakaṭa!\"]},{\"number\":\"3\",\"text\":[\"navanīta-chora dadhi-haraṇa-kuśala\",\"yamala-arjuna-bhañjī govinda gopāla\"],\"translation\":[\"(8) O butter thief, (9) O expert at stealing yoghurt, (10) O breaker of the two Arjuna trees, (11) O pleaser of the cows, (12) O cowherd boy!\"]},{\"number\":\"4\",\"text\":[\"dāmodara vṛndāvana-go-vatsa-rākhāla\",\"vatsāsurāntaka hari nija-jana-pāla\"],\"translation\":[\"(13) O He who is bound about the belly by a rope, (14) O keeper of the cows and calves of Vṛndāvan, (15) O destroyer of Vatsāsura,\\\\\",\"(16) O He who takes away (the sins, miseries, and obstacles to devotion from His devotees), (17) O maintainer of His own!\"]},{\"number\":\"5\",\"text\":[\"baka-śatru agha-hantā brahma-vimohana\",\"dhenuka-nāśana kṛṣṇa kāliya-damana\"],\"translation\":[\"(18) O enemy of Baka, (19) O slayer of Agha, (20) O bewilderer of Brahmā, (21) O destroyer of Dhenuka, (22) O He who attracts and satisfies all, (23) O subduer of Kāliya!\"]},{\"number\":\"6\",\"text\":[\"pītāmbara śikhi-pichchha-dhārī veṇu-dhara\",\"bhāṇḍīra-kānana-līla dāvānala-hara\"],\"translation\":[\"(24) O He of yellow garments, (25) O He who wears a peacock feather, (26) O holder of the veṇu flute, (27) O He who performs Pastimes in the Bhāṇḍīra forest, (28) O extinguisher of the forest fire!\"]},{\"number\":\"7\",\"text\":[\"naṭavara guhāchara śarata-vihārī\",\"vallabhī-vallabha deva gopī-vastra-hārī\"],\"translation\":[\"(29) O best of dancers, (30) O He who wanders in the caves,\\\\\",\"(31) O reveller of the autumn, (32) O lover of the cowherd maidens,\\\\\",\"(33) O playful one, (34) O stealer of the gopīs’ clothes!\"]},{\"number\":\"8\",\"text\":[\"yajña-patnī-gaṇa-prati karuṇāra sindhu\",\"govardhana-dhṛk mādhava vraja-vāsī-bandhu\"],\"translation\":[\"(35) O ocean of mercy for the wives of the brāhmaṇas engaged in sacrifice, (36) O lifter of Govardhan, (37) O descendent of Madhu,\\\\\",\"(38) O friends of the residents of Vraja!\"]},{\"number\":\"9\",\"text\":[\"indra-darpa-hārī nanda-rakṣitā mukunda\",\"śrī-gopī-vallabha rāsa-krīḍa pūrṇānanda\"],\"translation\":[\"(39) O remover of Indra’s pride, (40) O protector of Nanda,\\\\\",\"(41) O giver of liberation, (42) O lover of the gopīs,\\\\\",\"(43) O player of Rāsa, (44) O complete joy!\"]},{\"number\":\"10\",\"text\":[\"śrī-rādhā-vallabha rādhā-mādhava sundara\",\"lalitā-viśākhā-ādi-sakhī-prāṇeśvara\"],\"translation\":[\"(45) O lover of Śrī Rādhā, (46) O sweetness of Rādhā, (47) O beautiful one, (48) O Lord of the hearts of Lalitā, Viśākhā, and the other sakhīs!\"]},{\"number\":\"11\",\"text\":[\"nava-jaladhara-kānti madana-mohana\",\"vana-mālī smera-mukha gopī-prāṇa-dhana\"],\"translation\":[\"(49) O He of the complexion of a fresh rain cloud,\\\\\",\"(50) O bewilderer of Cupid, (51) O He who wears a forest garland,\\\\\",\"(52) O He of smiling face, (53) O life and wealth of the gopīs!\"]},{\"number\":\"12\",\"text\":[\"tri-bhaṅgī muralī-dhara yāmuna-nāgara\",\"rādhā-kuṇḍa-raṅga-netā rasera sāgara\"],\"translation\":[\"(54) O thrice bent, (55) O holder of the muralī flute, (56) O paramour on the Yamunā, (57) O leader of the play at Rādhā Kuṇḍa,\\\\\",\"(58) O ocean of rasa!\"]},{\"number\":\"13\",\"text\":[\"chandrāvalī-prāṇanātha kautukābhilāṣī\",\"rādhā-māna-sulampaṭa milana-prayāsī\"],\"translation\":[\"(59) O Lord of the heart of Chandrāvalī, (60) O desirer for play,\\\\\",\"(61) O Lord, eager to overcome of Rādhā’s jealous anger,\\\\\",\"(62) O seeker of union!\"]},{\"number\":\"14\",\"text\":[\"mānasa-gaṅgāra dānī prasūna-taskara\",\"gopī-saha-haṭhakārī vraja-vaneśvara\"],\"translation\":[\"(63) O tax-collector at Mānasa Gaṅgā, (64) O blossom thief, (65) O He who is impetuous with the gopīs, (66) O Lord of the forest of Vraja!\"]},{\"number\":\"15\",\"text\":[\"gokula-sampada gopa-duḥkha-nivāraṇa\",\"durmada-damana bhakta-santāpa-haraṇa\"],\"translation\":[\"(67) O wealth of Gokula, (68) O vanquisher of the cowherders’ sorrow,\\\\\",\"(69) O subduer of pride, (70) O remover of the devotees’ distress!\"]},{\"number\":\"16\",\"text\":[\"sudarśana-mochana śrī-śaṅkhachūḍāntaka\",\"rāmānuja śyāmachā̐da muralī-vādaka\"],\"translation\":[\"(71) O liberator of (the Vidyādhara) Sudarśan, (72) O destroyer of Śrī Śaṅkhachūḍa, (73) O younger brother of Balarām, (74) O dark moon,\\\\\",\"(75) O player of the muralī flute!\"]},{\"number\":\"17\",\"text\":[\"gopī-gīta-śrotā madhusūdana murāri\",\"ariṣṭa-ghātaka rādhā-kuṇḍādi-vihārī\"],\"translation\":[\"(76) O hearer of the Gopī-gītā, (77) O destroyer of Madhu,\\\\\",\"(78) O enemy of Mura, (79) O slayer of Ariṣṭa,\\\\\",\"(80) O reveller at Rādhā Kuṇḍa and other places!\"]},{\"number\":\"18\",\"text\":[\"vyomāntaka padma-netra keśī-nisūdana\",\"raṅga-krīḍa kaṁsa-hantā malla-praharaṇa\"],\"translation\":[\"(81) O killer of Vyoma, (82) O lotus-eyed one, (83) O destroyer of Keśī, (84) O Lord of merry play, (85) O killer of Kaṁsa,\\\\\",\"(86) O combatant of the wrestlers!\"]},{\"number\":\"19\",\"text\":[\"vasudeva-suta vṛṣṇi-vaṁśa-kīrti-dhvaja\",\"dīnanātha mathureśa devakī-garbhaja\"],\"translation\":[\"(87) O son of Vasudev, (88) O emblem of the Vṛṣṇi dynasty’s fame,\\\\\",\"(89) O Lord of the poor, (90) O Lord of Mathurā,\\\\\",\"(91) O son of Devakī!\"]},{\"number\":\"20\",\"text\":[\"kubjā-kṛpāmaya viṣṇu śauri nārāyaṇa\",\"dvārakeśa naraka-ghna śrī-yadu-nandana\"],\"translation\":[\"(92) O He who is merciful to Kubjā, (93) O all-pervading one,\\\\\",\"(94) O descendant of Śūrasena, (95) O shelter of all beings,\\\\\",\"(96) O Lord of Dvārakā, (97) O destroyer of Naraka,\\\\\",\"(98) O son of Yadu!\"]},{\"number\":\"21\",\"text\":[\"śrī-rukmiṇī-kānta satyā-pati sura-pāla\",\"pāṇḍava-bāndhava śiśupālādira kāla\"],\"translation\":[\"(99) O husband of Rukmiṇī, (100) O husband of Satyābhāmā,\\\\\",\"(101) O protector of the gods, (102) O dear friend of the Pāṇḍavas,\\\\\",\"(103) O death of Śiśupāl and others!\"]},{\"number\":\"22\",\"text\":[\"jagadīśa janārdana keśavārta-trāṇa\",\"sarva-avatāra-bīja viśvera nidāna\"],\"translation\":[\"(104) O Lord of the universe, (105) O exciter of the people,\\\\\",\"(106) O He of fine hair, (107) O deliverer from distress,\\\\\",\"(108) O origin of all Avatārs, (109) O cause of the universe!\"]},{\"number\":\"23\",\"text\":[\"māyeśvara yogeśvara brahma-tejādhāra\",\"sarvātmāra ātmā prabhu prakṛtira pāra\"],\"translation\":[\"(110) O Lord of Māyā, (111) O master of yoga,\\\\\",\"(112) O source of the Brahman effulgence, (113) O soul of all souls,\\\\\",\"(114) O master of all souls, (115) O far shore of material nature!\"]},{\"number\":\"24\",\"text\":[\"patita-pāvana jagannātha sarveśvara\",\"vṛndāvanachandra sarva-rasera ākara\"],\"translation\":[\"(116) O purifier of the fallen, (117) O Lord of the universe,\\\\\",\"(118) O Lord of all, (119) O moon of Vṛndāvan,\\\\\",\"(120) O source of all rasa!\"]},{\"number\":\"25\",\"text\":[\"nagare nagare gorā gāya\",\"bhakati-vinoda tachhu pāya\"],\"translation\":[\"From village to village, Śrī Gaurāṅga sings, and Bhakti Vinod falls at His feet.\"]}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"3f:[\"$\",\"$L46\",null,{\"navMap\":{\"239\":{\"prev\":{\"path\":\"/en-2026/nadiya-nagare-nitai-neche-neche-gay-re/\",\"title\":\"Śrīman Mahāprabhura Śata-nāma\"},\"next\":{\"path\":\"/en-2026/shri-hari-vasare-hari-kirtana-vidhana/\",\"title\":\"Śrī Hari-vāsara Gīti\"}}}}]\n47:T455,{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"CollectionPage\",\"@id\":\"https://dev.kirtan.site/en-2026/nagare-nagare-gora-gay\",\"url\":\"https://dev.kirtan.site/en-2026/nagare-nagare-gora-gay\",\"name\":\"Śrī Kṛṣṇera Viṁśottara-śata-nāma. by Śrīla Bhakti Vinod Ṭhākur. One Hundred and Twenty Names of Śrī Kṛṣṇa\",\"inLanguage\":\"en\",\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"}},{\"@type\":\"MusicComposition\",\"@id\":\"https://dev.kirtan.site/en-2026/nagare-nagare-gora-gay#composition\",\"alternateName\":[\"nagare nagare gorā gāya\"],\"name\":\"Śrī Kṛṣṇera Viṁśottara-śata-nāma. by Śrīla Bhakti Vinod Ṭhākur. One Hundred and Twenty Names of Śrī Kṛṣṇa\",\"url\":\"https://dev.kirtan.site/en-2026/nagare-nagare-gora-gay\",\"composer\":{\"@type\":\"Person\",\"name\":\"Śrīla Bhakti Vinod Ṭhākur\"},\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"},\"about\":[{\"@type\":\"Thing\",\"name\":\"Bhakti Yoga\"},{\"@type\":\"Thing\",\"name\":\"Gaudiya Vaishnavism\"}],\"genre\":[\"Devotional\",\"Bhajan\",\"Kirtan\"],\"mainEntityOfPage\":{\"@id\":\"https://dev.kirtan.site/en-2026/nagare-nagare-gora-gay\"}}]}40:[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$47\"}}]\n41:[\"$\",\"$L48\",null,{\"bookId\":\"en-2026\",\"page\":239}]\n42:[\"$\",\"$L49\",null,{\"bookId\":\"en-2026\",\"songId\":\"nagare-nagare-gora-gay\"}]\n43:[\"$\",\"$L4a\",null,{}]\n44:[\"$\",\"$L4b\",null,{\"bookId\":\"en-2026\"}]\n"])</script></body></html>
