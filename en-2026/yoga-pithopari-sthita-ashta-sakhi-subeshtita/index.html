}]\n"])</script><script>self.__next_f.push([1,"40:[\"$\",\"$L48\",null,{\"bookId\":\"en-2026\",\"label\":\"Show verses / translation\",\"song\":{\"meta\":{\"page\":206,\"author\":\"Śrīla Bhakti Vinod Ṭhākur\",\"first_line\":\"yoga-pīṭhopari-sthita aṣṭa-sakhī-suveṣṭita\",\"alt_first_lines\":\"Śrī Śikṣāṣṭakam – Verse 8 (b)\"},\"title\":[\"Śrī Śikṣāṣṭakam\"],\"subtitle\":[\"Verse Eight (b)\"],\"verses\":[{\"translation\":[\"*Second related composition by Śrīla Bhakti Vinod Ṭhākur:*\",\"(Regarding this, Śrīla Śrīdhar Mahārāj advised not to sing this composition because “it is too high.”)\"]},{\"number\":\"1\",\"text\":[\"yoga-pīṭhopari-sthita    aṣṭa-sakhī-suveṣṭita\",\"    vṛndāraṇye kadamba-kānane\",\"rādhā-saha vaṁśī-dhārī    viśva-jana-chitta-hārī\",\"    prāṇa mora tā̐hāra charaṇe\"],\"translation\":[\"At the yoga-pīṭha, surrounded by the aṣṭa-sakhīs, in Vṛndāvan Forest, in a grove of kadamba trees, by the side of Śrī Rādhā, holding His flute, Śrī Kṛṣṇa enchants all souls within the universe. I fall at His feet and surrender my life to Him.\"]},{\"number\":\"2\",\"text\":[\"sakhī-ājñāmata kari do̐hāra sevana\",\"pālya-dāsī sadā bhāvi do̐hāra charaṇa\"],\"translation\":[\"Following the orders of a sakhī, I engage in service to the holy pair, Śrī Rādhā and Kṛṣṇa, always considering myself a dependent maidservant at Their lotus feet.\"]},{\"number\":\"3\",\"text\":[\"kabhu kṛpā kari’    mama hasta dhari’\",\"    madhura-vachana bale\",\"tāmbula la-iyā    khāya dui jane\",\"    mālā laya kutūhale\"],\"translation\":[\"Sometimes being kind, They take me by the hand and speak sweet words to me out of affection. Taking the betel nuts I have prepared, the two of Them eat and accept a garland from me with great delight.\"]},{\"number\":\"4\",\"text\":[\"adarśana haya kakhana ki chhale\",\"nā dekhiyā do̐he hiyā mora jvale\"],\"translation\":[\"Again, They disappear from my vision by some trick. Not seeing Rādhā and Kṛṣṇa, my heart burns in agony.\"]},{\"number\":\"5\",\"text\":[\"yekhāne sekhāne    thākuka du’jane\",\"    āmi ta charaṇa-dāsī\",\"milane ānanda    virahe yātanā\",\"    sakala samāna vāsi\"],\"translation\":[\"Here or there, wherever They stay, I am the maidservant of Their lotus feet. Through the happiness of union and the agony of separation, I am Their maidservant.\"]},{\"number\":\"6\",\"text\":[\"rādhā-kṛṣṇa prāṇa mora jīvane maraṇe\",\"more rākhi’ māri’ sukhe thākuka du’jane\"],\"translation\":[\"Rādhā and Kṛṣṇa are my life and soul in life and in death; whether They protect me or take my life, may They always be happy.\"]},{\"number\":\"7\",\"text\":[\"bhakati-vinoda    āna nāhi jāne\",\"    paḍi’ nija sakhī-pāya\",\"rādhikāra gaṇe    thākiyā satata\",\"    yugala-charaṇa chāya\"],\"translation\":[\"Bhakti Vinoda says: “I know nothing else. Falling at the feet of my own sakhī (confidante), remaining always among the associates of Rādhikā, I take shelter in the shade of the Divine Couple’s feet.”\"]}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"41:[\"$\",\"$L49\",null,{\"navMap\":{\"206\":{\"prev\":{\"path\":\"/en-2026/bondhu-gon-shiunoho-vachana-mora/\",\"title\":\"8a. Bondhu-goṇ! śunoho\"},\"next\":{\"path\":\"/en-2026/guru-kripa-bale-labhi-sambandha-vijniana/\",\"title\":\"1. Vācho vegaṁ manasaḥ krodha-vegaṁ\"}}}}]\n4a:T42e,{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"CollectionPage\",\"@id\":\"https://dev.kirtan.site/en-2026/yoga-pithopari-sthita-ashta-sakhi-subeshtita\",\"url\":\"https://dev.kirtan.site/en-2026/yoga-pithopari-sthita-ashta-sakhi-subeshtita\",\"name\":\"Śrī Śikṣāṣṭakam. Verse Eight (b)\",\"inLanguage\":\"en\",\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"}},{\"@type\":\"MusicComposition\",\"@id\":\"https://dev.kirtan.site/en-2026/yoga-pithopari-sthita-ashta-sakhi-subeshtita#composition\",\"alternateName\":[\"yoga-pīṭhopari-sthita aṣṭa-sakhī-suveṣṭita\"],\"name\":\"Śrī Śikṣāṣṭakam. Verse Eight (b)\",\"url\":\"https://dev.kirtan.site/en-2026/yoga-pithopari-sthita-ashta-sakhi-subeshtita\",\"composer\":{\"@type\":\"Person\",\"name\":\"Śrīla Bhakti Vinod Ṭhākur\"},\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"},\"about\":[{\"@type\":\"Thing\",\"name\":\"Bhakti Yoga\"},{\"@type\":\"Thing\",\"name\":\"Gaudiya Vaishnavism\"}],\"genre\":[\"Devotional\",\"Bhajan\",\"Kirtan\"],\"mainEntityOfPage\":{\"@id\":\"https://dev.kirtan.site/en-2026/yoga-pithopari-sthita-ashta-sakhi-subeshtita\"}}]}42:[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$4a\"}}]\n43:[\"$\",\"$L4b\",null,{\"bookId\":\"en-2026\",\"page\":206}]\n44:[\"$\",\"$L4c\",null,{\"bookId\":\"en-2026\",\"songId\":\"yoga-pithopari-sthita-ashta-sakhi-subeshtita\"}]\n45:[\"$\",\"$L4d\",null,{}]\n46:[\"$\",\"$L4e\",null,{\"bookId\":\"en-2026\"}]\n"])</script></body></html>
