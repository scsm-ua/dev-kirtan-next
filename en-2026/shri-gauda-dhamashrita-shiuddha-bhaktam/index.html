s filled with realisation of the non-difference of Gauḍa and Vraja. I offer obeisances to the master Gaura Kiśor.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"śrī-dhāma-māyāpura-divya-gūḍha-\",\"māhātmya-gītonmukhaṁ vareṇyam\",\"dhanyaṁ mahābhāgavatāgragaṇyaṁ\",\"vande prabhuṁ gaura-kiśora-saṁjñam\"],\"translation\":[\"Intent upon chanting the secret divine glories of Śrī Dhām Māyāpur, he is exalted, admirable, and the foremost of advanced devotees. I offer obeisances to the master Gaura Kiśor.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"pūtāvadhūta-vraja-śīrṣa-ratnaṁ\",\"śrī-rādhikā-kṛṣṇa-nigūḍha-bhaktam\",\"sadā vrajāveśa-sarāga-cheṣṭaṁ\",\"vande prabhuṁ gaura-kiśora-saṁjñam\"],\"translation\":[\"The crown jewel of the pure mendicants and the residents of Vraja, he is a confidential devotee of Śrī Śrī Rādhā-Kṛṣṇa and in the ecstatic mood of Vraja is ever engaged in rāgānugā-bhakti. I offer obeisances to the master Gaura Kiśor.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"śokāspadātīta-prabhāva-ramyaṁ\",\"mūḍhair avedyaṁ praṇatābhigamyam\",\"nityānubhūtāchyuta-sad-vilāsaṁ\",\"vande prabhuṁ gaura-kiśora-saṁjñam\"],\"translation\":[\"He has a delightful splendour beyond the reach of sorrow. Incom­prehensible to the ignorant, but attainable by the surrendered, he constantly tastes the infallible Lord’s eternal Pastimes. I offer obeisances to the master Gaura Kiśor.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"kāpaṭya-dharmānvita-chaṇḍa-daṇḍa-\",\"vidhāyakaṁ sajjana-saṅga-raṅgam\",\"śrī-kṛṣṇa-chaitanya-padābja-bhṛṅgaṁ\",\"vande prabhuṁ gaura-kiśora-saṁjñam\"],\"translation\":[\"He is a vehement subduer of the deceitful, is cheerful in the association of the sincere, and is a bee in the lotus feet of Śrī Kṛṣṇa Chaitanya. I offer obeisances to the master Gaura Kiśor.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"dāmodarotthāna-dine pradhāne\",\"kṣetre pavitre kuliyābhidhāne\",\"prapañcha-līlā-parihāravantaṁ\",\"vande prabhuṁ gaura-kiśora-saṁjñam\"],\"translation\":[\"In the month of Dāmodar, on the principal day of Utthān Ekādaśī, in the holy place known as Kuliyā, he withdrew his manifest Pastimes. I offer obeisances to the master Gaura Kiśor.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"tava hi “dayita-dāse” satya-sūrya-prakāśe\",\"jagati durita-nāśe prodyate chid-vilāse\",\"vayam anugata-bhṛtyāḥ pāda-padmaṁ prapannā\",\"anudinam anukampāṁ prārthayāmo nagaṇyāḥ\"],\"translation\":[\"Manifest in your Dayita Dās as the sun of truth to destroy the sin in this world and manifest the Lord’s spiritual Pastimes, we, his insignificant followers and servants, take shelter at your lotus feet and pray continuously for your mercy.\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}],false]]}]}],\"$L18\",\"$L19\"]}]]}],\"$L1a\"]}],\"$L1b\",\"$L1c\",\"$L1d\"]}]]}]\n"])</script><script>self.__next_f.push([1,"1e:I[4423,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-95a5bb5e6f69ae52.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"default\"]\n20:I[9181,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-95a5bb5e6f69ae52.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"default\"]\n21:I[9508,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-95a5bb5e6f69ae52.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"GoogleAnalytics\"]\n22:I[8550,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-95a5bb5e6f69ae52.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924d
