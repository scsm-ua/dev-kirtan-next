slation\",\"song\":{\"meta\":{\"page\":299,\"author\":\"Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\",\"first_line\":\"śrī-gauḍa-dhāmāśrita-śuddha-bhaktaṁ\"},\"title\":[\"Śrīla Gaura Kiśor Dās Bābājī Mahārāj Aṣṭakam\"],\"author\":[\"Sanskrit composition\",\"by Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\"],\"subtitle\":[\"Eight Verses in Obeisance to Śrīla Gaura Kiśor Dās Bābājī Mahārāj\"],\"verses\":[{\"number\":\"1\",\"text\":[\"śrī-gauḍa-dhāmāśrita-śuddha-bhaktaṁ\",\"rūpānugādyaṁ niravady arūpam\",\"vairāgya-dharmojjvala-vigrahaṁ taṁ\",\"vande prabhuṁ gaura-kiśora-saṁjñam\"],\"translation\":[\"A pure devotee sheltered in the holy land of Gauḍa, the best of the followers of Śrī Rūpa, he has a faultless ascetic form, and is an effulgent embodiment of renunciation. I offer obeisances to him, the master Gaura Kiśor.\"]},{\"number\":\"2\",\"text\":[\"asat-prasaṅgaṁ parihāya nityaṁ\",\"gaurāṅga-sevā-vrata-magna-chittam\",\"gauḍa-vrajābheda-viśiṣṭa-prajñaṁ\",\"vande prabhuṁ gaura-kiśora-saṁjñam\"],\"translation\":[\"Rejecting all bad association, his heart is ever immersed in the vow of service to Śrī Gaurāṅga, and he is filled with realisation of the non-difference of Gauḍa and Vraja. I offer obeisances to the master Gaura Kiśor.\"]},{\"number\":\"3\",\"text\":[\"śrī-dhāma-māyāpura-divya-gūḍha-\",\"māhātmya-gītonmukhaṁ vareṇyam\",\"dhanyaṁ mahābhāgavatāgragaṇyaṁ\",\"vande prabhuṁ gaura-kiśora-saṁjñam\"],\"translation\":[\"Intent upon chanting the secret divine glories of Śrī Dhām Māyāpur, he is exalted, admirable, and the foremost of advanced devotees. I offer obeisances to the master Gaura Kiśor.\"]},{\"number\":\"4\",\"text\":[\"pūtāvadhūta-vraja-śīrṣa-ratnaṁ\",\"śrī-rādhikā-kṛṣṇa-nigūḍha-bhaktam\",\"sadā vrajāveśa-sarāga-cheṣṭaṁ\",\"vande prabhuṁ gaura-kiśora-saṁjñam\"],\"translation\":[\"The crown jewel of the pure mendicants and the residents of Vraja, he is a confidential devotee of Śrī Śrī Rādhā-Kṛṣṇa and in the ecstatic mood of Vraja is ever engaged in rāgānugā-bhakti. I offer obeisances to the master Gaura Kiśor.\"]},{\"number\":\"5\",\"text\":[\"śokāspadātīta-prabhāva-ramyaṁ\",\"mūḍhair avedyaṁ praṇatābhigamyam\",\"nityānubhūtāchyuta-sad-vilāsaṁ\",\"vande prabhuṁ gaura-kiśora-saṁjñam\"],\"translation\":[\"He has a delightful splendour beyond the reach of sorrow. Incom­prehensible to the ignorant, but attainable by the surrendered, he constantly tastes the infallible Lord’s eternal Pastimes. I offer obeisances to the master Gaura Kiśor.\"]},{\"number\":\"6\",\"text\":[\"kāpaṭya-dharmānvita-chaṇḍa-daṇḍa-\",\"vidhāyakaṁ sajjana-saṅga-raṅgam\",\"śrī-kṛṣṇa-chaitanya-padābja-bhṛṅgaṁ\",\"vande prabhuṁ gaura-kiśora-saṁjñam\"],\"translation\":[\"He is a vehement subduer of the deceitful, is cheerful in the association of the sincere, and is a bee in the lotus feet of Śrī Kṛṣṇa Chaitanya. I offer obeisances to the master Gaura Kiśor.\"]},{\"number\":\"7\",\"text\":[\"dāmodarotthāna-dine pradhāne\",\"kṣetre pavitre kuliyābhidhāne\",\"prapañcha-līlā-parihāravantaṁ\",\"vande prabhuṁ gaura-kiśora-saṁjñam\"],\"translation\":[\"In the month of Dāmodar, on the principal day of Utthān Ekādaśī, in the holy place known as Kuliyā, he withdrew his manifest Pastimes. I offer obeisances to the master Gaura Kiśor.\"]},{\"number\":\"8\",\"text\":[\"tava hi “dayita-dāse” satya-sūrya-prakāśe\",\"jagati durita-nāśe prodyate chid-vilāse\",\"vayam anugata-bhṛtyāḥ pāda-padmaṁ prapannā\",\"anudinam anukampāṁ prārthayāmo nagaṇyāḥ\"],\"translation\":[\"Manifest in your Dayita Dās as the sun of truth to destroy the sin in this world and manifest the Lord’s spiritual Pastimes, we, his insignificant followers and servants, take shelter at your lotus feet and pray continuously for your mercy.\"]}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"39:[\"$\",\"$L40\",null,{\"navMap\":{\"299\":{\"prev\":{\"path\":\"/en-2026/ha-ha-bhaktivinoda-thakkura-guroh/\",\"
