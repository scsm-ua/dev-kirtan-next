anuṣṭhāne utsāhera prayojana\",\"bhaktite viśvāsa dṛḍha dhairyāvalambana\",\"\",\"ye karma karile haya bhaktira ullāsa\",\"ye karma jīvana-yātrā nirvāhe prayāsa\"],\"translation\":[\"Enthusiasm for the practice of bhakti, firm conviction in bhakti, perseverance, activities by which bhakti develops, and activities by which one’s life is maintained are all necessary.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"asat-saṅga tyāge haya saṅga-vivarjana\",\"sadāchāra sādhu-vṛtti sarvadā pālana\"],\"translation\":[\"Give up association by rejecting bad association and always follow the conduct and practices of the sādhus.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"tyāgī bhikṣā-yoge āra gṛhī dharmāśraye\",\"karibe jīvana yātrā sāvadhāna haye\"],\"translation\":[\"Renunciants should carefully maintain their lives by begging, and householders should maintain their lives by following the codes for proper conduct.\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}],false]]}]}],\"$L17\",\"$L18\"]}]]}],\"$L19\"]}],\"$L1a\",\"$L1b\",\"$L1c\"]}]]}]\n"])</script><script>self.__next_f.push([1,"1d:I[4423,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-ddafd1ef2dcf18bf.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-7cbf026c7bb6203b.js\"],\"default\"]\n1f:I[9181,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-ddafd1ef2dcf18bf.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-7cbf026c7bb6203b.js\"],\"default\"]\n20:I[9508,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-ddafd1ef2dcf18bf.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-7cbf026c7bb6203b.js\"],\"GoogleAnalytics\"]\n21:I[855
