\"Saturday\"}]],[[\"$\",\"div\",\"Sanskrit composition by Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\",{\"className\":\"SongHeader__author\",\"children\":[\"$\",\"a\",null,{\"href\":\"/en-2026/authors#section-Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\",\"children\":\"Sanskrit composition by Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\"}]}]]]}]\n"])</script><script>self.__next_f.push([1,"40:[\"$\",\"$L49\",null,{\"bookId\":\"en-2026\",\"label\":\"Show verses / translation\",\"song\":{\"meta\":{\"page\":86,\"author\":\"Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\",\"first_line\":\"deva-siddha-mukta-yukta-bhakta-vṛnda-vanditaṁ\",\"alt_first_lines\":\"Śrī Śrī Prema-dhāma-deva Stotram – 1-10. Saturday\"},\"title\":[\"Śrī Śrī Prema-dhāma-deva Stotram\"],\"author\":[\"Sanskrit composition by Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\"],\"subtitle\":[\"Saturday\"],\"verses\":[{\"number\":\"1\",\"text\":[\"deva-siddha-mukta-yukta-bhakta-vṛnda-vanditaṁ\",\"pāpa-tāpa-dāva-dāha-dagdha-duḥkha-khaṇḍitam\",\"kṛṣṇa-nāma-sīdhu-dhāma-dhanya-dāna-sāgaraṁ\",\"prema-dhāma-devam eva naumi gaura-sundaram\"],\"translation\":[\"The universal gods, perfected beings, salvationists, mystic yogīs, and exalted servitors of the Absolute Truth, Śrī Kṛṣṇa, constantly chant the glories of Śrī Gaurasundar.\",\"In regard to Lord Chaitanya’s Pastimes, Śrīla Rūpa Goswāmī has mentioned the following verse in his Śrī Chaitanyāṣṭakam:\"]},{\"text\":[\"sadopāsyaḥ śrīmān dhṛta-manuja-kāyaiḥ praṇayitāṁ\",\"vahadbhir gīr-vāṇair giriśa-parameṣṭhi-prabhṛtibhiḥ\"],\"translation\":[\"“The gods, headed by Lord Śiva and Lord Brahmā, accepted the garb of ordinary men in the Pastimes of Śrī Chaitanyadev in order to eternally worship Him with heartfelt affection.” Śrī Chaitanyadev is the embodiment of that vast nectarean ocean found in Lord Kṛṣṇa’s Holy Name, which, as He is Kṛṣṇa Himself, is none other than Śrī Gaurāṅga’s own pure Name. Śrī Chaitanyadev is compared to that grand milk ocean which, after being churned, produced nectar. The nectar Mahāprabhu distributes is Lord Kṛṣṇa’s Holy Names, which extinguish all the miseries of material existence, such as anxieties arising from sinful activities performed in direct opposition to the Lord, and the three-fold sufferings which fuel the grand forest fire that scorches those in search of sense gratification, salvation, and mystic yoga perfections. I offer my obeisances to that beautiful Golden Lord, Gaurāṅga Sundar, the divine form of Kṛṣṇa-prema.\"]},{\"number\":\"2\",\"text\":[\"svarṇa-koṭi-darpaṇābha-deha-varṇa-gauravaṁ\",\"padma-pārijāta-gandha-vanditāṅga-saurabham\",\"koṭi-kāma-mūrchchhitāṅghri-rūpa-rāsa-raṅgaraṁ\",\"prema-dhāma-devam eva naumi gaura-sundaram\"],\"translation\":[\"The charming aura of Śrī Gaurasundar’s divine figure resembles the reflection of millions of radiant golden mirrors. Furthermore, the personified sweet fragrance of the earthly and heavenly lotus flowers humbly offer their prayers before the aromatic scent which permeates the air from the beautiful form of Śrī Chaitanya Mahāprabhu. Millions and millions of Cupids fall unconscious before the feet of Śrī Chaitanyadev’s elegant figure. They are severely shocked because their sense of universal fame arising from their beautiful splendour is checked. While performing His joyful Pastimes of dancing, the divine form of Śrī Gaurāṅgadev playfully sways to and fro. The flowing pulsations of the Lord’s limbs move in rhythm with the various charming moods of devotional sentiments, bhāva, overwhelming His graceful figure. I offer my obeisances to that beautiful Golden Lord, Gaurāṅga Sundar, the divine form of Kṛṣṇa-prema.\"]},{\"number\":\"3\",\"text\":[\"prema-nāma-dāna-janya-pañcha-tattvakātmakaṁ\",\"sāṅga-divya-pārṣadāstra-vaibhavāvatārakam\",\"śyāma-gaura-nāma-gāna-nṛtya-matta-nāgaraṁ\",\"prema-dhāma-devam eva naumi gaura-sundaram\"],\"translation\":[\"By manifesting His five-fold aspect of divinity, Pañcha Tattva, Śrī Gaurāṅgadev was able to widely distribute the sweet Names of Lord Kṛṣṇa, which is the means to the ultimate attainment in human life: unalloyed love for the Absolute Truth, Śrī Kṛṣṇa, the fifth end. (The ‘fifth end’ refers to that which is beyond the attainment of religiosity, economic development, sense gratification, and liberation.) The Lord personally incarnated on the Earth planet with His expansions such as Nityānanda Prabhu and Advaita Āchārya, His intimate associates such as Gadādhar Paṇḍit, and His other general associates such as Śrīvās Ṭhākur. When the Lord appears, He comes armed with the weapon of the Holy Name of Kṛṣṇa. While dancing in the deepest ecstasies of pure love, Lord Gaurāṅgadev, although none other than Śyāmasundar, chanted His own Names just like an ordinary citizen in the Nadīyā district. I offer my obeisances to that beautiful Golden Lord, Gaurāṅga Sundar, the divine form of Kṛṣṇa-prema.\"]},{\"number\":\"4\",\"text\":[\"śānti-pury-adhīśa-kaly-adharma-duḥkha-duḥsahaṁ\",\"jīva-duḥkha-hāna-bhakta-saukhya-dāna-vigraham\",\"kaly-aghaugha-nāśa-kṛṣṇa-nāma-sīdhu-sañcharaṁ\",\"prema-dhāma-devam eva naumi gaura-sundaram\"],\"translation\":[\"Appearing in his Deity form, Śrī Gaurāṅgadev removed the miserable condition of the living entities and increased the devotional pleasure of His devotees. The Lord incarnated because He was unable to tolerate the griefstricken condition of Śrī Advaita Āchārya, the master of that charming village of Śāntipura. Śrī Advaita Āchārya was lamenting about this era being overtaken by the ugly influence of irreligious practices. Thus, in order to arrest the immoral activities in Kali-yuga, the Lord profusely distributed the sweet nectar of Lord Kṛṣṇa’s Holy Names. I offer my obeisances to that beautiful Golden Lord, Gaurāṅga Sundar, the divine form of Kṛṣṇa-prema.\"]},{\"number\":\"5\",\"text\":[\"dvīpa-navya-gāṅga-baṅga-janma-karma-darśitaṁ\",\"śrīnivāsa-vāsa-dhanya-nāma-rāsa-harṣitam\",\"śrī-hari-priyeśa-pūjya-dhī-śachī-purandaraṁ\",\"prema-dhāma-devam eva naumi gaura-sundaram\"],\"translation\":[\"Śrī Gaurāṅgadev appeared in West Bengal in the sacred place known as Nabadwīp on the banks of the Ganges River. Revealing His household Pastimes in the holy abode of Nabadwīp, Śrī Gaura benedicted the beautiful courtyard surrounding Śrīnivās Paṇḍit’s residence, and pleased His dearmost associates when He manifested His nocturnal Pastimes of congregational chanting in the deepest mellows of pure dedication. The controlling life-force of Lakṣmī Priyā Devī and Viṣṇu Priyā Devī was Śrī Gaurasundar, whose intelligence was couched in deep adoration for His mother and father, Śachī Devī and Jagannātha Miśra. I offer my obeisances to that beautiful Golden Lord, Gaurāṅga Sundar, the divine form of Kṛṣṇa-prema.\"]},{\"number\":\"6\",\"text\":[\"śrī-śachī-dulāla-bālya-bāla-saṅga-chañchalaṁ\",\"ākumāra-sarva-śāstra-dakṣa-tarka-maṅgalam\",\"chāttra-saṅga-raṅga-digjigīṣu-darpa-saṁharaṁ\",\"prema-dhāma-devam eva naumi gaura-sundaram\"],\"translation\":[\"Śrī Gaurāṅgadev, the son of Śachī Devī, always performed mischievous childhood Pastimes in the association of the naughtiest boys. (Nimāi was like baby Kṛṣṇa, the son of Mother Yaśodā.) Nimāi’s Pastimes, although naughty, were not only pleasing to Him, but also gladdened the hearts of His devotees.\",\"During His adolescent years, the Lord acquired unrivaled mastery over the conclusions of the ancient scriptures. With unexcelled logic at His command, Lord Viśvambhara artfully established the auspicious doctrine of śuddha-bhakti, unalloyed dedication unto the Sweet Absolute Truth, Lord Kṛṣṇa, thereby defeating the doctrine of dry logic studied at that period by the proud, expert logicians who were nearly all atheistic scholars. Later, in the course of His adolescent Pastimes, the Lord vanquished the pride of the most famous Sanskrit scholar of all time, the Digvijayī Paṇḍit, in the company of His grammar students, on the banks of the Ganges River. I offer my obeisances to that beautiful Golden Lord, Gaurāṅga Sundar, the divine form of Kṛṣṇa-prema.\"]},{\"number\":\"7\",\"text\":[\"varjya-pātra-sārameya-sarpa-saṅga-khelanaṁ\",\"skandha-vāhi-chaura-tīrtha-vipra-chitra-līlanam\",\"kṛṣṇa-nāma-mātra-bālya-kopa-śānti-saukaraṁ\",\"prema-dhāma-devam eva naumi gaura-sundaram\"],\"translation\":[\"During His childhood Pastimes, Nimāi sat amongst discarded clay pots which had been used to cook preparations for Lord Viṣṇu. He would also play with unclean animals such as puppies, and on one occasion He laid upon a cobra, treating it as if it were Ananta Śeṣa.\",\"Once, Nimāi was stolen away by two thieves who were intent on robbing the ornaments decorating His charming figure. Placing Nimāi on their shoulders, they enticed the small boy to come with them and then quickly fled away with Him. However, due to the Lord’s Yogamāyā potency, they suddenly found they had again arrived at Nimāi’s house.\",\"Later, a well-known mendicant brāhmaṇa visited the residence of Jagannātha Miśra. When the brāhmaṇa began to offer some preparations he had cooked to Lord Gopāl, Nimāi spoiled the offering by eating the foodstuffs while the mendicant was offering them in meditation. After having done this to the brāhmaṇa three times, the Lord revealed His eight-armed form to him.\",\"Whenever the child Nimāi angrily cried, He could only be pacified by the chanting of Lord Kṛṣṇa’s Holy Names. I offer my obeisances to that beautiful Golden Lord, Gaurāṅga Sundar, the divine form of Kṛṣṇa-prema.\"]},{\"number\":\"8\",\"text\":[\"snāna-gāṅga-vāri-bāla-saṅga-raṅga-khelanaṁ\",\"bālikādi-pārihāsya-bhaṅgi-bālya-līlanam\",\"kūṭa-tarka-chhāttra-śikṣakādi-vāda-tatparaṁ\",\"prema-dhāma-devam eva naumi gaura-sundaram\"],\"translation\":[\"In His childhood Pastimes Nimāi would sportively play in the waters of the Ganges River in different ways with His schoolmates. Sometimes Nimāi, with various laughing gestures, would also tease the young girls who came to swim in the Ganges. This same small boy, however, often presented shrewd arguments and counter-arguments before His classmates and professors. I offer my obeisances to that beautiful Golden Lord, Gaurāṅga Sundar, the divine form of Kṛṣṇa-prema.\"]},{\"number\":\"9\",\"text\":[\"śrī-nimāi-paṇḍiteti-nāma-deśa-vanditaṁ\",\"navya-tarka-dakṣa-lakṣa-dambhi-dambha-khaṇḍitam\",\"sthāpitārtha-khaṇḍa-khaṇḍa-khaṇḍitārtha-sambharaṁ\",\"prema-dhāma-devam eva naumi gaura-sundaram\"],\"translation\":[\"During the Lord’s adolescent Pastimes, He became known and respected far and wide as the greatest scholar, Nimāi Paṇḍit. The Lord would dismantle the false pride of millions of conceited scholarly logicians. Rendering them speechless by cancelling and reversing their forestated conclusions, the Lord would then revoke His own opinion and rejustify their foregone logic. I offer my obeisances to that beautiful Golden Lord, Gaurāṅga Sundar, the divine form of Kṛṣṇa-prema.\"]},{\"number\":\"10\",\"text\":[\"śloka-gāṅga-vandanārtha-digjigīṣu-bhāṣitaṁ\",\"vyatyalaṅkṛtādi-doṣa-tarkitārtha-dūṣitam\",\"dhvasta-yukti-ruddha-buddhi-datta-dhīmadādaraṁ\",\"prema-dhāma-devam eva naumi gaura-sundaram\"],\"translation\":[\"After that grand Sanskrit scholar Keśava Kāśmīrī had intellectually conquered all ten directions, he came before Śrī Chaitanya Mahāprabhu on the banks of the Ganges River. At the Lord’s request, he spontaneously composed and recited many wonderful prayers in glorification of the sacred Ganges. Śrī Gaurāṅgadev then amazed the scholar when He recollected and pointed out several rhetorical errors in his compositions. Keśava Kāśmīrī skillfully presented many logical arguments in his own favour, but was ultimately defeated. Finally, when Keśava Kāśmīrī’s incompetence was exposed and his intelligence was totally perplexed, Lord Gaurāṅga compassionately respected him in a manner befitting a great scholar by preventing His students who were present from laughing at the paṇḍit. I offer my obeisances to that beautiful Golden Lord, Gaurāṅga Sundar, the divine form of Kṛṣṇa-prema.\"]}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.R. Madhusudan Maharaj\",\"ru\":\"Шрила Б.Р. Мадхусудан Махарадж\",\"ua\":\"Шріла Б.Р. Мадгусудан Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/madhusudan-maharaj-prema-dhama\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"41:[\"$\",\"$L4a\",null,{\"audio\":\"$40:props:song:resources:audio\",\"language\":\"en\"}]\n42:[\"$\",\"$L4b\",null,{\"navMap\":{\"86\":{\"prev\":{\"path\":\"/en-2026/sujanarvuda-radhita-pada-yugam/\",\"title\":\"Śrī Śrī Prabhupād-padma Stavaka\"},\"next\":{\"path\":\"/en-2026/sutra-vritti-tippanishta-sukshma-vachanadbhutam/\",\"title\":\"11-20. Sunday\"}}}}]\n4c:T73b,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"CollectionPage\",\"@id\":\"https://dev.kirtan.site/en-2026/deva-siddha-mukta-yukta-bhakta-vrinda\",\"url\":\"https://dev.kirtan.site/en-2026/deva-siddha-mukta-yukta-bhakta-vrinda\",\"name\":\"Śrī Śrī Prema-dhāma-deva Stotram. Sanskrit composition by Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj. Saturday\",\"inLanguage\":\"en\",\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"}},{\"@type\":\"MusicComposition\",\"@id\":\"https://dev.kirtan.site/en-2026/deva-siddha-mukta-yukta-bhakta-vrinda#composition\",\"alternateName\":[\"deva-siddha-mukta-yukta-bhakta-vṛnda-vanditaṁ\"],\"name\":\"Śrī Śrī Prema-dhāma-deva Stotram. Sanskrit composition by Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj. Saturday\",\"url\":\"https://dev.kirtan.site/en-2026/deva-siddha-mukta-yukta-bhakta-vrinda\",\"composer\":{\"@type\":\"Person\",\"name\":\"Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\"},\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"},\"about\":[{\"@type\":\"Thing\",\"name\":\"Bhakti Yoga\"},{\"@type\":\"Thing\",\"name\":\"
