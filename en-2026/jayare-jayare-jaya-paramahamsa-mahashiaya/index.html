devotion in the current of Śrīla Rūpa Goswāmī.\"]},{\"number\":\"4\",\"text\":[\"śrīpāṭa khetari-dhāma    ṭhākura śrī-narottama\",\"    tomāte tā̐hāra guṇa dekhi\",\"śāstrera siddhānta-sāra    śuni’ lāge chamatkāra\",\"    kutārkika dite nāre phā̐ki\"],\"translation\":[\"We see your qualities are like Śrīla Narottam Dās Ṭhākur who in the festival at Khetari Dhām delivered all the wonderful conclusions of the scriptures which defeated the unfair argument and deception of the scholars there.\"]},{\"number\":\"5\",\"text\":[\"śuddha-bhakti-mata yata    upadharma-kavalita\",\"    heriyā lokera mane trāsa\",\"hāni’ susiddhānta-vāṇa    upadharma khāna khāna\",\"    sajjanera bāḍāle ullāsa\"],\"translation\":[\"By presenting the line of pure devotion he devoured the path of unscriptural practice, and seeing this everybody was afraid. He struck this unscriptural path leaving it in pieces, giving increasing joy to all honest and noble men.\"]},{\"number\":\"6\",\"text\":[\"smārta-mata jaladhara    śuddha-bhakti ravi-kara\",\"    āchchhādila bhāviyā antare\",\"śāstra-sindhu-manthanete    susiddhānta jhañjhāvāte\",\"    uḍāilā dig-digantare\"],\"translation\":[\"Pure devotion is like the sun risen in the heart, while the path of logic is like clouds covering that sun. By churning the ocean of the scriptures, you spread perfect conclusions in all directions like a hurricane to disperse the clouds.\"]},{\"number\":\"7\",\"text\":[\"sthāne sthāne kata maṭha    sthāpiyācha niṣkapaṭa\",\"    prema-sevā śikhāite jīve\",\"maṭhera vaiṣṇava-gaṇa    kare sadā vitaraṇa\",\"    hari-guṇa-kathāmṛta bhave\"],\"translation\":[\"You founded many temples in many places without reservation, teaching the fallen souls service in divine love. In these temples the Vaiṣṇavas constantly distribute talks on the nectarean qualities of the Supreme Lord Hari.\"]},{\"number\":\"8\",\"text\":[\"śuddha-bhakti-mandākinī    vimala pravāha āni’\",\"    śītala karilā tapta-prāṇa\",\"deśe deśe niṣkiñchana    prerilā vaiṣṇava-gaṇa\",\"    vistārite hari-guṇa-gāna\"],\"translation\":[\"The current of pure devotion descends like the flow of the Ganges, cooling the fire of suffering of material life. Similarly, you sent the Vaiṣṇavas from place to place, widely distributing and chanting the qualities of Lord Hari.\"]},{\"number\":\"9\",\"text\":[\"pūrve yathā gaurahari    māyāvāda chheda kari’\",\"    vaiṣṇava karilā kāśī-vāsī\",\"vaiṣṇava darśana-sukṣma-    vichāre tumi he dakṣa\",\"    temati toṣilā vārāṇasī\"],\"translation\":[\"Just as in the past, Lord Gaurahari severed the māyāvāda conception, converting the residents of Vārāṇasī into Vaiṣṇavas, similarly by expert analysis of the Vaiṣṇava philosophy you have enraptured all in Vārāṇasī.\"]},{\"number\":\"10\",\"text\":[\"daiva-varṇāśrama-dharma    hari-bhakti yāra marma\",\"    śāstra-yukte karilā niśchaya\",\"jñana-yoga-karma-chaya    mūlya tāra kichhu naya\",\"    bhaktira virodhī yadi haya\"],\"translation\":[\"You showed that certainly devotion to Lord Hari at the core of daiva-varṇāśrama-dharma, is the directive of the revealed scriptures, while knowledge, yoga, and material activities, if averse to such devotion are of absolutely no value.\"]},{\"number\":\"11\",\"text\":[\"śrī-gauḍa-maṇḍala-bhūmi    bhakta-saṅge parikrami’\",\"    sukīrti sthāpilā mahāśaya\",\"abhinna vraja-maṇḍala    gauḍa-bhūmi premojjvala\",\"    prachāra ha-ila viśvamaya\"],\"translation\":[\"You founded parikramā of Śrī Gauḍa Maṇḍal, Śrī Nabadwīp Dhām in the association of the devotees, showing your glories as a great devotee. You showed the whole world the nectarean blissful nature of Śrī Gauḍa Maṇḍal and how it is non-different from Śrī Vraja Maṇḍal, Śrī Vṛndāvan.\"]},{\"number\":\"12\",\"text\":[\"kuliyāte pāṣaṇḍīrā    atyāchāra kaila yārā\",\"    tā sabāra doṣa kṣamā kari’\",\"jagate kaile ghoṣaṇā    ‘taroriva sahiṣṇunā’\",\"    hana ‘kīrttanīyaḥ sadā hariḥ’\"],\"translation\":[\"You forgave all the atheists of Kuliyā village, despite their blasphemous behaviour. Loudly you proclaimed to one and all, one who is more tolerant than a tree can chant the glories of Lord Hari endlessly.\"]},{\"number\":\"13\",\"text\":[\"śrī-viśva-vaiṣṇava-rāja-    sabhā-madhye ‘pātrarāja’\",\"    upādhi-bhūṣaṇe vibhūṣita\",\"viśvera maṅgala lāgi’    ha-iyācha sarva tyāgī\",\"    viśva-vāsī-jana-hite rata\"],\"translation\":[\"In the grand assembly of Vaiṣṇava kings you are adorned with the title ‘Pātrarāj’, as the head of the assembly. For the benefit of the whole world, you have renounced everything and devoted yourself to the good of all.\"]},{\"number\":\"14\",\"text\":[\"karitecha upakāra    yāte para-upakāra\",\"    labhe jīva śrī-kṛṣṇa-sevāya\",\"dūre yāya bhava-roga    khaṇḍe yāhe karma-bhoga\",\"    hari-pāda-padma yāte pāya\"],\"translation\":[\"You untiringly perform benevolent works just to help the souls of this world to attain the service of Lord Śrī Kṛṣṇa. Then the disease of material suffering would leave them, their bondage to fruitive works would break, and they would attain the lotus feet of the Lord.\"]},{\"number\":\"15\",\"text\":[\"jīva moha-nidrā-gata    jāgāte vaikuṇṭha-dūta\",\"    ‘gauḍīya’ pāṭhāo ghare ghare\",\"uṭhare uṭhare bhāi    āra ta samaya nāi\",\"    ‘kṛṣṇa bhaja’ bale uchchaiḥsvare\"],\"translation\":[\"Seeing the souls of this world sleeping in illusion, you are sending the *Gauḍīya* magazine from door to door just like a messenger from the transcendental plane. It calls aloud, “Awake, arise, O brother, there is no more time to waste, serve and worship your Lord, Śrī Kṛṣṇa.”\"]},{\"number\":\"16\",\"text\":[\"tomāra mukhāravinda-    vigalita makaranda\",\"    siñchita achyuta-guṇa-gāthā\",\"śunile juḍāya prāṇa    tamo moha antardhāna\",\"    dūre yāya hṛdayera vyathā\"],\"translation\":[\"The nectarean verses of the glorious qualities of the infallible Lord Kṛṣṇa issuing from your lotus mouth soothes our souls, dissipates our ignorance and illusion, and causes the pain in our hearts to go far away.\"]},{\"number\":\"17\",\"text\":[\"jāni āmi mahāśaya    yaśo-vāñchhā nāhi haya\",\"    bindu-mātra tomāra antare\",\"tava guṇa-vīṇā-dhārī    mora kaṇṭha-vīṇā dhari’\",\"    avaśete balāya āmāre\"],\"translation\":[\"O great soul! I know that there is no trace of desire for fame in your heart. Your qualities, like an expert musician, take hold of the vīṇā of my voice and make me speak, devoid of any power over myself.\"]},{\"number\":\"18\",\"text\":[\"vaiṣṇavera guṇa-gāna    karile jīvera trāṇa\",\"    śuniyāchhi sādhu-guru-mukhe\",\"kṛṣṇa-bhakti samudaya    janama saphala haya\",\"    e bhava-sāgara tare sukhe\"],\"translation\":[\"By singing the qualities of Vaiṣṇavas, the soul attains deliverance – this I have heard from the mouths of saints and gurus. Through complete devotion to Kṛṣṇa, one’s life becomes successful, and one happily crosses the ocean of material existence.\"]},{\"number\":\"19\",\"text\":[\"te-kāraṇe prayāsa    yathā vāmanera āśa\",\"    gaganera chā̐da dharibāre\",\"adoṣa-daraśī tumi    adhama patita āmi\",\"    nija guṇe kṣamibā āmāre\"],\"translation\":[\"For this reason I endeavour thus, just like a dwarf aspiring to reach the moon. I am lowly and fallen, but your nature is not to consider any offence, so I beg you to pardon my flaws.\"]},{\"number\":\"20\",\"text\":[\"śrī-gaurāṅga-pāriṣada    ṭhākura bhakti-vinoda\",\"    dīna-hīna patitera bandhu\",\"kali-tamaḥ vināśite    ānilena avanīte\",\"    tomā’ akalaṅka pūrṇa indu\"],\"translation\":[\"Śrīla Bhakti Vinod Ṭhākur, the associate of Śrī Gaurāṅga Mahāprabhu and friend of the lowly fallen souls, brought you here, and you came like a spotless full moon to dispel the ignorance of this age of Kali.\"]},{\"number\":\"21\",\"text\":[\"kara kṛpā vitaraṇa    prema-sudhā anukṣaṇa\",\"    mātiyā uṭhuka jīva-gaṇa\",\"hari-nāma-saṅkīrtane    nāchuka jagata-jane\",\"    vaiṣṇava-dāsera nivedana\"],\"translation\":[\"So please keep incessantly showering your mercy, the nectar of ecstatic love of Godhead, and let all the souls of this world be uplifted by that. May all the people of the world dance in the congregational chanting of the Lord’s Holy Name – this is the prayer of this servant of the Vaiṣṇavas.\"]}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-acharya\"},{\"title\":{\"en\":\"Srila B.R. Sridhar Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.Р. Шридхар Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.Р. Шрідгар Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/sridhar-maharaj-and-govinda-8\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"3d:[\"$\",\"$L46\",null,{\"audio\":\"$3c:props:song:resources:audio\",\"language\":\"en\"}]\n3e:[\"$\",\"$L47\",null,{\"navMap\":{\"226\":{\"prev\":{\"path\":\"/en-2026/bhayabhanjana-jayashiamsana/\",\"title\":\"Śrī Dayita Dāsa Praṇati Pañchakam\"},\"next\":{\"path\":\"/en-2026/pralaya-payodhi-jale-dhritavan-asi-vedam/\",\"title\":\"Śrī Daśāvatār Stotram\"}}}}]\n48:T8a7,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"CollectionPage\",\"@id\":\"https://dev.kirtan.site/en-2026/jayare-jayare-jaya-paramahamsa-mahashiaya\",\"url\":\"https://dev.kirtan.site/en-2026/jayare-jayare-jaya-paramahamsa-mahashiaya\",\"name\":\"Āchārya-vandanā. by Śrī Gopāl Govinda Mahānta\",\"inLanguage\":\"en\",\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"}},{\"@type\":\"MusicComposition\",\"@id\":\"https://dev.kirtan.site/en-2026/jayare-jayare-jaya-paramahamsa-mahashiaya#composition\",\"alternateName\":[\"jayare jayare jaya paramahaṁsa mahāśaya\"],\"name\":\"Āchārya-vandanā. by Śrī Gopāl Govinda Mahānta\",\"url\":\"https://dev.kirtan.site/en-2
