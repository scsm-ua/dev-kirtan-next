t\"]\n47:I[4423,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-a3710ddcc8c13179.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-75fbb35c0f552459.js\"],\"default\"]\n49:I[9181,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-a3710ddcc8c13179.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-75fbb35c0f552459.js\"],\"default\"]\n4a:I[9508,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-a3710ddcc8c13179.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-75fbb35c0f552459.js\"],\"GoogleAnalytics\"]\n4b:I[8550,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-a3710ddcc8c13179.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-75fbb35c0f552459.js\"],\"ServiceWorkerRegistration\"]\n4c:I[3680,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-a3710ddcc8c13179.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-75fbb35c0f552459.js\"],\"default\"]\n3a:[\"$\",\"$L44\",null,{\"bookId\":\"en-2026\",\"telegraphUrl\":null}]\n3b:[\"$\",\"section\",null,{\"className\":\"SongHeader\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"SongHeader__title\",\"children\":[[\"$\",\"div\",\"Śrī Nimāi Sundar’s Advent\",{\"children\":\"Śrī Nimāi Sundar’s Advent\"}]]}],null,[[\"$\",\"div\",\"from Śrī Chaitanya Charitāmṛta: Ādi-līla 13.89–124\",{\"className\":\"SongHeader__subtitle\",\"children\":\"from Śrī Chaitanya Charitāmṛta: Ādi-līla 13.89–124\"}]],[[\"$\",\"div\",\"by Śrīla Kṛṣṇadāsa Kavirāja Goswāmī\",{\"className\":\"SongHeader__author\",\"children\":[\"$\",\"a\",null,{\"href\":\"/en-2026/authors#section-Śrīla Kṛṣṇadās Kavirāj Goswāmī\",\"children\":\"by Śrīla Kṛṣṇadāsa Kavirāja Goswāmī\"}]}]]]}]\n"])</script><script>self.__next_f.push([1,"3c:[\"$\",\"$L45\",null,{\"bookId\":\"en-2026\",\"label\":\"Show verses / translation\",\"song\":{\"meta\":{\"page\":247,\"author\":\"Śrīla Kṛṣṇadās Kavirāj Goswāmī\",\"first_line\":\"chaudda-śata sāta-śake māsa ye phālguna\"},\"title\":[\"Śrī Nimāi Sundar’s Advent\"],\"author\":[\"by Śrīla Kṛṣṇadāsa Kavirāja Goswāmī\"],\"subtitle\":[\"from Śrī Chaitanya Charitāmṛta: Ādi-līla 13.89–124\"],\"verses\":[{\"number\":\"89\",\"text\":[\"chaudda-śata sāta-śake māsa ye phālguna\",\"paurṇamāsīra sandhyā-kāle haile śubha-kṣaṇa\"],\"translation\":[\"Thus in the year 1407 of the Śaka Era (A.D. 1486), in the month of Phālguna (February-March), in the evening of the full-moon day, the desired auspicious moment arrived.\"]},{\"number\":\"90\",\"text\":[\"siṁha-rāśi, siṁha-lagna, uchcha graha-gaṇa\",\"ṣaḍ-varga, aṣṭa-varga, sarva sulakṣaṇa\"],\"translation\":[\"(According to the Jyotir-veda, or Vedic astrology, the auspicious birth moment is described as follows:) The moon was in Leo (the figure of the lion in the zodiac), Leo was the ascendant, several planets were strongly positioned, and the ṣaḍ-varga and aṣṭa-varga showed all-auspicious influences.\"]},{\"number\":\"91\",\"text\":[\"a-kalaṅka gaurachandra dilā daraśana\",\"sa-kalaṅka chandre āra kon prayojana\"],\"translation\":[\"When the spotless moon of Gaurachandra became visible, what would be the need for a moon full of black marks on its body?\"]},{\"number\":\"92\",\"text\":[\"eta jāni’ rāhu kaila chandrera grahaṇa\",\"‘kṛṣṇa’ ‘kṛṣṇa’ ‘hari’ nāme bhāse tri-bhuvana\"],\"translation\":[\"Considering this, Rāhu, the black planet, covered the full moon, and immediately vibrations of “Kṛṣṇa! Kṛṣṇa! Hari!” inundated the three worlds.\"]},{\"number\":\"93\",\"text\":[\"jaya jaya dhvani haila sakala bhuvana\",\"chamatkāra haiyā loka bhāve mane mana\"],\"translation\":[\"All people thus chanted the Hare Kṛṣṇa Mahāmantra during the lunar eclipse – their minds struck with wonder.\"]},{\"number\":\"94\",\"text\":[\"jagat bhariyā loka bale – ‘hari’ ‘hari’\",\"sei-kṣaṇe gaurakṛṣṇa bhūme avatari\"],\"translation\":[\"When the whole world was thus chanting the Holy Name of the Supreme Personality of Godhead, Kṛṣṇa in the form of Gaurahari advented Himself on the earth.\"]},{\"number\":\"95\",\"text\":[\"prasanna ha-ila saba jagatera mana\",\"‘hari’ bali’ hinduke hāsya karaye yavana\"],\"translation\":[\"The whole world was pleased. While the Hindus chanted the Holy Name of the Lord, the non-Hindus, especially the Muslims, jokingly imitated the words.\"]},{\"number\":\"96\",\"text\":[\"‘hari’ bali’ nārīgaṇa dei hulāhuli\",\"svarge vādya-nṛtya kare deva kutūhalī\"],\"translation\":[\"While all the ladies vibrated the Holy Name of Hari on earth, in the heavenly planets dancing and music were going on, for the demigods were very curious and excited.\"]},{\"number\":\"97\",\"text\":[\"prasanna haila daśa dik, prasanna nadījala\",\"sthāvara-jaṅgama haila ānande vihvala\"],\"translation\":[\"In this atmosphere, all the ten directions became jubilant, as did the waves of the rivers. Moreover, all beings, moving and nonmoving, were overwhelmed with transcendental bliss.\"]},{\"number\":\"98\",\"text\":[\"nadīyā-udayagiri,    pūrṇachandra gaurahari,\",\"    kṛpā kari’ ha-ila udaya\",\"pāpa-tamaḥ haila nāśa,    tri-jagatera ullāsa,\",\"    jagabhari’ hari-dhvani haya\"],\"translation\":[\"Thus by His causeless mercy the full moon, Gaurahari, rose in the district of Nadia, which is compared to Udayagiri, where the sun first becomes visible. His rising in the sky dissipated the darkness of sinful life, and thus the three worlds became joyful and chanted the Holy Name of the Lord.\"]},{\"number\":\"99\",\"text\":[\"sei-kāle nijālaya,    uṭhiyā advaita rāya,\",\"    nṛtya kare ānandita-mane\",\"haridāse lañā saṅge,    huṅkāra-kīrtana-raṅge\",\"    kene nāche, keha nāhi jāne\"],\"translation\":[\"At that time Śrī Advaita Āchārya Prabhu, in His own house at Śāntipura, was dancing in a pleasing mood. Taking Haridās Ṭhākur with Him, He danced and loudly chanted Hare Kṛṣṇa. But why they were dancing, no one could understand.\"]},{\"number\":\"100\",\"text\":[\"dekhi’ uparāga hāsi’,    śīghra gaṅgā-ghāṭe āsi’\",\"    ānande karila gaṅgā-snāna\",\"pāñā uparāga-chhale,    āpanāra mano-bale,\",\"    brāhmaṇere dila nānā dāna\"],\"translation\":[\"Seeing the lunar eclipse and laughing, Advaita Āchārya and Haridās Ṭhākur immediately went to the bank of the Ganges and bathed in the river in great jubilation. Taking advantage of the occasion of the lunar eclipse, Advaita Āchārya, by His mental strength, distributed various types of charity to the brāhmaṇas.\"]},{\"number\":\"101\",\"text\":[\"jagat ānandamaya,    dekhi’ mane sa-vismaya,\",\"    ṭhāreṭhore kahe haridāsa\",\"tomāra aichhana raṅga,    mora mana parasanna,\",\"    dekhi – kichhu kārye āchhe bhāsa\"],\"translation\":[\"When he saw that the whole world was jubilant, Haridās Ṭhākur, his mind astonished, directly and indirectly expressed himself to Advaita Āchārya: “Your dancing and distributing charity are very pleasing to me. I can understand that there is some special purpose in these actions.”\"]},{\"number\":\"102\",\"text\":[\"āchāryaratna, śrīvāsa,    haila mane sukhollāsa\",\"    yāi’ snāna kaila gaṅgā-jale\",\"ānande vihvala mana,    kare hari-saṅkīrtana\",\"    nānā dāna kaila mano-bale\"],\"translation\":[\"Āchāryaratna (Chandraśekhara) and Śrīvās Ṭhākur were overwhelmed with joy, and immediately they went to the bank of the Ganges to bathe in her waters. Their minds full of happiness, they chanted the Hare Kṛṣṇa mantra and gave charity by mental strength.\"]},{\"number\":\"103\",\"text\":[\"ei mata bhakta-tati,    yāṅra yei deśe sthiti,\",\"    tāhāṅ tāhāṅ pāñā mano-bale\",\"nāche, kare saṅkīrtana,    ānande vihvala mana,\",\"    dāna kare grahaṇera chhale\"],\"translation\":[\"In this way all the devotees, wherever they were situated, in every city and every country, danced, performed saṅkīrtana, and gave charity by mental strength on the plea of the lunar eclipse, their minds overwhelmed with joy.\"]},{\"number\":\"104\",\"text\":[\"brāhmaṇa-sajjana-nārī,    nānā-dravye thālī bhari’\",\"    āilā sabe yautuka la-iyā\",\"yena kāṅchā-soṇā-dyuti,    dekhi’ bālakera mūrti,\",\"    āśīrvāda kare sukha pāñā\"],\"translation\":[\"All sorts of respectable brāhmaṇa gentlemen and ladies, carrying plates filled with various gifts, came with their presentations. Seeing the newborn child, whose form resembled natural glaring gold, all of them happily offered their blessings.\"]},{\"number\":\"105\",\"text\":[\"sāvitrī, gaurī, sarasvatī,    śachī, rambhā, arundhatī\",\"    āra yata deva-nārīgaṇa\",\"nānā-dravye pātra bhari’,    brāhmaṇīra veśa dhari’,\",\"    āsi’ sabe kare daraśana\"],\"translation\":[\"Dressing themselves as the wives of brāhmaṇas, all the celestial ladies, including the wives of Lord Brahmā, Lord Śiva, Lord Nṛsiṁha­deva, King Indra, and Vasiṣṭha Ṛṣi, along with Rambhā, a dancing girl of heaven, came there with varieties of gifts.\"]},{\"number\":\"106\",\"text\":[\"antarīkṣe deva-gaṇa,    gandharva, siddha, chāraṇa,\",\"    stuti-nṛtya kare vādya-gīta\",\"nartaka, vādaka, bhāṭa,    navadvīpe yāra nāṭa,\",\"    sabe āsi’ nāche pāñā prīta\"],\"translation\":[\"In outer space all the demigods, including the inhabitants of Gandharvaloka, Siddhaloka, and Chāraṇaloka, offered their prayers and danced to the accompaniment of music, songs, and the beating of drums. Similarly, in Nabadwīp town all the professional dancers, musicians, and blessers gathered together, dancing in great jubilation.\"]},{\"number\":\"107\",\"text\":[\"kebā āse kebā yāya,    kebā nāche kebā gāya,\",\"    sambhālite nāre kāra bola\",\"khaṇḍileka duḥkha-śoka, pramoda-pūrita loka,\",\"    miśra hailā ānande vihvala\"],\"translation\":[\"No one could understand who was coming and who was going, who was dancing and who was singing. Nor could they understand one another’s language. Yet all unhappiness and lamentation were immediately dissipated, and everyone became all-jubilant. Thus Jagannātha Miśra was also overwhelmed with joy.\"]},{\"number\":\"108\",\"text\":[\"āchāryaratna, śrīvāsa,    jagannātha-miśra-pāśa,\",\"    āsi’ tāṅre kare sāvadhāna\",\"karāila jātakarma,    ye āchhila vidhi-dharma,\",\"    tabe miśra kare nānā dāna\"],\"translation\":[\"Chandraśekhar Āchārya and Śrīvās Ṭhākur both came to Jagannātha Miśra and drew his attention in various ways. They performed the ritualistic ceremonies prescribed at the time of birth according to religious principles. Jagannātha Miśra also gave varieties of charity.\"]},{\"number\":\"109\",\"text\":[\"yautuka pāila yata,    ghare vā āchhila kata,\",\"    saba dhana vipre dila dāna\",\"yata nartaka, gāyana,    bhāṭa, akiñchana jana,\",\"    dhana diyā kaila sabāra māna\"],\"translation\":[\"Whatever riches Jagannātha Miśra collected in the form of gifts and presentations, and whatever he had in his house, he distributed among the brāhmaṇas, professional singers, dancers, bhāṭas, and the poor. He honored them all by giving them riches in charity.\"]},{\"number\":\"110\",\"text\":[\"śrīvāsera brāhmaṇī,    nāma tāṅra ‘mālinī’,\",\"    āchāryaratnera patnī-saṅge\",\"sindūra, haridrā, taila,    kha-i, kalā, nārikela,\",\"    diyā pūje nārīgaṇa raṅge\"],\"translation\":[\"The wife of Śrīvās Ṭhākur, whose name was Mālinī, accompanied by the wife of Chandraśekhara (Āchāryaratna) and other ladies, came there in great happiness to worship the baby with paraphernalia such as vermilion, turmeric, oil, fused rice, bananas, and coconuts.\"]},{\"number\":\"111\",\"text\":[\"advaita-āchārya-bhāryā,    jagat-pūjitā āryā,\",\"    nāma tāṅra ‘sītā ṭhākurāṇī’\",\"āchāryera ājñā pāñā,    gela upahāra lañā,\",\"    dekhite bālaka-śiromaṇi\"],\"translation\":[\"One day shortly after Lord Gaurahari was born, Advaita Āchārya’s wife, Sītā Devī, who is worshipable by the whole world, took her husband’s permission and went to see that topmost child with all kinds of gifts and presentations.\"]},{\"number\":\"112\",\"text\":[\"suvarṇera kaḍi-ba-uli,    rajatamudrā-pāśuli,\",\"    suvarṇera aṅgada, kaṅkaṇa\",\"du-bāhute divya śaṅkha,    rajatera malabaṅka,\",\"    svarṇa-mudrāra nānā hāragaṇa\"],\"translation\":[\"She brought different kinds of golden ornaments, including armlets, necklaces, anklets, and bangles for the hands.\"]},{\"number\":\"113\",\"text\":[\"vyāghra-nakha hema-jaḍi,    kaṭi-paṭṭasūtra-ḍorī\",\"    hasta-padera yata ābharaṇa\",\"chitra-varṇa paṭṭa-sāḍī,    buni photo paṭṭapāḍī,\",\"    svarṇa-raupya-mudrā bahu-dhana\"],\"translation\":[\"There were also tiger nails set in gold, waist decorations of silk and lace, ornaments for the hands and legs, nicely printed silken saris, and a child’s garment, also made of silk. Many other riches, including gold and silver coins, were also presented to the child.\"]},{\"number\":\"114\",\"text\":[\"durvā, dhānya, gorochana,    haridrā, kuṅkuma, chandana,\",\"    maṅgala-dravya pātra bhariyā\",\"vastra-gupta dolā chaḍi’    saṅge lañā dāsī cheḍī,\",\"    vastrālaṅkāra peṭāri bhariyā\"],\"translation\":[\"Riding in a palanquin covered with cloth and accompanied by maidservants, Sītā Ṭhākurāṇī came to the house of Jagannātha Miśra bringing with her many auspicious articles such as fresh grass, paddy, gorochana, turmeric, kumkum, and sandalwood. All these presentations filled a large basket.\"]},{\"number\":\"115\",\"text\":[\"bhakṣya, bhojya, upahāra,    saṅge la-ila bahu bhāra,\",\"    śachī-gṛhe haila upanīta\",\"dekhiyā bālaka-ṭhāma,    sākṣāt gokula-kāna,\",\"    varṇa-mātra dekhi viparīta\"],\"translation\":[\"When Sītā Ṭhākurāṇī came to the house of Śachī Devī, bringing with her many kinds of eatables, dresses, and other gifts, she was aston­ished to see the newborn child, for she appreciated that except for a difference in colour, the child was directly Kṛṣṇa of Gokula Himself.\"]},{\"number\":\"116\",\"text\":[\"sarva aṅga – sunirmāṇa,    suvarṇa-pratimā-bhāna,\",\"    sarva aṅga – sulakṣaṇamaya\",\"bālakera divya jyoti,    dekhi’ pāila bahu prīti,\",\"    vātsalyete dravila hṛdaya\"],\"translation\":[\"Seeing the transcendental bodily effulgence of the child, each of His nicely constructed limbs full of auspicious signs and resembling a form of gold, Sītā Ṭhākurāṇī was very pleased, and because of her maternal affection, she felt as if her heart were melting.\"]},{\"number\":\"117\",\"text\":[\"durvā, dhānya, dila śīrṣe,    kaila bahu āśīṣe,\",\"    chirajīvī hao dui bhāi\",\"ḍākinī-śāṅkhinī haite,    śaṅkā upajila chite,\",\"    ḍare nāma thuila ‘nimāi’\"],\"translation\":[\"She blessed the newborn child by placing fresh grass and paddy on His head and saying, “May You be blessed with a long duration of life.” But being afraid of ghosts and witches, she gave the child the Name Nimāi.\"]},{\"number\":\"118\",\"text\":[\"putramātā-snānadine,    dila vastra vibhūṣaṇe,\",\"    putra-saha miśrere sammāni’\",\"śachī-miśrera pūjā lañā,    manete hariṣa hañā,\",\"    ghare āilā sītā ṭhākurāṇī\"],\"translation\":[\"On the day the mother and son bathed and left the maternity home, Sītā Ṭhākurāṇī gave them all kinds of ornaments and garments and then also honored Jagannātha Miśra. Then Sītā Ṭhākurāṇī, being honored by mother Śachī Devī and Jagannātha Miśra, was greatly happy within her mind, and thus she returned home.\"]},{\"number\":\"119\",\"text\":[\"aichhe śachī-jagannātha,    putra pāñā lakṣmīnātha,\",\"    pūrṇa ha-ila sakala vāñchhita\",\"dhana-dhānye bhare ghara,    lokamānya kalevara,\",\"    dine dine haya ānandita\"],\"translation\":[\"In this way mother Śachī Devī and Jagannātha Miśra, having obtained a son who was the husband of the goddess of fortune, had all their desires fulfilled. Their house was always filled with riches and grains. As they saw the beloved body of their son, day after day their pleasure increased.\"]},{\"number\":\"120\",\"text\":[\"miśra – vaiṣṇava, śānta,    alampaṭa, śuddha, dānta,\",\"    dhana-bhoge nāhi abhimāna\",\"putrera prabhāve yata,    dhana āsi’ mile, tata,\",\"    viṣṇu-prīte dvije dena dāna\"],\"translation\":[\"Jagannātha Miśra was an ideal Vaiṣṇava. He was peaceful, restrained in sense gratification, pure, and controlled. Therefore he had no desire to enjoy material opulence. Whatever money came because of the influence of his transcendental son, he gave it in charity to the brāhmaṇas for the satisfaction of Viṣṇu.\"]},{\"number\":\"121\",\"text\":[\"lagna gaṇi’ harṣamati,    nīlāmbara chakravartī,\",\"    gupte kichhu kahila miśrere\",\"mahāpuruṣera chihna,    lagne aṅge bhinna bhinna,\",\"    dekhi, – ei tāribe saṁsāre\"],\"translation\":[\"After calculating the birth moment of Lord Gaurahari, Nīlāmbara Chakravartī privately said to Jagannātha Miśra that he saw all the different symptoms of a great personality in both the body and birth moment of the child. Thus he understood that in the future this child would deliver all the three worlds.\"]},{\"number\":\"122\",\"text\":[\"aichhe prabhu śachī-ghare,    kṛpāya kaila avatāre,\",\"    yei ihā karaye śravaṇa\",\"gaura-prabhu dayāmaya,    tāṅre hayena sadaya,\",\"    sei pāya tāṅhāra charaṇa\"],\"translation\":[\"In this way Mahāprabhu, out of His causeless mercy, made His advent in the house of Śachī Devī. Gaurahari is very merciful to anyone who hears this narration of His birth, and thus such a person attains the lotus feet of the Lord.\"]},{\"number\":\"123\",\"text\":[\"pāiyā mānuṣa janma,    ye nā śune gaura-guṇa,\",\"    hena janma tāra vyartha haila\",\"pāiyā amṛtadhunī,    piye viṣa-garta-pāni,\",\"    janmiyā se kene nāhi maila\"],\"translation\":[\"Anyone who attains a human body but does not hear of the glories of Gaurāṅga Mahāprabhu, his birth becomes useless. Amṛtadhunī is a flowing river of the nectar of devotional service. If after getting a human body one drinks the water in a poison pit of material happiness instead of the water of such a river, it would be better for him not to have lived, but to have died long ago.\"]},{\"number\":\"124\",\"text\":[\"śrī-chaitanya-nityānanda,    āchārya advaitachandra,\",\"    svarūpa-rūpa-raghunāthadāsa\",\"iṅhā-sabāra śrī-charaṇa,    śire vandi nija-dhana,\",\"    janma-līlā gāila kṛṣṇadāsa\"],\"translation\":[\"Taking on my head as my own property the lotus feet of Śrī Chaitanya Mahāprabhu, Nityānanda Prabhu, Āchārya Advaitachandra, Svarūpa Dāmodara, Rūpa Goswāmī, and Raghunātha Dāsa Goswāmī, I, Kṛṣṇadāsa Kavirāja Goswāmī, have thus described the Lord’s advent.\"]}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.N. Acharya Maharaj\",\"ru\":\"Шрила Б.Н. Ачарья Махарадж\",\"ua\":\"Шріла Б.Н. Ачарʼя Махарадж\"},\"embed_url\":\"https://soundcloud.com/madhupuri/4-chauda-sata-sat-acharya\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"3d:[\"$\",\"$L46\",null,{\"audio\":\"$3c:props:song:resources:audio\",\"language\":\"en\"}]\n3e:[\"$\",\"$L47\",null,{\"navMap\":{\"247\":{\"prev\":{\"path\":\"/en-2026/shiuddha-bhakata-charana-renu/\",\"title\":\"Śuddha-bhakata\"},\"next\":{\"path\":\"/en-2026/gopinath-mama-nivedana-shiuno/\",\"title\":\"Nivedana – Part One\"}}}}]\n48:T746,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"CollectionPage\",\"@id\":\"https://dev.kirtan.site/en-2026/chaudda-shiata-sata-shiake-masa-je-phalgun\",\"url\":\"https://dev.kirtan.site/en-2026/chaudda-shiata-sata-shiake-masa-je-phalgun\",\"name\":\"Śrī Nimāi Sundar’s Advent. by Śrīla Kṛṣṇadāsa Kavirāja Goswāmī. from Śrī Chaitanya Charitāmṛta: Ādi-līla 13.89–124\",\"inLanguage\":\"en\",\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"}},{\"@type\":\"MusicComposition\",\"@id\":\"https://dev.kirtan.site/en-2026/chaudda-shiata-sata-shiake-masa-je-phalgun#composition\",\"alternateName\":[\"chaudda-śata sāta-śake māsa ye phālguna\"],\"name\":\"Śrī Nimāi Sundar’s Advent. by Śrīla Kṛṣṇadāsa Kavirāja Goswāmī. from Śrī Chaitanya Charitāmṛta: Ādi-līla 13.89–124\",\"url\":\"https://dev.kirtan.site/en-2026/chaudda-shiata-sata-shiake-masa-je-phalgun\",\"composer\":{\"@type\":\"Person\",\"name\":\"Śrīla Kṛṣṇadās Kavirāj Goswāmī\"},\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"},\"about\":[{\"@type\":\"Thing\",\"name\":\"Bhakti Yoga\"},{\"@type\":\"Thing\",\"name\":\"Gaudiya Vaishnavism\"}],\"genre\":[\"Devotional\",\"Bhajan\",\"Kirtan\"],\"mainEntityOfPage\":{\"@id\":\"https://dev.kirtan.site/en-2026/chaudda-shiata-sata-shiake-masa-je-phalgun\"},\"audio\":[{\"@type\":\"MusicRecording\",\"name\":\"Śrī Nimāi Sundar’s Advent. by Śrīla Kṛṣṇadāsa Kavirāja Goswāmī. from Śrī Chaitanya Charitāmṛta: Ādi-līla 13.89–124\",\"url\":\"https://soundcloud.com/madhupuri/4-chauda-sata-sat-acharya\",\"byArtist\":{\"@type\":\"Person\",\"name\":{\"en\":\"Srila B.N. Acharya Maharaj\",\"ru\":\"Шрила Б.Н. Ачарья Махарадж\",\"ua\":\"Шріла Б.Н. Ачарʼя Махарадж\"}},\"audio\":{\"@type\":\"AudioObject\",\"embedUrl\":\"https://w.soundcloud.com/player/?url=https%3A%2F%2Fdev.kirtan.site%2Fen-2026%2Fchaudda-shiata-sata-shiake-masa-je-phalgun\"}}]}]}"])</script><script>self.__next_f.push([1,"3f:[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$48\"}}]\n40:[\"$\",\"$L49\",null,{\"bookId\":\"en-2026\",\"page\":247}]\n41:[\"$\",\"$L4a\",null,{\"bookId\":\"en-2026\",\"songId\":\"chaudda-shiata-sata-shiake-masa-je-phalgun\"}]\n42:[\"$\",\"$L4b\",null,{}]\n43:[\"$\",\"$L4c\",null,{\"bookId\":\"en-2026\"}]\n"])</script></body></html>
