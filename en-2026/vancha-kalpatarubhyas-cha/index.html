more I bow down before Lord Nityānanda Prabhu, who is the self-same form and elder brother of Śrī Gaurāṅga. Next, I pay homage unto that great personality Śrī Advaita Prabhu, who is an incarnation of the Lord’s devotee, and unto the Lord’s eternal associates like Śrīvās Paṇḍit, who serve the Lord in loving devotional relationships. Finally, I bow down at the feet of those devotees who hold the actual potency of unalloyed dedication in their hands: Śrī Rāmānanda Rāya, Śrī Gadādhar Paṇḍit, and Śrī Svarūp Dāmodar.\\\\\",\"*(Śrīla Kṛṣṇadās Kavirāj Goswāmī)*\"],\"isLong\":false},{\"text\":[\"namo mahāvadānyāya kṛṣṇa-prema-pradāya te\",\"kṛṣṇāya kṛṣṇa-chaitanya-nāmne gaura-tviṣe namaḥ\"],\"translation\":[\"*(Śrī Chaitanya-charitāmṛta: Madhya-līlā, 19.53)*\",\"I offer my obeisances unto Lord Gaurāṅga, whose divine complexion is a radiant golden hue and who possesses the qualities of the most benevolent incarnation. His spiritual Pastimes freely grant pure love for Lord Kṛṣṇa to all. He is none other than Lord Kṛṣṇa known in the age of Kali as Śrī Kṛṣṇa Chaitanya.\\\\\",\"*(Śrīla Rūpa Goswāmī)*\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"3f:[\"$\",\"$L47\",null,{\"navMap\":{\"22\":{\"prev\":{\"path\":\"/en-2026/gaura-vrajashritashieshair-vaishnavair-vandya-vigraham/\",\"title\":\"Śrīla Jagannāth Dās Bābājī\"},\"next\":{\"path\":\"/en-2026/jayatam-suratau-pangor/\",\"title\":\"Śrī Śrī Guru Gaurāṅga Rādhā Madana-Mohanjīu\"}}}}]\n40:[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"CollectionPage\\\",\\\"@id\\\":\\\"https://dev.kirtan.site/en-2026/vancha-kalpatarubhyas-cha\\\",\\\"url\\\":\\\"https://dev.kirtan.site/en-2026/vancha-kalpatarubhyas-cha\\\",\\\"name\\\":\\\"Vāñchhā-kalpa-tarubhyaś cha\\\",\\\"inL
