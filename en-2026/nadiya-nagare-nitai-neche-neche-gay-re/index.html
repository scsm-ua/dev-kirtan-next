ngHeader__author\",\"children\":[\"$\",\"a\",null,{\"href\":\"/en-2026/authors#section-Śrīla Bhakti Vinod Ṭhākur\",\"children\":\"by Śrīla Bhakti Vinod Ṭhākur\"}]}]]]}]\n"])</script><script>self.__next_f.push([1,"3c:[\"$\",\"$L44\",null,{\"bookId\":\"en-2026\",\"label\":\"Show verses / translation\",\"song\":{\"meta\":{\"page\":235,\"author\":\"Śrīla Bhakti Vinod Ṭhākur\",\"first_line\":\"nadīyā-nagare nitāi neche neche gāya re\"},\"title\":[\"Śrīman Mahāprabhura Śata-nāma\"],\"author\":[\"by Śrīla Bhakti Vinod Ṭhākur\"],\"subtitle\":[\"One Hundred Names of Śrīman Mahāprabhu\"],\"verses\":[{\"text\":[\"nadīyā-nagare nitāi neche neche gāya re\"],\"translation\":[\"Dancing and dancing throughout the town of Nadia, Nitāi sings!\"]},{\"number\":\"1\",\"text\":[\"jagannātha-suta mahāprabhu viśvambhara\",\"māyāpura-śaśi navadvīpa-sudhākara\"],\"translation\":[\"(1) O son of Jagannātha Miśra, (2) O great master,\\\\\",\"(3) O maintainer of the world, (4) O moon of Māyāpur,\\\\\",\"(5) O source of nectar for Nabadwīp!\"]},{\"number\":\"2\",\"text\":[\"śachī-suta gaurahari nimāi-sundara\",\"rādhā-bhāva-kānti-āchchhādita naṭavara\"],\"translation\":[\"(6) O son of Śachī, (7) O golden Hari, (8) O beautiful Nimāi,\\\\\",\"(9) O best of dancers covered with the heart and halo of Śrīmatī Rādhārāṇī!\"]},{\"number\":\"3\",\"text\":[\"nāmānanda chapala bālaka mātṛ-bhakta\",\"brahmāṇḍa-vadana tarkī kautukānurakta\"],\"translation\":[\"(10) O He whose ecstasy is the Name, (11) O restless boy,\\\\\",\"(12) O devotee of His mother, (13) O He in whose mouth rests the entire universe, (14) O expert in logic, (15) O He who is fond of play!\"]},{\"number\":\"4\",\"text\":[\"vidyārthi-uḍupa chaura-dvayera mohana\",\"tairthika-sarvasva grāmya-bālikā-krīḍana\"],\"translation\":[\"(16) O moon amongst the seekers of knowledge,\\\\\",\"(17) O bewilderer of the two theives, (18) O the all-in-all of pilgrims,\\\\\",\"(19) O He who plays with the village girls!\"]},{\"number\":\"5\",\"text\":[\"lakṣmī-prati vara-dātā uddhata bālaka\",\"śrī-śachīra pati-putra-śoka-nivāraka\"],\"translation\":[\"(20) O giver of a boon to Lakṣmī Priyā, (21) O mischevious boy,\\\\\",\"(22) O remover of Śrī Śachī’s grief over her husband and son!\"]},{\"number\":\"6\",\"text\":[\"lakṣmī-pati pūrva-deśa-sarva-kleśa-hara\",\"digvijayi-darpa-hārī viṣṇu-priyeśvara\"],\"translation\":[\"(23) O husband of Lakṣmī Priyā, (24) O remover of all suffering from East Bengal, (25) O remover of the pride of the champion scholar Keśava Kāśmīri, (26) O Lord of Viṣṇu Priyā!\"]},{\"number\":\"7\",\"text\":[\"ārya-dharma-pāla pitṛ-gayā-piṇḍa-dātā\",\"purī-śiṣya madhvāchārya-sampradāya-pātā\"],\"translation\":[\"(27) O preserver of Āryan dharma, (28) O offerer of piṇḍa to His ancestors at Gayā, (29) O disciple of Śrī Īśvara Purī, (30) O protector of the sampradāya established by Śrī Madhva Āchārya!\"]},{\"number\":\"8\",\"text\":[\"kṛṣṇa-nāmonmatta kṛṣṇa-tattva-adhyāpaka\",\"nāma-saṅkīrtana-yuga-dharma-pravartaka\"],\"translation\":[\"(31) O He who is maddened by the Name of Kṛṣṇa, (32) O teacher of the science of Kṛṣṇa, (33) O inaugurator of the dharma for the age: congregational chanting of the Holy Name!\"]},{\"number\":\"9\",\"text\":[\"advaita-bāndhava śrīnivāsa-gṛha-dhana\",\"nityānanda-prāṇa gadādharera jīvana\"],\"translation\":[\"(34) O dear friend of Advaita, (35) O wealth of Śrīvās’ home,\\\\\",\"(36) O heart of Nityānanda, (37) O life of Gadādhar!\"]},{\"number\":\"10\",\"text\":[\"antardvīpa-śaśadhara sīmanta-vijaya\",\"godruma-vihārī madhyadvīpa-līlāśraya\"],\"translation\":[\"(38) O moon of Antardwīp, (39) O triumph of Sīmantadwīp,\\\\\",\"(40) O reveller of Godrumadwīp,\\\\\",\"(41) O shelter of the Pastimes in Madhyadwīp!\"]},{\"number\":\"11\",\"text\":[\"koladvīpa-pati ṛtudvīpa-maheśvara\",\"jahnu-modadruma-rudradvīpera īśvara\"],\"translation\":[\"(42) O Lord of Koladwīp, (43) O great Lord of Ṛtudwīp,\\\\\",\"(44–46) O Lord of Jahnudwīp, Modadrumadwīp, and Rudradwīp!\"]},{\"number\":\"12\",\"text\":[\"navakhaṇḍa-raṅganātha jāhnavī-jīvana\",\"jagāi-mādhāi-ādi-durvṛtta-tāraṇa\"],\"translation\":[\"(47) O playful Lord of Nabadwīp, (48) O life of Gaṅgā,\\\\\",\"(49) O deliverer of Jagāi, Mādhāi, and other misbehaved persons!\"]},{\"number\":\"13\",\"text\":[\"nagara-kīrtana-siṁha kājī-uddhāraṇa\",\"śuddha-nāma-prachāraka bhaktārti-haraṇa\"],\"translation\":[\"(50) O lion of the village kīrtans, (51) O saviour of the Kāzī,\\\\\",\"(52) O propagator of the pure Name,\\\\\",\"(53) O remover of the devotees’ distress!\"]},{\"number\":\"14\",\"text\":[\"nārāyaṇī-kṛpā-sindhu jīvera niyantā\",\"adhama-paḍuyā-daṇḍī bhakta-doṣa-hantā\"],\"translation\":[\"(54) O ocean of mercy for Nārāyaṇī, (55) O controller of all souls,\\\\\",\"(56) O punisher of the degraded students,\\\\\",\"(57) O destroyer of the devotees’ faults!\"]},{\"number\":\"15\",\"text\":[\"śrī-kṛṣṇa-chaitanyachandra bhāratī-tāraṇa\",\"parivrāja-śiromaṇi utkala-pāvana\"],\"translation\":[\"(58) O moon known as Śrī Kṛṣṇa Chaitanya, (59) O deliverer of Śrī Keśava Bhāratī, (60) O crown-jewel of the itinerants,\\\\\",\"(61) O purifier of Odisha!\"]},{\"number\":\"16\",\"text\":[\"ambuliṅga-bhuvaneśa-kapoteśa-pati\",\"kṣīra-chora-gopāla-darśana-sukhī yatī\"],\"translation\":[\"(62–64) O Lord of Ambuliṅga, Bhuvaneśvara, and Kapoteśvara,\\\\\",\"(65) O He who is happy to see Kṣīra-chora Gopīnāth and Sākṣī Gopāl, (66) O ascetic!\"]},{\"number\":\"17\",\"text\":[\"nirdaṇḍi-sannyāsī sārvabhauma-kṛpāmaya\",\"svānanda-āsvādānandī sarva-sukhāśraya\"],\"translation\":[\"(67) O sannyāsī without a daṇḍa, (68) O He who is merciful to Sārvabhauma Bhaṭṭāchārya, (69) O He who is joyful in tasting the joy of Himself, (70) O origin of all happiness!\"]},{\"number\":\"18\",\"text\":[\"puraṭa-sundara vāsudeva-trāṇa-kartā\",\"rāmānanda-sakhā bhaṭṭa-kula-kleśa-hartā\"],\"translation\":[\"(71) O beautiful golden Lord, (72) O deliverer of (the leper) Vāsudev, (73) O friend of Rāmānanda Rāy,\\\\\",\"(74) O remover of hardship from the Bhaṭṭa family!\"]},{\"number\":\"19\",\"text\":[\"bauddha-jaina-māyāvādi-kutarka-khaṇḍana\",\"dakṣiṇa-pāvana bhakti-grantha-uddhāraṇa\"],\"translation\":[\"(75–77) O refuter of the fallacious arguments of the Buddhists, Jains, and Māyāvādīs, (78) O purifier of the South,\\\\\",\"(79) O recoverer of Śrī Brahma-saṁhitā and Śrī Kṛṣṇa-karṇāmṛta!\"]},{\"number\":\"20\",\"text\":[\"ālāla-darśanānandī rathāgra-nartaka\",\"gajapati-trāṇa devānanda-uddhāraka\"],\"translation\":[\"(80) O He who is joyful to see Ālālanāth, (81) O dancer in front of the chariot, (82) O deliverer of Mahārāj Pratāparudra,\\\\\",\"(83) O saviour of Devānanda Paṇḍit!\"]},{\"number\":\"21\",\"text\":[\"kuliyā-prakāśe duṣṭa-paḍuyāra trāṇa\",\"rūpa-sanātana-bandhu sarva-jīva-prāṇa\"],\"translation\":[\"(84) O deliverer of the impudent students during His appearance in Kuliyā, (85–86) O friend of Rūpa and Sanātan, (87) O life of all souls!\"]},{\"number\":\"22\",\"text\":[\"vṛndāvanānanda-mūrti balabhadra-saṅgī\",\"yavana-uddhārī bhaṭṭa-vallabhera raṅgī\"],\"translation\":[\"(88) O embodiment of the joy of Vṛndāvan, (89) O companion of Balabhadra Bhaṭṭāchārya, (90) O deliverer of the foreigners,\\\\\",\"(91) O He who is jocular with Vallabha Bhaṭṭa!\"]},{\"number\":\"23\",\"text\":[\"kāśī-vāsi-sannyāsī-uddhārī prema-dātā\",\"markaṭa-vairāgī-daṇḍī āchaṇḍāla-trātā\"],\"translation\":[\"(92) O saviour of the sannyāsīs of Kāśī, (93) O giver of divine love, (94) O punisher of the false monkey-like renunciants,\\\\\",\"(95) O deliverer of even the outcasts!\"]},{\"number\":\"24\",\"text\":[\"bhaktera gauravakārī bhakta-prāṇa-dhana\",\"haridāsa-raghunātha-svarūpa-jīvana\"],\"translation\":[\"(96) O He who takes pride in the devotees, (97) O life and wealth of the devotees, (98–100) O life of Haridās, Raghunāth, and Svarūp!\"]},{\"number\":\"25\",\"text\":[\"nadiyā-nagare nitāi neche neche gāya re\",\"bhakati-vinoda tā̐ra paḍe rāṅgā-pāya re\"],\"translation\":[\"Dancing and dancing throughout the town of Nadia, Nitāi sings, and Bhakti Vinod falls at His reddish feet.\"]}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"3d:[\"$\",\"$L45\",null,{\"navMap\":{\"235\":{\"prev\":{\"path\":\"/en-2026/namas-te-narasimhaya/\",\"title\":\"Śrī Nṛsiṁha Praṇām\"},\"next\":{\"path\":\"/en-2026/nagare-nagare-gora-gay/\",\"title\":\"Śrī Kṛṣṇera Viṁśottara-śata-nāma\"}}}}]\n46:T491,{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"CollectionPage\",\"@id\":\"https://dev.kirtan.site/en-2026/nadiya-nagare-nitai-neche-neche-gay-re\",\"url\":\"https://dev.kirtan.site/en-2026/nadiya-nagare-nitai-neche-neche-gay-re\",\"name\":\"Śrīman Mahāprabhura Śata-nāma. by Śrīla Bhakti Vinod Ṭhākur. One Hundred Names of Śrīman Mahāprabhu\",\"inLanguage\":\"en\",\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"}},{\"@type\":\"MusicComposition\",\"@id\":\"https://dev.kirtan.site/en-2026/nadiya-nagare-nitai-neche-neche-gay-re#composition\",\"alternateName\":[\"nadīyā-nagare nitāi neche neche gāya re\"],\"name\":\"Śrīman Mahāprabhura Śata-nāma. by Śrīla Bhakti Vinod Ṭhākur. One Hundred Names of Śrīman Mahāprabhu\",\"url\":\"https://dev.kirtan.site/en-2026/nadiya-nagare-nitai-neche-neche-gay-re\",\"composer\":{\"@type\":\"Person\",\"name\":\"Śrīla Bhakti Vinod Ṭhākur\"},\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"},\"about\":[{\"@type\":\"Thing\",\"name\":\"Bhakti Yoga\"},{\"@type\":\"Thing\",\"name\":\"Gaudiya Vaishnavism\"}],\"genre\":[\"Devotional\",\"Bhajan\",\"Kirtan\"],\"mainEntityOfPage\":{\"@id\":\"https://dev.kirtan.site/en-2026/nadiya-nagare-nitai-neche-neche-gay-re\"}}]}3e:[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$46\"}}]\n3f:[\"$\",\"$L47\",null,{\"bookId\":\"en-2026\",\"page\":235}]\n40:[\"$\",\"$L48\",null,{\"bookId\":\"en-2026\",\"songId\":\"nadiya-nagare-nitai-neche-neche-gay-re\"}]\n41:[\"$\",\"$
