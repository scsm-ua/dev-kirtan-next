iverse.\"]},{\"number\":\"2\",\"text\":[\"pramoda-madana-līla śrī-rādhā-ramaṇa\",\"yathā nitya-līlā kare laye sakhī-gaṇa\"],\"translation\":[\"Lord Śrī Rādhā-Ramaṇa Kṛṣṇa who gives pleasure to his beloved (Śrīmatī Rādhārāṇī) is eternally playing His joyful Loving Pastimes there in the association of the sakhīs of Śrīmatī Rādhārāṇī.\"]},{\"number\":\"3\",\"text\":[\"mālatī-mādhavī-kuñja kandare kandare\",\"nigūḍha nikuñja-līla hari manohare\"],\"translation\":[\"Here deep within the groves of mālatī flowers and mādhavī creepers, the confidential Pastimes of the charming Lord Hari are going on.\"]},{\"number\":\"4\",\"text\":[\"śyāma-kuṇḍa rādhā-kuṇḍa kusum sarovara\",\"mānasa gaṅgā dāna-ghāṭī jāra abhyantara\"],\"translation\":[\"Within this holy place are Śyāma Kuṇḍa, Rādhā Kuṇḍa, Kusum Sarovar, Mānasa Gaṅgā and Dāna-ghāṭī.\"]},{\"number\":\"5\",\"text\":[\"śrī-govinda-kuṇḍa līlāsthalī nāhi sīmā\",\"divāniśi-bhakta-vṛnda kare parikramā\"],\"translation\":[\"With Śrī Govinda Kuṇḍa, these holy places of divine Pastimes are without limit. Day and night the devotees are performing circumambulation in worship.\"]},{\"number\":\"6\",\"text\":[\"‘śrīdhar-svāmī-sevāśrama’ parama śobhana\",\"yathā nitya-sevā kare sārasvata-gaṇa\"],\"translation\":[\"Here there is the supremely beautiful Śrīdhar Swāmī Sevāśram where devotees of Śrī Chaitanya Sāraswat Maṭh are performing their eternal service.\"]},{\"number\":\"7\",\"text\":[\"abhinna śrī kṛṣṇa jñāne bhajibāra tare\",\"mahāprabhu samarpilā raghunātha kare\"],\"translation\":[\"Śrīman Mahāprabhu gave Śrī Śrī Girirāj-jīu to Śrī Raghunāth Goswāmī so that Śrī Dās Goswāmī could worship His Lordship knowing Him to be non-different from Kṛṣṇa.\"]},{\"number\":\"8\",\"text\":[\"gosvāmī śrī-raghunātha dāsere smariyā\",\"nirantara sevā kare antarmanā haiyā\"],\"translation\":[\"The devotees of Śrī Chaitanya Sāraswat Maṭh worship Śrī Śrī Girirāj-jīu in a deep mood of devotion in remembrance of Śrī Raghunāth Dās Goswāmī.\"]},{\"number\":\"9\",\"text\":[\"jaya giri-govardhana divya-rasālaya\",\"rūpa-sanātana-jīva-raghunāthāśraya\"],\"translation\":[\"All glories to Śrī Giri Govardhan which is the abode of divine rasa and the shelter of Śrī Rūpa, Sanātan, Jīva, and Raghunāth Goswāmīs.\"]},{\"number\":\"10\",\"text\":[\"surendra-munīndra-śiva-śuka-mahājana\",\"dekhena ārati-śobhā durllabha-darśana\"],\"translation\":[\"The beauty of the ārati of Śrī Girirāj-jīu which is rare and precious is being seen by Lord Indra, Nārada Muni, Lord Śiva, Śukadeva Goswāmī, and all the great personalities.\"]},{\"number\":\"11\",\"text\":[\"sevya o sevaka-rūpe nitya parakāśa\",\"sānande ārati dekhe e adhama dāsa\"],\"translation\":[\"Śrī Śrī Girirāj-jīu is eternally manifested as both the worshipable Lord and the servitor Lord. This fallen servant sees the ārati of Śrī Girirāj-jīu with great ecstasy.\"]}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.R. Madhusudan Maharaj\",\"ru\":\"Шрила Б.Р. Мадхусудан Махарадж\",\"ua\":\"Шріла Б.Р. Мадгусудан Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/madhusudan-maharaj-day-programm-kisel\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"40:[\"$\",\"$L49\",null,{\"audio\":\"$3f:props:song:resources:audio\",\"language\":\"en\"}]\n41:[\"$\",\"$L4a\",null,{\"navMap\":{\"40\":{\"prev\":{\"path\":\"/en-2026/jaya-jaya-girirajer-arati-vishiala/\",\"title\":\"Śrī Govinda Kuṇḍa Gupta-Govardhan Ārati\"},\"next\":{\"path\":\"/en-2026/jaya-guru-maharaja-karuna-sagara/\",\"title\":\"Śrī Śrī Nitāi-Chaitanya Ārati\"}}}}]\n4b:T6b7,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"CollectionPage\",\"@id\":\"https://dev.kirtan.site/en-2026/jaya-jaya-girirajer-arotiko-shobha\",\"url\":\"https://dev.kirtan.site/en-2026/jaya-jaya-girirajer-arotiko-shobha\",\"name\":\"Śrī Śrī Girirāj-Govardhan Ārati. by Śrīla Bhakti Sundar
