a mana lobhā\"],\"translation\":[\"All glories to the beautiful ārati of Śrī Girirāj which is going on in Śrī Vraja Maṇḍal, attracting the minds of all living entities of the universe.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"pramoda-madana-līla śrī-rādhā-ramaṇa\",\"yathā nitya-līlā kare laye sakhī-gaṇa\"],\"translation\":[\"Lord Śrī Rādhā-Ramaṇa, Kṛṣṇa, who gives pleasure to his beloved (Śrīmatī Rādhārāṇī) is eternally playing His joyful Loving Pastimes there in the association of the sakhīs of Śrīmatī Rādhārāṇī.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"mālatī-mādhavī-kuñja kandare kandare\",\"nigūḍha nikuñja-līla hari manohare\"],\"translation\":[\"Here deep within the groves of mālatī flowers and mādhavī creepers, the confidential Pastimes of the charming Lord Hari are going on.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"śyāma-kuṇḍa rādhā-kuṇḍa kusum sarovara\",\"mānasa gaṅgā dāna-ghāṭī jāra abhyantara\"],\"translation\":[\"Within this holy place are Śyāma Kuṇḍa, Rādhā Kuṇḍa, Kusum Sarovar, Mānasa Gaṅgā and Dāna-ghāṭī.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"śrī-govinda-kuṇḍa līlāsthalī nāhi sīmā\",\"divāniśi-bhakta-vṛnda kare parikramā\"],\"translation\":[\"With Śrī Govinda Kuṇḍa, these holy places of divine Pastimes are without limit. Day and night the devotees are performing circumambulation in worship.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"‘śrīdhar-svāmī-sevāśrama’ parama śobhana\",\"yathā nitya-sevā kare sārasvata-gaṇa\"],\"translation\":[\"Here there is the supremely beautiful Śrīdhar Swāmī Sevāśram where devotees of Śrī Chaitanya Sāraswat Maṭh are performing their eternal service.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"abhinna śrī kṛṣṇa jñāne bhajibāra tare\",\"mahāprabhu samarpilā raghunātha kare\"],\"translation\":[\"Śrīman Mahāprabhu gave Śrī Śrī Girirāj-jīu to Śrī Raghunāth Goswāmī so that Śrī Dās Goswāmī could worship His Lordship knowing Him to be non-different from Kṛṣṇa.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"gosvāmī śrī-raghunātha dāsere smariyā\",\"nirantara sevā kare antarmanā haiyā\"],\"translation\":[\"The devotees of Śrī Chaitanya Sāraswat Maṭh worship Śrī Śrī Girirāj-jīu in a deep mood of devotion in remembrance of Śrī Raghunāth Dās Goswāmī.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"jaya giri-govardhana divya-rasālaya\",\"rūpa-sanātana-jīva-raghunāthāśraya\"],\"translation\":[\"All glories to Śrī Giri Govardhan which is the abode of divine rasa and the shelter of Śrī Rūpa, Sanātan, Jīva, and Raghunāth Goswāmīs.\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"surendra-munīndra-śiva-śuka-mahājana\",\"dekhena ārati-śobhā durllabha-darśana\"],\"translation\":[\"The beauty of the ārati of Śrī Girirāj-jīu which is rare and precious is being seen by Lord Indra, Nārada Muni, Lord Śiva, Śukadeva Goswāmī, and all the great personalities.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"sevya o sevaka-rūpe nitya parakāśa\",\"sānande ārati dekhe e adhama dāsa\"],\"translation\":[\"Śrī Śrī Girirāj-jīu is eternally manifested as both the worshipable Lord and the servitor Lord. This fallen servant sees the ārati of Śrī Girirāj-jīu with great ecstasy.\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"21:[\"$\",\"$L29\",null,{\"navMap\":{\"40\":{\"prev\":{\"path\":\"/en-2026/jaya-jaya-girirajer-arati-vishiala/\",\"title\":\"Śrī Govinda Kuṇḍa Gupta-Govardhan Ārati\"},\"next\":{\"path\":\"/en-2026/jaya-guru-maharaja-karuna-sagara/\",\"title\":\"Śrī Śrī Nitāi-Chaitanya Ārati\"}}}}]\n2a:Tdd2,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"
