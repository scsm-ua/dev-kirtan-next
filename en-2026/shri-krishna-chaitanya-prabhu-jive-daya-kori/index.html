rs of those who surrender in this six-fold way.\"]},{\"number\":\"6\",\"text\":[\"rūpa-sanātana-pade dante tṛṇa kari’\",\"bhakati-vinoda paḍe dui pada dhari’\"],\"translation\":[\"Bhakti Vinod places a straw between his teeth and falls before Śrī Rūpa and Śrī Sanātan, grasping their feet.\"]},{\"number\":\"7\",\"text\":[\"kā̐diyā kā̐diyā bale, āmi ta’ adhama\",\"śikhāye śaraṇāgati karahe uttama\"],\"translation\":[\"Crying and crying, he prays, “I am so fallen! Please teach me surrender and uplift me.”\"]}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"42:[\"$\",\"$L4a\",null,{\"navMap\":{\"59\":{\"prev\":{\"path\":\"/en-2026/samsara-davanala-lidha-loka/\",\"title\":\"Śrī Gurvāṣṭakam\"},\"next\":{\"path\":\"/en-2026/bhaja-re-bhaja-re-amar-mana-ati-manda/\",\"title\":\"Bhajan-gīti\"}}}}]\n4b:T46a,{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"CollectionPage\",\"@id\":\"https://dev.kirtan.site/en-2026/shri-krishna-chaitanya-prabhu-jive-daya-kori\",\"url\":\"https://dev.kirtan.site/en-2026/shri-krishna-chaitanya-prabhu-jive-daya-kori\",\"name\":\"Invocation to the book Śaraṇāgati. by Śrīla Bhakti Vinod Ṭhākur\",\"inLanguage\":\"en\",\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"}},{\"@type\":\"MusicComposition\",\"@id\":\"https://dev.kirtan.site/en-2026/shri-krishna-chaitanya-prabhu-jive-daya-kori#composition\",\"alternateName\":[\"śrī-kṛṣṇa-chaitanya prabhu jīve dayā kari’\"],\"name\":\"Invocation to the book Śaraṇāgati. by Śrīla Bhakti Vinod Ṭhākur\",\"url\":\"https://dev.kirtan.site/en-2026/shri-krishna-chaitanya-prabhu-jive-daya-kori\",\"composer\":{\"@type\":\"Person\",\"name\":\"Śrīla Bhakti Vinod Ṭhākur\"},\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"},\"about\":[{\"@type\":\"Thing\",\"name\":\"Bhakti Yoga\"},{\"@type\":\"Thing\",\"name\":\"Gaudiya Vaishnavism\"}],\"genre\":[\"Devotional\",\"Bhajan\",\"Kirtan\"],\"mainEntityOfPa
