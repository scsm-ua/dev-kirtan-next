bookId\":\"en-2026\",\"label\":\"Show verses / translation\",\"song\":{\"meta\":{\"page\":26,\"no-author\":1,\"first_line\":\"vṛndāyai tulasī-devyai\"},\"title\":[\"Vṛndāyai tulasī-devyai\"],\"verses\":[{\"text\":[\"vṛndāyai tulasī-devyai priyāyai keśavasya cha\",\"kṛṣṇa-bhakti-prade devi satyavatyai namo namaḥ\"],\"translation\":[\"I eternally offer my respects unto Śrī Vṛndā Devī, Śrīmatī Tulasī Mahārāṇī, who is the dearmost object of Lord Keśava’s affection. I bow down before Satyavatī who can bestow pure dedication unto Lord Kṛṣṇa.\"]},{\"text\":[\"atha natvā mantra-gurūn gurūn bhāgavatārthadān\",\"vyāsān jagad-gurūn natvā tato jayam udīrayet\"],\"translation\":[\"Then, let me bow down before all my spiritual masters: the guru who gave me the divine mantra, as well as all those who have taught me the meaning of *Śrīmad Bhāgavatam*. Let me offer my respectful obeisances unto Śrīla Vyāsadev, the spiritual master of the entire universe and the giver of the all-conquering conclusions of *Śrīmad Bhāgavatam*.\"]},{\"text\":[\"jayaḥ sa-parikara-śrī-śrī-guru-gaurāṅga-\",\"gāndharvā-govindasundara-pāda-padmānāṁ jayastu!\"],\"translation\":[\"Let the holy lotus feet of Śrī Gurudev, Śrīman Mahāprabhu, and Śrī Śrī Gāndharvā-Govindasundar, along with Their eternal associates, be victorious over all!\"]}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"3f:[\"$\",\"$L47\",null,{\"navMap\":{\"26\":{\"prev\":{\"path\":\"/en-2026/shriman-rasa-rasarambhi/\",\"title\":\"Śrī-Śrī-Guru-Gaurāṅga-Rādhā-Gopīnāthjīu\"},\"next\":{\"path\":\"/en-2026/namah-om-vishnupadaya-krishna/\",\"title\":\"Śrīla A.C. Bhaktivedānta Swāmī Prabhupād\"}}}}]\n40:[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"CollectionPage\\\",\\\"@id\\\":\\\"https://dev.kirtan.site/en-2026/vrindayai-t
