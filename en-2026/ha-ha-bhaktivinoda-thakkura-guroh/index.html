:\"Sanskrit composition\"}]]}],[\"$\",\"$1\",\"1\",{\"children\":[[\"$\",\"br\",null,{}],[\"$\",\"a\",null,{\"href\":\"/en-2026/authors#section-Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\",\"children\":\"by Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\"}]]}]]}]]]}]\n"])</script><script>self.__next_f.push([1,"3c:[\"$\",\"$L44\",null,{\"bookId\":\"en-2026\",\"label\":\"Show verses / translation\",\"song\":{\"meta\":{\"page\":295,\"author\":\"Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\",\"first_line\":\"hā hā bhakti-vinoda-ṭhākura! guroḥ!\"},\"title\":[\"Śrīmad Bhakti Vinod Viraha Daśakam\"],\"author\":[\"Sanskrit composition\",\"by Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\"],\"subtitle\":[\"*Prayer in Separation of Śrīla Bhakti Vinod Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"hā hā bhakti-vinoda-ṭhākura! guroḥ! dvāviṁśatis te samā\",\"dīrghād duḥkha-bharād aśeṣa-virahād duḥsthīkṛtā bhūr iyam\",\"jīvānāṁ bahu-janma-puṇya-nivahākṛṣṭo mahī-maṇḍale\",\"āvirbhāva-kṛpāṁ chakāra cha bhavān śrī-gaura-śaktiḥ svayam\"],\"translation\":[\"Alas, alas! O Bhakti Vinod Ṭhākur, O supreme guru, for twenty-two years this world has been plunged into misfortune, long grief-stricken in your intolerable separation. You are the divine potency of Śrī Gaura, and you graciously made your advent in this earthly plane, being attracted by the living beings’ virtuous deeds performed throughout many lifetimes.\"]},{\"number\":\"2\",\"text\":[\"dīno ’haṁ chira-duṣkṛtir nahi bhavat-pādābja-dhūli-kaṇā-\",\"snānānanda-nidhiṁ prapanna-śubhadaṁ labdhuṁ samartho ’bhavam\",\"kintv audārya-guṇāt tavāti-yaśasaḥ kāruṇya-śaktiḥ svayaṁ\",\"śrī-śrī-gaura-mahāprabhoḥ prakaṭitā viśvaṁ samanvagrahīt\"],\"translation\":[\"Since I am lowly and very wretched, it was not my luck to reach the ocean that bestows the fortune of surrender – the ocean of the ecstasy of bathing in a particle of the dust of your holy lotus feet. Yet due to your magnanimous nature, you gave your grace to the whole universe, personally revealing your super-eminence as the personification of the mercy potency of Śrī Gaurāṅga. (That is, by coming into this world, I received his grace.)\"]},{\"number\":\"3\",\"text\":[\"he deva! stavane tavākhila-guṇānāṁ te viriñchādayo\",\"devā vyartha-manorathāḥ kim u vayaṁ martyādhamāḥ kurmahe\",\"etan no vibudhaiḥ kadāpy atiśayālaṅkāra ity uchyatāṁ\",\"śāstreṣv eva “na pāraye ’ham” iti yad gītaṁ mukundena tat\"],\"translation\":[\"O Lord, even all the demigods headed by Lord Brahmā feel frustrated by their inability to (fittingly) sing the glories of all your divine qualities. What, then, can be said of the attempt of a fallen soul, a mere human like me? Surely, the learned will never waste their eloquent words eulogising this statement, since even the Supreme Personality of Godhead, Lord Śrī Kṛṣṇa Himself, has sung in the scriptures His celebrated confession, “*Na pāraye ’ham* – I am unable (to reciprocate your devotion).”\"]},{\"number\":\"4\",\"text\":[\"dharmaś charma-gato ’jñataiva satatā yogaś cha bhogātmako\",\"jñāne śūnya-gatir japena tapasā khyātir jighāṁsaiva cha\",\"dāne dāmbhikatā ’nurāga-bhajane duṣṭāpachāro yadā\",\"buddhiṁ buddhimatāṁ vibheda hi tadā dhātrā bhavān preṣitaḥ\"],\"translation\":[\"At a time when religion was evaluated in terms of bodily relationship, saintliness was determined by ignorance, and yoga practice was motivated by sensual pleasure; when scholarship was cultivated just for voidism, japa was conducted for the sake of fame, and penance was performed out of vindictiveness; when charity was given out of pride, and on the pretext of spontaneous devotion the most gross, sinful acts were perpetrated – and in all such anomalous situations even the intelligentsia were at loggerheads with one another – at that very time, you were sent by the Almighty Creator.\"]},{\"number\":\"5\",\"text\":[\"viśve ’smin kiraṇair yathā himakaraḥ sañjīvayann oṣadhīr\",\"nakṣatrāṇi cha rañjayan nija-sudhāṁ vistārayan rājate\",\"sach-chhāstrāṇi cha toṣayan budha-gaṇaṁ sammodayaṁs te tathā\",\"nūnaṁ bhūmi-tale śubhodaya iti hlādo bahuḥ sātvatām\"],\"translation\":[\"As the universally cooling moon is beautified by diffusing its nectarean rays, nourishing the plants and inciting the twinkling of the stars, your holy advent in this world is similarly ascertained as satisfying the pure devotional scriptures (through profound study) and blessing the learned with full-blown happiness (by the perfect axiomatic conclusions descending in divine succession). With your appearance, the ecstasy of the devotees knows no bounds.\"]},{\"number\":\"6\",\"text\":[\"lokānāṁ hita-kāmyayā bhagavato bhakti-prachāras tvayā\",\"granthānāṁ rachanaiḥ satām abhimatair nānā-vidhair darśitaḥ\",\"āchāryaiḥ kṛta-pūrvam eva kila tad rāmānujādyair budhaiḥ\",\"premāmbhonidhi-vigrahasya bhavato māhātmya-sīmā na tat\"],\"translation\":[\"By writing many books and by multifarious methods recognised by the pure devotees, you have demonstrated the preaching of pure devotional service unto the Supreme Lord, for the benefit of the whole world. We have heard of similar achievements in previous times by stalwart scholars such as Śrī Rāmānuja and many other Āchāryas; but the glory of you – the very embodiment of the nectar of divine love – does not end (cannot be confined) here.\"]},{\"number\":\"7\",\"text\":[\"yad dhāmnaḥ khalu dhāma chaiva nigame brahmeti saṁjñāyate\",\"yasyāṁśasya kalaiva duḥkha-nikarair yogeśvarair mṛgyate\",\"vaikuṇṭhe para-mukta-bhṛṅga-charaṇo nārāyaṇo yaḥ svayaṁ\",\"tasyāṁśī bhagavān svayaṁ rasa-vapuḥ kṛṣṇo bhavān tat pradaḥ\"],\"translation\":[\"Merely the effulgence of His divine abode has been designated by the title ‘Brahman’ in the Vedas, and only the expansion of an expansion of His expansion is sought after with great tribulation by the foremost yogīs. The most exalted of the liberated souls shine resplendent as bumblebees at His lotus feet. The primeval origin of even the original Śrī Nārāyaṇa who is the Lord of the spiritual sky above Brahman: He is the original Supreme Lord, the personification of all nectarean mellows – Śrī Kṛṣṇa – and He is the one that you give.\"]},{\"number\":\"8\",\"text\":[\"sarvāchintyamaye parātpara-pure goloka-vṛndāvane\",\"chil-līlā-rasa-raṅginī parivṛtā sā rādhikā śrī-hareḥ\",\"vātsalyādi-rasaiś cha sevita-tanor mādhurya-sevā-sukhaṁ\",\"nityaṁ yatra mudā tanoti hi bhavān tad dhāma-sevā-pradaḥ\"],\"translation\":[\"Situated in the topmost region of the absolutely inconceivable spiritual sky is the holy abode of Śrī Vṛndāvan Dhām in the spiritual planet known as Goloka. There, surrounded by sakhīs, Śrīmatī Rādhikā revels in the mellows of divine Pastimes. With great ecstasy, She expands the joy of loving sweetness in the service of Śrī Kṛṣṇachandra, Who is otherwise served in four relationships up to parenthood. You, O Ṭhākur Bhakti Vinod, can give us the service of that holy dhām.\"]},{\"number\":\"9\",\"text\":[\"śrī-gaurānumataṁ svarūpa-viditaṁ rūpāgrajenādṛtaṁ\",\"rūpādyaiḥ pariveśitaṁ raghu-gaṇair āsvāditaṁ sevitam\",\"jīvādyair abhirakṣitaṁ śuka-śiva-brahmādi-sammānitaṁ\",\"śrī-rādhā-pada-sevanāmṛtam aho tad dātum īśo bhavān\"],\"translation\":[\"The internal purport is known to Śrī Svarūp Dāmodar by the sanction of Śrī Gaurachandra. That, which is adored by Śrī Sanātan Goswāmī and distributed by the preceptors realised in transcendental mellows, headed by Śrī Rūpa Goswāmī; that which is tasted and enhanced by Śrī Raghunāth Dās Goswāmī and followers, and carefully protected by the votaries headed by Śrī Jīva Prabhu; and that which (from a respectful distance) is venerated by great personalities such as Śrī Śuka, Lord Śiva, the chief of the demigods, and Lord Brahmā, the grandfather of all beings – O wonder of wonders! the nectarean rapture of servitude unto Śrī Rādhikā – that, too, you can give us.\"]},{\"number\":\"10\",\"text\":[\"kvāhaṁ manda-matis tv atīva-patitaḥ kva tvaṁ jagat-pāvanaḥ\",\"bho svāmin kṛpayāparādha-nichayo nūnaṁ tvayā kṣamyatām\",\"yāche ’haṁ karuṇā-nidhe! varam imaṁ pādābja-mūle bhavat-\",\"sarvasvāvadhi-rādhikā-dayita-dāsānāṁ gaṇe gaṇyatām\"],\"translation\":[\"Where am I, so lowly and fallen, and where are you, the great soul who delivers the universe! O Lord, by your grace, you are sure to forgive my offences. O ocean of mercy, in the dust of your lotus feet I pray for just this benediction: kindly make my life successful by recommending me for admission into the group of Śrī Vārṣabhānavī Dayita Dās, who is the dearmost one in your heart.\",\"\\\\****Translator’s Note:*** The preceding prayer to Śrīla Bhakti Vinod Ṭhākur (1838-1914), the pioneer of pure devotion in the recent age, was composed within the lifetime of the author’s Guru, Śrīla Bhakti Siddhānta Saraswatī Ṭhākur Goswāmī Prabhupād. Upon reading the original Sanskrit verse, just the year before his own passing away, Śrīla Prabhupād commented, “Now I am confident that we have one man who is qualified to uphold the standard of our sampradāya (divine succession).”\"]}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"3d:[\"$\",\"$L45\",null,{\"navMap\":{\"295\":{\"prev\":{\"path\":\"/en-2026/shri-chaitanya-kripa-haite-raghunatha-dasa-chitte/\",\"title\":\"Śrīla Raghunāth Dās Goswāmī Śochaka – Kīrtan Two\"},\"next\":{\"path\":\"/en-2026/shri-gauda-dhamashrita-shiuddha-bhaktam/\",\"title\":\"Śrīla Gaura Kiśor Dās Bābājī Mahārāj Aṣṭakam\"}}}}]\n46:T49a,{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"CollectionPage\",\"@id\":\"https://dev.kirtan.site/en-2026/ha-ha-bhaktivinoda-thakkura-guroh\",\"url\":\"https://dev.kirtan.site/en-2026/ha-ha-bhaktivinoda-thakkura-guroh\",\"name\":\"Śrīmad Bhakti Vinod Viraha Daśakam. Sanskrit composition. *Prayer in Separation of Śrīla Bhakti Vinod Ṭhākur\",\"inLanguage\":\"en\",\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"}},{\"@type\":\"MusicComposition\",\"@id\":\"https://dev.kirtan.site/en-2026/ha-ha-bhaktivinoda-thakkura-guroh#composition\",\"alternateName\":[\"hā hā bhakti-vinoda-ṭhākura! guroḥ!\"],\"name\":\"Śrīmad Bhakti Vinod Viraha Daśakam. Sanskrit composition. *Prayer in Separation of Śrīla Bhakti Vinod Ṭhākur\",\"url\":\"https://dev.kirtan.site/en-2026/ha-ha-bhaktivinoda-thakkura-guroh\",\"composer\":{\"@type\":\"Person\",\"name\":\"Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\"},\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"},\"about\":[{\"@type\":\"Thing\",\"name\":\"Bhakti Yoga\"},{\"@type\":\"Thing\",\"name\":\"Gaudiya Vaishnavism\"}],\"genre\":[\"Devotional\",\"Bhajan\",\"Kirtan\"],\"mainEntityOfPage\":{\"@id\":\"https://dev.kirtan.site/en-2026/ha-ha-bhaktivinoda-thakkura-guroh\"}}]}3e:[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$46\"}}]\n3f:[\"$\",\"$L47\",null,{\"bookId\":\"en-2026\",\"page\":295}]\n40:[\"$\",\"$L48\",null,{\"bookId\":\"en-2026\",\"songId\":\"ha-ha-bhaktivinoda-thakkura-guroh\"}]\n41:[\"$\",\"$L49\",null,{}]\n42:[\"$\",\"$L4a\",null,{\"bookId\":\"en-2026\"}]\n"])</script></body></html>
