Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\",\"rel\":\"author\",\"children\":\"by Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\"}]]}]]}]]]}]]\n"])</script><script>self.__next_f.push([1,"1d:[\"$\",\"$L24\",null,{\"bookId\":\"en-2026\",\"label\":\"Show verses / translation\",\"song\":{\"meta\":{\"page\":141,\"author\":\"Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\",\"first_line\":\"aruṇa vasane sonāra sūraja\"},\"title\":[\"Śrī Śrī Gaurasundarer Āvirbhāva Vāsare\"],\"author\":[\"by Śrīla Bhakti Rakṣak Śrīdhar Dev-Goswāmī Mahārāj\"],\"subtitle\":[\"The Holy Appearance Day of Śrī Śrī Gaurasundar\"],\"verses\":[{\"number\":\"1\",\"text\":[\"aruṇa vasane    sonāra sūraja\",\"    udichhe kena re āja\",\"vasanta suṣamā    ujāri āpanā\",\"    ḍhāle kena jaga-mājha\"],\"translation\":[\"Why has the Lord appeared suddenly with golden complexion and with golden dress just like the morning sun? Why has He come in the middle of springtime as everything feels so beautiful and wonderful?\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"taru-gulma-latā    apūrva vāratā\",\"    vahe kena phale phule\",\"bhṛṅga o vihaṅge    kena hena raṅge\",\"    saṅgīta taraṅga tule\"],\"translation\":[\"Trees, bushes, and creeping vines – all display a wondrous newness. By what cause do they bear such fruits and flowers? Why do the bees and birds in such delight raise waves of melodious song?\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"patita durjana    kena re garjana\",\"    ullāse phāṭhiyā paḍe\",\"vidyā-kula-dhana-    abhimānī jana\",\"    kena mlāna duḥkha bhare\"],\"translation\":[\"I am very fallen and unqualified. Why is this sound vibration coming to me, and why am I getting inspiration through it? Those who have high caste, vast knowledge and material wealth, they have so much ego and pride – why are they suffering?\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"ākāśa-vātāsa    ghuchāiya trāsa\",\"    āśvāse bhāsāye deya\",\"sādhu-jana-mana    sukha vitaraṇa-\",\"    āveśe unmāda haya\"],\"translation\":[\"The sky and the air are so beautiful in the spring season, and they are naturally nourishing and inspiring everybody. In the same way, the sound vibration of the devotees spreads everywhere automatically as they distribute Kṛṣṇa’s Name.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"chaudikete dhvani    ki apūrva śuni\",\"    bahu-jana-uchcharola\",\"hare kṛṣṇa rāma    nāma divya-dhāma\",\"    hari hari hari bola\"],\"translation\":[\"What a remarkable sound is heard in all directions bringing jubilation to all the people. The devotees chant the divine Names “Hare, Kṛṣṇa, Rāma”, and the transcendental abode manifests. Chant “Hari Hari Hari!”\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"phālgunī pūrṇimā    hindola raṅgimā\",\"    sujana bhajana-rāge\",\"saṅkīrtana sane    marama gahane\",\"    nā jāni ki bhāva jāge\"],\"translation\":[\"On His holy appearance day, the festival of Holi takes place. All the devotees are chanting as well as all the Hindus. No one can understand the feeling and the substance that comes within the heart from that saṅkīrtan.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"sandhyā samāgama    tapana magana\",\"    kena hema ghana kole\",\"aparūpa kata    pūrava parvata\",\"    suvarṇa chandramā bhāle\"],\"translation\":[\"As the sunset approaches, the sun shines on the mountain illuminating it like it has golden ornaments. This is especially so in the springtime. Then as the moon rises, it also beautifies that mountain with its rays.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"suvarṇa chandramā    paśichhe nīlimā\",\"    se nīla vilīna heme\",\"ithe kibā bhāya    sādhu-jana gāya\",\"    kalaṅka nā rahe preme\"],\"translation\":[\"The blue sky is covered by the Golden Moon, and when the devotees glorify the Lord with their discussions, no other conception or motive can exist other than Kṛṣṇa consciousness. At that time, prema, divine love, descends automatically without any impediment.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"mahājane bale    grahaṇera chhale\",\"    saṅge nāma-saṅkīrtana\",\"gaurachandrodaya    pāpa rāhu kṣaya\",\"    chandra-śobhā-prema-dhana\"],\"translation\":[\"The great devotees say, take up your spiritual path with the congregational chanting of the Lord’s Holy Names. With the appearance of Śrī Gaurachandra, all sinfulness is removed and everyone attains the treasure of love of Godhead.\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"marmajña sakale    kahe kutūhale\",\"    nīlimā vilīna chā̐de\",\"chhanna avatāra    lukāna kāhāra?\",\"    rādhā-ruchi-rūpa-chhā̐de\"],\"translation\":[\"Everyone who engages in this Nām-saṅkīrtan of Mahāprabhu comes to enquire sincerely and to know the innermost secret of the Lord’s bluish colour absorbed by His golden features. This is the hidden incarnation of the Lord and the concealed feature of His form is that He is tasting the threefold relish of Śrī Rādhā.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"ithe hena stuti    rādhā-bhāva-dyuti\",\"    suvalita śyāma rāo\",\"udila gaurāṅga    nāma-prema-saṅga\",\"    jaya jaya gorā gāo\"],\"translation\":[\"Thus I pray to the dark cowherd boy Śyāmasundar who has taken the mood and effulgence of Śrī Rādhā. That Lord, Śrī Chaitanya, appeared with the chanting of the pure divine Name; everyone chant the glories of that Golden Lord, Śrī Chaitanya Mahāprabhu.\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1e:[\"$\",\"$L25\",null,{\"navMap\":{\"141\":{\"prev\":{\"path\":\"/en-2026/nagara-bhramiya-amara-gaura-elo-ghore/\",\"title\":\"After Parikramā\"},\"next\":{\"path\":\"/en-2026/yadi-te-hari-pada-saroja-sudha/\",\"title\":\"Śrī Godruma-chandra-bhajanopadeśa\"}}}}]\n26:Td0f,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Org
