lative knowledge and materialistic activities and just worship Rādhā and Krishna in the forests of Vraja.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"(bhaja) gaura-gadādharādvaita-guru-nityānanda\",\"            (gaura-kṛṣṇe abheda jene re)\",\"            (guru kṛṣṇa-priya jene gaura-kṛṣṇe abheda jene re)\",\"(smara) śrīnivāsa, haridāsa, murāri, mukunda\",\"            (gaura-preme smara smara re)\",\"            (śrīnivāsa, haridāse, gaura-preme smara smara re)\"],\"translation\":[\"You should worship and serve Lord Gaura, Gadādhara, Advaita, and the original Spiritual Master, Lord Nityānanda. Knowing Lord Gaura and Lord Krishna to be the same, and knowing the Spiritual Master to be very dear to Krishna, you should remember the dear associates of Lord Chaitanya, such as Śrīvās Ṭhākur, Haridās Ṭhākur, Murāri Gupta, and Mukunda Datta. In deep love for Lord Gaura, you should remember the two great personalities Śrīvās Ṭhākur and Haridās Ṭhākur.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"(smara) rūpa-sanātana-jīva-raghunātha-dvandva\",\"            (yadi bhajan karbe re)\",\"            (rūpa-sanātane smara yadi bhajan karbe re)\",\"(smara) rāghava-gopāla-bhaṭṭa-svarūpa-rāmānanda\",\"            (kṛṣṇa-prema yadi chāo re)\",\"            (svarūpa-rāmānande smara kṛṣṇa-prema yadi chāo re)\"],\"translation\":[\"You should remember the Goswāmīs of Vṛndāvan: Śrī Rūpa Goswāmī, Sanātan Goswāmī, Jīva Goswāmī, Raghunāth Bhaṭṭa Goswāmī, and Raghunāth Dās Goswāmī. If you worship Lord Krishna, then you should remember the two great souls Śrī Rūpa Goswāmī and Sanātan Goswāmī. You should also remember Rāghava Paṇḍit, Gopāl Bhaṭṭa Goswāmī, Swarūp Dāmodar Goswāmī, and Rāmānanda Rāya. If you really seek love of Krishna, then you must remember Swarūp Dāmodar Goswāmī and Rāmānanda Rāya.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"(smara) goṣṭhī-saha karṇapura sena-śivānanda\",\"            (ajasra smara smara re)\",\"            (goṣṭhī-saha sena śivānande ajasra smara smara re)\",\"(smara) rūpānuga sādhu-jana bhajana-ānanda\",\"            (vraje vās yadi chāo re)\",\"            (rūpānuga sādhu-jane smara vraje vās yadi chāo re)\"],\"translation\":[\"You should remember Śrīla Kavi Karṇapura and all his family members, who are all sincere servants of Lord Śrī Chaitanya Mahāprabhu. You should also remember the father of Kavi Karṇapura, Śivānanda Sena. Always remember, always remember Śrī Karṇapura and his family. You should remember all those Vaiṣṇavas who strictly follow the path of Śrī Rūpa Goswāmī and who are absorbed in the ecstasy of bhajan. If you actually want residence in the land of Vraja, then you must remember all of the Vaiṣṇavas, who are followers of Śrīla Rūpa Goswāmī.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-bhajare\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1a:[\"$\",\"$L23\",null,{\"audio\":\"$19:props:song:resources:audio\",\"caption\":\"Listen audio:\",\"language\":\"en\"}]\n1b:[\"$\",\"$L24\",null,{\"navMap\":{\"60\":{\"prev\":{\"path\":\"/en-2026/shri-krishna-chaitanya-prabhu-jive-daya-kori/\",\"title\":\"Invocation to the book Śaraṇāgati\"},\"next\":{\"path\":\"/en-2026/vibhavari-shiesha-aloka-praveshia/\",\"title\":\"Vibhāvarī Śeṣa\"}}}}]\n25:Te5a,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"description\":\"A digital Vaishnava songbook with lyrics, translations, and audio recordings.\
