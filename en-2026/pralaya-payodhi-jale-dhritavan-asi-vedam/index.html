":{\"meta\":{\"page\":231,\"author\":\"Śrīla Jayadev Goswāmī\",\"first_line\":\"pralaya-payodhi-jale dhṛtavān asi vedaṁ\",\"styles\":{\"verses\":{\"wide\":false}}},\"title\":[\"Śrī Daśāvatār Stotram\"],\"author\":[\"Sanskrit composition by Śrīla Jayadev Goswāmī\"],\"verses\":[{\"number\":\"1\",\"text\":[\"pralaya-payodhi-jale dhṛtavān asi vedaṁ\",\"vihita-vahitra-charitram akhedam\",\"keśava dhṛta-mīna-śarīra jaya jagadīśa hare\"],\"translation\":[\"O Keśava! O Lord of the universe! O Lord Hari, who have assumed the form of a fish! All glories to You! You easily acted as a boat in the form of a giant fish just to give protection to the Vedas, which had become immersed in the turbulent sea of devastation.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"kṣitir iha vipulatare tiṣṭhati tava pṛṣṭhe\",\"dharaṇi-dharaṇa-kina-chakra-gariṣṭhe\",\"keśava dhṛta-kūrma-śarīra jaya jagadīśa hare\"],\"translation\":[\"O Keśava! O Lord of the universe! O Lord Hari, who have assumed the form of a tortoise! All glories to You! In this incarnation as a divine tortoise the great Mandara Mountain rests upon Your gigantic back as a pivot for churning the ocean of milk. From holding up the huge mountain a large scarlike depression is put in Your back, which has become most glorious.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"vasati daśana-śikhare dharaṇī tava lagnā\",\"śaśini kalaṅka-kaleva nimagnā\",\"keśava dhṛta-śūkara-rūpa jaya jagadīśa hare\"],\"translation\":[\"O Keśava! O Lord of the universe! O Lord Hari, who have assumed the form of a boar! All glories to You! The earth, which had become immersed in the Garbhodaka Ocean at the bottom of the universe, sits fixed upon the tip of Your tusk like a spot upon the moon.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"tava kara-kamala-vare nakham adbhuta-śṛṅgaṁ\",\"dalita-hiraṇyakaśipu-tanu-bhṛṅgam\",\"keśava dhṛta-narahari-rūpa jaya jagadīśa hare\"],\"translation\":[\"O Keśava! O Lord of the universe! O Lord Hari, who have assumed the form of half-man, half-lion! All glories to You! Just as one can easily crush a wasp between one’s fingernails, so in the same way the body of the wasplike demon Hiraṇyakaśipu has been ripped apart by the wonderful pointed nails on Your beautiful lotus hands.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"chhalayasi vikramaṇe balim adbhuta-vāmana\",\"pada-nakha-nīra-janita-jana-pāvana\",\"keśava dhṛta-vāmana-rūpa jaya jagadīśa hare\"],\"translation\":[\"O Keśava! O Lord of the universe! O Lord Hari, who have assumed the form of a dwarf-brāhmaṇa, Vāmanadev! All glories to You! O wonderful dwarf, by Your massive steps You deceive King Bali, and by the Ganges water that has emanated from the toenails of Your lotus feet, You deliver all living beings within this world.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"kṣatriya-rudhira-maye jagad-apagata-pāpaṁ\",\"snapayasi payasi śamita-bhava-tāpam\",\"keśava dhṛta-bhṛgupati-rūpa jaya jagadīśa hare\"],\"translation\":[\"O Keśava! O Lord of the universe! O Lord Hari, who have assumed the form of Bhṛgupati (Paraśurāma)! All glories to You! At Kurukṣetra You bathe the earth in the rivers of blood from the bodies of the demoniac kṣatriyas that You have slain. The sins of the world are washed away by You, and because of You people are relieved from the blazing fire of material existence.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"vitarasi dikṣu raṇe dik-pati-kamanīyaṁ\",\"daśa-mukha-mauli-baliṁ ramaṇīyam\",\"keśava dhṛta-rāma-śarīra jaya jagadīśa hare\"],\"translation\":[\"O Keśava! O Lord of the universe! O Lord Hari, who have assumed the form of Rāmachandra! All glories to You! In the battle of Laṅkā You destroy the ten-headed demon Rāvaṇa and distribute his heads as a delightful offering to the presiding deities of the ten directions, headed by Indra. This action was long desired by all of them, who were much harassed by this monster.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"vahasi vapuṣi viśade vasanaṁ jaladābhaṁ\",\"hala-hati-bhīti-milita-yamunābham\",\"keśava dhṛta-haladhara-rūpa jaya jagadīśa hare\"],\"translation\":[\"O Keśava! O Lord of the universe! O Lord Hari, who have assumed the form of Balarām, the wielder of the plow! All glories to You! On Your brilliant white body You wear garments the colour of a fresh blue rain cloud. These garments are coloured like the beautiful dark hue of the River Yamunā, who feels great fear due to the striking of Your plowshare.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"nindasi yajña-vidher ahaha śruti-jātaṁ\",\"sadaya-hṛdaya darśita-paśu-ghātam\",\"keśava dhṛta-buddha-śarīra jaya jagadīśa hare\"],\"translation\":[\"O Keśava! O Lord of the universe! O Lord Hari, who have assumed the form of Buddha! All glories to You! O Buddha of compassionate heart, you decry the slaughtering of poor animals performed according to the rules of Vedic sacrifice.\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"mlechchha-nivaha-nidhane kalayasi karavālaṁ\",\"dhūmaketum iva kim api karālam\",\"keśava dhṛta-kalki-śarīra jaya jagadīśa hare\"],\"translation\":[\"O Keśava! O Lord of the universe! O Lord Hari, who have assumed the form of Kalki! All glories to You! You appear like a comet and carry a terrifying sword for bringing about the annihilation of the wicked barbarian men at the end of the Kali-yuga.\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"śrī-jayadeva-kaver idam uditam udāraṁ\",\"śṛṇu sukha-daṁ śubha-daṁ bhava-sāram\",\"keśava dhṛta-daśa-vidha-rūpa jaya jagadīśa hare\"],\"translation\":[\"O Keśava! O Lord of the universe! O Lord Hari, who have assumed these ten different forms of incarnation! All glories to You! O readers, please hear this hymn of the poet Jayadeva, which is most excellent, an awarder of happiness, a bestower of auspiciousness, and the best thing in this dark world.\"],\"isLong\":false},{\"number\":\"12\",\"text\":[\"vedān uddharate jaganti vahate bhū-golam udbibhrate\",\"daityaṁ dārayate baliṁ chhalayate kṣatra-kṣayaṁ kurvate\",\"paulastyaṁ jayate halaṁ kalayate kāruṇyam ātanvate\",\"mlechchhān mūrchchhayate daśākṛti-kṛte kṛṣṇāya tubhyaṁ namaḥ\"],\"translation\":[\"O Lord Kṛṣṇa, I offer my obeisances unto You, who appear in the forms of these ten incarnations. In the form of Matsya You rescue the Vedas, and as Kūrma You bear the Mandara Mountain on Your back. As Varāha You lift the earth with Your tusk, and in the form of Nṛsiṁha You tear open the chest of the demon Hiraṇyakaśipu. In the form of Vāmana You trick the demoniac king Bali by asking him for only three steps of land, and then You take away the whole universe from him by expanding Your steps. As Paraśurāma You slay all of the wicked kṣatriyas, and as Rāmachandra You conquer the rākṣasa king Rāvaṇa. In the form of Balarām You carry a plough with which You subdue the wicked and draw toward You the River Yamunā. As Lord Buddha You show compassion toward all the living beings suffering in this world, and at the end of the Kali-yuga You appear as Kalki to bewilder the mlechas (degraded low-class men).\"],\"isLong\":true}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/krsnachaitanya-das/39-sri-dasavatar-stotram-2\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1e:[\"$\",\"$L27\",null,{\"audio\":\"$1d:props:song:resources:audio\",\"caption\":\"Listen audio:\",\"language\":\"en\"}]\n1f:[\"$\",\"$L28\",null,{\"navMap\":{\"231\":{\"prev\":{\"path\":\"/en-2026/jayare-jayare-jaya-paramahamsa-mahashiaya/\",\"title\":\"Āchārya-vandanā\"},\"next\":{\"path\":\"/en-2026/namas-te-narasimhaya/\",\"title\":\"Śrī Nṛsiṁha Praṇām\"}}}}]\n29:Tf59,"])</script><script>self.__next_f.push([1,"{\"@context\":\"
