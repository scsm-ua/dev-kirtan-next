tures of the Absolute Truth, came to give the Hare Kṛṣṇa Mahāmantra to the fallen devotees of this age, so they are the general representation of Guru for us. They help us to enter into the domain of Kṛṣṇa and also the plane of Śrī Chaitanya Mahāprabhu.\",\"After chanting the Pañcha Tattva mantra, we should count on the beads of the japa-mālā and chant the Mahāmantra.\",\"In the Name of Rāma within the Hare Kṛṣṇa mantra, the Gauḍīya Vaiṣṇavas will find Rādhā-ramaṇa Rāma. That means, “Kṛṣṇa, who gives pleasure (ramaṇ) to Śrīmatī Rādhārāṇī.” In our conception, the Hare Kṛṣṇa mantra is wholesale Kṛṣṇa consciousness, not Rāma (Lord Rāmachandra) consciousness. Śrī Chaitanya’s highest conception of things is always Svayaṁ Bhagavān, Kṛṣṇa-līlā, Rādhā-Govinda-līlā. That is the real purpose of Śrī Chaitanya Mahāprabhu’s advent and teachings. In that consideration, the Hare Kṛṣṇa mantra does not mention the Rāma-līlā of Āyodhya at all. There is no connection with that in the highest conception of the Hare Kṛṣṇa mantra. The inner conception of the mantra is responsible for our spiritual attainment. The inner conception of the devotee will guide them to their destination.\"]}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/jayasri-sound/maha-mantra\"},{\"title\":{\"en\":\"Srila B.R. Sridhar Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.Р. Шридхар Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.Р. Шрідгар Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/scs-math-mexico-cpi/mahamantra-hare-krishna-srila-bhakti-rakshak-sridhar-deva-goswami-maharaj\"},{\"title\":{\"en\":\"Srila B.S. Goswami Maharaj\",\"ru\":\"Шрила Б.С. Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/goswami-maharaj-mahamantra\"},{\"title\":{\"en\":\"Caracas temple\",\"ru\
