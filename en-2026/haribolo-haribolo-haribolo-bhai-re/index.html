"],\"translation\":[\"Brother! Chanting “Hari”, throw ash in the face of desire! (Desireless­ness is happiness!) Giving up desire for enjoyment and liberation, I will chant Hari’s Name! (Being pure in heart!)\"]},{\"number\":\"5\",\"text\":[\"nā cheyeo nāmera guṇe o saba phala pāi re\",\"    (tuchchha phaler prayāsa chheḍe re)\",\"vinoda bale yāi laye nāmera bālāi re\",\"    (nāmera bālāi chheḍe re)\"],\"translation\":[\"Even without desiring them, I obtain all those ends (dharma, artha, kāma, and mokṣa) by the power of Hari’s Name! (Give up endeavours for insignificant ends!) Vinod says, “I will remove the obstructions to Hari’s Name! (Give up the obstructions to Hari’s Name!)”\"]}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"3b:[\"$\",\"$L42\",null,{\"navMap\":{\"152\":{\"prev\":{\"path\":\"/en-2026/prabhu-kohe-kohilan-ei-mahamantra/\",\"title\":\"Prabhu Kahe – Kahilāṅ ei Mahāmantra\"},\"next\":{\"path\":\"/en-2026/ohe-harinam-tava-mahima-apara/\",\"title\":\"Śrī Nāmāṣṭakam 7\"}}}}]\n3c:[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"CollectionPage\\\",\\\"@id\\\":\\\"https://dev.kirtan.site/en-2026/haribolo-haribolo-haribolo-bhai-re\\\",\\\"url\\\":\\\"https://dev.kirtan.site/en-2026/haribolo-haribolo-haribolo-bhai-re\\\",\\\"name\\\":\\\"Haribala Bhāi Re. by Śrīla Bhakti Vinod Ṭhākur\\\",\\\"inLanguage\\\":\\\"en\\\",\\\"isPartOf\\\":{\\\"@id\\\":\\\"https://dev.kirtan.site/#website\\\"}},{\\\"@type\\\":\\\"MusicComposition\\\",\\\"@id\\\":\\\"https://dev.kirtan.site/en-2026/haribolo-haribolo-haribolo-bhai-re#composition\\\",\\\"alternateName\\\":[\\\"haribala haribala haribala bhāi re\\\"],\\\"name\\\":\\\"Haribala Bhāi Re. by Śrīla Bhakti Vinod Ṭhākur\\\",\\\"url\\\":\\\"https://dev.kirtan.site/en-2026/haribolo-haribolo-haribolo-bhai-r
