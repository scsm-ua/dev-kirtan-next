\"href\":\"/en-2026/authors#section-Śrīla Bhakti Vinod Ṭhākur\",\"children\":\"by Śrīla Bhakti Vinod Ṭhākur\"}]]}]]}]]]}]\n"])</script><script>self.__next_f.push([1,"3e:[\"$\",\"$L46\",null,{\"bookId\":\"en-2026\",\"label\":\"Show verses / translation\",\"song\":{\"meta\":{\"page\":183,\"author\":\"Śrīla Bhakti Vinod Ṭhākur\",\"first_line\":\"kabe ha’be bala se-dina āmāra\",\"verse parentheses\":\"non bold\"},\"title\":[\"Kabe Ha’be Bala\"],\"author\":[\"by Śrīla Bhakti Vinod Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"            kabe ha’be bala se-dina āmāra\",\"(āmār) aparādha ghuchi’    śuddha nāme ruchi\",\"            kṛpā-bale ha’be hṛdaye sañchāra\"],\"translation\":[\"Please tell me, when will that day be mine – when (my) offences will end and a taste for the pure Holy Name will be infused within my heart by the power of divine grace?\"]},{\"number\":\"2\",\"text\":[\"tṛṇādhika hīna    kabe nije māni\",\"    sahiṣṇutā-guṇa hṛdayete āni’\",\"sakale mānada    āpani amānī\",\"    haye āsvādiba nāma-rasa-sāra\"],\"translation\":[\"Considering myself lower than a blade of grass, bringing the quality of forbearance into my heart, showing respect to all, myself being freed from all false pride – when will I taste the essence of the liquid nectar of the Holy Name?\"]},{\"number\":\"3\",\"text\":[\"dhana jana āra    kavitā, sundarī\",\"    baliba nā chāhi deha-sukha-karī\",\"janme-janme dāo    ohe gaurahari!\",\"    ahaitukī-bhakti charaṇe tomāra\"],\"translation\":[\"Wealth, following, beautiful women, as described in worldly poetry – I do not want any such bodily pleasures. O Lord Gaurahari, please give me unmotivated devotion to Your lotus feet, birth after birth.\"]},{\"number\":\"4\",\"text\":[\"(kabe) karite śrī-kṛṣṇa-    nāma uchāraṇa\",\"    pulakita deha gadgada vachana\",\"vaivarṇya-vepathu    habe saṅghaṭana\",\"    nirantara netre va’be aśru-dhāra\"],\"translation\":[\"(When,) while articulating the divine Name of Śrī Kṛṣṇa, will my body be thrilled in ecstatic rapture and my words choked with emotion? When will pallor and ecstatic trembling occur, and when will streams of tears flow constantly from my eyes?\"]},{\"number\":\"5\",\"text\":[\"kabe navadvīpe    suradhunī-taṭe\",\"    ‘gaura-nityānanda’ bali’ niṣkapaṭe\",\"nāchiyā gāiyā    beḍāiba chhuṭe\",\"    vātulera prāya chhāḍiyā vichāra\"],\"translation\":[\"When, in the land of Nabadwīp, on the banks of the Ganges, will I run about, guilelessly calling, “O Gaura! O Nityānanda!” dancing and singing like a madman, giving up all considerations?\"]},{\"number\":\"6\",\"text\":[\"kabe nityānanda    more kari’ dayā\",\"    chhāḍāibe mora viṣayera māyā\",\"diyā more nija-    charaṇera chhāyā\",\"    nāmera hāṭete dibe adhikāra\"],\"translation\":[\"When will Lord Nityānanda be merciful to me and release me from the illusion of worldliness? Giving me the shade of His lotus feet, when will He allow me to enter the marketplace of the Holy Name?\"]},{\"number\":\"7\",\"text\":[\"kiniba, luṭiba    hari-nāma-rasa\",\"    nāma-rase māti’ ha-iba vivaśa\",\"rasera rasika-    charaṇa paraśa\",\"    kariyā majiba rase anibāra\"],\"translation\":[\"I shall buy and plunder the mellow of the Name Hari, and becoming thoroughly intoxicated by those liquid mellows of the Holy Name, I shall become stunned. By touching the feet of those great souls who are able to relish those mellows, I will be constantly immersed in the sweet nectar of the Holy Name.\"]},{\"number\":\"8\",\"text\":[\"kabe jīve dayā    ha-ibe udaya\",\"    nija-sukha bhuli’ sudīna-hṛdaya\",\"bhakati-vinoda    kariyā vinaya\",\"    śrī-ājñā-ṭahala karibe prachāra\"],\"translation\":[\"When will there be an awakening of compassion for all fallen souls, and when will this Bhakti Vinod, forgetting his own happines, with a meek heart set out to propagate by humble entreaty the sacred order of Śrī Chaitanya Mahāprabhu?\"]}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"3f:[\"$\",\"$L47\",null,{\"navMap\":{\"183\":{\"prev\":{\"path\":\"/en-2026/atma-samarpane-gela-abhimana/\",\"title\":\"Ātma-samarpaṇe\"},\"next\":{\"path\":\"/en-2026/durlabha-manava-janma-labhiya-samsare/\",\"title\":\"Durlabha Mānava-janma\"}}}}]\n40:[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"CollectionPage\\\",\\\"@id\\\":\\\"https://dev.kirtan.site/en-2026/kobe-hobe-bolo-se-dina-amar\\\",\\\"url\\\":\\\"https://dev.kirtan.site/en-2026/kobe-hobe-bolo-se-dina-amar\\\",\\\"name\\\":\\\"Kabe Ha’be Bala. by Śrīla Bhakti Vinod Ṭhākur\\\",\\\"inLanguage\\\":\\\"en\\\",\\\"isPartOf\\\":{\\\"@id\\\":\\\"https://dev.kirtan.site/#website\\\"}},{\\\"@type\\\":\\\"MusicComposition\\\",\\\"@id\\\":\\\"https://dev.kirtan.site/en-2026/kobe-hobe-bolo-se-dina-amar#composition\\\",\\\"alternateName\\\":[\\\"kabe ha’be bala se-dina āmāra\\\"],\\\"name\\\":\\\"Kabe Ha’be Bala. by Śrīla Bhakti Vinod Ṭhākur\\\",\\\"url\\\":\\\"https://dev.kirtan.site/en-2026/kobe-hobe-bolo-se-dina-amar\\\",\\\"composer\\\":{\\\"@type\\\":\\\"Person\\\",\\\"name\\\":\\\"Śrīla Bhakti Vinod Ṭhākur\\\"},\\\"isPartOf\\\":{\\\"@id\\\":\\\"https://dev.kirtan.site/#website\\\"},\\\"about\\\":[{\\\"@type\\\":\\\"Thing\\\",\\\"name\\\":\\\"Bhakti Yoga\\\"},{\\\"@type\\\":\\\"Thing\\\",\\\"name\\\":\\\"Gaudiya Vaishnavism\\\"}],\\\"genre\\\":[\\\"Devotional\\\",\\\"Bhajan\\\",\\\"Kirtan\\\"],\\\"mainEntityOfPage\\\":{\\\"@id\\\":\\\"https://dev.kirtan.site/en-2026/kobe-hobe-bolo-se-dina-amar\\\"}}]}\"}}]\n41:[\"$\",\"$L48\",null,{\"bookId\":\"en-2026\",\"page\":183}]\n42:[\"$\",\"$L49\",null,{\"bookId\":\"en-2026\",\"songId\":\"kobe-hobe-bolo-se-dina-amar\"}]\n43:[\"$\",\"$L4a\",null,{}]\n44:[\"$\",\"$L4b\",null,{\"bookId\":\"en-2026\"}]\n"])</script></body></html>
