next_f.push([1,"19:[\"$\",\"$L21\",null,{\"bookId\":\"en-2026\",\"label\":\"Show verses / translation\",\"song\":{\"meta\":{\"page\":198,\"author\":\"Śrīla Bhakti Vinod Ṭhākur\",\"first_line\":\"anādi karama-phale paḍi’ bhavārṇava-jale\",\"alt_first_lines\":[\"Śrī Śikṣāṣṭakam – Verse 5\",\"ayi nanda-tanuja kiṅkaraṁ\"]},\"title\":[\"Śrī Śikṣāṣṭakam\"],\"author\":[\"by Śrī Chaitanya Mahāprabhu in Sanskrit\"],\"subtitle\":[\"Verse Five\"],\"verses\":[{\"text\":[\"ayi nanda-tanuja kiṅkaraṁ\",\"patitaṁ māṁ viṣame bhavāmbudhau\",\"kṛpayā tava pāda-paṅkaja-\",\"sthita-dhūlī-sadṛśaṁ vichintaya\"],\"translation\":[\"“O son of Nanda Mahārāj, I am Your eternal servant, yet because of my own karma, I have fallen into this terrible ocean of birth and death. Please accept this fallen soul and consider me a particle of dust at Your holy lotus feet.”\",\"---\",\"*Śrīla Bhakti Vinod Ṭhākur’s corresponding Bengali composition:*\"],\"isLong\":false},{\"number\":\"1\",\"text\":[\"anādi karama-phale    paḍi’ bhavārṇava-jale\",\"    taribāre nā dekhi upāya\",\"e-viṣaya-halāhale    divā-niśi hiyā jvale\",\"    mana kabhu sukha nāhi pāya\"],\"translation\":[\"As a result of my selfish fruitive activities, which are without beginning, I have fallen into the ocean of material existence. And now I can see no means of deliverance. Day and night my heart burns from the vicious poison of these worldly affairs, and due to this my mind never finds any true happiness.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"āśā-pāśa śata śata    kleśa deya avirata\",\"    pravṛtti-ūrmira tāhe khelā\",\"kāma-krodha-ādi chhaya    bāṭapāḍe deya bhaya\",\"    avasāna haila āsi’ belā\"],\"translation\":[\"I am bound by hundreds and hundreds of desires that give unending distress, and these desires play in the waves of ever-increasing materialistic tendency. Lust, anger, greed, pride, illusion, and envy are like six highway robbers making me greatly fearful, and in this way my life is coming to an end.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"jñāna-karma ṭhaga dui    more pratāriyā la-i’\",\"    avaśeṣe phele sindhu-jale\",\"e hena samaye bandhu    tumi kṛṣṇa kṛpā-sindhu\",\"    kṛpā kari’ tola more bale\"],\"translation\":[\"The two highway robbers named intellectual knowledge and fruitive activity have cheated and misled me, and finally they have thrown me into the ocean of misery. At such a time as this, dear Kṛṣṇa, You are my only friend. You are an ocean of mercy. Please be kind upon me and uplift me from this condition of suffering by Your divine power.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"patita kiṅkare dhari’    pāda-padma-dhūli kari’\",\"    deha bhakti-vinode āśraya\",\"āmi tava nitya-dāsa    bhuliyā māyāra pāśa\",\"    baddha haye āchhi dayāmaya\"],\"translation\":[\"I am Your eternal servant, O merciful Lord. But, having forgotten this since time immemorial, I have become bound up in this network of illusion. Take this fallen servant of Yours, give him a place in the dust of Your lotus feet; give your shelter to this humble Bhakti Vinod.\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1a:[\"$\",\"$L22\",null,{\"navMap\":{\"198\":{\"prev\":{\"path\":\"/en-2026/prabhu-tava-pada-juge-mora-nivedana/\",\"title\":\"Kīrtan 4. Prabhu tava pada\"},\"next\":{\"path\":\"/en-2026/aparadha-phole-mama/\",\"title\":\"Kīrtan 6. Aparādha-phole mama\"}}}}]\n23:Tcf0,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"alternateName\":[\"Kirtan Guide\",\"Vaishnava Songbook\"],\"description\":\"A digital
