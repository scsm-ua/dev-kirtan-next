",\"tribhuvana-bhavana-nidhāna jaya jaya deva hare\"],\"translation\":[\"O Lord Your eyes are like lotus petals, and You destroy the bondage of the material world. You are the maintainer of the three worlds. Glories to Lord Hari!\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"janaka-sutā-kṛta-bhūṣaṇa jita-dūṣaṇa he\",\"samara-śam-ita-daśa-kaṇṭha jaya jaya deva hare\"],\"translation\":[\"O Lord, You are adorned by Sītā, the daughter of Janaka, You were victorious over the demon Dūṣaṇa and all the asuras, and You smashed the greatest asura, the ten-headed Rāvaṇa. Glories, glories, to Lord Hari!\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"abhinava-jaladhara-sundara dhṛta-mandara he\",\"śrī-mukha-chandra-chakora jaya jaya deva hare\"],\"translation\":[\"O Supreme Personality of Godhead who held Govardhan Hill! Your complexion is like a fresh monsoon cloud, and Śrī Rādhārāṇī is like a chakora bird who is nourished by drinking the light of Your moonlike face. Glories! Glories to Lord Hari.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"tava charaṇe praṇatā vayam iti bhāvaya he\",\"kuru kuśalaṁ praṇateṣu jaya jaya deva hare\"],\"translation\":[\"O Lord, I offer my humble obeisances at Your lotus feet. Please bless me by Your limitless mercy. Glories! Glories to Lord Śrī Hari!\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"śrī-jayadeva-kaver idaṁ kurute mudaṁ he\",\"maṅgalam ujjvala-gīti jaya jaya deva hare\"],\"translation\":[\"The poet Śrī Jayadeva offers this song of devotion and shining good fortune to Thee. All glories! All glories to Lord Śrī Hari!\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"17:[\"$\",\"$L1e\",null,{\"navMap\":{\"263/2\":{\"prev\":{\"path\":\"/en-2026/jaya-yashoda-nandana-krishna-gopala-govinda/\",\"title\":\"Jaya Yaśodā Nandana Kṛṣṇa\"},\"next\":{\"path\":\"/en-2026/nava-nirada-nindita/\",\
