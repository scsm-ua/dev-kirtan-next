on\":{\"title\":\"Kirtan Guide\",\"subtitle\":\"London, Twelfth Edition, 2026\",\"slug\":\"en-2026\",\"hidden\":true,\"songsCount\":195},\"href\":\"/en-2026/samsara-davanala-lidha-loka/\",\"isActive\":true}]\n3e:[\"$\",\"$L48\",null,{\"bookId\":\"en-2026\",\"telegraphUrl\":null}]\n3f:[\"$\",\"section\",null,{\"className\":\"SongHeader\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"SongHeader__title\",\"children\":[[\"$\",\"div\",\"Śrī Gurvāṣṭakam\",{\"children\":\"Śrī Gurvāṣṭakam\"}]]}],null,[],[[\"$\",\"div\",\"Sanskrit composition by Śrīla Viśvanāth Chakravartī Ṭhākur\",{\"className\":\"SongHeader__author\",\"children\":[\"$\",\"a\",null,{\"href\":\"/en-2026/authors#section-Śrīla Viśvanāth Chakravartī Ṭhākur\",\"children\":\"Sanskrit composition by Śrīla Viśvanāth Chakravartī Ṭhākur\"}]}]]]}]\n"])</script><script>self.__next_f.push([1,"40:[\"$\",\"$L49\",null,{\"bookId\":\"en-2026\",\"label\":\"Show verses / translation\",\"song\":{\"meta\":{\"page\":56,\"author\":\"Śrīla Viśvanāth Chakravartī Ṭhākur\",\"first_line\":\"saṁsāra-dāvānala-līḍha-loka\"},\"title\":[\"Śrī Gurvāṣṭakam\"],\"author\":[\"Sanskrit composition by Śrīla Viśvanāth Chakravartī Ṭhākur\"],\"verses\":[{\"number\":\"1\",\"text\":[\"saṁsāra-dāvānala-līḍha-loka-\",\"trāṇāya kāruṇya-ghanāghanatvam\",\"prāptasya kalyāṇa-guṇārṇavasya\",\"vande guroḥ śrī-charaṇāravindam\"],\"translation\":[\"I worship the lotus feet of the Divine Master, who is the ocean of auspicious qualities. Just to deliver all planes of life that are suffering in the forest fire of material existence, he, as the rain-cloud of mercy, showers down the waters of compassion.\"]},{\"number\":\"2\",\"text\":[\"mahāprabhoḥ kīrtana-nṛtya-gīta-\",\"vāditra-mādyan manaso rasena\",\"romāñcha-kampāśru-taraṅga-bhājo\",\"vande guroḥ śrī-charaṇāravindam\"],\"translation\":[\"I worship the lotus feet of the Divine Master, whose heart is maddened in nectarean love for Śrīman Mahāprabhu by the grand congregational chanting of the Holy Name. Dancing, singing, and playing the khol and karatāls, etc., His body thrills with joy, trembles, and waves of tears flow from his eyes.\"]},{\"number\":\"3\",\"text\":[\"śrī-vigrahārādhana-nitya-nānā-\",\"śṛṅgāra-tan-mandira-mārjanādau\",\"yuktasya bhaktāṁś cha niyuñjato ’pi\",\"vande guroḥ śrī-charaṇāravindam\"],\"translation\":[\"I worship the lotus feet of the Divine Master, who personally engages in many types of worshipful services such as dressing the deity and cleansing the Lord’s holy temple, and similarly engages the devotees (in his retinue).\"]},{\"number\":\"4\",\"text\":[\"chatur-vidha-śrī-bhagavat-prasāda-\",\"svādv-anna-tṛptān hari-bhakta-saṅghān\",\"kṛtvaiva tṛptiṁ bhajataḥ sadaiva\",\"vande guroḥ śrī-charaṇāravindam\"],\"translation\":[\"I worship the lotus feet of the Divine Master, who fully satisfies the devotees of Śrī Kṛṣṇa with four types of nectarean prasādam foodstuffs that are chewed, sucked, licked, and drunk (that is, he brings about the eradication of mundanity and the awakening of the joy of love that develops from respecting prasādam), and he is thereby himself satisfied.\"]},{\"number\":\"5\",\"text\":[\"śrī-rādhikā-mādhavayor apāra-\",\"mādhurya-līlā-guṇa-rūpa-nāmnām\",\"prati-kṣaṇāsvādana-lolupasya\",\"vande guroḥ śrī-charaṇāravindam\"],\"translation\":[\"I worship the lotus feet of the Divine Master, whose heart is insatiably desirous of tasting the infinite Holy Names, Forms, Qualities, and Pastimes of Śrī Rādhā-Mādhava that are full of the sweetness of love divine.\"]},{\"number\":\"6\",\"text\":[\"nikuñja-yūno rati-keli-siddhyair\",\"yā yālibhir yuktir apekṣaṇīyā\",\"tatrāti-dākṣyād ati-vallabhasya\",\"vande guroḥ śrī-charaṇāravindam\"],\"translation\":[\"I worship the lotus feet of the Divine Master, who is extremely dear to the Supreme Divine Couple who sport in the groves of Vraja, because he is greatly expert in those particular engagements that are performed by the sakhīs in order to serve the amorous Pastimes of the Divine Couple.\"]},{\"number\":\"7\",\"text\":[\"sākṣād dharitvena samasta-śāstrair\",\"uktas tathā bhāvyata eva sadbhiḥ\",\"kintu prabhor yaḥ priya eva tasya\",\"vande guroḥ śrī-charaṇāravindam\"],\"translation\":[\"I worship the lotus feet of the Divine Master (who is the simultaneously inconceivably distinct and nondistinct manifest embodiment of the Supreme Personality of Godhead): all the scriptures sing the glories of his being the direct non-different form of the Supreme Lord Śrī Hari, and the pure saints also concede this; yet, he is the most beloved of the Lord.\"]},{\"number\":\"8\",\"text\":[\"yasya prasādād bhagavat-prasādo\",\"yasyāprasādān na gatiḥ kuto ’pi\",\"dhyāyaṁ stuvaṁs tasya yaśas tri-sandhyaṁ\",\"vande guroḥ śrī-charaṇaravindam\"],\"translation\":[\"I worship the lotus feet of the Divine Master, ever singing his glories and meditating upon him at the three junctions of the day. By his grace alone one gains the grace of the Lord, and if he is displeased, the soul has no shelter anywhere.\"]},{\"number\":\"9\",\"text\":[\"śrīmad guror aṣṭakam etad uchchair\",\"brāhme muhūrte paṭhati prayātnāt\",\"yas tena vṛndāvana-nātha-sākṣāt\",\"sevaiva labhyā januṣo ’nta eva\"],\"translation\":[\"One who, during the Brāhma-muhūrta (ninty-six minutes before sunrise) with meticulous regularity wholeheartedly sings these eight prayers to the Divine Master, attains, upon leaving the body, the qualification to engage in the direct service of the Lord of Vṛndāvan.\"]}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.K. Ashram Maharaj\",\"ru\":\"Шрила Б.К. Ашрам Махарадж\",\"ua\":\"Шріла Б.К. Ашрам Махарадж\"},\"embed_url\":\"https://soundcloud.com/scsmathcolombia/8-sri-sri-gurvvastakam\"},{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-samsara-davanala\"},{\"title\":{\"en\":\"Bhakti Lalita Devi\",\"ru\":\"Бхакти Лалита Деви\",\"ua\":\"Бгакті Лаліта Деві\"},\"embed_url\":\"https://soundcloud.com/bhakti-lalita-devi/bhakti-lalita-devi-sri-sri-gurvvashtakam-samsara-davanala-lidha-loka\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"41:[\"$\",\"$L4a\",null,{\"audio\":\"$40:props:song:resources:audio\",\"language\":\"en\"}]\n42:[\"$\",\"$L4b\",null,{\"navMap\":{\"56\":{\"prev\":{\"path\":\"/en-2026/jiv-jago-jiv-jago-gaurachanda-bole/\",\"title\":\"Aruṇodaya-kīrtan – Part Two\"},\"next\":{\"path\":\"/en-2026/shri-krishna-chaitanya-prabhu-jive-daya-kori/\",\"title\":\"Invocation to the book Śaraṇāgati\"}}}}]\n4c:Ta64,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"CollectionPage\",\"@id\":\"https://dev.kirtan.site/en-2026/samsara-davanala-lidha-loka\",\"url\":\"https://dev.kirtan.site/en-2026/samsara-davanala-lidha-loka\",\"name\":\"Śrī Gurvāṣṭakam. Sanskrit composition by Śrīla Viśvanāth Chakravartī Ṭhākur\",\"inLanguage\":\"en\",\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"}},{\"@type\":\"MusicComposition\",\"@id\":\"https://dev.kirtan.site/en-2026/samsara-davanala-lidha-loka#composition\",\"alternateName\":[\"saṁsāra-dāvānala-līḍha-loka\"],\"name\":\"Śrī Gurvāṣṭakam. Sanskrit composition by Śrīla Viśvanāth Chakravartī Ṭhākur\",\"url\":\"https://dev.kirtan.site/en-2026/samsara-davanala-lidha-loka\",\"composer\":{\"@type\":\"Person\",\"name\":\"Śrīla Viśvanāth Chakravartī Ṭhākur\"},\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"},\"about\":[{\"@type\":\"Thing\",\"name\":\"Bhakti Yoga\"},{\"@type\":\"Thing\",\"name\":\"Gaudiya Vaishnavism\"}],\"genre\":[\"Devotional\",\"Bhajan\",\"Kirtan\"],\"mainEntityOfPage\":{\"@id\":\"https://dev.kirtan.site/en-2026/samsara-davanala-lidha-loka\"},\"audio\":[{\"@type\":\"MusicRecording\",\"name\":\"Śrī Gurvāṣṭakam. Sanskrit composition by Śrīla Viśvanāth Chakravartī Ṭhākur\",\"url\":\"https://soundcloud.com/
