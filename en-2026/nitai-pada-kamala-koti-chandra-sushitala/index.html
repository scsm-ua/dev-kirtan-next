̐hāra sevaka nitya\",\"    nitāi-pada sadā kara āśa\",\"narottama baḍa duḥkhī    nitāi more kara sukhī\",\"    rākha rāṅgā-charaṇera pāśa\"],\"translation\":[\"The lotus feet of Nitāi are truth, His servitors are eternal – ever aspire for the shelter of His feet. Narottam is very sad – O Nitāi make me happy – please keep me at Your lovely lotus feet!\"]}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-nitai-pada\"},{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-nitai-pada-1\"},{\"title\":{\"en\":\"Srila B.N. Acharya Maharaj\",\"ru\":\"Шрила Б.Н. Ачарья Махарадж\",\"ua\":\"Шріла Б.Н. Ачарʼя Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/acharya-maharaj-nitay-pada\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"41:[\"$\",\"$L4a\",null,{\"audio\":\"$40:props:song:resources:audio\",\"language\":\"en\"}]\n42:[\"$\",\"$L4b\",null,{\"navMap\":{\"123\":{\"prev\":{\"path\":\"/en-2026/nadiya-godrume-nityananda-mahajana/\",\"title\":\"Ājñā Ṭahal\"},\"next\":{\"path\":\"/en-2026/dhana-mora-nityananda-pati-mora/\",\"title\":\"Sva-niṣṭha\"}}}}]\n4c:Taa9,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"CollectionPage\",\"@id\":\"https://dev.kirtan.site/en-2026/nitai-pada-kamala-koti-chandra-sushitala\",\"url\":\"https://dev.kirtan.site/en-2026/nitai-pada-kamala-koti-chandra-sushitala\",\"name\":\"Manaḥ Śikṣā. by Śrīla Narottam Dās Ṭhākur\",\"inLanguage\":\"en\",\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#websit
