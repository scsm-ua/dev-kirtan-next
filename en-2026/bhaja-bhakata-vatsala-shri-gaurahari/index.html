rāj, Kṛṣṇa, the holder of Govardhan Hill, sits down, and then all the cowherd boys, along with Kṛṣṇa’s elder brother, Śrī Baladeva, sit down in rows to take their lunch.\"]},{\"number\":\"4\",\"text\":[\"śuktā-śākādi bhāji nālitā kuṣmāṇḍa\",\"ḍāli ḍālnā dugdha-tumbī dadhi mochā-ghaṇṭa\"],\"translation\":[\"They are then served a feast of śuktā and various kinds of green leafy vegetables, then nice fried things, and a salad made of the green leaves of the jute plant. They are also served pumpkin, baskets of fruit, small square cakes made of lentils and cooked down milk, followed by thick yogurt, squash cooked in milk, and vegetable preparations made from the flower of the banana tree.\"]},{\"number\":\"5\",\"text\":[\"mudga-baḍā māṣa-baḍā roṭikā ghṛtānna\",\"śaṣkulī piṣṭaka kṣīr puli pāyasānna\"],\"translation\":[\"Then they receive fried squares of mung dal patties and urad dal patties, chapātīs, and rice with ghee. Next, sweets made with milk, sugar, and sesamum; rice flour cakes; thick cooked-down milk; cakes floating in milk; and sweet rice.\"]},{\"number\":\"6\",\"text\":[\"karpūra amṛta-kelī rambhā kṣīra-sāra\",\"amṛta rasālā, amla dvādaśa prakāra\"],\"translation\":[\"There is also sweet rice that tastes just like nectar due to its being mixed with camphor. There are bananas, and condensed milk which is nectarean and delicious. They are also served twelve kinds of sour preparations made with tamarinds, limes, lemons, oranges, and pomegranates.\"]},{\"number\":\"7\",\"text\":[\"luchi chini sarapurī lāḍḍu rasāvalī\",\"bhojana karena kṛṣṇa haye kutūhalī\"],\"translation\":[\"There are purīs made with white flour and sugar; purīs filled with cream; laḍḍus; and dal patties boiled in sugared rice. Kṛṣṇa eagerly eats all of the food.\"]},{\"number\":\"8\",\"text\":[\"rādhikāra pakka anna vividha vyañjana\",\"parama ānande kṛṣṇa karena bhojana\"],\"translation\":[\"In great ecstasy and joy Kṛṣṇa eats the rice, curried vegetables, sweets, and pastries cooked by Śrīmatī Rādhārāṇī.\"]},{\"number\":\"9\",\"text\":[\"chhale-bale lāḍḍu khāya śrī-madhumaṅgala\",\"bagala bājāya āra deya haribola\"],\"translation\":[\"Kṛṣṇa’s funny brāhmaṇa friend Madhumaṅgal, who is very fond of laḍḍus, gets them by hook or by crook. Eating the laḍḍus he shouts, “Haribol! Haribol!” and makes a funny sound by slapping his sides under his armpits with his hands.\"]},{\"number\":\"10\",\"text\":[\"rādhikādi gaṇe heri’ nayanera koṇe\",\"tṛpta haye khāya kṛṣṇa yaśodā-bhavane\"],\"translation\":[\"Beholding Rādhārāṇī and Her gopī friends out of the corners of His eyes, Kṛṣṇa eats at the house of Mother Yaśodā with great satisfaction.\"]},{\"number\":\"11\",\"text\":[\"bhojanānte piye kṛṣṇa suvāsita vāri\",\"sabe mukha prakṣālaya haye sāri sāri\"],\"translation\":[\"After lunch, Kṛṣṇa drinks rose-scented water. Then all of the boys, standing in lines, wash their mouths.\"]},{\"number\":\"12\",\"text\":[\"hasta-mukha prakṣāliyā yata sakhā-gaṇe\",\"ānande viśrāma kare baladeva-sane\"],\"translation\":[\"After all the cowherd boys wash their hands and mouths, in great bliss they take rest with Lord Balarām.\"]},{\"number\":\"13\",\"text\":[\"jambula rasāla āne tāmbula-maśālā\",\"tāhā kheye kṛṣṇachandra sukhe nidrā gelā\"],\"translation\":[\"The two cowherd boys Jāmbula and Rasāla then bring Kṛṣṇa pān made with betel nuts, fancy spices, and catechu. After eating that pān, Śrī Kṛṣṇachandra then happily goes to sleep.\"]},{\"number\":\"14\",\"text\":[\"viśālākṣa śikhi-puchchha chāmara ḍhulāya\",\"apūrva śayyāya kṛṣṇa sukhe nidrā yāya\"],\"translation\":[\"While Kṛṣṇa happily takes His rest on an excellent bedstead, His servant Viśālākṣa cools Him with a fan of peacock feathers.\"]},{\"number\":\"15\",\"text\":[\"yaśomatī-ājñā peye dhaniṣṭhā-ānīta\",\"śrī-kṛṣṇa-prasāda rādhā bhuñje haye prīta\"],\"translation\":[\"At Mother Yaśodā’s request the gopī Dhaniṣṭhā brings remnants of food left on Kṛṣṇa’s plate to Śrīmatī Rādhārāṇī, who eats them with great delight.\"]},{\"number\":\"16\",\"text\":[\"lalitādi sakhī-gaṇa avaśeṣa pāya\",\"mane mane sukhe rādhā-kṛṣṇa-guṇa gāya\"],\"translation\":[\"Lalitā Devī and the other gopīs then receive the remnants, and within their hearts they sing the glories of Rādhārāṇī and Kṛṣṇa with great joy.\"]},{\"number\":\"17\",\"text\":[\"hari-līlā eka-mātra yāhāra pramoda\",\"bhogārati gāya ṭhākur bhakati-vinoda\"],\"translation\":[\"Ṭhākur Bhakti Vinod, whose one and only joy is the Pastimes of Lord Hari, sings this Bhoga Ārati song.\"]},{\"text\":[\"(bhaja govinda govinda gopāla)\",\"(giridhārī gopīnātha nanda-dulāla)\",\"(bhaja govinda govinda gopāla)\",\"(nanda-dulāla jaya jaya śachī-dulāla)\",\"(śachī-dulāla jaya jaya gaura gopāla)\"],\"translation\":[\"(Serve Govinda, serve Gopāl. Serve Giridhārī, Gopīnāth, Nanda Dulāl. Serve Govinda, serve Gopāl. All glories to Nanda’s son! All glories to Śachī’s son! All glories to golden Gopāl!)\"]}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-sri-bhoga\"},{\"title\":{\"en\":\"Nabadwip temple\",\"ru\":\"Навадвипский храм\",\"ua\":\"Навадвіпський храм\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/navadwip-scsm-bhaja-bhakata\"},{\"title\":{\"en\":\"Caracas temple\",\"ru\":\"Храм г.Каракас\",\"ua\":\"Храм м.Каракас\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/shchsm-karakas-bxadzha-bxakata\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"3f:[\"$\",\"$L48\",null,{\"audio\":\"$3e:props:song:resources:audio\",\"language\":\"en\"}]\n40:[\"$\",\"$L49\",null,{\"navMap\":{\"66\":{\"prev\":{\"path\":\"/en-2026/hari-haraye-namah-krishna-yadavaya-namah/\",\"title\":\"Nāma-saṅkīrtan\"},\"next\":{\"path\":\"/en-2026/mahaprasade-govinde-nama-b
