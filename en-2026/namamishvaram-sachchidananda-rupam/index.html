osition by Satyavrata Muni in Śrī Padma-purāṇa\"}]]}]]}]]]}]]\n"])</script><script>self.__next_f.push([1,"1b:[\"$\",\"$L24\",null,{\"bookId\":\"en-2026\",\"label\":\"Show verses / translation\",\"song\":{\"meta\":{\"page\":272,\"author\":\"Satyavrata Muni\",\"first_line\":\"namāmīśvaraṁ sachchidānanda-rūpaṁ\"},\"title\":[\"Śrī Śrī Dāmodarāṣṭakam\"],\"author\":[\"Sanskrit composition by Satyavrata Muni in Śrī Padma-purāṇa\"],\"verses\":[{\"number\":\"1\",\"text\":[\"namāmīśvaraṁ sachchidānanda-rūpaṁ\",\"lasat-kuṇḍalaṁ gokule bhrājamānam\",\"yaśodā-bhiyolūkhalād dhāvamānaṁ\",\"parāmṛṣṭam atyantato drutya gopyā\"],\"translation\":[\"To the Supreme Lord, whose form is the embodiment of eternal existence, knowledge, and bliss, whose shark-shaped earrings are swinging to and fro, who is beautifully shining in the divine realm of Gokul, who (due to the offence of breaking the pot of yoghurt that his mother was churning into butter and then stealing the butter that was kept hanging from a swing) is quickly running from the wooden grinding mortar in fear of Mother Yaśodā, but who has been caught from behind by her, who ran after Him with greater speed – to that Supreme Lord, Śrī Dāmodar, I offer my humble obeisances.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"rudantaṁ muhur netra-yugmaṁ mṛjantaṁ\",\"karāmbhoja-yugmena sātaṅka-netram\",\"muhuḥ śvāsa-kampa-trirekhāṅka-kaṇṭha-\",\"sthita-graiva-dāmodaraṁ bhakti-baddham\"],\"translation\":[\"(Seeing the whipping stick in His mother’s hand,) He is crying and rubbing His eyes again and again with His two lotus hands. His eyes are filled with fear, and the necklace of pearls around His neck, which is marked with three lines like a conchshell, is shaking because of His quick breathing due to crying. To this Supreme Lord, Śrī Dāmodar, whose belly is bound not with ropes but with His mother’s pure love, I offer my humble obeisances.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"itīdṛk svalīlābhir ānanda-kuṇḍe\",\"svaghoṣaṁ nimajjantam ākhyāpayantaṁ\",\"tadīyeṣita-jñeṣu bhaktair jitatvaṁ\",\"punaḥ prematas taṁ śatāvṛtti vande\"],\"translation\":[\"By such childhood Pastimes as this He is drowning the inhabitants of Gokul in pools of ecstasy, and is revealing to those devotees who are absorbed in knowledge of His supreme majesty and opulence that He is only conquered by devotees whose pure love is imbued with intimacy and is free from all conceptions of awe and reverence. With great love I again offer my obeisances to Lord Dāmodar hundreds and hundreds of times.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"varaṁ deva mokṣaṁ na mokṣāvadhiṁ vā\",\"na chānyaṁ vṛṇe ’haṁ vareśād apīha\",\"idan te vapur nātha gopāla-bālaṁ\",\"sadā me manasy āvirāstāṁ kim anyaiḥ\"],\"translation\":[\"O Lord, although You are able to give all kinds of benedictions, I do not pray to You for the boon of impersonal liberation, nor the highest liberation of eternal life in Vaikuṇṭha, nor any other boon (which may be obtained by executing the nine processes of bhakti). O Lord, I simply wish that this form of Yours as Bāla Gopāl in Vṛndāvan may ever be manifest in my heart, for what is the use to me of any other boon besides this?\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"idan te mukhāmbhojam avyakta-nīlair\",\"vṛtaṁ kuntalaiḥ snigdha-raktaiś cha gopyā\",\"muhuś chumbitaṁ bimba-raktādharaṁ me\",\"manasy āvirāstām alaṁ lakṣa-lābhaiḥ\"],\"translation\":[\"O Lord, Your lotus face, which is encircled by locks of soft black hair tinged with red, is kissed again and again by Mother Yaśoda, and Your lips are reddish like the bimba fruit. May this beautiful vision of Your lotus face be ever manifest in my heart. Thousands and thousands of other benedictions are of no use to me.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"namo deva dāmodarānanta viṣṇo\",\"prasīda prabho duḥkha-jālābdhi-magnaṁ\",\"kṛpā-dṛṣṭi-vṛṣṭyātidīnaṁ batānu-\",\"gṛhāṇeśa mām ajñam edhy akṣi-dṛśyaḥ\"],\"translation\":[\"O Supreme Godhead, I offer my obeisances unto You. O Dāmodar! O Ananta! O Viṣṇu! O Master! O my Lord, be pleased with me. By showering Your glance of mercy upon me, deliver this poor ignorant fool who is immersed in an ocean of worldly sorrows, and become visible to my eyes.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"kuverātmajau baddha-mūrtyaiva yadvat\",\"tvayā mochitau bhakti-bhājau kṛtau cha\",\"tathā prema-bhaktiṁ svakāṁ me prayachchha\",\"na mokṣe graho me ’sti dāmodareha\"],\"translation\":[\"O Lord Dāmodar, just as the two sons of Kuvera – Maṇigrīva and Nalakīśvara – were delivered from the curse of Nārada and made into great devotees by You in Your form as a baby tied with rope to a wooden grinding mortar, in the same way, please give to me Your own prema-bhakti. I only long for this and have no desire for any kind of liberation.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"namas te ’stu dāmne sphurad-dīpti-dhāmne\",\"tvadīyodarāyātha viśvasya dhāmne\",\"namo rādhikāyai tvadīya-priyāyai\",\"namo ’nanta-līlāya devāya tubhyam\"],\"translation\":[\"O Lord Dāmodar, I first of all offer my obeisances to the brilliantly effulgent rope which binds Your belly. I then offer my obeisances to Your belly, which is the abode of the entire universe. I humbly bow down to Your most beloved Śrīmatī Rādhārāṇī, and I offer all obeisances to You, the Supreme Lord, who displays unlimited Pastimes.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-sri-sri-1\"},{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/bharatimaharaj/govinda-maharaj-damodarastakam\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"$L25\",null,{\"audio\":\"$1b:props:song:resources:audio\",\"caption\":\"Listen audio:\",\"language\":\"en\"}]\n1d:[\"$\",\"$L26\",null,{\"navMap\":{\"272\":{\"prev\":{\"path\":\"/en-2026/he-deva-bhavantam-vande/\",\"title\":\"Śrī Kṛṣṇa-vandanā\"},\"next\":{\"path\":\"/en-2026/amara-samana-hina-nahi-e-samsare/\",\"title\":\"Āmāra Samāna Hīna Nāhi\"}}}}]\n27:Tfda,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://scsmath.com/#organization\",\"name\":\"Sri Chaitanya Saraswat Math\",\"url\":\"https://scsmath.com/\"},{\"@type\":\"WebSite\",\"@id\":\"https://dev.kirtan.site/#website\",\"url\":\"https://dev.kirtan.site/\",\"name\":\"Kirtan Site\",\"description\":\"A digital Vaishnava songbook with lyrics, translations, and audio recordings.\",\"publisher\":{\"@id\":\"https://scsmath.com/#organization\"}},{\"@type\":\"WebPage\",\"@id\":\"https://dev.kirtan.site/en-2026/namamishvaram-sachchidananda-rupam/\",\"url\":\"https://dev.kirtan.site/en-2026/namamishvaram-sachchidananda-rupam/\",\"name\":\"Śrī Śrī Dāmodarāṣṭakam. Sanskrit composition by Satyavrata Muni in Śrī Padma-purāṇa\",\"inLanguage\":\"en\",\"description\":\"Śrī Śrī Dāmodarāṣṭakam — a Vaiṣṇava song by Satyavrata Muni with lyrics, English translation and word-by-word meaning. From Kirtan Guide.\",\"breadcrumb\":{\"@id\":\"https://dev.kirtan.site/en-2026/namamishvaram-sachchidananda-rupam/#breadcrumb\"},\"mainEntity\":{\"@id\":\"https://dev.kirtan.site/en-2026/namamishvaram-sachchidananda-rupam/#composition\"},\"isPartOf\":{\"@id\":\"https://dev.kirtan.site/#website\"}},{\"@type\":\"BreadcrumbList\",\"@id\":\"https://dev.kirtan.site/en-2026/namamishvaram-sachchidananda-rupam/#breadcrumb\",\"itemListElement\":[{\"@type\":\"ListItem\",\"position\":1,\"name\":\"Kirtan Guide\",\"item\":\"https://
