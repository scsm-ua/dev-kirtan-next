":[false,\"Śrīla Raghunāth Dās Goswāmī Śochaka\"]}]]}]]}],null,[[\"$\",\"div\",\"0\",{\"className\":\"SongHeader__subtitle\",\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[false,\"Śrīla Raghunāth Dās’ Deep Sorrow\"]}]]}],[\"$\",\"div\",\"1\",{\"className\":\"SongHeader__subtitle\",\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[false,\"Kīrtan Two\"]}]]}]],[[\"$\",\"div\",\"0\",{\"className\":\"SongHeader__author\",\"children\":[[\"$\",\"$1\",\"0\",{\"children\":[false,[\"$\",\"a\",null,{\"href\":\"/en-2026/authors/\",\"rel\":\"author\",\"children\":\"unknown composer, from the Maṭh’s Śrī Gauḍīya Gitāñjali\"}]]}]]}]]]}]]]}],[[\"$\",\"$L19\",null,{\"bookId\":\"en-2026\",\"label\":\"Show verses / translation\",\"song\":{\"meta\":{\"page\":291,\"no-author\":1,\"first_line\":\"śrī-chaitanya-kṛpā haite raghunātha-dāsa-chitte\"},\"title\":[\"Śrīla Raghunāth Dās Goswāmī Śochaka\"],\"author\":[\"unknown composer, from the Maṭh’s Śrī Gauḍīya Gitāñjali\"],\"subtitle\":[\"Śrīla Raghunāth Dās’ Deep Sorrow\",\"\",\"Kīrtan Two\"],\"verses\":[{\"number\":\"1\",\"text\":[\"śrī-chaitanya-kṛpā haite    raghunātha-dāsa-chitte\",\"    parama vairāgya upajila\",\"kalatra gṛha sampada    nija-rājya-adhipada\",\"    mala-prāya sakala tyajila\"],\"translation\":[\"By the mercy of Śrī Chaitanya, extreme detachment arose in the mind of Raghunāth Dās. Wife, home, wealth, proprietorship of his estate – he left all of this as though it were stool.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"puraścharyā kṛṣṇa-nāme    giyā se puruṣottame\",\"    gaurāṅgera pada-yuga seve\",\"ei mane abhilāṣa    punaḥ raghunātha dasa\",\"    nayana-gochara habe kabe\"],\"translation\":[\"After completing his preparatory duties with the chanting of Kṛṣṇa’s Name, he went to Śrī Puruṣottam Kṣetra and served the feet of Śrī Gaurāṅga. My heart longs, “When will I see Raghunāth Dās again?”\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"gauraṅga doyālu haiyā    rādhā-kṛṣṇa mantra diyā\",\"    govardhana-śilā guñjā-hāre\",\"vraja-vane govardhane    śrī-rādhāra śrī-charaṇe\",\"    samarpaṇa karila yāhāre\"],\"translation\":[\"Śrī Gaurāṅga mercifully gave him the Rādhā-Kṛṣṇa mantra, a Govardhan-śilā, and a guñja-mālā. He thus offered him to the divine feet of Śrī Rādhā at Govardhan in Vṛndāvan.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"gaurāṅgera agochare    nija-keśa chhi̐ḍi kare\",\"    virahe vyākula vraje gelā\",\"deha-tyāga kari’ mane    gelā giri-govardhane\",\"    du-go̐sāi tāhāre rākhilā\"],\"translation\":[\"After the disappearance of Śrī Gaurāṅga, Raghunāth Dās began to pull out his hair, and overcome with separation, he went to Vraja. Intending to give up his body, he went to Govardhan Hill, but two goswāmīs saved him.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"dhari rūpa-sanātana    rākhila tā̐ra jīvana\",\"    deha-tyāga karite nā dilā\",\"dui go̐sāira ājñā peye    rādhā-kuṇḍera taṭe giyā\",\"    niyama kariyā vāsa kailā\"],\"translation\":[\"Rūpa and Sanātan received him and saved his life. They did not allow him to give up his body. Receiving instructions from these two goswāmīs, Raghunāth went to the bank of Rādhā Kuṇḍa and lived there strictly observing various vows.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"chhi̐ḍā vastra paridhana    vraja-phala-gavya pāna\",\"    anna ādi nā kare āhāra\",\"tina sandhyā snānāchāri    smaraṇa kīrtana kari’\",\"    rādhā-pada bhajana yāhāra\"],\"translation\":[\"He wore torn cloth and ate only the fruits and milk products found in Vraja. He did not eat rice or other grains. He bathed at the three junctions of the day, engaged in remembrance and chanting, and served the feet of Śrī Rādhā.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"ṣāṭ daṇḍa rātri dine    rādhā-kṛṣṇa-līlā-gāne\",\"    smaraṇete sadāi go̐yāya\",\"chāri daṇḍa śuye thāke    svapne rādhā-kṛṣṇa dekhe\",\"    tilārdheka vyartha nāhi yāya\"],\"translation\":[\"Night and day, twenty-four hours a day, he would sing about the Pastimes of Rādhā and Kṛṣṇa and constantly engage in remembrance of Them. He lay down for an hour and a half each day, but in his dreams he saw Rādhā and Kṛṣṇa. He never wasted a single moment.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"chaitanyera padāmbuje    rākhe manobhṛṅga-rāje\",\"    svarūpera sadāi āśrāya\",\"bhinna-deha rūpa-sane    gati yā̐ra sanātane\",\"    bhaṭṭa go̐sāyera priya mahāśaya\"],\"translation\":[\"He would fix the bumble bee of his mind on the lotus feet of Śrī Chaitanya. He remained always in the shelter of Svarūp Dāmodar. He was always with Śrī Rūpa, and Sanātan was his shelter. He was dear to Raghunāth Bhaṭṭa Goswāmī and Gopāl Bhaṭṭa Goswāmī.\"],\"isLong\":false},{\"number\":\"9\",\"text\":[\"śrī-rūpera gaṇa yata    yā̐hāra pade āśrita\",\"    atyanta vātsalya yā̐ra jīve\",\"sei ārta-nāda kari’    kā̐di’ bale, “hari hari\",\"    prabhura karuṇā habe kabe”\"],\"translation\":[\"Sheltered at the feet of all the followers of Śrī Rūpa, who are most affectionate to all souls, he would piteously cry out, “O Lord! O Lord! When will I receive my Lord’s mercy?”\"],\"isLong\":false},{\"number\":\"10\",\"text\":[\"he rādhikāra vallabha    gāndharvikāra bāndhava\",\"    rādhikā-ramaṇa rādhānātha\",\"he he vṛndāvaneśvara    hā hā kṛṣṇa dāmodara\",\"    kṛpā kari’ kara ātmasātha\"],\"translation\":[\"“O Beloved of Rādhikā! O Friend of Gāndharvikā! O Delight of Rādhikā! O Lord of Rādhā! O Lord of Vṛndāvan! O Kṛṣṇa! O Dāmodar! Please mercifully accept me.”\"],\"isLong\":false},{\"number\":\"11\",\"text\":[\"prabhu rūpa sanātana    tina hailā adarśana\",\"    andha haila e dui nayana\",\"vṛthā ā̐khi kāhā̐ dekhi    vṛthā dehe prāṇa rākhi\",\"    sevāchāra bāḍāya dviguṇa\"],\"translation\":[\"When the Lord (Śrī Chaitanya), Śrī Rūpa, and Śrī Sanātan had disappeared, his two eyes became blind. “What can I see with these useless eyes? I just maintain my life in this useless body.” This was his feeling, yet his engagement in service doubled.\"],\"isLong\":false},{\"number\":\"12\",\"text\":[\"śrī-kṛṣṇa śrī-śachī-suta    tāra guṇa yata yata\",\"    avatāra śrī-vigraha nāma\",\"gupta vyakta līlā-sthāna    dṛṣṭa śruta vaiṣṇava-gaṇa\",\"    sabhākāre karaye praṇāma\"],\"translation\":[\"He would offer obeisances to Śrī Kṛṣṇa, the son of Śrī Śachī, all of His qualities and avatārs, His Deity, His Name, the hidden and manifest places of His Pastimes that are seen or heard about, and all the Vaiṣṇavas.\"],\"isLong\":false},{\"number\":\"13\",\"text\":[\"rādhā-kṛṣṇera viyoge    chhāḍila sakala bhoge\",\"    rūkhā śukhā anna-mātra sāra\",\"śrī-chaitanyera vichchhedete    anna chhāḍi’ sei haite\",\"    phala gavya karena āhāra\"],\"translation\":[\"In separation from Rādhā and Kṛṣṇa, Raghunāth Dās gave up all enjoyment and ate nothing but dry, stale rice. In separation from Śrī Chaitanya, he gave up rice and ate only fruits and milk products.\"],\"isLong\":false},{\"number\":\"14\",\"text\":[\"sanātanera adarśane    tāhā chhāḍi sei dine\",\"    kevala karena jala pāna\",\"rūpera vichchheda yabe    jala chhāḍi’ dila tabe\",\"    rādhā-kṛṣṇa bali’ rākhe prāṇa\"],\"translation\":[\"After the disappearance of Śrī Sanātan, he gave this up, and from that day on drank only water. When he was separated from Śrī Rūpa, he then gave up water and maintained his life simply by calling out to Rādhā and Kṛṣṇa.\"],\"isLong\":false},{\"number\":\"15\",\"text\":[\"svarūpera adarśane    nā dekhe rūpera gaṇe\",\"    virahe vikala haiyā kānde\",\"kṛṣṇa-kathālapa vine    śravaṇe nāhika śune\",\"    uchchaiḥsvare ḍāke ārta-nāde\"],\"translation\":[\"When Śrī Rūpa disappeared, and Raghunāth could not see any of Śrī Rūpa’s followers, then he sorrowfully wept in separation. Without any discussion of Kṛṣṇa, he did not listen to anything with his ears and piteously cried out aloud:\"],\"isLong\":false},{\"number\":\"16\",\"text\":[\"hā hā rādhā-kṛṣṇa kothā    kothā āchha he lalitā\",\"    he viśākhe deha daraśana\",\"hā chaitanya mahāprabhu    hā svarūpa mora prabhu\",\"    hā hā prabhu rūpa-sanātana\"],\"translation\":[\"“O Rādhā! O Kṛṣṇa! Where are You? O Lalitā, where are you? O Viśākhā! Please appear before me. O Chaitanya Mahāprabhu! O Svarūp, my master! O my masters Rūpa and Sanātan!”\"],\"isLong\":false},{\"number\":\"17\",\"text\":[\"kā̐de go̐sāi rātra-dine    puḍi’ yāya tanu-mane\",\"    virahe ha-ila jara jara\",\"manda manda jihvā naḍe    preme aśru netre paḍe\",\"    mane kṛṣṇa karaye smaraṇa\"],\"translation\":[\"Dās Goswāmī cried night and day. His mind and body burned in sepration and became frail. As his tongue moved slowly and tears of love poured from his eyes, he remembered Kṛṣṇa within his heart.\"],\"isLong\":false},{\"number\":\"18\",\"text\":[\"sei raghunātha-dāsa    pūribe manera āśa\",\"    ei mora baḍa āchhe sādha\",\"e rādhā-vallabha-dāsa    mane kare abhilāṣa\",\"    sabe more karaha prasāda\"],\"translation\":[\"“Raghunāth Dās will fulfil the desires of my heart. This is my great hope.” This Rādhā Vallabha Dās longs within his heart, “May you all bless me.”\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}],false]]}]}],\"$L1a\",\"$L1b\"]}]]}],\"$L1c\"]}],\"$L1d\",\"$L1e\",\"$L1f\"]}]]}]\n"])</script><script>self.__next_f.push([1,"20:I[4423,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-0d575d94bced837d.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"default\"]\n22:I[9181,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-0d575d94bced837d.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-76c0bdd1e924dee2.js\"],\"default\"]\n23:I[9508,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-0d575d94bced8
