 Divine Couple are my life. Advaita Āchārya is my strength. Gadādhar is my family. Narahari Sarakara is my glory.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"vaiṣṇavera pada-dhūli    tāhe mora snāna-keli\",\"    tarpaṇa mora vaiṣṇavera nāma\",\"vichāra koriyā mane    bhakti-rasa āsvādane\",\"    madhyastha śrī-bhāgavata purāṇa\"],\"translation\":[\"The dust of the devotees’ lotus feet is my bathing water. The chanting of the devotees’ names is my satisfaction. Considering the merits of all Vedic literatures in the light of devotional service, I have conclud­ed that the *Śrīmad Bhāgavatam* is the best of all scriptures.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"vaiṣṇavera uchiṣṭa    tāhe mora mano-niṣṭha\",\"    vaiṣṇavera nāmete ullāsa\",\"vṛndāvane chaturā    tāhe mora mano-gherā\",\"    kahe dīne narottama dāsa\"],\"translation\":[\"My mind is firmly convinced of the spiritual benefit obtained by eating the remnants of foodstuff left by the devotees. The names of the devotees are my happiness. The land of Vṛndāvan is the enclosure within which I keep my mind. Poor-hearted Narottam Dās speaks in this way.\"],\"isLong\":false}],\"resources\":{\"audio\":[{\"title\":{\"en\":\"Srila B.S. Govinda Dev-Goswami Maharaj\",\"ru\":\"Шрила Б.С. Говинда Дев-Госвами Махарадж\",\"ua\":\"Шріла Б.С. Ґовінда Дев-Ґосвамі Махарадж\"},\"embed_url\":\"https://soundcloud.com/kostya-netrebenko/19-dhana-mora-nityananda-7\"}]},\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"3d:[\"$\",\"$L46\",null,{\"audio\":\"$3c:props:song:resources:audio\",\"caption\":\"Listen audio:\",\"language\":\"en\"}]\n3e:[\"$\",\"$L47\",null,{\"navMap\":{\"124\":{\"prev\":{\"path\":\"/en-2026/nitai-pada-kamala-koti-chandra-sushitala/\",\"title\":\"Manaḥ Śikṣā\"},\"next\":{\"path\":\"/en-2026/nitai-gunamani-amara-nitai-gunamani/\",\"title\":\"Nitāi Guṇamaṇi Āmāra\"}}}}]\n48:T631,"])<
