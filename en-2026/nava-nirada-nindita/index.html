own composer, from the Maṭh’s Śrī Gauḍīya Gitāñjali\"],\"subtitle\":[\"[Sanskrit]\"],\"verses\":[{\"number\":\"1\",\"text\":[\"nava-nīrada-nindita-kānti-dharaṁ\",\"rasa-sāgara-nāgara-bhūpa-varam\",\"śubha-baṅkima-chāru-śikhaṇḍa-śikhaṁ\",\"bhaja kṛṣṇa-nidhiṁ vraja-rāja-sutam\"],\"translation\":[\"His lustre defames that of fresh clouds,\\\\\",\"He is the ocean of rasa, the beloved king of paramours,\\\\\",\"and His charming peacock-plume crest is pleasantly tilted\\\\\",\"(down to the left in obeisance to the feet of Śrī Rādhā).\\\\\",\"Serve the treasure Śrī Kṛṣṇa, the son of the King of Vraja.\"],\"isLong\":false},{\"number\":\"2\",\"text\":[\"bhru-viśaṅkita-vaṅkima-śakra-dhanuṁ\",\"mukha-chandra-vinindita-koṭi-vidhum\",\"mṛdu-manda-suhāsya-subhāṣya-yutaṁ\",\"bhaja kṛṣṇa-nidhiṁ vraja-rāja-sutam\"],\"translation\":[\"His arched, anxious eyebrows resemble rainbows.\\\\\",\"The moon of His face completely defames ten million moons.\\\\\",\"He is endowed with fine speech and a fine, soft, and mild smile.\\\\\",\"Serve the treasure Śrī Kṛṣṇa, the son of the King of Vraja.\"],\"isLong\":false},{\"number\":\"3\",\"text\":[\"suvikampad-anaṅga-sad-aṅga-dharaṁ\",\"vraja-vāsi-manohara-veśa-karam\",\"bhṛśa-lāñchhita-nīla-saroja-dṛśaṁ\",\"bhaja kṛṣṇa-nidhiṁ vraja-rāja-sutam\"],\"translation\":[\"His beautiful limbs tremble with divine love.\\\\\",\"His dress captivates the minds of all the residents of Vraja.\\\\\",\"His blue lotus eyes are decorated with sidelong glances.\\\\\",\"Serve the treasure Śrī Kṛṣṇa, the son of the King of Vraja.\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"alakāvali-maṇḍita-bhāla-taṭaṁ\",\"śruti-dolita-mākara-kuṇḍalakam\",\"kaṭi-veṣṭita-pīta-paṭaṁ sudhaṭaṁ\",\"bhaja kṛṣṇa-nidhiṁ vraja-rāja-sutam\"],\"translation\":[\"His forehead is adorned with curling locks.\\\\\",\"His ears are decorated swaying makara earrings.\\\\\",\"His waist is wrapped in a fine yellow dhoti.\\\\\",\"Serve the treasure Śrī Kṛṣṇa, the son of the King of Vraja.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"kala-nūpura-rājita-chāru-padaṁ\",\"maṇi-rañjita-gañjita-bhṛṅga-madam\",\"dhvaja-vajra-jhaṣāṅkita-pāda-yugaṁ\",\"bhaja kṛṣṇa-nidhiṁ vraja-rāja-sutam\"],\"translation\":[\"His charming feet, resplendent with tinkling anklets,\\\\\",\"are illumined by jewels, and are intoxicating to buzzing bees.\\\\\",\"His feet are marked with flag, thunderbolt, and fish.\\\\\",\"Serve the treasure Śrī Kṛṣṇa, the son of the King of Vraja.\"],\"isLong\":false},{\"number\":\"6\",\"text\":[\"bhṛśa-chandana-charchita-chāru-tanuṁ\",\"maṇi-kaustubha-garhita-bhānu-tanum\",\"vraja-bāla-śiromaṇi-rūpa-dhṛtaṁ\",\"bhaja kṛṣṇa-nidhiṁ vraja-rāja-sutam\"],\"translation\":[\"His charming figure is smeared generously with sandalwood paste,\\\\\",\"and adorned with the Kaustubha jewel. His figure has eclispsed the sun.\\\\\",\"His form is the crest-jewel of the youths of Vraja.\\\\\",\"Serve the treasure Śrī Kṛṣṇa, the son of the King of Vraja.\"],\"isLong\":false},{\"number\":\"7\",\"text\":[\"sura-vṛnda-suvandya-mukunda-hariṁ\",\"sura-nātha-śiromaṇi-sarva-gurum\",\"giridhāri-murāri-purāri-paraṁ\",\"bhaja kṛṣṇa-nidhiṁ vraja-rāja-sutam\"],\"translation\":[\"He is most worshipable to the suras (saintly).\\\\\",\"He is the giver of liberation, and the taker (of the heart).\\\\\",\"He is the crest-jewel of suras and masters, and the Guru of all.\\\\\",\"He is the lifter of Govardhan, the enemy of Mura, and Lord Śiva’s superior.\\\\\",\"Serve the treasure Śrī Kṛṣṇa, the son of the King of Vraja.\"],\"isLong\":false},{\"number\":\"8\",\"text\":[\"vṛṣabhānu-sutā-vara-keli-paraṁ\",\"rasa-rāja-śiromaṇi-veśa-dharam\",\"jagad-īśvaram īśvaram īḍya-varaṁ\",\"bhaja kṛṣṇa-nidhiṁ vraja-rāja-sutam\"],\"translation\":[\"He is immersed in the finest play with Vṛṣabhānu’s daughter,\\\\\",\"wearing the dress of the crest-jewel amongst the kings of rasa.\\\\\",\"He is the Lord of the universe.\\\\\",\"He is the Lord, the dearmost object of worship.\\\\\",\"Serve the treasure Śrī Kṛṣṇa, the son of the King of Vraja.\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}],false]]}]}],\"$L31\",\"$L32\"]}]]}],\"$L33\"]}],\"$L34\",\"$L35\",\"$L36\"]}]]}]\n"])</script><script>self.__next_f.push([1,"37:I[4423,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-6983d9bb63d11ce1.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-7cbf026c7bb6203b.js\"],\"default\"]\n38:I[9181,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-6983d9bb63d11ce1.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-7cbf026c7bb6203b.js\"],\"default\"]\n39:I[9508,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-6983d9bb63d11ce1.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-7cbf026c7bb6203b.js\"],\"GoogleAnalytics\"]\n3a:I[8550,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-6983d9bb63d11ce1.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-7cbf026c7bb6203b.js\"],\"ServiceWorkerRegistration\"]\n3b:I[3680,[\"5842\",\"static/chunks/5842-7e56d350933c83c0.js\",\"7984\",\"static/chunks/7984-5c75571e23a8f6ce.js\",\"1552\",\"static/chunks/1552-6983d9bb63d11ce1.js\",\"4989\",\"static/chunks/app/%5BbookId%5D/%5Bslug%5D/page-7cbf026c7bb6203b.js\"],\"default\"]\n31:[\"$\",\"$L37\",null,{\"navMap\":{\"265\":{\"prev\":{\"path\":\"/en-2026/shrita-kamala-kuchha-mandala-dhrita/\",\"title\":\"Śrita-kamalā\"},\"next\":{\"path\":\"/en-2026/mayura-mukuta-pitambara-dhari/\",\"title\":\"Mayūra-mukuṭa\"}}}}]\n32:[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":
