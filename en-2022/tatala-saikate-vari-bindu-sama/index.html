half-alive condition, I spent my life in utter disgrace. Uncountable days passed as a frivolous child and a useless old man. I have been intoxicated by the pleasure of sharing romantic adventures with beautiful young women. When will I ever get a chance to worship You?\"],\"isLong\":false},{\"number\":\"4\",\"text\":[\"koto chaturānana    mari mari jāota\",\"    na tuyā ādi avasānā\",\"tohe janami puna    tohe samāota\",\"    sāgara laharī samānā\"],\"translation\":[\"Innumerable Brahmās have died one after another, whereas You are without beginning or end. All of them take birth from You and are again absorbed in You, just like the waves in the ocean.\"],\"isLong\":false},{\"number\":\"5\",\"text\":[\"bhaṇaye vidyāpati    śeṣa śamana bhaya\",\"    tuyā viṇu gati nāhi ārā\",\"ādi anādika    nātha kahāosi\",\"    bhava tāraṇa-bhāra tohārā\"],\"translation\":[\"Vidyāpati confesses that now, at the end of his life, he is fearful of death. O Lord! There is no shelter other than You. You will always remain celebrated as being the Lord of both that which has beginning and the beginningless. Now the responsibility for my deliverance from the material world is entirely Yours.\"],\"isLong\":false}],\"hasWbw\":false,\"hasVersesText\":true,\"hasVersesTranslations\":true,\"hasLongVerses\":false,\"fullInlineWbw\":false}}]\n"])</script><script>self.__next_f.push([1,"3c:[\"$\",\"$L43\",null,{\"navMap\":{\"193\":{\"prev\":{\"path\":\"/en-2022/sarvasva-tomara-charane-sanpiya/\",\"title\":\"Sarvasva tomāra\"},\"next\":{\"path\":\"/en-2022/hari-he-dayala-mora-jaya-radha-natha/\",\"title\":\"Dainya O Prapatti\"}}}}]\n3d:[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"CollectionPage\\\",\\\"@id\\\":\\\"https://dev.kirtan.site/en-2022/tatala-saikate-vari-bindu-sama\\\",\\\"url\\\":\\\"https://dev.kirtan.site/en-2022/tatala-saikate-vari-bindu-sama\\\",\\\"name
